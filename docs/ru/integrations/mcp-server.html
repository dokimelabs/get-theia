        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vdah9jcm\"&gt;theia serve&lt;/code&gt; — &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;-сервер Theia. Claude Code, Codex и другие MCP-клиенты запускают его, чтобы читать индекс кода и память проекта. В Claude Code через него Claude ещё и планирует и запускает прогоны. На этой странице — все инструменты сервера и способы его подключить.&lt;/p&gt;\n&lt;h2 id=\"how-it-starts\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#how-it-starts\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как клиенты запускают сервер&lt;/span&gt;&lt;/a&gt;Как клиенты запускают сервер&lt;/h2&gt;\n&lt;p&gt;Сервер общается по MCP через стандартный ввод и вывод. MCP-клиент запускает его как дочерний процесс. В обычной работе запускать сервер самому не нужно.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Claude Code.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x3r3au37\"&gt;theia hooks install claude&lt;/code&gt; записывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0u2u0799\"&gt;.mcp.json&lt;/code&gt;. После вашего одобрения Claude Code запускает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nuo575mx\"&gt;theia serve --home &amp;lt;папка проекта&amp;gt;&lt;/code&gt; со всеми 22 инструментами. См. &lt;a href=\"ru/integrations/claude-code.html#first-start\"&gt;Claude Code&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Codex.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f3ygo8qi\"&gt;theia hooks install codex&lt;/code&gt; записывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6nd72onm\"&gt;.codex/config.toml&lt;/code&gt;. Codex запускает сервер с 5 инструментами и только в доверенном проекте. См. &lt;a href=\"ru/integrations/codex.html#trust-gates\"&gt;Codex&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пока сервер работает, он:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;каждые 300 секунд проверяет, актуален ли индекс кода (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9cp35xdx\"&gt;maintenance.serveRefreshSeconds&lt;/code&gt;); проверка не вызывает модели;&lt;/li&gt;\n&lt;li&gt;при &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kx66xe0p\"&gt;maintenance.indexPolicy: auto&lt;/code&gt; пересобирает устаревшие записи &lt;a href=\"ru/glossary.html#intent-index\"&gt;индекса кода&lt;/a&gt; в пределах бюджета — это вызовы моделей;&lt;/li&gt;\n&lt;li&gt;пишет свои сообщения в stderr, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tmei711u\"&gt;theia serve: MCP server on stdio (root ~/projects/app)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Сервер предлагает только инструменты. На запросы ресурсов и промптов он отвечает ошибкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v1kowtfe\"&gt;Method not found&lt;/code&gt;. Себя он называет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4mubwxmm\"&gt;theia&lt;/code&gt; версии &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s13na0tf\"&gt;0.1.0&lt;/code&gt;; это число не версия Theia.&lt;/p&gt;\n&lt;h2 id=\"tools\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#tools\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инструменты&lt;/span&gt;&lt;/a&gt;Инструменты&lt;/h2&gt;\n&lt;p&gt;Необязательные параметры отмечены знаком &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uzyzw7sd\"&gt;?&lt;/code&gt;. Ошибки инструментов приходят коротким текстом, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zsc8zdlz\"&gt;unknown run 'bogus' — run_list shows known runs&lt;/code&gt;; в ответе MCP такой результат помечен &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jiiump9s\"&gt;isError: true&lt;/code&gt;. Неверный параметр приходит иначе — как ошибка протокола &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5lf5orqb\"&gt;MCP error -32602: Input validation error: …&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"tools-code-map\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#tools-code-map\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индекс кода&lt;/span&gt;&lt;/a&gt;Индекс кода&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Инструмент&lt;/th&gt;\n&lt;th&gt;Параметры&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r2gsagil\"&gt;codebase_blueprint&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Возвращает всю &lt;a href=\"ru/glossary.html#blueprint\"&gt;схему проекта&lt;/a&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ess6htmn\"&gt;blueprint&lt;/code&gt;): по строке на каждый файл из индекса, сначала самые важные.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ftcxf1ua\"&gt;codebase_search&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a5bwoelu\"&gt;query&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7f4l2pj4\"&gt;k?&lt;/code&gt; от 1 до 50, по умолчанию 8&lt;/td&gt;\n&lt;td&gt;Ищет по индексу кода. В каждом результате — путь к файлу, его роль, связанные файлы, API и заметки о устройстве. Если индекс устарел, в ответе есть блок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0dy5ci1q\"&gt;staleness&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8rxs80pv\"&gt;codebase_symbol&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k4fmnzlk\"&gt;name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ищет точное имя функции или класса: определения с номерами строк, кто вызывает, что вызывает, где импортируется.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"tools-memory\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#tools-memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Память&lt;/span&gt;&lt;/a&gt;Память&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Инструмент&lt;/th&gt;\n&lt;th&gt;Параметры&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3lxuo3j6\"&gt;memory_search&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zchdwrsn\"&gt;query&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8yqpc0d0\"&gt;k?&lt;/code&gt; от 1 до 50, по умолчанию 8; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o5321wne\"&gt;asOf?&lt;/code&gt; — номер события или факта&lt;/td&gt;\n&lt;td&gt;Ищет по &lt;a href=\"ru/glossary.html#memory\"&gt;памяти&lt;/a&gt; проекта: факты и сохранённые куски текста. С &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6vcb54x\"&gt;asOf&lt;/code&gt; показывает, что было известно на тот момент.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmhagi6a\"&gt;memory_add&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h3hsxbyi\"&gt;kind&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dl7uf26p\"&gt;decision&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kzv7s5ov\"&gt;constraint&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5v0rmlsq\"&gt;commitment&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6bn3gnny\"&gt;observation&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3dd3eyca\"&gt;entity&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qkxw3cr6\"&gt;preference&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6vyv6l2x\"&gt;text&lt;/code&gt; до 4000 символов; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-51quzzdh\"&gt;entities?&lt;/code&gt; до 20 имён&lt;/td&gt;\n&lt;td&gt;Сохраняет один &lt;a href=\"ru/glossary.html#fact\"&gt;факт&lt;/a&gt;. Если почти такой же факт уже есть, он заменяется, а в ответе есть &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4gfzja3z\"&gt;supersededId&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pi7ia10o\"&gt;memory_tree&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gzhgzmlc\"&gt;family&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6azz6qvq\"&gt;session&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3i8ckrns\"&gt;entity&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i152eovq\"&gt;treeKey&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jvsjwu3h\"&gt;asOf?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Показывает одну хронологию памяти: группы с краткими итогами и записи в них.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В проверке близкий пересказ существующего факта сохранился вторым фактом, а не заменил первый. Не рассчитывайте на автоматическую замену, если формулировка отличается.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"tools-audit\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#tools-audit\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аудит и диагностика&lt;/span&gt;&lt;/a&gt;Аудит и диагностика&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Инструмент&lt;/th&gt;\n&lt;th&gt;Параметры&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f2cj8ukf\"&gt;run_audit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7h7tvyw9\"&gt;scope?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Проверяет &lt;a href=\"ru/glossary.html#audit-chain\"&gt;цепочки аудита&lt;/a&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-svgv4vvq\"&gt;broken: null&lt;/code&gt; значит, что цепочка цела. Без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gbj8bpdv\"&gt;scope&lt;/code&gt; проверяет все цепочки.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ud92bngn\"&gt;run_diagnose&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pemk5jkz\"&gt;runId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ищет причину сбоя прогона в его &lt;a href=\"ru/glossary.html#event-log\"&gt;журнале событий&lt;/a&gt;. Только читает журнал.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n135g8ur\"&gt;run_check&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1wzf21bz\"&gt;index?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Инструмент для собственных агентов Theia. Вне прогонов отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vb73y0c0\"&gt;run_check is not configured for this invocation (no check commands)&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"tools-run-control\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#tools-run-control\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Управление прогонами&lt;/span&gt;&lt;/a&gt;Управление прогонами&lt;/h3&gt;\n&lt;p&gt;Эти инструменты есть только в полном сервере (по умолчанию — в Claude Code). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j7l76pw7\"&gt;runId&lt;/code&gt; — полный &lt;a href=\"ru/glossary.html#run-id\"&gt;идентификатор прогона&lt;/a&gt;, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rgascbd0\"&gt;run2akdqkvcug222iaxzvmt6b&lt;/code&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Инструмент&lt;/th&gt;\n&lt;th&gt;Параметры&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kgxcr8wx\"&gt;run_list&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lbisgno4\"&gt;n?&lt;/code&gt; от 1 до 50, по умолчанию 10&lt;/td&gt;\n&lt;td&gt;Последние прогоны: идентификатор, состояние (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1e3c8fvo\"&gt;live&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1lwryrpk\"&gt;paused&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ctjm4ftp\"&gt;finished&lt;/code&gt;), число задач, стоимость, ожидающие вопросы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s79tdehh\"&gt;run_status&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-paobdvg9\"&gt;runId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Один прогон: задачи и их фазы, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5cehpoen\"&gt;closedBy&lt;/code&gt; для закрытых задач, ожидающие вопросы, последние предупреждения, стоимость и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mqw61gq6\"&gt;lastEventId&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wavt3hi5\"&gt;run_events&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fe42ztzg\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gf62boph\"&gt;afterId?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Важные события прогона, от старых к новым.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rs9qp1xh\"&gt;run_wait&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hl97092f\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vgvatta1\"&gt;afterId?&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4vmwfkoj\"&gt;timeoutSec?&lt;/code&gt; от 1 до 55, по умолчанию 45&lt;/td&gt;\n&lt;td&gt;Ждёт новых событий. Первый вызов без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vru97fen\"&gt;afterId&lt;/code&gt; сразу возвращает последние 30 событий. Передавайте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a4dwc4xz\"&gt;lastEventId&lt;/code&gt; из каждого ответа как следующий &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m3qx0h47\"&gt;afterId&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ryerbip0\"&gt;run_msg&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v2jqx3xg\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xm55w4sn\"&gt;text&lt;/code&gt; до 8000 символов; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-za9hqjwu\"&gt;taskId?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Отправляет прогону &lt;a href=\"ru/glossary.html#steering\"&gt;указание&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-55qhc08v\"&gt;run_answer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8q59kl1o\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kf6bjanu\"&gt;questionId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tzao4t1h\"&gt;answers&lt;/code&gt; — текст вопроса и ваш ответ&lt;/td&gt;\n&lt;td&gt;Отвечает на &lt;a href=\"ru/glossary.html#clarify\"&gt;уточняющий вопрос&lt;/a&gt; прогона. Пустой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x64ghks7\"&gt;answers&lt;/code&gt; — отказ отвечать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u4z695b4\"&gt;run_stop&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eo509guw\"&gt;runId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Просит прогон встать на паузу после текущего шага.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-scyx2oa8\"&gt;run_start&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p1yz1wgx\"&gt;task?&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lkms04dz\"&gt;planId?&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dpcjlku6\"&gt;budgetUsd?&lt;/code&gt; больше 0, до 100&lt;/td&gt;\n&lt;td&gt;Запускает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bla5vx0p\"&gt;theia run --non-interactive --plain --interaction bus&lt;/code&gt; отдельным процессом. Возвращает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fvqwsjaj\"&gt;runId&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-41qkvmlu\"&gt;log&lt;/code&gt; — путь к &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zaulr7jv\"&gt;.theia/control/run-&amp;lt;число&amp;gt;.log&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7l6xwbq5\"&gt;run_probe&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v2j2008b\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ga4yam3s\"&gt;question&lt;/code&gt; до 2000 символов&lt;/td&gt;\n&lt;td&gt;Задаёт &lt;a href=\"ru/glossary.html#probe\"&gt;вопрос о прогоне&lt;/a&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6sgbukro\"&gt;probe&lt;/code&gt;) без изменений в нём, через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eqc2u92l\"&gt;theia probe&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"tools-plans\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#tools-plans\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Планы&lt;/span&gt;&lt;/a&gt;Планы&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Инструмент&lt;/th&gt;\n&lt;th&gt;Параметры&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5kpttac\"&gt;plan_list&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Сохранённые планы: идентификатор, статус, число задач, цель.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-po5nz1l6\"&gt;plan_show&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v4jql2ra\"&gt;planId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Один &lt;a href=\"ru/glossary.html#plan\"&gt;план&lt;/a&gt; полностью, со статусом.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ylo0y84o\"&gt;plan_create&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q4riuuci\"&gt;task&lt;/code&gt; до 64000 символов&lt;/td&gt;\n&lt;td&gt;Запускает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zoi7qkpt\"&gt;theia plan&lt;/code&gt; и возвращает номер и текст плана. План ещё не одобрен. Вывод попадает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-omu8i3p5\"&gt;.theia/control/plan-&amp;lt;число&amp;gt;.log&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fu0u1n7e\"&gt;plan_approve&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fsbno7m5\"&gt;planId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Одобряет план. Инструмент не спрашивает пользователя; скилл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p9rjdase\"&gt;/theia&lt;/code&gt; велит Claude спросить заранее.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Не проверено для этого руководства&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В тестовой среде была заглушка вместо модели, которая не умеет строить планы и задавать вопросы. Поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-45eo60h4\"&gt;plan_create&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-65m68w1b\"&gt;plan_show&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4qhh0sgs\"&gt;plan_approve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x0z8xude\"&gt;run_start&lt;/code&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i9uqntvr\"&gt;planId&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ok5c4t9\"&gt;run_answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vwxo9gcb\"&gt;run_probe&lt;/code&gt; и успешный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tf613wct\"&gt;run_diagnose&lt;/code&gt; в работе не проверены. Их описание выше сделано по исходному коду.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"model-calls\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#model-calls\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Какие инструменты вызывают модели или скачивают данные&lt;/span&gt;&lt;/a&gt;Какие инструменты вызывают модели или скачивают данные&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Инструмент&lt;/th&gt;\n&lt;th&gt;Во что может обойтись&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m190njep\"&gt;run_start&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Целый прогон: много вызовов моделей в пределах &lt;a href=\"ru/glossary.html#budget\"&gt;бюджета&lt;/a&gt; прогона.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qjeex9zh\"&gt;plan_create&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Вызовы моделей для планирования.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ph7jfe5t\"&gt;run_probe&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Один вызов модели.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-upilbw0m\"&gt;codebase_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x30o1rec\"&gt;memory_search&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eglafjlm\"&gt;gateway.embeddings.provider: openai&lt;/code&gt; каждый запрос уходит в платный API &lt;a href=\"ru/glossary.html#embeddings\"&gt;эмбеддингов&lt;/a&gt; OpenAI. С локальной моделью первый поиск может её скачать (около 23 МБ), если скачивание разрешено.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сам сервер&lt;/td&gt;\n&lt;td&gt;При &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nvlhxc2r\"&gt;maintenance.indexPolicy: auto&lt;/code&gt; пересборка индекса вызывает модели.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Остальные инструменты&lt;/td&gt;\n&lt;td&gt;Модели не вызывают.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"control-limits\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#control-limits\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Управление не доходит до новых прогонов&lt;/span&gt;&lt;/a&gt;Управление не доходит до новых прогонов&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xrgjbjn3\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-emqm6soa\"&gt;run_stop&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nekwo88o\"&gt;run_answer&lt;/code&gt; работают только с прогоном, который поставили на паузу и продолжили через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gvek7e5v\"&gt;theia run --resume&lt;/code&gt;. Прогон, запущенный заново, их игнорирует; сюда входит любой прогон из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iiohrpod\"&gt;run_start&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vagi7jw7\"&gt;run_msg&lt;/code&gt; всё равно отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nlqtw54q\"&gt;reaches the live run at its next dispatch boundary&lt;/code&gt;, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ihuslys\"&gt;run_stop&lt;/code&gt; — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-emgciahb\"&gt;honored at the next dispatch boundary (in-flight work lands first)&lt;/code&gt;. Вопросы такого прогона не приходят.&lt;/p&gt;\n&lt;p&gt;Причина — в коде 0.2.201: новый прогон не подключает &lt;a href=\"ru/glossary.html#control-bus\"&gt;шину управления&lt;/a&gt;, её подключает только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iaty6rgu\"&gt;theia run --resume&lt;/code&gt;. Поэтому и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wmj8glfr\"&gt;theia run … --interaction bus&lt;/code&gt; без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c2cpyfql\"&gt;--resume&lt;/code&gt; шину не слушает. Это ошибка версии, см. &lt;a href=\"ru/about/limitations.html#integrations\"&gt;Ограничения&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Проверенный порядок шагов — в разделе &lt;a href=\"ru/integrations/claude-code.html#steer-run\"&gt;Управление прогоном из Claude&lt;/a&gt;. Подробнее о паузах — &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Что ещё видно в проверках:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Прогон, убитый снаружи, остаётся &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9povy4t9\"&gt;live&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c33l1uoh\"&gt;run_list&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h3saldvr\"&gt;run_status&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jno4yb2a\"&gt;run_start&lt;/code&gt; с неверным &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-414s4q5b\"&gt;planId&lt;/code&gt; возвращает ошибку, но каждая попытка оставляет в репозитории пустую ветку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bkpfgrem\"&gt;theia/run-&amp;lt;суффикс&amp;gt;&lt;/code&gt; и запись прогона, который навсегда остаётся в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gpuuzuas\"&gt;run_list&lt;/code&gt; со значениями &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nbgtkoau\"&gt;tail: live&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nh53gjea\"&gt;outcome: in flight&lt;/code&gt; и нулём задач. Такой прогон засчитывается и в число &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ra23nkp2\"&gt;N live&lt;/code&gt; в строке статуса Claude Code.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zikc8i6t\"&gt;run_wait&lt;/code&gt; не показывает сам запрос на паузу. Он показывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8gof6sy1\"&gt;run.paused&lt;/code&gt;, когда пауза наступила.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tool-set\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#tool-set\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выбор набора инструментов&lt;/span&gt;&lt;/a&gt;Выбор набора инструментов&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Запуск&lt;/th&gt;\n&lt;th&gt;Инструменты&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-05i3imdx\"&gt;theia serve&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;22: все группы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m3yklpa5\"&gt;theia serve --no-control&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;9: индекс кода, память, аудит и диагностика&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oquhm7al\"&gt;theia serve --tools codebase_blueprint,memory_search&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;только перечисленные; инструменты прогонов и планов перечислить нельзя&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Имена, которые принимает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r4ile2ud\"&gt;--tools&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w71k463u\"&gt;codebase_blueprint&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2bpn7er7\"&gt;codebase_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zaqk32t0\"&gt;codebase_symbol&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wntsqrw4\"&gt;memory_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k7iq5qr6\"&gt;memory_add&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xkve5e4e\"&gt;memory_tree&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kxrbs6p6\"&gt;run_audit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l2xa4mww\"&gt;run_diagnose&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gd71xpad\"&gt;run_check&lt;/code&gt;. С любым другим именем сервер останавливается с сообщением &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ynb51o1c\"&gt;mcp-server: unknown tool 'bogus' in filter (known: …)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Используйте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-okhnbhxi\"&gt;--no-control&lt;/code&gt;, если клиент должен только читать индекс кода и память. Подробности о флагах — &lt;a href=\"ru/reference/serve.html#serve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nkomy1ik\"&gt;theia serve&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"register\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#register\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ручная регистрация сервера&lt;/span&gt;&lt;/a&gt;Ручная регистрация сервера&lt;/h2&gt;\n&lt;p&gt;Всегда передавайте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mtvkw82a\"&gt;--home&lt;/code&gt; с полным путём к папке, где лежит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kx6kgmab\"&gt;.theia/&lt;/code&gt;. В качестве команды подойдёт путь к версии, который пишет установщик, или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bnkj6cmi\"&gt;~/.local/bin/theia&lt;/code&gt; — он переходит на новую версию при обновлениях (см. &lt;a href=\"ru/integrations/claude-code.html#after-update\"&gt;После обновления Theia&lt;/a&gt;).&lt;/p&gt;\n&lt;h3 id=\"register-claude\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#register-claude\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Claude Code&lt;/span&gt;&lt;/a&gt;Claude Code&lt;/h3&gt;\n&lt;p&gt;Файл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yxdxluv8\"&gt;.mcp.json&lt;/code&gt; в папке проекта:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;\"mcpServers\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"theia\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;\"command\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"/Users/you/.local/bin/theia\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;\"args\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"serve\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"--home\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"/Users/you/projects/app\"&lt;/span&gt;\n      &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n  &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"578\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-578\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-578\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-578.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Чтобы дать Claude только индекс кода и память, добавьте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lf8xe7qd\"&gt;\"--no-control\"&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8q1oxaox\"&gt;args&lt;/code&gt;. Проверьте запись командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5qft2hss\"&gt;claude mcp list&lt;/code&gt;: пока вы не одобрили сервер в Claude Code, она показывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s4sf73kp\"&gt;Pending approval&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"register-codex\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#register-codex\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Codex&lt;/span&gt;&lt;/a&gt;Codex&lt;/h3&gt;\n&lt;p&gt;Один и тот же блок работает в файле проекта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mx6g8mif\"&gt;.codex/config.toml&lt;/code&gt; (только в доверенном проекте) и в ваших настройках Codex &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ogf3otx0\"&gt;~/.codex/config.toml&lt;/code&gt; (для всех папок):&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs toml\"&gt;&lt;span class=\"hljs-section\"&gt;[mcp_servers.theia]&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;command&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"/Users/you/.local/share/theia/releases/0.2.201/theia\"&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;args&lt;/span&gt; = [&lt;span class=\"hljs-string\"&gt;\"serve\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"--home\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"/Users/you/projects/app\"&lt;/span&gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"588\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-588\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-588\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-588.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;С этим блоком в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q9b5bsza\"&gt;~/.codex/config.toml&lt;/code&gt; команда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-thgvj8qd\"&gt;codex mcp list&lt;/code&gt; в другой папке показывает (сокращено):&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;Name   Command                                               Args                                  …  Status\ntheia  /Users/you/.local/share/theia/releases/0.2.201/theia  serve --home /Users/you/projects/app  …  enabled\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"592\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-592\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-592\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-592.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kvjprag7\"&gt;--tools&lt;/code&gt; Codex получает все 22 инструмента. Инструменты прогонов и планов внутри Codex для этого руководства не проверялись.&lt;/p&gt;\n&lt;h3 id=\"register-other\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#register-other\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие MCP-клиенты&lt;/span&gt;&lt;/a&gt;Другие MCP-клиенты&lt;/h3&gt;\n&lt;p&gt;Theia подойдёт любому MCP-клиенту, который запускает серверы через стандартный ввод и вывод. Команда — путь к &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-inzq7z49\"&gt;theia&lt;/code&gt;, аргументы — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-211u7deq\"&gt;serve --home &amp;lt;папка проекта&amp;gt;&lt;/code&gt;. Сервер предлагает только инструменты, без ресурсов и промптов.&lt;/p&gt;\n&lt;h2 id=\"undo\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#undo\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Отключение&lt;/span&gt;&lt;/a&gt;Отключение&lt;/h2&gt;\n&lt;p&gt;Команды для отключения нет. Сервер отключается удалением его записи у клиента.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Если запись сделал &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-esab8i9j\"&gt;theia hooks install&lt;/code&gt;, снимите всю интеграцию по шагам из раздела &lt;a href=\"ru/integrations/claude-code.html#undo\"&gt;Отключение&lt;/a&gt; на странице Claude Code или раздела &lt;a href=\"ru/integrations/codex.html#undo\"&gt;Отключение&lt;/a&gt; на странице Codex.&lt;/li&gt;\n&lt;li&gt;Если вы регистрировали сервер вручную, удалите запись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rrwxqbmy\"&gt;theia&lt;/code&gt; из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-caphik52\"&gt;mcpServers&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e6tbnx2a\"&gt;.mcp.json&lt;/code&gt; или блок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-atp54s2x\"&gt;[mcp_servers.theia]&lt;/code&gt; из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gfsrisle\"&gt;config.toml&lt;/code&gt; Codex. При следующем старте клиент сервер не запустит. Claude Code отдельно помнит ваше одобрение сервера; как его сбросить — на странице &lt;a href=\"ru/integrations/claude-code.html#undo\"&gt;Claude Code&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Сам сервер оставляет после себя только журналы процессов, которые запускали &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ckw1a0eq\"&gt;run_start&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gmktfhw8\"&gt;plan_create&lt;/code&gt;. Их можно удалить:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt; -rf .theia/control\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"625\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-625\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-625\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-625.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Факты, сохранённые через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-la1laixw\"&gt;memory_add&lt;/code&gt;, остаются в хранилище проекта. Как удалить хранилище — в разделе &lt;a href=\"ru/install/uninstall.html#project-store\"&gt;Удаление&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"errors\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#errors\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Возможные ошибки&lt;/span&gt;&lt;/a&gt;Возможные ошибки&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Сообщение&lt;/th&gt;\n&lt;th&gt;Причина&lt;/th&gt;\n&lt;th&gt;Что делать&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eblfkazd\"&gt;theia: no .theia/ found from … upward (and no user-registry workspace) — run 'theia init' in the workspace home first&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pxq4b7zp\"&gt;--home&lt;/code&gt; указывает на папку без хранилища, или сервер запущен вне проекта&lt;/td&gt;\n&lt;td&gt;Исправьте путь в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-we6qp1uv\"&gt;--home&lt;/code&gt; или выполните &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fgvj1eae\"&gt;theia init&lt;/code&gt; в проекте.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cm0gt2r2\"&gt;mcp-server: unknown tool '…' in filter (known: …)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Неверное имя в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rxpzoi5h\"&gt;--tools&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Возьмите имя из раздела &lt;a href=\"ru/integrations/mcp-server.html#tool-set\"&gt;Выбор набора инструментов&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tdijv1x4\"&gt;theia serve: --metrics needs a port 1..65535, got 'abc'&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Неверный порт&lt;/td&gt;\n&lt;td&gt;Передайте число от 1 до 65535.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rvskfp4x\"&gt;theia: query embedding failed (fatal: embeddings-local: model 'all-MiniLM-L6-v2' missing …)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Локальной модели эмбеддингов нет на диске, а скачивание выключено&lt;/td&gt;\n&lt;td&gt;Скачайте модель, как советует полное сообщение. См. &lt;a href=\"ru/guides/knowledge.html\"&gt;Индекс кода, память и вопросы&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-56cwg0ce\"&gt;theia: no vendor deliverables found (lib/vendor missing and no installed set) …&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет &lt;a href=\"ru/glossary.html#vendor\"&gt;файлов поставки&lt;/a&gt; Theia, или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e8vssvnz\"&gt;THEIA_VENDOR_DIR&lt;/code&gt; указывает на несуществующую папку&lt;/td&gt;\n&lt;td&gt;Уберите &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zsk09n1u\"&gt;THEIA_VENDOR_DIR&lt;/code&gt; или переустановите Theia.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bnvrplxh\"&gt;Error: listen EADDRINUSE: address already in use&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Порт из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vss8fanh\"&gt;--metrics&lt;/code&gt; уже занят другим процессом&lt;/td&gt;\n&lt;td&gt;Возьмите другой порт. См. &lt;a href=\"ru/integrations/observability.html#metrics-endpoint\"&gt;Метрики и трассировка&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l7ybbl6z\"&gt;terryid: neither a body nor a full id: 'bogus'&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hh99er7c\"&gt;run_diagnose&lt;/code&gt; передан текст, не похожий на идентификатор прогона&lt;/td&gt;\n&lt;td&gt;Передайте полный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uth8lfob\"&gt;runId&lt;/code&gt; из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8q92gy72\"&gt;run_list&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c1a82xpx\"&gt;run_diagnose: no events for &amp;lt;id&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор по форме верный, но прогона с таким журналом нет&lt;/td&gt;\n&lt;td&gt;Возьмите &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4oyg0zkn\"&gt;runId&lt;/code&gt; из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rl5uo727\"&gt;run_list&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"for-developers\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#for-developers\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Для разработчиков платформы&lt;/span&gt;&lt;/a&gt;Для разработчиков платформы&lt;/h2&gt;\n&lt;p&gt;Собственные агенты Theia внутри прогонов запускают этот же сервер с коротким списком инструментов (значение политики &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b0w7op6e\"&gt;run.mcpBelt.tools&lt;/code&gt;) и дополнительными флагами. Вам эти флаги не нужны; они перечислены на странице &lt;a href=\"ru/reference/serve.html#for-developers\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d36jwpa4\"&gt;theia serve&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;См. также&lt;/span&gt;&lt;/a&gt;См. также&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/reference/serve.html#serve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p3knwlns\"&gt;theia serve&lt;/code&gt;&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/integrations/observability.html\"&gt;Метрики и трассировка&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/integrations/mcp-serv
