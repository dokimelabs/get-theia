        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t6r7eqb0\"&gt;theia serve&lt;/code&gt; — &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;-сервер Theia. Claude Code, Codex и другие MCP-клиенты запускают его, чтобы читать индекс кода и память проекта. В Claude Code через него Claude ещё и планирует и запускает прогоны. На этой странице — все инструменты сервера и способы его подключить.&lt;/p&gt;\n&lt;h2 id=\"how-it-starts\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#how-it-starts\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как клиенты запускают сервер&lt;/span&gt;&lt;/a&gt;Как клиенты запускают сервер&lt;/h2&gt;\n&lt;p&gt;Сервер общается по MCP через стандартный ввод и вывод. MCP-клиент запускает его как дочерний процесс. В обычной работе запускать сервер самому не нужно.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Claude Code.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wlu2mjqy\"&gt;theia hooks install claude&lt;/code&gt; записывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dfog3n0p\"&gt;.mcp.json&lt;/code&gt;. После вашего одобрения Claude Code запускает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kilc1yi2\"&gt;theia serve --home &amp;lt;папка проекта&amp;gt;&lt;/code&gt; со всеми 22 инструментами. См. &lt;a href=\"ru/integrations/claude-code.html#first-start\"&gt;Claude Code&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Codex.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z208jxy0\"&gt;theia hooks install codex&lt;/code&gt; записывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tvofapak\"&gt;.codex/config.toml&lt;/code&gt;. Codex запускает сервер с 5 инструментами и только в доверенном проекте. См. &lt;a href=\"ru/integrations/codex.html#trust-gates\"&gt;Codex&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пока сервер работает, он:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;каждые 300 секунд проверяет, актуален ли индекс кода (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7a4hdn8h\"&gt;maintenance.serveRefreshSeconds&lt;/code&gt;); проверка не вызывает модели;&lt;/li&gt;\n&lt;li&gt;при &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5qsloed\"&gt;maintenance.indexPolicy: auto&lt;/code&gt; пересобирает устаревшие записи &lt;a href=\"ru/glossary.html#intent-index\"&gt;индекса кода&lt;/a&gt; в пределах бюджета — это вызовы моделей;&lt;/li&gt;\n&lt;li&gt;пишет свои сообщения в stderr, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2g52q9ev\"&gt;theia serve: MCP server on stdio (root ~/projects/app)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Сервер предлагает только инструменты. На запросы ресурсов и промптов он отвечает ошибкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jzjw5bd6\"&gt;Method not found&lt;/code&gt;. Себя он называет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2yh1qrim\"&gt;theia&lt;/code&gt; версии &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nstrabua\"&gt;0.1.0&lt;/code&gt;; это число не версия Theia.&lt;/p&gt;\n&lt;h2 id=\"tools\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#tools\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Инструменты&lt;/span&gt;&lt;/a&gt;Инструменты&lt;/h2&gt;\n&lt;p&gt;Необязательные параметры отмечены знаком &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p23s1k99\"&gt;?&lt;/code&gt;. Ошибки инструментов приходят коротким текстом, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gs4eqwyg\"&gt;unknown run 'bogus' — run_list shows known runs&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"tools-code-map\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#tools-code-map\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индекс кода&lt;/span&gt;&lt;/a&gt;Индекс кода&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Инструмент&lt;/th&gt;\n&lt;th&gt;Параметры&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yltg35ng\"&gt;codebase_blueprint&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Возвращает всю &lt;a href=\"ru/glossary.html#blueprint\"&gt;схему проекта&lt;/a&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8sno0m0x\"&gt;blueprint&lt;/code&gt;): по строке на каждый файл из индекса, сначала самые важные.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jhaqk4sb\"&gt;codebase_search&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fpztavxm\"&gt;query&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xclwrq98\"&gt;k?&lt;/code&gt; от 1 до 50, по умолчанию 8&lt;/td&gt;\n&lt;td&gt;Ищет по индексу кода. В каждом результате — путь к файлу, его роль, связанные файлы, API и заметки о устройстве. Если индекс устарел, в ответе есть блок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zlrypjda\"&gt;staleness&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3uvr0ll3\"&gt;codebase_symbol&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zoi0eufx\"&gt;name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ищет точное имя функции или класса: определения с номерами строк, кто вызывает, что вызывает, где импортируется.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"tools-memory\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#tools-memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Память&lt;/span&gt;&lt;/a&gt;Память&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Инструмент&lt;/th&gt;\n&lt;th&gt;Параметры&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j1tsyxon\"&gt;memory_search&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-24kumokr\"&gt;query&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7q4maox7\"&gt;k?&lt;/code&gt; от 1 до 50, по умолчанию 8; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4z63x23i\"&gt;asOf?&lt;/code&gt; — номер события или факта&lt;/td&gt;\n&lt;td&gt;Ищет по &lt;a href=\"ru/glossary.html#memory\"&gt;памяти&lt;/a&gt; проекта: факты и сохранённые куски текста. С &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c8nlyyok\"&gt;asOf&lt;/code&gt; показывает, что было известно на тот момент.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y9h1b4dg\"&gt;memory_add&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g2esuiw0\"&gt;kind&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gxj5kcky\"&gt;decision&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4qo8pmza\"&gt;constraint&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oe3c4gvu\"&gt;commitment&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ifferi3l\"&gt;observation&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f7uq9jdd\"&gt;entity&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yayfskld\"&gt;preference&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hfs481f5\"&gt;text&lt;/code&gt; до 4000 символов; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g748r9q4\"&gt;entities?&lt;/code&gt; до 20 имён&lt;/td&gt;\n&lt;td&gt;Сохраняет один &lt;a href=\"ru/glossary.html#fact\"&gt;факт&lt;/a&gt;. Если почти такой же факт уже есть, он заменяется, а в ответе есть &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hpy9003p\"&gt;supersededId&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2a9jgzi1\"&gt;memory_tree&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8g8errc6\"&gt;family&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2vw0whrv\"&gt;session&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v8935716\"&gt;entity&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8v3mfhqp\"&gt;treeKey&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wnus6rrf\"&gt;asOf?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Показывает одну хронологию памяти: группы с краткими итогами и записи в них.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В проверке близкий пересказ существующего факта сохранился вторым фактом, а не заменил первый. Не рассчитывайте на автоматическую замену, если формулировка отличается.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"tools-audit\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#tools-audit\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Аудит и диагностика&lt;/span&gt;&lt;/a&gt;Аудит и диагностика&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Инструмент&lt;/th&gt;\n&lt;th&gt;Параметры&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yids93yf\"&gt;run_audit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nx0vbrat\"&gt;scope?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Проверяет &lt;a href=\"ru/glossary.html#audit-chain\"&gt;цепочки аудита&lt;/a&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y7ls08dz\"&gt;broken: null&lt;/code&gt; значит, что цепочка цела. Без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j412oq2e\"&gt;scope&lt;/code&gt; проверяет все цепочки.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qvds7ke7\"&gt;run_diagnose&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0j692mju\"&gt;runId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ищет причину сбоя прогона в его &lt;a href=\"ru/glossary.html#event-log\"&gt;журнале событий&lt;/a&gt;. Только читает журнал.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0l1z7wqp\"&gt;run_check&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b2jjcwrc\"&gt;index?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Инструмент для собственных агентов Theia. Вне прогонов отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iplhdlhj\"&gt;run_check is not configured for this invocation (no check commands)&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"tools-run-control\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#tools-run-control\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Управление прогонами&lt;/span&gt;&lt;/a&gt;Управление прогонами&lt;/h3&gt;\n&lt;p&gt;Эти инструменты есть только в полном сервере (по умолчанию — в Claude Code). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xrhdco4i\"&gt;runId&lt;/code&gt; — полный &lt;a href=\"ru/glossary.html#run-id\"&gt;идентификатор прогона&lt;/a&gt;, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1vjr153f\"&gt;run2akdqkvcug222iaxzvmt6b&lt;/code&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Инструмент&lt;/th&gt;\n&lt;th&gt;Параметры&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xvdirda\"&gt;run_list&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fz4q69kf\"&gt;n?&lt;/code&gt; от 1 до 50, по умолчанию 10&lt;/td&gt;\n&lt;td&gt;Последние прогоны: идентификатор, состояние (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qtmzgbnl\"&gt;live&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ijojfg9m\"&gt;paused&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vnfsishe\"&gt;finished&lt;/code&gt;), число задач, стоимость, ожидающие вопросы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2cwv0b9v\"&gt;run_status&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rgzqof5s\"&gt;runId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Один прогон: задачи и их фазы, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pxampi4n\"&gt;closedBy&lt;/code&gt; для закрытых задач, ожидающие вопросы, последние предупреждения, стоимость и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ste44nd3\"&gt;lastEventId&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t3gdn1rl\"&gt;run_events&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ms8fvv15\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-250vo061\"&gt;afterId?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Важные события прогона, от старых к новым.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kik2f1jw\"&gt;run_wait&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c8fzkfa3\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l10ufeja\"&gt;afterId?&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7qe7xfta\"&gt;timeoutSec?&lt;/code&gt; от 1 до 55, по умолчанию 45&lt;/td&gt;\n&lt;td&gt;Ждёт новых событий. Первый вызов без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p5gsrd3l\"&gt;afterId&lt;/code&gt; сразу возвращает последние 30 событий. Передавайте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jzx6xs2p\"&gt;lastEventId&lt;/code&gt; из каждого ответа как следующий &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ulbytt7j\"&gt;afterId&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wsnzrgbs\"&gt;run_msg&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2axxv5p3\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-guuwdfwq\"&gt;text&lt;/code&gt; до 8000 символов; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0pa4tylb\"&gt;taskId?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Отправляет прогону &lt;a href=\"ru/glossary.html#steering\"&gt;указание&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ll1klyfu\"&gt;run_answer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-934i52hf\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wmxuhd9u\"&gt;questionId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yskmsoge\"&gt;answers&lt;/code&gt; — текст вопроса и ваш ответ&lt;/td&gt;\n&lt;td&gt;Отвечает на &lt;a href=\"ru/glossary.html#clarify\"&gt;уточняющий вопрос&lt;/a&gt; прогона. Пустой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9o00ycow\"&gt;answers&lt;/code&gt; — отказ отвечать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tti1g4va\"&gt;run_stop&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fqqo7y1c\"&gt;runId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Просит прогон встать на паузу после текущего шага.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d2dvr8h5\"&gt;run_start&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h3i2jz7p\"&gt;task?&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-royjnrvn\"&gt;planId?&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vser39rc\"&gt;budgetUsd?&lt;/code&gt; больше 0, до 100&lt;/td&gt;\n&lt;td&gt;Запускает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bz9nac3l\"&gt;theia run --non-interactive --plain --interaction bus&lt;/code&gt; отдельным процессом. Возвращает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xenj0uqv\"&gt;runId&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-42mdul2q\"&gt;log&lt;/code&gt; — путь к &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-64b0ljuj\"&gt;.theia/control/run-&amp;lt;число&amp;gt;.log&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-49o1ni80\"&gt;run_probe&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1iry4848\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qdvmlna2\"&gt;question&lt;/code&gt; до 2000 символов&lt;/td&gt;\n&lt;td&gt;Задаёт &lt;a href=\"ru/glossary.html#probe\"&gt;вопрос о прогоне&lt;/a&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9zjp5i4m\"&gt;probe&lt;/code&gt;) без изменений в нём, через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nn13ub8p\"&gt;theia probe&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"tools-plans\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#tools-plans\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Планы&lt;/span&gt;&lt;/a&gt;Планы&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Инструмент&lt;/th&gt;\n&lt;th&gt;Параметры&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yb920uf2\"&gt;plan_list&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Сохранённые планы: идентификатор, статус, число задач, цель.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wt4omshw\"&gt;plan_show&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-274220o1\"&gt;planId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Один &lt;a href=\"ru/glossary.html#plan\"&gt;план&lt;/a&gt; полностью, со статусом.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i2iukhbu\"&gt;plan_create&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oyaj3wtm\"&gt;task&lt;/code&gt; до 64000 символов&lt;/td&gt;\n&lt;td&gt;Запускает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v4axyqae\"&gt;theia plan&lt;/code&gt; и возвращает номер и текст плана. План ещё не одобрен. Вывод попадает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p9sa8fj6\"&gt;.theia/control/plan-&amp;lt;число&amp;gt;.log&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p8mr59np\"&gt;plan_approve&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d20haxqv\"&gt;planId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Одобряет план. Инструмент не спрашивает пользователя; скилл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mcxwal0p\"&gt;/theia&lt;/code&gt; велит Claude спросить заранее.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Не проверено для этого руководства&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В тестовой среде была заглушка вместо модели, которая не умеет строить планы и задавать вопросы. Поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-im5x95xj\"&gt;plan_create&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lwvdtelf\"&gt;plan_show&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jyzmhbru\"&gt;plan_approve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bbr2h5uo\"&gt;run_start&lt;/code&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w2ajiath\"&gt;planId&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e6umhk4i\"&gt;run_answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3x9wsyti\"&gt;run_probe&lt;/code&gt; и успешный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pnvim7nd\"&gt;run_diagnose&lt;/code&gt; в работе не проверены. Их описание выше сделано по исходному коду.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"model-calls\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#model-calls\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Какие инструменты вызывают модели или скачивают данные&lt;/span&gt;&lt;/a&gt;Какие инструменты вызывают модели или скачивают данные&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Инструмент&lt;/th&gt;\n&lt;th&gt;Во что может обойтись&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-alncnany\"&gt;run_start&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Целый прогон: много вызовов моделей в пределах &lt;a href=\"ru/glossary.html#budget\"&gt;бюджета&lt;/a&gt; прогона.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i9rarf14\"&gt;plan_create&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Вызовы моделей для планирования.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ztg3gn3j\"&gt;run_probe&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Один вызов модели.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j3fcmhuw\"&gt;codebase_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-110ezzat\"&gt;memory_search&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;При &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ufd6zx2l\"&gt;gateway.embeddings.provider: openai&lt;/code&gt; каждый запрос уходит в платный API &lt;a href=\"ru/glossary.html#embeddings\"&gt;эмбеддингов&lt;/a&gt; OpenAI. С локальной моделью первый поиск может её скачать (около 23 МБ), если скачивание разрешено.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Сам сервер&lt;/td&gt;\n&lt;td&gt;При &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fkbmdmq6\"&gt;maintenance.indexPolicy: auto&lt;/code&gt; пересборка индекса вызывает модели.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Остальные инструменты&lt;/td&gt;\n&lt;td&gt;Модели не вызывают.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"control-limits\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#control-limits\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Управление не доходит до новых прогонов&lt;/span&gt;&lt;/a&gt;Управление не доходит до новых прогонов&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wbkbohpl\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qez8idun\"&gt;run_stop&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-euc4p5qk\"&gt;run_answer&lt;/code&gt; работают только с прогоном, который поставили на паузу и продолжили через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jvqdvqgn\"&gt;theia run --resume&lt;/code&gt;. Прогон, запущенный заново, их игнорирует; сюда входит любой прогон из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z2v06liw\"&gt;run_start&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqbye9hc\"&gt;run_msg&lt;/code&gt; всё равно отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sxenir5j\"&gt;reaches the live run at its next dispatch boundary&lt;/code&gt;, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s1fgsnhd\"&gt;run_stop&lt;/code&gt; — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ol71fyyj\"&gt;honored at the next dispatch boundary (in-flight work lands first)&lt;/code&gt;. Вопросы такого прогона не приходят.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Проверенный порядок шагов — в разделе &lt;a href=\"ru/integrations/claude-code.html#steer-run\"&gt;Управление прогоном из Claude&lt;/a&gt;. Подробнее о паузах — &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Что ещё видно в проверках:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Прогон, убитый снаружи, остаётся &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6jrv3cpn\"&gt;live&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-271mnkyw\"&gt;run_list&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x36rr1w6\"&gt;run_status&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zpzx00d4\"&gt;run_start&lt;/code&gt; с неверным &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ykuj06po\"&gt;planId&lt;/code&gt; возвращает ошибку, но каждая попытка оставляет в репозитории пустую ветку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0zhkmp6\"&gt;theia/run-&amp;lt;суффикс&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ftjyja3f\"&gt;run_wait&lt;/code&gt; не показывает сам запрос на паузу. Он показывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tvdgbyg7\"&gt;run.paused&lt;/code&gt;, когда пауза наступила.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tool-set\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#tool-set\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Выбор набора инструментов&lt;/span&gt;&lt;/a&gt;Выбор набора инструментов&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Запуск&lt;/th&gt;\n&lt;th&gt;Инструменты&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0mx4tu0t\"&gt;theia serve&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;22: все группы&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3vjbiup0\"&gt;theia serve --no-control&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;9: индекс кода, память, аудит и диагностика&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6tnxxkvj\"&gt;theia serve --tools codebase_blueprint,memory_search&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;только перечисленные; инструменты прогонов и планов перечислить нельзя&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Имена, которые принимает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f5z9xapg\"&gt;--tools&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ktp0t90r\"&gt;codebase_blueprint&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-66049vdt\"&gt;codebase_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-28ol9vki\"&gt;codebase_symbol&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2o25gf3p\"&gt;memory_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-739br8gv\"&gt;memory_add&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u3uhhd0v\"&gt;memory_tree&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-opmzvauh\"&gt;run_audit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nr5byhab\"&gt;run_diagnose&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ixefbo4a\"&gt;run_check&lt;/code&gt;. С любым другим именем сервер останавливается с сообщением &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-411bue76\"&gt;mcp-server: unknown tool 'bogus' in filter (known: …)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Используйте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4vorjvnp\"&gt;--no-control&lt;/code&gt;, если клиент должен только читать индекс кода и память. Подробности о флагах — &lt;a href=\"ru/reference/serve.html#serve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a4mfgzuy\"&gt;theia serve&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"register\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#register\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ручная регистрация сервера&lt;/span&gt;&lt;/a&gt;Ручная регистрация сервера&lt;/h2&gt;\n&lt;p&gt;Всегда передавайте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oz9eg2xk\"&gt;--home&lt;/code&gt; с полным путём к папке, где лежит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oq1b9bro\"&gt;.theia/&lt;/code&gt;. В качестве команды подойдёт путь к версии, который пишет установщик, или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jtho1l9d\"&gt;~/.local/bin/theia&lt;/code&gt; — он переходит на новую версию при обновлениях (см. &lt;a href=\"ru/integrations/claude-code.html#after-update\"&gt;После обновления Theia&lt;/a&gt;).&lt;/p&gt;\n&lt;h3 id=\"register-claude\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#register-claude\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Claude Code&lt;/span&gt;&lt;/a&gt;Claude Code&lt;/h3&gt;\n&lt;p&gt;Файл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sj6iubz2\"&gt;.mcp.json&lt;/code&gt; в папке проекта:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;\"mcpServers\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"theia\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;\"command\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"/Users/you/.local/bin/theia\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;\"args\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"serve\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"--home\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"/Users/you/projects/app\"&lt;/span&gt;\n      &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n  &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"575\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-575\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-575\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-575.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Чтобы дать Claude только индекс кода и память, добавьте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j1wkra4n\"&gt;\"--no-control\"&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4qk2zrxr\"&gt;args&lt;/code&gt;. Проверьте запись командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8osvcp0f\"&gt;claude mcp list&lt;/code&gt;: пока вы не одобрили сервер в Claude Code, она показывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4mjtp67q\"&gt;Pending approval&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"register-codex\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#register-codex\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Codex&lt;/span&gt;&lt;/a&gt;Codex&lt;/h3&gt;\n&lt;p&gt;Один и тот же блок работает в файле проекта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cr4l6bk1\"&gt;.codex/config.toml&lt;/code&gt; (только в доверенном проекте) и в ваших настройках Codex &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ars29rfj\"&gt;~/.codex/config.toml&lt;/code&gt; (для всех папок):&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs toml\"&gt;&lt;span class=\"hljs-section\"&gt;[mcp_servers.theia]&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;command&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"/Users/you/.local/share/theia/releases/0.2.201/theia\"&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;args&lt;/span&gt; = [&lt;span class=\"hljs-string\"&gt;\"serve\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"--home\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"/Users/you/projects/app\"&lt;/span&gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"585\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-585\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-585\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-585.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;С этим блоком в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1pi8xd13\"&gt;~/.codex/config.toml&lt;/code&gt; команда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qst6otyv\"&gt;codex mcp list&lt;/code&gt; в другой папке показывает (сокращено):&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;Name   Command                                               Args                                  …  Status\ntheia  /Users/you/.local/share/theia/releases/0.2.201/theia  serve --home /Users/you/projects/app  …  enabled\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"589\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-589\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-589\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-589.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-44n4m1l2\"&gt;--tools&lt;/code&gt; Codex получает все 22 инструмента. Инструменты прогонов и планов внутри Codex для этого руководства не проверялись.&lt;/p&gt;\n&lt;h3 id=\"register-other\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#register-other\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие MCP-клиенты&lt;/span&gt;&lt;/a&gt;Другие MCP-клиенты&lt;/h3&gt;\n&lt;p&gt;Theia подойдёт любому MCP-клиенту, который запускает серверы через стандартный ввод и вывод. Команда — путь к &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jlryvw4p\"&gt;theia&lt;/code&gt;, аргументы — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ohou198x\"&gt;serve --home &amp;lt;папка проекта&amp;gt;&lt;/code&gt;. Сервер предлагает только инструменты, без ресурсов и промптов.&lt;/p&gt;\n&lt;h2 id=\"errors\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#errors\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Возможные ошибки&lt;/span&gt;&lt;/a&gt;Возможные ошибки&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Сообщение&lt;/th&gt;\n&lt;th&gt;Причина&lt;/th&gt;\n&lt;th&gt;Что делать&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sgs6qon6\"&gt;theia: no .theia/ found from … upward (and no user-registry workspace) — run 'theia init' in the workspace home first&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-06ialbea\"&gt;--home&lt;/code&gt; указывает на папку без хранилища, или сервер запущен вне проекта&lt;/td&gt;\n&lt;td&gt;Исправьте путь в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vmrpembg\"&gt;--home&lt;/code&gt; или выполните &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8sxzgkoz\"&gt;theia init&lt;/code&gt; в проекте.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a893sxhk\"&gt;mcp-server: unknown tool '…' in filter (known: …)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Неверное имя в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iqad7ro5\"&gt;--tools&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Возьмите имя из раздела &lt;a href=\"ru/integrations/mcp-server.html#tool-set\"&gt;Выбор набора инструментов&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pmmzjkhm\"&gt;theia serve: --metrics needs a port 1..65535, got 'abc'&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Неверный порт&lt;/td&gt;\n&lt;td&gt;Передайте число от 1 до 65535.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0akkzbjv\"&gt;theia: query embedding failed (fatal: embeddings-local: model 'all-MiniLM-L6-v2' missing …)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Локальной модели эмбеддингов нет на диске, а скачивание выключено&lt;/td&gt;\n&lt;td&gt;Скачайте модель, как советует полное сообщение. См. &lt;a href=\"ru/guides/knowledge.html\"&gt;Индекс кода, память и вопросы&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wwut8m43\"&gt;theia: no vendor deliverables found (lib/vendor missing and no installed set) …&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Нет &lt;a href=\"ru/glossary.html#vendor\"&gt;файлов поставки&lt;/a&gt; Theia, или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u5fqv31d\"&gt;THEIA_VENDOR_DIR&lt;/code&gt; указывает на несуществующую папку&lt;/td&gt;\n&lt;td&gt;Уберите &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-omg89k5o\"&gt;THEIA_VENDOR_DIR&lt;/code&gt; или переустановите Theia.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rkcxphcy\"&gt;Error: listen EADDRINUSE: address already in use&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Порт из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zsded7jf\"&gt;--metrics&lt;/code&gt; уже занят другим процессом&lt;/td&gt;\n&lt;td&gt;Возьмите другой порт. См. &lt;a href=\"ru/integrations/observability.html#metrics-endpoint\"&gt;Метрики и трассировка&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"for-developers\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#for-developers\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Для разработчиков платформы&lt;/span&gt;&lt;/a&gt;Для разработчиков платформы&lt;/h2&gt;\n&lt;p&gt;Собственные агенты Theia внутри прогонов запускают этот же сервер с коротким списком инструментов (значение политики &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-la86y9mt\"&gt;run.mcpBelt.tools&lt;/code&gt;) и дополнительными флагами. Вам эти флаги не нужны; они перечислены на странице &lt;a href=\"ru/reference/serve.html#for-developers\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uqcfilo6\"&gt;theia serve&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"ru/integrations/mcp-server.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;См. также&lt;/span&gt;&lt;/a&gt;См. также&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/reference/serve.html#serve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-csydepie\"&gt;theia serve&lt;/code&gt;&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/integrations/observability.html\"&gt;Метрики и трассировка&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/integrations/mcp-server.html","hreflang":"en"},{"href":"ru/integrations/mcp-server.html","hreflang":"ru"}],"style":["_assets/theia.css"],"canonical":"ru/integrations/mcp-server.html","vcsPath":"ru/integrations/mcp-server.md"},"headings":[{"title":"Как клиенты запускают сервер","href":"ru/integrations/mcp-server.html#how-it-starts","level":2},{"title":"Инструменты","href":"ru/integrations/mcp-server.html#tools","level":2,"items":[{"title":"Индекс кода","href":"ru/integrations/mcp-server.html#tools-code-map","level":3},{"title":"Память","href":"ru/integrations/mcp-server.html#tools-memory","level":3},{"title":"Аудит и диагностика","href":"ru/integrations/mcp-server.html#tools-audit","level":3},{"title":"Управление прогонами","href":"ru/integrations/mcp-server.html#tools-run-control","level":3},{"title":"Планы","href":"ru/integrations/mcp-server.html#tools-plans","level":3}]},{"title":"Какие инструменты вызывают модели или скачивают данные","href":"ru/integrations/mcp-server.html#model-calls","level":2},{"title":"Управление не доходит до новых прогонов","href":"ru/integrations/mcp-server.html#control-limits","level":2},{"title":"Выбор набора инструментов","href":"ru/integrations/mcp-server.html#tool-set","level":2},{"title":"Ручная регистрация сервера","href":"ru/integrations/mcp-server.html#register","level":2,"items":[{"title":"Claude Code","href":"ru/integrations/mcp-server.html#register-claude","level":3},{"title":"Codex","href":"ru/integrations/mcp-server.html#register-codex","level":3},{"title":"Другие MCP-клиенты","href":"ru/integrations/mcp-server.html#register-other","level":3}]},{"title":"Возможные ошибки","href":"ru/integrations/mcp-server.html#errors","level":2},{"title":"Для разработчиков платформы","href":"ru/integrations/mcp-server.html#for-developers","level":2},{"title":"См. также","href":"ru/integrations/mcp-server.html#see-also","level":2}],"title":"MCP-сервер"},"router":{"pathname":"ru/integrations/mcp-server","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/ru/index.html","tags":[]}}
