        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;У Theia нет своей модели. Каждый шаг задачи она отдаёт CLI агента на вашем компьютере: Claude Code (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fdv7ram3\"&gt;claude&lt;/code&gt;) или Codex (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7cb7gh83\"&gt;codex&lt;/code&gt;). На этой странице — как выбрать CLI и модель для каждой роли. Все примеры загружаются в Theia 0.2.201.&lt;/p&gt;\n&lt;h2 id=\"how-it-works\"&gt;&lt;a href=\"ru/config/models.html#how-it-works\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как Theia выбирает модель&lt;/span&gt;&lt;/a&gt;Как Theia выбирает модель&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Каждый шаг &lt;a href=\"ru/glossary.html#run\"&gt;прогона&lt;/a&gt; принадлежит &lt;a href=\"ru/glossary.html#role\"&gt;роли&lt;/a&gt;. Например, исполнитель (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ewxs618f\"&gt;implementer&lt;/code&gt;) пишет код, а рецензент (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yz1pwz4e\"&gt;reviewer&lt;/code&gt;) его проверяет.&lt;/li&gt;\n&lt;li&gt;Маршрутизация — ключ &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w54owhqs\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-csdut9mx\"&gt;policy.yaml&lt;/code&gt; — связывает каждую роль с &lt;a href=\"ru/glossary.html#transport\"&gt;транспортом&lt;/a&gt;. Транспорт — именованный способ вызвать модель: какой CLI, какая модель по умолчанию и какой доступ.&lt;/li&gt;\n&lt;li&gt;Ключ &lt;a href=\"ru/glossary.html#gateway-models\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-niu7gv1w\"&gt;gateway.models&lt;/code&gt;&lt;/a&gt; может задать роли другую модель.&lt;/li&gt;\n&lt;li&gt;Транспорт запускает CLI с вашим входом по подписке. Про входы — в разделе &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Маршрут может вести только к транспорту из манифеста &lt;a href=\"ru/glossary.html#transport-registry\"&gt;TransportRegistry&lt;/a&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9pc3z93v\"&gt;theia init&lt;/code&gt; пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mdkatad0\"&gt;.theia/config/registry.yaml&lt;/code&gt; со всеми транспортами Claude и Codex, кроме &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yagbo24b\"&gt;codex-full&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"roles\"&gt;&lt;a href=\"ru/config/models.html#roles\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роли&lt;/span&gt;&lt;/a&gt;Роли&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Роль&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;th&gt;Когда вызывает модель&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;ведущий (&lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ku24z6wq\"&gt;lead&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;td&gt;решает, что делать с застрявшей задачей&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqhilykw\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;планировщик (&lt;a href=\"ru/glossary.html#planner\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9w4k3ms6\"&gt;planner&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;td&gt;разбивает работу на задачи&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-93xn8cky\"&gt;theia plan&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sysg8goz\"&gt;theia run&lt;/code&gt; для задач на треке &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ax42e30\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;исполнитель (&lt;a href=\"ru/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kh1s94ff\"&gt;implementer&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;td&gt;меняет код&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pmm2miut\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ezgd72k6\"&gt;fresh_implementer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;новая попытка после двух попыток &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cxxi5xez\"&gt;implementer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pnwqsz46\"&gt;theia run&lt;/code&gt;. Без своего маршрута берёт маршрут &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zok8wdqz\"&gt;implementer&lt;/code&gt;, а не &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oweswl28\"&gt;\"*\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;проверяющий (&lt;a href=\"ru/glossary.html#verifier\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kigrlxq8\"&gt;verifier&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;td&gt;проверяет результат&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-na90ecen\"&gt;theia run&lt;/code&gt;, только если у задачи нет команд &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kg2enpx6\"&gt;--verify&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;рецензент (&lt;a href=\"ru/glossary.html#reviewer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hh8z8y4y\"&gt;reviewer&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;td&gt;рецензирует изменения&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pzed5zr2\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;арбитр (&lt;a href=\"ru/glossary.html#arbiter\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-izctj6q4\"&gt;arbiter&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;td&gt;решает после неудачного шага&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7cwg7zs3\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;роль слияния (&lt;a href=\"ru/glossary.html#merger\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q2t43c0w\"&gt;merger&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;td&gt;сливает задачу в ветку прогона&lt;/td&gt;\n&lt;td&gt;никогда: сливает сама Theia через git&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;индексатор (&lt;a href=\"ru/glossary.html#indexer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cy3yotz7\"&gt;indexer&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;td&gt;пишет карточки для индекса кода&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6xpeyuoe\"&gt;theia index build&lt;/code&gt; и автоматическая сборка индекса&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jtvk9os0\"&gt;extractor&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;делает сводки памяти&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x73e5z13\"&gt;theia mem maintain --llm&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l6fcgbrg\"&gt;diagnostician&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;никогда в 0.2.201: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cwl3bog4\"&gt;theia diagnose&lt;/code&gt; работает по готовым правилам&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tuxi9y7h\"&gt;none&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;разовые вопросы&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-na627gox\"&gt;theia ask&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cikt9630\"&gt;theia probe&lt;/code&gt;. Берёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kjtm3tn5\"&gt;routing.none&lt;/code&gt;, если он задан, иначе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7is0swy5\"&gt;\"*\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p2spgljn\"&gt;\"*\"&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e7cimm33\"&gt;gateway.routing&lt;/code&gt; — маршрут для всех ролей, у которых нет своей записи.&lt;/p&gt;\n&lt;h2 id=\"transports\"&gt;&lt;a href=\"ru/config/models.html#transports\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Транспорты&lt;/span&gt;&lt;/a&gt;Транспорты&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Транспорт&lt;/th&gt;\n&lt;th&gt;CLI&lt;/th&gt;\n&lt;th&gt;Модель по умолчанию&lt;/th&gt;\n&lt;th&gt;Доступ&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pr01hyvs\"&gt;claude&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n4mdrc3j\"&gt;claude&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2sxgbxqa\"&gt;claude-opus-5&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;читает файлы и выполняет команды: инструменты &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qcmfn0vx\"&gt;Bash Read Grep Glob&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tx0klnur\"&gt;claude-write&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o1q5es7r\"&gt;claude&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r70u0jir\"&gt;claude-opus-5&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;ещё и правит файлы: режим &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s0cmvcd3\"&gt;acceptEdits&lt;/code&gt;, инструменты &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-69zlkfz2\"&gt;Bash Read Grep Glob Edit Write&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qz1v2vh0\"&gt;claude-index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0560gtie\"&gt;claude&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m9ltyfdc\"&gt;claude-sonnet-5&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;без инструментов и без размышлений; для индекса кода&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-47gyif5q\"&gt;codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zpd6r6p0\"&gt;codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nassyacu\"&gt;gpt-5.6-luna&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;песочница только для чтения&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j6ecqkjm\"&gt;codex-terra&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jvdntdj5\"&gt;codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y662yskw\"&gt;gpt-5.6-terra&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;песочница только для чтения&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xfbrundx\"&gt;codex-write&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8tfjmiu2\"&gt;codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yfhyn3xz\"&gt;gpt-5.6-luna&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;может писать в копии задачи (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2orhaea0\"&gt;workspace-write&lt;/code&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-246bqabw\"&gt;codex-full&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2smswsw5\"&gt;codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t7bbp92a\"&gt;gpt-5.6-luna&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;полный доступ к компьютеру; по умолчанию нет в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gh6memeh\"&gt;registry.yaml&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-94drlnip\"&gt;codex-jailed&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-69g7d7bc\"&gt;codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tqpjfopy\"&gt;gpt-5.6-luna&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;полный доступ внутри изолированной среды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;ul&gt;\n&lt;li&gt;Ролям, которые меняют код (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rfw9om22\"&gt;implementer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1au9acvb\"&gt;fresh_implementer&lt;/code&gt;), нужен транспорт с записью: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ktcrmk89\"&gt;claude-write&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dn9uwm8l\"&gt;codex-write&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iulf7m5o\"&gt;codex-full&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6g5vpuvl\"&gt;codex-jailed&lt;/code&gt; относятся к уровням песочницы. См. &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Других поставщиков в Theia 0.2.201 нет: ни прямых вызовов API, ни других CLI агентов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"harness\"&gt;&lt;a href=\"ru/config/models.html#harness\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Движок при init&lt;/span&gt;&lt;/a&gt;Движок при init&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qvritpko\"&gt;theia init --harness claude&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-55tv6ajl\"&gt;theia init --harness codex&lt;/code&gt; выбирает &lt;a href=\"ru/glossary.html#harness\"&gt;движок&lt;/a&gt; (harness) нового хранилища. Обе команды пишут одинаковый &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6rfkysv1\"&gt;registry.yaml&lt;/code&gt;. Отличается только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rvg8qjy4\"&gt;gateway.routing&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wlbsasql\"&gt;policy.yaml&lt;/code&gt;:&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-98esgb7j\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"claude\" data-diplodoc-key=\"claude\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" aria-controls=\"regular-4mguu4yx\" aria-selected=\"true\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;claude&lt;/div&gt;\n&lt;div data-diplodoc-id=\"codex\" data-diplodoc-key=\"codex\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" aria-controls=\"regular-jnngz7rh\" aria-selected=\"false\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;codex&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"regular-4mguu4yx\" class=\"yfm-tab-panel active\" role=\"tabpanel\" aria-labelledby=\"claude\" data-title=\"claude\"&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;theia.dev/v1alpha1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Policy&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;local&lt;/span&gt; }\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;run:&lt;/span&gt; {}\n  &lt;span class=\"hljs-attr\"&gt;gateway:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;routing:&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;\"*\":&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;claude&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;implementer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;claude-write&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;fresh_implemente
