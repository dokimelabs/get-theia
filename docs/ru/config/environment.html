        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Переменные окружения, которые меняют работу &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tt78wank\"&gt;theia&lt;/code&gt;: что они делают, что происходит без них и кто их читает. В конце — короткий список имён из тестов и скриптов выпуска, на которые можно не обращать внимания.&lt;/p&gt;\n&lt;h2 id=\"user-variables\"&gt;&lt;a href=\"ru/config/environment.html#user-variables\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Переменные для пользователя&lt;/span&gt;&lt;/a&gt;Переменные для пользователя&lt;/h2&gt;\n&lt;h3 id=\"keys-versions\"&gt;&lt;a href=\"ru/config/environment.html#keys-versions\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ключи и версии&lt;/span&gt;&lt;/a&gt;Ключи и версии&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Переменная&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;th&gt;Если не задана&lt;/th&gt;\n&lt;th&gt;Кто читает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0a5v7jgh\"&gt;THEIA_GH_TOKEN&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/glossary.html#pat\"&gt;Токен GitHub&lt;/a&gt; (PAT). Главнее, чем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u64ofkyn\"&gt;github.pat&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fzi3yhsw\"&gt;config.yaml&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;сохранённый токен&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7k4b2vf5\"&gt;theia self update&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4fuz576k\"&gt;--x-release&lt;/code&gt;, ежедневная проверка обновлений, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l6wopmh5\"&gt;theia doctor&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oudrseyu\"&gt;OPENAI_API_KEY&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ключ OpenAI для эмбеддингов с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u767xtll\"&gt;provider: openai&lt;/code&gt;. Главнее, чем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-moubyh0z\"&gt;openai.apiKey&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p2gyx7qs\"&gt;config.yaml&lt;/code&gt;. Если переменная задана, мастер настройки не спрашивает ключ.&lt;/td&gt;\n&lt;td&gt;сохранённый ключ&lt;/td&gt;\n&lt;td&gt;команды, которые строят эмбеддинги или ищут по ним, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vacy6xej\"&gt;theia doctor&lt;/code&gt;, мастер настройки&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g4v539mo\"&gt;THEIA_X_RELEASE&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Запускает другую версию Theia, как флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8riuivfd\"&gt;--x-release&lt;/code&gt;. Флаг главнее.&lt;/td&gt;\n&lt;td&gt;запущенная версия&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-92vl0k9h\"&gt;theia&lt;/code&gt;, до любой команды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Неверное значение &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1mnf0th7\"&gt;THEIA_X_RELEASE&lt;/code&gt; останавливает любую команду, включая &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0bpfrote\"&gt;theia version&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;invalid release version 'bogus' (expected e.g. 1.2.3 or v1.2.3)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"74\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-74\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-74\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-74.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Ключи описаны в разделе &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;, другие версии — в разделе &lt;a href=\"ru/install/update.html\"&gt;Обновление&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"folders\"&gt;&lt;a href=\"ru/config/environment.html#folders\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Папки&lt;/span&gt;&lt;/a&gt;Папки&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Переменная&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;th&gt;Если не задана&lt;/th&gt;\n&lt;th&gt;Кто читает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ztumsyyp\"&gt;XDG_CONFIG_HOME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Папка настроек становится &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wjr205mp\"&gt;$XDG_CONFIG_HOME/theia&lt;/code&gt; на любой системе.&lt;/td&gt;\n&lt;td&gt;см. &lt;a href=\"ru/config/overview.html#user-folder\"&gt;Папка пользователя&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;все команды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4i0j9ltl\"&gt;XDG_DATA_HOME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Папка данных становится &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t7c86h6n\"&gt;$XDG_DATA_HOME/theia&lt;/code&gt;: хранилища папок вне git, файлы поставки.&lt;/td&gt;\n&lt;td&gt;Linux &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7tqfl5pa\"&gt;~/.local/share/theia&lt;/code&gt;, macOS &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q6la2aty\"&gt;~/Library/Application Support/theia&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;все команды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hvs2mcmh\"&gt;XDG_CACHE_HOME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Папка кэша становится &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pcq58vdl\"&gt;$XDG_CACHE_HOME/theia&lt;/code&gt;: локальные модели, кэш индекса, скачанные версии.&lt;/td&gt;\n&lt;td&gt;Linux &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5gjrhj2l\"&gt;~/.cache/theia&lt;/code&gt;, macOS &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-17mpao7y\"&gt;~/Library/Caches/theia&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;все команды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-95vtachg\"&gt;APPDATA&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-piomgpa1\"&gt;LOCALAPPDATA&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Базовые папки Windows для настроек, данных и кэша.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lzj6vyen\"&gt;~\\AppData\\Roaming&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tb1pzkm6\"&gt;~\\AppData\\Local&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;все команды на Windows&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tbdhskbn\"&gt;THEIA_MODELS_DIR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Папка локальных моделей эмбеддингов.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4hw0v32j\"&gt;models&lt;/code&gt; в папке кэша&lt;/td&gt;\n&lt;td&gt;эмбеддинги, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9skpvlcl\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eauj0n6x\"&gt;theia setup --fetch-embeddings&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-welmep3s\"&gt;THEIA_INDEX_CACHE_DIR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Папка общего кэша индекса.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2bgtpzsj\"&gt;index-cache&lt;/code&gt; в папке кэша&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qabzji8o\"&gt;theia index build&lt;/code&gt; и автоматическая сборка индекса&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ula79m6t\"&gt;HF_ENDPOINT&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Зеркало Hugging Face, откуда скачиваются локальные модели эмбеддингов.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8uw002op\"&gt;https://huggingface.co&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;скачивание модели&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;На macOS старые папки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-37snnfvw\"&gt;~/.local/share/theia&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b2i9e0si\"&gt;~/.cache/theia&lt;/code&gt; побеждают, если они есть, а новых нет, — так же, как для настроек. Установщик создаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xp2c457q\"&gt;~/.local/share/theia&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"output\"&gt;&lt;a href=\"ru/config/environment.html#output\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вывод и журналы&lt;/span&gt;&lt;/a&gt;Вывод и журналы&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Переменная&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;th&gt;Если не задана&lt;/th&gt;\n&lt;th&gt;Кто читает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8cc7xo9w\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2vktycyg\"&gt;theia run&lt;/code&gt; дописывает в этот файл каждое событие: ту же строку, что в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3163me2m\"&gt;--plain&lt;/code&gt;, и под ней строку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-08phbu21\"&gt;⤷&lt;/code&gt; с подробностями события в формате JSON. Удобно, когда экран занят экранным интерфейсом (TUI). Если файл нельзя создать, например папки нет, Theia ничего не сообщает: прогон идёт, журнала нет.&lt;/td&gt;\n&lt;td&gt;файла нет&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cumvb4ja\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-07gerpxe\"&gt;THEIA_NO_SPINNER&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Неподвижные значки вместо анимации. То же, что &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xyecy60c\"&gt;theia run --no-spinner&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;анимация&lt;/td&gt;\n&lt;td&gt;TUI команд &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i35h4lq4\"&gt;theia run&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybrqvp1v\"&gt;theia show&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uy6skmkx\"&gt;NO_COLOR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Выключает цвета.&lt;/td&gt;\n&lt;td&gt;цвета&lt;/td&gt;\n&lt;td&gt;TUI и домашний экран&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-osjs6mdq\"&gt;EDITOR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Программа, которой TUI открывает сохранённый промпт или вывод команды. Можно с аргументами, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yyndipid\"&gt;code --wait&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mdnceop1\"&gt;less&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;TUI&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Синтаксис &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ajan290j\"&gt;THEIA_LOG_FILE&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;THEIA_LOG_FILE=&amp;lt;file&amp;gt; theia run --task \"&amp;lt;text&amp;gt;\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"284\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-284\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-284\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-284.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u5ohdei5\"&gt;&amp;lt;file&amp;gt;&lt;/code&gt; — файл журнала. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3m8rhfyb\"&gt;&amp;lt;text&amp;gt;&lt;/code&gt; — текст задачи.&lt;/p&gt;\n&lt;p&gt;Пример: первые строки файла. Заголовок называет прогон и время старта, дальше пары строк «событие — подробности»:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;# theia run run2akec65qow2222b6kma2mn — 2026-09-15T07:55:37.623Z\nawcfkaqm run.created   budget=$10 track=fast_path\n  ⤷ {\"task\":\"t\",\"planId\":null,\"track\":\"fast_path\",\"trackOverride\":null,\"budgetUsd\":10,\"verify\":[\"true\"],\"record\":false,\"branch\":\"theia/run-kma2mn\",\"baseSha\":\"725a78e07c76216af93039fa26c41df48d5ff7c6\"}\na35avm37 task.created  ah45rvrt [fast_path] t\n  ⤷ {\"taskId\":\"2akec65r6c2222ah45rvrt\",\"desc\":\"t\",\"track\":\"fast_path\",\"depth\":0,\"deps\":[]}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"291\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-291\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-291\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-291.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Строки с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3spjsr61\"&gt;⤷&lt;/code&gt; есть только в журнале, в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4nnxwpkf\"&gt;--plain&lt;/code&gt; их нет. Проверьте после прогона, что файл появился: при недоступном пути его не будет.&lt;/p&gt;\n&lt;h3 id=\"other-tools\"&gt;&lt;a href=\"ru/config/environment.html#other-tools\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Другие инструменты&lt;/span&gt;&lt;/a&gt;Другие инструменты&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Переменная&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;th&gt;Если не задана&lt;/th&gt;\n&lt;th&gt;Кто читает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kk3qrg2l\"&gt;CODEX_HOME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Собственная папка Codex. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hqzdz9v9\"&gt;theia doctor&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m8zm48xg\"&gt;theia hooks install codex --trust&lt;/code&gt; ищут там &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hnup60mg\"&gt;config.toml&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1po0bsd9\"&gt;~/.codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Codex, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zoqrgeia\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f8m893u4\"&gt;theia hooks install codex&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jrvnzwjz\"&gt;THEIA_BASH&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Windows: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ts1ovq8r\"&gt;bash.exe&lt;/code&gt;, через который Theia выполняет команды.&lt;/td&gt;\n&lt;td&gt;Git Bash, найденный автоматически&lt;/td&gt;\n&lt;td&gt;все команды на Windows&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-53lfgni7\"&gt;OTEL_EXPORTER_OTLP_ENDPOINT&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Отправляет трассировки и метрики в сборщик OpenTelemetry. См. &lt;a href=\"ru/integrations/observability.html\"&gt;Метрики и трассировка&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;без отправки&lt;/td&gt;\n&lt;td&gt;все команды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fjabug99\"&gt;OTEL_SERVICE_NAME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя сервиса в трассировках и метриках.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vvgstdyt\"&gt;theia&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;все команды&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j3qtwlgo\"&gt;THEIA_VENDOR_DIR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Для разработчиков платформы. Папка с промптами, правилами и скиллами вместо установленных &lt;a href=\"ru/glossary.html#vendor\"&gt;файлов поставки&lt;/a&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z4et5cdn\"&gt;vendor&lt;/code&gt;). Путь, которого нет, останавливает с кодом 1 ровно эти команды: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l5puemj6\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5gqy90kn\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-giugggr7\"&gt;ask&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8cqcvbpz\"&gt;probe&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jw2an619\"&gt;fork&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y2xa30f9\"&gt;compare&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q6cu81kj\"&gt;diagnose&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-psstuqhh\"&gt;serve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4cthxe0\"&gt;eval&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ruepfwc6\"&gt;replay&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ob3gc5uk\"&gt;msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i9zl6mtj\"&gt;answer&lt;/code&gt;. Остальные, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wuzqkfmp\"&gt;theia index status&lt;/code&gt;, работают.&lt;/td&gt;\n&lt;td&gt;установленные файлы&lt;/td&gt;\n&lt;td&gt;команды из списка, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ld0gvy9\"&gt;theia doctor&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Сообщение при несуществующем пути в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cdny5gc1\"&gt;THEIA_VENDOR_DIR&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia: no vendor deliverables found (lib/vendor missing and no installed set) — reinstall via get-theia, or point THEIA_VENDOR_DIR at a vendor tree (THE-065)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"391\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-391\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-391\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-391.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"harness-env\"&gt;&lt;a href=\"ru/config/environment.html#harness-env\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что Theia меняет для CLI агентов&lt;/span&gt;&lt;/a&gt;Что Theia меняет для CLI агентов&lt;/h2&gt;\n&lt;p&gt;Theia запускает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i7o76ygv\"&gt;claude&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-98swziyg\"&gt;codex&lt;/code&gt; со своим окружением, но с такими изменениями:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3dhiqyu6\"&gt;claude&lt;/code&gt; не получает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yw62pp2h\"&gt;ANTHROPIC_API_KEY&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y579s5om\"&gt;ANTHROPIC_AUTH_TOKEN&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yh41d9v6\"&gt;CLAUDECODE&lt;/code&gt; и переменные, которые начинаются с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-viefrmlq\"&gt;CLAUDE_CODE_&lt;/code&gt;. Поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wcq83u8w\"&gt;claude&lt;/code&gt;, запущенный из Theia внутри сессии Claude Code, стартует с чистого листа.&lt;/li&gt;\n&lt;li&gt;Для транспорта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gkl9qsmh\"&gt;claude-index&lt;/code&gt; Theia добавляет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6cdjz1pb\"&gt;MAX_THINKING_TOKENS=0&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Остальные переменные доходят до &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o28168td\"&gt;claude&lt;/code&gt; без изменений, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oh46l0nq\"&gt;ANTHROPIC_BASE_URL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ni6d7gv2\"&gt;codex&lt;/code&gt; получает окружение без изменений, включая &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2qv6jb21\"&gt;CODEX_HOME&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-46axu2v7\"&gt;OPENAI_API_KEY&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"internal\"&gt;&lt;a href=\"ru/config/environment.html#internal\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Внутренние имена&lt;/span&gt;&lt;/a&gt;Внутренние имена&lt;/h2&gt;\n&lt;p&gt;Эти имена встречаются в коде, журналах и скриптах. Не задавайте их.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Тесты, оценка качества и запускатель: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-flmem51j\"&gt;THEIA_FAKE_RULEBOOK&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0spvvek0\"&gt;THEIA_LAUNCHER_HOP&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uob9cdtd\"&gt;THEIA_SWEBL_NO_CAP&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dh9lmmch\"&gt;THEIA_DATASETS_DIR&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jqxmee6j\"&gt;THEIA_LIVE_LOCAL_EMBED&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Theia задаёт их сама на Windows: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1b1w5dcn\"&gt;MSYS_NO_PATHCONV&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mo3yk4wh\"&gt;MSYS2_ARG_CONV_EXCL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Скрипты выпуска команды Theia, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ilcz9a8k\"&gt;theia&lt;/code&gt; их не читает: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e9bse8rm\"&gt;THEIA_BIN&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eqzvm4s8\"&gt;EXPECT_VERSION&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dysrlv3n\"&gt;GH_TOKEN&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l9my2qta\"&gt;RELEASES_PAT&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p01395hs\"&gt;PUBLISH_TOKEN&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-00vd3qkm\"&gt;THEIA_OAUTH_CLIENT_ID&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3drpxdxm\"&gt;THEIA_BUILD_VERSION&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3eydiyxu\"&gt;THEIA_SEA_NODE&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Читает только скрипт установщика: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-au7afhws\"&gt;THEIA_PAT&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8d76cvki\"&gt;THEIA_VERSION&lt;/code&gt;. См. &lt;a href=\"ru/install/install.html\"&gt;Установка&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Вовсе не переменные окружения: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6pnjziz\"&gt;THEIA_MCP_TOOLS&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-da0vo4lk\"&gt;THEIA_CONTROL_TOOLS&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fl7rc0fe\"&gt;THEIA_SKILL&lt;/code&gt; — имена внутри кода (списки инструментов и текст скилла &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6xcjvqim\"&gt;/theia&lt;/code&gt;); &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l76sxkam\"&gt;THEIA_PATCH_EOF&lt;/code&gt; — метка конца текста внутри скрипта оценки качества. Если их задать, ничего не изменится.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"ru/config/environment.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;См. также&lt;/span&gt;&lt;/a&gt;См. также&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/install/update.html\"&gt;Обновление&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/integrations/observability.html\"&gt;Метрики и трассировка&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/config/environment.html","hreflang":"en"},{"href":"ru/config/environment.html","hreflang":"ru"}],"style":["_assets/theia.css"],"canonical":"ru/config/environment.html","vcsPath":"ru/config/environment.md"},"headings":[{"title":"Переменные для пользователя","href":"ru/config/environment.html#user-variables","level":2,"items":[{"title":"Ключи и версии","href":"ru/config/environment.html#keys-versions","level":3},{"title":"Папки","href":"ru/config/environment.html#folders","level":3},{"title":"Вывод и журналы","href":"ru/config/environment.html#output","level":3},{"title":"Другие инструменты","href":"ru/config/environment.html#other-tools","level":3}]},{"title":"Что Theia меняет для CLI агентов","href":"ru/config/environment.html#harness-env","level":2},{"title":"Внутренние имена","href":"ru/config/environment.html#internal","level":2},{"title":"См. также","href":"ru/config/environment.html#see-also","level":2}],"title":"Переменные окружения"},"router":{"pathname":"ru/config/environment","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/ru/index.html","tags":[]}}
