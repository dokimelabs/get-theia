            {"data":{"leading":false,"html":"&lt;p&gt;В этой версии часть возможностей не работает или работает не так, как можно ожидать. Здесь собраны такие места и способы их обойти. Тексты ошибок и пошаговые решения — в разделе &lt;a href=\"ru/troubleshooting.html\"&gt;Решение проблем&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"platforms\"&gt;&lt;a href=\"ru/about/limitations.html#platforms\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Системы&lt;/span&gt;&lt;/a&gt;Системы&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Нет сборки для Windows.&lt;/strong&gt; Установщик отказывает. Скрипт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pd8lu8vx\"&gt;install.ps1&lt;/code&gt; ждёт архив, которого в выпуске нет. Работу в WSL не проверяли.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Intel Mac не поддерживается.&lt;/strong&gt; Сборки есть только для macOS на Apple silicon и для Linux (x86_64 и aarch64).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Песочница &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vxtkn2w9\"&gt;theia jail&lt;/code&gt; не работает на macOS.&lt;/strong&gt; Поэтому на macOS недоступен уровень песочницы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lkirtolq\"&gt;jailed-full&lt;/code&gt;. Ограничения ресурсов &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zr29u8zb\"&gt;run.resources&lt;/code&gt; работают только на Linux с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9jgovnb0\"&gt;systemd-run&lt;/code&gt;. Подробнее — в разделе &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"install\"&gt;&lt;a href=\"ru/about/limitations.html#install\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка и обновление&lt;/span&gt;&lt;/a&gt;Установка и обновление&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-72h0hcpc\"&gt;--dev&lt;/code&gt; не работает&lt;/strong&gt; в установленной версии: печатает справку и завершается с кодом 1.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jjwfb2ep\"&gt;--x-release&lt;/code&gt; скачивает версию заново&lt;/strong&gt;, даже если установщик её уже поставил. Одна распакованная версия занимает около 900 МБ. После &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-do4pxirq\"&gt;theia self update&lt;/code&gt; в кэше остаётся ещё одна полная копия.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Неверное значение &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gmev1egs\"&gt;THEIA_X_RELEASE&lt;/code&gt; ломает все команды&lt;/strong&gt;, даже &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gq0mv25h\"&gt;theia version&lt;/code&gt;. Удалите переменную: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hac3dqiy\"&gt;unset THEIA_X_RELEASE&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-od74cmsj\"&gt;theia self update&lt;/code&gt; сравнивает версии как строки&lt;/strong&gt; (видно по коду). После обновления проверьте версию командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-49qla5df\"&gt;theia version&lt;/code&gt;. Как вернуть прежнюю версию — в разделе &lt;a href=\"ru/install/update.html#rollback\"&gt;Обновление и выбор версии&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s38k8va0\"&gt;theia setup&lt;/code&gt; удаляет из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g98x07rm\"&gt;config.yaml&lt;/code&gt; ключи, которые не знает.&lt;/strong&gt; Не храните в этом файле свои записи.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;На macOS настройки могут «переехать».&lt;/strong&gt; Если появится папка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oz5aih3s\"&gt;~/Library/Application Support/theia&lt;/code&gt;, Theia перестанет читать &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mf7rsx7k\"&gt;~/.config/theia&lt;/code&gt;, а вместе с ней и токен GitHub. Подробнее — в разделе &lt;a href=\"ru/install/first-setup.html\"&gt;Первая настройка&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Повторный запуск установщика не меняет сохранённый токен GitHub.&lt;/strong&gt; Новый токен задайте через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-adr3lszq\"&gt;theia setup --pat&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Мастер первой настройки создаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-562brjuj\"&gt;.theia&lt;/code&gt; в текущей папке&lt;/strong&gt;, даже в подпапке репозитория или в папке без git. Команда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cqnio48g\"&gt;theia init&lt;/code&gt; кладёт хранилище в корень репозитория, поэтому запускайте её из корня.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Повторный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q5r3xuzk\"&gt;theia init --harness …&lt;/code&gt; не меняет движок&lt;/strong&gt;, хотя печатает новое имя. Движок меняют в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2mslybhn\"&gt;policy.yaml&lt;/code&gt; — см. &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"runs\"&gt;&lt;a href=\"ru/about/limitations.html#runs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прогоны&lt;/span&gt;&lt;/a&gt;Прогоны&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Указания и ответы не доходят до нового прогона.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xu25caaq\"&gt;theia msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-377keax1\"&gt;theia answer&lt;/code&gt;, флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ma6y2yfm\"&gt;--interaction bus&lt;/code&gt; и инструменты MCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-btuk1pso\"&gt;run_stop&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lwr9m2bn\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-whgqgzkz\"&gt;run_answer&lt;/code&gt; работают только с прогоном, продолженным через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-imch245s\"&gt;theia run --resume&lt;/code&gt;. Рабочий порядок описан в разделе &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Прогон начинается от upstream-ветки, а не от вашего локального &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4okcujt0\"&gt;HEAD&lt;/code&gt;.&lt;/strong&gt; Коммиты, которые вы ещё не отправили на сервер, в прогон не попадут. Чтобы их включить, передайте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dyp5kazf\"&gt;--base HEAD&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Ctrl+C в режимах &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l4mtltgu\"&gt;--plain&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r9bngwuo\"&gt;--cli&lt;/code&gt; убивает команду проверки.&lt;/strong&gt; Theia записывает ложный провал &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vltjxf0z\"&gt;verify_fail&lt;/code&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t9a804ff\"&gt;exit null&lt;/code&gt;. В TUI клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ioonf8ep\"&gt;q&lt;/code&gt; так не делает.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hisgysz6\"&gt;theia run --resume&lt;/code&gt; продолжает даже закрытый прогон&lt;/strong&gt; — тот, что закрыт через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ltlfnow9\"&gt;--abandon&lt;/code&gt;. Перед продолжением проверьте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jw98gewn\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt;: если там &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-38nhijox\"&gt;halted: abandoned&lt;/code&gt;, начните новый прогон.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Отказ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-55ib41go\"&gt;theia run --from-plan&lt;/code&gt; оставляет следы.&lt;/strong&gt; Если план не одобрен, ветка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6theu04u\"&gt;theia/run-…&lt;/code&gt;, папка в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5uano4j\"&gt;.theia/runs/&lt;/code&gt; и незавершённый прогон всё равно создаются. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eevfnh2k\"&gt;theia prune&lt;/code&gt; их не удаляет.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kdqn1yey\"&gt;theia run&lt;/code&gt; молча пропускает неизвестные флаги.&lt;/strong&gt; Нечисловое значение &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f5f7s692\"&gt;--budget&lt;/code&gt; снимает лимит бюджета.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gmmoy1cd\"&gt;--max-rounds 0&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-noiqp1lc\"&gt;--max-rescopes 0&lt;/code&gt; в командной строке снимают лимит&lt;/strong&gt;, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vz786v4q\"&gt;maxRescopes: 0&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n4wtvm3l\"&gt;policy.yaml&lt;/code&gt;, наоборот, запрещает пересмотр задачи (видно по коду).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ou7idiz\"&gt;halted: budget&lt;/code&gt; — не про деньги.&lt;/strong&gt; Это внутренний потолок в 1000 вердиктов. Когда кончаются деньги, прогон встаёт на паузу: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g5tkkuvc\"&gt;halted: paused&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Код выхода 0 бывает и при паузе.&lt;/strong&gt; В том числе когда ни одна роль не может работать: нет маршрута к модели или в тексте задачи заблокирован секрет.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-15ov6t4h\"&gt;theia show --task&lt;/code&gt; работает только для слитых задач.&lt;/strong&gt; Для отброшенной задачи он пишет, что ветка не найдена.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6xunvh92\"&gt;theia audit verify&lt;/code&gt; с несуществующей областью отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ambzk1jk\"&gt;intact&lt;/code&gt;.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-elzxotes\"&gt;theia prune&lt;/code&gt; не удаляет ветки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ep5pc8b2\"&gt;theia/run-*&lt;/code&gt;, записи git worktree и области &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xybehro8\"&gt;probe&lt;/code&gt;.&lt;/strong&gt; Ветки удаляйте сами, записи worktree очищает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lljhydni\"&gt;git worktree prune&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;У ответвления прогона (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bgv8qu7g\"&gt;fork&lt;/code&gt;) свои правила.&lt;/strong&gt; Бюджет по умолчанию — $5, независимо от настроек. При продолжении ответвления слияния идут в ветку, которая сейчас выбрана в вашей рабочей копии. Ответвление завершённого прогона без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fwcd5lai\"&gt;--at&lt;/code&gt; продолжить нельзя.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-29h7xqlg\"&gt;THEIA_LOG_FILE&lt;/code&gt; может остаться пустым&lt;/strong&gt;, если прогон длился меньше секунды.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Пути &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8fk16rsi\"&gt;@/…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-his5p7ww\"&gt;@./…&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yckph6ap\"&gt;@../…&lt;/code&gt; в тексте задачи не вставляются&lt;/strong&gt; и не дают ошибки. Пишите путь от текущей папки без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sovbfg45\"&gt;./&lt;/code&gt;, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-voco1ycu\"&gt;@src/app.ts&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tui\"&gt;&lt;a href=\"ru/about/limitations.html#tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экран TUI&lt;/span&gt;&lt;/a&gt;Экран TUI&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Нет клавиши, чтобы уйти с экрана и оставить прогон работать.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-el4cuce0\"&gt;q&lt;/code&gt; ставит прогон на паузу. Закрытие окна терминала убивает Theia и команду проверки без паузы. Как оставить задачу работать — в разделе &lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ttglqnl\"&gt;nohup theia run … &amp;amp;&lt;/code&gt; не переживает закрытие окна терминала.&lt;/strong&gt; Запускайте прогон в tmux или в фоне через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n7t4wgzi\"&gt;&amp;lt; /dev/null &amp;amp;&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zpiqksm9\"&gt;disown&lt;/code&gt;. См. &lt;a href=\"ru/tui/leave-running.html#background\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Прогон, остановленный жёстко, выглядит живым&lt;/strong&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b6sadqoy\"&gt;running&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gfl8wdlq\"&gt;in flight&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d1p390cn\"&gt;· N live&lt;/code&gt;. Продолжите его через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v5su5rq2\"&gt;--resume&lt;/code&gt; или закройте через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xyrbmo20\"&gt;--abandon&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Пока вы набираете указание, Ctrl+C не работает.&lt;/strong&gt; Сначала нажмите Esc или Tab, затем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rvqw6sid\"&gt;q&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Поле задачи на домашнем экране не работает.&lt;/strong&gt; Enter завершается ошибкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r3otzixd\"&gt;kernel: no vendored prompts&lt;/code&gt; и оставляет открытый прогон и ветку. Запускайте задачи командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mzzb0fsh\"&gt;theia run --task&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dokjlu0o\"&gt;theia run --resume &amp;lt;runId&amp;gt; --tui&lt;/code&gt; рисует неполное дерево&lt;/strong&gt;: в нём только события после продолжения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Перемотка на экране завершённого прогона меняет только счётчик событий.&lt;/strong&gt; Настоящая перемотка работает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u4c885hx\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qsxfgyru\"&gt;v&lt;/code&gt; не открывает вывод строк проверки&lt;/strong&gt; — только тексты вызовов модели.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;После &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-556ac1m7\"&gt;kill -TERM&lt;/code&gt; терминал остаётся в альтернативном экране&lt;/strong&gt; со скрытым курсором.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Временные файлы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-es7fqby9\"&gt;theia-blob-*.txt&lt;/code&gt; не удаляются.&lt;/strong&gt; В них тексты запросов к модели. Файлы лежат во временной папке системы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;В маленьком окне строки обрезаются&lt;/strong&gt;, а сообщение &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-et33utrc\"&gt;terminal too small&lt;/code&gt; выводится с искажениями. Минимальный размер окна — 20×5 символов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"knowledge\"&gt;&lt;a href=\"ru/about/limitations.html#knowledge\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индекс кода, память и вопросы&lt;/span&gt;&lt;/a&gt;Индекс кода, память и вопросы&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Индекс и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jajw5kba\"&gt;theia ask&lt;/code&gt; работают только в git-репозитории.&lt;/strong&gt; В папке без git они завершаются ошибкой git.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7u8xc6jz\"&gt;theia index build&lt;/code&gt; не обновляет поиск.&lt;/strong&gt; После сборки выполните &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pdz9lj7l\"&gt;theia index reindex&lt;/code&gt;, иначе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z6f5uwss\"&gt;index search&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3o2db6go\"&gt;ask&lt;/code&gt; не увидят новые карточки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-umjm9lgj\"&gt;theia index&lt;/code&gt; без подкоманды запускает полную сборку&lt;/strong&gt; и может тратить деньги.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Поиск падает, если опубликован векторный индекс, а локальная модель эмбеддингов недоступна.&lt;/strong&gt; Это касается &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j3kfhn75\"&gt;index search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-82e25i0s\"&gt;mem search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o58r7pgx\"&gt;mem asof&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k291r9lc\"&gt;ask&lt;/code&gt;. Поиска только по словам в этом случае нет.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-capx0x9v\"&gt;theia mem add&lt;/code&gt; не маскирует секреты.&lt;/strong&gt; Не записывайте в факты ключи и токены.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4x3a1zn0\"&gt;theia mem supersede&lt;/code&gt; не проверяет новый идентификатор.&lt;/strong&gt; Даже с опечаткой старый факт пропадёт из поиска, а отменить замену нельзя.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Команды удаления факта нет.&lt;/strong&gt; Факт можно только заменить, старый останется в истории. Адреса e-mail в памяти не маскируются.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Дата &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dry25k97\"&gt;2026-09&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7soszcu6\"&gt;theia mem chunk --date&lt;/code&gt; считается целым годом.&lt;/strong&gt; Пишите месяц словами: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cu9bi9z5\"&gt;September 2026&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Неудачный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y7pdp123\"&gt;reindex&lt;/code&gt; оставляет недостроенную папку поиска&lt;/strong&gt;, и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dumlocet\"&gt;theia mem maintain&lt;/code&gt; её не удаляет.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Карточки из общего кэша не попадают в счётчики &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0lclxaee\"&gt;written&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jsvblszg\"&gt;current&lt;/code&gt;&lt;/strong&gt; в отчёте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ei6wsgg\"&gt;theia index build&lt;/code&gt;. Их видно только в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qoem3ckj\"&gt;rate:&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o3njoul4\"&gt;--root root&lt;/code&gt; в проекте с одним корнем создаёт отдельную память.&lt;/strong&gt; Её не видят &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ue3g15vc\"&gt;mem search&lt;/code&gt;, хуки и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3i9mgaif\"&gt;ask&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6b41k74j\"&gt;theia ask&lt;/code&gt; почти всегда вызывает модель.&lt;/strong&gt; Если в хранилище есть хоть один факт или прогон, ответ идёт через модель.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Настройка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kwxdwfft\"&gt;memory.sentenceGraph&lt;/code&gt; со значением &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6a76yis5\"&gt;h0&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-anrccc54\"&gt;h1&lt;/code&gt; отключает векторный поиск.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zcvdiinb\"&gt;eval swebl&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0muabtqr\"&gt;eval memory&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-igw8ldyp\"&gt;eval demo create&lt;/code&gt; — инструменты разработчиков платформы.&lt;/strong&gt; Они скачивают данные, вызывают модели и ждут путей из среды разработки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"config\"&gt;&lt;a href=\"ru/about/limitations.html#config\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройки и ключи&lt;/span&gt;&lt;/a&gt;Настройки и ключи&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Настройки объединяются только на один уровень.&lt;/strong&gt; Разделы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f5ndrxih\"&gt;gateway.routing&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6xc4msfg\"&gt;gateway.models&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-198czc6q\"&gt;gateway.embeddings&lt;/code&gt; из настроек проекта целиком заменяют такие же разделы из пользовательских настроек.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Ошибка в настройках называет раздел, а не ключ&lt;/strong&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wuy4pluw\"&gt;spec.run: unrecognized_keys&lt;/code&gt;. Опечатка в имени роли внутри &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3paa6lw\"&gt;routing&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tuk3rvz0\"&gt;models&lt;/code&gt; молча игнорируется.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eksz9uey\"&gt;theia doctor&lt;/code&gt; не показывает маршруты и модели.&lt;/strong&gt; Он смотрит только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2l9i93td\"&gt;.theia&lt;/code&gt; в текущей папке и пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fyqzbwxj\"&gt;docker ready&lt;/code&gt;, даже если Docker не запущен. Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qsznbrb0\"&gt;lexical index : FAIL&lt;/code&gt; не влияет на код выхода (видно по коду).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Поле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8trvw0b3\"&gt;dataClasses&lt;/code&gt; у транспортов ни на что не влияет.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Детекторы секретов знают только пять видов данных&lt;/strong&gt;: закрытые ключи, API-ключи, номера карт, seed-фразы и адреса e-mail. API-ключи распознаются только по началу &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iu5bh00w\"&gt;sk-&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dhv5dqss\"&gt;AKIA&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r58kvm1x\"&gt;ghp_&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uxmlh3rw\"&gt;gho_&lt;/code&gt;. Другие токены, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s4pio4gs\"&gt;github_pat_…&lt;/code&gt;, детекторы не замечают.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Текст задачи с заблокированным секретом сохраняется в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ho0krt6\"&gt;.theia/store.db&lt;/code&gt; как есть&lt;/strong&gt;, хотя в модель он не уходит.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s9ghvmz1\"&gt;gateway.harnessConfig&lt;/code&gt; работает только для Codex.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Правила и скиллы из поставки Theia код не читает.&lt;/strong&gt; Настройка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fb06bl8a\"&gt;run.rulesSoT&lt;/code&gt; скрывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f4m61j8s\"&gt;AGENTS.md&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zyexvlgu\"&gt;CLAUDE.md&lt;/code&gt; от движка, но не вставляет их в запросы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Бюджет считает вызовы Claude по прайс-листу&lt;/strong&gt;, даже при работе по подписке (видно по коду).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"integrations\"&gt;&lt;a href=\"ru/about/limitations.html#integrations\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интеграции&lt;/span&gt;&lt;/a&gt;Интеграции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Хуки, строка статуса и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q0wfbv8z\"&gt;.mcp.json&lt;/code&gt; ссылаются на файл конкретной версии&lt;/strong&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qfmlf31i\"&gt;…/releases/0.2.201/theia&lt;/code&gt;), а не на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bo2l3d5h\"&gt;~/.local/bin/theia&lt;/code&gt;. После обновления Claude Code и Codex продолжают запускать старую версию. Повторный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4vs03jue\"&gt;theia hooks install claude&lt;/code&gt; добавляет второй набор хуков, а путь не исправляет. Замените путь на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bjrq649k\"&gt;~/.local/bin/theia&lt;/code&gt; или удалите старые записи и установите хуки заново — см. &lt;a href=\"ru/integrations/claude-code.html#after-update\"&gt;Claude Code&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c1b9m4tm\"&gt;hooks uninstall&lt;/code&gt; нет.&lt;/strong&gt; Интеграции снимаются вручную. Шаги описаны на страницах &lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt; и &lt;a href=\"ru/integrations/git.html\"&gt;Git&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Хук &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-192a2yoy\"&gt;Stop&lt;/code&gt; в Claude Code срабатывает после каждого ответа.&lt;/strong&gt; Каждый раз он сохраняет в память до 16 КБ переписки и не убирает повторы. Память проекта растёт. Чтобы это прекратить, удалите запись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r81k2v8n\"&gt;Stop&lt;/code&gt; из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aamkuu1u\"&gt;.claude/settings.json&lt;/code&gt;; повторная установка хуков вернёт её.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Скилл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ywo2ac1\"&gt;/theia&lt;/code&gt; не управляет новым прогоном.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gqz77ej5\"&gt;run_msg&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hafd1sia\"&gt;run_stop&lt;/code&gt; не действуют на прогон, запущенный через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u4aj42ad\"&gt;run_start&lt;/code&gt;, хотя отвечают, что всё доставлено. Вопросы такого прогона до Claude не доходят.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Прогон, убитый снаружи, по-прежнему показан как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-37dxlyfg\"&gt;live&lt;/code&gt;&lt;/strong&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ysv3znu3\"&gt;run_list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-na1xnrpf\"&gt;run_status&lt;/code&gt; и строке статуса.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Codex получает урезанный MCP-сервер&lt;/strong&gt;: 5 инструментов, без управления прогонами и без скилла &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g5squtzo\"&gt;/theia&lt;/code&gt;. Сервер и хуки заработают только после двух подтверждений доверия в Codex.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ktypp2tg\"&gt;theia hooks install git&lt;/code&gt; молча не работает, если в git задан &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7awi24it\"&gt;core.hooksPath&lt;/code&gt;.&lt;/strong&gt; В git worktree команда завершается ошибкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ly8xz40g\"&gt;ENOTDIR&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Неверный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jknyghwx\"&gt;.mcp.json&lt;/code&gt; прерывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y3tfpr42\"&gt;theia hooks install claude&lt;/code&gt; на середине&lt;/strong&gt; с кодом 1.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1endbq5m\"&gt;theia serve --metrics&lt;/code&gt; слушает все сетевые интерфейсы.&lt;/strong&gt; Второй сервер на том же порту падает. На &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dj5l7hip\"&gt;/metrics&lt;/code&gt; видны только счётчики самого сервера, а метрики прогонов уходят только через OTLP.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стек наблюдаемости &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-61ht62tq\"&gt;ops/observability&lt;/code&gt; не входит в выпуск.&lt;/strong&gt; Он есть только в исходном репозитории. Панель Grafana с метрикой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mkq4609p\"&gt;theia_pii_total&lt;/code&gt; всегда пуста.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-90cauvhz\"&gt;run_start&lt;/code&gt; с неверным идентификатором плана оставляет пустую ветку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-klg9nwlu\"&gt;theia/run-*&lt;/code&gt;.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Нет создания pull request, отправки веток (push), интеграций со Slack, вебхуками и Jira.&lt;/strong&gt; Azure DevOps есть только как текстовый файл в поставке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"ru/about/limitations.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;См. также&lt;/span&gt;&lt;/a&gt;См. также&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/troubleshooting.html\"&gt;Решение проблем&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/about/platforms.html\"&gt;Системы и режимы работы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/about/limitations.html","hreflang":"en"},{"href":"ru/about/limitations.html","hreflang":"ru"}],"style":["_assets/theia.css","_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"canonical":"ru/about/limitations.html","vcsPath":"ru/about/limitations.md"},"headings":[{"title":"Системы","href":"ru/about/limitations.html#platforms","level":2},{"title":"Установка и обновление","href":"ru/about/limitations.html#install","level":2},{"title":"Прогоны","href":"ru/about/limitations.html#runs","level":2},{"title":"Экран TUI","href":"ru/about/limitations.html#tui","level":2},{"title":"Индекс кода, память и вопросы","href":"ru/about/limitations.html#knowledge","level":2},{"title":"Настройки и ключи","href":"ru/about/limitations.html#config","level":2},{"title":"Интеграции","href":"ru/about/limitations.html#integrations","level":2},{"title":"См. также","href":"ru/about/limitations.html#see-also","level":2}],"title":"Ограничения версии 0.2.201"},"router":{"pathname":"ru/about/limitations","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/ru/index.html","tags":[]}}
