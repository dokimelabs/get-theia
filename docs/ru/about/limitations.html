            {"data":{"leading":false,"html":"&lt;p&gt;В этой версии часть возможностей не работает или работает не так, как можно ожидать. Здесь собраны такие места и способы их обойти. Тексты ошибок и пошаговые решения — в разделе &lt;a href=\"ru/troubleshooting.html\"&gt;Решение проблем&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"platforms\"&gt;&lt;a href=\"ru/about/limitations.html#platforms\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Системы&lt;/span&gt;&lt;/a&gt;Системы&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Нет сборки для Windows.&lt;/strong&gt; Установщик отказывает. Скрипт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-50dkws0d\"&gt;install.ps1&lt;/code&gt; ждёт архив, которого в выпуске нет. Работу в WSL не проверяли.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Intel Mac не поддерживается.&lt;/strong&gt; Сборки есть только для macOS на Apple silicon и для Linux (x86_64 и aarch64).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Песочница &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-csixkv69\"&gt;theia jail&lt;/code&gt; не работает на macOS.&lt;/strong&gt; Поэтому на macOS недоступен &lt;a href=\"ru/glossary.html#sandbox-tier\"&gt;уровень песочницы&lt;/a&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xhu3bmey\"&gt;jailed-full&lt;/code&gt;. Поэтому на macOS недоступен &lt;a href=\"ru/glossary.html#sandbox-tier\"&gt;уровень песочницы&lt;/a&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j44eacs9\"&gt;jailed-full&lt;/code&gt;. Ограничения ресурсов &lt;a href=\"ru/glossary.html#run-resources\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gziuall4\"&gt;run.resources&lt;/code&gt;&lt;/a&gt; работают только на Linux с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4kp64bs7\"&gt;systemd-run&lt;/code&gt;. Подробнее — в разделе &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"install\"&gt;&lt;a href=\"ru/about/limitations.html#install\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка и обновление&lt;/span&gt;&lt;/a&gt;Установка и обновление&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Флаг &lt;a href=\"ru/glossary.html#dev\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5n5ygkvf\"&gt;--dev&lt;/code&gt;&lt;/a&gt; в установленной версии не работает.&lt;/strong&gt; Без пути он пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-chnb4ig6\"&gt;--dev: no development root — pass a path (theia --dev &amp;lt;path&amp;gt; …) or set dev.root in …&lt;/code&gt; и завершается с кодом 1; справку не печатает. Флаг нужен разработчикам платформы — см. &lt;a href=\"ru/install/update.html#for-developers\"&gt;Для разработчиков платформы&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/glossary.html#x-release\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gho6shu5\"&gt;--x-release&lt;/code&gt;&lt;/a&gt; скачивает версию заново&lt;/strong&gt;, даже если установщик её уже поставил. Одна распакованная версия занимает около 900 МБ. После &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q1xnissh\"&gt;theia self update&lt;/code&gt; в кэше остаётся ещё одна полная копия.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Неверное значение &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5nkfxt77\"&gt;THEIA_X_RELEASE&lt;/code&gt; ломает все команды&lt;/strong&gt;, даже &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z1tuj6kg\"&gt;theia version&lt;/code&gt;. Удалите переменную: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dywlnf4g\"&gt;unset THEIA_X_RELEASE&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/reference/setup-self-version.html#self-update\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-354a9bjm\"&gt;theia self update&lt;/code&gt;&lt;/a&gt; сравнивает версии как строки&lt;/strong&gt; (видно по коду). После обновления проверьте версию командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hxc1pmyu\"&gt;theia version&lt;/code&gt;. Как вернуть прежнюю версию — в разделе &lt;a href=\"ru/install/update.html#rollback\"&gt;Обновление и выбор версии&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/reference/setup-self-version.html#setup\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w8ngo0ta\"&gt;theia setup&lt;/code&gt;&lt;/a&gt; удаляет из &lt;a href=\"ru/glossary.html#user-config\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-55gm8rg4\"&gt;config.yaml&lt;/code&gt;&lt;/a&gt; ключи, которые не знает.&lt;/strong&gt; Не храните в этом файле свои записи.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;На macOS настройки могут «переехать».&lt;/strong&gt; Если появится папка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mdvjuh3b\"&gt;~/Library/Application Support/theia&lt;/code&gt;, Theia перестанет читать &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iadf7gjk\"&gt;~/.config/theia&lt;/code&gt;, а вместе с ней и токен GitHub. Подробнее — в разделе &lt;a href=\"ru/install/first-setup.html\"&gt;Первая настройка&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Повторный запуск установщика не меняет сохранённый токен GitHub.&lt;/strong&gt; Новый токен задайте через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dixzoehu\"&gt;theia setup --pat&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/glossary.html#setup-wizard\"&gt;Мастер первой настройки&lt;/a&gt; создаёт &lt;a href=\"ru/glossary.html#theia-dir\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-orpchr8u\"&gt;.theia&lt;/code&gt;&lt;/a&gt; в текущей папке&lt;/strong&gt;, даже в подпапке репозитория или в папке без git. Команда &lt;a href=\"ru/reference/init.html#init\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-33oj0373\"&gt;theia init&lt;/code&gt;&lt;/a&gt; кладёт хранилище в корень репозитория, поэтому запускайте её из корня.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Повторный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gnxhwcdr\"&gt;theia init --harness …&lt;/code&gt; не меняет движок&lt;/strong&gt;, хотя печатает новое имя. &lt;a href=\"ru/glossary.html#harness\"&gt;Движок&lt;/a&gt; меняют в &lt;a href=\"ru/glossary.html#policy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-18dbjdrg\"&gt;policy.yaml&lt;/code&gt;&lt;/a&gt; — см. &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"runs\"&gt;&lt;a href=\"ru/about/limitations.html#runs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прогоны&lt;/span&gt;&lt;/a&gt;Прогоны&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/glossary.html#steering\"&gt;Указания&lt;/a&gt; и ответы не доходят до нового &lt;a href=\"ru/glossary.html#run\"&gt;прогона&lt;/a&gt;.&lt;/strong&gt; &lt;a href=\"ru/reference/run-control.html#msg\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ozpohyqr\"&gt;theia msg&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run-control.html#answer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xg5o7tso\"&gt;theia answer&lt;/code&gt;&lt;/a&gt;, флаг &lt;a href=\"ru/glossary.html#control-bus\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m4eyozu2\"&gt;--interaction bus&lt;/code&gt;&lt;/a&gt; и инструменты MCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-28snsuwj\"&gt;run_stop&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-odfktgiq\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ft4a8uz\"&gt;run_answer&lt;/code&gt; работают только с прогоном, продолженным через &lt;a href=\"ru/reference/run.html#run-resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a0ux0cgs\"&gt;theia run --resume&lt;/code&gt;&lt;/a&gt;. Рабочий порядок описан в разделе &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Прогон начинается от upstream-ветки, а не от вашего локального &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-snnfyezt\"&gt;HEAD&lt;/code&gt;.&lt;/strong&gt; Коммиты, которые вы ещё не отправили на сервер, в прогон не попадут. Чтобы их включить, передайте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cu5vq4r4\"&gt;--base HEAD&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Ctrl+C в режимах &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-arg0ieam\"&gt;--plain&lt;/code&gt;&lt;/a&gt; и &lt;a href=\"ru/glossary.html#board\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8aez0fa4\"&gt;--cli&lt;/code&gt;&lt;/a&gt; убивает команду проверки.&lt;/strong&gt; Theia записывает ложный провал &lt;a href=\"ru/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t86ddg2z\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3lhx3i1\"&gt;exit null&lt;/code&gt;. В TUI клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5rax4yof\"&gt;q&lt;/code&gt; так не делает.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6fj44mjr\"&gt;theia run --resume&lt;/code&gt; продолжает даже закрытый прогон&lt;/strong&gt; — тот, что закрыт через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g61jhcph\"&gt;--abandon&lt;/code&gt;. Перед продолжением проверьте &lt;a href=\"ru/reference/run-inspect.html#show\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kbfvqacr\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt;&lt;/a&gt;: если там &lt;a href=\"ru/glossary.html#abandoned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q21gfjz2\"&gt;halted: abandoned&lt;/code&gt;&lt;/a&gt;, начните новый прогон.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Отказ &lt;a href=\"ru/reference/run.html#run-from-plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iz7r0g7h\"&gt;theia run --from-plan&lt;/code&gt;&lt;/a&gt; оставляет следы.&lt;/strong&gt; Если план не одобрен или после флага стоит не идентификатор плана (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vu2274ay\"&gt;terryid: malformed id '…'&lt;/code&gt;), &lt;a href=\"ru/glossary.html#run-branch\"&gt;ветка прогона&lt;/a&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0fz48drb\"&gt;theia/run-…&lt;/code&gt;, папка в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mgel61r0\"&gt;.theia/runs/&lt;/code&gt; и незавершённый прогон всё равно создаются. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iqyg8293\"&gt;theia prune&lt;/code&gt; их не удаляет.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-twlxgywm\"&gt;theia run&lt;/code&gt; молча пропускает неизвестные флаги.&lt;/strong&gt; Нечисловое значение &lt;a href=\"ru/glossary.html#budget\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-whgmdmc5\"&gt;--budget&lt;/code&gt;&lt;/a&gt; тоже не даёт ошибки: Theia печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pf925l10\"&gt;budget=$NaN&lt;/code&gt; и в конце &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-az273fcg\"&gt;budget remaining: NaN&lt;/code&gt;. Лимит при этом не действует, но словом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-grsba60g\"&gt;unmetered&lt;/code&gt; это не называется.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lzvoucf3\"&gt;--max-rounds 0&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hlus1h8k\"&gt;--max-rescopes 0&lt;/code&gt; в командной строке снимают лимит&lt;/strong&gt;, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5m672qg4\"&gt;maxRescopes: 0&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dnxd3ys8\"&gt;policy.yaml&lt;/code&gt;, наоборот, запрещает пересмотр задачи (видно по коду).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-51agh5ew\"&gt;halted: budget&lt;/code&gt;&lt;/a&gt; — не про деньги.&lt;/strong&gt; Это внутренний потолок в 1000 вердиктов. Когда кончаются деньги, прогон встаёт на паузу: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4fh0ktzg\"&gt;halted: paused&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Код выхода 0 бывает и при паузе.&lt;/strong&gt; В том числе когда ни одна роль не может работать: нет маршрута к модели или в тексте задачи заблокирован секрет.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-podmaqv4\"&gt;theia show --task&lt;/code&gt; работает только для &lt;a href=\"ru/glossary.html#merged\"&gt;слитых&lt;/a&gt; задач.&lt;/strong&gt; Для отброшенной задачи он пишет, что ветка не найдена.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/reference/audit-prune.html#audit-verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vln86ovu\"&gt;theia audit verify&lt;/code&gt;&lt;/a&gt; с несуществующей &lt;a href=\"ru/glossary.html#scope\"&gt;областью&lt;/a&gt; отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0vlx2do5\"&gt;intact&lt;/code&gt;.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/reference/audit-prune.html#prune\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wkecbu82\"&gt;theia prune&lt;/code&gt;&lt;/a&gt; не удаляет ветки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-43x3ey3d\"&gt;theia/run-*&lt;/code&gt;, записи рабочих деревьев git (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3h25s3en\"&gt;git worktree&lt;/code&gt;) и области &lt;a href=\"ru/glossary.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2rdn2yn2\"&gt;probe&lt;/code&gt;&lt;/a&gt;.&lt;/strong&gt; Ветки удаляйте сами, записи рабочих деревьев (в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0gdyczdo\"&gt;git worktree list&lt;/code&gt; они помечены &lt;a href=\"ru/glossary.html#prunable\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8rudpqal\"&gt;prunable&lt;/code&gt;&lt;/a&gt;) очищает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ubdyhumx\"&gt;git worktree prune&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;У ответвления прогона (&lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vnw90wh6\"&gt;fork&lt;/code&gt;&lt;/a&gt;) свои правила.&lt;/strong&gt; Бюджет по умолчанию — $5, независимо от настроек. При продолжении ответвления слияния идут в ветку, которая сейчас выбрана в вашей рабочей копии. Ответвление завершённого прогона без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f6rpweja\"&gt;--at&lt;/code&gt; продолжить нельзя.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/glossary.html#theia-log-file\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d36r3zsf\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/a&gt; может остаться пустым&lt;/strong&gt;, если прогон длился меньше секунды.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/glossary.html#file-inclusion\"&gt;Пути&lt;/a&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7rd35pf8\"&gt;@/…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jilt70b8\"&gt;@./…&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1l4knafp\"&gt;@../…&lt;/code&gt; в тексте задачи не вставляются&lt;/strong&gt; и не дают ошибки. Пишите путь от текущей папки без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cax5ebp2\"&gt;./&lt;/code&gt;, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ivt6sen\"&gt;@src/app.ts&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tui\"&gt;&lt;a href=\"ru/about/limitations.html#tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экран TUI&lt;/span&gt;&lt;/a&gt;Экран TUI&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Нет клавиши, чтобы уйти с экрана и оставить прогон работать.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-osu4n26x\"&gt;q&lt;/code&gt; ставит прогон на паузу. Закрытие окна терминала убивает Theia и команду проверки без паузы. Как оставить задачу работать — в разделе &lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yxiltuw8\"&gt;nohup theia run … &amp;amp;&lt;/code&gt; не переживает закрытие окна терминала.&lt;/strong&gt; Запускайте прогон в tmux или в фоне через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sbbzhlpq\"&gt;&amp;lt; /dev/null &amp;amp;&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sdmkqhnl\"&gt;disown&lt;/code&gt;. См. &lt;a href=\"ru/tui/leave-running.html#background\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Прогон, &lt;a href=\"ru/glossary.html#hard-stop\"&gt;остановленный жёстко&lt;/a&gt;, выглядит живым&lt;/strong&gt;: &lt;a href=\"ru/glossary.html#running\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s6zdl3gk\"&gt;running&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3zq2x9p\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c0mqz6wv\"&gt;· N live&lt;/code&gt;&lt;/a&gt;. Продолжите его через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v72yfppd\"&gt;--resume&lt;/code&gt; или закройте через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-288vlrjr\"&gt;--abandon&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Пока вы набираете указание, Ctrl+C не работает.&lt;/strong&gt; Сначала нажмите Esc или Tab, затем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-myw96owd\"&gt;q&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Поле задачи на домашнем экране не работает.&lt;/strong&gt; Enter завершается ошибкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e02ul6v1\"&gt;kernel: no vendored prompts&lt;/code&gt; и оставляет открытый прогон и ветку. Запускайте задачи командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ky5g8ahn\"&gt;theia run --task&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vnvm7jxk\"&gt;theia run --resume &amp;lt;runId&amp;gt; --tui&lt;/code&gt; рисует неполное дерево&lt;/strong&gt;: в нём только события после продолжения.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Перемотка на экране завершённого прогона меняет только счётчик событий.&lt;/strong&gt; Настоящая перемотка работает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pb138esh\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x9lhicyn\"&gt;v&lt;/code&gt; не открывает вывод строк проверки&lt;/strong&gt; — только тексты вызовов модели.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;После &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cq6sr30j\"&gt;kill -TERM&lt;/code&gt; терминал остаётся в альтернативном экране&lt;/strong&gt; со скрытым курсором.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Временные файлы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ahew9ur6\"&gt;theia-blob-*.txt&lt;/code&gt; не удаляются.&lt;/strong&gt; В них тексты запросов к модели. Файлы лежат во временной папке системы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;В маленьком окне строки обрезаются&lt;/strong&gt;, а сообщение &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1tz199so\"&gt;terminal too small&lt;/code&gt; выводится с искажениями. Минимальный размер окна — 20×5 символов.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"knowledge\"&gt;&lt;a href=\"ru/about/limitations.html#knowledge\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индекс кода, память и вопросы&lt;/span&gt;&lt;/a&gt;Индекс кода, память и вопросы&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/glossary.html#intent-index\"&gt;Индекс&lt;/a&gt; и &lt;a href=\"ru/reference/ask.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8nalx9z6\"&gt;theia ask&lt;/code&gt;&lt;/a&gt; работают только в git-репозитории.&lt;/strong&gt; В папке без git они завершаются ошибкой git.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/reference/index-cmd.html#index-build\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ugy1f273\"&gt;theia index build&lt;/code&gt;&lt;/a&gt; не обновляет поиск.&lt;/strong&gt; После сборки выполните &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-865i59tj\"&gt;theia index reindex&lt;/code&gt;, иначе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4uizplu\"&gt;index search&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-52oxb4bd\"&gt;ask&lt;/code&gt; не увидят новые карточки.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a9q2dv6t\"&gt;theia index&lt;/code&gt; без подкоманды запускает полную сборку&lt;/strong&gt; и может тратить деньги.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Поиск падает, если опубликован векторный индекс, а локальная модель эмбеддингов недоступна.&lt;/strong&gt; Это касается &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vxhwribd\"&gt;index search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0d2etyen\"&gt;mem search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rpim4lda\"&gt;mem asof&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l3rt8tb5\"&gt;ask&lt;/code&gt;. Поиска только по словам в этом случае нет.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/reference/mem.html#mem-add\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-26h4s6jl\"&gt;theia mem add&lt;/code&gt;&lt;/a&gt; не маскирует секреты.&lt;/strong&gt; Не записывайте в факты ключи и токены.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lypzmi58\"&gt;theia mem supersede&lt;/code&gt; не проверяет новый идентификатор.&lt;/strong&gt; Даже с опечаткой старый факт пропадёт из поиска, а отменить замену нельзя.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Команды удаления факта нет.&lt;/strong&gt; Факт можно только заменить, старый останется в истории. Адреса e-mail в памяти не маскируются.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Дата &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h0wz3lku\"&gt;2026-09&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-keutumzg\"&gt;theia mem chunk --date&lt;/code&gt; считается целым годом.&lt;/strong&gt; Пишите месяц словами: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-27biiwe1\"&gt;September 2026&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Неудачный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-53kuadsx\"&gt;reindex&lt;/code&gt; оставляет недостроенную папку поиска&lt;/strong&gt;, и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nddo6gns\"&gt;theia mem maintain&lt;/code&gt; её не удаляет.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Карточки из общего кэша не попадают в счётчики &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iyz1q45m\"&gt;written&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gy6h6pix\"&gt;current&lt;/code&gt;&lt;/strong&gt; в отчёте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-76fu4nqb\"&gt;theia index build&lt;/code&gt;. Их видно только в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kaiwsugu\"&gt;rate:&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yb6pyxue\"&gt;--root root&lt;/code&gt; в проекте с одним корнем создаёт отдельную память.&lt;/strong&gt; Её не видят &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-msfde52q\"&gt;mem search&lt;/code&gt;, хуки и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ndopwsed\"&gt;ask&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v4qystc4\"&gt;theia ask&lt;/code&gt; почти всегда вызывает модель.&lt;/strong&gt; Если в хранилище есть хоть один факт или прогон, ответ идёт через модель.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Настройка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t49j0onh\"&gt;memory.sentenceGraph&lt;/code&gt; со значением &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rn9dkgmp\"&gt;h0&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a2hawoc9\"&gt;h1&lt;/code&gt; отключает векторный поиск.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jcfiln7x\"&gt;eval swebl&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2j5r0teb\"&gt;eval memory&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vh3fbwl8\"&gt;eval demo create&lt;/code&gt; — инструменты разработчиков платформы.&lt;/strong&gt; Они скачивают данные, вызывают модели и ждут путей из среды разработки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"config\"&gt;&lt;a href=\"ru/about/limitations.html#config\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройки и ключи&lt;/span&gt;&lt;/a&gt;Настройки и ключи&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Настройки объединяются только на один уровень.&lt;/strong&gt; Разделы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h9zvxlst\"&gt;gateway.routing&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x0vco2nm\"&gt;gateway.models&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bpww9xoz\"&gt;gateway.embeddings&lt;/code&gt; из настроек проекта целиком заменяют такие же разделы из пользовательских настроек.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Ошибка в настройках называет раздел, а не ключ&lt;/strong&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-klvp27i3\"&gt;spec.run: unrecognized_keys&lt;/code&gt;. Опечатка в имени роли внутри &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iuybp9b8\"&gt;routing&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4p39luiu\"&gt;models&lt;/code&gt; молча игнорируется.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Неверный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kdtbhb1z\"&gt;policy.yaml&lt;/code&gt; ломает все команды, кроме &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-772nspzl\"&gt;theia doctor&lt;/code&gt;.&lt;/strong&gt; Он печатает все свои строки, а ошибку прячет в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l135p603\"&gt;embeddings : FAIL (policy unreadable: …)&lt;/code&gt;. См. &lt;a href=\"ru/troubleshooting.html#invalid-manifest\"&gt;Решение проблем&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/reference/doctor.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-te18ngbd\"&gt;theia doctor&lt;/code&gt;&lt;/a&gt; не показывает маршруты и модели.&lt;/strong&gt; Он смотрит только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-odhzuiu1\"&gt;.theia&lt;/code&gt; в текущей папке и пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hi2vluxq\"&gt;docker ready&lt;/code&gt;, даже если Docker не запущен. Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rcg87qc7\"&gt;lexical index : FAIL&lt;/code&gt; не влияет на код выхода (видно по коду).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Поле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3tit5du6\"&gt;dataClasses&lt;/code&gt; у транспортов ни на что не влияет.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Детекторы секретов знают только пять видов данных&lt;/strong&gt;: закрытые ключи, API-ключи, номера карт, seed-фразы и адреса e-mail. API-ключи распознаются только по началу &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4ew5biz\"&gt;sk-&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8946u04y\"&gt;AKIA&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bkb8blgv\"&gt;ghp_&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g0mm3dbe\"&gt;gho_&lt;/code&gt;. Другие токены, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p3k9h6js\"&gt;github_pat_…&lt;/code&gt;, детекторы не замечают.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Текст задачи с заблокированным секретом сохраняется в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bpda1fmf\"&gt;.theia/store.db&lt;/code&gt; как есть&lt;/strong&gt;, хотя в модель он не уходит.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t3vi59cg\"&gt;gateway.harnessConfig&lt;/code&gt; работает только для Codex.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Правила и скиллы из поставки Theia код не читает.&lt;/strong&gt; Настройка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kff5lfs6\"&gt;run.rulesSoT&lt;/code&gt; скрывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t81zbxoh\"&gt;AGENTS.md&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l6ircs4r\"&gt;CLAUDE.md&lt;/code&gt; от движка, но не вставляет их в запросы.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Бюджет считает вызовы Claude по прайс-листу&lt;/strong&gt;, даже при работе по подписке (видно по коду).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"integrations\"&gt;&lt;a href=\"ru/about/limitations.html#integrations\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интеграции&lt;/span&gt;&lt;/a&gt;Интеграции&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Хуки, строка статуса и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rdipvu2s\"&gt;.mcp.json&lt;/code&gt; ссылаются на файл конкретной версии&lt;/strong&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1t918y6b\"&gt;…/releases/0.2.201/theia&lt;/code&gt;), а не на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j3gpqrmb\"&gt;~/.local/bin/theia&lt;/code&gt;. После обновления Claude Code и Codex продолжают запускать старую версию. Повторный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mtfd4v9i\"&gt;theia hooks install claude&lt;/code&gt; добавляет второй набор хуков, а путь не исправляет. Замените путь на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0hu03i59\"&gt;~/.local/bin/theia&lt;/code&gt; или удалите старые записи и установите хуки заново — см. &lt;a href=\"ru/integrations/claude-code.html#after-update\"&gt;Claude Code&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a8ll6adh\"&gt;hooks uninstall&lt;/code&gt; нет.&lt;/strong&gt; Интеграции снимаются вручную. Шаги описаны на страницах &lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt; и &lt;a href=\"ru/integrations/git.html\"&gt;Git&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Хук &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5qrcpd15\"&gt;Stop&lt;/code&gt; в Claude Code срабатывает после каждого ответа.&lt;/strong&gt; Каждый раз он сохраняет в память до 16 КБ переписки и не убирает повторы. Память проекта растёт. Чтобы это прекратить, удалите запись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wl69yuud\"&gt;Stop&lt;/code&gt; из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ep3oqgtu\"&gt;.claude/settings.json&lt;/code&gt;; повторная установка хуков вернёт её.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Скилл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8gxptdy\"&gt;/theia&lt;/code&gt; не управляет новым прогоном.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9q7zbp0d\"&gt;run_msg&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-59iwksdi\"&gt;run_stop&lt;/code&gt; не действуют на прогон, запущенный через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2xmxi4qt\"&gt;run_start&lt;/code&gt;, хотя отвечают, что всё доставлено. Вопросы такого прогона до Claude не доходят.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Прогон, убитый снаружи, по-прежнему показан как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7d246jfi\"&gt;live&lt;/code&gt;&lt;/strong&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6invzbpy\"&gt;run_list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fvyycla3\"&gt;run_status&lt;/code&gt; и строке статуса.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Codex получает урезанный MCP-сервер&lt;/strong&gt;: 5 инструментов, без управления прогонами и без скилла &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a6r7bc7a\"&gt;/theia&lt;/code&gt;. Сервер и хуки заработают только после двух подтверждений доверия в Codex.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/reference/hooks.html#hooks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7e04mu4t\"&gt;theia hooks install git&lt;/code&gt;&lt;/a&gt; молча не работает, если в git задан &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f1d2qr9g\"&gt;core.hooksPath&lt;/code&gt;.&lt;/strong&gt; В связанном рабочем дереве git (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j182kxif\"&gt;git worktree&lt;/code&gt;) команда завершается ошибкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1td1x29s\"&gt;ENOTDIR&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Неверный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x6dzchbw\"&gt;.mcp.json&lt;/code&gt; прерывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dkxj6vg1\"&gt;theia hooks install claude&lt;/code&gt; на середине&lt;/strong&gt; с кодом 1.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"ru/reference/serve.html#serve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ey73o9r4\"&gt;theia serve --metrics&lt;/code&gt;&lt;/a&gt; слушает все сетевые интерфейсы.&lt;/strong&gt; Второй сервер на том же порту падает. На &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iu2ya7ih\"&gt;/metrics&lt;/code&gt; видны только счётчики самого сервера, а метрики прогонов уходят только через OTLP.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Стек наблюдаемости &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-asvk5r14\"&gt;ops/observability&lt;/code&gt; не входит в выпуск.&lt;/strong&gt; Он есть только в исходном репозитории. Панель Grafana с метрикой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h2o00hg9\"&gt;theia_pii_total&lt;/code&gt; всегда пуста.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fzq003g2\"&gt;run_start&lt;/code&gt; с неверным идентификатором плана оставляет пустую ветку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jv4e0nte\"&gt;theia/run-*&lt;/code&gt;.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Нет создания pull request, отправки веток (push), интеграций со Slack, вебхуками и Jira.&lt;/strong&gt; Azure DevOps есть только как текстовый файл в поставке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"ru/about/limitations.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;См. также&lt;/span&gt;&lt;/a&gt;См. также&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/troubleshooting.html\"&gt;Решение проблем&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/about/platforms.html\"&gt;Системы и режимы работы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/about/limitations.html","hreflang":"en"},{"href":"ru/about/limitations.html","hreflang":"ru"}],"style":["_assets/theia.css","_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"canonical":"ru/about/limitations.html","vcsPath":"ru/about/limitations.md"},"headings":[{"title":"Системы","href":"ru/about/limitations.html#platforms","level":2},{"title":"Установка и обновление","href":"ru/about/limitations.html#install","level":2},{"title":"Прогоны","href":"ru/about/limitations.html#runs","level":2},{"title":"Экран TUI","href":"ru/about/limitations.html#tui","level":2},{"title":"Индекс кода, память и вопросы","href":"ru/about/limitations.html#knowledge","level":2},{"title":"Настройки и ключи","href":"ru/about/limitations.html#config","level":2},{"title":"Интеграции","href":"ru/about/limitations.html#integrations","level":2},{"title":"См. также","href":"ru/about/limitations.html#see-also","level":2}],"title":"Ограничения версии 0.2.201"},"router":{"pathname":"ru/about/limitations","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/ru/index.html","tags":[]}}
