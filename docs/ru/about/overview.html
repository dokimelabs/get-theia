        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Theia выполняет задачи по коду силами нескольких ИИ-агентов. Вы описываете задачу словами. Theia пишет код в копии репозитория, проверяет и рецензирует его, а результат складывает в отдельную git-ветку.&lt;/p&gt;\n&lt;p&gt;Полное название платформы — Aletheia. Команда — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ixilpwz\"&gt;theia&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"what-it-does\"&gt;&lt;a href=\"ru/about/overview.html#what-it-does\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что умеет Theia&lt;/span&gt;&lt;/a&gt;Что умеет Theia&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Выполняет задачу по коду: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y7hv0mmj\"&gt;theia run&lt;/code&gt;. Работа идёт в копии репозитория, ваша текущая ветка не меняется.&lt;/li&gt;\n&lt;li&gt;Составляет план перед работой: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9mqu5n7r\"&gt;theia plan&lt;/code&gt;. План можно прочитать, попросить исправить и одобрить.&lt;/li&gt;\n&lt;li&gt;Строит индекс кода — короткие карточки о каждом файле: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-03hv95b0\"&gt;theia index&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Хранит память проекта — факты и решения: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-50rq48jy\"&gt;theia mem&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Отвечает на вопросы по памяти, индексу и истории прогонов: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y91wr233\"&gt;theia ask&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Подключается к Claude Code и Codex через хуки и MCP-сервер.&lt;/li&gt;\n&lt;li&gt;Записывает каждый шаг в журнал событий. Журнал защищён цепочкой хешей, поэтому подмену видно.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;У Theia нет своей модели. Модели работают через CLI, установленные у вас: Claude Code (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lnuwed4t\"&gt;claude&lt;/code&gt;) или Codex (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-omt6ty13\"&gt;codex&lt;/code&gt;). В Theia их называют движками (&lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;). Какой движок и какая модель работают в каждой роли, задаёт файл настроек. Подробнее — в разделе &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"how-a-run-works\"&gt;&lt;a href=\"ru/about/overview.html#how-a-run-works\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как проходит прогон&lt;/span&gt;&lt;/a&gt;Как проходит прогон&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"ru/glossary.html#run\"&gt;Прогон&lt;/a&gt; (run) — одно выполнение задачи. Он идёт так:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Theia создаёт &lt;a href=\"ru/glossary.html#run-branch\"&gt;ветку прогона&lt;/a&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mcm1giju\"&gt;theia/run-…&lt;/code&gt;. Ветка начинается от базы: от upstream-ветки текущей ветки (например, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-63gv0v1b\"&gt;origin/main&lt;/code&gt;). Если upstream нет — от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p6gv0kid\"&gt;origin/HEAD&lt;/code&gt;, затем от локального &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uv4rfc7d\"&gt;HEAD&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Для каждой задачи Theia делает отдельную копию репозитория.&lt;/li&gt;\n&lt;li&gt;Исполнитель (&lt;a href=\"ru/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9on9gldc\"&gt;implementer&lt;/code&gt;&lt;/a&gt;) меняет файлы в копии. Коммиты делает сама Theia, а не модель.&lt;/li&gt;\n&lt;li&gt;Проверка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cs4ixl3q\"&gt;verify&lt;/code&gt;). Если вы передали команды в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d9r5spny\"&gt;--verify&lt;/code&gt;, Theia запускает их, и код выхода решает исход. Если команд нет, проверяет модель. Провал возвращает задачу исполнителю. После двух попыток исполнителя третью делает свежий исполнитель (&lt;a href=\"ru/glossary.html#fresh-implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3mv3pkvi\"&gt;fresh_implementer&lt;/code&gt;&lt;/a&gt;) с чистым контекстом. Третий провал подряд — это &lt;a href=\"ru/glossary.html#stop-and-fix\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t5rm6izh\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;: задача уходит к ведущему.&lt;/li&gt;\n&lt;li&gt;Рецензент (&lt;a href=\"ru/glossary.html#reviewer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dx4p9a4v\"&gt;reviewer&lt;/code&gt;&lt;/a&gt;) смотрит изменения: одобряет, просит доработать или отбрасывает.&lt;/li&gt;\n&lt;li&gt;Слияние (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jzt7zw4v\"&gt;merge&lt;/code&gt;). Theia обычным git сливает работу задачи в ветку прогона.&lt;/li&gt;\n&lt;li&gt;Если шаг не удался, арбитр (&lt;a href=\"ru/glossary.html#arbiter\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yuu2g6fl\"&gt;arbiter&lt;/code&gt;&lt;/a&gt;) решает: ещё одна попытка или передать задачу ведущему (&lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cze0mixp\"&gt;lead&lt;/code&gt;&lt;/a&gt;). Ведущий может перезапустить задачу с новым направлением, принять работу, перепроверить её, отбросить задачу или задать вопрос вам.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Каждый шаг задачи — это &lt;a href=\"ru/glossary.html#phase\"&gt;фаза&lt;/a&gt;. Роль отвечает на неё &lt;a href=\"ru/glossary.html#verdict\"&gt;вердиктом&lt;/a&gt; — коротким словом вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-allbykon\"&gt;verify_pass&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4q7ugdty\"&gt;approve&lt;/code&gt;. Упрощённая схема:&lt;/p&gt;\n&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20T%5B%22%D0%97%D0%B0%D0%B4%D0%B0%D1%87%D0%B0%22%5D%20--%3E%7Cfast_path%7C%20I%5B%22implement%22%5D%0A%20%20T%20--%3E%7Cfull_spec%7C%20P%5B%22plan%22%5D%0A%20%20P%20--%3E%7Cready%7C%20I%0A%20%20I%20--%3E%7Cready%7C%20V%5B%22verify%22%5D%0A%20%20V%20--%3E%7Cverify_pass%7C%20R%5B%22review%22%5D%0A%20%20V%20--%3E%7Cverify_fail%7C%20I%0A%20%20V%20--%3E%7Cstop_and_fix%7C%20E%0A%20%20R%20--%3E%7Capprove%7C%20M%5B%22merge%22%5D%0A%20%20M%20--%3E%7Cmerged%7C%20OK%5B%22merged%22%5D%0A%20%20R%20--%3E%7Crework%2C%20discard%7C%20A%5B%22arbitrate%22%5D%0A%20%20M%20--%3E%7Cmerge_fail%7C%20A%0A%20%20A%20--%3E%7Carb_continue%7C%20I%0A%20%20A%20--%3E%7Carb_escalate%7C%20E%5B%22escalated%22%5D%0A%20%20E%20--%3E%7Clead_rescope%7C%20I%0A%20%20E%20--%3E%7Clead_accept%7C%20M%0A%20%20E%20--%3E%7Clead_reverify%7C%20V%0A%20%20E%20--%3E%7Clead_discard%7C%20X%5B%22discarded%22%5D%0A\"&gt;&lt;/div&gt;&lt;p&gt;С какой фазы начнётся задача, задаёт &lt;a href=\"ru/glossary.html#track\"&gt;трек&lt;/a&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dwmckt35\"&gt;fast_path&lt;/code&gt; — по умолчанию. Задача сразу идёт к исполнителю.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ekidl59\"&gt;full_spec&lt;/code&gt; — сначала работает планировщик (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eulwnk5a\"&gt;planner&lt;/code&gt;), потом исполнитель.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"roles\"&gt;&lt;a href=\"ru/about/overview.html#roles\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роли&lt;/span&gt;&lt;/a&gt;Роли&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Роль&lt;/th&gt;\n&lt;th&gt;Кто работает&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mjtmm4xo\"&gt;lead&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;модель&lt;/td&gt;\n&lt;td&gt;Решает судьбу застрявшей задачи&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9s7aqfqa\"&gt;planner&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;модель&lt;/td&gt;\n&lt;td&gt;Разбивает работу на задачи: трек &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rm59ebmx\"&gt;full_spec&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u1ok6wb4\"&gt;theia plan&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ebcsstn7\"&gt;implementer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;модель&lt;/td&gt;\n&lt;td&gt;Меняет код в копии репозитория&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0eoserle\"&gt;fresh_implementer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;модель&lt;/td&gt;\n&lt;td&gt;Тот же исполнитель, но с чистым контекстом. Берёт задачу после двух попыток &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-syqzy836\"&gt;implementer&lt;/code&gt;. В выводе перед ним стоит отметка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gpkl2vdg\"&gt;!! anomaly fresh_perspective … dispatches=2&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k8le1q8j\"&gt;verifier&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;ваши команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vbvh2rwo\"&gt;--verify&lt;/code&gt; или модель&lt;/td&gt;\n&lt;td&gt;Проверяет результат&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xom0nohe\"&gt;reviewer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;модель&lt;/td&gt;\n&lt;td&gt;Одобряет, просит доработать или отбрасывает&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-id3avko4\"&gt;arbiter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;модель&lt;/td&gt;\n&lt;td&gt;Решает: продолжать или передать ведущему&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mz8dcmc3\"&gt;merger&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;сама Theia (git)&lt;/td&gt;\n&lt;td&gt;Сливает работу задачи в ветку прогона&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-818wf4pe\"&gt;indexer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;модель&lt;/td&gt;\n&lt;td&gt;Пишет карточки для индекса кода&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"where-results-go\"&gt;&lt;a href=\"ru/about/overview.html#where-results-go\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Куда попадает результат&lt;/span&gt;&lt;/a&gt;Куда попадает результат&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Работа прогона лежит в ветке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hf18j34n\"&gt;theia/run-&amp;lt;6 символов&amp;gt;&lt;/code&gt;. Ваша текущая ветка не меняется.&lt;/li&gt;\n&lt;li&gt;Забрать результат в свою ветку можно командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9j9rrqmj\"&gt;git merge&lt;/code&gt;. Как это сделать и почему &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-42knvopo\"&gt;git switch&lt;/code&gt; на ветку прогона не сработает, описано в разделе &lt;a href=\"ru/guides/first-task.html\"&gt;Первая задача&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;В конце прогона Theia печатает итог. Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gg00z86h\"&gt;halted: completed&lt;/code&gt; значит только, что работа закончилась. Задачи при этом могут быть отброшены. Смотрите исход каждой задачи: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yiooe3lw\"&gt;merged&lt;/code&gt; — работа слита, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-li5zn2js\"&gt;discarded&lt;/code&gt; — отброшена. Если в прогоне были &lt;a href=\"ru/glossary.html#anomaly\"&gt;аномалии&lt;/a&gt; — отметки вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-babjs1lm\"&gt;stop_and_fix&lt;/code&gt;, — строка получает хвост &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-avuywbk3\"&gt;· !! 2 anomalies&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"knowledge\"&gt;&lt;a href=\"ru/about/overview.html#knowledge\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индекс кода, память и вопросы&lt;/span&gt;&lt;/a&gt;Индекс кода, память и вопросы&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#intent-index\"&gt;Индекс кода&lt;/a&gt; — карточка на каждый файл: зачем он нужен, с чем связан, какие у него решения. Карточки пишет модель. Theia передаёт их агентам в каждом запросе как &lt;a href=\"ru/glossary.html#blueprint\"&gt;схему проекта&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#memory\"&gt;Память&lt;/a&gt; — короткие &lt;a href=\"ru/glossary.html#fact\"&gt;факты&lt;/a&gt; о проекте: решения, ограничения, договорённости. Факты не перезаписываются: новый факт заменяет старый, а старый остаётся в истории.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9b28n6wo\"&gt;theia ask&lt;/code&gt; отвечает на вопрос по памяти, индексу и последним прогонам и называет источники.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Подробнее — в разделе &lt;a href=\"ru/guides/knowledge.html\"&gt;Индекс кода, память и вопросы&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"cost\"&gt;&lt;a href=\"ru/about/overview.html#cost\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деньги и бюджет&lt;/span&gt;&lt;/a&gt;Деньги и бюджет&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Каждый запрос к модели — это &lt;a href=\"ru/glossary.html#gateway-call\"&gt;вызов шлюза&lt;/a&gt;. Theia записывает цену каждого вызова и складывает их.&lt;/li&gt;\n&lt;li&gt;У прогона есть &lt;a href=\"ru/glossary.html#budget\"&gt;бюджет&lt;/a&gt; в долларах США. По умолчанию — 10. Его меняет флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aqz8idh7\"&gt;--budget&lt;/code&gt;; значение &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p3n2f9xn\"&gt;0&lt;/code&gt; снимает лимит.&lt;/li&gt;\n&lt;li&gt;Когда бюджет кончается, прогон встаёт на паузу. Его можно продолжить с новым бюджетом.&lt;/li&gt;\n&lt;li&gt;Команды без обращения к модели ничего не стоят: например, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7feqmzg8\"&gt;theia show&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-beo6nq9l\"&gt;theia replay&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b0r56i3e\"&gt;theia index status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cpslmi9q\"&gt;theia mem add&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"where-data-lives\"&gt;&lt;a href=\"ru/about/overview.html#where-data-lives\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где хранятся данные&lt;/span&gt;&lt;/a&gt;Где хранятся данные&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"ru/glossary.html#store\"&gt;Хранилище&lt;/a&gt; — папка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-axkyzb1k\"&gt;.theia&lt;/code&gt;. В git-репозитории она лежит в корне рабочей копии.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Что&lt;/th&gt;\n&lt;th&gt;Где&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Журнал событий, планы, память, индекс&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lipgitx7\"&gt;.theia/store.db&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Настройки проекта&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ysvjsjmm\"&gt;.theia/config/&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Копии задач и ветка прогона&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m55u0vh9\"&gt;.theia/runs/&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Выводы команд проверки и другие файлы&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r5dwt23k\"&gt;.theia/objects/&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Theia сама добавляет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-968nqtf0\"&gt;.theia/&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lnwu8ndw\"&gt;.gitignore&lt;/code&gt; при запуске прогона. Где окажется хранилище вне git-репозитория, описано в разделе &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"ru/about/overview.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;См. также&lt;/span&gt;&lt;/a&gt;См. также&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/about/platforms.html\"&gt;Системы и режимы работы&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/install/install.html\"&gt;Установка&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/guides/first-task.html\"&gt;Первая задача&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html\"&gt;Словарь терминов&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/about/overview.html","hreflang":"en"},{"href":"ru/about/overview.html","hreflang":"ru"}],"style":["_assets/theia.css"],"script":["_bundle/mermaid-extension.js"],"canonical":"ru/about/overview.html","vcsPath":"ru/about/overview.md"},"headings":[{"title":"Что умеет Theia","href":"ru/about/overview.html#what-it-does","level":2},{"title":"Как проходит прогон","href":"ru/about/overview.html#how-a-run-works","level":2},{"title":"Роли","href":"ru/about/overview.html#roles","level":2},{"title":"Куда попадает результат","href":"ru/about/overview.html#where-results-go","level":2},{"title":"Индекс кода, память и вопросы","href":"ru/about/overview.html#knowledge","level":2},{"title":"Деньги и бюджет","href":"ru/about/overview.html#cost","level":2},{"title":"Где хранятся данные","href":"ru/about/overview.html#where-data-lives","level":2},{"title":"См. также","href":"ru/about/overview.html#see-also","level":2}],"title":"Что такое Theia"},"router":{"pathname":"ru/about/overview","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/ru/index.html","tags":[]}}
