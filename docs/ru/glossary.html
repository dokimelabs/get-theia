2gq\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6n0ip2hz\"&gt;in flight&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"failed\"&gt;&lt;a href=\"ru/glossary.html#failed\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dgisij2j\"&gt;failed&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;В TUI — задача с итогом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bm0t286a\"&gt;discarded&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0o8fty6c\"&gt;tasks: … 1 failed&lt;/code&gt;. Отдельного итога &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p7we2y0c\"&gt;failed&lt;/code&gt; у задачи нет. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zzckaz3o\"&gt;(FAILED)&lt;/code&gt; в деталях строки — не удалось действие агента.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-omdptqpj\"&gt;tasks: 0 running · 0 done · 1 failed · anomalies 0&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8juvhl9s\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jeuhce5x\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"frozen\"&gt;&lt;a href=\"ru/glossary.html#frozen\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xoapbi1z\"&gt;frozen&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;В TUI — задача в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dpqkwy6y\"&gt;escalated&lt;/code&gt;, которая ждёт ведущего: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p7uf2jwl\"&gt;tasks: … 1 frozen&lt;/code&gt;, значок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3xbwqsv6\"&gt;◆&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a1o896kv\"&gt;tasks: 0 running · 0 done · 1 frozen · anomalies 6&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pd2m8v1v\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"pending\"&gt;&lt;a href=\"ru/glossary.html#pending\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ym2dewdj\"&gt;pending&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;В TUI — задача ждёт: её зависимости ещё не готовы (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8lvbg0wk\"&gt;blocked on tsk…&lt;/code&gt;) или прогон уже остановился, а задача не закончена. Значок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7oyv1tqx\"&gt;◌&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#blocked-on\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e8766knc\"&gt;blocked on&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blocked-on\"&gt;&lt;a href=\"ru/glossary.html#blocked-on\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gq9mzbhn\"&gt;blocked on&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Задача ждёт другие задачи: работа начнётся, когда они закончатся с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ol22glu7\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tiz5l9j6\"&gt;planned&lt;/code&gt;. В TUI это написано справа от задачи: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9djmjbi5\"&gt;blocked on tsk…x&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pending\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ize9sxpj\"&gt;pending&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z9hlwaqk\"&gt;plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"idx\"&gt;&lt;a href=\"ru/glossary.html#idx\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mvdcbga4\"&gt;idx ⚠N&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Подсказка в заголовке TUI: на момент открытия N записей индекса устарели или отсутствуют. Работать можно, но агенты видят неполную схему проекта.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aarpz8cc\"&gt;tasks: 0 running · 0 done · 1 failed · anomalies 0 · idx ⚠1&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qait0svg\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ctx\"&gt;&lt;a href=\"ru/glossary.html#ctx\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s14kpl8s\"&gt;ctx ⚠N&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Подсказка в заголовке TUI: N раз добавленный в запросы контекст оказался больше порога &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-weld5xa3\"&gt;run.contextAlertChars&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ii8s70ko\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"seek\"&gt;&lt;a href=\"ru/glossary.html#seek\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z8vdo4ki\"&gt;[@ event k/N]&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Позиция в журнале в заголовке TUI: вы смотрите событие k из N. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2sk4vgld\"&gt;· live&lt;/code&gt; — экран следует за идущим прогоном, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s2pm0ssl\"&gt;· head&lt;/code&gt; — последнее событие. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b1ahga2h\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt; клавиши &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c2ilptqn\"&gt;[&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ipfpwcp\"&gt;]&lt;/code&gt; перематывают журнал на одно событие, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ldxn0gms\"&gt;{&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5xgmcfd0\"&gt;}&lt;/code&gt; — на десять, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rey4jd71\"&gt;Home&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x3btlnau\"&gt;End&lt;/code&gt; — в начало и в конец, а дерево пересобирается на выбранный момент. После конца живого прогона эти клавиши двигают только счётчик; для перемотки откройте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bc8005wu\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n4bz2haq\"&gt;[@ event 22/22 · head]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e23fai41\"&gt;[@ event 21/22]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-ended\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gkk1550t\"&gt;run ended&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#head\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-43dkfm3d\"&gt;head&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6pcqndwy\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/tui/navigation.html\"&gt;Навигация и горячие клавиши&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"follow\"&gt;&lt;a href=\"ru/glossary.html#follow\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ypfqw3l4\"&gt;follow&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим слежения: курсор сам переходит к новой активности. Клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ujfrk9t\"&gt;f&lt;/code&gt; включает и выключает его, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h5d0z0fz\"&gt;F&lt;/code&gt; выбирает уровень: задача, раунд или инструмент.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j48wrw0v\"&gt;f follow:round&lt;/code&gt; в строке подсказок.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verbosity\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g924b2vj\"&gt;verbosity&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#keybar\"&gt;keybar&lt;/a&gt;, &lt;a href=\"ru/tui/navigation.html\"&gt;Навигация и горячие клавиши&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verbosity\"&gt;&lt;a href=\"ru/glossary.html#verbosity\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a806vd89\"&gt;verbosity&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Сколько деталей показывает дерево: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8kkqgkne\"&gt;0&lt;/code&gt; — только задачи и раунды (аномалии и указания видны всегда), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-diqaom12\"&gt;1&lt;/code&gt; — обычный вид, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-usms0w3y\"&gt;2&lt;/code&gt; — ещё строки вызовов и инструментов. Клавиши &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zkjgno0o\"&gt;+&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pq1b4ke3\"&gt;-&lt;/code&gt;. Theia запоминает выбор вместе с уровнем слежения в файле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bk2cskgk\"&gt;tui-state.json&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s3sa6lgx\"&gt;+/- verbosity=1&lt;/code&gt; в строке подсказок.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#follow\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-psnb22bc\"&gt;follow&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#keybar\"&gt;keybar&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"keybar\"&gt;&lt;a href=\"ru/glossary.html#keybar\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;keybar&lt;/span&gt;&lt;/a&gt;keybar&lt;/h3&gt;\n&lt;p&gt;Строка подсказок внизу TUI. Она показывает только клавиши, которые работают сейчас: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-847ds4uz\"&gt;move&lt;/code&gt; — курсор, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4wwapk9q\"&gt;fold&lt;/code&gt; — свернуть или раскрыть, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xs1yq47k\"&gt;zoom&lt;/code&gt; — детали (Enter), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qczt96r3\"&gt;pane&lt;/code&gt; — переключить панель (Tab), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xmzq2j72\"&gt;follow&lt;/code&gt; — слежение, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l0ius6zo\"&gt;err&lt;/code&gt; — к следующей ошибке, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7jh5abvg\"&gt;seek&lt;/code&gt; — перемотка, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dyugks6l\"&gt;wrap&lt;/code&gt; — перенос строки, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j1n66sez\"&gt;view&lt;/code&gt; — полный текст в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zzp9ziat\"&gt;$EDITOR&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xddt0hdu\"&gt;less&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cef67dwh\"&gt;verbosity&lt;/code&gt; — детали, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o2zkivvr\"&gt;steer&lt;/code&gt; — указание (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-agvmu7b2\"&gt;m&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d50x6k14\"&gt;prompt&lt;/code&gt; — запрос идущего вызова (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fkgojg7t\"&gt;p&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1qblcifg\"&gt;stop&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ihv031bh\"&gt;quit&lt;/code&gt; — клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-otsqjfh8\"&gt;q&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ips8mr8c\"&gt;?&lt;/code&gt; открывает полную справку.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h3d5r8qy\"&gt;↑↓ move • ←→ fold • ⏎ zoom • ⇥ pane • f follow • e err • [ ] seek • w wrap • v view • +/- verbosity=1 • ? • q quit&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#follow\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5e03clm3\"&gt;follow&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verbosity\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-51gx5n78\"&gt;verbosity&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8da5fve1\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fnr5jqzz\"&gt;detail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"ru/tui/navigation.html\"&gt;Навигация и горячие клавиши&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"detail\"&gt;&lt;a href=\"ru/glossary.html#detail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j7lxqq3d\"&gt;detail&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Панель деталей под деревом, открывается клавишей Enter. Она показывает всё о строке под курсором: вердикт с комментарием и доказательствами, вопросы, данные вызова, историю фаз задачи. У вердикта в сохранённом прогоне есть готовая команда ответвления &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vs05rly3\"&gt;theia fork &amp;lt;run&amp;gt; --at &amp;lt;evt&amp;gt;&lt;/code&gt;. Клавиша Tab переключает управление между деревом и панелью.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-axuxjktb\"&gt;┤ detail ├&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8biy56x6\"&gt;┤ tree · focus ├&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pz9tvjsm\"&gt;phases:&lt;/code&gt; в деталях задачи.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j5tn569a\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#keybar\"&gt;keybar&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blob\"&gt;&lt;a href=\"ru/glossary.html#blob\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lx4htil3\"&gt;blob&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Сохранённый полный текст обмена с моделью: запрос и ответ одного вызова. Theia хранит его отдельно от журнала событий, а в записи вызова оставляет ссылку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cdjebdby\"&gt;blobRef&lt;/code&gt;. В TUI клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3nb8podj\"&gt;v&lt;/code&gt; открывает текст выбранного вызова, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ywuuqsq\"&gt;p&lt;/code&gt; — запрос идущего вызова; оба пишут текст во временный файл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tv4njl3q\"&gt;theia-blob-&amp;lt;id&amp;gt;.txt&lt;/code&gt; и не удаляют его. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wv5n9hr1\"&gt;theia prune&lt;/code&gt; удаляет тексты, на которые больше никто не ссылается (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ux3s8jfg\"&gt;orphaned blobs&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3sq1a8sj\"&gt;blobRef: 62a278c5…&lt;/code&gt; в панели деталей, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1zgceon2\"&gt;no stored body for this row&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wqncgn3o\"&gt;blob absent (recorded elsewhere)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5kihg3nt\"&gt;no prompt blob for this call (blob store absent or content blocked)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5a97aa21\"&gt;14 orphaned blobs (0.0 MB)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yel72mqr\"&gt;theia prune&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wadix2ng\"&gt;detail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-acu6uvzn\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/tui/navigation.html#open-full-text\"&gt;Навигация и горячие клавиши&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"in-flight\"&gt;&lt;a href=\"ru/glossary.html#in-flight\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fl1jn7i4\"&gt;in flight&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Работа ещё идёт:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;на домашнем экране &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-noyupwhq\"&gt;⣽ run…  in flight&lt;/code&gt; — у прогона нет записи о конце или паузе; так же выглядит убитый прогон;&lt;/li&gt;\n&lt;li&gt;в TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gkuws9q5\"&gt;⋯ implementer tsk…x  call in flight… · 12s [0 tools]&lt;/code&gt; — вызов модели идёт прямо сейчас. Клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2elryal9\"&gt;p&lt;/code&gt; открывает его запрос, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pmsa0y8l\"&gt;no call in flight&lt;/code&gt; значит, что вызовов сейчас нет.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-orn2jzf9\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2yxu4rhq\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-ended\"&gt;&lt;a href=\"ru/glossary.html#run-ended\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jzjl0ezq\"&gt;run ended&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Прогон закончился, а TUI остаётся открытым, чтобы вы посмотрели дерево. Клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jdyn1njz\"&gt;q&lt;/code&gt; закрывает экран, после этого итог печатается в обычный терминал.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b84os9e2\"&gt;■ run ended — 1 discarded · browse the tree; q quits&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#tui\"&gt;TUI&lt;/a&gt;, &lt;a href=\"ru/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cgcivx9a\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#summary\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ta04f7md\"&gt;summary&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-doctor\"&gt;&lt;a href=\"ru/glossary.html#group-doctor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;theia doctor&lt;/span&gt;&lt;/a&gt;theia doctor&lt;/h2&gt;\n&lt;h3 id=\"doctor\"&gt;&lt;a href=\"ru/glossary.html#doctor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f1e7jrav\"&gt;doctor&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ddba4n4z\"&gt;theia doctor&lt;/code&gt; проверяет, готова ли машина: входы в движки, песочницу, поиск, эмбеддинги, личные настройки, хранилище, правила, хуки Codex и файлы поставки. Модель не вызывается. Каждая строка — это &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-koqmjcl1\"&gt;название : состояние&lt;/code&gt;. Код выхода 1, если есть учтённая ошибка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-db317ej2\"&gt;FAIL&lt;/code&gt;. Домашний экран показывает только проблемные строки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#unavailable\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-djmgwrav\"&gt;unavailable&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aqwu1sok\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#not-initialized\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y3ix2z0c\"&gt;not initialized&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/doctor.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o43exolf\"&gt;theia doctor&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"unavailable\"&gt;&lt;a href=\"ru/glossary.html#unavailable\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qrm8j0e6\"&gt;unavailable&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Возможность недоступна на этой машине, в скобках — причина. Само по себе это не ошибка. Например, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h8a9kq2g\"&gt;codex subscription : unavailable&lt;/code&gt; при работающем Claude Code — нормально.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iwsuecj4\"&gt;doctor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fxwfsqeg\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8aql180o\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fail\"&gt;&lt;a href=\"ru/glossary.html#fail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pf0dhul8\"&gt;FAIL&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Настоящая проблема. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1o87jgei\"&gt;theia doctor&lt;/code&gt; строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ju8kntbb\"&gt;harnesses&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rjcdq9j8\"&gt;embeddings&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0kgsdhkh\"&gt;vendor deliverables&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ocu4zbsy\"&gt;shell (git-bash)&lt;/code&gt; (только Windows) с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ofwd5eg\"&gt;FAIL&lt;/code&gt; дают код выхода 1, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0rhnhlql\"&gt;FAIL&lt;/code&gt; в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ro0v3pj0\"&gt;lexical index&lt;/code&gt; код выхода не меняет. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dkzehj1l\"&gt;theia index build&lt;/code&gt; строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jygbm6th\"&gt;FAIL &amp;lt;файл&amp;gt;: &amp;lt;причина&amp;gt;&lt;/code&gt; и счётчик &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ikfmjuo9\"&gt;N FAILED&lt;/code&gt; значат, что карточку для файла сделать не удалось.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6tjxs03k\"&gt;harnesses          : FAIL (neither codex nor claude is authenticated — one is required)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8e1vmoku\"&gt;index: 1/1 built · 1 FAILED · $0.0000 · 166.7/s&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7oaz4pox\"&gt;doctor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unavailable\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8xabh13s\"&gt;unavailable&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#failed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h021ck1o\"&gt;failed&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"not-initialized\"&gt;&lt;a href=\"ru/glossary.html#not-initialized\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l35k1i88\"&gt;not initialized&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fpf0mldz\"&gt;theia doctor&lt;/code&gt; это значит, что в текущей папке нет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vwgnrow5\"&gt;.theia&lt;/code&gt; со &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-30z57o98\"&gt;store.db&lt;/code&gt;. Doctor смотрит только текущую папку. Из подпапки проекта или для хранилища в папке пользователя он напишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5yrricyv\"&gt;not initialized (theia init)&lt;/code&gt;, хотя остальные команды хранилище найдут. Запускайте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ib0an0hz\"&gt;theia doctor&lt;/code&gt; из корня проекта.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s05kxowb\"&gt;.theia store       : not initialized (theia init)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#theia-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bz3pyveu\"&gt;.theia store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c60v84mg\"&gt;doctor&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"harnesses\"&gt;&lt;a href=\"ru/glossary.html#harnesses\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h9h1biln\"&gt;harnesses&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ncdrpvt9\"&gt;theia doctor&lt;/code&gt;, которая появляется, только когда нет входа ни в Codex, ни в Claude Code. Хватит входа в один из них.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-obhher7h\"&gt;harnesses          : FAIL (neither codex nor claude is authenticated — one is required)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#codex-subscription\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bm93uad1\"&gt;codex subscription&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#claude-code\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oy2a6psu\"&gt;claude code&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"codex-subscription\"&gt;&lt;a href=\"ru/glossary.html#codex-subscription\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xfrcs4aq\"&gt;codex subscription&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w47asr77\"&gt;theia doctor&lt;/code&gt;: выполнен ли вход в Codex CLI по подписке (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t1hqdqrd\"&gt;codex login&lt;/code&gt;). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0wk7130d\"&gt;unavailable&lt;/code&gt; значит, что входа нет или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83qdf7b1\"&gt;codex&lt;/code&gt; не установлен.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ajt1gr8b\"&gt;codex subscription : unavailable (harness-codex: not authenticated (codex login status: exit 1))&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3wxtapbh\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"claude-code\"&gt;&lt;a href=\"ru/glossary.html#claude-code\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ro6n9m35\"&gt;claude code&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3g2wbsyz\"&gt;theia doctor&lt;/code&gt;: выполнен ли вход в Claude Code по подписке. Ключ Anthropic API Theia для Claude Code не использует, поэтому вход по ключу здесь не засчитывается.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gppx31gy\"&gt;claude code        : ok&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jd5hffeq\"&gt;claude code        : unavailable (harness-claude: not logged in …)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-17s26qpn\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lexical-index\"&gt;&lt;a href=\"ru/glossary.html#lexical-index\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n9r9loif\"&gt;lexical index&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3k8c6ido\"&gt;theia doctor&lt;/code&gt;: загружается ли встроенная библиотека поиска по словам (tantivy). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6a88sqjo\"&gt;FAIL&lt;/code&gt; здесь значит сломанную установку, но код выхода не меняет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f0l79o30\"&gt;lexical index      : ok (tantivy binding loads)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zv6i3lxh\"&gt;doctor&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-store\"&gt;&lt;a href=\"ru/glossary.html#theia-store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-do934pep\"&gt;.theia store&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-41vj4ski\"&gt;theia doctor&lt;/code&gt;: есть ли хранилище в текущей папке. Значения: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uwqan0qf\"&gt;ok&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wwdmh59i\"&gt;not initialized (theia init)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#not-initialized\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bgk1q1v0\"&gt;not initialized&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ai-rules\"&gt;&lt;a href=\"ru/glossary.html#ai-rules\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-di6e88k3\"&gt;ai rules&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Какие файлы правил для ИИ найдены в проекте и как они попадают к модели: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7wzo6por\"&gt;(native·codex)&lt;/code&gt; — движок читает файл сам, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-39q9clue\"&gt;(injected)&lt;/code&gt; — Theia добавляет его через манифест &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-43084eig\"&gt;Context&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8hltr7bj\"&gt;none detected&lt;/code&gt; — таких файлов нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cgvd81c4\"&gt;ai rules           : none detected&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-096lavov\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d0eg2vvi\"&gt;ai rules: none detected&lt;/code&gt; после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o94k28t6\"&gt;theia init&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-slfwt7ai\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-rulessot\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4zs81rhh\"&gt;run.rulesSoT&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"codex-hooks\"&gt;&lt;a href=\"ru/glossary.html#codex-hooks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p3yqf6fn\"&gt;codex hooks&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uip190q1\"&gt;theia doctor&lt;/code&gt; о хуках Codex: включена ли функция хуков в самом Codex, доверен ли проект (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tpewxr2x\"&gt;gate 1&lt;/code&gt;) и есть ли файл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ku5182k0\"&gt;.codex/hooks.json&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sddkvyfd\"&gt;codex hooks        : feature stable/true; project NOT trusted (gate 1); hooks.json absent (theia hooks install codex)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gate-1\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ef8hmm6b\"&gt;gate 1&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-ids\"&gt;&lt;a href=\"ru/glossary.html#group-ids\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификаторы&lt;/span&gt;&lt;/a&gt;Идентификаторы&lt;/h2&gt;\n&lt;h3 id=\"run-id\"&gt;&lt;a href=\"ru/glossary.html#run-id\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1owrd0hp\"&gt;runId&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Идентификатор прогона: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a0l8bimu\"&gt;run&lt;/code&gt; и 22 символа, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7vpde0l4\"&gt;run2akdqb2i4k223pwvesbyig&lt;/code&gt;. У других объектов свои приставки: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1mvwkeip\"&gt;tsk&lt;/code&gt; — задача, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0zei6vpb\"&gt;pln&lt;/code&gt; — план, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lxpi995q\"&gt;fct&lt;/code&gt; — факт, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cnvfx2i7\"&gt;chk&lt;/code&gt; — кусок памяти, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0gc2tw15\"&gt;gen&lt;/code&gt; — поколение поиска. Идентификаторы растут со временем, поэтому их порядок совпадает с порядком создания. Команды принимают полный идентификатор или 22 символа без приставки.&lt;/p&gt;\n&lt;p&gt;Отдельной команды со списком прогонов нет. Идентификатор виден в начале прогона (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3fd7kvsn\"&gt;run run… task tsk…&lt;/code&gt;), в подсказке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-am0s9w03\"&gt;resume with:&lt;/code&gt;, на домашнем экране и в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ny74akr6\"&gt;theia audit verify&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#body\"&gt;body&lt;/a&gt;, &lt;a href=\"ru/glossary.html#short-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v9r0zoue\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#terryid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oh452irp\"&gt;terryid&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"body\"&gt;&lt;a href=\"ru/glossary.html#body\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;body&lt;/span&gt;&lt;/a&gt;body&lt;/h3&gt;\n&lt;p&gt;Идентификатор без приставки — 22 символа, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x2cf57hw\"&gt;2akdqb2i4k223pwvesbyig&lt;/code&gt;. В такой форме Theia печатает номера в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b7ha6ptg\"&gt;theia audit verify&lt;/code&gt;, в строках о связи ответвлений и в подсказке после первого Ctrl+C. Команды принимают и такую форму.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wtfs03fq\"&gt;2akdqb2i4k223pwvesbyig: intact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0omqbx6y\"&gt;forked from 2akdqb2i4k223pwvesbyig at bjr37ync&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qsbcfkfq\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#short-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-si1qahar\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"short-id\"&gt;&lt;a href=\"ru/glossary.html#short-id\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ux7t5od7\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Короткий номер — последние символы идентификатора для экрана: 8 символов в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8pglmod8\"&gt;--plain&lt;/code&gt;, на табло и в TUI (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-76utjkwi\"&gt;xk6rzynf&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iy9bs7s6\"&gt;tsk…xk6rzynf&lt;/code&gt;) и 6 символов в строках &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ckyth4h\"&gt;live&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2axjk80t\"&gt;tsk…6rzynf&lt;/code&gt;). Короткий хвост понимают только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-on0xplcs\"&gt;show --task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-70laqcfu\"&gt;msg --task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-df4a51gt\"&gt;fork --at&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zg5dwcok\"&gt;answer --question&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z3oamc3i\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#body\"&gt;body&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"terryid\"&gt;&lt;a href=\"ru/glossary.html#terryid\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dihpljmu\"&gt;terryid&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Название формата идентификаторов Theia. Слово встречается в ошибках, когда строку не удалось прочитать как идентификатор. Тексты два:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dcbiupw1\"&gt;terryid: neither a body nor a full id: '…'&lt;/code&gt; — аргумент короче полного идентификатора и не равен 22 символам после префикса. Так отвечают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v5556mor\"&gt;show&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r3j60km0\"&gt;diagnose&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wvrljalw\"&gt;msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vqrfyqpm\"&gt;replay&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jgtsird2\"&gt;fork&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yslgoej0\"&gt;mem asof&lt;/code&gt; на короткий хвост вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-392ceet9\"&gt;ovfyt3&lt;/code&gt; и на дату вместо идентификатора.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vvhpx9r4\"&gt;terryid: malformed id '…'&lt;/code&gt; — строка похожа на идентификатор по длине, но это не он. В 0.2.201 так отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6vkku4ah\"&gt;theia run --from-plan&lt;/code&gt;, если после флага стоит не идентификатор плана.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Правильный по форме, но чужой идентификатор даёт другую ошибку: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-utfg3ado\"&gt;&amp;lt;команда&amp;gt;: no events for &amp;lt;id&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-os3xajnt\"&gt;terryid: neither a body nor a full id: 'ovfyt3'&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hcwlusho\"&gt;terryid: malformed id '--plain'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sn2cxs93\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#asof\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-husojzmj\"&gt;asof&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"digest\"&gt;&lt;a href=\"ru/glossary.html#digest\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;digest&lt;/span&gt;&lt;/a&gt;digest&lt;/h3&gt;\n&lt;p&gt;Отпечаток — хеш SHA-256 содержимого. Одинаковое содержимое даёт одинаковый отпечаток, любое изменение — другой. Так Theia помечает план (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8v4b6a3x\"&gt;digest fce3554ee5e2…&lt;/code&gt;), вставленный файл (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3gig9ubf\"&gt;sha256 bc70e26f40b8&lt;/code&gt;), вывод команд проверки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4bu51bak\"&gt;test_run 74d0…&lt;/code&gt;) и файлы поставки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nldkonj9\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nj7xfgqc\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#test-run\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g9eylws6\"&gt;test_run&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-internal\"&gt;&lt;a href=\"ru/glossary.html#group-internal\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Внутренние коды&lt;/span&gt;&lt;/a&gt;Внутренние коды&lt;/h2&gt;\n&lt;h3 id=\"the-codes\"&gt;&lt;a href=\"ru/glossary.html#the-codes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-85kqihky\"&gt;THE-…&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Номера внутренних правил разработки Theia в скобках в конце сообщений об ошибках. Смысл сообщения — в тексте перед скобкой, сам номер можно не замечать. Чаще других встречаются:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zu1uugir\"&gt;THE-005&lt;/code&gt; — цепочка аудита прогона нарушена: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-27f01it0\"&gt;resume&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-drox2w30\"&gt;fork&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uhepnm72\"&gt;probe&lt;/code&gt; отказываются работать с таким прогоном (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rr7qh7bo\"&gt;… chain BROKEN at &amp;lt;событие&amp;gt; — refusing to … a tampered run (THE-005)&lt;/code&gt;), а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6weuy37j\"&gt;theia audit verify&lt;/code&gt; пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xq3ubdd2\"&gt;BROKEN&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ahz2m0ny\"&gt;THE-013&lt;/code&gt; — Claude Code настроен на API-ключ, а Theia принимает только вход по подписке (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wyvxyvd8\"&gt;API-key fallback is refused — THE-013&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m403sdtc\"&gt;THE-014&lt;/code&gt; — в запрос к модели попал секрет: файл через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1trpfmfb\"&gt;@путь&lt;/code&gt; в тексте задачи или плана (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0r14tu4n\"&gt;@key.pem: prohibited content (pem_private_key) — this file cannot enter a model prompt (THE-014)&lt;/code&gt;) либо сам текст запроса (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e4mbr0i1\"&gt;gateway: prohibited content (api_key) — call blocked (THE-014)&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cvmb4r03\"&gt;THE-024&lt;/code&gt; — кончился денежный бюджет прогона или команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ocefdhm5\"&gt;ask&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a6xrighg\"&gt;usd budget exhausted for this run (THE-024)&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-beykgb7a\"&gt;THE-065&lt;/code&gt; — не найдены или повреждены файлы поставки с промптами ролей (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7oa5oq3o\"&gt;no vendor deliverables found … (THE-065)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6v4twt50\"&gt;vendor prompts broken … (THE-065)&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#ticket-codes\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-te2ql625\"&gt;R5&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gv7vpfi4\"&gt;T-W&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g4nfpx08\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget-exhausted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nwkt9lbq\"&gt;budget_exhausted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#vendor\"&gt;vendor deliverables&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ticket-codes\"&gt;&lt;a href=\"ru/glossary.html#ticket-codes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;,&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ku5mffe8\"&gt;R5&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g6d515jx\"&gt;T-W&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Номера внутренних задач и разделов проектной документации в справке и сообщениях: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c2qq0j7k\"&gt;(R5)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iqgmeokx\"&gt;(R11)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-num8ylk1\"&gt;— T-W&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ui5yshn\"&gt;(F6)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8oz3t8wx\"&gt;docs/10 §4&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-964ht7tv\"&gt;docs/13&lt;/code&gt;. Это ссылки для разработчиков платформы, их можно не замечать. Так же относитесь к слову &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b9jg83hk\"&gt;receipt&lt;/code&gt; в тексте справки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#the-codes\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-26wfcso7\"&gt;THE-…&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ambiguous\"&gt;&lt;a href=\"ru/glossary.html#ambiguous\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Слова с несколькими значениями&lt;/span&gt;&lt;/a&gt;Слова с несколькими значениями&lt;/h2&gt;\n&lt;p&gt;Одно слово в выводе Theia может значить разное. Что именно, видно по месту, где оно стоит. У каждого такого слова есть своя статья:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#note\"&gt;note&lt;/a&gt; — служебная заметка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rujayehb\"&gt;task.note&lt;/code&gt;, ваше указание &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-32z5sfux\"&gt;user.note&lt;/code&gt;, комментарий роли, просьба к плану, ответ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bbqx4afy\"&gt;noted — …&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-77tt391p\"&gt;live&lt;/code&gt;&lt;/a&gt; — строки хода работы в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4m1q63ld\"&gt;--plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hc354lx2\"&gt;· live&lt;/code&gt; в заголовке TUI, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e5s109ay\"&gt;(live; …)&lt;/code&gt; при продолжении, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jzf3pk44\"&gt;N live&lt;/code&gt; в строке статуса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#session\"&gt;session&lt;/a&gt; — сессия движка, режим &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zwyus9u4\"&gt;--sessions&lt;/code&gt;, хук &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mza0f4cc\"&gt;SessionStart&lt;/code&gt;, метки кусков переписки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zvnh670p\"&gt;verify&lt;/code&gt;&lt;/a&gt; — фаза, флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-43tq4rcs\"&gt;--verify&lt;/code&gt;, команда проверки пункта плана, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1mqpuifh\"&gt;lead_reverify&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6c6adjdl\"&gt;draft&lt;/code&gt;&lt;/a&gt; — фаза новой задачи и статус неодобренного плана.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#done\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4bg9dbs\"&gt;done&lt;/code&gt;&lt;/a&gt; — счётчик &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dx9ovkrk\"&gt;N done&lt;/code&gt; в TUI и недостижимая фаза &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m72yc2w7\"&gt;done&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt; — деньги прогона, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3xjdp8c\"&gt;halted: budget&lt;/code&gt; (вердикты, не деньги), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1nxk1i3c\"&gt;round_budget&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wovj55m3\"&gt;rescope_budget&lt;/code&gt;, свои лимиты у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cn9i0mxe\"&gt;fork&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zxitfu3m\"&gt;probe&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lrkx12xq\"&gt;ask&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t5ljre6e\"&gt;index build&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt; — копия задачи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ydm7l3xb\"&gt;ws-&amp;lt;task&amp;gt;&lt;/code&gt;, манифест &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83y1y46z\"&gt;kind: Workspace&lt;/code&gt;, папка проекта, режим &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tey7pxqn\"&gt;workspace-write&lt;/code&gt; у Codex.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt; — корень проекта, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ti5q16d3\"&gt;root:&amp;lt;имя&amp;gt;&lt;/code&gt; в памяти, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-folf66fl\"&gt;worktree root&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a4vp5coi\"&gt;root cause&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#scope\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i1nbqmxx\"&gt;scope&lt;/code&gt;&lt;/a&gt; — часть памяти, уровень настроек, имя цепочки в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9pulw9so\"&gt;audit verify&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#head\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8o6ntx6\"&gt;head&lt;/code&gt;&lt;/a&gt; — возраст поколения поиска, последнее событие в TUI, коммит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k2kivyqg\"&gt;HEAD&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vc7lq9xf\"&gt;plan&lt;/code&gt;&lt;/a&gt; — сохранённый план и фаза &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ac525yc\"&gt;plan&lt;/code&gt; трека &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zfr61y9g\"&gt;full_spec&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#ready\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6iwwxupy\"&gt;ready&lt;/code&gt;&lt;/a&gt; — одно событие для трёх переходов: в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zhv1x9j3\"&gt;implement&lt;/code&gt; для новой задачи, в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5tmht72b\"&gt;implement&lt;/code&gt; после планировщика, в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4zrb5fhf\"&gt;verify&lt;/code&gt; после исполнителя. Тот же смысл имеют &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n9lbo3x0\"&gt;docker ready&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w9dxws3p\"&gt;theia doctor&lt;/code&gt; (есть команда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5kc9q3b8\"&gt;docker&lt;/code&gt;) и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t3704g0h\"&gt;ready at …&lt;/code&gt; у эмбеддингов (модель скачана).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8bp0mxlf\"&gt;merge&lt;/code&gt;&lt;/a&gt; и &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-swl73ojn\"&gt;merged&lt;/code&gt;&lt;/a&gt; — фаза слияния и итог задачи; &lt;a href=\"ru/glossary.html#discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i9eug9b6\"&gt;discard&lt;/code&gt;&lt;/a&gt; и &lt;a href=\"ru/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fel8vx4z\"&gt;discarded&lt;/code&gt;&lt;/a&gt; — вердикт рецензента и итог задачи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-87i5bavl\"&gt;FAIL&lt;/code&gt;&lt;/a&gt; и &lt;a href=\"ru/glossary.html#failed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ws5tfaia\"&gt;failed&lt;/code&gt;&lt;/a&gt; — проблема в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j7zjywuz\"&gt;theia doctor&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ljxxt8e2\"&gt;index build&lt;/code&gt;, счётчик отброшенных задач в TUI, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oq8u1n1o\"&gt;(FAILED)&lt;/code&gt; у действия агента.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"misleading\"&gt;&lt;a href=\"ru/glossary.html#misleading\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обманчивые статусы&lt;/span&gt;&lt;/a&gt;Обманчивые статусы&lt;/h2&gt;\n&lt;p&gt;Слова, которые выглядят как оценка, но ей не являются. Проверяйте то, что стоит рядом.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#completed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7sfck8qx\"&gt;completed&lt;/code&gt;&lt;/a&gt; не значит «успех»: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gdlv4ekm\"&gt;halted: completed&lt;/code&gt; пишется и когда все задачи отброшены, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bomiupgw\"&gt;theia run&lt;/code&gt; при этом возвращает код 1. Смотрите исход каждой задачи: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-drl6vcwx\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9w6gj17r\"&gt;discarded&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#glyphs\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6kojkl5o\"&gt;✔&lt;/code&gt;&lt;/a&gt; — «не плохое событие», а не «хороший итог». Раунды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rd2n1j3x\"&gt;lead → lead_discard&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j9vaq76u\"&gt;arbiter → arb_escalate&lt;/code&gt; тоже отмечены &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7mbevi9l\"&gt;✔&lt;/code&gt;, и прогон без единого слияния показан как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9u5wvyr3\"&gt;✔ completed&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9znbcjkn\"&gt;halted: budget&lt;/code&gt;&lt;/a&gt; — не деньги, а потолок в 1000 вердиктов. Когда кончаются деньги, итог — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cp3smsqj\"&gt;halted: paused&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#running\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-96rz6f27\"&gt;running&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7j8lihyu\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a3r2y39o\"&gt;N live&lt;/code&gt;&lt;/a&gt; — так выглядит и прогон, убитый без паузы: у него просто нет записи о конце. Продолжите его (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-naem394t\"&gt;--resume&lt;/code&gt;) или закройте (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0hnez51o\"&gt;--abandon&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xmhkv2dp\"&gt;noted — this run appears live …&lt;/code&gt; от &lt;a href=\"ru/glossary.html#steering\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ky2pqwyn\"&gt;theia msg&lt;/code&gt;&lt;/a&gt; не значит, что указание дойдёт: новый прогон не читает указания из других процессов, читает только продолженный через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lysx4cl6\"&gt;--resume&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9n6ocm7p\"&gt;resuming run … (finished; …)&lt;/code&gt; — &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a3f1jjdy\"&gt;--resume&lt;/code&gt;&lt;/a&gt; продолжает и закрытый прогон (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q94h9dkl\"&gt;halted: abandoned&lt;/code&gt;). Слово в скобках — состояние по журналу, а не разрешение.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jrw0h74x\"&gt;&amp;lt;имя&amp;gt;: intact&lt;/code&gt; от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-muc55dwi\"&gt;theia audit verify&lt;/code&gt; для несуществующей области — &lt;a href=\"ru/glossary.html#audit-chain\"&gt;цепочка&lt;/a&gt; цела, потому что проверять нечего.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-54eay3gn\"&gt;superseded &amp;lt;old&amp;gt; -&amp;gt; &amp;lt;new&amp;gt;&lt;/code&gt; от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ufvrr8bo\"&gt;theia mem supersede&lt;/code&gt; — &lt;a href=\"ru/glossary.html#supersede\"&gt;замена&lt;/a&gt; записана, даже если нового идентификатора не существует.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oevpjr7q\"&gt;docker ready&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e9vy6d14\"&gt;theia doctor&lt;/code&gt; — есть команда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a7vq8r5q\"&gt;docker&lt;/code&gt;, а не работающий Docker. См. &lt;a href=\"ru/glossary.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f5du9brt\"&gt;jail&lt;/code&gt;&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jzgzlvmf\"&gt;(injected)&lt;/code&gt; в строке &lt;a href=\"ru/glossary.html#ai-rules\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eszuszw6\"&gt;ai rules&lt;/code&gt;&lt;/a&gt; — файл правил найден на диске, а не то, что он попадёт в запрос: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4viqbfqg\"&gt;theia doctor&lt;/code&gt; не читает записи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nyibxhzx\"&gt;Context&lt;/code&gt;. Верьте строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lmmn5o6d\"&gt;context injected: …&lt;/code&gt;
