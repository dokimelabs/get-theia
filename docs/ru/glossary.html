role=\"button\" tabindex=\"0\" id=\"inline-code-id-sllppgtj\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ic2wkqf\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;W:&lt;/strong&gt; &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vr4oksxc\"&gt;Workspace&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt; · &lt;a href=\"ru/glossary.html#workspace-home\"&gt;workspace home&lt;/a&gt; · &lt;a href=\"ru/glossary.html#task-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ajv3znsh\"&gt;[workspace_base]&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#workspaces-yaml\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vteq4t52\"&gt;workspaces.yaml&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#trunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y8owqbpw\"&gt;worktree&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b5nls9qs\"&gt;worktree root&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#workspace\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kv8lxt1s\"&gt;ws-&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;X:&lt;/strong&gt; &lt;a href=\"ru/glossary.html#x-release\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6o9je5a3\"&gt;--x-release&lt;/code&gt;&lt;/a&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"group-runs\"&gt;&lt;a href=\"ru/glossary.html#group-runs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прогоны и задачи&lt;/span&gt;&lt;/a&gt;Прогоны и задачи&lt;/h2&gt;\n&lt;h3 id=\"run\"&gt;&lt;a href=\"ru/glossary.html#run\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run&lt;/span&gt;&lt;/a&gt;run&lt;/h3&gt;\n&lt;p&gt;Прогон — одно выполнение задачи или плана командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n9koqak6\"&gt;theia run&lt;/code&gt;. У прогона есть идентификатор &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-74e0wze5\"&gt;run…&lt;/code&gt;, бюджет, журнал событий и своя git-ветка. В конце Theia печатает итог: исход каждой задачи, строку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-11i2xiua\"&gt;halted:&lt;/code&gt; и проверку журнала.&lt;/p&gt;\n&lt;p&gt;Где встречается: строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2tdumfvb\"&gt;run run… task tsk… (fast_path)&lt;/code&gt; в начале прогона, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u64mdnkk\"&gt;halted: completed · 4 gateway calls · $0.0000&lt;/code&gt;, список &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l8q8w5cw\"&gt;recent runs:&lt;/code&gt; на домашнем экране.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-38f11eml\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#task\"&gt;task&lt;/a&gt;, &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-icct2aao\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/guides/first-task.html\"&gt;Первая задача&lt;/a&gt;, &lt;a href=\"ru/reference/run.html#run\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2jakjuve\"&gt;theia run&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"task\"&gt;&lt;a href=\"ru/glossary.html#task\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;task&lt;/span&gt;&lt;/a&gt;task&lt;/h3&gt;\n&lt;p&gt;Задача — одна единица работы внутри прогона. Её идентификатор начинается с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pmmaukaw\"&gt;tsk&lt;/code&gt;. Прогон с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a2l2dn1s\"&gt;--task&lt;/code&gt; создаёт одну задачу, прогон по плану — по задаче на каждый пункт плана. На треке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bpuvkh0b\"&gt;full_spec&lt;/code&gt; планировщик может разбить задачу на подзадачи. У каждой задачи своя фаза, раунды, копия репозитория и итог: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4835bhc0\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7sm62v3d\"&gt;discarded&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-brxtzb52\"&gt;task.created  xk6rzynf [fast_path] …&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zc9v8rz7\"&gt;tsk… → discarded (6 rounds) …&lt;/code&gt;, строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hxchhnaz\"&gt;tsk…xk6rzynf&lt;/code&gt; на табло и в TUI.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#brief\"&gt;brief&lt;/a&gt;, &lt;a href=\"ru/glossary.html#phase\"&gt;phase&lt;/a&gt;, &lt;a href=\"ru/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"ru/glossary.html#short-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-92snu9rt\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"brief\"&gt;&lt;a href=\"ru/glossary.html#brief\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;brief&lt;/span&gt;&lt;/a&gt;brief&lt;/h3&gt;\n&lt;p&gt;Текст задачи (brief) — то, что вы передаёте в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lykpqfz1\"&gt;--task&lt;/code&gt; или через стандартный ввод: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xfknqigh\"&gt;echo \"…\" | theia run&lt;/code&gt;. В текст можно вставить файл через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bpdoyy3e\"&gt;@&lt;/code&gt;. Theia сохраняет текст в хранилище как есть, даже если вызов модели потом заблокирован. Не пишите в нём ключи и пароли.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tfx7ltpk\"&gt;theia run --task \"…\"&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a5e62b7o\"&gt;theia plan --task \"…\"&lt;/code&gt;, строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b9clvajb\"&gt;task.created&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z1mpxrgg\"&gt;--plain&lt;/code&gt;, строка с текстом задачи в дереве TUI.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7z1u3r85\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#task\"&gt;task&lt;/a&gt;, &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"file-inclusion\"&gt;&lt;a href=\"ru/glossary.html#file-inclusion\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fux2gsf3\"&gt;@path&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вставка файла через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-op1tbxi7\"&gt;@&lt;/code&gt;. Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r9tdrt88\"&gt;@путь&lt;/code&gt; в тексте задачи Theia заменяет на имя файла, а содержимое файла добавляет в конец текста блоком с заголовком &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w3u3mjxm\"&gt;--- file: &amp;lt;путь&amp;gt; (sha256 …, N chars) ---&lt;/code&gt;. Работает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x9mx6d3d\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m39rsd4q\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-drrvi09b\"&gt;msg&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8igxq63m\"&gt;probe&lt;/code&gt;, но не в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4gw81bz9\"&gt;ask&lt;/code&gt;. Путь считается от текущей папки. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kmghesc8\"&gt;@@&lt;/code&gt; даёт обычный символ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rkcs7lf2\"&gt;@&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пути, которые начинаются с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uepq34fm\"&gt;/&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yhleuudg\"&gt;./&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0dd568x2\"&gt;../&lt;/code&gt;, не вставляются: слово остаётся в тексте без ошибки. Файл с секретом, например с закрытым ключом, не пройдёт: команда остановится с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yjzhkk8u\"&gt;prohibited content&lt;/code&gt;. Адреса почты в файле заменяются на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d6ib4w8j\"&gt;[EMAIL]&lt;/code&gt;, а в заголовке блока появится &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z4tj35li\"&gt;masked email×1&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: заголовок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t91hcn2s\"&gt;--- file: README.md (sha256 bc70e26f40b8, 7 chars) ---&lt;/code&gt;, ошибка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xk6jzmw5\"&gt;run: @file: no such file 'nope.md' (…)&lt;/code&gt;, событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ee1p43dy\"&gt;task.note [file_ref]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#brief\"&gt;brief&lt;/a&gt;, &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yb1c6nsp\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/commands.html#argument-rules\"&gt;Общие правила разбора аргументов&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"track\"&gt;&lt;a href=\"ru/glossary.html#track\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;track&lt;/span&gt;&lt;/a&gt;track&lt;/h3&gt;\n&lt;p&gt;Трек — с какой фазы начинается задача. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z0uewbad\"&gt;fast_path&lt;/code&gt; (короткий путь) сразу отдаёт задачу исполнителю. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nrrmtsyj\"&gt;full_spec&lt;/code&gt; (полная спецификация) сначала запускает планировщика. Трек задаёт флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eddvmk2r\"&gt;--track&lt;/code&gt;, по умолчанию — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ea4h8y6\"&gt;fast_path&lt;/code&gt;. Одобрение плана нужно только в цепочке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-df9ngbep\"&gt;theia plan&lt;/code&gt; → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mfjsrqfy\"&gt;theia run --from-plan&lt;/code&gt;: прогон с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0anfir5j\"&gt;--track full_spec&lt;/code&gt; одобрения не ждёт.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s36wcvw8\"&gt;run.created … track=fast_path&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2okuqnkh\"&gt;task.created … [full_spec] …&lt;/code&gt;, строка задачи в TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tosqaquk\"&gt;tsk…x [fast_path]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fast-path\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-leusg78t\"&gt;fast_path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xs3iy8xu\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2wh70k06\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#track-override\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tfnlrqz1\"&gt;track override&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fast-path\"&gt;&lt;a href=\"ru/glossary.html#fast-path\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cbzsww4b\"&gt;fast_path&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Трек короткого пути: задача сразу идёт в фазу &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e7focvoj\"&gt;implement&lt;/code&gt;, без планировщика. Это трек по умолчанию. Подходит для небольших правок.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sjumflx6\"&gt;--track fast_path&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5a2bxjy8\"&gt;task.phase … ready → implement&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-deuoxs16\"&gt;[fast_path]&lt;/code&gt; в строках задач.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7l4bae9x\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-75xxb6pe\"&gt;implement&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"full-spec\"&gt;&lt;a href=\"ru/glossary.html#full-spec\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zgabs438\"&gt;full_spec&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Трек полной спецификации: задача начинается с фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1fha04fa\"&gt;plan&lt;/code&gt;. Планировщик (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pgzpn8rv\"&gt;planner&lt;/code&gt;) продумывает работу и может разбить её на подзадачи, потом работает исполнитель. Первая строка такой задачи — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ujb4kk6g\"&gt;task.phase … start → plan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ek67en23\"&gt;--track full_spec&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-44022dfx\"&gt;[full_spec]&lt;/code&gt; в строках задач, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qtt6i81w\"&gt;r1 plan  planner → ready&lt;/code&gt; в TUI.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planner\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-117sj1js\"&gt;planner&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wcw717pe\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-simnabt6\"&gt;planned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"round\"&gt;&lt;a href=\"ru/glossary.html#round\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;round&lt;/span&gt;&lt;/a&gt;round&lt;/h3&gt;\n&lt;p&gt;Раунд — один шаг задачи: одна роль отработала и вынесла вердикт. В TUI раунды пронумерованы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9i7kazif\"&gt;r1&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pfb3s3kc\"&gt;r2&lt;/code&gt;…, в итоге прогона стоит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lfyposus\"&gt;(6 rounds)&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4tlxdpts\"&gt;rounds=N&lt;/code&gt; в строках &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2x4mlth0\"&gt;run.finished&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bcfm3k8x\"&gt;run.paused&lt;/code&gt; — сумма вердиктов по всем задачам прогона.&lt;/p&gt;\n&lt;p&gt;Лимит — 10 раундов на задачу: параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q9ozch84\"&gt;run.maxRoundsPerTask&lt;/code&gt; или флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c1nyunfs\"&gt;--max-rounds&lt;/code&gt;, где &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b9bwtzvw\"&gt;0&lt;/code&gt; снимает лимит. Когда лимит исчерпан, появляется аномалия &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fiovqlrg\"&gt;round_budget&lt;/code&gt;, и задача уходит к ведущему. Пересмотр задачи (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-upr2oqwp\"&gt;rescope&lt;/code&gt;) обнуляет счётчик лимита, но номера раундов в выводе продолжают расти.&lt;/p&gt;\n&lt;p&gt;Где встречается: TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bq51muwy\"&gt;r4 merge  merger → merge_fail&lt;/code&gt;, табло &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-48u1pyar\"&gt;r6&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fzg16xfl\"&gt;tsk… → discarded (6 rounds)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-663y4821\"&gt;run.finished  halted=completed rounds=6&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verdict\"&gt;verdict&lt;/a&gt;, &lt;a href=\"ru/glossary.html#round-budget\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ggpw8c8j\"&gt;round_budget&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#rescope\"&gt;rescope&lt;/a&gt;, &lt;a href=\"ru/glossary.html#phase\"&gt;phase&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"event-log\"&gt;&lt;a href=\"ru/glossary.html#event-log\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;event log&lt;/span&gt;&lt;/a&gt;event log&lt;/h3&gt;\n&lt;p&gt;Журнал событий — список всего, что произошло в прогоне: создание задач, смены фаз, вердикты, вызовы модели, аномалии, указания. Он хранится в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pr4wlqz9\"&gt;.theia/store.db&lt;/code&gt;. Каждое событие хранит отпечаток предыдущего, поэтому подмену видно. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bn2t3ain\"&gt;--plain&lt;/code&gt; печатает журнал по строке на событие, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tklee3a4\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt; показывает его после прогона.&lt;/p&gt;\n&lt;p&gt;Строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ksuuu9rs\"&gt;live&lt;/code&gt; в журнал не попадают. Чтобы сохранить весь вывод с подробностями в файл, задайте переменную &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9lk9bn8k\"&gt;THEIA_LOG_FILE&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pdyimxl7\"&gt;--plain&lt;/code&gt; вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eqnezhf8\"&gt;x5dhtxgs task.note     [workspace_base]&lt;/code&gt;, команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hp28xsag\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l5c4yy5z\"&gt;theia replay&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-91c9hs98\"&gt;theia audit verify&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-egg8wa3r\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rprxusqi\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-log-file\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5r5u4g2x\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ke7wblj\"&gt;replay&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"note\"&gt;&lt;a href=\"ru/glossary.html#note\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;note&lt;/span&gt;&lt;/a&gt;note&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1nuba79e\"&gt;note&lt;/code&gt; у Theia значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0n5dv4y0\"&gt;task.note&lt;/code&gt; — служебная заметка в журнале; в скобках её источник, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nem2eiws\"&gt;[workspace_base]&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xiw8m2s4\"&gt;[post_run_maintenance]&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6f5vz79p\"&gt;user.note&lt;/code&gt; — ваше указание или ответы на вопросы: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yevzea63\"&gt;user.note [msg] …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmfv5t0x\"&gt;user.note [clarify] …&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Текст в кавычках “…” после вердикта — короткий комментарий роли.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9n7t6lts\"&gt;note:&lt;/code&gt; в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kknhi76h\"&gt;theia plan show&lt;/code&gt; — ваша просьба об изменениях плана.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fkfaj6n7\"&gt;noted — …&lt;/code&gt; — ответ команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l9eehona\"&gt;theia msg&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7pgyy6xk\"&gt;note &amp;lt;source&amp;gt;&lt;/code&gt; — строка служебной заметки в дереве TUI.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#task-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m0qp7yf4\"&gt;task.note&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-87gxer0h\"&gt;user.note&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verdict\"&gt;verdict&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"live\"&gt;&lt;a href=\"ru/glossary.html#live\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-elklsm81\"&gt;live&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ltcrxi98\"&gt;live&lt;/code&gt; у Theia значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7g32821a\"&gt;live&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wl09oamj\"&gt;--plain&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k3h3spcs\"&gt;live ⏱ implementer tsk…6rzynf call started&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p1i8bu84\"&gt;live ↻ … retry …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0r750212\"&gt;live $ …&lt;/code&gt;. Это подсказки о ходе работы. В журнал они не пишутся, поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1gokr76e\"&gt;theia show --plain&lt;/code&gt; их не показывает.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ju7228qk\"&gt;[@ event 21/21 · live]&lt;/code&gt; в заголовке TUI — экран следует за идущим прогоном.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hbfo38ve\"&gt;(live; …)&lt;/code&gt; в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3llctfa8\"&gt;resuming run …&lt;/code&gt; — в журнале нет ни конца прогона, ни паузы: прогон прервали без паузы.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-575d7s01\"&gt;N live&lt;/code&gt; в строке статуса и на домашнем экране — число прогонов без записи о конце или паузе. Сюда попадают и убитые прогоны.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cki0b6ka\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o3sk1nlg\"&gt;--resume&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#statusline\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8kv0fljp\"&gt;statusLine&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wy6kz2hs\"&gt;in flight&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"sigma\"&gt;&lt;a href=\"ru/glossary.html#sigma\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ih9nwo59\"&gt;sigma&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Σ (sigma) — общие заметки прогона, которые Theia передаёт ролям в каждом запросе: ваши указания, ответы на уточняющие вопросы, направление ведущего после пересмотра задачи. Theia собирает их из журнала событий. Каждый вызов модели начинается заново, а из прошлых раундов роль получает эти заметки, замечания рецензента и итог проверки.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0lcnw8tn\"&gt;sigma: {}&lt;/code&gt; в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-owqjffqu\"&gt;theia replay&lt;/code&gt;, строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kj7lk10t\"&gt;sigma         keys: …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2t9d22xe\"&gt;--plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0sjzucpq\"&gt;sessions: sigma-shared&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-shrrdbl0\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lc4tvezi\"&gt;replay&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#session\"&gt;session&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"session\"&gt;&lt;a href=\"ru/glossary.html#session\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;session&lt;/span&gt;&lt;/a&gt;session&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oz2x73va\"&gt;session&lt;/code&gt; у Theia значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Сессия движка — чат внутри Claude Code или Codex. Theia хранит только её номер (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2uo3ppsf\"&gt;sessionId&lt;/code&gt;) в деталях вызова.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9hr2xfxh\"&gt;--sessions&lt;/code&gt; и строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9kea8a2e\"&gt;sessions: sigma-shared&lt;/code&gt; — экспериментальный режим: общая часть запроса идёт первой, а Theia записывает её отпечаток (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i3ql64ui\"&gt;task.note [session_prefix]&lt;/code&gt;). Это не продолжение чата. По умолчанию режим выключен (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i4bzdxek\"&gt;run.sessionContinuity: off&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nflfu5vc\"&gt;SessionStart&lt;/code&gt; — событие хука Claude Code и Codex, на котором Theia добавляет контекст (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h54my6g9\"&gt;theia mem context&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ycw6u4qg\"&gt;compact-checkpoint&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-68q57qv0\"&gt;session-final&lt;/code&gt; — метки кусков переписки, которые сохраняют хуки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#sigma\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v0qikhmt\"&gt;sigma&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#checkpoint\"&gt;checkpoint&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"non-interactive\"&gt;&lt;a href=\"ru/glossary.html#non-interactive\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rff2z8qf\"&gt;--non-interactive&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n0klw7th\"&gt;--non-interactive&lt;/code&gt;: прогон ни о чём не спрашивает. Экран TUI не открывается, вместо него работает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9q5rv9uu\"&gt;--plain&lt;/code&gt;. Если роль задаст уточняющий вопрос, задача замрёт в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fb3wh8mz\"&gt;escalated&lt;/code&gt;, а не будет ждать ответа. Подходит для скриптов, CI и запуска в фоне.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fthsikih\"&gt;view: --tui is interactive; --non-interactive degrades to --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jwfaj5ai\"&gt;theia run … --non-interactive&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sd3ttjzw\"&gt;theia plan --non-interactive&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4szijenx\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3nx2f1h1\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#tui\"&gt;TUI&lt;/a&gt;, &lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-log-file\"&gt;&lt;a href=\"ru/glossary.html#theia-log-file\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-61090pzs\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Переменная окружения с путём к файлу. Прогон дописывает туда каждую строку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ynuc5uew\"&gt;--plain&lt;/code&gt; вместе с полными данными события (строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j7rattp9\"&gt;⤷ {…}&lt;/code&gt;) и строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t8ns1iqb\"&gt;live&lt;/code&gt;. Это работает и при открытом TUI, поэтому файл можно смотреть из другого терминала командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7hqt8r5\"&gt;tail -f&lt;/code&gt;. В 0.2.201 очень короткие прогоны, меньше секунды, могут оставить файл пустым.&lt;/p&gt;\n&lt;p&gt;Где встречается: строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ql1w3be\"&gt;# theia run run… — &amp;lt;время&amp;gt;&lt;/code&gt; в начале файла, ошибка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8j79cuh7\"&gt;THEIA_LOG_FILE: … — logging disabled&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-re3dd4ru\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/environment.html\"&gt;Переменные окружения&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-roles\"&gt;&lt;a href=\"ru/glossary.html#group-roles\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роли&lt;/span&gt;&lt;/a&gt;Роли&lt;/h2&gt;\n&lt;h3 id=\"role\"&gt;&lt;a href=\"ru/glossary.html#role\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;role&lt;/span&gt;&lt;/a&gt;role&lt;/h3&gt;\n&lt;p&gt;Роль — вид работы агента в прогоне: планировать, писать код, проверять, рецензировать, сливать, решать спор. Роль — не модель. Какой движок и какая модель работают в роли, задаёт маршрутизация (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-839qwxru\"&gt;gateway.routing&lt;/code&gt;). В выводе встречаются роли &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q2jvcy8c\"&gt;lead&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-di7agzde\"&gt;planner&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j1udnr4j\"&gt;implementer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xbnz0day\"&gt;fresh_implementer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nzlip2at\"&gt;verifier&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zoriq1di\"&gt;reviewer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-perzxn9j\"&gt;merger&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6wuu96d0\"&gt;arbiter&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-221f4u40\"&gt;indexer&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-age2vg7a\"&gt;none&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Ещё две роли есть в настройках, но в выводе прогона не видны: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-16xstoxk\"&gt;extractor&lt;/code&gt; пишет сводки памяти в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fpxkvj4n\"&gt;theia mem maintain --llm&lt;/code&gt;, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a7s38c7q\"&gt;diagnostician&lt;/code&gt; в 0.2.201 не используется — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rt95jedz\"&gt;theia diagnose&lt;/code&gt; работает без модели.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t6rjsaa2\"&gt;verdict … reviewer → approve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rk59ltdh\"&gt;gateway implementer@&amp;lt;transport&amp;gt; → ok&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8otlp7by\"&gt;live ⏱ lead tsk… call started&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hjs9styz\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/about/overview.html#roles\"&gt;Роли&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lead\"&gt;&lt;a href=\"ru/glossary.html#lead\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cq8dfl9z\"&gt;lead&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ведущий (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ipugb2a0\"&gt;lead&lt;/code&gt;) — роль, которая решает судьбу застрявшей задачи в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sdi9l0nm\"&gt;escalated&lt;/code&gt;. Варианты: пересмотреть задачу и дать новое направление (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-82w4apbk\"&gt;lead_rescope&lt;/code&gt;), принять работу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z7umgme5\"&gt;lead_accept&lt;/code&gt;), проверить ещё раз (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-buu5n04u\"&gt;lead_reverify&lt;/code&gt;), отбросить задачу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-liqghtqh\"&gt;lead_discard&lt;/code&gt;) или задать вопрос вам (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xjii32r1\"&gt;clarify&lt;/code&gt;). Ведущий работает по одной задаче за раз.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6ycb2ni\"&gt;verdict … lead → lead_discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ho3enu0y\"&gt;gateway lead@&amp;lt;transport&amp;gt;&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xr1xxsyr\"&gt;r6 escalated  lead → lead_discard&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o89kfx0w\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#rescope\"&gt;rescope&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead-accept\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a07jcl6y\"&gt;lead_accept&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead-discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lzskhaan\"&gt;lead_discard&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1snrhf3m\"&gt;clarify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"planner\"&gt;&lt;a href=\"ru/glossary.html#planner\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1euk8xns\"&gt;planner&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Планировщик (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bxtzrhib\"&gt;planner&lt;/code&gt;) — роль, которая продумывает работу. Он работает в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zxui6gr9\"&gt;plan&lt;/code&gt; у задач трека &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uktrecqu\"&gt;full_spec&lt;/code&gt; и в команде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4t1cxrlr\"&gt;theia plan&lt;/code&gt;. Отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j7ujdut6\"&gt;planned&lt;/code&gt; с подзадачами, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7z008as6\"&gt;ready&lt;/code&gt; (можно писать код) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ju862gp\"&gt;clarify&lt;/code&gt; (нужен ваш ответ).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4qypkzu\"&gt;verdict … planner → ready&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v7jaktro\"&gt;r1 plan  planner → ready&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-309k3sap\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqui2bl4\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-he15wg3i\"&gt;planned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2u6iz09m\"&gt;clarify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"implementer\"&gt;&lt;a href=\"ru/glossary.html#implementer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqrp89p3\"&gt;implementer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Исполнитель (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uodn8mco\"&gt;implementer&lt;/code&gt;) — роль, которая пишет код. Работает в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qd30awt8\"&gt;implement&lt;/code&gt;, в отдельной копии репозитория. Отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a7wz0xl2\"&gt;ready&lt;/code&gt; (готово), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5f6e29wg\"&gt;cant_do&lt;/code&gt; (не может) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oq0vxbtr\"&gt;algedonic&lt;/code&gt; (серьёзная проблема). Коммиты делает сама Theia, а не модель.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uaohr2nl\"&gt;verdict … implementer → ready (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ge5kut4i\"&gt;live ⏱ implementer tsk… call started&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tigmx4q7\"&gt;implement&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fresh-implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jhgxe9j4\"&gt;fresh_implementer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fresh-implementer\"&gt;&lt;a href=\"ru/glossary.html#fresh-implementer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7x9kux5v\"&gt;fresh_implementer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Свежий исполнитель — второй исполнитель, который берётся за задачу заново. После двух попыток в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v0thz0sq\"&gt;implement&lt;/code&gt; (параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bh1ew56s\"&gt;run.freshPerspectiveAfter&lt;/code&gt;) Theia отдаёт задачу ему и пишет аномалию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zwm6jjtw\"&gt;fresh_perspective&lt;/code&gt;. Он не видит заметок прежних попыток, но видит ваши указания и замечания рецензента. Если у него нет своей строки в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i53boii3\"&gt;gateway.routing&lt;/code&gt;, он работает через тот же транспорт, что и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4glqmvy4\"&gt;implementer&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2pobhhuj\"&gt;!! anomaly    fresh_perspective taskId=… dispatches=2&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-94jdhqzj\"&gt;gateway fresh_implementer@&amp;lt;transport&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t9joav3n\"&gt;implementer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fresh-perspective\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c56cvz1w\"&gt;fresh_perspective&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1bu947vx\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verifier\"&gt;&lt;a href=\"ru/glossary.html#verifier\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-42bjj81z\"&gt;verifier&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Проверяющий (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hdwfdsdy\"&gt;verifier&lt;/code&gt;) — роль фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5tnyqh1o\"&gt;verify&lt;/code&gt;. Если вы передали команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nirtcd3u\"&gt;--verify&lt;/code&gt;, работу проверяют сами команды: Theia запускает их, и код выхода решает исход, модель не вызывается. Без команд проверяет модель. Проверяющий отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-00nbuw98\"&gt;pass&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-arrf6pxh\"&gt;fail&lt;/code&gt;, а в выводе это события &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rei0wnwk\"&gt;verify_pass&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kks81oto\"&gt;verify_fail&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f14dth1q\"&gt;verdict … verifier → verify_pass (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3bh9flpt\"&gt;verifier → verify_fail (1 evidence)  “$ false → exit 1 (no output)”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zlhyi4k7\"&gt;verify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-08p1p00p\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lylrbok6\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stop-and-fix\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yfaqllc1\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"reviewer\"&gt;&lt;a href=\"ru/glossary.html#reviewer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7gk5u2gs\"&gt;reviewer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Рецензент (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-okuioz7p\"&gt;reviewer&lt;/code&gt;) — роль фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tjr6s1ho\"&gt;review&lt;/code&gt;. Он смотрит изменения задачи и отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h6vvnbqt\"&gt;approve&lt;/code&gt; (принять, дальше слияние), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k2dmy9hj\"&gt;rework&lt;/code&gt; (доработать) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-we6kgfwk\"&gt;discard&lt;/code&gt; (отклонить). После &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y4p7y3gz\"&gt;rework&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5a1a5pr\"&gt;discard&lt;/code&gt; задача идёт к арбитру, а не отбрасывается сразу.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wrn81c2j\"&gt;verdict … reviewer → approve (1 evidence)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#review\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3wk9d20k\"&gt;review&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#approve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7wrxmft2\"&gt;approve&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#rework\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fyma78fl\"&gt;rework&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wbb8dpah\"&gt;discard&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"arbiter\"&gt;&lt;a href=\"ru/glossary.html#arbiter\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rxv3yqpb\"&gt;arbiter&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Арбитр (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u1aa4zum\"&gt;arbiter&lt;/code&gt;) — роль фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qndboasi\"&gt;arbitrate&lt;/code&gt;. Решает, что делать после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xexrh0p2\"&gt;rework&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lcumen9m\"&gt;discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5d7k3c3k\"&gt;merge_fail&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8m9rubzs\"&gt;cant_do&lt;/code&gt;: ещё одна попытка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gv4r5ahf\"&gt;arb_continue&lt;/code&gt;, назад к исполнителю) или передать задачу ведущему (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ppjl3a9p\"&gt;arb_escalate&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q5wep5bz\"&gt;verdict … arbiter → arb_escalate (1 evidence)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zyf19za7\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arb-continue\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-68g9648k\"&gt;arb_continue&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arb-escalate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j3qaqo98\"&gt;arb_escalate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ogcj7w3\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"merger\"&gt;&lt;a href=\"ru/glossary.html#merger\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ac7w98e7\"&gt;merger&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Роль слияния (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yrnhiezp\"&gt;merger&lt;/code&gt;) — шаг фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ugxboqkv\"&gt;merge&lt;/code&gt;. Это не модель: сама Theia обычным git сливает ветку задачи в ветку прогона (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cxeksbg3\"&gt;git merge --no-ff&lt;/code&gt;). Ответ — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3e14p4s2\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zom4wn1j\"&gt;merge_fail&lt;/code&gt;. Слияния идут по одному.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7w6mrukf\"&gt;verdict … merger → merged (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e9d1is1f\"&gt;merger → merge_fail (1 evidence)  “no commits on the task branch”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-09b7oler\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mimwom36\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merge-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmnuzcwm\"&gt;merge_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/glossary.html#precheck\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7uom88yj\"&gt;precheck&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"indexer\"&gt;&lt;a href=\"ru/glossary.html#indexer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v38vpl2w\"&gt;indexer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Индексатор (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nsq2cmu6\"&gt;indexer&lt;/code&gt;) — роль, которая пишет записи индекса кода: короткую карточку на каждый файл. Работает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-99m23ct2\"&gt;theia index build&lt;/code&gt; и при автоматической сборке индекса. Её вызовы не входят в прогон.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yi8k1cdn\"&gt;theia index build&lt;/code&gt;, строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lq9lwbe5\"&gt;indexer: claude-index&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-60ybkwzp\"&gt;policy.yaml&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;, &lt;a href=\"ru/glossary.html#index-entry\"&gt;index entry&lt;/a&gt;, &lt;a href=\"ru/reference/index-cmd.html#index-build\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-25qez3h7\"&gt;theia index build&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"none\"&gt;&lt;a href=\"ru/glossary.html#none\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9sj5s4t7\"&gt;none&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gfy4458c\"&gt;none&lt;/code&gt; — роль разового вопроса без задачи. Так работают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w3j2wqma\"&gt;theia probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qqz2ugmn\"&gt;theia ask&lt;/code&gt;. Маршрут для неё берётся из строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m5mkgxa8\"&gt;\"*\"&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ada8q1is\"&gt;gateway.routing&lt;/code&gt;, если нет своей строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ptf2fza\"&gt;none&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4wl56chn\"&gt;gateway none@&amp;lt;transport&amp;gt; → ok&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4c5e9ilo\"&gt;theia show &amp;lt;id&amp;gt; --plain&lt;/code&gt; для записи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qllygsj2\"&gt;probe&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i1bby6ur\"&gt;ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ln7mxatr\"&gt;probe&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kabdtxwo\"&gt;ask&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uagtc9mz\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-phases\"&gt;&lt;a href=\"ru/glossary.html#group-phases\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фазы задачи&lt;/span&gt;&lt;/a&gt;Фазы задачи&lt;/h2&gt;\n&lt;h3 id=\"phase\"&gt;&lt;a href=\"ru/glossary.html#phase\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;phase&lt;/span&gt;&lt;/a&gt;phase&lt;/h3&gt;\n&lt;p&gt;Фаза — шаг, на котором сейчас задача. Рабочие фазы: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-368l8zke\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k87rpqfb\"&gt;implement&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-73akpc65\"&gt;verify&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9pb8e6py\"&gt;review&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1vyvukgh\"&gt;merge&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gy99vajf\"&gt;arbitrate&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-588o7xdh\"&gt;escalated&lt;/code&gt;. Итоговые: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rwib1gah\"&gt;merged&lt;/code&gt; (работа слита), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-juslirx1\"&gt;discarded&lt;/code&gt; (отброшена), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-az6jupcs\"&gt;planned&lt;/code&gt; (пункт-план с подзадачами). Смену фазы показывает строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1edsszj5\"&gt;task.phase &amp;lt;задача&amp;gt; &amp;lt;событие&amp;gt; → &amp;lt;фаза&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6v95pmlv\"&gt;task.phase    xk6rzynf ready → implement&lt;/code&gt;, колонка фазы на табло, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gf06js53\"&gt;discarded  r6&lt;/code&gt; в строке задачи TUI.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-471nghrr\"&gt;implement&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m1rq9nw7\"&gt;verify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#review\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7xeb49c8\"&gt;review&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ovno82h2\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sp6iom4u\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-urpmax83\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x32xmvzt\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l2jnbdxg\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#task-phase\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f7nuy5q7\"&gt;task.phase&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/about/overview.html#how-a-run-works\"&gt;Как проходит прогон&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"draft\"&gt;&lt;a href=\"ru/glossary.html#draft\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mb1sirr1\"&gt;draft&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У слова два смысла:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Фаза новой задачи. Задача сразу уходит из неё в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n7m0azja\"&gt;plan&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wopksoco\"&gt;implement&lt;/code&gt;, поэтому в выводе её почти не видно.&lt;/li&gt;\n&lt;li&gt;Статус плана: план создан или изменён и ещё не одобрен. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-570iuhmq\"&gt;theia run --from-plan&lt;/code&gt; такой план не запустит.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-als7rqfr\"&gt;pln… [draft] 2 tasks — …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nj5iv56z\"&gt;theia plan list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1c9hbsaw\"&gt;context added — NEW digest …, status draft (re-approval required)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iizj6t3w\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#approved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ck5mhsxc\"&gt;approved&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#phase\"&gt;phase&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"implement\"&gt;&lt;a href=\"ru/glossary.html#implement\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lf8165i6\"&gt;implement&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Фаза, в которой исполнитель пишет код в копии репозитория задачи. Из неё задача идёт в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eo4xq419\"&gt;verify&lt;/code&gt; (событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0mbntly5\"&gt;ready&lt;/code&gt;), к арбитру (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gridl81t\"&gt;cant_do&lt;/code&gt;) или к ведущему (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-plnw6cbn\"&gt;algedonic&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s898aqki\"&gt;no_progress&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hw8aow6c\"&gt;task.phase … ready → implement&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p9t4hw62\"&gt;r1 implement  implementer → ready&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ubb6md2h\"&gt;implementer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2d3vhua2\"&gt;verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verify\"&gt;&lt;a href=\"ru/glossary.html#verify\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tkwjezzg\"&gt;verify&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У слова несколько смыслов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Фаза проверки после исполнителя.&lt;/li&gt;\n&lt;li&gt;Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0eef778k\"&gt;--verify \"&amp;lt;команда&amp;gt;\"&lt;/code&gt;, его можно указать несколько раз. Theia запускает команды по очереди в копии задачи через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kmdq0eoj\"&gt;bash -lc&lt;/code&gt;, и код выхода решает исход. Команды работают прямо на вашей машине, не в песочнице, с лимитом 5 минут на каждую. Без команд проверяет модель.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zjhyd4iu\"&gt;✓ &amp;lt;команда&amp;gt;&lt;/code&gt; в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-apmybo3l\"&gt;theia plan show&lt;/code&gt; — своя команда проверки у пункта плана.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b7spfwbm\"&gt;lead_reverify&lt;/code&gt; — ведущий просит проверить ещё раз.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-05rrfrqm\"&gt;--plain&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3c61t86\"&gt;--cli&lt;/code&gt; первый Ctrl+C из терминала убивает и работающую команду проверки. Theia записывает это как провал: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5s3dw2i0\"&gt;verify_fail&lt;/code&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qwy66eqh\"&gt;exit null&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-on75ad95\"&gt;task.phase … ready → verify&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ozodnkke\"&gt;verdict … verifier → verify_fail (1 evidence)  “$ false → exit 1 (no output)”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verifier\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aba1w18s\"&gt;verifier&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xeyjm7lh\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e33f6oyn\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stop-and-fix\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lrvl8bju\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead-rever
