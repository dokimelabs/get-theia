role=\"button\" tabindex=\"0\" id=\"inline-code-id-n6qnzvt6\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fh43zrsg\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;W:&lt;/strong&gt; &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q2jrldy0\"&gt;Workspace&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt; · &lt;a href=\"ru/glossary.html#workspace-home\"&gt;workspace home&lt;/a&gt; · &lt;a href=\"ru/glossary.html#task-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mzz2kbvr\"&gt;[workspace_base]&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#workspaces-yaml\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gj5vnjug\"&gt;workspaces.yaml&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#trunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hj4cgkr1\"&gt;worktree&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gig3m8be\"&gt;worktree root&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#workspace\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9n9a21tf\"&gt;ws-&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;X:&lt;/strong&gt; &lt;a href=\"ru/glossary.html#x-release\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q1lq10su\"&gt;--x-release&lt;/code&gt;&lt;/a&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"group-runs\"&gt;&lt;a href=\"ru/glossary.html#group-runs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прогоны и задачи&lt;/span&gt;&lt;/a&gt;Прогоны и задачи&lt;/h2&gt;\n&lt;h3 id=\"run\"&gt;&lt;a href=\"ru/glossary.html#run\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run&lt;/span&gt;&lt;/a&gt;run&lt;/h3&gt;\n&lt;p&gt;Прогон — одно выполнение задачи или плана командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ydmkxj6\"&gt;theia run&lt;/code&gt;. У прогона есть идентификатор &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4pb20fsy\"&gt;run…&lt;/code&gt;, бюджет, журнал событий и своя git-ветка. В конце Theia печатает итог: исход каждой задачи, строку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dwwqov25\"&gt;halted:&lt;/code&gt; и проверку журнала.&lt;/p&gt;\n&lt;p&gt;Где встречается: строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hqrtylfx\"&gt;run run… task tsk… (fast_path)&lt;/code&gt; в начале прогона, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-89w3gsap\"&gt;halted: completed · 4 gateway calls · $0.0000&lt;/code&gt;, список &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mkt4vuw8\"&gt;recent runs:&lt;/code&gt; на домашнем экране.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qgun8mqx\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#task\"&gt;task&lt;/a&gt;, &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qyrdbcz9\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/guides/first-task.html\"&gt;Первая задача&lt;/a&gt;, &lt;a href=\"ru/reference/run.html#run\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3fduqwv\"&gt;theia run&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"task\"&gt;&lt;a href=\"ru/glossary.html#task\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;task&lt;/span&gt;&lt;/a&gt;task&lt;/h3&gt;\n&lt;p&gt;Задача — одна единица работы внутри прогона. Её идентификатор начинается с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jvigqi5h\"&gt;tsk&lt;/code&gt;. Прогон с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-40achiy8\"&gt;--task&lt;/code&gt; создаёт одну задачу, прогон по плану — по задаче на каждый пункт плана. На треке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5w4vttwx\"&gt;full_spec&lt;/code&gt; планировщик может разбить задачу на подзадачи. У каждой задачи своя фаза, раунды, копия репозитория и итог: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ljoed4uw\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7lz4s7lx\"&gt;discarded&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2yzzqzz6\"&gt;task.created  xk6rzynf [fast_path] …&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hzfm1lzq\"&gt;tsk… → discarded (6 rounds) …&lt;/code&gt;, строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cip3my3k\"&gt;tsk…xk6rzynf&lt;/code&gt; на табло и в TUI.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#brief\"&gt;brief&lt;/a&gt;, &lt;a href=\"ru/glossary.html#phase\"&gt;phase&lt;/a&gt;, &lt;a href=\"ru/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"ru/glossary.html#short-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fctdbqb7\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"brief\"&gt;&lt;a href=\"ru/glossary.html#brief\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;brief&lt;/span&gt;&lt;/a&gt;brief&lt;/h3&gt;\n&lt;p&gt;Текст задачи (brief) — то, что вы передаёте в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bof4tk4b\"&gt;--task&lt;/code&gt; или через стандартный ввод: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a0nfgunf\"&gt;echo \"…\" | theia run&lt;/code&gt;. В текст можно вставить файл через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-osdh4y1p\"&gt;@&lt;/code&gt;. Theia сохраняет текст в хранилище как есть, даже если вызов модели потом заблокирован. Не пишите в нём ключи и пароли.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ulfrzt6\"&gt;theia run --task \"…\"&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4e785n2c\"&gt;theia plan --task \"…\"&lt;/code&gt;, строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-clm5qozo\"&gt;task.created&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uim7syqv\"&gt;--plain&lt;/code&gt;, строка с текстом задачи в дереве TUI.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ca93f6ns\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#task\"&gt;task&lt;/a&gt;, &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"file-inclusion\"&gt;&lt;a href=\"ru/glossary.html#file-inclusion\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-75ta780n\"&gt;@path&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вставка файла через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fmqqzhko\"&gt;@&lt;/code&gt;. Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mhegodnn\"&gt;@путь&lt;/code&gt; в тексте задачи Theia заменяет на имя файла, а содержимое файла добавляет в конец текста блоком с заголовком &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8h4kfha\"&gt;--- file: &amp;lt;путь&amp;gt; (sha256 …, N chars) ---&lt;/code&gt;. Работает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z8ptvcar\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qpk03yip\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2sj0m013\"&gt;msg&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s2ltppss\"&gt;probe&lt;/code&gt;, но не в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-04lswc51\"&gt;ask&lt;/code&gt;. Путь считается от текущей папки. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i21wnmty\"&gt;@@&lt;/code&gt; даёт обычный символ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yfc7guhq\"&gt;@&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пути, которые начинаются с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-228nm4ms\"&gt;/&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ixr6frrz\"&gt;./&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5okc567k\"&gt;../&lt;/code&gt;, не вставляются: слово остаётся в тексте без ошибки. Файл с секретом, например с закрытым ключом, не пройдёт: команда остановится с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eouizjly\"&gt;prohibited content&lt;/code&gt;. Адреса почты в файле заменяются на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l79zo7ab\"&gt;[EMAIL]&lt;/code&gt;, а в заголовке блока появится &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o5ny2x2q\"&gt;masked email×1&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: заголовок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kp1i6nj8\"&gt;--- file: README.md (sha256 bc70e26f40b8, 7 chars) ---&lt;/code&gt;, ошибка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7536lnep\"&gt;run: @file: no such file 'nope.md' (…)&lt;/code&gt;, событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qyhs0sms\"&gt;task.note [file_ref]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#brief\"&gt;brief&lt;/a&gt;, &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xt7fx8oa\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/commands.html#argument-rules\"&gt;Общие правила разбора аргументов&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"track\"&gt;&lt;a href=\"ru/glossary.html#track\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;track&lt;/span&gt;&lt;/a&gt;track&lt;/h3&gt;\n&lt;p&gt;Трек — с какой фазы начинается задача. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ur3psu3l\"&gt;fast_path&lt;/code&gt; (короткий путь) сразу отдаёт задачу исполнителю. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ojnecy1v\"&gt;full_spec&lt;/code&gt; (полная спецификация) сначала запускает планировщика. Трек задаёт флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7qdl2b04\"&gt;--track&lt;/code&gt;, по умолчанию — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4lzn6aqe\"&gt;fast_path&lt;/code&gt;. Одобрение плана нужно только в цепочке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nvm79xw6\"&gt;theia plan&lt;/code&gt; → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nwnfv5rg\"&gt;theia run --from-plan&lt;/code&gt;: прогон с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sl9h9d1u\"&gt;--track full_spec&lt;/code&gt; одобрения не ждёт.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mutca9fb\"&gt;run.created … track=fast_path&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2pdwncbv\"&gt;task.created … [full_spec] …&lt;/code&gt;, строка задачи в TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e5ev6u4v\"&gt;tsk…x [fast_path]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fast-path\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tv807lhi\"&gt;fast_path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0lu6nvc5\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7b08f6wp\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#track-override\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ce80d8v\"&gt;track override&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fast-path\"&gt;&lt;a href=\"ru/glossary.html#fast-path\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e0hoonyt\"&gt;fast_path&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Трек короткого пути: задача сразу идёт в фазу &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1urup6yq\"&gt;implement&lt;/code&gt;, без планировщика. Это трек по умолчанию. Подходит для небольших правок.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gydktmfe\"&gt;--track fast_path&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-333go1ci\"&gt;task.phase … ready → implement&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z3oqa7ek\"&gt;[fast_path]&lt;/code&gt; в строках задач.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4f54t9ss\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qygs0zow\"&gt;implement&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"full-spec\"&gt;&lt;a href=\"ru/glossary.html#full-spec\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yl858yv1\"&gt;full_spec&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Трек полной спецификации: задача начинается с фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-62l7ldzm\"&gt;plan&lt;/code&gt;. Планировщик (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z283gl8i\"&gt;planner&lt;/code&gt;) продумывает работу и может разбить её на подзадачи, потом работает исполнитель. Первая строка такой задачи — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-quv1rwk9\"&gt;task.phase … start → plan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0d1qiz3h\"&gt;--track full_spec&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hsghbsna\"&gt;[full_spec]&lt;/code&gt; в строках задач, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d6n8mnk8\"&gt;r1 plan  planner → ready&lt;/code&gt; в TUI.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planner\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-37asku6o\"&gt;planner&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-doktnd06\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n3cc5utz\"&gt;planned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"round\"&gt;&lt;a href=\"ru/glossary.html#round\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;round&lt;/span&gt;&lt;/a&gt;round&lt;/h3&gt;\n&lt;p&gt;Раунд — один шаг задачи: одна роль отработала и вынесла вердикт. В TUI раунды пронумерованы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cda4lexi\"&gt;r1&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l7lquzh9\"&gt;r2&lt;/code&gt;…, в итоге прогона стоит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hf8plpwx\"&gt;(6 rounds)&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cq8m5xsh\"&gt;rounds=N&lt;/code&gt; в строках &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uwkigy0x\"&gt;run.finished&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k8r4913k\"&gt;run.paused&lt;/code&gt; — сумма вердиктов по всем задачам прогона.&lt;/p&gt;\n&lt;p&gt;Лимит — 10 раундов на задачу: параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gbtwvh2d\"&gt;run.maxRoundsPerTask&lt;/code&gt; или флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1myukzk3\"&gt;--max-rounds&lt;/code&gt;, где &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bsd4jgi1\"&gt;0&lt;/code&gt; снимает лимит. Когда лимит исчерпан, появляется аномалия &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yrt95aem\"&gt;round_budget&lt;/code&gt;, и задача уходит к ведущему. Пересмотр задачи (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zknpfzfw\"&gt;rescope&lt;/code&gt;) обнуляет счётчик лимита, но номера раундов в выводе продолжают расти.&lt;/p&gt;\n&lt;p&gt;Где встречается: TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-17rvl6wn\"&gt;r4 merge  merger → merge_fail&lt;/code&gt;, табло &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-chzr3p3l\"&gt;r6&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ssll4pc\"&gt;tsk… → discarded (6 rounds)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zun2b3jg\"&gt;run.finished  halted=completed rounds=6&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verdict\"&gt;verdict&lt;/a&gt;, &lt;a href=\"ru/glossary.html#round-budget\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-479u3wsr\"&gt;round_budget&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#rescope\"&gt;rescope&lt;/a&gt;, &lt;a href=\"ru/glossary.html#phase\"&gt;phase&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"event-log\"&gt;&lt;a href=\"ru/glossary.html#event-log\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;event log&lt;/span&gt;&lt;/a&gt;event log&lt;/h3&gt;\n&lt;p&gt;Журнал событий — список всего, что произошло в прогоне: создание задач, смены фаз, вердикты, вызовы модели, аномалии, указания. Он хранится в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0n6m2hlu\"&gt;.theia/store.db&lt;/code&gt;. Каждое событие хранит отпечаток предыдущего, поэтому подмену видно. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bn4uiq6z\"&gt;--plain&lt;/code&gt; печатает журнал по строке на событие, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ckz8qsah\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt; показывает его после прогона.&lt;/p&gt;\n&lt;p&gt;Строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bvime02z\"&gt;live&lt;/code&gt; в журнал не попадают. Чтобы сохранить весь вывод с подробностями в файл, задайте переменную &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-omjptgvi\"&gt;THEIA_LOG_FILE&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yvgzyw29\"&gt;--plain&lt;/code&gt; вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-st3wvxmj\"&gt;x5dhtxgs task.note     [workspace_base]&lt;/code&gt;, команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mjvpgxye\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-spa93uxq\"&gt;theia replay&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h11z4wt7\"&gt;theia audit verify&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2jaz6ysm\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wvwv27c7\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-log-file\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ct6snp89\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bkxrmipy\"&gt;replay&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"note\"&gt;&lt;a href=\"ru/glossary.html#note\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;note&lt;/span&gt;&lt;/a&gt;note&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g80o66z7\"&gt;note&lt;/code&gt; у Theia значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-66eaaisv\"&gt;task.note&lt;/code&gt; — служебная заметка в журнале; в скобках её источник, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pbopmf6r\"&gt;[workspace_base]&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-blv9yyoh\"&gt;[post_run_maintenance]&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sdbw575j\"&gt;user.note&lt;/code&gt; — ваше указание или ответы на вопросы: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4pej1s42\"&gt;user.note [msg] …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8r8zq30j\"&gt;user.note [clarify] …&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Текст в кавычках “…” после вердикта — короткий комментарий роли.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xig2a9su\"&gt;note:&lt;/code&gt; в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nlnnntgy\"&gt;theia plan show&lt;/code&gt; — ваша просьба об изменениях плана.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0v353q2d\"&gt;noted — …&lt;/code&gt; — ответ команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5jy8kuqe\"&gt;theia msg&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pe7ygk00\"&gt;note &amp;lt;source&amp;gt;&lt;/code&gt; — строка служебной заметки в дереве TUI.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#task-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kdivm63s\"&gt;task.note&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ysnlen90\"&gt;user.note&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verdict\"&gt;verdict&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"live\"&gt;&lt;a href=\"ru/glossary.html#live\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gds242a0\"&gt;live&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4byowe2u\"&gt;live&lt;/code&gt; у Theia значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7f2q5d0\"&gt;live&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-im8sbjbq\"&gt;--plain&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hmxj6cbs\"&gt;live ⏱ implementer tsk…6rzynf call started&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-29b3fkko\"&gt;live ↻ … retry …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gq5hekh8\"&gt;live $ …&lt;/code&gt;. Это подсказки о ходе работы. В журнал они не пишутся, поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ly5plcz2\"&gt;theia show --plain&lt;/code&gt; их не показывает.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mqckgnzd\"&gt;[@ event 21/21 · live]&lt;/code&gt; в заголовке TUI — экран следует за идущим прогоном.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-62rx7hqs\"&gt;(live; …)&lt;/code&gt; в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yg1637vp\"&gt;resuming run …&lt;/code&gt; — в журнале нет ни конца прогона, ни паузы: прогон прервали без паузы.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mgz2r11g\"&gt;N live&lt;/code&gt; в строке статуса и на домашнем экране — число прогонов без записи о конце или паузе. Сюда попадают и убитые прогоны.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-czxcmhem\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p44l9zex\"&gt;--resume&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#statusline\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wv4q0spz\"&gt;statusLine&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hw7d2wbi\"&gt;in flight&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"sigma\"&gt;&lt;a href=\"ru/glossary.html#sigma\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8q2w8d2c\"&gt;sigma&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Σ (sigma) — общие заметки прогона, которые Theia передаёт ролям в каждом запросе: ваши указания, ответы на уточняющие вопросы, направление ведущего после пересмотра задачи. Theia собирает их из журнала событий. Каждый вызов модели начинается заново, а из прошлых раундов роль получает эти заметки, замечания рецензента и итог проверки.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dow0htx8\"&gt;sigma: {}&lt;/code&gt; в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lhfzx6aw\"&gt;theia replay&lt;/code&gt;, строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-svk06tcd\"&gt;sigma         keys: …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s2t2u9fj\"&gt;--plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s2e2oe71\"&gt;sessions: sigma-shared&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3q0fwrgp\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-onvr4qxx\"&gt;replay&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#session\"&gt;session&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"session\"&gt;&lt;a href=\"ru/glossary.html#session\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;session&lt;/span&gt;&lt;/a&gt;session&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oc1er05i\"&gt;session&lt;/code&gt; у Theia значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Сессия движка — чат внутри Claude Code или Codex. Theia хранит только её номер (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5lzy3gui\"&gt;sessionId&lt;/code&gt;) в деталях вызова.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6lm724gs\"&gt;--sessions&lt;/code&gt; и строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zvv5jr14\"&gt;sessions: sigma-shared&lt;/code&gt; — экспериментальный режим: общая часть запроса идёт первой, а Theia записывает её отпечаток (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4m9ufnst\"&gt;task.note [session_prefix]&lt;/code&gt;). Это не продолжение чата. По умолчанию режим выключен (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vyz4v0pu\"&gt;run.sessionContinuity: off&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oayl1i8s\"&gt;SessionStart&lt;/code&gt; — событие хука Claude Code и Codex, на котором Theia добавляет контекст (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s54rtwfj\"&gt;theia mem context&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s62omwqb\"&gt;compact-checkpoint&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4e066n89\"&gt;session-final&lt;/code&gt; — метки кусков переписки, которые сохраняют хуки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#sigma\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sxxs1uxq\"&gt;sigma&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#checkpoint\"&gt;checkpoint&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"non-interactive\"&gt;&lt;a href=\"ru/glossary.html#non-interactive\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cc462wte\"&gt;--non-interactive&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8wyow291\"&gt;--non-interactive&lt;/code&gt;: прогон ни о чём не спрашивает. Экран TUI не открывается, вместо него работает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jy4rajvc\"&gt;--plain&lt;/code&gt;. Если роль задаст уточняющий вопрос, задача замрёт в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a3vla585\"&gt;escalated&lt;/code&gt;, а не будет ждать ответа. Подходит для скриптов, CI и запуска в фоне.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hnl373r0\"&gt;view: --tui is interactive; --non-interactive degrades to --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-joriyp80\"&gt;theia run … --non-interactive&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ss40k7m9\"&gt;theia plan --non-interactive&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6uzcwpml\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-44yf3xi5\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#tui\"&gt;TUI&lt;/a&gt;, &lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-log-file\"&gt;&lt;a href=\"ru/glossary.html#theia-log-file\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2jghxqa5\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Переменная окружения с путём к файлу. Прогон дописывает туда каждую строку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5o4oevg3\"&gt;--plain&lt;/code&gt; вместе с полными данными события (строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v6cijr0n\"&gt;⤷ {…}&lt;/code&gt;) и строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y6sdhem3\"&gt;live&lt;/code&gt;. Это работает и при открытом TUI, поэтому файл можно смотреть из другого терминала командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8zzdiev\"&gt;tail -f&lt;/code&gt;. В 0.2.201 очень короткие прогоны, меньше секунды, могут оставить файл пустым.&lt;/p&gt;\n&lt;p&gt;Где встречается: строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1w8kezyd\"&gt;# theia run run… — &amp;lt;время&amp;gt;&lt;/code&gt; в начале файла, ошибка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7cgop1of\"&gt;THEIA_LOG_FILE: … — logging disabled&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hb55484w\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/environment.html\"&gt;Переменные окружения&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-roles\"&gt;&lt;a href=\"ru/glossary.html#group-roles\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роли&lt;/span&gt;&lt;/a&gt;Роли&lt;/h2&gt;\n&lt;h3 id=\"role\"&gt;&lt;a href=\"ru/glossary.html#role\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;role&lt;/span&gt;&lt;/a&gt;role&lt;/h3&gt;\n&lt;p&gt;Роль — вид работы агента в прогоне: планировать, писать код, проверять, рецензировать, сливать, решать спор. Роль — не модель. Какой движок и какая модель работают в роли, задаёт маршрутизация (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a2zrek55\"&gt;gateway.routing&lt;/code&gt;). В выводе встречаются роли &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bxecqupd\"&gt;lead&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mjn654py\"&gt;planner&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p8tabhg6\"&gt;implementer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dd2jzjf9\"&gt;fresh_implementer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3pwix8su\"&gt;verifier&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l8svp3zo\"&gt;reviewer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pbpm4av9\"&gt;merger&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-la6makjg\"&gt;arbiter&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9x2605vl\"&gt;indexer&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zluykdvf\"&gt;none&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Ещё две роли есть в настройках, но в выводе прогона не видны: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pxlm9ubk\"&gt;extractor&lt;/code&gt; пишет сводки памяти в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fu33r46p\"&gt;theia mem maintain --llm&lt;/code&gt;, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b3a75ci9\"&gt;diagnostician&lt;/code&gt; в 0.2.201 не используется — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vhchmdnk\"&gt;theia diagnose&lt;/code&gt; работает без модели.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fpht75jl\"&gt;verdict … reviewer → approve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sxitis5x\"&gt;gateway implementer@&amp;lt;transport&amp;gt; → ok&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u1yqtz5w\"&gt;live ⏱ lead tsk… call started&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cxdtin7s\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/about/overview.html#roles\"&gt;Роли&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lead\"&gt;&lt;a href=\"ru/glossary.html#lead\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-94b6281a\"&gt;lead&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ведущий (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-64ezmkjc\"&gt;lead&lt;/code&gt;) — роль, которая решает судьбу застрявшей задачи в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ffu6ouc3\"&gt;escalated&lt;/code&gt;. Варианты: пересмотреть задачу и дать новое направление (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4hoymdyi\"&gt;lead_rescope&lt;/code&gt;), принять работу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3h7s45a8\"&gt;lead_accept&lt;/code&gt;), проверить ещё раз (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p5p0f6il\"&gt;lead_reverify&lt;/code&gt;), отбросить задачу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uwi8gym9\"&gt;lead_discard&lt;/code&gt;) или задать вопрос вам (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uhltc9ow\"&gt;clarify&lt;/code&gt;). Ведущий работает по одной задаче за раз.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7j3xj3ob\"&gt;verdict … lead → lead_discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-okwc4t89\"&gt;gateway lead@&amp;lt;transport&amp;gt;&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xmpif1wr\"&gt;r6 escalated  lead → lead_discard&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xtdltbs2\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#rescope\"&gt;rescope&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead-accept\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tm94c09d\"&gt;lead_accept&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead-discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5c57gvl6\"&gt;lead_discard&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dkb8hx2q\"&gt;clarify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"planner\"&gt;&lt;a href=\"ru/glossary.html#planner\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cljsdzd0\"&gt;planner&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Планировщик (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-frl0b6u8\"&gt;planner&lt;/code&gt;) — роль, которая продумывает работу. Он работает в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8f55q6xn\"&gt;plan&lt;/code&gt; у задач трека &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8tcs789\"&gt;full_spec&lt;/code&gt; и в команде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yesf98qs\"&gt;theia plan&lt;/code&gt;. Отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-07xj2100\"&gt;planned&lt;/code&gt; с подзадачами, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lg6xmdiq\"&gt;ready&lt;/code&gt; (можно писать код) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yg69vtfi\"&gt;clarify&lt;/code&gt; (нужен ваш ответ).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zor8vnpo\"&gt;verdict … planner → ready&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hoh0n33m\"&gt;r1 plan  planner → ready&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2qu4dyww\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9use8i39\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pddnae4t\"&gt;planned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hrohqxyy\"&gt;clarify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"implementer\"&gt;&lt;a href=\"ru/glossary.html#implementer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vuygddjl\"&gt;implementer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Исполнитель (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-26jlq4rj\"&gt;implementer&lt;/code&gt;) — роль, которая пишет код. Работает в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tehkgvqw\"&gt;implement&lt;/code&gt;, в отдельной копии репозитория. Отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f0441h73\"&gt;ready&lt;/code&gt; (готово), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-miiq6jyt\"&gt;cant_do&lt;/code&gt; (не может) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nq1e8z68\"&gt;algedonic&lt;/code&gt; (серьёзная проблема). Коммиты делает сама Theia, а не модель.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r5do7yxq\"&gt;verdict … implementer → ready (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8eopwrg3\"&gt;live ⏱ implementer tsk… call started&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y2ubx0qq\"&gt;implement&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fresh-implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0fc1kmwo\"&gt;fresh_implementer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fresh-implementer\"&gt;&lt;a href=\"ru/glossary.html#fresh-implementer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tw56gjl7\"&gt;fresh_implementer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Свежий исполнитель — второй исполнитель, который берётся за задачу заново. После двух попыток в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vbwtia3y\"&gt;implement&lt;/code&gt; (параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7mqnucos\"&gt;run.freshPerspectiveAfter&lt;/code&gt;) Theia отдаёт задачу ему и пишет аномалию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xb456mgf\"&gt;fresh_perspective&lt;/code&gt;. Он не видит заметок прежних попыток, но видит ваши указания и замечания рецензента. Если у него нет своей строки в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yx2tqfz9\"&gt;gateway.routing&lt;/code&gt;, он работает через тот же транспорт, что и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-swzi0b7s\"&gt;implementer&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-437xttp2\"&gt;!! anomaly    fresh_perspective taskId=… dispatches=2&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k17vhzxy\"&gt;gateway fresh_implementer@&amp;lt;transport&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jpcwii2n\"&gt;implementer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fresh-perspective\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p2fczttl\"&gt;fresh_perspective&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rib86myq\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verifier\"&gt;&lt;a href=\"ru/glossary.html#verifier\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6tnlj6ct\"&gt;verifier&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Проверяющий (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3581vq9p\"&gt;verifier&lt;/code&gt;) — роль фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ow6aol47\"&gt;verify&lt;/code&gt;. Если вы передали команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pbp29mez\"&gt;--verify&lt;/code&gt;, работу проверяют сами команды: Theia запускает их, и код выхода решает исход, модель не вызывается. Без команд проверяет модель. Проверяющий отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-94xcgebt\"&gt;pass&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-87h42dsv\"&gt;fail&lt;/code&gt;, а в выводе это события &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6yf7ibhg\"&gt;verify_pass&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kfevhtid\"&gt;verify_fail&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tbmpxmin\"&gt;verdict … verifier → verify_pass (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a0ccbu3k\"&gt;verifier → verify_fail (1 evidence)  “$ false → exit 1 (no output)”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m44zy3ov\"&gt;verify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eklkrq56\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bwffs6o4\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stop-and-fix\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-830fl6s6\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"reviewer\"&gt;&lt;a href=\"ru/glossary.html#reviewer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ccywo4ok\"&gt;reviewer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Рецензент (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ez2te15g\"&gt;reviewer&lt;/code&gt;) — роль фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jdspbx0f\"&gt;review&lt;/code&gt;. Он смотрит изменения задачи и отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ujb5y8x\"&gt;approve&lt;/code&gt; (принять, дальше слияние), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-39wqx5qx\"&gt;rework&lt;/code&gt; (доработать) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fdoiz8c7\"&gt;discard&lt;/code&gt; (отклонить). После &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6vx9nmih\"&gt;rework&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-81pcy4cu\"&gt;discard&lt;/code&gt; задача идёт к арбитру, а не отбрасывается сразу.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q4ytkqpf\"&gt;verdict … reviewer → approve (1 evidence)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#review\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mvwncs0w\"&gt;review&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#approve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1rcfeu6g\"&gt;approve&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#rework\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jcr4w8v5\"&gt;rework&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aznzbcb5\"&gt;discard&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"arbiter\"&gt;&lt;a href=\"ru/glossary.html#arbiter\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4y82hs80\"&gt;arbiter&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Арбитр (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-swt5i8na\"&gt;arbiter&lt;/code&gt;) — роль фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h5jqt12l\"&gt;arbitrate&lt;/code&gt;. Решает, что делать после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-okjtldfp\"&gt;rework&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-enniu2xp\"&gt;discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-51yjydu9\"&gt;merge_fail&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xi30waev\"&gt;cant_do&lt;/code&gt;: ещё одна попытка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mx2dwqz6\"&gt;arb_continue&lt;/code&gt;, назад к исполнителю) или передать задачу ведущему (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x7ukxl0y\"&gt;arb_escalate&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rg51aws8\"&gt;verdict … arbiter → arb_escalate (1 evidence)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sehe68do\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arb-continue\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-15p85o2j\"&gt;arb_continue&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arb-escalate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0x1w2i1x\"&gt;arb_escalate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a59ckd2d\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"merger\"&gt;&lt;a href=\"ru/glossary.html#merger\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m0zip0xu\"&gt;merger&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Роль слияния (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5tqfk30\"&gt;merger&lt;/code&gt;) — шаг фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bgrb6y1o\"&gt;merge&lt;/code&gt;. Это не модель: сама Theia обычным git сливает ветку задачи в ветку прогона (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cwfns5kx\"&gt;git merge --no-ff&lt;/code&gt;). Ответ — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3qaai3a7\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3k2k2o5q\"&gt;merge_fail&lt;/code&gt;. Слияния идут по одному.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pqwy8mn7\"&gt;verdict … merger → merged (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-199fho65\"&gt;merger → merge_fail (1 evidence)  “no commits on the task branch”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3bpkwyxm\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5q0szq6j\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merge-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zqwwgwiu\"&gt;merge_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/glossary.html#precheck\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cm3l2yh5\"&gt;precheck&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"indexer\"&gt;&lt;a href=\"ru/glossary.html#indexer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mxskaexl\"&gt;indexer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Индексатор (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-urt3c8mp\"&gt;indexer&lt;/code&gt;) — роль, которая пишет записи индекса кода: короткую карточку на каждый файл. Работает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8fd1vveh\"&gt;theia index build&lt;/code&gt; и при автоматической сборке индекса. Её вызовы не входят в прогон.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wms4tgz3\"&gt;theia index build&lt;/code&gt;, строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7px1masj\"&gt;indexer: claude-index&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hr0ozxrs\"&gt;policy.yaml&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;, &lt;a href=\"ru/glossary.html#index-entry\"&gt;index entry&lt;/a&gt;, &lt;a href=\"ru/reference/index-cmd.html#index-build\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3oms4ysd\"&gt;theia index build&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"none\"&gt;&lt;a href=\"ru/glossary.html#none\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-syiom1lo\"&gt;none&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3khuzkei\"&gt;none&lt;/code&gt; — роль разового вопроса без задачи. Так работают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8lpk77nz\"&gt;theia probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lxu9gazd\"&gt;theia ask&lt;/code&gt;. Маршрут для неё берётся из строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cgqt4yn4\"&gt;\"*\"&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xy2kktrn\"&gt;gateway.routing&lt;/code&gt;, если нет своей строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u9wxnp8i\"&gt;none&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i2re5z16\"&gt;gateway none@&amp;lt;transport&amp;gt; → ok&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0nv7co5a\"&gt;theia show &amp;lt;id&amp;gt; --plain&lt;/code&gt; для записи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-moepea6c\"&gt;probe&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-noa00c2q\"&gt;ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gr3b96xn\"&gt;probe&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6zahwn1h\"&gt;ask&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7v9f51si\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-phases\"&gt;&lt;a href=\"ru/glossary.html#group-phases\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фазы задачи&lt;/span&gt;&lt;/a&gt;Фазы задачи&lt;/h2&gt;\n&lt;h3 id=\"phase\"&gt;&lt;a href=\"ru/glossary.html#phase\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;phase&lt;/span&gt;&lt;/a&gt;phase&lt;/h3&gt;\n&lt;p&gt;Фаза — шаг, на котором сейчас задача. Рабочие фазы: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fxazpk57\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kdm0b2yg\"&gt;implement&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ej0d7cdk\"&gt;verify&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ekqq55ss\"&gt;review&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-naiote16\"&gt;merge&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m1i9d6e9\"&gt;arbitrate&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vzet7yzp\"&gt;escalated&lt;/code&gt;. Итоговые: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6znpin28\"&gt;merged&lt;/code&gt; (работа слита), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zg2j3rsi\"&gt;discarded&lt;/code&gt; (отброшена), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9qkj58c7\"&gt;planned&lt;/code&gt; (пункт-план с подзадачами). Смену фазы показывает строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8bdjpi69\"&gt;task.phase &amp;lt;задача&amp;gt; &amp;lt;событие&amp;gt; → &amp;lt;фаза&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yq9eul4s\"&gt;task.phase    xk6rzynf ready → implement&lt;/code&gt;, колонка фазы на табло, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1or4ygaw\"&gt;discarded  r6&lt;/code&gt; в строке задачи TUI.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xpvo6g31\"&gt;implement&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-272e5p8q\"&gt;verify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#review\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2anb71pt\"&gt;review&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0th4z4w\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nb8xlbxo\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2wo21edc\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t29l21qa\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qmmnqimy\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#task-phase\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-va2axo7s\"&gt;task.phase&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/about/overview.html#how-a-run-works\"&gt;Как проходит прогон&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"draft\"&gt;&lt;a href=\"ru/glossary.html#draft\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l9n75knh\"&gt;draft&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У слова два смысла:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Фаза новой задачи. Задача сразу уходит из неё в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hesift7u\"&gt;plan&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fi0nkmvw\"&gt;implement&lt;/code&gt;, поэтому в выводе её почти не видно.&lt;/li&gt;\n&lt;li&gt;Статус плана: план создан или изменён и ещё не одобрен. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hxhelrpy\"&gt;theia run --from-plan&lt;/code&gt; такой план не запустит.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xbfog363\"&gt;pln… [draft] 2 tasks — …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jw7yqssx\"&gt;theia plan list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rol09hmg\"&gt;context added — NEW digest …, status draft (re-approval required)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3b51tobj\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#approved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sbu2xy82\"&gt;approved&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#phase\"&gt;phase&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"implement\"&gt;&lt;a href=\"ru/glossary.html#implement\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c52hzeq5\"&gt;implement&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Фаза, в которой исполнитель пишет код в копии репозитория задачи. Из неё задача идёт в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0jjqp3e2\"&gt;verify&lt;/code&gt; (событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ayhpnqdx\"&gt;ready&lt;/code&gt;), к арбитру (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j23f1ihk\"&gt;cant_do&lt;/code&gt;) или к ведущему (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-st7jq27m\"&gt;algedonic&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9q8hylp4\"&gt;no_progress&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-19s47x61\"&gt;task.phase … ready → implement&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cq2jzqpr\"&gt;r1 implement  implementer → ready&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-273pp709\"&gt;implementer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s55uahqs\"&gt;verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verify\"&gt;&lt;a href=\"ru/glossary.html#verify\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jfak1cic\"&gt;verify&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У слова несколько смыслов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Фаза проверки после исполнителя.&lt;/li&gt;\n&lt;li&gt;Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-702ejkjk\"&gt;--verify \"&amp;lt;команда&amp;gt;\"&lt;/code&gt;, его можно указать несколько раз. Theia запускает команды по очереди в копии задачи через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cpo4ys5s\"&gt;bash -lc&lt;/code&gt;, и код выхода решает исход. Команды работают прямо на вашей машине, не в песочнице, с лимитом 5 минут на каждую. Без команд проверяет модель.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e65i47ld\"&gt;✓ &amp;lt;команда&amp;gt;&lt;/code&gt; в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5h1jrqf\"&gt;theia plan show&lt;/code&gt; — своя команда проверки у пункта плана.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s8dbnhvl\"&gt;lead_reverify&lt;/code&gt; — ведущий просит проверить ещё раз.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xqia636t\"&gt;--plain&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5gn78q2l\"&gt;--cli&lt;/code&gt; первый Ctrl+C из терминала убивает и работающую команду проверки. Theia записывает это как провал: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k8tu7dv0\"&gt;verify_fail&lt;/code&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n0qesi3w\"&gt;exit null&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eki7y0fl\"&gt;task.phase … ready → verify&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3o6665q5\"&gt;verdict … verifier → verify_fail (1 evidence)  “$ false → exit 1 (no output)”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verifier\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kbf765ze\"&gt;verifier&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g44cknce\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lbb4otgb\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stop-and-fix\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hru7lbwi\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead-rever
