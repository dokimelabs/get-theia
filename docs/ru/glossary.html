line-code-id-qlhugz8c\"&gt;theia init --harness claude&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ibs45i0\"&gt;--harness codex&lt;/code&gt;, а точнее всё задаёт маршрутизация. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lrtqwg2g\"&gt;fake&lt;/code&gt; — тестовый движок без модели для разработчиков; ответы вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fb9orw71\"&gt;fake-green …&lt;/code&gt; приходят только от него.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ld87h8hp\"&gt;codex subscription : …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wh8nc24z\"&gt;claude code        : …&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-smgilh7a\"&gt;harnesses          : FAIL (…)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7u5c1m7h\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n85mpbbp\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-er46qrjo\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"context\"&gt;&lt;a href=\"ru/glossary.html#context\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;kind: Context&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p82zvbgx\"&gt;kind: Context&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Манифест с правилами и справочными текстами, которые Theia добавляет в запросы агентов как текст. Источник записи — строка, файл или шаблон пути; когда добавлять — всегда, для ролей, треков или путей. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ouliiww\"&gt;theia init&lt;/code&gt; сам создаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k98ize8h\"&gt;context-rules.yaml&lt;/code&gt;, если нашёл файлы правил вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h60srdf4\"&gt;.cursorrules&lt;/code&gt;. Путь к файлу пишите относительно проекта: абсолютный путь не работает.&lt;/p&gt;\n&lt;p&gt;Если добавленного текста больше &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tn2ft2pi\"&gt;run.contextAlertChars&lt;/code&gt; (200 000 символов), Theia предупреждает, но загружает всё. Жёсткий лимит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ma7gtel\"&gt;run.contextRefuseChars&lt;/code&gt; по умолчанию не задан.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w7dhhyr7\"&gt;context       injected: …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bghp22x9\"&gt;--plain&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uaajsfj4\"&gt;context injected (N entries)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2v2v6sqy\"&gt;context alert: task … injects N chars (&amp;gt; contextAlertChars=200000) — loading everything&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#ai-rules\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cuaf26gc\"&gt;ai rules&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ctx\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-by8gib02\"&gt;ctx ⚠N&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"pre-task\"&gt;&lt;a href=\"ru/glossary.html#pre-task\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;pre-task&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-raj0y7wo\"&gt;pre-task&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Команды из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x8l8sa5f\"&gt;run.preTask&lt;/code&gt;, которые Theia запускает перед первым шагом исполнителя. Если обязательная команда (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b1m3og8p\"&gt;mustPass&lt;/code&gt;) упала, задача замирает ещё до вызова модели и ждёт ведущего.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ses2wpe9\"&gt;pre-task      &amp;lt;task&amp;gt; N gate(s), M failed&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s7nq9zcg\"&gt;pre-task gates: N run, M failed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#illegal-verdict\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u0j5m2ms\"&gt;illegal_verdict&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#policy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n9x75pq3\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qkjn63g0\"&gt;policy.yaml&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-rulessot\"&gt;&lt;a href=\"ru/glossary.html#run-rulessot\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run.rulesSoT&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-442a8ck5\"&gt;run.rulesSoT&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим «правила только через Theia». В копиях задач файлы правил (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o1n9qyag\"&gt;AGENTS.md&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p7jbkq4j\"&gt;CLAUDE.md&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h0np0k0v\"&gt;.cursorrules&lt;/code&gt; и другие) заменяются заглушкой, а Codex не читает свои файлы проекта. Сами &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-exfmwp8c\"&gt;AGENTS.md&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-60ieixgr\"&gt;CLAUDE.md&lt;/code&gt; при этом в запросы не попадают: добавьте их манифестом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7p1zgzhl\"&gt;Context&lt;/code&gt;. По умолчанию режим выключен.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lmq6sj1s\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ai-rules\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zadq0osb\"&gt;ai rules&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-security\"&gt;&lt;a href=\"ru/glossary.html#group-security\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Безопасность и песочница&lt;/span&gt;&lt;/a&gt;Безопасность и песочница&lt;/h2&gt;\n&lt;h3 id=\"data-class\"&gt;&lt;a href=\"ru/glossary.html#data-class\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;data class&lt;/span&gt;&lt;/a&gt;data class&lt;/h3&gt;\n&lt;p&gt;Класс данных — насколько опасно отправлять текст модели. Шлюз проверяет каждый запрос простыми шаблонами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ewkaguv\"&gt;prohibited&lt;/code&gt; — отправлять нельзя: закрытые ключи, ключи API (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b3am7j6y\"&gt;sk-…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ry0ptved\"&gt;AKIA…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6neta9l0\"&gt;ghp_…&lt;/code&gt;), номера карт, seed-фразы. Вызов останавливается.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tk6o72ts\"&gt;restricted&lt;/code&gt; — можно только со скрытием: адреса почты заменяются на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dyzs5wnw\"&gt;[EMAIL]&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hfhlz68u\"&gt;permitted&lt;/code&gt; — текст уходит как есть.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Шаблоны не ловят пароли, телефоны, имена и ключи другого вида. Текст задачи с секретом всё равно сохраняется в хранилище. Поле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j2ipfgr9\"&gt;dataClasses&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-116vyjzf\"&gt;registry.yaml&lt;/code&gt; в 0.2.201 ни на что не влияет.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-enz2xqbc\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blocked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v5x9aci0\"&gt;@blocked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-maskoverrides\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-36cuhi4h\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1c3k9cgi\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"masked\"&gt;&lt;a href=\"ru/glossary.html#masked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;masked&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bbr2vv88\"&gt;masked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Скрытый фрагмент: шлюз заменил опасный текст заглушкой перед отправкой — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ukke89og\"&gt;[EMAIL]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6gt6mtv4\"&gt;[API KEY]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mlbapjsl\"&gt;[CARD NUMBER]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yhvhrznl\"&gt;[PRIVATE KEY]&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mjbrj4mn\"&gt;[SEED PHRASE]&lt;/code&gt;. Число замен видно в данных вызова (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5qdbyejq\"&gt;masked={\"email\":1}&lt;/code&gt;) и в заголовке вставленного файла (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-06kmik2s\"&gt;masked email×1&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blocked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-unn2evn3\"&gt;@blocked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3typ7rnv\"&gt;@path&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blocked\"&gt;&lt;a href=\"ru/glossary.html#blocked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;@blocked&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7qrovkyi\"&gt;@blocked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вызов остановлен проверкой на секреты: в тексте есть данные класса &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lgi0q6i4\"&gt;prohibited&lt;/code&gt;. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qhs5dvtp\"&gt;--plain&lt;/code&gt; вместо транспорта стоит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-venll277\"&gt;blocked&lt;/code&gt;, а в комментарии вердикта — какой шаблон сработал. Если так блокируются все роли, прогон встаёт на паузу.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sirfiguj\"&gt;gateway       implementer@blocked → fatal&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-36yunkef\"&gt;gateway fatal: gateway: prohibited content (api_key) — call blocked (THE-014)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2wwk3juz\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-maskoverrides\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-juofdljv\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-maskoverrides\"&gt;&lt;a href=\"ru/glossary.html#gateway-maskoverrides\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;gateway.maskOverrides&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yygrt78w\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Исключения для шаблонов секретов в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hoglc7o8\"&gt;policy.yaml&lt;/code&gt;. Для шаблона можно задать &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zm3yl9k2\"&gt;off&lt;/code&gt; (не проверять), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pv6bd9q5\"&gt;restricted&lt;/code&gt; (скрывать, но не останавливать) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fify4cjs\"&gt;prohibited&lt;/code&gt; (останавливать). Имена шаблонов: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8zctu7nw\"&gt;pem_private_key&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-to1foq7b\"&gt;api_key&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bpsoatsd\"&gt;card_number&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wc2w1pot\"&gt;seed_phrase&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-94bspv6m\"&gt;email&lt;/code&gt;. Пригодится, если шаблон ошибается на ваших данных, например принимает длинные номера за номера карт.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m2vuy6zk\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"sandbox-tier\"&gt;&lt;a href=\"ru/glossary.html#sandbox-tier\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;sandbox tier&lt;/span&gt;&lt;/a&gt;sandbox tier&lt;/h3&gt;\n&lt;p&gt;Уровень песочницы — сколько свободы у агентов на вашей машине. Параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-atb4s03b\"&gt;run.sandboxTier&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hr5hsyza\"&gt;standard&lt;/code&gt; (по умолчанию) — агент пишет только в копии задачи, git делает Theia;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eht67mpa\"&gt;jailed-full&lt;/code&gt; — полный доступ внутри песочницы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-749002qy\"&gt;theia jail&lt;/code&gt;; в 0.2.201 работает только на Linux;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nzr9kt27\"&gt;trusted-full&lt;/code&gt; — полный доступ ко всей машине без песочницы. Нужна строка транспорта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1gvdljfv\"&gt;codex-full&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0gdc21zo\"&gt;registry.yaml&lt;/code&gt;, а Theia печатает громкое предупреждение.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В режимах &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xp02t2x\"&gt;jailed-full&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5acsvr86\"&gt;trusted-full&lt;/code&gt; исполнители всегда работают через Codex.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ewaudlxy\"&gt;!! sandboxTier trusted-full: implementer agents run with FULL HOST ACCESS, unjailed (manifest-recorded opt-in)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xgv6ponr\"&gt;jailed-full tier unavailable&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a54h9sqz\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ajrvwwiy\"&gt;jail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#posture\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1dumh5m9\"&gt;posture&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1hl1kyyw\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"posture\"&gt;&lt;a href=\"ru/glossary.html#posture\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;posture&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rvm25vz0\"&gt;posture&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим доступа (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k1c5920s\"&gt;posture&lt;/code&gt;) — рабочее слово Theia для выбранного набора настроек. Чаще всего так называют уровень песочницы: насколько агентам можно менять систему. Слово встречается в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lamuzijr\"&gt;theia help&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fywoua52\"&gt;seeded posture&lt;/code&gt; у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7xcp2ygb\"&gt;theia eval demo create&lt;/code&gt;) и в параметрах замеров платформы. Отдельного параметра с таким именем нет.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"jail\"&gt;&lt;a href=\"ru/glossary.html#jail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;jail&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ek2k334h\"&gt;jail&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Песочница для команды: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5pw11qdz\"&gt;theia jail -- &amp;lt;команда&amp;gt;&lt;/code&gt; запускает команду так, что система доступна только на чтение, а писать можно лишь в разрешённые папки. На Linux песочница работает через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5z96x9v0\"&gt;bwrap&lt;/code&gt;; есть и вариант через контейнер (Docker или Podman). Встроенной песочницы для macOS в 0.2.201 нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83030gh7\"&gt;jail: unavailable — no sandbox backend on darwin yet (…); use standard or trusted-full&lt;/code&gt;, строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-giizbfh4\"&gt;jail (none        )&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-043bube1\"&gt;jail (container   )&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9hxeujhg\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;, &lt;a href=\"ru/reference/jail.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1smax268\"&gt;theia jail&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-resources\"&gt;&lt;a href=\"ru/glossary.html#run-resources\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run.resources&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ni9yc4l\"&gt;run.resources&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Лимиты памяти, процессора и числа процессов для команд и агентов прогона: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-748vs3qj\"&gt;memoryMax&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xd9fwv24\"&gt;cpuQuota&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ingl3e7\"&gt;tasksMax&lt;/code&gt;. Работают только на Linux через systemd. На другой системе прогон с такими лимитами не запустится.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i1iauaan\"&gt;resources        : unavailable (run.resources needs linux cgroups (systemd-run); platform is darwin) — …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3tfb1prl\"&gt;jail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-install\"&gt;&lt;a href=\"ru/glossary.html#group-install\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка и обновление&lt;/span&gt;&lt;/a&gt;Установка и обновление&lt;/h2&gt;\n&lt;h3 id=\"pat\"&gt;&lt;a href=\"ru/glossary.html#pat\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PAT&lt;/span&gt;&lt;/a&gt;PAT&lt;/h3&gt;\n&lt;p&gt;Токен GitHub (PAT) — ключ доступа к закрытому репозиторию выпусков Theia. Нужен для &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t6ca6g9f\"&gt;theia self update&lt;/code&gt;, скачивания версий через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vpqrylz9\"&gt;--x-release&lt;/code&gt; и ежедневной проверки обновлений. Для обычной работы не нужен. Хранится в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ugrxs4ez\"&gt;config.yaml&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p6yj8htg\"&gt;github.pat&lt;/code&gt;). Переменная &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3k3rxzrb\"&gt;THEIA_GH_TOKEN&lt;/code&gt; важнее файла, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kycrplrv\"&gt;GH_TOKEN&lt;/code&gt; Theia не читает. Значение токена Theia не печатает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h2tn3gwt\"&gt;github pat         : present&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p5qu87cf\"&gt;absent (release download/self update unavailable)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0b71blor\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8naujr2u\"&gt;self update: no GitHub PAT — theia setup --pat &amp;lt;token&amp;gt; (or THEIA_GH_TOKEN)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"ru/glossary.html#update-notice\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ynaar0tj\"&gt;is available&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"channel\"&gt;&lt;a href=\"ru/glossary.html#channel\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;channel&lt;/span&gt;&lt;/a&gt;channel&lt;/h3&gt;\n&lt;p&gt;Канал обновлений — какие версии получает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cs8kgg9b\"&gt;theia self update&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mjvmk0gl\"&gt;release&lt;/code&gt; (по умолчанию) — обычные выпуски. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gxo19qvn\"&gt;prerelease&lt;/code&gt; — ещё и тестовые сборки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-97xy987u\"&gt;-pre.N&lt;/code&gt;, для разработчиков платформы. Канал задаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c4dtpjq3\"&gt;theia setup --channel&lt;/code&gt;, а хранится он в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5l82km98\"&gt;config.yaml&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ckrfnao6\"&gt;update.channel&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3f6zyg3h\"&gt;prerelease channel (update.channel) — resolving against -pre builds too&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sqbdednp\"&gt;already up to date (v0.2.201)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"vendor\"&gt;&lt;a href=\"ru/glossary.html#vendor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;vendor deliverables&lt;/span&gt;&lt;/a&gt;vendor deliverables&lt;/h3&gt;\n&lt;p&gt;Файлы поставки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oirn9g7a\"&gt;vendor&lt;/code&gt;) — набор файлов, который идёт вместе с Theia: промпты ролей (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8vh39acj\"&gt;prompts/kernel.yaml&lt;/code&gt;), правила и скиллы. В 0.2.201 работают только промпты, а правила и скиллы из поставки ничего не читает. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lhy8wwr4\"&gt;theia doctor&lt;/code&gt; сверяет файлы по отпечаткам, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l67izbrz\"&gt;theia self update&lt;/code&gt; обновляет их. Без этих файлов не работают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6bvs4p2v\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lcdxlvnt\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wpeyq58o\"&gt;ask&lt;/code&gt; и другие команды с моделями.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eu9ccytb\"&gt;vendor deliverables: ok — 9ff60d108678 verified (21 files); matches this release&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5t7kxuy6\"&gt;theia: no vendor deliverables found (…)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vpwivmur\"&gt;doctor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"user-config\"&gt;&lt;a href=\"ru/glossary.html#user-config\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;user config&lt;/span&gt;&lt;/a&gt;user config&lt;/h3&gt;\n&lt;p&gt;Файл личных настроек &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gqi9g9op\"&gt;config.yaml&lt;/code&gt; в папке настроек пользователя: токен GitHub (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8wrwma0m\"&gt;github.pat&lt;/code&gt;), ключ OpenAI (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-khzrbd84\"&gt;openai.apiKey&lt;/code&gt;), канал обновлений (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t7u0kkhp\"&gt;update.channel&lt;/code&gt;) и путь для разработчиков (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3gptcvkx\"&gt;dev.root&lt;/code&gt;). Права 0600: читать файл может только владелец. Пишут его &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ynbrco6\"&gt;theia setup&lt;/code&gt; и мастер первой настройки; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ht27olqs\"&gt;theia setup&lt;/code&gt; удаляет ключи, которых не знает. Папка — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k59yp88q\"&gt;~/.config/theia&lt;/code&gt; на Linux. На macOS это &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ifjojeo\"&gt;~/Library/Application Support/theia&lt;/code&gt;; если такой папки нет, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eyhdugfe\"&gt;~/.config/theia&lt;/code&gt; есть, Theia берёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c8hts7hb\"&gt;~/.config/theia&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ro1o57bf\"&gt;user config        : present&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6n9jhkn5\"&gt;absent (&amp;lt;путь&amp;gt; — theia setup)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0mkvsjuj\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iowpy3wh\"&gt;wrote github.pat to &amp;lt;путь&amp;gt; (mode 0600)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"ru/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"setup-wizard\"&gt;&lt;a href=\"ru/glossary.html#setup-wizard\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;setup wizard&lt;/span&gt;&lt;/a&gt;setup wizard&lt;/h3&gt;\n&lt;p&gt;Мастер первой настройки. Открывается вместо домашнего экрана, когда вы запускаете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-70x7n4xy\"&gt;theia&lt;/code&gt; без команды в терминале, а личных настроек или хранилища ещё нет. Спрашивает токен GitHub и ключ OpenAI (можно пропустить), предлагает создать хранилище в текущей папке, выбрать движок и добавить другие корни. В отличие от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wtqv9io7\"&gt;theia init&lt;/code&gt;, мастер всегда создаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-keam73jt\"&gt;.theia&lt;/code&gt; в текущей папке, даже в подпапке репозитория.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-crb3t7q5\"&gt;theia setup — Enter accepts the default, empty answers skip.&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pyd7hasi\"&gt;initialize a theia workspace in …? [Y/n]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gf70hfh8\"&gt;done — try: theia doctor, then theia run --task \"…\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"ru/install/first-setup.html\"&gt;Первая настройка&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"update-notice\"&gt;&lt;a href=\"ru/glossary.html#update-notice\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;is available&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k1y3jjkh\"&gt;is available&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Серая строка о новой версии: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-devek29u\"&gt;theia v&amp;lt;новая&amp;gt; is available (running v&amp;lt;ваша&amp;gt;) — theia self update&lt;/code&gt;. Theia проверяет обновления не чаще раза в сутки, только с токеном GitHub и не дольше полутора секунд. При любой ошибке проверка молчит. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tzxd5vp9\"&gt;theia version&lt;/code&gt; проверку не запускает.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"x-release\"&gt;&lt;a href=\"ru/glossary.html#x-release\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;--x-release&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6tf9hlf8\"&gt;--x-release&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Глобальный флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pexzgok4\"&gt;--x-release &amp;lt;версия&amp;gt;&lt;/code&gt; (или переменная &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zy9kk7t0\"&gt;THEIA_X_RELEASE&lt;/code&gt;): выполнить команду другой версией Theia из кэша, при необходимости скачав её. Если версию получить нельзя, команда завершается ошибкой, а не работает текущей версией. Неверное значение &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5s53q1fw\"&gt;THEIA_X_RELEASE&lt;/code&gt; ломает все команды, даже &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nufkhstl\"&gt;theia version&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;, &lt;a href=\"ru/reference/commands.html#global-flags\"&gt;Глобальные флаги&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dev\"&gt;&lt;a href=\"ru/glossary.html#dev\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;--dev&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8lq5omw1\"&gt;--dev&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Флаг для разработчиков платформы: запустить Theia из дерева исходников по пути после флага или из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1s6ic0i5\"&gt;dev.root&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hsn43txo\"&gt;~/.config/theia/config.yaml&lt;/code&gt;. В установленной версии дерева исходников нет, поэтому флаг останавливает команду с кодом 1 и печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-snpwfstn\"&gt;--dev: no development root — pass a path (theia --dev &amp;lt;path&amp;gt; …) or set dev.root in ~/.config/theia/config.yaml (theia setup --dev-root &amp;lt;path&amp;gt;)&lt;/code&gt;. Справку он не печатает. С чужим путём ответ другой: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8kl3krbl\"&gt;--dev: &amp;lt;путь&amp;gt; does not look like a theia dev tree (missing apps/theia/src/main.ts)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#x-release\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-00qzw0fk\"&gt;--x-release&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/install/update.html#for-developers\"&gt;Для разработчиков платформы&lt;/a&gt;, &lt;a href=\"ru/reference/commands.html#global-flags\"&gt;Глобальные флаги&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-integrations\"&gt;&lt;a href=\"ru/glossary.html#group-integrations\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интеграции&lt;/span&gt;&lt;/a&gt;Интеграции&lt;/h2&gt;\n&lt;h3 id=\"hooks\"&gt;&lt;a href=\"ru/glossary.html#hooks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;hooks&lt;/span&gt;&lt;/a&gt;hooks&lt;/h3&gt;\n&lt;p&gt;Хуки — короткие команды, которые Claude Code, Codex или git запускают сами при событиях. Их ставит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-asslssem\"&gt;theia hooks install&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kcwsadsc\"&gt;claude&lt;/code&gt; — хуки начала сессии (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6w3u8zou\"&gt;theia mem context&lt;/code&gt;), отправки сообщения (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ufc3dmqd\"&gt;theia mem recall&lt;/code&gt;), сжатия контекста и остановки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8vqrjn6n\"&gt;theia mem checkpoint&lt;/code&gt;), строка статуса, MCP-сервер в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zp2xv041\"&gt;.mcp.json&lt;/code&gt; и скилл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rfd1gg7k\"&gt;/theia&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8raunsk\"&gt;codex&lt;/code&gt; — те же хуки памяти в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ghoa2emi\"&gt;.codex/hooks.json&lt;/code&gt; и MCP-сервер;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bb2m0oal\"&gt;git&lt;/code&gt; — хук после коммита, который ставит пометки для индекса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Команды удаления нет, хуки убирают вручную. Хуки запускают Theia по полному пути к установленной версии, поэтому после обновления они продолжают запускать старую версию.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ryse89tk\"&gt;installed post-commit dirty-marks hook → …/.git/hooks/post-commit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r4bxlk9f\"&gt;statusline wired: theia index status --brief&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-99alubo2\"&gt;mcp server registered: theia serve → …/.mcp.json (control tools included)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/glossary.html#skill\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d94ofmjl\"&gt;/theia&lt;/code&gt; skill&lt;/a&gt;, &lt;a href=\"ru/glossary.html#statusline\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mfrdyemx\"&gt;statusLine&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dirty-marks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pxas4iry\"&gt;dirty-marks&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ota0ncpv\"&gt;fail-open&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;, &lt;a href=\"ru/reference/hooks.html#hooks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tf05y2tw\"&gt;theia hooks&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"mcp\"&gt;&lt;a href=\"ru/glossary.html#mcp\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MCP&lt;/span&gt;&lt;/a&gt;MCP&lt;/h3&gt;\n&lt;p&gt;MCP (Model Context Protocol) — стандартный способ дать агенту инструменты. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-owg1x8hd\"&gt;theia serve&lt;/code&gt; запускает MCP-сервер Theia через стандартный ввод-вывод. Инструменты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;карта кода: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nisoqqr3\"&gt;codebase_blueprint&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u7duet5v\"&gt;codebase_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8pe7yhpn\"&gt;codebase_symbol&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;память: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e3ch44kq\"&gt;memory_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v3kpthly\"&gt;memory_add&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9kvnbf6w\"&gt;memory_tree&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;разбор прогонов: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-00vgzwqa\"&gt;run_audit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aii0vkem\"&gt;run_diagnose&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;управление: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8zc64goc\"&gt;run_list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-spcwfm7a\"&gt;run_status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d1ptqhuc\"&gt;run_events&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-912rjc6m\"&gt;run_wait&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1bf7c2r6\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6pr89g0s\"&gt;run_answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tj5hfio0\"&gt;run_stop&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uvwl4sv8\"&gt;run_start&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eq93d01l\"&gt;run_probe&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e799orxy\"&gt;plan_list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tengmtyg\"&gt;plan_show&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eh8h9pjk\"&gt;plan_create&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83chdpug\"&gt;plan_approve&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Codex получает сокращённый набор без инструментов управления. Инструменты &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8brof4e\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qa6kahtn\"&gt;run_answer&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y4vkvbrr\"&gt;run_stop&lt;/code&gt; не действуют на прогоны, запущенные заново, в том числе через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1lh19g9m\"&gt;run_start&lt;/code&gt;: см. &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1sx1omgu\"&gt;theia serve: MCP server on stdio (root …)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o9j905c6\"&gt;mcp server registered: theia serve → …/.mcp.json (control tools included)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#skill\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7xaj5048\"&gt;/theia&lt;/code&gt; skill&lt;/a&gt;, &lt;a href=\"ru/glossary.html#metrics\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7n6gw7s\"&gt;/metrics&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/integrations/mcp-server.html\"&gt;MCP-сервер&lt;/a&gt;, &lt;a href=\"ru/reference/serve.html#serve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-svh3iflp\"&gt;theia serve&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"skill\"&gt;&lt;a href=\"ru/glossary.html#skill\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;skill&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mb6adtww\"&gt;/theia&lt;/code&gt; skill&lt;/h3&gt;\n&lt;p&gt;Скилл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-udzv8gaz\"&gt;/theia&lt;/code&gt; — инструкция для Claude Code, как вести работу через Theia: план, одобрение человеком, запуск, наблюдение, ответы на вопросы. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8wb0hu9u\"&gt;theia hooks install claude&lt;/code&gt; кладёт его в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3xo6a6au\"&gt;.claude/skills/theia/SKILL.md&lt;/code&gt;. Сам скилл ничего не выполняет, он опирается на инструменты MCP Theia. Для Codex скилл не ставится. Шаги скилла с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qu34vlct\"&gt;run_msg&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b18cmncq\"&gt;run_stop&lt;/code&gt; в 0.2.201 не действуют на прогоны от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q64zlxeg\"&gt;run_start&lt;/code&gt;. Не путайте этот скилл со скиллами в файлах поставки.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cliq9c51\"&gt;/theia skill installed → …/.claude/skills/theia/SKILL.md&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"statusline\"&gt;&lt;a href=\"ru/glossary.html#statusline\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;statusLine&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8rzbnh31\"&gt;statusLine&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка статуса внизу Claude Code. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4iztpl3u\"&gt;theia hooks install claude&lt;/code&gt; подключает в неё команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-58ze365p\"&gt;theia index status --brief&lt;/code&gt;, если строки статуса у вас ещё нет. Там видна свежесть индекса, а также число открытых прогонов и ждущих вопросов.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-115s4c18\"&gt;theia: 0 indexed · 1 missing · 1 live&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x0hesp2f\"&gt;statusline: existing statusLine preserved (not overwritten)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cryjh8tv\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y9576asq\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gate-1\"&gt;&lt;a href=\"ru/glossary.html#gate-1\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;gate 1&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-25t3nx52\"&gt;gate 1&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Первое условие Codex: проект должен быть доверенным (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3uex3sen\"&gt;project trust&lt;/code&gt;). Пока это не так, Codex не видит ни хуки, ни MCP-сервер из папки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e14bubi7\"&gt;.codex/&lt;/code&gt;. Условие выполняется, если один раз запустить &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-840jwby4\"&gt;codex&lt;/code&gt; в этой папке и принять запрос доверия или выполнить &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-djut5p0w\"&gt;theia hooks install codex --trust&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ald42cx3\"&gt;project NOT trusted (gate 1)&lt;/code&gt; в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1pn0qb0m\"&gt;codex hooks&lt;/code&gt; у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bwscdwd8\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0hfhjsvc\"&gt;gate 1 (project trust): NOT SATISFIED — …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gate-2\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yqx6u0lb\"&gt;gate 2&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#codex-hooks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9xkdsyft\"&gt;codex hooks&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gate-2\"&gt;&lt;a href=\"ru/glossary.html#gate-2\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;gate 2&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-915b9kwt\"&gt;gate 2&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Второе условие Codex: новые и изменённые хуки нужно проверить и одобрить (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ett3lu4\"&gt;hook trust&lt;/code&gt;). До этого Codex их пропускает. Одобрить можно командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ffdxx9uh\"&gt;/hooks&lt;/code&gt; в интерактивной сессии Codex в этой папке.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2oob4fw9\"&gt;gate 2 (hook trust): new/changed hooks are review-gated per hash and SKIPPED until trusted —&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-86jxesfc\"&gt;theia hooks install codex&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gate-1\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0huuxopn\"&gt;gate 1&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"metrics\"&gt;&lt;a href=\"ru/glossary.html#metrics\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;/metrics&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i544tjpo\"&gt;/metrics&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Страница метрик в формате Prometheus: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p6w4o3em\"&gt;theia serve --metrics &amp;lt;порт&amp;gt;&lt;/code&gt;. Она показывает счётчики только самого процесса &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5fvsy00o\"&gt;theia serve&lt;/code&gt;. Порт открыт на всех сетевых интерфейсах.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-78i1410f\"&gt;theia serve: /metrics on :&amp;lt;порт&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/integrations/observability.html\"&gt;Метрики и трассировка&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-tui\"&gt;&lt;a href=\"ru/glossary.html#group-tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экран TUI&lt;/span&gt;&lt;/a&gt;Экран TUI&lt;/h2&gt;\n&lt;h3 id=\"tui\"&gt;&lt;a href=\"ru/glossary.html#tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TUI&lt;/span&gt;&lt;/a&gt;TUI&lt;/h3&gt;\n&lt;p&gt;Экранный интерфейс (TUI) — полноэкранный режим &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ux6nj99i\"&gt;theia run&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hsy5lyvp\"&gt;theia show --tui&lt;/code&gt;. В терминале это вид по умолчанию. Экран показывает дерево прогона, детали шагов, живую активность и подсказки клавиш. Если терминала нет или задан &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xiruu13r\"&gt;--non-interactive&lt;/code&gt;, Theia переходит на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4o8z9uxs\"&gt;--plain&lt;/code&gt; и пишет почему. Клавиши «отключиться и оставить прогон работать» нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ruc3cn4r\"&gt;view: --tui needs an interactive terminal (a TTY for output and keys) — degrading to --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o6krlwzz\"&gt;view: --tui is interactive; --non-interactive degrades to --plain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;, &lt;a href=\"ru/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;, &lt;a href=\"ru/glossary.html#board\"&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-050f7ndl\"&gt;--cli&lt;/code&gt;)&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2kwq5hro\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;, &lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"home-screen\"&gt;&lt;a href=\"ru/glossary.html#home-screen\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;home screen&lt;/span&gt;&lt;/a&gt;home screen&lt;/h3&gt;\n&lt;p&gt;Домашний экран — то, что открывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xwyga9qt\"&gt;theia&lt;/code&gt; без команды в терминале, когда личные настройки и хранилище уже есть. На нём только проблемные строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-an9ajuaq\"&gt;theia doctor&lt;/code&gt;, строка свежести индекса, до пяти последних прогонов с итогом и ценой и поле задачи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2x7m4kea\"&gt;task ▸&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 запуск задачи из поля &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-12jllzsz\"&gt;task ▸&lt;/code&gt; не работает: прогон падает с ошибкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yldrsg3y\"&gt;kernel: no vendored prompts …&lt;/code&gt; и остаётся открытым (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ds0ok2wn\"&gt;⣽ … in flight&lt;/code&gt;). Запускайте задачи командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cw15g52e\"&gt;theia run --task \"…\"&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yivuq07o\"&gt;recent runs:&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qsxgoem2\"&gt;✖ run2akdqctmhw222mff47z2qh  abandoned  $0.0000&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0mkj9509\"&gt;task ▸ ▏&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tl9ttkm1\"&gt;Enter run · ? help · q quit&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qzm0bbu1\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-tree\"&gt;&lt;a href=\"ru/glossary.html#run-tree\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run tree&lt;/span&gt;&lt;/a&gt;run tree&lt;/h3&gt;\n&lt;p&gt;Дерево прогона — главная часть TUI. Задачи — строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ebhvx82j\"&gt;tsk…x [fast_path]&lt;/code&gt;, справа фаза, раунды, цена и время. Внутри задачи: её текст, копия &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nrhxe8e0\"&gt;workspace @ &amp;lt;sha&amp;gt; (copy)&lt;/code&gt;, раунды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v8nfqz04\"&gt;r1 implement  implementer → ready&lt;/code&gt;, а под раундом — вызовы модели (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s0s1hzfg\"&gt;· gateway …&lt;/code&gt;), инструменты и доказательства. На верхнем уровне — аномалии &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7n8l5sj2\"&gt;‼&lt;/code&gt;, ваши указания &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lm3jnezf\"&gt;»&lt;/code&gt; и служебные заметки. Успешные задачи сворачиваются, проблемные раскрываются сами.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"ru/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gbf07rho\"&gt;detail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#keybar\"&gt;keybar&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"board\"&gt;&lt;a href=\"ru/glossary.html#board\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;board ()&lt;/span&gt;&lt;/a&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ulwujch5\"&gt;--cli&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Табло (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vr7y4yv0\"&gt;--cli&lt;/code&gt;) — компактный вид прогона, который перерисовывается на месте. Первая строка: прогон, деньги, вызовы и события. Дальше по строке на задачу: трек, фаза, раунды и последний вердикт. Внизу — состояние: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3oguvwd\"&gt;running&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zxly1bwg\"&gt;halted: …&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ujhfy6z\"&gt;stopping — finishing in-flight verdicts…&lt;/code&gt;. Табло нужен терминал; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2dakt43a\"&gt;theia show &amp;lt;runId&amp;gt; --cli&lt;/code&gt; печатает последний кадр.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a3c5baxd\"&gt;run …wvesbyig  $0.0000/$10.00 · 4 calls · 22 events&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rmgdjdfr\"&gt;tsk…xk6rzynf  fast_path  discarded   r6  lead→lead_discard “…”&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xxi8stzj\"&gt;— halted: completed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e095jtjd\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#tui\"&gt;TUI&lt;/a&gt;, &lt;a href=\"ru/glossary.html#summary\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j880nub0\"&gt;summary&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"plain\"&gt;&lt;a href=\"ru/glossary.html#plain\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;--plain&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3inobtft\"&gt;--plain&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Простой вид: по строке на событие журнала, без перерисовки. Подходит для скриптов, CI и файлов. Строки показывают имена событий Theia, а не слова модели: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d51t1407\"&gt;verify_pass&lt;/code&gt;, а не &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ujsp9cm\"&gt;pass&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o6xg0ly4\"&gt;arb_escalate&lt;/code&gt;, а не &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tfm2iw1n\"&gt;escalate&lt;/code&gt;. Строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-19iat9ej\"&gt;live&lt;/code&gt; — только подсказки, в журнал они не пишутся.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p6psuuj5\"&gt;theia run … --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-synxs9n7\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s895fhc5\"&gt;view: --cli needs a TTY — degrading to --plain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verdict\"&gt;verdict&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nodzamxr\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#board\"&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-39vb6qek\"&gt;--cli&lt;/code&gt;)&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"summary\"&gt;&lt;a href=\"ru/glossary.html#summary\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;summary&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ezw3xx8p\"&gt;summary&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Итог прогона: исход каждой задачи, строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4dr82nsv\"&gt;halted:&lt;/code&gt; с числом вызовов и ценой и проверка журнала. Его печатают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bm3ozdz9\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt; без флагов и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2fhmk42z\"&gt;theia run&lt;/code&gt; в конце работы.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g4kzoyoa\"&gt;tsk2akdqb2ilc225pxk6rzynf → discarded (6 rounds) …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9p9253ir\"&gt;halted: completed · 4 gateway calls · $0.0000&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w8qruun0\"&gt;audit chain: intact&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i6ksubqc\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-didnsj9z\"&gt;--plain&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"glyphs\"&gt;&lt;a href=\"ru/glossary.html#glyphs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/span&gt;&lt;/a&gt;✔ ✖ ◆ ◌ ‼ »&lt;/h3&gt;\n&lt;p&gt;Значки TUI:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9s3c6xrx\"&gt;✔&lt;/code&gt; — хорошо: у задачи итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fpap62ya\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rybjyb22\"&gt;planned&lt;/code&gt;, у раунда вердикт не из списка плохих, у прогона — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iwqrhygp\"&gt;completed&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hpekk6h6\"&gt;✖&lt;/code&gt; — плохо: задача отброшена; раунд с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1eces2j5\"&gt;discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c9l8pmz9\"&gt;merge_fail&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-05v38upw\"&gt;verify_fail&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b528v3oh\"&gt;cant_do&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qqpsf14k\"&gt;algedonic&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qc2zp4on\"&gt;no_progress&lt;/code&gt;; прогон остановлен (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kfb9qs2d\"&gt;stopped (…)&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o3azv67y\"&gt;◆&lt;/code&gt; — застряло: задача &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x4swpume\"&gt;escalated&lt;/code&gt; или вопрос без ответа; на домашнем экране — прогон на паузе;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ovysnb1r\"&gt;⣷ ⣯ ⣟ …&lt;/code&gt; (или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-owvrkxna\"&gt;●&lt;/code&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m0h6pjpl\"&gt;--no-spinner&lt;/code&gt;) — идёт работа, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-crvwx7ko\"&gt;◌&lt;/code&gt; — ждёт;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g66pc7nq\"&gt;‼&lt;/code&gt; — аномалия, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ai5d87vt\"&gt;»&lt;/code&gt; — ваше указание, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uf8vbsus\"&gt;·&lt;/code&gt; — текст задачи или доказательство, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0z6jqpqn\"&gt;▼&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6k6gf16g\"&gt;▶&lt;/code&gt; — раскрыто и свёрнуто, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jj57j7na\"&gt;‖&lt;/code&gt; — пауза или остановка, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4hds1lgp\"&gt;❯&lt;/code&gt; — курсор, когда цвета выключены.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Зелёная галочка значит «не плохое событие», а не «хороший итог». Раунды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lzdhdqy6\"&gt;lead → lead_discard&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dkbkrru1\"&gt;arbiter → arb_escalate&lt;/code&gt; тоже отмечены &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ekrweegt\"&gt;✔&lt;/code&gt;, а прогон, где все задачи отброшены, помечен &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yzlxelr9\"&gt;✔ completed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;, &lt;a href=\"ru/glossary.html#completed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8zijezos\"&gt;completed&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#frozen\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5w8d7nn8\"&gt;frozen&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#failed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l91g6jrs\"&gt;failed&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/tui/overview.h
