d-38ibm0oj\"&gt;theia prune&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"audit-branch\"&gt;&lt;a href=\"ru/glossary.html#audit-branch\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c4j06zth\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ветка задачи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dgkrccwg\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt; с её коммитами. В вашем репозитории она появляется только после успешного слияния задачи и остаётся там: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-svz8bixr\"&gt;theia prune&lt;/code&gt; её не удаляет. По ней работает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p3g50rxj\"&gt;theia show &amp;lt;runId&amp;gt; --task &amp;lt;id&amp;gt; [--diff]&lt;/code&gt;. У отброшенной задачи такой ветки нет, и команда пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xnwy7c79\"&gt;audit branch ai/… not found … (in-place run, or the branch was pruned)&lt;/code&gt;; причина в этом сообщении указана неверно.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6bxxvly4\"&gt;untouched: … ai/* audit branches (your repo)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oyylxelh\"&gt;theia prune&lt;/code&gt;, доказательство &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e3k2wm8n\"&gt;merge --no-ff ai/&amp;lt;task&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3la9jf2i\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#show\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9c16mzlc\"&gt;theia show&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"precheck\"&gt;&lt;a href=\"ru/glossary.html#precheck\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s93dmo8f\"&gt;precheck&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Проверка перед слиянием: в копии задачи должны быть коммиты после базы и не должно остаться незакоммиченных правок. Если проверка не прошла, слияния нет, а в доказательстве стоит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-awf9kmgo\"&gt;precheck:&amp;lt;task&amp;gt;&lt;/code&gt; с причиной.&lt;/p&gt;\n&lt;p&gt;Где встречается: TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l3gwjx6w\"&gt;command precheck:2akdqcea5s223wgiwm7ieg — no commits on the task branch&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3mc3v8zq\"&gt;evidence[command] precheck:… (no commits on the task branch)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5kd1t1sm\"&gt;theia diagnose&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merge-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c20gw5mg\"&gt;merge_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merger\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x5aosnlt\"&gt;merger&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"in-place\"&gt;&lt;a href=\"ru/glossary.html#in-place\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u1pn1xg4\"&gt;--in-place&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим без копии и без git: агенты правят файлы прямо в вашей папке, ветки прогона нет, а слияние только отмечает работу как принятую (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u3des3q7\"&gt;merged&lt;/code&gt;). Theia включает этот режим сама, если папка не git-репозиторий. В проекте с несколькими корнями режим недоступен.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1sro30s6\"&gt;mode: in-place (no git repo or --in-place) — no worktree isolation&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w97b7l46\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-store\"&gt;&lt;a href=\"ru/glossary.html#group-store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хранилище и проект&lt;/span&gt;&lt;/a&gt;Хранилище и проект&lt;/h2&gt;\n&lt;h3 id=\"store\"&gt;&lt;a href=\"ru/glossary.html#store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;store&lt;/span&gt;&lt;/a&gt;store&lt;/h3&gt;\n&lt;p&gt;Хранилище — папка данных Theia для проекта: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-adgjtl94\"&gt;.theia&lt;/code&gt; с файлом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pzrwnxv1\"&gt;store.db&lt;/code&gt; внутри. Там журнал событий, планы, память, индекс кода, настройки проекта и копии задач. Где оно лежит:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;в git-репозитории — в корне рабочей копии, даже если &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b2d6niae\"&gt;theia init&lt;/code&gt; запущен из подпапки;&lt;/li&gt;\n&lt;li&gt;вне git — в папке данных пользователя, а папка проекта остаётся чистой;&lt;/li&gt;\n&lt;li&gt;с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j3sv9nur\"&gt;theia init --here&lt;/code&gt; — ровно в текущей папке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Остальные команды ищут хранилище, поднимаясь от текущей папки вверх.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xje00cy\"&gt;store: …/.theia (worktree root)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-64vqe81p\"&gt;theia: no .theia/ found from &amp;lt;cwd&amp;gt; upward (and no user-registry workspace) — run 'theia init' in the workspace home first&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#theia-dir\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zz4q3ly9\"&gt;.theia&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8dnnbpz\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bmukg7fg\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-home-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-25bzfmk5\"&gt;user-home store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detached\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q2h2ru3b\"&gt;detached&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-dir\"&gt;&lt;a href=\"ru/glossary.html#theia-dir\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bp1amagg\"&gt;.theia&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Папка хранилища в проекте. Внутри:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cysi9k3h\"&gt;store.db&lt;/code&gt; — база данных;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yt6lt3aq\"&gt;config/&lt;/code&gt; — настройки проекта: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0zq5yhc1\"&gt;policy.yaml&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l034h157\"&gt;registry.yaml&lt;/code&gt; и другие манифесты;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ua05jl9h\"&gt;prompts/&lt;/code&gt; — ваши дополнения к промптам ролей;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-omg44pm7\"&gt;objects/&lt;/code&gt; — полные выводы команд, запросы и ответы моделей;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5by41qs5\"&gt;index/&lt;/code&gt; — файлы поиска;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-79ecu742\"&gt;runs/&lt;/code&gt; — копии задач и ветки прогонов;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-77tx8c6t\"&gt;control/&lt;/code&gt; — журналы команд, запущенных через MCP.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Theia добавляет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9v8ho1gv\"&gt;.theia/&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k9vi78gv\"&gt;.gitignore&lt;/code&gt;. В папке лежат тексты задач и ответы моделей, поэтому храните её как личные данные. Если папка стала больше 5 ГБ (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tegx78um\"&gt;maintenance.storeAlertGb&lt;/code&gt;), после прогона и в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z1uq8bsh\"&gt;theia doctor&lt;/code&gt; появится строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7hmkjl6a\"&gt;storage: .theia at … — reclaim with 'theia prune'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xv992iuh\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-at0wr8hz\"&gt;.theia store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/audit-prune.html#prune\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oam1gifg\"&gt;theia prune&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"store-db\"&gt;&lt;a href=\"ru/glossary.html#store-db\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9dqptbf9\"&gt;store.db&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Файл базы данных SQLite в хранилище. В нём журналы событий всех прогонов, планы, факты памяти, записи индекса кода и сохранённые ответы моделей. Именно этот файл отличает настоящее хранилище от папки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ihxu97o\"&gt;.theia&lt;/code&gt; с одними настройками.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#overlay\"&gt;overlay&lt;/a&gt;, &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace\"&gt;&lt;a href=\"ru/glossary.html#workspace\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;workspace&lt;/span&gt;&lt;/a&gt;workspace&lt;/h3&gt;\n&lt;p&gt;Рабочая область. У Theia это слово значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Копия репозитория для задачи: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n4ynr0mb\"&gt;.theia/runs/&amp;lt;runId&amp;gt;/ws-&amp;lt;task&amp;gt;&lt;/code&gt; на ветке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2tu5ek1a\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;. В копию попадают и неотслеживаемые файлы вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bk34ds5c\"&gt;node_modules&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-coshq66f\"&gt;.env&lt;/code&gt;, но они не коммитятся. После успешного слияния копия удаляется, у отброшенных и застрявших задач остаётся. В TUI: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p1n2p6na\"&gt;workspace @ 209a8f6 (copy)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ps8daqor\"&gt;kind: Workspace&lt;/code&gt; — манифест проекта с несколькими корнями.&lt;/li&gt;\n&lt;li&gt;Папка проекта с хранилищем (workspace home).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nxozas6t\"&gt;workspace-write&lt;/code&gt; — режим доступа Codex у транспорта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0j39bujr\"&gt;codex-write&lt;/code&gt;: запись только в рабочей папке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g5bahs1t\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace-home\"&gt;workspace home&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-place\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6an35t4k\"&gt;--in-place&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-branch\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d8445e9g\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace-home\"&gt;&lt;a href=\"ru/glossary.html#workspace-home\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;workspace home&lt;/span&gt;&lt;/a&gt;workspace home&lt;/h3&gt;\n&lt;p&gt;Папка проекта, которой принадлежит хранилище: в ней лежит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xohluoz3\"&gt;.theia&lt;/code&gt; со &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mwyrovr1\"&gt;store.db&lt;/code&gt;. Пути корней в манифесте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e76m1l82\"&gt;Workspace&lt;/code&gt; считаются от неё.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xql10w6w\"&gt;… — run 'theia init' in the workspace home first&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zihzb8vx\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"worktree-root\"&gt;&lt;a href=\"ru/glossary.html#worktree-root\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bk798374\"&gt;worktree root&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Верхняя папка рабочей копии git. По умолчанию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pb75jq2y\"&gt;theia init&lt;/code&gt; кладёт хранилище туда, даже если вы запустили команду из подпапки: одно хранилище на рабочую копию.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4i89341a\"&gt;store: …/.theia (worktree root)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y17nlrmr\"&gt;(worktree root — one store per checkout; pass --here to pin it to this subfolder instead)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detached\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uvz7f0sy\"&gt;detached&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"user-home-store\"&gt;&lt;a href=\"ru/glossary.html#user-home-store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wvh69syg\"&gt;user-home store&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Хранилище для папки вне git. Оно лежит в папке данных пользователя (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oardsb72\"&gt;stores/&amp;lt;имя&amp;gt;-&amp;lt;хеш&amp;gt;&lt;/code&gt;), а сама папка проекта остаётся чистой. Какой папке какое хранилище принадлежит, записано в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-koxr9i13\"&gt;workspaces.yaml&lt;/code&gt;. Мастер первой настройки так не делает: он всегда создаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4t4wi1tv\"&gt;.theia&lt;/code&gt; в текущей папке.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zxl1bw62\"&gt;store: …/stores/my-notes-dfef89b4 (user-home store — this folder is not a git worktree and stays clean; …)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspaces-yaml\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-an7yhd1u\"&gt;workspaces.yaml&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"detached\"&gt;&lt;a href=\"ru/glossary.html#detached\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w1fq2vmv\"&gt;detached&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hj1l6j03\"&gt;theia init --here&lt;/code&gt; кладёт хранилище ровно в текущую папку, а не в корень рабочей копии и не в папку пользователя. Theia называет такое хранилище &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-94qowlei\"&gt;detached&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-su7oz3n4\"&gt;store: …/.theia (detached — --here pins the store to this folder)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bj3uy1vb\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspaces-yaml\"&gt;&lt;a href=\"ru/glossary.html#workspaces-yaml\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-11wapt42\"&gt;workspaces.yaml&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Файл в папке настроек пользователя: какой папке вне git какое хранилище принадлежит. Его пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cwqvxzjj\"&gt;theia init&lt;/code&gt;. Если строка ведёт к пропавшему хранилищу, Theia пропускает её и сообщает об этом.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lga982ee\"&gt;theia: registry maps &amp;lt;папка&amp;gt; to &amp;lt;хранилище&amp;gt; but no store.db is there — ignoring the row (…)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#user-home-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wslq5koq\"&gt;user-home store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"root\"&gt;&lt;a href=\"ru/glossary.html#root\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;root&lt;/span&gt;&lt;/a&gt;root&lt;/h3&gt;\n&lt;p&gt;Корень. У Theia это слово значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Репозиторий в проекте с несколькими корнями. У него короткое имя, а флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mynp44lr\"&gt;--root &amp;lt;имя&amp;gt;&lt;/code&gt; сужает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hadnscto\"&gt;index&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hledzj2j\"&gt;mem&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5mykb5tl\"&gt;run&lt;/code&gt; до одного корня. В обычном проекте один корень с именем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jzb9m0cg\"&gt;root&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lsm6jk7e\"&gt;root:&amp;lt;имя&amp;gt;&lt;/code&gt; — часть памяти, записанная с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cdofx6ge\"&gt;--root&lt;/code&gt;; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i67m4rrh\"&gt;theia mem search&lt;/code&gt; она видна как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tcfcm6b9\"&gt;{root:web}&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m0zihokt\"&gt;worktree root&lt;/code&gt; — верхняя папка рабочей копии git, место хранилища по умолчанию.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i4e0kqje\"&gt;root cause&lt;/code&gt; — вероятная причина неудачи в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6xhpq3k2\"&gt;theia diagnose&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-04zyn8uk\"&gt;root: null&lt;/code&gt; в деталях задачи в TUI — у задачи нет отдельного корня.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4hiy56g7\"&gt;theia: unknown root 'nope' (declared: root)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2fgcg11r\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#scope\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-idfa4rj0\"&gt;scope&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pgokrrxg\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z9xc8wtv\"&gt;root cause&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace-manifest\"&gt;&lt;a href=\"ru/glossary.html#workspace-manifest\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-slw7uld7\"&gt;kind: Workspace&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Манифест проекта с несколькими корнями: несколько репозиториев делят одно хранилище. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3t2f3kdy\"&gt;spec.roots&lt;/code&gt; перечислены корни (имя и путь от папки хранилища), в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5y1l2ido\"&gt;spec.primary&lt;/code&gt; — корень по умолчанию. Задачи прогона помечены корнем, а связанные слияния в разных корнях ложатся вместе (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vclohwel\"&gt;run.changeset&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t63rtbua\"&gt;.theia/config/workspace.yaml&lt;/code&gt; от мастера первой настройки, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kwyzqt44\"&gt;multi-root workspace: proj, lib (primary: proj)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-changeset\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a45hii44\"&gt;run.changeset&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"overlay\"&gt;&lt;a href=\"ru/glossary.html#overlay\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;overlay&lt;/span&gt;&lt;/a&gt;overlay&lt;/h3&gt;\n&lt;p&gt;Папка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eaanpcbo\"&gt;.theia&lt;/code&gt; без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9fnrkeux\"&gt;store.db&lt;/code&gt; внутри одного из корней проекта. В ней только свои настройки и промпты для этого корня. При поиске хранилища Theia пропускает такую папку и идёт выше.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hx4yaav0\"&gt;theia: …/.theia has no store.db — per-root overlay, continuing upward&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-706subpx\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-plans\"&gt;&lt;a href=\"ru/glossary.html#group-plans\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Планы&lt;/span&gt;&lt;/a&gt;Планы&lt;/h2&gt;\n&lt;h3 id=\"plan\"&gt;&lt;a href=\"ru/glossary.html#plan\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ga3yzcue\"&gt;plan&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У слова два смысла.&lt;/p&gt;\n&lt;p&gt;План — сохранённый список задач от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8oj9xwez\"&gt;theia plan&lt;/code&gt;: у каждой задачи ключ, трек, зависимости и команды проверки. У плана есть отпечаток содержимого (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9nzsvqwp\"&gt;digest&lt;/code&gt;) и статус: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m0y9gjhb\"&gt;draft&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nksdsq3h\"&gt;approved&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7f746kvj\"&gt;changes_requested&lt;/code&gt;. Запустить можно только одобренный план: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nu8550xm\"&gt;theia run --from-plan &amp;lt;planId&amp;gt;&lt;/code&gt;. Любая правка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-22sygirl\"&gt;theia plan add-context&lt;/code&gt;) даёт новый отпечаток и возвращает план в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-owgazkmg\"&gt;draft&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Фаза &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-491qn3io\"&gt;plan&lt;/code&gt; — шаг задачи трека &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3hfw00p\"&gt;full_spec&lt;/code&gt;, в котором работает планировщик.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ygd4c9by\"&gt;pln2akdqddd5c2223ubqzsvlt [draft] 2 tasks — …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xrueky9w\"&gt;theia plan list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pmx1zuox\"&gt;approved pln… @ fce3554ee5e2…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ld497ehu\"&gt;run run… plan pln… @ fce3554ee5e2… → 2 tasks&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c133qtry\"&gt;task.phase … start → plan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#approved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5wxq8jtq\"&gt;approved&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kp8ubxs9\"&gt;draft&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#changes-requested\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q070nwsh\"&gt;changes_requested&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#digest\"&gt;digest&lt;/a&gt;, &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cwsk37h9\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/plan-and-run.html\"&gt;План перед запуском&lt;/a&gt;, &lt;a href=\"ru/reference/plan.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-415ssac9\"&gt;theia plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"approved\"&gt;&lt;a href=\"ru/glossary.html#approved\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rdcpmfjo\"&gt;approved&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Статус одобренного плана. Только такой план запускает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-12rvnbfo\"&gt;theia run --from-plan&lt;/code&gt;. На план в другом статусе Theia отвечает отказом.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g9eo8zi2\"&gt;run: plan pln… is 'draft', not approved — approve it first (theia plan approve)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5x34qyhx\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mj7xs1ky\"&gt;draft&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"changes-requested\"&gt;&lt;a href=\"ru/glossary.html#changes-requested\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rx523okm\"&gt;changes_requested&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Статус плана после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yvlqvjfo\"&gt;theia plan request-changes &amp;lt;planId&amp;gt; \"…\"&lt;/code&gt;: вы попросили изменений. Отпечаток плана не меняется, а текст просьбы виден в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-53w1tgys\"&gt;theia plan show&lt;/code&gt; строкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rkm35evb\"&gt;note:&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pz1vv19a\"&gt;changes requested on pln…&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-00txigc1\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#approved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rnrju2pb\"&gt;approved&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"open-questions\"&gt;&lt;a href=\"ru/glossary.html#open-questions\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4exca187\"&gt;OPEN QUESTIONS&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У планировщика есть вопросы, а ответить в терминале нельзя, например из-за &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pmjpllci\"&gt;--non-interactive&lt;/code&gt;. Theia сохраняет черновик плана с одним пунктом &lt;a href=\"ru/glossary.html#unresolved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-whc1pmlz\"&gt;unresolved&lt;/code&gt;&lt;/a&gt; и печатает вопросы. Ответ добавьте командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o7whokay\"&gt;theia plan add-context &amp;lt;planId&amp;gt; \"…\"&lt;/code&gt;, затем создайте план заново или одобрите его.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u1jjg2fh\"&gt;OPEN QUESTIONS — plan saved as draft pln…:&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cc4l89u5\"&gt;answer with: theia plan add-context pln… \"…\" — then re-run theia plan or approve&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yqzop8d8\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nciht358\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unresolved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h3bfgiig\"&gt;unresolved&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"unresolved\"&gt;&lt;a href=\"ru/glossary.html#unresolved\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z0e0s082\"&gt;unresolved&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ключ задачи-заглушки в черновике плана, который сохранён с открытыми вопросами (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v9cff8t9\"&gt;OPEN QUESTIONS&lt;/code&gt;). Описание такой задачи начинается словами &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-na04mwf9\"&gt;Resolve open questions, then re-plan: …&lt;/code&gt;. Это не задача для выполнения, а напоминание: ответьте на вопросы командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a0brjplr\"&gt;theia plan add-context &amp;lt;planId&amp;gt; \"…\"&lt;/code&gt; и составьте план заново. Утверждать такой черновик не нужно.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pn0b1y6i\"&gt;unresolved&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dprb95mh\"&gt;theia plan show &amp;lt;planId&amp;gt;&lt;/code&gt; после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rv4pioeh\"&gt;OPEN QUESTIONS — plan saved as draft pln…&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#open-questions\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ckev3qpr\"&gt;OPEN QUESTIONS&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-olhpscv4\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-13x24y74\"&gt;draft&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/plan-and-run.html\"&gt;План перед запуском&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verify-pre-flight\"&gt;&lt;a href=\"ru/glossary.html#verify-pre-flight\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ay0hpwu4\"&gt;verify pre-flight&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Пробный запуск команд проверки из плана на базовом коммите, до одобрения плана. По умолчанию выключен: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ifuadykf\"&gt;run.planVerifyPreflight: disable&lt;/code&gt;. Если команда падает на базе, это нормально, когда задача и должна её починить. Но если падает сама команда, например нет нужного инструмента, исправьте её до одобрения.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ffsmsyk\"&gt;verify pre-flight: off (opt in with policy run.planVerifyPreflight: always)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xb7rzz3h\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n828zs8v\"&gt;verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"cost-estimate\"&gt;&lt;a href=\"ru/glossary.html#cost-estimate\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-koo1h12z\"&gt;cost estimate&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Оценка цены плана по прошлым прогонам в этом хранилище: число задач × средняя цена задачи. Без истории прогонов оценки нет. Та же оценка в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0s8f3ze2\"&gt;theia run --from-plan&lt;/code&gt; называется &lt;a href=\"ru/glossary.html#plan-floor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4jboh8hv\"&gt;plan floor&lt;/code&gt;&lt;/a&gt;: если бюджет по умолчанию меньше неё, запуск отклоняется до первого вызова модели.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zhr1htt7\"&gt;cost estimate: ~$… (N tasks × $… avg/task from recorded runs)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5trpm8zt\"&gt;cost estimate: no run history — no estimate&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3e1nk3hl\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan-floor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bs1wq6t7\"&gt;plan floor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-maxusdperrun\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-stwz21b2\"&gt;run.maxUsdPerRun&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"plan-floor\"&gt;&lt;a href=\"ru/glossary.html#plan-floor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mr2nig92\"&gt;plan floor&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Нижняя оценка стоимости прогона по плану: средняя цена задачи по прошлым платным прогонам этого хранилища × число задач плана. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pfwrs45v\"&gt;theia run --from-plan&lt;/code&gt; сравнивает с ней бюджет до первого вызова модели. Если бюджет взят по умолчанию (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gye3414q\"&gt;run.maxUsdPerRun&lt;/code&gt;) и он ниже оценки, запуск отклоняется с кодом 1: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jdapbanz\"&gt;run: plan floor ~$… exceeds budget $… — pass --budget N explicitly, raise run.maxUsdPerRun, or --budget 0 (unmetered)&lt;/code&gt;. Если бюджет задан флагом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s1hhmwx6\"&gt;--budget&lt;/code&gt;, Theia только предупреждает (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4cpsc7ro\"&gt;run: WARNING — plan floor …&lt;/code&gt;) и продолжает: ждите паузу по бюджету. Без истории платных прогонов оценки нет, и проверки тоже.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a143z3gq\"&gt;run: plan floor ~$12.50 (5 tasks × $2.50 avg/task from this store's recorded runs) exceeds budget $10 — …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yju2omet\"&gt;run: WARNING — plan floor … proceeding on your explicit --budget&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#cost-estimate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m1hxpqsn\"&gt;cost estimate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unmetered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5tn4hnoi\"&gt;unmetered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run.html#run-from-plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r999f785\"&gt;theia run --from-plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"track-override\"&gt;&lt;a href=\"ru/glossary.html#track-override\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8q9yr6jn\"&gt;track override&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c48xepuw\"&gt;theia run --from-plan &amp;lt;planId&amp;gt; --track &amp;lt;трек&amp;gt;&lt;/code&gt; переводит все задачи плана на один трек, только в этом прогоне. Сам план и его отпечаток не меняются.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmmmvkum\"&gt;track override: all 2 tasks forced to full_spec for this run (plan content unchanged)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gavcky6r\"&gt;plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-steering\"&gt;&lt;a href=\"ru/glossary.html#group-steering\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Указания и вопросы&lt;/span&gt;&lt;/a&gt;Указания и вопросы&lt;/h2&gt;\n&lt;h3 id=\"steering\"&gt;&lt;a href=\"ru/glossary.html#steering\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;steering&lt;/span&gt;&lt;/a&gt;steering&lt;/h3&gt;\n&lt;p&gt;Указание — ваше сообщение прогону во время работы: что учесть, что изменить. Theia записывает её событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y7roiqef\"&gt;user.note [msg]&lt;/code&gt; и добавляет в общие заметки (Σ), которые получат следующие шаги. Способы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o5makx3f\"&gt;m&lt;/code&gt; в TUI: указание сразу попадает в прогон этого же процесса. Строка ввода показывает адресата: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d9ei1dxh\"&gt;steer → tsk…x ▸&lt;/code&gt; (задача под курсором) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3zrvji5p\"&gt;steer → run ▸&lt;/code&gt; (весь прогон);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vd8ecs9t\"&gt;theia msg &amp;lt;runId&amp;gt; \"…\"&lt;/code&gt;, с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7gtjj9q1\"&gt;--task &amp;lt;id&amp;gt;&lt;/code&gt; — только для одной задачи;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nxsok9i2\"&gt;theia fork &amp;lt;runId&amp;gt; --with \"…\"&lt;/code&gt; — указание для ответвления.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Указание для завершённой или неизвестной задачи Theia перенаправляет всему прогону и пишет об этом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z8oscvdj\"&gt;theia msg&lt;/code&gt; из другого терминала доходит до прогона на паузе (при продолжении) и до продолженного прогона. Прогон, запущенный заново, указание не прочтёт, хотя &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vosbuy59\"&gt;theia msg&lt;/code&gt; ответит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hzv831d3\"&gt;noted — this run appears live …&lt;/code&gt;. Подробнее — в статье &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ts1rwleo\"&gt;noted for task …fd7pn6tz — folds into its guidance only&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-38evb5za\"&gt;noted — folds into guidance on: theia run --resume run…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fvfb0dl1\"&gt;task …xk6rzynf is terminal — rerouted to run-level guidance (…)&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fe32xj7x\"&gt;» steer [msg] …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hlpjzja1\"&gt;user.note&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#sigma\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-owdbz4x9\"&gt;sigma&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;, &lt;a href=\"ru/reference/run-control.html#msg\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pxczlzv2\"&gt;theia msg&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"control-bus\"&gt;&lt;a href=\"ru/glossary.html#control-bus\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;control bus&lt;/span&gt;&lt;/a&gt;control bus&lt;/h3&gt;\n&lt;p&gt;Шина управления — способ управлять прогоном из другого процесса без отдельного сервера. Команда или инструмент дописывает событие в журнал прогона, а прогон читает новые события между шагами. Так устроены &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z2svnt8d\"&gt;theia msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-evlabjyh\"&gt;theia answer&lt;/code&gt;, режим вопросов &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iny3mbhx\"&gt;--interaction bus&lt;/code&gt; и инструменты MCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wk8dp049\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dvgf9qpz\"&gt;run_answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n5jx96cy\"&gt;run_stop&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 шину читает только продолженный прогон — запущенный командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rzko00kt\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. Прогон, начатый через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xfl6twjs\"&gt;theia run --task …&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wim09y6a\"&gt;--from-plan&lt;/code&gt;, а также каждый прогон от инструмента MCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ecxticto\"&gt;run_start&lt;/code&gt; шину не читает. События попадают в журнал, но прогон идёт дальше, как будто их нет: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n3mnn8i4\"&gt;theia msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kakydk5k\"&gt;theia answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0jl0o44z\"&gt;--interaction bus&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-blay4x7x\"&gt;run_stop&lt;/code&gt; на него не действуют. Ответы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-txzyn8xr\"&gt;noted — this run appears live: …&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3bh5csg6\"&gt;honored at the next dispatch boundary&lt;/code&gt; в этом случае вводят в заблуждение.&lt;/p&gt;\n&lt;p&gt;Что работает: клавиши &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ya9vt8k8\"&gt;m&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m5ky55qe\"&gt;q&lt;/code&gt; в TUI того же процесса, Ctrl+C в терминале прогона, а также команды шины после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qu0ht97z\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. Порядок действий — в разделе &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-en6uo1sy\"&gt;noted — this run appears live: it folds cross-process notes at its next dispatch boundary …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dibapy9d\"&gt;N questions waiting&lt;/code&gt; в строке статуса.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-stop-request\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-owefykce\"&gt;run.stop_request&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-question\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uuxkw1mt\"&gt;run.question&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dispatch-boundary\"&gt;dispatch boundary&lt;/a&gt;, &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dispatch-boundary\"&gt;&lt;a href=\"ru/glossary.html#dispatch-boundary\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;dispatch boundary&lt;/span&gt;&lt;/a&gt;dispatch boundary&lt;/h3&gt;\n&lt;p&gt;Момент между шагами прогона. В этот момент прогон проверяет запрос на остановку и новые указания. Шаг, который уже идёт, включая команду проверки, сначала доделывается. Внутрь идущего вызова модели указание не попадает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xstozkc2\"&gt;honored at the next dispatch boundary (in-flight work lands first)&lt;/code&gt; (ответ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bh8b4kj1\"&gt;run_stop&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a225m2sv\"&gt;… at its next dispatch boundary&lt;/code&gt; (ответ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-otlxcdqr\"&gt;theia msg&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mgf2rqlu\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"clarify\"&gt;&lt;a href=\"ru/glossary.html#clarify\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-khu79omh\"&gt;clarify&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Уточняющий вопрос (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ida8xf74\"&gt;clarify&lt;/code&gt;) — роль не может продолжать без вашего ответа. Спросить могут только планировщик и ведущий, у каждого вопроса есть пояснение, зачем он нужен. Куда приходит вопрос:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;в TUI — форма в панели деталей: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f8uodedm\"&gt;clarify — task …x (1/2)&lt;/code&gt; и строка ввода &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yn1dnf46\"&gt;answer ▸&lt;/code&gt;. Enter — следующий вопрос, пустой ответ — пропуск, Esc — отказ от остальных;&lt;/li&gt;\n&lt;li&gt;в обычном терминале — строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s7g7krxl\"&gt;the planner needs answers before proceeding:&lt;/code&gt; (так же и для ведущего) и вопросы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zmsdn2n5\"&gt;? …&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;в режиме &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4dwrnl91\"&gt;--interaction bus&lt;/code&gt; — событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wy4be3c8\"&gt;run.question&lt;/code&gt; и ответ через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y3i5olsz\"&gt;theia answer&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ответы Theia сохраняет фактами памяти &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cyl1h0z0\"&gt;Q: … A: …&lt;/code&gt;, чтобы не спрашивать снова. Без ответа задача замирает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqebu66z\"&gt;escalated&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yez1llh6\"&gt;clarify_unanswered&lt;/code&gt;). Второй подряд вопрос без ответа ставит прогон на паузу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-744m4cfi\"&gt;clarify_stalled&lt;/code&gt;). С &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mm8q2xs2\"&gt;--non-interactive&lt;/code&gt; вопрос сразу остаётся без ответа.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#clarify-unanswered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jxex38n7\"&gt;clarify_unanswered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n3v5guzl\"&gt;clarify_stalled&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-question\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-615if5vz\"&gt;run.question&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#non-interactive\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s1k0r5xs\"&gt;--non-interactive&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fact\"&gt;fact&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"probe\"&gt;&lt;a href=\"ru/glossary.html#probe\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2daooflo\"&gt;probe&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вопрос о прогоне (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tg39rq9i\"&gt;probe&lt;/code&gt;) — разовый вопрос модели о состоянии прогона: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-foxhidny\"&gt;theia probe &amp;lt;runId&amp;gt; \"…\"&lt;/code&gt;. Прогон при этом не меняется: Theia пишет только отдельную запись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-txgtnb5v\"&gt;run.probed&lt;/code&gt;. Вопрос — это один вызов модели, лимит по умолчанию — 1 доллар (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-af9wjed5\"&gt;--budget&lt;/code&gt;). Тот же вопрос повторно отвечается бесплатно из записи. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-48xgfwj0\"&gt;theia prune&lt;/code&gt; такие записи не удаляет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mli3wtf2\"&gt;[probe run2akdqbfu2w223occvaxl3w of run2akdqb2i4k223pwvesbyig @ …bjr37ync — $0.0000; parent untouched]&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-76ya88b8\"&gt;· run…  probe&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#none\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p6aqdxrs\"&gt;none&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-msznahhd\"&gt;ask&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6xmm43lk\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run-control.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8krxom8g\"&gt;theia probe&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-inspect\"&gt;&lt;a href=\"ru/glossary.html#group-inspect\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разбор прогона&lt;/span&gt;&lt;/a&gt;Разбор прогона&lt;/h2&gt;\n&lt;h3 id=\"audit-chain\"&gt;&lt;a href=\"ru/glossary.html#audit-chain\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;audit chain&lt;/span&gt;&lt;/a&gt;audit chain&lt;/h3&gt;\n&lt;p&gt;Цепочка аудита — защита журнала от подмены. Каждое событие хранит отпечаток предыдущего, и Theia проверяет, что цепочка не порвана. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lpstp5sx\"&gt;intact&lt;/code&gt; — журнал цел, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qxat9v8m\"&gt;BROKEN&lt;/code&gt; — его изменили после записи. Прогон со сломанной цепочкой нельзя продолжить или ответвить.&lt;/p&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8y69ya57\"&gt;theia audit verify&lt;/code&gt; проверяет цепочки всех записей: прогонов, вопросов &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dupdqxmb\"&gt;probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qbjqmyvj\"&gt;ask&lt;/code&gt;, планов и индекса. В 0.2.201 для несуществующего имени команда тоже пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0cz7jhyu\"&gt;intact&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nostkrhm\"&gt;audit chain: intact&lt;/code&gt; в итоге, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ycu9ed3c\"&gt;2akdqb2i4k223pwvesbyig: intact&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nmjo23sg\"&gt;index: intact&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uh1vp2an\"&gt;theia audit verify&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-apgeh8g5\"&gt;‼ audit chain BROKEN at …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-smpfvy79\"&gt;replay&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/audit-prune.html#audit-verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eledke73\"&gt;theia audit verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"replay\"&gt;&lt;a href=\"ru/glossary.html#replay\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4yc2l8gm\"&gt;replay&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Воспроизведение по журналу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0v13ero1\"&gt;replay&lt;/code&gt;) — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7tpnsvq6\"&gt;theia replay &amp;lt;runId&amp;gt;&lt;/code&gt; заново читает журнал прогона и пересчитывает итог. Задачи не выполняются, модель не вызывается, ничего не меняется. Команда печатает число событий и состояние цепочки, итоговые фазы задач, число вердиктов и вызовов, а также общие заметки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-elezolup\"&gt;sigma: {…}&lt;/code&gt;. Если цепочка сломана, код выхода — 1.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gwh2ut82\"&gt;events: 22; chain: intact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6d1qugvj\"&gt;verdicts: 6; gateway calls: 4&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yzswfb8a\"&gt;sigma: {}&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"ru/glossary.html#sigma\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-91d9ptsp\"&gt;sigma&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ovne7bna\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-35s7wgas\"&gt;theia replay&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fork\"&gt;&lt;a href=\"ru/glossary.html#fork\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hap6sh0t\"&gt;fork&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ответвление прогона (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kafmakoi\"&gt;fork&lt;/code&gt;) — новый прогон, который копирует журнал исходного до выбранного события и дальше идёт иначе. Команда: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-87p46y85\"&gt;theia fork &amp;lt;runId&amp;gt; --at &amp;lt;событие&amp;gt; --with \"…\"&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5hbjijd7\"&gt;--at&lt;/code&gt; — событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1x8mbe9a\"&gt;verdict&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1lz666jk\"&gt;task.phase&lt;/code&gt;, подойдёт короткий номер из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-geilv4oa\"&gt;show --plain&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uw8qxbl2\"&gt;--with&lt;/code&gt; — указание для нового пути. Запускает ответвление &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9gs0iclh\"&gt;theia run --resume &amp;lt;новый id&amp;gt;&lt;/code&gt;. Бюджет ответвления по умолчанию — 5 долларов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;ul&gt;\n&lt;li&gt;Ответвление завершённого прогона без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uh8mbdz1\"&gt;--at&lt;/code&gt; продолжить нельзя: все задачи в нём уже закончены.&lt;/li&gt;\n&lt;li&gt;Продолженное ответвление сливает работу не в ветку прогона, а в вашу текущую ветку.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kqrikmw1\"&gt;forked run… @ bjr37ync → run…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5356ld7i\"&gt;drive it: theia run --resume run…   (gateway: hybrid — prefix replays free)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r4lu0yj1\"&gt;forked from … at …&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lc003imn\"&gt;fork → … at … (&amp;lt;причина&amp;gt;)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-85rwpdq9\"&gt;theia show&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vfb25izr\"&gt;forked·&amp;lt;итог&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hybrid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a06l0l7t\"&gt;hybrid&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-forked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ibeg33f8\"&gt;run.forked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#post-baseline\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xgfdrzbq\"&gt;post-baseline&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7m0utgi3\"&gt;theia fork&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"hybrid\"&gt;&lt;a href=\"ru/glossary.html#hybrid\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mhyfsfox\"&gt;hybrid&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим шлюза для ответвлений, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4msoio5w\"&gt;probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rtjih80u\"&gt;ask&lt;/code&gt;. Если ответ на такой же запрос уже сохранён, Theia берёт его бесплатно, а новые запросы отправляет модели и сохраняет. Надпись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f16arh0m\"&gt;prefix replays free&lt;/code&gt; у ответвления значит только, что скопированная часть не выполняется заново. Сохранённые ответы исходного прогона есть, только если он шёл с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qk5fnck6\"&gt;--record&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h11ctxhu\"&gt;(gateway: hybrid — prefix replays free)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f053h6ni\"&gt;fork resume: gateway in hybrid mode (recorded prefix replays free)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#recording\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ut5wuqc5\"&gt;--record&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xbbwroey\"&gt;fork&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"recording\"&gt;&lt;a href=\"ru/glossary.html#recording\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jucwcdkl\"&gt;--record&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qekynw2a\"&gt;theia run --record&lt;/code&gt; сохраняет каждый ответ модели в хранилище, чтобы потом повторить его без вызова. Нужен в основном для экспериментов с ответвлениями. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-axd93djr\"&gt;theia prune&lt;/code&gt; сохранённые ответы не удаляет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nqg4n7ti\"&gt;untouched: unfinished runs, gateway recordings (request-keyed, shared), …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dzeur9d2\"&gt;theia prune&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hybrid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dmj6k59v\"&gt;hybrid&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ret4ebkc\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay-miss\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hc3o1c82\"&gt;replay_miss&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"post-baseline\"&gt;&lt;a href=\"ru/glossary.html#post-baseline\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-txerd6r7\"&gt;post-baseline&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Траты после точки старта прогона. Для ответвления это траты после отделения: скопированная часть не считается. Так &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w1rkr2xn\"&gt;theia compare&lt;/code&gt; сравнивает цену двух прогонов.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pvu6t1js\"&gt;cost A (post-baseline): $0.0000&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href
