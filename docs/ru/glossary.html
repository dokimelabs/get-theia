le=\"button\" tabindex=\"0\" id=\"inline-code-id-4iqb9s7c\"&gt;✔ completed · run run…&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9b8ad8fv\"&gt;✔ run…  completed  $0.0000&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-91j9gy2b\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f0fqgcft\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"paused\"&gt;&lt;a href=\"ru/glossary.html#paused\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-swhypgu8\"&gt;paused&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Прогон на паузе: новые шаги не начинаются, журнал цел, прогон можно продолжить командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l18lbesx\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. Код выхода &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xwb6p0n1\"&gt;theia run&lt;/code&gt; при паузе — 0. Пауза бывает:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;после первого Ctrl+C в терминале или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ietw9aix\"&gt;q&lt;/code&gt; в TUI;&lt;/li&gt;\n&lt;li&gt;когда кончился бюджет (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8tspzsqi\"&gt;budget_freeze&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;когда сработала защита от зацикливания (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r8sa51t1\"&gt;dispatch_stalled&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xvkfhlah\"&gt;clarify_stalled&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;по запросу &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-13evurbz\"&gt;run_stop&lt;/code&gt; — только у продолженного прогона.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-korbb9zn\"&gt;run.paused    rounds=8 (resumable)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8maavx2s\"&gt;halted: paused&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1saz4g3i\"&gt;paused — resume with: theia run --resume run…&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hsgz22gx\"&gt;‖ paused&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmui7pap\"&gt;◆ run…  paused&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-04j3tc1r\"&gt;--resume&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-va5x7o5q\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget-freeze\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m1aqu6ts\"&gt;budget_freeze&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dispatch-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0cqfgpg5\"&gt;dispatch_stalled&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"abandoned\"&gt;&lt;a href=\"ru/glossary.html#abandoned\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6wel1cs6\"&gt;abandoned&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Прогон закрыт без результата командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nc6btqwj\"&gt;theia run --abandon &amp;lt;runId&amp;gt;&lt;/code&gt;. Theia дописывает в журнал конец прогона &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uj6vkv90\"&gt;halted: abandoned&lt;/code&gt; и ничего не удаляет: копии задач остаются, место освобождает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9hqdkimf\"&gt;theia prune&lt;/code&gt;. Команда не останавливает прогон, который ещё работает в другом терминале: для этого нажмите там Ctrl+C.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u9vm603u\"&gt;theia run --resume&lt;/code&gt; не отказывается продолжать закрытый прогон.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nbn1kb31\"&gt;abandoned run… — workspaces kept; reclaim with 'theia prune'&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4e704fl1\"&gt;halted: abandoned&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-41r0rzsr\"&gt;✖ stopped (abandoned)&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ce1e24nl\"&gt;✖ run…  abandoned&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ruhovelm\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bg5mf7jn\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4gkwtyz5\"&gt;--resume&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/audit-prune.html#prune\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zf35dfg1\"&gt;theia prune&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"still-open\"&gt;&lt;a href=\"ru/glossary.html#still-open\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p90feapq\"&gt;(still open)&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Так &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iyepuvp4\"&gt;theia show&lt;/code&gt; пишет итог, когда в журнале нет ни конца прогона, ни паузы. Причины: прогон ещё идёт, его убили (второй Ctrl+C, закрытое окно терминала) или это запись вопроса &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6mhn10jd\"&gt;probe&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oocyqven\"&gt;ask&lt;/code&gt;. Убитый прогон остаётся открытым, пока вы его не продолжите (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iqaa0y99\"&gt;--resume&lt;/code&gt;) или не закроете (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6zztrpzn\"&gt;--abandon&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qu970e51\"&gt;halted: (still open) · 0 gateway calls · $0.0000&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yipl01d8\"&gt;⣽ run…  in flight&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vnykg1b5\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hryqxs3m\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hard-stop\"&gt;hard stop&lt;/a&gt;, &lt;a href=\"ru/glossary.html#abandoned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8h2jkpx\"&gt;abandoned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"resume\"&gt;&lt;a href=\"ru/glossary.html#resume\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7fd2zzs4\"&gt;--resume&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-19g9cvet\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt; продолжает прогон с того места, где он остановился. Theia читает журнал: готовые шаги не повторяются, прерванный шаг начинается заново, бюджет пересчитывается по записанным тратам. Слово в скобках в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3nawyj1l\"&gt;resuming run …&lt;/code&gt; — состояние по журналу: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i2g53bui\"&gt;paused&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y8vjta1x\"&gt;live&lt;/code&gt; (прогон убили без паузы) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nj0zhn7i\"&gt;finished&lt;/code&gt;. Продолженный прогон читает шину управления, а прогон, запущенный заново, — нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3slt53m4\"&gt;resuming run run… (paused; budget 10.00 usd remaining)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g13jbje8\"&gt;run branch: theia/run-47z2qh (resumed @ 3c0d7a9)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tu3o70ej\"&gt;resume: all tasks terminal (finished) — nothing to resume&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0bgfodr6\"&gt;paused&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget-remaining\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yur2j6ma\"&gt;budget remaining&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;, &lt;a href=\"ru/reference/run.html#run\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fudl1gwu\"&gt;theia run&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"stopping\"&gt;&lt;a href=\"ru/glossary.html#stopping\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-379eztfz\"&gt;stopping&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Мягкая остановка. Первый Ctrl+C или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l2gr9e6p\"&gt;q&lt;/code&gt; в TUI просит прогон остановиться: новые шаги не начинаются, текущие доделываются, потом прогон встаёт на паузу.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xw6k9ig1\"&gt;--plain&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8431tkp1\"&gt;--cli&lt;/code&gt; Ctrl+C из терминала получает и работающая команда проверки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ds03jxew\"&gt;--verify&lt;/code&gt;. Она погибает, и Theia записывает ложный провал &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a0w0cgm4\"&gt;verify_fail&lt;/code&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c390v049\"&gt;exit null&lt;/code&gt;. В TUI такой проблемы нет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8j5j3fw8\"&gt;‖ stopping — in-flight verdicts landing…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ykb3rhbr\"&gt;stopping gracefully — in-flight verdicts will land; resume with: …&lt;/code&gt;, табло &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dth63ydq\"&gt;stopping — finishing in-flight verdicts…&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-275c0fjm\"&gt;paused&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hard-stop\"&gt;hard stop&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dispatch-boundary\"&gt;dispatch boundary&lt;/a&gt;, &lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"hard-stop\"&gt;&lt;a href=\"ru/glossary.html#hard-stop\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;hard stop&lt;/span&gt;&lt;/a&gt;hard stop&lt;/h3&gt;\n&lt;p&gt;Жёсткая остановка — второй Ctrl+C или второй &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vx0huvra\"&gt;q&lt;/code&gt; в TUI. Theia сразу завершает дочерние процессы и выходит с кодом 130. Записи о паузе в журнале нет, поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t8jnd2qp\"&gt;theia show&lt;/code&gt; пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2yaa7exv\"&gt;halted: (still open)&lt;/code&gt;, но прогон можно продолжить через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z7vxqdm0\"&gt;--resume&lt;/code&gt;. Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-02oahuhw\"&gt;reaper: swept N …&lt;/code&gt; в конце обычного прогона значит, что Theia закрыла оставшиеся лишние процессы.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-np6pshpl\"&gt;hard stop: swept 3 child process(es)/group(s); resume with: theia run --resume …&lt;/code&gt; (после сигнала; в TUI клавиша ничего не печатает).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l9hpsh2r\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ly9zhye4\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e9gz1if0\"&gt;--resume&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"anomaly\"&gt;&lt;a href=\"ru/glossary.html#anomaly\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lztkb1ba\"&gt;anomaly&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия — предупреждение Theia о том, что в прогоне что-то пошло не так: сработала защита, вызов модели не удался, ответ нарушил правила. Каждая аномалия — событие журнала с видом и классом (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u2t1syy0\"&gt;taxonomy&lt;/code&gt;): например, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zospkdaz\"&gt;environment&lt;/code&gt; — сбой среды, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1dsn7prm\"&gt;termination&lt;/code&gt; — сработал ограничитель, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l0thc8dy\"&gt;planning&lt;/code&gt; — ошибка разбиения задачи. Сама по себе аномалия прогон не останавливает; что будет дальше, зависит от вида. Виды описаны ниже.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bv2eeukn\"&gt;!! anomaly    stop_and_fix taskId=… fails=3&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5he2wvpp\"&gt;· !! 2 anomalies&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-noxcbfc4\"&gt;‼ anomaly &amp;lt;kind&amp;gt; tsk…x ×3&lt;/code&gt;, заголовок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vd5n6mrn\"&gt;anomalies 6&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w7z8os7x\"&gt;taxonomy: environment=4&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6lwcyjy2\"&gt;theia diagnose&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s9yxzyhd\"&gt;root cause&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"stop-and-fix\"&gt;&lt;a href=\"ru/glossary.html#stop-and-fix\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-130ymdsa\"&gt;stop_and_fix&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Защита от бесконечных провалов проверки. После трёх &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lesr5zhr\"&gt;verify_fail&lt;/code&gt; подряд (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ld5vafh\"&gt;run.stopAndFixAfterFailures&lt;/code&gt;) Theia пишет аномалию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c1ew49oy\"&gt;stop_and_fix&lt;/code&gt; и отправляет задачу ведущему событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x462jtc3\"&gt;stop_and_fix&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ndtlew4\"&gt;theia diagnose&lt;/code&gt; называет это &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7pi48chh\"&gt;verification-loop&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uuwt0dke\"&gt;!! anomaly    stop_and_fix taskId=… fails=3&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gy1hfiow\"&gt;task.phase … stop_and_fix → escalated&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8sth0xho\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8jd6dqdv\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7mwgo7rs\"&gt;root cause&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"round-budget\"&gt;&lt;a href=\"ru/glossary.html#round-budget\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nv0xe1do\"&gt;round_budget&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: задача исчерпала лимит раундов (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d8rcn7ii\"&gt;run.maxRoundsPerTask&lt;/code&gt;, по умолчанию 10). Шаг засчитывается как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4pl398at\"&gt;no_progress&lt;/code&gt;, и задача идёт к ведущему. На шагах, которые закрывают задачу или спрашивают вас (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6unr7n01\"&gt;approve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nulfz73m\"&gt;lead_accept&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cebo5llq\"&gt;lead_reverify&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kydwzj2c\"&gt;clarify&lt;/code&gt;), защита не срабатывает.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"ru/glossary.html#no-progress\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o9n1i11o\"&gt;no_progress&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"rescope-budget\"&gt;&lt;a href=\"ru/glossary.html#rescope-budget\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ul7kg14d\"&gt;rescope_budget&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: у ведущего кончились пересмотры задачи (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9w78wqwy\"&gt;run.maxRescopes&lt;/code&gt;, по умолчанию 2). Theia отбрасывает задачу событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-38079xjw\"&gt;lead_discard&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#rescope\"&gt;rescope&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead-discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bceqzfgh\"&gt;lead_discard&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fresh-perspective\"&gt;&lt;a href=\"ru/glossary.html#fresh-perspective\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1qt2gr5n\"&gt;fresh_perspective&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия-отметка: после двух попыток в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wo3z3f7f\"&gt;implement&lt;/code&gt; задачу берёт свежий исполнитель (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2xc7kcwl\"&gt;fresh_implementer&lt;/code&gt;). Это не ошибка, а смена подхода.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g6lwizjr\"&gt;!! anomaly    fresh_perspective taskId=… dispatches=2&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fresh-implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hs6bs6yr\"&gt;fresh_implementer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dispatch-stalled\"&gt;&lt;a href=\"ru/glossary.html#dispatch-stalled\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bwj0nu2w\"&gt;dispatch_stalled&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: три шага подряд по одной задаче закончились &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-48gavw4l\"&gt;no_progress&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqiao4tp\"&gt;run.stallPauseAfter&lt;/code&gt;). Обычно это сбой среды: нет входа в движок, неверный маршрут, нет сети. Прогон встаёт на паузу, чтобы не тратить вызовы впустую. Исправьте причину и продолжите прогон через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jpqb0uug\"&gt;--resume&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dy02pa1q\"&gt;!! anomaly    dispatch_stalled taskId=… consecutive=3&lt;/code&gt;, затем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qg5jge1c\"&gt;run.paused    rounds=8 (resumable)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#no-progress\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j9nxtf1f\"&gt;no_progress&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#environment-failure\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5nnsipj9\"&gt;environment_failure&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iodk27tm\"&gt;paused&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"environment-failure\"&gt;&lt;a href=\"ru/glossary.html#environment-failure\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a7jdv0q7\"&gt;environment_failure&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: вызов модели не удался по вине среды, а не агента. Например, транспорт не зарегистрирован, нет входа в движок или процесс движка упал. Причина — в поле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7uzgpmxw\"&gt;reason=&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sihidwo7\"&gt;!! anomaly    environment_failure taskId=… role=lead phase=escalated reason=gateway fatal: …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#no-progress\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rdqebnvi\"&gt;no_progress&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dispatch-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-icp5vcu8\"&gt;dispatch_stalled&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ztbre72p\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"clarify-unanswered\"&gt;&lt;a href=\"ru/glossary.html#clarify-unanswered\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vh9z2khd\"&gt;clarify_unanswered&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: на уточняющий вопрос никто не ответил — нет терминала, задан &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-00855n88\"&gt;--non-interactive&lt;/code&gt; или вы отказались отвечать. Задача замирает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xthqhb5u\"&gt;escalated&lt;/code&gt;, а ведущий узнаёт, что ответа не было.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hgznq0wj\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b3ijqgcf\"&gt;clarify_stalled&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"clarify-stalled\"&gt;&lt;a href=\"ru/glossary.html#clarify-stalled\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wqj8gtth\"&gt;clarify_stalled&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: вопросы зашли в тупик — два вопроса подряд без ответа или три ответа подряд без других шагов. Прогон встаёт на паузу. Дальше решаете вы: дать указание или изменить настройки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dswpwd0u\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bsmzobzr\"&gt;paused&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"illegal-verdict\"&gt;&lt;a href=\"ru/glossary.html#illegal-verdict\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-icywp4vn\"&gt;illegal_verdict&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: роль ответила словом, которое в этой фазе не разрешено. Шаг засчитывается как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o8kvrtnc\"&gt;no_progress&lt;/code&gt;. В 0.2.201 эта же аномалия появляется, когда задачу остановила проверка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-on12hxe1\"&gt;pre-task&lt;/code&gt; или отказ по размеру контекста.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#no-progress\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rtzpe7wo\"&gt;no_progress&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#pre-task\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6gx1469x\"&gt;pre-task&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o9rc969r\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"planned-without-subtasks\"&gt;&lt;a href=\"ru/glossary.html#planned-without-subtasks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-elvkva53\"&gt;planned_without_subtasks&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: планировщик ответил &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z1pqq2b1\"&gt;planned&lt;/code&gt;, но подзадач не дал. Theia считает ответ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vc52vw6j\"&gt;ready&lt;/code&gt;, и задача идёт к исполнителю, а не закрывается без кода.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-upwabhdw\"&gt;planned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planner\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5lnds8qw\"&gt;planner&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"accept-unverified\"&gt;&lt;a href=\"ru/glossary.html#accept-unverified\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jiuo9sov\"&gt;accept_unverified&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: ведущий попытался принять работу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k09x9wcy\"&gt;lead_accept&lt;/code&gt;) без успешной проверки. Theia работу не принимает и засчитывает шаг как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-juk1e8bh\"&gt;no_progress&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#lead-accept\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d3ulznxh\"&gt;lead_accept&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hhgimrmi\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"delegation-refused\"&gt;&lt;a href=\"ru/glossary.html#delegation-refused\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4cn9to8p\"&gt;delegation_refused&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: подзадачи предложила роль, которой это нельзя. Делить задачу могут только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-99bmusxo\"&gt;planner&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2g5ix194\"&gt;lead&lt;/code&gt;. Подзадачи не создаются.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#planner\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h9jzdlqi\"&gt;planner&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zvh73t4l\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"delegation-depth\"&gt;&lt;a href=\"ru/glossary.html#delegation-depth\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-olernvb5\"&gt;delegation_depth&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: подзадачи вложены слишком глубоко. По умолчанию разрешён один уровень (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-huaxidbr\"&gt;run.maxDelegationDepth&lt;/code&gt;). Новые подзадачи не создаются.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#delegation-fanout\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o3km92pk\"&gt;delegation_fanout&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gwh7d57i\"&gt;planned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"delegation-fanout\"&gt;&lt;a href=\"ru/glossary.html#delegation-fanout\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ivouzmgy\"&gt;delegation_fanout&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: за один ответ предложено больше подзадач, чем можно (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-34rr7zp8\"&gt;run.maxDelegationFanout&lt;/code&gt;, по умолчанию 4). Theia создаёт только первые четыре.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#delegation-depth\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5wju1c0s\"&gt;delegation_depth&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lk2yjv74\"&gt;planned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"replay-miss\"&gt;&lt;a href=\"ru/glossary.html#replay-miss\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3nyfm8qq\"&gt;replay_miss&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия режима повтора записанных вызовов: для запроса нет сохранённого ответа. Нужна разработчикам платформы при проверке повторяемости. С командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yz0w1riz\"&gt;theia replay&lt;/code&gt; не связана: та модель не вызывает.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#recording\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v0tyr5g3\"&gt;--record&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hybrid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dwkx62zw\"&gt;hybrid&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"changeset-partial\"&gt;&lt;a href=\"ru/glossary.html#changeset-partial\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xtlsgx1k\"&gt;changeset_partial&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия прогона с несколькими корнями: часть связанных слияний легла, а часть — нет. Theia либо откатывает уже слитое (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vouep0t4\"&gt;revert&lt;/code&gt;, по умолчанию), либо замораживает задачи (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2fcxw9m6\"&gt;freeze&lt;/code&gt;), и называет недоделанный набор. Выбор задаёт параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kdwcu40b\"&gt;run.changesetPartialFailure&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-changeset\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ojwigo9u\"&gt;run.changeset&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-money\"&gt;&lt;a href=\"ru/glossary.html#group-money\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деньги&lt;/span&gt;&lt;/a&gt;Деньги&lt;/h2&gt;\n&lt;h3 id=\"budget\"&gt;&lt;a href=\"ru/glossary.html#budget\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;budget&lt;/span&gt;&lt;/a&gt;budget&lt;/h3&gt;\n&lt;p&gt;Бюджет — лимит денег на прогон в долларах США. По умолчанию 10 (параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-owb5vgls\"&gt;run.maxUsdPerRun&lt;/code&gt;). Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mwuwv85p\"&gt;--budget&lt;/code&gt; меняет его, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7mavdude\"&gt;0&lt;/code&gt; снимает лимит. Theia фиксирует цену каждого &lt;a href=\"ru/glossary.html#gateway-call\"&gt;вызова шлюза&lt;/a&gt; и вычитает её из бюджета.&lt;/p&gt;\n&lt;p&gt;Когда деньги кончаются, прогон не останавливается навсегда, а встаёт на паузу: аномалии &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-npqwsl9l\"&gt;budget_exhausted&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cfg3svb4\"&gt;budget_freeze&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bfl1cmlo\"&gt;halted: paused&lt;/code&gt;. Продолжить можно с новым бюджетом: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s93zhoch\"&gt;theia run --resume &amp;lt;runId&amp;gt; --budget &amp;lt;N&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Слово встречается и в других смыслах:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-haf6sf1f\"&gt;halted: budget&lt;/code&gt; — не деньги, а потолок в 1000 вердиктов на прогон.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uz2q0v0e\"&gt;round_budget&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lrksfaes\"&gt;rescope_budget&lt;/code&gt; — лимиты раундов и пересмотров задачи.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kb8u90fw\"&gt;--budget&lt;/code&gt; у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y8f423d3\"&gt;theia fork&lt;/code&gt; (по умолчанию 5), у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z2l96ddl\"&gt;theia probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y5htwjw6\"&gt;theia ask&lt;/code&gt; (по умолчанию 1), у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5h4ldrll\"&gt;theia index build&lt;/code&gt; — свой лимит для этих команд.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aws1uu6q\"&gt;indexBuildBudgetUsd&lt;/code&gt; — лимит на автоматическую сборку индекса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-40qt9rls\"&gt;run.created   budget=$10 track=fast_path&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-odguf0al\"&gt;$0.0000/$10.00&lt;/code&gt; в заголовке TUI и на табло, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j5bt97gk\"&gt;budget remaining: 10&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget-remaining\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nanbrxyi\"&gt;budget remaining&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unmetered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zaryapqh\"&gt;unmetered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget-freeze\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u1ymn5gz\"&gt;budget_freeze&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ax16ym7\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"budget-remaining\"&gt;&lt;a href=\"ru/glossary.html#budget-remaining\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ibh4uayi\"&gt;budget remaining&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nmit9iwp\"&gt;budget remaining: 10&lt;/code&gt; в конце прогона — сколько долларов бюджета осталось. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mv3zo658\"&gt;unmetered&lt;/code&gt; — лимита нет. При продолжении прогона Theia пересчитывает остаток по записанным тратам и пишет его в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nhyrphdm\"&gt;resuming run …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ofxdnhi\"&gt;budget remaining: 10&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-obhzlrnp\"&gt;budget remaining: unmetered&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w02hf5rl\"&gt;resuming run run… (paused; budget 10.00 usd remaining)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unmetered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-shww40pa\"&gt;unmetered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4xwddeb\"&gt;--resume&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"unmetered\"&gt;&lt;a href=\"ru/glossary.html#unmetered\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jlls5s61\"&gt;unmetered&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Без денежного лимита: так работает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yzn82032\"&gt;--budget 0&lt;/code&gt;. Защита от зацикливания при этом остаётся: лимиты раундов и пересмотров, потолок вердиктов. В событии &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ar7y27jm\"&gt;run.created&lt;/code&gt; лимит без денег записан как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dbsn43rb\"&gt;budget=$null&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q12hh2yx\"&gt;budget: 0 = unmetered (loop guards stay: maxTotalRounds, round/rescope budgets)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0lcre4nw\"&gt;budget remaining: unmetered&lt;/code&gt;, табло &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-et0pw9po\"&gt;$0.0000 spent&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget-remaining\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x3xqzrq6\"&gt;budget remaining&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9qh5uv1d\"&gt;halted&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"budget-exhausted\"&gt;&lt;a href=\"ru/glossary.html#budget-exhausted\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pobf4bqa\"&gt;budget_exhausted&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: шлюз отказал в вызове модели, потому что бюджет прогона кончился. Сразу за ней идёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7447ivix\"&gt;budget_freeze&lt;/code&gt;, а вызов в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2l2wkqpy\"&gt;--plain&lt;/code&gt; помечен &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ohtwwpwm\"&gt;→ fatal&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xhybs34\"&gt;!! anomaly    budget_exhausted role=implementer transport=…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a2t1pbie\"&gt;gateway fatal: gateway: usd budget exhausted for this run (THE-024)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget-freeze\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bo1m0e0m\"&gt;budget_freeze&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"budget-freeze\"&gt;&lt;a href=\"ru/glossary.html#budget-freeze\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9bjkxx07\"&gt;budget_freeze&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: прогон встаёт на паузу, потому что кончились деньги. Появляется один раз за прогон. Продолжить можно с новым бюджетом: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cvi165ue\"&gt;theia run --resume &amp;lt;runId&amp;gt; --budget &amp;lt;N&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ogwg6k1o\"&gt;!! anomaly    budget_freeze taskId=… role=implementer&lt;/code&gt;, затем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dmtfk456\"&gt;run.paused … (resumable)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget-exhausted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rgxqyve4\"&gt;budget_exhausted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8gblk79u\"&gt;paused&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-call\"&gt;&lt;a href=\"ru/glossary.html#gateway-call\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;gateway call&lt;/span&gt;&lt;/a&gt;gateway call&lt;/h3&gt;\n&lt;p&gt;Вызов шлюза — один запрос к модели через шлюз. Theia записывает в журнал каждый такой вызов с ролью, транспортом, итогом и ценой, даже отклонённый. Команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1krt6dcm\"&gt;--verify&lt;/code&gt;, слияние git и ответы, взятые из записи, вызовами шлюза не считаются.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ya4y6f0\"&gt;gateway       &amp;lt;role&amp;gt;@&amp;lt;transport&amp;gt; → ok $0.0000&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7sohx9z2\"&gt;4 gateway calls&lt;/code&gt;, заголовок TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o6dtdvbk\"&gt;4 calls&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ep5lh01u\"&gt;· gateway &amp;lt;transport&amp;gt; ok $0.0000&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway\"&gt;gateway&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#locked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z173680k\"&gt;locked&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"locked\"&gt;&lt;a href=\"ru/glossary.html#locked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ptii4kex\"&gt;locked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s6kebqp1\"&gt;$0.0000 locked&lt;/code&gt; — цена, зафиксированная в момент вызова. Theia её не пересчитывает, даже если тарифы потом изменятся.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uzhmgxwv\"&gt;rate: … $0.0000 locked (6ms)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v75ypy9w\"&gt;theia index build&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"ru/glossary.html#pricing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ubbldta2\"&gt;kind: Pricing&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"pricing\"&gt;&lt;a href=\"ru/glossary.html#pricing\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-weags932\"&gt;kind: Pricing&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Необязательный манифест с тарифами моделей (долларов за миллион токенов) и способом расчёта цены для транспорта: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iyvzxvlh\"&gt;costBasis: list&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7y80ncod\"&gt;actual&lt;/code&gt;. Нужен, когда цены по умолчанию вам не подходят, например для подписки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/glossary.html#locked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4j2jw095\"&gt;locked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-maxusdperrun\"&gt;&lt;a href=\"ru/glossary.html#run-maxusdperrun\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ij2odbh\"&gt;run.maxUsdPerRun&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Бюджет прогона по умолчанию в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ys68wwux\"&gt;policy.yaml&lt;/code&gt;: 10 долларов. Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yk9stxz9\"&gt;--budget&lt;/code&gt; важнее. Имя параметра печатается в отказе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xq8qofex\"&gt;run --from-plan&lt;/code&gt;, когда бюджет меньше оценки цены плана.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5fzvxw9y\"&gt;run: plan floor ~$… exceeds budget $… — pass --budget N explicitly, raise run.maxUsdPerRun, or --budget 0 (unmetered)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#cost-estimate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hkco9oc1\"&gt;cost estimate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-git\"&gt;&lt;a href=\"ru/glossary.html#group-git\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Git&lt;/span&gt;&lt;/a&gt;Git&lt;/h2&gt;\n&lt;h3 id=\"run-branch\"&gt;&lt;a href=\"ru/glossary.html#run-branch\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run branch&lt;/span&gt;&lt;/a&gt;run branch&lt;/h3&gt;\n&lt;p&gt;Ветка прогона — git-ветка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ev2cosq\"&gt;theia/run-&amp;lt;6 символов&amp;gt;&lt;/code&gt;, в которую Theia сливает готовые задачи. Шесть символов — конец идентификатора прогона. Ветка начинается от базы, а ваша текущая ветка не меняется. Ветку занимает скрытая рабочая копия git в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xdlc4tk8\"&gt;.theia/runs/&amp;lt;runId&amp;gt;/trunk&lt;/code&gt;, поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-24o28cr5\"&gt;git switch&lt;/code&gt; на неё не сработает. Забрать работу можно через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ryovc51h\"&gt;git merge&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В конце прогона Theia пишет, что лежит в ветке: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ewicctog\"&gt;— N merges ahead of base&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wr81rdut\"&gt;— no merges landed (branch left at base for inspection)&lt;/code&gt;. Число в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8j398bgt\"&gt;merges ahead of base&lt;/code&gt; считает коммиты, а не слияния. Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lbucfieg\"&gt;--branch&lt;/code&gt; задаёт своё имя ветки, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0hch35d0\"&gt;--base&lt;/code&gt; — свою базу, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-db50xhe4\"&gt;--no-run-branch&lt;/code&gt; отключает ветку прогона: слияния тогда идут прямо в вашу текущую ветку.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hhlmqcaq\"&gt;run branch: theia/run-esbyig (base HEAD (no origin remote) @ 4fb42d7)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-91opxxke\"&gt;run branch theia/run-7adeu2 @ 0d391ae — 2 merges ahead of base; …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#base\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lvjc3gsn\"&gt;base&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#trunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hi1j2ybp\"&gt;trunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-branch\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h60ehkae\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gikhl6nx\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"base\"&gt;&lt;a href=\"ru/glossary.html#base\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a1bpm68i\"&gt;base&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;База — коммит, от которого начинается ветка прогона. Theia берёт upstream текущей ветки, если его нет — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f30j7k88\"&gt;origin/HEAD&lt;/code&gt;, иначе локальный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-il4qtj6p\"&gt;HEAD&lt;/code&gt;. Локальные коммиты, которых ещё нет в upstream, в работу прогона не попадут. Чтобы их включить, передайте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hdht7wtz\"&gt;--base HEAD&lt;/code&gt;. Заметка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kj7h088a\"&gt;[workspace_base]&lt;/code&gt; и строка TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xlh2xfxi\"&gt;workspace @ 209a8f6 (copy)&lt;/code&gt; показывают, с какого коммита сделана копия задачи.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eetrek85\"&gt;run branch: theia/run-5yrymu (base origin/main @ d2946e5)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q7dclaq1\"&gt;(base HEAD (no origin remote) @ 4fb42d7)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"trunk\"&gt;&lt;a href=\"ru/glossary.html#trunk\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rkjd8mur\"&gt;trunk&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Папка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0u49x6zh\"&gt;.theia/runs/&amp;lt;runId&amp;gt;/trunk&lt;/code&gt; — скрытая рабочая копия git, в которой открыта ветка прогона. Пока она есть, git не даёт переключиться на ветку прогона или удалить её. Перед удалением ветки выполните &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kq635ssc\"&gt;git worktree remove .theia/runs/&amp;lt;runId&amp;gt;/trunk&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-dir\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g97xt8wc\"&gt;.theia&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"audit-branch\"&gt;&lt;a href=\"ru/glossary.html#audit-branch\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-10dmr8vg\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ветка задачи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uz8cp51a\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt; с её коммитами. В вашем репозитории она появляется только после успешного слияния задачи и остаётся там: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v1xaiawg\"&gt;theia prune&lt;/code&gt; её не удаляет. По ней работает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ygyz5lc3\"&gt;theia show &amp;lt;runId&amp;gt; --task &amp;lt;id&amp;gt; [--diff]&lt;/code&gt;. У отброшенной задачи такой ветки нет, и команда пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e86341ag\"&gt;audit branch ai/… not found … (in-place run, or the branch was pruned)&lt;/code&gt;; причина в этом сообщении указана неверно.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-93hp2ek2\"&gt;untouched: … ai/* audit branches (your repo)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7tt2jg6f\"&gt;theia prune&lt;/code&gt;, доказательство &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vvea3koz\"&gt;merge --no-ff ai/&amp;lt;task&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-evmw3nqc\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#show\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-obfnvng5\"&gt;theia show&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"precheck\"&gt;&lt;a href=\"ru/glossary.html#precheck\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qdn3m7vv\"&gt;precheck&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Проверка перед слиянием: в копии задачи должны быть коммиты после базы и не должно остаться незакоммиченных правок. Если проверка не прошла, слияния нет, а в доказательстве стоит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r9dbnwui\"&gt;precheck:&amp;lt;task&amp;gt;&lt;/code&gt; с причиной.&lt;/p&gt;\n&lt;p&gt;Где встречается: TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d94t9nry\"&gt;command precheck:2akdqcea5s223wgiwm7ieg — no commits on the task branch&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m0j62ijx\"&gt;evidence[command] precheck:… (no commits on the task branch)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1kufneef\"&gt;theia diagnose&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merge-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qiw0mex3\"&gt;merge_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merger\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zzbh26rh\"&gt;merger&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"in-place\"&gt;&lt;a href=\"ru/glossary.html#in-place\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dy5ju6ke\"&gt;--in-place&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим без копии и без git: агенты правят файлы прямо в вашей папке, ветки прогона нет, а слияние только отмечает работу как принятую (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yny2fwhm\"&gt;merged&lt;/code&gt;). Theia включает этот режим сама, если папка не git-репозиторий. В проекте с несколькими корнями режим недоступен.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-di8mcb93\"&gt;mode: in-place (no git repo or --in-place) — no worktree isolation&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xyujcouo\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-store\"&gt;&lt;a href=\"ru/glossary.html#group-store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хранилище и проект&lt;/span&gt;&lt;/a&gt;Хранилище и проект&lt;/h2&gt;\n&lt;h3 id=\"store\"&gt;&lt;a href=\"ru/glossary.html#store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;store&lt;/span&gt;&lt;/a&gt;store&lt;/h3&gt;\n&lt;p&gt;Хранилище — папка данных Theia для проекта: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4mixjy98\"&gt;.theia&lt;/code&gt; с файлом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m5i6zv9h\"&gt;store.db&lt;/code&gt; внутри. Там журнал событий, планы, память, индекс кода, настройки проекта и копии задач. Где оно лежит:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;в git-репозитории — в корне рабочей копии, даже если &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ddirmfi\"&gt;theia init&lt;/code&gt; запущен из подпапки;&lt;/li&gt;\n&lt;li&gt;вне git — в папке данных пользователя, а папка проекта остаётся чистой;&lt;/li&gt;\n&lt;li&gt;с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u0mafurl\"&gt;theia init --here&lt;/code&gt; — ровно в текущей папке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Остальные команды ищут хранилище, поднимаясь от текущей папки вверх.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-417d0mgs\"&gt;store: …/.theia (worktree root)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fxdcgflk\"&gt;theia: no .theia/ found from &amp;lt;cwd&amp;gt; upward (and no user-registry workspace) — run 'theia init' in the workspace home first&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#theia-dir\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7yrz21le\"&gt;.theia&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h0060tmt\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r5kw232z\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-home-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9gbena52\"&gt;user-home store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detached\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uh0peygd\"&gt;detached&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-dir\"&gt;&lt;a href=\"ru/glossary.html#theia-dir\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qvhk16hr\"&gt;.theia&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Папка хранилища в проекте. Внутри:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rpg3q2i9\"&gt;store.db&lt;/code&gt; — база данных;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dfv6ws71\"&gt;config/&lt;/code&gt; — настройки проекта: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-glwd5ffb\"&gt;policy.yaml&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-me0ix0nk\"&gt;registry.yaml&lt;/code&gt; и другие манифесты;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-je69hd96\"&gt;prompts/&lt;/code&gt; — ваши дополнения к промптам ролей;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ayteurkb\"&gt;objects/&lt;/code&gt; — полные выводы команд, запросы и ответы моделей;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9i6doc4q\"&gt;index/&lt;/code&gt; — файлы поиска;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-za46r7yg\"&gt;runs/&lt;/code&gt; — копии задач и ветки прогонов;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uq1m0ip0\"&gt;control/&lt;/code&gt; — журналы команд, запущенных через MCP.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Theia добавляет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vljuxwf4\"&gt;.theia/&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rw8ubxv2\"&gt;.gitignore&lt;/code&gt;. В папке лежат тексты задач и ответы моделей, поэтому храните её как личные данные. Если папка стала больше 5 ГБ (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kg81pa27\"&gt;maintenance.storeAlertGb&lt;/code&gt;), после прогона и в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-404zy82n\"&gt;theia doctor&lt;/code&gt; появится строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-it3uybvv\"&gt;storage: .theia at … — reclaim with 'theia prune'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7juxbh6g\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1pce0jz7\"&gt;.theia store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/audit-prune.html#prune\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sgq9v7tq\"&gt;theia prune&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"store-db\"&gt;&lt;a href=\"ru/glossary.html#store-db\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ia36029u\"&gt;store.db&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Файл базы данных SQLite в хранилище. В нём журналы событий всех прогонов, планы, факты памяти, записи индекса кода и сохранённые ответы моделей. Именно этот файл отличает настоящее хранилище от папки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d55zgi46\"&gt;.theia&lt;/code&gt; с одними настройками.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#overlay\"&gt;overlay&lt;/a&gt;, &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace\"&gt;&lt;a href=\"ru/glossary.html#workspace\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;workspace&lt;/span&gt;&lt;/a&gt;workspace&lt;/h3&gt;\n&lt;p&gt;Рабочая область. У Theia это слово значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Копия репозитория для задачи: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7wpijn0z\"&gt;.theia/runs/&amp;lt;runId&amp;gt;/ws-&amp;lt;task&amp;gt;&lt;/code&gt; на ветке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0gfihwwp\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;. В копию попадают и неотслеживаемые файлы вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"bu
