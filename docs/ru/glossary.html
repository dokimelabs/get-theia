d-e0es15gh\"&gt;theia prune&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"audit-branch\"&gt;&lt;a href=\"ru/glossary.html#audit-branch\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ajnxi06\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ветка задачи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ut3p7avl\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt; с её коммитами. В вашем репозитории она появляется только после успешного слияния задачи и остаётся там: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hqsdik1z\"&gt;theia prune&lt;/code&gt; её не удаляет. По ней работает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-czew85yu\"&gt;theia show &amp;lt;runId&amp;gt; --task &amp;lt;id&amp;gt; [--diff]&lt;/code&gt;. У отброшенной задачи такой ветки нет, и команда пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2xhu1qnp\"&gt;audit branch ai/… not found … (in-place run, or the branch was pruned)&lt;/code&gt;; причина в этом сообщении указана неверно.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5izpk54t\"&gt;untouched: … ai/* audit branches (your repo)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z9e7o16m\"&gt;theia prune&lt;/code&gt;, доказательство &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lx7oo4z1\"&gt;merge --no-ff ai/&amp;lt;task&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0pe2lci8\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#show\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jaugalmu\"&gt;theia show&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"precheck\"&gt;&lt;a href=\"ru/glossary.html#precheck\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8r8apxpc\"&gt;precheck&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Проверка перед слиянием: в копии задачи должны быть коммиты после базы и не должно остаться незакоммиченных правок. Если проверка не прошла, слияния нет, а в доказательстве стоит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yv26t44z\"&gt;precheck:&amp;lt;task&amp;gt;&lt;/code&gt; с причиной.&lt;/p&gt;\n&lt;p&gt;Где встречается: TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tnywwijl\"&gt;command precheck:2akdqcea5s223wgiwm7ieg — no commits on the task branch&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ubdqajai\"&gt;evidence[command] precheck:… (no commits on the task branch)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tlwx8v4t\"&gt;theia diagnose&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merge-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d8e2tpsk\"&gt;merge_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merger\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9u6uabwk\"&gt;merger&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"in-place\"&gt;&lt;a href=\"ru/glossary.html#in-place\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-37qrlg9o\"&gt;--in-place&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим без копии и без git: агенты правят файлы прямо в вашей папке, ветки прогона нет, а слияние только отмечает работу как принятую (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v30f7a4h\"&gt;merged&lt;/code&gt;). Theia включает этот режим сама, если папка не git-репозиторий. В проекте с несколькими корнями режим недоступен.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8h1gvos8\"&gt;mode: in-place (no git repo or --in-place) — no worktree isolation&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pnrsddr9\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-store\"&gt;&lt;a href=\"ru/glossary.html#group-store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хранилище и проект&lt;/span&gt;&lt;/a&gt;Хранилище и проект&lt;/h2&gt;\n&lt;h3 id=\"store\"&gt;&lt;a href=\"ru/glossary.html#store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;store&lt;/span&gt;&lt;/a&gt;store&lt;/h3&gt;\n&lt;p&gt;Хранилище — папка данных Theia для проекта: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-000746cl\"&gt;.theia&lt;/code&gt; с файлом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7ppsrro\"&gt;store.db&lt;/code&gt; внутри. Там журнал событий, планы, память, индекс кода, настройки проекта и копии задач. Где оно лежит:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;в git-репозитории — в корне рабочей копии, даже если &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fy7vjbm6\"&gt;theia init&lt;/code&gt; запущен из подпапки;&lt;/li&gt;\n&lt;li&gt;вне git — в папке данных пользователя, а папка проекта остаётся чистой;&lt;/li&gt;\n&lt;li&gt;с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-74kn7prf\"&gt;theia init --here&lt;/code&gt; — ровно в текущей папке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Остальные команды ищут хранилище, поднимаясь от текущей папки вверх.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-imtpipw6\"&gt;store: …/.theia (worktree root)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5kmkrxtu\"&gt;theia: no .theia/ found from &amp;lt;cwd&amp;gt; upward (and no user-registry workspace) — run 'theia init' in the workspace home first&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#theia-dir\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5lo3hmns\"&gt;.theia&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uobnzq6r\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-idzeqmiu\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-home-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w07f5pxg\"&gt;user-home store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detached\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hub6wpvg\"&gt;detached&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-dir\"&gt;&lt;a href=\"ru/glossary.html#theia-dir\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i4wmztsm\"&gt;.theia&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Папка хранилища в проекте. Внутри:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z7fnnd0p\"&gt;store.db&lt;/code&gt; — база данных;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bxmk17ne\"&gt;config/&lt;/code&gt; — настройки проекта: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hdkg6dg0\"&gt;policy.yaml&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k3a4ytvg\"&gt;registry.yaml&lt;/code&gt; и другие манифесты;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vv2t4v6l\"&gt;prompts/&lt;/code&gt; — ваши дополнения к промптам ролей;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1r40brlv\"&gt;objects/&lt;/code&gt; — полные выводы команд, запросы и ответы моделей;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x2n4stmd\"&gt;index/&lt;/code&gt; — файлы поиска;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-senz3fg3\"&gt;runs/&lt;/code&gt; — копии задач и ветки прогонов;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-el9a8mt0\"&gt;control/&lt;/code&gt; — журналы команд, запущенных через MCP.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Theia добавляет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-izdyn7uz\"&gt;.theia/&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nnfhbbao\"&gt;.gitignore&lt;/code&gt;. В папке лежат тексты задач и ответы моделей, поэтому храните её как личные данные. Если папка стала больше 5 ГБ (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5xl30aet\"&gt;maintenance.storeAlertGb&lt;/code&gt;), после прогона и в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lf31jbjy\"&gt;theia doctor&lt;/code&gt; появится строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xabsi4is\"&gt;storage: .theia at … — reclaim with 'theia prune'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0a73sr3j\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cd7xxpjy\"&gt;.theia store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/audit-prune.html#prune\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9fdjakd0\"&gt;theia prune&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"store-db\"&gt;&lt;a href=\"ru/glossary.html#store-db\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xlrlqukj\"&gt;store.db&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Файл базы данных SQLite в хранилище. В нём журналы событий всех прогонов, планы, факты памяти, записи индекса кода и сохранённые ответы моделей. Именно этот файл отличает настоящее хранилище от папки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kllankxz\"&gt;.theia&lt;/code&gt; с одними настройками.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#overlay\"&gt;overlay&lt;/a&gt;, &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace\"&gt;&lt;a href=\"ru/glossary.html#workspace\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;workspace&lt;/span&gt;&lt;/a&gt;workspace&lt;/h3&gt;\n&lt;p&gt;Рабочая область. У Theia это слово значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Копия репозитория для задачи: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ozoe1lnz\"&gt;.theia/runs/&amp;lt;runId&amp;gt;/ws-&amp;lt;task&amp;gt;&lt;/code&gt; на ветке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vp0z826k\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;. В копию попадают и неотслеживаемые файлы вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-prgjob42\"&gt;node_modules&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zw21d963\"&gt;.env&lt;/code&gt;, но они не коммитятся. После успешного слияния копия удаляется, у отброшенных и застрявших задач остаётся. В TUI: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aiw9n8wq\"&gt;workspace @ 209a8f6 (copy)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lwem2koe\"&gt;kind: Workspace&lt;/code&gt; — манифест проекта с несколькими корнями.&lt;/li&gt;\n&lt;li&gt;Папка проекта с хранилищем (workspace home).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-taf1o8yt\"&gt;workspace-write&lt;/code&gt; — режим доступа Codex у транспорта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-psllrb0n\"&gt;codex-write&lt;/code&gt;: запись только в рабочей папке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tlhz0fqu\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace-home\"&gt;workspace home&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-place\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-klmq98ze\"&gt;--in-place&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-branch\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t2cjl6xz\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace-home\"&gt;&lt;a href=\"ru/glossary.html#workspace-home\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;workspace home&lt;/span&gt;&lt;/a&gt;workspace home&lt;/h3&gt;\n&lt;p&gt;Папка проекта, которой принадлежит хранилище: в ней лежит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fx0fmgho\"&gt;.theia&lt;/code&gt; со &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p1ng6h92\"&gt;store.db&lt;/code&gt;. Пути корней в манифесте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ryjq3r8b\"&gt;Workspace&lt;/code&gt; считаются от неё.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3v1ibu5l\"&gt;… — run 'theia init' in the workspace home first&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j6dv80s8\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"worktree-root\"&gt;&lt;a href=\"ru/glossary.html#worktree-root\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g528j4vf\"&gt;worktree root&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Верхняя папка рабочей копии git. По умолчанию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vet4rk23\"&gt;theia init&lt;/code&gt; кладёт хранилище туда, даже если вы запустили команду из подпапки: одно хранилище на рабочую копию.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5jc22y7u\"&gt;store: …/.theia (worktree root)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i1g6t9p8\"&gt;(worktree root — one store per checkout; pass --here to pin it to this subfolder instead)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detached\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-92n5fzxt\"&gt;detached&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"user-home-store\"&gt;&lt;a href=\"ru/glossary.html#user-home-store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-70ke66yj\"&gt;user-home store&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Хранилище для папки вне git. Оно лежит в папке данных пользователя (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ypdbcfn4\"&gt;stores/&amp;lt;имя&amp;gt;-&amp;lt;хеш&amp;gt;&lt;/code&gt;), а сама папка проекта остаётся чистой. Какой папке какое хранилище принадлежит, записано в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ahf111k\"&gt;workspaces.yaml&lt;/code&gt;. Мастер первой настройки так не делает: он всегда создаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ihzs9h4\"&gt;.theia&lt;/code&gt; в текущей папке.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-me2uucgk\"&gt;store: …/stores/my-notes-dfef89b4 (user-home store — this folder is not a git worktree and stays clean; …)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspaces-yaml\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hmjy4eap\"&gt;workspaces.yaml&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"detached\"&gt;&lt;a href=\"ru/glossary.html#detached\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b3ahe1qu\"&gt;detached&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ee37rtpy\"&gt;theia init --here&lt;/code&gt; кладёт хранилище ровно в текущую папку, а не в корень рабочей копии и не в папку пользователя. Theia называет такое хранилище &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ys22qr3g\"&gt;detached&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6l526npu\"&gt;store: …/.theia (detached — --here pins the store to this folder)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-meyvmhjm\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspaces-yaml\"&gt;&lt;a href=\"ru/glossary.html#workspaces-yaml\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7jjetieo\"&gt;workspaces.yaml&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Файл в папке настроек пользователя: какой папке вне git какое хранилище принадлежит. Его пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dvackunz\"&gt;theia init&lt;/code&gt;. Если строка ведёт к пропавшему хранилищу, Theia пропускает её и сообщает об этом.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3723u2sn\"&gt;theia: registry maps &amp;lt;папка&amp;gt; to &amp;lt;хранилище&amp;gt; but no store.db is there — ignoring the row (…)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#user-home-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c3rn78jx\"&gt;user-home store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"root\"&gt;&lt;a href=\"ru/glossary.html#root\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;root&lt;/span&gt;&lt;/a&gt;root&lt;/h3&gt;\n&lt;p&gt;Корень. У Theia это слово значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Репозиторий в проекте с несколькими корнями. У него короткое имя, а флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ayy6iqc3\"&gt;--root &amp;lt;имя&amp;gt;&lt;/code&gt; сужает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rfaiq2m3\"&gt;index&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-35wtfgec\"&gt;mem&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k3tyimqq\"&gt;run&lt;/code&gt; до одного корня. В обычном проекте один корень с именем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2czojgux\"&gt;root&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jjzogkmt\"&gt;root:&amp;lt;имя&amp;gt;&lt;/code&gt; — часть памяти, записанная с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-41yo9i6s\"&gt;--root&lt;/code&gt;; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dcmb3c11\"&gt;theia mem search&lt;/code&gt; она видна как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u87artyy\"&gt;{root:web}&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ctitl3hb\"&gt;worktree root&lt;/code&gt; — верхняя папка рабочей копии git, место хранилища по умолчанию.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dwn1zjfl\"&gt;root cause&lt;/code&gt; — вероятная причина неудачи в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kri9zic8\"&gt;theia diagnose&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f2526kyo\"&gt;root: null&lt;/code&gt; в деталях задачи в TUI — у задачи нет отдельного корня.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b079a5k2\"&gt;theia: unknown root 'nope' (declared: root)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8jq1ttl1\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#scope\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7jbzgxuu\"&gt;scope&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vwhxz5xt\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-25qnlr3p\"&gt;root cause&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace-manifest\"&gt;&lt;a href=\"ru/glossary.html#workspace-manifest\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e8kj6urg\"&gt;kind: Workspace&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Манифест проекта с несколькими корнями: несколько репозиториев делят одно хранилище. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uab2aw5q\"&gt;spec.roots&lt;/code&gt; перечислены корни (имя и путь от папки хранилища), в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t5t2txsr\"&gt;spec.primary&lt;/code&gt; — корень по умолчанию. Задачи прогона помечены корнем, а связанные слияния в разных корнях ложатся вместе (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3dtdv1kj\"&gt;run.changeset&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ceu4v6n2\"&gt;.theia/config/workspace.yaml&lt;/code&gt; от мастера первой настройки, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dbeysska\"&gt;multi-root workspace: proj, lib (primary: proj)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-changeset\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s6fk6ose\"&gt;run.changeset&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"overlay\"&gt;&lt;a href=\"ru/glossary.html#overlay\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;overlay&lt;/span&gt;&lt;/a&gt;overlay&lt;/h3&gt;\n&lt;p&gt;Папка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n2m7z5j8\"&gt;.theia&lt;/code&gt; без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-403w4u96\"&gt;store.db&lt;/code&gt; внутри одного из корней проекта. В ней только свои настройки и промпты для этого корня. При поиске хранилища Theia пропускает такую папку и идёт выше.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s9jonxvy\"&gt;theia: …/.theia has no store.db — per-root overlay, continuing upward&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x6m5gap0\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-plans\"&gt;&lt;a href=\"ru/glossary.html#group-plans\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Планы&lt;/span&gt;&lt;/a&gt;Планы&lt;/h2&gt;\n&lt;h3 id=\"plan\"&gt;&lt;a href=\"ru/glossary.html#plan\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dgspc7zp\"&gt;plan&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У слова два смысла.&lt;/p&gt;\n&lt;p&gt;План — сохранённый список задач от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-958286w8\"&gt;theia plan&lt;/code&gt;: у каждой задачи ключ, трек, зависимости и команды проверки. У плана есть отпечаток содержимого (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5y7gjxtd\"&gt;digest&lt;/code&gt;) и статус: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-blf7sx0y\"&gt;draft&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vy8s2clv\"&gt;approved&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-txocckob\"&gt;changes_requested&lt;/code&gt;. Запустить можно только одобренный план: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-peyeioxt\"&gt;theia run --from-plan &amp;lt;planId&amp;gt;&lt;/code&gt;. Любая правка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xwmdxixx\"&gt;theia plan add-context&lt;/code&gt;) даёт новый отпечаток и возвращает план в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-59vs8d3z\"&gt;draft&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Фаза &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g0wn0d0v\"&gt;plan&lt;/code&gt; — шаг задачи трека &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-61hhsyac\"&gt;full_spec&lt;/code&gt;, в котором работает планировщик.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sdspi6kv\"&gt;pln2akdqddd5c2223ubqzsvlt [draft] 2 tasks — …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x03bvjam\"&gt;theia plan list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ca2qaa38\"&gt;approved pln… @ fce3554ee5e2…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6eoziwaf\"&gt;run run… plan pln… @ fce3554ee5e2… → 2 tasks&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-naasxw8w\"&gt;task.phase … start → plan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#approved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g7jjdky2\"&gt;approved&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pxf2ovqz\"&gt;draft&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#changes-requested\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d4h1qu9r\"&gt;changes_requested&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#digest\"&gt;digest&lt;/a&gt;, &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gptcltc7\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/plan-and-run.html\"&gt;План перед запуском&lt;/a&gt;, &lt;a href=\"ru/reference/plan.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a34roocg\"&gt;theia plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"approved\"&gt;&lt;a href=\"ru/glossary.html#approved\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u0tamu6k\"&gt;approved&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Статус одобренного плана. Только такой план запускает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6gulpo0u\"&gt;theia run --from-plan&lt;/code&gt;. На план в другом статусе Theia отвечает отказом.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-62pkgklw\"&gt;run: plan pln… is 'draft', not approved — approve it first (theia plan approve)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ko41brs\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xvc7x900\"&gt;draft&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"changes-requested\"&gt;&lt;a href=\"ru/glossary.html#changes-requested\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2t36je1t\"&gt;changes_requested&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Статус плана после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n720hbiq\"&gt;theia plan request-changes &amp;lt;planId&amp;gt; \"…\"&lt;/code&gt;: вы попросили изменений. Отпечаток плана не меняется, а текст просьбы виден в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d5dujjsi\"&gt;theia plan show&lt;/code&gt; строкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mxgwa6de\"&gt;note:&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2fpqswt1\"&gt;changes requested on pln…&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zpmrworc\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#approved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w1upfjbs\"&gt;approved&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"open-questions\"&gt;&lt;a href=\"ru/glossary.html#open-questions\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bfm6bz9y\"&gt;OPEN QUESTIONS&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У планировщика есть вопросы, а ответить в терминале нельзя, например из-за &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f6f8w4qk\"&gt;--non-interactive&lt;/code&gt;. Theia сохраняет черновик плана с одним пунктом &lt;a href=\"ru/glossary.html#unresolved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qek55sl7\"&gt;unresolved&lt;/code&gt;&lt;/a&gt; и печатает вопросы. Ответ добавьте командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u1iia8ci\"&gt;theia plan add-context &amp;lt;planId&amp;gt; \"…\"&lt;/code&gt;, затем создайте план заново или одобрите его.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-arp2j89e\"&gt;OPEN QUESTIONS — plan saved as draft pln…:&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ktgkx1y4\"&gt;answer with: theia plan add-context pln… \"…\" — then re-run theia plan or approve&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cdnibo3p\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2pogr738\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unresolved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m6mb4rzq\"&gt;unresolved&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"unresolved\"&gt;&lt;a href=\"ru/glossary.html#unresolved\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aebjplmq\"&gt;unresolved&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ключ задачи-заглушки в черновике плана, который сохранён с открытыми вопросами (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1hnpt3vo\"&gt;OPEN QUESTIONS&lt;/code&gt;). Описание такой задачи начинается словами &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2n8co0kb\"&gt;Resolve open questions, then re-plan: …&lt;/code&gt;. Это не задача для выполнения, а напоминание: ответьте на вопросы командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1iecj3rq\"&gt;theia plan add-context &amp;lt;planId&amp;gt; \"…\"&lt;/code&gt; и составьте план заново. Утверждать такой черновик не нужно.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x8dnz0pw\"&gt;unresolved&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w3ps586i\"&gt;theia plan show &amp;lt;planId&amp;gt;&lt;/code&gt; после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-an6ejz43\"&gt;OPEN QUESTIONS — plan saved as draft pln…&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#open-questions\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-au6uxh3e\"&gt;OPEN QUESTIONS&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4jl6r36c\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yxqozqyz\"&gt;draft&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/plan-and-run.html\"&gt;План перед запуском&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verify-pre-flight\"&gt;&lt;a href=\"ru/glossary.html#verify-pre-flight\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wrjom5a5\"&gt;verify pre-flight&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Пробный запуск команд проверки из плана на базовом коммите, до одобрения плана. По умолчанию выключен: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jqn4ue04\"&gt;run.planVerifyPreflight: disable&lt;/code&gt;. Если команда падает на базе, это нормально, когда задача и должна её починить. Но если падает сама команда, например нет нужного инструмента, исправьте её до одобрения.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ztoeratb\"&gt;verify pre-flight: off (opt in with policy run.planVerifyPreflight: always)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xfu9m21e\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-in4bpp40\"&gt;verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"cost-estimate\"&gt;&lt;a href=\"ru/glossary.html#cost-estimate\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8dsvm891\"&gt;cost estimate&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Оценка цены плана по прошлым прогонам в этом хранилище: число задач × средняя цена задачи. Без истории прогонов оценки нет. Та же оценка в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rnssa9nu\"&gt;theia run --from-plan&lt;/code&gt; называется &lt;a href=\"ru/glossary.html#plan-floor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4dpb3dsy\"&gt;plan floor&lt;/code&gt;&lt;/a&gt;: если бюджет по умолчанию меньше неё, запуск отклоняется до первого вызова модели.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ty12zyzm\"&gt;cost estimate: ~$… (N tasks × $… avg/task from recorded runs)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5mr85htm\"&gt;cost estimate: no run history — no estimate&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cuo4tuvx\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan-floor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dxaxkz56\"&gt;plan floor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-maxusdperrun\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kotx2ol3\"&gt;run.maxUsdPerRun&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"plan-floor\"&gt;&lt;a href=\"ru/glossary.html#plan-floor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f5folm17\"&gt;plan floor&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Нижняя оценка стоимости прогона по плану: средняя цена задачи по прошлым платным прогонам этого хранилища × число задач плана. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zrk4o0j7\"&gt;theia run --from-plan&lt;/code&gt; сравнивает с ней бюджет до первого вызова модели. Если бюджет взят по умолчанию (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rb9scf5a\"&gt;run.maxUsdPerRun&lt;/code&gt;) и он ниже оценки, запуск отклоняется с кодом 1: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o9fju096\"&gt;run: plan floor ~$… exceeds budget $… — pass --budget N explicitly, raise run.maxUsdPerRun, or --budget 0 (unmetered)&lt;/code&gt;. Если бюджет задан флагом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rijb8aow\"&gt;--budget&lt;/code&gt;, Theia только предупреждает (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jleuasbz\"&gt;run: WARNING — plan floor …&lt;/code&gt;) и продолжает: ждите паузу по бюджету. Без истории платных прогонов оценки нет, и проверки тоже.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f7gove0w\"&gt;run: plan floor ~$12.50 (5 tasks × $2.50 avg/task from this store's recorded runs) exceeds budget $10 — …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nmhnfpe4\"&gt;run: WARNING — plan floor … proceeding on your explicit --budget&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#cost-estimate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vwm571f5\"&gt;cost estimate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unmetered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uyd87zu0\"&gt;unmetered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run.html#run-from-plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kg056az6\"&gt;theia run --from-plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"track-override\"&gt;&lt;a href=\"ru/glossary.html#track-override\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1snukj52\"&gt;track override&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ix5tp0fb\"&gt;theia run --from-plan &amp;lt;planId&amp;gt; --track &amp;lt;трек&amp;gt;&lt;/code&gt; переводит все задачи плана на один трек, только в этом прогоне. Сам план и его отпечаток не меняются.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6z7m5e48\"&gt;track override: all 2 tasks forced to full_spec for this run (plan content unchanged)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-guz5l2wy\"&gt;plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-steering\"&gt;&lt;a href=\"ru/glossary.html#group-steering\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Указания и вопросы&lt;/span&gt;&lt;/a&gt;Указания и вопросы&lt;/h2&gt;\n&lt;h3 id=\"steering\"&gt;&lt;a href=\"ru/glossary.html#steering\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;steering&lt;/span&gt;&lt;/a&gt;steering&lt;/h3&gt;\n&lt;p&gt;Указание — ваше сообщение прогону во время работы: что учесть, что изменить. Theia записывает её событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-si23j103\"&gt;user.note [msg]&lt;/code&gt; и добавляет в общие заметки (Σ), которые получат следующие шаги. Способы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gtw5equu\"&gt;m&lt;/code&gt; в TUI: указание сразу попадает в прогон этого же процесса. Строка ввода показывает адресата: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r2k28hzn\"&gt;steer → tsk…x ▸&lt;/code&gt; (задача под курсором) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9bp9anzi\"&gt;steer → run ▸&lt;/code&gt; (весь прогон);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1lwrr8r1\"&gt;theia msg &amp;lt;runId&amp;gt; \"…\"&lt;/code&gt;, с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p42vwzic\"&gt;--task &amp;lt;id&amp;gt;&lt;/code&gt; — только для одной задачи;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f7icvlnp\"&gt;theia fork &amp;lt;runId&amp;gt; --with \"…\"&lt;/code&gt; — указание для ответвления.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Указание для завершённой или неизвестной задачи Theia перенаправляет всему прогону и пишет об этом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a1z9foac\"&gt;theia msg&lt;/code&gt; из другого терминала доходит до прогона на паузе (при продолжении) и до продолженного прогона. Прогон, запущенный заново, указание не прочтёт, хотя &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iozmgqhq\"&gt;theia msg&lt;/code&gt; ответит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tlwo2x84\"&gt;noted — this run appears live …&lt;/code&gt;. Подробнее — в статье &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-snijx2bk\"&gt;noted for task …fd7pn6tz — folds into its guidance only&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-430npckw\"&gt;noted — folds into guidance on: theia run --resume run…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7hu0sv0f\"&gt;task …xk6rzynf is terminal — rerouted to run-level guidance (…)&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4bmyxytq\"&gt;» steer [msg] …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-62f42k4y\"&gt;user.note&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#sigma\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f48de68o\"&gt;sigma&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;, &lt;a href=\"ru/reference/run-control.html#msg\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iw3w3706\"&gt;theia msg&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"control-bus\"&gt;&lt;a href=\"ru/glossary.html#control-bus\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;control bus&lt;/span&gt;&lt;/a&gt;control bus&lt;/h3&gt;\n&lt;p&gt;Шина управления — способ управлять прогоном из другого процесса без отдельного сервера. Команда или инструмент дописывает событие в журнал прогона, а прогон читает новые события между шагами. Так устроены &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vrpwf04l\"&gt;theia msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i0tjdouo\"&gt;theia answer&lt;/code&gt;, режим вопросов &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tgz4so3z\"&gt;--interaction bus&lt;/code&gt; и инструменты MCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hgkemnz2\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pcch80wv\"&gt;run_answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0w8u3fee\"&gt;run_stop&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 шину читает только продолженный прогон — запущенный командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y5j236sr\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. Прогон, начатый через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0oc2cxfc\"&gt;theia run --task …&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o859pmdi\"&gt;--from-plan&lt;/code&gt;, а также каждый прогон от инструмента MCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-owgizznp\"&gt;run_start&lt;/code&gt; шину не читает. События попадают в журнал, но прогон идёт дальше, как будто их нет: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9yhy3k9u\"&gt;theia msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5kiro50t\"&gt;theia answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wmyrl65t\"&gt;--interaction bus&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a1at12dx\"&gt;run_stop&lt;/code&gt; на него не действуют. Ответы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-umiq9zzz\"&gt;noted — this run appears live: …&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-awdiplyy\"&gt;honored at the next dispatch boundary&lt;/code&gt; в этом случае вводят в заблуждение.&lt;/p&gt;\n&lt;p&gt;Что работает: клавиши &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7z8s09u1\"&gt;m&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-52suvb41\"&gt;q&lt;/code&gt; в TUI того же процесса, Ctrl+C в терминале прогона, а также команды шины после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sxecszx4\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. Порядок действий — в разделе &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f099etp1\"&gt;noted — this run appears live: it folds cross-process notes at its next dispatch boundary …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bxguodmo\"&gt;N questions waiting&lt;/code&gt; в строке статуса.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-stop-request\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jdz2n9o6\"&gt;run.stop_request&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-question\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v45wrxqb\"&gt;run.question&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dispatch-boundary\"&gt;dispatch boundary&lt;/a&gt;, &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dispatch-boundary\"&gt;&lt;a href=\"ru/glossary.html#dispatch-boundary\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;dispatch boundary&lt;/span&gt;&lt;/a&gt;dispatch boundary&lt;/h3&gt;\n&lt;p&gt;Момент между шагами прогона. В этот момент прогон проверяет запрос на остановку и новые указания. Шаг, который уже идёт, включая команду проверки, сначала доделывается. Внутрь идущего вызова модели указание не попадает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t9mrmlui\"&gt;honored at the next dispatch boundary (in-flight work lands first)&lt;/code&gt; (ответ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3jlucbpj\"&gt;run_stop&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6g26l6q7\"&gt;… at its next dispatch boundary&lt;/code&gt; (ответ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fhpswg4b\"&gt;theia msg&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kxd2zb3x\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"clarify\"&gt;&lt;a href=\"ru/glossary.html#clarify\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qfvh1c2e\"&gt;clarify&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Уточняющий вопрос (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4cfmb0t1\"&gt;clarify&lt;/code&gt;) — роль не может продолжать без вашего ответа. Спросить могут только планировщик и ведущий, у каждого вопроса есть пояснение, зачем он нужен. Куда приходит вопрос:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;в TUI — форма в панели деталей: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r4pbcnfb\"&gt;clarify — task …x (1/2)&lt;/code&gt; и строка ввода &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-slhpgcka\"&gt;answer ▸&lt;/code&gt;. Enter — следующий вопрос, пустой ответ — пропуск, Esc — отказ от остальных;&lt;/li&gt;\n&lt;li&gt;в обычном терминале — строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zcwb7vd9\"&gt;the planner needs answers before proceeding:&lt;/code&gt; (так же и для ведущего) и вопросы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iw0fj9sc\"&gt;? …&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;в режиме &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-flp4gqxr\"&gt;--interaction bus&lt;/code&gt; — событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-19o1xi7s\"&gt;run.question&lt;/code&gt; и ответ через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rnjv5jil\"&gt;theia answer&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ответы Theia сохраняет фактами памяти &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vy0g1ikk\"&gt;Q: … A: …&lt;/code&gt;, чтобы не спрашивать снова. Без ответа задача замирает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3v1da7dj\"&gt;escalated&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v6gjylie\"&gt;clarify_unanswered&lt;/code&gt;). Второй подряд вопрос без ответа ставит прогон на паузу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ceyzviw9\"&gt;clarify_stalled&lt;/code&gt;). С &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-er1pfk94\"&gt;--non-interactive&lt;/code&gt; вопрос сразу остаётся без ответа.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#clarify-unanswered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1qd0sxf2\"&gt;clarify_unanswered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jiyvc2rz\"&gt;clarify_stalled&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-question\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kuuqrc2o\"&gt;run.question&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#non-interactive\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ttkp16z1\"&gt;--non-interactive&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fact\"&gt;fact&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"probe\"&gt;&lt;a href=\"ru/glossary.html#probe\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3xj85m70\"&gt;probe&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вопрос о прогоне (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-58tf6l14\"&gt;probe&lt;/code&gt;) — разовый вопрос модели о состоянии прогона: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o908tab6\"&gt;theia probe &amp;lt;runId&amp;gt; \"…\"&lt;/code&gt;. Прогон при этом не меняется: Theia пишет только отдельную запись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t0atc7v3\"&gt;run.probed&lt;/code&gt;. Вопрос — это один вызов модели, лимит по умолчанию — 1 доллар (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-88tnqto4\"&gt;--budget&lt;/code&gt;). Тот же вопрос повторно отвечается бесплатно из записи. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7puhvzoo\"&gt;theia prune&lt;/code&gt; такие записи не удаляет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-24am4hxa\"&gt;[probe run2akdqbfu2w223occvaxl3w of run2akdqb2i4k223pwvesbyig @ …bjr37ync — $0.0000; parent untouched]&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wft8ech9\"&gt;· run…  probe&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#none\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qocq8pbp\"&gt;none&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9od68om8\"&gt;ask&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lz3087sf\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run-control.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5mp0h0nq\"&gt;theia probe&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-inspect\"&gt;&lt;a href=\"ru/glossary.html#group-inspect\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разбор прогона&lt;/span&gt;&lt;/a&gt;Разбор прогона&lt;/h2&gt;\n&lt;h3 id=\"audit-chain\"&gt;&lt;a href=\"ru/glossary.html#audit-chain\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;audit chain&lt;/span&gt;&lt;/a&gt;audit chain&lt;/h3&gt;\n&lt;p&gt;Цепочка аудита — защита журнала от подмены. Каждое событие хранит отпечаток предыдущего, и Theia проверяет, что цепочка не порвана. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x6eeka1c\"&gt;intact&lt;/code&gt; — журнал цел, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xa8njeio\"&gt;BROKEN&lt;/code&gt; — его изменили после записи. Прогон со сломанной цепочкой нельзя продолжить или ответвить.&lt;/p&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pdz4iw2v\"&gt;theia audit verify&lt;/code&gt; проверяет цепочки всех записей: прогонов, вопросов &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybx5pr4u\"&gt;probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f95nycay\"&gt;ask&lt;/code&gt;, планов и индекса. В 0.2.201 для несуществующего имени команда тоже пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-81ps0fwi\"&gt;intact&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hy7y8dtt\"&gt;audit chain: intact&lt;/code&gt; в итоге, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xx7umrvj\"&gt;2akdqb2i4k223pwvesbyig: intact&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4zdcbrtt\"&gt;index: intact&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-umiszwji\"&gt;theia audit verify&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6yv4nklp\"&gt;‼ audit chain BROKEN at …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nkehe9cl\"&gt;replay&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/audit-prune.html#audit-verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jv1u8cax\"&gt;theia audit verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"replay\"&gt;&lt;a href=\"ru/glossary.html#replay\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kmhyh42t\"&gt;replay&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Воспроизведение по журналу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3tiow17\"&gt;replay&lt;/code&gt;) — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3rxcelb\"&gt;theia replay &amp;lt;runId&amp;gt;&lt;/code&gt; заново читает журнал прогона и пересчитывает итог. Задачи не выполняются, модель не вызывается, ничего не меняется. Команда печатает число событий и состояние цепочки, итоговые фазы задач, число вердиктов и вызовов, а также общие заметки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fodaolax\"&gt;sigma: {…}&lt;/code&gt;. Если цепочка сломана, код выхода — 1.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s6q8tpam\"&gt;events: 22; chain: intact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5i7bmb47\"&gt;verdicts: 6; gateway calls: 4&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m6tf55tq\"&gt;sigma: {}&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"ru/glossary.html#sigma\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l68kf3v9\"&gt;sigma&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v25meq2u\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0b2884yb\"&gt;theia replay&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fork\"&gt;&lt;a href=\"ru/glossary.html#fork\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-go620ive\"&gt;fork&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ответвление прогона (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dunobhvc\"&gt;fork&lt;/code&gt;) — новый прогон, который копирует журнал исходного до выбранного события и дальше идёт иначе. Команда: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jwdev1a3\"&gt;theia fork &amp;lt;runId&amp;gt; --at &amp;lt;событие&amp;gt; --with \"…\"&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-53vcx6bf\"&gt;--at&lt;/code&gt; — событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rbipqjdi\"&gt;verdict&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6gi27oyn\"&gt;task.phase&lt;/code&gt;, подойдёт короткий номер из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r8m284ew\"&gt;show --plain&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iy1yntx3\"&gt;--with&lt;/code&gt; — указание для нового пути. Запускает ответвление &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q968duho\"&gt;theia run --resume &amp;lt;новый id&amp;gt;&lt;/code&gt;. Бюджет ответвления по умолчанию — 5 долларов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;ul&gt;\n&lt;li&gt;Ответвление завершённого прогона без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hu7isc9v\"&gt;--at&lt;/code&gt; продолжить нельзя: все задачи в нём уже закончены.&lt;/li&gt;\n&lt;li&gt;Продолженное ответвление сливает работу не в ветку прогона, а в вашу текущую ветку.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vxs53ktx\"&gt;forked run… @ bjr37ync → run…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8e6suj8j\"&gt;drive it: theia run --resume run…   (gateway: hybrid — prefix replays free)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s9o160xb\"&gt;forked from … at …&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3z5986j7\"&gt;fork → … at … (&amp;lt;причина&amp;gt;)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cuo1t0pd\"&gt;theia show&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m6hnqw89\"&gt;forked·&amp;lt;итог&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hybrid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-omfmep6f\"&gt;hybrid&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-forked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tim8foxq\"&gt;run.forked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#post-baseline\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i55qjhw1\"&gt;post-baseline&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-182rwbgr\"&gt;theia fork&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"hybrid\"&gt;&lt;a href=\"ru/glossary.html#hybrid\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hpvk71zt\"&gt;hybrid&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим шлюза для ответвлений, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6y72di73\"&gt;probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2f8iznfi\"&gt;ask&lt;/code&gt;. Если ответ на такой же запрос уже сохранён, Theia берёт его бесплатно, а новые запросы отправляет модели и сохраняет. Надпись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mece7eig\"&gt;prefix replays free&lt;/code&gt; у ответвления значит только, что скопированная часть не выполняется заново. Сохранённые ответы исходного прогона есть, только если он шёл с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8p45fh49\"&gt;--record&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3slasxym\"&gt;(gateway: hybrid — prefix replays free)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c8sw7yww\"&gt;fork resume: gateway in hybrid mode (recorded prefix replays free)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#recording\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0rne9uaz\"&gt;--record&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v0w4pdyd\"&gt;fork&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"recording\"&gt;&lt;a href=\"ru/glossary.html#recording\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rx498frg\"&gt;--record&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2zr8itm4\"&gt;theia run --record&lt;/code&gt; сохраняет каждый ответ модели в хранилище, чтобы потом повторить его без вызова. Нужен в основном для экспериментов с ответвлениями. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g6ijsyzg\"&gt;theia prune&lt;/code&gt; сохранённые ответы не удаляет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rpnb7tmv\"&gt;untouched: unfinished runs, gateway recordings (request-keyed, shared), …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4vo9pch6\"&gt;theia prune&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hybrid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vptoubsi\"&gt;hybrid&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kbbsv8kz\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay-miss\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tzhp1vmn\"&gt;replay_miss&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"post-baseline\"&gt;&lt;a href=\"ru/glossary.html#post-baseline\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-65vkeris\"&gt;post-baseline&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Траты после точки старта прогона. Для ответвления это траты после отделения: скопированная часть не считается. Так &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-059lwcoy\"&gt;theia compare&lt;/code&gt; сравнивает цену двух прогонов.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ryp1wewc\"&gt;cost A (post-baseline): $0.0000&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href
