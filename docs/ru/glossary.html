=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ipjuq1p4\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#compare\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eef4gl9x\"&gt;theia compare&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"root-cause\"&gt;&lt;a href=\"ru/glossary.html#root-cause\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bk1uaisf\"&gt;root cause&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вероятная причина неудачи, которую &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o2tls7bh\"&gt;theia diagnose&lt;/code&gt; называет по таблице правил, без модели. Значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ksd5l95v\"&gt;verification-loop&lt;/code&gt; — проверка проваливалась раз за разом (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i8zcvgvs\"&gt;stop_and_fix&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t9xjihpo\"&gt;review-loop&lt;/code&gt; — рецензент повторял замечание, а проверки проходили;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ng989ljs\"&gt;rejected-by-review&lt;/code&gt; — задачу отбросили без аномалий: работу сделали, но признали неверной;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-482myzex\"&gt;capability-gap&lt;/code&gt; — исполнитель ответил &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j1x7hcrn\"&gt;cant_do&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ynmi6bva\"&gt;budget-exhaustion&lt;/code&gt; — кончились деньги;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b6uqpmps\"&gt;confused-runner&lt;/code&gt; — роль раз за разом нарушала формат ответа;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aqwujweg\"&gt;runaway-decomposition&lt;/code&gt; — задача дробилась сверх лимитов;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0icb0eci\"&gt;inconclusive&lt;/code&gt; — ни одно правило не подошло.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rvy6lxh7\"&gt;theia diagnose&lt;/code&gt; сохраняет вывод фактом памяти. Повтор того же набора признаков помечается &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6kh8ngrl\"&gt;(fingerprint seen before — reused)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qg05mz26\"&gt;root cause: rejected-by-review&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y7mvlcn8\"&gt;why: …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tvip8l8w\"&gt;fingerprint: 0b0ec207de4ff4b3…  memory: 2akdqbfsxs223o53kulbqg&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#anomaly\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kcnuwavo\"&gt;anomaly&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fact\"&gt;fact&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#diagnose\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-trjctcms\"&gt;theia diagnose&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-index\"&gt;&lt;a href=\"ru/glossary.html#group-index\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индекс кода&lt;/span&gt;&lt;/a&gt;Индекс кода&lt;/h2&gt;\n&lt;h3 id=\"intent-index\"&gt;&lt;a href=\"ru/glossary.html#intent-index\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;intent index&lt;/span&gt;&lt;/a&gt;intent index&lt;/h3&gt;\n&lt;p&gt;Индекс кода — короткие карточки о файлах проекта. Карточку каждого файла один раз пишет модель (роль &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k8bnkknv\"&gt;indexer&lt;/code&gt;), и карточка используется, пока файл не изменится. Платятся только новые и изменённые файлы. Строит индекс &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nejvdlbg\"&gt;theia index build&lt;/code&gt;, карточки хранятся в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-443cwvyc\"&gt;store.db&lt;/code&gt;. Theia передаёт их агентам в каждом запросе как схему проекта.&lt;/p&gt;\n&lt;p&gt;Новые карточки не видны поиску (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kvx3xtr0\"&gt;theia index search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-og82odfr\"&gt;theia ask&lt;/code&gt;), пока не собрано новое поколение поиска командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ibzb243p\"&gt;theia index reindex&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rxhw0u24\"&gt;index: 0 written, 0 current, 1 failed, 2 model calls&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oyjy4uhh\"&gt;rate: … zero-cost (0%) … $0.0000 locked&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t6g2et7i\"&gt;theia index status&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#index-entry\"&gt;index entry&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blueprint\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-or24uiig\"&gt;blueprint&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5zyyyicz\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/guides/knowledge.html\"&gt;Индекс кода, память и вопросы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"index-entry\"&gt;&lt;a href=\"ru/glossary.html#index-entry\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;index entry&lt;/span&gt;&lt;/a&gt;index entry&lt;/h3&gt;\n&lt;p&gt;Запись индекса — карточка одного файла. Её строка устроена так: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b4sblw5x\"&gt;path[layer/module/importance]: F:… | R:… | A:… | S:…&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-szsagrcf\"&gt;layer&lt;/code&gt; — архитектурный слой: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-900gdak0\"&gt;app&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-quxo193b\"&gt;domain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t14gq43m\"&gt;adapter&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-va7iy57k\"&gt;config&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1bron85c\"&gt;test&lt;/code&gt; и другие;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v73pa2i9\"&gt;module&lt;/code&gt; — бизнес-область файла;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4xzcjyug\"&gt;importance&lt;/code&gt; — важность от 9 (ядро) до 1 (периферия);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wuq3fvc2\"&gt;F&lt;/code&gt; — зачем нужен файл, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p5sxxlon\"&gt;R&lt;/code&gt; — связанные файлы, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9m9q6dqi\"&gt;A&lt;/code&gt; — открытый API, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gqaohsvl\"&gt;S&lt;/code&gt; — решения, ограничения и подводные камни.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dip4hgaa\"&gt;hello.js[script/demo/1]: F:Prints hello to stdout. | R:- | A:- | S:No logic; smoke file.&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ykvquu81\"&gt;theia index render&lt;/code&gt;, строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uc6zccav\"&gt;F:&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2kwmuapb\"&gt;S:&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dhkvi82p\"&gt;theia index search&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blueprint\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fkvsvxfn\"&gt;blueprint&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#indexer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q47s1p98\"&gt;indexer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blueprint\"&gt;&lt;a href=\"ru/glossary.html#blueprint\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5o8wcpto\"&gt;blueprint&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Схема проекта (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-as09c0vk\"&gt;blueprint&lt;/code&gt;) — все карточки индекса одним текстом: самые важные сверху, легенда в начале. Theia добавляет схему в каждый запрос к агентам. Посмотреть её можно командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bb1m12w1\"&gt;theia index render&lt;/code&gt;. Хуки Claude Code и Codex добавляют в начало сессии первые 40 строк схемы (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ldgeue8j\"&gt;Repo map (head):&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dh579ny2\"&gt;run.blueprintMinImportance&lt;/code&gt; убирает из запросов карточки ниже заданной важности. Theia сообщает об этом строкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6wyxirvx\"&gt;blueprint floor: …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qnro33o7\"&gt;Repo intent map — one line per code unit: path[layer/module/importance]: F:… | R:… | A:… | S:…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8xzfld59\"&gt;blueprint floor: importance ≥N — injecting K of M entries (…)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;, &lt;a href=\"ru/glossary.html#index-entry\"&gt;index entry&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s11flgur\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"stale\"&gt;&lt;a href=\"ru/glossary.html#stale\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dbpfxi5q\"&gt;stale&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Устаревшая запись индекса: файл изменился после того, как для него написали карточку, или сменилась версия построителя индекса в Theia. Свежесть (freshness) индекса Theia проверяет без модели, по отпечаткам файлов.&lt;/p&gt;\n&lt;p&gt;Обратите внимание: число в предупреждении &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tez4zpxg\"&gt;index: N stale — plan quality degrades; …&lt;/code&gt; в начале прогона и в подсказке TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s8f8l955\"&gt;idx ⚠N&lt;/code&gt; складывает устаревшие и отсутствующие (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lbe10yhb\"&gt;missing&lt;/code&gt;) записи. Поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p5vhj0pv\"&gt;index: 1 stale&lt;/code&gt; бывает, когда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vyl0e8nt\"&gt;theia index status&lt;/code&gt; показывает файл только в списке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-18hq3syc\"&gt;missing&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Статусы в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ig7wdkp\"&gt;theia index status&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qftu0l6t\"&gt;current&lt;/code&gt; — карточка актуальна, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-64amjej0\"&gt;stale&lt;/code&gt; — устарела, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u147ju07\"&gt;missing&lt;/code&gt; — карточки нет, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sbg7lp2r\"&gt;orphaned&lt;/code&gt; — файла больше нет. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vd4x8sks\"&gt;index is fresh&lt;/code&gt; — нет ни устаревших, ни отсутствующих, ни лишних записей.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1vhw300h\"&gt;index: 1 stale — plan quality degrades; run 'theia index build' to refresh&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-68z7ut0w\"&gt;index: 1 stale — the map may lag this run's tree&lt;/code&gt; (в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yu8wxqpd\"&gt;theia show&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#missing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zucmdd5k\"&gt;missing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#orphaned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8frggk9b\"&gt;orphaned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#current\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kdwitxqw\"&gt;current&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dirty-marks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z0ba3nh6\"&gt;dirty-marks&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#idx\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y4qm7cgq\"&gt;idx ⚠N&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#indexpolicy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w5zgg26g\"&gt;indexPolicy&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"missing\"&gt;&lt;a href=\"ru/glossary.html#missing\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lpxd2oal\"&gt;missing&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Файл, отслеживаемый git, для которого ещё нет карточки индекса. Входит в число &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vhe1fms9\"&gt;index: N stale&lt;/code&gt;. Карточку создаст &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lp9ed6rz\"&gt;theia index build&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9fs5oa2t\"&gt;missing (1):&lt;/code&gt; и список файлов в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hrfiszio\"&gt;theia index status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dzlgslr6\"&gt;theia: 0 indexed · 1 missing&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wscs5ddx\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"orphaned\"&gt;&lt;a href=\"ru/glossary.html#orphaned\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ms53utkh\"&gt;orphaned&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Карточка файла, которого больше нет среди отслеживаемых: его удалили, переименовали или убрали из git. Полная сборка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y1ln6aij\"&gt;theia index build&lt;/code&gt; удаляет такие карточки.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jbvnmovy\"&gt;orphaned (1):&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kkaqp3wf\"&gt;theia index status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wktycxxe\"&gt;pruned N orphaned entries (files left the tree)&lt;/code&gt; после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nv0bt5uy\"&gt;theia index build&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2y5rncgb\"&gt;stale&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"current\"&gt;&lt;a href=\"ru/glossary.html#current\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jg8iljvo\"&gt;current&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Актуальная карточка: файл не менялся с тех пор, как её написали. Такой файл при сборке индекса ничего не стоит.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-47mujujj\"&gt;entries: 4 (3 current)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8p6dwvw8\"&gt;theia index status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dk5m01xm\"&gt;index: 0 written, 1 current, 0 failed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lqo77jxj\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dirty-marks\"&gt;&lt;a href=\"ru/glossary.html#dirty-marks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zel73q9e\"&gt;dirty-marks&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Пометки git-хука после коммита: какие файлы изменились с последней сборки индекса. Их ставит хук от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n6mfjoe3\"&gt;theia hooks install git&lt;/code&gt;. Это только подсказка: правду о свежести даёт сравнение отпечатков. Пометки хранятся в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m1pdxmzg\"&gt;.theia/index/dirty-paths&lt;/code&gt; и стираются после чистой полной сборки.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k4g9alog\"&gt;dirty-marks: 2 paths since last build (post-commit hook)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c656i21r\"&gt;theia: … · 2 marked dirty&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0uri55n0\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/integrations/git.html\"&gt;Git&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"search-generation\"&gt;&lt;a href=\"ru/glossary.html#search-generation\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;search generation&lt;/span&gt;&lt;/a&gt;search generation&lt;/h3&gt;\n&lt;p&gt;Поколение поиска — опубликованный снимок поисковых файлов: словарный индекс и, если работают эмбеддинги, векторный. Его собирает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-quof09h6\"&gt;theia index reindex&lt;/code&gt; из карточек индекса или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-36p6snjx\"&gt;theia mem reindex&lt;/code&gt; из памяти. Поиск читает последнее опубликованное поколение, поэтому новые карточки не видны, пока не собрано новое. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zjc5wsi6\"&gt;lexical-only&lt;/code&gt; — поколение без векторов. Старые поколения удаляет уборка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-azo7ozn2\"&gt;orphan generations GCed&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xnuo9sif\"&gt;generation 2akdqci45k223ouugqzblp: 0 entries, published=true (embeddings: local/all-MiniLM-L6-v2/384)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d51o9g9c\"&gt;head 6m old&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#embeddings\"&gt;embeddings&lt;/a&gt;, &lt;a href=\"ru/glossary.html#head\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7srv4aye\"&gt;head&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/glossary.html#maintenance\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j410p2jo\"&gt;maintenance&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"head\"&gt;&lt;a href=\"ru/glossary.html#head\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y62227hn\"&gt;head&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e4pv0s5a\"&gt;head&lt;/code&gt; значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1w0a4ph3\"&gt;head 6m old&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vlq5ydw0\"&gt;theia index status&lt;/code&gt; — возраст опубликованного поколения поиска;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-98j8ly90\"&gt;[@ event 22/22 · head]&lt;/code&gt; в TUI — вы смотрите последнее событие журнала;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-28rllfuv\"&gt;HEAD&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m8yqr83f\"&gt;base HEAD (no origin remote)&lt;/code&gt; — текущий коммит git.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kg02mvov\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#base\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wph9xq5w\"&gt;base&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"indexpolicy\"&gt;&lt;a href=\"ru/glossary.html#indexpolicy\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8d2pxxqu\"&gt;indexPolicy&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zz6c8ads\"&gt;maintenance.indexPolicy&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yrr3yorl\"&gt;policy.yaml&lt;/code&gt;: как поддерживать индекс свежим.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-buhn3258\"&gt;alert&lt;/code&gt; (по умолчанию) — только предупреждать в начале прогона и плана;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ykbqxnm2\"&gt;auto&lt;/code&gt; — перед прогоном и планом, в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-quh8cqaf\"&gt;theia serve&lt;/code&gt; и при старте сессии агента достраивать устаревшие карточки в пределах &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7w8d5rvo\"&gt;indexBuildBudgetUsd&lt;/code&gt; (1 доллар). Это вызовы модели;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cyv8ekgu\"&gt;manual&lt;/code&gt; — молчать и пропускать уборку после прогона.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cxfpsi5s\"&gt;index: N stale — plan quality degrades; building (budget $1)…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yuaq8at5\"&gt;(index: stale — background build started; indexPolicy=auto)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1i2jytiz\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#maintenance\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-blnbf9vd\"&gt;maintenance&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"maintenance\"&gt;&lt;a href=\"ru/glossary.html#maintenance\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-awnskw0e\"&gt;maintenance&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Уборка после прогона: обновление сводок памяти и удаление старых поколений поиска. Модель не вызывается. Уборка пропускается при &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ghi1tkf9\"&gt;indexPolicy: manual&lt;/code&gt;. Вручную то же делает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0aoonyer\"&gt;theia mem maintain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0uccfxyh\"&gt;maintenance: 0 summaries refreshed, 0 orphan generations GCed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-54l9ul36\"&gt;task.note [post_run_maintenance]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ltpy98ar\"&gt;maintain: 0 summaries refreshed (0 empty), 0 orphan generations GCed (0 artifacts removed)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#indexpolicy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cemgf8v9\"&gt;indexPolicy&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-memory\"&gt;&lt;a href=\"ru/glossary.html#group-memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Память и поиск&lt;/span&gt;&lt;/a&gt;Память и поиск&lt;/h2&gt;\n&lt;h3 id=\"memory\"&gt;&lt;a href=\"ru/glossary.html#memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;memory&lt;/span&gt;&lt;/a&gt;memory&lt;/h3&gt;\n&lt;p&gt;Память — факты и заметки о проекте в хранилище: решения, ограничения, договорённости. Записи двух видов: факты (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-59wf5vig\"&gt;fct…&lt;/code&gt;) и куски текста (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u5agj8e6\"&gt;chk…&lt;/code&gt;). Ничего не перезаписывается: новый факт заменяет старый, а старый остаётся в истории. Память читают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zd628e4k\"&gt;theia mem search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4qh3743p\"&gt;theia ask&lt;/code&gt; и хуки Claude Code и Codex. Ответы на уточняющие вопросы Theia записывает в память сама.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vmlyzfyc\"&gt;added fct2akdqbd5ag223ebx7s4jf2&lt;/code&gt; после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-45nzy01o\"&gt;theia mem add&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-krrkim6h\"&gt;- [decision] …&lt;/code&gt; в блоке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oepxofck\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fact\"&gt;fact&lt;/a&gt;, &lt;a href=\"ru/glossary.html#chunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-px840yzh\"&gt;chunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#supersede\"&gt;supersede&lt;/a&gt;, &lt;a href=\"ru/glossary.html#scope\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmbn6cyf\"&gt;scope&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/guides/knowledge.html\"&gt;Индекс кода, память и вопросы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fact\"&gt;&lt;a href=\"ru/glossary.html#fact\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fact&lt;/span&gt;&lt;/a&gt;fact&lt;/h3&gt;\n&lt;p&gt;Факт — одно короткое утверждение в памяти. У факта есть вид: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-085wkmgk\"&gt;decision&lt;/code&gt; (решение), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z987t8eg\"&gt;constraint&lt;/code&gt; (ограничение), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6vc0oh3g\"&gt;commitment&lt;/code&gt; (обязательство), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hjdw22hk\"&gt;observation&lt;/code&gt; (наблюдение), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-24kql3g2\"&gt;entity&lt;/code&gt; (сущность), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vf2p250q\"&gt;preference&lt;/code&gt; (предпочтение). Идентификатор начинается с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-blpivnle\"&gt;fct&lt;/code&gt;. Добавить факт: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aq170yzt\"&gt;theia mem add &amp;lt;вид&amp;gt; &amp;lt;текст&amp;gt;&lt;/code&gt;. В 0.2.201 секреты в тексте факта не скрываются, поэтому не пишите в факты ключи и пароли.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q1qvnu4t\"&gt;2.0164 [lexical-scan+recency] fct2akdqbd5ag223ebx7s4jf2 we use tabs for indentation&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wehg3jtf\"&gt;- [decision] …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qw18z8y8\"&gt;[sources] fct:…&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xp5ch0z\"&gt;theia ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#supersede\"&gt;supersede&lt;/a&gt;, &lt;a href=\"ru/glossary.html#chunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i6y4720d\"&gt;chunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/mem.html#mem-add\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-80ad50w9\"&gt;theia mem add&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"chunk\"&gt;&lt;a href=\"ru/glossary.html#chunk\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qjhsvl45\"&gt;chunk&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Кусок текста в памяти, сохранённый дословно, например конец переписки из хука. Идентификатор начинается с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tefxf70i\"&gt;chk&lt;/code&gt;. Ключи, номера карт и похожие секреты в нём заменяются заглушками. Добавить кусок вручную: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c42a93q3\"&gt;theia mem chunk \"…\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-svjezd1y\"&gt;chunk chk…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p9si3lyb\"&gt;- [chunk] …&lt;/code&gt; в блоке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t217r6np\"&gt;&amp;lt;theia-memory&amp;gt;&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5h2sjn2z\"&gt;chk:…&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rq39ru1w\"&gt;theia ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#checkpoint\"&gt;checkpoint&lt;/a&gt;, &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-udcj0o47\"&gt;masked&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"supersede\"&gt;&lt;a href=\"ru/glossary.html#supersede\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;supersede&lt;/span&gt;&lt;/a&gt;supersede&lt;/h3&gt;\n&lt;p&gt;Замена факта: новый факт вытесняет старый. Старый пропадает из обычного поиска, но остаётся в истории и виден в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r1yaf2k6\"&gt;theia mem asof&lt;/code&gt; на момент до замены. Замена бывает автоматической, когда новый факт почти совпадает со старым, и ручной: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gip05qb4\"&gt;theia mem supersede &amp;lt;старый&amp;gt; &amp;lt;новый&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-16vn846w\"&gt;added fct… (superseded fct…)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-noocjq67\"&gt;superseded &amp;lt;old&amp;gt; -&amp;gt; &amp;lt;new&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fact\"&gt;fact&lt;/a&gt;, &lt;a href=\"ru/glossary.html#asof\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6f0r7819\"&gt;asof&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"checkpoint\"&gt;&lt;a href=\"ru/glossary.html#checkpoint\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;checkpoint&lt;/span&gt;&lt;/a&gt;checkpoint&lt;/h3&gt;\n&lt;p&gt;Контрольная точка — конец переписки агента (до 16 КБ), который хук сохраняет куском памяти перед сжатием контекста или в конце сессии. Метки: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gwulrrzp\"&gt;compact-checkpoint&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iam4hfqk\"&gt;session-final&lt;/code&gt;. Хук &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1yofpfut\"&gt;Stop&lt;/code&gt; в Claude Code срабатывает после каждого ответа, поэтому такие куски появляются часто.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g81obc0f\"&gt;theia mem checkpoint&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f9xg9ek9\"&gt;theia mem checkpoint --final&lt;/code&gt; в настройках хуков.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#chunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zl9d14sj\"&gt;chunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zrubk9ll\"&gt;fail-open&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"scope\"&gt;&lt;a href=\"ru/glossary.html#scope\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2rc90s6k\"&gt;scope&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-61798tv3\"&gt;scope&lt;/code&gt; значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Часть памяти: общая для проекта (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v6fko4te\"&gt;default&lt;/code&gt;) или одного корня (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-brgfwo87\"&gt;root:&amp;lt;имя&amp;gt;&lt;/code&gt;, в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rxblyqsa\"&gt;{root:web}&lt;/code&gt;). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0fksac7i\"&gt;theia diagnose&lt;/code&gt; пишет свои выводы в часть &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hk3mwkma\"&gt;diagnostics&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Уровень настроек: встроенные значения, настройки пользователя, настройки проекта, настройки корня. Ближний к задаче уровень важнее.&lt;/li&gt;\n&lt;li&gt;Имя цепочки в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2p2odqbz\"&gt;theia audit verify&lt;/code&gt;: идентификатор прогона, вопроса или плана, а также &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-je25r509\"&gt;index&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2bklo1r0\"&gt;plan&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"asof\"&gt;&lt;a href=\"ru/glossary.html#asof\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fwbiyhvt\"&gt;asof&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m2wcx8wi\"&gt;theia mem asof &amp;lt;id&amp;gt; &amp;lt;запрос&amp;gt;&lt;/code&gt; — поиск по памяти в том виде, какой она была в момент записи с этим идентификатором. Нужен именно идентификатор Theia (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cg7tpo58\"&gt;fct…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ukud99y\"&gt;run…&lt;/code&gt; и другие), а не дата.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0939dtyx\"&gt;terryid: neither a body nor a full id: '2099-01-01'&lt;/code&gt; при попытке передать дату.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#supersede\"&gt;supersede&lt;/a&gt;, &lt;a href=\"ru/glossary.html#terryid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ayrfpynv\"&gt;terryid&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lane\"&gt;&lt;a href=\"ru/glossary.html#lane\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lane&lt;/span&gt;&lt;/a&gt;lane&lt;/h3&gt;\n&lt;p&gt;Способ поиска. В квадратных скобках Theia показывает, какие способы нашли результат:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bh1fz4ec\"&gt;bm25&lt;/code&gt; — поиск по словам в поколении поиска;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybgup7qp\"&gt;vector&lt;/code&gt; — поиск по смыслу через эмбеддинги;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ve2ok2x1\"&gt;lexical-scan&lt;/code&gt; — поиск по словам прямо в записях памяти;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kjq27xb5\"&gt;entry-scan&lt;/code&gt; — то же по карточкам индекса, когда поколения ещё нет;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-anq03pqe\"&gt;symbol&lt;/code&gt; — файлы, где объявлено имя из запроса;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gceyn110\"&gt;recency&lt;/code&gt; — самые новые записи памяти, добавляются всегда;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-josh00h8\"&gt;time&lt;/code&gt; — записи с датой из запроса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Число перед скобками растёт с числом способов, которые нашли запись. Из-за &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0qc8p6sg\"&gt;recency&lt;/code&gt; поиск по памяти почти всегда что-то находит.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b740let2\"&gt;2.0164 [lexical-scan+recency] fct… …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-blbpfoir\"&gt;1.0164 [entry-scan] src/calc.ts [domain/billing/8]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5hkx97ru\"&gt;theia: vector lane off — &amp;lt;причина&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#embeddings\"&gt;embeddings&lt;/a&gt;, &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"embeddings\"&gt;&lt;a href=\"ru/glossary.html#embeddings\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;embeddings&lt;/span&gt;&lt;/a&gt;embeddings&lt;/h3&gt;\n&lt;p&gt;Эмбеддинги (числовые векторы смысла) нужны для поиска по смыслу. По умолчанию их считает локальная модель &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f3o94kaq\"&gt;all-MiniLM-L6-v2&lt;/code&gt; размером около 23 МБ: она бесплатна и работает без сети, но при первом использовании скачивается. Другой вариант — провайдер &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uopaw5ah\"&gt;openai&lt;/code&gt;: нужен ключ OpenAI (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-arr86xqm\"&gt;OPENAI_API_KEY&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5aswdg40\"&gt;theia setup --openai-key&lt;/code&gt;), и это платно. Прогонам эмбеддинги не нужны.&lt;/p&gt;\n&lt;p&gt;Векторы одной модели не ищутся другой. После смены модели Theia пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tbanu7sg\"&gt;vector lane off&lt;/code&gt; и ищет только по словам, пока вы не соберёте поиск заново.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2toz83v8\"&gt;embeddings         : local/all-MiniLM-L6-v2 (384d) — not fetched (~23 MB; …)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nnhgbo4c\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z3ekepvd\"&gt;theia: vector lane off — …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#autodownload\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zrsgqjye\"&gt;autoDownload&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"autodownload\"&gt;&lt;a href=\"ru/glossary.html#autodownload\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9yjg50o4\"&gt;autoDownload&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fojs6pbo\"&gt;gateway.embeddings.autoDownload&lt;/code&gt;: может ли Theia сама скачать локальную модель эмбеддингов. По умолчанию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hfqm8yso\"&gt;true&lt;/code&gt;. При &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ec83vb5x\"&gt;false&lt;/code&gt; и отсутствии модели &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-koba3dyt\"&gt;theia doctor&lt;/code&gt; пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xat7yh04\"&gt;FAIL&lt;/code&gt;, а скачать модель можно командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7nfuocqe\"&gt;theia setup --fetch-embeddings&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c2gss8hn\"&gt;embeddings : local/all-MiniLM-L6-v2 (384d) — FAIL (not fetched and autoDownload is off — theia setup --fetch-embeddings)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#embeddings\"&gt;embeddings&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o9aqoq90\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ask\"&gt;&lt;a href=\"ru/glossary.html#ask\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vxhgut41\"&gt;ask&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-szkdpm6m\"&gt;theia ask \"вопрос\"&lt;/code&gt; отвечает на вопрос о проекте по памяти, индексу кода и трём последним прогонам. Это один вызов модели (роль &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7tub73gz\"&gt;none&lt;/code&gt;, лимит по умолчанию 1 доллар), в конце — список источников. Без вызова модели и бесплатно &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dihifimi\"&gt;ask&lt;/code&gt; отвечает, только если не нашлось вообще ничего. Вставка файлов через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m82zntmx\"&gt;@&lt;/code&gt; здесь не работает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fssdxbfr\"&gt;[sources] fct:2akdqbd5ag223ebx7s4jf2  run:2akdqb2i4k223pwvesbyig&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pthvcai3\"&gt;[ask run2akdqbfumk223ofyzfk5ix — $0.0000]&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-izuqnqha\"&gt;· run…  ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/glossary.html#none\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ijb8khs8\"&gt;none&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ockng14n\"&gt;probe&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/ask.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0dzsafw3\"&gt;theia ask&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-context\"&gt;&lt;a href=\"ru/glossary.html#theia-context\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-emwrcsql\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Блок текста, который хук начала сессии (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eklh107f\"&gt;theia mem context&lt;/code&gt;) добавляет в Claude Code или Codex: начало схемы проекта и последние факты памяти. После блока идёт строка свежести индекса.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1v3pw04u\"&gt;Recent project memory:&lt;/code&gt; внутри блока, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oe3f3bp9\"&gt;(index freshness: theia: 0 indexed · 1 missing)&lt;/code&gt; после него.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blueprint\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jbf2jn0a\"&gt;blueprint&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-memory\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k1e6tcpz\"&gt;&amp;lt;theia-memory&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-memory\"&gt;&lt;a href=\"ru/glossary.html#theia-memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bwvvz9v2\"&gt;&amp;lt;theia-memory&amp;gt;&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Блок, который хук отправки сообщения (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8z8d9938\"&gt;theia mem recall&lt;/code&gt;) добавляет к вашему сообщению в Claude Code или Codex: записи памяти, похожие на запрос. Если ничего не нашлось или сообщение короче 8 символов, блока нет.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vz167bld\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fail-open\"&gt;&lt;a href=\"ru/glossary.html#fail-open\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1emhkdx2\"&gt;fail-open&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ошибка в хуке не ломает сессию агента: Theia пишет её в поток ошибок и завершает хук с кодом 0. Так работают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y5efvb3e\"&gt;theia mem context&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wdc0821t\"&gt;theia mem recall&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ozxwssik\"&gt;theia mem checkpoint&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l55cxzqc\"&gt;theia mem recall (fail-open): &amp;lt;сообщение&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#checkpoint\"&gt;checkpoint&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-settings\"&gt;&lt;a href=\"ru/glossary.html#group-settings\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройки и модели&lt;/span&gt;&lt;/a&gt;Настройки и модели&lt;/h2&gt;\n&lt;h3 id=\"policy\"&gt;&lt;a href=\"ru/glossary.html#policy\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;,&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-td4c7sca\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-92247qdf\"&gt;policy.yaml&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Политика — главный файл настроек проекта: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i5esq1do\"&gt;.theia/config/policy.yaml&lt;/code&gt;, манифест вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kqbml2yd\"&gt;kind: Policy&lt;/code&gt;. Разделы: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1hobofl9\"&gt;run&lt;/code&gt; (прогоны и лимиты), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rx0s55s9\"&gt;gateway&lt;/code&gt; (маршрутизация, модели, эмбеддинги), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fhpmjsr6\"&gt;ui&lt;/code&gt; (вид по умолчанию), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5v58xshu\"&gt;maintenance&lt;/code&gt; (свежесть индекса), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e72cv74a\"&gt;memory&lt;/code&gt; (поиск по памяти). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zoniyac7\"&gt;theia init&lt;/code&gt; пишет файл, только если его нет, и повторный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aak70sit\"&gt;theia init&lt;/code&gt; его не меняет.&lt;/p&gt;\n&lt;p&gt;Проверка строгая: опечатка в ключе останавливает все команды с сообщением вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1uh6ilue\"&gt;config: policy.yaml: invalid manifest (spec.run: unrecognized_keys)&lt;/code&gt;. В сообщении есть раздел, но нет самого ключа. Настройки из разных файлов сливаются на один уровень: карта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4tt8cg74\"&gt;gateway.routing&lt;/code&gt; из ближнего файла заменяет карту целиком.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lhl3x00l\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;, &lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"manifest\"&gt;&lt;a href=\"ru/glossary.html#manifest\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;manifest&lt;/span&gt;&lt;/a&gt;manifest&lt;/h3&gt;\n&lt;p&gt;Манифест — YAML-файл настроек Theia с полями &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bhjwa9xb\"&gt;apiVersion: theia.dev/v1alpha1&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dnzfh8f4\"&gt;kind&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zctyp01z\"&gt;metadata&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7fsirxpb\"&gt;spec&lt;/code&gt;. Виды: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tksov80b\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ncz4j138\"&gt;TransportRegistry&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8zr93qs0\"&gt;Workspace&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6zz3nez0\"&gt;Context&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6vqvdxm7\"&gt;Pricing&lt;/code&gt;. Манифесты лежат в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gaspfew0\"&gt;.theia/config/&lt;/code&gt; проекта. В папке настроек пользователя (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-shblp068\"&gt;config/&lt;/code&gt;) допустимы только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3abitvfl\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ub6yfpcy\"&gt;Pricing&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n061u1bd\"&gt;TransportRegistry&lt;/code&gt;. Theia читает файлы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zl9cylpb\"&gt;.yaml&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pk9gk384\"&gt;.yml&lt;/code&gt; по алфавиту.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#policy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g0zqunp5\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1tkl06gj\"&gt;policy.yaml&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4om8y1s8\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bm57ih8b\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r1gwvzvw\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#pricing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6gowojfo\"&gt;kind: Pricing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"transport-registry\"&gt;&lt;a href=\"ru/glossary.html#transport-registry\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e3it61jp\"&gt;TransportRegistry&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Список транспортов, которые разрешено использовать: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a31goedn\"&gt;.theia/config/registry.yaml&lt;/code&gt;. Маршрут к транспорту не из списка не сработает. Транспорт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0jvsw0f9\"&gt;fake&lt;/code&gt; разрешён всегда. У каждой строки есть поля &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8gapaky8\"&gt;name&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uqsc794w\"&gt;provider&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ekny7vwa\"&gt;dataClasses&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1v5q3tjq\"&gt;owner&lt;/code&gt;; в 0.2.201 на работу влияет только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wn1ypnzb\"&gt;name&lt;/code&gt;. Транспорта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u55mn699\"&gt;codex-full&lt;/code&gt; в списке по умолчанию нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-onekuwgl\"&gt;gateway fatal: gateway: transport 'nope' is not manifest-registered (docs/11 §6)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r9oypoyq\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway\"&gt;&lt;a href=\"ru/glossary.html#gateway\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;gateway&lt;/span&gt;&lt;/a&gt;gateway&lt;/h3&gt;\n&lt;p&gt;Шлюз (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ovx0czsa\"&gt;gateway&lt;/code&gt;) — единая дверь, через которую идут все запросы к моделям. Он проверяет текст на секреты, выбирает транспорт по маршрутизации, следит за бюджетом, повторяет запрос при временной ошибке, фиксирует цену и пишет вызов в журнал.&lt;/p&gt;\n&lt;p&gt;Где встречается: строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gms8grmh\"&gt;gateway       &amp;lt;role&amp;gt;@&amp;lt;transport&amp;gt; → ok $0.0000&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ihut5k67\"&gt;N gateway calls&lt;/code&gt;, ошибка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o30tfbi3\"&gt;gateway: no route for role '…' (set gateway.routing)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zrnvs59s\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-routing\"&gt;&lt;a href=\"ru/glossary.html#gateway-routing\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iae7d18n\"&gt;gateway.routing&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Маршрутизация: через какой транспорт работает каждая роль. Это карта в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i2x5v88i\"&gt;policy.yaml&lt;/code&gt;; строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-23ffv6r2\"&gt;\"*\"&lt;/code&gt; действует для всех ролей без своей строки. Если у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-171qtwhj\"&gt;fresh_implementer&lt;/code&gt; нет строки, он работает там же, где &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ak8i0wk\"&gt;implementer&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vu0srojx\"&gt;theia init --harness claude&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1poay8d8\"&gt;--harness codex&lt;/code&gt; пишет готовую карту. Опечатку в имени роли Theia молча пропускает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ix5zk8lb\"&gt;initialized …/.theia (harness: codex — switch any time: gateway.routing in .theia/config/policy.yaml)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1rh2hius\"&gt;gateway: no route for role 'reviewer' (set gateway.routing)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-models\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7lx7qwqb\"&gt;gateway.models&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#role\"&gt;role&lt;/a&gt;, &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-models\"&gt;&lt;a href=\"ru/glossary.html#gateway-models\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tw2d3nvq\"&gt;gateway.models&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Модель для роли: карта «роль → идентификатор модели» в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s4kuy6dv\"&gt;policy.yaml&lt;/code&gt;. Theia передаёт модель движку (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tjrmp812\"&gt;--model&lt;/code&gt; для Claude Code, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ls5bb7lv\"&gt;-m&lt;/code&gt; для Codex) и имя не проверяет: неверное имя вызовет ошибку внутри движка. Без строки для роли работает модель транспорта по умолчанию.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tivuro70\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"transport\"&gt;&lt;a href=\"ru/glossary.html#transport\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;transport&lt;/span&gt;&lt;/a&gt;transport&lt;/h3&gt;\n&lt;p&gt;Транспорт — именованный способ вызвать модель: какой движок, с какими правами и какой моделью по умолчанию. Встроенные транспорты: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q5t6nr40\"&gt;codex&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e71a08vr\"&gt;codex-terra&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wkilquow\"&gt;codex-write&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wroauik1\"&gt;codex-jailed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fl16cp0c\"&gt;codex-full&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-196c5aig\"&gt;claude&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vhq7qx81\"&gt;claude-write&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5nrhg280\"&gt;claude-index&lt;/code&gt; и тестовый &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kk9y5us2\"&gt;fake&lt;/code&gt;. Например, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iitt5zxu\"&gt;claude-write&lt;/code&gt; может править файлы, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g65ou1qr\"&gt;claude&lt;/code&gt; работает без инструментов правки файлов. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xh72w7im\"&gt;--plain&lt;/code&gt; транспорт стоит после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9cn08yfb\"&gt;@&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ey9jr36w\"&gt;reviewer@claude&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3t1dr3sv\"&gt;@blocked&lt;/code&gt; значит, что вызов остановила проверка на секреты.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nlumm9tl\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4y8y9xv1\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blocked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mrz47ko2\"&gt;@blocked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"harness\"&gt;&lt;a href=\"ru/glossary.html#harness\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;harness&lt;/span&gt;&lt;/a&gt;harness&lt;/h3&gt;\n&lt;p&gt;Движок (harness) — внешний CLI-агент, через который работает модель: Claude Code (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yxamx4nc\"&gt;claude&lt;/code&gt;) или Codex (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vpzrttrs\"&gt;codex&lt;/code&gt;). Движок работает по подписке, в которую вы вошли в самом CLI; ключ Anthropic API для Claude Code Theia не использует. Семейство движка выбирает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mhsksxca\"&gt;theia init --harness claude&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6gy8na36\"&gt;--harness codex&lt;/code&gt;, а точнее всё задаёт маршрутизация. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-po5ferdl\"&gt;fake&lt;/code&gt; — тестовый движок без модели для разработчиков; ответы вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-srri9run\"&gt;fake-green …&lt;/code&gt; приходят только от него.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bgyg9jed\"&gt;codex subscription : …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oo143ku0\"&gt;claude code        : …&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2mqdghi8\"&gt;harnesses          : FAIL (…)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fvy5slc4\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline
