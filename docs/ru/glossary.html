т убитый прогон;&lt;/li&gt;\n&lt;li&gt;в TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-55d0lb4u\"&gt;⋯ implementer tsk…x  call in flight… · 12s [0 tools]&lt;/code&gt; — вызов модели идёт прямо сейчас. Клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6cd6rub9\"&gt;p&lt;/code&gt; открывает его запрос, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ch9z6naf\"&gt;no call in flight&lt;/code&gt; значит, что вызовов сейчас нет.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8xt824y6\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lwqxj6uc\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-ended\"&gt;&lt;a href=\"ru/glossary.html#run-ended\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e3y6mu3a\"&gt;run ended&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Прогон закончился, а TUI остаётся открытым, чтобы вы посмотрели дерево. Клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zmdkot7j\"&gt;q&lt;/code&gt; закрывает экран, после этого итог печатается в обычный терминал.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p8lj5n6p\"&gt;■ run ended — 1 discarded · browse the tree; q quits&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#tui\"&gt;TUI&lt;/a&gt;, &lt;a href=\"ru/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ddm5bdo\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#summary\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dgtemmx3\"&gt;summary&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-doctor\"&gt;&lt;a href=\"ru/glossary.html#group-doctor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;theia doctor&lt;/span&gt;&lt;/a&gt;theia doctor&lt;/h2&gt;\n&lt;h3 id=\"doctor\"&gt;&lt;a href=\"ru/glossary.html#doctor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ll5c87a\"&gt;doctor&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cr07khg0\"&gt;theia doctor&lt;/code&gt; проверяет, готова ли машина: входы в движки, песочницу, поиск, эмбеддинги, личные настройки, хранилище, правила, хуки Codex и файлы поставки. Модель не вызывается. Каждая строка — это &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b4o5b7ak\"&gt;название : состояние&lt;/code&gt;. Код выхода 1, если есть учтённая ошибка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rbj8mmlk\"&gt;FAIL&lt;/code&gt;. Домашний экран показывает только проблемные строки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#unavailable\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oobq01ux\"&gt;unavailable&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xlh08170\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#not-initialized\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h2ktzp5k\"&gt;not initialized&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/doctor.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kuxnv6ij\"&gt;theia doctor&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"unavailable\"&gt;&lt;a href=\"ru/glossary.html#unavailable\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kh732uap\"&gt;unavailable&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Возможность недоступна на этой машине, в скобках — причина. Само по себе это не ошибка. Например, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d5radhfy\"&gt;codex subscription : unavailable&lt;/code&gt; при работающем Claude Code — нормально.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wy3re4mw\"&gt;doctor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-clbv13wz\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kpgz3okt\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fail\"&gt;&lt;a href=\"ru/glossary.html#fail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ov5wzdcl\"&gt;FAIL&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Настоящая проблема. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rrnbe6ce\"&gt;theia doctor&lt;/code&gt; строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r9pqqp7l\"&gt;harnesses&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cgc70rr6\"&gt;embeddings&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3sw908c3\"&gt;vendor deliverables&lt;/code&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y88y5fmu\"&gt;FAIL&lt;/code&gt; дают код выхода 1, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wtbt6jjq\"&gt;FAIL&lt;/code&gt; в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-65jzhq9x\"&gt;lexical index&lt;/code&gt; код выхода не меняет. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybr8zeq3\"&gt;theia index build&lt;/code&gt; строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hdibnhth\"&gt;FAIL &amp;lt;файл&amp;gt;: &amp;lt;причина&amp;gt;&lt;/code&gt; и счётчик &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tcvqqy3q\"&gt;N FAILED&lt;/code&gt; значат, что карточку для файла сделать не удалось.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pb7gcu38\"&gt;harnesses          : FAIL (neither codex nor claude is authenticated — one is required)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b8uu0wo2\"&gt;index: 1/1 built · 1 FAILED · $0.0000 · 166.7/s&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k1bd21us\"&gt;doctor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unavailable\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cqm3afil\"&gt;unavailable&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#failed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-npm4ulz7\"&gt;failed&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"not-initialized\"&gt;&lt;a href=\"ru/glossary.html#not-initialized\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jrcd38bk\"&gt;not initialized&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w8uz7p2l\"&gt;theia doctor&lt;/code&gt; это значит, что в текущей папке нет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2pvfcxv9\"&gt;.theia&lt;/code&gt; со &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r9pa84qv\"&gt;store.db&lt;/code&gt;. Doctor смотрит только текущую папку. Из подпапки проекта или для хранилища в папке пользователя он напишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5grrtfap\"&gt;not initialized (theia init)&lt;/code&gt;, хотя остальные команды хранилище найдут. Запускайте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fnqdqb6n\"&gt;theia doctor&lt;/code&gt; из корня проекта.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gn9utpr0\"&gt;.theia store       : not initialized (theia init)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#theia-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z47sx0c6\"&gt;.theia store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i5y9if00\"&gt;doctor&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"harnesses\"&gt;&lt;a href=\"ru/glossary.html#harnesses\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-umlbezjn\"&gt;harnesses&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l6x6580v\"&gt;theia doctor&lt;/code&gt;, которая появляется, только когда нет входа ни в Codex, ни в Claude Code. Хватит входа в один из них.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fsb5ypze\"&gt;harnesses          : FAIL (neither codex nor claude is authenticated — one is required)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#codex-subscription\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p28cvug3\"&gt;codex subscription&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#claude-code\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bb4j0ru7\"&gt;claude code&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"codex-subscription\"&gt;&lt;a href=\"ru/glossary.html#codex-subscription\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-twgvy54w\"&gt;codex subscription&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-krvu800a\"&gt;theia doctor&lt;/code&gt;: выполнен ли вход в Codex CLI по подписке (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3khhhgla\"&gt;codex login&lt;/code&gt;). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-heusa395\"&gt;unavailable&lt;/code&gt; значит, что входа нет или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-160i3h6q\"&gt;codex&lt;/code&gt; не установлен.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8h4l1k7\"&gt;codex subscription : unavailable (harness-codex: not authenticated (codex login status: exit 1))&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dyfudm51\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"claude-code\"&gt;&lt;a href=\"ru/glossary.html#claude-code\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gnezqhq7\"&gt;claude code&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c64bv63r\"&gt;theia doctor&lt;/code&gt;: выполнен ли вход в Claude Code по подписке. Ключ Anthropic API Theia для Claude Code не использует, поэтому вход по ключу здесь не засчитывается.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1yjmybqw\"&gt;claude code        : ok&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xwqn4fzj\"&gt;claude code        : unavailable (harness-claude: not logged in …)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f7of9qcr\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lexical-index\"&gt;&lt;a href=\"ru/glossary.html#lexical-index\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z60518kl\"&gt;lexical index&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mtxual2i\"&gt;theia doctor&lt;/code&gt;: загружается ли встроенная библиотека поиска по словам (tantivy). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jjzh781i\"&gt;FAIL&lt;/code&gt; здесь значит сломанную установку, но код выхода не меняет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lkydmuns\"&gt;lexical index      : ok (tantivy binding loads)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pagfrlg3\"&gt;doctor&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-store\"&gt;&lt;a href=\"ru/glossary.html#theia-store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r3dfihb8\"&gt;.theia store&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tam7agrc\"&gt;theia doctor&lt;/code&gt;: есть ли хранилище в текущей папке. Значения: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hozn6wlk\"&gt;ok&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fbm4ntzj\"&gt;not initialized (theia init)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#not-initialized\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h9yz8kej\"&gt;not initialized&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ai-rules\"&gt;&lt;a href=\"ru/glossary.html#ai-rules\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i5y4eu3r\"&gt;ai rules&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Какие файлы правил для ИИ найдены в проекте и как они попадают к модели: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rfotkter\"&gt;(native·codex)&lt;/code&gt; — движок читает файл сам, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5prm4plh\"&gt;(injected)&lt;/code&gt; — Theia добавляет его через манифест &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i84er5vq\"&gt;Context&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ikb84ixb\"&gt;none detected&lt;/code&gt; — таких файлов нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zx3qyo63\"&gt;ai rules           : none detected&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dw8ru9c9\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mny4xwwj\"&gt;ai rules: none detected&lt;/code&gt; после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kdaijeb3\"&gt;theia init&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jt5msecs\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-rulessot\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fc8zxedk\"&gt;run.rulesSoT&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"codex-hooks\"&gt;&lt;a href=\"ru/glossary.html#codex-hooks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dxcq57o5\"&gt;codex hooks&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kri2rnqs\"&gt;theia doctor&lt;/code&gt; о хуках Codex: включена ли функция хуков в самом Codex, доверен ли проект (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eykikapv\"&gt;gate 1&lt;/code&gt;) и есть ли файл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7jjsjrt\"&gt;.codex/hooks.json&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ozcvo6er\"&gt;codex hooks        : feature stable/true; project NOT trusted (gate 1); hooks.json absent (theia hooks install codex)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gate-1\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vm36jai6\"&gt;gate 1&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-ids\"&gt;&lt;a href=\"ru/glossary.html#group-ids\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификаторы&lt;/span&gt;&lt;/a&gt;Идентификаторы&lt;/h2&gt;\n&lt;h3 id=\"run-id\"&gt;&lt;a href=\"ru/glossary.html#run-id\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s76v1wx9\"&gt;runId&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Идентификатор прогона: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b2sbliyx\"&gt;run&lt;/code&gt; и 22 символа, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3bd6lf02\"&gt;run2akdqb2i4k223pwvesbyig&lt;/code&gt;. У других объектов свои приставки: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tagxnmrv\"&gt;tsk&lt;/code&gt; — задача, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-27haxooz\"&gt;pln&lt;/code&gt; — план, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hg5mx7e7\"&gt;fct&lt;/code&gt; — факт, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bq96uj88\"&gt;chk&lt;/code&gt; — кусок памяти, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d9696q7v\"&gt;gen&lt;/code&gt; — поколение поиска. Идентификаторы растут со временем, поэтому их порядок совпадает с порядком создания. Команды принимают полный идентификатор или 22 символа без приставки.&lt;/p&gt;\n&lt;p&gt;Отдельной команды со списком прогонов нет. Идентификатор виден в начале прогона (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9l005izk\"&gt;run run… task tsk…&lt;/code&gt;), в подсказке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-avz3887x\"&gt;resume with:&lt;/code&gt;, на домашнем экране и в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vistcome\"&gt;theia audit verify&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#body\"&gt;body&lt;/a&gt;, &lt;a href=\"ru/glossary.html#short-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d6hjk5kg\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#terryid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t61acukz\"&gt;terryid&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"body\"&gt;&lt;a href=\"ru/glossary.html#body\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;body&lt;/span&gt;&lt;/a&gt;body&lt;/h3&gt;\n&lt;p&gt;Идентификатор без приставки — 22 символа, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u5as2eel\"&gt;2akdqb2i4k223pwvesbyig&lt;/code&gt;. В такой форме Theia печатает номера в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iu526h9a\"&gt;theia audit verify&lt;/code&gt;, в строках о связи ответвлений и в подсказке после первого Ctrl+C. Команды принимают и такую форму.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v6et66gf\"&gt;2akdqb2i4k223pwvesbyig: intact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ingp9qjk\"&gt;forked from 2akdqb2i4k223pwvesbyig at bjr37ync&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ijijp34n\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#short-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qj4thqz0\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"short-id\"&gt;&lt;a href=\"ru/glossary.html#short-id\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-br60n24v\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Короткий номер — последние символы идентификатора для экрана: 8 символов в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-18fsxsww\"&gt;--plain&lt;/code&gt;, на табло и в TUI (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bha2wtkc\"&gt;xk6rzynf&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-koxb1b1p\"&gt;tsk…xk6rzynf&lt;/code&gt;) и 6 символов в строках &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-il6xfkxy\"&gt;live&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7h1eosp9\"&gt;tsk…6rzynf&lt;/code&gt;). Короткий хвост понимают только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-02okuysm\"&gt;show --task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-esdkv2oj\"&gt;msg --task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-442ij1jw\"&gt;fork --at&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sh9cst9p\"&gt;answer --question&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-606dsg39\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#body\"&gt;body&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"terryid\"&gt;&lt;a href=\"ru/glossary.html#terryid\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-82lr5jzt\"&gt;terryid&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Название формата идентификаторов Theia. Слово встречается в ошибках, когда строку не удалось прочитать как идентификатор.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yvrqdnr8\"&gt;terryid: neither a body nor a full id: '…'&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eugyl0e8\"&gt;terryid: malformed id '…'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e5fp8yk0\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#asof\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q2smsyvc\"&gt;asof&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"digest\"&gt;&lt;a href=\"ru/glossary.html#digest\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;digest&lt;/span&gt;&lt;/a&gt;digest&lt;/h3&gt;\n&lt;p&gt;Отпечаток — хеш SHA-256 содержимого. Одинаковое содержимое даёт одинаковый отпечаток, любое изменение — другой. Так Theia помечает план (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kedjbgk0\"&gt;digest fce3554ee5e2…&lt;/code&gt;), вставленный файл (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xkp2xwa7\"&gt;sha256 bc70e26f40b8&lt;/code&gt;), вывод команд проверки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cpnczk85\"&gt;test_run 74d0…&lt;/code&gt;) и файлы поставки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vohajfc3\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vxdf512w\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#test-run\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j26fpm4z\"&gt;test_run&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-internal\"&gt;&lt;a href=\"ru/glossary.html#group-internal\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Внутренние коды&lt;/span&gt;&lt;/a&gt;Внутренние коды&lt;/h2&gt;\n&lt;h3 id=\"the-codes\"&gt;&lt;a href=\"ru/glossary.html#the-codes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z7n5h2ea\"&gt;THE-013&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Номера внутренних правил разработки Theia в скобках в конце сообщений: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gccy89us\"&gt;(THE-005)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x6tkkxbo\"&gt;(THE-013)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-18j7t56r\"&gt;(THE-014)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hx2987im\"&gt;(THE-024)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-htan090h\"&gt;(THE-065)&lt;/code&gt;. Пользователю они ничего не говорят, их можно не замечать. Смысл сообщения — в тексте перед скобкой.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#ticket-codes\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yjji4057\"&gt;R5&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vl3fepb6\"&gt;T-W&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ticket-codes\"&gt;&lt;a href=\"ru/glossary.html#ticket-codes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;,&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s5u2f0pe\"&gt;R5&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n5wksjb0\"&gt;T-W&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Номера внутренних задач и разделов проектной документации в справке и сообщениях: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-02w4pnrk\"&gt;(R5)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p2olp1be\"&gt;(R11)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-72698eye\"&gt;— T-W&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hzgqm8hc\"&gt;(F6)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9icffdav\"&gt;docs/10 §4&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m4tv9voq\"&gt;docs/13&lt;/code&gt;. Это ссылки для разработчиков платформы, их можно не замечать. Так же относитесь к слову &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5jrpsydw\"&gt;receipt&lt;/code&gt; в тексте справки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#the-codes\
