и отслеживаемых: его удалили, переименовали или убрали из git. Полная сборка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xbr0l8gq\"&gt;theia index build&lt;/code&gt; удаляет такие карточки.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pr4c8wdz\"&gt;orphaned (1):&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ef4fnxvt\"&gt;theia index status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-trqke3bg\"&gt;pruned N orphaned entries (files left the tree)&lt;/code&gt; после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-92cw8ld1\"&gt;theia index build&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0jlxrxy2\"&gt;stale&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"current\"&gt;&lt;a href=\"ru/glossary.html#current\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ql9t2kfe\"&gt;current&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Актуальная карточка: файл не менялся с тех пор, как её написали. Такой файл при сборке индекса ничего не стоит.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-apydcmnu\"&gt;entries: 4 (3 current)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iukzeaek\"&gt;theia index status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uf88qp5y\"&gt;index: 0 written, 1 current, 0 failed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5t4fdgq3\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dirty-marks\"&gt;&lt;a href=\"ru/glossary.html#dirty-marks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ka1s86t\"&gt;dirty-marks&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Пометки git-хука после коммита: какие файлы изменились с последней сборки индекса. Их ставит хук от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7qlwx5e6\"&gt;theia hooks install git&lt;/code&gt;. Это только подсказка: правду о свежести даёт сравнение отпечатков. Пометки хранятся в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g4w13r9h\"&gt;.theia/index/dirty-paths&lt;/code&gt; и стираются после чистой полной сборки.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kryd2ndh\"&gt;dirty-marks: 2 paths since last build (post-commit hook)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-21q6yg3s\"&gt;theia: … · 2 marked dirty&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e8j6s03v\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/integrations/git.html\"&gt;Git&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"search-generation\"&gt;&lt;a href=\"ru/glossary.html#search-generation\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;search generation&lt;/span&gt;&lt;/a&gt;search generation&lt;/h3&gt;\n&lt;p&gt;Поколение поиска — опубликованный снимок поисковых файлов: словарный индекс и, если работают эмбеддинги, векторный. Его собирает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jbwyxa4j\"&gt;theia index reindex&lt;/code&gt; из карточек индекса или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybir0641\"&gt;theia mem reindex&lt;/code&gt; из памяти. Поиск читает последнее опубликованное поколение, поэтому новые карточки не видны, пока не собрано новое. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iflx0ixw\"&gt;lexical-only&lt;/code&gt; — поколение без векторов. Старые поколения удаляет уборка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0pehtjwa\"&gt;orphan generations GCed&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rmqfhe28\"&gt;generation 2akdqci45k223ouugqzblp: 0 entries, published=true (embeddings: local/all-MiniLM-L6-v2/384)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xaxc51bc\"&gt;head 6m old&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#embeddings\"&gt;embeddings&lt;/a&gt;, &lt;a href=\"ru/glossary.html#head\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ufa770pf\"&gt;head&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/glossary.html#maintenance\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yx6579yo\"&gt;maintenance&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"head\"&gt;&lt;a href=\"ru/glossary.html#head\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2uxni4p8\"&gt;head&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lyyqnw63\"&gt;head&lt;/code&gt; значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6dhqduuk\"&gt;head 6m old&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qa7tpzg9\"&gt;theia index status&lt;/code&gt; — возраст опубликованного поколения поиска;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q4f29tbw\"&gt;[@ event 22/22 · head]&lt;/code&gt; в TUI — вы смотрите последнее событие журнала;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-usoqkibr\"&gt;HEAD&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-atcf5jnd\"&gt;base HEAD (no origin remote)&lt;/code&gt; — текущий коммит git.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m762z6fe\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#base\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q55lzv18\"&gt;base&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"indexpolicy\"&gt;&lt;a href=\"ru/glossary.html#indexpolicy\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3hzqtc6a\"&gt;indexPolicy&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p7ptnf00\"&gt;maintenance.indexPolicy&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-59o9kach\"&gt;policy.yaml&lt;/code&gt;: как поддерживать индекс свежим.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r40u5cwb\"&gt;alert&lt;/code&gt; (по умолчанию) — только предупреждать в начале прогона и плана;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-prpvqkde\"&gt;auto&lt;/code&gt; — перед прогоном и планом, в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xy5xdm2h\"&gt;theia serve&lt;/code&gt; и при старте сессии агента достраивать устаревшие карточки в пределах &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hd6dhj5l\"&gt;indexBuildBudgetUsd&lt;/code&gt; (1 доллар). Это вызовы модели;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qw6so52c\"&gt;manual&lt;/code&gt; — молчать и пропускать уборку после прогона.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-482t2f57\"&gt;index: N stale — plan quality degrades; building (budget $1)…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ld5abrck\"&gt;(index: stale — background build started; indexPolicy=auto)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-trkjtdnc\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#maintenance\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x6bcp9ov\"&gt;maintenance&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"maintenance\"&gt;&lt;a href=\"ru/glossary.html#maintenance\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pv5lephi\"&gt;maintenance&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Уборка после прогона: обновление сводок памяти и удаление старых поколений поиска. Модель не вызывается. Уборка пропускается при &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2grxtryu\"&gt;indexPolicy: manual&lt;/code&gt;. Вручную то же делает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-01lz30n2\"&gt;theia mem maintain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kvs8t4ie\"&gt;maintenance: 0 summaries refreshed, 0 orphan generations GCed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nv9o9k1w\"&gt;task.note [post_run_maintenance]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ofvygx8t\"&gt;maintain: 0 summaries refreshed (0 empty), 0 orphan generations GCed (0 artifacts removed)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#indexpolicy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iz28cpok\"&gt;indexPolicy&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-memory\"&gt;&lt;a href=\"ru/glossary.html#group-memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Память и поиск&lt;/span&gt;&lt;/a&gt;Память и поиск&lt;/h2&gt;\n&lt;h3 id=\"memory\"&gt;&lt;a href=\"ru/glossary.html#memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;memory&lt;/span&gt;&lt;/a&gt;memory&lt;/h3&gt;\n&lt;p&gt;Память — факты и заметки о проекте в хранилище: решения, ограничения, договорённости. Записи двух видов: факты (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3m8t7zq1\"&gt;fct…&lt;/code&gt;) и куски текста (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-usacgwnp\"&gt;chk…&lt;/code&gt;). Ничего не перезаписывается: новый факт заменяет старый, а старый остаётся в истории. Память читают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xo35dkx2\"&gt;theia mem search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hy5dybdm\"&gt;theia ask&lt;/code&gt; и хуки Claude Code и Codex. Ответы на уточняющие вопросы Theia записывает в память сама.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h862i1f7\"&gt;added fct2akdqbd5ag223ebx7s4jf2&lt;/code&gt; после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2go486st\"&gt;theia mem add&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pnd1h77v\"&gt;- [decision] …&lt;/code&gt; в блоке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ygmobu21\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fact\"&gt;fact&lt;/a&gt;, &lt;a href=\"ru/glossary.html#chunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cmxesvk8\"&gt;chunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#supersede\"&gt;supersede&lt;/a&gt;, &lt;a href=\"ru/glossary.html#scope\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-syeadknv\"&gt;scope&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/guides/knowledge.html\"&gt;Индекс кода, память и вопросы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fact\"&gt;&lt;a href=\"ru/glossary.html#fact\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fact&lt;/span&gt;&lt;/a&gt;fact&lt;/h3&gt;\n&lt;p&gt;Факт — одно короткое утверждение в памяти. У факта есть вид: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ntvrfso2\"&gt;decision&lt;/code&gt; (решение), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u3hdaoft\"&gt;constraint&lt;/code&gt; (ограничение), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1bd1ityl\"&gt;commitment&lt;/code&gt; (обязательство), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iufsd22m\"&gt;observation&lt;/code&gt; (наблюдение), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ocgycx1\"&gt;entity&lt;/code&gt; (сущность), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-thxrio01\"&gt;preference&lt;/code&gt; (предпочтение). Идентификатор начинается с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mglq14xn\"&gt;fct&lt;/code&gt;. Добавить факт: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0tqabe91\"&gt;theia mem add &amp;lt;вид&amp;gt; &amp;lt;текст&amp;gt;&lt;/code&gt;. В 0.2.201 секреты в тексте факта не скрываются, поэтому не пишите в факты ключи и пароли.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bf9vqaof\"&gt;2.0164 [lexical-scan+recency] fct2akdqbd5ag223ebx7s4jf2 we use tabs for indentation&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g1mydo7p\"&gt;- [decision] …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ojgwwj2r\"&gt;[sources] fct:…&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-21u33b2j\"&gt;theia ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#supersede\"&gt;supersede&lt;/a&gt;, &lt;a href=\"ru/glossary.html#chunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-meos7inx\"&gt;chunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/mem.html#mem-add\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wq9lsu18\"&gt;theia mem add&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"chunk\"&gt;&lt;a href=\"ru/glossary.html#chunk\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aq50h6kx\"&gt;chunk&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Кусок текста в памяти, сохранённый дословно, например конец переписки из хука. Идентификатор начинается с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x2kc57tn\"&gt;chk&lt;/code&gt;. Ключи, номера карт и похожие секреты в нём заменяются заглушками. Добавить кусок вручную: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qqlraakp\"&gt;theia mem chunk \"…\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8f5vffr6\"&gt;chunk chk…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4h9owwm\"&gt;- [chunk] …&lt;/code&gt; в блоке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w3hen4cn\"&gt;&amp;lt;theia-memory&amp;gt;&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b0phijc5\"&gt;chk:…&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qr2j5vhb\"&gt;theia ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#checkpoint\"&gt;checkpoint&lt;/a&gt;, &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m042qlj8\"&gt;masked&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"supersede\"&gt;&lt;a href=\"ru/glossary.html#supersede\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;supersede&lt;/span&gt;&lt;/a&gt;supersede&lt;/h3&gt;\n&lt;p&gt;Замена факта: новый факт вытесняет старый. Старый пропадает из обычного поиска, но остаётся в истории и виден в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cm6g6lq6\"&gt;theia mem asof&lt;/code&gt; на момент до замены. Замена бывает автоматической, когда новый факт почти совпадает со старым, и ручной: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h55gnl62\"&gt;theia mem supersede &amp;lt;старый&amp;gt; &amp;lt;новый&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fjgb8a7v\"&gt;added fct… (superseded fct…)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yqgf7all\"&gt;superseded &amp;lt;old&amp;gt; -&amp;gt; &amp;lt;new&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fact\"&gt;fact&lt;/a&gt;, &lt;a href=\"ru/glossary.html#asof\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-88fhttah\"&gt;asof&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"checkpoint\"&gt;&lt;a href=\"ru/glossary.html#checkpoint\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;checkpoint&lt;/span&gt;&lt;/a&gt;checkpoint&lt;/h3&gt;\n&lt;p&gt;Контрольная точка — конец переписки агента (до 16 КБ), который хук сохраняет куском памяти перед сжатием контекста или в конце сессии. Метки: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ben6rt4p\"&gt;compact-checkpoint&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iy5jpj9r\"&gt;session-final&lt;/code&gt;. Хук &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8v5yijj7\"&gt;Stop&lt;/code&gt; в Claude Code срабатывает после каждого ответа, поэтому такие куски появляются часто.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-51ze4p1a\"&gt;theia mem checkpoint&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wltw7ttv\"&gt;theia mem checkpoint --final&lt;/code&gt; в настройках хуков.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#chunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dq9tme4j\"&gt;chunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8dekiq8l\"&gt;fail-open&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"scope\"&gt;&lt;a href=\"ru/glossary.html#scope\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eoqm41vq\"&gt;scope&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2gppxf6i\"&gt;scope&lt;/code&gt; значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Часть памяти: общая для проекта (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p9xq1dtb\"&gt;default&lt;/code&gt;) или одного корня (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-45ji50fe\"&gt;root:&amp;lt;имя&amp;gt;&lt;/code&gt;, в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-we8d66cm\"&gt;{root:web}&lt;/code&gt;). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jxucl0nb\"&gt;theia diagnose&lt;/code&gt; пишет свои выводы в часть &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wjw6wfvh\"&gt;diagnostics&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Уровень настроек: встроенные значения, настройки пользователя, настройки проекта, настройки корня. Ближний к задаче уровень важнее.&lt;/li&gt;\n&lt;li&gt;Имя цепочки в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9pxpjrqd\"&gt;theia audit verify&lt;/code&gt;: идентификатор прогона, вопроса или плана, а также &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ot62zfz6\"&gt;index&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wxspql4d\"&gt;plan&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"asof\"&gt;&lt;a href=\"ru/glossary.html#asof\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83h24t47\"&gt;asof&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6hd645w1\"&gt;theia mem asof &amp;lt;id&amp;gt; &amp;lt;запрос&amp;gt;&lt;/code&gt; — поиск по памяти в том виде, какой она была в момент записи с этим идентификатором. Нужен именно идентификатор Theia (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-npvwwdp2\"&gt;fct…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zf1h9f9a\"&gt;run…&lt;/code&gt; и другие), а не дата.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ciwx6zp\"&gt;terryid: neither a body nor a full id: '2099-01-01'&lt;/code&gt; при попытке передать дату.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#supersede\"&gt;supersede&lt;/a&gt;, &lt;a href=\"ru/glossary.html#terryid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cth64pok\"&gt;terryid&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lane\"&gt;&lt;a href=\"ru/glossary.html#lane\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lane&lt;/span&gt;&lt;/a&gt;lane&lt;/h3&gt;\n&lt;p&gt;Способ поиска. В квадратных скобках Theia показывает, какие способы нашли результат:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5cvozkol\"&gt;bm25&lt;/code&gt; — поиск по словам в поколении поиска;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ubn5f2z3\"&gt;vector&lt;/code&gt; — поиск по смыслу через эмбеддинги;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cxr8jmsn\"&gt;lexical-scan&lt;/code&gt; — поиск по словам прямо в записях памяти;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9g7m94re\"&gt;entry-scan&lt;/code&gt; — то же по карточкам индекса, когда поколения ещё нет;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6du802xb\"&gt;symbol&lt;/code&gt; — файлы, где объявлено имя из запроса;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6trvbumm\"&gt;recency&lt;/code&gt; — самые новые записи памяти, добавляются всегда;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5wrxnx18\"&gt;time&lt;/code&gt; — записи с датой из запроса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Число перед скобками растёт с числом способов, которые нашли запись. Из-за &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9cqxpbei\"&gt;recency&lt;/code&gt; поиск по памяти почти всегда что-то находит.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5x66913k\"&gt;2.0164 [lexical-scan+recency] fct… …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xexxvnxa\"&gt;1.0164 [entry-scan] src/calc.ts [domain/billing/8]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5g4k9cxs\"&gt;theia: vector lane off — &amp;lt;причина&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#embeddings\"&gt;embeddings&lt;/a&gt;, &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"embeddings\"&gt;&lt;a href=\"ru/glossary.html#embeddings\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;embeddings&lt;/span&gt;&lt;/a&gt;embeddings&lt;/h3&gt;\n&lt;p&gt;Эмбеддинги (числовые векторы смысла) нужны для поиска по смыслу. По умолчанию их считает локальная модель &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h74ycl5j\"&gt;all-MiniLM-L6-v2&lt;/code&gt; размером около 23 МБ: она бесплатна и работает без сети, но при первом использовании скачивается. Другой вариант — провайдер &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y8i8brhe\"&gt;openai&lt;/code&gt;: нужен ключ OpenAI (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kffitifm\"&gt;OPENAI_API_KEY&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-reslcmpa\"&gt;theia setup --openai-key&lt;/code&gt;), и это платно. Прогонам эмбеддинги не нужны.&lt;/p&gt;\n&lt;p&gt;Векторы одной модели не ищутся другой. После смены модели Theia пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qpqtzvpu\"&gt;vector lane off&lt;/code&gt; и ищет только по словам, пока вы не соберёте поиск заново.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sib5xfgq\"&gt;embeddings         : local/all-MiniLM-L6-v2 (384d) — not fetched (~23 MB; …)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e9vdjzp3\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mj5baet0\"&gt;theia: vector lane off — …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#autodownload\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-18k1ouy1\"&gt;autoDownload&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"autodownload\"&gt;&lt;a href=\"ru/glossary.html#autodownload\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e0vtk8ce\"&gt;autoDownload&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-golvjqzg\"&gt;gateway.embeddings.autoDownload&lt;/code&gt;: может ли Theia сама скачать локальную модель эмбеддингов. По умолчанию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hp8njyaj\"&gt;true&lt;/code&gt;. При &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hi1ynteo\"&gt;false&lt;/code&gt; и отсутствии модели &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gt75j0ua\"&gt;theia doctor&lt;/code&gt; пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6p52ie08\"&gt;FAIL&lt;/code&gt;, а скачать модель можно командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d1mb9dit\"&gt;theia setup --fetch-embeddings&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vpgif00b\"&gt;embeddings : local/all-MiniLM-L6-v2 (384d) — FAIL (not fetched and autoDownload is off — theia setup --fetch-embeddings)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#embeddings\"&gt;embeddings&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s99yo9fz\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ask\"&gt;&lt;a href=\"ru/glossary.html#ask\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kqk2t6or\"&gt;ask&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gmgnfb99\"&gt;theia ask \"вопрос\"&lt;/code&gt; отвечает на вопрос о проекте по памяти, индексу кода и трём последним прогонам. Это один вызов модели (роль &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u7q0dn0x\"&gt;none&lt;/code&gt;, лимит по умолчанию 1 доллар), в конце — список источников. Без вызова модели и бесплатно &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-69upothd\"&gt;ask&lt;/code&gt; отвечает, только если не нашлось вообще ничего. Вставка файлов через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bsv3kgal\"&gt;@&lt;/code&gt; здесь не работает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ezxmnjri\"&gt;[sources] fct:2akdqbd5ag223ebx7s4jf2  run:2akdqb2i4k223pwvesbyig&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-165wgxwr\"&gt;[ask run2akdqbfumk223ofyzfk5ix — $0.0000]&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-itgv1zrp\"&gt;· run…  ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/glossary.html#none\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8zhkzp2g\"&gt;none&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y30g0jxm\"&gt;probe&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/ask.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b5mbd0gd\"&gt;theia ask&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-context\"&gt;&lt;a href=\"ru/glossary.html#theia-context\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x2mfmuys\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Блок текста, который хук начала сессии (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f9bz4ra4\"&gt;theia mem context&lt;/code&gt;) добавляет в Claude Code или Codex: начало схемы проекта и последние факты памяти. После блока идёт строка свежести индекса.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8r1j362\"&gt;Recent project memory:&lt;/code&gt; внутри блока, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1g7jo35i\"&gt;(index freshness: theia: 0 indexed · 1 missing)&lt;/code&gt; после него.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blueprint\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0axhifvt\"&gt;blueprint&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-memory\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zcwxn8rf\"&gt;&amp;lt;theia-memory&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-memory\"&gt;&lt;a href=\"ru/glossary.html#theia-memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-65a5thw6\"&gt;&amp;lt;theia-memory&amp;gt;&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Блок, который хук отправки сообщения (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jtuex50l\"&gt;theia mem recall&lt;/code&gt;) добавляет к вашему сообщению в Claude Code или Codex: записи памяти, похожие на запрос. Если ничего не нашлось или сообщение короче 8 символов, блока нет.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tjk8j305\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fail-open\"&gt;&lt;a href=\"ru/glossary.html#fail-open\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pw40vhox\"&gt;fail-open&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ошибка в хуке не ломает сессию агента: Theia пишет её в поток ошибок и завершает хук с кодом 0. Так работают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dlqxoqnt\"&gt;theia mem context&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yqg8gg5h\"&gt;theia mem recall&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eiuguihe\"&gt;theia mem checkpoint&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vffx4fkc\"&gt;theia mem recall (fail-open): &amp;lt;сообщение&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#checkpoint\"&gt;checkpoint&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-settings\"&gt;&lt;a href=\"ru/glossary.html#group-settings\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройки и модели&lt;/span&gt;&lt;/a&gt;Настройки и модели&lt;/h2&gt;\n&lt;h3 id=\"policy\"&gt;&lt;a href=\"ru/glossary.html#policy\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;,&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n7clvltw\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9qjx29sr\"&gt;policy.yaml&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Политика — главный файл настроек проекта: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7nl8ls8e\"&gt;.theia/config/policy.yaml&lt;/code&gt;, манифест вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-chxgib6d\"&gt;kind: Policy&lt;/code&gt;. Разделы: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dfhs6b5q\"&gt;run&lt;/code&gt; (прогоны и лимиты), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e2sy35cl\"&gt;gateway&lt;/code&gt; (маршрутизация, модели, эмбеддинги), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ew8rb161\"&gt;ui&lt;/code&gt; (вид по умолчанию), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4omqbthd\"&gt;maintenance&lt;/code&gt; (свежесть индекса), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hng4w6xa\"&gt;memory&lt;/code&gt; (поиск по памяти). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uy3x0wlf\"&gt;theia init&lt;/code&gt; пишет файл, только если его нет, и повторный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-31eb9090\"&gt;theia init&lt;/code&gt; его не меняет.&lt;/p&gt;\n&lt;p&gt;Проверка строгая: опечатка в ключе останавливает все команды с сообщением вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6cbrqatc\"&gt;config: policy.yaml: invalid manifest (spec.run: unrecognized_keys)&lt;/code&gt;. В сообщении есть раздел, но нет самого ключа. Настройки из разных файлов сливаются на один уровень: карта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kbw0jywf\"&gt;gateway.routing&lt;/code&gt; из ближнего файла заменяет карту целиком.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h1ahthsv\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;, &lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"manifest\"&gt;&lt;a href=\"ru/glossary.html#manifest\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;manifest&lt;/span&gt;&lt;/a&gt;manifest&lt;/h3&gt;\n&lt;p&gt;Манифест — YAML-файл настроек Theia с полями &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lbzoaja5\"&gt;apiVersion: theia.dev/v1alpha1&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0cxqhtie\"&gt;kind&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o5vvsa8z\"&gt;metadata&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v5k1pat5\"&gt;spec&lt;/code&gt;. Виды: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bgyagec2\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bjn5xiys\"&gt;TransportRegistry&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f3ka82c7\"&gt;Workspace&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9uw0unpv\"&gt;Context&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d9tuy32g\"&gt;Pricing&lt;/code&gt;. Манифесты лежат в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j484q27x\"&gt;.theia/config/&lt;/code&gt; проекта. В папке настроек пользователя (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tv0osolv\"&gt;config/&lt;/code&gt;) допустимы только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rwnbu851\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wkxqb22b\"&gt;Pricing&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gs36hazm\"&gt;TransportRegistry&lt;/code&gt;. Theia читает файлы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b0cc4amn\"&gt;.yaml&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hlfyz4j9\"&gt;.yml&lt;/code&gt; по алфавиту.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#policy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1szkueye\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qpbhjot6\"&gt;policy.yaml&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r7o0hts0\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qturrp5h\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jw6f8wvy\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#pricing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mcabl13q\"&gt;kind: Pricing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"transport-registry\"&gt;&lt;a href=\"ru/glossary.html#transport-registry\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jp0tbmwk\"&gt;TransportRegistry&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Список транспортов, которые разрешено использовать: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-or3e2c3i\"&gt;.theia/config/registry.yaml&lt;/code&gt;. Маршрут к транспорту не из списка не сработает. Транспорт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dmv3zdns\"&gt;fake&lt;/code&gt; разрешён всегда. У каждой строки есть поля &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-axtqe0m7\"&gt;name&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-biks3hj5\"&gt;provider&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tppyx820\"&gt;dataClasses&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nlm80soz\"&gt;owner&lt;/code&gt;; в 0.2.201 на работу влияет только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ux9s8kjj\"&gt;name&lt;/code&gt;. Транспорта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zjz2h3vw\"&gt;codex-full&lt;/code&gt; в списке по умолчанию нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jpe7occc\"&gt;gateway fatal: gateway: transport 'nope' is not manifest-registered (docs/11 §6)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xebulnvw\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway\"&gt;&lt;a href=\"ru/glossary.html#gateway\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;gateway&lt;/span&gt;&lt;/a&gt;gateway&lt;/h3&gt;\n&lt;p&gt;Шлюз (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-taj6z9b5\"&gt;gateway&lt;/code&gt;) — единая дверь, через которую идут все запросы к моделям. Он проверяет текст на секреты, выбирает транспорт по маршрутизации, следит за бюджетом, повторяет запрос при временной ошибке, фиксирует цену и пишет вызов в журнал.&lt;/p&gt;\n&lt;p&gt;Где встречается: строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xp1pidmq\"&gt;gateway       &amp;lt;role&amp;gt;@&amp;lt;transport&amp;gt; → ok $0.0000&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ge17bsfn\"&gt;N gateway calls&lt;/code&gt;, ошибка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fa4wqrks\"&gt;gateway: no route for role '…' (set gateway.routing)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7w7wh5ub\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-routing\"&gt;&lt;a href=\"ru/glossary.html#gateway-routing\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-em53il2t\"&gt;gateway.routing&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Маршрутизация: через какой транспорт работает каждая роль. Это карта в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kezzbxb6\"&gt;policy.yaml&lt;/code&gt;; строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kxgdf838\"&gt;\"*\"&lt;/code&gt; действует для всех ролей без своей строки. Если у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xynls4vl\"&gt;fresh_implementer&lt;/code&gt; нет строки, он работает там же, где &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rfg6po7b\"&gt;implementer&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yuw2v400\"&gt;theia init --harness claude&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sayuupht\"&gt;--harness codex&lt;/code&gt; пишет готовую карту. Опечатку в имени роли Theia молча пропускает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eewkrmmn\"&gt;initialized …/.theia (harness: codex — switch any time: gateway.routing in .theia/config/policy.yaml)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ogjliok0\"&gt;gateway: no route for role 'reviewer' (set gateway.routing)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-models\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pij0jd2l\"&gt;gateway.models&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#role\"&gt;role&lt;/a&gt;, &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-models\"&gt;&lt;a href=\"ru/glossary.html#gateway-models\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3g7jk6mw\"&gt;gateway.models&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Модель для роли: карта «роль → идентификатор модели» в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lo7nwiad\"&gt;policy.yaml&lt;/code&gt;. Theia передаёт модель движку (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qwp0tfbi\"&gt;--model&lt;/code&gt; для Claude Code, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-racjwod1\"&gt;-m&lt;/code&gt; для Codex) и имя не проверяет: неверное имя вызовет ошибку внутри движка. Без строки для роли работает модель транспорта по умолчанию.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jdnk67gx\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"transport\"&gt;&lt;a href=\"ru/glossary.html#transport\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;transport&lt;/span&gt;&lt;/a&gt;transport&lt;/h3&gt;\n&lt;p&gt;Транспорт — именованный способ вызвать модель: какой движок, с какими правами и какой моделью по умолчанию. Встроенные транспорты: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6c3zx01k\"&gt;codex&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mhj8d5jw\"&gt;codex-terra&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-md3u2zjt\"&gt;codex-write&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z0ea5gcb\"&gt;codex-jailed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uk2ryo05\"&gt;codex-full&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z1w5bbd0\"&gt;claude&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w8mrhefi\"&gt;claude-write&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sd7lwf5w\"&gt;claude-index&lt;/code&gt; и тестовый &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-leu63hrg\"&gt;fake&lt;/code&gt;. Например, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ojnq2hh7\"&gt;claude-write&lt;/code&gt; может править файлы, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n2dw42uo\"&gt;claude&lt;/code&gt; работает без инструментов правки файлов. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-98e1iter\"&gt;--plain&lt;/code&gt; транспорт стоит после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-digeyyfq\"&gt;@&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i4hnou6l\"&gt;reviewer@claude&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l4o8e1sh\"&gt;@blocked&lt;/code&gt; значит, что вызов остановила проверка на секреты.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-57xbc3vw\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gy1dvbbe\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blocked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-50gsw3zw\"&gt;@blocked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"harness\"&gt;&lt;a href=\"ru/glossary.html#harness\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;harness&lt;/span&gt;&lt;/a&gt;harness&lt;/h3&gt;\n&lt;p&gt;Движок (harness) — внешний CLI-агент, через который работает модель: Claude Code (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i6g0e2tz\"&gt;claude&lt;/code&gt;) или Codex (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-myejkv7y\"&gt;codex&lt;/code&gt;). Движок работает по подписке, в которую вы вошли в самом CLI; ключ Anthropic API для Claude Code Theia не использует. Семейство движка выбирает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xcjmmsgn\"&gt;theia init --harness claude&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2k6e7l1a\"&gt;--harness codex&lt;/code&gt;, а точнее всё задаёт маршрутизация. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vdaiccn3\"&gt;fake&lt;/code&gt; — тестовый движок без модели для разработчиков; ответы вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vyly453n\"&gt;fake-green …&lt;/code&gt; приходят только от него.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-181blzy6\"&gt;codex subscription : …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-160sehos\"&gt;claude code        : …&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yegavevl\"&gt;harnesses          : FAIL (…)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0j0tt0bx\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1z78vdvn\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lkmscc3m\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"context\"&gt;&lt;a href=\"ru/glossary.html#context\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z2uzug37\"&gt;kind: Context&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Манифест с правилами и справочными текстами, которые Theia добавляет в запросы агентов как текст. Источник записи — строка, файл или шаблон пути; когда добавлять — всегда, для ролей, треков или путей. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o5c4oywx\"&gt;theia init&lt;/code&gt; сам создаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y139vljk\"&gt;context-rules.yaml&lt;/code&gt;, если нашёл файлы правил вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-io0lh9ye\"&gt;.cursorrules&lt;/code&gt;. Путь к файлу пишите относительно проекта: абсолютный путь не работает.&lt;/p&gt;\n&lt;p&gt;Если добавленного текста больше &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zljgrr8h\"&gt;run.contextAlertChars&lt;/code&gt; (200 000 символов), Theia предупреждает, но загружает всё. Жёсткий лимит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1quprlcf\"&gt;run.contextRefuseChars&lt;/code&gt; по умолчанию не задан.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ymogifte\"&gt;context       injected: …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8qtdxg2l\"&gt;--plain&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ceba04ma\"&gt;context injected (N entries)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qoxzwmtv\"&gt;context alert: task … injects N chars (&amp;gt; contextAlertChars=200000) — loading everything&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#ai-rules\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cnm8c3g5\"&gt;ai rules&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ctx\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5fwvsj1\"&gt;ctx ⚠N&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"pre-task\"&gt;&lt;a href=\"ru/glossary.html#pre-task\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hgjr3mkq\"&gt;pre-task&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Команды из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-apqlsmkb\"&gt;run.preTask&lt;/code&gt;, которые Theia запускает перед первым шагом исполнителя. Если обязательная команда (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r2wgmnrc\"&gt;mustPass&lt;/code&gt;) упала, задача замирает ещё до вызова модели и ждёт ведущего.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yb7tngnr\"&gt;pre-task      &amp;lt;task&amp;gt; N gate(s), M failed&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q18rpbwp\"&gt;pre-task gates: N run, M failed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#illegal-verdict\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ifa5an4s\"&gt;illegal_verdict&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#policy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g2x6vssc\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tp20hv9c\"&gt;policy.yaml&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-rulessot\"&gt;&lt;a href=\"ru/glossary.html#run-rulessot\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aqa4tnvg\"&gt;run.rulesSoT&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим «правила только через Theia». В копиях задач файлы правил (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hffq4ck8\"&gt;AGENTS.md&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3jz83tzs\"&gt;CLAUDE.md&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pmteh227\"&gt;.cursorrules&lt;/code&gt; и другие) заменяются заглушкой, а Codex не читает свои файлы проекта. Сами &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-apzr70d4\"&gt;AGENTS.md&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-26idybtp\"&gt;CLAUDE.md&lt;/code&gt; при этом в запросы не попадают: добавьте их манифестом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uzc9um6s\"&gt;Context&lt;/code&gt;. По умолчанию режим выключен.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-29bkmf71\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ai-rules\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7hvsw2hp\"&gt;ai rules&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-security\"&gt;&lt;a href=\"ru/glossary.html#group-security\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Безопасность и песочница&lt;/span&gt;&lt;/a&gt;Безопасность и песочница&lt;/h2&gt;\n&lt;h3 id=\"data-class\"&gt;&lt;a href=\"ru/glossary.html#data-class\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;data class&lt;/span&gt;&lt;/a&gt;data class&lt;/h3&gt;\n&lt;p&gt;Класс данных — насколько опасно отправлять текст модели. Шлюз проверяет каждый запрос простыми шаблонами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o0yu9d3l\"&gt;prohibited&lt;/code&gt; — отправлять нельзя: закрытые ключи, ключи API (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9kfamktn\"&gt;sk-…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tgck6wlr\"&gt;AKIA…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f8dhrpje\"&gt;ghp_…&lt;/code&gt;), номера карт, seed-фразы. Вызов останавливается.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xwg1tikd\"&gt;restricted&lt;/code&gt; — можно только со скрытием: адреса почты заменяются на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-10565i0q\"&gt;[EMAIL]&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ynhcohgw\"&gt;permitted&lt;/code&gt; — текст уходит как есть.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Шаблоны не ловят пароли, телефоны, имена и ключи другого вида. Текст задачи с секретом всё равно сохраняется в хранилище. Поле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ghxxaa58\"&gt;dataClasses&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b7n8s30i\"&gt;registry.yaml&lt;/code&gt; в 0.2.201 ни на что не влияет.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wcs2kbbm\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blocked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t7zoel4a\"&gt;@blocked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-maskoverrides\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5gas5c9z\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lpk5bga2\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"masked\"&gt;&lt;a href=\"ru/glossary.html#masked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iirvw4vn\"&gt;masked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Скрытый фрагмент: шлюз заменил опасный текст заглушкой перед отправкой — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3r56cgmi\"&gt;[EMAIL]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6wm1qguj\"&gt;[API KEY]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kibsdocl\"&gt;[CARD NUMBER]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uojn8pf0\"&gt;[PRIVATE KEY]&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-br7amjrv\"&gt;[SEED PHRASE]&lt;/code&gt;. Число замен видно в данных вызова (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6af1w2f7\"&gt;masked={\"email\":1}&lt;/code&gt;) и в заголовке вставленного файла (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f3fajzvs\"&gt;masked email×1&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blocked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jjmra205\"&gt;@blocked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ak2co6b\"&gt;@path&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blocked\"&gt;&lt;a href=\"ru/glossary.html#blocked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u6ojiqsc\"&gt;@blocked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вызов остановлен проверкой на секреты: в тексте есть данные класса &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-awd72cph\"&gt;prohibited&lt;/code&gt;. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bb3aeyxz\"&gt;--plain&lt;/code&gt; вместо транспорта стоит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f00uv09i\"&gt;blocked&lt;/code&gt;, а в комментарии вердикта — какой шаблон сработал. Если так блокируются все роли, прогон встаёт на паузу.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1lybcmgh\"&gt;gateway       implementer@blocked → fatal&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bkcv1i6y\"&gt;gateway fatal: gateway: prohibited content (api_key) — call blocked (THE-014)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zixrl82c\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-maskoverrides\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qfsxajc2\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-maskoverrides\"&gt;&lt;a href=\"ru/glossary.html#gateway-maskoverrides\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b3o37vqj\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Исключения для шаблонов секретов в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-azv8ljrz\"&gt;policy.yaml&lt;/code&gt;. Для шаблона можно задать &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zw4tqyre\"&gt;off&lt;/code&gt; (не проверять), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-14i5r1dl\"&gt;restricted&lt;/code&gt; (скрывать, но не останавливать) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1if1xxnj\"&gt;prohibited&lt;/code&gt; (останавливать). Имена шаблонов: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aykqtpk0\"&gt;pem_private_key&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lom9tpwp\"&gt;api_key&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8atbkjhh\"&gt;card_number&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3rnayyi\"&gt;seed_phrase&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6m22plt7\"&gt;email&lt;/code&gt;. Пригодится, если шаблон ошибается на ваших данных, например принимает длинные номера за номера карт.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b647csyc\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"sandbox-tier\"&gt;&lt;a href=\"ru/glossary.html#sandbox-tier\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;sandbox tier&lt;/span&gt;&lt;/a&gt;sandbox tier&lt;/h3&gt;\n&lt;p&gt;Уровень песочницы — сколько свободы у агентов на вашей машине. Параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zd7o7nz9\"&gt;run.sandboxTier&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w2b82kvq\"&gt;standard&lt;/code&gt; (по умолчанию) — агент пишет только в копии задачи, git делает Theia;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b4e45f05\"&gt;jailed-full&lt;/code&gt; — полный доступ внутри песочницы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yowxg3mj\"&gt;theia jail&lt;/code&gt;; в 0.2.201 работает только на Linux;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q298vl4s\"&gt;trusted-full&lt;/code&gt; — полный доступ ко всей машине без песочницы. Нужна строка транспорта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nkx59tvw\"&gt;codex-full&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7juolw47\"&gt;registry.yaml&lt;/code&gt;, а Theia печатает громкое предупреждение.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В режимах &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qjwbhzbu\"&gt;jailed-full&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jofs59vq\"&gt;trusted-full&lt;/code&gt; исполнители всегда работают через Codex.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cbk118p8\"&gt;!! sandboxTier trusted-full: implementer agents run with FULL HOST ACCESS, unjailed (manifest-recorded opt-in)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yrf62lb6\"&gt;jailed-full tier unavailable&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kzeiu44c\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6pzdz2ke\"&gt;jail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#posture\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-28ttov5n\"&gt;posture&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n2iypheb\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt
