tml\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"running\"&gt;&lt;a href=\"ru/glossary.html#running\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;running&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lcq0w9kh\"&gt;running&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Прогон или задача сейчас работает. В заголовке TUI — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p883bgi7\"&gt;running&lt;/code&gt;, в счётчике задач — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rbvzk3ga\"&gt;N running&lt;/code&gt;, на табло — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fsjhgcem\"&gt;— running&lt;/code&gt;. Прогон, убитый без паузы, в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pv4e1vh2\"&gt;theia show --tui&lt;/code&gt; тоже выглядит как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zl7df3eh\"&gt;running&lt;/code&gt;, пока его не продолжат или не закроют.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tb0jgs6x\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pu9b3tol\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j5p5qmja\"&gt;in flight&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"failed\"&gt;&lt;a href=\"ru/glossary.html#failed\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;failed&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wa0a3z64\"&gt;failed&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;В TUI — задача с итогом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-urrbl3fc\"&gt;discarded&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m26m7irm\"&gt;tasks: … 1 failed&lt;/code&gt;. Отдельного итога &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nmwodr2o\"&gt;failed&lt;/code&gt; у задачи нет. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ixzrff5o\"&gt;(FAILED)&lt;/code&gt; в деталях строки — не удалось действие агента.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w9gjwbso\"&gt;tasks: 0 running · 0 done · 1 failed · anomalies 0&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qiu02xms\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aye23vb3\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"frozen\"&gt;&lt;a href=\"ru/glossary.html#frozen\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;frozen&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-73b0jgce\"&gt;frozen&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;В TUI — задача в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6898gtzw\"&gt;escalated&lt;/code&gt;, которая ждёт ведущего: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nf8gq3mr\"&gt;tasks: … 1 frozen&lt;/code&gt;, значок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7hcqveni\"&gt;◆&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-na4wkijg\"&gt;tasks: 0 running · 0 done · 1 frozen · anomalies 6&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bl4rhidj\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"pending\"&gt;&lt;a href=\"ru/glossary.html#pending\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;pending&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cjumf3hg\"&gt;pending&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;В TUI — задача ждёт: её зависимости ещё не готовы (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u5kh6gt9\"&gt;blocked on tsk…&lt;/code&gt;) или прогон уже остановился, а задача не закончена. Значок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qi8lof11\"&gt;◌&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#blocked-on\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ecl8bn32\"&gt;blocked on&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blocked-on\"&gt;&lt;a href=\"ru/glossary.html#blocked-on\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;blocked on&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r5ixaqsg\"&gt;blocked on&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Задача ждёт другие задачи: работа начнётся, когда они закончатся с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dmag0z46\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gb4yeeeq\"&gt;planned&lt;/code&gt;. В TUI это написано справа от задачи: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6w06n1np\"&gt;blocked on tsk…x&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pending\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vbgdpupd\"&gt;pending&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qxpuj0kk\"&gt;plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"idx\"&gt;&lt;a href=\"ru/glossary.html#idx\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;idx ⚠N&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q91ayhdb\"&gt;idx ⚠N&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Подсказка в заголовке TUI: на момент открытия N записей индекса устарели или отсутствуют. Работать можно, но агенты видят неполную схему проекта.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xx73ul4t\"&gt;tasks: 0 running · 0 done · 1 failed · anomalies 0 · idx ⚠1&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0y08roim\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ctx\"&gt;&lt;a href=\"ru/glossary.html#ctx\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ctx ⚠N&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x7akez70\"&gt;ctx ⚠N&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Подсказка в заголовке TUI: N раз добавленный в запросы контекст оказался больше порога &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-341arhnz\"&gt;run.contextAlertChars&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rcbugrm3\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"seek\"&gt;&lt;a href=\"ru/glossary.html#seek\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;[@ event k/N]&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-thqkrzsg\"&gt;[@ event k/N]&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Позиция в журнале в заголовке TUI: вы смотрите событие k из N. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tt9we4w2\"&gt;· live&lt;/code&gt; — экран следует за идущим прогоном, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yprzmiil\"&gt;· head&lt;/code&gt; — последнее событие. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gsxl44i0\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt; клавиши &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-raxjfjpo\"&gt;[&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zi6lm3tj\"&gt;]&lt;/code&gt; перематывают журнал на одно событие, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kdsljlq8\"&gt;{&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dxuw6xks\"&gt;}&lt;/code&gt; — на десять, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lmda1okr\"&gt;Home&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sry548d5\"&gt;End&lt;/code&gt; — в начало и в конец, а дерево пересобирается на выбранный момент. После конца живого прогона эти клавиши двигают только счётчик; для перемотки откройте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5x2yd8je\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4w1jvpdn\"&gt;[@ event 22/22 · head]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3dx40yle\"&gt;[@ event 21/22]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-ended\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-le5rhpvp\"&gt;run ended&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#head\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fmqf5fmg\"&gt;head&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8llbp4h1\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/tui/navigation.html\"&gt;Навигация и горячие клавиши&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"follow\"&gt;&lt;a href=\"ru/glossary.html#follow\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;follow&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bxeq31sg\"&gt;follow&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим слежения: курсор сам переходит к новой активности. Клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yqgzrvzo\"&gt;f&lt;/code&gt; включает и выключает его, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5w3iqjli\"&gt;F&lt;/code&gt; выбирает уровень: задача, раунд или инструмент.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xe8ds0l0\"&gt;f follow:round&lt;/code&gt; в строке подсказок.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verbosity\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l6u5bpo0\"&gt;verbosity&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#keybar\"&gt;keybar&lt;/a&gt;, &lt;a href=\"ru/tui/navigation.html\"&gt;Навигация и горячие клавиши&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verbosity\"&gt;&lt;a href=\"ru/glossary.html#verbosity\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;verbosity&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c9jn96i4\"&gt;verbosity&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Сколько деталей показывает дерево: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gt77s449\"&gt;0&lt;/code&gt; — только задачи и раунды (аномалии и указания видны всегда), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uk45v5ry\"&gt;1&lt;/code&gt; — обычный вид, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c3sdljmm\"&gt;2&lt;/code&gt; — ещё строки вызовов и инструментов. Клавиши &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-15woka7v\"&gt;+&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fc5vr3tp\"&gt;-&lt;/code&gt;. Theia запоминает выбор вместе с уровнем слежения в файле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z04v3jnm\"&gt;tui-state.json&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-01l28f2n\"&gt;+/- verbosity=1&lt;/code&gt; в строке подсказок.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#follow\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4x7gstsi\"&gt;follow&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#keybar\"&gt;keybar&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"keybar\"&gt;&lt;a href=\"ru/glossary.html#keybar\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;keybar&lt;/span&gt;&lt;/a&gt;keybar&lt;/h3&gt;\n&lt;p&gt;Строка подсказок внизу TUI. Она показывает только клавиши, которые работают сейчас: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k2teap3m\"&gt;move&lt;/code&gt; — курсор, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-znl2prxh\"&gt;fold&lt;/code&gt; — свернуть или раскрыть, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kjqmvhrd\"&gt;zoom&lt;/code&gt; — детали (Enter), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-57xrklx2\"&gt;pane&lt;/code&gt; — переключить панель (Tab), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v7c5apu6\"&gt;follow&lt;/code&gt; — слежение, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qop6qhwz\"&gt;err&lt;/code&gt; — к следующей ошибке, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0dw6zirz\"&gt;seek&lt;/code&gt; — перемотка, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mkbi7qil\"&gt;wrap&lt;/code&gt; — перенос строки, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tgcyukeh\"&gt;view&lt;/code&gt; — полный текст в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pfja7vvt\"&gt;$EDITOR&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h1599wx4\"&gt;less&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o0soktqa\"&gt;verbosity&lt;/code&gt; — детали, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cwhcgaxc\"&gt;steer&lt;/code&gt; — указание (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qczdm2au\"&gt;m&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2uppxjf8\"&gt;prompt&lt;/code&gt; — запрос идущего вызова (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ol3h06o\"&gt;p&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hu4upnu2\"&gt;stop&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-67nddqof\"&gt;quit&lt;/code&gt; — клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jinz2q3i\"&gt;q&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h8mgk0b4\"&gt;?&lt;/code&gt; открывает полную справку.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-exhb66h8\"&gt;↑↓ move • ←→ fold • ⏎ zoom • ⇥ pane • f follow • e err • [ ] seek • w wrap • v view • +/- verbosity=1 • ? • q quit&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#follow\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e7xyewce\"&gt;follow&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verbosity\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fpwvoqtz\"&gt;verbosity&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g9cgwu6u\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-thz62yta\"&gt;detail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"ru/tui/navigation.html\"&gt;Навигация и горячие клавиши&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"detail\"&gt;&lt;a href=\"ru/glossary.html#detail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;detail&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wcj07qtd\"&gt;detail&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Панель деталей под деревом, открывается клавишей Enter. Она показывает всё о строке под курсором: вердикт с комментарием и доказательствами, вопросы, данные вызова, историю фаз задачи. У вердикта в сохранённом прогоне есть готовая команда ответвления &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hybj6wlp\"&gt;theia fork &amp;lt;run&amp;gt; --at &amp;lt;evt&amp;gt;&lt;/code&gt;. Клавиша Tab переключает управление между деревом и панелью.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bkpj9wo2\"&gt;┤ detail ├&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dub4nkmk\"&gt;┤ tree · focus ├&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-use6r5xg\"&gt;phases:&lt;/code&gt; в деталях задачи.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fajxq4y4\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#keybar\"&gt;keybar&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blob\"&gt;&lt;a href=\"ru/glossary.html#blob\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;blob&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e0dq19kt\"&gt;blob&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Сохранённый полный текст обмена с моделью: запрос и ответ одного вызова. Theia хранит его отдельно от журнала событий, а в записи вызова оставляет ссылку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-heed46zx\"&gt;blobRef&lt;/code&gt;. В TUI клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-przqt6hl\"&gt;v&lt;/code&gt; открывает текст выбранного вызова, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vmh1kn4b\"&gt;p&lt;/code&gt; — запрос идущего вызова; оба пишут текст во временный файл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i9fv60te\"&gt;theia-blob-&amp;lt;id&amp;gt;.txt&lt;/code&gt; и не удаляют его. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i5ptj5n6\"&gt;theia prune&lt;/code&gt; удаляет тексты, на которые больше никто не ссылается (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-39fhvbk2\"&gt;orphaned blobs&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pl77deo7\"&gt;blobRef: 62a278c5…&lt;/code&gt; в панели деталей, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3e8su151\"&gt;no stored body for this row&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rdk6pj55\"&gt;blob absent (recorded elsewhere)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5afjcwpc\"&gt;no prompt blob for this call (blob store absent or content blocked)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-00z306gn\"&gt;14 orphaned blobs (0.0 MB)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t4fjwmh4\"&gt;theia prune&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qnwmm13o\"&gt;detail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zx3nh29c\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/tui/navigation.html#open-full-text\"&gt;Навигация и горячие клавиши&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"in-flight\"&gt;&lt;a href=\"ru/glossary.html#in-flight\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;in flight&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zyzjgtua\"&gt;in flight&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Работа ещё идёт:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;на домашнем экране &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0jilxis6\"&gt;⣽ run…  in flight&lt;/code&gt; — у прогона нет записи о конце или паузе; так же выглядит убитый прогон;&lt;/li&gt;\n&lt;li&gt;в TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nqaytsmm\"&gt;⋯ implementer tsk…x  call in flight… · 12s [0 tools]&lt;/code&gt; — вызов модели идёт прямо сейчас. Клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k12t1s19\"&gt;p&lt;/code&gt; открывает его запрос, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6chplohw\"&gt;no call in flight&lt;/code&gt; значит, что вызовов сейчас нет.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zaklauf2\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dbnuudpv\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-ended\"&gt;&lt;a href=\"ru/glossary.html#run-ended\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run ended&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y2u7z1h0\"&gt;run ended&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Прогон закончился, а TUI остаётся открытым, чтобы вы посмотрели дерево. Клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1h3cxrug\"&gt;q&lt;/code&gt; закрывает экран, после этого итог печатается в обычный терминал.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0s0mcnvm\"&gt;■ run ended — 1 discarded · browse the tree; q quits&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#tui\"&gt;TUI&lt;/a&gt;, &lt;a href=\"ru/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1w4psh4g\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#summary\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yr030x3n\"&gt;summary&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-doctor\"&gt;&lt;a href=\"ru/glossary.html#group-doctor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;theia doctor&lt;/span&gt;&lt;/a&gt;theia doctor&lt;/h2&gt;\n&lt;h3 id=\"doctor\"&gt;&lt;a href=\"ru/glossary.html#doctor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;doctor&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lp2tedjp\"&gt;doctor&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4na3ktks\"&gt;theia doctor&lt;/code&gt; проверяет, готова ли машина: входы в движки, песочницу, поиск, эмбеддинги, личные настройки, хранилище, правила, хуки Codex и файлы поставки. Модель не вызывается. Каждая строка — это &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ksdir4kt\"&gt;название : состояние&lt;/code&gt;. Код выхода 1, если есть учтённая ошибка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l6d3eamb\"&gt;FAIL&lt;/code&gt;. Домашний экран показывает только проблемные строки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#unavailable\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lcco1axp\"&gt;unavailable&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z791dfcj\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#not-initialized\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zajrwzjy\"&gt;not initialized&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/doctor.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lvd4mudj\"&gt;theia doctor&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"unavailable\"&gt;&lt;a href=\"ru/glossary.html#unavailable\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;unavailable&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d5murtz1\"&gt;unavailable&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Возможность недоступна на этой машине, в скобках — причина. Само по себе это не ошибка. Например, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-birje4jc\"&gt;codex subscription : unavailable&lt;/code&gt; при работающем Claude Code — нормально.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qyudumer\"&gt;doctor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8y8cdn8y\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4gvrdou\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fail\"&gt;&lt;a href=\"ru/glossary.html#fail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;FAIL&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o538sex3\"&gt;FAIL&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Настоящая проблема. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vzzy9rxk\"&gt;theia doctor&lt;/code&gt; строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8xkujfg\"&gt;harnesses&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lardiui0\"&gt;embeddings&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tn24ny5w\"&gt;vendor deliverables&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iu9jzn41\"&gt;shell (git-bash)&lt;/code&gt; (только Windows) с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zxl1ln1g\"&gt;FAIL&lt;/code&gt; дают код выхода 1, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qjpwcv93\"&gt;FAIL&lt;/code&gt; в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-skg2eyt6\"&gt;lexical index&lt;/code&gt; код выхода не меняет. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5c90vrlv\"&gt;theia index build&lt;/code&gt; строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gwgnbovc\"&gt;FAIL &amp;lt;файл&amp;gt;: &amp;lt;причина&amp;gt;&lt;/code&gt; и счётчик &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8etab6w4\"&gt;N FAILED&lt;/code&gt; значат, что карточку для файла сделать не удалось.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r58dy946\"&gt;harnesses          : FAIL (neither codex nor claude is authenticated — one is required)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mwn22hvg\"&gt;index: 1/1 built · 1 FAILED · $0.0000 · 166.7/s&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t59h2m79\"&gt;doctor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unavailable\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vd37k7do\"&gt;unavailable&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#failed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-69vl7vx4\"&gt;failed&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"not-initialized\"&gt;&lt;a href=\"ru/glossary.html#not-initialized\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;not initialized&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-idfy4zhr\"&gt;not initialized&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-voq33e8u\"&gt;theia doctor&lt;/code&gt; это значит, что в текущей папке нет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1zvkvqhe\"&gt;.theia&lt;/code&gt; со &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vfbn4i61\"&gt;store.db&lt;/code&gt;. Doctor смотрит только текущую папку. Из подпапки проекта или для хранилища в папке пользователя он напишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ktnsnku0\"&gt;not initialized (theia init)&lt;/code&gt;, хотя остальные команды хранилище найдут. Запускайте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-swdv2dbe\"&gt;theia doctor&lt;/code&gt; из корня проекта.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f0r09pws\"&gt;.theia store       : not initialized (theia init)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#theia-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sj1h5276\"&gt;.theia store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lh0ikxev\"&gt;doctor&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"harnesses\"&gt;&lt;a href=\"ru/glossary.html#harnesses\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;harnesses&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xyxrxjes\"&gt;harnesses&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-93xysp0w\"&gt;theia doctor&lt;/code&gt;, которая появляется, только когда нет входа ни в Codex, ни в Claude Code. Хватит входа в один из них.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qioahht0\"&gt;harnesses          : FAIL (neither codex nor claude is authenticated — one is required)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#codex-subscription\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5fpwnrfa\"&gt;codex subscription&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#claude-code\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nwc4f364\"&gt;claude code&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"codex-subscription\"&gt;&lt;a href=\"ru/glossary.html#codex-subscription\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;codex subscription&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g8o484ep\"&gt;codex subscription&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8y7cygt\"&gt;theia doctor&lt;/code&gt;: выполнен ли вход в Codex CLI по подписке (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q5i4g1a9\"&gt;codex login&lt;/code&gt;). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8x1ijfvr\"&gt;unavailable&lt;/code&gt; значит, что входа нет или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dy90qee3\"&gt;codex&lt;/code&gt; не установлен.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vr70dz93\"&gt;codex subscription : unavailable (harness-codex: not authenticated (codex login status: exit 1))&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dxn0fq4i\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"claude-code\"&gt;&lt;a href=\"ru/glossary.html#claude-code\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;claude code&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fsrss2xc\"&gt;claude code&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mrrd07vo\"&gt;theia doctor&lt;/code&gt;: выполнен ли вход в Claude Code по подписке. Ключ Anthropic API Theia для Claude Code не использует, поэтому вход по ключу здесь не засчитывается.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gmfovqi5\"&gt;claude code        : ok&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xy0yp950\"&gt;claude code        : unavailable (harness-claude: not logged in …)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g396pe3s\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lexical-index\"&gt;&lt;a href=\"ru/glossary.html#lexical-index\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lexical index&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fje4v5uy\"&gt;lexical index&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kk5im3uk\"&gt;theia doctor&lt;/code&gt;: загружается ли встроенная библиотека поиска по словам (tantivy). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jjam49v5\"&gt;FAIL&lt;/code&gt; здесь значит сломанную установку, но код выхода не меняет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jdwyh54s\"&gt;lexical index      : ok (tantivy binding loads)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7jhphn33\"&gt;doctor&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-store\"&gt;&lt;a href=\"ru/glossary.html#theia-store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;.theia store&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ndls7vax\"&gt;.theia store&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aefthz6u\"&gt;theia doctor&lt;/code&gt;: есть ли хранилище в текущей папке. Значения: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-egbpvqnc\"&gt;ok&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mn29b7mi\"&gt;not initialized (theia init)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#not-initialized\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ygipxkg\"&gt;not initialized&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ai-rules\"&gt;&lt;a href=\"ru/glossary.html#ai-rules\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ai rules&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-18bdij1j\"&gt;ai rules&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Какие файлы правил для ИИ найдены в проекте и как они попадают к модели: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0ghecqt\"&gt;(native·codex)&lt;/code&gt; — движок читает файл сам, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5bl5s5tb\"&gt;(injected)&lt;/code&gt; — Theia добавляет его через манифест &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hdpv008h\"&gt;Context&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p3i0uutv\"&gt;none detected&lt;/code&gt; — таких файлов нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3o79epjk\"&gt;ai rules           : none detected&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x39okb41\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1kgh4dd8\"&gt;ai rules: none detected&lt;/code&gt; после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i8ypdnjo\"&gt;theia init&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-74qpfidy\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-rulessot\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hbpygtir\"&gt;run.rulesSoT&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"codex-hooks\"&gt;&lt;a href=\"ru/glossary.html#codex-hooks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;codex hooks&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uoh8d2pl\"&gt;codex hooks&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jfr32xsj\"&gt;theia doctor&lt;/code&gt; о хуках Codex: включена ли функция хуков в самом Codex, доверен ли проект (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5xr6jp9k\"&gt;gate 1&lt;/code&gt;) и есть ли файл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c2jvzmow\"&gt;.codex/hooks.json&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-omjt2494\"&gt;codex hooks        : feature stable/true; project NOT trusted (gate 1); hooks.json absent (theia hooks install codex)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gate-1\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g4xauzqr\"&gt;gate 1&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-ids\"&gt;&lt;a href=\"ru/glossary.html#group-ids\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Идентификаторы&lt;/span&gt;&lt;/a&gt;Идентификаторы&lt;/h2&gt;\n&lt;h3 id=\"run-id\"&gt;&lt;a href=\"ru/glossary.html#run-id\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;runId&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jiyc71hj\"&gt;runId&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Идентификатор прогона: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ejzbf8h\"&gt;run&lt;/code&gt; и 22 символа, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o5jvak94\"&gt;run2akdqb2i4k223pwvesbyig&lt;/code&gt;. У других объектов свои приставки: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9hlwbr2m\"&gt;tsk&lt;/code&gt; — задача, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jfar9fie\"&gt;pln&lt;/code&gt; — план, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5rqj1344\"&gt;fct&lt;/code&gt; — факт, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3n4070ph\"&gt;chk&lt;/code&gt; — кусок памяти, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9j5evrut\"&gt;gen&lt;/code&gt; — поколение поиска. Идентификаторы растут со временем, поэтому их порядок совпадает с порядком создания. Команды принимают полный идентификатор или 22 символа без приставки.&lt;/p&gt;\n&lt;p&gt;Отдельной команды со списком прогонов нет. Идентификатор виден в начале прогона (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-80ezgomg\"&gt;run run… task tsk…&lt;/code&gt;), в подсказке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iisi9gjs\"&gt;resume with:&lt;/code&gt;, на домашнем экране и в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pp2f7hlp\"&gt;theia audit verify&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#body\"&gt;body&lt;/a&gt;, &lt;a href=\"ru/glossary.html#short-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-na2tcsw0\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#terryid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vtf2x0ny\"&gt;terryid&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"body\"&gt;&lt;a href=\"ru/glossary.html#body\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;body&lt;/span&gt;&lt;/a&gt;body&lt;/h3&gt;\n&lt;p&gt;Идентификатор без приставки — 22 символа, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ep2g1q32\"&gt;2akdqb2i4k223pwvesbyig&lt;/code&gt;. В такой форме Theia печатает номера в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1lj471zp\"&gt;theia audit verify&lt;/code&gt;, в строках о связи ответвлений и в подсказке после первого Ctrl+C. Команды принимают и такую форму.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-czf6ajnp\"&gt;2akdqb2i4k223pwvesbyig: intact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x95lgngq\"&gt;forked from 2akdqb2i4k223pwvesbyig at bjr37ync&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dx7dsgqc\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#short-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-47nz7iyg\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"short-id\"&gt;&lt;a href=\"ru/glossary.html#short-id\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;tsk…xk6rzynf&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rye30iv5\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Короткий номер — последние символы идентификатора для экрана: 8 символов в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9tpb53wi\"&gt;--plain&lt;/code&gt;, на табло и в TUI (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tsiw03sl\"&gt;xk6rzynf&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gifthipj\"&gt;tsk…xk6rzynf&lt;/code&gt;) и 6 символов в строках &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ftikeek\"&gt;live&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ttcwgji\"&gt;tsk…6rzynf&lt;/code&gt;). Короткий хвост понимают только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-opvzam00\"&gt;show --task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0iyo289p\"&gt;msg --task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kw6cx7g7\"&gt;fork --at&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y4144kvi\"&gt;answer --question&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dlqh9k8o\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#body\"&gt;body&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"terryid\"&gt;&lt;a href=\"ru/glossary.html#terryid\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;terryid&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r4wr1hpk\"&gt;terryid&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Название формата идентификаторов Theia. Слово встречается в ошибках, когда строку не удалось прочитать как идентификатор. Тексты два:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ppg7kong\"&gt;terryid: neither a body nor a full id: '…'&lt;/code&gt; — аргумент короче полного идентификатора и не равен 22 символам после префикса. Так отвечают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-thr0bkie\"&gt;show&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ekkhcu4\"&gt;diagnose&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nry3fyo7\"&gt;msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o22ql9st\"&gt;replay&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yu2ji3c8\"&gt;fork&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nkjkxqe1\"&gt;mem asof&lt;/code&gt; на короткий хвост вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3450rsrg\"&gt;ovfyt3&lt;/code&gt; и на дату вместо идентификатора.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ugups7jg\"&gt;terryid: malformed id '…'&lt;/code&gt; — строка похожа на идентификатор по длине, но это не он. В 0.2.201 так отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-awqe66g0\"&gt;theia run --from-plan&lt;/code&gt;, если после флага стоит не идентификатор плана.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Правильный по форме, но чужой идентификатор даёт другую ошибку: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-suo9j0fj\"&gt;&amp;lt;команда&amp;gt;: no events for &amp;lt;id&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o1k990r2\"&gt;terryid: neither a body nor a full id: 'ovfyt3'&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4iokur1z\"&gt;terryid: malformed id '--plain'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yjysu9w8\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#asof\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9u1w8p7r\"&gt;asof&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"digest\"&gt;&lt;a href=\"ru/glossary.html#digest\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;digest&lt;/span&gt;&lt;/a&gt;digest&lt;/h3&gt;\n&lt;p&gt;Отпечаток — хеш SHA-256 содержимого. Одинаковое содержимое даёт одинаковый отпечаток, любое изменение — другой. Так Theia помечает план (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-le54yyjt\"&gt;digest fce3554ee5e2…&lt;/code&gt;), вставленный файл (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8sp6pfgd\"&gt;sha256 bc70e26f40b8&lt;/code&gt;), вывод команд проверки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-navrf4wu\"&gt;test_run 74d0…&lt;/code&gt;) и файлы поставки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-54qrzt5k\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-io0lwry8\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#test-run\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3p87ot46\"&gt;test_run&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-internal\"&gt;&lt;a href=\"ru/glossary.html#group-internal\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Внутренние коды&lt;/span&gt;&lt;/a&gt;Внутренние коды&lt;/h2&gt;\n&lt;h3 id=\"the-codes\"&gt;&lt;a href=\"ru/glossary.html#the-codes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;THE-…&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pwnnx6zy\"&gt;THE-…&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Номера внутренних правил разработки Theia в скобках в конце сообщений об ошибках. Смысл сообщения — в тексте перед скобкой, сам номер можно не замечать. Чаще других встречаются:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q66v8uz8\"&gt;THE-005&lt;/code&gt; — цепочка аудита прогона нарушена: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bd9iwcel\"&gt;resume&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3pwh4726\"&gt;fork&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wjos0xi8\"&gt;probe&lt;/code&gt; отказываются работать с таким прогоном (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0zddwfjt\"&gt;… chain BROKEN at &amp;lt;событие&amp;gt; — refusing to … a tampered run (THE-005)&lt;/code&gt;), а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83j3b1v3\"&gt;theia audit verify&lt;/code&gt; пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3qr35vo\"&gt;BROKEN&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t8bk40bb\"&gt;THE-013&lt;/code&gt; — Claude Code настроен на API-ключ, а Theia принимает только вход по подписке (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-arzapln0\"&gt;API-key fallback is refused — THE-013&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xzmwpoxj\"&gt;THE-014&lt;/code&gt; — в запрос к модели попал секрет: файл через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gsjrg05r\"&gt;@путь&lt;/code&gt; в тексте задачи или плана (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eoz2034i\"&gt;@key.pem: prohibited content (pem_private_key) — this file cannot enter a model prompt (THE-014)&lt;/code&gt;) либо сам текст запроса (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h8x3p0wc\"&gt;gateway: prohibited content (api_key) — call blocked (THE-014)&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e1nwtyjl\"&gt;THE-024&lt;/code&gt; — кончился денежный бюджет прогона или команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wgj02ip9\"&gt;ask&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y0rf5rou\"&gt;usd budget exhausted for this run (THE-024)&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s0mziner\"&gt;THE-065&lt;/code&gt; — не найдены или повреждены файлы поставки с промптами ролей (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q9ts92po\"&gt;no vendor deliverables found … (THE-065)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0n3sgv9o\"&gt;vendor prompts broken … (THE-065)&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#ticket-codes\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1di0webn\"&gt;R5&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v7yevsvm\"&gt;T-W&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aea9trxw\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget-exhausted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z78xuwrg\"&gt;budget_exhausted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#vendor\"&gt;vendor deliverables&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ticket-codes\"&gt;&lt;a href=\"ru/glossary.html#ticket-codes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;,&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9inahdgf\"&gt;R5&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z1nah173\"&gt;T-W&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Номера внутренних задач и разделов проектной документации в справке и сообщениях: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o1500e7v\"&gt;(R5)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jqtbe4f8\"&gt;(R11)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lbhhslhk\"&gt;— T-W&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-artd5drp\"&gt;(F6)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eysq44u5\"&gt;docs/10 §4&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kj7j2bfk\"&gt;docs/13&lt;/code&gt;. Это ссылки для разработчиков платформы, их можно не замечать. Так же относитесь к слову &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yl1yjiem\"&gt;receipt&lt;/code&gt; в тексте справки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#the-codes\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6tpqu4v2\"&gt;THE-…&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ambiguous\"&gt;&lt;a href=\"ru/glossary.html#ambiguous\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Слова с несколькими значениями&lt;/span&gt;&lt;/a&gt;Слова с несколькими значениями&lt;/h2&gt;\n&lt;p&gt;Одно слово в выводе Theia может значить разное. Что именно, видно по месту, где оно стоит. У каждого такого слова есть своя статья:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#note\"&gt;note&lt;/a&gt; — служебная заметка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-brbcw1qu\"&gt;task.note&lt;/code&gt;, ваше указание &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nu0hc9i3\"&gt;user.note&lt;/code&gt;, комментарий роли, просьба к плану, ответ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-khbxgmr1\"&gt;noted — …&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0fg2mid8\"&gt;live&lt;/code&gt;&lt;/a&gt; — строки хода работы в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-goyyfn99\"&gt;--plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vcmj2teg\"&gt;· live&lt;/code&gt; в заголовке TUI, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-alojoxor\"&gt;(live; …)&lt;/code&gt; при продолжении, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kxns1q7y\"&gt;N live&lt;/code&gt; в строке статуса.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#session\"&gt;session&lt;/a&gt; — сессия движка, режим &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9rzl15hi\"&gt;--sessions&lt;/code&gt;, хук &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tv7sh82v\"&gt;SessionStart&lt;/code&gt;, метки кусков переписки.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1w0vcsc2\"&gt;verify&lt;/code&gt;&lt;/a&gt; — фаза, флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3qugnt5b\"&gt;--verify&lt;/code&gt;, команда проверки пункта плана, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7thnorjr\"&gt;lead_reverify&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zq5mry9a\"&gt;draft&lt;/code&gt;&lt;/a&gt; — фаза новой задачи и статус неодобренного плана.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#done\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eh543sas\"&gt;done&lt;/code&gt;&lt;/a&gt; — счётчик &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-notk8b5u\"&gt;N done&lt;/code&gt; в TUI и недостижимая фаза &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9coy29p3\"&gt;done&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt; — деньги прогона, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xzrd0xvy\"&gt;halted: budget&lt;/code&gt; (вердикты, не деньги), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ezy39hi\"&gt;round_budget&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5fssz95y\"&gt;rescope_budget&lt;/code&gt;, свои лимиты у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xtyzwzrp\"&gt;fork&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-itye92ut\"&gt;probe&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gez2ufpn\"&gt;ask&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ttvojsxc\"&gt;index build&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt; — копия задачи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4i1ydobb\"&gt;ws-&amp;lt;task&amp;gt;&lt;/code&gt;, манифест &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p6pg0ivp\"&gt;kind: Workspace&lt;/code&gt;, папка проекта, режим &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4s1blzim\"&gt;workspace-write&lt;/code&gt; у Codex.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt; — корень проекта, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eivoi0mu\"&gt;root:&amp;lt;имя&amp;gt;&lt;/code&gt; в памяти, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-haqoq5zk\"&gt;worktree root&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bltsm17o\"&gt;root cause&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#scope\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-763rp7qt\"&gt;scope&lt;/code&gt;&lt;/a&gt; — часть памяти, уровень настроек, имя цепочки в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gxgyhzy9\"&gt;audit verify&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#head\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x0x0ecz3\"&gt;head&lt;/code&gt;&lt;/a&gt; — возраст поколения поиска, последнее событие в TUI, коммит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qi1edrez\"&gt;HEAD&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a3gkw6wa\"&gt;plan&lt;/code&gt;&lt;/a&gt; — сохранённый план и фаза &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gw3xld2e\"&gt;plan&lt;/code&gt; трека &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybfufqms\"&gt;full_spec&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#ready\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6t72cvfd\"&gt;ready&lt;/code&gt;&lt;/a&gt; — одно событие для трёх переходов: в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2mqm1twp\"&gt;implement&lt;/code&gt; для новой задачи, в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ihkeceq\"&gt;implement&lt;/code&gt; после планировщика, в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8iei3kha\"&gt;verify&lt;/code&gt; после исполнителя. Тот же смысл имеют &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n2rhhih9\"&gt;docker ready&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x7btxq66\"&gt;theia doctor&lt;/code&gt; (есть команда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zeciag6t\"&gt;docker&lt;/code&gt;) и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r0eer4nu\"&gt;ready at …&lt;/code&gt; у эмбеддингов (модель скачана).&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7nov71r0\"&gt;merge&lt;/code&gt;&lt;/a&gt; и &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bp30n0kb\"&gt;merged&lt;/code&gt;&lt;/a&gt; — фаза слияния и итог задачи; &lt;a href=\"ru/glossary.html#discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wbuhq8j2\"&gt;discard&lt;/code&gt;&lt;/a&gt; и &lt;a href=\"ru/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-onpotdpu\"&gt;discarded&lt;/code&gt;&lt;/a&gt; — вердикт рецензента и итог задачи.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gof9pcf4\"&gt;FAIL&lt;/code&gt;&lt;/a&gt; и &lt;a href=\"ru/glossary.html#failed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ws70k91s\"&gt;failed&lt;/code&gt;&lt;/a&gt; — проблема в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-krld6rux\"&gt;theia doctor&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6wppet7w\"&gt;index build&lt;/code&gt;, счётчик отброшенных задач в TUI, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y39dzgqb\"&gt;(FAILED)&lt;/code&gt; у действия агента.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"misleading\"&gt;&lt;a href=\"ru/glossary.html#misleading\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Обманчивые статусы&lt;/span&gt;&lt;/a&gt;Обманчивые статусы&lt;/h2&gt;\n&lt;p&gt;Слова, которые выглядят как оценка, но ей не являются. Проверяйте то, что стоит рядом.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#completed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jhqwt09f\"&gt;completed&lt;/code&gt;&lt;/a&gt; не значит «успех»: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ga0m8ypm\"&gt;halted: completed&lt;/code&gt; пишется и когда все задачи отброшены, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6rrtoqle\"&gt;theia run&lt;/code&gt; при этом возвращает код 1. Смотрите исход каждой задачи: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a1v9ygwu\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-auoxqd0i\"&gt;discarded&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#glyphs\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqb716f4\"&gt;✔&lt;/code&gt;&lt;/a&gt; — «не плохое событие», а не «хороший итог». Раунды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4gbbz5q1\"&gt;lead → lead_discard&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-izhhgqo4\"&gt;arbiter → arb_escalate&lt;/code&gt; тоже отмечены &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s0thal8z\"&gt;✔&lt;/code&gt;, и прогон без единого слияния показан как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-702ajcf4\"&gt;✔ completed&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o3jis8o9\"&gt;halted: budget&lt;/code&gt;&lt;/a&gt; — не деньги, а потолок в 1000 вердиктов. Когда кончаются деньги, итог — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l2l9v66u\"&gt;halted: paused&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#running\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ez84gtdq\"&gt;running&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b8ke3r5w\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x63s7vm2\"&gt;N live&lt;/code&gt;&lt;/a&gt; — так выглядит и прогон, убитый без паузы: у него просто нет записи о конце. Продолжите его (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7qmgl5et\"&gt;--resume&lt;/code&gt;) или закройте (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ceof0xvz\"&gt;--abandon&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vpzx79xz\"&gt;noted — this run appears live …&lt;/code&gt; от &lt;a href=\"ru/glossary.html#steering\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w88w1dgv\"&gt;theia msg&lt;/code&gt;&lt;/a&gt; не значит, что указание дойдёт: новый прогон не читает указания из других процессов, читает только продолженный через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-icsxf4l5\"&gt;--resume&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ok2sxgr\"&gt;resuming run … (finished; …)&lt;/code&gt; — &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ntfictju\"&gt;--resume&lt;/code&gt;&lt;/a&gt; продолжает и закрытый прогон (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zrfsyij1\"&gt;halted: abandoned&lt;/code&gt;). Слово в скобках — состояние по журналу, а не разрешение.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gqiyyes5\"&gt;&amp;lt;имя&amp;gt;: intact&lt;/code&gt; от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v0cxa3rn\"&gt;theia audit verify&lt;/code&gt; для несуществующей области — &lt;a href=\"ru/glossary.html#audit-chain\"&gt;цепочка&lt;/a&gt; цела, потому что проверять нечего.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uzrs8yo3\"&gt;superseded &amp;lt;old&amp;gt; -&amp;gt; &amp;lt;new&amp;gt;&lt;/code&gt; от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-guryu3nm\"&gt;theia mem supersede&lt;/code&gt; — &lt;a href=\"ru/glossary.html#supersede\"&gt;замена&lt;/a&gt; записана, даже если нового идентификатора не существует.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g63u1ul4\"&gt;docker ready&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uh2l6zrt\"&gt;theia doctor&lt;/code&gt; — есть команда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tqw51s70\"&gt;docker&lt;/code&gt;, а не работающий Docker. См. &lt;a href=\"ru/glossary.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7zaikzxz\"&gt;jail&lt;/code&gt;&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-un3fgr4n\"&gt;(injected)&lt;/code&gt; в строке &lt;a href=\"ru/glossary.html#ai-rules\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-15gysvkc\"&gt;ai rules&lt;/code&gt;&lt;/a&gt; — файл правил найден на диске, а не то, что он попадёт в запрос: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-deyzvvow\"&gt;theia doctor&lt;/code&gt; не читает записи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-65wigjd0\"&gt;Context&lt;/code&gt;. Верьте строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-esi600cn\"&gt;context injected: …&lt;/code&gt; в начале прогона.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-c
