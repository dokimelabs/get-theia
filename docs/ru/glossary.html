-code-id-vzzzm17o\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g8q7w12r\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"context\"&gt;&lt;a href=\"ru/glossary.html#context\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4s2y2qfi\"&gt;kind: Context&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Манифест с правилами и справочными текстами, которые Theia добавляет в запросы агентов как текст. Источник записи — строка, файл или шаблон пути; когда добавлять — всегда, для ролей, треков или путей. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nor0onrw\"&gt;theia init&lt;/code&gt; сам создаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zy7i2n7m\"&gt;context-rules.yaml&lt;/code&gt;, если нашёл файлы правил вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ldj77lld\"&gt;.cursorrules&lt;/code&gt;. Путь к файлу пишите относительно проекта: абсолютный путь не работает.&lt;/p&gt;\n&lt;p&gt;Если добавленного текста больше &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t87irwr6\"&gt;run.contextAlertChars&lt;/code&gt; (200 000 символов), Theia предупреждает, но загружает всё. Жёсткий лимит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lswvough\"&gt;run.contextRefuseChars&lt;/code&gt; по умолчанию не задан.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-81tdx2gb\"&gt;context       injected: …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-au97u2di\"&gt;--plain&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jf0ss1vt\"&gt;context injected (N entries)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u3bnxuo9\"&gt;context alert: task … injects N chars (&amp;gt; contextAlertChars=200000) — loading everything&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#ai-rules\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ozjyo1t\"&gt;ai rules&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ctx\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xr7aief0\"&gt;ctx ⚠N&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"pre-task\"&gt;&lt;a href=\"ru/glossary.html#pre-task\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ztbnhgcg\"&gt;pre-task&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Команды из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zynfezds\"&gt;run.preTask&lt;/code&gt;, которые Theia запускает перед первым шагом исполнителя. Если обязательная команда (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ptdk1e5z\"&gt;mustPass&lt;/code&gt;) упала, задача замирает ещё до вызова модели и ждёт ведущего.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0661o86s\"&gt;pre-task      &amp;lt;task&amp;gt; N gate(s), M failed&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e0qlcv4h\"&gt;pre-task gates: N run, M failed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#illegal-verdict\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-myvn0usa\"&gt;illegal_verdict&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#policy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qsi4jh03\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8ky63rh\"&gt;policy.yaml&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-rulessot\"&gt;&lt;a href=\"ru/glossary.html#run-rulessot\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ik8eyjgn\"&gt;run.rulesSoT&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим «правила только через Theia». В копиях задач файлы правил (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0nooa8kj\"&gt;AGENTS.md&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-luibhflf\"&gt;CLAUDE.md&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-doqy2a71\"&gt;.cursorrules&lt;/code&gt; и другие) заменяются заглушкой, а Codex не читает свои файлы проекта. Сами &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kwhgtct2\"&gt;AGENTS.md&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2uen2f1v\"&gt;CLAUDE.md&lt;/code&gt; при этом в запросы не попадают: добавьте их манифестом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1cy926ww\"&gt;Context&lt;/code&gt;. По умолчанию режим выключен.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qmqrjqli\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ai-rules\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bkkdvxc0\"&gt;ai rules&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-security\"&gt;&lt;a href=\"ru/glossary.html#group-security\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Безопасность и песочница&lt;/span&gt;&lt;/a&gt;Безопасность и песочница&lt;/h2&gt;\n&lt;h3 id=\"data-class\"&gt;&lt;a href=\"ru/glossary.html#data-class\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;data class&lt;/span&gt;&lt;/a&gt;data class&lt;/h3&gt;\n&lt;p&gt;Класс данных — насколько опасно отправлять текст модели. Шлюз проверяет каждый запрос простыми шаблонами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oogfxksb\"&gt;prohibited&lt;/code&gt; — отправлять нельзя: закрытые ключи, ключи API (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u7qalmjj\"&gt;sk-…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z39f8uge\"&gt;AKIA…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jk5t0r1r\"&gt;ghp_…&lt;/code&gt;), номера карт, seed-фразы. Вызов останавливается.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bfznn9l5\"&gt;restricted&lt;/code&gt; — можно только со скрытием: адреса почты заменяются на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bcekvvtw\"&gt;[EMAIL]&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2l3o3s8a\"&gt;permitted&lt;/code&gt; — текст уходит как есть.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Шаблоны не ловят пароли, телефоны, имена и ключи другого вида. Текст задачи с секретом всё равно сохраняется в хранилище. Поле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i0pssslz\"&gt;dataClasses&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3xed706j\"&gt;registry.yaml&lt;/code&gt; в 0.2.201 ни на что не влияет.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ooq84c6f\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blocked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-97v8oxsw\"&gt;@blocked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-maskoverrides\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qgtpmwcy\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uxzayopp\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"masked\"&gt;&lt;a href=\"ru/glossary.html#masked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lm2sbzbr\"&gt;masked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Скрытый фрагмент: шлюз заменил опасный текст заглушкой перед отправкой — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8vztfw3s\"&gt;[EMAIL]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8pcq5q85\"&gt;[API KEY]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qc4pus72\"&gt;[CARD NUMBER]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-27tpznyr\"&gt;[PRIVATE KEY]&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1fhazzoz\"&gt;[SEED PHRASE]&lt;/code&gt;. Число замен видно в данных вызова (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zb3a6tbx\"&gt;masked={\"email\":1}&lt;/code&gt;) и в заголовке вставленного файла (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cxqjwy68\"&gt;masked email×1&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blocked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dcu7nkp1\"&gt;@blocked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rfo3nqgu\"&gt;@path&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blocked\"&gt;&lt;a href=\"ru/glossary.html#blocked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bws4x3nb\"&gt;@blocked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вызов остановлен проверкой на секреты: в тексте есть данные класса &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pq2bhax6\"&gt;prohibited&lt;/code&gt;. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qq03nq1w\"&gt;--plain&lt;/code&gt; вместо транспорта стоит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lyw90704\"&gt;blocked&lt;/code&gt;, а в комментарии вердикта — какой шаблон сработал. Если так блокируются все роли, прогон встаёт на паузу.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rej4fpsl\"&gt;gateway       implementer@blocked → fatal&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uvtzi2oc\"&gt;gateway fatal: gateway: prohibited content (api_key) — call blocked (THE-014)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-geldkne2\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-maskoverrides\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6br3tdf0\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-maskoverrides\"&gt;&lt;a href=\"ru/glossary.html#gateway-maskoverrides\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7fytzb2i\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Исключения для шаблонов секретов в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hqphwbm5\"&gt;policy.yaml&lt;/code&gt;. Для шаблона можно задать &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tkweii1r\"&gt;off&lt;/code&gt; (не проверять), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r0qz6haj\"&gt;restricted&lt;/code&gt; (скрывать, но не останавливать) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eacbbler\"&gt;prohibited&lt;/code&gt; (останавливать). Имена шаблонов: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f2yptta4\"&gt;pem_private_key&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4rl9utpc\"&gt;api_key&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9hwg69n8\"&gt;card_number&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-84hnta79\"&gt;seed_phrase&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nunmorjs\"&gt;email&lt;/code&gt;. Пригодится, если шаблон ошибается на ваших данных, например принимает длинные номера за номера карт.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4qgxiqca\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"sandbox-tier\"&gt;&lt;a href=\"ru/glossary.html#sandbox-tier\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;sandbox tier&lt;/span&gt;&lt;/a&gt;sandbox tier&lt;/h3&gt;\n&lt;p&gt;Уровень песочницы — сколько свободы у агентов на вашей машине. Параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h5b44k1s\"&gt;run.sandboxTier&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q7k9eqgs\"&gt;standard&lt;/code&gt; (по умолчанию) — агент пишет только в копии задачи, git делает Theia;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x357ynaz\"&gt;jailed-full&lt;/code&gt; — полный доступ внутри песочницы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mbhx9a7j\"&gt;theia jail&lt;/code&gt;; в 0.2.201 работает только на Linux;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-klo33l1t\"&gt;trusted-full&lt;/code&gt; — полный доступ ко всей машине без песочницы. Нужна строка транспорта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jrqk2fqv\"&gt;codex-full&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k3ppzjft\"&gt;registry.yaml&lt;/code&gt;, а Theia печатает громкое предупреждение.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В режимах &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i0ukxysm\"&gt;jailed-full&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v0zg3c0u\"&gt;trusted-full&lt;/code&gt; исполнители всегда работают через Codex.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6q9ceoi7\"&gt;!! sandboxTier trusted-full: implementer agents run with FULL HOST ACCESS, unjailed (manifest-recorded opt-in)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q1vtsfle\"&gt;jailed-full tier unavailable&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f9r6zl04\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zmdoq1c4\"&gt;jail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#posture\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-45w2lxqp\"&gt;posture&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j1gj8i9n\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"posture\"&gt;&lt;a href=\"ru/glossary.html#posture\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sfsorxtn\"&gt;posture&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим доступа (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nd70kysx\"&gt;posture&lt;/code&gt;) — рабочее слово Theia для выбранного набора настроек. Чаще всего так называют уровень песочницы: насколько агентам можно менять систему. Слово встречается в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vqy6lc04\"&gt;theia help&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yyi5jh64\"&gt;seeded posture&lt;/code&gt; у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l5lajv0n\"&gt;theia eval demo create&lt;/code&gt;) и в параметрах замеров платформы. Отдельного параметра с таким именем нет.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"jail\"&gt;&lt;a href=\"ru/glossary.html#jail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pl7nj7r8\"&gt;jail&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Песочница для команды: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g1oohe5c\"&gt;theia jail -- &amp;lt;команда&amp;gt;&lt;/code&gt; запускает команду так, что система доступна только на чтение, а писать можно лишь в разрешённые папки. На Linux песочница работает через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1qeusf7o\"&gt;bwrap&lt;/code&gt;; есть и вариант через контейнер (Docker или Podman). Встроенной песочницы для macOS в 0.2.201 нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e7x5pld0\"&gt;jail: unavailable — no sandbox backend on darwin yet (…); use standard or trusted-full&lt;/code&gt;, строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-md9393pa\"&gt;jail (none        )&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m6zks97s\"&gt;jail (container   )&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7qwc5dq\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;, &lt;a href=\"ru/reference/jail.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q2qm4k3s\"&gt;theia jail&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-resources\"&gt;&lt;a href=\"ru/glossary.html#run-resources\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v7wkft3y\"&gt;run.resources&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Лимиты памяти, процессора и числа процессов для команд и агентов прогона: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cyd1ca8i\"&gt;memoryMax&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qf5rs78m\"&gt;cpuQuota&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-karloc10\"&gt;tasksMax&lt;/code&gt;. Работают только на Linux через systemd. На другой системе прогон с такими лимитами не запустится.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qjqn5fcx\"&gt;resources        : unavailable (run.resources needs linux cgroups (systemd-run); platform is darwin) — …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t0k0u1o5\"&gt;jail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-install\"&gt;&lt;a href=\"ru/glossary.html#group-install\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка и обновление&lt;/span&gt;&lt;/a&gt;Установка и обновление&lt;/h2&gt;\n&lt;h3 id=\"pat\"&gt;&lt;a href=\"ru/glossary.html#pat\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PAT&lt;/span&gt;&lt;/a&gt;PAT&lt;/h3&gt;\n&lt;p&gt;Токен GitHub (PAT) — ключ доступа к закрытому репозиторию выпусков Theia. Нужен для &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-96krnjq8\"&gt;theia self update&lt;/code&gt;, скачивания версий через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-su40ost7\"&gt;--x-release&lt;/code&gt; и ежедневной проверки обновлений. Для обычной работы не нужен. Хранится в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hy8f7iyb\"&gt;config.yaml&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gajawofh\"&gt;github.pat&lt;/code&gt;). Переменная &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wkc3f5r4\"&gt;THEIA_GH_TOKEN&lt;/code&gt; важнее файла, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pxp91vw1\"&gt;GH_TOKEN&lt;/code&gt; Theia не читает. Значение токена Theia не печатает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h6ywlf0j\"&gt;github pat         : present&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-thii265g\"&gt;absent (release download/self update unavailable)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qa6zox5p\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yzxpstct\"&gt;self update: no GitHub PAT — theia setup --pat &amp;lt;token&amp;gt; (or THEIA_GH_TOKEN)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"ru/glossary.html#update-notice\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9yp0pv4o\"&gt;is available&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"channel\"&gt;&lt;a href=\"ru/glossary.html#channel\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;channel&lt;/span&gt;&lt;/a&gt;channel&lt;/h3&gt;\n&lt;p&gt;Канал обновлений — какие версии получает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xqu10rsb\"&gt;theia self update&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ugeqxwux\"&gt;release&lt;/code&gt; (по умолчанию) — обычные выпуски. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cwjkpzbo\"&gt;prerelease&lt;/code&gt; — ещё и тестовые сборки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2tyyfre7\"&gt;-pre.N&lt;/code&gt;, для разработчиков платформы. Канал задаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wcl24w7v\"&gt;theia setup --channel&lt;/code&gt;, а хранится он в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j6u1b2uq\"&gt;config.yaml&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5h15nwss\"&gt;update.channel&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tyew8szh\"&gt;prerelease channel (update.channel) — resolving against -pre builds too&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7w4a9idv\"&gt;already up to date (v0.2.201)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"vendor\"&gt;&lt;a href=\"ru/glossary.html#vendor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;vendor deliverables&lt;/span&gt;&lt;/a&gt;vendor deliverables&lt;/h3&gt;\n&lt;p&gt;Файлы поставки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b0uf09bl\"&gt;vendor&lt;/code&gt;) — набор файлов, который идёт вместе с Theia: промпты ролей (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j84sb51r\"&gt;prompts/kernel.yaml&lt;/code&gt;), правила и скиллы. В 0.2.201 работают только промпты, а правила и скиллы из поставки ничего не читает. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ddvhw259\"&gt;theia doctor&lt;/code&gt; сверяет файлы по отпечаткам, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xsn0864p\"&gt;theia self update&lt;/code&gt; обновляет их. Без этих файлов не работают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wy92mrhx\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zazh7m0e\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r0alzspr\"&gt;ask&lt;/code&gt; и другие команды с моделями.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ifdcetd5\"&gt;vendor deliverables: ok — 9ff60d108678 verified (21 files); matches this release&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lamorrd4\"&gt;theia: no vendor deliverables found (…)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jrshkcej\"&gt;doctor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"user-config\"&gt;&lt;a href=\"ru/glossary.html#user-config\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;user config&lt;/span&gt;&lt;/a&gt;user config&lt;/h3&gt;\n&lt;p&gt;Файл личных настроек &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-not546hc\"&gt;config.yaml&lt;/code&gt; в папке настроек пользователя: токен GitHub (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-371ksvl7\"&gt;github.pat&lt;/code&gt;), ключ OpenAI (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v7replyk\"&gt;openai.apiKey&lt;/code&gt;), канал обновлений (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pbldegrr\"&gt;update.channel&lt;/code&gt;) и путь для разработчиков (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nphwqdj1\"&gt;dev.root&lt;/code&gt;). Права 0600: читать файл может только владелец. Пишут его &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cscicvzk\"&gt;theia setup&lt;/code&gt; и мастер первой настройки; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ygsowwih\"&gt;theia setup&lt;/code&gt; удаляет ключи, которых не знает. Папка — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dfni5njz\"&gt;~/.config/theia&lt;/code&gt; на Linux. На macOS это &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ety5uagc\"&gt;~/Library/Application Support/theia&lt;/code&gt;; если такой папки нет, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2wu2gtrq\"&gt;~/.config/theia&lt;/code&gt; есть, Theia берёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-05fl8m0g\"&gt;~/.config/theia&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fuflwbn8\"&gt;user config        : present&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3tyc2u6\"&gt;absent (&amp;lt;путь&amp;gt; — theia setup)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jgqmcd2c\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xil3h2ih\"&gt;wrote github.pat to &amp;lt;путь&amp;gt; (mode 0600)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"ru/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"setup-wizard\"&gt;&lt;a href=\"ru/glossary.html#setup-wizard\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;setup wizard&lt;/span&gt;&lt;/a&gt;setup wizard&lt;/h3&gt;\n&lt;p&gt;Мастер первой настройки. Открывается вместо домашнего экрана, когда вы запускаете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pi5p27qn\"&gt;theia&lt;/code&gt; без команды в терминале, а личных настроек или хранилища ещё нет. Спрашивает токен GitHub и ключ OpenAI (можно пропустить), предлагает создать хранилище в текущей папке, выбрать движок и добавить другие корни. В отличие от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3w7p06fu\"&gt;theia init&lt;/code&gt;, мастер всегда создаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2usu7o5c\"&gt;.theia&lt;/code&gt; в текущей папке, даже в подпапке репозитория.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2p44z7qz\"&gt;theia setup — Enter accepts the default, empty answers skip.&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m578t8gg\"&gt;initialize a theia workspace in …? [Y/n]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zwewuhnf\"&gt;done — try: theia doctor, then theia run --task \"…\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"ru/install/first-setup.html\"&gt;Первая настройка&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"update-notice\"&gt;&lt;a href=\"ru/glossary.html#update-notice\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d6jyip19\"&gt;is available&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Серая строка о новой версии: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vay6e2vl\"&gt;theia v&amp;lt;новая&amp;gt; is available (running v&amp;lt;ваша&amp;gt;) — theia self update&lt;/code&gt;. Theia проверяет обновления не чаще раза в сутки, только с токеном GitHub и не дольше полутора секунд. При любой ошибке проверка молчит. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tlu00tek\"&gt;theia version&lt;/code&gt; проверку не запускает.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"x-release\"&gt;&lt;a href=\"ru/glossary.html#x-release\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xds494p1\"&gt;--x-release&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Глобальный флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6b3aym4c\"&gt;--x-release &amp;lt;версия&amp;gt;&lt;/code&gt; (или переменная &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cyrtm97j\"&gt;THEIA_X_RELEASE&lt;/code&gt;): выполнить команду другой версией Theia из кэша, при необходимости скачав её. Если версию получить нельзя, команда завершается ошибкой, а не работает текущей версией. Неверное значение &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tojmg89k\"&gt;THEIA_X_RELEASE&lt;/code&gt; ломает все команды, даже &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7kvlf2wr\"&gt;theia version&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;, &lt;a href=\"ru/reference/commands.html#global-flags\"&gt;Глобальные флаги&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dev\"&gt;&lt;a href=\"ru/glossary.html#dev\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-75k1udvd\"&gt;--dev&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Флаг для разработчиков платформы: запустить Theia из дерева исходников по пути после флага или из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3txln5jq\"&gt;dev.root&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gs8l3txd\"&gt;~/.config/theia/config.yaml&lt;/code&gt;. В установленной версии дерева исходников нет, поэтому флаг останавливает команду с кодом 1 и печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2j8dgf08\"&gt;--dev: no development root — pass a path (theia --dev &amp;lt;path&amp;gt; …) or set dev.root in ~/.config/theia/config.yaml (theia setup --dev-root &amp;lt;path&amp;gt;)&lt;/code&gt;. Справку он не печатает. С чужим путём ответ другой: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ls75vvvm\"&gt;--dev: &amp;lt;путь&amp;gt; does not look like a theia dev tree (missing apps/theia/src/main.ts)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#x-release\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q7m9cppv\"&gt;--x-release&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/install/update.html#for-developers\"&gt;Для разработчиков платформы&lt;/a&gt;, &lt;a href=\"ru/reference/commands.html#global-flags\"&gt;Глобальные флаги&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-integrations\"&gt;&lt;a href=\"ru/glossary.html#group-integrations\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интеграции&lt;/span&gt;&lt;/a&gt;Интеграции&lt;/h2&gt;\n&lt;h3 id=\"hooks\"&gt;&lt;a href=\"ru/glossary.html#hooks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;hooks&lt;/span&gt;&lt;/a&gt;hooks&lt;/h3&gt;\n&lt;p&gt;Хуки — короткие команды, которые Claude Code, Codex или git запускают сами при событиях. Их ставит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o66sadee\"&gt;theia hooks install&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ub4jhg8x\"&gt;claude&lt;/code&gt; — хуки начала сессии (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oyoplgst\"&gt;theia mem context&lt;/code&gt;), отправки сообщения (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s5r4yvob\"&gt;theia mem recall&lt;/code&gt;), сжатия контекста и остановки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mpv329vq\"&gt;theia mem checkpoint&lt;/code&gt;), строка статуса, MCP-сервер в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ev2t5pb\"&gt;.mcp.json&lt;/code&gt; и скилл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5j1guhi1\"&gt;/theia&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2sonezeo\"&gt;codex&lt;/code&gt; — те же хуки памяти в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fz37a050\"&gt;.codex/hooks.json&lt;/code&gt; и MCP-сервер;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pol99lbh\"&gt;git&lt;/code&gt; — хук после коммита, который ставит пометки для индекса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Команды удаления нет, хуки убирают вручную. Хуки запускают Theia по полному пути к установленной версии, поэтому после обновления они продолжают запускать старую версию.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jpioze65\"&gt;installed post-commit dirty-marks hook → …/.git/hooks/post-commit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mdcoc2o7\"&gt;statusline wired: theia index status --brief&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n317adg4\"&gt;mcp server registered: theia serve → …/.mcp.json (control tools included)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/glossary.html#skill\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-06wbvfot\"&gt;/theia&lt;/code&gt; skill&lt;/a&gt;, &lt;a href=\"ru/glossary.html#statusline\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k2t1gzg1\"&gt;statusLine&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dirty-marks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kzs5rp04\"&gt;dirty-marks&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rtzklw9c\"&gt;fail-open&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;, &lt;a href=\"ru/reference/hooks.html#hooks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-392rsgoo\"&gt;theia hooks&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"mcp\"&gt;&lt;a href=\"ru/glossary.html#mcp\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MCP&lt;/span&gt;&lt;/a&gt;MCP&lt;/h3&gt;\n&lt;p&gt;MCP (Model Context Protocol) — стандартный способ дать агенту инструменты. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k4e2jan8\"&gt;theia serve&lt;/code&gt; запускает MCP-сервер Theia через стандартный ввод-вывод. Инструменты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;карта кода: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2mdbg94t\"&gt;codebase_blueprint&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r25kmfhx\"&gt;codebase_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yc5yd9ja\"&gt;codebase_symbol&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;память: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4eraw8du\"&gt;memory_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ve8ijfbx\"&gt;memory_add&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kbpff2vt\"&gt;memory_tree&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;разбор прогонов: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xeewxh60\"&gt;run_audit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v6qfuwki\"&gt;run_diagnose&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;управление: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7jnow7wf\"&gt;run_list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nc58bp21\"&gt;run_status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wmkge6a4\"&gt;run_events&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pahwhxua\"&gt;run_wait&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y9d8kw0j\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zvqtqa59\"&gt;run_answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ru0z1r5d\"&gt;run_stop&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d8b949g4\"&gt;run_start&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jjbf9sv4\"&gt;run_probe&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-en61x9re\"&gt;plan_list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7epyuar3\"&gt;plan_show&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9zyadh1l\"&gt;plan_create&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gu38jigc\"&gt;plan_approve&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Codex получает сокращённый набор без инструментов управления. Инструменты &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4isul19v\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w8uuspl5\"&gt;run_answer&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-66cw0hdv\"&gt;run_stop&lt;/code&gt; не действуют на прогоны, запущенные заново, в том числе через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ralki3wk\"&gt;run_start&lt;/code&gt;: см. &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-44w413ty\"&gt;theia serve: MCP server on stdio (root …)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-07111pg2\"&gt;mcp server registered: theia serve → …/.mcp.json (control tools included)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#skill\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1aicln13\"&gt;/theia&lt;/code&gt; skill&lt;/a&gt;, &lt;a href=\"ru/glossary.html#metrics\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8aq3ht89\"&gt;/metrics&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/integrations/mcp-server.html\"&gt;MCP-сервер&lt;/a&gt;, &lt;a href=\"ru/reference/serve.html#serve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nxd070pu\"&gt;theia serve&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"skill\"&gt;&lt;a href=\"ru/glossary.html#skill\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;skill&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rl7whesa\"&gt;/theia&lt;/code&gt;skill&lt;/h3&gt;\n&lt;p&gt;Скилл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vsjrq9b6\"&gt;/theia&lt;/code&gt; — инструкция для Claude Code, как вести работу через Theia: план, одобрение человеком, запуск, наблюдение, ответы на вопросы. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7p23zwpo\"&gt;theia hooks install claude&lt;/code&gt; кладёт его в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vl2rjdk1\"&gt;.claude/skills/theia/SKILL.md&lt;/code&gt;. Сам скилл ничего не выполняет, он опирается на инструменты MCP Theia. Для Codex скилл не ставится. Шаги скилла с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xb2j5sz1\"&gt;run_msg&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-apicre9g\"&gt;run_stop&lt;/code&gt; в 0.2.201 не действуют на прогоны от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xqtvta6f\"&gt;run_start&lt;/code&gt;. Не путайте этот скилл со скиллами в файлах поставки.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8n2btdiy\"&gt;/theia skill installed → …/.claude/skills/theia/SKILL.md&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"statusline\"&gt;&lt;a href=\"ru/glossary.html#statusline\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0e6z3yr3\"&gt;statusLine&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка статуса внизу Claude Code. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-toxb9hcp\"&gt;theia hooks install claude&lt;/code&gt; подключает в неё команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qq92fs5a\"&gt;theia index status --brief&lt;/code&gt;, если строки статуса у вас ещё нет. Там видна свежесть индекса, а также число открытых прогонов и ждущих вопросов.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eqy9pmv6\"&gt;theia: 0 indexed · 1 missing · 1 live&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1etnnvkd\"&gt;statusline: existing statusLine preserved (not overwritten)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nxodht8k\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kv5zn48k\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gate-1\"&gt;&lt;a href=\"ru/glossary.html#gate-1\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jp4qp3m7\"&gt;gate 1&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Первое условие Codex: проект должен быть доверенным (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f0zbuv8b\"&gt;project trust&lt;/code&gt;). Пока это не так, Codex не видит ни хуки, ни MCP-сервер из папки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7dgkalq\"&gt;.codex/&lt;/code&gt;. Условие выполняется, если один раз запустить &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gsvx2vwf\"&gt;codex&lt;/code&gt; в этой папке и принять запрос доверия или выполнить &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s6xy7524\"&gt;theia hooks install codex --trust&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oliazizy\"&gt;project NOT trusted (gate 1)&lt;/code&gt; в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-psnt0itr\"&gt;codex hooks&lt;/code&gt; у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oubc6eef\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ts65xqh\"&gt;gate 1 (project trust): NOT SATISFIED — …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gate-2\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8cipzfhm\"&gt;gate 2&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#codex-hooks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qc1zwqz9\"&gt;codex hooks&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gate-2\"&gt;&lt;a href=\"ru/glossary.html#gate-2\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5oxup5hv\"&gt;gate 2&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Второе условие Codex: новые и изменённые хуки нужно проверить и одобрить (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8j76ymb\"&gt;hook trust&lt;/code&gt;). До этого Codex их пропускает. Одобрить можно командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fugsvnvp\"&gt;/hooks&lt;/code&gt; в интерактивной сессии Codex в этой папке.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-maf0ys6q\"&gt;gate 2 (hook trust): new/changed hooks are review-gated per hash and SKIPPED until trusted —&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bk29pulp\"&gt;theia hooks install codex&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gate-1\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g2rgqrg8\"&gt;gate 1&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"metrics\"&gt;&lt;a href=\"ru/glossary.html#metrics\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ze1qon06\"&gt;/metrics&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Страница метрик в формате Prometheus: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9jaorj5k\"&gt;theia serve --metrics &amp;lt;порт&amp;gt;&lt;/code&gt;. Она показывает счётчики только самого процесса &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-emex8zq3\"&gt;theia serve&lt;/code&gt;. Порт открыт на всех сетевых интерфейсах.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wmmxcy02\"&gt;theia serve: /metrics on :&amp;lt;порт&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/integrations/observability.html\"&gt;Метрики и трассировка&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-tui\"&gt;&lt;a href=\"ru/glossary.html#group-tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экран TUI&lt;/span&gt;&lt;/a&gt;Экран TUI&lt;/h2&gt;\n&lt;h3 id=\"tui\"&gt;&lt;a href=\"ru/glossary.html#tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TUI&lt;/span&gt;&lt;/a&gt;TUI&lt;/h3&gt;\n&lt;p&gt;Экранный интерфейс (TUI) — полноэкранный режим &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qdgk3d83\"&gt;theia run&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0yxo4rwe\"&gt;theia show --tui&lt;/code&gt;. В терминале это вид по умолчанию. Экран показывает дерево прогона, детали шагов, живую активность и подсказки клавиш. Если терминала нет или задан &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fkppdkjz\"&gt;--non-interactive&lt;/code&gt;, Theia переходит на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t6wovfnv\"&gt;--plain&lt;/code&gt; и пишет почему. Клавиши «отключиться и оставить прогон работать» нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-49fvu6yv\"&gt;view: --tui needs an interactive terminal (a TTY for output and keys) — degrading to --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eksk1pui\"&gt;view: --tui is interactive; --non-interactive degrades to --plain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;, &lt;a href=\"ru/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;, &lt;a href=\"ru/glossary.html#board\"&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9k3e0msw\"&gt;--cli&lt;/code&gt;)&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tgpbnhhn\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;, &lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"home-screen\"&gt;&lt;a href=\"ru/glossary.html#home-screen\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;home screen&lt;/span&gt;&lt;/a&gt;home screen&lt;/h3&gt;\n&lt;p&gt;Домашний экран — то, что открывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wf7kfomw\"&gt;theia&lt;/code&gt; без команды в терминале, когда личные настройки и хранилище уже есть. На нём только проблемные строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1pwabm51\"&gt;theia doctor&lt;/code&gt;, строка свежести индекса, до пяти последних прогонов с итогом и ценой и поле задачи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a8p1gjpe\"&gt;task ▸&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 запуск задачи из поля &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kt26ah1b\"&gt;task ▸&lt;/code&gt; не работает: прогон падает с ошибкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6v3sdv1a\"&gt;kernel: no vendored prompts …&lt;/code&gt; и остаётся открытым (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-78v1f7x9\"&gt;⣽ … in flight&lt;/code&gt;). Запускайте задачи командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cvdqlv8t\"&gt;theia run --task \"…\"&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s1y3t0cs\"&gt;recent runs:&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v62zty5y\"&gt;✖ run2akdqctmhw222mff47z2qh  abandoned  $0.0000&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6retfnvr\"&gt;task ▸ ▏&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eq6e2v0b\"&gt;Enter run · ? help · q quit&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5oiuugw5\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-tree\"&gt;&lt;a href=\"ru/glossary.html#run-tree\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run tree&lt;/span&gt;&lt;/a&gt;run tree&lt;/h3&gt;\n&lt;p&gt;Дерево прогона — главная часть TUI. Задачи — строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dg7xf8a1\"&gt;tsk…x [fast_path]&lt;/code&gt;, справа фаза, раунды, цена и время. Внутри задачи: её текст, копия &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u46537wj\"&gt;workspace @ &amp;lt;sha&amp;gt; (copy)&lt;/code&gt;, раунды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w91r810x\"&gt;r1 implement  implementer → ready&lt;/code&gt;, а под раундом — вызовы модели (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ylh7i6an\"&gt;· gateway …&lt;/code&gt;), инструменты и доказательства. На верхнем уровне — аномалии &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qz5lwfes\"&gt;‼&lt;/code&gt;, ваши указания &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7le3iv9w\"&gt;»&lt;/code&gt; и служебные заметки. Успешные задачи сворачиваются, проблемные раскрываются сами.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"ru/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rloiyatn\"&gt;detail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#keybar\"&gt;keybar&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"board\"&gt;&lt;a href=\"ru/glossary.html#board\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;board ()&lt;/span&gt;&lt;/a&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wdteq1ez\"&gt;--cli&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Табло (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-chycluef\"&gt;--cli&lt;/code&gt;) — компактный вид прогона, который перерисовывается на месте. Первая строка: прогон, деньги, вызовы и события. Дальше по строке на задачу: трек, фаза, раунды и последний вердикт. Внизу — состояние: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ajnw5mb5\"&gt;running&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6e6ib7hz\"&gt;halted: …&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dgwynpxc\"&gt;stopping — finishing in-flight verdicts…&lt;/code&gt;. Табло нужен терминал; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-im87vufy\"&gt;theia show &amp;lt;runId&amp;gt; --cli&lt;/code&gt; печатает последний кадр.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dk1rji7x\"&gt;run …wvesbyig  $0.0000/$10.00 · 4 calls · 22 events&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tdxm94aw\"&gt;tsk…xk6rzynf  fast_path  discarded   r6  lead→lead_discard “…”&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qxgppet5\"&gt;— halted: completed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dbag8axc\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#tui\"&gt;TUI&lt;/a&gt;, &lt;a href=\"ru/glossary.html#summary\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tccgbv15\"&gt;summary&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"plain\"&gt;&lt;a href=\"ru/glossary.html#plain\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g4996bks\"&gt;--plain&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Простой вид: по строке на событие журнала, без перерисовки. Подходит для скриптов, CI и файлов. Строки показывают имена событий Theia, а не слова модели: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gxggmqj4\"&gt;verify_pass&lt;/code&gt;, а не &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-awj0fb73\"&gt;pass&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5uiqy2my\"&gt;arb_escalate&lt;/code&gt;, а не &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v220u75f\"&gt;escalate&lt;/code&gt;. Строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3b6p70km\"&gt;live&lt;/code&gt; — только подсказки, в журнал они не пишутся.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hm0fhukg\"&gt;theia run … --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hb5xb7az\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ldqa25fz\"&gt;view: --cli needs a TTY — degrading to --plain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verdict\"&gt;verdict&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xmwn0xuv\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#board\"&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oo8qc6hi\"&gt;--cli&lt;/code&gt;)&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"summary\"&gt;&lt;a href=\"ru/glossary.html#summary\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m1jai8is\"&gt;summary&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Итог прогона: исход каждой задачи, строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6hqlopbr\"&gt;halted:&lt;/code&gt; с числом вызовов и ценой и проверка журнала. Его печатают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cqdp0bo5\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt; без флагов и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5po3i60b\"&gt;theia run&lt;/code&gt; в конце работы.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xxfhp9vq\"&gt;tsk2akdqb2ilc225pxk6rzynf → discarded (6 rounds) …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vs4y9jmc\"&gt;halted: completed · 4 gateway calls · $0.0000&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2a7tdqtd\"&gt;audit chain: intact&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nflsienm\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z4e81fot\"&gt;--plain&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"glyphs\"&gt;&lt;a href=\"ru/glossary.html#glyphs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/span&gt;&lt;/a&gt;✔ ✖ ◆ ◌ ‼ »&lt;/h3&gt;\n&lt;p&gt;Значки TUI:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l6c8w45k\"&gt;✔&lt;/code&gt; — хорошо: у задачи итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uz6tueb4\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-icqkz5ox\"&gt;planned&lt;/code&gt;, у раунда вердикт не из списка плохих, у прогона — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eac22bcr\"&gt;completed&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dtp7lugs\"&gt;✖&lt;/code&gt; — плохо: задача отброшена; раунд с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-exgziuui\"&gt;discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e14onap0\"&gt;merge_fail&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h5cevlxc\"&gt;verify_fail&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2pbjgogw\"&gt;cant_do&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n3chkcbu\"&gt;algedonic&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g1dn4i5x\"&gt;no_progress&lt;/code&gt;; прогон остановлен (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-52oaercy\"&gt;stopped (…)&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mwmfke32\"&gt;◆&lt;/code&gt; — застряло: задача &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jdv8i6aq\"&gt;escalated&lt;/code&gt; или вопрос без ответа; на домашнем экране — прогон на паузе;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q24h73wt\"&gt;⣷ ⣯ ⣟ …&lt;/code&gt; (или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tm0gzxoy\"&gt;●&lt;/code&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yjetnjhj\"&gt;--no-spinner&lt;/code&gt;) — идёт работа, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1svt2r0g\"&gt;◌&lt;/code&gt; — ждёт;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6q3gn9wl\"&gt;‼&lt;/code&gt; — аномалия, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-07rj6der\"&gt;»&lt;/code&gt; — ваше указание, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n9ehd315\"&gt;·&lt;/code&gt; — текст задачи или доказательство, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bqn7sa00\"&gt;▼&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aa44cti1\"&gt;▶&lt;/code&gt; — раскрыто и свёрнуто, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hp1toc6w\"&gt;‖&lt;/code&gt; — пауза или остановка, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7dmh2k5s\"&gt;❯&lt;/code&gt; — курсор, когда цвета выключены.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Зелёная галочка значит «не плохое событие», а не «хороший итог». Раунды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lxyeo1b1\"&gt;lead → lead_discard&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pjvw1oa2\"&gt;arbiter → arb_escalate&lt;/code&gt; тоже отмечены &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z67l0rrl\"&gt;✔&lt;/code&gt;, а прогон, где все задачи отброшены, помечен &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tmrsgbtm\"&gt;✔ completed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;, &lt;a href=\"ru/glossary.html#completed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9qsy9l7s\"&gt;completed&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#frozen\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wud0zo0h\"&gt;frozen&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#failed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u19k7lzk\"&gt;failed&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"running\"&gt;&lt;a href=\"ru/glossary.html#running\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qxyobpv3\"&gt;running&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Прогон или задача сейчас работает. В заголовке TUI — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9mnjjt4o\"&gt;running&lt;/code&gt;, в счётчике задач — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-61u3s3ph\"&gt;N running&lt;/code&gt;, на табло — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rbnkdd1y\"&gt;— running&lt;/code&gt;. Прогон, убитый без паузы, в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iehv2nc3\"&gt;theia show --tui&lt;/code&gt; тоже выглядит как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g1avaqee\"&gt;running&lt;/code&gt;, пока его не продолжат или не закроют.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n1y00nrl\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2cf0y
