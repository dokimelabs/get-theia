;/p&gt;\n&lt;h3 id=\"posture\"&gt;&lt;a href=\"ru/glossary.html#posture\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9n161ybs\"&gt;posture&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим доступа (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8tx7w1y5\"&gt;posture&lt;/code&gt;) — рабочее слово Theia для выбранного набора настроек. Чаще всего так называют уровень песочницы: насколько агентам можно менять систему. Слово встречается в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7cll17lq\"&gt;theia help&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lvmu7ye5\"&gt;seeded posture&lt;/code&gt; у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iok3qbvc\"&gt;theia eval demo create&lt;/code&gt;) и в параметрах замеров платформы. Отдельного параметра с таким именем нет.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"jail\"&gt;&lt;a href=\"ru/glossary.html#jail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cvtwg4r7\"&gt;jail&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Песочница для команды: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2mmka29o\"&gt;theia jail -- &amp;lt;команда&amp;gt;&lt;/code&gt; запускает команду так, что система доступна только на чтение, а писать можно лишь в разрешённые папки. На Linux песочница работает через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tytq2lio\"&gt;bwrap&lt;/code&gt;; есть и вариант через контейнер (Docker или Podman). Встроенной песочницы для macOS в 0.2.201 нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4qn50h13\"&gt;jail: unavailable — no sandbox backend on darwin yet (…); use standard or trusted-full&lt;/code&gt;, строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-adruwjet\"&gt;jail (none        )&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bgsctu05\"&gt;jail (container   )&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iv9o8a8h\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;, &lt;a href=\"ru/reference/jail.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ft36zfko\"&gt;theia jail&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-resources\"&gt;&lt;a href=\"ru/glossary.html#run-resources\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zc5rk9f5\"&gt;run.resources&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Лимиты памяти, процессора и числа процессов для команд и агентов прогона: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gifxifs1\"&gt;memoryMax&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xkmr60th\"&gt;cpuQuota&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3cw782u9\"&gt;tasksMax&lt;/code&gt;. Работают только на Linux через systemd. На другой системе прогон с такими лимитами не запустится.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wbd75c9j\"&gt;resources        : unavailable (run.resources needs linux cgroups (systemd-run); platform is darwin) — …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b6l57z4t\"&gt;jail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-install\"&gt;&lt;a href=\"ru/glossary.html#group-install\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка и обновление&lt;/span&gt;&lt;/a&gt;Установка и обновление&lt;/h2&gt;\n&lt;h3 id=\"pat\"&gt;&lt;a href=\"ru/glossary.html#pat\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PAT&lt;/span&gt;&lt;/a&gt;PAT&lt;/h3&gt;\n&lt;p&gt;Токен GitHub (PAT) — ключ доступа к закрытому репозиторию выпусков Theia. Нужен для &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r4x4h3wb\"&gt;theia self update&lt;/code&gt;, скачивания версий через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oj7s8xi3\"&gt;--x-release&lt;/code&gt; и ежедневной проверки обновлений. Для обычной работы не нужен. Хранится в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-reu6mha6\"&gt;config.yaml&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wm9bk198\"&gt;github.pat&lt;/code&gt;). Переменная &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w2q9ngx6\"&gt;THEIA_GH_TOKEN&lt;/code&gt; важнее файла, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6zshou8z\"&gt;GH_TOKEN&lt;/code&gt; Theia не читает. Значение токена Theia не печатает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hsnc6r0u\"&gt;github pat         : present&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-siq0w7k5\"&gt;absent (release download/self update unavailable)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8pcpy0rh\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vu6vu4lg\"&gt;self update: no GitHub PAT — theia setup --pat &amp;lt;token&amp;gt; (or THEIA_GH_TOKEN)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"ru/glossary.html#update-notice\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yodem32d\"&gt;is available&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"channel\"&gt;&lt;a href=\"ru/glossary.html#channel\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;channel&lt;/span&gt;&lt;/a&gt;channel&lt;/h3&gt;\n&lt;p&gt;Канал обновлений — какие версии получает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xknrj0qa\"&gt;theia self update&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4wyoinsh\"&gt;release&lt;/code&gt; (по умолчанию) — обычные выпуски. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ig42pjy\"&gt;prerelease&lt;/code&gt; — ещё и тестовые сборки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mg2o3lgi\"&gt;-pre.N&lt;/code&gt;, для разработчиков платформы. Канал задаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i7e31iep\"&gt;theia setup --channel&lt;/code&gt;, а хранится он в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5vbrjn4r\"&gt;config.yaml&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-635unpvi\"&gt;update.channel&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t9c4nnt3\"&gt;prerelease channel (update.channel) — resolving against -pre builds too&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ypp3q8a3\"&gt;already up to date (v0.2.201)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"vendor\"&gt;&lt;a href=\"ru/glossary.html#vendor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;vendor deliverables&lt;/span&gt;&lt;/a&gt;vendor deliverables&lt;/h3&gt;\n&lt;p&gt;Файлы поставки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xcju1e7o\"&gt;vendor&lt;/code&gt;) — набор файлов, который идёт вместе с Theia: промпты ролей (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-djmthges\"&gt;prompts/kernel.yaml&lt;/code&gt;), правила и скиллы. В 0.2.201 работают только промпты, а правила и скиллы из поставки ничего не читает. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1yzp2mpu\"&gt;theia doctor&lt;/code&gt; сверяет файлы по отпечаткам, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d0oix9zr\"&gt;theia self update&lt;/code&gt; обновляет их. Без этих файлов не работают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-98ylbaa6\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f43qf9qj\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xv7vc4wn\"&gt;ask&lt;/code&gt; и другие команды с моделями.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jjhab6f4\"&gt;vendor deliverables: ok — 9ff60d108678 verified (21 files); matches this release&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nx338i7t\"&gt;theia: no vendor deliverables found (…)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z947oara\"&gt;doctor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"user-config\"&gt;&lt;a href=\"ru/glossary.html#user-config\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;user config&lt;/span&gt;&lt;/a&gt;user config&lt;/h3&gt;\n&lt;p&gt;Файл личных настроек &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ot9xpai7\"&gt;config.yaml&lt;/code&gt; в папке настроек пользователя: токен GitHub (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eaotove2\"&gt;github.pat&lt;/code&gt;), ключ OpenAI (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vhetxvy6\"&gt;openai.apiKey&lt;/code&gt;), канал обновлений (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4pi83cyy\"&gt;update.channel&lt;/code&gt;) и путь для разработчиков (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t8iebnuo\"&gt;dev.root&lt;/code&gt;). Права 0600: читать файл может только владелец. Пишут его &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e99acpof\"&gt;theia setup&lt;/code&gt; и мастер первой настройки; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wghn9wac\"&gt;theia setup&lt;/code&gt; удаляет ключи, которых не знает. Папка — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0wgt5uik\"&gt;~/.config/theia&lt;/code&gt; на Linux. На macOS это &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pfm41mng\"&gt;~/Library/Application Support/theia&lt;/code&gt;; если такой папки нет, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a6orle27\"&gt;~/.config/theia&lt;/code&gt; есть, Theia берёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mo7hqx0f\"&gt;~/.config/theia&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1p9hj2li\"&gt;user config        : present&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mmn4sovx\"&gt;absent (&amp;lt;путь&amp;gt; — theia setup)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rclwx0bm\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ud4hsk8t\"&gt;wrote github.pat to &amp;lt;путь&amp;gt; (mode 0600)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"ru/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"setup-wizard\"&gt;&lt;a href=\"ru/glossary.html#setup-wizard\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;setup wizard&lt;/span&gt;&lt;/a&gt;setup wizard&lt;/h3&gt;\n&lt;p&gt;Мастер первой настройки. Открывается вместо домашнего экрана, когда вы запускаете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a6osvfi7\"&gt;theia&lt;/code&gt; без команды в терминале, а личных настроек или хранилища ещё нет. Спрашивает токен GitHub и ключ OpenAI (можно пропустить), предлагает создать хранилище в текущей папке, выбрать движок и добавить другие корни. В отличие от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cwwnpyz7\"&gt;theia init&lt;/code&gt;, мастер всегда создаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9jw5qoue\"&gt;.theia&lt;/code&gt; в текущей папке, даже в подпапке репозитория.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mgxzk9cz\"&gt;theia setup — Enter accepts the default, empty answers skip.&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zzvm904q\"&gt;initialize a theia workspace in …? [Y/n]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f3nsajxa\"&gt;done — try: theia doctor, then theia run --task \"…\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"ru/install/first-setup.html\"&gt;Первая настройка&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"update-notice\"&gt;&lt;a href=\"ru/glossary.html#update-notice\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lmbipaos\"&gt;is available&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Серая строка о новой версии: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a7rgwybt\"&gt;theia v&amp;lt;новая&amp;gt; is available (running v&amp;lt;ваша&amp;gt;) — theia self update&lt;/code&gt;. Theia проверяет обновления не чаще раза в сутки, только с токеном GitHub и не дольше полутора секунд. При любой ошибке проверка молчит. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1qwi4bfl\"&gt;theia version&lt;/code&gt; проверку не запускает.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"x-release\"&gt;&lt;a href=\"ru/glossary.html#x-release\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sbk6mqdu\"&gt;--x-release&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Глобальный флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e86g6wqj\"&gt;--x-release &amp;lt;версия&amp;gt;&lt;/code&gt; (или переменная &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h6q6s1n3\"&gt;THEIA_X_RELEASE&lt;/code&gt;): выполнить команду другой версией Theia из кэша, при необходимости скачав её. Если версию получить нельзя, команда завершается ошибкой, а не работает текущей версией. Неверное значение &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l2472hf1\"&gt;THEIA_X_RELEASE&lt;/code&gt; ломает все команды, даже &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mzay5jbc\"&gt;theia version&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;, &lt;a href=\"ru/reference/commands.html#global-flags\"&gt;Глобальные флаги&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dev\"&gt;&lt;a href=\"ru/glossary.html#dev\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7apk0izn\"&gt;--dev&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Флаг для разработчиков платформы: запустить Theia из исходников. В выпуске 0.2.201 он не работает: печатает справку и завершается с кодом 1.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#x-release\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ey7rx6dm\"&gt;--x-release&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-integrations\"&gt;&lt;a href=\"ru/glossary.html#group-integrations\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интеграции&lt;/span&gt;&lt;/a&gt;Интеграции&lt;/h2&gt;\n&lt;h3 id=\"hooks\"&gt;&lt;a href=\"ru/glossary.html#hooks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;hooks&lt;/span&gt;&lt;/a&gt;hooks&lt;/h3&gt;\n&lt;p&gt;Хуки — короткие команды, которые Claude Code, Codex или git запускают сами при событиях. Их ставит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wyg87jba\"&gt;theia hooks install&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-idqyarh9\"&gt;claude&lt;/code&gt; — хуки начала сессии (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ma02wh0y\"&gt;theia mem context&lt;/code&gt;), отправки сообщения (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v7to2r6m\"&gt;theia mem recall&lt;/code&gt;), сжатия контекста и остановки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9o4xor56\"&gt;theia mem checkpoint&lt;/code&gt;), строка статуса, MCP-сервер в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wk26bzmh\"&gt;.mcp.json&lt;/code&gt; и скилл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a7g7waoh\"&gt;/theia&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eoaakduq\"&gt;codex&lt;/code&gt; — те же хуки памяти в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lfbtm7f1\"&gt;.codex/hooks.json&lt;/code&gt; и MCP-сервер;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oml6mj3b\"&gt;git&lt;/code&gt; — хук после коммита, который ставит пометки для индекса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Команды удаления нет, хуки убирают вручную. Хуки запускают Theia по полному пути к установленной версии, поэтому после обновления они продолжают запускать старую версию.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gitnq0cs\"&gt;installed post-commit dirty-marks hook → …/.git/hooks/post-commit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xig2jcs5\"&gt;statusline wired: theia index status --brief&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fp17be93\"&gt;mcp server registered: theia serve → …/.mcp.json (control tools included)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/glossary.html#skill\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ff4gfapj\"&gt;/theia&lt;/code&gt; skill&lt;/a&gt;, &lt;a href=\"ru/glossary.html#statusline\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eeu19u27\"&gt;statusLine&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dirty-marks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-knaumh4q\"&gt;dirty-marks&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ivgs56w\"&gt;fail-open&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;, &lt;a href=\"ru/reference/hooks.html#hooks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s9adgvu4\"&gt;theia hooks&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"mcp\"&gt;&lt;a href=\"ru/glossary.html#mcp\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MCP&lt;/span&gt;&lt;/a&gt;MCP&lt;/h3&gt;\n&lt;p&gt;MCP (Model Context Protocol) — стандартный способ дать агенту инструменты. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m5b0ifok\"&gt;theia serve&lt;/code&gt; запускает MCP-сервер Theia через стандартный ввод-вывод. Инструменты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;карта кода: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vdsay5t8\"&gt;codebase_blueprint&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yuxaatz1\"&gt;codebase_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n9big0gd\"&gt;codebase_symbol&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;память: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xl00dkuj\"&gt;memory_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sdlazp9e\"&gt;memory_add&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tug0jbby\"&gt;memory_tree&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;разбор прогонов: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eu8csjz5\"&gt;run_audit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y2ucdg2o\"&gt;run_diagnose&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;управление: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3lqdqhxa\"&gt;run_list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yixeg2vn\"&gt;run_status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xt4txwiq\"&gt;run_events&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xfnesheu\"&gt;run_wait&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g4pdbhxd\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-saowbfyh\"&gt;run_answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rpt0tjen\"&gt;run_stop&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-adxwysc7\"&gt;run_start&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-980tqf7b\"&gt;run_probe&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rtswxala\"&gt;plan_list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w55qj0sq\"&gt;plan_show&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zcw1l8on\"&gt;plan_create&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f1sn1ry5\"&gt;plan_approve&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Codex получает сокращённый набор без инструментов управления. Инструменты &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ny46h2m\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w4ic7wbz\"&gt;run_answer&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o43es9ng\"&gt;run_stop&lt;/code&gt; не действуют на прогоны, запущенные заново, в том числе через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wpey6x6k\"&gt;run_start&lt;/code&gt;: см. &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8yrhkxp\"&gt;theia serve: MCP server on stdio (root …)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-evasxi70\"&gt;mcp server registered: theia serve → …/.mcp.json (control tools included)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#skill\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-apdf3lik\"&gt;/theia&lt;/code&gt; skill&lt;/a&gt;, &lt;a href=\"ru/glossary.html#metrics\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bjbl6iyz\"&gt;/metrics&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/integrations/mcp-server.html\"&gt;MCP-сервер&lt;/a&gt;, &lt;a href=\"ru/reference/serve.html#serve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r2a6pl7k\"&gt;theia serve&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"skill\"&gt;&lt;a href=\"ru/glossary.html#skill\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;skill&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-413qm3s2\"&gt;/theia&lt;/code&gt;skill&lt;/h3&gt;\n&lt;p&gt;Скилл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8m02ijln\"&gt;/theia&lt;/code&gt; — инструкция для Claude Code, как вести работу через Theia: план, одобрение человеком, запуск, наблюдение, ответы на вопросы. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-65og1j9v\"&gt;theia hooks install claude&lt;/code&gt; кладёт его в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-no3mosux\"&gt;.claude/skills/theia/SKILL.md&lt;/code&gt;. Сам скилл ничего не выполняет, он опирается на инструменты MCP Theia. Для Codex скилл не ставится. Шаги скилла с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y70831ww\"&gt;run_msg&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ehcmbjyy\"&gt;run_stop&lt;/code&gt; в 0.2.201 не действуют на прогоны от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-br5oao66\"&gt;run_start&lt;/code&gt;. Не путайте этот скилл со скиллами в файлах поставки.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y0nyvrh6\"&gt;/theia skill installed → …/.claude/skills/theia/SKILL.md&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"statusline\"&gt;&lt;a href=\"ru/glossary.html#statusline\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2hdw758o\"&gt;statusLine&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка статуса внизу Claude Code. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hxxb3bdy\"&gt;theia hooks install claude&lt;/code&gt; подключает в неё команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c2dszwru\"&gt;theia index status --brief&lt;/code&gt;, если строки статуса у вас ещё нет. Там видна свежесть индекса, а также число открытых прогонов и ждущих вопросов.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p4dpvn81\"&gt;theia: 0 indexed · 1 missing · 1 live&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1jk1e70k\"&gt;statusline: existing statusLine preserved (not overwritten)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6w55mief\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y71q7qah\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gate-1\"&gt;&lt;a href=\"ru/glossary.html#gate-1\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l1xdjvfp\"&gt;gate 1&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Первое условие Codex: проект должен быть доверенным (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q52nronl\"&gt;project trust&lt;/code&gt;). Пока это не так, Codex не видит ни хуки, ни MCP-сервер из папки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2kjgx1t7\"&gt;.codex/&lt;/code&gt;. Условие выполняется, если один раз запустить &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kdirusqi\"&gt;codex&lt;/code&gt; в этой папке и принять запрос доверия или выполнить &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3wr49gs5\"&gt;theia hooks install codex --trust&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ngycxgu3\"&gt;project NOT trusted (gate 1)&lt;/code&gt; в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nna75t7g\"&gt;codex hooks&lt;/code&gt; у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ln4rlj2l\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3vvfhmfv\"&gt;gate 1 (project trust): NOT SATISFIED — …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gate-2\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vqlgfyb3\"&gt;gate 2&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#codex-hooks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2wpzv0w8\"&gt;codex hooks&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gate-2\"&gt;&lt;a href=\"ru/glossary.html#gate-2\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bd83wlqs\"&gt;gate 2&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Второе условие Codex: новые и изменённые хуки нужно проверить и одобрить (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5k5z9lgo\"&gt;hook trust&lt;/code&gt;). До этого Codex их пропускает. Одобрить можно командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x4xdghke\"&gt;/hooks&lt;/code&gt; в интерактивной сессии Codex в этой папке.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pzaku4bk\"&gt;gate 2 (hook trust): new/changed hooks are review-gated per hash and SKIPPED until trusted —&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xg3of3ii\"&gt;theia hooks install codex&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gate-1\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zmnptvzx\"&gt;gate 1&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"metrics\"&gt;&lt;a href=\"ru/glossary.html#metrics\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9iq81gzg\"&gt;/metrics&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Страница метрик в формате Prometheus: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hv32yujg\"&gt;theia serve --metrics &amp;lt;порт&amp;gt;&lt;/code&gt;. Она показывает счётчики только самого процесса &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-opcgap0s\"&gt;theia serve&lt;/code&gt;. Порт открыт на всех сетевых интерфейсах.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tdov98wf\"&gt;theia serve: /metrics on :&amp;lt;порт&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/integrations/observability.html\"&gt;Метрики и трассировка&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-tui\"&gt;&lt;a href=\"ru/glossary.html#group-tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экран TUI&lt;/span&gt;&lt;/a&gt;Экран TUI&lt;/h2&gt;\n&lt;h3 id=\"tui\"&gt;&lt;a href=\"ru/glossary.html#tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TUI&lt;/span&gt;&lt;/a&gt;TUI&lt;/h3&gt;\n&lt;p&gt;Экранный интерфейс (TUI) — полноэкранный режим &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fbv3ael8\"&gt;theia run&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmitl4pd\"&gt;theia show --tui&lt;/code&gt;. В терминале это вид по умолчанию. Экран показывает дерево прогона, детали шагов, живую активность и подсказки клавиш. Если терминала нет или задан &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w1oos297\"&gt;--non-interactive&lt;/code&gt;, Theia переходит на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0i8wcudy\"&gt;--plain&lt;/code&gt; и пишет почему. Клавиши «отключиться и оставить прогон работать» нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xtwz9xei\"&gt;view: --tui needs an interactive terminal (a TTY for output and keys) — degrading to --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tg8zf96v\"&gt;view: --tui is interactive; --non-interactive degrades to --plain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;, &lt;a href=\"ru/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;, &lt;a href=\"ru/glossary.html#board\"&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vmi9qmkg\"&gt;--cli&lt;/code&gt;)&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aefh7ivj\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;, &lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"home-screen\"&gt;&lt;a href=\"ru/glossary.html#home-screen\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;home screen&lt;/span&gt;&lt;/a&gt;home screen&lt;/h3&gt;\n&lt;p&gt;Домашний экран — то, что открывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b383xu8o\"&gt;theia&lt;/code&gt; без команды в терминале, когда личные настройки и хранилище уже есть. На нём только проблемные строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c4qq28p9\"&gt;theia doctor&lt;/code&gt;, строка свежести индекса, до пяти последних прогонов с итогом и ценой и поле задачи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ostsao3\"&gt;task ▸&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 запуск задачи из поля &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3tfirrxv\"&gt;task ▸&lt;/code&gt; не работает: прогон падает с ошибкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qc3x6fl7\"&gt;kernel: no vendored prompts …&lt;/code&gt; и остаётся открытым (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mqcebi7j\"&gt;⣽ … in flight&lt;/code&gt;). Запускайте задачи командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-773n07p0\"&gt;theia run --task \"…\"&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dzwr618r\"&gt;recent runs:&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5d9rlp66\"&gt;✖ run2akdqctmhw222mff47z2qh  abandoned  $0.0000&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gga6lffk\"&gt;task ▸ ▏&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-we86uk79\"&gt;Enter run · ? help · q quit&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l4oi41js\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-tree\"&gt;&lt;a href=\"ru/glossary.html#run-tree\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run tree&lt;/span&gt;&lt;/a&gt;run tree&lt;/h3&gt;\n&lt;p&gt;Дерево прогона — главная часть TUI. Задачи — строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ljjn0orj\"&gt;tsk…x [fast_path]&lt;/code&gt;, справа фаза, раунды, цена и время. Внутри задачи: её текст, копия &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4if4f8x\"&gt;workspace @ &amp;lt;sha&amp;gt; (copy)&lt;/code&gt;, раунды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hquubkz8\"&gt;r1 implement  implementer → ready&lt;/code&gt;, а под раундом — вызовы модели (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tcr0b8ad\"&gt;· gateway …&lt;/code&gt;), инструменты и доказательства. На верхнем уровне — аномалии &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5n7scojf\"&gt;‼&lt;/code&gt;, ваши указания &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0vt7wd6y\"&gt;»&lt;/code&gt; и служебные заметки. Успешные задачи сворачиваются, проблемные раскрываются сами.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"ru/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hlxnwm8x\"&gt;detail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#keybar\"&gt;keybar&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"board\"&gt;&lt;a href=\"ru/glossary.html#board\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;board ()&lt;/span&gt;&lt;/a&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-24soch7y\"&gt;--cli&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Табло (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wejuwbbz\"&gt;--cli&lt;/code&gt;) — компактный вид прогона, который перерисовывается на месте. Первая строка: прогон, деньги, вызовы и события. Дальше по строке на задачу: трек, фаза, раунды и последний вердикт. Внизу — состояние: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-09yeqfwd\"&gt;running&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qqloqehe\"&gt;halted: …&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f8ockx9m\"&gt;stopping — finishing in-flight verdicts…&lt;/code&gt;. Табло нужен терминал; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mig050bc\"&gt;theia show &amp;lt;runId&amp;gt; --cli&lt;/code&gt; печатает последний кадр.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4kpeqngo\"&gt;run …wvesbyig  $0.0000/$10.00 · 4 calls · 22 events&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqkrwvn8\"&gt;tsk…xk6rzynf  fast_path  discarded   r6  lead→lead_discard “…”&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ej6p6p09\"&gt;— halted: completed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y28s8645\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#tui\"&gt;TUI&lt;/a&gt;, &lt;a href=\"ru/glossary.html#summary\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ipu5kwb2\"&gt;summary&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"plain\"&gt;&lt;a href=\"ru/glossary.html#plain\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4irfhme\"&gt;--plain&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Простой вид: по строке на событие журнала, без перерисовки. Подходит для скриптов, CI и файлов. Строки показывают имена событий Theia, а не слова модели: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rd9gjr3q\"&gt;verify_pass&lt;/code&gt;, а не &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1qndtyey\"&gt;pass&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hr45r1uu\"&gt;arb_escalate&lt;/code&gt;, а не &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g4ou0exi\"&gt;escalate&lt;/code&gt;. Строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1em6lag8\"&gt;live&lt;/code&gt; — только подсказки, в журнал они не пишутся.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6g2jhpfi\"&gt;theia run … --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bs5donou\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rrkb1cr6\"&gt;view: --cli needs a TTY — degrading to --plain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verdict\"&gt;verdict&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y7fxihx0\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#board\"&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-safho1qw\"&gt;--cli&lt;/code&gt;)&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"summary\"&gt;&lt;a href=\"ru/glossary.html#summary\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5uaklveq\"&gt;summary&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Итог прогона: исход каждой задачи, строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6s8szcz0\"&gt;halted:&lt;/code&gt; с числом вызовов и ценой и проверка журнала. Его печатают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-98hrvu4y\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt; без флагов и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9w3zs48f\"&gt;theia run&lt;/code&gt; в конце работы.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cp7j6su9\"&gt;tsk2akdqb2ilc225pxk6rzynf → discarded (6 rounds) …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kvj51i5j\"&gt;halted: completed · 4 gateway calls · $0.0000&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cm9jximf\"&gt;audit chain: intact&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uysijcbv\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g60jqp0r\"&gt;--plain&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"glyphs\"&gt;&lt;a href=\"ru/glossary.html#glyphs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/span&gt;&lt;/a&gt;✔ ✖ ◆ ◌ ‼ »&lt;/h3&gt;\n&lt;p&gt;Значки TUI:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ok2ay74\"&gt;✔&lt;/code&gt; — хорошо: у задачи итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-41l4wds6\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-38hk35at\"&gt;planned&lt;/code&gt;, у раунда вердикт не из списка плохих, у прогона — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lhepttq1\"&gt;completed&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3r7aqvds\"&gt;✖&lt;/code&gt; — плохо: задача отброшена; раунд с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-04mwog3h\"&gt;discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bcue2se1\"&gt;merge_fail&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0lygrf7f\"&gt;verify_fail&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j5uh52ht\"&gt;cant_do&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ch3c7u8l\"&gt;algedonic&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d8rz131t\"&gt;no_progress&lt;/code&gt;; прогон остановлен (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7bmlzpt6\"&gt;stopped (…)&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ks0t78lu\"&gt;◆&lt;/code&gt; — застряло: задача &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7kqvzuz0\"&gt;escalated&lt;/code&gt; или вопрос без ответа; на домашнем экране — прогон на паузе;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nd88ujjy\"&gt;⣷ ⣯ ⣟ …&lt;/code&gt; (или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pnqq38iv\"&gt;●&lt;/code&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y5x2zg0g\"&gt;--no-spinner&lt;/code&gt;) — идёт работа, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-luw0skl4\"&gt;◌&lt;/code&gt; — ждёт;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-00s5fblp\"&gt;‼&lt;/code&gt; — аномалия, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-865e7cuo\"&gt;»&lt;/code&gt; — ваше указание, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ksfmdy96\"&gt;·&lt;/code&gt; — текст задачи или доказательство, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cy54ys48\"&gt;▼&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1mdootbz\"&gt;▶&lt;/code&gt; — раскрыто и свёрнуто, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x6racwal\"&gt;‖&lt;/code&gt; — пауза или остановка, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9yvqb9zo\"&gt;❯&lt;/code&gt; — курсор, когда цвета выключены.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Зелёная галочка значит «не плохое событие», а не «хороший итог». Раунды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xjwb9s4g\"&gt;lead → lead_discard&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5kj7tse\"&gt;arbiter → arb_escalate&lt;/code&gt; тоже отмечены &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dxjtj6o5\"&gt;✔&lt;/code&gt;, а прогон, где все задачи отброшены, помечен &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q0s1zeoe\"&gt;✔ completed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;, &lt;a href=\"ru/glossary.html#completed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pyce18lq\"&gt;completed&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#frozen\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rtffkivm\"&gt;frozen&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#failed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k406vzgk\"&gt;failed&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"running\"&gt;&lt;a href=\"ru/glossary.html#running\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-byk3dtnr\"&gt;running&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Прогон или задача сейчас работает. В заголовке TUI — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tvh29frf\"&gt;running&lt;/code&gt;, в счётчике задач — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d1und9an\"&gt;N running&lt;/code&gt;, на табло — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5k4o9sz3\"&gt;— running&lt;/code&gt;. Прогон, убитый без паузы, в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p4n5i0fs\"&gt;theia show --tui&lt;/code&gt; тоже выглядит как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ckosgtti\"&gt;running&lt;/code&gt;, пока его не продолжат или не закроют.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pk57viph\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9bkngclp\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zmfrzgfh\"&gt;in flight&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"failed\"&gt;&lt;a href=\"ru/glossary.html#failed\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wajregj3\"&gt;failed&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;В TUI — задача с итогом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yvimefp5\"&gt;discarded&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zruw9yve\"&gt;tasks: … 1 failed&lt;/code&gt;. Отдельного итога &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u4l0xhdp\"&gt;failed&lt;/code&gt; у задачи нет. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l9bsnfde\"&gt;(FAILED)&lt;/code&gt; в деталях строки — не удалось действие агента.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wqxg08ny\"&gt;tasks: 0 running · 0 done · 1 failed · anomalies 0&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ruxwh3n\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q10nrdtk\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"frozen\"&gt;&lt;a href=\"ru/glossary.html#frozen\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yhi9tqd9\"&gt;frozen&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;В TUI — задача в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dkpisltq\"&gt;escalated&lt;/code&gt;, которая ждёт ведущего: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6pohte50\"&gt;tasks: … 1 frozen&lt;/code&gt;, значок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hwpmtxyg\"&gt;◆&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yvztgec5\"&gt;tasks: 0 running · 0 done · 1 frozen · anomalies 6&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7fmj4x4f\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"pending\"&gt;&lt;a href=\"ru/glossary.html#pending\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cqwzq8ef\"&gt;pending&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;В TUI — задача ждёт: её зависимости ещё не готовы (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j7q1hpp1\"&gt;blocked on tsk…&lt;/code&gt;) или прогон уже остановился, а задача не закончена. Значок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-142yr8ni\"&gt;◌&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#blocked-on\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dm8x72il\"&gt;blocked on&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blocked-on\"&gt;&lt;a href=\"ru/glossary.html#blocked-on\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-521td16u\"&gt;blocked on&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Задача ждёт другие задачи: работа начнётся, когда они закончатся с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wa5ivs9q\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ciyu47eh\"&gt;planned&lt;/code&gt;. В TUI это написано справа от задачи: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9t3kqa0y\"&gt;blocked on tsk…x&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pending\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lo6qbrez\"&gt;pending&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s0rjrd9r\"&gt;plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"idx\"&gt;&lt;a href=\"ru/glossary.html#idx\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s7bon8ym\"&gt;idx ⚠N&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Подсказка в заголовке TUI: на момент открытия N записей индекса устарели или отсутствуют. Работать можно, но агенты видят неполную схему проекта.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7goqzsec\"&gt;tasks: 0 running · 0 done · 1 failed · anomalies 0 · idx ⚠1&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w0kpkq0s\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ctx\"&gt;&lt;a href=\"ru/glossary.html#ctx\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ggpkwr1m\"&gt;ctx ⚠N&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Подсказка в заголовке TUI: N раз добавленный в запросы контекст оказался больше порога &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9vu1wam6\"&gt;run.contextAlertChars&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9z5yw7oa\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"seek\"&gt;&lt;a href=\"ru/glossary.html#seek\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dm9uislw\"&gt;[@ event k/N]&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Позиция в журнале в заголовке TUI: вы смотрите событие k из N. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y2zp3ed9\"&gt;· live&lt;/code&gt; — экран следует за идущим прогоном, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yazzpkni\"&gt;· head&lt;/code&gt; — последнее событие. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f8f44kbb\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt; клавиши &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jh3hfhh4\"&gt;[&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dzru30wr\"&gt;]&lt;/code&gt; перематывают журнал на одно событие, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ebw97j81\"&gt;{&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xxv1mgsn\"&gt;}&lt;/code&gt; — на десять, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fns53bwa\"&gt;Home&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yp3abazs\"&gt;End&lt;/code&gt; — в начало и в конец, а дерево пересобирается на выбранный момент. После конца живого прогона эти клавиши двигают только счётчик; для перемотки откройте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ykcol84m\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s8l14ndx\"&gt;[@ event 22/22 · head]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gfrkn6hb\"&gt;[@ event 21/22]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-ended\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c0yjuh2g\"&gt;run ended&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#head\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yj0gihb5\"&gt;head&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nfttgb0o\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/tui/navigation.html\"&gt;Навигация и горячие клавиши&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"follow\"&gt;&lt;a href=\"ru/glossary.html#follow\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w3iv7ei8\"&gt;follow&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим слежения: курсор сам переходит к новой активности. Клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o1m02id5\"&gt;f&lt;/code&gt; включает и выключает его, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lz5wfjc2\"&gt;F&lt;/code&gt; выбирает уровень: задача, раунд или инструмент.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fiapy693\"&gt;f follow:round&lt;/code&gt; в строке подсказок.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verbosity\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sjmdjqe2\"&gt;verbosity&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#keybar\"&gt;keybar&lt;/a&gt;, &lt;a href=\"ru/tui/navigation.html\"&gt;Навигация и горячие клавиши&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verbosity\"&gt;&lt;a href=\"ru/glossary.html#verbosity\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bogzeq49\"&gt;verbosity&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Сколько деталей показывает дерево: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4i28mwjb\"&gt;0&lt;/code&gt; — только задачи и раунды (аномалии и указания видны всегда), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a6gf3t0j\"&gt;1&lt;/code&gt; — обычный вид, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-326uyt0m\"&gt;2&lt;/code&gt; — ещё строки вызовов и инструментов. Клавиши &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y4nri5dq\"&gt;+&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zfy4wsyq\"&gt;-&lt;/code&gt;. Theia запоминает выбор вместе с уровнем слежения в файле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l6wcvb2d\"&gt;tui-state.json&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-84vmz2wb\"&gt;+/- verbosity=1&lt;/code&gt; в строке подсказок.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#follow\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kw68px7p\"&gt;follow&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#keybar\"&gt;keybar&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"keybar\"&gt;&lt;a href=\"ru/glossary.html#keybar\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;keybar&lt;/span&gt;&lt;/a&gt;keybar&lt;/h3&gt;\n&lt;p&gt;Строка подсказок внизу TUI. Она показывает только клавиши, которые работают сейчас: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m6h0se2z\"&gt;move&lt;/code&gt; — курсор, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f4p9a6nm\"&gt;fold&lt;/code&gt; — свернуть или раскрыть, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h5ejl7s1\"&gt;zoom&lt;/code&gt; — детали (Enter), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-foqz0at4\"&gt;pane&lt;/code&gt; — переключить панель (Tab), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-low9d8dw\"&gt;follow&lt;/code&gt; — слежение, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q422kgul\"&gt;err&lt;/code&gt; — к следующей ошибке, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4yd2x3k7\"&gt;seek&lt;/code&gt; — перемотка, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eztyobw9\"&gt;wrap&lt;/code&gt; — перенос строки, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wknz1zk2\"&gt;view&lt;/code&gt; — полный текст в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4c9fbsx0\"&gt;$EDITOR&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-28qo0hph\"&gt;less&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vb8w3a03\"&gt;verbosity&lt;/code&gt; — детали, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uyo5r8za\"&gt;steer&lt;/code&gt; — указание (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qtsvvyna\"&gt;m&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fbddd6lv\"&gt;prompt&lt;/code&gt; — запрос идущего вызова (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2m5jz88h\"&gt;p&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ju33byr\"&gt;stop&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kawuwa5q\"&gt;quit&lt;/code&gt; — клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d1p94ysu\"&gt;q&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3wo6zqh8\"&gt;?&lt;/code&gt; открывает полную справку.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0h3uuxv6\"&gt;↑↓ move • ←→ fold • ⏎ zoom • ⇥ pane • f follow • e err • [ ] seek • w wrap • v view • +/- verbosity=1 • ? • q quit&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#follow\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yas23g9z\"&gt;follow&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verbosity\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bg3ni8zc\"&gt;verbosity&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ah4ad2n\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1sr1h1hl\"&gt;detail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"ru/tui/navigation.html\"&gt;Навигация и горячие клавиши&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"detail\"&gt;&lt;a href=\"ru/glossary.html#detail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vhto20zx\"&gt;detail&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Панель деталей под деревом, открывается клавишей Enter. Она показывает всё о строке под курсором: вердикт с комментарием и доказательствами, вопросы, данные вызова, историю фаз задачи. У вердикта в сохранённом прогоне есть готовая команда ответвления &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vladg2xg\"&gt;theia fork &amp;lt;run&amp;gt; --at &amp;lt;evt&amp;gt;&lt;/code&gt;. Клавиша Tab переключает управление между деревом и панелью.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8zx0h93w\"&gt;┤ detail ├&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-74zou52l\"&gt;┤ tree · focus ├&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ohbvlbuj\"&gt;phases:&lt;/code&gt; в деталях задачи.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-htiaac97\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#keybar\"&gt;keybar&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"in-flight\"&gt;&lt;a href=\"ru/glossary.html#in-flight\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sl8kosat\"&gt;in flight&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Работа ещё идёт:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;на домашнем экране &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uehz59x1\"&gt;⣽ run…  in flight&lt;/code&gt; — у прогона нет записи о конце или паузе; так же выгляди
