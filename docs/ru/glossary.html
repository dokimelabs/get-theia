de class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gr6hlvcv\"&gt;theia/run-…&lt;/code&gt; она не трогает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pazt5g0l\"&gt;~/projects/app/.theia/runs/2akdq…/trunk  abc1234 [theia/run-7adeu2] prunable&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ehlydofr\"&gt;git worktree list&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#trunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qk55pbap\"&gt;trunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/reference/audit-prune.html#prune\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wxq1n7hi\"&gt;theia prune&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"audit-branch\"&gt;&lt;a href=\"ru/glossary.html#audit-branch\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ai/&amp;lt;task&amp;gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nq655wru\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ветка задачи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pnsrj8vy\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt; с её коммитами. В вашем репозитории она появляется только после успешного слияния задачи и остаётся там: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-63zh78ia\"&gt;theia prune&lt;/code&gt; её не удаляет. По ней работает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ocyiww0p\"&gt;theia show &amp;lt;runId&amp;gt; --task &amp;lt;id&amp;gt; [--diff]&lt;/code&gt;. У отброшенной задачи такой ветки нет, и команда пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d1125xfh\"&gt;audit branch ai/… not found … (in-place run, or the branch was pruned)&lt;/code&gt;; причина в этом сообщении указана неверно.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-byxs1k3h\"&gt;untouched: … ai/* audit branches (your repo)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ntclxstk\"&gt;theia prune&lt;/code&gt;, доказательство &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3nky46wl\"&gt;merge --no-ff ai/&amp;lt;task&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-heds5rpd\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#show\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aw12oeqp\"&gt;theia show&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"precheck\"&gt;&lt;a href=\"ru/glossary.html#precheck\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;precheck&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lhujhpsu\"&gt;precheck&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Проверка перед слиянием: в копии задачи должны быть коммиты после базы и не должно остаться незакоммиченных правок. Если проверка не прошла, слияния нет, а в доказательстве стоит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9horkmcw\"&gt;precheck:&amp;lt;task&amp;gt;&lt;/code&gt; с причиной.&lt;/p&gt;\n&lt;p&gt;Где встречается: TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z9ax0379\"&gt;command precheck:2akdqcea5s223wgiwm7ieg — no commits on the task branch&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l9lojex3\"&gt;evidence[command] precheck:… (no commits on the task branch)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7n6awi9z\"&gt;theia diagnose&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merge-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tblv3lu1\"&gt;merge_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merger\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2n7gcvem\"&gt;merger&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"in-place\"&gt;&lt;a href=\"ru/glossary.html#in-place\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;--in-place&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-glva9gvl\"&gt;--in-place&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим без копии и без git: агенты правят файлы прямо в вашей папке, ветки прогона нет, а слияние только отмечает работу как принятую (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p149ygva\"&gt;merged&lt;/code&gt;). Theia включает этот режим сама, если папка не git-репозиторий. В проекте с несколькими корнями режим недоступен.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4br4n08d\"&gt;mode: in-place (no git repo or --in-place) — no worktree isolation&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rsnhrk6q\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-store\"&gt;&lt;a href=\"ru/glossary.html#group-store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Хранилище и проект&lt;/span&gt;&lt;/a&gt;Хранилище и проект&lt;/h2&gt;\n&lt;h3 id=\"store\"&gt;&lt;a href=\"ru/glossary.html#store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;store&lt;/span&gt;&lt;/a&gt;store&lt;/h3&gt;\n&lt;p&gt;Хранилище — папка данных Theia для проекта: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-70o245vg\"&gt;.theia&lt;/code&gt; с файлом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mxixrgym\"&gt;store.db&lt;/code&gt; внутри. Там журнал событий, планы, память, индекс кода, настройки проекта и копии задач. Где оно лежит:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;в git-репозитории — в корне рабочей копии, даже если &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-re1y7f2k\"&gt;theia init&lt;/code&gt; запущен из подпапки;&lt;/li&gt;\n&lt;li&gt;вне git — в папке данных пользователя, а папка проекта остаётся чистой;&lt;/li&gt;\n&lt;li&gt;с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7a07ug6k\"&gt;theia init --here&lt;/code&gt; — ровно в текущей папке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Остальные команды ищут хранилище, поднимаясь от текущей папки вверх.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ppxh6ge\"&gt;store: …/.theia (worktree root)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0zz40av5\"&gt;theia: no .theia/ found from &amp;lt;cwd&amp;gt; upward (and no user-registry workspace) — run 'theia init' in the workspace home first&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#theia-dir\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4re4qnt2\"&gt;.theia&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3sukongo\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z0m10wnf\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-home-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ad7uvlqh\"&gt;user-home store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detached\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-df5o15tu\"&gt;detached&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-dir\"&gt;&lt;a href=\"ru/glossary.html#theia-dir\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;.theia&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y2n9021j\"&gt;.theia&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Папка хранилища в проекте. Внутри:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qhmnre11\"&gt;store.db&lt;/code&gt; — база данных;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hxb8b512\"&gt;config/&lt;/code&gt; — настройки проекта: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ki26b412\"&gt;policy.yaml&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-70pi5yna\"&gt;registry.yaml&lt;/code&gt; и другие манифесты;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-it1yp689\"&gt;prompts/&lt;/code&gt; — ваши дополнения к промптам ролей;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-onx6pzi1\"&gt;objects/&lt;/code&gt; — полные выводы команд, запросы и ответы моделей;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-712qy7bl\"&gt;index/&lt;/code&gt; — файлы поиска;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xb1q66k5\"&gt;runs/&lt;/code&gt; — копии задач и ветки прогонов;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oizzlg5u\"&gt;control/&lt;/code&gt; — журналы команд, запущенных через MCP.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Theia добавляет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cntwj6c8\"&gt;.theia/&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-miypzne2\"&gt;.gitignore&lt;/code&gt;. В папке лежат тексты задач и ответы моделей, поэтому храните её как личные данные. Если папка стала больше 5 ГБ (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ikc10rzd\"&gt;maintenance.storeAlertGb&lt;/code&gt;), после прогона и в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6af3dbpu\"&gt;theia doctor&lt;/code&gt; появится строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ijfgmueq\"&gt;storage: .theia at … — reclaim with 'theia prune'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jfhmw5ry\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-49mbywq6\"&gt;.theia store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/audit-prune.html#prune\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b9xsix1o\"&gt;theia prune&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"store-db\"&gt;&lt;a href=\"ru/glossary.html#store-db\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;store.db&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vwmkbcit\"&gt;store.db&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Файл базы данных SQLite в хранилище. В нём журналы событий всех прогонов, планы, факты памяти, записи индекса кода и сохранённые ответы моделей. Именно этот файл отличает настоящее хранилище от папки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sqsfvpot\"&gt;.theia&lt;/code&gt; с одними настройками.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#overlay\"&gt;overlay&lt;/a&gt;, &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace\"&gt;&lt;a href=\"ru/glossary.html#workspace\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;workspace&lt;/span&gt;&lt;/a&gt;workspace&lt;/h3&gt;\n&lt;p&gt;Рабочая область. У Theia это слово значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Копия репозитория для задачи: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8vnth01b\"&gt;.theia/runs/&amp;lt;runId&amp;gt;/ws-&amp;lt;task&amp;gt;&lt;/code&gt; на ветке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f9590ybq\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;. В копию попадают и неотслеживаемые файлы вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7efkxm0s\"&gt;node_modules&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n1k3zh86\"&gt;.env&lt;/code&gt;, но они не коммитятся. После успешного слияния копия удаляется, у отброшенных и застрявших задач остаётся. В TUI: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n6djo6rk\"&gt;workspace @ 209a8f6 (copy)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4fwejshc\"&gt;kind: Workspace&lt;/code&gt; — манифест проекта с несколькими корнями.&lt;/li&gt;\n&lt;li&gt;Папка проекта с хранилищем (workspace home).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-99vmmvtn\"&gt;workspace-write&lt;/code&gt; — режим доступа Codex у транспорта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bydh3kmd\"&gt;codex-write&lt;/code&gt;: запись только в рабочей папке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hywe9xca\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace-home\"&gt;workspace home&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-place\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ki2c72tb\"&gt;--in-place&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-branch\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kyis02ax\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace-home\"&gt;&lt;a href=\"ru/glossary.html#workspace-home\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;workspace home&lt;/span&gt;&lt;/a&gt;workspace home&lt;/h3&gt;\n&lt;p&gt;Папка проекта, которой принадлежит хранилище: в ней лежит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-79lr1cpc\"&gt;.theia&lt;/code&gt; со &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-64pbpvp0\"&gt;store.db&lt;/code&gt;. Пути корней в манифесте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o6wukthw\"&gt;Workspace&lt;/code&gt; считаются от неё.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hsp9br0p\"&gt;… — run 'theia init' in the workspace home first&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6k6wuftp\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"worktree-root\"&gt;&lt;a href=\"ru/glossary.html#worktree-root\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;worktree root&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ehfamh6n\"&gt;worktree root&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Верхняя папка рабочей копии git. По умолчанию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hdgpp6ed\"&gt;theia init&lt;/code&gt; кладёт хранилище туда, даже если вы запустили команду из подпапки: одно хранилище на рабочую копию.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m4ez8sd3\"&gt;store: …/.theia (worktree root)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g81rfrb5\"&gt;(worktree root — one store per checkout; pass --here to pin it to this subfolder instead)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detached\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7lgqasqu\"&gt;detached&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"user-home-store\"&gt;&lt;a href=\"ru/glossary.html#user-home-store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;user-home store&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hd9m7wwu\"&gt;user-home store&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Хранилище для папки вне git. Оно лежит в папке данных пользователя (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-im8aup92\"&gt;stores/&amp;lt;имя&amp;gt;-&amp;lt;хеш&amp;gt;&lt;/code&gt;), а сама папка проекта остаётся чистой. Какой папке какое хранилище принадлежит, записано в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ggynuxcb\"&gt;workspaces.yaml&lt;/code&gt;. Мастер первой настройки так не делает: он всегда создаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4uhat3f1\"&gt;.theia&lt;/code&gt; в текущей папке.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ax6vrcol\"&gt;store: …/stores/my-notes-dfef89b4 (user-home store — this folder is not a git worktree and stays clean; …)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspaces-yaml\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ej1ocwvu\"&gt;workspaces.yaml&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"detached\"&gt;&lt;a href=\"ru/glossary.html#detached\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;detached&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ukdln6eb\"&gt;detached&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n1az8pkc\"&gt;theia init --here&lt;/code&gt; кладёт хранилище ровно в текущую папку, а не в корень рабочей копии и не в папку пользователя. Theia называет такое хранилище &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bfpjubcp\"&gt;detached&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m4rlxzr9\"&gt;store: …/.theia (detached — --here pins the store to this folder)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mlfe3f3t\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspaces-yaml\"&gt;&lt;a href=\"ru/glossary.html#workspaces-yaml\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;workspaces.yaml&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kolv5eu8\"&gt;workspaces.yaml&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Файл в папке настроек пользователя: какой папке вне git какое хранилище принадлежит. Его пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-slckmg1q\"&gt;theia init&lt;/code&gt;. Если строка ведёт к пропавшему хранилищу, Theia пропускает её и сообщает об этом.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p5g6ayb7\"&gt;theia: registry maps &amp;lt;папка&amp;gt; to &amp;lt;хранилище&amp;gt; but no store.db is there — ignoring the row (…)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#user-home-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-71xo8rrl\"&gt;user-home store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"root\"&gt;&lt;a href=\"ru/glossary.html#root\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;root&lt;/span&gt;&lt;/a&gt;root&lt;/h3&gt;\n&lt;p&gt;Корень. У Theia это слово значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Репозиторий в проекте с несколькими корнями. У него короткое имя, а флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ty590skj\"&gt;--root &amp;lt;имя&amp;gt;&lt;/code&gt; сужает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4zs2xz5g\"&gt;index&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ls67qdz0\"&gt;mem&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x4p49jf6\"&gt;run&lt;/code&gt; до одного корня. В обычном проекте один корень с именем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-al4q5m20\"&gt;root&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cvbp9285\"&gt;root:&amp;lt;имя&amp;gt;&lt;/code&gt; — часть памяти, записанная с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qqh1m0c7\"&gt;--root&lt;/code&gt;; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5xt3owv4\"&gt;theia mem search&lt;/code&gt; она видна как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fb8f5clx\"&gt;{root:web}&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9891v7w3\"&gt;worktree root&lt;/code&gt; — верхняя папка рабочей копии git, место хранилища по умолчанию.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eqkn0awf\"&gt;root cause&lt;/code&gt; — вероятная причина неудачи в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sudd712n\"&gt;theia diagnose&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-flrux3on\"&gt;root: null&lt;/code&gt; в деталях задачи в TUI — у задачи нет отдельного корня.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xym78ev\"&gt;theia: unknown root 'nope' (declared: root)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-11ubzs87\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#scope\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-49u9otvt\"&gt;scope&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f10awbjz\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yqj51gkb\"&gt;root cause&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace-manifest\"&gt;&lt;a href=\"ru/glossary.html#workspace-manifest\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;kind: Workspace&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0dklgorq\"&gt;kind: Workspace&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Манифест проекта с несколькими корнями: несколько репозиториев делят одно хранилище. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a6p1vu2v\"&gt;spec.roots&lt;/code&gt; перечислены корни (имя и путь от папки хранилища), в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rtqy72a5\"&gt;spec.primary&lt;/code&gt; — корень по умолчанию. Задачи прогона помечены корнем, а связанные слияния в разных корнях ложатся вместе (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-407uiry2\"&gt;run.changeset&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-narlcg5f\"&gt;.theia/config/workspace.yaml&lt;/code&gt; от мастера первой настройки, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z43f7pac\"&gt;multi-root workspace: proj, lib (primary: proj)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-changeset\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i47wxv92\"&gt;run.changeset&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"overlay\"&gt;&lt;a href=\"ru/glossary.html#overlay\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;overlay&lt;/span&gt;&lt;/a&gt;overlay&lt;/h3&gt;\n&lt;p&gt;Папка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xyslp7s6\"&gt;.theia&lt;/code&gt; без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sfr0si3r\"&gt;store.db&lt;/code&gt; внутри одного из корней проекта. В ней только свои настройки и промпты для этого корня. При поиске хранилища Theia пропускает такую папку и идёт выше.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6qih3r6v\"&gt;theia: …/.theia has no store.db — per-root overlay, continuing upward&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4wtb0cmj\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-plans\"&gt;&lt;a href=\"ru/glossary.html#group-plans\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Планы&lt;/span&gt;&lt;/a&gt;Планы&lt;/h2&gt;\n&lt;h3 id=\"plan\"&gt;&lt;a href=\"ru/glossary.html#plan\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;plan&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-voirptbz\"&gt;plan&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У слова два смысла.&lt;/p&gt;\n&lt;p&gt;План — сохранённый список задач от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qr2jg1mv\"&gt;theia plan&lt;/code&gt;: у каждой задачи ключ, трек, зависимости и команды проверки. У плана есть отпечаток содержимого (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b5uheise\"&gt;digest&lt;/code&gt;) и статус: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8050c71e\"&gt;draft&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k1fmqh4g\"&gt;approved&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ap22g0qm\"&gt;changes_requested&lt;/code&gt;. Запустить можно только одобренный план: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0j0or2b1\"&gt;theia run --from-plan &amp;lt;planId&amp;gt;&lt;/code&gt;. Любая правка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-io3js8dh\"&gt;theia plan add-context&lt;/code&gt;) даёт новый отпечаток и возвращает план в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eq5845p9\"&gt;draft&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Фаза &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2pok6mth\"&gt;plan&lt;/code&gt; — шаг задачи трека &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ovmhx34e\"&gt;full_spec&lt;/code&gt;, в котором работает планировщик.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tgik9x52\"&gt;pln2akdqddd5c2223ubqzsvlt [draft] 2 tasks — …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bdflx3g9\"&gt;theia plan list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f9f83bms\"&gt;approved pln… @ fce3554ee5e2…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-blbj3eyn\"&gt;run run… plan pln… @ fce3554ee5e2… → 2 tasks&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-keh3qntz\"&gt;task.phase … start → plan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#approved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fnpbprro\"&gt;approved&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ug9wab8g\"&gt;draft&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#changes-requested\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rt98nk5b\"&gt;changes_requested&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#digest\"&gt;digest&lt;/a&gt;, &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5pxj22yr\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/plan-and-run.html\"&gt;План перед запуском&lt;/a&gt;, &lt;a href=\"ru/reference/plan.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m8olo6ie\"&gt;theia plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"approved\"&gt;&lt;a href=\"ru/glossary.html#approved\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;approved&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0zp8iuyt\"&gt;approved&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Статус одобренного плана. Только такой план запускает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vhy4dnad\"&gt;theia run --from-plan&lt;/code&gt;. На план в другом статусе Theia отвечает отказом.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e902m8n3\"&gt;run: plan pln… is 'draft', not approved — approve it first (theia plan approve)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rh6ntc9p\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kn5fq5cd\"&gt;draft&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"changes-requested\"&gt;&lt;a href=\"ru/glossary.html#changes-requested\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;changes_requested&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g71l2udz\"&gt;changes_requested&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Статус плана после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z8kbx2gn\"&gt;theia plan request-changes &amp;lt;planId&amp;gt; \"…\"&lt;/code&gt;: вы попросили изменений. Отпечаток плана не меняется, а текст просьбы виден в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hnjule7e\"&gt;theia plan show&lt;/code&gt; строкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-awsmpuw6\"&gt;note:&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-067oiqrg\"&gt;changes requested on pln…&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gyefa3y0\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#approved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2k10ejoc\"&gt;approved&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"open-questions\"&gt;&lt;a href=\"ru/glossary.html#open-questions\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;OPEN QUESTIONS&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5qgp3q6\"&gt;OPEN QUESTIONS&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У планировщика есть вопросы, а ответить в терминале нельзя, например из-за &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i1bc2pfx\"&gt;--non-interactive&lt;/code&gt;. Theia сохраняет черновик плана с одним пунктом &lt;a href=\"ru/glossary.html#unresolved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a59qne7h\"&gt;unresolved&lt;/code&gt;&lt;/a&gt; и печатает вопросы. Ответ добавьте командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-15qhygdt\"&gt;theia plan add-context &amp;lt;planId&amp;gt; \"…\"&lt;/code&gt;, затем создайте план заново или одобрите его.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5e1tq999\"&gt;OPEN QUESTIONS — plan saved as draft pln…:&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h6klg7iw\"&gt;answer with: theia plan add-context pln… \"…\" — then re-run theia plan or approve&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ib68b05v\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-65slyw0i\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unresolved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zr3nv0t9\"&gt;unresolved&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"unresolved\"&gt;&lt;a href=\"ru/glossary.html#unresolved\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;unresolved&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8thpgy10\"&gt;unresolved&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ключ задачи-заглушки в черновике плана, который сохранён с открытыми вопросами (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gdquzn3o\"&gt;OPEN QUESTIONS&lt;/code&gt;). Описание такой задачи начинается словами &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v94x5s6s\"&gt;Resolve open questions, then re-plan: …&lt;/code&gt;. Это не задача для выполнения, а напоминание: ответьте на вопросы командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-duwdt90k\"&gt;theia plan add-context &amp;lt;planId&amp;gt; \"…\"&lt;/code&gt; и составьте план заново. Утверждать такой черновик не нужно.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5znwyk4r\"&gt;unresolved&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8mquimwo\"&gt;theia plan show &amp;lt;planId&amp;gt;&lt;/code&gt; после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-clxse9cc\"&gt;OPEN QUESTIONS — plan saved as draft pln…&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#open-questions\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4le3t7ij\"&gt;OPEN QUESTIONS&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yby64rf1\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fpscz2tf\"&gt;draft&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/plan-and-run.html\"&gt;План перед запуском&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verify-pre-flight\"&gt;&lt;a href=\"ru/glossary.html#verify-pre-flight\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;verify pre-flight&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-41uri6xw\"&gt;verify pre-flight&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Пробный запуск команд проверки из плана на базовом коммите, до одобрения плана. По умолчанию выключен: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cy8d98m0\"&gt;run.planVerifyPreflight: disable&lt;/code&gt;. Если команда падает на базе, это нормально, когда задача и должна её починить. Но если падает сама команда, например нет нужного инструмента, исправьте её до одобрения.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4eat6rde\"&gt;verify pre-flight: off (opt in with policy run.planVerifyPreflight: always)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s1ob69wa\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n3fem9wp\"&gt;verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"cost-estimate\"&gt;&lt;a href=\"ru/glossary.html#cost-estimate\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;cost estimate&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oqh1e1gd\"&gt;cost estimate&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Оценка цены плана по прошлым прогонам в этом хранилище: число задач × средняя цена задачи. Без истории прогонов оценки нет. Та же оценка в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vcvcvap5\"&gt;theia run --from-plan&lt;/code&gt; называется &lt;a href=\"ru/glossary.html#plan-floor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g1lmhwzv\"&gt;plan floor&lt;/code&gt;&lt;/a&gt;: если бюджет по умолчанию меньше неё, запуск отклоняется до первого вызова модели.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-88tes704\"&gt;cost estimate: ~$… (N tasks × $… avg/task from recorded runs)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9v26evt6\"&gt;cost estimate: no run history — no estimate&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kevakc66\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan-floor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bqaszp16\"&gt;plan floor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-maxusdperrun\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9pvibtjf\"&gt;run.maxUsdPerRun&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"plan-floor\"&gt;&lt;a href=\"ru/glossary.html#plan-floor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;plan floor&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mc9pj3oo\"&gt;plan floor&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Нижняя оценка стоимости прогона по плану: средняя цена задачи по прошлым платным прогонам этого хранилища × число задач плана. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rtqqp6ij\"&gt;theia run --from-plan&lt;/code&gt; сравнивает с ней бюджет до первого вызова модели. Если бюджет взят по умолчанию (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ize2e4v\"&gt;run.maxUsdPerRun&lt;/code&gt;) и он ниже оценки, запуск отклоняется с кодом 1: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mdcjuqth\"&gt;run: plan floor ~$… exceeds budget $… — pass --budget N explicitly, raise run.maxUsdPerRun, or --budget 0 (unmetered)&lt;/code&gt;. Если бюджет задан флагом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-192el4ut\"&gt;--budget&lt;/code&gt;, Theia только предупреждает (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aoh4kk0d\"&gt;run: WARNING — plan floor …&lt;/code&gt;) и продолжает: ждите паузу по бюджету. Без истории платных прогонов оценки нет, и проверки тоже.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mbe8x3rs\"&gt;run: plan floor ~$12.50 (5 tasks × $2.50 avg/task from this store's recorded runs) exceeds budget $10 — …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ar3hbxg\"&gt;run: WARNING — plan floor … proceeding on your explicit --budget&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#cost-estimate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mhsbxmnt\"&gt;cost estimate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unmetered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o2s5m1kt\"&gt;unmetered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run.html#run-from-plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1v1y9dev\"&gt;theia run --from-plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"track-override\"&gt;&lt;a href=\"ru/glossary.html#track-override\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;track override&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2l0ii38j\"&gt;track override&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3sazn8r0\"&gt;theia run --from-plan &amp;lt;planId&amp;gt; --track &amp;lt;трек&amp;gt;&lt;/code&gt; переводит все задачи плана на один трек, только в этом прогоне. Сам план и его отпечаток не меняются.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l50zqmpe\"&gt;track override: all 2 tasks forced to full_spec for this run (plan content unchanged)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yl7nno4w\"&gt;plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-steering\"&gt;&lt;a href=\"ru/glossary.html#group-steering\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Указания и вопросы&lt;/span&gt;&lt;/a&gt;Указания и вопросы&lt;/h2&gt;\n&lt;h3 id=\"steering\"&gt;&lt;a href=\"ru/glossary.html#steering\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;steering&lt;/span&gt;&lt;/a&gt;steering&lt;/h3&gt;\n&lt;p&gt;Указание — ваше сообщение прогону во время работы: что учесть, что изменить. Theia записывает её событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-001ur42m\"&gt;user.note [msg]&lt;/code&gt; и добавляет в общие заметки (Σ), которые получат следующие шаги. Способы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hdo3o4gu\"&gt;m&lt;/code&gt; в TUI: указание сразу попадает в прогон этого же процесса. Строка ввода показывает адресата: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qj5dq3b8\"&gt;steer → tsk…x ▸&lt;/code&gt; (задача под курсором) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqavgrbg\"&gt;steer → run ▸&lt;/code&gt; (весь прогон);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xwez5fxz\"&gt;theia msg &amp;lt;runId&amp;gt; \"…\"&lt;/code&gt;, с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-39t1phem\"&gt;--task &amp;lt;id&amp;gt;&lt;/code&gt; — только для одной задачи;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-45chwgm1\"&gt;theia fork &amp;lt;runId&amp;gt; --with \"…\"&lt;/code&gt; — указание для ответвления.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Указание для завершённой или неизвестной задачи Theia перенаправляет всему прогону и пишет об этом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7oyhvuw4\"&gt;theia msg&lt;/code&gt; из другого терминала доходит до прогона на паузе (при продолжении) и до продолженного прогона. Прогон, запущенный заново, указание не прочтёт, хотя &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83iixgxf\"&gt;theia msg&lt;/code&gt; ответит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zz270k93\"&gt;noted — this run appears live …&lt;/code&gt;. Подробнее — в статье &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o2boezp5\"&gt;noted for task …fd7pn6tz — folds into its guidance only&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j7xsljuu\"&gt;noted — folds into guidance on: theia run --resume run…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w8ssxgyz\"&gt;task …xk6rzynf is terminal — rerouted to run-level guidance (…)&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-itg0f6hh\"&gt;» steer [msg] …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3pu9c1ki\"&gt;user.note&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#sigma\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y8jqqhwm\"&gt;sigma&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;, &lt;a href=\"ru/reference/run-control.html#msg\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mexsm8ml\"&gt;theia msg&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"control-bus\"&gt;&lt;a href=\"ru/glossary.html#control-bus\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;control bus&lt;/span&gt;&lt;/a&gt;control bus&lt;/h3&gt;\n&lt;p&gt;Шина управления — способ управлять прогоном из другого процесса без отдельного сервера. Команда или инструмент дописывает событие в журнал прогона, а прогон читает новые события между шагами. Так устроены &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-31wzd1yp\"&gt;theia msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qvtw5awj\"&gt;theia answer&lt;/code&gt;, режим вопросов &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kjcfkdw3\"&gt;--interaction bus&lt;/code&gt; и инструменты MCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vgca5xhu\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-909j74ar\"&gt;run_answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1nrovrgm\"&gt;run_stop&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 шину читает только продолженный прогон — запущенный командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g5u9c5en\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. Прогон, начатый через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sfzbx81h\"&gt;theia run --task …&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-32x79ulf\"&gt;--from-plan&lt;/code&gt;, а также каждый прогон от инструмента MCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5vlevx3s\"&gt;run_start&lt;/code&gt; шину не читает. События попадают в журнал, но прогон идёт дальше, как будто их нет: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nnqdimp7\"&gt;theia msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lonwxvd4\"&gt;theia answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l7khnqse\"&gt;--interaction bus&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8qa38cxu\"&gt;run_stop&lt;/code&gt; на него не действуют. Ответы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jllif42b\"&gt;noted — this run appears live: …&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x94sr4a1\"&gt;honored at the next dispatch boundary&lt;/code&gt; в этом случае вводят в заблуждение.&lt;/p&gt;\n&lt;p&gt;Что работает: клавиши &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-98r6tt3k\"&gt;m&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6cbt1y64\"&gt;q&lt;/code&gt; в TUI того же процесса, Ctrl+C в терминале прогона, а также команды шины после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-18ld288v\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. Порядок действий — в разделе &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-31ijbhav\"&gt;noted — this run appears live: it folds cross-process notes at its next dispatch boundary …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tz1ok7u3\"&gt;N questions waiting&lt;/code&gt; в строке статуса.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-stop-request\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vd7hx02w\"&gt;run.stop_request&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-question\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e3nfxn0i\"&gt;run.question&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dispatch-boundary\"&gt;dispatch boundary&lt;/a&gt;, &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dispatch-boundary\"&gt;&lt;a href=\"ru/glossary.html#dispatch-boundary\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;dispatch boundary&lt;/span&gt;&lt;/a&gt;dispatch boundary&lt;/h3&gt;\n&lt;p&gt;Момент между шагами прогона. В этот момент прогон проверяет запрос на остановку и новые указания. Шаг, который уже идёт, включая команду проверки, сначала доделывается. Внутрь идущего вызова модели указание не попадает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-22qnsir9\"&gt;honored at the next dispatch boundary (in-flight work lands first)&lt;/code&gt; (ответ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uqdgyf4q\"&gt;run_stop&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xhsjscoc\"&gt;… at its next dispatch boundary&lt;/code&gt; (ответ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1rfhk7ub\"&gt;theia msg&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2a0396e9\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"clarify\"&gt;&lt;a href=\"ru/glossary.html#clarify\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;clarify&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9wnxtggf\"&gt;clarify&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Уточняющий вопрос (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gx1zwqy8\"&gt;clarify&lt;/code&gt;) — роль не может продолжать без вашего ответа. Спросить могут только планировщик и ведущий, у каждого вопроса есть пояснение, зачем он нужен. Куда приходит вопрос:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;в TUI — форма в панели деталей: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s9zfeqjq\"&gt;clarify — task …x (1/2)&lt;/code&gt; и строка ввода &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-meuv1iuk\"&gt;answer ▸&lt;/code&gt;. Enter — следующий вопрос, пустой ответ — пропуск, Esc — отказ от остальных;&lt;/li&gt;\n&lt;li&gt;в обычном терминале — строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0wmtd41b\"&gt;the planner needs answers before proceeding:&lt;/code&gt; (так же и для ведущего) и вопросы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-40zgu059\"&gt;? …&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;в режиме &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-raztuap9\"&gt;--interaction bus&lt;/code&gt; — событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lsqkq83k\"&gt;run.question&lt;/code&gt; и ответ через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vshih35t\"&gt;theia answer&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ответы Theia сохраняет фактами памяти &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rzj2vtaj\"&gt;Q: … A: …&lt;/code&gt;, чтобы не спрашивать снова. Без ответа задача замирает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tgjl7v42\"&gt;escalated&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8e63bpcr\"&gt;clarify_unanswered&lt;/code&gt;). Второй подряд вопрос без ответа ставит прогон на паузу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nual8u72\"&gt;clarify_stalled&lt;/code&gt;). С &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sf55mjrg\"&gt;--non-interactive&lt;/code&gt; вопрос сразу остаётся без ответа.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#clarify-unanswered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ruylziik\"&gt;clarify_unanswered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bauzzqdr\"&gt;clarify_stalled&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-question\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1vulwe5t\"&gt;run.question&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#non-interactive\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-09j9t6ku\"&gt;--non-interactive&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fact\"&gt;fact&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"probe\"&gt;&lt;a href=\"ru/glossary.html#probe\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;probe&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k3y346vj\"&gt;probe&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вопрос о прогоне (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cawbkdyg\"&gt;probe&lt;/code&gt;) — разовый вопрос модели о состоянии прогона: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8kfc7p08\"&gt;theia probe &amp;lt;runId&amp;gt; \"…\"&lt;/code&gt;. Прогон при этом не меняется: Theia пишет только отдельную запись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-akbv5wp1\"&gt;run.probed&lt;/code&gt;. Вопрос — это один вызов модели, лимит по умолчанию — 1 доллар (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1i6goz79\"&gt;--budget&lt;/code&gt;). Тот же вопрос повторно отвечается бесплатно из записи. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-77r1rxal\"&gt;theia prune&lt;/code&gt; такие записи не удаляет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ow3wrvok\"&gt;[probe run2akdqbfu2w223occvaxl3w of run2akdqb2i4k223pwvesbyig @ …bjr37ync — $0.0000; parent untouched]&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s5ds5cjn\"&gt;· run…  probe&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#none\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dnj1i0xx\"&gt;none&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b5h0tobs\"&gt;ask&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9yobkg28\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run-control.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dbgfwj0u\"&gt;theia probe&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-inspect\"&gt;&lt;a href=\"ru/glossary.html#group-inspect\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разбор прогона&lt;/span&gt;&lt;/a&gt;Разбор прогона&lt;/h2&gt;\n&lt;h3 id=\"audit-chain\"&gt;&lt;a href=\"ru/glossary.html#audit-chain\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;audit chain&lt;/span&gt;&lt;/a&gt;audit chain&lt;/h3&gt;\n&lt;p&gt;Цепочка аудита — защита журнала от подмены. Каждое событие хранит отпечаток предыдущего, и Theia проверяет, что цепочка не порвана. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qeyps26s\"&gt;intact&lt;/code&gt; — журнал цел, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3fsa4zq5\"&gt;BROKEN&lt;/code&gt; — его изменили после записи. Прогон со сломанной цепочкой нельзя продолжить или ответвить.&lt;/p&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7857rvgz\"&gt;theia audit verify&lt;/code&gt; проверяет цепочки всех записей: прогонов, вопросов &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ogfg1xge\"&gt;probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dc79h3bq\"&gt;ask&lt;/code&gt;, планов и индекса. В 0.2.201 для несуществующего имени команда тоже пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vse076gn\"&gt;intact&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4m2io5sf\"&gt;audit chain: intact&lt;/code&gt; в итоге, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qgud3id6\"&gt;2akdqb2i4k223pwvesbyig: intact&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6f07emef\"&gt;index: intact&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gg27t8xd\"&gt;theia audit verify&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2jtk2qz4\"&gt;‼ audit chain BROKEN at …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a82nnrlq\"&gt;replay&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/audit-prune.html#audit-verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4f1lj8ka\"&gt;theia audit verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"replay\"&gt;&lt;a href=\"ru/glossary.html#replay\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;replay&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5cqr0ywl\"&gt;replay&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Воспроизведение по журналу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a3fkqliz\"&gt;replay&lt;/code&gt;) — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wz7now2x\"&gt;theia replay &amp;lt;runId&amp;gt;&lt;/code&gt; заново читает журнал прогона и пересчитывает итог. Задачи не выполняются, модель не вызывается, ничего не меняется. Команда печатает число событий и состояние цепочки, итоговые фазы задач, число вердиктов и вызовов, а также общие заметки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x06f90i8\"&gt;sigma: {…}&lt;/code&gt;. Если цепочка сломана, код выхода — 1.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q34lp0m2\"&gt;events: 22; chain: intact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0mmjxwth\"&gt;verdicts: 6; gateway calls: 4&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xtd548ht\"&gt;sigma: {}&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"ru/glossary.html#sigma\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3xofa6mg\"&gt;sigma&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gy3caz4h\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-61uaa4o6\"&gt;theia replay&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fork\"&gt;&lt;a href=\"ru/glossary.html#fork\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fork&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z5z01fxu\"&gt;fork&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ответвление прогона (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-52t3lvf4\"&gt;fork&lt;/code&gt;) — новый прогон, который копирует журнал исходного до выбранного события и дальше идёт иначе. Команда: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q4pa4rix\"&gt;theia fork &amp;lt;runId&amp;gt; --at &amp;lt;событие&amp;gt; --with \"…\"&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wlqzxuok\"&gt;--at&lt;/code&gt; — событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cq7m3adc\"&gt;verdict&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9qifqwwx\"&gt;task.phase&lt;/code&gt;, подойдёт короткий номер из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7rcaybrg\"&gt;show --plain&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oncouaa6\"&gt;--with&lt;/code&gt; — указание для нового пути. Запускает ответвление &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4miijjkf\"&gt;theia run --resume &amp;lt;новый id&amp;gt;&lt;/code&gt;. Бюджет ответвления по умолчанию — 5 долларов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;ul&gt;\n&lt;li&gt;Ответвление завершённого прогона без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yilq8tdm\"&gt;--at&lt;/code&gt; продолжить нельзя: все задачи в нём уже закончены.&lt;/li&gt;\n&lt;li&gt;Продолженное ответвление сливает работу не в ветку прогона, а в вашу текущую ветку.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ygqhno5\"&gt;forked run… @ bjr37ync → run…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w4e1r4vq\"&gt;drive it: theia run --resume run…   (gateway: hybrid — prefix replays free)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ch8sl0l6\"&gt;forked from … at …&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bcc72cfc\"&gt;fork → … at … (&amp;lt;причина&amp;gt;)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zi5a3e59\"&gt;theia show&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lejmrp28\"&gt;forked·&amp;lt;итог&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hybrid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r9ei9v2w\"&gt;hybrid&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-forked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-psx5tel7\"&gt;run.forked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#post-baseline\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kh890c28\"&gt;post-baseline&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o6n5yd4r\"&gt;theia fork&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"hybrid\"&gt;&lt;a href=\"ru/glossary.html#hybrid\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;hybrid&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-atwbf1gp\"&gt;hybrid&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим шлюза для ответвлений, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wjwg7aq0\"&gt;probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1eax9a2k\"&gt;ask&lt;/code&gt;. Если ответ на такой же запрос уже сохранён, Theia берёт его бесплатно, а новые запросы отправляет модели и сохраняет. Надпись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ufug9sfp\"&gt;prefix replays free&lt;/code&gt; у ответвления значит только, что скопированная часть не выполняется заново. Сохранённые ответы исходного прогона есть, только если он шёл с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bha077jv\"&gt;--record&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ydg9be2q\"&gt;(gateway: hybrid — prefix replays free)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qkrg59wo\"&gt;fork resume: gateway in hybrid mode (recorded prefix replays free)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#recording\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9niaklf4\"&gt;--record&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yvpmicse\"&gt;fork&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"recording\"&gt;&lt;a href=\"ru/glossary.html#recording\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;--record&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k7vbdz6r\"&gt;--record&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gl0lvm4z\"&gt;theia run --record&lt;/code&gt; сохраняет каждый ответ модели в хранилище, чтобы потом повторить его без вызова. Нужен в основном для экспериментов с ответвлениями. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m8w9rrjj\"&gt;theia prune&lt;/code&gt; сохранённые ответы не удаляет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-luiu660p\"&gt;untouched: unfinished runs, gateway recordings (request-keyed, shared), …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8zqknvbw\"&gt;theia prune&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hybrid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xfofb3nk\"&gt;hybrid&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipbo
