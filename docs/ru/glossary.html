&gt;changes_requested&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8jxynh9c\"&gt;context_added&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p2ukpbuz\"&gt;clock.read&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bpknsskr\"&gt;random.draw&lt;/code&gt; — записанные показания часов и случайные числа для повтора прогона, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-msvmcqf4\"&gt;memory.fact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5gnf0nh9\"&gt;memory.chunk&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v7gv9x2f\"&gt;memory.tombstone&lt;/code&gt; — записи памяти, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xnb75ik\"&gt;index.entry&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-slrq9kec\"&gt;index.build&lt;/code&gt; — записи индекса кода, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2gih5flc\"&gt;generation.published&lt;/code&gt; — публикация поколения поиска. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zt7wbf6q\"&gt;--plain&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yaq0ng3m\"&gt;theia show --plain&lt;/code&gt; такие события печатаются как есть: идентификатор и имя типа. Разбирать их не нужно.&lt;/p&gt;\n&lt;p&gt;Где встречается: в своих областях журнала (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1bt1vtw5\"&gt;index&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6so87c7k\"&gt;plan&lt;/code&gt;, память), которые проверяет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-alacttny\"&gt;theia audit verify&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2r5c0c55\"&gt;index: intact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wb6rift5\"&gt;plan: intact&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3sg9t4y6\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ky8fdazi\"&gt;replay&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-stops\"&gt;&lt;a href=\"ru/glossary.html#group-stops\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Остановка, пауза и аномалии&lt;/span&gt;&lt;/a&gt;Остановка, пауза и аномалии&lt;/h2&gt;\n&lt;h3 id=\"halted\"&gt;&lt;a href=\"ru/glossary.html#halted\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;halted&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vadzc4ev\"&gt;halted&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d4lw8rjp\"&gt;halted&lt;/code&gt; — итог прогона: почему он перестал работать. Значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9mqbkyy3\"&gt;completed&lt;/code&gt; — делать больше нечего. Это не успех: задачи могли быть отброшены. См. &lt;a href=\"ru/glossary.html#completed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d5n9719q\"&gt;completed&lt;/code&gt;&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r848fnj3\"&gt;paused&lt;/code&gt; — прогон на паузе, его можно продолжить. См. &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-btn9c2gn\"&gt;paused&lt;/code&gt;&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nrmk52u5\"&gt;abandoned&lt;/code&gt; — прогон закрыт командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ofuhcypj\"&gt;theia run --abandon&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hnewwbm4\"&gt;budget&lt;/code&gt; — сработал внутренний потолок в 1000 вердиктов на прогон. С деньгами это не связано: когда кончаются деньги, прогон встаёт на паузу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ct4ece5e\"&gt;budget_freeze&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hi3wx2st\"&gt;(still open)&lt;/code&gt; — в журнале нет конца: прогон ещё идёт, был убит или это запись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c22hs4cd\"&gt;probe&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jullvou7\"&gt;ask&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В TUI то же значение видно в заголовке: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o7ii7hm1\"&gt;✔ completed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j60l5cqf\"&gt;‖ paused&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-08lcsghc\"&gt;✖ stopped (abandoned)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t8hdhy3d\"&gt;✖ stopped (budget)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y9v1mbkb\"&gt;halted: completed · 4 gateway calls · $0.0000&lt;/code&gt;, событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t470rlfm\"&gt;run.finished  halted=completed rounds=6&lt;/code&gt;, табло &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b9d3ezw4\"&gt;— halted: completed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#completed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3er0bzp8\"&gt;completed&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k44kfke0\"&gt;paused&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#abandoned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tyigjlnc\"&gt;abandoned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dj47vmke\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-finished\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ozslgi7b\"&gt;run.finished&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"completed\"&gt;&lt;a href=\"ru/glossary.html#completed\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;completed&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jlucmdyr\"&gt;completed&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8odbelu5\"&gt;completed&lt;/code&gt; — значение &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kbduwzm1\"&gt;halted&lt;/code&gt;&lt;/a&gt;: прогону больше нечего делать. Оно не значит, что работа удалась. Прогон, где все задачи отброшены, тоже заканчивается &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8xfxz5xw\"&gt;halted: completed&lt;/code&gt;, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b5zqs2ia\"&gt;theia run&lt;/code&gt; возвращает код 1. Смотрите исход каждой задачи: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wpctozpo\"&gt;merged&lt;/code&gt; — работа слита, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pyfx4ibz\"&gt;discarded&lt;/code&gt; — отброшена.&lt;/p&gt;\n&lt;p&gt;В TUI такой прогон всё равно помечен зелёной галочкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5ebrfki\"&gt;✔ completed&lt;/code&gt;, и на домашнем экране тоже стоит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ayfzhwr8\"&gt;✔&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fe9xhrsb\"&gt;halted: completed · 4 gateway calls · $0.0000&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lzdpxjit\"&gt;✔ completed · run run…&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5wot9jmn\"&gt;✔ run…  completed  $0.0000&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-16ywk3pc\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ursbt74\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"paused\"&gt;&lt;a href=\"ru/glossary.html#paused\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;paused&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cwp5jgq4\"&gt;paused&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Прогон на паузе: новые шаги не начинаются, журнал цел, прогон можно продолжить командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cjnwg68i\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. Код выхода &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vj4u19lc\"&gt;theia run&lt;/code&gt; при паузе — 0. Пауза бывает:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;после первого Ctrl+C в терминале или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-to6s30yu\"&gt;q&lt;/code&gt; в TUI;&lt;/li&gt;\n&lt;li&gt;когда кончился бюджет (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4a97prhy\"&gt;budget_freeze&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;когда сработала защита от зацикливания (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ivw19tx0\"&gt;dispatch_stalled&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k2uomqqz\"&gt;clarify_stalled&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;по запросу &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0krmrl9c\"&gt;run_stop&lt;/code&gt; — только у продолженного прогона.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e8gm2epz\"&gt;run.paused    rounds=8 (resumable)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k3zy9wzq\"&gt;halted: paused&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m0tre1ef\"&gt;paused — resume with: theia run --resume run…&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v4jiaf5j\"&gt;‖ paused&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v9fmlq9x\"&gt;◆ run…  paused&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-65uapcf2\"&gt;--resume&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-je6313ru\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget-freeze\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mkawd8o6\"&gt;budget_freeze&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dispatch-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4lfqmqd9\"&gt;dispatch_stalled&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"abandoned\"&gt;&lt;a href=\"ru/glossary.html#abandoned\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;abandoned&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6w5ta7lo\"&gt;abandoned&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Прогон закрыт без результата командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dowse1dq\"&gt;theia run --abandon &amp;lt;runId&amp;gt;&lt;/code&gt;. Theia дописывает в журнал конец прогона &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1svhau9p\"&gt;halted: abandoned&lt;/code&gt; и ничего не удаляет: копии задач остаются, место освобождает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-opxe6mre\"&gt;theia prune&lt;/code&gt;. Команда не останавливает прогон, который ещё работает в другом терминале: для этого нажмите там Ctrl+C.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vjvge3db\"&gt;theia run --resume&lt;/code&gt; не отказывается продолжать закрытый прогон.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7s6rvt7v\"&gt;abandoned run… — workspaces kept; reclaim with 'theia prune'&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r14n6tvr\"&gt;halted: abandoned&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zd0nm6r0\"&gt;✖ stopped (abandoned)&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2e6flpcs\"&gt;✖ run…  abandoned&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yhricgtw\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ll522eb8\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rjbo6lvv\"&gt;--resume&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/audit-prune.html#prune\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ry44zm9v\"&gt;theia prune&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"still-open\"&gt;&lt;a href=\"ru/glossary.html#still-open\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;(still open)&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mzwh3jhi\"&gt;(still open)&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Так &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mc9qtlgx\"&gt;theia show&lt;/code&gt; пишет итог, когда в журнале нет ни конца прогона, ни паузы. Причины: прогон ещё идёт, его убили (второй Ctrl+C, закрытое окно терминала) или это запись вопроса &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-trbld9g9\"&gt;probe&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pz1drik8\"&gt;ask&lt;/code&gt;. Убитый прогон остаётся открытым, пока вы его не продолжите (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vx8i6e8b\"&gt;--resume&lt;/code&gt;) или не закроете (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5g7ii2et\"&gt;--abandon&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eurqf95t\"&gt;halted: (still open) · 0 gateway calls · $0.0000&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u4hmjrm2\"&gt;⣽ run…  in flight&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-abcalcst\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fqdn2vqj\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hard-stop\"&gt;hard stop&lt;/a&gt;, &lt;a href=\"ru/glossary.html#abandoned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybk1ev23\"&gt;abandoned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"resume\"&gt;&lt;a href=\"ru/glossary.html#resume\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;--resume&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nlwnzayt\"&gt;--resume&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2lpetnh4\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt; продолжает прогон с того места, где он остановился. Theia читает журнал: готовые шаги не повторяются, прерванный шаг начинается заново, бюджет пересчитывается по записанным тратам. Слово в скобках в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r4n1h2oc\"&gt;resuming run …&lt;/code&gt; — состояние по журналу: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vu6ln9kq\"&gt;paused&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-71q6oys5\"&gt;live&lt;/code&gt; (прогон убили без паузы) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6yfe16gp\"&gt;finished&lt;/code&gt;. Продолженный прогон читает шину управления, а прогон, запущенный заново, — нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2s3qc59d\"&gt;resuming run run… (paused; budget 10.00 usd remaining)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yiiozsp8\"&gt;run branch: theia/run-47z2qh (resumed @ 3c0d7a9)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p78d6zqy\"&gt;resume: all tasks terminal (finished) — nothing to resume&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8v5h7iau\"&gt;paused&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget-remaining\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gl1kwsxe\"&gt;budget remaining&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;, &lt;a href=\"ru/reference/run.html#run\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2e22go2m\"&gt;theia run&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"stopping\"&gt;&lt;a href=\"ru/glossary.html#stopping\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;stopping&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mucyf7no\"&gt;stopping&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Мягкая остановка. Первый Ctrl+C или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-apcmh62h\"&gt;q&lt;/code&gt; в TUI просит прогон остановиться: новые шаги не начинаются, текущие доделываются, потом прогон встаёт на паузу.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-murjiot5\"&gt;--plain&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w5fgnln0\"&gt;--cli&lt;/code&gt; Ctrl+C из терминала получает и работающая команда проверки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8qel9or3\"&gt;--verify&lt;/code&gt;. Она погибает, и Theia записывает ложный провал &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h38ffkte\"&gt;verify_fail&lt;/code&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vrgo5uez\"&gt;exit null&lt;/code&gt;. В TUI такой проблемы нет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rd5fozje\"&gt;‖ stopping — in-flight verdicts landing…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-td578xxq\"&gt;stopping gracefully — in-flight verdicts will land; resume with: …&lt;/code&gt;, табло &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rooeu93l\"&gt;stopping — finishing in-flight verdicts…&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4i0t9up8\"&gt;paused&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hard-stop\"&gt;hard stop&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dispatch-boundary\"&gt;dispatch boundary&lt;/a&gt;, &lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"hard-stop\"&gt;&lt;a href=\"ru/glossary.html#hard-stop\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;hard stop&lt;/span&gt;&lt;/a&gt;hard stop&lt;/h3&gt;\n&lt;p&gt;Жёсткая остановка — второй Ctrl+C или второй &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rgkzo5h3\"&gt;q&lt;/code&gt; в TUI. Theia сразу завершает дочерние процессы и выходит с кодом 130. Записи о паузе в журнале нет, поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-duwvrzdi\"&gt;theia show&lt;/code&gt; пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yy3q2pkw\"&gt;halted: (still open)&lt;/code&gt;, но прогон можно продолжить через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e9hakglu\"&gt;--resume&lt;/code&gt;. Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t543l171\"&gt;reaper: swept N …&lt;/code&gt; в конце обычного прогона значит, что Theia закрыла оставшиеся лишние процессы.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0w2it8i5\"&gt;hard stop: swept 3 child process(es)/group(s); resume with: theia run --resume …&lt;/code&gt; (после сигнала; в TUI клавиша ничего не печатает).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h96gxpsx\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-martt9ny\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9axlplze\"&gt;--resume&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"anomaly\"&gt;&lt;a href=\"ru/glossary.html#anomaly\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;anomaly&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-51k86z0m\"&gt;anomaly&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия — предупреждение Theia о том, что в прогоне что-то пошло не так: сработала защита, вызов модели не удался, ответ нарушил правила. Каждая аномалия — событие журнала с видом и классом (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2xp5zt9i\"&gt;taxonomy&lt;/code&gt;). Классов одиннадцать: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xr5is2og\"&gt;reasoning&lt;/code&gt; — ошибка рассуждения модели, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rgomth9c\"&gt;planning&lt;/code&gt; — ошибка разбиения задачи, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ucjqscqy\"&gt;action&lt;/code&gt; — неверное действие, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qpuwpi2t\"&gt;memory&lt;/code&gt; — проблема с памятью, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1c8qlg0l\"&gt;environment&lt;/code&gt; — сбой среды, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h16f9e0h\"&gt;task_spec&lt;/code&gt; — плохая постановка задачи, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yllr8njh\"&gt;security&lt;/code&gt; — нарушение правил безопасности, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ky52dcex\"&gt;communication&lt;/code&gt; — сбой обмена между ролями, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xqj7tu3y\"&gt;trust&lt;/code&gt; — нарушение доверия, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vwj4ylyb\"&gt;emergent&lt;/code&gt; — непредвиденное поведение, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8e4zvy81\"&gt;termination&lt;/code&gt; — сработал ограничитель. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zlwi3exm\"&gt;theia diagnose&lt;/code&gt; считает аномалии по классам в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m8iblz6s\"&gt;taxonomy:&lt;/code&gt;. Сама по себе аномалия прогон не останавливает; что будет дальше, зависит от вида. Виды описаны ниже.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t4ur9w40\"&gt;!! anomaly    stop_and_fix taskId=… fails=3&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lohberc9\"&gt;· !! 2 anomalies&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h9rgootd\"&gt;‼ anomaly &amp;lt;kind&amp;gt; tsk…x ×3&lt;/code&gt;, заголовок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u5q72xrf\"&gt;anomalies 6&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ec0m180j\"&gt;taxonomy: reasoning=1 termination=1&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kyhzpc7x\"&gt;theia diagnose&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ftdcd5y1\"&gt;root cause&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"stop-and-fix\"&gt;&lt;a href=\"ru/glossary.html#stop-and-fix\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;stop_and_fix&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lfz84c83\"&gt;stop_and_fix&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Защита от бесконечных провалов проверки. После трёх &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k00jjo1s\"&gt;verify_fail&lt;/code&gt; подряд (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2qwvseng\"&gt;run.stopAndFixAfterFailures&lt;/code&gt;) Theia пишет аномалию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e3rht354\"&gt;stop_and_fix&lt;/code&gt; и отправляет задачу ведущему событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ux57g6oy\"&gt;stop_and_fix&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0kga1imu\"&gt;theia diagnose&lt;/code&gt; называет это &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e7qk61e1\"&gt;verification-loop&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y8czovwy\"&gt;!! anomaly    stop_and_fix taskId=… fails=3&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z0rmsbqx\"&gt;task.phase … stop_and_fix → escalated&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-frx61is2\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yggpx34q\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p43264o8\"&gt;root cause&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"round-budget\"&gt;&lt;a href=\"ru/glossary.html#round-budget\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;round_budget&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0bqv82uu\"&gt;round_budget&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: задача исчерпала лимит раундов (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fly0l2z4\"&gt;run.maxRoundsPerTask&lt;/code&gt;, по умолчанию 10). Шаг засчитывается как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u2vbem6s\"&gt;no_progress&lt;/code&gt;, и задача идёт к ведущему. На шагах, которые закрывают задачу или спрашивают вас (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-urh3i3fy\"&gt;approve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jc72yela\"&gt;lead_accept&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lvut6ry4\"&gt;lead_reverify&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r7spd2fc\"&gt;clarify&lt;/code&gt;), защита не срабатывает.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"ru/glossary.html#no-progress\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zdvfs6q0\"&gt;no_progress&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"rescope-budget\"&gt;&lt;a href=\"ru/glossary.html#rescope-budget\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;rescope_budget&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iym9r0w8\"&gt;rescope_budget&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: у ведущего кончились пересмотры задачи (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83xiz7ln\"&gt;run.maxRescopes&lt;/code&gt;, по умолчанию 2). Theia отбрасывает задачу событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gctend76\"&gt;lead_discard&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#rescope\"&gt;rescope&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead-discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ztls6xgw\"&gt;lead_discard&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fresh-perspective\"&gt;&lt;a href=\"ru/glossary.html#fresh-perspective\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fresh_perspective&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u7k0s7o2\"&gt;fresh_perspective&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия-отметка: после двух попыток в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gr8in4p5\"&gt;implement&lt;/code&gt; задачу берёт свежий исполнитель (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q9rk2n8v\"&gt;fresh_implementer&lt;/code&gt;). Это не ошибка, а смена подхода.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dpwwaw3f\"&gt;!! anomaly    fresh_perspective taskId=… dispatches=2&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fresh-implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dx4jge6u\"&gt;fresh_implementer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dispatch-stalled\"&gt;&lt;a href=\"ru/glossary.html#dispatch-stalled\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;dispatch_stalled&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f29j4ii8\"&gt;dispatch_stalled&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: три шага подряд по одной задаче закончились &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xjltdf45\"&gt;no_progress&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rhfgqdkr\"&gt;run.stallPauseAfter&lt;/code&gt;). Обычно это сбой среды: нет входа в движок, неверный маршрут, нет сети. Прогон встаёт на паузу, чтобы не тратить вызовы впустую. Исправьте причину и продолжите прогон через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v9odtp0g\"&gt;--resume&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9t0taiw6\"&gt;!! anomaly    dispatch_stalled taskId=… consecutive=3&lt;/code&gt;, затем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ffx3zuu3\"&gt;run.paused    rounds=8 (resumable)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#no-progress\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3xd4h62o\"&gt;no_progress&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#environment-failure\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qhb9fxlk\"&gt;environment_failure&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g9hadmti\"&gt;paused&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"environment-failure\"&gt;&lt;a href=\"ru/glossary.html#environment-failure\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;environment_failure&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xu1ppcua\"&gt;environment_failure&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: вызов модели не удался по вине среды, а не агента. Например, транспорт не зарегистрирован, нет входа в движок или процесс движка упал. Причина — в поле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xf42plmx\"&gt;reason=&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-si99oes9\"&gt;!! anomaly    environment_failure taskId=… role=lead phase=escalated reason=gateway fatal: …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#no-progress\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8n8ydqs3\"&gt;no_progress&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dispatch-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3qjzva5z\"&gt;dispatch_stalled&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-la8mrt6e\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"clarify-unanswered\"&gt;&lt;a href=\"ru/glossary.html#clarify-unanswered\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;clarify_unanswered&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ukupm4ay\"&gt;clarify_unanswered&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: на уточняющий вопрос никто не ответил — нет терминала, задан &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vubsr5pj\"&gt;--non-interactive&lt;/code&gt; или вы отказались отвечать. Задача замирает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hbc87bp2\"&gt;escalated&lt;/code&gt;, а ведущий узнаёт, что ответа не было.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0a3khc08\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iyd1tq02\"&gt;clarify_stalled&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"clarify-stalled\"&gt;&lt;a href=\"ru/glossary.html#clarify-stalled\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;clarify_stalled&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tbr5p0cs\"&gt;clarify_stalled&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: вопросы зашли в тупик — два вопроса подряд без ответа или три ответа подряд без других шагов. Прогон встаёт на паузу. Дальше решаете вы: дать указание или изменить настройки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rbclwnfw\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-whxgb6q6\"&gt;paused&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"illegal-verdict\"&gt;&lt;a href=\"ru/glossary.html#illegal-verdict\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;illegal_verdict&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wd6sqpmq\"&gt;illegal_verdict&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: роль ответила словом, которое в этой фазе не разрешено. Шаг засчитывается как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xfqgio93\"&gt;no_progress&lt;/code&gt;. В 0.2.201 эта же аномалия появляется, когда задачу остановила проверка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9prkbo2j\"&gt;pre-task&lt;/code&gt; или отказ по размеру контекста.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#no-progress\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qrlly57q\"&gt;no_progress&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#pre-task\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xcrinnxi\"&gt;pre-task&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c2yal5o0\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"planned-without-subtasks\"&gt;&lt;a href=\"ru/glossary.html#planned-without-subtasks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;planned_without_subtasks&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lvamn0pd\"&gt;planned_without_subtasks&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: планировщик ответил &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a0mkg1to\"&gt;planned&lt;/code&gt;, но подзадач не дал. Theia считает ответ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-62jb1889\"&gt;ready&lt;/code&gt;, и задача идёт к исполнителю, а не закрывается без кода.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gguq7kqu\"&gt;planned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planner\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zdvmsl1j\"&gt;planner&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"accept-unverified\"&gt;&lt;a href=\"ru/glossary.html#accept-unverified\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;accept_unverified&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j32y4tuy\"&gt;accept_unverified&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: ведущий попытался принять работу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4p30mlg6\"&gt;lead_accept&lt;/code&gt;) без успешной проверки. Theia работу не принимает и засчитывает шаг как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8v3gyaem\"&gt;no_progress&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#lead-accept\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hosmp6pa\"&gt;lead_accept&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a89r4bvg\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"delegation-refused\"&gt;&lt;a href=\"ru/glossary.html#delegation-refused\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;delegation_refused&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-746yw3k5\"&gt;delegation_refused&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: подзадачи предложила роль, которой это нельзя. Делить задачу могут только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wiwi9jm3\"&gt;planner&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8q667u1k\"&gt;lead&lt;/code&gt;. Подзадачи не создаются.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#planner\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ognat9a\"&gt;planner&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m8lhru1j\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"delegation-depth\"&gt;&lt;a href=\"ru/glossary.html#delegation-depth\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;delegation_depth&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j31iwmaw\"&gt;delegation_depth&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: подзадачи вложены слишком глубоко. По умолчанию разрешён один уровень (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-typcj5qf\"&gt;run.maxDelegationDepth&lt;/code&gt;). Новые подзадачи не создаются.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#delegation-fanout\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mi9rdw4c\"&gt;delegation_fanout&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jlqhe4uv\"&gt;planned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"delegation-fanout\"&gt;&lt;a href=\"ru/glossary.html#delegation-fanout\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;delegation_fanout&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-23kowd8l\"&gt;delegation_fanout&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: за один ответ предложено больше подзадач, чем можно (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wl2zlspo\"&gt;run.maxDelegationFanout&lt;/code&gt;, по умолчанию 4). Theia создаёт только первые четыре.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#delegation-depth\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ux77foya\"&gt;delegation_depth&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lfwvnlzh\"&gt;planned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"replay-miss\"&gt;&lt;a href=\"ru/glossary.html#replay-miss\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;replay_miss&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ypqe414p\"&gt;replay_miss&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия режима повтора записанных вызовов: для запроса нет сохранённого ответа. Нужна разработчикам платформы при проверке повторяемости. С командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-he0d9ubk\"&gt;theia replay&lt;/code&gt; не связана: та модель не вызывает.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#recording\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yk9sok63\"&gt;--record&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hybrid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7omzwy2g\"&gt;hybrid&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"changeset-partial\"&gt;&lt;a href=\"ru/glossary.html#changeset-partial\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;changeset_partial&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t21tgag7\"&gt;changeset_partial&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия прогона с несколькими корнями: часть связанных слияний легла, а часть — нет. Theia либо откатывает уже слитое (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ubk1yc8\"&gt;revert&lt;/code&gt;, по умолчанию), либо замораживает задачи (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bi8gmih0\"&gt;freeze&lt;/code&gt;), и называет недоделанный набор. Выбор задаёт параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d92hs83y\"&gt;run.changesetPartialFailure&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-changeset\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zdu7live\"&gt;run.changeset&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-money\"&gt;&lt;a href=\"ru/glossary.html#group-money\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деньги&lt;/span&gt;&lt;/a&gt;Деньги&lt;/h2&gt;\n&lt;h3 id=\"budget\"&gt;&lt;a href=\"ru/glossary.html#budget\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;budget&lt;/span&gt;&lt;/a&gt;budget&lt;/h3&gt;\n&lt;p&gt;Бюджет — лимит денег на прогон в долларах США. По умолчанию 10 (параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cega6ue9\"&gt;run.maxUsdPerRun&lt;/code&gt;). Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8nw6hyf\"&gt;--budget&lt;/code&gt; меняет его, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3sqh90c3\"&gt;0&lt;/code&gt; снимает лимит. Theia фиксирует цену каждого &lt;a href=\"ru/glossary.html#gateway-call\"&gt;вызова шлюза&lt;/a&gt; и вычитает её из бюджета.&lt;/p&gt;\n&lt;p&gt;Когда деньги кончаются, прогон не останавливается навсегда, а встаёт на паузу: аномалии &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-74q3z0oo\"&gt;budget_exhausted&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-02m5969u\"&gt;budget_freeze&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hsmvw8e8\"&gt;halted: paused&lt;/code&gt;. Продолжить можно с новым бюджетом: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-412cq1bz\"&gt;theia run --resume &amp;lt;runId&amp;gt; --budget &amp;lt;N&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Слово встречается и в других смыслах:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wjz5m64p\"&gt;halted: budget&lt;/code&gt; — не деньги, а потолок в 1000 вердиктов на прогон.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-prtkvsb3\"&gt;round_budget&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lhgm5ahe\"&gt;rescope_budget&lt;/code&gt; — лимиты раундов и пересмотров задачи.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8j6zndmd\"&gt;--budget&lt;/code&gt; у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-szepnvn4\"&gt;theia fork&lt;/code&gt; (по умолчанию 5), у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ccc816pz\"&gt;theia probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hd8r41t4\"&gt;theia ask&lt;/code&gt; (по умолчанию 1), у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mr79rery\"&gt;theia index build&lt;/code&gt; — свой лимит для этих команд.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hjie0zx6\"&gt;indexBuildBudgetUsd&lt;/code&gt; — лимит на автоматическую сборку индекса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4p9804gf\"&gt;run.created   budget=$10 track=fast_path&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v2orioc1\"&gt;$0.0000/$10.00&lt;/code&gt; в заголовке TUI и на табло, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-84pjtcul\"&gt;budget remaining: 10&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget-remaining\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x2auwpso\"&gt;budget remaining&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unmetered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qwz79nfp\"&gt;unmetered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget-freeze\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dma7i39v\"&gt;budget_freeze&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aw7detde\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"budget-remaining\"&gt;&lt;a href=\"ru/glossary.html#budget-remaining\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;budget remaining&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zeqv3ly1\"&gt;budget remaining&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-20o1rjyk\"&gt;budget remaining: 10&lt;/code&gt; в конце прогона — сколько долларов бюджета осталось. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qca2sev2\"&gt;unmetered&lt;/code&gt; — лимита нет. При продолжении прогона Theia пересчитывает остаток по записанным тратам и пишет его в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ie0i4m7c\"&gt;resuming run …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gch0nbrc\"&gt;budget remaining: 10&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-164akddj\"&gt;budget remaining: unmetered&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h01qakj1\"&gt;resuming run run… (paused; budget 10.00 usd remaining)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unmetered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cbufhcuh\"&gt;unmetered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqnhwqv1\"&gt;--resume&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"unmetered\"&gt;&lt;a href=\"ru/glossary.html#unmetered\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;unmetered&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l1aghb47\"&gt;unmetered&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Без денежного лимита: так работает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h6tiuvwo\"&gt;--budget 0&lt;/code&gt;. Защита от зацикливания при этом остаётся: лимиты раундов и пересмотров, потолок вердиктов. В событии &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bt9p6at6\"&gt;run.created&lt;/code&gt; лимит без денег записан как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5h1btkgb\"&gt;budget=$null&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1gg6rev3\"&gt;budget: 0 = unmetered (loop guards stay: maxTotalRounds, round/rescope budgets)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rw160811\"&gt;budget remaining: unmetered&lt;/code&gt;, табло &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4yjdd01e\"&gt;$0.0000 spent&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget-remaining\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rce2xyi2\"&gt;budget remaining&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k66iyrwy\"&gt;halted&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"budget-exhausted\"&gt;&lt;a href=\"ru/glossary.html#budget-exhausted\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;budget_exhausted&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nk1ezicz\"&gt;budget_exhausted&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: шлюз отказал в вызове модели, потому что бюджет прогона кончился. Сразу за ней идёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q9sflo6i\"&gt;budget_freeze&lt;/code&gt;, а вызов в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pncutx2x\"&gt;--plain&lt;/code&gt; помечен &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jcfmp9c3\"&gt;→ fatal&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0k27yz9d\"&gt;!! anomaly    budget_exhausted role=implementer transport=…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bkin7dju\"&gt;gateway fatal: gateway: usd budget exhausted for this run (THE-024)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget-freeze\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-psn4lpzx\"&gt;budget_freeze&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"budget-freeze\"&gt;&lt;a href=\"ru/glossary.html#budget-freeze\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;budget_freeze&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-giav7xys\"&gt;budget_freeze&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: прогон встаёт на паузу, потому что кончились деньги. Появляется один раз за прогон. Продолжить можно с новым бюджетом: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmmc57l3\"&gt;theia run --resume &amp;lt;runId&amp;gt; --budget &amp;lt;N&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-von54ure\"&gt;!! anomaly    budget_freeze taskId=… role=implementer&lt;/code&gt;, затем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8vsedrw\"&gt;run.paused … (resumable)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget-exhausted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ynueykol\"&gt;budget_exhausted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ia24ffwx\"&gt;paused&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-call\"&gt;&lt;a href=\"ru/glossary.html#gateway-call\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;gateway call&lt;/span&gt;&lt;/a&gt;gateway call&lt;/h3&gt;\n&lt;p&gt;Вызов шлюза — один запрос к модели через шлюз. Theia записывает в журнал каждый такой вызов с ролью, транспортом, итогом и ценой, даже отклонённый. Команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4klcuwrh\"&gt;--verify&lt;/code&gt;, слияние git и ответы, взятые из записи, вызовами шлюза не считаются.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eaervr7t\"&gt;gateway       &amp;lt;role&amp;gt;@&amp;lt;transport&amp;gt; → ok $0.0000&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e5q9pnon\"&gt;4 gateway calls&lt;/code&gt;, заголовок TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2z7v51fz\"&gt;4 calls&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k7n57qj9\"&gt;· gateway &amp;lt;transport&amp;gt; ok $0.0000&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway\"&gt;gateway&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#locked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qdeh6zdq\"&gt;locked&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"locked\"&gt;&lt;a href=\"ru/glossary.html#locked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;locked&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-guj5frt5\"&gt;locked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wbxgkxdk\"&gt;$0.0000 locked&lt;/code&gt; — цена, зафиксированная в момент вызова. Theia её не пересчитывает, даже если тарифы потом изменятся.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vz63dvcs\"&gt;rate: … $0.0000 locked (6ms)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mqv1ony1\"&gt;theia index build&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"ru/glossary.html#pricing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d3feq2zf\"&gt;kind: Pricing&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"pricing\"&gt;&lt;a href=\"ru/glossary.html#pricing\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;kind: Pricing&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fdaxajvw\"&gt;kind: Pricing&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Необязательный манифест с тарифами моделей (долларов за миллион токенов) и способом расчёта цены для транспорта: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6wqylrfy\"&gt;costBasis: list&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-409hivb0\"&gt;actual&lt;/code&gt;. Нужен, когда цены по умолчанию вам не подходят, например для подписки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/glossary.html#locked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o5sk3u9k\"&gt;locked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-maxusdperrun\"&gt;&lt;a href=\"ru/glossary.html#run-maxusdperrun\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run.maxUsdPerRun&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u23w83ge\"&gt;run.maxUsdPerRun&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Бюджет прогона по умолчанию в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bg4p9cp3\"&gt;policy.yaml&lt;/code&gt;: 10 долларов. Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4hrx6yeb\"&gt;--budget&lt;/code&gt; важнее. Имя параметра печатается в отказе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q5gud380\"&gt;run --from-plan&lt;/code&gt;, когда бюджет меньше оценки цены плана.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mf2jd22g\"&gt;run: plan floor ~$… exceeds budget $… — pass --budget N explicitly, raise run.maxUsdPerRun, or --budget 0 (unmetered)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#cost-estimate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z3m1mri2\"&gt;cost estimate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-git\"&gt;&lt;a href=\"ru/glossary.html#group-git\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Git&lt;/span&gt;&lt;/a&gt;Git&lt;/h2&gt;\n&lt;h3 id=\"run-branch\"&gt;&lt;a href=\"ru/glossary.html#run-branch\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run branch&lt;/span&gt;&lt;/a&gt;run branch&lt;/h3&gt;\n&lt;p&gt;Ветка прогона — git-ветка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kybwtfem\"&gt;theia/run-&amp;lt;6 символов&amp;gt;&lt;/code&gt;, в которую Theia сливает готовые задачи. Шесть символов — конец идентификатора прогона. Ветка начинается от базы, а ваша текущая ветка не меняется. Ветку занимает скрытая рабочая копия git в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iej81406\"&gt;.theia/runs/&amp;lt;runId&amp;gt;/trunk&lt;/code&gt;, поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1j3gyinl\"&gt;git switch&lt;/code&gt; на неё не сработает. Забрать работу можно через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w6ceo4to\"&gt;git merge&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В конце прогона Theia пишет, что лежит в ветке: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2dak9wef\"&gt;— N merges ahead of base&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7o09llfu\"&gt;— no merges landed (branch left at base for inspection)&lt;/code&gt;. Число в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fvpdqttq\"&gt;merges ahead of base&lt;/code&gt; считает коммиты, а не слияния. Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4tp76huv\"&gt;--branch&lt;/code&gt; задаёт своё имя ветки, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k1gzyv0g\"&gt;--base&lt;/code&gt; — свою базу, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybce0917\"&gt;--no-run-branch&lt;/code&gt; отключает ветку прогона: слияния тогда идут прямо в вашу текущую ветку.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1hnrxa91\"&gt;run branch: theia/run-esbyig (base HEAD (no origin remote) @ 4fb42d7)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nzm2mt14\"&gt;run branch theia/run-7adeu2 @ 0d391ae — 2 merges ahead of base; …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#base\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3x0uhgcb\"&gt;base&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#trunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-igvib0rt\"&gt;trunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-branch\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-69i6d8dl\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nuci2pw1\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"base\"&gt;&lt;a href=\"ru/glossary.html#base\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;base&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lujaxc4k\"&gt;base&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;База — коммит, от которого начинается ветка прогона. Theia берёт upstream текущей ветки, если его нет — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0zfwg4ur\"&gt;origin/HEAD&lt;/code&gt;, иначе локальный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i0ru5j8t\"&gt;HEAD&lt;/code&gt;. Локальные коммиты, которых ещё нет в upstream, в работу прогона не попадут. Чтобы их включить, передайте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hwfyeo64\"&gt;--base HEAD&lt;/code&gt;. Заметка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mdzdsx4r\"&gt;[workspace_base]&lt;/code&gt; и строка TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uqp0bzo1\"&gt;workspace @ 209a8f6 (copy)&lt;/code&gt; показывают, с какого коммита сделана копия задачи.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ou1vupuv\"&gt;run branch: theia/run-5yrymu (base origin/main @ d2946e5)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aap9oy6p\"&gt;(base HEAD (no origin remote) @ 4fb42d7)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"trunk\"&gt;&lt;a href=\"ru/glossary.html#trunk\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;trunk&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ztablbwx\"&gt;trunk&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Папка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fm2rdexm\"&gt;.theia/runs/&amp;lt;runId&amp;gt;/trunk&lt;/code&gt; — скрытая рабочая копия git, в которой открыта ветка прогона. Пока она есть, git не даёт переключиться на ветку прогона или удалить её. Перед удалением ветки выполните &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5lh0n2ll\"&gt;git worktree remove .theia/runs/&amp;lt;runId&amp;gt;/trunk&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-dir\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zv0ggbqd\"&gt;.theia&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#prunable\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o3qjab2k\"&gt;prunable&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"prunable\"&gt;&lt;a href=\"ru/glossary.html#prunable\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;prunable&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e37i1e20\"&gt;prunable&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Пометка git, а не Theia. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6slvjrsq\"&gt;git worktree list&lt;/code&gt; ставит её у записи рабочего дерева, папка которого уже удалена: например, после того как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vi52ch70\"&gt;theia prune&lt;/code&gt; удалил &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zvxjouwe\"&gt;.theia/runs/&amp;lt;runId&amp;gt;/trunk&lt;/code&gt;. Сама запись при этом остаётся в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-prp5z415\"&gt;.git/worktrees&lt;/code&gt;. Её убирает команда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cxbgzgmi\"&gt;git worktree prune&lt;/code&gt;; ветку &lt;co
