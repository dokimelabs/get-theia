board-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oh6gju49\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead-reverify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1kjey4jk\"&gt;lead_reverify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"review\"&gt;&lt;a href=\"ru/glossary.html#review\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;review&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kd6dciom\"&gt;review&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Фаза, в которой рецензент смотрит изменения задачи. Дальше: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5auuj2d5\"&gt;approve&lt;/code&gt; ведёт к слиянию, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k4wiggc0\"&gt;rework&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l063yq71\"&gt;discard&lt;/code&gt; — к арбитру.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sp7fmurm\"&gt;task.phase … verify_pass → review&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#reviewer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c01yk05o\"&gt;reviewer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#approve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-al2psjlw\"&gt;approve&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#rework\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gdzf2uxh\"&gt;rework&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-quz05gev\"&gt;discard&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"merge\"&gt;&lt;a href=\"ru/glossary.html#merge\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;merge&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-srsknkdg\"&gt;merge&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Слияние (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e55f9acd\"&gt;merge&lt;/code&gt;) — фаза, в которой Theia вливает работу задачи в ветку прогона обычным git. Модель здесь не работает. Слияния идут по одному. После успеха копия задачи удаляется, а ветка задачи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-orain900\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt; остаётся в вашем репозитории. Не путайте фазу &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dxi9lzw2\"&gt;merge&lt;/code&gt; с итогом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zjinjmmx\"&gt;merged&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybxhvmrd\"&gt;task.phase … approve → merge&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merger\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t9q8muml\"&gt;merger&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p75v56jk\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merge-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-glv6c12a\"&gt;merge_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-branch\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c8u6asqs\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"arbitrate\"&gt;&lt;a href=\"ru/glossary.html#arbitrate\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;arbitrate&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qhrpobbb\"&gt;arbitrate&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Фаза, в которой арбитр решает спор: ещё одна попытка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1p01cirb\"&gt;arb_continue&lt;/code&gt; → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yfezcd5i\"&gt;implement&lt;/code&gt;) или передать задачу ведущему (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1txudmnl\"&gt;arb_escalate&lt;/code&gt; → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4shnpeyb\"&gt;escalated&lt;/code&gt;). Сюда задача приходит после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-st1sgo2s\"&gt;rework&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dpats82z\"&gt;discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tfz5htr6\"&gt;merge_fail&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ydsnz4ak\"&gt;cant_do&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8x37kdeo\"&gt;task.phase … merge_fail → arbitrate&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#arbiter\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v3olov9w\"&gt;arbiter&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arb-continue\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rv65sinx\"&gt;arb_continue&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arb-escalate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3z79q7kg\"&gt;arb_escalate&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"escalated\"&gt;&lt;a href=\"ru/glossary.html#escalated\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;escalated&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tnloy9cw\"&gt;escalated&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Задача застряла и ждёт ведущего (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8roltxzt\"&gt;lead&lt;/code&gt;). Сюда ведут &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ikjdpbha\"&gt;arb_escalate&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gm6jxtix\"&gt;stop_and_fix&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mp90go78\"&gt;algedonic&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mm3xhzv7\"&gt;no_progress&lt;/code&gt; и уточняющий вопрос без ответа. В TUI такая задача помечена &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ji0jv47p\"&gt;◆&lt;/code&gt; и считается &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jzil9klu\"&gt;frozen&lt;/code&gt;. Если прогон встал на паузу или его закрыли, задача так и остаётся &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zfxyod8l\"&gt;escalated&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pz95g1vd\"&gt;task.phase … arb_escalate → escalated&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tj1isn9w\"&gt;◆ ▼ tsk…fd7pn6tz [fast_path]  escalated  r9&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x3qjhx8i\"&gt;tasks: … 1 frozen&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o112r1wp\"&gt;lead&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#frozen\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-697co8f7\"&gt;frozen&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#no-progress\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fhxxjins\"&gt;no_progress&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stop-and-fix\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vi6sswii\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"planned\"&gt;&lt;a href=\"ru/glossary.html#planned\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;planned&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yjs6khqt\"&gt;planned&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Итоговая фаза пункта-плана. Планировщик ответил &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ui85o3ip\"&gt;planned&lt;/code&gt; и разбил задачу на подзадачи: работу делают подзадачи, а сам пункт закрыт. Если &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dg7xosc2\"&gt;planned&lt;/code&gt; пришёл без подзадач, Theia считает его ответом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mokzg9yo\"&gt;ready&lt;/code&gt; и пишет аномалию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gbq8ep5i\"&gt;planned_without_subtasks&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#planner\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kyvxaffv\"&gt;planner&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9prme59d\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planned-without-subtasks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s0jefeu5\"&gt;planned_without_subtasks&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"merged\"&gt;&lt;a href=\"ru/glossary.html#merged\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;merged&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nao2c3z5\"&gt;merged&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Итог задачи: работа слита в ветку прогона. В строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qf00h29w\"&gt;task.phase … merged → merged&lt;/code&gt; слово стоит дважды: первое — событие (слияние прошло), второе — новая фаза. В режиме &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-64xq6irg\"&gt;--in-place&lt;/code&gt; слияния нет, и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ha7mx1ir\"&gt;merged&lt;/code&gt; только отмечает, что работу приняли.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4gakd7w7\"&gt;verdict … merger → merged (1 evidence)&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ge8wg7h\"&gt;tsk… → merged (4 rounds)&lt;/code&gt;, счётчик &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wi88c7n9\"&gt;done&lt;/code&gt; в TUI.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g6ormvv3\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-place\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cwdfcknw\"&gt;--in-place&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#done\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yda351jl\"&gt;done&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"discarded\"&gt;&lt;a href=\"ru/glossary.html#discarded\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;discarded&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dlq6t6i4\"&gt;discarded&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Итог задачи: работа отброшена и в ветку прогона не попала. Отбрасывает только ведущий событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-momzqulb\"&gt;lead_discard&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p0t10s8z\"&gt;discard&lt;/code&gt; рецензента лишь отправляет задачу к арбитру. Копия задачи остаётся для разбора. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bq51pgm4\"&gt;theia run&lt;/code&gt; с отброшенной задачей завершается с кодом 1. В TUI такая задача помечена &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yc3v9rb5\"&gt;✖&lt;/code&gt; и считается &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-630n95du\"&gt;failed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0nbi9bfm\"&gt;task.phase … lead_discard → discarded&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rbvfjgvh\"&gt;tsk… → discarded (6 rounds)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f0dxmthv\"&gt;tasks: 0 running · 0 done · 1 failed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#lead-discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8h5d5su1\"&gt;lead_discard&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nvvbamx3\"&gt;discard&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#failed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ozv6se1e\"&gt;failed&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#completed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zk4ndoaj\"&gt;completed&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"done\"&gt;&lt;a href=\"ru/glossary.html#done\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;done&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-snvltwhq\"&gt;done&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У слова два смысла:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;В TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z8wmr9ez\"&gt;N done&lt;/code&gt; — число задач с хорошим итогом: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s3jqsv7j\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jlxx1d72\"&gt;planned&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Итоговая фаза &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lt93ztrk\"&gt;done&lt;/code&gt; есть в коде Theia, но в 0.2.201 ни один шаг к ней не ведёт.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uo2bstw9\"&gt;tasks: 0 running · 1 done · …&lt;/code&gt; в заголовке TUI.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-py3hshbv\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oo7nhicy\"&gt;planned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-events\"&gt;&lt;a href=\"ru/glossary.html#group-events\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вердикты и события журнала&lt;/span&gt;&lt;/a&gt;Вердикты и события журнала&lt;/h2&gt;\n&lt;h3 id=\"verdict\"&gt;&lt;a href=\"ru/glossary.html#verdict\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;verdict&lt;/span&gt;&lt;/a&gt;verdict&lt;/h3&gt;\n&lt;p&gt;Вердикт — ответ роли на свой шаг: короткое слово и ссылки на доказательства. Модель отвечает словом из своего списка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wjuiie2g\"&gt;pass&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8cf20pw5\"&gt;approve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ob0xqlaf\"&gt;continue&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2co0v6pa\"&gt;rescope&lt;/code&gt;…), а Theia печатает событие (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j89zrh05\"&gt;verify_pass&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5wzr9zk1\"&gt;approve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jh5yjmac\"&gt;arb_continue&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f0sindgl\"&gt;lead_rescope&lt;/code&gt;). Поэтому в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-065v6nb1\"&gt;--plain&lt;/code&gt; вы видите &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-17ktz7eg\"&gt;verify_pass&lt;/code&gt;, а не &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n65v1zaa\"&gt;pass&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-053z7egd\"&gt;verdict&lt;/code&gt; показывает, что ответила роль. Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dhf7r1xp\"&gt;task.phase&lt;/code&gt; сразу за ней — что применила Theia. Они могут различаться: например, третий &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ni4utbm9\"&gt;verify_fail&lt;/code&gt; подряд Theia применяет как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nuzcntxh\"&gt;stop_and_fix&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-awrm65y9\"&gt;verdict &amp;lt;task&amp;gt; &amp;lt;роль&amp;gt; → &amp;lt;событие&amp;gt; (N evidence)  “&amp;lt;комментарий&amp;gt;”&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8jmx1tpa\"&gt;r2 verify  verifier → verify_pass&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#evidence\"&gt;evidence&lt;/a&gt;, &lt;a href=\"ru/glossary.html#task-phase\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-os6evfpg\"&gt;task.phase&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#phase\"&gt;phase&lt;/a&gt;, &lt;a href=\"ru/glossary.html#round\"&gt;round&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"start\"&gt;&lt;a href=\"ru/glossary.html#start\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;start&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bg1ggpv5\"&gt;start&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Событие начала задачи на треке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5tawp0s\"&gt;full_spec&lt;/code&gt;: задача переходит из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0n916tbd\"&gt;draft&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-snyfykfk\"&gt;plan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f5gt1x30\"&gt;task.phase … start → plan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ll2kifff\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ready\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ec8kx29l\"&gt;ready&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ready\"&gt;&lt;a href=\"ru/glossary.html#ready\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;ready&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-emrtbbnb\"&gt;ready&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;«Готово, дальше». Одно слово для трёх переходов: новая задача &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pacn18v3\"&gt;fast_path&lt;/code&gt; идёт в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q6ok7zmq\"&gt;implement&lt;/code&gt;; планировщик закончил, и задача идёт в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xks4ag47\"&gt;implement&lt;/code&gt;; исполнитель закончил, и задача идёт в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lob5d1ot\"&gt;verify&lt;/code&gt;. Какой переход случился, видно по фазе после стрелки.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-flssf309\"&gt;task.phase … ready → implement&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2nq9b62b\"&gt;task.phase … ready → verify&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a6bdhtwx\"&gt;implementer → ready&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fast-path\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9bkqqo0s\"&gt;fast_path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8lxsw10l\"&gt;implement&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3cd1lh9y\"&gt;verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"cant-do\"&gt;&lt;a href=\"ru/glossary.html#cant-do\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;cant_do&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p3rtbur8\"&gt;cant_do&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Исполнитель сообщает, что не может выполнить задачу. Задача идёт к арбитру. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-scimlr8n\"&gt;theia diagnose&lt;/code&gt; называет такой случай &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e6vddoti\"&gt;capability-gap&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9bacvwx9\"&gt;implementer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yl0e8dw3\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jl3kb6h5\"&gt;root cause&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"algedonic\"&gt;&lt;a href=\"ru/glossary.html#algedonic\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;algedonic&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ofg5k5h\"&gt;algedonic&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Сигнал серьёзной проблемы от исполнителя или планировщика: дело не в этой попытке, а в чём-то большем. Задача сразу идёт к ведущему, минуя проверку и рецензию.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8zxhhhi5\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zhqhlwi3\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verify-pass\"&gt;&lt;a href=\"ru/glossary.html#verify-pass\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;verify_pass&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-smfmtkgr\"&gt;verify_pass&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Проверка прошла: все команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dhd9rawr\"&gt;--verify&lt;/code&gt; завершились с кодом 0, или модель-проверяющий ответил &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3i634uli\"&gt;pass&lt;/code&gt;. Задача идёт к рецензенту.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1wg6po1b\"&gt;verdict … verifier → verify_pass (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sbldxw9a\"&gt;task.phase … verify_pass → review&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7iu8oll8\"&gt;verify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verifier\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gumqu8vc\"&gt;verifier&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gxnyt7wm\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verify-fail\"&gt;&lt;a href=\"ru/glossary.html#verify-fail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;verify_fail&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9dusigq7\"&gt;verify_fail&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Проверка не прошла: одна из команд вернула ненулевой код, остальные команды после неё пропускаются. Задача возвращается к исполнителю. После трёх провалов подряд (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ucjtzx8k\"&gt;run.stopAndFixAfterFailures&lt;/code&gt;) Theia прерывает цикл событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-50k12f2c\"&gt;stop_and_fix&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ko9ydaw\"&gt;verifier → verify_fail (1 evidence)  “$ false → exit 1 (no output)”&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-34aqk1un\"&gt;task.phase … verify_fail → implement&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rlqskjj6\"&gt;verify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stop-and-fix\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zagtb52n\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead-reverify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lw5qej8g\"&gt;lead_reverify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"approve\"&gt;&lt;a href=\"ru/glossary.html#approve\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;approve&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-smtkiij9\"&gt;approve&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Рецензент принял изменения. Задача идёт к слиянию.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uqxrcmfk\"&gt;verdict … reviewer → approve (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lj5l67wh\"&gt;task.phase … approve → merge&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#reviewer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i55hhena\"&gt;reviewer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0qcp55rh\"&gt;merge&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"rework\"&gt;&lt;a href=\"ru/glossary.html#rework\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;rework&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-92zebber\"&gt;rework&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Рецензент просит доработать. Задача идёт к арбитру, который обычно возвращает её исполнителю. Замечание рецензента получат следующие попытки. Если &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bjt9f97r\"&gt;rework&lt;/code&gt; повторяется, а проверки проходят, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9kp9q7w7\"&gt;theia diagnose&lt;/code&gt; называет это &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v6eo7pct\"&gt;review-loop&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#reviewer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ga4s5ek6\"&gt;reviewer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-swlm5ip0\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hjhqf877\"&gt;root cause&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"discard\"&gt;&lt;a href=\"ru/glossary.html#discard\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;discard&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vuy3sh3a\"&gt;discard&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Рецензент отклоняет изменения. Задача при этом не отброшена: она идёт к арбитру. Отбросить задачу может только ведущий, событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3lv84x9a\"&gt;lead_discard&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hfcybw12\"&gt;task.phase … discard → arbitrate&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#lead-discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-23pmr6xd\"&gt;lead_discard&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vgoc74qt\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lesa4wl4\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"merge-fail\"&gt;&lt;a href=\"ru/glossary.html#merge-fail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;merge_fail&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-avnpwnqs\"&gt;merge_fail&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Слияние не удалось. Причина — в комментарии вердикта, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q1q4zgyv\"&gt;no commits on the task branch&lt;/code&gt; (в копии задачи нет коммитов), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ics46b3c\"&gt;uncommitted work left in workspace&lt;/code&gt; (остались незакоммиченные правки) или конфликт. Задача идёт к арбитру.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4x3aa1or\"&gt;verdict … merger → merge_fail (1 evidence)  “no commits on the task branch”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merger\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7wqh4hrx\"&gt;merger&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#precheck\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hbom4s2q\"&gt;precheck&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ptz9kh65\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"arb-continue\"&gt;&lt;a href=\"ru/glossary.html#arb-continue\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;arb_continue&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-udld5hvc\"&gt;arb_continue&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Арбитр решил попробовать ещё раз. Задача возвращается в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3pjkwah9\"&gt;implement&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#arbiter\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q1o9pyuo\"&gt;arbiter&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-43duzh8c\"&gt;implement&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"arb-escalate\"&gt;&lt;a href=\"ru/glossary.html#arb-escalate\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;arb_escalate&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-agyklld9\"&gt;arb_escalate&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Арбитр передаёт задачу ведущему. Задача переходит в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0iqrgpfj\"&gt;escalated&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mex7vay7\"&gt;verdict … arbiter → arb_escalate (1 evidence)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#arbiter\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tmlfj80w\"&gt;arbiter&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ksdziii0\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l4udpqzx\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"rescope\"&gt;&lt;a href=\"ru/glossary.html#rescope\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;rescope&lt;/span&gt;&lt;/a&gt;rescope&lt;/h3&gt;\n&lt;p&gt;Пересмотр задачи (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8p7aglex\"&gt;rescope&lt;/code&gt;) — ведущий перезапускает застрявшую задачу с новым направлением. В выводе это событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9enoeor7\"&gt;lead_rescope&lt;/code&gt;. Задача возвращается к исполнителю, счётчик раундов обнуляется, а текст ведущего попадает в указания для этой задачи. Заодно ведущий может заменить команды проверки.&lt;/p&gt;\n&lt;p&gt;Пересматривать можно 2 раза на задачу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-952u9tai\"&gt;run.maxRescopes&lt;/code&gt;). На третий раз Theia пишет аномалию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3i6hid7f\"&gt;rescope_budget&lt;/code&gt; и отбрасывает задачу. Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-216rcnz9\"&gt;--max-rescopes&lt;/code&gt; меняет лимит на один прогон. Во флаге &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aev8tsbt\"&gt;0&lt;/code&gt; значит «без лимита», а в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-quw6qd05\"&gt;policy.yaml&lt;/code&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ueo1jijf\"&gt;0&lt;/code&gt; значит «пересматривать нельзя».&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#lead-rescope\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1d7t119v\"&gt;lead_rescope&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#rescope-budget\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gpa21cyu\"&gt;rescope_budget&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e7c59964\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lead-rescope\"&gt;&lt;a href=\"ru/glossary.html#lead-rescope\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lead_rescope&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tjaizv0d\"&gt;lead_rescope&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ведущий пересматривает задачу: она возвращается в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n60qiyqm\"&gt;implement&lt;/code&gt; с новым направлением. Подробнее — в статье &lt;a href=\"ru/glossary.html#rescope\"&gt;rescope&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#rescope\"&gt;rescope&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ze26fv4t\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lead-accept\"&gt;&lt;a href=\"ru/glossary.html#lead-accept\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lead_accept&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-silhbm4f\"&gt;lead_accept&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ведущий принимает работу как готовую, и задача идёт к слиянию. Theia разрешает это только после успешной проверки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fhdwtlji\"&gt;verify_pass&lt;/code&gt;). Без неё Theia пишет аномалию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4gts2pi\"&gt;accept_unverified&lt;/code&gt; и засчитывает шаг как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uu7vvm92\"&gt;no_progress&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4jckgwpr\"&gt;lead&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j2fmvlr3\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#accept-unverified\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-crf3qszv\"&gt;accept_unverified&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lead-reverify\"&gt;&lt;a href=\"ru/glossary.html#lead-reverify\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lead_reverify&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rxjv2cb4\"&gt;lead_reverify&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ведущий просит проверить работу ещё раз без нового шага исполнителя: задача возвращается в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-leeebh3a\"&gt;verify&lt;/code&gt;. Заодно ведущий может заменить команды проверки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-16krpc47\"&gt;lead&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0x2cnetj\"&gt;verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lead-discard\"&gt;&lt;a href=\"ru/glossary.html#lead-discard\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lead_discard&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s1eemjpu\"&gt;lead_discard&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ведущий отбрасывает задачу. Это единственный путь к итогу &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8mglt2id\"&gt;discarded&lt;/code&gt;. К нему же Theia приводит задачу, когда у ведущего кончились пересмотры.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fgyl8ont\"&gt;verdict … lead → lead_discard (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ct9j90j5\"&gt;task.phase … lead_discard → discarded&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-134a0qt2\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#rescope-budget\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-egfysjc4\"&gt;rescope_budget&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-anotolli\"&gt;discard&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"no-progress\"&gt;&lt;a href=\"ru/glossary.html#no-progress\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;no_progress&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8p5352dk\"&gt;no_progress&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Шаг ничего не дал. Это событие создаёт сама Theia, а не модель: вызов модели не удался, ответ модели дважды оказался не по правилам, роль ответила недопустимым словом или кончился лимит раундов. Задача переходит в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x1pcchfi\"&gt;escalated&lt;/code&gt;. После трёх &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-99wwly91\"&gt;no_progress&lt;/code&gt; подряд (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-27f8mh9z\"&gt;run.stallPauseAfter&lt;/code&gt;) прогон встаёт на паузу с аномалией &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nivia7kw\"&gt;dispatch_stalled&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-044udhyc\"&gt;verdict … lead → no_progress (0 evidence)  “gateway fatal: gateway: transport 'nope' is not manifest-re…”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-die7qe1q\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dispatch-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4kcvaobz\"&gt;dispatch_stalled&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#environment-failure\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ghi3mmd\"&gt;environment_failure&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#illegal-verdict\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8b841zdv\"&gt;illegal_verdict&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"evidence\"&gt;&lt;a href=\"ru/glossary.html#evidence\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;evidence&lt;/span&gt;&lt;/a&gt;evidence&lt;/h3&gt;\n&lt;p&gt;Доказательства — ссылки, которые роль прикладывает к вердикту: запущенная команда, результат проверки, коммит. Это не пересказ, а указатели: вид и ссылка. Виды: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xh2rm1st\"&gt;command&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x20sxrha\"&gt;test_run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-irnq4oxo\"&gt;diff&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rp2qsd3s\"&gt;file&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lfbrn28p\"&gt;artifact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k3tssxwb\"&gt;gateway_call&lt;/code&gt;. Для коммита панель деталей TUI подсказывает команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h27rpcly\"&gt;git show &amp;lt;sha&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hjkeacvt\"&gt;(1 evidence)&lt;/code&gt; в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ij9t2qjq\"&gt;verdict&lt;/code&gt;, строки под раундом в TUI вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cjy25hh6\"&gt;command precheck:… — no commits on the task branch&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5uuvlua9\"&gt;evidence[command] …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5cueydda\"&gt;theia diagnose&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verdict\"&gt;verdict&lt;/a&gt;, &lt;a href=\"ru/glossary.html#test-run\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hgui3e2z\"&gt;test_run&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iansjvs5\"&gt;detail&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"test-run\"&gt;&lt;a href=\"ru/glossary.html#test-run\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;test_run&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6qhzmrvk\"&gt;test_run&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вид доказательства: результат команд &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n1juznff\"&gt;--verify&lt;/code&gt;. Ссылка — отпечаток полного вывода, сам вывод лежит в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kxkfj3j5\"&gt;.theia/objects&lt;/code&gt;. В 0.2.201 клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-engqhg9r\"&gt;v&lt;/code&gt; в TUI на такой строке пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h7cw8lex\"&gt;no stored body for this row&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nkqar74m\"&gt;test_run 74d01a0c051c… — exit 0: true&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5yp4tnp9\"&gt;evidence[test_run] 74d01a0c… (exit 0: true)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kyh929pk\"&gt;theia diagnose&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#evidence\"&gt;evidence&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j65v9v4e\"&gt;verify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-dir\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pimxj1rj\"&gt;.theia&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-created\"&gt;&lt;a href=\"ru/glossary.html#run-created\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run.created&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xlx3c74q\"&gt;run.created&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Первое событие прогона: бюджет и трек, у прогона по плану ещё &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iq8jq43s\"&gt;plan=&amp;lt;id&amp;gt;&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xh6gxtwo\"&gt;budget=$null&lt;/code&gt; значит «без лимита».&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6d8fxly5\"&gt;xu3xnxmu run.created   budget=$10 track=fast_path&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unmetered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ps5w0hvq\"&gt;unmetered&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-finished\"&gt;&lt;a href=\"ru/glossary.html#run-finished\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run.finished&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7kqr7pap\"&gt;run.finished&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Последнее событие прогона: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kfdwy8gp\"&gt;halted=&amp;lt;итог&amp;gt; rounds=&amp;lt;число вердиктов&amp;gt;&lt;/code&gt;. Прогон с этим событием считается завершённым (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oehzxod5\"&gt;finished&lt;/code&gt;). Это же событие со значением &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-13jvnsbm\"&gt;halted=abandoned&lt;/code&gt; пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-emk8fxjl\"&gt;theia run --abandon&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-39ugybxn\"&gt;x3qwug7h run.finished  halted=completed rounds=6&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o7obbfxq\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"ru/glossary.html#abandoned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mxacyri5\"&gt;abandoned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-paused\"&gt;&lt;a href=\"ru/glossary.html#run-paused\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run.paused&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lx32qti1\"&gt;run.paused&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Событие паузы: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fsyfx0ge\"&gt;rounds=N (resumable)&lt;/code&gt;. Прогон можно продолжить командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r5cr25g7\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6oezjopp\"&gt;e7s432s2 run.paused    rounds=8 (resumable)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kz2uf06h\"&gt;paused&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cmbnh4pg\"&gt;--resume&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-forked\"&gt;&lt;a href=\"ru/glossary.html#run-forked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run.forked&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-umdp744y\"&gt;run.forked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Событие в начале ответвления прогона: от какого прогона (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-waqm36rb\"&gt;from=&lt;/code&gt;) и с какого события (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8c156521\"&gt;at=&lt;/code&gt;) оно отделилось, и причина в кавычках.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t42metqg\"&gt;run.forked    from=&amp;lt;id&amp;gt; at=&amp;lt;id&amp;gt; “&amp;lt;причина&amp;gt;”&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ampnddkz\"&gt;forked from &amp;lt;id&amp;gt; at &amp;lt;id&amp;gt;&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5zusghhc\"&gt;theia show&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-phca2hp3\"&gt;fork&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"task-created\"&gt;&lt;a href=\"ru/glossary.html#task-created\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;task.created&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ugoliba5\"&gt;task.created&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Событие создания задачи: короткий номер задачи, трек в скобках и текст задачи.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-26t19qck\"&gt;xeskq65r task.created  xk6rzynf [fast_path] add a greeting line to hello.js&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#task\"&gt;task&lt;/a&gt;, &lt;a href=\"ru/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"ru/glossary.html#short-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3rtj3cto\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"task-phase\"&gt;&lt;a href=\"ru/glossary.html#task-phase\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;task.phase&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ee0xi3wb\"&gt;task.phase&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Событие смены фазы: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2nate0w1\"&gt;&amp;lt;задача&amp;gt; &amp;lt;событие&amp;gt; → &amp;lt;новая фаза&amp;gt;&lt;/code&gt;. Слева от стрелки — событие, которое применила Theia, справа — фаза, в которую пришла задача.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-phndpej6\"&gt;wlqjldhd task.phase    xk6rzynf ready → implement&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#phase\"&gt;phase&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verdict\"&gt;verdict&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"task-note\"&gt;&lt;a href=\"ru/glossary.html#task-note\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;task.note&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-04ha2uum\"&gt;task.note&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Служебная заметка в журнале. Источник в скобках:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pfilu67a\"&gt;[workspace_base]&lt;/code&gt; — с какого коммита сделана копия задачи;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sjal4gqe\"&gt;[post_run_maintenance]&lt;/code&gt; — уборка после прогона;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yvfklxcy\"&gt;[file_ref]&lt;/code&gt; — какие файлы вставлены через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-73aekpm2\"&gt;@&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5m5xvxyy\"&gt;[session_prefix]&lt;/code&gt; — отпечаток общей части запроса при &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7i9da8f\"&gt;--sessions&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hntzkk4z\"&gt;[context_alert]&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2eh9ljei\"&gt;[context_refuse]&lt;/code&gt; — добавленный контекст слишком большой;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gvs587fo\"&gt;[index_auto_build]&lt;/code&gt; — автоматическая сборка индекса перед прогоном.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Две заметки печатаются по-своему: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ee8oc80l\"&gt;context       injected: …&lt;/code&gt; (добавленные правила) и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8skhd32v\"&gt;pre-task      … N gate(s), M failed&lt;/code&gt; (проверки до старта задачи).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l3wfbvpd\"&gt;x5dhtxgs task.note     [workspace_base]&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9iqoktdg\"&gt;workspace @ 209a8f6 (copy)&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qn0hp6cr\"&gt;note post_run_maintenance&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#note\"&gt;note&lt;/a&gt;, &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ynctpawx\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#pre-task\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x4twpx9i\"&gt;pre-task&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#maintenance\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ifbwnw2\"&gt;maintenance&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"user-note\"&gt;&lt;a href=\"ru/glossary.html#user-note\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;user.note&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-os1ktg0m\"&gt;user.note&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Событие с вашим указанием (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1h1pnn6d\"&gt;[msg]&lt;/code&gt;) или с ответами на уточняющие вопросы (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v6cf8tfr\"&gt;[clarify]&lt;/code&gt;). В TUI такие строки помечены &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-82s0tpxk\"&gt;»&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tbvjg0oy\"&gt;user.note     [msg] &amp;lt;текст&amp;gt;&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-116t5ag3\"&gt;» steer [msg] check the merge precheck first&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0vlmcsq1\"&gt;clarify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"tool\"&gt;&lt;a href=\"ru/glossary.html#tool\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;tool&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wd5nq2ca\"&gt;tool&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка о действии агента внутри движка: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bxix6vj8\"&gt;$&lt;/code&gt; — команда, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n1ah7mdu\"&gt;✎&lt;/code&gt; — правка файла, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tbsyxi6f\"&gt;⚙&lt;/code&gt; — другой инструмент. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ekwqhomi\"&gt;!&lt;/code&gt; после значка значит, что действие не удалось. Пока вызов идёт, те же строки появляются с пометкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-807xetzp\"&gt;live&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ju1e3exz\"&gt;tool          $ &amp;lt;команда&amp;gt;&lt;/code&gt;, строки инструментов под вызовом модели в TUI, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sxgl861z\"&gt;live $ …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jyomh0lc\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yue2armx\"&gt;detail&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-stop-request\"&gt;&lt;a href=\"ru/glossary.html#run-stop-request\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run.stop_request&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qkrralzb\"&gt;run.stop_request&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Запрос на мягкую остановку от другого процесса. Его пишет инструмент MCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ptou5gds\"&gt;run_stop&lt;/code&gt;. В 0.2.201 такой запрос выполняет только продолженный прогон — см. &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-amed7png\"&gt;run.stop_request&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yvfnbakt\"&gt;--plain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z95clt7a\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-question\"&gt;&lt;a href=\"ru/glossary.html#run-question\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run.question&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5dcugw1m\"&gt;run.question&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Уточняющий вопрос, выложенный на шину управления в режиме &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pifhktgm\"&gt;--interaction bus&lt;/code&gt;. Его показывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u9d3enz8\"&gt;theia answer &amp;lt;runId&amp;gt;&lt;/code&gt;. В 0.2.201 такие вопросы бывают только у продолженного прогона.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sjs8o9gy\"&gt;question &amp;lt;id&amp;gt;  (task …xxxxxxxx)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wrg9fgeu\"&gt;theia answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xg3jrlw\"&gt;N questions waiting&lt;/code&gt; в строке статуса.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5c9i6s42\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-answer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hbkqd3ej\"&gt;run.answer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-answer\"&gt;&lt;a href=\"ru/glossary.html#run-answer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run.answer&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3mukpzat\"&gt;run.answer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ответ на вопрос с шины управления. Его пишут &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xu85fhvv\"&gt;theia answer &amp;lt;runId&amp;gt; --question &amp;lt;id&amp;gt; \"…\"&lt;/code&gt; и инструмент MCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-742hobd5\"&gt;run_answer&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xfqsl1pb\"&gt;answered &amp;lt;id&amp;gt; (…)&lt;/code&gt; в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5o9sdsf7\"&gt;theia answer&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-question\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a6x6nfiw\"&gt;run.question&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/reference/run-control.html#answer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bo0ullsl\"&gt;theia answer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-changeset\"&gt;&lt;a href=\"ru/glossary.html#run-changeset\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run.changeset&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ksqby6d9\"&gt;run.changeset&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Событие прогона в проекте с несколькими корнями: связанные слияния в разных репозиториях легли вместе. В TUI это строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-us6eodhn\"&gt;changeset (N merges)&lt;/code&gt;. Если набор лёг лишь частично, Theia пишет аномалию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ej08qa1d\"&gt;changeset_partial&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m4zsexat\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#changeset-partial\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i67yzncl\"&gt;changeset_partial&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-probed\"&gt;&lt;a href=\"ru/glossary.html#run-probed\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;,&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-regl40k4\"&gt;run.probed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ywg24o0s\"&gt;run.asked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Записи вопросов. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5zqgrboy\"&gt;theia probe&lt;/code&gt; сохраняет свой вопрос и ответ отдельной записью с событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1a0xuko5\"&gt;run.probed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-131s3vzx\"&gt;theia ask&lt;/code&gt; — с событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6j66s6w7\"&gt;run.asked&lt;/code&gt;. Сам прогон при этом не меняется. У таких записей нет события &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5jx6fxoj\"&gt;run.finished&lt;/code&gt;, поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p2vvpwwt\"&gt;theia show&lt;/code&gt; пишет для них &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-01a2l59h\"&gt;halted: (still open)&lt;/code&gt;, а домашний экран помечает их словами &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tyu31mmb\"&gt;probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1t5rezfd\"&gt;ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-75t615rj\"&gt;theia show &amp;lt;id&amp;gt; --plain&lt;/code&gt; для записи вопроса, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ha60hqy9\"&gt;· run…  probe&lt;/code&gt;, список областей в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e7owe0qs\"&gt;theia audit verify&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0et6o6v4\"&gt;probe&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ep0ca38x\"&gt;ask&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-74nzn8g2\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"other-events\"&gt;&lt;a href=\"ru/glossary.html#other-events\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;и другие имена событий&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fs4pvxf7\"&gt;plan.op&lt;/code&gt; и другие имена событий&lt;/h3&gt;\n&lt;p&gt;В журнале есть события, у которых нет своей строки в выводе: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ulkkxb8\"&gt;plan.op&lt;/code&gt; — действие с планом (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5h45sj8e\"&gt;created&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-roj2mtyn\"&gt;approved&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e6sf52gk\"
