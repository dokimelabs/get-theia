role=\"button\" tabindex=\"0\" id=\"inline-code-id-76uxqh9c\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yaxku8np\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;W:&lt;/strong&gt; &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j8f66s40\"&gt;Workspace&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt; · &lt;a href=\"ru/glossary.html#workspace-home\"&gt;workspace home&lt;/a&gt; · &lt;a href=\"ru/glossary.html#task-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k7m3d4mm\"&gt;[workspace_base]&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#workspaces-yaml\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ar6im1ap\"&gt;workspaces.yaml&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#trunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0zb2yq2i\"&gt;worktree&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9txqklds\"&gt;worktree root&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"ru/glossary.html#workspace\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kzicimcg\"&gt;ws-&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;X:&lt;/strong&gt; &lt;a href=\"ru/glossary.html#x-release\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xjyc5d77\"&gt;--x-release&lt;/code&gt;&lt;/a&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"group-runs\"&gt;&lt;a href=\"ru/glossary.html#group-runs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Прогоны и задачи&lt;/span&gt;&lt;/a&gt;Прогоны и задачи&lt;/h2&gt;\n&lt;h3 id=\"run\"&gt;&lt;a href=\"ru/glossary.html#run\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run&lt;/span&gt;&lt;/a&gt;run&lt;/h3&gt;\n&lt;p&gt;Прогон — одно выполнение задачи или плана командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f7e3r8fb\"&gt;theia run&lt;/code&gt;. У прогона есть идентификатор &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-610ici4g\"&gt;run…&lt;/code&gt;, бюджет, журнал событий и своя git-ветка. В конце Theia печатает итог: исход каждой задачи, строку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-66genkzn\"&gt;halted:&lt;/code&gt; и проверку журнала.&lt;/p&gt;\n&lt;p&gt;Где встречается: строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-we8331f7\"&gt;run run… task tsk… (fast_path)&lt;/code&gt; в начале прогона, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ximood0\"&gt;halted: completed · 4 gateway calls · $0.0000&lt;/code&gt;, список &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v89zswk1\"&gt;recent runs:&lt;/code&gt; на домашнем экране.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-va696yeg\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#task\"&gt;task&lt;/a&gt;, &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vmt2swq3\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/guides/first-task.html\"&gt;Первая задача&lt;/a&gt;, &lt;a href=\"ru/reference/run.html#run\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9zycum9u\"&gt;theia run&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"task\"&gt;&lt;a href=\"ru/glossary.html#task\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;task&lt;/span&gt;&lt;/a&gt;task&lt;/h3&gt;\n&lt;p&gt;Задача — одна единица работы внутри прогона. Её идентификатор начинается с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ut4kxuuv\"&gt;tsk&lt;/code&gt;. Прогон с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2llwqp5f\"&gt;--task&lt;/code&gt; создаёт одну задачу, прогон по плану — по задаче на каждый пункт плана. На треке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3nrnrw0q\"&gt;full_spec&lt;/code&gt; планировщик может разбить задачу на подзадачи. У каждой задачи своя фаза, раунды, копия репозитория и итог: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e9cauneh\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4s7osvz4\"&gt;discarded&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7xwm7sa4\"&gt;task.created  xk6rzynf [fast_path] …&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ysmequd\"&gt;tsk… → discarded (6 rounds) …&lt;/code&gt;, строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tlr6smi8\"&gt;tsk…xk6rzynf&lt;/code&gt; на табло и в TUI.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#brief\"&gt;brief&lt;/a&gt;, &lt;a href=\"ru/glossary.html#phase\"&gt;phase&lt;/a&gt;, &lt;a href=\"ru/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"ru/glossary.html#short-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jxavlc0j\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"brief\"&gt;&lt;a href=\"ru/glossary.html#brief\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;brief&lt;/span&gt;&lt;/a&gt;brief&lt;/h3&gt;\n&lt;p&gt;Текст задачи (brief) — то, что вы передаёте в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pz6mkdkl\"&gt;--task&lt;/code&gt; или через стандартный ввод: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pv5u0apd\"&gt;echo \"…\" | theia run&lt;/code&gt;. В текст можно вставить файл через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d4vz3jgf\"&gt;@&lt;/code&gt;. Theia сохраняет текст в хранилище как есть, даже если вызов модели потом заблокирован. Не пишите в нём ключи и пароли.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xv3s0r1k\"&gt;theia run --task \"…\"&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ocz1hwl7\"&gt;theia plan --task \"…\"&lt;/code&gt;, строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qhtazrcj\"&gt;task.created&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fjk2tked\"&gt;--plain&lt;/code&gt;, строка с текстом задачи в дереве TUI.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-576de6vk\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#task\"&gt;task&lt;/a&gt;, &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"file-inclusion\"&gt;&lt;a href=\"ru/glossary.html#file-inclusion\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pxswr764\"&gt;@path&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вставка файла через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uk5v6zg5\"&gt;@&lt;/code&gt;. Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jssvpj1x\"&gt;@путь&lt;/code&gt; в тексте задачи Theia заменяет на имя файла, а содержимое файла добавляет в конец текста блоком с заголовком &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rekzfn81\"&gt;--- file: &amp;lt;путь&amp;gt; (sha256 …, N chars) ---&lt;/code&gt;. Работает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d2iddfg3\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-73s4m8is\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a858cx0r\"&gt;msg&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j2gnf47l\"&gt;probe&lt;/code&gt;, но не в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o4hdyqiz\"&gt;ask&lt;/code&gt;. Путь считается от текущей папки. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q8oosi0i\"&gt;@@&lt;/code&gt; даёт обычный символ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-matdt7je\"&gt;@&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пути, которые начинаются с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zmv2d7og\"&gt;/&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ozqrjm5k\"&gt;./&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gcnjantx\"&gt;../&lt;/code&gt;, не вставляются: слово остаётся в тексте без ошибки. Файл с секретом, например с закрытым ключом, не пройдёт: команда остановится с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-702l91yz\"&gt;prohibited content&lt;/code&gt;. Адреса почты в файле заменяются на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1pty8lxz\"&gt;[EMAIL]&lt;/code&gt;, а в заголовке блока появится &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uu51pbzs\"&gt;masked email×1&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: заголовок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rwy2deu7\"&gt;--- file: README.md (sha256 bc70e26f40b8, 7 chars) ---&lt;/code&gt;, ошибка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x9fzxdbs\"&gt;run: @file: no such file 'nope.md' (…)&lt;/code&gt;, событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bx6488p3\"&gt;task.note [file_ref]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#brief\"&gt;brief&lt;/a&gt;, &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f7mi8tso\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/commands.html#argument-rules\"&gt;Общие правила разбора аргументов&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"track\"&gt;&lt;a href=\"ru/glossary.html#track\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;track&lt;/span&gt;&lt;/a&gt;track&lt;/h3&gt;\n&lt;p&gt;Трек — с какой фазы начинается задача. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kdp0zsqj\"&gt;fast_path&lt;/code&gt; (короткий путь) сразу отдаёт задачу исполнителю. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jngqexjx\"&gt;full_spec&lt;/code&gt; (полная спецификация) сначала запускает планировщика. Трек задаёт флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f5ifdkss\"&gt;--track&lt;/code&gt;, по умолчанию — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zdaolioq\"&gt;fast_path&lt;/code&gt;. Одобрение плана нужно только в цепочке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zj5egdpn\"&gt;theia plan&lt;/code&gt; → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-caj7xdgy\"&gt;theia run --from-plan&lt;/code&gt;: прогон с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-npp3vju7\"&gt;--track full_spec&lt;/code&gt; одобрения не ждёт.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qmu70i14\"&gt;run.created … track=fast_path&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jxih4mmq\"&gt;task.created … [full_spec] …&lt;/code&gt;, строка задачи в TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qboj5u85\"&gt;tsk…x [fast_path]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fast-path\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-riryu6fe\"&gt;fast_path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tr09nlos\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t93dabxu\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#track-override\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mpib3p7j\"&gt;track override&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fast-path\"&gt;&lt;a href=\"ru/glossary.html#fast-path\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qihw6cjn\"&gt;fast_path&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Трек короткого пути: задача сразу идёт в фазу &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e8j7ogk1\"&gt;implement&lt;/code&gt;, без планировщика. Это трек по умолчанию. Подходит для небольших правок.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jdq6jtk0\"&gt;--track fast_path&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5zp01i5f\"&gt;task.phase … ready → implement&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l2o1lxcp\"&gt;[fast_path]&lt;/code&gt; в строках задач.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-87txbudw\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5aibkvxa\"&gt;implement&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"full-spec\"&gt;&lt;a href=\"ru/glossary.html#full-spec\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p2gb9yyk\"&gt;full_spec&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Трек полной спецификации: задача начинается с фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-30ojkcjo\"&gt;plan&lt;/code&gt;. Планировщик (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5zpu1yy\"&gt;planner&lt;/code&gt;) продумывает работу и может разбить её на подзадачи, потом работает исполнитель. Первая строка такой задачи — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k8xkx2ws\"&gt;task.phase … start → plan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xdpyz58n\"&gt;--track full_spec&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ghxyujg\"&gt;[full_spec]&lt;/code&gt; в строках задач, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5fnmznoy\"&gt;r1 plan  planner → ready&lt;/code&gt; в TUI.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planner\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eg0sttif\"&gt;planner&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-buh4t2s6\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1bw5nj9h\"&gt;planned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"round\"&gt;&lt;a href=\"ru/glossary.html#round\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;round&lt;/span&gt;&lt;/a&gt;round&lt;/h3&gt;\n&lt;p&gt;Раунд — один шаг задачи: одна роль отработала и вынесла вердикт. В TUI раунды пронумерованы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pkseiwml\"&gt;r1&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wuuvhe57\"&gt;r2&lt;/code&gt;…, в итоге прогона стоит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mlx9xlx4\"&gt;(6 rounds)&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ktrggq7\"&gt;rounds=N&lt;/code&gt; в строках &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p1v94sqe\"&gt;run.finished&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dg7squhu\"&gt;run.paused&lt;/code&gt; — сумма вердиктов по всем задачам прогона.&lt;/p&gt;\n&lt;p&gt;Лимит — 10 раундов на задачу: параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-toyt6s22\"&gt;run.maxRoundsPerTask&lt;/code&gt; или флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8sq5wob8\"&gt;--max-rounds&lt;/code&gt;, где &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5slua2p6\"&gt;0&lt;/code&gt; снимает лимит. Когда лимит исчерпан, появляется аномалия &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mk0nak3u\"&gt;round_budget&lt;/code&gt;, и задача уходит к ведущему. Пересмотр задачи (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yxqgr780\"&gt;rescope&lt;/code&gt;) обнуляет счётчик лимита, но номера раундов в выводе продолжают расти.&lt;/p&gt;\n&lt;p&gt;Где встречается: TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jqn1j12z\"&gt;r4 merge  merger → merge_fail&lt;/code&gt;, табло &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eubcnajq\"&gt;r6&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s0yxgtwo\"&gt;tsk… → discarded (6 rounds)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pm8phio4\"&gt;run.finished  halted=completed rounds=6&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verdict\"&gt;verdict&lt;/a&gt;, &lt;a href=\"ru/glossary.html#round-budget\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6rtkuo93\"&gt;round_budget&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#rescope\"&gt;rescope&lt;/a&gt;, &lt;a href=\"ru/glossary.html#phase\"&gt;phase&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"event-log\"&gt;&lt;a href=\"ru/glossary.html#event-log\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;event log&lt;/span&gt;&lt;/a&gt;event log&lt;/h3&gt;\n&lt;p&gt;Журнал событий — список всего, что произошло в прогоне: создание задач, смены фаз, вердикты, вызовы модели, аномалии, указания. Он хранится в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vzzpktzx\"&gt;.theia/store.db&lt;/code&gt;. Каждое событие хранит отпечаток предыдущего, поэтому подмену видно. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xnrgprrl\"&gt;--plain&lt;/code&gt; печатает журнал по строке на событие, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y5iz8ec3\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt; показывает его после прогона.&lt;/p&gt;\n&lt;p&gt;Строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hd0j2yjo\"&gt;live&lt;/code&gt; в журнал не попадают. Чтобы сохранить весь вывод с подробностями в файл, задайте переменную &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-makj5ooa\"&gt;THEIA_LOG_FILE&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bmlpfdg3\"&gt;--plain&lt;/code&gt; вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6n2a0tut\"&gt;x5dhtxgs task.note     [workspace_base]&lt;/code&gt;, команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e8i7ypf2\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4azxfip9\"&gt;theia replay&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yxn3flkx\"&gt;theia audit verify&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ncq0zcf\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ysb1hid\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-log-file\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6vzzisze\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pqn6ly5e\"&gt;replay&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"note\"&gt;&lt;a href=\"ru/glossary.html#note\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;note&lt;/span&gt;&lt;/a&gt;note&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jg5mndbl\"&gt;note&lt;/code&gt; у Theia значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-az664fta\"&gt;task.note&lt;/code&gt; — служебная заметка в журнале; в скобках её источник, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bzhe0vyv\"&gt;[workspace_base]&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3bwj9yg6\"&gt;[post_run_maintenance]&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nfl69wi4\"&gt;user.note&lt;/code&gt; — ваше указание или ответы на вопросы: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mcklozys\"&gt;user.note [msg] …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nj33si51\"&gt;user.note [clarify] …&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Текст в кавычках “…” после вердикта — короткий комментарий роли.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2vwawkui\"&gt;note:&lt;/code&gt; в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w02evdv4\"&gt;theia plan show&lt;/code&gt; — ваша просьба об изменениях плана.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dn2zjp5w\"&gt;noted — …&lt;/code&gt; — ответ команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qvijoxib\"&gt;theia msg&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7zg0ch04\"&gt;note &amp;lt;source&amp;gt;&lt;/code&gt; — строка служебной заметки в дереве TUI.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#task-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1tsj2uzt\"&gt;task.note&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ha9k1lwr\"&gt;user.note&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verdict\"&gt;verdict&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"live\"&gt;&lt;a href=\"ru/glossary.html#live\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ted060q9\"&gt;live&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gkrfvllp\"&gt;live&lt;/code&gt; у Theia значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vz6jyyym\"&gt;live&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ikxv82nu\"&gt;--plain&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5gs8p2y9\"&gt;live ⏱ implementer tsk…6rzynf call started&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8k7hn1fi\"&gt;live ↻ … retry …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vvl4nkcb\"&gt;live $ …&lt;/code&gt;. Это подсказки о ходе работы. В журнал они не пишутся, поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a1jut5il\"&gt;theia show --plain&lt;/code&gt; их не показывает.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3yn9usy8\"&gt;[@ event 21/21 · live]&lt;/code&gt; в заголовке TUI — экран следует за идущим прогоном.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iopqwgiu\"&gt;(live; …)&lt;/code&gt; в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kqqwjtlo\"&gt;resuming run …&lt;/code&gt; — в журнале нет ни конца прогона, ни паузы: прогон прервали без паузы.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wgccl7cf\"&gt;N live&lt;/code&gt; в строке статуса и на домашнем экране — число прогонов без записи о конце или паузе. Сюда попадают и убитые прогоны.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-25jtuqa5\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-etzxv063\"&gt;--resume&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#statusline\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7bcqm6dw\"&gt;statusLine&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-en87b02s\"&gt;in flight&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"sigma\"&gt;&lt;a href=\"ru/glossary.html#sigma\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t51ax5ie\"&gt;sigma&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Σ (sigma) — общие заметки прогона, которые Theia передаёт ролям в каждом запросе: ваши указания, ответы на уточняющие вопросы, направление ведущего после пересмотра задачи. Theia собирает их из журнала событий. Каждый вызов модели начинается заново, а из прошлых раундов роль получает эти заметки, замечания рецензента и итог проверки.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q6hzp96c\"&gt;sigma: {}&lt;/code&gt; в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-47283csb\"&gt;theia replay&lt;/code&gt;, строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sdmru2rq\"&gt;sigma         keys: …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ttpg2fw2\"&gt;--plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ray7dpw8\"&gt;sessions: sigma-shared&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0qg79zux\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-89gf755w\"&gt;replay&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#session\"&gt;session&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"session\"&gt;&lt;a href=\"ru/glossary.html#session\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;session&lt;/span&gt;&lt;/a&gt;session&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uhubxexi\"&gt;session&lt;/code&gt; у Theia значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Сессия движка — чат внутри Claude Code или Codex. Theia хранит только её номер (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rfzxlzpx\"&gt;sessionId&lt;/code&gt;) в деталях вызова.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4m989n5z\"&gt;--sessions&lt;/code&gt; и строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0crg8c0w\"&gt;sessions: sigma-shared&lt;/code&gt; — экспериментальный режим: общая часть запроса идёт первой, а Theia записывает её отпечаток (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6dg6sz3c\"&gt;task.note [session_prefix]&lt;/code&gt;). Это не продолжение чата. По умолчанию режим выключен (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d3r2go07\"&gt;run.sessionContinuity: off&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h5r5sphm\"&gt;SessionStart&lt;/code&gt; — событие хука Claude Code и Codex, на котором Theia добавляет контекст (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7igsk9ep\"&gt;theia mem context&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ipgdrlfp\"&gt;compact-checkpoint&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-04i0463v\"&gt;session-final&lt;/code&gt; — метки кусков переписки, которые сохраняют хуки.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#sigma\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xebmr20d\"&gt;sigma&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#checkpoint\"&gt;checkpoint&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"non-interactive\"&gt;&lt;a href=\"ru/glossary.html#non-interactive\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pdfo2bl1\"&gt;--non-interactive&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d37tlevq\"&gt;--non-interactive&lt;/code&gt;: прогон ни о чём не спрашивает. Экран TUI не открывается, вместо него работает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r2icp83e\"&gt;--plain&lt;/code&gt;. Если роль задаст уточняющий вопрос, задача замрёт в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zzbr3bzu\"&gt;escalated&lt;/code&gt;, а не будет ждать ответа. Подходит для скриптов, CI и запуска в фоне.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i9pojowa\"&gt;view: --tui is interactive; --non-interactive degrades to --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lmwfq0x5\"&gt;theia run … --non-interactive&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eaqcanqe\"&gt;theia plan --non-interactive&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ao7fy6c8\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c2kdbao8\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#tui\"&gt;TUI&lt;/a&gt;, &lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-log-file\"&gt;&lt;a href=\"ru/glossary.html#theia-log-file\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ljtaj8kx\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Переменная окружения с путём к файлу. Прогон дописывает туда каждую строку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r29qbtnb\"&gt;--plain&lt;/code&gt; вместе с полными данными события (строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ba3i7m32\"&gt;⤷ {…}&lt;/code&gt;) и строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uko1qgda\"&gt;live&lt;/code&gt;. Это работает и при открытом TUI, поэтому файл можно смотреть из другого терминала командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lexb3h90\"&gt;tail -f&lt;/code&gt;. В 0.2.201 очень короткие прогоны, меньше секунды, могут оставить файл пустым.&lt;/p&gt;\n&lt;p&gt;Где встречается: строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rcniljay\"&gt;# theia run run… — &amp;lt;время&amp;gt;&lt;/code&gt; в начале файла, ошибка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-opzrx61o\"&gt;THEIA_LOG_FILE: … — logging disabled&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7nztp8qu\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/environment.html\"&gt;Переменные окружения&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-roles\"&gt;&lt;a href=\"ru/glossary.html#group-roles\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Роли&lt;/span&gt;&lt;/a&gt;Роли&lt;/h2&gt;\n&lt;h3 id=\"role\"&gt;&lt;a href=\"ru/glossary.html#role\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;role&lt;/span&gt;&lt;/a&gt;role&lt;/h3&gt;\n&lt;p&gt;Роль — вид работы агента в прогоне: планировать, писать код, проверять, рецензировать, сливать, решать спор. Роль — не модель. Какой движок и какая модель работают в роли, задаёт маршрутизация (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qcrm9lhz\"&gt;gateway.routing&lt;/code&gt;). В выводе встречаются роли &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zzxh6py6\"&gt;lead&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hcs4wsl5\"&gt;planner&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5nu1599e\"&gt;implementer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ropvu0c2\"&gt;fresh_implementer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8mqzic2\"&gt;verifier&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e2zzp7k1\"&gt;reviewer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i03t079l\"&gt;merger&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xblwpime\"&gt;arbiter&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-204wiqva\"&gt;indexer&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d7w0ro6p\"&gt;none&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Ещё две роли есть в настройках, но в выводе прогона не видны: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u7aug06q\"&gt;extractor&lt;/code&gt; пишет сводки памяти в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-axl39psb\"&gt;theia mem maintain --llm&lt;/code&gt;, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g29fn71e\"&gt;diagnostician&lt;/code&gt; в 0.2.201 не используется — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-atumcfa9\"&gt;theia diagnose&lt;/code&gt; работает без модели.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fsbtej3n\"&gt;verdict … reviewer → approve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iq8gw576\"&gt;gateway implementer@&amp;lt;transport&amp;gt; → ok&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ap9pty1\"&gt;live ⏱ lead tsk… call started&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dchjjgqu\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/about/overview.html#roles\"&gt;Роли&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lead\"&gt;&lt;a href=\"ru/glossary.html#lead\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l0zjwa7s\"&gt;lead&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ведущий (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i4vkl5x8\"&gt;lead&lt;/code&gt;) — роль, которая решает судьбу застрявшей задачи в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ticsmmtx\"&gt;escalated&lt;/code&gt;. Варианты: пересмотреть задачу и дать новое направление (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t9ovb6kd\"&gt;lead_rescope&lt;/code&gt;), принять работу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yh1y2pk7\"&gt;lead_accept&lt;/code&gt;), проверить ещё раз (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vaw1045b\"&gt;lead_reverify&lt;/code&gt;), отбросить задачу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8teu6q5s\"&gt;lead_discard&lt;/code&gt;) или задать вопрос вам (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4w7p4n7q\"&gt;clarify&lt;/code&gt;). Ведущий работает по одной задаче за раз.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1j304uk7\"&gt;verdict … lead → lead_discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zho4km6f\"&gt;gateway lead@&amp;lt;transport&amp;gt;&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lajzklcz\"&gt;r6 escalated  lead → lead_discard&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0r36vrmt\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#rescope\"&gt;rescope&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead-accept\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wji1wpm0\"&gt;lead_accept&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead-discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m0cgw6uc\"&gt;lead_discard&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lmqvoxyb\"&gt;clarify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"planner\"&gt;&lt;a href=\"ru/glossary.html#planner\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l8971rsq\"&gt;planner&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Планировщик (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-upn4451l\"&gt;planner&lt;/code&gt;) — роль, которая продумывает работу. Он работает в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n00gx0fm\"&gt;plan&lt;/code&gt; у задач трека &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vltrb9ul\"&gt;full_spec&lt;/code&gt; и в команде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-syeem84b\"&gt;theia plan&lt;/code&gt;. Отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nqwoy4tn\"&gt;planned&lt;/code&gt; с подзадачами, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b9l4hz1t\"&gt;ready&lt;/code&gt; (можно писать код) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-laows6ca\"&gt;clarify&lt;/code&gt; (нужен ваш ответ).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8dq017jw\"&gt;verdict … planner → ready&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eny7vgk2\"&gt;r1 plan  planner → ready&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ce0wkrk1\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j1icde06\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bgjsch3f\"&gt;planned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-807j2izz\"&gt;clarify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"implementer\"&gt;&lt;a href=\"ru/glossary.html#implementer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3483xxns\"&gt;implementer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Исполнитель (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f0smjrbi\"&gt;implementer&lt;/code&gt;) — роль, которая пишет код. Работает в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cmtnuw62\"&gt;implement&lt;/code&gt;, в отдельной копии репозитория. Отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xmkkaqm3\"&gt;ready&lt;/code&gt; (готово), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a2je4dpc\"&gt;cant_do&lt;/code&gt; (не может) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rndeg539\"&gt;algedonic&lt;/code&gt; (серьёзная проблема). Коммиты делает сама Theia, а не модель.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9n546lp2\"&gt;verdict … implementer → ready (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1von8vzx\"&gt;live ⏱ implementer tsk… call started&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-htz1u0ym\"&gt;implement&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fresh-implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-clq193sf\"&gt;fresh_implementer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fresh-implementer\"&gt;&lt;a href=\"ru/glossary.html#fresh-implementer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bq4mq7rf\"&gt;fresh_implementer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Свежий исполнитель — второй исполнитель, который берётся за задачу заново. После двух попыток в фазе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-esi5nkj9\"&gt;implement&lt;/code&gt; (параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wtalanw3\"&gt;run.freshPerspectiveAfter&lt;/code&gt;) Theia отдаёт задачу ему и пишет аномалию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0kuwsjuv\"&gt;fresh_perspective&lt;/code&gt;. Он не видит заметок прежних попыток, но видит ваши указания и замечания рецензента. Если у него нет своей строки в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lg8mhvhx\"&gt;gateway.routing&lt;/code&gt;, он работает через тот же транспорт, что и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hxgtoc3r\"&gt;implementer&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-64x8aeqp\"&gt;!! anomaly    fresh_perspective taskId=… dispatches=2&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f67lntmp\"&gt;gateway fresh_implementer@&amp;lt;transport&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-teq3vrh0\"&gt;implementer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fresh-perspective\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-asz7icab\"&gt;fresh_perspective&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-11uceixy\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verifier\"&gt;&lt;a href=\"ru/glossary.html#verifier\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xtsvn4ch\"&gt;verifier&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Проверяющий (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-03b6mrr6\"&gt;verifier&lt;/code&gt;) — роль фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r7a1ofg3\"&gt;verify&lt;/code&gt;. Если вы передали команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9fqi3r2p\"&gt;--verify&lt;/code&gt;, работу проверяют сами команды: Theia запускает их, и код выхода решает исход, модель не вызывается. Без команд проверяет модель. Проверяющий отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b0mxqgya\"&gt;pass&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i12vae7a\"&gt;fail&lt;/code&gt;, а в выводе это события &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-atklr1a4\"&gt;verify_pass&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c73ccsbw\"&gt;verify_fail&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-400db467\"&gt;verdict … verifier → verify_pass (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lhvw6b0t\"&gt;verifier → verify_fail (1 evidence)  “$ false → exit 1 (no output)”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q8f0qa43\"&gt;verify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kdyadmtq\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-06apn0br\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stop-and-fix\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zo0g5u6c\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"reviewer\"&gt;&lt;a href=\"ru/glossary.html#reviewer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z21jyvpt\"&gt;reviewer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Рецензент (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-myyyjdff\"&gt;reviewer&lt;/code&gt;) — роль фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dpx0mahg\"&gt;review&lt;/code&gt;. Он смотрит изменения задачи и отвечает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0pycw77v\"&gt;approve&lt;/code&gt; (принять, дальше слияние), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7234h1l8\"&gt;rework&lt;/code&gt; (доработать) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wwo28i1f\"&gt;discard&lt;/code&gt; (отклонить). После &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sin63782\"&gt;rework&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m355fj9u\"&gt;discard&lt;/code&gt; задача идёт к арбитру, а не отбрасывается сразу.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4pow4vcw\"&gt;verdict … reviewer → approve (1 evidence)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#review\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kiuk1543\"&gt;review&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#approve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oxwa2y87\"&gt;approve&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#rework\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uaoj9uvm\"&gt;rework&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y3em1srm\"&gt;discard&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"arbiter\"&gt;&lt;a href=\"ru/glossary.html#arbiter\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6qeschyh\"&gt;arbiter&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Арбитр (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eie6xztp\"&gt;arbiter&lt;/code&gt;) — роль фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o41dewbg\"&gt;arbitrate&lt;/code&gt;. Решает, что делать после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2x01gam8\"&gt;rework&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mqgz7g79\"&gt;discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ig2q52df\"&gt;merge_fail&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fq4b6946\"&gt;cant_do&lt;/code&gt;: ещё одна попытка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9dqkf0vy\"&gt;arb_continue&lt;/code&gt;, назад к исполнителю) или передать задачу ведущему (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-35qbouof\"&gt;arb_escalate&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0p1x30l1\"&gt;verdict … arbiter → arb_escalate (1 evidence)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dhjie2p5\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arb-continue\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lwygsiik\"&gt;arb_continue&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arb-escalate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-80ze0g6t\"&gt;arb_escalate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ygp4fjqz\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"merger\"&gt;&lt;a href=\"ru/glossary.html#merger\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fxr9mikb\"&gt;merger&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Роль слияния (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oxtx0yib\"&gt;merger&lt;/code&gt;) — шаг фазы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4nhlsryd\"&gt;merge&lt;/code&gt;. Это не модель: сама Theia обычным git сливает ветку задачи в ветку прогона (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6xes3gtr\"&gt;git merge --no-ff&lt;/code&gt;). Ответ — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hl6ctfhz\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u5xcnf02\"&gt;merge_fail&lt;/code&gt;. Слияния идут по одному.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vjoz4v0i\"&gt;verdict … merger → merged (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-536usf5o\"&gt;merger → merge_fail (1 evidence)  “no commits on the task branch”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0gjy38q\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ydbtb0mt\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merge-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2fhwz2vg\"&gt;merge_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/glossary.html#precheck\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-31brsllt\"&gt;precheck&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"indexer\"&gt;&lt;a href=\"ru/glossary.html#indexer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eg3o4hl1\"&gt;indexer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Индексатор (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rfi0smqi\"&gt;indexer&lt;/code&gt;) — роль, которая пишет записи индекса кода: короткую карточку на каждый файл. Работает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rdoe2mzr\"&gt;theia index build&lt;/code&gt; и при автоматической сборке индекса. Её вызовы не входят в прогон.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-trhseb7x\"&gt;theia index build&lt;/code&gt;, строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i4eh5cl7\"&gt;indexer: claude-index&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-27urljbc\"&gt;policy.yaml&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;, &lt;a href=\"ru/glossary.html#index-entry\"&gt;index entry&lt;/a&gt;, &lt;a href=\"ru/reference/index-cmd.html#index-build\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-slyckee8\"&gt;theia index build&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"none\"&gt;&lt;a href=\"ru/glossary.html#none\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qvg71n2q\"&gt;none&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ffv0c6k6\"&gt;none&lt;/code&gt; — роль разового вопроса без задачи. Так работают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aasdctn5\"&gt;theia probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mi7tzmt0\"&gt;theia ask&lt;/code&gt;. Маршрут для неё берётся из строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cucus2oa\"&gt;\"*\"&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wr5l0psc\"&gt;gateway.routing&lt;/code&gt;, если нет своей строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-072vadnw\"&gt;none&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hfgqp4hx\"&gt;gateway none@&amp;lt;transport&amp;gt; → ok&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qvjhu53m\"&gt;theia show &amp;lt;id&amp;gt; --plain&lt;/code&gt; для записи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wxca2zzg\"&gt;probe&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q6pkz1ul\"&gt;ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bmc5hxfc\"&gt;probe&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cjz4lrra\"&gt;ask&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v6ujgsrb\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-phases\"&gt;&lt;a href=\"ru/glossary.html#group-phases\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Фазы задачи&lt;/span&gt;&lt;/a&gt;Фазы задачи&lt;/h2&gt;\n&lt;h3 id=\"phase\"&gt;&lt;a href=\"ru/glossary.html#phase\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;phase&lt;/span&gt;&lt;/a&gt;phase&lt;/h3&gt;\n&lt;p&gt;Фаза — шаг, на котором сейчас задача. Рабочие фазы: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rvazt8fz\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-25i4i6ps\"&gt;implement&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9u6vfv8k\"&gt;verify&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ord9hz2\"&gt;review&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ajd7rrr6\"&gt;merge&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0zbi46yx\"&gt;arbitrate&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3w3wo38m\"&gt;escalated&lt;/code&gt;. Итоговые: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a9w95im9\"&gt;merged&lt;/code&gt; (работа слита), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hzg1tprk\"&gt;discarded&lt;/code&gt; (отброшена), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hy8s392z\"&gt;planned&lt;/code&gt; (пункт-план с подзадачами). Смену фазы показывает строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x23ndzwq\"&gt;task.phase &amp;lt;задача&amp;gt; &amp;lt;событие&amp;gt; → &amp;lt;фаза&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5nvydj9b\"&gt;task.phase    xk6rzynf ready → implement&lt;/code&gt;, колонка фазы на табло, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-stwm5blm\"&gt;discarded  r6&lt;/code&gt; в строке задачи TUI.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ypwtnach\"&gt;implement&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-typvdoyx\"&gt;verify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#review\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qbbzgnt4\"&gt;review&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7mols551\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-802jtmt9\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-28tgj9yi\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hd4h0rxx\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o3c1s6c9\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#task-phase\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bo0c1i3w\"&gt;task.phase&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/about/overview.html#how-a-run-works\"&gt;Как проходит прогон&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"draft\"&gt;&lt;a href=\"ru/glossary.html#draft\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-67j9pq78\"&gt;draft&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У слова два смысла:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Фаза новой задачи. Задача сразу уходит из неё в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iv8rnwpf\"&gt;plan&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xzhfvg5k\"&gt;implement&lt;/code&gt;, поэтому в выводе её почти не видно.&lt;/li&gt;\n&lt;li&gt;Статус плана: план создан или изменён и ещё не одобрен. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aw0ngx5k\"&gt;theia run --from-plan&lt;/code&gt; такой план не запустит.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ycji57rj\"&gt;pln… [draft] 2 tasks — …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ferauc8\"&gt;theia plan list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1po3ixrs\"&gt;context added — NEW digest …, status draft (re-approval required)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmqrl24k\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#approved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oze7igvo\"&gt;approved&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#phase\"&gt;phase&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"implement\"&gt;&lt;a href=\"ru/glossary.html#implement\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-npws3lfq\"&gt;implement&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Фаза, в которой исполнитель пишет код в копии репозитория задачи. Из неё задача идёт в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-obfslg4b\"&gt;verify&lt;/code&gt; (событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xyo4sxzk\"&gt;ready&lt;/code&gt;), к арбитру (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cy1i0zkd\"&gt;cant_do&lt;/code&gt;) или к ведущему (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zqjd18e8\"&gt;algedonic&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c7xinfn5\"&gt;no_progress&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vvujp8h9\"&gt;task.phase … ready → implement&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bp5y0cqh\"&gt;r1 implement  implementer → ready&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0uzznmys\"&gt;implementer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zcgpxm3x\"&gt;verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verify\"&gt;&lt;a href=\"ru/glossary.html#verify\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3k8etjyr\"&gt;verify&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У слова несколько смыслов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Фаза проверки после исполнителя.&lt;/li&gt;\n&lt;li&gt;Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p6i8qa36\"&gt;--verify \"&amp;lt;команда&amp;gt;\"&lt;/code&gt;, его можно указать несколько раз. Theia запускает команды по очереди в копии задачи через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fil4nlle\"&gt;bash -lc&lt;/code&gt;, и код выхода решает исход. Команды работают прямо на вашей машине, не в песочнице, с лимитом 5 минут на каждую. Без команд проверяет модель.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8lz32nym\"&gt;✓ &amp;lt;команда&amp;gt;&lt;/code&gt; в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hl4khum7\"&gt;theia plan show&lt;/code&gt; — своя команда проверки у пункта плана.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5tzj85b4\"&gt;lead_reverify&lt;/code&gt; — ведущий просит проверить ещё раз.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-03i4dxu8\"&gt;--plain&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mdirlgnr\"&gt;--cli&lt;/code&gt; первый Ctrl+C из терминала убивает и работающую команду проверки. Theia записывает это как провал: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ksg68m43\"&gt;verify_fail&lt;/code&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sytpvmpc\"&gt;exit null&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-543yewyh\"&gt;task.phase … ready → verify&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7e1pz6yh\"&gt;verdict … verifier → verify_fail (1 evidence)  “$ false → exit 1 (no output)”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verifier\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i7dr38pl\"&gt;verifier&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r1d2vupp\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jppcjz2q\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stop-and-fix\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iw46i3wa\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead-rever
