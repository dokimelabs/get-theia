ass=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-38rfrkro\"&gt;memory.fact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wvrl4txg\"&gt;memory.chunk&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z5lhd45y\"&gt;memory.tombstone&lt;/code&gt; — записи памяти, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-py7n3gv0\"&gt;index.entry&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xirgwa1p\"&gt;index.build&lt;/code&gt; — записи индекса кода, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lm8cq4t5\"&gt;generation.published&lt;/code&gt; — публикация поколения поиска. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mcgmab8z\"&gt;--plain&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kgxt4ezv\"&gt;theia show --plain&lt;/code&gt; такие события печатаются как есть: идентификатор и имя типа. Разбирать их не нужно.&lt;/p&gt;\n&lt;p&gt;Где встречается: в своих областях журнала (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-spg061kr\"&gt;index&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mp2s54s8\"&gt;plan&lt;/code&gt;, память), которые проверяет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4lsglnu6\"&gt;theia audit verify&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ol4zo32g\"&gt;index: intact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gl7gg26f\"&gt;plan: intact&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p48pk7ox\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-80srqt4z\"&gt;replay&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-stops\"&gt;&lt;a href=\"ru/glossary.html#group-stops\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Остановка, пауза и аномалии&lt;/span&gt;&lt;/a&gt;Остановка, пауза и аномалии&lt;/h2&gt;\n&lt;h3 id=\"halted\"&gt;&lt;a href=\"ru/glossary.html#halted\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0e0269ex\"&gt;halted&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ugta7yfo\"&gt;halted&lt;/code&gt; — итог прогона: почему он перестал работать. Значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fil6ufxm\"&gt;completed&lt;/code&gt; — делать больше нечего. Это не успех: задачи могли быть отброшены. См. &lt;a href=\"ru/glossary.html#completed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oiajw4bl\"&gt;completed&lt;/code&gt;&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ywugetak\"&gt;paused&lt;/code&gt; — прогон на паузе, его можно продолжить. См. &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c931cgzi\"&gt;paused&lt;/code&gt;&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pgi7pbm8\"&gt;abandoned&lt;/code&gt; — прогон закрыт командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9fs9edlb\"&gt;theia run --abandon&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tvwn3z3e\"&gt;budget&lt;/code&gt; — сработал внутренний потолок в 1000 вердиктов на прогон. С деньгами это не связано: когда кончаются деньги, прогон встаёт на паузу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kikj6zv6\"&gt;budget_freeze&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wyld7pld\"&gt;(still open)&lt;/code&gt; — в журнале нет конца: прогон ещё идёт, был убит или это запись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-66j7cgto\"&gt;probe&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qonq4b6a\"&gt;ask&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В TUI то же значение видно в заголовке: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g37j83oj\"&gt;✔ completed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gtoxaurq\"&gt;‖ paused&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pa3q2dw2\"&gt;✖ stopped (abandoned)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xweej9of\"&gt;✖ stopped (budget)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-slqhwgyf\"&gt;halted: completed · 4 gateway calls · $0.0000&lt;/code&gt;, событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-waxbnmio\"&gt;run.finished  halted=completed rounds=6&lt;/code&gt;, табло &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fol0ioru\"&gt;— halted: completed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#completed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6klydyr2\"&gt;completed&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-olfkul2w\"&gt;paused&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#abandoned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-munjx97e\"&gt;abandoned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a6s2zirl\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-finished\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4whjj795\"&gt;run.finished&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"completed\"&gt;&lt;a href=\"ru/glossary.html#completed\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ackf0p9a\"&gt;completed&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gwcj1yxy\"&gt;completed&lt;/code&gt; — значение &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ekdoyvts\"&gt;halted&lt;/code&gt;&lt;/a&gt;: прогону больше нечего делать. Оно не значит, что работа удалась. Прогон, где все задачи отброшены, тоже заканчивается &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3v6pnmuh\"&gt;halted: completed&lt;/code&gt;, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lisewsru\"&gt;theia run&lt;/code&gt; возвращает код 1. Смотрите исход каждой задачи: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f21zbi69\"&gt;merged&lt;/code&gt; — работа слита, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r4nsgaom\"&gt;discarded&lt;/code&gt; — отброшена.&lt;/p&gt;\n&lt;p&gt;В TUI такой прогон всё равно помечен зелёной галочкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u3q007o4\"&gt;✔ completed&lt;/code&gt;, и на домашнем экране тоже стоит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-729w3xqt\"&gt;✔&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4297kwkl\"&gt;halted: completed · 4 gateway calls · $0.0000&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6x53ppa\"&gt;✔ completed · run run…&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ymrqo9wu\"&gt;✔ run…  completed  $0.0000&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-um0m1apd\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bofygyz4\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"paused\"&gt;&lt;a href=\"ru/glossary.html#paused\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-trfe074i\"&gt;paused&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Прогон на паузе: новые шаги не начинаются, журнал цел, прогон можно продолжить командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v42d3rxk\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. Код выхода &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gw80qz2q\"&gt;theia run&lt;/code&gt; при паузе — 0. Пауза бывает:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;после первого Ctrl+C в терминале или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8mgvxutv\"&gt;q&lt;/code&gt; в TUI;&lt;/li&gt;\n&lt;li&gt;когда кончился бюджет (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pq3c33s2\"&gt;budget_freeze&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;когда сработала защита от зацикливания (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-seconin3\"&gt;dispatch_stalled&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-46wk23os\"&gt;clarify_stalled&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;по запросу &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jkpiytxf\"&gt;run_stop&lt;/code&gt; — только у продолженного прогона.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-229fo4ch\"&gt;run.paused    rounds=8 (resumable)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-10tliy0k\"&gt;halted: paused&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d3uhs0yn\"&gt;paused — resume with: theia run --resume run…&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ac4x6f6a\"&gt;‖ paused&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-77kxvae4\"&gt;◆ run…  paused&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7zbo8p4l\"&gt;--resume&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vm6yww8j\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget-freeze\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8wh4113s\"&gt;budget_freeze&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dispatch-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bqggmlqp\"&gt;dispatch_stalled&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"abandoned\"&gt;&lt;a href=\"ru/glossary.html#abandoned\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r99ioelf\"&gt;abandoned&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Прогон закрыт без результата командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7g9qgv4i\"&gt;theia run --abandon &amp;lt;runId&amp;gt;&lt;/code&gt;. Theia дописывает в журнал конец прогона &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e9wfp2xk\"&gt;halted: abandoned&lt;/code&gt; и ничего не удаляет: копии задач остаются, место освобождает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-whezig0s\"&gt;theia prune&lt;/code&gt;. Команда не останавливает прогон, который ещё работает в другом терминале: для этого нажмите там Ctrl+C.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jv88vqrt\"&gt;theia run --resume&lt;/code&gt; не отказывается продолжать закрытый прогон.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7uu9spbd\"&gt;abandoned run… — workspaces kept; reclaim with 'theia prune'&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gcs9dvph\"&gt;halted: abandoned&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y2jf7fpb\"&gt;✖ stopped (abandoned)&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-72xcdge4\"&gt;✖ run…  abandoned&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mrop8glo\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bxs2krtm\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nuugo79f\"&gt;--resume&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/audit-prune.html#prune\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7eriw83b\"&gt;theia prune&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"still-open\"&gt;&lt;a href=\"ru/glossary.html#still-open\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z7rz85v7\"&gt;(still open)&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Так &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iiibwz2e\"&gt;theia show&lt;/code&gt; пишет итог, когда в журнале нет ни конца прогона, ни паузы. Причины: прогон ещё идёт, его убили (второй Ctrl+C, закрытое окно терминала) или это запись вопроса &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fhknn1lt\"&gt;probe&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7j3pnbp1\"&gt;ask&lt;/code&gt;. Убитый прогон остаётся открытым, пока вы его не продолжите (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mo853hc9\"&gt;--resume&lt;/code&gt;) или не закроете (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-292rm6di\"&gt;--abandon&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ezdcsa0x\"&gt;halted: (still open) · 0 gateway calls · $0.0000&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9b4y4h07\"&gt;⣽ run…  in flight&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nlrn1i25\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hjdsmp81\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hard-stop\"&gt;hard stop&lt;/a&gt;, &lt;a href=\"ru/glossary.html#abandoned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7zd6fg0h\"&gt;abandoned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"resume\"&gt;&lt;a href=\"ru/glossary.html#resume\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jxx35rt0\"&gt;--resume&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zwxq6i57\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt; продолжает прогон с того места, где он остановился. Theia читает журнал: готовые шаги не повторяются, прерванный шаг начинается заново, бюджет пересчитывается по записанным тратам. Слово в скобках в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ti634oy2\"&gt;resuming run …&lt;/code&gt; — состояние по журналу: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4z285fac\"&gt;paused&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2oy6ouo8\"&gt;live&lt;/code&gt; (прогон убили без паузы) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x35ai5zz\"&gt;finished&lt;/code&gt;. Продолженный прогон читает шину управления, а прогон, запущенный заново, — нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tqb6c4gm\"&gt;resuming run run… (paused; budget 10.00 usd remaining)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zky5ybv4\"&gt;run branch: theia/run-47z2qh (resumed @ 3c0d7a9)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pmocf5kc\"&gt;resume: all tasks terminal (finished) — nothing to resume&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cbqf1h08\"&gt;paused&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget-remaining\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-me1ybxnx\"&gt;budget remaining&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;, &lt;a href=\"ru/reference/run.html#run\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ibm2u0sw\"&gt;theia run&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"stopping\"&gt;&lt;a href=\"ru/glossary.html#stopping\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z8lt4z95\"&gt;stopping&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Мягкая остановка. Первый Ctrl+C или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iugb42nj\"&gt;q&lt;/code&gt; в TUI просит прогон остановиться: новые шаги не начинаются, текущие доделываются, потом прогон встаёт на паузу.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-if2l89w4\"&gt;--plain&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cpndtzxr\"&gt;--cli&lt;/code&gt; Ctrl+C из терминала получает и работающая команда проверки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tbtzy4d7\"&gt;--verify&lt;/code&gt;. Она погибает, и Theia записывает ложный провал &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ciieotdj\"&gt;verify_fail&lt;/code&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4egxyj4u\"&gt;exit null&lt;/code&gt;. В TUI такой проблемы нет.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d5k2fkyd\"&gt;‖ stopping — in-flight verdicts landing…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nig2nk9j\"&gt;stopping gracefully — in-flight verdicts will land; resume with: …&lt;/code&gt;, табло &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tbdoig0e\"&gt;stopping — finishing in-flight verdicts…&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k98o4s0t\"&gt;paused&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hard-stop\"&gt;hard stop&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dispatch-boundary\"&gt;dispatch boundary&lt;/a&gt;, &lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"hard-stop\"&gt;&lt;a href=\"ru/glossary.html#hard-stop\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;hard stop&lt;/span&gt;&lt;/a&gt;hard stop&lt;/h3&gt;\n&lt;p&gt;Жёсткая остановка — второй Ctrl+C или второй &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gjg5fch7\"&gt;q&lt;/code&gt; в TUI. Theia сразу завершает дочерние процессы и выходит с кодом 130. Записи о паузе в журнале нет, поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-11b8x1if\"&gt;theia show&lt;/code&gt; пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-owopnxyz\"&gt;halted: (still open)&lt;/code&gt;, но прогон можно продолжить через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x06ovlf0\"&gt;--resume&lt;/code&gt;. Строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9gaw1rjx\"&gt;reaper: swept N …&lt;/code&gt; в конце обычного прогона значит, что Theia закрыла оставшиеся лишние процессы.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x6vwuqiu\"&gt;hard stop: swept 3 child process(es)/group(s); resume with: theia run --resume …&lt;/code&gt; (после сигнала; в TUI клавиша ничего не печатает).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lkhwvcvk\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gsymowg3\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3up7qfev\"&gt;--resume&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"anomaly\"&gt;&lt;a href=\"ru/glossary.html#anomaly\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u2je4f00\"&gt;anomaly&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия — предупреждение Theia о том, что в прогоне что-то пошло не так: сработала защита, вызов модели не удался, ответ нарушил правила. Каждая аномалия — событие журнала с видом и классом (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vvaegjap\"&gt;taxonomy&lt;/code&gt;). Классов одиннадцать: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v50gss10\"&gt;reasoning&lt;/code&gt; — ошибка рассуждения модели, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a2jtn7hl\"&gt;planning&lt;/code&gt; — ошибка разбиения задачи, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2rfp97pc\"&gt;action&lt;/code&gt; — неверное действие, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fdbfn7vz\"&gt;memory&lt;/code&gt; — проблема с памятью, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6zmtokmr\"&gt;environment&lt;/code&gt; — сбой среды, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q9k64rbv\"&gt;task_spec&lt;/code&gt; — плохая постановка задачи, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ck6qjeh7\"&gt;security&lt;/code&gt; — нарушение правил безопасности, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v1qoa713\"&gt;communication&lt;/code&gt; — сбой обмена между ролями, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9tyvygbb\"&gt;trust&lt;/code&gt; — нарушение доверия, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6xsm0qv\"&gt;emergent&lt;/code&gt; — непредвиденное поведение, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r8oljoav\"&gt;termination&lt;/code&gt; — сработал ограничитель. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-prxp8nx3\"&gt;theia diagnose&lt;/code&gt; считает аномалии по классам в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hj5moci1\"&gt;taxonomy:&lt;/code&gt;. Сама по себе аномалия прогон не останавливает; что будет дальше, зависит от вида. Виды описаны ниже.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ar22ciu\"&gt;!! anomaly    stop_and_fix taskId=… fails=3&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-93fu1gjo\"&gt;· !! 2 anomalies&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d90aw4c3\"&gt;‼ anomaly &amp;lt;kind&amp;gt; tsk…x ×3&lt;/code&gt;, заголовок &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u417pwq4\"&gt;anomalies 6&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jdnylkck\"&gt;taxonomy: reasoning=1 termination=1&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yqm36td4\"&gt;theia diagnose&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xt43suwm\"&gt;root cause&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"stop-and-fix\"&gt;&lt;a href=\"ru/glossary.html#stop-and-fix\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n41o5isg\"&gt;stop_and_fix&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Защита от бесконечных провалов проверки. После трёх &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-legqrq1f\"&gt;verify_fail&lt;/code&gt; подряд (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l5rrmvso\"&gt;run.stopAndFixAfterFailures&lt;/code&gt;) Theia пишет аномалию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mon8umxs\"&gt;stop_and_fix&lt;/code&gt; и отправляет задачу ведущему событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a01vl3lu\"&gt;stop_and_fix&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1kuivqp0\"&gt;theia diagnose&lt;/code&gt; называет это &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c4aw6cfb\"&gt;verification-loop&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eq1uu00o\"&gt;!! anomaly    stop_and_fix taskId=… fails=3&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a3gp6hm9\"&gt;task.phase … stop_and_fix → escalated&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wpo7ld6c\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y74n8xw3\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b59lt4xt\"&gt;root cause&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"round-budget\"&gt;&lt;a href=\"ru/glossary.html#round-budget\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oaxbpt0o\"&gt;round_budget&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: задача исчерпала лимит раундов (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k9gkrha0\"&gt;run.maxRoundsPerTask&lt;/code&gt;, по умолчанию 10). Шаг засчитывается как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7sjfa56p\"&gt;no_progress&lt;/code&gt;, и задача идёт к ведущему. На шагах, которые закрывают задачу или спрашивают вас (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6gyemiix\"&gt;approve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8l46g63\"&gt;lead_accept&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0torlcwb\"&gt;lead_reverify&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kt7dduor\"&gt;clarify&lt;/code&gt;), защита не срабатывает.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"ru/glossary.html#no-progress\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3c695ur9\"&gt;no_progress&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"rescope-budget\"&gt;&lt;a href=\"ru/glossary.html#rescope-budget\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a0r19sws\"&gt;rescope_budget&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: у ведущего кончились пересмотры задачи (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d4xxq2s4\"&gt;run.maxRescopes&lt;/code&gt;, по умолчанию 2). Theia отбрасывает задачу событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fkkkhsfl\"&gt;lead_discard&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#rescope\"&gt;rescope&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead-discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-htjctbbu\"&gt;lead_discard&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fresh-perspective\"&gt;&lt;a href=\"ru/glossary.html#fresh-perspective\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-24jqbelc\"&gt;fresh_perspective&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия-отметка: после двух попыток в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7rssuhrf\"&gt;implement&lt;/code&gt; задачу берёт свежий исполнитель (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ocai5g5\"&gt;fresh_implementer&lt;/code&gt;). Это не ошибка, а смена подхода.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5rs4rfxl\"&gt;!! anomaly    fresh_perspective taskId=… dispatches=2&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fresh-implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0yp0pxuo\"&gt;fresh_implementer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dispatch-stalled\"&gt;&lt;a href=\"ru/glossary.html#dispatch-stalled\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ul43m4f\"&gt;dispatch_stalled&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: три шага подряд по одной задаче закончились &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lp3429xf\"&gt;no_progress&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b1f4i472\"&gt;run.stallPauseAfter&lt;/code&gt;). Обычно это сбой среды: нет входа в движок, неверный маршрут, нет сети. Прогон встаёт на паузу, чтобы не тратить вызовы впустую. Исправьте причину и продолжите прогон через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ppd74041\"&gt;--resume&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n4hh5104\"&gt;!! anomaly    dispatch_stalled taskId=… consecutive=3&lt;/code&gt;, затем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v2sq51af\"&gt;run.paused    rounds=8 (resumable)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#no-progress\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xhuljjl5\"&gt;no_progress&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#environment-failure\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t1biyz8s\"&gt;environment_failure&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-goeeaf3r\"&gt;paused&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"environment-failure\"&gt;&lt;a href=\"ru/glossary.html#environment-failure\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fhv70m8x\"&gt;environment_failure&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: вызов модели не удался по вине среды, а не агента. Например, транспорт не зарегистрирован, нет входа в движок или процесс движка упал. Причина — в поле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-562itx5b\"&gt;reason=&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pch4zoo0\"&gt;!! anomaly    environment_failure taskId=… role=lead phase=escalated reason=gateway fatal: …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#no-progress\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g18qcki5\"&gt;no_progress&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dispatch-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yzd3hw62\"&gt;dispatch_stalled&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vdw7gs9g\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"clarify-unanswered\"&gt;&lt;a href=\"ru/glossary.html#clarify-unanswered\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b4wdhk3m\"&gt;clarify_unanswered&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: на уточняющий вопрос никто не ответил — нет терминала, задан &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gn8z4b5s\"&gt;--non-interactive&lt;/code&gt; или вы отказались отвечать. Задача замирает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cotpmr9y\"&gt;escalated&lt;/code&gt;, а ведущий узнаёт, что ответа не было.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a4zfsbdw\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yh1i1o37\"&gt;clarify_stalled&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"clarify-stalled\"&gt;&lt;a href=\"ru/glossary.html#clarify-stalled\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q4quio6n\"&gt;clarify_stalled&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: вопросы зашли в тупик — два вопроса подряд без ответа или три ответа подряд без других шагов. Прогон встаёт на паузу. Дальше решаете вы: дать указание или изменить настройки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-te8uzpg3\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oofnt1gy\"&gt;paused&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"illegal-verdict\"&gt;&lt;a href=\"ru/glossary.html#illegal-verdict\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oa7hf3ay\"&gt;illegal_verdict&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: роль ответила словом, которое в этой фазе не разрешено. Шаг засчитывается как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1tkag4n9\"&gt;no_progress&lt;/code&gt;. В 0.2.201 эта же аномалия появляется, когда задачу остановила проверка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yq1np1fq\"&gt;pre-task&lt;/code&gt; или отказ по размеру контекста.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#no-progress\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eull6xoq\"&gt;no_progress&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#pre-task\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uxx4kqfs\"&gt;pre-task&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cp2ob0ey\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"planned-without-subtasks\"&gt;&lt;a href=\"ru/glossary.html#planned-without-subtasks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5gxbks49\"&gt;planned_without_subtasks&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: планировщик ответил &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-beks6rxe\"&gt;planned&lt;/code&gt;, но подзадач не дал. Theia считает ответ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qy591o08\"&gt;ready&lt;/code&gt;, и задача идёт к исполнителю, а не закрывается без кода.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l33ypj1a\"&gt;planned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planner\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9uyzr9he\"&gt;planner&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"accept-unverified\"&gt;&lt;a href=\"ru/glossary.html#accept-unverified\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h4fwsxkj\"&gt;accept_unverified&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: ведущий попытался принять работу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7kcg3q01\"&gt;lead_accept&lt;/code&gt;) без успешной проверки. Theia работу не принимает и засчитывает шаг как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jsukqqjr\"&gt;no_progress&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#lead-accept\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c8jojn2x\"&gt;lead_accept&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vy4i7qq1\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"delegation-refused\"&gt;&lt;a href=\"ru/glossary.html#delegation-refused\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9afs1t5o\"&gt;delegation_refused&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: подзадачи предложила роль, которой это нельзя. Делить задачу могут только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5l7pmiww\"&gt;planner&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xyuyszmq\"&gt;lead&lt;/code&gt;. Подзадачи не создаются.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#planner\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cqyysudy\"&gt;planner&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8p4x1e2b\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"delegation-depth\"&gt;&lt;a href=\"ru/glossary.html#delegation-depth\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-82wxpms9\"&gt;delegation_depth&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: подзадачи вложены слишком глубоко. По умолчанию разрешён один уровень (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a58eqcsz\"&gt;run.maxDelegationDepth&lt;/code&gt;). Новые подзадачи не создаются.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#delegation-fanout\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dg60cuzc\"&gt;delegation_fanout&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-phf8r1aw\"&gt;planned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"delegation-fanout\"&gt;&lt;a href=\"ru/glossary.html#delegation-fanout\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ecfat1h\"&gt;delegation_fanout&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: за один ответ предложено больше подзадач, чем можно (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qhzcx6ts\"&gt;run.maxDelegationFanout&lt;/code&gt;, по умолчанию 4). Theia создаёт только первые четыре.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#delegation-depth\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rkezot39\"&gt;delegation_depth&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lq10aeoa\"&gt;planned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"replay-miss\"&gt;&lt;a href=\"ru/glossary.html#replay-miss\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4yfrix8r\"&gt;replay_miss&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия режима повтора записанных вызовов: для запроса нет сохранённого ответа. Нужна разработчикам платформы при проверке повторяемости. С командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s1lu2hkd\"&gt;theia replay&lt;/code&gt; не связана: та модель не вызывает.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#recording\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c6kkm1cz\"&gt;--record&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hybrid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d181myj1\"&gt;hybrid&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"changeset-partial\"&gt;&lt;a href=\"ru/glossary.html#changeset-partial\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i4roogt4\"&gt;changeset_partial&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия прогона с несколькими корнями: часть связанных слияний легла, а часть — нет. Theia либо откатывает уже слитое (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0xsfk91x\"&gt;revert&lt;/code&gt;, по умолчанию), либо замораживает задачи (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-la9u3h7j\"&gt;freeze&lt;/code&gt;), и называет недоделанный набор. Выбор задаёт параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hxi1qf5p\"&gt;run.changesetPartialFailure&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-changeset\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4f2ipl06\"&gt;run.changeset&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-money\"&gt;&lt;a href=\"ru/glossary.html#group-money\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Деньги&lt;/span&gt;&lt;/a&gt;Деньги&lt;/h2&gt;\n&lt;h3 id=\"budget\"&gt;&lt;a href=\"ru/glossary.html#budget\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;budget&lt;/span&gt;&lt;/a&gt;budget&lt;/h3&gt;\n&lt;p&gt;Бюджет — лимит денег на прогон в долларах США. По умолчанию 10 (параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-akxq9dp8\"&gt;run.maxUsdPerRun&lt;/code&gt;). Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ujugzr4\"&gt;--budget&lt;/code&gt; меняет его, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-577aveko\"&gt;0&lt;/code&gt; снимает лимит. Theia фиксирует цену каждого &lt;a href=\"ru/glossary.html#gateway-call\"&gt;вызова шлюза&lt;/a&gt; и вычитает её из бюджета.&lt;/p&gt;\n&lt;p&gt;Когда деньги кончаются, прогон не останавливается навсегда, а встаёт на паузу: аномалии &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sfqbcjn9\"&gt;budget_exhausted&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n03d3w5z\"&gt;budget_freeze&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ql8uedk9\"&gt;halted: paused&lt;/code&gt;. Продолжить можно с новым бюджетом: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ifr4r0x7\"&gt;theia run --resume &amp;lt;runId&amp;gt; --budget &amp;lt;N&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Слово встречается и в других смыслах:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t41jxxtz\"&gt;halted: budget&lt;/code&gt; — не деньги, а потолок в 1000 вердиктов на прогон.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3nb9esdy\"&gt;round_budget&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1r03gopo\"&gt;rescope_budget&lt;/code&gt; — лимиты раундов и пересмотров задачи.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4xw3gzi3\"&gt;--budget&lt;/code&gt; у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lvatref7\"&gt;theia fork&lt;/code&gt; (по умолчанию 5), у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-859arjfy\"&gt;theia probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tpspubfk\"&gt;theia ask&lt;/code&gt; (по умолчанию 1), у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r59fq4ug\"&gt;theia index build&lt;/code&gt; — свой лимит для этих команд.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wnpn61cl\"&gt;indexBuildBudgetUsd&lt;/code&gt; — лимит на автоматическую сборку индекса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gmf6ejp2\"&gt;run.created   budget=$10 track=fast_path&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z5qxnp38\"&gt;$0.0000/$10.00&lt;/code&gt; в заголовке TUI и на табло, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mq9qq3lk\"&gt;budget remaining: 10&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget-remaining\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5wnsca08\"&gt;budget remaining&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unmetered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g29i9d0h\"&gt;unmetered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget-freeze\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ux7fwpx6\"&gt;budget_freeze&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-34pxbdg4\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"budget-remaining\"&gt;&lt;a href=\"ru/glossary.html#budget-remaining\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rikaqv62\"&gt;budget remaining&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n07hb2eb\"&gt;budget remaining: 10&lt;/code&gt; в конце прогона — сколько долларов бюджета осталось. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g2f1i5ev\"&gt;unmetered&lt;/code&gt; — лимита нет. При продолжении прогона Theia пересчитывает остаток по записанным тратам и пишет его в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2e589s2t\"&gt;resuming run …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-94rvt1uc\"&gt;budget remaining: 10&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ptvg7alj\"&gt;budget remaining: unmetered&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ww2nuipi\"&gt;resuming run run… (paused; budget 10.00 usd remaining)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#unmetered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ysgi8yly\"&gt;unmetered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-suhkjwhp\"&gt;--resume&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"unmetered\"&gt;&lt;a href=\"ru/glossary.html#unmetered\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o9ekzyg5\"&gt;unmetered&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Без денежного лимита: так работает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yu4c3mkl\"&gt;--budget 0&lt;/code&gt;. Защита от зацикливания при этом остаётся: лимиты раундов и пересмотров, потолок вердиктов. В событии &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1qlts52m\"&gt;run.created&lt;/code&gt; лимит без денег записан как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9qvq1ieb\"&gt;budget=$null&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-no7g9rfa\"&gt;budget: 0 = unmetered (loop guards stay: maxTotalRounds, round/rescope budgets)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2aahool2\"&gt;budget remaining: unmetered&lt;/code&gt;, табло &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7wdfdjll\"&gt;$0.0000 spent&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget-remaining\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8lve5yeq\"&gt;budget remaining&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c84tmdy3\"&gt;halted&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"budget-exhausted\"&gt;&lt;a href=\"ru/glossary.html#budget-exhausted\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0lefdaz2\"&gt;budget_exhausted&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: шлюз отказал в вызове модели, потому что бюджет прогона кончился. Сразу за ней идёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1koyjgim\"&gt;budget_freeze&lt;/code&gt;, а вызов в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dusc6dci\"&gt;--plain&lt;/code&gt; помечен &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tdvdnyu7\"&gt;→ fatal&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qrfuhwpp\"&gt;!! anomaly    budget_exhausted role=implementer transport=…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j9dhazde\"&gt;gateway fatal: gateway: usd budget exhausted for this run (THE-024)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget-freeze\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9nve6lwi\"&gt;budget_freeze&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"budget-freeze\"&gt;&lt;a href=\"ru/glossary.html#budget-freeze\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5boss2bz\"&gt;budget_freeze&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Аномалия: прогон встаёт на паузу, потому что кончились деньги. Появляется один раз за прогон. Продолжить можно с новым бюджетом: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bxs89pc6\"&gt;theia run --resume &amp;lt;runId&amp;gt; --budget &amp;lt;N&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uo6ljsih\"&gt;!! anomaly    budget_freeze taskId=… role=implementer&lt;/code&gt;, затем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-60q0in75\"&gt;run.paused … (resumable)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget-exhausted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kqb4kui5\"&gt;budget_exhausted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fxhg1a7v\"&gt;paused&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-call\"&gt;&lt;a href=\"ru/glossary.html#gateway-call\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;gateway call&lt;/span&gt;&lt;/a&gt;gateway call&lt;/h3&gt;\n&lt;p&gt;Вызов шлюза — один запрос к модели через шлюз. Theia записывает в журнал каждый такой вызов с ролью, транспортом, итогом и ценой, даже отклонённый. Команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xes2js9x\"&gt;--verify&lt;/code&gt;, слияние git и ответы, взятые из записи, вызовами шлюза не считаются.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9uw7qb55\"&gt;gateway       &amp;lt;role&amp;gt;@&amp;lt;transport&amp;gt; → ok $0.0000&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pmx6omu1\"&gt;4 gateway calls&lt;/code&gt;, заголовок TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kbr8pe0a\"&gt;4 calls&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ildyl99x\"&gt;· gateway &amp;lt;transport&amp;gt; ok $0.0000&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway\"&gt;gateway&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#locked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4o5l1ege\"&gt;locked&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"locked\"&gt;&lt;a href=\"ru/glossary.html#locked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z6ctqraq\"&gt;locked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ra71q11u\"&gt;$0.0000 locked&lt;/code&gt; — цена, зафиксированная в момент вызова. Theia её не пересчитывает, даже если тарифы потом изменятся.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vvxkjbe7\"&gt;rate: … $0.0000 locked (6ms)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nzdoqh21\"&gt;theia index build&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"ru/glossary.html#pricing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0vmfa9va\"&gt;kind: Pricing&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"pricing\"&gt;&lt;a href=\"ru/glossary.html#pricing\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xqxgy717\"&gt;kind: Pricing&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Необязательный манифест с тарифами моделей (долларов за миллион токенов) и способом расчёта цены для транспорта: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2q4zuj1x\"&gt;costBasis: list&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w6u3blwh\"&gt;actual&lt;/code&gt;. Нужен, когда цены по умолчанию вам не подходят, например для подписки.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/glossary.html#locked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c8svuwzm\"&gt;locked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-maxusdperrun\"&gt;&lt;a href=\"ru/glossary.html#run-maxusdperrun\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-69gg2xce\"&gt;run.maxUsdPerRun&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Бюджет прогона по умолчанию в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xmkbmrto\"&gt;policy.yaml&lt;/code&gt;: 10 долларов. Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-24qsqman\"&gt;--budget&lt;/code&gt; важнее. Имя параметра печатается в отказе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-47o3hwz7\"&gt;run --from-plan&lt;/code&gt;, когда бюджет меньше оценки цены плана.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zcm6egi7\"&gt;run: plan floor ~$… exceeds budget $… — pass --budget N explicitly, raise run.maxUsdPerRun, or --budget 0 (unmetered)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#cost-estimate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bk7hbnrs\"&gt;cost estimate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-git\"&gt;&lt;a href=\"ru/glossary.html#group-git\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Git&lt;/span&gt;&lt;/a&gt;Git&lt;/h2&gt;\n&lt;h3 id=\"run-branch\"&gt;&lt;a href=\"ru/glossary.html#run-branch\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run branch&lt;/span&gt;&lt;/a&gt;run branch&lt;/h3&gt;\n&lt;p&gt;Ветка прогона — git-ветка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fbn73wsr\"&gt;theia/run-&amp;lt;6 символов&amp;gt;&lt;/code&gt;, в которую Theia сливает готовые задачи. Шесть символов — конец идентификатора прогона. Ветка начинается от базы, а ваша текущая ветка не меняется. Ветку занимает скрытая рабочая копия git в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wwpgops0\"&gt;.theia/runs/&amp;lt;runId&amp;gt;/trunk&lt;/code&gt;, поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-amdpap46\"&gt;git switch&lt;/code&gt; на неё не сработает. Забрать работу можно через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pzmbn4ds\"&gt;git merge&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;В конце прогона Theia пишет, что лежит в ветке: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ptphlbx\"&gt;— N merges ahead of base&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tfwfr4fr\"&gt;— no merges landed (branch left at base for inspection)&lt;/code&gt;. Число в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z9r5uqh8\"&gt;merges ahead of base&lt;/code&gt; считает коммиты, а не слияния. Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bser9ktk\"&gt;--branch&lt;/code&gt; задаёт своё имя ветки, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zwgk3cak\"&gt;--base&lt;/code&gt; — свою базу, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5n60vnec\"&gt;--no-run-branch&lt;/code&gt; отключает ветку прогона: слияния тогда идут прямо в вашу текущую ветку.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w645hnn3\"&gt;run branch: theia/run-esbyig (base HEAD (no origin remote) @ 4fb42d7)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d2kjrbzu\"&gt;run branch theia/run-7adeu2 @ 0d391ae — 2 merges ahead of base; …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#base\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bvzx01pa\"&gt;base&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#trunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-652sdslo\"&gt;trunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-branch\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5iq25dlo\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vym2gybw\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"base\"&gt;&lt;a href=\"ru/glossary.html#base\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qm2243v7\"&gt;base&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;База — коммит, от которого начинается ветка прогона. Theia берёт upstream текущей ветки, если его нет — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3a77fm4g\"&gt;origin/HEAD&lt;/code&gt;, иначе локальный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mx1f1n3r\"&gt;HEAD&lt;/code&gt;. Локальные коммиты, которых ещё нет в upstream, в работу прогона не попадут. Чтобы их включить, передайте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-887kaon5\"&gt;--base HEAD&lt;/code&gt;. Заметка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t8trm5gg\"&gt;[workspace_base]&lt;/code&gt; и строка TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h6uchq01\"&gt;workspace @ 209a8f6 (copy)&lt;/code&gt; показывают, с какого коммита сделана копия задачи.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pb39ddvr\"&gt;run branch: theia/run-5yrymu (base origin/main @ d2946e5)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xhzgnjd6\"&gt;(base HEAD (no origin remote) @ 4fb42d7)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace\"&gt;workspace&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"trunk\"&gt;&lt;a href=\"ru/glossary.html#trunk\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mulhev0j\"&gt;trunk&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Папка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gy98vcu6\"&gt;.theia/runs/&amp;lt;runId&amp;gt;/trunk&lt;/code&gt; — скрытая рабочая копия git, в которой открыта ветка прогона. Пока она есть, git не даёт переключиться на ветку прогона или удалить её. Перед удалением ветки выполните &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3h49fvdc\"&gt;git worktree remove .theia/runs/&amp;lt;runId&amp;gt;/trunk&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-dir\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xa05v7qc\"&gt;.theia&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#prunable\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ofxxpgoq\"&gt;prunable&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"prunable\"&gt;&lt;a href=\"ru/glossary.html#prunable\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fxbgvgeq\"&gt;prunable&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Пометка git, а не Theia. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hncxncwo\"&gt;git worktree list&lt;/code&gt; ставит её у записи рабочего дерева, папка которого уже удалена: например, после того как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5quvsqse\"&gt;theia prune&lt;/code&gt; удалил &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r3uyk4oc\"&gt;.theia/runs/&amp;lt;runId&amp;gt;/trunk&lt;/code&gt;. Сама запись при этом остаётся в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1mcn9rxf\"&gt;.git/worktrees&lt;/code&gt;. Её убирает команда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v7ichese\"&gt;git worktree prune&lt;/code&gt;; ветку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-61vlh4u0\"&gt;theia/run-…&lt;/code&gt; она не трогает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o4fyi1kf\"&gt;~/projects/app/.theia/runs/2akdq…/trunk  abc1234 [theia/run-7adeu2] prunable&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-afx7usif\"&gt;git worktree list&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#trunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p7gpximp\"&gt;trunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"ru/reference/audit-prune.html#prune\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-i
