tton\" tabindex=\"0\" id=\"inline-code-id-qzh54z1s\"&gt;node_modules&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mlgs370v\"&gt;.env&lt;/code&gt;, но они не коммитятся. После успешного слияния копия удаляется, у отброшенных и застрявших задач остаётся. В TUI: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ppdwlg5j\"&gt;workspace @ 209a8f6 (copy)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w05pc1yw\"&gt;kind: Workspace&lt;/code&gt; — манифест проекта с несколькими корнями.&lt;/li&gt;\n&lt;li&gt;Папка проекта с хранилищем (workspace home).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-18zr8oio\"&gt;workspace-write&lt;/code&gt; — режим доступа Codex у транспорта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3im0kqw\"&gt;codex-write&lt;/code&gt;: запись только в рабочей папке.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vuomuycp\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace-home\"&gt;workspace home&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-place\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u0qs0ap6\"&gt;--in-place&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-branch\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r8ecgvjh\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace-home\"&gt;&lt;a href=\"ru/glossary.html#workspace-home\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;workspace home&lt;/span&gt;&lt;/a&gt;workspace home&lt;/h3&gt;\n&lt;p&gt;Папка проекта, которой принадлежит хранилище: в ней лежит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vpr3bnoe\"&gt;.theia&lt;/code&gt; со &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5o2tihq5\"&gt;store.db&lt;/code&gt;. Пути корней в манифесте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-91fl02ih\"&gt;Workspace&lt;/code&gt; считаются от неё.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-odsqnng1\"&gt;… — run 'theia init' in the workspace home first&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lz4chpz7\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"worktree-root\"&gt;&lt;a href=\"ru/glossary.html#worktree-root\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1pyf0drz\"&gt;worktree root&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Верхняя папка рабочей копии git. По умолчанию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c931aueq\"&gt;theia init&lt;/code&gt; кладёт хранилище туда, даже если вы запустили команду из подпапки: одно хранилище на рабочую копию.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lyl6s4oh\"&gt;store: …/.theia (worktree root)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c8n884a9\"&gt;(worktree root — one store per checkout; pass --here to pin it to this subfolder instead)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detached\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i7dnuf09\"&gt;detached&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"user-home-store\"&gt;&lt;a href=\"ru/glossary.html#user-home-store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uqr1kvco\"&gt;user-home store&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Хранилище для папки вне git. Оно лежит в папке данных пользователя (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tq8lwlnj\"&gt;stores/&amp;lt;имя&amp;gt;-&amp;lt;хеш&amp;gt;&lt;/code&gt;), а сама папка проекта остаётся чистой. Какой папке какое хранилище принадлежит, записано в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h0eyo90f\"&gt;workspaces.yaml&lt;/code&gt;. Мастер первой настройки так не делает: он всегда создаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h0zp6wkp\"&gt;.theia&lt;/code&gt; в текущей папке.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9y2anbfx\"&gt;store: …/stores/my-notes-dfef89b4 (user-home store — this folder is not a git worktree and stays clean; …)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspaces-yaml\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4t5n4q3j\"&gt;workspaces.yaml&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"detached\"&gt;&lt;a href=\"ru/glossary.html#detached\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ex57yz4k\"&gt;detached&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y9h5yd5o\"&gt;theia init --here&lt;/code&gt; кладёт хранилище ровно в текущую папку, а не в корень рабочей копии и не в папку пользователя. Theia называет такое хранилище &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s4mf8riq\"&gt;detached&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q7no2lp2\"&gt;store: …/.theia (detached — --here pins the store to this folder)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ko5944nm\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspaces-yaml\"&gt;&lt;a href=\"ru/glossary.html#workspaces-yaml\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gn25qj7x\"&gt;workspaces.yaml&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Файл в папке настроек пользователя: какой папке вне git какое хранилище принадлежит. Его пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6c04fpu1\"&gt;theia init&lt;/code&gt;. Если строка ведёт к пропавшему хранилищу, Theia пропускает её и сообщает об этом.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a4ee2qak\"&gt;theia: registry maps &amp;lt;папка&amp;gt; to &amp;lt;хранилище&amp;gt; but no store.db is there — ignoring the row (…)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#user-home-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o5zffj43\"&gt;user-home store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"root\"&gt;&lt;a href=\"ru/glossary.html#root\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;root&lt;/span&gt;&lt;/a&gt;root&lt;/h3&gt;\n&lt;p&gt;Корень. У Theia это слово значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Репозиторий в проекте с несколькими корнями. У него короткое имя, а флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jv5tujrj\"&gt;--root &amp;lt;имя&amp;gt;&lt;/code&gt; сужает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bm09axi0\"&gt;index&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j6dpf12v\"&gt;mem&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dq4z8q2t\"&gt;run&lt;/code&gt; до одного корня. В обычном проекте один корень с именем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-45vcv0pm\"&gt;root&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t10b237m\"&gt;root:&amp;lt;имя&amp;gt;&lt;/code&gt; — часть памяти, записанная с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6xqktrat\"&gt;--root&lt;/code&gt;; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b288n30m\"&gt;theia mem search&lt;/code&gt; она видна как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ayl2tdgf\"&gt;{root:web}&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4z76kdso\"&gt;worktree root&lt;/code&gt; — верхняя папка рабочей копии git, место хранилища по умолчанию.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-15zl987h\"&gt;root cause&lt;/code&gt; — вероятная причина неудачи в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gllzf0qu\"&gt;theia diagnose&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7b2vt8u3\"&gt;root: null&lt;/code&gt; в деталях задачи в TUI — у задачи нет отдельного корня.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hjwoqs8y\"&gt;theia: unknown root 'nope' (declared: root)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wrwmtsm3\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#scope\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rat92nhk\"&gt;scope&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oeogan2n\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-90tgu0ga\"&gt;root cause&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace-manifest\"&gt;&lt;a href=\"ru/glossary.html#workspace-manifest\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6513n3ab\"&gt;kind: Workspace&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Манифест проекта с несколькими корнями: несколько репозиториев делят одно хранилище. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jm6lf997\"&gt;spec.roots&lt;/code&gt; перечислены корни (имя и путь от папки хранилища), в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xdqfo45z\"&gt;spec.primary&lt;/code&gt; — корень по умолчанию. Задачи прогона помечены корнем, а связанные слияния в разных корнях ложатся вместе (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tc19z9m6\"&gt;run.changeset&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5awpa61\"&gt;.theia/config/workspace.yaml&lt;/code&gt; от мастера первой настройки, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-131nkq06\"&gt;multi-root workspace: proj, lib (primary: proj)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-changeset\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pz1050c7\"&gt;run.changeset&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"overlay\"&gt;&lt;a href=\"ru/glossary.html#overlay\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;overlay&lt;/span&gt;&lt;/a&gt;overlay&lt;/h3&gt;\n&lt;p&gt;Папка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ac2r9mnx\"&gt;.theia&lt;/code&gt; без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x27sslmh\"&gt;store.db&lt;/code&gt; внутри одного из корней проекта. В ней только свои настройки и промпты для этого корня. При поиске хранилища Theia пропускает такую папку и идёт выше.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yp5u79yy\"&gt;theia: …/.theia has no store.db — per-root overlay, continuing upward&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6m8qa9wb\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-plans\"&gt;&lt;a href=\"ru/glossary.html#group-plans\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Планы&lt;/span&gt;&lt;/a&gt;Планы&lt;/h2&gt;\n&lt;h3 id=\"plan\"&gt;&lt;a href=\"ru/glossary.html#plan\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sla1jh6t\"&gt;plan&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У слова два смысла.&lt;/p&gt;\n&lt;p&gt;План — сохранённый список задач от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r4wnsv0i\"&gt;theia plan&lt;/code&gt;: у каждой задачи ключ, трек, зависимости и команды проверки. У плана есть отпечаток содержимого (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-opxqz402\"&gt;digest&lt;/code&gt;) и статус: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dszrvolf\"&gt;draft&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l8entrsw\"&gt;approved&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pcohqoou\"&gt;changes_requested&lt;/code&gt;. Запустить можно только одобренный план: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-czinomca\"&gt;theia run --from-plan &amp;lt;planId&amp;gt;&lt;/code&gt;. Любая правка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yaptn5l8\"&gt;theia plan add-context&lt;/code&gt;) даёт новый отпечаток и возвращает план в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ubntemx2\"&gt;draft&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Фаза &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4v92kqp1\"&gt;plan&lt;/code&gt; — шаг задачи трека &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-717cvdon\"&gt;full_spec&lt;/code&gt;, в котором работает планировщик.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4dqhs224\"&gt;pln2akdqddd5c2223ubqzsvlt [draft] 2 tasks — …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o7bdxfly\"&gt;theia plan list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p6c2ez7b\"&gt;approved pln… @ fce3554ee5e2…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zhnmripo\"&gt;run run… plan pln… @ fce3554ee5e2… → 2 tasks&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ot2q8en2\"&gt;task.phase … start → plan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#approved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9wiyr4is\"&gt;approved&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hxryggtz\"&gt;draft&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#changes-requested\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3kc50pjk\"&gt;changes_requested&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#digest\"&gt;digest&lt;/a&gt;, &lt;a href=\"ru/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cua9l04j\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/plan-and-run.html\"&gt;План перед запуском&lt;/a&gt;, &lt;a href=\"ru/reference/plan.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iznwhggs\"&gt;theia plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"approved\"&gt;&lt;a href=\"ru/glossary.html#approved\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-svw5gdaq\"&gt;approved&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Статус одобренного плана. Только такой план запускает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iczo59by\"&gt;theia run --from-plan&lt;/code&gt;. На план в другом статусе Theia отвечает отказом.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a6ibjiz7\"&gt;run: plan pln… is 'draft', not approved — approve it first (theia plan approve)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pk3d0xsd\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x216it8j\"&gt;draft&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"changes-requested\"&gt;&lt;a href=\"ru/glossary.html#changes-requested\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7qpb9qzk\"&gt;changes_requested&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Статус плана после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bksoydyo\"&gt;theia plan request-changes &amp;lt;planId&amp;gt; \"…\"&lt;/code&gt;: вы попросили изменений. Отпечаток плана не меняется, а текст просьбы виден в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qg1y7pw1\"&gt;theia plan show&lt;/code&gt; строкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6m1739z5\"&gt;note:&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-il87nboc\"&gt;changes requested on pln…&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zan802et\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#approved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-21ch3mk7\"&gt;approved&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"open-questions\"&gt;&lt;a href=\"ru/glossary.html#open-questions\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mtoxcx6n\"&gt;OPEN QUESTIONS&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;У планировщика есть вопросы, а ответить в терминале нельзя, например из-за &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s0exb85g\"&gt;--non-interactive&lt;/code&gt;. Theia сохраняет черновик плана с одним пунктом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-87unj1ay\"&gt;unresolved&lt;/code&gt; и печатает вопросы. Ответ добавьте командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-avsk8e59\"&gt;theia plan add-context &amp;lt;planId&amp;gt; \"…\"&lt;/code&gt;, затем создайте план заново или одобрите его.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-znz4qcyz\"&gt;OPEN QUESTIONS — plan saved as draft pln…:&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dfa27ksv\"&gt;answer with: theia plan add-context pln… \"…\" — then re-run theia plan or approve&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tb8y6ck8\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f0yo4cck\"&gt;clarify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verify-pre-flight\"&gt;&lt;a href=\"ru/glossary.html#verify-pre-flight\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hvxiempc\"&gt;verify pre-flight&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Пробный запуск команд проверки из плана на базовом коммите, до одобрения плана. По умолчанию выключен: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tdgko99t\"&gt;run.planVerifyPreflight: disable&lt;/code&gt;. Если команда падает на базе, это нормально, когда задача и должна её починить. Но если падает сама команда, например нет нужного инструмента, исправьте её до одобрения.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-drbil103\"&gt;verify pre-flight: off (opt in with policy run.planVerifyPreflight: always)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-go219xao\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-58qzjfnd\"&gt;verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"cost-estimate\"&gt;&lt;a href=\"ru/glossary.html#cost-estimate\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ajka8kxs\"&gt;cost estimate&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Оценка цены плана по прошлым прогонам в этом хранилище: число задач × средняя цена задачи. Без истории прогонов оценки нет. Если бюджет по умолчанию меньше такой оценки, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gno66d95\"&gt;theia run --from-plan&lt;/code&gt; откажет до первого вызова модели (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d0emhb2r\"&gt;plan floor … exceeds budget&lt;/code&gt;). С явным &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jjj5o73b\"&gt;--budget&lt;/code&gt; Theia только предупредит.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7yd6rybb\"&gt;cost estimate: ~$… (N tasks × $… avg/task from recorded runs)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q0jzzxkb\"&gt;cost estimate: no run history — no estimate&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rsc1o75i\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-maxusdperrun\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fy2hjj1m\"&gt;run.maxUsdPerRun&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"track-override\"&gt;&lt;a href=\"ru/glossary.html#track-override\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-snxii2qj\"&gt;track override&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-llofs6f8\"&gt;theia run --from-plan &amp;lt;planId&amp;gt; --track &amp;lt;трек&amp;gt;&lt;/code&gt; переводит все задачи плана на один трек, только в этом прогоне. Сам план и его отпечаток не меняются.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gpdzhtqi\"&gt;track override: all 2 tasks forced to full_spec for this run (plan content unchanged)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a1jttjct\"&gt;plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-steering\"&gt;&lt;a href=\"ru/glossary.html#group-steering\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Указания и вопросы&lt;/span&gt;&lt;/a&gt;Указания и вопросы&lt;/h2&gt;\n&lt;h3 id=\"steering\"&gt;&lt;a href=\"ru/glossary.html#steering\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;steering&lt;/span&gt;&lt;/a&gt;steering&lt;/h3&gt;\n&lt;p&gt;Указание — ваша подсказка прогону во время работы. Theia записывает её событием &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kkjm04c8\"&gt;user.note [msg]&lt;/code&gt; и добавляет в общие заметки (Σ), которые получат следующие шаги. Способы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qeswwhw6\"&gt;m&lt;/code&gt; в TUI: указание сразу попадает в прогон этого же процесса. Строка ввода показывает адресата: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x8q11e4g\"&gt;steer → tsk…x ▸&lt;/code&gt; (задача под курсором) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jvyoijeb\"&gt;steer → run ▸&lt;/code&gt; (весь прогон);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qvk6a82h\"&gt;theia msg &amp;lt;runId&amp;gt; \"…\"&lt;/code&gt;, с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n79mg996\"&gt;--task &amp;lt;id&amp;gt;&lt;/code&gt; — только для одной задачи;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f5facm8h\"&gt;theia fork &amp;lt;runId&amp;gt; --with \"…\"&lt;/code&gt; — указание для ответвления.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Указание для завершённой или неизвестной задачи Theia перенаправляет всему прогону и пишет об этом.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f875ufkj\"&gt;theia msg&lt;/code&gt; из другого терминала доходит до прогона на паузе (при продолжении) и до продолженного прогона. Прогон, запущенный заново, указание не прочтёт, хотя &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ta1ywrp9\"&gt;theia msg&lt;/code&gt; ответит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-js3dxcgt\"&gt;noted — this run appears live …&lt;/code&gt;. Подробнее — в статье &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yxbds7fj\"&gt;noted for task …fd7pn6tz — folds into its guidance only&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ezc6e19r\"&gt;noted — folds into guidance on: theia run --resume run…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vduu05hj\"&gt;task …xk6rzynf is terminal — rerouted to run-level guidance (…)&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kod1oox8\"&gt;» steer [msg] …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tzih9w9m\"&gt;user.note&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#sigma\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ozjfod0\"&gt;sigma&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;, &lt;a href=\"ru/reference/run-control.html#msg\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r52gm3we\"&gt;theia msg&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"control-bus\"&gt;&lt;a href=\"ru/glossary.html#control-bus\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;control bus&lt;/span&gt;&lt;/a&gt;control bus&lt;/h3&gt;\n&lt;p&gt;Шина управления — способ управлять прогоном из другого процесса без отдельного сервера. Команда или инструмент дописывает событие в журнал прогона, а прогон читает новые события между шагами. Так устроены &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xb3dljvt\"&gt;theia msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wxerpchp\"&gt;theia answer&lt;/code&gt;, режим вопросов &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qoq7gwnu\"&gt;--interaction bus&lt;/code&gt; и инструменты MCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qw5o5y7w\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z69yqwcj\"&gt;run_answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6dkl1wsk\"&gt;run_stop&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 шину читает только продолженный прогон — запущенный командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3hk3p05d\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. Прогон, начатый через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ohzyd413\"&gt;theia run --task …&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jlf1rzxo\"&gt;--from-plan&lt;/code&gt;, а также каждый прогон от инструмента MCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cdk3dsdw\"&gt;run_start&lt;/code&gt; шину не читает. События попадают в журнал, но прогон идёт дальше, как будто их нет: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ovzlyy00\"&gt;theia msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rq3pzphb\"&gt;theia answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cnqezvd4\"&gt;--interaction bus&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8j99us0x\"&gt;run_stop&lt;/code&gt; на него не действуют. Ответы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dpmeqwy1\"&gt;noted — this run appears live: …&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mdpgvkqo\"&gt;honored at the next dispatch boundary&lt;/code&gt; в этом случае вводят в заблуждение.&lt;/p&gt;\n&lt;p&gt;Что работает: клавиши &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-owx0b74r\"&gt;m&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-co2ycx0u\"&gt;q&lt;/code&gt; в TUI того же процесса, Ctrl+C в терминале прогона, а также команды шины после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gqf7wgm8\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. Порядок действий — в разделе &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nuqc4wv5\"&gt;noted — this run appears live: it folds cross-process notes at its next dispatch boundary …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pq5v2x53\"&gt;N questions waiting&lt;/code&gt; в строке статуса.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-stop-request\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qjcx7bjh\"&gt;run.stop_request&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-question\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qpkvb87w\"&gt;run.question&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dispatch-boundary\"&gt;dispatch boundary&lt;/a&gt;, &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dispatch-boundary\"&gt;&lt;a href=\"ru/glossary.html#dispatch-boundary\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;dispatch boundary&lt;/span&gt;&lt;/a&gt;dispatch boundary&lt;/h3&gt;\n&lt;p&gt;Момент между шагами прогона. В этот момент прогон проверяет запрос на остановку и новые указания. Шаг, который уже идёт, включая команду проверки, сначала доделывается. Внутрь идущего вызова модели указание не попадает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qslkbxsh\"&gt;honored at the next dispatch boundary (in-flight work lands first)&lt;/code&gt; (ответ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9jeh0e9h\"&gt;run_stop&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tk6fz73d\"&gt;… at its next dispatch boundary&lt;/code&gt; (ответ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ptqu4ri\"&gt;theia msg&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vrt4qq6j\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#steering\"&gt;steering&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"clarify\"&gt;&lt;a href=\"ru/glossary.html#clarify\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nok53ykx\"&gt;clarify&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Уточняющий вопрос (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vikg5uwn\"&gt;clarify&lt;/code&gt;) — роль не может продолжать без вашего ответа. Спросить могут только планировщик и ведущий, у каждого вопроса есть пояснение, зачем он нужен. Куда приходит вопрос:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;в TUI — форма в панели деталей: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cv48kf3t\"&gt;clarify — task …x (1/2)&lt;/code&gt; и строка ввода &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x6zdlwla\"&gt;answer ▸&lt;/code&gt;. Enter — следующий вопрос, пустой ответ — пропуск, Esc — отказ от остальных;&lt;/li&gt;\n&lt;li&gt;в обычном терминале — строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xbrw7slg\"&gt;the planner needs answers before proceeding:&lt;/code&gt; (так же и для ведущего) и вопросы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9l2unyzn\"&gt;? …&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;в режиме &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ctho5xqw\"&gt;--interaction bus&lt;/code&gt; — событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4slny0bv\"&gt;run.question&lt;/code&gt; и ответ через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1h5jdx00\"&gt;theia answer&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ответы Theia сохраняет фактами памяти &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x3t2j858\"&gt;Q: … A: …&lt;/code&gt;, чтобы не спрашивать снова. Без ответа задача замирает в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x0qi5a16\"&gt;escalated&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8glraowd\"&gt;clarify_unanswered&lt;/code&gt;). Второй подряд вопрос без ответа ставит прогон на паузу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ye1z4ker\"&gt;clarify_stalled&lt;/code&gt;). С &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gc9ktyzs\"&gt;--non-interactive&lt;/code&gt; вопрос сразу остаётся без ответа.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#clarify-unanswered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9if6voy0\"&gt;clarify_unanswered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#clarify-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9o35wegf\"&gt;clarify_stalled&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-question\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z56sym6j\"&gt;run.question&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#non-interactive\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5dy7f9c9\"&gt;--non-interactive&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fact\"&gt;fact&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"probe\"&gt;&lt;a href=\"ru/glossary.html#probe\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tsprtu8x\"&gt;probe&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вопрос о прогоне (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tc0ftyep\"&gt;probe&lt;/code&gt;) — разовый вопрос модели о состоянии прогона: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mgacf365\"&gt;theia probe &amp;lt;runId&amp;gt; \"…\"&lt;/code&gt;. Прогон при этом не меняется: Theia пишет только отдельную запись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d3m1zeww\"&gt;run.probed&lt;/code&gt;. Вопрос — это один вызов модели, лимит по умолчанию — 1 доллар (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sqtr1oo9\"&gt;--budget&lt;/code&gt;). Тот же вопрос повторно отвечается бесплатно из записи. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u7pusyok\"&gt;theia prune&lt;/code&gt; такие записи не удаляет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2w2h4qar\"&gt;[probe run2akdqbfu2w223occvaxl3w of run2akdqb2i4k223pwvesbyig @ …bjr37ync — $0.0000; parent untouched]&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rzgo8p6n\"&gt;· run…  probe&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#none\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-thnq249a\"&gt;none&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fs9lj5bd\"&gt;ask&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pucaq2es\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run-control.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jfe5dssg\"&gt;theia probe&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-inspect\"&gt;&lt;a href=\"ru/glossary.html#group-inspect\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разбор прогона&lt;/span&gt;&lt;/a&gt;Разбор прогона&lt;/h2&gt;\n&lt;h3 id=\"audit-chain\"&gt;&lt;a href=\"ru/glossary.html#audit-chain\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;audit chain&lt;/span&gt;&lt;/a&gt;audit chain&lt;/h3&gt;\n&lt;p&gt;Цепочка аудита — защита журнала от подмены. Каждое событие хранит отпечаток предыдущего, и Theia проверяет, что цепочка не порвана. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4v98logj\"&gt;intact&lt;/code&gt; — журнал цел, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-us756a4e\"&gt;BROKEN&lt;/code&gt; — его изменили после записи. Прогон со сломанной цепочкой нельзя продолжить или ответвить.&lt;/p&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xstqvj6d\"&gt;theia audit verify&lt;/code&gt; проверяет цепочки всех записей: прогонов, вопросов &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-izxwo83i\"&gt;probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0yjyebie\"&gt;ask&lt;/code&gt;, планов и индекса. В 0.2.201 для несуществующего имени команда тоже пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mr188ant\"&gt;intact&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xtesbt9\"&gt;audit chain: intact&lt;/code&gt; в итоге, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i0f0n6x3\"&gt;2akdqb2i4k223pwvesbyig: intact&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-53grickp\"&gt;index: intact&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jjfyh9kr\"&gt;theia audit verify&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g5w654ow\"&gt;‼ audit chain BROKEN at …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dw292r7w\"&gt;replay&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/audit-prune.html#audit-verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tcoebquc\"&gt;theia audit verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"replay\"&gt;&lt;a href=\"ru/glossary.html#replay\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wog549h2\"&gt;replay&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Воспроизведение по журналу (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oxlv5yq5\"&gt;replay&lt;/code&gt;) — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7zx34wak\"&gt;theia replay &amp;lt;runId&amp;gt;&lt;/code&gt; заново читает журнал прогона и пересчитывает итог. Задачи не выполняются, модель не вызывается, ничего не меняется. Команда печатает число событий и состояние цепочки, итоговые фазы задач, число вердиктов и вызовов, а также общие заметки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-geqmwd56\"&gt;sigma: {…}&lt;/code&gt;. Если цепочка сломана, код выхода — 1.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ml2uop7s\"&gt;events: 22; chain: intact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d90cd6oc\"&gt;verdicts: 6; gateway calls: 4&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-akhkb82v\"&gt;sigma: {}&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"ru/glossary.html#sigma\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nuzt5x3r\"&gt;sigma&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b3v6twpe\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vgly7n3d\"&gt;theia replay&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fork\"&gt;&lt;a href=\"ru/glossary.html#fork\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1saahphy\"&gt;fork&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ответвление прогона (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9iyx1id7\"&gt;fork&lt;/code&gt;) — новый прогон, который копирует журнал исходного до выбранного события и дальше идёт иначе. Команда: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z396h7ve\"&gt;theia fork &amp;lt;runId&amp;gt; --at &amp;lt;событие&amp;gt; --with \"…\"&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sxuads4o\"&gt;--at&lt;/code&gt; — событие &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wrxuiwfm\"&gt;verdict&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i0jyjeqj\"&gt;task.phase&lt;/code&gt;, подойдёт короткий номер из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ft97x1dq\"&gt;show --plain&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ftczw3a\"&gt;--with&lt;/code&gt; — указание для нового пути. Запускает ответвление &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zflybw5y\"&gt;theia run --resume &amp;lt;новый id&amp;gt;&lt;/code&gt;. Бюджет ответвления по умолчанию — 5 долларов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;ul&gt;\n&lt;li&gt;Ответвление завершённого прогона без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nive6x9z\"&gt;--at&lt;/code&gt; продолжить нельзя: все задачи в нём уже закончены.&lt;/li&gt;\n&lt;li&gt;Продолженное ответвление сливает работу не в ветку прогона, а в вашу текущую ветку.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gnr8wxy5\"&gt;forked run… @ bjr37ync → run…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wihkdlgl\"&gt;drive it: theia run --resume run…   (gateway: hybrid — prefix replays free)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-44g2hx2y\"&gt;forked from … at …&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rg4y8el7\"&gt;fork → … at … (&amp;lt;причина&amp;gt;)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xjkmdqor\"&gt;theia show&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2haqkrj3\"&gt;forked·&amp;lt;итог&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hybrid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gku74hmj\"&gt;hybrid&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#run-forked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ljmocwb5\"&gt;run.forked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#post-baseline\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ccjunx0\"&gt;post-baseline&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-np3ugcww\"&gt;theia fork&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"hybrid\"&gt;&lt;a href=\"ru/glossary.html#hybrid\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3c0bptz6\"&gt;hybrid&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим шлюза для ответвлений, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tbgawuwg\"&gt;probe&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uhajyw2j\"&gt;ask&lt;/code&gt;. Если ответ на такой же запрос уже сохранён, Theia берёт его бесплатно, а новые запросы отправляет модели и сохраняет. Надпись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nws8rdgi\"&gt;prefix replays free&lt;/code&gt; у ответвления значит только, что скопированная часть не выполняется заново. Сохранённые ответы исходного прогона есть, только если он шёл с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8qcacakf\"&gt;--record&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ufrt6j8j\"&gt;(gateway: hybrid — prefix replays free)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iyzstsve\"&gt;fork resume: gateway in hybrid mode (recorded prefix replays free)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#recording\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p4hehrpo\"&gt;--record&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nnkevr0g\"&gt;fork&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"recording\"&gt;&lt;a href=\"ru/glossary.html#recording\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h4teanh5\"&gt;--record&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-64dwc8wq\"&gt;theia run --record&lt;/code&gt; сохраняет каждый ответ модели в хранилище, чтобы потом повторить его без вызова. Нужен в основном для экспериментов с ответвлениями. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7huzjkkr\"&gt;theia prune&lt;/code&gt; сохранённые ответы не удаляет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2hhtfgep\"&gt;untouched: unfinished runs, gateway recordings (request-keyed, shared), …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oyic3d55\"&gt;theia prune&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hybrid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3labiyrg\"&gt;hybrid&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pf368d48\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#replay-miss\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e9cd4i4p\"&gt;replay_miss&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"post-baseline\"&gt;&lt;a href=\"ru/glossary.html#post-baseline\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4hs71lf1\"&gt;post-baseline&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Траты после точки старта прогона. Для ответвления это траты после отделения: скопированная часть не считается. Так &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-apqlhki1\"&gt;theia compare&lt;/code&gt; сравнивает цену двух прогонов.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kkbo3raa\"&gt;cost A (post-baseline): $0.0000&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hoautt2q\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#compare\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ckb8fay\"&gt;theia compare&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"root-cause\"&gt;&lt;a href=\"ru/glossary.html#root-cause\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e1bnhn3g\"&gt;root cause&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вероятная причина неудачи, которую &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cqlrdnzg\"&gt;theia diagnose&lt;/code&gt; называет по таблице правил, без модели. Значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-opz5mdme\"&gt;verification-loop&lt;/code&gt; — проверка проваливалась раз за разом (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2onqo42p\"&gt;stop_and_fix&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xxtrftfk\"&gt;review-loop&lt;/code&gt; — рецензент повторял замечание, а проверки проходили;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ep4y3k9\"&gt;rejected-by-review&lt;/code&gt; — задачу отбросили без аномалий: работу сделали, но признали неверной;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t2ukfube\"&gt;capability-gap&lt;/code&gt; — исполнитель ответил &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lyvrwwmm\"&gt;cant_do&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mknko4f8\"&gt;budget-exhaustion&lt;/code&gt; — кончились деньги;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m99d5h1a\"&gt;confused-runner&lt;/code&gt; — роль раз за разом нарушала формат ответа;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qdlnd30d\"&gt;runaway-decomposition&lt;/code&gt; — задача дробилась сверх лимитов;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rroe1637\"&gt;inconclusive&lt;/code&gt; — ни одно правило не подошло.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1vxz073t\"&gt;theia diagnose&lt;/code&gt; сохраняет вывод фактом памяти. Повтор того же набора признаков помечается &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dudrms8o\"&gt;(fingerprint seen before — reused)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gqz507t1\"&gt;root cause: rejected-by-review&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pnbm69xu\"&gt;why: …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ao55tkqy\"&gt;fingerprint: 0b0ec207de4ff4b3…  memory: 2akdqbfsxs223o53kulbqg&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#anomaly\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-quu7b42a\"&gt;anomaly&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fact\"&gt;fact&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#diagnose\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g42om82x\"&gt;theia diagnose&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-index\"&gt;&lt;a href=\"ru/glossary.html#group-index\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индекс кода&lt;/span&gt;&lt;/a&gt;Индекс кода&lt;/h2&gt;\n&lt;h3 id=\"intent-index\"&gt;&lt;a href=\"ru/glossary.html#intent-index\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;intent index&lt;/span&gt;&lt;/a&gt;intent index&lt;/h3&gt;\n&lt;p&gt;Индекс кода — короткие карточки о файлах проекта. Карточку каждого файла один раз пишет модель (роль &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8knfya1a\"&gt;indexer&lt;/code&gt;), и карточка используется, пока файл не изменится. Платятся только новые и изменённые файлы. Строит индекс &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wvcrh2dz\"&gt;theia index build&lt;/code&gt;, карточки хранятся в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o9k4ln9m\"&gt;store.db&lt;/code&gt;. Theia передаёт их агентам в каждом запросе как схему проекта.&lt;/p&gt;\n&lt;p&gt;Новые карточки не видны поиску (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vhlm4xeu\"&gt;theia index search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z8flm265\"&gt;theia ask&lt;/code&gt;), пока не собрано новое поколение поиска командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ozsqkrs2\"&gt;theia index reindex&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lntfufgb\"&gt;index: 0 written, 0 current, 1 failed, 2 model calls&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-991tigdp\"&gt;rate: … zero-cost (0%) … $0.0000 locked&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-60pnrhk8\"&gt;theia index status&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#index-entry\"&gt;index entry&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blueprint\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xybdtc8e\"&gt;blueprint&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vwt9aovd\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/guides/knowledge.html\"&gt;Индекс кода, память и вопросы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"index-entry\"&gt;&lt;a href=\"ru/glossary.html#index-entry\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;index entry&lt;/span&gt;&lt;/a&gt;index entry&lt;/h3&gt;\n&lt;p&gt;Запись индекса — карточка одного файла. Её строка устроена так: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zeycm973\"&gt;path[layer/module/importance]: F:… | R:… | A:… | S:…&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n17dth1b\"&gt;layer&lt;/code&gt; — архитектурный слой: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gwo952g8\"&gt;app&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7y0qv1o4\"&gt;domain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f1pzomq9\"&gt;adapter&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cxu7cbgx\"&gt;config&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jzcmu92x\"&gt;test&lt;/code&gt; и другие;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i8opd1it\"&gt;module&lt;/code&gt; — бизнес-область файла;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ie6y21gt\"&gt;importance&lt;/code&gt; — важность от 9 (ядро) до 1 (периферия);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mp23ue7i\"&gt;F&lt;/code&gt; — зачем нужен файл, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eo2skcnc\"&gt;R&lt;/code&gt; — связанные файлы, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ohqur4nb\"&gt;A&lt;/code&gt; — открытый API, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7qnggalc\"&gt;S&lt;/code&gt; — решения, ограничения и подводные камни.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ptkcyax\"&gt;hello.js[script/demo/1]: F:Prints hello to stdout. | R:- | A:- | S:No logic; smoke file.&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pstwn9ov\"&gt;theia index render&lt;/code&gt;, строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fhlxngxz\"&gt;F:&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e0ln4w5u\"&gt;S:&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qu9kyimc\"&gt;theia index search&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blueprint\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rg4dsezo\"&gt;blueprint&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#indexer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rij1msjg\"&gt;indexer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blueprint\"&gt;&lt;a href=\"ru/glossary.html#blueprint\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9pwpbpsu\"&gt;blueprint&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Схема проекта (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x0sms3o2\"&gt;blueprint&lt;/code&gt;) — все карточки индекса одним текстом: самые важные сверху, легенда в начале. Theia добавляет схему в каждый запрос к агентам. Посмотреть её можно командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aohjlebc\"&gt;theia index render&lt;/code&gt;. Хуки Claude Code и Codex добавляют в начало сессии первые 40 строк схемы (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-asndhhai\"&gt;Repo map (head):&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h179fl0g\"&gt;run.blueprintMinImportance&lt;/code&gt; убирает из запросов карточки ниже заданной важности. Theia сообщает об этом строкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1kvzsz9g\"&gt;blueprint floor: …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m0epo7to\"&gt;Repo intent map — one line per code unit: path[layer/module/importance]: F:… | R:… | A:… | S:…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-18zch4js\"&gt;blueprint floor: importance ≥N — injecting K of M entries (…)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;, &lt;a href=\"ru/glossary.html#index-entry\"&gt;index entry&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ylbmgv3\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"stale\"&gt;&lt;a href=\"ru/glossary.html#stale\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f9kw74xy\"&gt;stale&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Устаревшая запись индекса: файл изменился после того, как для него написали карточку, или сменилась версия построителя индекса в Theia. Свежесть (freshness) индекса Theia проверяет без модели, по отпечаткам файлов.&lt;/p&gt;\n&lt;p&gt;Обратите внимание: число в предупреждении &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pj07xe0s\"&gt;index: N stale — plan quality degrades; …&lt;/code&gt; в начале прогона и в подсказке TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kr5uen20\"&gt;idx ⚠N&lt;/code&gt; складывает устаревшие и отсутствующие (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y7rjvffm\"&gt;missing&lt;/code&gt;) записи. Поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wird8m96\"&gt;index: 1 stale&lt;/code&gt; бывает, когда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z6csnjah\"&gt;theia index status&lt;/code&gt; показывает файл только в списке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i786332h\"&gt;missing&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Статусы в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xxe28yyr\"&gt;theia index status&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j25myumr\"&gt;current&lt;/code&gt; — карточка актуальна, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eoveowot\"&gt;stale&lt;/code&gt; — устарела, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nrbk3oyv\"&gt;missing&lt;/code&gt; — карточки нет, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yoe7gf76\"&gt;orphaned&lt;/code&gt; — файла больше нет. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t66n74k7\"&gt;index is fresh&lt;/code&gt; — нет ни устаревших, ни отсутствующих, ни лишних записей.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z6sd93va\"&gt;index: 1 stale — plan quality degrades; run 'theia index build' to refresh&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ebf12a0g\"&gt;index: 1 stale — the map may lag this run's tree&lt;/code&gt; (в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-byt7ack0\"&gt;theia show&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#missing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bk5760x3\"&gt;missing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#orphaned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybchxjwd\"&gt;orphaned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#current\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rzjcf6sg\"&gt;current&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dirty-marks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xcjgu65n\"&gt;dirty-marks&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#idx\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hhyyii7b\"&gt;idx ⚠N&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#indexpolicy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2qiaw6vr\"&gt;indexPolicy&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"missing\"&gt;&lt;a href=\"ru/glossary.html#missing\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-baypx5my\"&gt;missing&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Файл, отслеживаемый git, для которого ещё нет карточки индекса. Входит в число &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mbbdsx41\"&gt;index: N stale&lt;/code&gt;. Карточку создаст &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mqrmavut\"&gt;theia index build&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cnkz7vbh\"&gt;missing (1):&lt;/code&gt; и список файлов в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s8ekquk0\"&gt;theia index status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-icdjwmba\"&gt;theia: 0 indexed · 1 missing&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xik0ziff\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"orphaned\"&gt;&lt;a href=\"ru/glossary.html#orphaned\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eavvfhbb\"&gt;orphaned&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Карточка файла, которого больше нет сред
