=\"ru/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zn9h82gc\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#compare\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y736lpdl\"&gt;theia compare&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"root-cause\"&gt;&lt;a href=\"ru/glossary.html#root-cause\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eya6auaz\"&gt;root cause&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вероятная причина неудачи, которую &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zecofme8\"&gt;theia diagnose&lt;/code&gt; называет по таблице правил, без модели. Значения:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p0viuzcx\"&gt;verification-loop&lt;/code&gt; — проверка проваливалась раз за разом (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5mvb0m62\"&gt;stop_and_fix&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ip90qcy5\"&gt;review-loop&lt;/code&gt; — рецензент повторял замечание, а проверки проходили;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4ntny8e\"&gt;rejected-by-review&lt;/code&gt; — задачу отбросили без аномалий: работу сделали, но признали неверной;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vc1an9rf\"&gt;capability-gap&lt;/code&gt; — исполнитель ответил &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r12gh9cc\"&gt;cant_do&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u4z3hu3n\"&gt;budget-exhaustion&lt;/code&gt; — кончились деньги;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3fruc0zt\"&gt;confused-runner&lt;/code&gt; — роль раз за разом нарушала формат ответа;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-baqcnlin\"&gt;runaway-decomposition&lt;/code&gt; — задача дробилась сверх лимитов;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9uwjl1d4\"&gt;inconclusive&lt;/code&gt; — ни одно правило не подошло.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nazf3uv7\"&gt;theia diagnose&lt;/code&gt; сохраняет вывод фактом памяти. Повтор того же набора признаков помечается &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mdxc54ev\"&gt;(fingerprint seen before — reused)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o1bzsm66\"&gt;root cause: rejected-by-review&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-omzp9fk2\"&gt;why: …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1gsxea57\"&gt;fingerprint: 0b0ec207de4ff4b3…  memory: 2akdqbfsxs223o53kulbqg&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#anomaly\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0gfi5aqk\"&gt;anomaly&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fact\"&gt;fact&lt;/a&gt;, &lt;a href=\"ru/reference/run-inspect.html#diagnose\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-91hsfvrs\"&gt;theia diagnose&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-index\"&gt;&lt;a href=\"ru/glossary.html#group-index\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Индекс кода&lt;/span&gt;&lt;/a&gt;Индекс кода&lt;/h2&gt;\n&lt;h3 id=\"intent-index\"&gt;&lt;a href=\"ru/glossary.html#intent-index\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;intent index&lt;/span&gt;&lt;/a&gt;intent index&lt;/h3&gt;\n&lt;p&gt;Индекс кода — короткие карточки о файлах проекта. Карточку каждого файла один раз пишет модель (роль &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-shc8h560\"&gt;indexer&lt;/code&gt;), и карточка используется, пока файл не изменится. Платятся только новые и изменённые файлы. Строит индекс &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6rixpqgm\"&gt;theia index build&lt;/code&gt;, карточки хранятся в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xmbve1p5\"&gt;store.db&lt;/code&gt;. Theia передаёт их агентам в каждом запросе как схему проекта.&lt;/p&gt;\n&lt;p&gt;Новые карточки не видны поиску (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ndns69hp\"&gt;theia index search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wnbzjkou\"&gt;theia ask&lt;/code&gt;), пока не собрано новое поколение поиска командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-md4rnci9\"&gt;theia index reindex&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h0u6r8wn\"&gt;index: 0 written, 0 current, 1 failed, 2 model calls&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gfqjiceq\"&gt;rate: … zero-cost (0%) … $0.0000 locked&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8evys5ua\"&gt;theia index status&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#index-entry\"&gt;index entry&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blueprint\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jt7i2inr\"&gt;blueprint&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c54xy9yi\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/guides/knowledge.html\"&gt;Индекс кода, память и вопросы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"index-entry\"&gt;&lt;a href=\"ru/glossary.html#index-entry\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;index entry&lt;/span&gt;&lt;/a&gt;index entry&lt;/h3&gt;\n&lt;p&gt;Запись индекса — карточка одного файла. Её строка устроена так: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-61yaz5xi\"&gt;path[layer/module/importance]: F:… | R:… | A:… | S:…&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-38450ghw\"&gt;layer&lt;/code&gt; — архитектурный слой: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kwjeqn5g\"&gt;app&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3bdktb1s\"&gt;domain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-67jop981\"&gt;adapter&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-smbk1c5u\"&gt;config&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-stk6nywc\"&gt;test&lt;/code&gt; и другие;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-517n40xu\"&gt;module&lt;/code&gt; — бизнес-область файла;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m9vnm9e9\"&gt;importance&lt;/code&gt; — важность от 9 (ядро) до 1 (периферия);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tk4fqvbb\"&gt;F&lt;/code&gt; — зачем нужен файл, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cbusm8tx\"&gt;R&lt;/code&gt; — связанные файлы, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zlnqby7p\"&gt;A&lt;/code&gt; — открытый API, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aqhobphl\"&gt;S&lt;/code&gt; — решения, ограничения и подводные камни.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f9p9ad0e\"&gt;hello.js[script/demo/1]: F:Prints hello to stdout. | R:- | A:- | S:No logic; smoke file.&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fao8zt2p\"&gt;theia index render&lt;/code&gt;, строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fz9zdz3h\"&gt;F:&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gkcddh0b\"&gt;S:&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2lo8xyek\"&gt;theia index search&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blueprint\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ej1fcb5f\"&gt;blueprint&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#indexer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gjj23oya\"&gt;indexer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blueprint\"&gt;&lt;a href=\"ru/glossary.html#blueprint\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6d8dix8z\"&gt;blueprint&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Схема проекта (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fxj7zehw\"&gt;blueprint&lt;/code&gt;) — все карточки индекса одним текстом: самые важные сверху, легенда в начале. Theia добавляет схему в каждый запрос к агентам. Посмотреть её можно командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ou0h6tgv\"&gt;theia index render&lt;/code&gt;. Хуки Claude Code и Codex добавляют в начало сессии первые 40 строк схемы (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nuqbww57\"&gt;Repo map (head):&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vqvkrqj6\"&gt;run.blueprintMinImportance&lt;/code&gt; убирает из запросов карточки ниже заданной важности. Theia сообщает об этом строкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a5saoh61\"&gt;blueprint floor: …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e47yubqq\"&gt;Repo intent map — one line per code unit: path[layer/module/importance]: F:… | R:… | A:… | S:…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o8z9rcdb\"&gt;blueprint floor: importance ≥N — injecting K of M entries (…)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;, &lt;a href=\"ru/glossary.html#index-entry\"&gt;index entry&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oi301nsh\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"stale\"&gt;&lt;a href=\"ru/glossary.html#stale\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k1b028wj\"&gt;stale&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Устаревшая запись индекса: файл изменился после того, как для него написали карточку, или сменилась версия построителя индекса в Theia. Свежесть (freshness) индекса Theia проверяет без модели, по отпечаткам файлов.&lt;/p&gt;\n&lt;p&gt;Обратите внимание: число в предупреждении &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0we1rx46\"&gt;index: N stale — plan quality degrades; …&lt;/code&gt; в начале прогона и в подсказке TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rfjg69uy\"&gt;idx ⚠N&lt;/code&gt; складывает устаревшие и отсутствующие (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pwcwr3vq\"&gt;missing&lt;/code&gt;) записи. Поэтому &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ghsmz8tx\"&gt;index: 1 stale&lt;/code&gt; бывает, когда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rhiwmlyn\"&gt;theia index status&lt;/code&gt; показывает файл только в списке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-99by8fwk\"&gt;missing&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Статусы в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nej8duxr\"&gt;theia index status&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0f6437y\"&gt;current&lt;/code&gt; — карточка актуальна, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zg0vdgcd\"&gt;stale&lt;/code&gt; — устарела, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1zttony2\"&gt;missing&lt;/code&gt; — карточки нет, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rfq3f9cj\"&gt;orphaned&lt;/code&gt; — файла больше нет. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ptvsbycr\"&gt;index is fresh&lt;/code&gt; — нет ни устаревших, ни отсутствующих, ни лишних записей.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uaq9vmua\"&gt;index: 1 stale — plan quality degrades; run 'theia index build' to refresh&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o0x9ubgn\"&gt;index: 1 stale — the map may lag this run's tree&lt;/code&gt; (в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g4jd00fq\"&gt;theia show&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#missing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w4hgppdl\"&gt;missing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#orphaned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n2nsu9hl\"&gt;orphaned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#current\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-emqjdm8l\"&gt;current&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dirty-marks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n5t8w07r\"&gt;dirty-marks&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#idx\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9xlgezax\"&gt;idx ⚠N&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#indexpolicy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wddf27we\"&gt;indexPolicy&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"missing\"&gt;&lt;a href=\"ru/glossary.html#missing\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hvxx1k28\"&gt;missing&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Файл, отслеживаемый git, для которого ещё нет карточки индекса. Входит в число &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rgxvu0xu\"&gt;index: N stale&lt;/code&gt;. Карточку создаст &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ov9e8kws\"&gt;theia index build&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u1udahm2\"&gt;missing (1):&lt;/code&gt; и список файлов в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nl7x2x77\"&gt;theia index status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-69yvdmw2\"&gt;theia: 0 indexed · 1 missing&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uzgldadk\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"orphaned\"&gt;&lt;a href=\"ru/glossary.html#orphaned\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wsdu0rre\"&gt;orphaned&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Карточка файла, которого больше нет среди отслеживаемых: его удалили, переименовали или убрали из git. Полная сборка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-07eq33cq\"&gt;theia index build&lt;/code&gt; удаляет такие карточки.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s82plh33\"&gt;orphaned (1):&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cj4v5epc\"&gt;theia index status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3it5gusf\"&gt;pruned N orphaned entries (files left the tree)&lt;/code&gt; после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cq367yik\"&gt;theia index build&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4lzrijrq\"&gt;stale&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"current\"&gt;&lt;a href=\"ru/glossary.html#current\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mulw760z\"&gt;current&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Актуальная карточка: файл не менялся с тех пор, как её написали. Такой файл при сборке индекса ничего не стоит.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7x6yf5ny\"&gt;entries: 4 (3 current)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zq5l35qj\"&gt;theia index status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y155v8p5\"&gt;index: 0 written, 1 current, 0 failed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6auh7ozu\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dirty-marks\"&gt;&lt;a href=\"ru/glossary.html#dirty-marks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-arcu4h86\"&gt;dirty-marks&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Пометки git-хука после коммита: какие файлы изменились с последней сборки индекса. Их ставит хук от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ffumpoqm\"&gt;theia hooks install git&lt;/code&gt;. Это только подсказка: правду о свежести даёт сравнение отпечатков. Пометки хранятся в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gtp8mzdw\"&gt;.theia/index/dirty-paths&lt;/code&gt; и стираются после чистой полной сборки.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ljq808um\"&gt;dirty-marks: 2 paths since last build (post-commit hook)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cukkhuff\"&gt;theia: … · 2 marked dirty&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x2bmk77m\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/integrations/git.html\"&gt;Git&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"search-generation\"&gt;&lt;a href=\"ru/glossary.html#search-generation\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;search generation&lt;/span&gt;&lt;/a&gt;search generation&lt;/h3&gt;\n&lt;p&gt;Поколение поиска — опубликованный снимок поисковых файлов: словарный индекс и, если работают эмбеддинги, векторный. Его собирает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-umpm5axl\"&gt;theia index reindex&lt;/code&gt; из карточек индекса или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nskq7auq\"&gt;theia mem reindex&lt;/code&gt; из памяти. Поиск читает последнее опубликованное поколение, поэтому новые карточки не видны, пока не собрано новое. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1cquy4zn\"&gt;lexical-only&lt;/code&gt; — поколение без векторов. Старые поколения удаляет уборка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nczz48je\"&gt;orphan generations GCed&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cyl2m0b6\"&gt;generation 2akdqci45k223ouugqzblp: 0 entries, published=true (embeddings: local/all-MiniLM-L6-v2/384)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3t8mkzkz\"&gt;head 6m old&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#embeddings\"&gt;embeddings&lt;/a&gt;, &lt;a href=\"ru/glossary.html#head\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nyqko9x5\"&gt;head&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/glossary.html#maintenance\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p6pzkzm4\"&gt;maintenance&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"head\"&gt;&lt;a href=\"ru/glossary.html#head\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vucig0kl\"&gt;head&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ik8kebk\"&gt;head&lt;/code&gt; значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5d57kbg\"&gt;head 6m old&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rgn897y3\"&gt;theia index status&lt;/code&gt; — возраст опубликованного поколения поиска;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-94x6czxs\"&gt;[@ event 22/22 · head]&lt;/code&gt; в TUI — вы смотрите последнее событие журнала;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p4ojmy28\"&gt;HEAD&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9oi2raix\"&gt;base HEAD (no origin remote)&lt;/code&gt; — текущий коммит git.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-angdnlca\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#base\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jdncvm9s\"&gt;base&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"indexpolicy\"&gt;&lt;a href=\"ru/glossary.html#indexpolicy\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-56f92wxe\"&gt;indexPolicy&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n36kdbme\"&gt;maintenance.indexPolicy&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-czfc0sq2\"&gt;policy.yaml&lt;/code&gt;: как поддерживать индекс свежим.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sjxw7m4k\"&gt;alert&lt;/code&gt; (по умолчанию) — только предупреждать в начале прогона и плана;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yuxr1x7x\"&gt;auto&lt;/code&gt; — перед прогоном и планом, в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-od2jcp66\"&gt;theia serve&lt;/code&gt; и при старте сессии агента достраивать устаревшие карточки в пределах &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jswwur2g\"&gt;indexBuildBudgetUsd&lt;/code&gt; (1 доллар). Это вызовы модели;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2uihae62\"&gt;manual&lt;/code&gt; — молчать и пропускать уборку после прогона.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hhydeg3y\"&gt;index: N stale — plan quality degrades; building (budget $1)…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-waf3nhg4\"&gt;(index: stale — background build started; indexPolicy=auto)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e8ntyx6t\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#maintenance\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9paabb3t\"&gt;maintenance&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"maintenance\"&gt;&lt;a href=\"ru/glossary.html#maintenance\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yq7bfbus\"&gt;maintenance&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Уборка после прогона: обновление сводок памяти и удаление старых поколений поиска. Модель не вызывается. Уборка пропускается при &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i9m4p0bq\"&gt;indexPolicy: manual&lt;/code&gt;. Вручную то же делает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bf38qcft\"&gt;theia mem maintain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kv48zff9\"&gt;maintenance: 0 summaries refreshed, 0 orphan generations GCed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5qjxie7e\"&gt;task.note [post_run_maintenance]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-03kj5yyl\"&gt;maintain: 0 summaries refreshed (0 empty), 0 orphan generations GCed (0 artifacts removed)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#indexpolicy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r0bg1o0g\"&gt;indexPolicy&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-memory\"&gt;&lt;a href=\"ru/glossary.html#group-memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Память и поиск&lt;/span&gt;&lt;/a&gt;Память и поиск&lt;/h2&gt;\n&lt;h3 id=\"memory\"&gt;&lt;a href=\"ru/glossary.html#memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;memory&lt;/span&gt;&lt;/a&gt;memory&lt;/h3&gt;\n&lt;p&gt;Память — факты и заметки о проекте в хранилище: решения, ограничения, договорённости. Записи двух видов: факты (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c90okgqf\"&gt;fct…&lt;/code&gt;) и куски текста (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lml1agb8\"&gt;chk…&lt;/code&gt;). Ничего не перезаписывается: новый факт заменяет старый, а старый остаётся в истории. Память читают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-au279lda\"&gt;theia mem search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0hqray20\"&gt;theia ask&lt;/code&gt; и хуки Claude Code и Codex. Ответы на уточняющие вопросы Theia записывает в память сама.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-da38nfpq\"&gt;added fct2akdqbd5ag223ebx7s4jf2&lt;/code&gt; после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9z1snkd0\"&gt;theia mem add&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3piikaqg\"&gt;- [decision] …&lt;/code&gt; в блоке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v908yfo0\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fact\"&gt;fact&lt;/a&gt;, &lt;a href=\"ru/glossary.html#chunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jixgyc8w\"&gt;chunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#supersede\"&gt;supersede&lt;/a&gt;, &lt;a href=\"ru/glossary.html#scope\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-frvnwx3s\"&gt;scope&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/guides/knowledge.html\"&gt;Индекс кода, память и вопросы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fact\"&gt;&lt;a href=\"ru/glossary.html#fact\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fact&lt;/span&gt;&lt;/a&gt;fact&lt;/h3&gt;\n&lt;p&gt;Факт — одно короткое утверждение в памяти. У факта есть вид: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sw021k35\"&gt;decision&lt;/code&gt; (решение), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ewd29lb6\"&gt;constraint&lt;/code&gt; (ограничение), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j7keen1c\"&gt;commitment&lt;/code&gt; (обязательство), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8xt3rqwy\"&gt;observation&lt;/code&gt; (наблюдение), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cctodyy2\"&gt;entity&lt;/code&gt; (сущность), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qb0ln9n6\"&gt;preference&lt;/code&gt; (предпочтение). Идентификатор начинается с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-upi4se93\"&gt;fct&lt;/code&gt;. Добавить факт: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a0wtl1nf\"&gt;theia mem add &amp;lt;вид&amp;gt; &amp;lt;текст&amp;gt;&lt;/code&gt;. В 0.2.201 секреты в тексте факта не скрываются, поэтому не пишите в факты ключи и пароли.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xd0284th\"&gt;2.0164 [lexical-scan+recency] fct2akdqbd5ag223ebx7s4jf2 we use tabs for indentation&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h2hfknvh\"&gt;- [decision] …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1x6b1a5k\"&gt;[sources] fct:…&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zm8nztol\"&gt;theia ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#supersede\"&gt;supersede&lt;/a&gt;, &lt;a href=\"ru/glossary.html#chunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cccp94tp\"&gt;chunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/mem.html#mem-add\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c9g8h9o0\"&gt;theia mem add&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"chunk\"&gt;&lt;a href=\"ru/glossary.html#chunk\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1mkw8jwh\"&gt;chunk&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Кусок текста в памяти, сохранённый дословно, например конец переписки из хука. Идентификатор начинается с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r8u4ftud\"&gt;chk&lt;/code&gt;. Ключи, номера карт и похожие секреты в нём заменяются заглушками. Добавить кусок вручную: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0o2bqjwr\"&gt;theia mem chunk \"…\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5cegezui\"&gt;chunk chk…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oe4gaglu\"&gt;- [chunk] …&lt;/code&gt; в блоке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ugtr7s0\"&gt;&amp;lt;theia-memory&amp;gt;&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tpkahesu\"&gt;chk:…&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gyv0md4b\"&gt;theia ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#checkpoint\"&gt;checkpoint&lt;/a&gt;, &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qt1sno2s\"&gt;masked&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"supersede\"&gt;&lt;a href=\"ru/glossary.html#supersede\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;supersede&lt;/span&gt;&lt;/a&gt;supersede&lt;/h3&gt;\n&lt;p&gt;Замена факта: новый факт вытесняет старый. Старый пропадает из обычного поиска, но остаётся в истории и виден в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9djwbayf\"&gt;theia mem asof&lt;/code&gt; на момент до замены. Замена бывает автоматической, когда новый факт почти совпадает со старым, и ручной: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-85mnczkb\"&gt;theia mem supersede &amp;lt;старый&amp;gt; &amp;lt;новый&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6sl3z4s3\"&gt;added fct… (superseded fct…)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ut1pw1jh\"&gt;superseded &amp;lt;old&amp;gt; -&amp;gt; &amp;lt;new&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#fact\"&gt;fact&lt;/a&gt;, &lt;a href=\"ru/glossary.html#asof\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pwq01v72\"&gt;asof&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"checkpoint\"&gt;&lt;a href=\"ru/glossary.html#checkpoint\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;checkpoint&lt;/span&gt;&lt;/a&gt;checkpoint&lt;/h3&gt;\n&lt;p&gt;Контрольная точка — конец переписки агента (до 16 КБ), который хук сохраняет куском памяти перед сжатием контекста или в конце сессии. Метки: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nrr2muxf\"&gt;compact-checkpoint&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a38jtlzt\"&gt;session-final&lt;/code&gt;. Хук &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8vea3jo\"&gt;Stop&lt;/code&gt; в Claude Code срабатывает после каждого ответа, поэтому такие куски появляются часто.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tuqsfr7y\"&gt;theia mem checkpoint&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c1ra3qsl\"&gt;theia mem checkpoint --final&lt;/code&gt; в настройках хуков.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#chunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vpn1n5it\"&gt;chunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kwewumhf\"&gt;fail-open&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"scope\"&gt;&lt;a href=\"ru/glossary.html#scope\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y5d0hygz\"&gt;scope&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Слово &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9urq7b3s\"&gt;scope&lt;/code&gt; значит разное:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Часть памяти: общая для проекта (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z5vktvwp\"&gt;default&lt;/code&gt;) или одного корня (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lqzgqpg3\"&gt;root:&amp;lt;имя&amp;gt;&lt;/code&gt;, в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jw1rusjg\"&gt;{root:web}&lt;/code&gt;). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bz0wakmo\"&gt;theia diagnose&lt;/code&gt; пишет свои выводы в часть &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w9b7ki9h\"&gt;diagnostics&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Уровень настроек: встроенные значения, настройки пользователя, настройки проекта, настройки корня. Ближний к задаче уровень важнее.&lt;/li&gt;\n&lt;li&gt;Имя цепочки в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o4rniw6s\"&gt;theia audit verify&lt;/code&gt;: идентификатор прогона, вопроса или плана, а также &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oe9zdp9p\"&gt;index&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dvkl4790\"&gt;plan&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"asof\"&gt;&lt;a href=\"ru/glossary.html#asof\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x9digquw\"&gt;asof&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3iywpoia\"&gt;theia mem asof &amp;lt;id&amp;gt; &amp;lt;запрос&amp;gt;&lt;/code&gt; — поиск по памяти в том виде, какой она была в момент записи с этим идентификатором. Нужен именно идентификатор Theia (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-md0s081s\"&gt;fct…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ikqbwl8m\"&gt;run…&lt;/code&gt; и другие), а не дата.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-77ma4gir\"&gt;terryid: neither a body nor a full id: '2099-01-01'&lt;/code&gt; при попытке передать дату.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#supersede\"&gt;supersede&lt;/a&gt;, &lt;a href=\"ru/glossary.html#terryid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m8qxwq5b\"&gt;terryid&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lane\"&gt;&lt;a href=\"ru/glossary.html#lane\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lane&lt;/span&gt;&lt;/a&gt;lane&lt;/h3&gt;\n&lt;p&gt;Способ поиска. В квадратных скобках Theia показывает, какие способы нашли результат:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zw2oxd2q\"&gt;bm25&lt;/code&gt; — поиск по словам в поколении поиска;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sfcz0b64\"&gt;vector&lt;/code&gt; — поиск по смыслу через эмбеддинги;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7hv2o0bc\"&gt;lexical-scan&lt;/code&gt; — поиск по словам прямо в записях памяти;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-roshonko\"&gt;entry-scan&lt;/code&gt; — то же по карточкам индекса, когда поколения ещё нет;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dhcfkuvm\"&gt;symbol&lt;/code&gt; — файлы, где объявлено имя из запроса;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0s2jcsly\"&gt;recency&lt;/code&gt; — самые новые записи памяти, добавляются всегда;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w1feccj6\"&gt;time&lt;/code&gt; — записи с датой из запроса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Число перед скобками растёт с числом способов, которые нашли запись. Из-за &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-62tr847a\"&gt;recency&lt;/code&gt; поиск по памяти почти всегда что-то находит.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zy7o149h\"&gt;2.0164 [lexical-scan+recency] fct… …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mez3fqxm\"&gt;1.0164 [entry-scan] src/calc.ts [domain/billing/8]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d023f646\"&gt;theia: vector lane off — &amp;lt;причина&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#embeddings\"&gt;embeddings&lt;/a&gt;, &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"embeddings\"&gt;&lt;a href=\"ru/glossary.html#embeddings\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;embeddings&lt;/span&gt;&lt;/a&gt;embeddings&lt;/h3&gt;\n&lt;p&gt;Эмбеддинги (числовые векторы смысла) нужны для поиска по смыслу. По умолчанию их считает локальная модель &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3wmdipsl\"&gt;all-MiniLM-L6-v2&lt;/code&gt; размером около 23 МБ: она бесплатна и работает без сети, но при первом использовании скачивается. Другой вариант — провайдер &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bz9wtl49\"&gt;openai&lt;/code&gt;: нужен ключ OpenAI (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2sjamnav\"&gt;OPENAI_API_KEY&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p50nimhn\"&gt;theia setup --openai-key&lt;/code&gt;), и это платно. Прогонам эмбеддинги не нужны.&lt;/p&gt;\n&lt;p&gt;Векторы одной модели не ищутся другой. После смены модели Theia пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wtuzjgqw\"&gt;vector lane off&lt;/code&gt; и ищет только по словам, пока вы не соберёте поиск заново.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tut3zo2j\"&gt;embeddings         : local/all-MiniLM-L6-v2 (384d) — not fetched (~23 MB; …)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lk622q1k\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ymhqdo8b\"&gt;theia: vector lane off — …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#autodownload\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6093yhbv\"&gt;autoDownload&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"autodownload\"&gt;&lt;a href=\"ru/glossary.html#autodownload\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-53shg3le\"&gt;autoDownload&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-io31b9cg\"&gt;gateway.embeddings.autoDownload&lt;/code&gt;: может ли Theia сама скачать локальную модель эмбеддингов. По умолчанию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-94behgra\"&gt;true&lt;/code&gt;. При &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-70c3u7ik\"&gt;false&lt;/code&gt; и отсутствии модели &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-07ykbn8i\"&gt;theia doctor&lt;/code&gt; пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jk26w47e\"&gt;FAIL&lt;/code&gt;, а скачать модель можно командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-94qpotwa\"&gt;theia setup --fetch-embeddings&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yq58tk7t\"&gt;embeddings : local/all-MiniLM-L6-v2 (384d) — FAIL (not fetched and autoDownload is off — theia setup --fetch-embeddings)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#embeddings\"&gt;embeddings&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oyz6nzyy\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ask\"&gt;&lt;a href=\"ru/glossary.html#ask\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1f5s1k58\"&gt;ask&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w3untdq2\"&gt;theia ask \"вопрос\"&lt;/code&gt; отвечает на вопрос о проекте по памяти, индексу кода и трём последним прогонам. Это один вызов модели (роль &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w9o3ur57\"&gt;none&lt;/code&gt;, лимит по умолчанию 1 доллар), в конце — список источников. Без вызова модели и бесплатно &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6h3kd474\"&gt;ask&lt;/code&gt; отвечает, только если не нашлось вообще ничего. Вставка файлов через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hm6zyn7c\"&gt;@&lt;/code&gt; здесь не работает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4jq3eswi\"&gt;[sources] fct:2akdqbd5ag223ebx7s4jf2  run:2akdqb2i4k223pwvesbyig&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ay14do0h\"&gt;[ask run2akdqbfumk223ofyzfk5ix — $0.0000]&lt;/code&gt;, домашний экран &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-894ne1rp\"&gt;· run…  ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"ru/glossary.html#none\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dr58zie7\"&gt;none&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a024bway\"&gt;probe&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/ask.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s6twlcww\"&gt;theia ask&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-context\"&gt;&lt;a href=\"ru/glossary.html#theia-context\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j71hpyjg\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Блок текста, который хук начала сессии (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x1zirs57\"&gt;theia mem context&lt;/code&gt;) добавляет в Claude Code или Codex: начало схемы проекта и последние факты памяти. После блока идёт строка свежести индекса.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ujq7ulht\"&gt;Recent project memory:&lt;/code&gt; внутри блока, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rabxhm8y\"&gt;(index freshness: theia: 0 indexed · 1 missing)&lt;/code&gt; после него.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blueprint\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ddtaqfhy\"&gt;blueprint&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-memory\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cg9y7nqt\"&gt;&amp;lt;theia-memory&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-memory\"&gt;&lt;a href=\"ru/glossary.html#theia-memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hpzuve2n\"&gt;&amp;lt;theia-memory&amp;gt;&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Блок, который хук отправки сообщения (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nao6m26e\"&gt;theia mem recall&lt;/code&gt;) добавляет к вашему сообщению в Claude Code или Codex: записи памяти, похожие на запрос. Если ничего не нашлось или сообщение короче 8 символов, блока нет.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"ru/glossary.html#theia-context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tglkwzjz\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fail-open\"&gt;&lt;a href=\"ru/glossary.html#fail-open\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-im5byn9j\"&gt;fail-open&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Ошибка в хуке не ломает сессию агента: Theia пишет её в поток ошибок и завершает хук с кодом 0. Так работают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d352abde\"&gt;theia mem context&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-73d0upx3\"&gt;theia mem recall&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9qnke7l0\"&gt;theia mem checkpoint&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jcanlem7\"&gt;theia mem recall (fail-open): &amp;lt;сообщение&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#checkpoint\"&gt;checkpoint&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-settings\"&gt;&lt;a href=\"ru/glossary.html#group-settings\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Настройки и модели&lt;/span&gt;&lt;/a&gt;Настройки и модели&lt;/h2&gt;\n&lt;h3 id=\"policy\"&gt;&lt;a href=\"ru/glossary.html#policy\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;,&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q7vvsp6o\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g5ohwr1l\"&gt;policy.yaml&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Политика — главный файл настроек проекта: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-isl48v17\"&gt;.theia/config/policy.yaml&lt;/code&gt;, манифест вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dbbvs6ya\"&gt;kind: Policy&lt;/code&gt;. Разделы: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6j2kck0\"&gt;run&lt;/code&gt; (прогоны и лимиты), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2j4ei96c\"&gt;gateway&lt;/code&gt; (маршрутизация, модели, эмбеддинги), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kapmcp4k\"&gt;ui&lt;/code&gt; (вид по умолчанию), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c2dki941\"&gt;maintenance&lt;/code&gt; (свежесть индекса), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wm8juctr\"&gt;memory&lt;/code&gt; (поиск по памяти). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i7wllgm4\"&gt;theia init&lt;/code&gt; пишет файл, только если его нет, и повторный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lzgm3hyc\"&gt;theia init&lt;/code&gt; его не меняет.&lt;/p&gt;\n&lt;p&gt;Проверка строгая: опечатка в ключе останавливает все команды с сообщением вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6a7oatyh\"&gt;config: policy.yaml: invalid manifest (spec.run: unrecognized_keys)&lt;/code&gt;. В сообщении есть раздел, но нет самого ключа. Настройки из разных файлов сливаются на один уровень: карта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-knrn7ofk\"&gt;gateway.routing&lt;/code&gt; из ближнего файла заменяет карту целиком.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xuhzz741\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;, &lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"manifest\"&gt;&lt;a href=\"ru/glossary.html#manifest\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;manifest&lt;/span&gt;&lt;/a&gt;manifest&lt;/h3&gt;\n&lt;p&gt;Манифест — YAML-файл настроек Theia с полями &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dgj7i6ax\"&gt;apiVersion: theia.dev/v1alpha1&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z5tsyo3p\"&gt;kind&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-po1cb19x\"&gt;metadata&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6m0wt0qc\"&gt;spec&lt;/code&gt;. Виды: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wfnowc8k\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o1pubkjr\"&gt;TransportRegistry&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ifkr4ol6\"&gt;Workspace&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p5d1pqhw\"&gt;Context&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5uv71r2z\"&gt;Pricing&lt;/code&gt;. Манифесты лежат в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hz6a66ww\"&gt;.theia/config/&lt;/code&gt; проекта. В папке настроек пользователя (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bm9ggcjx\"&gt;config/&lt;/code&gt;) допустимы только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hwdtq2v7\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ncn8ayg7\"&gt;Pricing&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-na0rgg3a\"&gt;TransportRegistry&lt;/code&gt;. Theia читает файлы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5kqk9367\"&gt;.yaml&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f0yfb9t5\"&gt;.yml&lt;/code&gt; по алфавиту.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#policy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5n92ktle\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5bn2lvd8\"&gt;policy.yaml&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o8l7tc55\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8u71uxj5\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7atri9p6\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#pricing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sp5cqevr\"&gt;kind: Pricing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"transport-registry\"&gt;&lt;a href=\"ru/glossary.html#transport-registry\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y8nomckb\"&gt;TransportRegistry&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Список транспортов, которые разрешено использовать: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-meizul0y\"&gt;.theia/config/registry.yaml&lt;/code&gt;. Маршрут к транспорту не из списка не сработает. Транспорт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ftfvznzp\"&gt;fake&lt;/code&gt; разрешён всегда. У каждой строки есть поля &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zcjvqpc0\"&gt;name&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u7c82grd\"&gt;provider&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xevnmsaa\"&gt;dataClasses&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dnmqpak7\"&gt;owner&lt;/code&gt;; в 0.2.201 на работу влияет только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nvbxjdk1\"&gt;name&lt;/code&gt;. Транспорта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6fq0le0\"&gt;codex-full&lt;/code&gt; в списке по умолчанию нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uofbwrsz\"&gt;gateway fatal: gateway: transport 'nope' is not manifest-registered (docs/11 §6)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nt102x4b\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway\"&gt;&lt;a href=\"ru/glossary.html#gateway\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;gateway&lt;/span&gt;&lt;/a&gt;gateway&lt;/h3&gt;\n&lt;p&gt;Шлюз (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1kms2q4u\"&gt;gateway&lt;/code&gt;) — единая дверь, через которую идут все запросы к моделям. Он проверяет текст на секреты, выбирает транспорт по маршрутизации, следит за бюджетом, повторяет запрос при временной ошибке, фиксирует цену и пишет вызов в журнал.&lt;/p&gt;\n&lt;p&gt;Где встречается: строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ug53cutv\"&gt;gateway       &amp;lt;role&amp;gt;@&amp;lt;transport&amp;gt; → ok $0.0000&lt;/code&gt;, итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dacaikuk\"&gt;N gateway calls&lt;/code&gt;, ошибка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o30gru0m\"&gt;gateway: no route for role '…' (set gateway.routing)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rzdrrd2p\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#budget\"&gt;budget&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-routing\"&gt;&lt;a href=\"ru/glossary.html#gateway-routing\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-felnh5zg\"&gt;gateway.routing&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Маршрутизация: через какой транспорт работает каждая роль. Это карта в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zwb2o2el\"&gt;policy.yaml&lt;/code&gt;; строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9tvb122y\"&gt;\"*\"&lt;/code&gt; действует для всех ролей без своей строки. Если у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rla5enwd\"&gt;fresh_implementer&lt;/code&gt; нет строки, он работает там же, где &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-po1a4rgd\"&gt;implementer&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ec5fhnpw\"&gt;theia init --harness claude&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lebk9byi\"&gt;--harness codex&lt;/code&gt; пишет готовую карту. Опечатку в имени роли Theia молча пропускает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vkdswnk7\"&gt;initialized …/.theia (harness: codex — switch any time: gateway.routing in .theia/config/policy.yaml)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gd4ccdjl\"&gt;gateway: no route for role 'reviewer' (set gateway.routing)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-models\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ukhh2k6c\"&gt;gateway.models&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#role\"&gt;role&lt;/a&gt;, &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-models\"&gt;&lt;a href=\"ru/glossary.html#gateway-models\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-49k8t1dk\"&gt;gateway.models&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Модель для роли: карта «роль → идентификатор модели» в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0sj9nuyv\"&gt;policy.yaml&lt;/code&gt;. Theia передаёт модель движку (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-konrzxtn\"&gt;--model&lt;/code&gt; для Claude Code, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gevxhqok\"&gt;-m&lt;/code&gt; для Codex) и имя не проверяет: неверное имя вызовет ошибку внутри движка. Без строки для роли работает модель транспорта по умолчанию.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zsw7u0wd\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"transport\"&gt;&lt;a href=\"ru/glossary.html#transport\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;transport&lt;/span&gt;&lt;/a&gt;transport&lt;/h3&gt;\n&lt;p&gt;Транспорт — именованный способ вызвать модель: какой движок, с какими правами и какой моделью по умолчанию. Встроенные транспорты: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t7s1o49i\"&gt;codex&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-banxwqy6\"&gt;codex-terra&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z1kgclvd\"&gt;codex-write&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-toqbhne8\"&gt;codex-jailed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-shghbdxc\"&gt;codex-full&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y31ssqf9\"&gt;claude&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nzvigr75\"&gt;claude-write&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1z6obkre\"&gt;claude-index&lt;/code&gt; и тестовый &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8pms5yx7\"&gt;fake&lt;/code&gt;. Например, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nmg4u8hf\"&gt;claude-write&lt;/code&gt; может править файлы, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-913odqgh\"&gt;claude&lt;/code&gt; работает без инструментов правки файлов. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6hydc3k4\"&gt;--plain&lt;/code&gt; транспорт стоит после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-swkuz03r\"&gt;@&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mt379d92\"&gt;reviewer@claude&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bhazl6pq\"&gt;@blocked&lt;/code&gt; значит, что вызов остановила проверка на секреты.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e8a9jf2y\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ar9okr5w\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blocked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gwbeuvs6\"&gt;@blocked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"harness\"&gt;&lt;a href=\"ru/glossary.html#harness\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;harness&lt;/span&gt;&lt;/a&gt;harness&lt;/h3&gt;\n&lt;p&gt;Движок (harness) — внешний CLI-агент, через который работает модель: Claude Code (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tfiki4cu\"&gt;claude&lt;/code&gt;) или Codex (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4z6yu8sz\"&gt;codex&lt;/code&gt;). Движок работает по подписке, в которую вы вошли в самом CLI; ключ Anthropic API для Claude Code Theia не использует. Семейство движка выбирает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p9tcr5ih\"&gt;theia init --harness claude&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sm19hkri\"&gt;--harness codex&lt;/code&gt;, а точнее всё задаёт маршрутизация. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cllqzpkn\"&gt;fake&lt;/code&gt; — тестовый движок без модели для разработчиков; ответы вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pbyza9m1\"&gt;fake-green …&lt;/code&gt; приходят только от него.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2p25vh6l\"&gt;codex subscription : …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-76a922yo\"&gt;claude code        : …&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tl1rlnvu\"&gt;harnesses          : FAIL (…)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8oazh79w\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline
