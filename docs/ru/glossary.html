-code-id-tw0b2tw2\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d1x016d5\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/models.html\"&gt;Модели для задач&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"context\"&gt;&lt;a href=\"ru/glossary.html#context\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4erddro6\"&gt;kind: Context&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Манифест с правилами и справочными текстами, которые Theia добавляет в запросы агентов как текст. Источник записи — строка, файл или шаблон пути; когда добавлять — всегда, для ролей, треков или путей. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zdx82mt9\"&gt;theia init&lt;/code&gt; сам создаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-se0kcemf\"&gt;context-rules.yaml&lt;/code&gt;, если нашёл файлы правил вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cw2c7wqk\"&gt;.cursorrules&lt;/code&gt;. Путь к файлу пишите относительно проекта: абсолютный путь не работает.&lt;/p&gt;\n&lt;p&gt;Если добавленного текста больше &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xht5v3rk\"&gt;run.contextAlertChars&lt;/code&gt; (200 000 символов), Theia предупреждает, но загружает всё. Жёсткий лимит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s7otcy5m\"&gt;run.contextRefuseChars&lt;/code&gt; по умолчанию не задан.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p736flza\"&gt;context       injected: …&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z1u6rmlb\"&gt;--plain&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uudi6hp6\"&gt;context injected (N entries)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8c00jeg3\"&gt;context alert: task … injects N chars (&amp;gt; contextAlertChars=200000) — loading everything&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#ai-rules\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1i5tjwot\"&gt;ai rules&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ctx\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kzry9o2v\"&gt;ctx ⚠N&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"pre-task\"&gt;&lt;a href=\"ru/glossary.html#pre-task\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nllxqpnm\"&gt;pre-task&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Команды из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-devfwyp8\"&gt;run.preTask&lt;/code&gt;, которые Theia запускает перед первым шагом исполнителя. Если обязательная команда (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nlafpem7\"&gt;mustPass&lt;/code&gt;) упала, задача замирает ещё до вызова модели и ждёт ведущего.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uqblkhro\"&gt;pre-task      &amp;lt;task&amp;gt; N gate(s), M failed&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5hz725y2\"&gt;pre-task gates: N run, M failed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#illegal-verdict\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qqnil98g\"&gt;illegal_verdict&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#policy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1bf284de\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oz5lq5uu\"&gt;policy.yaml&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-rulessot\"&gt;&lt;a href=\"ru/glossary.html#run-rulessot\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-94tlfxhi\"&gt;run.rulesSoT&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим «правила только через Theia». В копиях задач файлы правил (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6qj6w37g\"&gt;AGENTS.md&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vj5kedun\"&gt;CLAUDE.md&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-29agll5a\"&gt;.cursorrules&lt;/code&gt; и другие) заменяются заглушкой, а Codex не читает свои файлы проекта. Сами &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aydt12pz\"&gt;AGENTS.md&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wn6fc0m6\"&gt;CLAUDE.md&lt;/code&gt; при этом в запросы не попадают: добавьте их манифестом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eb1ymbp9\"&gt;Context&lt;/code&gt;. По умолчанию режим выключен.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q2ull27c\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#ai-rules\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9r34pp2f\"&gt;ai rules&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-security\"&gt;&lt;a href=\"ru/glossary.html#group-security\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Безопасность и песочница&lt;/span&gt;&lt;/a&gt;Безопасность и песочница&lt;/h2&gt;\n&lt;h3 id=\"data-class\"&gt;&lt;a href=\"ru/glossary.html#data-class\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;data class&lt;/span&gt;&lt;/a&gt;data class&lt;/h3&gt;\n&lt;p&gt;Класс данных — насколько опасно отправлять текст модели. Шлюз проверяет каждый запрос простыми шаблонами:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bfjchots\"&gt;prohibited&lt;/code&gt; — отправлять нельзя: закрытые ключи, ключи API (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pl01dofn\"&gt;sk-…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-svl5mles\"&gt;AKIA…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-56wc9lrr\"&gt;ghp_…&lt;/code&gt;), номера карт, seed-фразы. Вызов останавливается.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i7sv32s6\"&gt;restricted&lt;/code&gt; — можно только со скрытием: адреса почты заменяются на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-19v1z1k8\"&gt;[EMAIL]&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4htqnwrf\"&gt;permitted&lt;/code&gt; — текст уходит как есть.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Шаблоны не ловят пароли, телефоны, имена и ключи другого вида. Текст задачи с секретом всё равно сохраняется в хранилище. Поле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uetf34ly\"&gt;dataClasses&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0v55o9ss\"&gt;registry.yaml&lt;/code&gt; в 0.2.201 ни на что не влияет.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b5iftci2\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blocked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xs7dwmqf\"&gt;@blocked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-maskoverrides\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bisew8sc\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-67xv91xa\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"masked\"&gt;&lt;a href=\"ru/glossary.html#masked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-77mm60vs\"&gt;masked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Скрытый фрагмент: шлюз заменил опасный текст заглушкой перед отправкой — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dga0qfd5\"&gt;[EMAIL]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6t3pjo3s\"&gt;[API KEY]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j65f6yzg\"&gt;[CARD NUMBER]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4fswbhme\"&gt;[PRIVATE KEY]&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tirfbnuw\"&gt;[SEED PHRASE]&lt;/code&gt;. Число замен видно в данных вызова (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a5w856xd\"&gt;masked={\"email\":1}&lt;/code&gt;) и в заголовке вставленного файла (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1owny39d\"&gt;masked email×1&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#blocked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bach6mge\"&gt;@blocked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p0ct27bk\"&gt;@path&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blocked\"&gt;&lt;a href=\"ru/glossary.html#blocked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nync0llv\"&gt;@blocked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Вызов остановлен проверкой на секреты: в тексте есть данные класса &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-57p77r5s\"&gt;prohibited&lt;/code&gt;. В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4nfzakpd\"&gt;--plain&lt;/code&gt; вместо транспорта стоит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o3mc988l\"&gt;blocked&lt;/code&gt;, а в комментарии вердикта — какой шаблон сработал. Если так блокируются все роли, прогон встаёт на паузу.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ourl5eyf\"&gt;gateway       implementer@blocked → fatal&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uan0ktlt\"&gt;gateway fatal: gateway: prohibited content (api_key) — call blocked (THE-014)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqdpnlqh\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#gateway-maskoverrides\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8gkux5gh\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-maskoverrides\"&gt;&lt;a href=\"ru/glossary.html#gateway-maskoverrides\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dsmzeeme\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Исключения для шаблонов секретов в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-exbhgdvv\"&gt;policy.yaml&lt;/code&gt;. Для шаблона можно задать &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b0u1x3wi\"&gt;off&lt;/code&gt; (не проверять), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a7q2741d\"&gt;restricted&lt;/code&gt; (скрывать, но не останавливать) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cx7gvo4w\"&gt;prohibited&lt;/code&gt; (останавливать). Имена шаблонов: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xdy8bo9r\"&gt;pem_private_key&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a562ryfp\"&gt;api_key&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oabgf8y9\"&gt;card_number&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hy3d4u1k\"&gt;seed_phrase&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-04uygwd9\"&gt;email&lt;/code&gt;. Пригодится, если шаблон ошибается на ваших данных, например принимает длинные номера за номера карт.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"ru/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qfn4zvu6\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"sandbox-tier\"&gt;&lt;a href=\"ru/glossary.html#sandbox-tier\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;sandbox tier&lt;/span&gt;&lt;/a&gt;sandbox tier&lt;/h3&gt;\n&lt;p&gt;Уровень песочницы — сколько свободы у агентов на вашей машине. Параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fh91x06b\"&gt;run.sandboxTier&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wcbmk7pd\"&gt;standard&lt;/code&gt; (по умолчанию) — агент пишет только в копии задачи, git делает Theia;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n22zsck1\"&gt;jailed-full&lt;/code&gt; — полный доступ внутри песочницы &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ju71xbz\"&gt;theia jail&lt;/code&gt;; в 0.2.201 работает только на Linux;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-subkmndr\"&gt;trusted-full&lt;/code&gt; — полный доступ ко всей машине без песочницы. Нужна строка транспорта &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8lhhz3ps\"&gt;codex-full&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-032thjzc\"&gt;registry.yaml&lt;/code&gt;, а Theia печатает громкое предупреждение.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;В режимах &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kxog7fqm\"&gt;jailed-full&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fk6iff3d\"&gt;trusted-full&lt;/code&gt; исполнители всегда работают через Codex.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zv97o3vy\"&gt;!! sandboxTier trusted-full: implementer agents run with FULL HOST ACCESS, unjailed (manifest-recorded opt-in)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pg56drr8\"&gt;jailed-full tier unavailable&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pbxwlzyy\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iw8ofkx4\"&gt;jail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#posture\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y0etid59\"&gt;posture&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-raxfx0jp\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"posture\"&gt;&lt;a href=\"ru/glossary.html#posture\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ao4pl72k\"&gt;posture&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Режим доступа (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dm1taw6n\"&gt;posture&lt;/code&gt;) — рабочее слово Theia для выбранного набора настроек. Чаще всего так называют уровень песочницы: насколько агентам можно менять систему. Слово встречается в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bhkw8kik\"&gt;theia help&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3rgb3uw\"&gt;seeded posture&lt;/code&gt; у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zjreu6vs\"&gt;theia eval demo create&lt;/code&gt;) и в параметрах замеров платформы. Отдельного параметра с таким именем нет.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"jail\"&gt;&lt;a href=\"ru/glossary.html#jail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ql91a49j\"&gt;jail&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Песочница для команды: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-06sqsd4n\"&gt;theia jail -- &amp;lt;команда&amp;gt;&lt;/code&gt; запускает команду так, что система доступна только на чтение, а писать можно лишь в разрешённые папки. На Linux песочница работает через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d7ct0mcc\"&gt;bwrap&lt;/code&gt;; есть и вариант через контейнер (Docker или Podman). Встроенной песочницы для macOS в 0.2.201 нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sb6f2uc6\"&gt;jail: unavailable — no sandbox backend on darwin yet (…); use standard or trusted-full&lt;/code&gt;, строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-19jcoom0\"&gt;jail (none        )&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ealij31f\"&gt;jail (container   )&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bx6z7jy1\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;, &lt;a href=\"ru/reference/jail.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b9xrnao0\"&gt;theia jail&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-resources\"&gt;&lt;a href=\"ru/glossary.html#run-resources\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-924tdesm\"&gt;run.resources&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Лимиты памяти, процессора и числа процессов для команд и агентов прогона: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zrn1kdoy\"&gt;memoryMax&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4a672zke\"&gt;cpuQuota&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-svay7rsy\"&gt;tasksMax&lt;/code&gt;. Работают только на Linux через systemd. На другой системе прогон с такими лимитами не запустится.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b5iwn5b0\"&gt;resources        : unavailable (run.resources needs linux cgroups (systemd-run); platform is darwin) — …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1wrf0tpj\"&gt;jail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;Песочница&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-install\"&gt;&lt;a href=\"ru/glossary.html#group-install\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Установка и обновление&lt;/span&gt;&lt;/a&gt;Установка и обновление&lt;/h2&gt;\n&lt;h3 id=\"pat\"&gt;&lt;a href=\"ru/glossary.html#pat\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PAT&lt;/span&gt;&lt;/a&gt;PAT&lt;/h3&gt;\n&lt;p&gt;Токен GitHub (PAT) — ключ доступа к закрытому репозиторию выпусков Theia. Нужен для &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9yoli0xa\"&gt;theia self update&lt;/code&gt;, скачивания версий через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tnqmgqzd\"&gt;--x-release&lt;/code&gt; и ежедневной проверки обновлений. Для обычной работы не нужен. Хранится в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3d2hh137\"&gt;config.yaml&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-40hv6mtg\"&gt;github.pat&lt;/code&gt;). Переменная &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iueaqqri\"&gt;THEIA_GH_TOKEN&lt;/code&gt; важнее файла, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p31d87sd\"&gt;GH_TOKEN&lt;/code&gt; Theia не читает. Значение токена Theia не печатает.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g2n4h0p9\"&gt;github pat         : present&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rr6bizp4\"&gt;absent (release download/self update unavailable)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3woy6ubd\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mi2p0art\"&gt;self update: no GitHub PAT — theia setup --pat &amp;lt;token&amp;gt; (or THEIA_GH_TOKEN)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"ru/glossary.html#update-notice\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-93k4zz6b\"&gt;is available&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;Ключи и доступы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"channel\"&gt;&lt;a href=\"ru/glossary.html#channel\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;channel&lt;/span&gt;&lt;/a&gt;channel&lt;/h3&gt;\n&lt;p&gt;Канал обновлений — какие версии получает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cq7mxdld\"&gt;theia self update&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o5ghg78q\"&gt;release&lt;/code&gt; (по умолчанию) — обычные выпуски. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5o9a50j5\"&gt;prerelease&lt;/code&gt; — ещё и тестовые сборки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ci37zf6l\"&gt;-pre.N&lt;/code&gt;, для разработчиков платформы. Канал задаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-or0u4gjz\"&gt;theia setup --channel&lt;/code&gt;, а хранится он в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ogw22t5a\"&gt;config.yaml&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9fsod2iq\"&gt;update.channel&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ycn3ur7e\"&gt;prerelease channel (update.channel) — resolving against -pre builds too&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ku0ly5mb\"&gt;already up to date (v0.2.201)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"vendor\"&gt;&lt;a href=\"ru/glossary.html#vendor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;vendor deliverables&lt;/span&gt;&lt;/a&gt;vendor deliverables&lt;/h3&gt;\n&lt;p&gt;Файлы поставки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-39ywbyoo\"&gt;vendor&lt;/code&gt;) — набор файлов, который идёт вместе с Theia: промпты ролей (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lg1hxqb5\"&gt;prompts/kernel.yaml&lt;/code&gt;), правила и скиллы. В 0.2.201 работают только промпты, а правила и скиллы из поставки ничего не читает. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mc89ktuz\"&gt;theia doctor&lt;/code&gt; сверяет файлы по отпечаткам, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9gbjb64x\"&gt;theia self update&lt;/code&gt; обновляет их. Без этих файлов не работают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bofcgl1l\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n100bao1\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hc94746y\"&gt;ask&lt;/code&gt; и другие команды с моделями.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ssj4cc7n\"&gt;vendor deliverables: ok — 9ff60d108678 verified (21 files); matches this release&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kpzh21fn\"&gt;theia: no vendor deliverables found (…)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7dr141c\"&gt;doctor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;Правила и промпты&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"user-config\"&gt;&lt;a href=\"ru/glossary.html#user-config\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;user config&lt;/span&gt;&lt;/a&gt;user config&lt;/h3&gt;\n&lt;p&gt;Файл личных настроек &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kg3kauzu\"&gt;config.yaml&lt;/code&gt; в папке настроек пользователя: токен GitHub (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xnd3v2rr\"&gt;github.pat&lt;/code&gt;), ключ OpenAI (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fy7r5pwj\"&gt;openai.apiKey&lt;/code&gt;), канал обновлений (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mgkoimoe\"&gt;update.channel&lt;/code&gt;) и путь для разработчиков (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lcnrv80l\"&gt;dev.root&lt;/code&gt;). Права 0600: читать файл может только владелец. Пишут его &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tnh44oh2\"&gt;theia setup&lt;/code&gt; и мастер первой настройки; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i406lx3n\"&gt;theia setup&lt;/code&gt; удаляет ключи, которых не знает. Папка — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z7aoz4b0\"&gt;~/.config/theia&lt;/code&gt; на Linux. На macOS это &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7t2sip05\"&gt;~/Library/Application Support/theia&lt;/code&gt;; если такой папки нет, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-31om3hmb\"&gt;~/.config/theia&lt;/code&gt; есть, Theia берёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h1a9q70v\"&gt;~/.config/theia&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z3yual8k\"&gt;user config        : present&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybpys2vg\"&gt;absent (&amp;lt;путь&amp;gt; — theia setup)&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-49fri04x\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8lwwktnp\"&gt;wrote github.pat to &amp;lt;путь&amp;gt; (mode 0600)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"ru/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"setup-wizard\"&gt;&lt;a href=\"ru/glossary.html#setup-wizard\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;setup wizard&lt;/span&gt;&lt;/a&gt;setup wizard&lt;/h3&gt;\n&lt;p&gt;Мастер первой настройки. Открывается вместо домашнего экрана, когда вы запускаете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wfy9s6xc\"&gt;theia&lt;/code&gt; без команды в терминале, а личных настроек или хранилища ещё нет. Спрашивает токен GitHub и ключ OpenAI (можно пропустить), предлагает создать хранилище в текущей папке, выбрать движок и добавить другие корни. В отличие от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hqvgsflh\"&gt;theia init&lt;/code&gt;, мастер всегда создаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m6aupcdo\"&gt;.theia&lt;/code&gt; в текущей папке, даже в подпапке репозитория.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pie6pkxe\"&gt;theia setup — Enter accepts the default, empty answers skip.&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xvh845dh\"&gt;initialize a theia workspace in …? [Y/n]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vlkaql1x\"&gt;done — try: theia doctor, then theia run --task \"…\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;, &lt;a href=\"ru/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"ru/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"ru/install/first-setup.html\"&gt;Первая настройка&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"update-notice\"&gt;&lt;a href=\"ru/glossary.html#update-notice\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sr39e5o9\"&gt;is available&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Серая строка о новой версии: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ax8d2fx\"&gt;theia v&amp;lt;новая&amp;gt; is available (running v&amp;lt;ваша&amp;gt;) — theia self update&lt;/code&gt;. Theia проверяет обновления не чаще раза в сутки, только с токеном GitHub и не дольше полутора секунд. При любой ошибке проверка молчит. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cb2s6n0x\"&gt;theia version&lt;/code&gt; проверку не запускает.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"x-release\"&gt;&lt;a href=\"ru/glossary.html#x-release\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a61a2myu\"&gt;--x-release&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Глобальный флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-spq6zt0z\"&gt;--x-release &amp;lt;версия&amp;gt;&lt;/code&gt; (или переменная &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zrj7x4pm\"&gt;THEIA_X_RELEASE&lt;/code&gt;): выполнить команду другой версией Theia из кэша, при необходимости скачав её. Если версию получить нельзя, команда завершается ошибкой, а не работает текущей версией. Неверное значение &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q9elmsic\"&gt;THEIA_X_RELEASE&lt;/code&gt; ломает все команды, даже &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r5wnqm23\"&gt;theia version&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;, &lt;a href=\"ru/reference/commands.html#global-flags\"&gt;Глобальные флаги&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dev\"&gt;&lt;a href=\"ru/glossary.html#dev\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2r54eeug\"&gt;--dev&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Флаг для разработчиков платформы: запустить Theia из дерева исходников по пути после флага или из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x03kisml\"&gt;dev.root&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0zjx61qa\"&gt;~/.config/theia/config.yaml&lt;/code&gt;. В установленной версии дерева исходников нет, поэтому флаг останавливает команду с кодом 1 и печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eox9uj7s\"&gt;--dev: no development root — pass a path (theia --dev &amp;lt;path&amp;gt; …) or set dev.root in ~/.config/theia/config.yaml (theia setup --dev-root &amp;lt;path&amp;gt;)&lt;/code&gt;. Справку он не печатает. С чужим путём ответ другой: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6coyjez6\"&gt;--dev: &amp;lt;путь&amp;gt; does not look like a theia dev tree (missing apps/theia/src/main.ts)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#x-release\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bjajv3px\"&gt;--x-release&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/install/update.html#for-developers\"&gt;Для разработчиков платформы&lt;/a&gt;, &lt;a href=\"ru/reference/commands.html#global-flags\"&gt;Глобальные флаги&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-integrations\"&gt;&lt;a href=\"ru/glossary.html#group-integrations\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Интеграции&lt;/span&gt;&lt;/a&gt;Интеграции&lt;/h2&gt;\n&lt;h3 id=\"hooks\"&gt;&lt;a href=\"ru/glossary.html#hooks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;hooks&lt;/span&gt;&lt;/a&gt;hooks&lt;/h3&gt;\n&lt;p&gt;Хуки — короткие команды, которые Claude Code, Codex или git запускают сами при событиях. Их ставит &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2am41ogf\"&gt;theia hooks install&lt;/code&gt;:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rbpe0cxa\"&gt;claude&lt;/code&gt; — хуки начала сессии (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5l32yfv\"&gt;theia mem context&lt;/code&gt;), отправки сообщения (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wv6gtdfr\"&gt;theia mem recall&lt;/code&gt;), сжатия контекста и остановки (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6ledbts\"&gt;theia mem checkpoint&lt;/code&gt;), строка статуса, MCP-сервер в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vao1vif3\"&gt;.mcp.json&lt;/code&gt; и скилл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tysv2nfc\"&gt;/theia&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-evseus7r\"&gt;codex&lt;/code&gt; — те же хуки памяти в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jjhjqzy2\"&gt;.codex/hooks.json&lt;/code&gt; и MCP-сервер;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0bsj0hhk\"&gt;git&lt;/code&gt; — хук после коммита, который ставит пометки для индекса.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Команды удаления нет, хуки убирают вручную. Хуки запускают Theia по полному пути к установленной версии, поэтому после обновления они продолжают запускать старую версию.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h3d633kl\"&gt;installed post-commit dirty-marks hook → …/.git/hooks/post-commit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oihmxdw3\"&gt;statusline wired: theia index status --brief&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4u6gzu6j\"&gt;mcp server registered: theia serve → …/.mcp.json (control tools included)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/glossary.html#skill\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2xl1ew39\"&gt;/theia&lt;/code&gt; skill&lt;/a&gt;, &lt;a href=\"ru/glossary.html#statusline\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b8cqmcru\"&gt;statusLine&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#dirty-marks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lfwvha9h\"&gt;dirty-marks&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#fail-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uy14tjhd\"&gt;fail-open&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;, &lt;a href=\"ru/reference/hooks.html#hooks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ir5emxoi\"&gt;theia hooks&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"mcp\"&gt;&lt;a href=\"ru/glossary.html#mcp\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MCP&lt;/span&gt;&lt;/a&gt;MCP&lt;/h3&gt;\n&lt;p&gt;MCP (Model Context Protocol) — стандартный способ дать агенту инструменты. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9molza6u\"&gt;theia serve&lt;/code&gt; запускает MCP-сервер Theia через стандартный ввод-вывод. Инструменты:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;карта кода: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lki4pfgd\"&gt;codebase_blueprint&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-334fl73n\"&gt;codebase_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j7osgpkw\"&gt;codebase_symbol&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;память: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t2kc24mn\"&gt;memory_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pqnsij9r\"&gt;memory_add&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w7948i9b\"&gt;memory_tree&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;разбор прогонов: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-whjlapd4\"&gt;run_audit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-773iyvub\"&gt;run_diagnose&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;управление: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ib3zloh\"&gt;run_list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2mtbu69r\"&gt;run_status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8gxlklld\"&gt;run_events&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p9yp8qv9\"&gt;run_wait&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vb3frr37\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d7i7p5lv\"&gt;run_answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lc2lbuga\"&gt;run_stop&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u1m7nl9q\"&gt;run_start&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0u0birbx\"&gt;run_probe&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ove5wb48\"&gt;plan_list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xrlz59on\"&gt;plan_show&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bjkoo6s4\"&gt;plan_create&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g7hvh63d\"&gt;plan_approve&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Codex получает сокращённый набор без инструментов управления. Инструменты &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i44fcp9o\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ib8z4rf4\"&gt;run_answer&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jf0logs8\"&gt;run_stop&lt;/code&gt; не действуют на прогоны, запущенные заново, в том числе через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nt04mrs1\"&gt;run_start&lt;/code&gt;: см. &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2bfrlq8w\"&gt;theia serve: MCP server on stdio (root …)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c6578h8e\"&gt;mcp server registered: theia serve → …/.mcp.json (control tools included)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#skill\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mee5p4ph\"&gt;/theia&lt;/code&gt; skill&lt;/a&gt;, &lt;a href=\"ru/glossary.html#metrics\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vu5j76k4\"&gt;/metrics&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/integrations/mcp-server.html\"&gt;MCP-сервер&lt;/a&gt;, &lt;a href=\"ru/reference/serve.html#serve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ctx3t44\"&gt;theia serve&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"skill\"&gt;&lt;a href=\"ru/glossary.html#skill\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;skill&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rgqepax5\"&gt;/theia&lt;/code&gt;skill&lt;/h3&gt;\n&lt;p&gt;Скилл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ltsww5cr\"&gt;/theia&lt;/code&gt; — инструкция для Claude Code, как вести работу через Theia: план, одобрение человеком, запуск, наблюдение, ответы на вопросы. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cpmpxmhx\"&gt;theia hooks install claude&lt;/code&gt; кладёт его в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r3lenm0t\"&gt;.claude/skills/theia/SKILL.md&lt;/code&gt;. Сам скилл ничего не выполняет, он опирается на инструменты MCP Theia. Для Codex скилл не ставится. Шаги скилла с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rku54rr7\"&gt;run_msg&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-svvh669f\"&gt;run_stop&lt;/code&gt; в 0.2.201 не действуют на прогоны от &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-98lmffje\"&gt;run_start&lt;/code&gt;. Не путайте этот скилл со скиллами в файлах поставки.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a217jxk0\"&gt;/theia skill installed → …/.claude/skills/theia/SKILL.md&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"statusline\"&gt;&lt;a href=\"ru/glossary.html#statusline\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c77ko3pw\"&gt;statusLine&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Строка статуса внизу Claude Code. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oh5vyyqe\"&gt;theia hooks install claude&lt;/code&gt; подключает в неё команду &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-059z3x0i\"&gt;theia index status --brief&lt;/code&gt;, если строки статуса у вас ещё нет. Там видна свежесть индекса, а также число открытых прогонов и ждущих вопросов.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2mywrnln\"&gt;theia: 0 indexed · 1 missing · 1 live&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1189foeb\"&gt;statusline: existing statusLine preserved (not overwritten)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9bc08gjx\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0jcgqfis\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gate-1\"&gt;&lt;a href=\"ru/glossary.html#gate-1\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iao9k03t\"&gt;gate 1&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Первое условие Codex: проект должен быть доверенным (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hzazds00\"&gt;project trust&lt;/code&gt;). Пока это не так, Codex не видит ни хуки, ни MCP-сервер из папки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-957ecu1v\"&gt;.codex/&lt;/code&gt;. Условие выполняется, если один раз запустить &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-khr5j79d\"&gt;codex&lt;/code&gt; в этой папке и принять запрос доверия или выполнить &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-45f0d82u\"&gt;theia hooks install codex --trust&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ioxk1tzj\"&gt;project NOT trusted (gate 1)&lt;/code&gt; в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hhg72arx\"&gt;codex hooks&lt;/code&gt; у &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-etjt7wmf\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4qnsi159\"&gt;gate 1 (project trust): NOT SATISFIED — …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gate-2\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nrtm5n46\"&gt;gate 2&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#codex-hooks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yw72wmma\"&gt;codex hooks&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gate-2\"&gt;&lt;a href=\"ru/glossary.html#gate-2\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mz6lwnh5\"&gt;gate 2&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Второе условие Codex: новые и изменённые хуки нужно проверить и одобрить (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lxoan2fh\"&gt;hook trust&lt;/code&gt;). До этого Codex их пропускает. Одобрить можно командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yoxh4sup\"&gt;/hooks&lt;/code&gt; в интерактивной сессии Codex в этой папке.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q2et8oti\"&gt;gate 2 (hook trust): new/changed hooks are review-gated per hash and SKIPPED until trusted —&lt;/code&gt; в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hir78eov\"&gt;theia hooks install codex&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#gate-1\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jnst9tlt\"&gt;gate 1&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"metrics\"&gt;&lt;a href=\"ru/glossary.html#metrics\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2nsm06yp\"&gt;/metrics&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Страница метрик в формате Prometheus: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wp3jhj00\"&gt;theia serve --metrics &amp;lt;порт&amp;gt;&lt;/code&gt;. Она показывает счётчики только самого процесса &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-usrqchy4\"&gt;theia serve&lt;/code&gt;. Порт открыт на всех сетевых интерфейсах.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mm46j57w\"&gt;theia serve: /metrics on :&amp;lt;порт&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"ru/integrations/observability.html\"&gt;Метрики и трассировка&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-tui\"&gt;&lt;a href=\"ru/glossary.html#group-tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Экран TUI&lt;/span&gt;&lt;/a&gt;Экран TUI&lt;/h2&gt;\n&lt;h3 id=\"tui\"&gt;&lt;a href=\"ru/glossary.html#tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TUI&lt;/span&gt;&lt;/a&gt;TUI&lt;/h3&gt;\n&lt;p&gt;Экранный интерфейс (TUI) — полноэкранный режим &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qazpsnjv\"&gt;theia run&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pjm1k5fa\"&gt;theia show --tui&lt;/code&gt;. В терминале это вид по умолчанию. Экран показывает дерево прогона, детали шагов, живую активность и подсказки клавиш. Если терминала нет или задан &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ned35wb\"&gt;--non-interactive&lt;/code&gt;, Theia переходит на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-deohqjql\"&gt;--plain&lt;/code&gt; и пишет почему. Клавиши «отключиться и оставить прогон работать» нет.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mws8zmhs\"&gt;view: --tui needs an interactive terminal (a TTY for output and keys) — degrading to --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j6p63u7t\"&gt;view: --tui is interactive; --non-interactive degrades to --plain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;, &lt;a href=\"ru/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;, &lt;a href=\"ru/glossary.html#board\"&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-knogefzx\"&gt;--cli&lt;/code&gt;)&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cyei7jo4\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;, &lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"home-screen\"&gt;&lt;a href=\"ru/glossary.html#home-screen\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;home screen&lt;/span&gt;&lt;/a&gt;home screen&lt;/h3&gt;\n&lt;p&gt;Домашний экран — то, что открывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-95lvibzg\"&gt;theia&lt;/code&gt; без команды в терминале, когда личные настройки и хранилище уже есть. На нём только проблемные строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k4l5nx9y\"&gt;theia doctor&lt;/code&gt;, строка свежести индекса, до пяти последних прогонов с итогом и ценой и поле задачи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-70q4m6ql\"&gt;task ▸&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 запуск задачи из поля &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p1znviik\"&gt;task ▸&lt;/code&gt; не работает: прогон падает с ошибкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ue3btst\"&gt;kernel: no vendored prompts …&lt;/code&gt; и остаётся открытым (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xihuu8v8\"&gt;⣽ … in flight&lt;/code&gt;). Запускайте задачи командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ghrb8iom\"&gt;theia run --task \"…\"&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xjwliry0\"&gt;recent runs:&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2nww3uho\"&gt;✖ run2akdqctmhw222mff47z2qh  abandoned  $0.0000&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kl2hizvj\"&gt;task ▸ ▏&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w8b2xmu7\"&gt;Enter run · ? help · q quit&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"ru/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-119orj8z\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-tree\"&gt;&lt;a href=\"ru/glossary.html#run-tree\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run tree&lt;/span&gt;&lt;/a&gt;run tree&lt;/h3&gt;\n&lt;p&gt;Дерево прогона — главная часть TUI. Задачи — строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8y9atsdv\"&gt;tsk…x [fast_path]&lt;/code&gt;, справа фаза, раунды, цена и время. Внутри задачи: её текст, копия &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ocuemixe\"&gt;workspace @ &amp;lt;sha&amp;gt; (copy)&lt;/code&gt;, раунды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h610yz2v\"&gt;r1 implement  implementer → ready&lt;/code&gt;, а под раундом — вызовы модели (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i7ut5ffs\"&gt;· gateway …&lt;/code&gt;), инструменты и доказательства. На верхнем уровне — аномалии &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c8o09q23\"&gt;‼&lt;/code&gt;, ваши указания &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9x2qnsgy\"&gt;»&lt;/code&gt; и служебные заметки. Успешные задачи сворачиваются, проблемные раскрываются сами.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"ru/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"ru/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6zqqek77\"&gt;detail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#keybar\"&gt;keybar&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"board\"&gt;&lt;a href=\"ru/glossary.html#board\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;board ()&lt;/span&gt;&lt;/a&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l8g8smly\"&gt;--cli&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;Табло (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8oae7aej\"&gt;--cli&lt;/code&gt;) — компактный вид прогона, который перерисовывается на месте. Первая строка: прогон, деньги, вызовы и события. Дальше по строке на задачу: трек, фаза, раунды и последний вердикт. Внизу — состояние: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9q00lc7q\"&gt;running&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q2uk3d99\"&gt;halted: …&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x0kwssvb\"&gt;stopping — finishing in-flight verdicts…&lt;/code&gt;. Табло нужен терминал; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9paaz9ty\"&gt;theia show &amp;lt;runId&amp;gt; --cli&lt;/code&gt; печатает последний кадр.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vh3b5thz\"&gt;run …wvesbyig  $0.0000/$10.00 · 4 calls · 22 events&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8h28nd0f\"&gt;tsk…xk6rzynf  fast_path  discarded   r6  lead→lead_discard “…”&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rpfg00l7\"&gt;— halted: completed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d4tgnrs8\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#tui\"&gt;TUI&lt;/a&gt;, &lt;a href=\"ru/glossary.html#summary\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s6b73ygz\"&gt;summary&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"plain\"&gt;&lt;a href=\"ru/glossary.html#plain\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hya0gsf9\"&gt;--plain&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Простой вид: по строке на событие журнала, без перерисовки. Подходит для скриптов, CI и файлов. Строки показывают имена событий Theia, а не слова модели: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-szlwd7qk\"&gt;verify_pass&lt;/code&gt;, а не &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ts4i7o4\"&gt;pass&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-et90t2ua\"&gt;arb_escalate&lt;/code&gt;, а не &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9f8uqfds\"&gt;escalate&lt;/code&gt;. Строки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rgd6i6qk\"&gt;live&lt;/code&gt; — только подсказки, в журнал они не пишутся.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2dwf9ygk\"&gt;theia run … --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sr9fhvjp\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z849oba5\"&gt;view: --cli needs a TTY — degrading to --plain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"ru/glossary.html#verdict\"&gt;verdict&lt;/a&gt;, &lt;a href=\"ru/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ihnm5eg5\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#board\"&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uw2tvtme\"&gt;--cli&lt;/code&gt;)&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"summary\"&gt;&lt;a href=\"ru/glossary.html#summary\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yqq75thq\"&gt;summary&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Итог прогона: исход каждой задачи, строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jrjom2re\"&gt;halted:&lt;/code&gt; с числом вызовов и ценой и проверка журнала. Его печатают &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z8q7mx9x\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt; без флагов и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3w4tiud6\"&gt;theia run&lt;/code&gt; в конце работы.&lt;/p&gt;\n&lt;p&gt;Где встречается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dehr0tce\"&gt;tsk2akdqb2ilc225pxk6rzynf → discarded (6 rounds) …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zz6dxz9o\"&gt;halted: completed · 4 gateway calls · $0.0000&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j87cugko\"&gt;audit chain: intact&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gmr5pxbm\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"ru/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4687gr4s\"&gt;--plain&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"glyphs\"&gt;&lt;a href=\"ru/glossary.html#glyphs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/span&gt;&lt;/a&gt;✔ ✖ ◆ ◌ ‼ »&lt;/h3&gt;\n&lt;p&gt;Значки TUI:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zvlzasx4\"&gt;✔&lt;/code&gt; — хорошо: у задачи итог &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fgeu19t1\"&gt;merged&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4lwm8ybg\"&gt;planned&lt;/code&gt;, у раунда вердикт не из списка плохих, у прогона — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1gng0mpj\"&gt;completed&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-067yizrp\"&gt;✖&lt;/code&gt; — плохо: задача отброшена; раунд с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e728pz2p\"&gt;discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rkjir4mv\"&gt;merge_fail&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2vwi0o6t\"&gt;verify_fail&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7n6h7vex\"&gt;cant_do&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v1rk2g74\"&gt;algedonic&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4x4agyf\"&gt;no_progress&lt;/code&gt;; прогон остановлен (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hy92ofxm\"&gt;stopped (…)&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dzgynk0y\"&gt;◆&lt;/code&gt; — застряло: задача &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8javtfxu\"&gt;escalated&lt;/code&gt; или вопрос без ответа; на домашнем экране — прогон на паузе;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dzm5sog5\"&gt;⣷ ⣯ ⣟ …&lt;/code&gt; (или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cue7wdqj\"&gt;●&lt;/code&gt; с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0avj558e\"&gt;--no-spinner&lt;/code&gt;) — идёт работа, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tv7rzfaf\"&gt;◌&lt;/code&gt; — ждёт;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qi1amhad\"&gt;‼&lt;/code&gt; — аномалия, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k13ftq98\"&gt;»&lt;/code&gt; — ваше указание, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ocxdycjx\"&gt;·&lt;/code&gt; — текст задачи или доказательство, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mu73xhn5\"&gt;▼&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-50e2x1op\"&gt;▶&lt;/code&gt; — раскрыто и свёрнуто, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bpsy4lcg\"&gt;‖&lt;/code&gt; — пауза или остановка, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i8v5jp7q\"&gt;❯&lt;/code&gt; — курсор, когда цвета выключены.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Зелёная галочка значит «не плохое событие», а не «хороший итог». Раунды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5x2mda7\"&gt;lead → lead_discard&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pq1haosn\"&gt;arbiter → arb_escalate&lt;/code&gt; тоже отмечены &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yb8r06od\"&gt;✔&lt;/code&gt;, а прогон, где все задачи отброшены, помечен &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fe9smkct\"&gt;✔ completed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;, &lt;a href=\"ru/glossary.html#completed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cplruiql\"&gt;completed&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#frozen\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x4pt77we\"&gt;frozen&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#failed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xcf35qeh\"&gt;failed&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"running\"&gt;&lt;a href=\"ru/glossary.html#running\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4znmu6y8\"&gt;running&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Прогон или задача сейчас работает. В заголовке TUI — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-srebh0f8\"&gt;running&lt;/code&gt;, в счётчике задач — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nd759es9\"&gt;N running&lt;/code&gt;, на табло — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-idqiuzjw\"&gt;— running&lt;/code&gt;. Прогон, убитый без паузы, в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jqhlvgn9\"&gt;theia show --tui&lt;/code&gt; тоже выглядит как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kt8ewd1e\"&gt;running&lt;/code&gt;, пока его не продолжат или не закроют.&lt;/p&gt;\n&lt;p&gt;См. также: &lt;a href=\"ru/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-691fsd05\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mwq15
