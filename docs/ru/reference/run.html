        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1gclppyl\"&gt;theia run&lt;/code&gt; запускает &lt;a href=\"ru/glossary.html#run\"&gt;прогон&lt;/a&gt;. Theia выполняет вашу задачу в копии репозитория, проверяет результат, отдаёт его на рецензию и сливает в отдельную ветку. Та же команда продолжает прогон (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-og69rsgg\"&gt;--resume&lt;/code&gt;) или закрывает его без результата (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cbrvny84\"&gt;--abandon&lt;/code&gt;).&lt;/p&gt;\n&lt;h2 id=\"run\"&gt;&lt;a href=\"ru/reference/run.html#run\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;theia run&lt;/span&gt;&lt;/a&gt;theia run&lt;/h2&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia run --task \"&amp;lt;text&amp;gt;\" [options]\ntheia run --from-plan &amp;lt;planId&amp;gt; [options]\ntheia run [options] &amp;lt; &amp;lt;file&amp;gt;\ntheia run --resume &amp;lt;runId&amp;gt; [options]\ntheia run --abandon &amp;lt;runId&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lt3jh5qa\"&gt;&amp;lt;text&amp;gt;&lt;/code&gt; — задача простыми словами, &lt;a href=\"ru/glossary.html#brief\"&gt;текст задачи&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p71jjss9\"&gt;&amp;lt;planId&amp;gt;&lt;/code&gt; — идентификатор утверждённого плана, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tl9oxh3i\"&gt;pln…&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sq4jch52\"&gt;&amp;lt;file&amp;gt;&lt;/code&gt; — текстовый файл с задачей.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7x11gqfp\"&gt;&amp;lt;runId&amp;gt;&lt;/code&gt; — &lt;a href=\"ru/glossary.html#run-id\"&gt;идентификатор прогона&lt;/a&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fmfd1azm\"&gt;run…&lt;/code&gt;. Тот же идентификатор без приставки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fpr60uw6\"&gt;run&lt;/code&gt; тоже подходит.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Неизвестные параметры Theia пропускает без предупреждения. Опечатка вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p8ejkw1g\"&gt;--budjet 3&lt;/code&gt; оставит значение по умолчанию. Проверяйте написание.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Аргумент&lt;/th&gt;\n&lt;th&gt;Значение&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1z42igc3\"&gt;--task&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;текст&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Задача. Нужна, если нет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mq0vjve6\"&gt;--from-plan&lt;/code&gt; и текст не подаётся через stdin. См. &lt;a href=\"ru/reference/run.html#run-task\"&gt;--task&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-otrvvoh1\"&gt;--track&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9b5ayjc2\"&gt;fast_path&lt;/code&gt; | &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-di2rd0x3\"&gt;full_spec&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wlfiam2i\"&gt;fast_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;С чего начинается задача: сразу с реализации или с планирования. См. &lt;a href=\"ru/reference/run.html#run-track\"&gt;--track&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-36u7dknv\"&gt;--verify&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;команда оболочки&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Команда проверки после каждой попытки. Для нескольких команд повторите параметр. См. &lt;a href=\"ru/reference/run.html#run-verify\"&gt;--verify&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4spj0ooi\"&gt;--budget&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;доллары США&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4no3axpe\"&gt;run.maxUsdPerRun&lt;/code&gt;, 10&lt;/td&gt;\n&lt;td&gt;Денежный лимит прогона. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9g7gjgq5\"&gt;0&lt;/code&gt; — без лимита. См. &lt;a href=\"ru/reference/run.html#run-budget\"&gt;--budget&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6or66fn2\"&gt;--max-rounds&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;число&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8snj4j36\"&gt;run.maxRoundsPerTask&lt;/code&gt;, 10&lt;/td&gt;\n&lt;td&gt;Лимит раундов на задачу. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p4avrsqs\"&gt;0&lt;/code&gt; — без лимита.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ffpcgqib\"&gt;--max-rescopes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;число&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mfoauoje\"&gt;run.maxRescopes&lt;/code&gt;, 2&lt;/td&gt;\n&lt;td&gt;Сколько раз ведущий может перезапустить задачу. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-os85n7p7\"&gt;0&lt;/code&gt; — без лимита.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f1fao4o7\"&gt;--plain&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Одна текстовая строка на событие.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e1vhsny5\"&gt;--cli&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Табло, которое обновляется на месте.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j6kmj4gp\"&gt;--tui&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ujbar8o\"&gt;ui.defaultView&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wjn0vgn1\"&gt;tui&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Полноэкранный интерфейс.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qc7apfzj\"&gt;--non-interactive&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;выключен&lt;/td&gt;\n&lt;td&gt;Без вопросов и без TUI.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-md90t5zv\"&gt;--no-spinner&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;выключен&lt;/td&gt;\n&lt;td&gt;Неподвижные значки вместо анимации.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-482gj0f9\"&gt;--interaction&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y0866bg2\"&gt;terminal&lt;/code&gt; | &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zk1u3nva\"&gt;bus&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0yrwn2w6\"&gt;run.interaction&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qofn5eyj\"&gt;terminal&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Куда идут уточняющие вопросы. Действует только вместе с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-74qb6fbb\"&gt;--resume&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8np0cov8\"&gt;--from-plan&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;идентификатор плана&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Выполнить утверждённый план.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zwtr5d7e\"&gt;--plan&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;То же, что &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eq4y90cy\"&gt;theia plan&lt;/code&gt;. Не показан в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5myftfh1\"&gt;theia help&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gedtmdvw\"&gt;--root&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;имя корня&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Только для проектов с несколькими корнями: корень задачи.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ij18zxgm\"&gt;--branch&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;имя ветки&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4giet0ns\"&gt;theia/run-&amp;lt;6 символов&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Имя ветки прогона.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wfw218ss\"&gt;--base&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;ссылка git&lt;/td&gt;\n&lt;td&gt;upstream, иначе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-01t0u25f\"&gt;origin/HEAD&lt;/code&gt;, иначе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oomjscyg\"&gt;HEAD&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Коммит, от которого создаётся ветка прогона.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jyggtdz4\"&gt;--no-run-branch&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;выключен&lt;/td&gt;\n&lt;td&gt;Сливать прямо в ветку, на которой вы сейчас находитесь.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jzom47ad\"&gt;--in-place&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;выключен&lt;/td&gt;\n&lt;td&gt;Работать прямо в папке, без копии и без git. Не показан в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sc3zhdq0\"&gt;theia help&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t5rlkwm0\"&gt;--sessions&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qqykj3zq\"&gt;--no-sessions&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1z57akd7\"&gt;run.sessionContinuity&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0hfktlav\"&gt;off&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Экспериментально: записывать отпечатки промптов.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n01sx5lx\"&gt;--record&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;выключен&lt;/td&gt;\n&lt;td&gt;Сохранять ответы моделей в хранилище.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ne2nhkro\"&gt;--resume&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;идентификатор прогона&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Продолжить прогон на паузе или остановленный. См. &lt;a href=\"ru/reference/run.html#run-resume\"&gt;--resume&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-twwnpjh7\"&gt;--abandon&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;идентификатор прогона&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Закрыть прогон без результата. См. &lt;a href=\"ru/reference/run.html#run-abandon\"&gt;--abandon&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"run-task\"&gt;&lt;a href=\"ru/reference/run.html#run-task\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bi9mknv1\"&gt;--task&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Текст задачи. Заключите его в кавычки. Если &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kwzf9sjf\"&gt;--task&lt;/code&gt; нет, а stdin — не терминал, Theia читает весь stdin как задачу:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;echo \"&amp;lt;text&amp;gt;\" | theia run [options]\ntheia run [options] &amp;lt; &amp;lt;file&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"387\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-387\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-387\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-387.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Без задачи Theia печатает краткую справку и завершается с кодом 1. В тексте можно вставлять файлы, см. &lt;a href=\"ru/reference/run.html#run-file-inclusion\"&gt;Вставка файлов через @&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-file-inclusion\"&gt;&lt;a href=\"ru/reference/run.html#run-file-inclusion\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вставка файлов через&lt;/span&gt;&lt;/a&gt;Вставка файлов через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w3a6jacp\"&gt;@&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Напишите в тексте задачи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qiileinc\"&gt;@путь&lt;/code&gt;, чтобы вставить файл (&lt;a href=\"ru/glossary.html#file-inclusion\"&gt;вставка файла через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-08n33mll\"&gt;@&lt;/code&gt;&lt;/a&gt;). Theia добавляет содержимое файла под текстом задачи блоком, который начинается строкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3klz4e08\"&gt;--- file: &amp;lt;path&amp;gt; (sha256 &amp;lt;12 символов&amp;gt;, &amp;lt;N&amp;gt; chars) ---&lt;/code&gt;. В журнале остаются путь, размер и отпечаток каждого файла.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Путь считается от текущей папки. Он должен начинаться с буквы, цифры или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hfspqxxp\"&gt;_&lt;/code&gt;. Подходят буквы любого языка, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6t9wlbe6\"&gt;@заметки.md&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5d09t2wd\"&gt;@/абсолютный/путь&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ufmuoj50\"&gt;@./файл&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bw3gakei\"&gt;@../файл&lt;/code&gt; не раскрываются. Они остаются в тексте как есть, без ошибки.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gmzljz4n\"&gt;@@имя&lt;/code&gt; даёт буквальный текст &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-38f0t7aq\"&gt;@имя&lt;/code&gt;. Адрес вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pqbxm1si\"&gt;a@b.c&lt;/code&gt; не считается ссылкой на файл.&lt;/li&gt;\n&lt;li&gt;Если файла нет, команда останавливается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wu3rkn0a\"&gt;run: @file: no such file 'nope.txt' (relative to &amp;lt;folder&amp;gt;; escape a literal with @@)&lt;/code&gt;, код выхода 1.&lt;/li&gt;\n&lt;li&gt;Файл с секретом останавливает команду. Секреты — это закрытый ключ, API-ключ, номер карты или сид-фраза. Пример сообщения: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dg2962qy\"&gt;run: @key.pem: prohibited content (pem_private_key) — this file cannot enter a model prompt&lt;/code&gt;, код выхода 1. Адреса почты заменяются маской.&lt;/li&gt;\n&lt;li&gt;По умолчанию лимита размера нет. Больше 200 000 символов — Theia выводит предупреждение (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cqvxcpbt\"&gt;run.contextAlertChars&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Те же правила &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ns2425gy\"&gt;@&lt;/code&gt; действуют в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nknj60au\"&gt;theia plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-en12zp0h\"&gt;theia msg&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-th3phs3i\"&gt;theia probe&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-track\"&gt;&lt;a href=\"ru/reference/run.html#run-track\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nooqlzzf\"&gt;--track&lt;/code&gt;&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sb9otz4w\"&gt;fast_path&lt;/code&gt; (&lt;a href=\"ru/glossary.html#fast-path\"&gt;короткий путь&lt;/a&gt;) — задача сразу идёт в реализацию. Подходит для небольших правок.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-domzwk8r\"&gt;full_spec&lt;/code&gt; (&lt;a href=\"ru/glossary.html#full-spec\"&gt;полная спецификация&lt;/a&gt;) — сначала &lt;a href=\"ru/glossary.html#planner\"&gt;планировщик&lt;/a&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uatvzw6r\"&gt;planner&lt;/code&gt;) разбирает задачу и может разбить её на подзадачи. Потом начинается реализация. Шага утверждения здесь нет. Если нужен план, который вы утверждаете заранее, используйте &lt;a href=\"ru/reference/plan.html#plan\"&gt;theia plan&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Вместе с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jv41cgnv\"&gt;--from-plan&lt;/code&gt; параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wsx84my6\"&gt;--track&lt;/code&gt; ставит все задачи плана на один трек на этот прогон. Theia печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vo9kgo02\"&gt;track override: all 2 tasks forced to full_spec for this run (plan content unchanged)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Неверное значение останавливает команду: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-stailch2\"&gt;run: unknown track 'bogus' (supported: full_spec, fast_path)&lt;/code&gt;, код выхода 1.&lt;/p&gt;\n&lt;h3 id=\"run-verify\"&gt;&lt;a href=\"ru/reference/run.html#run-verify\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-idtwjxlr\"&gt;--verify&lt;/code&gt;&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;Theia запускает команду после каждой попытки реализации как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vw9oe3yz\"&gt;bash -lc \"&amp;lt;команда&amp;gt;\"&lt;/code&gt;, на вашем компьютере, не в песочнице.&lt;/li&gt;\n&lt;li&gt;Команда выполняется в копии репозитория для задачи, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bf1igxle\"&gt;.theia/runs/&amp;lt;папка прогона&amp;gt;/ws-&amp;lt;задача&amp;gt;&lt;/code&gt;. С &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uccas9ff\"&gt;--in-place&lt;/code&gt; или вне git — в папке проекта.&lt;/li&gt;\n&lt;li&gt;Код выхода 0 означает, что проверка прошла (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-69fvo08m\"&gt;verify_pass&lt;/code&gt;). Любой другой код — провал (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s4eu4a7i\"&gt;verify_fail&lt;/code&gt;). Модель не участвует.&lt;/li&gt;\n&lt;li&gt;Несколько параметров &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kgkvrwv6\"&gt;--verify&lt;/code&gt; выполняются по порядку. После первого провала остальные пропускаются: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-63gca3cf\"&gt;$ false → exit 1 (no output) (1 verify command(s) skipped after this failure)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Каждая команда может работать 5 минут. У остановленной команды код показан как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gebbn2s5\"&gt;exit null&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vwi6jt25\"&gt;--verify&lt;/code&gt; результат проверяет модель — &lt;a href=\"ru/glossary.html#verifier\"&gt;проверяющий&lt;/a&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4u5ber9\"&gt;verifier&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;После 3 проваленных проверок подряд Theia замораживает задачу и передаёт её &lt;a href=\"ru/glossary.html#lead\"&gt;ведущему&lt;/a&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6m5hd9jo\"&gt;lead&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;В прогоне по плану собственные проверки задачи из плана заменяют &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gmnofsen\"&gt;--verify&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"run-budget\"&gt;&lt;a href=\"ru/reference/run.html#run-budget\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fxghvdfg\"&gt;--budget&lt;/code&gt;&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html#budget\"&gt;Бюджет&lt;/a&gt; в долларах США на весь прогон. Можно дробное число. По умолчанию — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eferb92r\"&gt;run.maxUsdPerRun&lt;/code&gt; в &lt;a href=\"ru/config/policy.html\"&gt;policy.yaml&lt;/a&gt;, 10.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6udgd1k3\"&gt;0&lt;/code&gt; снимает денежный лимит. Theia печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zvw2bpmz\"&gt;budget: 0 = unmetered (loop guards stay: maxTotalRounds, round/rescope budgets)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Когда деньги заканчиваются, Theia отказывает следующему вызову модели и ставит прогон на паузу, код выхода 0. Чтобы продолжить, выполните &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pj9ttmdn\"&gt;theia run --resume &amp;lt;runId&amp;gt; --budget &amp;lt;usd&amp;gt;&lt;/code&gt;. См. &lt;a href=\"ru/guides/control-run.html#budget-runs-out\"&gt;Когда закончился бюджет&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Один повторный вызов, который исправляет сломанный ответ модели, может выйти за лимит не больше чем на $0,75.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Theia не проверяет значение. Текст, который не является числом, снимает лимит. Тогда в начале видно &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7eqe6u6g\"&gt;budget=$NaN&lt;/code&gt;, а в конце — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0nka5b97\"&gt;budget remaining: NaN&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"run-max-rounds\"&gt;&lt;a href=\"ru/reference/run.html#run-max-rounds\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h1wxmtpv\"&gt;--max-rounds&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Лимит &lt;a href=\"ru/glossary.html#round\"&gt;раундов&lt;/a&gt; на задачу в этом прогоне. Заменяет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bzzsw214\"&gt;run.maxRoundsPerTask&lt;/code&gt; (по умолчанию 10). Раунд — это один вердикт по задаче. При достижении лимита Theia записывает аномалию &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9w3jloit\"&gt;round_budget&lt;/code&gt; и передаёт задачу ведущему. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t1yxapf0\"&gt;0&lt;/code&gt; — без лимита. Значение, которое не является числом, пропускается.&lt;/p&gt;\n&lt;h3 id=\"run-max-rescopes\"&gt;&lt;a href=\"ru/reference/run.html#run-max-rescopes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-966nlji2\"&gt;--max-rescopes&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Сколько раз ведущий может сделать &lt;a href=\"ru/glossary.html#rescope\"&gt;пересмотр задачи&lt;/a&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-76aew9dt\"&gt;rescope&lt;/code&gt;): вернуть её с новыми указаниями и заново начать счёт раундов. Заменяет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tvgxkptd\"&gt;run.maxRescopes&lt;/code&gt; (по умолчанию 2). После лимита задача закрывается без результата. В командной строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2xcxsp8u\"&gt;0&lt;/code&gt; означает «без лимита». В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ue8z974\"&gt;policy.yaml&lt;/code&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6bu6g5hs\"&gt;0&lt;/code&gt; означает «пересматривать нельзя».&lt;/p&gt;\n&lt;h3 id=\"run-plain\"&gt;&lt;a href=\"ru/reference/run.html#run-plain\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bzyyab2l\"&gt;--plain&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Одна строка на событие, см. &lt;a href=\"ru/reference/run.html#run-output\"&gt;Вывод&lt;/a&gt;. Работает везде, в том числе в CI и в конвейерах.&lt;/p&gt;\n&lt;h3 id=\"run-cli\"&gt;&lt;a href=\"ru/reference/run.html#run-cli\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rs9aur7o\"&gt;--cli&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;a href=\"ru/glossary.html#board\"&gt;Табло&lt;/a&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2mdyo5zk\"&gt;--cli&lt;/code&gt;), которое обновляется на месте: одна строка на задачу с фазой и раундом. Нужен терминал. Без терминала Theia печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3d93sf43\"&gt;view: --cli needs a TTY — degrading to --plain&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-tui\"&gt;&lt;a href=\"ru/reference/run.html#run-tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-04r6yeaf\"&gt;--tui&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Полноэкранный &lt;a href=\"ru/glossary.html#tui\"&gt;экранный интерфейс (TUI)&lt;/a&gt;. В терминале он включается по умолчанию, это задаёт &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tmfzt0zf\"&gt;ui.defaultView&lt;/code&gt;. Нужен терминал для вывода и клавиш и не нужен &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8gzazgtu\"&gt;--non-interactive&lt;/code&gt;. Иначе Theia переходит на &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-77ihpmil\"&gt;--plain&lt;/code&gt; и печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-awssf2pp\"&gt;view: --tui needs an interactive terminal (a TTY for output and keys) — degrading to --plain&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nwht6eal\"&gt;view: --tui is interactive; --non-interactive degrades to --plain&lt;/code&gt;. См. &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Если указано несколько параметров вида, действует последний.&lt;/p&gt;\n&lt;h3 id=\"run-non-interactive\"&gt;&lt;a href=\"ru/reference/run.html#run-non-interactive\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eegijpiq\"&gt;--non-interactive&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Theia не задаёт вопросов. &lt;a href=\"ru/glossary.html#clarify\"&gt;Уточняющий вопрос&lt;/a&gt; вместо этого замораживает задачу. Второй подряд вопрос без ответа ставит прогон на паузу. TUI не используется.&lt;/p&gt;\n&lt;h3 id=\"run-no-spinner\"&gt;&lt;a href=\"ru/reference/run.html#run-no-spinner\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ovtsgoz\"&gt;--no-spinner&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Неподвижные значки вместо анимации в TUI и на табло. То же, что переменная &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1bt4zbwu\"&gt;THEIA_NO_SPINNER=1&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-interaction\"&gt;&lt;a href=\"ru/reference/run.html#run-interaction\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kdjhy3ay\"&gt;--interaction&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Куда идут уточняющие вопросы:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5i779hnl\"&gt;terminal&lt;/code&gt; — форма в TUI или текстовый вопрос в терминале.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-255p4n5f\"&gt;bus&lt;/code&gt; — &lt;a href=\"ru/glossary.html#control-bus\"&gt;шина управления&lt;/a&gt;. Вопрос записывается в журнал прогона и ждёт до 600 секунд (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i7hqonhd\"&gt;run.interactionWaitSeconds&lt;/code&gt;) ответа через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iw5m0caq\"&gt;theia answer&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;По умолчанию — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ss5nc7bj\"&gt;run.interaction&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lm33prls\"&gt;terminal&lt;/code&gt;. Неверное значение останавливает команду: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zr5zmdhr\"&gt;--interaction must be terminal|bus (got 'foo')&lt;/code&gt;, код выхода 1.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 параметр &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qehf4dc1\"&gt;--interaction&lt;/code&gt; действует только вместе с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-khqbbt9m\"&gt;--resume&lt;/code&gt;. Новый прогон его пропускает. См. &lt;a href=\"ru/guides/control-run.html#msg\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"run-from-plan\"&gt;&lt;a href=\"ru/reference/run.html#run-from-plan\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sza86cap\"&gt;--from-plan&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Выполняет утверждённый &lt;a href=\"ru/glossary.html#plan\"&gt;план&lt;/a&gt;. Theia создаёт по одной задаче на каждый пункт плана с именем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2q7mheel\"&gt;[key] описание&lt;/code&gt;, в порядке зависимостей. Задача начинается, только когда её зависимости слиты. Каждая задача использует свои проверки из плана. Задача без проверок использует &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mucre7t5\"&gt;--verify&lt;/code&gt; или проверяющую модель. Строка с идентификаторами выглядит так: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hpojoec1\"&gt;run run2akdqddivk222d4b46etos plan pln2akdqddd5c2223ubqzsvlt @ fce3554ee5e2… → 2 tasks&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Неутверждённый план останавливает команду: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ecb01lbh\"&gt;run: plan pln2akdqddd5c2223ubqzsvlt is 'draft', not approved — approve it first (theia plan approve)&lt;/code&gt;, код выхода 1. После этого нужна уборка, см. &lt;a href=\"ru/guides/plan-and-run.html#refused-run\"&gt;Отказ в запуске плана оставляет ветку&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;С бюджетом по умолчанию Theia сравнивает бюджет с оценкой стоимости по прошлым прогонам в этом хранилище. Если бюджета мало, Theia останавливается до первого вызова модели и предлагает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-02y0x9u0\"&gt;--budget&lt;/code&gt;. С явным &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4gly2aer\"&gt;--budget&lt;/code&gt; она только предупреждает.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"run-plan\"&gt;&lt;a href=\"ru/reference/run.html#run-plan\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vzvrqiu2\"&gt;--plan&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cf6q6zo5\"&gt;theia run --plan …&lt;/code&gt; — то же, что &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j5ft7omp\"&gt;theia plan …&lt;/code&gt;, см. &lt;a href=\"ru/reference/plan.html#plan\"&gt;theia plan&lt;/a&gt;. Не показан в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1f7dtgvx\"&gt;theia help&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-root\"&gt;&lt;a href=\"ru/reference/run.html#run-root\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hbp49rim\"&gt;--root&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Для проектов с несколькими корнями: &lt;a href=\"ru/glossary.html#root\"&gt;корень&lt;/a&gt; задачи. В репозитории с одним корнем Theia пропускает параметр. См. &lt;a href=\"ru/config/workspaces.html\"&gt;Хранилище и корни проекта&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-branch\"&gt;&lt;a href=\"ru/reference/run.html#run-branch\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fx607pqx\"&gt;--branch&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Имя &lt;a href=\"ru/glossary.html#run-branch\"&gt;ветки прогона&lt;/a&gt;. По умолчанию — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-it8t25t6\"&gt;theia/run-&lt;/code&gt; и последние 6 символов идентификатора прогона. Если такая ветка уже есть, Theia останавливается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gv93qoim\"&gt;run: branch 'docs/demo' already exists — pass --branch &amp;lt;other-name&amp;gt;, or delete the stale one first (git branch -D docs/demo)&lt;/code&gt;, код выхода 1.&lt;/p&gt;\n&lt;h3 id=\"run-base\"&gt;&lt;a href=\"ru/reference/run.html#run-base\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eu7lzrqo\"&gt;--base&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Коммит, от которого создаётся ветка прогона. По умолчанию Theia берёт upstream текущей ветки, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l68bojv3\"&gt;origin/main&lt;/code&gt;. Без upstream — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vqx2uzxu\"&gt;origin/HEAD&lt;/code&gt;, без удалённого репозитория — локальный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-elg12kbw\"&gt;HEAD&lt;/code&gt;. Поэтому локальные коммиты, которые вы ещё не отправили, в прогон не попадают, пока вы не укажете &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0i8nrm5x\"&gt;--base HEAD&lt;/code&gt;. Строка в начале показывает выбор:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;run branch: theia/run-ha55jw (base HEAD @ c4095c5)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"651\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-651\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-651\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-651.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Несуществующая ссылка останавливает команду: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t57oecf7\"&gt;run: --base 'nosuchref' does not resolve in &amp;lt;репозиторий&amp;gt; (fetch it, or name a reachable ref)&lt;/code&gt;, код выхода 1.&lt;/p&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nbsffcwq\"&gt;--branch&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p7cqoart\"&gt;--base&lt;/code&gt; нужна ветка прогона. С &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aiilk6dl\"&gt;--in-place&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-llfjvb7u\"&gt;--no-run-branch&lt;/code&gt; или вне git Theia останавливается с сообщением &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tgj6m22r\"&gt;run: --branch/--base need the run-branch mode (single-root git repo, not --in-place/--no-run-branch)&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-no-run-branch\"&gt;&lt;a href=\"ru/reference/run.html#run-no-run-branch\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-elsum5yg\"&gt;--no-run-branch&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Без ветки прогона. Каждая готовая задача сливается прямо в ветку, на которой находится ваш репозиторий, коммитом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3cp9cxis\"&gt;Merge branch 'ai/&amp;lt;задача&amp;gt;'&lt;/code&gt;. Задачи всё так же работают в копиях.&lt;/p&gt;\n&lt;h3 id=\"run-in-place\"&gt;&lt;a href=\"ru/reference/run.html#run-in-place\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-74rbkavi\"&gt;--in-place&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Без копии и без git. Роли меняют файлы прямо в вашей папке, Theia ничего не коммитит, а шаг слияния только отмечает задачу как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7e62vpbk\"&gt;merged&lt;/code&gt;. С &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5zfuclbh\"&gt;--verify&lt;/code&gt; команда выполняется в папке проекта. Вне git-репозитория Theia включает этот режим сама. Она печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iuzvtsm1\"&gt;mode: in-place (no git repo or --in-place) — no worktree isolation&lt;/code&gt;. Не показан в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wazfmh38\"&gt;theia help&lt;/code&gt;. Недоступен в проектах с несколькими корнями.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В этом режиме изменения сразу попадают в ваши файлы. Перед прогоном закоммитьте или уберите в stash свою работу.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"run-sessions\"&gt;&lt;a href=\"ru/reference/run.html#run-sessions\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;,&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-et6q6l3k\"&gt;--sessions&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dd2ukm3v\"&gt;--no-sessions&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Заменяют &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jyn4t1pn\"&gt;run.sessionContinuity&lt;/code&gt; на этот прогон. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xtate0xw\"&gt;--sessions&lt;/code&gt; печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1fcfqvmc\"&gt;sessions: sigma-shared (stable-prefix continuity, digests audited)&lt;/code&gt; и записывает в журнал отпечатки промптов. Сами промпты не меняются. Это экспериментальная настройка.&lt;/p&gt;\n&lt;h3 id=\"run-record\"&gt;&lt;a href=\"ru/reference/run.html#run-record\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qsefjmvg\"&gt;--record&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Сохраняет каждый ответ модели в хранилище, чтобы потом &lt;a href=\"ru/glossary.html#fork\"&gt;ответвление прогона&lt;/a&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kpuaujn6\"&gt;fork&lt;/code&gt;) могло его использовать. Нужен в основном для тестов.&lt;/p&gt;\n&lt;h2 id=\"run-resume\"&gt;&lt;a href=\"ru/reference/run.html#run-resume\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;theia run --resume&lt;/span&gt;&lt;/a&gt;theia run --resume&lt;/h2&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia run --resume &amp;lt;runId&amp;gt; [options]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"695\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-695\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-695\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-695.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Продолжает прогон на паузе или остановленный прогон по его журналу. Готовые шаги не повторяются. Прерванный шаг начинается заново.&lt;/p&gt;\n&lt;p&gt;Пример вывода:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;run branch: theia/run-elou46 (resumed @ 74a5168)\nresuming run run2akdqcg6bs222ldyelou46 (paused; budget 10.00 usd remaining)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"702\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-702\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-702\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-702.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Слово в скобках — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fzrj30ud\"&gt;paused&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-th3527qu\"&gt;live&lt;/code&gt; (после жёсткой остановки) или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-avutz143\"&gt;finished&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Укажите полный идентификатор или идентификатор без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qod4tgug\"&gt;run&lt;/code&gt;. Более короткая часть даёт ошибку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rnaavn2u\"&gt;terryid: malformed id '…'&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;С &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fkmmi6h1\"&gt;--resume&lt;/code&gt; работают параметры &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nlwr5bxv\"&gt;--plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pyt3bop7\"&gt;--cli&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7gbq1vq5\"&gt;--tui&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-llmioyaz\"&gt;--non-interactive&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ne5l0di9\"&gt;--budget&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5icejmrk\"&gt;--verify&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-05ta74h6\"&gt;--max-rounds&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4lhb3cso\"&gt;--max-rescopes&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-osvugvft\"&gt;--interaction&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8h484t78\"&gt;--sessions&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m4o1bpkf\"&gt;--no-sessions&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f541rj40\"&gt;--record&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4vg0thcj\"&gt;--budget&lt;/code&gt; задаёт сумму, которая остаётся на оставшуюся часть прогона. К старому бюджету она не прибавляется. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-phqpvxfj\"&gt;0&lt;/code&gt; снимает лимит.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nfd7m1b0\"&gt;--verify&lt;/code&gt; заменяет команды проверки прогона.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4pe68wcd\"&gt;--task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ekv1dq0u\"&gt;--track&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zdruuxjj\"&gt;--from-plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iyqrt1os\"&gt;--branch&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-afne0y07\"&gt;--base&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tj6pw1lx\"&gt;--no-run-branch&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zvw32op1\"&gt;--root&lt;/code&gt; здесь пропускаются.&lt;/li&gt;\n&lt;li&gt;После продолжения прогон на каждом шаге читает указания из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3fk71ydm\"&gt;theia msg&lt;/code&gt;, см. &lt;a href=\"ru/reference/run-control.html#msg\"&gt;theia msg&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Theia отказывает с кодом выхода 1 в таких случаях:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vjbw5emu\"&gt;resume: no events for &amp;lt;id&amp;gt;&lt;/code&gt; — прогона с таким идентификатором нет.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4en62oru\"&gt;resume: audit chain BROKEN at &amp;lt;id&amp;gt; — refusing to resume a tampered run&lt;/code&gt; — журнал изменён.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g36fb8j4\"&gt;resume: all tasks terminal (finished) — nothing to resume&lt;/code&gt; — делать нечего.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Закрытый прогон можно случайно запустить снова&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5b72quc\"&gt;--resume&lt;/code&gt; не отказывает прогону, который вы закрыли через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4elb2bpr\"&gt;--abandon&lt;/code&gt;, и выполняет его снова. Сначала проверьте прогон командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sa94id23\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt;. Если там &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8838dxxh\"&gt;halted: abandoned&lt;/code&gt;, запустите новый прогон.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"run-abandon\"&gt;&lt;a href=\"ru/reference/run.html#run-abandon\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;theia run --abandon&lt;/span&gt;&lt;/a&gt;theia run --abandon&lt;/h2&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia run --abandon &amp;lt;runId&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"771\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-771\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-771\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-771.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Отмечает прогон как закрытый без результата: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ck6qwou6\"&gt;halted: abandoned&lt;/code&gt;. Команда не останавливает работающий процесс и ничего не удаляет. Сначала остановите прогон через Ctrl+C или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ir4foaq\"&gt;q&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Пример вывода:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;abandoned run2akdqbnjho2237q4cxhpts — workspaces kept; reclaim with 'theia prune'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"778\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-778\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-778\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-778.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;Прогон уже завершён: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lrzyziyk\"&gt;abandon: run already finished — nothing to do (prune reclaims finished runs)&lt;/code&gt;, код выхода 1.&lt;/li&gt;\n&lt;li&gt;Неизвестный идентификатор: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mzwis23k\"&gt;abandon: no events for &amp;lt;id&amp;gt;&lt;/code&gt;, код выхода 1.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Копии и записи закрытого прогона остаются до &lt;a href=\"ru/reference/audit-prune.html#prune\"&gt;theia prune&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"run-output\"&gt;&lt;a href=\"ru/reference/run.html#run-output\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Вывод&lt;/span&gt;&lt;/a&gt;Вывод&lt;/h2&gt;\n&lt;p&gt;С &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d9lazn11\"&gt;--plain&lt;/code&gt; Theia печатает одну строку на событие. Каждая строка начинается с последних 8 символов идентификатора события.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Строка&lt;/th&gt;\n&lt;th&gt;Что значит&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nzg0znt9\"&gt;run branch: theia/run-4lejtj (base HEAD (no origin remote) @ 0de439e)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ветка прогона и коммит, от которого она создана.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g1w6mnvu\"&gt;mode: in-place (no git repo or --in-place) — no worktree isolation&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Режим без копии и без git.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pa2nkbnm\"&gt;run run2akdqiyvvs222jx34lejtj task tsk2akdqiyyco222jxsd2vfzc (fast_path)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идентификатор прогона и идентификатор задачи.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v9hxli66\"&gt;run.created   budget=$10 track=fast_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Прогон начался с этим бюджетом. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jbaahx6k\"&gt;budget=$null&lt;/code&gt; — без лимита.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l05suqv1\"&gt;task.phase    xsd2vfzc ready → implement&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Задача перешла в новую &lt;a href=\"ru/glossary.html#phase\"&gt;фазу&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8h7ira1h\"&gt;verdict       xsd2vfzc verifier → verify_pass (1 evidence)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/glossary.html#verdict\"&gt;Вердикт&lt;/a&gt; роли. У вердиктов моделей в конце короткая заметка в кавычках.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pwitb3ep\"&gt;gateway       &amp;lt;role&amp;gt;@&amp;lt;transport&amp;gt; → ok $&amp;lt;cost&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Один вызов модели (&lt;a href=\"ru/glossary.html#gateway-call\"&gt;вызов шлюза&lt;/a&gt;) и его цена.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9bqxbrxd\"&gt;!! anomaly    &amp;lt;kind&amp;gt; …&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Что-то необычное: достигнут лимит, вызов не удался.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5dimubor\"&gt;user.note     [msg] &amp;lt;text&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Указание из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fee2djtj\"&gt;theia msg&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&
