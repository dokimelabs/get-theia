gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bo19lhtx\"&gt;run.paused    rounds=2 (resumable)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Прогон на паузе, его можно продолжить.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ln8opdv\"&gt;run.finished  halted=completed rounds=4&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Прогон завершён.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-htvvozdk\"&gt;live          ⏱ implementer tsk…d2vfzc call started&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ход работы. В журнал не записывается.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Итоговые строки:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;tsk2akdqiyyco222jxsd2vfzc → merged (4 rounds) Add a greeting.txt file with the text hello\nhalted: completed · 2 gateway calls · $0.0000\naudit chain: intact\nbudget remaining: 10\nrun branch theia/run-4lejtj @ 8d6868e — 2 merges ahead of base; review/PR from it (your checkout was not touched)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"913\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-913\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-913\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-913.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;Итоговая фаза каждой задачи. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ldywgog6\"&gt;merged&lt;/code&gt; — изменение в ветке прогона. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-10tp05f4\"&gt;discarded&lt;/code&gt; — задача закрыта без результата.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-07vp8rg2\"&gt;halted:&lt;/code&gt; — причина остановки, см. &lt;a href=\"ru/glossary.html#halted\"&gt;halted&lt;/a&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a9rzryng\"&gt;completed&lt;/code&gt; — делать больше нечего, но задачи всё равно могут быть &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7zc2w6z0\"&gt;discarded&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x3h6qjbr\"&gt;paused&lt;/code&gt; — прогон можно продолжить. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ym9yjphe\"&gt;abandoned&lt;/code&gt; — прогон закрыт через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j4wdi0hz\"&gt;--abandon&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y15bcc2c\"&gt;budget&lt;/code&gt; — прогон упёрся во внутренний лимит в 1000 вердиктов, к деньгам это не относится.&lt;/li&gt;\n&lt;li&gt;Число вызовов моделей и их общая цена.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ysomlebj\"&gt;audit chain: intact&lt;/code&gt; — журнал прогона полный и не изменён, см. &lt;a href=\"ru/glossary.html#audit-chain\"&gt;цепочка аудита&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qjfwjht8\"&gt;budget remaining:&lt;/code&gt; — сколько денег осталось. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-whn9fu84\"&gt;unmetered&lt;/code&gt; — без лимита.&lt;/li&gt;\n&lt;li&gt;Последняя строка показывает ветку прогона. Число считает коммиты после базы, а не слияния. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l7ts2gk0\"&gt;no merges landed&lt;/code&gt; значит, что забирать нечего.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;У прогона на паузе добавляется строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hqocl0hi\"&gt;paused — resume with: theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. После итоговых строк Theia может напечатать &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k9e8vf9a\"&gt;maintenance: …&lt;/code&gt; — это обычная уборка.&lt;/p&gt;\n&lt;h2 id=\"run-exit-codes\"&gt;&lt;a href=\"ru/reference/run.html#run-exit-codes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Коды выхода&lt;/span&gt;&lt;/a&gt;Коды выхода&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Код&lt;/th&gt;\n&lt;th&gt;Когда&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;0&lt;/td&gt;\n&lt;td&gt;Все задачи закончились как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4vwb9vgf\"&gt;merged&lt;/code&gt; (или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zbfec7z4\"&gt;planned&lt;/code&gt;). Также когда прогон встал на паузу: Ctrl+C или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mfvvkard\"&gt;q&lt;/code&gt; один раз, закончился бюджет, сработал защитный лимит.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;Хотя бы одна задача закончилась иначе, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jwzdtdy6\"&gt;discarded&lt;/code&gt;. Также при неверных аргументах и отказах: неизвестный трек, ветка уже есть, база не найдена, план не утверждён, файл для &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mnodfrzb\"&gt;@&lt;/code&gt; не найден или содержит секрет, нечего продолжать.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;130&lt;/td&gt;\n&lt;td&gt;Жёсткая остановка: второй Ctrl+C или второй &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bgxu3qhg\"&gt;q&lt;/code&gt; в TUI.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;143&lt;/td&gt;\n&lt;td&gt;Процесс завершён командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ek26jvr0\"&gt;kill&lt;/code&gt; (SIGTERM). Прогон остаётся открытым, его можно продолжить.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"run-files\"&gt;&lt;a href=\"ru/reference/run.html#run-files\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что создаёт прогон&lt;/span&gt;&lt;/a&gt;Что создаёт прогон&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;В &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jybqy0it\"&gt;.gitignore&lt;/code&gt; в корне репозитория добавляется &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nomik3os\"&gt;.theia/&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y491jcsx\"&gt;.theia/runs/&amp;lt;папка прогона&amp;gt;/trunk&lt;/code&gt; — скрытое рабочее дерево git (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-24ri9wuj\"&gt;git worktree&lt;/code&gt;), в котором выбрана ветка прогона. Имя папки — идентификатор прогона без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-blkobfl3\"&gt;run&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-crihhmuj\"&gt;.theia/runs/&amp;lt;папка прогона&amp;gt;/ws-&amp;lt;задача&amp;gt;&lt;/code&gt; — полная копия репозитория для каждой задачи, &lt;a href=\"ru/glossary.html#workspace\"&gt;рабочая область&lt;/a&gt;. В неё попадают и неотслеживаемые файлы вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fz24oar3\"&gt;node_modules&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9w1sqem5\"&gt;.env&lt;/code&gt;, поэтому роли могут их читать. Эти файлы никогда не коммитятся. После успешного слияния Theia удаляет копию, в остальных случаях оставляет.&lt;/li&gt;\n&lt;li&gt;Ветка git &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r83iffu4\"&gt;theia/run-&amp;lt;6 символов&amp;gt;&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q0r1iw6g\"&gt;ai/&amp;lt;задача&amp;gt;&lt;/code&gt; для каждой слитой задачи. Theia никогда не отправляет их в удалённый репозиторий.&lt;/li&gt;\n&lt;li&gt;Записи в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kq1x40kr\"&gt;.theia/store.db&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Как это удалить: &lt;a href=\"ru/guides/first-task.html#cleanup\"&gt;Первая задача&lt;/a&gt; и &lt;a href=\"ru/reference/audit-prune.html#prune\"&gt;theia prune&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"run-env\"&gt;&lt;a href=\"ru/reference/run.html#run-env\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Переменные окружения&lt;/span&gt;&lt;/a&gt;Переменные окружения&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Переменная&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4d4nbl0j\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Дописывает в этот файл каждое событие прогона: строку &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cg6o5zk9\"&gt;--plain&lt;/code&gt; и все данные в JSON. После прогона короче секунды файл может остаться пустым.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4q0nvv44\"&gt;THEIA_NO_SPINNER&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nct6lzwv\"&gt;1&lt;/code&gt; включает неподвижные значки, как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sgew9x3z\"&gt;--no-spinner&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Все переменные: &lt;a href=\"ru/config/environment.html\"&gt;Переменные окружения&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"ru/reference/run.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;См. также&lt;/span&gt;&lt;/a&gt;См. также&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/guides/first-task.html\"&gt;Первая задача&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/reference/plan.html\"&gt;theia plan&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/reference/run-control.html\"&gt;theia msg, answer, probe&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/config/policy.html\"&gt;Параметры policy.yaml&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/reference/run.html","hreflang":"en"},{"href":"ru/reference/run.html","hreflang":"ru"}],"style":["_assets/theia.css","_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"canonical":"ru/reference/run.html","vcsPath":"ru/reference/run.md"},"headings":[{"title":"theia run","href":"ru/reference/run.html#run","level":2,"items":[{"title":"--task","href":"ru/reference/run.html#run-task","level":3},{"title":"Вставка файлов через @","href":"ru/reference/run.html#run-file-inclusion","level":3},{"title":"--track","href":"ru/reference/run.html#run-track","level":3},{"title":"--verify","href":"ru/reference/run.html#run-verify","level":3},{"title":"--budget","href":"ru/reference/run.html#run-budget","level":3},{"title":"--max-rounds","href":"ru/reference/run.html#run-max-rounds","level":3},{"title":"--max-rescopes","href":"ru/reference/run.html#run-max-rescopes","level":3},{"title":"--plain","href":"ru/reference/run.html#run-plain","level":3},{"title":"--cli","href":"ru/reference/run.html#run-cli","level":3},{"title":"--tui","href":"ru/reference/run.html#run-tui","level":3},{"title":"--non-interactive","href":"ru/reference/run.html#run-non-interactive","level":3},{"title":"--no-spinner","href":"ru/reference/run.html#run-no-spinner","level":3},{"title":"--interaction","href":"ru/reference/run.html#run-interaction","level":3},{"title":"--from-plan","href":"ru/reference/run.html#run-from-plan","level":3},{"title":"--plan","href":"ru/reference/run.html#run-plan","level":3},{"title":"--root","href":"ru/reference/run.html#run-root","level":3},{"title":"--branch","href":"ru/reference/run.html#run-branch","level":3},{"title":"--base","href":"ru/reference/run.html#run-base","level":3},{"title":"--no-run-branch","href":"ru/reference/run.html#run-no-run-branch","level":3},{"title":"--in-place","
