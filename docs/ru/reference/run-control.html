            {"data":{"leading":false,"html":"&lt;p&gt;Эти команды работают с уже существующим &lt;a href=\"ru/glossary.html#run\"&gt;прогоном&lt;/a&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0qutpmj7\"&gt;msg&lt;/code&gt; даёт ему указание, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sybs98lc\"&gt;answer&lt;/code&gt; отвечает на его вопросы, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ruojgjt3\"&gt;probe&lt;/code&gt; задаёт вопрос о прогоне и ничего в нём не меняет.&lt;/p&gt;\n&lt;h2 id=\"msg\"&gt;&lt;a href=\"ru/reference/run-control.html#msg\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;theia msg&lt;/span&gt;&lt;/a&gt;theia msg&lt;/h2&gt;\n&lt;p&gt;Добавляет &lt;a href=\"ru/glossary.html#steering\"&gt;указание&lt;/a&gt; в журнал прогона. Роли видят его в следующих промптах.&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia msg &amp;lt;runId&amp;gt; [--task &amp;lt;taskId&amp;gt;] &amp;lt;text&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"9\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-9\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-9\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Аргумент&lt;/th&gt;\n&lt;th&gt;Значение&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qshnkbxc\"&gt;&amp;lt;runId&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;идентификатор прогона&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Прогон. Полный идентификатор &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hbovo472\"&gt;run…&lt;/code&gt; или он же без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k0e8vrf5\"&gt;run&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-28a6ci2x\"&gt;--task&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;идентификатор задачи или его последние символы&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Отправить указание только одной задаче. См. &lt;a href=\"ru/reference/run-control.html#msg-task\"&gt;--task&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xs2d1o66\"&gt;&amp;lt;text&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;текст&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Указание. Все слова после идентификатора прогона склеиваются, поэтому кавычки не обязательны, но с ними надёжнее. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9pmm7gyv\"&gt;@путь&lt;/code&gt; вставляет файл, см. &lt;a href=\"ru/reference/run.html#run-file-inclusion\"&gt;вставка файлов&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Без текста Theia печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e24ssp7u\"&gt;theia msg &amp;lt;runId&amp;gt; [--task &amp;lt;taskId&amp;gt;] \"steering note\"&lt;/code&gt; и завершается с кодом 1. Для неизвестного прогона — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ng5002m2\"&gt;msg: no events for &amp;lt;id&amp;gt;&lt;/code&gt;, код выхода 1.&lt;/p&gt;\n&lt;p&gt;Ответ зависит от состояния прогона:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Состояние прогона&lt;/th&gt;\n&lt;th&gt;Вывод&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;на паузе&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bz8l2dzs\"&gt;noted — folds into guidance on: theia run --resume run2akdqcg6bs222ldyelou46&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;идёт&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b7db5wlm\"&gt;noted — this run appears live: it folds cross-process notes at its next dispatch boundary …&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;завершён&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ycyja9ka\"&gt;noted — run already finished; the note stays on the audit trail (and guides any fork)&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hux5bv05\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt; показывает каждое указание строкой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y74f28ck\"&gt;user.note [msg] &amp;lt;text&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"msg-task\"&gt;&lt;a href=\"ru/reference/run-control.html#msg-task\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t52ap5ff\"&gt;--task&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Отправляет указание одной задаче: его увидят только промпты этой задачи.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Укажите полный идентификатор задачи &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wp19veav\"&gt;tsk…&lt;/code&gt;, идентификатор без &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5u1jfqe2\"&gt;tsk&lt;/code&gt; или его последние символы.&lt;/li&gt;\n&lt;li&gt;Вывод: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7e0g12d1\"&gt;noted for task …dlyndt2n — folds into its guidance only&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Если задача уже закончилась или идентификатор неизвестен, указание уходит всему прогону, и его видит ведущий: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h28zjm15\"&gt;task …nosuch is unknown — rerouted to run-level guidance (the lead sees it; the original addressee is recorded on the note)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Если символы подходят к нескольким задачам, Theia останавливается: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ajq122a3\"&gt;msg: task &amp;lt;id&amp;gt; is ambiguous (…)&lt;/code&gt;, код выхода 1.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"msg-delivery\"&gt;&lt;a href=\"ru/reference/run-control.html#msg-delivery\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Когда прогон использует указание&lt;/span&gt;&lt;/a&gt;Когда прогон использует указание&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Как запущен прогон&lt;/th&gt;\n&lt;th&gt;Когда используется указание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Был на паузе, затем продолжен через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j6i42n9y\"&gt;theia run --resume&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;С момента продолжения, в каждом промпте.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Продолжен через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m5p53bxy\"&gt;theia run --resume&lt;/code&gt; и ещё идёт&lt;/td&gt;\n&lt;td&gt;Со следующего шага.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Запущен через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jubzhaco\"&gt;theia run --task&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lszx5upm\"&gt;--from-plan&lt;/code&gt; и ещё идёт&lt;/td&gt;\n&lt;td&gt;Не используется. Дойдёт, только если поставить прогон на паузу и продолжить.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Завершён&lt;/td&gt;\n&lt;td&gt;Никогда. Указание остаётся в журнале.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 идущий прогон, запущенный через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p1862rz6\"&gt;theia run --task&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n4n0ei44\"&gt;--from-plan&lt;/code&gt;, не читает указания из других процессов, хотя &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u6astqwe\"&gt;msg&lt;/code&gt; обещает обратное. Поставьте прогон на паузу, отправьте указание и продолжите его. В TUI можно направлять прогон напрямую клавишей &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xtvspskp\"&gt;m&lt;/code&gt;, см. &lt;a href=\"ru/tui/navigation.html\"&gt;Навигация и горячие клавиши&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"answer\"&gt;&lt;a href=\"ru/reference/run-control.html#answer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;theia answer&lt;/span&gt;&lt;/a&gt;theia answer&lt;/h2&gt;\n&lt;p&gt;Показывает &lt;a href=\"ru/glossary.html#clarify\"&gt;уточняющие вопросы&lt;/a&gt;, которые прогон отправил в &lt;a href=\"ru/glossary.html#control-bus\"&gt;шину управления&lt;/a&gt;, и отвечает на них.&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia answer &amp;lt;runId&amp;gt;\ntheia answer &amp;lt;runId&amp;gt; --question &amp;lt;questionId&amp;gt; [&amp;lt;answer&amp;gt; …]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"212\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-212\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-212\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-212.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Аргумент&lt;/th&gt;\n&lt;th&gt;Значение&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-57l7080a\"&gt;&amp;lt;runId&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;идентификатор прогона&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Прогон.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pr0zc7e5\"&gt;--question&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;идентификатор вопроса или его последние символы&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Вопрос, на который вы отвечаете. Без него Theia показывает открытые вопросы.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t4y5jtyy\"&gt;&amp;lt;answer&amp;gt; …&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;текст, по одному аргументу на вопрос&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Ответы по порядку вопросов. Заключайте каждый ответ в кавычки. Без ответов вопрос считается отклонённым. Не показан в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6egscgiq\"&gt;theia help&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Без идентификатора прогона Theia печатает краткую справку и завершается с кодом 1.&lt;/p&gt;\n&lt;p&gt;Список вопросов:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Открытых вопросов нет: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nfjfh8ze\"&gt;no pending questions&lt;/code&gt;, код выхода 0.&lt;/li&gt;\n&lt;li&gt;Иначе для каждого вопроса: строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-flgco8b5\"&gt;question &amp;lt;questionId&amp;gt;  (task …&amp;lt;8 символов&amp;gt;)&lt;/code&gt;, затем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7xgjg9j9\"&gt;? &amp;lt;вопрос&amp;gt;&lt;/code&gt; и, если есть, причина в скобках. В конце: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6lhrn84a\"&gt;answer with: theia answer &amp;lt;runId&amp;gt; --question &amp;lt;id&amp;gt; \"…\" — answers match questions in order&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Ответ:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Theia записывает ответ в журнал прогона. Вывод: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qjvfk5pu\"&gt;answered &amp;lt;8 символов&amp;gt; (&amp;lt;идентификатор события&amp;gt;) — a live run consumes it within seconds; a paused run hears it on resume&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Без ответов: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kmk0m5xi\"&gt;declined &amp;lt;8 символов&amp;gt; (&amp;lt;идентификатор события&amp;gt;)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Неизвестный вопрос: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8znspuvt\"&gt;answer: no pending question 'zzzz' on this run&lt;/code&gt;, код выхода 1.&lt;/li&gt;\n&lt;li&gt;Ответы даны, но ни один не подошёл к вопросу: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-upvgzb75\"&gt;answer: no answers matched (fewer questions than answers?)&lt;/code&gt;, код выхода 1.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"answer-question\"&gt;&lt;a href=\"ru/reference/run-control.html#answer-question\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qk9yvxlj\"&gt;--question&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Идентификатор вопроса из списка. Достаточно последних символов.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 вопросы в шину управления отправляет только прогон, продолженный командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-01i32r1v\"&gt;theia run --resume &amp;lt;runId&amp;gt; --interaction bus&lt;/code&gt;. Он ждёт ответа до 600 секунд (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ie6p6npj\"&gt;run.interactionWaitSeconds&lt;/code&gt;). Ответ, записанный после того, как прогон перестал ждать, не используется, хотя сообщение говорит «a paused run hears it on resume». Передайте сведения через &lt;a href=\"ru/reference/run-control.html#msg\"&gt;theia msg&lt;/a&gt; и продолжите прогон. В наших проверках этой версии вызвать вопрос в шине управления не удалось.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"probe\"&gt;&lt;a href=\"ru/reference/run-control.html#probe\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;theia probe&lt;/span&gt;&lt;/a&gt;theia probe&lt;/h2&gt;\n&lt;p&gt;&lt;a href=\"ru/glossary.html#probe\"&gt;Вопрос о прогоне&lt;/a&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-637wddzp\"&gt;probe&lt;/code&gt;): о его состоянии, вердиктах и контексте. Theia делает один вызов модели и не меняет прогон.&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia probe &amp;lt;runId&amp;gt; &amp;lt;question&amp;gt; [--budget &amp;lt;usd&amp;gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"340\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-340\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-340\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-340.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Аргумент&lt;/th&gt;\n&lt;th&gt;Значение&lt;/th&gt;\n&lt;th&gt;По умолчанию&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y6ouelia\"&gt;&amp;lt;runId&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;идентификатор прогона&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Прогон, о котором вы спрашиваете.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-epb78wi2\"&gt;&amp;lt;question&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;текст&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Вопрос. Все слова после идентификатора прогона склеиваются. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o1yqfym3\"&gt;@путь&lt;/code&gt; вставляет файл.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wh9mzbix\"&gt;--budget&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;доллары США&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;Денежный лимит этого вызова. См. &lt;a href=\"ru/reference/run-control.html#probe-budget\"&gt;--budget&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Вывод: сначала ответ, потом строка с идентификатором вопроса, прогоном, последним событием, ценой и напоминанием, что прогон не изменён:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;[probe run2akdqckmao223pmxknw6vb of run2akdqck6vw2234dhcxwrue @ …d5kzqxny — $0.0000; parent untouched]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"406\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-406\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-406\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-406.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;Работает для идущего, приостановленного и завершённого прогона.&lt;/li&gt;\n&lt;li&gt;У вопроса свой идентификатор. Он виден в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-56scbbg2\"&gt;theia audit verify&lt;/code&gt;, и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c9hr9cn3\"&gt;theia prune&lt;/code&gt; его не удаляет.&lt;/li&gt;\n&lt;li&gt;Если задать тот же вопрос о неизменившемся прогоне ещё раз, Theia может взять записанный ответ без нового вызова модели.&lt;/li&gt;\n&lt;li&gt;Без вопроса Theia печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oxnb2h0s\"&gt;theia probe &amp;lt;runId&amp;gt; \"question\" [--budget usd]&lt;/code&gt; и завершается с кодом 1.&lt;/li&gt;\n&lt;li&gt;Если журнал прогона изменён, Theia отказывает: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t8rb2v3s\"&gt;probe: parent chain BROKEN at &amp;lt;id&amp;gt; — refusing to read a tampered run&lt;/code&gt;, код выхода 1.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"probe-budget\"&gt;&lt;a href=\"ru/reference/run-control.html#probe-budget\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7tpd1658\"&gt;--budget&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Денежный лимит вызова в долларах США. По умолчанию $1. Не показан в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tj45th6b\"&gt;theia help&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"ru/reference/run-control.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;См. также&lt;/span&gt;&lt;/a&gt;См. также&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/reference/run.html\"&gt;theia run&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/integrations/mcp-server.html\"&gt;MCP-сервер&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/reference/run-control.html","hreflang":"en"},{"href":"ru/reference/run-control.html","hreflang":"ru"}],"style":["_assets/theia.css","_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"canonical":"ru/reference/run-control.html","vcsPath":"ru/reference/run-control.md"},"headings":[{"title":"theia msg","href":"ru/reference/run-control.html#msg","level":2,"items":[{"title":"--task","href":"ru/reference/run-control.html#msg-task","level":3},{"title":"Когда прогон использует указание","href":"ru/reference/run-control.html#msg-delivery","level":3}]},{"title":"theia answer","href":"ru/reference/run-control.html#answer","level":2,"items":[{"title":"--question","href":"ru/reference/run-control.html#answer-question","level":3}]},{"title":"theia probe","href":"ru/reference/run-control.html#probe","level":2,"items":[{"title":"--budget","href":"ru/reference/run-control.html#probe-budget","level":3}]},{"title":"См. также","href":"ru/reference/run-control.html#see-also","level":2}],"title":"theia msg, answer, probe"},"router":{"pathname":"ru/reference/run-control","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/ru/index.html","tags":[]}}
