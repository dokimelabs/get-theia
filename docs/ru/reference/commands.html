            {"data":{"leading":false,"html":"&lt;p&gt;Короткая сводка всех команд &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7t9cxyxd\"&gt;theia&lt;/code&gt; 0.2.201: что делает каждая, тратит ли деньги на модели и где о ней прочитать. Здесь же глобальные флаги, коды выхода и общие правила разбора аргументов.&lt;/p&gt;\n&lt;h2 id=\"syntax\"&gt;&lt;a href=\"ru/reference/commands.html#syntax\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как устроен вызов&lt;/span&gt;&lt;/a&gt;Как устроен вызов&lt;/h2&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia [глобальные флаги] &amp;lt;команда&amp;gt; [подкоманда] [аргументы]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tf5bld4p\"&gt;theia help&lt;/code&gt; печатает справку и завершается с кодом 0.&lt;/li&gt;\n&lt;li&gt;Неизвестная команда печатает ту же справку и завершается с кодом 1.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pyqwtjfs\"&gt;theia&lt;/code&gt; без команды в терминале открывает мастер первой настройки или &lt;a href=\"ru/glossary.html#home-screen\"&gt;домашний экран&lt;/a&gt;. Без терминала, например в скрипте, печатает справку.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"commands\"&gt;&lt;a href=\"ru/reference/commands.html#commands\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Команды&lt;/span&gt;&lt;/a&gt;Команды&lt;/h2&gt;\n&lt;p&gt;Колонка «Модели» показывает, обращается ли команда к модели. Такие обращения стоят денег или расходуют лимит подписки.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Команда&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;th&gt;Модели&lt;/th&gt;\n&lt;th&gt;Подробно&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e2zyi6wh\"&gt;theia init&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Создаёт хранилище &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-axuytvw9\"&gt;.theia&lt;/code&gt; для проекта&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/init.html#init\"&gt;init&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7e7tyl7s\"&gt;theia setup&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Записывает пользовательские настройки: токен GitHub, ключ OpenAI, канал обновлений&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/setup-self-version.html#setup\"&gt;setup&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q8gtwor4\"&gt;theia self update&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Обновляет Theia до последней версии канала&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/setup-self-version.html#self-update\"&gt;self update&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2tnjwszt\"&gt;theia version&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Печатает версию&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/setup-self-version.html#version\"&gt;version&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w7il5nfu\"&gt;theia doctor&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Проверяет движки, ключи, эмбеддинги и хранилище&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/doctor.html#doctor\"&gt;doctor&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cp8jag87\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Выполняет задачу, продолжает (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-41ly63ur\"&gt;--resume&lt;/code&gt;) или закрывает (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h2v70n1l\"&gt;--abandon&lt;/code&gt;) прогон&lt;/td&gt;\n&lt;td&gt;да&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/run.html#run\"&gt;run&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4gx7iqr0\"&gt;theia plan&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Составляет план и управляет им&lt;/td&gt;\n&lt;td&gt;только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zx0lcxde\"&gt;plan --task&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/plan.html#plan\"&gt;plan&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t4rin8zf\"&gt;theia msg&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Отправляет прогону указание&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/run-control.html#msg\"&gt;msg&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vqhukz16\"&gt;theia answer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Показывает вопросы прогона и отвечает на них&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/run-control.html#answer\"&gt;answer&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y9pnbpmm\"&gt;theia probe&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Задаёт вопрос о прогоне, не меняя его&lt;/td&gt;\n&lt;td&gt;да&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/run-control.html#probe\"&gt;probe&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v2yx6wyg\"&gt;theia show&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Показывает сохранённый прогон&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/run-inspect.html#show\"&gt;show&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1dfzpdgl\"&gt;theia replay&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Перечитывает журнал прогона и проверяет цепочку аудита&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/run-inspect.html#replay\"&gt;replay&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3kvpjs4d\"&gt;theia diagnose&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Называет вероятную причину неудачи по таблице правил&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/run-inspect.html#diagnose\"&gt;diagnose&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l7aamdvv\"&gt;theia compare&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сравнивает два прогона&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/run-inspect.html#compare\"&gt;compare&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fumhp46d\"&gt;theia fork&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Создаёт ответвление прогона с выбранного шага&lt;/td&gt;\n&lt;td&gt;нет, пока ответвление не продолжено&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/run-inspect.html#fork\"&gt;fork&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-au1xaax0\"&gt;theia audit verify&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Проверяет цепочки хешей в журнале событий&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/audit-prune.html#audit-verify\"&gt;audit verify&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6v0cve0z\"&gt;theia prune&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Удаляет данные завершённых прогонов&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/audit-prune.html#prune\"&gt;prune&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uxex8mc7\"&gt;theia index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Строит индекс кода и ищет по нему&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-45uq1cy3\"&gt;index build&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/index-cmd.html#index\"&gt;index&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1u3mdolc\"&gt;theia mem&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Работает с памятью проекта&lt;/td&gt;\n&lt;td&gt;только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yq3not1m\"&gt;mem maintain --llm&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/mem.html#mem\"&gt;mem&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4duj3y9s\"&gt;theia ask&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Отвечает на вопрос по памяти, индексу и прогонам&lt;/td&gt;\n&lt;td&gt;да, если нашлись записи&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/ask.html#ask\"&gt;ask&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ptq3ogc7\"&gt;theia hooks install&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Подключает Theia к Claude Code, Codex или git&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/hooks.html#hooks\"&gt;hooks&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cxyhw8hc\"&gt;theia serve&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Запускает MCP-сервер для других инструментов&lt;/td&gt;\n&lt;td&gt;зависит от вызванного инструмента&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/serve.html#serve\"&gt;serve&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4dyoagc9\"&gt;theia jail&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Запускает команду в песочнице, только на Linux&lt;/td&gt;\n&lt;td&gt;нет&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/jail.html#jail\"&gt;jail&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zmm9dzdi\"&gt;theia eval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Запускает замеры платформы&lt;/td&gt;\n&lt;td&gt;зависит от подкоманды&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/eval.html#eval\"&gt;eval&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Эмбеддинги (числовые векторы смысла) для поиска по умолчанию считаются локально и ничего не стоят. Если в настройках выбран провайдер &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6enfwto7\"&gt;openai&lt;/code&gt;, команды &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-458a3edw\"&gt;index reindex&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cqqo1cnf\"&gt;mem reindex&lt;/code&gt; платят за эмбеддинги OpenAI. Подробнее — в разделе &lt;a href=\"ru/guides/knowledge.html\"&gt;Индекс кода, память и вопросы&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"global-flags\"&gt;&lt;a href=\"ru/reference/commands.html#global-flags\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Глобальные флаги&lt;/span&gt;&lt;/a&gt;Глобальные флаги&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Флаг&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h53dvej2\"&gt;--x-release &amp;lt;версия&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Запускает указанную версию Theia вместо установленной. Можно писать и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mtl7fvk1\"&gt;--x-release=&amp;lt;версия&amp;gt;&lt;/code&gt;. Theia ищет версию в своём кэше и скачивает её, если настроен токен GitHub. Если версию получить нельзя, команда завершается с ошибкой и не запускает текущую версию.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Переменная окружения &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b0s4pbz9\"&gt;THEIA_X_RELEASE&lt;/code&gt; работает так же, как флаг. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pkztpqif\"&gt;theia --version&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kkdmij80\"&gt;theia -V&lt;/code&gt; — то же, что &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gi9mq052\"&gt;theia version&lt;/code&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-obmzekgd\"&gt;--x-release&lt;/code&gt; не видит версии, которые поставил установщик, и скачивает их заново. Одна распакованная версия занимает около 900 МБ.&lt;/li&gt;\n&lt;li&gt;Неверное значение &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-svz86kki\"&gt;THEIA_X_RELEASE&lt;/code&gt; ломает все команды, даже &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-01ezjok2\"&gt;theia version&lt;/code&gt;. Чтобы починить, удалите переменную: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t064w9jy\"&gt;unset THEIA_X_RELEASE&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tie7cuxf\"&gt;--dev&lt;/code&gt; нужен разработчикам платформы. В выпуске 0.2.201 он не работает: печатает справку и завершается с кодом 1.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Подробнее — в разделе &lt;a href=\"ru/install/update.html\"&gt;Обновление и выбор версии&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"exit-codes\"&gt;&lt;a href=\"ru/reference/commands.html#exit-codes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Коды выхода&lt;/span&gt;&lt;/a&gt;Коды выхода&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Код&lt;/th&gt;\n&lt;th&gt;Что значит&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6m7s1mjc\"&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Команда выполнена. Для &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t4rcn2ou\"&gt;theia run&lt;/code&gt; это также пауза: после первого Ctrl+C, при нехватке бюджета или когда сработала защита от зацикливания&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l1oem044\"&gt;1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Ошибка или отказ: неверные аргументы, хранилище не найдено, задача прогона отброшена (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-02nzyutz\"&gt;discarded&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a6sl3cyx\"&gt;theia doctor&lt;/code&gt; нашёл проблему&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-azj0gpi2\"&gt;130&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83rv5739\"&gt;theia run&lt;/code&gt;: жёсткая остановка вторым Ctrl+C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;У некоторых команд код 1 имеет свой смысл. Например, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f7bjnlxz\"&gt;theia index status&lt;/code&gt; возвращает 1, когда индекс устарел. Такие случаи описаны на страницах команд.&lt;/p&gt;\n&lt;h2 id=\"argument-rules\"&gt;&lt;a href=\"ru/reference/commands.html#argument-rules\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Общие правила&lt;/span&gt;&lt;/a&gt;Общие правила&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Флаг со значением берёт следующее слово: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kdnc5co4\"&gt;--budget 5&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c7qs4adj\"&gt;theia run&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-72v4c096\"&gt;theia init&lt;/code&gt; молча пропускают неизвестные флаги. Опечатка вроде &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ph0lsk4v\"&gt;--budjet 3&lt;/code&gt; оставит значение по умолчанию. Бюджет прогона виден в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7k8ka7i\"&gt;run.created&lt;/code&gt; в начале вывода.&lt;/li&gt;\n&lt;li&gt;Идентификаторы начинаются с префикса: прогон — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-efq9yr02\"&gt;run&lt;/code&gt;, задача — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vgp0pyrz\"&gt;tsk&lt;/code&gt;, план — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-inicev0j\"&gt;pln&lt;/code&gt;, факт памяти — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oqmk1n0q\"&gt;fct&lt;/code&gt;. После префикса идут 22 символа. Команды принимают полный идентификатор или эти 22 символа без префикса.&lt;/li&gt;\n&lt;li&gt;Короткий хвост идентификатора понимают только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h6ibk03r\"&gt;show --task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wrcxcm6o\"&gt;msg --task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-avvazc89\"&gt;fork --at&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lj3q8kpa\"&gt;answer --question&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Команды «список прогонов» нет. Идентификатор прогона виден в строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-douxkfym\"&gt;run run… task tsk…&lt;/code&gt; в начале прогона, в подсказке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-arg6absi\"&gt;resume with: …&lt;/code&gt; при паузе, на домашнем экране (последние 5 прогонов) и в выводе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wn7kzrgj\"&gt;theia audit verify&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Запись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-700gw36h\"&gt;@путь&lt;/code&gt; в тексте для &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4zn66p2x\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pqjfa167\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0v1ca5y6\"&gt;msg&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6rq9rmo6\"&gt;probe&lt;/code&gt; вставляет в запрос содержимое файла. Подробнее — в словаре: &lt;a href=\"ru/glossary.html#file-inclusion\"&gt;вставка файла через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wmbaahnt\"&gt;@&lt;/code&gt;&lt;/a&gt;. Команда &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xc8hnxig\"&gt;ask&lt;/code&gt; так не умеет.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"ru/reference/commands.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;См. также&lt;/span&gt;&lt;/a&gt;См. также&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/about/overview.html\"&gt;Что такое Theia&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/troubleshooting.html\"&gt;Решение проблем&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html\"&gt;Словарь терминов&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/reference/commands.html","hreflang":"en"},{"href":"ru/reference/commands.html","hreflang":"ru"}],"style":["_assets/theia.css"],"canonical":"ru/reference/commands.html","vcsPath":"ru/reference/commands.md"},"headings":[{"title":"Как устроен вызов","href":"ru/reference/commands.html#syntax","level":2},{"title":"Команды","href":"ru/reference/commands.html#commands","level":2},{"title":"Глобальные флаги","href":"ru/reference/commands.html#global-flags","level":2},{"title":"Коды выхода","href":"ru/reference/commands.html#exit-codes","level":2},{"title":"Общие правила","href":"ru/reference/commands.html#argument-rules","level":2},{"title":"См. также","href":"ru/reference/commands.html#see-also","level":2}],"title":"Все команды"},"router":{"pathname":"ru/reference/commands","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/ru/index.html","tags":[]}}
