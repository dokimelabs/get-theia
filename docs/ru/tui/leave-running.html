16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"356\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-356\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-356\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-356.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;В журнале появится строка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xj10rx44\"&gt;stopping gracefully — in-flight verdicts will land; resume with: theia run --resume &amp;lt;id&amp;gt;&lt;/code&gt;. Текущий шаг закончится без прерывания команды проверки, и прогон встанет на паузу. Второй &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h9v6sg3j\"&gt;kill -INT&lt;/code&gt; останавливает прогон сразу.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Что проверено на macOS в zsh и в bash: после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z2u90jt0\"&gt;disown&lt;/code&gt; закрытие окна терминала не остановило прогон, и прогон записал сводку в журнал. В zsh фоновые задания работают с пониженным приоритетом процессора (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gtv7lqab\"&gt;ps&lt;/code&gt; показывает флаг &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8puybfsr\"&gt;N&lt;/code&gt;), поэтому команда проверки может идти чуть медленнее.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Одного nohup недостаточно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Прогон, запущенный как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-582gzq4o\"&gt;nohup theia run … &amp;amp;&lt;/code&gt;, погиб при закрытии окна терминала: журнал оборвался на середине, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qypkugbo\"&gt;theia show&lt;/code&gt; сообщил &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ubw1i939\"&gt;halted: (still open)&lt;/code&gt;. В той же проверке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nky8p4wa\"&gt;nohup sleep 300&lt;/code&gt; выжил. Используйте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dhltntru\"&gt;&amp;amp;&lt;/code&gt; вместе с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tr9qxvp9\"&gt;disown&lt;/code&gt;, как показано выше, или tmux.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"pause-resume\"&gt;&lt;a href=\"ru/tui/leave-running.html#pause-resume\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Способ 3: пауза сейчас, продолжение потом&lt;/span&gt;&lt;/a&gt;Способ 3: пауза сейчас, продолжение потом&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;В TUI нажмите &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nvx1lg7g\"&gt;q&lt;/code&gt; один раз (или Ctrl+C один раз). Второй раз не нажимайте: дождитесь, пока закончится текущий шаг. Прогон встанет на паузу, и TUI напечатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b0ro7ij5\"&gt;paused — resume with: theia run --resume run2…&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Позже в той же папке проекта продолжите прогон:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia run --resume &amp;lt;runId&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"388\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-388\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-388\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-388.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пример начала вывода:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;run branch: theia/run-gzhh76 (resumed @ 38e8154)\nresuming run run2akdqjtrt6223o7agzhh76 (paused; budget 10.00 usd remaining)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"392\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-392\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-392\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-392.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Прогон продолжается с того места, где остановился. Завершённые шаги не повторяются.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Чтобы продолжить в фоне, соедините команду со способом 2 и затем выполните &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j3dcfa4h\"&gt;disown&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia run --resume &amp;lt;runId&amp;gt; --plain --non-interactive &amp;gt; ~/theia-run.log 2&amp;gt;&amp;amp;1 &amp;lt; /dev/null &amp;amp;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"401\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-401\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-401\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-401.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Продолжение в фоне проверено с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8h9v0pg0\"&gt;--plain --non-interactive&lt;/code&gt;, перенаправлением в журнал и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a1qjcxfr\"&gt;&amp;amp;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l7ubprt7\"&gt;theia run --resume&lt;/code&gt; продолжает и прогон, чей процесс был убит (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rw374gc8\"&gt;halted: (still open)&lt;/code&gt;). Подробнее — на страницах &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt; и &lt;a href=\"ru/reference/run.html#run\"&gt;theia run&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Продолжение в TUI рисует только часть дерева&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o8lbhnje\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt; в TUI показывает только то, что происходит после продолжения. Задач, созданных до паузы, нет, вызовы модели видны под &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7xc2chgu\"&gt;gateway calls (unattributed)&lt;/code&gt;, а в заголовке нет трека и бюджета:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;✔ completed · run run2akdqcguzg2232gj4jthgl ·  · $0.0000 spent · 3 calls · 12 events        0s\ntasks: 0 running · 0 done · anomalies 0                                  [@ event 12/12 · head]\n─────────────────────────────────────────────────────────────────────────────────────────────\n ✔ ▶ gateway calls (unattributed) ×3\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"416\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-416\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-416\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-416.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Сам прогон продолжается правильно, и сводка после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m6z6hu0q\"&gt;q&lt;/code&gt; верная. Чтобы увидеть всё дерево, откройте прогон в просмотре после его конца: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b3aamqf5\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt; показывает все шаги, до паузы и после. Чтобы следить за продолженным прогоном, пока он работает, продолжайте его с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b4ykm7vz\"&gt;--plain&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jfq1wy6j\"&gt;--cli&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"watch-from-another-terminal\"&gt;&lt;a href=\"ru/tui/leave-running.html#watch-from-another-terminal\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как следить из другого терминала&lt;/span&gt;&lt;/a&gt;Как следить из другого терминала&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n2cq0yxg\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt; печатает текущую сводку, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w5y2d02k\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt; — все события на этот момент. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wjl0guvh\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt; открывает &lt;a href=\"ru/tui/overview.html#stored-run-browser\"&gt;просмотр сохранённого прогона&lt;/a&gt;. Сами эти команды не обновляются: запустите команду снова, чтобы увидеть новые шаги.&lt;/li&gt;\n&lt;li&gt;Если нужны все подробности: переменная &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hvae7lc1\"&gt;THEIA_LOG_FILE&lt;/code&gt; заставляет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c6rgba2g\"&gt;theia run&lt;/code&gt; дописывать каждое событие со всеми полями в файл, даже пока экран занят TUI. За этим файлом можно следить через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9fit688p\"&gt;tail -f&lt;/code&gt; из другого терминала. См. &lt;a href=\"ru/config/environment.html\"&gt;Переменные окружения&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Другие терминалы не управляют новым прогоном&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 &lt;a href=\"ru/reference/run-control.html#msg\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vea3bkl1\"&gt;theia msg&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/reference/run-control.html#answer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5amp7173\"&gt;theia answer&lt;/code&gt;&lt;/a&gt; и инструмент MCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-37je9r1r\"&gt;run_stop&lt;/code&gt; не доходят до прогона, запущенного командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rh9ceznz\"&gt;theia run --task&lt;/code&gt; или инструментом MCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5xd1oe5q\"&gt;run_start&lt;/code&gt;. Указание или просьба остановиться записываются в журнал, но прогон их не читает и продолжает работать. Эти команды работают только для прогона, продолженного через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ohzragf5\"&gt;theia run --resume&lt;/code&gt;. См. &lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Чтобы дать &lt;a href=\"ru/glossary.html#steering\"&gt;указание&lt;/a&gt; прогону, запущенному командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zqavx4fr\"&gt;theia run --task&lt;/code&gt;, нажмите &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0m9r7x4v\"&gt;m&lt;/code&gt; в его собственном TUI. Если прогон идёт в tmux, сначала подключитесь к сеансу.&lt;/p&gt;\n&lt;h2 id=\"verify-and-ctrl-c\"&gt;&lt;a href=\"ru/tui/leave-running.html#verify-and-ctrl-c\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Команда проверки и Ctrl+C&lt;/span&gt;&lt;/a&gt;Команда проверки и Ctrl+C&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;В TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9a1qfmrn\"&gt;q&lt;/code&gt; и Ctrl+C — это клавиши, а не сигналы. После первого нажатия идущая команда из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83nc7gxg\"&gt;--verify&lt;/code&gt; заканчивается как обычно.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;В видах &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ubzkxee5\"&gt;--plain&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e69iryh5\"&gt;--cli&lt;/code&gt; Ctrl+C получает вся группа процессов терминала, в том числе идущая команда проверки. Команда погибает, и Theia записывает ложный сбой:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;6f65mawa verdict       7xcnwbqx verifier → verify_fail (1 evidence)  “$ sleep 30 → exit null (no output)”\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"463\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-463\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-463\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-463.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Задача возвращается к исполнителю (&lt;a href=\"ru/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1p5bbwow\"&gt;implementer&lt;/code&gt;&lt;/a&gt;), и прогон встаёт на паузу.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Чтобы поставить прогон &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o8yystkg\"&gt;--plain&lt;/code&gt; на паузу без этого, отправьте &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p4ze1y08\"&gt;kill -INT &amp;lt;pid&amp;gt;&lt;/code&gt; из другого терминала: сигнал получит только Theia.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Два очень быстрых нажатия Ctrl+C в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g4kobr2g\"&gt;--plain&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wu3x5ks7\"&gt;--cli&lt;/code&gt; могут прийти как один сигнал, и тогда прогон только встанет на паузу. Для жёсткой остановки нажмите Ctrl+C ещё раз через секунду.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"open-runs\"&gt;&lt;a href=\"ru/tui/leave-running.html#open-runs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Незакрытые прогоны&lt;/span&gt;&lt;/a&gt;Незакрытые прогоны&lt;/h2&gt;\n&lt;p&gt;У прогона, чей процесс погиб без паузы (закрытое окно, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tiejsz5m\"&gt;kill -TERM&lt;/code&gt;, второе нажатие Ctrl+C), нет записи о завершении:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yy689a9y\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt; сообщает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mlhx7xzf\"&gt;halted: (still open)&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;домашний экран показывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sj2blqvt\"&gt;⣽ … in flight&lt;/code&gt; и учитывает прогон в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2y4208un\"&gt;· N live&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;просмотр сохранённого прогона показывает его как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ftxhagt\"&gt;running&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Продолжите такой прогон командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yj6fr8jl\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt; или закройте его:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia run --abandon &amp;lt;runId&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"505\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-505\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-505\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-505.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пример вывода:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;abandoned run2akdqcdzy6223oud53ns4c — workspaces kept; reclaim with 'theia prune'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"509\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-509\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-509\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-509.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;После этого домашний экран показывает прогон как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eebx6u4s\"&gt;✖ … abandoned&lt;/code&gt; и больше не считает его идущим. Как удалить и его ветку — в разделе &lt;a href=\"ru/tui/overview.html#home-box-cleanup\"&gt;Уборка после поля задачи&lt;/a&gt; и на странице &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Важно&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;В 0.2.201 &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k3bmxal9\"&gt;theia run --resume&lt;/code&gt; не отказывается продолжать прогон, закрытый через &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ye23xds8\"&gt;--abandon&lt;/code&gt;: он запускает его снова. Не продолжайте закрытые прогоны.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"see-also\"&gt;&lt;a href=\"ru/tui/leave-running.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;См. также&lt;/span&gt;&lt;/a&gt;См. также&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы TUI&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/tui/navigation.html\"&gt;Навигация и горячие клавиши&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/guides/control-run.html\"&gt;Управление прогоном&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/reference/run.html\"&gt;theia run&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/integrations/mcp-server.html\"&gt;MCP-сервер&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/tui/leave-running.html","hreflang":"en"},{"href":"ru/tui/leave-running.html","hreflang":"ru"}],"style":["_assets/theia.css"],"canonical":"ru/tui/leave-running.html","vcsPath":"ru/tui/leave-running.md"},"headings":[{"title":"Что делает каждый способ выхода","href":"ru/tui/leave-running.html#exit-effects","level":2,"items":[{"title":"Если закрыть окно терминала","href":"ru/tui/leave-running.html#closing-terminal","level":3},{"title":"kill -TERM","href":"ru/tui/leave-running.html#kill-term","level":3}]},{"title":"Способ 1: запуск в tmux","href":"ru/tui/leave-running.html#tmux","level":2},{"title":"Способ 2: запуск в фоне с файлом журнала","href":"ru/tui/leave-running.html#background","level":2},{"title":"Способ 3: пауза сейчас, продолжение потом","href":"ru/tui/leave-running.html#pause-resume","level":2},{"title":"Как следить из другого терминала","href":"ru/tui/leave-running.html#watch-from-another-terminal","level":2},{"title":"Команда проверки и Ctrl+C","href":"ru/tui/leave-running.html#verify-and-ctrl-c","level":2},{"title":"Незакрытые прогоны","href":"ru/tui/leave-running.html#open-runs","level":2},{"title":"См. также","href":"ru/tui/leave-running.html#see-also","level":2}],"title":"Выход без остановки задачи"},"router":{"pathname":"ru/tui/leave-running","depth":3,"base":"../../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/ru/index.html","tags":[]}}
