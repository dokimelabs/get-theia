            {"data":{"leading":false,"html":"&lt;p&gt;На этой странице — клавиши всех экранов TUI и настройки терминала, которые меняют вид экранов. Что показывают экраны, описано на странице &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы TUI&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"ru/glossary.html#tui\"&gt;Экранный интерфейс (TUI)&lt;/a&gt; работает только с клавиатуры, мышь не поддерживается.&lt;/p&gt;\n&lt;h2 id=\"contexts\"&gt;&lt;a href=\"ru/tui/navigation.html#contexts\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где работают клавиши&lt;/span&gt;&lt;/a&gt;Где работают клавиши&lt;/h2&gt;\n&lt;p&gt;В таблицах экраны названы так:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Название&lt;/th&gt;\n&lt;th&gt;Экран&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Идущий&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wfd9zn5j\"&gt;theia run&lt;/code&gt; в терминале, пока прогон работает&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Завершённый&lt;/td&gt;\n&lt;td&gt;экран завершённого прогона&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Просмотр&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kw2ga3hw\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Клавиши проверены на macOS внутри tmux. Клавиши с пометкой «по коду» вживую не проверялись.&lt;/p&gt;\n&lt;h2 id=\"tree-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#tree-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Движение по дереву&lt;/span&gt;&lt;/a&gt;Движение по дереву&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;th&gt;Где&lt;/th&gt;\n&lt;th&gt;Примечание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6qt0e0xb\"&gt;↑&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aszpldyt\"&gt;k&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;На строку вверх&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;Если клавиши у панели деталей, прокручивает её.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-91img1h3\"&gt;↓&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7f8g9o6t\"&gt;j&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;На строку вниз&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;То же.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zh3dvdfh\"&gt;→&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-53j6uz7b\"&gt;l&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Раскрыть строку&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;На строке без вложенных строк ничего не делает.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ecvphk85\"&gt;←&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2pesnh03\"&gt;h&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Свернуть строку. На свёрнутой строке или строке без вложенных — перейти к родительской строке&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hmynjrys\"&gt;L&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Раскрыть все строки&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jxa48xoa\"&gt;H&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Свернуть все строки&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bgv80xjk\"&gt;g&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Первая строка&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k4o9qp8n\"&gt;G&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Последняя строка&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i654gb8f\"&gt;PgDn&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xiax3499\"&gt;PgUp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;На десять строк вниз / вверх&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;Всегда десять строк, при любой высоте окна.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2f427fk2\"&gt;e&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Следующая строка с проблемой: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4jlj3yyv\"&gt;✖&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6hjgeanc\"&gt;◆&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5qfcrpln\"&gt;‼&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;После последней начинает сверху.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l4lfhvze\"&gt;f&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Режим слежения: курсор прыгает к новым событиям&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;Любое движение курсора выключает режим. Дерево идущего прогона открывается с включённым режимом.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-049v7244\"&gt;F&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сменить уровень слежения: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9bwlroqn\"&gt;round&lt;/code&gt; → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a6up8x2d\"&gt;tool&lt;/code&gt; → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dvp3awop\"&gt;task&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;Заодно включает режим слежения. В нижней строке видно &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-onhi61y9\"&gt;f follow:&amp;lt;уровень&amp;gt;&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mw21u1cn\"&gt;Ctrl+←&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d2l9qmlv\"&gt;Ctrl+→&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lemj4ik8\"&gt;←&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yiv5dbgf\"&gt;→&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;В приложении Terminal на macOS так же работают Option+← и Option+→. По коду.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7dfxob4c\"&gt;Esc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Закрыть панель деталей&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;Esc никогда не закрывает TUI.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"detail-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#detail-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Панель деталей&lt;/span&gt;&lt;/a&gt;Панель деталей&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;th&gt;Примечание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zev4y9hp\"&gt;Enter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Открыть или закрыть подробности строки под курсором&lt;/td&gt;\n&lt;td&gt;Сначала клавиши остаются у дерева: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-30kmvimn\"&gt;┤ tree · focus ├&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dh6scov3\"&gt;Tab&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Передать клавиши от дерева к подробностям и обратно&lt;/td&gt;\n&lt;td&gt;Работает, только пока панель открыта.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4e4a6za5\"&gt;↑&lt;/code&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0oufrql7\"&gt;↓&lt;/code&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-olav0fnv\"&gt;j&lt;/code&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u9rwgb9d\"&gt;k&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Прокрутить подробности на строку&lt;/td&gt;\n&lt;td&gt;Когда клавиши у панели: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s1kl2he9\"&gt;┤ detail · focus ├&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5viwrqv\"&gt;PgUp&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7bqvnkrf\"&gt;PgDn&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Прокрутить подробности на десять строк&lt;/td&gt;\n&lt;td&gt;То же.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ap14nb7g\"&gt;Esc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Закрыть подробности&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"view-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#view-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Больше или меньше деталей&lt;/span&gt;&lt;/a&gt;Больше или меньше деталей&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tjt0q88u\"&gt;+&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nj1slnu7\"&gt;=&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Больше деталей: уровень подробности выше, максимум 2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zkkorcnm\"&gt;-&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Меньше деталей: уровень подробности ниже, минимум 0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-23iruwo6\"&gt;w&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Показать длинную строку целиком на нескольких строках; повторное нажатие снова её сокращает&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Уровни подробности:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bgvr8z5p\"&gt;0&lt;/code&gt; — только задачи и раунды. Предупреждения и указания остаются.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qfbpk2tf\"&gt;1&lt;/code&gt; — обычное дерево. Этот уровень стоит по умолчанию.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3kjfha48\"&gt;2&lt;/code&gt; — под каждым вызовом модели и инструментом до четырёх тусклых строк: первые непустые поля его записи. У вызова заглушки &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x05asz8l\"&gt;fake&lt;/code&gt; это &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6mo5uf6z\"&gt;blobRef&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-weilcwg8\"&gt;kind&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wfzzqht3\"&gt;latencyMs&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ks7y6xs\"&gt;masked&lt;/code&gt;; набор полей зависит от записи.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример на уровне 0, идущий прогон:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;⣻ running · run run2akec5ebn2222agikedmpm · fast_path · $0.0000/$10.00 · 1 call · 7 events                            9s\ntasks: 1 running · 0 done · anomalies 0 · idx ⚠1                                                    [@ event 7/7 · live]\n────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────\n ⣻ ▼ tsk…hb2ddoq5 [fast_path]                                                                  verify  r1  $0.0000  9.4s\n ✔ ├╴r1 implement  implementer → ready                                                                  1 evidence  0.1s\n ⣻ ╰╴r2 verify  …                                                                                                   9.2s\n\n ↑↓ move • ←→ fold • ⏎ zoom • ⇥ pane • f follow:round • e err • m steer • p prompt • +/- verbosity=0 • ? • q stop\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"482\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-482\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-482\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-482.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Время &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-73e2k0o7\"&gt;1m11s&lt;/code&gt; в этом примере считается до последней записи журнала, а не до этого момента.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Перемотка на экране завершённого прогона&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экран завершённого прогона &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f9aiakcl\"&gt;theia run&lt;/code&gt; тоже показывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9c0te9lu\"&gt;[ ] seek&lt;/code&gt;, но там клавиши меняют только счётчик &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-33k6prt2\"&gt;[@ event k/N]&lt;/code&gt;. Дерево остаётся в конечном состоянии. Чтобы действительно пройти назад по прогону, откройте его командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x3vfjl7x\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В дереве идущего прогона клавиши перемотки ничего не делают.&lt;/p&gt;\n&lt;h2 id=\"open-full-text\"&gt;&lt;a href=\"ru/tui/navigation.html#open-full-text\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Открыть полный текст&lt;/span&gt;&lt;/a&gt;Открыть полный текст&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;th&gt;Где&lt;/th&gt;\n&lt;th&gt;Примечание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9netd74q\"&gt;v&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Открыть полный сохранённый текст строки в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uf45us65\"&gt;$EDITOR&lt;/code&gt; или в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-444ntqvv\"&gt;less&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;Проверено на строках вызовов модели. Чтобы вернуться, закройте программу (в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7qxdm75s\"&gt;less&lt;/code&gt; нажмите &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9zteh22t\"&gt;q&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uaek07ge\"&gt;p&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Открыть запрос вызова модели, который ещё идёт&lt;/td&gt;\n&lt;td&gt;Идущий&lt;/td&gt;\n&lt;td&gt;По коду. Проверено только без идущего вызова (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vzon5192\"&gt;no call in flight&lt;/code&gt;). Если вызовов несколько, сначала поставьте курсор на задачу.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Чтобы открыть текст вызова модели: раскройте раунд клавишей &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ltf206ha\"&gt;→&lt;/code&gt;, спуститесь к его строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rb2zy2jb\"&gt;· gateway …&lt;/code&gt; и нажмите &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aglz482y\"&gt;v&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Ловушки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7sqnik2d\"&gt;v&lt;/code&gt; на строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cexyc6xv\"&gt;test_run&lt;/code&gt; — результате команды из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rjgbyyj7\"&gt;--verify&lt;/code&gt; — пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w1g1pv1x\"&gt;no stored body for this row&lt;/code&gt;. Вывод вашей команды проверки здесь не открыть.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-duwgwst7\"&gt;v&lt;/code&gt; на строке задачи тоже пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qyiagv0x\"&gt;no stored body for this row&lt;/code&gt;. Откройте строку вызова модели внутри раунда.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nd3fck5k\"&gt;p&lt;/code&gt; при идущем вызове без сохранённого запроса пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r2vps3w2\"&gt;no prompt blob for this call (blob store absent or content blocked)&lt;/code&gt;: хранилище текстов выключено или текст заблокирован. По коду.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"temp-files\"&gt;&lt;a href=\"ru/tui/navigation.html#temp-files\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Удаление временных файлов&lt;/span&gt;&lt;/a&gt;Удаление временных файлов&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w66lunr6\"&gt;v&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ct0syv9\"&gt;p&lt;/code&gt; записывают текст (&lt;a href=\"ru/glossary.html#blob\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eb5xjm4s\"&gt;blob&lt;/code&gt;&lt;/a&gt;) в файл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-da423ryk\"&gt;theia-blob-&amp;lt;id&amp;gt;.txt&lt;/code&gt; во временной папке и никогда его не удаляют. В этих файлах полные запросы и ответы.&lt;/p&gt;\n&lt;p&gt;Посмотреть и удалить их на macOS:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;ls&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$TMPDIR&lt;/span&gt;\"&lt;/span&gt;/theia-blob-*.txt\n&lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt; -f &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$TMPDIR&lt;/span&gt;\"&lt;/span&gt;/theia-blob-*.txt\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"582\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-582\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-582\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-582.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;В Linux файлы лежат в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e2a1475b\"&gt;$TMPDIR&lt;/code&gt;, если переменная задана, иначе в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4rl2ms1h\"&gt;/tmp&lt;/code&gt;. В Linux это не проверялось.&lt;/p&gt;\n&lt;h2 id=\"steer-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#steer-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Указания идущему прогону&lt;/span&gt;&lt;/a&gt;Указания идущему прогону&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;th&gt;Примечание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q9x8a5gt\"&gt;m&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Открыть строку ввода указания&lt;/td&gt;\n&lt;td&gt;Только в идущем прогоне. На экране завершённого прогона и в просмотре ничего не делает. Пока вы печатаете, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s3bpjzxo\"&gt;m&lt;/code&gt; — просто буква.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qj1ykxq0\"&gt;Enter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Отправить указание&lt;/td&gt;\n&lt;td&gt;Пустое указание не отправляется.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dwxyv2z5\"&gt;Esc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Отменить указание&lt;/td&gt;\n&lt;td&gt;Работает и когда клавиши у строки ввода, и когда у дерева.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3qppo3is\"&gt;Tab&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Передать клавиши от строки ввода к дереву и обратно; черновик остаётся&lt;/td&gt;\n&lt;td&gt;Когда клавиши у дерева, к строке ввода возвращает и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gay4d83t\"&gt;m&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Клавиши текста&lt;/td&gt;\n&lt;td&gt;Править указание&lt;/td&gt;\n&lt;td&gt;См. &lt;a href=\"ru/tui/navigation.html#input-keys\"&gt;Клавиши ввода текста&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пока вы печатаете, Ctrl+C не работает&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пока клавиши у строки ввода, Ctrl+C ничего не делает, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pw8e8gw1\"&gt;q&lt;/code&gt; печатает букву q. Чтобы остановить прогон, сначала нажмите Esc (или Tab), затем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e2hjomzz\"&gt;q&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"clarify-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#clarify-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ответы на вопросы&lt;/span&gt;&lt;/a&gt;Ответы на вопросы&lt;/h2&gt;\n&lt;p&gt;По коду: вживую форму не видели (см. &lt;a href=\"ru/tui/overview.html#clarify-form\"&gt;Форма уточняющих вопросов&lt;/a&gt;).&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Клавиши текста&lt;/td&gt;\n&lt;td&gt;Напечатать ответ&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hqfwcs2c\"&gt;Enter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Перейти к следующему вопросу. Пустой ответ пропускает вопрос&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-529n9w26\"&gt;Esc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Отказаться от всех оставшихся вопросов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b5imxcpd\"&gt;Tab&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Передать клавиши от формы к дереву и обратно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"quit-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#quit-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Остановка и выход&lt;/span&gt;&lt;/a&gt;Остановка и выход&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Идущий&lt;/th&gt;\n&lt;th&gt;Завершённый&lt;/th&gt;\n&lt;th&gt;Просмотр&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y9kagcxm\"&gt;q&lt;/code&gt; или Ctrl+C, один раз&lt;/td&gt;\n&lt;td&gt;Мягкая остановка: текущий шаг заканчивается, прогон встаёт на паузу, TUI закрывается. Код выхода 0.&lt;/td&gt;\n&lt;td&gt;Выйти и напечатать сводку. Код выхода 0, если все задачи слиты или прогон на паузе, иначе 1.&lt;/td&gt;\n&lt;td&gt;Выйти. Код выхода 0.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9veqb2pv\"&gt;q&lt;/code&gt; или Ctrl+C, второй раз&lt;/td&gt;\n&lt;td&gt;Жёсткая остановка: Theia сразу убивает свои дочерние процессы. Код выхода 130.&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eod1w8zf\"&gt;Esc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Не выходит&lt;/td&gt;\n&lt;td&gt;Не выходит&lt;/td&gt;\n&lt;td&gt;Не выходит&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Клавиши, которая закрывает TUI и оставляет прогон работать, нет. Подробности и способы оставить прогон работать — на странице &lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"input-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#input-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клавиши ввода текста&lt;/span&gt;&lt;/a&gt;Клавиши ввода текста&lt;/h2&gt;\n&lt;p&gt;Эти клавиши работают в строке указания, в форме вопросов и в поле задачи домашнего экрана. Набор текста и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rl3102wt\"&gt;Ctrl+U&lt;/code&gt; проверены вживую, остальные клавиши — по коду.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;th&gt;Примечание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-avgx75ng\"&gt;←&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-er6ith8r\"&gt;→&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сдвинуть курсор на символ&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sbvm648u\"&gt;Home&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zqgvjj6r\"&gt;Ctrl+A&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;В начало&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ovagch0\"&gt;End&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4t7exnjr\"&gt;Ctrl+E&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;В конец&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xg34m53l\"&gt;Ctrl+←&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l3vjlpfo\"&gt;Ctrl+→&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;На слово влево / вправо&lt;/td&gt;\n&lt;td&gt;В приложении Terminal на macOS также Option+← / Option+→.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nk7u1aim\"&gt;Backspace&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5d9fv51\"&gt;Delete&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Удалить символ слева / справа&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pozq0emj\"&gt;Ctrl+W&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Удалить слово слева&lt;/td&gt;\n&lt;td&gt;В приложении Terminal на macOS также Option+Delete.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4qi28v42\"&gt;Ctrl+U&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Удалить всё от начала до курсора&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-stj0uu52\"&gt;Ctrl+K&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Удалить всё от курсора до конца&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Вставка&lt;/td&gt;\n&lt;td&gt;Вставить весь скопированный текст&lt;/td&gt;\n&lt;td&gt;Вставленный перенос строки не отправляет текст, он показан как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t76f5xc4\"&gt;⏎&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"home-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#home-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клавиши домашнего экрана&lt;/span&gt;&lt;/a&gt;Клавиши домашнего экрана&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;th&gt;Примечание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Клавиши текста&lt;/td&gt;\n&lt;td&gt;Напечатать задачу в поле&lt;/td&gt;\n&lt;td&gt;Здесь работают &lt;a href=\"ru/tui/navigation.html#input-keys\"&gt;клавиши ввода текста&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qysszriy\"&gt;Enter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Запустить прогон с этим текстом&lt;/td&gt;\n&lt;td&gt;При пустом поле ничего не делает. В 0.2.201 не работает: см. &lt;a href=\"ru/tui/overview.html#home-screen\"&gt;Домашний экран&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lz8554es\"&gt;?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Показать или скрыть текст &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yzrblhgo\"&gt;theia help&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Только при пустом поле, иначе печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fsw4drc3\"&gt;?&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wijki5c5\"&gt;q&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Выйти, код выхода 0&lt;/td&gt;\n&lt;td&gt;Только при пустом поле, иначе печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7sut9d3y\"&gt;q&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n0yv0maj\"&gt;Esc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Выйти, код выхода 0&lt;/td&gt;\n&lt;td&gt;И при тексте в поле. Текст пропадает.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-flbjozb1\"&gt;Ctrl+C&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Выйти, код выхода 0&lt;/td&gt;\n&lt;td&gt;И при тексте в поле. Текст пропадает.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"terminal-size\"&gt;&lt;a href=\"ru/tui/navigation.html#terminal-size\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Размер терминала&lt;/span&gt;&lt;/a&gt;Размер терминала&lt;/h2&gt;\n&lt;p&gt;Дереву прогона и просмотру нужно не меньше 20 столбцов и 5 строк.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;В окне меньше Theia показывает только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qxxq2nnv\"&gt;terminal too small (19x4 &amp;lt; 20x5)&lt;/code&gt;. В 0.2.201 это сообщение может смешаться с кусками старого экрана, а в окне уже самого сообщения оно переносится. Увеличьте окно — дерево вернётся.&lt;/li&gt;\n&lt;li&gt;Если окно больше, каждая строка обрезается у правого края знаком &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nip0j3aj\"&gt;…&lt;/code&gt;. Пример при 40 столбцах и 12 строках:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;✔ completed · run run2akec5ebn2222agike…\ntasks: 0 runnin…  [@ event 23/23 · head]\n────────────────────────────────────────\n ✖ ▼ tsk…h…  discarded  r6  $0.0000  40s\n · ├╴smoke\n ✔ ├╴workspace @ ac69078 (copy)\n ✔ ├╴▶ r1 implement  …  1 evidence  0.1s\n ✔ ├╴▶ r2 verify  veri…  1 evidence  40s\n ✔ ├╴▶ r3 review  reviewer …  1 evidence\n ✖ ├╴▼ r4 merge  merg…  1 evidence  0.1s\n · │ ╰╴command precheck:2akec5ec5k222ah…\n ↑↓ move • ←→ fold • ⏎ zoom • ⇥ pane • …\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"1017\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-1017\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-1017\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1017.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;На узком экране нижняя строка сначала теряет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vynl548v\"&gt;w wrap • v view&lt;/code&gt;, затем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wy7pnq6q\"&gt;+/- verbosity&lt;/code&gt;. При 40 столбцах подсказка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pcvpxk1i\"&gt;q&lt;/code&gt; обрезана, но сама клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n4awe9i5\"&gt;q&lt;/code&gt; работает.&lt;/li&gt;\n&lt;li&gt;Панель деталей занимает около 40% высоты, но не меньше трёх строк.&lt;/li&gt;\n&lt;li&gt;Справка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-573w22es\"&gt;?&lt;/code&gt;) и домашний экран не прокручиваются. В низком окне их нижние строки обрезаны, а на домашнем экране может пропасть поле задачи.&lt;/li&gt;\n&lt;li&gt;При изменении размера окна экран перерисовывается.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"terminal-settings\"&gt;&lt;a href=\"ru/tui/navigation.html#terminal-settings\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Цвета, анимация и шрифты&lt;/span&gt;&lt;/a&gt;Цвета, анимация и шрифты&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Настройка&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;th&gt;Где работает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b7tilr4i\"&gt;NO_COLOR&lt;/code&gt; с любым значением&lt;/td&gt;\n&lt;td&gt;Цветов нет совсем. Строка под курсором начинается со знака &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o4ijombu\"&gt;❯&lt;/code&gt;. Не показан в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w4cth8a8\"&gt;theia help&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6iqkll8l\"&gt;theia run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ud2pmlt\"&gt;theia show --tui&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gw93zbix\"&gt;--no-spinner&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Неподвижный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xwmws7w9\"&gt;●&lt;/code&gt; вместо вращающегося значка; текстовый курсор не мигает&lt;/td&gt;\n&lt;td&gt;Только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yb63dlra\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2dbpqixf\"&gt;THEIA_NO_SPINNER&lt;/code&gt; с любым значением&lt;/td&gt;\n&lt;td&gt;То же, что &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-soeebiyo\"&gt;--no-spinner&lt;/code&gt;. Не показан в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ndwebrw9\"&gt;theia help&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ze3wbffx\"&gt;theia run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bpyo7g8q\"&gt;theia show --tui&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Синтаксис:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;NO_COLOR=1 theia show &amp;lt;runId&amp;gt; --tui\nTHEIA_NO_SPINNER=1 theia show &amp;lt;runId&amp;gt; --tui\ntheia run --task \"&amp;lt;text&amp;gt;\" --no-spinner\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"1096\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-1096\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-1096\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1096.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пример с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h9borssf\"&gt;NO_COLOR=1&lt;/code&gt;, первые строки дерева:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;❯✖ ▼ tsk…hb2ddoq5 [fast_path]                                            discarded  r6  $0.0000  40s\n · ├╴smoke\n ✔ ├╴workspace @ ac69078 (copy)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"1100\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-1100\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-1100\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1100.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Подробнее об этих переменных — на странице &lt;a href=\"ru/config/environment.html\"&gt;Переменные окружения&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Шрифты и кодировка:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;TUI рисует символами Unicode: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vyojjj3d\"&gt;⣾&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5zi1cdzl\"&gt;✔&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ejx34gd\"&gt;✖&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a67t002e\"&gt;◆&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x331zc7z\"&gt;‼&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qaxudyyt\"&gt;▼&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5fep4k5d\"&gt;├╴&lt;/code&gt; и другими. Нужны терминал с UTF-8 и шрифт с этими символами. Режима только с ASCII нет.&lt;/li&gt;\n&lt;li&gt;Если после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qgohl3la\"&gt;tmux attach&lt;/code&gt; значки видны как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hmm6tg2v\"&gt;_&lt;/code&gt;, а линии как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7u9c6ge6\"&gt;qqqq&lt;/code&gt;, клиент tmux работает не в UTF-8. Подключайтесь с флагом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vli4ure5\"&gt;-u&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rt3sk49b\"&gt;tmux -u attach -t &amp;lt;name&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Программы чтения экрана: отдельного режима для них нет. TUI прячет курсор терминала и рисует свой, поэтому программа чтения экрана может не следить за выделенной строкой. Вид &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ewwi9nel\"&gt;--plain&lt;/code&gt; печатает простые строки. С программой чтения экрана это не проверялось.&lt;/p&gt;\n&lt;h2 id=\"remembered-settings\"&gt;&lt;a href=\"ru/tui/navigation.html#remembered-settings\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что запоминается&lt;/span&gt;&lt;/a&gt;Что запоминается&lt;/h2&gt;\n&lt;p&gt;Theia хранит две настройки TUI в файле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vx249sxu\"&gt;tui-state.json&lt;/code&gt;: уровень подробности и уровень слежения. Остальное не запоминается: раскрытые строки, развёрнутые строки, курсор, панель деталей, место в истории.&lt;/p&gt;\n&lt;p&gt;Посмотреть файл:&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-v8mlptm8\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"macos\" data-diplodoc-key=\"macos\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" aria-controls=\"regular-akaos698\" aria-selected=\"true\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;macOS&lt;/div&gt;\n&lt;div data-diplodoc-id=\"linux\" data-diplodoc-key=\"linux\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" aria-controls=\"regular-qhmqs6rd\" aria-selected=\"false\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;Linux&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"regular-akaos698\" class=\"yfm-tab-panel active\" role=\"tabpanel\" aria-labelledby=\"macos\" data-title=\"macOS\"&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$HOME&lt;/span&gt;/Library/Application Support/theia/tui-state.json\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"1141\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-1141\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-1141\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1141.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Если этой папки нет, а старая папка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wsvbdy29\"&gt;~/.config/theia/&lt;/code&gt; есть, Theia пользуется старой:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; ~/.config/theia/tui-state.json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"1145\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-1145\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-1145\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1145.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"regular-qhmqs6rd\" class=\"yfm-tab-panel\" role=\"tabpanel\" aria-labelledby=\"linux\" data-title=\"Linux\"&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; ~/.config/theia/tui-state.json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"1148\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-1148\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-1148\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1148.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;p&gt;Пример вывода после одного нажатия &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eo78yqmw\"&gt;+&lt;/code&gt; в дереве:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;{\"verbosity\":2,\"followDepth\":\"round\"}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"1154\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-1154\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-1154\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1154.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Файл лежит в папке пользовательских настроек:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Система&lt;/th&gt;\n&lt;th&gt;Папка&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Любая, если задана &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5nxrmu09\"&gt;XDG_CONFIG_HOME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n7mdmpjl\"&gt;$XDG_CONFIG_HOME/theia/&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;macOS&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3hczrdiw\"&gt;~/Library/Application Support/theia/&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xwoajzcc\"&gt;~/.config/theia/&lt;/code&gt;, если есть только эта, старая папка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Linux&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wcvqr3yh\"&gt;~/.config/theia/&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Windows&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zeyqmybo\"&gt;%APPDATA%\\dokimelabs\\theia\\&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Theia читает файл, когда открывается дерево, и записывает, когда дерево закрывается. Если файла нет или он испорчен, Theia берёт значения по умолчанию: уровень подробности 1 и уровень слежения &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j1ott9j6\"&gt;round&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"ru/tui/navigation.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;См. также&lt;/span&gt;&lt;/a&gt;См. также&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы TUI&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/config/environment.html\"&gt;Переменные окружения&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html\"&gt;Словарь терминов&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform
