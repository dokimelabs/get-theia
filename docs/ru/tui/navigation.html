            {"data":{"leading":false,"html":"&lt;p&gt;На этой странице — клавиши всех экранов TUI и настройки терминала, которые меняют вид экранов. Что показывают экраны, описано на странице &lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы TUI&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;a href=\"ru/glossary.html#tui\"&gt;Экранный интерфейс (TUI)&lt;/a&gt; работает только с клавиатуры, мышь не поддерживается.&lt;/p&gt;\n&lt;h2 id=\"contexts\"&gt;&lt;a href=\"ru/tui/navigation.html#contexts\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Где работают клавиши&lt;/span&gt;&lt;/a&gt;Где работают клавиши&lt;/h2&gt;\n&lt;p&gt;В таблицах экраны названы так:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Название&lt;/th&gt;\n&lt;th&gt;Экран&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Идущий&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hbe3ag0n\"&gt;theia run&lt;/code&gt; в терминале, пока прогон работает&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Завершённый&lt;/td&gt;\n&lt;td&gt;экран завершённого прогона&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Просмотр&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-000ikn1t\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Клавиши проверены на macOS внутри tmux. Клавиши с пометкой «по коду» вживую не проверялись.&lt;/p&gt;\n&lt;h2 id=\"tree-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#tree-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Движение по дереву&lt;/span&gt;&lt;/a&gt;Движение по дереву&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;th&gt;Где&lt;/th&gt;\n&lt;th&gt;Примечание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-69lcmh3a\"&gt;↑&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tygg7f3f\"&gt;k&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;На строку вверх&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;Если клавиши у панели подробностей, прокручивает её.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0zmwaekv\"&gt;↓&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iafoildo\"&gt;j&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;На строку вниз&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;То же.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-50uia30c\"&gt;→&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cqja913c\"&gt;l&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Раскрыть строку&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;На строке без вложенных строк ничего не делает.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pivpii7o\"&gt;←&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4js9yzh1\"&gt;h&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Свернуть строку. На свёрнутой строке или строке без вложенных — перейти к родительской строке&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;Переход к родительской строке — по коду.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r3ua2x60\"&gt;L&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Раскрыть все строки&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kmjavijv\"&gt;H&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Свернуть все строки&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;По коду.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cdi40gfc\"&gt;g&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Первая строка&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yg2g3abg\"&gt;G&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Последняя строка&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-adn1jf2h\"&gt;PgDn&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e1ovcuf8\"&gt;PgUp&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;На десять строк вниз / вверх&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;Всегда десять строк, при любой высоте окна.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iiovuqts\"&gt;e&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Следующая строка с проблемой: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y6cm1wwd\"&gt;✖&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ypb01thz\"&gt;◆&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ozay2upu\"&gt;‼&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;После последней начинает сверху.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2z8bluv8\"&gt;f&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Режим слежения: курсор прыгает к новым событиям&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;Любое движение курсора выключает режим. Дерево идущего прогона открывается с включённым режимом.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7lhma53z\"&gt;F&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сменить уровень слежения: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-93ngnfzs\"&gt;round&lt;/code&gt; → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vbb7q8ol\"&gt;tool&lt;/code&gt; → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-evl49xhe\"&gt;task&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;Заодно включает режим слежения. В нижней строке видно &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ft8rs0e\"&gt;f follow:&amp;lt;уровень&amp;gt;&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0cvwwt1h\"&gt;Ctrl+←&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pn8mmj1x\"&gt;Ctrl+→&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-byrg8fik\"&gt;←&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s3zvhqju\"&gt;→&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;В приложении Terminal на macOS так же работают Option+← и Option+→. По коду.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p9c1tr6s\"&gt;Esc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Закрыть панель подробностей&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;Esc никогда не закрывает TUI.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"detail-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#detail-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Панель подробностей&lt;/span&gt;&lt;/a&gt;Панель подробностей&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;th&gt;Примечание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pikuv47s\"&gt;Enter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Открыть или закрыть подробности строки под курсором&lt;/td&gt;\n&lt;td&gt;Сначала клавиши остаются у дерева: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pjfhap3j\"&gt;┤ tree · focus ├&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z58n8cnv\"&gt;Tab&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Передать клавиши от дерева к подробностям и обратно&lt;/td&gt;\n&lt;td&gt;Работает, только пока панель открыта.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i8fv3k0u\"&gt;↑&lt;/code&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1lxvdtgr\"&gt;↓&lt;/code&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8412ep1f\"&gt;j&lt;/code&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qqcsetxm\"&gt;k&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Прокрутить подробности на строку&lt;/td&gt;\n&lt;td&gt;Когда клавиши у панели: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zhdvor1y\"&gt;┤ detail · focus ├&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p5qhxety\"&gt;PgUp&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1jayajxz\"&gt;PgDn&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Прокрутить подробности на десять строк&lt;/td&gt;\n&lt;td&gt;То же.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6egfdq7i\"&gt;Esc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Закрыть подробности&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"view-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#view-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Больше или меньше деталей&lt;/span&gt;&lt;/a&gt;Больше или меньше деталей&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wigdmy8w\"&gt;+&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uzvh4fgx\"&gt;=&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Больше деталей: уровень подробности выше, максимум 2&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3yl08yyw\"&gt;-&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Меньше деталей: уровень подробности ниже, минимум 0&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tds5ei7w\"&gt;w&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Показать длинную строку целиком на нескольких строках; повторное нажатие снова её сокращает&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Уровни подробности:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-30d3d9gw\"&gt;0&lt;/code&gt; — только задачи и раунды. Предупреждения и указания остаются.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j6morw2h\"&gt;1&lt;/code&gt; — обычное дерево. Этот уровень стоит по умолчанию.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e4k4dbf6\"&gt;2&lt;/code&gt; — под каждым вызовом модели и инструментом до четырёх тусклых строк с его полями.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Пример на уровне 0:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt; ✖ ▼ tsk…evcxi653 [fast_path]                          discarded  r6  $0.0000  1m00s\n ✔ ├╴r1 implement  implementer → ready                            1 evidence  0.1s\n ✔ ├╴r2 verify  verifier → verify_pass                           1 evidence  1m00s\n ✔ ├╴r3 review  reviewer → approve                                      1 evidence\n ✖ ├╴r4 merge  merger → merge_fail                                1 evidence  0.1s\n ✔ ├╴r5 arbitrate  arbiter → arb_escalate                               1 evidence\n ✔ ╰╴r6 escalated  lead → lead_discard                                  1 evidence\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"411\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0, ode\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pofmln16\"&gt;{&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h1fjgqow\"&gt;}&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;На десять записей назад / вперёд&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-20axn1e4\"&gt;0&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wqvhpwj5\"&gt;Home&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Первая запись&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2oi41wzx\"&gt;$&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fqe5ffi2\"&gt;End&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Последняя запись (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ys0o00e\"&gt;head&lt;/code&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Место в журнале видно справа во второй строке заголовка. Пример: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ak1bq0l\"&gt;0&lt;/code&gt; в просмотре:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;⣷ running · run run2akdqb2b32223mekgj63py · fast_path · $0.0000/$10.00 · 0 calls · 1 event\ntasks: 0 running · 0 done · anomalies 0 · idx ⚠1                                      [@ event 1/22]\n────────────────────────────────────────────────────────────────────────────────────────────────────\n (no tasks yet)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button y =\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-478.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;После трёх нажатий &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p5dbq7r2\"&gt;]&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;⣷ running · run run2akdqb2b32223mekgj63py · fast_path · $0.0000/$10.00 · 0 calls · 4 events\ntasks: 1 running · 0 done · anomalies 0 · idx ⚠1                                      [@ event 4/22]\n────────────────────────────────────────────────────────────────────────────────────────────────────\n ⣷ ▼ tsk…evcxi653 [fast_path]                                          implement  r0  $0.0000  5m33s\n · ├╴demo task for the TUI guide\n ✔ ├╴workspace @ 6035395 (copy)\n ⣷ ╰╴r1 implement  …                                                                           5m33s\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"482\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-482\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-482\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-482.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Время &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rnmpf6bn\"&gt;5m33s&lt;/code&gt; в этом примере считается до последней записи журнала, а не до этого момента.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Перемотка на экране завершённого прогона&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Экран завершённого прогона &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1k8q3xaa\"&gt;theia run&lt;/code&gt; тоже показывает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7zl5ro27\"&gt;[ ] seek&lt;/code&gt;, но там клавиши меняют только счётчик &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hyhx9i5n\"&gt;[@ event k/N]&lt;/code&gt;. Дерево остаётся в конечном состоянии. Чтобы действительно пройти назад по прогону, откройте его командой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ttnrg11\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;В дереве идущего прогона клавиши перемотки ничего не делают.&lt;/p&gt;\n&lt;h2 id=\"open-full-text\"&gt;&lt;a href=\"ru/tui/navigation.html#open-full-text\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Открыть полный текст&lt;/span&gt;&lt;/a&gt;Открыть полный текст&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;th&gt;Где&lt;/th&gt;\n&lt;th&gt;Примечание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vuu8bftq\"&gt;v&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Открыть полный сохранённый текст строки в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wxepkuf4\"&gt;$EDITOR&lt;/code&gt; или в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9nl1xmgv\"&gt;less&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Идущий, Завершённый, Просмотр&lt;/td&gt;\n&lt;td&gt;Проверено на строках вызовов модели. Чтобы вернуться, закройте программу (в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2fonirkt\"&gt;less&lt;/code&gt; нажмите &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0kvbkj4f\"&gt;q&lt;/code&gt;).&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tyekoo1f\"&gt;p&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Открыть запрос вызова модели, который ещё идёт&lt;/td&gt;\n&lt;td&gt;Идущий&lt;/td&gt;\n&lt;td&gt;По коду. Проверено только без идущего вызова (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hmopo9aa\"&gt;no call in flight&lt;/code&gt;). Если вызовов несколько, сначала поставьте курсор на задачу.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Чтобы открыть текст вызова модели: раскройте раунд клавишей &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qud96oit\"&gt;→&lt;/code&gt;, спуститесь к его строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fso5zen0\"&gt;· gateway …&lt;/code&gt; и нажмите &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s3r0wu2v\"&gt;v&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Ловушки:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q91h7bv9\"&gt;v&lt;/code&gt; на строке &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8pwtb0no\"&gt;test_run&lt;/code&gt; — результате команды из &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lej8qfy2\"&gt;--verify&lt;/code&gt; — пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-frnhx62b\"&gt;no stored body for this row&lt;/code&gt;. Вывод вашей команды проверки здесь не открыть.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6144wy9t\"&gt;v&lt;/code&gt; на строке задачи тоже пишет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3rjwsi67\"&gt;no stored body for this row&lt;/code&gt;. Откройте строку вызова модели внутри раунда.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"temp-files\"&gt;&lt;a href=\"ru/tui/navigation.html#temp-files\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Удаление временных файлов&lt;/span&gt;&lt;/a&gt;Удаление временных файлов&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9h9cpw4w\"&gt;v&lt;/code&gt; и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kcnwwvmi\"&gt;p&lt;/code&gt; записывают текст в файл &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cjj7j08o\"&gt;theia-blob-&amp;lt;id&amp;gt;.txt&lt;/code&gt; во временной папке и никогда его не удаляют. В этих файлах полные запросы и ответы.&lt;/p&gt;\n&lt;p&gt;Посмотреть и удалить их на macOS:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;ls&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$TMPDIR&lt;/span&gt;\"&lt;/span&gt;/theia-blob-*.txt\n&lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt; -f &lt;span class=\"hljs-string\"&gt;\"&lt;span class=\"hljs-variable\"&gt;$TMPDIR&lt;/span&gt;\"&lt;/span&gt;/theia-blob-*.txt\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"577\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-577\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-577\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-577.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;В Linux файлы лежат в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-njepbel3\"&gt;$TMPDIR&lt;/code&gt;, если переменная задана, иначе в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7esfouto\"&gt;/tmp&lt;/code&gt;. В Linux это не проверялось.&lt;/p&gt;\n&lt;h2 id=\"steer-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#steer-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Указания идущему прогону&lt;/span&gt;&lt;/a&gt;Указания идущему прогону&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;th&gt;Примечание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jplbutz4\"&gt;m&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Открыть строку ввода указания&lt;/td&gt;\n&lt;td&gt;Только в идущем прогоне. На экране завершённого прогона и в просмотре ничего не делает. Пока вы печатаете, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pyyugwb5\"&gt;m&lt;/code&gt; — просто буква.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hpy6600w\"&gt;Enter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Отправить указание&lt;/td&gt;\n&lt;td&gt;Пустое указание не отправляется.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fg4y97rm\"&gt;Esc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Отменить указание&lt;/td&gt;\n&lt;td&gt;Работает и когда клавиши у строки ввода, и когда у дерева.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zyg94d1w\"&gt;Tab&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Передать клавиши от строки ввода к дереву и обратно; черновик остаётся&lt;/td&gt;\n&lt;td&gt;Когда клавиши у дерева, к строке ввода возвращает и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ft4z3o93\"&gt;m&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Клавиши текста&lt;/td&gt;\n&lt;td&gt;Править указание&lt;/td&gt;\n&lt;td&gt;См. &lt;a href=\"ru/tui/navigation.html#input-keys\"&gt;Клавиши ввода текста&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Пока вы печатаете, Ctrl+C не работает&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Пока клавиши у строки ввода, Ctrl+C ничего не делает, а &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kxm704v9\"&gt;q&lt;/code&gt; печатает букву q. Чтобы остановить прогон, сначала нажмите Esc (или Tab), затем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vn4v3zc1\"&gt;q&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"clarify-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#clarify-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ответы на вопросы&lt;/span&gt;&lt;/a&gt;Ответы на вопросы&lt;/h2&gt;\n&lt;p&gt;По коду: вживую форму не видели (см. &lt;a href=\"ru/tui/overview.html#clarify-form\"&gt;Форма уточняющих вопросов&lt;/a&gt;).&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Клавиши текста&lt;/td&gt;\n&lt;td&gt;Напечатать ответ&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qvt2mozc\"&gt;Enter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Перейти к следующему вопросу. Пустой ответ пропускает вопрос&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5hhcyk79\"&gt;Esc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Отказаться от всех оставшихся вопросов&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t2w0ja9m\"&gt;Tab&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Передать клавиши от формы к дереву и обратно&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"quit-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#quit-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Остановка и выход&lt;/span&gt;&lt;/a&gt;Остановка и выход&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Идущий&lt;/th&gt;\n&lt;th&gt;Завершённый&lt;/th&gt;\n&lt;th&gt;Просмотр&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k6urqsgg\"&gt;q&lt;/code&gt; или Ctrl+C, один раз&lt;/td&gt;\n&lt;td&gt;Мягкая остановка: текущий шаг заканчивается, прогон встаёт на паузу, TUI закрывается. Код выхода 0.&lt;/td&gt;\n&lt;td&gt;Выйти и напечатать сводку. Код выхода 0, если все задачи слиты или прогон на паузе, иначе 1.&lt;/td&gt;\n&lt;td&gt;Выйти. Код выхода 0.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gdjmsol4\"&gt;q&lt;/code&gt; или Ctrl+C, второй раз&lt;/td&gt;\n&lt;td&gt;Жёсткая остановка: Theia сразу убивает свои дочерние процессы. Код выхода 130.&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3loqcdy6\"&gt;Esc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Не выходит&lt;/td&gt;\n&lt;td&gt;Не выходит&lt;/td&gt;\n&lt;td&gt;Не выходит&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Клавиши, которая закрывает TUI и оставляет прогон работать, нет. Подробности и способы оставить прогон работать — на странице &lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"input-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#input-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клавиши ввода текста&lt;/span&gt;&lt;/a&gt;Клавиши ввода текста&lt;/h2&gt;\n&lt;p&gt;Эти клавиши работают в строке указания, в форме вопросов и в поле задачи домашнего экрана. Набор текста и &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qx5m7gt0\"&gt;Ctrl+U&lt;/code&gt; проверены вживую, остальные клавиши — по коду.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;th&gt;Примечание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vp6cy2a3\"&gt;←&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m00zvq3b\"&gt;→&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Сдвинуть курсор на символ&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e67mm0ck\"&gt;Home&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zslmsf1y\"&gt;Ctrl+A&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;В начало&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o9rlnhl1\"&gt;End&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-58wi7uhh\"&gt;Ctrl+E&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;В конец&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rusd9kve\"&gt;Ctrl+←&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sw2mc8ov\"&gt;Ctrl+→&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;На слово влево / вправо&lt;/td&gt;\n&lt;td&gt;В приложении Terminal на macOS также Option+← / Option+→.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p7jjbowk\"&gt;Backspace&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p1za7jda\"&gt;Delete&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Удалить символ слева / справа&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-czy4hh2r\"&gt;Ctrl+W&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Удалить слово слева&lt;/td&gt;\n&lt;td&gt;В приложении Terminal на macOS также Option+Delete.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ww79dxuu\"&gt;Ctrl+U&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Удалить всё от начала до курсора&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r7mnucen\"&gt;Ctrl+K&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Удалить всё от курсора до конца&lt;/td&gt;\n&lt;td&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Вставка&lt;/td&gt;\n&lt;td&gt;Вставить весь скопированный текст&lt;/td&gt;\n&lt;td&gt;Вставленный перенос строки не отправляет текст, он показан как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qfoy15b6\"&gt;⏎&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"home-keys\"&gt;&lt;a href=\"ru/tui/navigation.html#home-keys\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Клавиши домашнего экрана&lt;/span&gt;&lt;/a&gt;Клавиши домашнего экрана&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Клавиша&lt;/th&gt;\n&lt;th&gt;Действие&lt;/th&gt;\n&lt;th&gt;Примечание&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Клавиши текста&lt;/td&gt;\n&lt;td&gt;Напечатать задачу в поле&lt;/td&gt;\n&lt;td&gt;Здесь работают &lt;a href=\"ru/tui/navigation.html#input-keys\"&gt;клавиши ввода текста&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-icdp39iu\"&gt;Enter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Запустить прогон с этим текстом&lt;/td&gt;\n&lt;td&gt;При пустом поле ничего не делает. В 0.2.201 не работает: см. &lt;a href=\"ru/tui/overview.html#home-screen\"&gt;Домашний экран&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k3dt4t6x\"&gt;?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Показать или скрыть текст &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5r4ozvyt\"&gt;theia help&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Только при пустом поле, иначе печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8luk1aqi\"&gt;?&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n5sipsfb\"&gt;q&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Выйти, код выхода 0&lt;/td&gt;\n&lt;td&gt;Только при пустом поле, иначе печатает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0fmf5njk\"&gt;q&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dclv41ck\"&gt;Esc&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Выйти, код выхода 0&lt;/td&gt;\n&lt;td&gt;И при тексте в поле. Текст пропадает.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zlkt8t9z\"&gt;Ctrl+C&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Выйти, код выхода 0&lt;/td&gt;\n&lt;td&gt;И при тексте в поле. Текст пропадает.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"terminal-size\"&gt;&lt;a href=\"ru/tui/navigation.html#terminal-size\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Размер терминала&lt;/span&gt;&lt;/a&gt;Размер терминала&lt;/h2&gt;\n&lt;p&gt;Дереву прогона и просмотру нужно не меньше 20 столбцов и 5 строк.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;В окне меньше Theia показывает только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yxwmzmck\"&gt;terminal too small (19x4 &amp;lt; 20x5)&lt;/code&gt;. В 0.2.201 это сообщение может смешаться с кусками старого экрана, а в окне уже самого сообщения оно переносится. Увеличьте окно — дерево вернётся.&lt;/li&gt;\n&lt;li&gt;Если окно больше, каждая строка обрезается у правого края знаком &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6a4hkd1r\"&gt;…&lt;/code&gt;. Пример при 40 столбцах и 12 строках:&lt;/li&gt;\n&lt;/ul&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;✔ completed · run run2akdqb2b322…  5m31s\ntasks: 0 runnin…  [@ event 21/21 · head]\n────────────────────────────────────────\n ✔ ├╴▼ r3 review  reviewer …  1 evidence\n ✔ │ ├╴· gateway fake ok $0.0000\n · │ ╰╴command fake-green:reviewer — sy…\n ✖ ├╴▼ r4 merge  merg…  1 evidence  0.1s\n · │ ╰╴command precheck:2akdqb2bjw223me…\n ✔ ├╴▼ r5 arbitrate  arbite…  1 evidence\n ✔ │ ├╴· gateway fake ok $0.0000\n ■ run ended — 1 discarded · browse the…\n ↑↓ move • ←→ fold • ⏎ zoom • ⇥ pane • …\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"1012\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-1012\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-1012\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1012.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;На узком экране нижняя строка сначала теряет &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9n2l8k24\"&gt;w wrap • v view&lt;/code&gt;, затем &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-njdczkxs\"&gt;+/- verbosity&lt;/code&gt;. При 40 столбцах подсказка &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-igkzbcc3\"&gt;q&lt;/code&gt; обрезана, но сама клавиша &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-au5is3hn\"&gt;q&lt;/code&gt; работает.&lt;/li&gt;\n&lt;li&gt;Панель подробностей занимает около 40% высоты, но не меньше трёх строк.&lt;/li&gt;\n&lt;li&gt;Справка (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x3lv19pl\"&gt;?&lt;/code&gt;) и домашний экран не прокручиваются. В низком окне их нижние строки обрезаны, а на домашнем экране может пропасть поле задачи.&lt;/li&gt;\n&lt;li&gt;При изменении размера окна экран перерисовывается.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"terminal-settings\"&gt;&lt;a href=\"ru/tui/navigation.html#terminal-settings\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Цвета, анимация и шрифты&lt;/span&gt;&lt;/a&gt;Цвета, анимация и шрифты&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Настройка&lt;/th&gt;\n&lt;th&gt;Что делает&lt;/th&gt;\n&lt;th&gt;Где работает&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4118y3o9\"&gt;NO_COLOR&lt;/code&gt; с любым значением&lt;/td&gt;\n&lt;td&gt;Цветов нет совсем. Строка под курсором начинается со знака &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mijo2f5v\"&gt;❯&lt;/code&gt;. Не показан в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p0rd2rsn\"&gt;theia help&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-azwtznwl\"&gt;theia run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mravo5cr\"&gt;theia show --tui&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k658wiop\"&gt;--no-spinner&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Неподвижный &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8az98roc\"&gt;●&lt;/code&gt; вместо вращающегося значка; текстовый курсор не мигает&lt;/td&gt;\n&lt;td&gt;Только &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-djyp1at7\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1e4g4qfy\"&gt;THEIA_NO_SPINNER&lt;/code&gt; с любым значением&lt;/td&gt;\n&lt;td&gt;То же, что &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k8njvhgm\"&gt;--no-spinner&lt;/code&gt;. Не показан в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3dwlbdjz\"&gt;theia help&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ii1x7l7\"&gt;theia run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1yk66py2\"&gt;theia show --tui&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Синтаксис:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;NO_COLOR=1 theia show &amp;lt;runId&amp;gt; --tui\nTHEIA_NO_SPINNER=1 theia show &amp;lt;runId&amp;gt; --tui\ntheia run --task \"&amp;lt;text&amp;gt;\" --no-spinner\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"1091\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-1091\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-1091\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1091.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пример с &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bb28wl3l\"&gt;NO_COLOR=1&lt;/code&gt;, первые строки дерева:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;❯✖ ▼ tsk…ut5huerr [fast_path]                                    discarded  r6  $0.0000  25s\n · ├╴background demo\n ✔ ├╴workspace @ b744486 (copy)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"1095\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-1095\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-1095\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1095.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Подробнее об этих переменных — на странице &lt;a href=\"ru/config/environment.html\"&gt;Переменные окружения&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Шрифты и кодировка:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;TUI рисует символами Unicode: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-czmvcuxa\"&gt;⣾&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7gbi96nq\"&gt;✔&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s8jon3fr\"&gt;✖&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3k93g63m\"&gt;◆&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ytrlelab\"&gt;‼&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bbtt6pgt\"&gt;▼&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-47ya9a0a\"&gt;├╴&lt;/code&gt; и другими. Нужны терминал с UTF-8 и шрифт с этими символами. Режима только с ASCII нет.&lt;/li&gt;\n&lt;li&gt;Если после &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r77ine39\"&gt;tmux attach&lt;/code&gt; значки видны как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oqe5efd9\"&gt;_&lt;/code&gt;, а линии как &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vum6jurj\"&gt;qqqq&lt;/code&gt;, клиент tmux работает не в UTF-8. Подключайтесь с флагом &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vbona7rp\"&gt;-u&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d5k7akql\"&gt;tmux -u attach -t &amp;lt;name&amp;gt;&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Программы чтения экрана: отдельного режима для них нет. TUI прячет курсор терминала и рисует свой, поэтому программа чтения экрана может не следить за выделенной строкой. Вид &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sw8j06bo\"&gt;--plain&lt;/code&gt; печатает простые строки. С программой чтения экрана это не проверялось.&lt;/p&gt;\n&lt;h2 id=\"remembered-settings\"&gt;&lt;a href=\"ru/tui/navigation.html#remembered-settings\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Что запоминается&lt;/span&gt;&lt;/a&gt;Что запоминается&lt;/h2&gt;\n&lt;p&gt;Theia хранит две настройки TUI в файле &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ktkeo0f4\"&gt;tui-state.json&lt;/code&gt;: уровень подробности и уровень слежения. Остальное не запоминается: раскрытые строки, развёрнутые строки, курсор, панель подробностей, место в истории.&lt;/p&gt;\n&lt;p&gt;На Mac, где проверялось это руководство:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;cat&lt;/span&gt; ~/.config/theia/tui-state.json\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"1126\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-1126\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-1126\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1126.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Пример вывода:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;{\"verbosity\":1,\"followDepth\":\"round\"}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"1130\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-1130\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-1130\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-1130.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Файл лежит в папке пользовательских настроек:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Система&lt;/th&gt;\n&lt;th&gt;Папка&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Любая, если задана &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xpd5r4rj\"&gt;XDG_CONFIG_HOME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7h3b7881\"&gt;$XDG_CONFIG_HOME/theia/&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;macOS&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k2hljqkd\"&gt;~/Library/Application Support/theia/&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hjygpeja\"&gt;~/.config/theia/&lt;/code&gt;, если есть только эта, старая папка&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Linux&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u4ogc1sv\"&gt;~/.config/theia/&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Windows&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j18qoach\"&gt;%APPDATA%\\dokimelabs\\theia\\&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Theia читает файл, когда открывается дерево, и записывает, когда дерево закрывается. Если файла нет или он испорчен, Theia берёт значения по умолчанию: уровень подробности 1 и уровень слежения &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2mvscget\"&gt;round&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"ru/tui/navigation.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;См. также&lt;/span&gt;&lt;/a&gt;См. также&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"ru/tui/overview.html\"&gt;Экраны и элементы TUI&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/tui/leave-running.html\"&gt;Выход без остановки задачи&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/config/environment.html\"&gt;Переменные окружения&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"ru/glossary.html\"&gt;Словарь терминов&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/tui/navigation.html","hreflang":"en"},{"href":"ru/tui/navigation.html","hreflang":"ru"}],"style":["_assets/theia.css"],"canonical":"ru/tui/navigation.html","vcsPath":"ru/tui/navigation.md"},"headings":[{"title":"Где работают клавиши","href":"ru/tui/navigation.html#contexts","level":2},{"title":"Движение по дереву","href":"ru/tui/navigation.html#tree-keys","level":2},{"title":"Панель подробностей","href":"ru/tui/navigation.html#detail-keys","level":2},{"title":"Больше или меньше деталей","href":"ru/tui/navigation.html#view-keys","level":2},{"title":"Перемотка по истории","href":"ru/tui/navigation.html#seek","level":2},{"title":"Открыть полный текст","href":"ru/tui/navigation.html#open-full-text","level":2,"items":[{"title":"Удаление временных файлов","href":"ru/tui/navigation.html#temp-files","level":3}]},{"title":"Указания идущему прогону","href":"ru/tui/navigation.html#steer-keys","level":2},{"title":"Ответы на вопросы","href":"ru/tui/navigation.html#clarify-keys","level":2},{"title":"Остановка и выход","href":"ru/tui/navigation.html#quit-keys","level":2},{"title":"Клавиши ввода текста","href":"ru/tui/navigation.html#input-keys","level":2},{"title":"Клавиши домашнего экрана","href":"ru/tui/navigation.html#home-keys","level":2},{"title":"Размер терминала","href":"ru/tui/navigation.html#terminal-size","level":2},{"title":"Цвета, анимация и шрифты","href":"ru/tui/navigation.html#terminal-settings","level":2},{"title":"Что запоминается","href":"ru/tui/navigation.html#
