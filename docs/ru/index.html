        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Это руководство по CLI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-el3pijp7\"&gt;theia&lt;/code&gt; версии 0.2.201. Здесь описано, как установить Theia, выполнить задачу, работать с экраном TUI, настроить модели и подключить Theia к Claude Code и Codex.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Примечание&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Команды и аргументы проверены на выпуске 0.2.201 на macOS (Apple silicon). Команды, которые меняют данные или обращаются к моделям, запускались в изолированной песочнице. Поведение на Linux описано по исходному коду выпуска. Если команда работает не так, как обещает &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-18awsn3e\"&gt;theia help&lt;/code&gt;, рядом стоит предупреждение.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"quick-start\"&gt;&lt;a href=\"ru/index.html#quick-start\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Быстрый старт&lt;/span&gt;&lt;/a&gt;Быстрый старт&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Установите Theia — раздел &lt;a href=\"ru/install/install.html\"&gt;Установка&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Войдите в Claude Code или Codex и проверьте окружение командой &lt;a href=\"ru/reference/doctor.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-muibufa7\"&gt;theia doctor&lt;/code&gt;&lt;/a&gt; — раздел &lt;a href=\"ru/install/first-setup.html\"&gt;Первая настройка&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Перейдите в корень git-репозитория и выполните &lt;a href=\"ru/reference/init.html#init\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pfa1igv4\"&gt;theia init&lt;/code&gt;&lt;/a&gt; — там же.&lt;/li&gt;\n&lt;li&gt;Запустите задачу командой &lt;a href=\"ru/reference/run.html#run\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a16r0skp\"&gt;theia run&lt;/code&gt;&lt;/a&gt; — раздел &lt;a href=\"ru/guides/first-task.html\"&gt;Первая задача&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Заберите результат из &lt;a href=\"ru/glossary.html#run-branch\"&gt;ветки прогона&lt;/a&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4t7cxwc6\"&gt;theia/run-…&lt;/code&gt; — раздел &lt;a href=\"ru/guides/results.html\"&gt;Результат прогона&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"sections\"&gt;&lt;a href=\"ru/index.html#sections\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Разделы&lt;/span&gt;&lt;/a&gt;Разделы&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Раздел&lt;/th&gt;\n&lt;th&gt;Что внутри&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;О платформе&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/about/overview.html\"&gt;Что такое Theia&lt;/a&gt;, &lt;a href=\"ru/about/platforms.html\"&gt;системы и режимы работы&lt;/a&gt;, &lt;a href=\"ru/about/limitations.html\"&gt;ограничения версии&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Установка&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/install/install.html\"&gt;Установка&lt;/a&gt;, &lt;a href=\"ru/install/first-setup.html\"&gt;первая настройка&lt;/a&gt;, &lt;a href=\"ru/install/update.html\"&gt;обновление&lt;/a&gt;, &lt;a href=\"ru/install/uninstall.html\"&gt;удаление&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Работа с задачами&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/guides/first-task.html\"&gt;Первая задача&lt;/a&gt;, &lt;a href=\"ru/guides/plan-and-run.html\"&gt;план&lt;/a&gt;, &lt;a href=\"ru/guides/control-run.html\"&gt;управление прогоном&lt;/a&gt;, &lt;a href=\"ru/guides/results.html\"&gt;результат&lt;/a&gt;, &lt;a href=\"ru/guides/knowledge.html\"&gt;индекс кода и память&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Экран TUI&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/tui/overview.html\"&gt;Экраны&lt;/a&gt;, &lt;a href=\"ru/tui/navigation.html\"&gt;горячие клавиши&lt;/a&gt;, &lt;a href=\"ru/tui/leave-running.html\"&gt;выход без остановки задачи&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Настройка&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/config/overview.html\"&gt;Файлы настроек&lt;/a&gt;, &lt;a href=\"ru/config/models.html\"&gt;модели&lt;/a&gt;, &lt;a href=\"ru/config/keys.html\"&gt;ключи&lt;/a&gt;, &lt;a href=\"ru/config/policy.html\"&gt;policy.yaml&lt;/a&gt;, &lt;a href=\"ru/config/environment.html\"&gt;переменные окружения&lt;/a&gt;, &lt;a href=\"ru/config/rules-prompts.html\"&gt;правила&lt;/a&gt;, &lt;a href=\"ru/config/sandbox.html\"&gt;песочница&lt;/a&gt;, &lt;a href=\"ru/config/workspaces.html\"&gt;хранилище&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Интеграции&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;, &lt;a href=\"ru/integrations/codex.html\"&gt;Codex&lt;/a&gt;, &lt;a href=\"ru/integrations/mcp-server.html\"&gt;MCP-сервер&lt;/a&gt;, &lt;a href=\"ru/integrations/git.html\"&gt;Git&lt;/a&gt;, &lt;a href=\"ru/integrations/observability.html\"&gt;метрики&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Справочник&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"ru/reference/commands.html\"&gt;Все команды&lt;/a&gt;, &lt;a href=\"ru/troubleshooting.html\"&gt;решение проблем&lt;/a&gt;, &lt;a href=\"ru/glossary.html\"&gt;словарь терминов&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"conventions\"&gt;&lt;a href=\"ru/index.html#conventions\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Как читать команды&lt;/span&gt;&lt;/a&gt;Как читать команды&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Блоки с меткой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9smph4x8\"&gt;bash&lt;/code&gt; готовы к вставке в терминал целиком.&lt;/li&gt;\n&lt;li&gt;Блоки с меткой &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bsfdu6hp\"&gt;text&lt;/code&gt; показывают синтаксис или вывод. Их не нужно вставлять.&lt;/li&gt;\n&lt;li&gt;В синтаксисе &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ijzcxb96\"&gt;&amp;lt;runId&amp;gt;&lt;/code&gt; — значение, которое вы подставляете сами. Часть в &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6gqh6zy2\"&gt;[ ]&lt;/code&gt; необязательна. Запись &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-um1akjm5\"&gt;a|b&lt;/code&gt; значит «одно из значений».&lt;/li&gt;\n&lt;li&gt;Примеры вывода сокращены. Пути вида &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rc0l7g3v\"&gt;~/projects/app&lt;/code&gt; заменяют ваши реальные пути.&lt;/li&gt;\n&lt;li&gt;Слова, которые печатает сама Theia (&lt;a href=\"ru/glossary.html#fast-path\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o6oe8cdv\"&gt;fast_path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mrmsmybl\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"ru/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gjxslm09\"&gt;merged&lt;/code&gt;&lt;/a&gt;), даны как есть и объяснены в &lt;a href=\"ru/glossary.html\"&gt;словаре&lt;/a&gt;. Слова с несколькими значениями и обманчивые статусы собраны там в отдельных разделах: &lt;a href=\"ru/glossary.html#ambiguous\"&gt;Слова с несколькими значениями&lt;/a&gt; и &lt;a href=\"ru/glossary.html#misleading\"&gt;Обманчивые статусы&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;В примерах вывода встречается транспорт &lt;a href=\"ru/glossary.html#harness\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-egztw5ms\"&gt;fake&lt;/code&gt;&lt;/a&gt;. Это тестовый транспорт без обращения к моделям: на нём проверялись команды. У вас на его месте будет ваш &lt;a href=\"ru/glossary.html#transport\"&gt;транспорт&lt;/a&gt;, например &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5721gwkf\"&gt;claude-write&lt;/code&gt; или &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pn42bx93\"&gt;codex-write&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/index.html","hreflang":"en"},{"href":"ru/index.html","hreflang":"ru"}],"style":["_assets/theia.css"],"canonical":"ru/index.html","vcsPath":"ru/index.md"},"headings":[{"title":"Быстрый старт","href":"ru/index.html#quick-start","level":2},{"title":"Разделы","href":"ru/index.html#sections","level":2},{"title":"Как читать команды","href":"ru/index.html#conventions","level":2}],"title":"Руководство пользователя Theia 0.2.201"},"router":{"pathname":"ru/index","depth":2,"base":"../"},"lang":"ru","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/ru/index.html","tags":[]}}
        </script>
