        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kz6axvue\"&gt;theia serve&lt;/code&gt; is Theia's &lt;a href=\"en/glossary.html#mcp\"&gt;MCP&lt;/a&gt; server. Claude Code, Codex and other MCP clients start it to read the code map and project memory. In Claude Code it also lets Claude plan and start runs. This page lists every tool and shows how to register the server.&lt;/p&gt;\n&lt;h2 id=\"how-it-starts\"&gt;&lt;a href=\"en/integrations/mcp-server.html#how-it-starts\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How clients start the server&lt;/span&gt;&lt;/a&gt;How clients start the server&lt;/h2&gt;\n&lt;p&gt;The server talks MCP over standard input and output. An MCP client starts it as a child process. In daily work you do not start it yourself.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Claude Code.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ebrp3d5q\"&gt;theia hooks install claude&lt;/code&gt; writes &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b6w29kzn\"&gt;.mcp.json&lt;/code&gt;. After you approve the server, Claude Code starts &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-09ppflp6\"&gt;theia serve --home &amp;lt;project folder&amp;gt;&lt;/code&gt; with all 22 tools. See &lt;a href=\"en/integrations/claude-code.html#first-start\"&gt;Claude Code&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Codex.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zfv6wqwi\"&gt;theia hooks install codex&lt;/code&gt; writes &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3hlnrvtb\"&gt;.codex/config.toml&lt;/code&gt;. Codex starts the server with 5 tools, and only in a trusted project. See &lt;a href=\"en/integrations/codex.html#trust-gates\"&gt;Codex&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;While it runs, the server:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;checks every 300 seconds whether the code map is up to date (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-003xc69o\"&gt;maintenance.serveRefreshSeconds&lt;/code&gt;); the check makes no model calls;&lt;/li&gt;\n&lt;li&gt;with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ceprfe85\"&gt;maintenance.indexPolicy: auto&lt;/code&gt;, rebuilds out-of-date entries of the &lt;a href=\"en/glossary.html#intent-index\"&gt;intent index&lt;/a&gt; within the budget; this calls models;&lt;/li&gt;\n&lt;li&gt;writes its own messages to stderr, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ram5mxzb\"&gt;theia serve: MCP server on stdio (root ~/projects/app)&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The server offers tools only. Requests for resources or prompts get the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ouh4bacr\"&gt;Method not found&lt;/code&gt; error. It introduces itself as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z7pjr5er\"&gt;theia&lt;/code&gt; version &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8b6773y0\"&gt;0.1.0&lt;/code&gt;; this number is not the Theia version.&lt;/p&gt;\n&lt;h2 id=\"tools\"&gt;&lt;a href=\"en/integrations/mcp-server.html#tools\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tools&lt;/span&gt;&lt;/a&gt;Tools&lt;/h2&gt;\n&lt;p&gt;Optional parameters end with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7a4urce9\"&gt;?&lt;/code&gt;. Tool errors come back as a short text, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lzntb65v\"&gt;unknown run 'bogus' — run_list shows known runs&lt;/code&gt;; in the MCP reply such a result is marked &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r2rqjbcj\"&gt;isError: true&lt;/code&gt;. A wrong parameter comes back differently, as a protocol error &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybtzdtmf\"&gt;MCP error -32602: Input validation error: …&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"tools-code-map\"&gt;&lt;a href=\"en/integrations/mcp-server.html#tools-code-map\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Code map&lt;/span&gt;&lt;/a&gt;Code map&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Tool&lt;/th&gt;\n&lt;th&gt;Parameters&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m9r3a04x\"&gt;codebase_blueprint&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Returns the whole &lt;a href=\"en/glossary.html#blueprint\"&gt;blueprint&lt;/a&gt;: one line per indexed file, the most important first.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mdpk4cml\"&gt;codebase_search&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9bj6b5xj\"&gt;query&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gm89zelu\"&gt;k?&lt;/code&gt; from 1 to 50, default 8&lt;/td&gt;\n&lt;td&gt;Searches the code map. Each hit has the file path, its role, related files, its API and design notes. If the map is out of date, the reply also has a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1pyx86qx\"&gt;staleness&lt;/code&gt; block.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-21wlpyhb\"&gt;codebase_symbol&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9bc70vxx\"&gt;name&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Looks up an exact function or class name: definitions with line numbers, callers, callees and import sites.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"tools-memory\"&gt;&lt;a href=\"en/integrations/mcp-server.html#tools-memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Memory&lt;/span&gt;&lt;/a&gt;Memory&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Tool&lt;/th&gt;\n&lt;th&gt;Parameters&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rekceg7u\"&gt;memory_search&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c0snlht6\"&gt;query&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bpf95s7z\"&gt;k?&lt;/code&gt; from 1 to 50, default 8; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3x3m9usz\"&gt;asOf?&lt;/code&gt; — an event or fact id&lt;/td&gt;\n&lt;td&gt;Searches project &lt;a href=\"en/glossary.html#memory\"&gt;memory&lt;/a&gt;: facts and saved text pieces. With &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9kgtizsq\"&gt;asOf&lt;/code&gt;, it shows what was known at that point.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5mnyc2nw\"&gt;memory_add&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1vx7yl6z\"&gt;kind&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f6nu4sc7\"&gt;decision&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n4iagb03\"&gt;constraint&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nset4csq\"&gt;commitment&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o5zvffi4\"&gt;observation&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0mzzf9ph\"&gt;entity&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e72csq4k\"&gt;preference&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o9g33oe5\"&gt;text&lt;/code&gt; up to 4000 characters; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lqtrqtos\"&gt;entities?&lt;/code&gt; up to 20 names&lt;/td&gt;\n&lt;td&gt;Saves one &lt;a href=\"en/glossary.html#fact\"&gt;fact&lt;/a&gt;. If a nearly identical fact exists, it is replaced, and the reply has &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2pm3wx9b\"&gt;supersededId&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bl318h5p\"&gt;memory_tree&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o0zzs1sd\"&gt;family&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9cinfzdr\"&gt;session&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-be8lswuc\"&gt;entity&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-52bljra5\"&gt;treeKey&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tasyytii\"&gt;asOf?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Shows one memory timeline: groups with summaries and the entries in them.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In a test, a close rewording of an existing fact was saved as a second fact, not as a replacement. Do not count on automatic replacement when the wording differs.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"tools-audit\"&gt;&lt;a href=\"en/integrations/mcp-server.html#tools-audit\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Audit and diagnosis&lt;/span&gt;&lt;/a&gt;Audit and diagnosis&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Tool&lt;/th&gt;\n&lt;th&gt;Parameters&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zxvya9n2\"&gt;run_audit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nakg6dkp\"&gt;scope?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Checks the &lt;a href=\"en/glossary.html#audit-chain\"&gt;audit chains&lt;/a&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fwg1ldk6\"&gt;broken: null&lt;/code&gt; means the chain is intact. Without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kxbn7d8w\"&gt;scope&lt;/code&gt;, it checks all chains.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lt6q88u5\"&gt;run_diagnose&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sl4k99kg\"&gt;runId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Looks for the cause of a failed run in its &lt;a href=\"en/glossary.html#event-log\"&gt;event log&lt;/a&gt;. It only reads the log.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-57le3q4e\"&gt;run_check&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sff4l9qc\"&gt;index?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A tool for Theia's own agents. Outside runs it replies &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p1hcztjj\"&gt;run_check is not configured for this invocation (no check commands)&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"tools-run-control\"&gt;&lt;a href=\"en/integrations/mcp-server.html#tools-run-control\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Run control&lt;/span&gt;&lt;/a&gt;Run control&lt;/h3&gt;\n&lt;p&gt;Only the full server has these tools (Claude Code by default). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nwjamtcc\"&gt;runId&lt;/code&gt; is the full &lt;a href=\"en/glossary.html#run-id\"&gt;run id&lt;/a&gt;, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1gyu1day\"&gt;run2akdqkvcug222iaxzvmt6b&lt;/code&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Tool&lt;/th&gt;\n&lt;th&gt;Parameters&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-or0v1t6h\"&gt;run_list&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ehtnc548\"&gt;n?&lt;/code&gt; from 1 to 50, default 10&lt;/td&gt;\n&lt;td&gt;Recent runs: id, state (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-91rz4643\"&gt;live&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jxszdakg\"&gt;paused&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dwq59gqi\"&gt;finished&lt;/code&gt;), task counts, cost, questions waiting.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-czs1b01u\"&gt;run_status&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-elpobicv\"&gt;runId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;One run: tasks and their phases, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lawxk0op\"&gt;closedBy&lt;/code&gt; for closed tasks, questions waiting, recent warnings, cost and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ofqc79d8\"&gt;lastEventId&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3znjtam5\"&gt;run_events&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kzonfnc5\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qyclfi0g\"&gt;afterId?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The important events of a run, oldest first.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tj406c68\"&gt;run_wait&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-22nezsrl\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sdpnhf4l\"&gt;afterId?&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x0n6ws84\"&gt;timeoutSec?&lt;/code&gt; from 1 to 55, default 45&lt;/td&gt;\n&lt;td&gt;Waits for new events. The first call without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-udgh4nra\"&gt;afterId&lt;/code&gt; returns the last 30 events at once. Pass &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-00rrz4bq\"&gt;lastEventId&lt;/code&gt; from each reply as the next &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vgwkel3y\"&gt;afterId&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-21einqkh\"&gt;run_msg&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o8yxxzq2\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fxbd735x\"&gt;text&lt;/code&gt; up to 8000 characters; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7p9svpi1\"&gt;taskId?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Sends a &lt;a href=\"en/glossary.html#steering\"&gt;steering&lt;/a&gt; note to a run.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-giw80iq9\"&gt;run_answer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iisyfr45\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1i9qbq6p\"&gt;questionId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ci4bberb\"&gt;answers&lt;/code&gt; — question text mapped to your answer&lt;/td&gt;\n&lt;td&gt;Answers a &lt;a href=\"en/glossary.html#clarify\"&gt;clarifying question&lt;/a&gt; of a run. An empty &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iu65vc92\"&gt;answers&lt;/code&gt; declines to answer.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ketjjys\"&gt;run_stop&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sxib38no\"&gt;runId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Asks a run to pause after the step in progress.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ju6dphv\"&gt;run_start&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p9myji5j\"&gt;task?&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xkno03ym\"&gt;planId?&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f6avl6ga\"&gt;budgetUsd?&lt;/code&gt; above 0, up to 100&lt;/td&gt;\n&lt;td&gt;Starts &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nrebsmjz\"&gt;theia run --non-interactive --plain --interaction bus&lt;/code&gt; as a separate process. Returns &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rywp8bne\"&gt;runId&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vijl3ton\"&gt;log&lt;/code&gt;, the path of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vgqt5r5r\"&gt;.theia/control/run-&amp;lt;number&amp;gt;.log&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ksokayzi\"&gt;run_probe&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oyislcqi\"&gt;runId&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lt3ljq12\"&gt;question&lt;/code&gt; up to 2000 characters&lt;/td&gt;\n&lt;td&gt;Asks a read-only &lt;a href=\"en/glossary.html#probe\"&gt;question about a run&lt;/a&gt; through &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vgh760du\"&gt;theia probe&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"tools-plans\"&gt;&lt;a href=\"en/integrations/mcp-server.html#tools-plans\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plans&lt;/span&gt;&lt;/a&gt;Plans&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Tool&lt;/th&gt;\n&lt;th&gt;Parameters&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kpo9caeu\"&gt;plan_list&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Stored plans: id, status, task count and goal.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vanzsm4d\"&gt;plan_show&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7jk3mznf\"&gt;planId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;One &lt;a href=\"en/glossary.html#plan\"&gt;plan&lt;/a&gt; in full, with its status.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l59cnibp\"&gt;plan_create&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xd7ob4ex\"&gt;task&lt;/code&gt; up to 64000 characters&lt;/td&gt;\n&lt;td&gt;Starts &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5445785v\"&gt;theia plan&lt;/code&gt; and returns the plan id and text. The plan is not approved yet. The output goes to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-boyf1kx0\"&gt;.theia/control/plan-&amp;lt;number&amp;gt;.log&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iztl5dzh\"&gt;plan_approve&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-isz2m6kl\"&gt;planId&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Approves a plan. The tool does not ask the user; the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ikhk93pq\"&gt;/theia&lt;/code&gt; skill tells Claude to ask first.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Not checked for this guide&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The test setup used a stub model that cannot produce plans or questions. So &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uh13qam8\"&gt;plan_create&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a9as6lmj\"&gt;plan_show&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3guhhsiv\"&gt;plan_approve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q7voa1gu\"&gt;run_start&lt;/code&gt; with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0b2cp7ks\"&gt;planId&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j97aiff1\"&gt;run_answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k79yhgoy\"&gt;run_probe&lt;/code&gt; and a successful &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bhxxc792\"&gt;run_diagnose&lt;/code&gt; were not checked in use. Their description above follows the source code.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"model-calls\"&gt;&lt;a href=\"en/integrations/mcp-server.html#model-calls\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Which tools call models or download&lt;/span&gt;&lt;/a&gt;Which tools call models or download&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Tool&lt;/th&gt;\n&lt;th&gt;What it can cost&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-46az22z4\"&gt;run_start&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A whole run: many model calls within the run &lt;a href=\"en/glossary.html#budget\"&gt;budget&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-24fzzrtd\"&gt;plan_create&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Model calls for planning.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4hsspuj2\"&gt;run_probe&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;One model call.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-48kwn5k2\"&gt;codebase_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cup5t733\"&gt;memory_search&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;With &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tglef0rv\"&gt;gateway.embeddings.provider: openai&lt;/code&gt;, each query goes to the paid OpenAI &lt;a href=\"en/glossary.html#embeddings\"&gt;embeddings&lt;/a&gt; API. With the local model, the first search may download it (about 23 MB) if downloads are allowed.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;The server itself&lt;/td&gt;\n&lt;td&gt;With &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k2h99sif\"&gt;maintenance.indexPolicy: auto&lt;/code&gt;, index rebuilds call models.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;All other tools&lt;/td&gt;\n&lt;td&gt;No model calls.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"control-limits\"&gt;&lt;a href=\"en/integrations/mcp-server.html#control-limits\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Run control does not reach new runs&lt;/span&gt;&lt;/a&gt;Run control does not reach new runs&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l6upfvz4\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jjo1opc2\"&gt;run_stop&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8f3nhduk\"&gt;run_answer&lt;/code&gt; work only with a run that was paused and then continued with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qxkt2k63\"&gt;theia run --resume&lt;/code&gt;. A run started fresh ignores them, and that includes every run from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ckvmcvx7\"&gt;run_start&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4hl7zsz3\"&gt;run_msg&lt;/code&gt; still replies &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dyfo94hg\"&gt;reaches the live run at its next dispatch boundary&lt;/code&gt;, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g6809he9\"&gt;run_stop&lt;/code&gt; still replies &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v742nau5\"&gt;honored at the next dispatch boundary (in-flight work lands first)&lt;/code&gt;. Questions from such a run never arrive.&lt;/p&gt;\n&lt;p&gt;The cause is in the 0.2.201 code: a fresh run does not connect the &lt;a href=\"en/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;; only &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pxhwjcd4\"&gt;theia run --resume&lt;/code&gt; connects it. So &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jgq5240a\"&gt;theia run … --interaction bus&lt;/code&gt; without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eyh9s33n\"&gt;--resume&lt;/code&gt; does not listen to the bus either. This is a bug of the version, see &lt;a href=\"en/about/limitations.html#integrations\"&gt;Limitations&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;The checked order of steps is in &lt;a href=\"en/integrations/claude-code.html#steer-run\"&gt;Steer a run from Claude&lt;/a&gt;. More on pauses: &lt;a href=\"en/guides/control-run.html\"&gt;Control a run&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Also seen in tests:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A run killed from outside stays &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a7q1fyku\"&gt;live&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8c6czvyg\"&gt;run_list&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l5qa7zlx\"&gt;run_status&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zxje2eke\"&gt;run_start&lt;/code&gt; with a wrong &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ksrqry2\"&gt;planId&lt;/code&gt; returns an error, but each attempt leaves an empty branch &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r5deacs5\"&gt;theia/run-&amp;lt;suffix&amp;gt;&lt;/code&gt; in the repository and a run record that stays in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g92mxz6l\"&gt;run_list&lt;/code&gt; forever with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fzbkbdes\"&gt;tail: live&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iv49znlw\"&gt;outcome: in flight&lt;/code&gt; and zero tasks. Such a run also counts towards &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ze0agoeb\"&gt;N live&lt;/code&gt; in the Claude Code status line.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-04vg7zmf\"&gt;run_wait&lt;/code&gt; does not list the stop request itself. It shows &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xehfuky\"&gt;run.paused&lt;/code&gt; when the pause happens.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tool-set\"&gt;&lt;a href=\"en/integrations/mcp-server.html#tool-set\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Choose the tool set&lt;/span&gt;&lt;/a&gt;Choose the tool set&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Launch&lt;/th&gt;\n&lt;th&gt;Tools&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rxw0p2mh\"&gt;theia serve&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;22: all groups&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ncq7hxz\"&gt;theia serve --no-control&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;9: code map, memory, audit and diagnosis&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t0ycvebx\"&gt;theia serve --tools codebase_blueprint,memory_search&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;only the listed tools; run and plan tools cannot be listed&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Names allowed in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mbmqdobo\"&gt;--tools&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a86xtep7\"&gt;codebase_blueprint&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q6cpjr3q\"&gt;codebase_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y7ktu1x7\"&gt;codebase_symbol&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e49gz77i\"&gt;memory_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bao5ljh6\"&gt;memory_add&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1upv62xv\"&gt;memory_tree&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ezxphf5i\"&gt;run_audit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-opmpr6ts\"&gt;run_diagnose&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tz98e4o0\"&gt;run_check&lt;/code&gt;. Any other name stops the server with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-po1s2h2o\"&gt;mcp-server: unknown tool 'bogus' in filter (known: …)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Use &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qd0gro33\"&gt;--no-control&lt;/code&gt; when a client should only read the code map and memory. Flag details: &lt;a href=\"en/reference/serve.html#serve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lh12ocgb\"&gt;theia serve&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"register\"&gt;&lt;a href=\"en/integrations/mcp-server.html#register\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Register the server by hand&lt;/span&gt;&lt;/a&gt;Register the server by hand&lt;/h2&gt;\n&lt;p&gt;Always pass &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-owwqr3s2\"&gt;--home&lt;/code&gt; with the full path of the folder that holds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-73hhh0ej\"&gt;.theia/&lt;/code&gt;. The command can be the version path that the installer writes, or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-is403gq8\"&gt;~/.local/bin/theia&lt;/code&gt;, which follows updates (see &lt;a href=\"en/integrations/claude-code.html#after-update\"&gt;After a Theia update&lt;/a&gt;).&lt;/p&gt;\n&lt;h3 id=\"register-claude\"&gt;&lt;a href=\"en/integrations/mcp-server.html#register-claude\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Claude Code&lt;/span&gt;&lt;/a&gt;Claude Code&lt;/h3&gt;\n&lt;p&gt;File &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vcn51ugb\"&gt;.mcp.json&lt;/code&gt; in the project folder:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs json\"&gt;&lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;\"mcpServers\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;\"theia\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;{&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;\"command\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"/Users/you/.local/bin/theia\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;\"args\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;:&lt;/span&gt; &lt;span class=\"hljs-punctuation\"&gt;[&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"serve\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"--home\"&lt;/span&gt;&lt;span class=\"hljs-punctuation\"&gt;,&lt;/span&gt;\n        &lt;span class=\"hljs-string\"&gt;\"/Users/you/projects/app\"&lt;/span&gt;\n      &lt;span class=\"hljs-punctuation\"&gt;]&lt;/span&gt;\n    &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n  &lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;span class=\"hljs-punctuation\"&gt;}&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"578\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-578\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-578\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-578.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;To give Claude only the code map and memory, add &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gb2n68yx\"&gt;\"--no-control\"&lt;/code&gt; to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0s51nxs9\"&gt;args&lt;/code&gt;. Check the entry with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5s1vsggn\"&gt;claude mcp list&lt;/code&gt;: until you approve the server in Claude Code, it shows &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0bdm9fa\"&gt;Pending approval&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"register-codex\"&gt;&lt;a href=\"en/integrations/mcp-server.html#register-codex\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Codex&lt;/span&gt;&lt;/a&gt;Codex&lt;/h3&gt;\n&lt;p&gt;The same block works in the project file &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fnbgrpm8\"&gt;.codex/config.toml&lt;/code&gt; (only in a trusted project) and in your Codex settings &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ax48cze2\"&gt;~/.codex/config.toml&lt;/code&gt; (for all folders):&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs toml\"&gt;&lt;span class=\"hljs-section\"&gt;[mcp_servers.theia]&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;command&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"/Users/you/.local/share/theia/releases/0.2.201/theia\"&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;args&lt;/span&gt; = [&lt;span class=\"hljs-string\"&gt;\"serve\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"--home\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"/Users/you/projects/app\"&lt;/span&gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"588\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-588\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-588\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-588.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;With this block in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-djyc9n4e\"&gt;~/.codex/config.toml&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9vle5hwp\"&gt;codex mcp list&lt;/code&gt; in another folder shows (shortened):&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;Name   Command                                               Args                                  …  Status\ntheia  /Users/you/.local/share/theia/releases/0.2.201/theia  serve --home /Users/you/projects/app  …  enabled\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"592\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-592\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-592\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-592.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mqmjprbq\"&gt;--tools&lt;/code&gt;, Codex gets all 22 tools. Run and plan tools inside Codex were not checked for this guide.&lt;/p&gt;\n&lt;h3 id=\"register-other\"&gt;&lt;a href=\"en/integrations/mcp-server.html#register-other\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Other MCP clients&lt;/span&gt;&lt;/a&gt;Other MCP clients&lt;/h3&gt;\n&lt;p&gt;Any MCP client that starts servers over standard input and output can use Theia. The command is the path to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rg1rhkal\"&gt;theia&lt;/code&gt;, the arguments are &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1g4uadp6\"&gt;serve --home &amp;lt;project folder&amp;gt;&lt;/code&gt;. The server offers tools only, with no resources or prompts.&lt;/p&gt;\n&lt;h2 id=\"undo\"&gt;&lt;a href=\"en/integrations/mcp-server.html#undo\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Undo&lt;/span&gt;&lt;/a&gt;Undo&lt;/h2&gt;\n&lt;p&gt;There is no command to undo. You disconnect the server by removing its entry from the client.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;If &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dfkhd474\"&gt;theia hooks install&lt;/code&gt; wrote the entry, remove the whole integration by the steps in &lt;a href=\"en/integrations/claude-code.html#undo\"&gt;Undo&lt;/a&gt; on the Claude Code page or &lt;a href=\"en/integrations/codex.html#undo\"&gt;Undo&lt;/a&gt; on the Codex page.&lt;/li&gt;\n&lt;li&gt;If you registered the server by hand, delete the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t9p34fpk\"&gt;theia&lt;/code&gt; entry under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3p9bi71r\"&gt;mcpServers&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1d4jk8i4\"&gt;.mcp.json&lt;/code&gt;, or the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gsh1nkcq\"&gt;[mcp_servers.theia]&lt;/code&gt; block from the Codex &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x7iftubv\"&gt;config.toml&lt;/code&gt;. The client will not start the server on its next start. Claude Code keeps its own record of your approval of the server; how to reset it is on the &lt;a href=\"en/integrations/claude-code.html#undo\"&gt;Claude Code&lt;/a&gt; page.&lt;/li&gt;\n&lt;li&gt;The server itself leaves behind only the logs of the processes that &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nnjmrnlp\"&gt;run_start&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-paj55685\"&gt;plan_create&lt;/code&gt; started. You can delete them:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt; -rf .theia/control\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"625\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-625\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-625\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-625.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Facts saved with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w7bwmj22\"&gt;memory_add&lt;/code&gt; stay in the project store. How to remove the store: &lt;a href=\"en/install/uninstall.html#project-store\"&gt;Uninstall&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"errors\"&gt;&lt;a href=\"en/integrations/mcp-server.html#errors\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Errors you may see&lt;/span&gt;&lt;/a&gt;Errors you may see&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Message&lt;/th&gt;\n&lt;th&gt;Cause&lt;/th&gt;\n&lt;th&gt;What to do&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1v28aqex\"&gt;theia: no .theia/ found from … upward (and no user-registry workspace) — run 'theia init' in the workspace home first&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ca4utwk9\"&gt;--home&lt;/code&gt; points at a folder without a store, or the server started outside the project&lt;/td&gt;\n&lt;td&gt;Fix the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mpu21rwv\"&gt;--home&lt;/code&gt; path, or run &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4wjwmz07\"&gt;theia init&lt;/code&gt; in the project.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jpf1zlha\"&gt;mcp-server: unknown tool '…' in filter (known: …)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A wrong name in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w14nf6ww\"&gt;--tools&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Use a name from &lt;a href=\"en/integrations/mcp-server.html#tool-set\"&gt;Choose the tool set&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t7g7nrhv\"&gt;theia serve: --metrics needs a port 1..65535, got 'abc'&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A wrong port&lt;/td&gt;\n&lt;td&gt;Pass a number from 1 to 65535.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iy3dkhtu\"&gt;theia: query embedding failed (fatal: embeddings-local: model 'all-MiniLM-L6-v2' missing …)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The local embeddings model is not on disk and downloads are off&lt;/td&gt;\n&lt;td&gt;Fetch the model as the full message says. See &lt;a href=\"en/guides/knowledge.html\"&gt;Code index, memory and questions&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-slskkwc5\"&gt;theia: no vendor deliverables found (lib/vendor missing and no installed set) …&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Theia's &lt;a href=\"en/glossary.html#vendor\"&gt;shipped files&lt;/a&gt; are missing, or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lwt5zri9\"&gt;THEIA_VENDOR_DIR&lt;/code&gt; points at a missing folder&lt;/td&gt;\n&lt;td&gt;Unset &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i5ccz2rc\"&gt;THEIA_VENDOR_DIR&lt;/code&gt; or reinstall Theia.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nx16qfv9\"&gt;Error: listen EADDRINUSE: address already in use&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Another process already uses the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i0mafsia\"&gt;--metrics&lt;/code&gt; port&lt;/td&gt;\n&lt;td&gt;Use another port. See &lt;a href=\"en/integrations/observability.html#metrics-endpoint\"&gt;Metrics and tracing&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2qwz16y2\"&gt;terryid: neither a body nor a full id: 'bogus'&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lqkj41i2\"&gt;run_diagnose&lt;/code&gt; got a text that does not look like a run id&lt;/td&gt;\n&lt;td&gt;Pass the full &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-00xxvvdm\"&gt;runId&lt;/code&gt; from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a8r56kml\"&gt;run_list&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yu00r9zy\"&gt;run_diagnose: no events for &amp;lt;id&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The id has the right shape, but no run has such a log&lt;/td&gt;\n&lt;td&gt;Take the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6nhnze0k\"&gt;runId&lt;/code&gt; from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ley6khv9\"&gt;run_list&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"for-developers\"&gt;&lt;a href=\"en/integrations/mcp-server.html#for-developers\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;For platform developers&lt;/span&gt;&lt;/a&gt;For platform developers&lt;/h2&gt;\n&lt;p&gt;Theia's own agents inside runs start the same server with a short tool list (policy value &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k3745w88\"&gt;run.mcpBelt.tools&lt;/code&gt;) and extra flags. You do not need these flags; they are listed on the &lt;a href=\"en/reference/serve.html#for-developers\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rdcnok4k\"&gt;theia serve&lt;/code&gt;&lt;/a&gt; page.&lt;/p&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"en/integrations/mcp-server.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;See also&lt;/span&gt;&lt;/a&gt;See also&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/reference/serve.html#serve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wrnso8ky\"&gt;theia serve&lt;/code&gt;&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/integrations/codex.html\"&gt;Codex&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/integrations/observability.html\"&gt;Metrics and tracing&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/guides/control-run.html\"&gt;Control a run&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/integrations/mcp-server.html","hreflang":"en"},{"href":"ru/integrations/mcp-server.html","hreflang":"ru"}],"style":["_assets/theia.css"],"canonical":"en/integrations/mcp-server.html","vcsPath":"en/integrations/mcp-server.md"},"headings":[{"title":"How clients start the server","href":"en/integrations/mcp-server.html#how-it-starts","level":2},{"title":"Tools","href":"en/integrations/mcp-server.html#tools","level":2,"items":[{"title":"Code map","href":"en/integrations/mcp-server.html#tools-code-map","level":3},{"title":"Memory","href":"en/integrations/mcp-server.html#tools-memory","level":3},{"title":"Audit and diagnosis","href":"en/integrations/mcp-server.html#tools-audit","level":3},{"title":"Run control","href":"en/integrations/mcp-server.html#tools-run-control","level":3},{"title":"Plans","href":"en/integrations/mcp-server.html#tools-plans","level":3}]},{"title":"Which tools call models or download","href":"en/integrations/mcp-server.html#model-calls","level":2},{"title":"Run control does not reach new runs","href":"en/integrations/mcp-server.html#control-limits","level":2},{"title":"Choose the tool set","href":"en/integrations/mcp-server.html#tool-set","level":2},{"title":"Register the server by hand","href":"en/integrations/mcp-server.html#register","level":2,"items":[{"title":"Claude Code","href":"en/integrations/mcp-server.html#register-claude","level":3},{"title":"Codex","href":"en/integrations/mcp-server.html#register-codex","level":3},{"title":"Other MCP clients","href":"en/integrations/mcp-server.html#register-other","level":3}]},{"title":"Undo","href":"en/integrations/mcp-server.html#undo","level":2},{"title":"Errors you may see","href":"en/integrations/mcp-server.html#errors","level":2},{"title":"For platform developers","href":"en/integrations/mcp-server.html#for-developers","level":2},{"title":"See also","href":"en/integrations/mcp-server.html#see-also","level":2}],"title":"MCP server"},"router":{"pathname":"en/integrations/mcp-server","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
