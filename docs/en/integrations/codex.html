        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This page connects Theia to Codex, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s3ve12sl\"&gt;codex&lt;/code&gt; CLI. After that, Codex sessions in the project get project memory at the start, matching memory with each prompt, and five Theia tools for the code map and memory.&lt;/p&gt;\n&lt;h2 id=\"what-you-get\"&gt;&lt;a href=\"en/integrations/codex.html#what-you-get\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;What you get&lt;/span&gt;&lt;/a&gt;What you get&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wii1zmir\"&gt;theia hooks install codex&lt;/code&gt; writes two files into the project:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zjpxdiem\"&gt;.codex/hooks.json&lt;/code&gt; — four &lt;a href=\"en/glossary.html#hooks\"&gt;hooks&lt;/a&gt; that pass memory to Codex and save the end of a session.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b0sp2r5o\"&gt;.codex/config.toml&lt;/code&gt; — the Theia &lt;a href=\"en/glossary.html#mcp\"&gt;MCP&lt;/a&gt; server with five tools.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Codex uses them only after two trust confirmations. See &lt;a href=\"en/integrations/codex.html#trust-gates\"&gt;Two trust gates&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Codex gets less than Claude Code:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;&lt;/th&gt;\n&lt;th&gt;Claude Code&lt;/th&gt;\n&lt;th&gt;Codex&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Hooks&lt;/td&gt;\n&lt;td&gt;4, the last is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ow36l6r\"&gt;Stop&lt;/code&gt; (after every response)&lt;/td&gt;\n&lt;td&gt;4, the last is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-etv60izb\"&gt;SessionEnd&lt;/code&gt; (end of a session)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;MCP tools&lt;/td&gt;\n&lt;td&gt;22, run control included&lt;/td&gt;\n&lt;td&gt;5: code map and memory&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j933asv5\"&gt;/theia&lt;/code&gt; skill&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Status line&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"install\"&gt;&lt;a href=\"en/integrations/codex.html#install\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Install&lt;/span&gt;&lt;/a&gt;Install&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Go to the folder that holds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ouh5jmj7\"&gt;.theia/&lt;/code&gt;. The command does not look in parent folders.&lt;/li&gt;\n&lt;li&gt;Run:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;theia hooks install codex\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"103\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-103\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-103\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-103.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Example output (the trust report is shortened here and shown in full below):&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;installed hooks: SessionStart, UserPromptSubmit, PreCompact, SessionEnd → ~/projects/app/.codex/hooks.json\ncreated [mcp_servers.theia] → ~/projects/app/.codex/config.toml\ngate 1 (project trust): NOT SATISFIED — the whole project-scope .codex/ surface is INERT until\n…\nai rules: none detected\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"107\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-107\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-107\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-107.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ol start=\"3\" style=\"--hier-list-start:2\"&gt;\n&lt;li&gt;Pass both &lt;a href=\"en/integrations/codex.html#trust-gates\"&gt;trust gates&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-odol90y4\"&gt;--trust&lt;/code&gt; flag also records trust for this project in your Codex settings. It is not shown in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fi176lys\"&gt;theia help&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;theia hooks install codex --trust\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"118\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-118\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-118\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-118.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Example output:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;hooks already installed (~/projects/app/.codex/hooks.json unchanged)\nmcp server already configured (~/projects/app/.codex/config.toml unchanged)\n--trust: appended project trust → /Users/you/.codex/config.toml\ngate 1 (project trust): ok — /Users/you/projects/app is trusted in /Users/you/.codex/config.toml\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"122\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-122\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-122\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-122.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Running the command again changes nothing. It prints &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q6hoczew\"&gt;hooks already installed …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kvsys8u5\"&gt;mcp server already configured …&lt;/code&gt; and the trust report again.&lt;/p&gt;\n&lt;p&gt;Theia finds your Codex settings the same way Codex does: in the folder from the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5vnw782h\"&gt;CODEX_HOME&lt;/code&gt; variable, or in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-do8lhp7g\"&gt;~/.codex&lt;/code&gt; by default.&lt;/p&gt;\n&lt;h2 id=\"files\"&gt;&lt;a href=\"en/integrations/codex.html#files\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;What changes&lt;/span&gt;&lt;/a&gt;What changes&lt;/h2&gt;\n&lt;h3 id=\"hooks-json\"&gt;&lt;a href=\"en/integrations/codex.html#hooks-json\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;.codex/hooks.json&lt;/span&gt;&lt;/a&gt;.codex/hooks.json&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Codex event&lt;/th&gt;\n&lt;th&gt;Command&lt;/th&gt;\n&lt;th&gt;What Theia does&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v19fndst\"&gt;SessionStart&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xmxrxdwp\"&gt;theia mem context&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Passes the start of the code map and the 8 newest memory facts.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a7hd97dl\"&gt;UserPromptSubmit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-68deoigj\"&gt;theia mem recall&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Passes up to 6 memory entries that match the prompt.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-12aunwey\"&gt;PreCompact&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-re5vhgaz\"&gt;theia mem checkpoint&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Saves the last 16 KB of the session file to memory.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4z0vnxk8\"&gt;SessionEnd&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p9bn8xia\"&gt;theia mem checkpoint --final&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The same save at the end of a session.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Each command uses the full path of the Theia program (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wz7jh1ef\"&gt;/Users/you/.local/share/theia/releases/0.2.201/theia&lt;/code&gt;) and has a 30-second limit. The file has the same format as Claude Code hooks. What the commands print is shown on the &lt;a href=\"en/integrations/claude-code.html#hooks\"&gt;Claude Code&lt;/a&gt; page.&lt;/p&gt;\n&lt;h3 id=\"config-toml\"&gt;&lt;a href=\"en/integrations/codex.html#config-toml\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;.codex/config.toml&lt;/span&gt;&lt;/a&gt;.codex/config.toml&lt;/h3&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs toml\"&gt;&lt;span class=\"hljs-comment\"&gt;# theia hooks install codex&lt;/span&gt;\n&lt;span class=\"hljs-section\"&gt;[mcp_servers.theia]&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;command&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"/Users/you/.local/share/theia/releases/0.2.201/theia\"&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;args&lt;/span&gt; = [&lt;span class=\"hljs-string\"&gt;\"serve\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"--home\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"/Users/you/projects/app\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"--tools\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"codebase_blueprint,codebase_search,codebase_symbol,memory_search,memory_add\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"--source-ref\"&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;\"session:codex\"&lt;/span&gt;]\n&lt;span class=\"hljs-attr\"&gt;default_tools_approval_mode&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"auto\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"202\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-202\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-202\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-202.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;If the file already exists, Theia adds this block at the end and does not touch your lines. If the block is already there, the file does not change.&lt;/li&gt;\n&lt;li&gt;The tool list is the &lt;a href=\"en/glossary.html#policy\"&gt;policy&lt;/a&gt; value &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-go58vxux\"&gt;run.mcpBelt.tools&lt;/code&gt; plus &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lo2eg7qm\"&gt;memory_add&lt;/code&gt;. With default settings these are the five tools below.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ic6ypkek\"&gt;--source-ref session:codex&lt;/code&gt; marks memory facts saved from Codex.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"trust-entry\"&gt;&lt;a href=\"en/integrations/codex.html#trust-entry\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;~/.codex/config.toml, only with --trust&lt;/span&gt;&lt;/a&gt;~/.codex/config.toml, only with --trust&lt;/h3&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs toml\"&gt;&lt;span class=\"hljs-comment\"&gt;# theia hooks install codex --trust&lt;/span&gt;\n&lt;span class=\"hljs-section\"&gt;[projects.\"/Users/you/projects/app\"]&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;trust_level&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"trusted\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"223\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-223\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-223\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-223.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;This is the only change outside the project folder.&lt;/p&gt;\n&lt;h2 id=\"trust-gates\"&gt;&lt;a href=\"en/integrations/codex.html#trust-gates\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Two trust gates&lt;/span&gt;&lt;/a&gt;Two trust gates&lt;/h2&gt;\n&lt;p&gt;Theia prints this report after every install, even when nothing changed:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;gate 1 (project trust): NOT SATISFIED — the whole project-scope .codex/ surface is INERT until\n  /Users/you/.codex/config.toml carries:\n    [projects.\"/Users/you/projects/app\"]\n    trust_level = \"trusted\"\n  Either run `codex` once in this directory and accept the trust prompt,\n  or re-run `theia hooks install codex --trust` to append it for you.\n  (A `-c projects.….trust_level` CLI override does NOT satisfy this gate — probed, ledger §4.)\ngate 2 (hook trust): new/changed hooks are review-gated per hash and SKIPPED until trusted —\n  run `/hooks` once in an interactive codex session here to review and trust them;\n  vetted automation may pass `--dangerously-bypass-hook-trust` per invocation.\nnote: the plugin-hooks path is retired at codex-cli 0.151.0 (`plugin_hooks` = removed;\n  core `hooks` feature is stable) — project .codex/hooks.json is the supported surface.\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"233\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-233\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-233\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-233.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3u88nlo4\"&gt;probed, ledger §4&lt;/code&gt; is an internal note of the Theia developers; you can ignore it.&lt;/p&gt;\n&lt;h3 id=\"gate-1\"&gt;&lt;a href=\"en/integrations/codex.html#gate-1\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gate 1: trust the project&lt;/span&gt;&lt;/a&gt;Gate 1: trust the project&lt;/h3&gt;\n&lt;p&gt;Until the project is trusted, Codex ignores the whole project &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fsw95jag\"&gt;.codex/&lt;/code&gt; folder: no hooks and no MCP server. Do one of these:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Run &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6dcxwzhd\"&gt;codex&lt;/code&gt; in the project folder once and accept the trust question.&lt;/li&gt;\n&lt;li&gt;Run &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1qm0du6g\"&gt;theia hooks install codex --trust&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;According to Theia's report, a one-time &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0v0l61tj\"&gt;-c projects.….trust_level&lt;/code&gt; option on the Codex command line is not enough.&lt;/p&gt;\n&lt;p&gt;Check the result. In a trusted project, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j49sz79l\"&gt;codex mcp list&lt;/code&gt; shows the server:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;codex mcp list\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"261\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-261\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-261\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-261.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Example output in a trusted project:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;Name   Command                                               Args\ntheia  /Users/you/.local/share/theia/releases/0.2.201/theia  serve --home /Users/you/projects/app --tools …\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"265\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-265\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-265\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-265.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;In a project that is not trusted, the server is missing:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;No MCP servers configured yet. Try `codex mcp add my-tool -- my-command`.\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"269\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-269\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-269\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-269.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"gate-2\"&gt;&lt;a href=\"en/integrations/codex.html#gate-2\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Gate 2: trust the hooks&lt;/span&gt;&lt;/a&gt;Gate 2: trust the hooks&lt;/h3&gt;\n&lt;p&gt;Codex skips new or changed hooks until you review them:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Open an interactive &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-com7mdvn\"&gt;codex&lt;/code&gt; session in the project folder.&lt;/li&gt;\n&lt;li&gt;Type &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-772j9zbp\"&gt;/hooks&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Review the four Theia hooks and trust them.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;For scripts that you have checked, Codex accepts the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nicn3h70\"&gt;--dangerously-bypass-hook-trust&lt;/code&gt; option for a single call. After any change to the hook files, review them again.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;This guide checked the files, the trust entry and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rj50g0mm\"&gt;codex mcp list&lt;/code&gt;. It did not check how the hooks behave inside a Codex session, because that needs model calls.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"doctor\"&gt;&lt;a href=\"en/integrations/codex.html#doctor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Check with theia doctor&lt;/span&gt;&lt;/a&gt;Check with theia doctor&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p2wvzcug\"&gt;theia doctor&lt;/code&gt; has a line about Codex hooks for the project in the current folder. Example output:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;codex hooks        : feature stable/true; project trusted; hooks.json present\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"312\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-312\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-312\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-312.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Other states in this line: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iip4x5jq\"&gt;project NOT trusted (gate 1)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wwucov1k\"&gt;hooks.json absent (theia hooks install codex)&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c9z4p4ec\"&gt;codex not found — install/auth codex first&lt;/code&gt;. See &lt;a href=\"en/reference/doctor.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rh05yd71\"&gt;theia doctor&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"daily-use\"&gt;&lt;a href=\"en/integrations/codex.html#daily-use\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;What you can do from Codex&lt;/span&gt;&lt;/a&gt;What you can do from Codex&lt;/h2&gt;\n&lt;p&gt;In a trusted project with trusted hooks:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;At the start of a session, Codex gets the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0l3sd261\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt; block: the start of the code map and recent memory facts.&lt;/li&gt;\n&lt;li&gt;With each prompt, Codex gets matching memory in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nnc7ba3q\"&gt;&amp;lt;theia-memory&amp;gt;&lt;/code&gt; block.&lt;/li&gt;\n&lt;li&gt;The end of each session is saved to memory.&lt;/li&gt;\n&lt;li&gt;Codex can call five tools:&lt;/li&gt;\n&lt;/ul&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Tool&lt;/th&gt;\n&lt;th&gt;What you can ask Codex to do&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ksbbokjd\"&gt;codebase_blueprint&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;read the whole code map&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7vntn0u1\"&gt;codebase_search&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;find where a feature lives&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nrfr7x3a\"&gt;codebase_symbol&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;find where a function or class is defined and who calls it&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ngvdexna\"&gt;memory_search&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;find project decisions and rules in memory&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-np42y7i6\"&gt;memory_add&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;save a decision or a rule to memory&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The parameters are on the &lt;a href=\"en/integrations/mcp-server.html#tools\"&gt;MCP server&lt;/a&gt; page.&lt;/p&gt;\n&lt;p&gt;Codex cannot start or steer Theia runs: it has no run or plan tools and no &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f4xptu4e\"&gt;/theia&lt;/code&gt; skill. Start and control runs in the terminal, see &lt;a href=\"en/guides/control-run.html\"&gt;Control a run&lt;/a&gt;, or from &lt;a href=\"en/integrations/claude-code.html#theia-skill\"&gt;Claude Code&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;You can register the full server with run tools by hand, see &lt;a href=\"en/integrations/mcp-server.html#register-codex\"&gt;Register the server by hand&lt;/a&gt;. Run tools inside Codex were not checked for this guide.&lt;/p&gt;\n&lt;h2 id=\"after-update\"&gt;&lt;a href=\"en/integrations/codex.html#after-update\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;After a Theia update&lt;/span&gt;&lt;/a&gt;After a Theia update&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zasnlorq\"&gt;.codex/hooks.json&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ssms5bkz\"&gt;.codex/config.toml&lt;/code&gt; store the path of one version, like the Claude Code files. After an update, Codex keeps running the old version. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d17oqvp9\"&gt;theia hooks install codex&lt;/code&gt; does not fix the path: it adds a second set of hooks and leaves the server entry as it is.&lt;/p&gt;\n&lt;p&gt;Checked fix: point both files at &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qzfbzxej\"&gt;~/.local/bin/theia&lt;/code&gt;, the link that updates move to the new version.&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabsGroup-2ltvztpc\" data-diplodoc-variant=\"regular\"&gt;\n&lt;div class=\"yfm-tab-list\" role=\"tablist\"&gt;\n&lt;div data-diplodoc-id=\"macos\" data-diplodoc-key=\"macos\" class=\"yfm-tab yfm-tab-group active\" role=\"tab\" aria-controls=\"regular-fyq8h76s\" aria-selected=\"true\" tabindex=\"0\" data-diplodoc-is-active=\"true\"&gt;macOS&lt;/div&gt;\n&lt;div data-diplodoc-id=\"linux\" data-diplodoc-key=\"linux\" class=\"yfm-tab yfm-tab-group\" role=\"tab\" aria-controls=\"regular-1jv1c464\" aria-selected=\"false\" tabindex=\"-1\" data-diplodoc-is-active=\"false\"&gt;Linux&lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"regular-fyq8h76s\" class=\"yfm-tab-panel active\" role=\"tabpanel\" aria-labelledby=\"macos\" data-title=\"macOS\"&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;sed -i &lt;span class=\"hljs-string\"&gt;''&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;'s#/.local/share/theia/releases/[^/]*/theia#/.local/bin/theia#g'&lt;/span&gt; .codex/hooks.json .codex/config.toml\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"426\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-426\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-426\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-426.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;div id=\"regular-1jv1c464\" class=\"yfm-tab-panel\" role=\"tabpanel\" aria-labelledby=\"linux\" data-title=\"Linux\"&gt;\n&lt;p&gt;Open both files in an editor and replace &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-32ov6xdj\"&gt;/.local/share/theia/releases/0.2.201/theia&lt;/code&gt; with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sn07br4f\"&gt;/.local/bin/theia&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;p&gt;After the change, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-icg4ng1s\"&gt;codex mcp list&lt;/code&gt; shows &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0inqgzd1\"&gt;/Users/you/.local/bin/theia&lt;/code&gt; as the command. The hooks have changed, so review them again with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n053ceqo\"&gt;/hooks&lt;/code&gt;. Do not run &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1rhvy7bs\"&gt;theia hooks install codex&lt;/code&gt; again afterwards.&lt;/p&gt;\n&lt;h2 id=\"undo\"&gt;&lt;a href=\"en/integrations/codex.html#undo\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Undo&lt;/span&gt;&lt;/a&gt;Undo&lt;/h2&gt;\n&lt;p&gt;There is no &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-774hw4dv\"&gt;theia hooks uninstall&lt;/code&gt; command. Remove the integration by hand.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;If both files contain only Theia's entries, delete them and the empty folder:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;rm&lt;/span&gt; .codex/hooks.json .codex/config.toml\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"450\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-450\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-450\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-450.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;&lt;span class=\"hljs-built_in\"&gt;rmdir&lt;/span&gt; .codex\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"451\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-451\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-451\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-451.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;If &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t6ujn4zt\"&gt;.codex/config.toml&lt;/code&gt; has your own settings, delete only the lines from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v2gliex9\"&gt;# theia hooks install codex&lt;/code&gt; to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ug8wz4hw\"&gt;default_tools_approval_mode = \"auto\"&lt;/code&gt;. If &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6v1ey1dv\"&gt;.codex/hooks.json&lt;/code&gt; has your own hooks, delete only the four Theia entries.&lt;/p&gt;\n&lt;ol start=\"2\" style=\"--hier-list-start:1\"&gt;\n&lt;li&gt;If you used &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3l7anbwk\"&gt;--trust&lt;/code&gt;, delete these three lines from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fbcsdw9c\"&gt;~/.codex/config.toml&lt;/code&gt;:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs toml\"&gt;&lt;span class=\"hljs-comment\"&gt;# theia hooks install codex --trust&lt;/span&gt;\n&lt;span class=\"hljs-section\"&gt;[projects.\"/Users/you/projects/app\"]&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;trust_level&lt;/span&gt; = &lt;span class=\"hljs-string\"&gt;\"trusted\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button_
