gt;\n                        &lt;animate id=\"hideAnimation-357\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-357.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/div&gt;\n&lt;/div&gt;\n&lt;p&gt;Without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lutl22lc\"&gt;--harness&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q5qmjhv2\"&gt;init&lt;/code&gt; checks which CLI is logged in. It picks &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lad3rapu\"&gt;codex&lt;/code&gt; when Codex answers (also when both answer), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ty186roz\"&gt;claude&lt;/code&gt; when only Claude Code answers, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a65mtwe5\"&gt;codex&lt;/code&gt; with a warning when neither answers. Details: &lt;a href=\"en/reference/init.html#init\"&gt;theia init&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"examples\"&gt;&lt;a href=\"en/config/models.html#examples\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Examples&lt;/span&gt;&lt;/a&gt;Examples&lt;/h2&gt;\n&lt;p&gt;Put one of these files into &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-meunef2u\"&gt;.theia/config/policy.yaml&lt;/code&gt;. If your file has other settings, for example under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5kgqtaf9\"&gt;run:&lt;/code&gt;, keep them.&lt;/p&gt;\n&lt;h3 id=\"example-claude\"&gt;&lt;a href=\"en/config/models.html#example-claude\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Everything on Claude&lt;/span&gt;&lt;/a&gt;Everything on Claude&lt;/h3&gt;\n&lt;p&gt;Needs a Claude Code login. The reviewer uses &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-efpjg4a0\"&gt;claude-sonnet-5&lt;/code&gt; instead of the default model.&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;theia.dev/v1alpha1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Policy&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;local&lt;/span&gt; }\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;run:&lt;/span&gt; {}\n  &lt;span class=\"hljs-attr\"&gt;gateway:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;routing:&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;\"*\":&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;claude&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;implementer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;claude-write&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;fresh_implementer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;claude-write&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;indexer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;claude-index&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;models:&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;reviewer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;claude-sonnet-5&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"375\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-375\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-375\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-375.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"example-codex\"&gt;&lt;a href=\"en/config/models.html#example-codex\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Everything on Codex&lt;/span&gt;&lt;/a&gt;Everything on Codex&lt;/h3&gt;\n&lt;p&gt;Needs a Codex login. Both implementer roles use &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c033ep3y\"&gt;gpt-5.6-terra&lt;/code&gt; instead of the default model.&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;theia.dev/v1alpha1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Policy&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;local&lt;/span&gt; }\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;run:&lt;/span&gt; {}\n  &lt;span class=\"hljs-attr\"&gt;gateway:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;routing:&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;\"*\":&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;codex&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;implementer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;codex-write&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;fresh_implementer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;codex-write&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;reviewer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;codex-terra&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;models:&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;implementer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;gpt-5.6-terra&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;fresh_implementer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;gpt-5.6-terra&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"382\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-382\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-382\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-382.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"example-mixed\"&gt;&lt;a href=\"en/config/models.html#example-mixed\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Mixed: Codex writes, Claude reviews&lt;/span&gt;&lt;/a&gt;Mixed: Codex writes, Claude reviews&lt;/h3&gt;\n&lt;p&gt;Needs both logins. Codex writes the code, Claude Code reviews it and builds the code index.&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;theia.dev/v1alpha1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Policy&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;local&lt;/span&gt; }\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;run:&lt;/span&gt; {}\n  &lt;span class=\"hljs-attr\"&gt;gateway:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;routing:&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;\"*\":&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;codex&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;implementer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;codex-write&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;fresh_implementer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;codex-write&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;reviewer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;claude&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;indexer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;claude-index&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;models:&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;reviewer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;claude-opus-5&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;indexer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;claude-sonnet-5&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"389\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-389\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-389\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-389.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;After a change, check the logins with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-plnjig3r\"&gt;theia doctor&lt;/code&gt; and look at the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f58f39n1\"&gt;gateway&lt;/code&gt; lines of the next run. See &lt;a href=\"en/config/models.html#check\"&gt;How to check&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"gateway-models\"&gt;&lt;a href=\"en/config/models.html#gateway-models\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Model per role&lt;/span&gt;&lt;/a&gt;Model per role&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-acq24xaf\"&gt;gateway.models&lt;/code&gt; maps a role to a model id:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;spec:\n  gateway:\n    models:\n      &amp;lt;role&amp;gt;: &amp;lt;model id&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"399\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-399\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-399\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-399.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;The key is a role, not a transport. Two roles on one transport can use different models.&lt;/li&gt;\n&lt;li&gt;A role without an entry uses the default model of its transport (see &lt;a href=\"en/config/models.html#transports\"&gt;Transports&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;Theia passes the id to the CLI unchanged:\n&lt;ul&gt;\n&lt;li&gt;Claude Code: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zeo0zk75\"&gt;claude -p … --model &amp;lt;model id&amp;gt;&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;Codex: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2gwj2wwe\"&gt;codex exec … -m &amp;lt;model id&amp;gt;&lt;/code&gt;; when Codex continues a saved session: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zu7ccdo1\"&gt;-c model=\"&amp;lt;model id&amp;gt;\"&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;li&gt;Theia does not check the id. A wrong id fails inside the CLI when the call starts. Which ids work is decided by the CLI and your account.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"switch-harness\"&gt;&lt;a href=\"en/config/models.html#switch-harness\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Switch the harness of an existing store&lt;/span&gt;&lt;/a&gt;Switch the harness of an existing store&lt;/h2&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Running &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zlo99uex\"&gt;theia init --harness claude&lt;/code&gt; in an existing store does not switch it. The command prints &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-the58dc4\"&gt;harness: claude&lt;/code&gt;, but &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oof8qiy3\"&gt;policy.yaml&lt;/code&gt; stays as it was.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Edit &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v6v4g7qa\"&gt;.theia/config/policy.yaml&lt;/code&gt; instead. From Codex to Claude:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs diff\"&gt;     routing:\n&lt;span class=\"hljs-deletion\"&gt;-      \"*\": codex&lt;/span&gt;\n&lt;span class=\"hljs-deletion\"&gt;-      implementer: codex-write&lt;/span&gt;\n&lt;span class=\"hljs-deletion\"&gt;-      fresh_implementer: codex-write&lt;/span&gt;\n&lt;span class=\"hljs-deletion\"&gt;-      reviewer: codex-terra&lt;/span&gt;\n&lt;span class=\"hljs-addition\"&gt;+      \"*\": claude&lt;/span&gt;\n&lt;span class=\"hljs-addition\"&gt;+      implementer: claude-write&lt;/span&gt;\n&lt;span class=\"hljs-addition\"&gt;+      fresh_implementer: claude-write&lt;/span&gt;\n&lt;span class=\"hljs-addition\"&gt;+      indexer: claude-index&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"450\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-450\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-450\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-450.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hfbi6ew1\"&gt;registry.yaml&lt;/code&gt; already lists both families, so nothing else must change. Remove &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mla7ekfg\"&gt;gateway.models&lt;/code&gt; entries that name models of the other family. Then check that the CLI you need is logged in:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;theia doctor\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"454\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-454\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-454\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-454.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"harness-config\"&gt;&lt;a href=\"en/config/models.html#harness-config\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Per-call Codex settings&lt;/span&gt;&lt;/a&gt;Per-call Codex settings&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6yi45f7k\"&gt;gateway.harnessConfig&lt;/code&gt; adds Codex settings to every call of a role. Theia passes each pair as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-suexybgp\"&gt;codex exec -c &amp;lt;key&amp;gt;=&amp;lt;value&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;theia.dev/v1alpha1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Policy&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;local&lt;/span&gt; }\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;run:&lt;/span&gt; {}\n  &lt;span class=\"hljs-attr\"&gt;gateway:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;routing:&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;\"*\":&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;codex&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;implementer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;codex-write&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;fresh_implementer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;codex-write&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;reviewer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;codex-terra&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;harnessConfig:&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;arbiter:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;model_reasoning_effort:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;low&lt;/span&gt; }\n      &lt;span class=\"hljs-attr\"&gt;indexer:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;model_reasoning_effort:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;low&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"461\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-461\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-461\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-461.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;The example asks Codex for low reasoning effort in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mo2zd48s\"&gt;arbiter&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmrx4z18\"&gt;indexer&lt;/code&gt; roles.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;ul&gt;\n&lt;li&gt;Only Codex transports use &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ff0krbsp\"&gt;gateway.harnessConfig&lt;/code&gt;. Claude transports ignore it.&lt;/li&gt;\n&lt;li&gt;Theia does not check keys or values. Codex decides whether they are valid. Use only keys from the Codex documentation for your Codex version.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;A root can add its own values in its &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fxbo5u9d\"&gt;.theia/config/&lt;/code&gt;. See &lt;a href=\"en/config/rules-prompts.html#root-overlays\"&gt;Rules for one root&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"cost\"&gt;&lt;a href=\"en/config/models.html#cost\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Cost and budget&lt;/span&gt;&lt;/a&gt;Cost and budget&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Theia prices every model call and adds the prices up. The &lt;a href=\"en/glossary.html#budget\"&gt;budget&lt;/a&gt; of a run is 10 US dollars by default. It is set by &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hq8wf5r1\"&gt;run.maxUsdPerRun&lt;/code&gt; (see &lt;a href=\"en/config/policy.html#run-limits\"&gt;policy.yaml settings&lt;/a&gt;) or by &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ivmyr42p\"&gt;theia run --budget&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Claude calls count at list price. Theia takes the price from Claude Code's own report, also when you pay with a subscription. A long run can pause on budget although your subscription costs nothing extra.&lt;/li&gt;\n&lt;li&gt;Codex reports only tokens. Theia prices them by a built-in table: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v66vrnd9\"&gt;gpt-5.6-luna&lt;/code&gt; 0.20 and 1.20, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cpvzb5mo\"&gt;gpt-5.6-terra&lt;/code&gt; 2 and 12 US dollars per million input and output tokens. A model that is not in the table costs 0 in the accounting.&lt;/li&gt;\n&lt;li&gt;When the budget runs out, the run pauses. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v5kwbec3\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt; continues it with the budget that is left; add &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zyicprlc\"&gt;--budget &amp;lt;N&amp;gt;&lt;/code&gt; to set a new budget, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2wcrkwpd\"&gt;0&lt;/code&gt; removes the limit. See &lt;a href=\"en/guides/control-run.html\"&gt;Control a run&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;If a subscription run keeps pausing on budget:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Raise &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bvy4ajuo\"&gt;run.maxUsdPerRun&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e28oexu0\"&gt;policy.yaml&lt;/code&gt; or in your user folder.&lt;/li&gt;\n&lt;li&gt;Start the run with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bccwsgka\"&gt;--budget 0&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Count Claude calls as free with a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-njfxuhns\"&gt;Pricing&lt;/code&gt; manifest (below).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Pricing manifest: count Claude calls as free&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Save it as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pw8yygzh\"&gt;.theia/config/pricing.yaml&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;theia.dev/v1alpha1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Pricing&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;subscription&lt;/span&gt; }\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;models:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;claude-opus-5:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;inPerMTok:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;, &lt;span class=\"hljs-attr\"&gt;outPerMTok:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;, &lt;span class=\"hljs-attr\"&gt;cacheReadPerMTok:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt; }\n    &lt;span class=\"hljs-attr\"&gt;claude-sonnet-5:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;inPerMTok:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;, &lt;span class=\"hljs-attr\"&gt;outPerMTok:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt;, &lt;span class=\"hljs-attr\"&gt;cacheReadPerMTok:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;0&lt;/span&gt; }\n  &lt;span class=\"hljs-attr\"&gt;transports:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;claude:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;costBasis:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;actual&lt;/span&gt; }\n    &lt;span class=\"hljs-attr\"&gt;claude-write:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;costBasis:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;actual&lt;/span&gt; }\n    &lt;span class=\"hljs-attr\"&gt;claude-index:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;costBasis:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;actual&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"540\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-540\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-540\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-540.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-95jays68\"&gt;models&lt;/code&gt; — prices in US dollars per million tokens, by model id. The keys are model ids, not transport names.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qv8pwer4\"&gt;transports&lt;/code&gt; — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-raxu8kvp\"&gt;costBasis: actual&lt;/code&gt; tells Theia to use these prices instead of Claude Code's report.&lt;/li&gt;\n&lt;li&gt;List every Claude model you use. A model without a price keeps Claude Code's figure.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;This file loads without errors. Its effect on real Claude calls was not checked.&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"config-pauses\"&gt;&lt;a href=\"en/config/models.html#config-pauses\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Runs paused by settings&lt;/span&gt;&lt;/a&gt;Runs paused by settings&lt;/h2&gt;\n&lt;p&gt;Some setting problems do not stop the command at once. The run tries the step three times in a row, then pauses. This happens when:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;a role has no route, or its route names a transport that is not registered;&lt;/li&gt;\n&lt;li&gt;the task text contains a secret (see &lt;a href=\"en/config/keys.html#masking\"&gt;Data protection in requests&lt;/a&gt;);&lt;/li&gt;\n&lt;li&gt;the text added to a prompt is longer than &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e0orqo21\"&gt;run.contextRefuseChars&lt;/code&gt; (see &lt;a href=\"en/config/policy.html#run-context\"&gt;policy.yaml settings&lt;/a&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;theia run exits with code 0&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;When the problem hits every role that has to work, the run &lt;a href=\"en/glossary.html#paused\"&gt;pauses&lt;/a&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ezzqjrk\"&gt;theia run&lt;/code&gt; exits with code 0. In scripts check the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6qkg8fov\"&gt;halted:&lt;/code&gt; line, not only the exit code. When other roles still work, the task ends as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bpulpj0s\"&gt;discarded&lt;/code&gt; and the exit code is 1.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Example output (no &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fay3cio3\"&gt;\"*\"&lt;/code&gt; route):&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;s2kn3t6f !! anomaly    environment_failure taskId=2akdqk6fy22235tie77psc role=lead phase=escalated reason=gateway fatal: gateway: no route for ro…\ntkpufktf !! anomaly    dispatch_stalled taskId=2akdqk6fy22235tie77psc consecutive=3\nto3ersnm run.paused    rounds=5 (resumable)\nhalted: paused · 1 gateway calls · $0.0000 · !! 4 anomalies\npaused — resume with: theia run --resume run2akdqk6fgw2235sabsuw3u\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"599\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-599\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-599\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-599.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Fix the file, then continue the same run:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia run --resume &amp;lt;runId&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"603\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-603\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-603\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-603.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Example output after the fix:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;resuming run run2akdqk6fgw2235sabsuw3u (paused; budget 10.00 usd remaining)\nksssgvgq gateway       lead@fake → ok $0.0000\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"607\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-607\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-607\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-607.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"check\"&gt;&lt;a href=\"en/config/models.html#check\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How to check&lt;/span&gt;&lt;/a&gt;How to check&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Logins: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ztlnmzd\"&gt;theia doctor&lt;/code&gt; shows whether &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dww9mqil\"&gt;codex&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f6sxc3cm\"&gt;claude&lt;/code&gt; are logged in. It does not show routing. See &lt;a href=\"en/reference/doctor.html#doctor\"&gt;theia doctor&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Transport of every call: the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a9784j87\"&gt;gateway&lt;/code&gt; lines of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w1ck8l6i\"&gt;theia run --plain&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mukhdo13\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt; print &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4o541x9l\"&gt;role@transport&lt;/code&gt;. See &lt;a href=\"en/config/overview.html#check-routing\"&gt;What a role really uses&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Model: the TUI shows the model next to the role only when &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fzb2xlvp\"&gt;gateway.models&lt;/code&gt; sets it for that role. Without an entry the role uses the default model of its transport.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;details class=\"yfm-cut\"&gt;&lt;summary class=\"yfm-cut-title\"&gt;Model of every call, read from the store&lt;/summary&gt;&lt;div class=\"yfm-cut-content\"&gt;&lt;p&gt;Needs &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xsj4kaz8\"&gt;sqlite3&lt;/code&gt;. Run it in the folder that holds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jm3h4o04\"&gt;.theia&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;sqlite3 .theia/store.db &lt;span class=\"hljs-string\"&gt;\"select json_extract(payload,'\\$.role'), json_extract(payload,'\\$.transport'), json_extract(payload,'\\$.model') from events where type='gateway.call' order by id desc limit 10\"&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"636\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-636\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-636\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-636.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Every line is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j87978es\"&gt;role|transport|model&lt;/code&gt;, newest first. An empty model means the default model of the transport.&lt;/p&gt;\n&lt;p&gt;Example output:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;reviewer|fake|\nimplementer|fake|\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"643\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-643\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-643\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-643.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"see-also\"&gt;&lt;a href=\"en/config/models.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;See also&lt;/span&gt;&lt;/a&gt;See also&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/config/keys.html\"&gt;Keys and access&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/config/policy.html\"&gt;policy.yaml settings&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/config/overview.html\"&gt;Settings files&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/config/sandbox.html\"&gt;Sandbox&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/reference/init.html#init\"&gt;theia init&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/reference/run.html#run\"&gt;theia run&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/config/models.html","hreflang":"en"},{"href":"ru/config/models.html","hreflang":"ru"}],"style":["_assets/theia.css"],"script":[],"canonical":"en/config/models.html","vcsPath":"en/config/models.md"},"headings":[{"title":"How Theia picks a model","href":"en/config/models.html#how-it-works","level":2},{"title":"Roles","href":"en/config/models.html#roles","level":2},{"title":"Transports","href":"en/config/models.html#transports","level":2},{"title":"Harness at init","href":"en/config/models.html#harness","level":2},{"title":"Examples","href":"en/config/models.html#examples","level":2,"items":[{"title":"Everything on Claude","href":"en/config/models.html#example-claude","level":3},{"title":"Everything on Codex","href":"en/config/models.html#example-codex","level":3},{"title":"Mixed: Codex writes, Claude reviews","href":"en/config/models.html#example-mixed","level":3}]},{"title":"Model per role","href":"en/config/models.html#gateway-models","level":2},{"title":"Switch the harness of a
