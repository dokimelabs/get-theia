            {"data":{"leading":false,"html":"&lt;p&gt;Theia has no model of its own. It gives every step of a task to an agent CLI on your machine: Claude Code (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z4afsxi1\"&gt;claude&lt;/code&gt;) or Codex (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e8z8sm5z\"&gt;codex&lt;/code&gt;). This page shows how to choose the CLI and the model for each role, with examples that load in Theia 0.2.201.&lt;/p&gt;\n&lt;h2 id=\"how-it-works\"&gt;&lt;a href=\"en/config/models.html#how-it-works\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How Theia picks a model&lt;/span&gt;&lt;/a&gt;How Theia picks a model&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Every step of a &lt;a href=\"en/glossary.html#run\"&gt;run&lt;/a&gt; belongs to a &lt;a href=\"en/glossary.html#role\"&gt;role&lt;/a&gt;. For example, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-orime31d\"&gt;implementer&lt;/code&gt; writes code and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0u53ysn\"&gt;reviewer&lt;/code&gt; reviews it.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-no7j80ol\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4gx4uyp6\"&gt;policy.yaml&lt;/code&gt; maps each role to a &lt;a href=\"en/glossary.html#transport\"&gt;transport&lt;/a&gt;. A transport is a named way to call a model: which CLI, which default model and how much access.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#gateway-models\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k8qzof21\"&gt;gateway.models&lt;/code&gt;&lt;/a&gt; can set a different model for a role.&lt;/li&gt;\n&lt;li&gt;The transport starts the CLI with your subscription login. Logins are described in &lt;a href=\"en/config/keys.html\"&gt;Keys and access&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;A route may point only to a transport listed in a &lt;a href=\"en/glossary.html#transport-registry\"&gt;TransportRegistry&lt;/a&gt; manifest. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o12vcvh0\"&gt;theia init&lt;/code&gt; writes &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pj63hljr\"&gt;.theia/config/registry.yaml&lt;/code&gt; with every Claude and Codex transport except &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sfvq7b5x\"&gt;codex-full&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"roles\"&gt;&lt;a href=\"en/config/models.html#roles\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Roles&lt;/span&gt;&lt;/a&gt;Roles&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Role&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;th&gt;When it calls a model&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ozdgpga\"&gt;lead&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;decides what to do with a stuck task&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-81wwract\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/glossary.html#planner\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kmeu568u\"&gt;planner&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;splits work into tasks&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mriqbnte\"&gt;theia plan&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d1pfgxiu\"&gt;theia run&lt;/code&gt; for tasks on the &lt;a href=\"en/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eoowpxwp\"&gt;full_spec&lt;/code&gt;&lt;/a&gt; track&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n2z2rs58\"&gt;implementer&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;changes code&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tp6na5mn\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qujqseon\"&gt;fresh_implementer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;a fresh attempt after two tries of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t9h9ndmn\"&gt;implementer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ygtc988h\"&gt;theia run&lt;/code&gt;. Without its own route it uses the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qk6f6yja\"&gt;implementer&lt;/code&gt; route, not &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gqo2zjop\"&gt;\"*\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/glossary.html#verifier\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bv847n8z\"&gt;verifier&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;checks the result&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vownujel\"&gt;theia run&lt;/code&gt;, only when the task has no &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u7dvc8pb\"&gt;--verify&lt;/code&gt; commands&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/glossary.html#reviewer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n5tr553h\"&gt;reviewer&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;reviews the change&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ws2wa0yk\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/glossary.html#arbiter\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pyyw9gdt\"&gt;arbiter&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;decides after a failed step&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-utro36nn\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/glossary.html#merger\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vyte2xu0\"&gt;merger&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;merges a task into the run branch&lt;/td&gt;\n&lt;td&gt;never: Theia merges with git&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;a href=\"en/glossary.html#indexer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m5sswa37\"&gt;indexer&lt;/code&gt;&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;writes cards for the code index&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kbpd50ue\"&gt;theia index build&lt;/code&gt; and automatic index builds&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hc6j2qmj\"&gt;extractor&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;summarizes memory&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sspyu2t6\"&gt;theia mem maintain --llm&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2kfhfqnl\"&gt;diagnostician&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;never in 0.2.201: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y1450t32\"&gt;theia diagnose&lt;/code&gt; works by fixed rules&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-out517je\"&gt;none&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;one-off questions&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2brdaqyq\"&gt;theia ask&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-56mfw9kh\"&gt;theia probe&lt;/code&gt;. Uses &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-egvnncss\"&gt;routing.none&lt;/code&gt; if set, otherwise &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6kvh4puk\"&gt;\"*\"&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dkyu6444\"&gt;\"*\"&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9aohmd3e\"&gt;gateway.routing&lt;/code&gt; is the route for every role that has no entry of its own.&lt;/p&gt;\n&lt;h2 id=\"transports\"&gt;&lt;a href=\"en/config/models.html#transports\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Transports&lt;/span&gt;&lt;/a&gt;Transports&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Transport&lt;/th&gt;\n&lt;th&gt;CLI&lt;/th&gt;\n&lt;th&gt;Default model&lt;/th&gt;\n&lt;th&gt;Access&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wmtzja6k\"&gt;claude&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9bvzvk15\"&gt;claude&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6hrkpmp\"&gt;claude-opus-5&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;reads files and runs commands: tools &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tvlm3qob\"&gt;Bash Read Grep Glob&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o60gvdxt\"&gt;claude-write&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fhgv2xb0\"&gt;claude&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1w3q3sul\"&gt;claude-opus-5&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;also edits files: mode &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2bqn3g38\"&gt;acceptEdits&lt;/code&gt;, tools &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lpmm8fhs\"&gt;Bash Read Grep Glob Edit Write&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0jth2rc9\"&gt;claude-index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8a9wbool\"&gt;claude&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-53uacka1\"&gt;claude-sonnet-5&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;no tools, thinking turned off; made for the code index&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6edrlh3h\"&gt;codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nrkaizgl\"&gt;codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nj8kgjzj\"&gt;gpt-5.6-luna&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;read-only sandbox&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z1vhb6s3\"&gt;codex-terra&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g9jlcboi\"&gt;codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3r5d9i95\"&gt;gpt-5.6-terra&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;read-only sandbox&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a9xaydsa\"&gt;codex-write&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3hnqxt9z\"&gt;codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3g35n135\"&gt;gpt-5.6-luna&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;may write in the task copy (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ps0c8o3u\"&gt;workspace-write&lt;/code&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e1ugda3f\"&gt;codex-full&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hzgfqmcp\"&gt;codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ucw6vgfs\"&gt;gpt-5.6-luna&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;full access to your machine; not in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kqxm26on\"&gt;registry.yaml&lt;/code&gt; by default&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-itsqb317\"&gt;codex-jailed&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1dxlevxr\"&gt;codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fzrht3in\"&gt;gpt-5.6-luna&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;full access inside a jail&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;ul&gt;\n&lt;li&gt;Roles that change code (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6txv5lj7\"&gt;implementer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9bq0jdb0\"&gt;fresh_implementer&lt;/code&gt;) need a write transport: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tqijq8jy\"&gt;claude-write&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wi2603bo\"&gt;codex-write&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j983gc3k\"&gt;codex-full&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j2te4cch\"&gt;codex-jailed&lt;/code&gt; belong to sandbox tiers. See &lt;a href=\"en/config/sandbox.html\"&gt;Sandbox&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Theia 0.2.201 has no other providers: no direct API calls and no other agent CLIs.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"harness\"&gt;&lt;a href=\"en/config/models.html#harness\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Harness at init&lt;/span&gt;&lt;/a&gt;Harness at init&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o8f2rlog\"&gt;theia init --harness claude&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-45m8cc7r\"&gt;theia init --harness codex&lt;/code&gt; chooses the &lt;a href=\"en/glossary.html#harness\"&gt;harness&lt;/a&gt; of a new store. Both write the same &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cxxmnku4\"&gt;registry.yaml&lt;/code&gt;. Only &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tw9tc1ur\"&gt;gateway.routing&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zydqizls\"&gt;policy.yaml&lt;/code&gt; differs:&lt;/p&gt;\n&lt;div class=\"yfm-tabs\" data-diplodoc-group=\"defaultTabs
