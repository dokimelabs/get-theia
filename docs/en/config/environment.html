        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Environment variables that change how &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-atd7tihw\"&gt;theia&lt;/code&gt; works, with their default and who reads them. At the end there is a short list of names from tests and release scripts that you can ignore.&lt;/p&gt;\n&lt;h2 id=\"user-variables\"&gt;&lt;a href=\"en/config/environment.html#user-variables\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Variables you can set&lt;/span&gt;&lt;/a&gt;Variables you can set&lt;/h2&gt;\n&lt;h3 id=\"keys-versions\"&gt;&lt;a href=\"en/config/environment.html#keys-versions\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Keys and versions&lt;/span&gt;&lt;/a&gt;Keys and versions&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Variable&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;th&gt;When not set&lt;/th&gt;\n&lt;th&gt;Read by&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rd7tl1ci\"&gt;THEIA_GH_TOKEN&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;GitHub token (&lt;a href=\"en/glossary.html#pat\"&gt;PAT&lt;/a&gt;). Wins over &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pu87l3dp\"&gt;github.pat&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sku7tylc\"&gt;config.yaml&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;the saved token&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zjmecyyh\"&gt;theia self update&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9fk7mysd\"&gt;--x-release&lt;/code&gt;, the daily update check, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jbdxicay\"&gt;theia doctor&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iy5qlb34\"&gt;OPENAI_API_KEY&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;OpenAI key for embeddings with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d4qcvc4o\"&gt;provider: openai&lt;/code&gt;. Wins over &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sa7d9phb\"&gt;openai.apiKey&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e0z5uwia\"&gt;config.yaml&lt;/code&gt;. When it is set, the setup wizard does not ask for a key.&lt;/td&gt;\n&lt;td&gt;the saved key&lt;/td&gt;\n&lt;td&gt;commands that build or search embeddings, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v9kjkihz\"&gt;theia doctor&lt;/code&gt;, the setup wizard&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3nl0v9a1\"&gt;THEIA_X_RELEASE&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Starts another Theia version, like the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-legkh7vp\"&gt;--x-release&lt;/code&gt; flag. The flag wins.&lt;/td&gt;\n&lt;td&gt;the running version&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b65j78i1\"&gt;theia&lt;/code&gt;, before any command&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;A wrong &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j8bhgg9h\"&gt;THEIA_X_RELEASE&lt;/code&gt; value stops every command, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-46qhazgv\"&gt;theia version&lt;/code&gt; included:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;invalid release version 'bogus' (expected e.g. 1.2.3 or v1.2.3)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"74\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-74\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-74\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-74.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Keys are described in &lt;a href=\"en/config/keys.html\"&gt;Keys and access&lt;/a&gt;, other versions in &lt;a href=\"en/install/update.html\"&gt;Update&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"folders\"&gt;&lt;a href=\"en/config/environment.html#folders\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Folders&lt;/span&gt;&lt;/a&gt;Folders&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Variable&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;th&gt;When not set&lt;/th&gt;\n&lt;th&gt;Read by&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-16jhwnqn\"&gt;XDG_CONFIG_HOME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The settings folder becomes &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l9i425ci\"&gt;$XDG_CONFIG_HOME/theia&lt;/code&gt; on every system.&lt;/td&gt;\n&lt;td&gt;see &lt;a href=\"en/config/overview.html#user-folder\"&gt;Your user folder&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;all commands&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xc80hle7\"&gt;XDG_DATA_HOME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The data folder becomes &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lz4165h7\"&gt;$XDG_DATA_HOME/theia&lt;/code&gt;: stores of folders outside git, vendor files.&lt;/td&gt;\n&lt;td&gt;Linux &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ln39ef80\"&gt;~/.local/share/theia&lt;/code&gt;, macOS &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-67vhh5co\"&gt;~/Library/Application Support/theia&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;all commands&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-esddcs4l\"&gt;XDG_CACHE_HOME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The cache folder becomes &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-msjseg1n\"&gt;$XDG_CACHE_HOME/theia&lt;/code&gt;: local models, index cache, downloaded versions.&lt;/td&gt;\n&lt;td&gt;Linux &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ota4mpu8\"&gt;~/.cache/theia&lt;/code&gt;, macOS &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zo02ulca\"&gt;~/Library/Caches/theia&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;all commands&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-imjowy0d\"&gt;APPDATA&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ekxrqnur\"&gt;LOCALAPPDATA&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Windows base folders for settings, data and cache.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h3ny20dd\"&gt;~\\AppData\\Roaming&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qnjjioge\"&gt;~\\AppData\\Local&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;all commands on Windows&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2n08n3qo\"&gt;THEIA_MODELS_DIR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Folder for local embedding models.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w3t14t8p\"&gt;models&lt;/code&gt; in the cache folder&lt;/td&gt;\n&lt;td&gt;embeddings, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fralqhe4\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qlxmgzdc\"&gt;theia setup --fetch-embeddings&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-guwphbx6\"&gt;THEIA_INDEX_CACHE_DIR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Folder of the shared index cache.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uxefwiz7\"&gt;index-cache&lt;/code&gt; in the cache folder&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b3kjuad3\"&gt;theia index build&lt;/code&gt; and automatic index builds&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o6rsvkqc\"&gt;HF_ENDPOINT&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Hugging Face mirror to download local embedding models from.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3g2ydbg3\"&gt;https://huggingface.co&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;model download&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;On macOS the old folders &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ecliafd8\"&gt;~/.local/share/theia&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6n7q4pcx\"&gt;~/.cache/theia&lt;/code&gt; win when they exist and the new folders do not, the same way as for settings. The installer creates &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4j2juinz\"&gt;~/.local/share/theia&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"output\"&gt;&lt;a href=\"en/config/environment.html#output\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Output and logs&lt;/span&gt;&lt;/a&gt;Output and logs&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Variable&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;th&gt;When not set&lt;/th&gt;\n&lt;th&gt;Read by&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oi3l46fy\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8js086qm\"&gt;theia run&lt;/code&gt; appends every event to this file: the same line as in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0n2bfj3s\"&gt;--plain&lt;/code&gt;, and under it a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lly72t23\"&gt;⤷&lt;/code&gt; line with the event details as JSON. Useful while the TUI takes the screen. If the file cannot be created, for example the folder does not exist, Theia says nothing: the run goes on, there is no log.&lt;/td&gt;\n&lt;td&gt;no file&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kjhgxscd\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mf3fgxkj\"&gt;THEIA_NO_SPINNER&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Static symbols instead of animation. Same as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d4s7jkrf\"&gt;theia run --no-spinner&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;animation&lt;/td&gt;\n&lt;td&gt;the TUI of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6x6l0zx8\"&gt;theia run&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-etqkzg4h\"&gt;theia show&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m2jfr6r4\"&gt;NO_COLOR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Turns colors off.&lt;/td&gt;\n&lt;td&gt;colors&lt;/td&gt;\n&lt;td&gt;the TUI and the home screen&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vzbvqzof\"&gt;EDITOR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Program that opens a stored prompt or command output from the TUI. It may contain arguments, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7nd5kf4q\"&gt;code --wait&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m19al2x5\"&gt;less&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;the TUI&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zbzbydur\"&gt;THEIA_LOG_FILE&lt;/code&gt; syntax:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;THEIA_LOG_FILE=&amp;lt;file&amp;gt; theia run --task \"&amp;lt;text&amp;gt;\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"284\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-284\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-284\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-284.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-053242s8\"&gt;&amp;lt;file&amp;gt;&lt;/code&gt; — the log file. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sag14p9w\"&gt;&amp;lt;text&amp;gt;&lt;/code&gt; — the task.&lt;/p&gt;\n&lt;p&gt;Example: the first lines of the file. The header names the run and its start time, then come pairs of lines \"event — details\":&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;# theia run run2akec65qow2222b6kma2mn — 2026-09-15T07:55:37.623Z\nawcfkaqm run.created   budget=$10 track=fast_path\n  ⤷ {\"task\":\"t\",\"planId\":null,\"track\":\"fast_path\",\"trackOverride\":null,\"budgetUsd\":10,\"verify\":[\"true\"],\"record\":false,\"branch\":\"theia/run-kma2mn\",\"baseSha\":\"725a78e07c76216af93039fa26c41df48d5ff7c6\"}\na35avm37 task.created  ah45rvrt [fast_path] t\n  ⤷ {\"taskId\":\"2akec65r6c2222ah45rvrt\",\"desc\":\"t\",\"track\":\"fast_path\",\"depth\":0,\"deps\":[]}\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"291\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-291\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-291\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-291.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6rzhmurl\"&gt;⤷&lt;/code&gt; lines exist only in the log; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-agmzhegy\"&gt;--plain&lt;/code&gt; does not print them. After the run, check that the file exists: with an unreachable path there is none.&lt;/p&gt;\n&lt;h3 id=\"other-tools\"&gt;&lt;a href=\"en/config/environment.html#other-tools\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Other tools&lt;/span&gt;&lt;/a&gt;Other tools&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Variable&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;th&gt;When not set&lt;/th&gt;\n&lt;th&gt;Read by&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yf35ir3t\"&gt;CODEX_HOME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Codex's own folder. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-039liu8v\"&gt;theia doctor&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2lng2lz7\"&gt;theia hooks install codex --trust&lt;/code&gt; look for &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rt5y76vv\"&gt;config.toml&lt;/code&gt; there.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-doh0syma\"&gt;~/.codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Codex, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lr9uky4b\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ikgoetlh\"&gt;theia hooks install codex&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g9xjcw1u\"&gt;THEIA_BASH&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Windows: the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m3t7jk4f\"&gt;bash.exe&lt;/code&gt; that Theia runs commands with.&lt;/td&gt;\n&lt;td&gt;Git Bash, found automatically&lt;/td&gt;\n&lt;td&gt;all commands on Windows&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jzkbhebd\"&gt;OTEL_EXPORTER_OTLP_ENDPOINT&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Sends traces and metrics to an OpenTelemetry collector. See &lt;a href=\"en/integrations/observability.html\"&gt;Metrics and tracing&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;no export&lt;/td&gt;\n&lt;td&gt;all commands&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p1fcd6jn\"&gt;OTEL_SERVICE_NAME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Service name in traces and metrics.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v9z8g9n1\"&gt;theia&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;all commands&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qhq1etbs\"&gt;THEIA_VENDOR_DIR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;For platform developers. Use this folder of prompts, rules and skills instead of the installed &lt;a href=\"en/glossary.html#vendor\"&gt;vendor files&lt;/a&gt;. A path that does not exist stops exactly these commands with exit code 1: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jslb8rig\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7dytz4dt\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4t5z8q98\"&gt;ask&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ocymagr\"&gt;probe&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gtn1k98v\"&gt;fork&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-toeq1k6x\"&gt;compare&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a23fv29o\"&gt;diagnose&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-an7c443a\"&gt;serve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-93lawra0\"&gt;eval&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1zmob2f1\"&gt;replay&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f09r5obj\"&gt;msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xnip0rqp\"&gt;answer&lt;/code&gt;. Others, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5sd7wt33\"&gt;theia index status&lt;/code&gt;, still work.&lt;/td&gt;\n&lt;td&gt;the installed files&lt;/td&gt;\n&lt;td&gt;the listed commands, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g7fg5myu\"&gt;theia doctor&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Message when the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oietfqcq\"&gt;THEIA_VENDOR_DIR&lt;/code&gt; path does not exist:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia: no vendor deliverables found (lib/vendor missing and no installed set) — reinstall via get-theia, or point THEIA_VENDOR_DIR at a vendor tree (THE-065)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"391\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-391\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-391\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-391.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"harness-env\"&gt;&lt;a href=\"en/config/environment.html#harness-env\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;What Theia changes for agent CLIs&lt;/span&gt;&lt;/a&gt;What Theia changes for agent CLIs&lt;/h2&gt;\n&lt;p&gt;Theia starts &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i41ikxwi\"&gt;claude&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1q0zal6h\"&gt;codex&lt;/code&gt; with its own environment, with these changes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oc7ytno7\"&gt;claude&lt;/code&gt; does not get &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lmtw2yyl\"&gt;ANTHROPIC_API_KEY&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-os69tj4a\"&gt;ANTHROPIC_AUTH_TOKEN&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gwc5os6i\"&gt;CLAUDECODE&lt;/code&gt; and any variable that starts with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h3r200fl\"&gt;CLAUDE_CODE_&lt;/code&gt;. So a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7cbbebis\"&gt;claude&lt;/code&gt; started by Theia from inside a Claude Code session starts clean.&lt;/li&gt;\n&lt;li&gt;For the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p19s0i4d\"&gt;claude-index&lt;/code&gt; transport Theia adds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v7guvkvy\"&gt;MAX_THINKING_TOKENS=0&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;All other variables reach &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xep5x5xl\"&gt;claude&lt;/code&gt; unchanged, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z8gbaj5p\"&gt;ANTHROPIC_BASE_URL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fyfqcmqe\"&gt;codex&lt;/code&gt; gets the environment unchanged, including &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rljiju1n\"&gt;CODEX_HOME&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ie9xb6we\"&gt;OPENAI_API_KEY&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"internal\"&gt;&lt;a href=\"en/config/environment.html#internal\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Internal names&lt;/span&gt;&lt;/a&gt;Internal names&lt;/h2&gt;\n&lt;p&gt;You may see these names in code, logs or scripts. Do not set them.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Tests, evaluation and the launcher: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lza50cqx\"&gt;THEIA_FAKE_RULEBOOK&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9p1424ig\"&gt;THEIA_LAUNCHER_HOP&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j2f417kz\"&gt;THEIA_SWEBL_NO_CAP&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0n7bvg5n\"&gt;THEIA_DATASETS_DIR&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qv1tetzm\"&gt;THEIA_LIVE_LOCAL_EMBED&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Theia sets them itself on Windows: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-phcbx0ig\"&gt;MSYS_NO_PATHCONV&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qa8j2v4g\"&gt;MSYS2_ARG_CONV_EXCL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Release scripts of the Theia team, not read by &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n0ife6pr\"&gt;theia&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-89vng2e3\"&gt;THEIA_BIN&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3q47qtni\"&gt;EXPECT_VERSION&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p7i3mz35\"&gt;GH_TOKEN&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xxz1nuh1\"&gt;RELEASES_PAT&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h2byfleh\"&gt;PUBLISH_TOKEN&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r0cu6e90\"&gt;THEIA_OAUTH_CLIENT_ID&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-51j39oap\"&gt;THEIA_BUILD_VERSION&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tpyx1k8n\"&gt;THEIA_SEA_NODE&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Read only by the installer script: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yu27aw0u\"&gt;THEIA_PAT&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-te9mw41e\"&gt;THEIA_VERSION&lt;/code&gt;. See &lt;a href=\"en/install/install.html\"&gt;Install&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Not environment variables at all: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0m9kz2qn\"&gt;THEIA_MCP_TOOLS&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k579io40\"&gt;THEIA_CONTROL_TOOLS&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kmk91mcv\"&gt;THEIA_SKILL&lt;/code&gt; are names inside the code (tool name lists and the text of the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9kjmwgtx\"&gt;/theia&lt;/code&gt; skill); &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z150vpje\"&gt;THEIA_PATCH_EOF&lt;/code&gt; is an end-of-text marker inside an evaluation script. Setting them changes nothing.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"en/config/environment.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;See also&lt;/span&gt;&lt;/a&gt;See also&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/config/keys.html\"&gt;Keys and access&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/config/overview.html\"&gt;Settings files&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/install/update.html\"&gt;Update&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/integrations/observability.html\"&gt;Metrics and tracing&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/config/environment.html","hreflang":"en"},{"href":"ru/config/environment.html","hreflang":"ru"}],"style":["_assets/theia.css"],"canonical":"en/config/environment.html","vcsPath":"en/config/environment.md"},"headings":[{"title":"Variables you can set","href":"en/config/environment.html#user-variables","level":2,"items":[{"title":"Keys and versions","href":"en/config/environment.html#keys-versions","level":3},{"title":"Folders","href":"en/config/environment.html#folders","level":3},{"title":"Output and logs","href":"en/config/environment.html#output","level":3},{"title":"Other tools","href":"en/config/environment.html#other-tools","level":3}]},{"title":"What Theia changes for agent CLIs","href":"en/config/environment.html#harness-env","level":2},{"title":"Internal names","href":"en/config/environment.html#internal","level":2},{"title":"See also","href":"en/config/environment.html#see-also","level":2}],"title":"Environment variables"},"router":{"pathname":"en/config/environment","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
