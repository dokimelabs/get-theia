            {"data":{"leading":false,"html":"&lt;p&gt;Environment variables that change how &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7hb83jng\"&gt;theia&lt;/code&gt; works, with their default and who reads them. At the end there is a short list of names from tests and release scripts that you can ignore.&lt;/p&gt;\n&lt;h2 id=\"user-variables\"&gt;&lt;a href=\"en/config/environment.html#user-variables\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Variables you can set&lt;/span&gt;&lt;/a&gt;Variables you can set&lt;/h2&gt;\n&lt;h3 id=\"keys-versions\"&gt;&lt;a href=\"en/config/environment.html#keys-versions\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Keys and versions&lt;/span&gt;&lt;/a&gt;Keys and versions&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Variable&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;th&gt;When not set&lt;/th&gt;\n&lt;th&gt;Read by&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xzhv528j\"&gt;THEIA_GH_TOKEN&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;GitHub token (&lt;a href=\"en/glossary.html#pat\"&gt;PAT&lt;/a&gt;). Wins over &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jfn4qyib\"&gt;github.pat&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2cbe4qgr\"&gt;config.yaml&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;the saved token&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eumuhaqr\"&gt;theia self update&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j7yhn5xo\"&gt;--x-release&lt;/code&gt;, the daily update check, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ixzukn9u\"&gt;theia doctor&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qlo7zwuy\"&gt;OPENAI_API_KEY&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;OpenAI key for embeddings with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jz5o5knt\"&gt;provider: openai&lt;/code&gt;. Wins over &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v2dxd59n\"&gt;openai.apiKey&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nddhupa7\"&gt;config.yaml&lt;/code&gt;. When it is set, the setup wizard does not ask for a key.&lt;/td&gt;\n&lt;td&gt;the saved key&lt;/td&gt;\n&lt;td&gt;commands that build or search embeddings, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-havb9n7a\"&gt;theia doctor&lt;/code&gt;, the setup wizard&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h49k5376\"&gt;THEIA_X_RELEASE&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Starts another Theia version, like the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0z954v10\"&gt;--x-release&lt;/code&gt; flag. The flag wins.&lt;/td&gt;\n&lt;td&gt;the running version&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ocuulm4\"&gt;theia&lt;/code&gt;, before any command&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;A wrong &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y7qymcvc\"&gt;THEIA_X_RELEASE&lt;/code&gt; value stops every command, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vxfc7qe9\"&gt;theia version&lt;/code&gt; included:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;invalid release version 'bogus' (expected e.g. 1.2.3 or v1.2.3)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"74\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-74\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-74\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-74.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Keys are described in &lt;a href=\"en/config/keys.html\"&gt;Keys and access&lt;/a&gt;, other versions in &lt;a href=\"en/install/update.html\"&gt;Update&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"folders\"&gt;&lt;a href=\"en/config/environment.html#folders\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Folders&lt;/span&gt;&lt;/a&gt;Folders&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Variable&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;th&gt;When not set&lt;/th&gt;\n&lt;th&gt;Read by&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ks9lv5ye\"&gt;XDG_CONFIG_HOME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The settings folder becomes &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p1jq2omq\"&gt;$XDG_CONFIG_HOME/theia&lt;/code&gt; on every system.&lt;/td&gt;\n&lt;td&gt;see &lt;a href=\"en/config/overview.html#user-folder\"&gt;Your user folder&lt;/a&gt;&lt;/td&gt;\n&lt;td&gt;all commands&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nuhsbp67\"&gt;XDG_DATA_HOME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The data folder becomes &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-txewg59e\"&gt;$XDG_DATA_HOME/theia&lt;/code&gt;: stores of folders outside git, vendor files.&lt;/td&gt;\n&lt;td&gt;Linux &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dogyvq3k\"&gt;~/.local/share/theia&lt;/code&gt;, macOS &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iwkvgonw\"&gt;~/Library/Application Support/theia&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;all commands&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ll6epzwr\"&gt;XDG_CACHE_HOME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The cache folder becomes &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qhgz1ld2\"&gt;$XDG_CACHE_HOME/theia&lt;/code&gt;: local models, index cache, downloaded versions.&lt;/td&gt;\n&lt;td&gt;Linux &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b9ffio2e\"&gt;~/.cache/theia&lt;/code&gt;, macOS &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2i484iap\"&gt;~/Library/Caches/theia&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;all commands&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xa6ud3qs\"&gt;APPDATA&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jzjlo2lb\"&gt;LOCALAPPDATA&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Windows base folders for settings, data and cache.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o0r3l8ww\"&gt;~\\AppData\\Roaming&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-amh05ohq\"&gt;~\\AppData\\Local&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;all commands on Windows&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83f3y1t5\"&gt;THEIA_MODELS_DIR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Folder for local embedding models.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sn2iaeez\"&gt;models&lt;/code&gt; in the cache folder&lt;/td&gt;\n&lt;td&gt;embeddings, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fphhb4zc\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ae5tyrp\"&gt;theia setup --fetch-embeddings&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2y8wkn9b\"&gt;THEIA_INDEX_CACHE_DIR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Folder of the shared index cache.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nm10mv7y\"&gt;index-cache&lt;/code&gt; in the cache folder&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aiemblby\"&gt;theia index build&lt;/code&gt; and automatic index builds&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z47n5g71\"&gt;HF_ENDPOINT&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Hugging Face mirror to download local embedding models from.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-omvjslj6\"&gt;https://huggingface.co&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;model download&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;On macOS the old folders &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gz12zux9\"&gt;~/.local/share/theia&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-229jiwgx\"&gt;~/.cache/theia&lt;/code&gt; win when they exist and the new folders do not, the same way as for settings. The installer creates &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e6830vnf\"&gt;~/.local/share/theia&lt;/code&gt;.&lt;/p&gt;\n&lt;h3 id=\"output\"&gt;&lt;a href=\"en/config/environment.html#output\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Output and logs&lt;/span&gt;&lt;/a&gt;Output and logs&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Variable&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;th&gt;When not set&lt;/th&gt;\n&lt;th&gt;Read by&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g8ne0o8k\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-udf28bb5\"&gt;theia run&lt;/code&gt; appends every event to this file: the same line as in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ampisx5j\"&gt;--plain&lt;/code&gt; plus the event details. Useful while the TUI takes the screen.&lt;/td&gt;\n&lt;td&gt;no file&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nkx0bz5z\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g8yks0gf\"&gt;THEIA_NO_SPINNER&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Static symbols instead of animation. Same as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1do36c9s\"&gt;theia run --no-spinner&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;animation&lt;/td&gt;\n&lt;td&gt;the TUI of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zrfye8ie\"&gt;theia run&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5xkvywfq\"&gt;theia show&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nreva1be\"&gt;NO_COLOR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Turns colors off.&lt;/td&gt;\n&lt;td&gt;colors&lt;/td&gt;\n&lt;td&gt;the TUI and the home screen&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ct4h1p5\"&gt;EDITOR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Program that opens a stored prompt or command output from the TUI. It may contain arguments, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hl5pmh39\"&gt;code --wait&lt;/code&gt;.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-npge1cz4\"&gt;less&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;the TUI&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-78g0ha3w\"&gt;THEIA_LOG_FILE&lt;/code&gt; syntax:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;THEIA_LOG_FILE=&amp;lt;file&amp;gt; theia run --task \"&amp;lt;text&amp;gt;\"\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"284\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-284\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-284\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-284.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eg0mx7n8\"&gt;&amp;lt;file&amp;gt;&lt;/code&gt; — the log file. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kkt3ezjz\"&gt;&amp;lt;text&amp;gt;&lt;/code&gt; — the task.&lt;/p&gt;\n&lt;p&gt;Example: the first lines of the file:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;# theia run run2akdqez4gw222h252vl64a — 2026-09-13T14:28:59.760Z\n3kcpsyae run.created   budget=$10 track=fast_path\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"291\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-291\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-291\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-291.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"other-tools\"&gt;&lt;a href=\"en/config/environment.html#other-tools\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Other tools&lt;/span&gt;&lt;/a&gt;Other tools&lt;/h3&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Variable&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;th&gt;When not set&lt;/th&gt;\n&lt;th&gt;Read by&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3jxisb0s\"&gt;CODEX_HOME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Codex's own folder. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5fh32dz9\"&gt;theia doctor&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9dtdw63w\"&gt;theia hooks install codex --trust&lt;/code&gt; look for &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z3j6ny0u\"&gt;config.toml&lt;/code&gt; there.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f33yubtj\"&gt;~/.codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Codex, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vilh5tlj\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4erre946\"&gt;theia hooks install codex&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9kac7824\"&gt;THEIA_BASH&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Windows: the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wokts0m7\"&gt;bash.exe&lt;/code&gt; that Theia runs commands with.&lt;/td&gt;\n&lt;td&gt;Git Bash, found automatically&lt;/td&gt;\n&lt;td&gt;all commands on Windows&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1r4wm2mg\"&gt;OTEL_EXPORTER_OTLP_ENDPOINT&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Sends traces and metrics to an OpenTelemetry collector. See &lt;a href=\"en/integrations/observability.html\"&gt;Metrics and tracing&lt;/a&gt;.&lt;/td&gt;\n&lt;td&gt;no export&lt;/td&gt;\n&lt;td&gt;all commands&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-423ey17o\"&gt;OTEL_SERVICE_NAME&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Service name in traces and metrics.&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lz1x7r0s\"&gt;theia&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;all commands&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-181mvzxy\"&gt;THEIA_VENDOR_DIR&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;For platform developers. Use this folder of prompts, rules and skills instead of the installed &lt;a href=\"en/glossary.html#vendor\"&gt;vendor files&lt;/a&gt;. A path that does not exist stops &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bp4w54mu\"&gt;theia run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8bayrzkt\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pep1t4s0\"&gt;ask&lt;/code&gt; and other commands that need prompts.&lt;/td&gt;\n&lt;td&gt;the installed files&lt;/td&gt;\n&lt;td&gt;commands that use prompts, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ox4q5yo\"&gt;theia doctor&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"harness-env\"&gt;&lt;a href=\"en/config/environment.html#harness-env\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;What Theia changes for agent CLIs&lt;/span&gt;&lt;/a&gt;What Theia changes for agent CLIs&lt;/h2&gt;\n&lt;p&gt;Theia starts &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-med3phlw\"&gt;claude&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3jnrjj6h\"&gt;codex&lt;/code&gt; with its own environment, with these changes:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-frlzooac\"&gt;claude&lt;/code&gt; does not get &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c0sr2xak\"&gt;ANTHROPIC_API_KEY&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-teydhtua\"&gt;ANTHROPIC_AUTH_TOKEN&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fqizw6c3\"&gt;CLAUDECODE&lt;/code&gt; and any variable that starts with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5gitt23\"&gt;CLAUDE_CODE_&lt;/code&gt;. So a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vv40292p\"&gt;claude&lt;/code&gt; started by Theia from inside a Claude Code session starts clean.&lt;/li&gt;\n&lt;li&gt;For the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xet4x3zt\"&gt;claude-index&lt;/code&gt; transport Theia adds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cmjwatb2\"&gt;MAX_THINKING_TOKENS=0&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;All other variables reach &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xf7iu266\"&gt;claude&lt;/code&gt; unchanged, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u7ewdpk2\"&gt;ANTHROPIC_BASE_URL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uhi4120h\"&gt;codex&lt;/code&gt; gets the environment unchanged, including &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ck5q02cl\"&gt;CODEX_HOME&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ywdcyv2v\"&gt;OPENAI_API_KEY&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"internal\"&gt;&lt;a href=\"en/config/environment.html#internal\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Internal names&lt;/span&gt;&lt;/a&gt;Internal names&lt;/h2&gt;\n&lt;p&gt;You may see these names in code, logs or scripts. Do not set them.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Tests, evaluation and the launcher: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cvt5ykrs\"&gt;THEIA_FAKE_RULEBOOK&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mcvx691n\"&gt;THEIA_LAUNCHER_HOP&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fz0k9afm\"&gt;THEIA_SWEBL_NO_CAP&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w1wtbc8s\"&gt;THEIA_DATASETS_DIR&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d2g183be\"&gt;THEIA_LIVE_LOCAL_EMBED&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Theia sets them itself on Windows: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pe6dhjzi\"&gt;MSYS_NO_PATHCONV&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wjb75f1g\"&gt;MSYS2_ARG_CONV_EXCL&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Release scripts of the Theia team, not read by &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5hxkexgl\"&gt;theia&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-55mwj10u\"&gt;THEIA_BIN&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-upjfda18\"&gt;EXPECT_VERSION&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hwf69qf4\"&gt;GH_TOKEN&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x15xwcnx\"&gt;RELEASES_PAT&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1i0r367c\"&gt;PUBLISH_TOKEN&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ye6lrrn\"&gt;THEIA_OAUTH_CLIENT_ID&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t3mfuc8s\"&gt;THEIA_BUILD_VERSION&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dly4ybhu\"&gt;THEIA_SEA_NODE&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Read only by the installer script: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o3f34vcz\"&gt;THEIA_PAT&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uptxu84s\"&gt;THEIA_VERSION&lt;/code&gt;. See &lt;a href=\"en/install/install.html\"&gt;Install&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Not environment variables at all: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rw044fqh\"&gt;THEIA_MCP_TOOLS&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-am3k6y52\"&gt;THEIA_CONTROL_TOOLS&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-urng5jp6\"&gt;THEIA_SKILL&lt;/code&gt; are names inside the code (tool name lists and the text of the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iha5vkb1\"&gt;/theia&lt;/code&gt; skill). Setting them changes nothing.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"en/config/environment.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;See also&lt;/span&gt;&lt;/a&gt;See also&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/config/keys.html\"&gt;Keys and access&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/config/overview.html\"&gt;Settings files&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/install/update.html\"&gt;Update&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/integrations/observability.html\"&gt;Metrics and tracing&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/config/environment.html","hreflang":"en"},{"href":"ru/config/environment.html","hreflang":"ru"}],"style":["_assets/theia.css"],"canonical":"en/config/environment.html","vcsPath":"en/config/environment.md"},"headings":[{"title":"Variables you can set","href":"en/config/environment.html#user-variables","level":2,"items":[{"title":"Keys and versions","href":"en/config/environment.html#keys-versions","level":3},{"title":"Folders","href":"en/config/environment.html#folders","level":3},{"title":"Output and logs","href":"en/config/environment.html#output","level":3},{"title":"Other tools","href":"en/config/environment.html#other-tools","level":3}]},{"title":"What Theia changes for agent CLIs","href":"en/config/environment.html#harness-env","level":2},{"title":"Internal names","href":"en/config/environment.html#internal","level":2},{"title":"See also","href":"en/config/environment.html#see-also","level":2}],"title":"Environment variables"},"router":{"pathname":"en/config/environment","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
