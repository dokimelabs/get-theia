        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;This is the guide to the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0bmqymw\"&gt;theia&lt;/code&gt; CLI, version 0.2.201. It shows how to install Theia, run a task, use the TUI screen, set up models and connect Theia to Claude Code and Codex.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Commands and arguments were checked on release 0.2.201 on macOS (Apple silicon). Commands that change data or call models ran in an isolated sandbox. Linux behaviour is described from the release source code. Where a command works differently from what &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t04pyyox\"&gt;theia help&lt;/code&gt; says, a warning sits next to it.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"quick-start\"&gt;&lt;a href=\"en/index.html#quick-start\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Quick start&lt;/span&gt;&lt;/a&gt;Quick start&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Install Theia — see &lt;a href=\"en/install/install.html\"&gt;Install&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Sign in to Claude Code or Codex and check your setup with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y2v2vxx1\"&gt;theia doctor&lt;/code&gt; — see &lt;a href=\"en/install/first-setup.html\"&gt;First setup&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Go to the root of your git repository and run &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q5zn1e0f\"&gt;theia init&lt;/code&gt; — same page.&lt;/li&gt;\n&lt;li&gt;Start a task with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hmjtdqwl\"&gt;theia run&lt;/code&gt; — see &lt;a href=\"en/guides/first-task.html\"&gt;Your first task&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Take the result from the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gwjh2k7l\"&gt;theia/run-…&lt;/code&gt; branch — see &lt;a href=\"en/guides/results.html\"&gt;Run results&lt;/a&gt;.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"sections\"&gt;&lt;a href=\"en/index.html#sections\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Sections&lt;/span&gt;&lt;/a&gt;Sections&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Section&lt;/th&gt;\n&lt;th&gt;What is inside&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;About the platform&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/about/overview.html\"&gt;What Theia is&lt;/a&gt;, &lt;a href=\"en/about/platforms.html\"&gt;systems and run modes&lt;/a&gt;, &lt;a href=\"en/about/limitations.html\"&gt;known limitations&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Installation&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/install/install.html\"&gt;Install&lt;/a&gt;, &lt;a href=\"en/install/first-setup.html\"&gt;first setup&lt;/a&gt;, &lt;a href=\"en/install/update.html\"&gt;update&lt;/a&gt;, &lt;a href=\"en/install/uninstall.html\"&gt;uninstall&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Working with tasks&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/guides/first-task.html\"&gt;Your first task&lt;/a&gt;, &lt;a href=\"en/guides/plan-and-run.html\"&gt;plan&lt;/a&gt;, &lt;a href=\"en/guides/control-run.html\"&gt;control a run&lt;/a&gt;, &lt;a href=\"en/guides/results.html\"&gt;results&lt;/a&gt;, &lt;a href=\"en/guides/knowledge.html\"&gt;code index and memory&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;TUI screen&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/tui/overview.html\"&gt;Screens&lt;/a&gt;, &lt;a href=\"en/tui/navigation.html\"&gt;hotkeys&lt;/a&gt;, &lt;a href=\"en/tui/leave-running.html\"&gt;leave without stopping a task&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Configuration&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/config/overview.html\"&gt;Settings files&lt;/a&gt;, &lt;a href=\"en/config/models.html\"&gt;models&lt;/a&gt;, &lt;a href=\"en/config/keys.html\"&gt;keys&lt;/a&gt;, &lt;a href=\"en/config/policy.html\"&gt;policy.yaml&lt;/a&gt;, &lt;a href=\"en/config/environment.html\"&gt;environment variables&lt;/a&gt;, &lt;a href=\"en/config/rules-prompts.html\"&gt;rules&lt;/a&gt;, &lt;a href=\"en/config/sandbox.html\"&gt;sandbox&lt;/a&gt;, &lt;a href=\"en/config/workspaces.html\"&gt;store&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Integrations&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;, &lt;a href=\"en/integrations/codex.html\"&gt;Codex&lt;/a&gt;, &lt;a href=\"en/integrations/mcp-server.html\"&gt;MCP server&lt;/a&gt;, &lt;a href=\"en/integrations/git.html\"&gt;Git&lt;/a&gt;, &lt;a href=\"en/integrations/observability.html\"&gt;metrics&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Reference&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/commands.html\"&gt;All commands&lt;/a&gt;, &lt;a href=\"en/troubleshooting.html\"&gt;troubleshooting&lt;/a&gt;, &lt;a href=\"en/glossary.html\"&gt;glossary&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"conventions\"&gt;&lt;a href=\"en/index.html#conventions\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How to read commands&lt;/span&gt;&lt;/a&gt;How to read commands&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Blocks tagged &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-db9r8hjk\"&gt;bash&lt;/code&gt; are ready to paste into a terminal as a whole.&lt;/li&gt;\n&lt;li&gt;Blocks tagged &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q7m0trfw\"&gt;text&lt;/code&gt; show syntax or output. Do not paste them.&lt;/li&gt;\n&lt;li&gt;In syntax, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-red1f8qw\"&gt;&amp;lt;runId&amp;gt;&lt;/code&gt; is a value you fill in. A part in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6e4dubyz\"&gt;[ ]&lt;/code&gt; is optional. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pogfdgd6\"&gt;a|b&lt;/code&gt; means \"one of these values\".&lt;/li&gt;\n&lt;li&gt;Output examples are shortened. Paths like &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2reymi4j\"&gt;~/projects/app&lt;/code&gt; stand for your real paths.&lt;/li&gt;\n&lt;li&gt;Words that Theia itself prints (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1tb5lj0n\"&gt;fast_path&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qxlbt13k\"&gt;halted&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-psvfka74\"&gt;merged&lt;/code&gt;) appear as they are and are explained in the &lt;a href=\"en/glossary.html\"&gt;glossary&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Some output examples show the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xdm2m0fc\"&gt;fake&lt;/code&gt; transport. It is a test transport that calls no model; the commands were checked with it. In your output you will see your own transport there, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d5tilo91\"&gt;claude-write&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fdxnobkf\"&gt;codex-write&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/index.html","hreflang":"en"},{"href":"ru/index.html","hreflang":"ru"}],"style":["_assets/theia.css"],"canonical":"en/index.html","vcsPath":"en/index.md"},"headings":[{"title":"Quick start","href":"en/index.html#quick-start","level":2},{"title":"Sections","href":"en/index.html#sections","level":2},{"title":"How to read commands","href":"en/index.html#conventions","level":2}],"title":"Theia 0.2.201 user guide"},"router":{"pathname":"en/index","depth":2,"base":"../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
