" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-913.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;The final phase of each task. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-umykqppo\"&gt;merged&lt;/code&gt; means the change is on the run branch. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p2avmqk2\"&gt;discarded&lt;/code&gt; means the task ended without a result.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9r3ig1rf\"&gt;halted:&lt;/code&gt; is the reason the run stopped, see &lt;a href=\"en/glossary.html#halted\"&gt;halted&lt;/a&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-73sbg0xf\"&gt;completed&lt;/code&gt; means nothing was left to do; tasks can still be &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y5mb9vhe\"&gt;discarded&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w5i9sgbo\"&gt;paused&lt;/code&gt; means the run can be resumed. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a0t4v9l0\"&gt;abandoned&lt;/code&gt; means the run was closed with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iijlby36\"&gt;--abandon&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ascge3u\"&gt;budget&lt;/code&gt; means the run reached the internal limit of 1000 verdicts; it has nothing to do with money.&lt;/li&gt;\n&lt;li&gt;The number of model calls and their total cost.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jg6ipj4a\"&gt;audit chain: intact&lt;/code&gt; means the run log is complete and unchanged, see &lt;a href=\"en/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-chdkgk8b\"&gt;budget remaining:&lt;/code&gt; is the money left. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-31fzj6ua\"&gt;unmetered&lt;/code&gt; means no limit.&lt;/li&gt;\n&lt;li&gt;The last line shows the run branch. The number counts commits after the base, not merges. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xuecpsf0\"&gt;no merges landed&lt;/code&gt; means there is nothing to take.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;A paused run adds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2vg072m5\"&gt;paused — resume with: theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. After the closing lines theia may print &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-udwzutwa\"&gt;maintenance: …&lt;/code&gt;, a routine cleanup.&lt;/p&gt;\n&lt;h2 id=\"run-exit-codes\"&gt;&lt;a href=\"en/reference/run.html#run-exit-codes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Exit codes&lt;/span&gt;&lt;/a&gt;Exit codes&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Code&lt;/th&gt;\n&lt;th&gt;When&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;0&lt;/td&gt;\n&lt;td&gt;Every task ended &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-icks8uc4\"&gt;merged&lt;/code&gt; (or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hcimi0wx\"&gt;planned&lt;/code&gt;). Also when the run paused: Ctrl+C or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2sno4826\"&gt;q&lt;/code&gt; once, the budget ran out, or a guard paused the run.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;At least one task ended another way, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i5lc5o78\"&gt;discarded&lt;/code&gt;. Also for wrong arguments and refusals: unknown track, the branch exists, the base is not found, the plan is not approved, a file for &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c3m8ib57\"&gt;@&lt;/code&gt; is missing or contains a secret, nothing to resume.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;130&lt;/td&gt;\n&lt;td&gt;Hard stop: a second Ctrl+C, or a second &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i9kbncps\"&gt;q&lt;/code&gt; in the TUI.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;143&lt;/td&gt;\n&lt;td&gt;The process was killed with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k2djl5lu\"&gt;kill&lt;/code&gt; (SIGTERM). The run stays open and can be resumed.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"run-files\"&gt;&lt;a href=\"en/reference/run.html#run-files\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;What a run creates&lt;/span&gt;&lt;/a&gt;What a run creates&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6phgm05g\"&gt;.theia/&lt;/code&gt; is added to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4vayjt7h\"&gt;.gitignore&lt;/code&gt; in the repository root.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7d36bxy4\"&gt;.theia/runs/&amp;lt;run folder&amp;gt;/trunk&lt;/code&gt; is a hidden git worktree with the run branch checked out. The folder name is the run id without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xdtcxa2w\"&gt;run&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-poxow49m\"&gt;.theia/runs/&amp;lt;run folder&amp;gt;/ws-&amp;lt;task&amp;gt;&lt;/code&gt; is a full copy of the repository for each task. It includes untracked files such as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i5dmtzvb\"&gt;node_modules&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ptyoddl\"&gt;.env&lt;/code&gt;, so the roles can read them. These files are never committed. Theia deletes the copy after a successful merge and keeps it otherwise.&lt;/li&gt;\n&lt;li&gt;The git branch &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-49sn0wdv\"&gt;theia/run-&amp;lt;6 characters&amp;gt;&lt;/code&gt;, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4p8w8lb6\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt; for each merged task. Theia never pushes them.&lt;/li&gt;\n&lt;li&gt;Records in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x9183qlg\"&gt;.theia/store.db&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;How to remove them: &lt;a href=\"en/guides/first-task.html#cleanup\"&gt;Your first task&lt;/a&gt; and &lt;a href=\"en/reference/audit-prune.html#prune\"&gt;theia prune&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"run-env\"&gt;&lt;a href=\"en/reference/run.html#run-env\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Environment variables&lt;/span&gt;&lt;/a&gt;Environment variables&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Variable&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7sf33bgh\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Appends every event of the run to this file: the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yum5qpt4\"&gt;--plain&lt;/code&gt; line and the full data in JSON. A run that lasts less than a second may leave the file empty.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-om209d4b\"&gt;THEIA_NO_SPINNER&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-34rkp073\"&gt;1&lt;/code&gt; gives static symbols, the same as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r8armil9\"&gt;--no-spinner&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;All variables: &lt;a href=\"en/config/environment.html\"&gt;Environment variables&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"en/reference/run.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;See also&lt;/span&gt;&lt;/a&gt;See also&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/guides/first-task.html\"&gt;Your first task&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/guides/control-run.html\"&gt;Control a run&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/guides/results.html\"&gt;Run results&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/reference/plan.html\"&gt;theia plan&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/reference/run-control.html\"&gt;theia msg, answer, probe&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/config/policy.html\"&gt;policy.yaml settings&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/reference/run.html","hreflang":"en"},{"href":"ru/reference/run.html","hreflang":"ru"}],"style":["_assets/theia.css","_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"canonical":"en/reference/run.html","vcsPath":"en/reference/run.md"},"headings":[{"title":"theia run","href":"en/reference/run.html#run","level":2,"items":[{"title":"--task","href":"en/reference/run.html#run-task","level":3},{"title":"Include files with @","href":"en/reference/run.html#run-file-inclusion","level":3},{"title":"--track","href":"en/reference/run.html#run-track","level":3},{"title":"--verify","href":"en/reference/run.html#run-verify","level":3},{"title":"--budget","href":"en/reference/run.html#run-budget","level":3},{"title":"--max-rounds","href":"en/reference/run.html#run-max-rounds","level":3},{"title":"--max-rescopes","href":"en/reference/run.html#run-max-rescopes","level":3},{"title":"--plain","href":"en/reference/run.html#run-plain","level":3},{"title":"--cli","href":"en/reference/run.html#run-cli","level":3},{"title":"--tui","href":"en/reference/run.html#run-tui","level":3},{"title":"--non-interactive","href":"en/reference/run.html#run-non-interactive","level":3},{"title":"--no-spinner","href":"en/reference/run.html#run-no-spinner","level":3},{"title":"--interaction","href":"en/reference/run.html#run-interaction","level":3},{"title":"--from-plan","href":"en/reference/run.html#run-from-plan","level":3},{"title":"--plan","href":"en/reference/run.html#run-plan","level":3},{"title":"--root","href":"en/reference/run.html#run-root","lev
