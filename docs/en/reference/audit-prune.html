    <body class="g-root g-root_theme_light">

        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ib4y09r\"&gt;theia audit verify&lt;/code&gt; checks that stored logs were not changed. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-18sn3swi\"&gt;theia prune&lt;/code&gt; removes old finished runs to free disk space. Neither command calls a model.&lt;/p&gt;\n&lt;h2 id=\"audit\"&gt;&lt;a href=\"en/reference/audit-prune.html#audit\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;theia audit&lt;/span&gt;&lt;/a&gt;theia audit&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q96u4zyu\"&gt;theia audit&lt;/code&gt; has one subcommand, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-si244349\"&gt;verify&lt;/code&gt;. Without it, or with another word, theia prints &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kthwc7zg\"&gt;theia audit verify [scope]&lt;/code&gt; and exits with code 1.&lt;/p&gt;\n&lt;h3 id=\"audit-verify\"&gt;&lt;a href=\"en/reference/audit-prune.html#audit-verify\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;theia audit verify&lt;/span&gt;&lt;/a&gt;theia audit verify&lt;/h3&gt;\n&lt;p&gt;Checks the &lt;a href=\"en/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt; of stored logs. Every event carries a fingerprint of the previous one, so a changed or removed event breaks the chain.&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia audit verify [&amp;lt;scope&amp;gt;]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"15\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-15\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-15\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-15.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Argument&lt;/th&gt;\n&lt;th&gt;Value&lt;/th&gt;\n&lt;th&gt;Default&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cttcni7g\"&gt;&amp;lt;scope&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;log id&lt;/td&gt;\n&lt;td&gt;all logs&lt;/td&gt;\n&lt;td&gt;Check only this log. A run id works with or without the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i1jv4p02\"&gt;run&lt;/code&gt; prefix. Extra arguments are ignored.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Without an argument theia checks every log in the store: each run, each plan, each probe (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c1ar9yr6\"&gt;theia probe&lt;/code&gt;), and the service logs &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dx8s0woq\"&gt;plan&lt;/code&gt; (planner calls) and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h5aerrhi\"&gt;probe&lt;/code&gt; (the index used by a probe). It prints one line per log, without the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oxbj681e\"&gt;run&lt;/code&gt; prefix. Lines of runs, plans and probes are mixed.&lt;/p&gt;\n&lt;p&gt;Example output:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;2akdqck6vw2234dhcxwrue: intact\n2akdqckarw223cdvn75mka: intact\n2akdqckj62223mjar2dw7f: intact\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"56\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-56\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-56\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-56.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6me8908y\"&gt;intact&lt;/code&gt; means the log is complete and unchanged.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7e6a0afd\"&gt;BROKEN at &amp;lt;event id&amp;gt;&lt;/code&gt; means the log was changed at this event.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The exit code is 0 when every checked log is intact, and 1 when any log is broken.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;An id that does not exist is also reported as intact: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ctnl2c7q\"&gt;nosuchscope: intact&lt;/code&gt;, exit code 0. Check the spelling of the id.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"prune\"&gt;&lt;a href=\"en/reference/audit-prune.html#prune\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;theia prune&lt;/span&gt;&lt;/a&gt;theia prune&lt;/h2&gt;\n&lt;p&gt;Removes finished &lt;a href=\"en/glossary.html#run\"&gt;runs&lt;/a&gt;: their folders under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e62zt8bj\"&gt;.theia/runs/&lt;/code&gt;, their records in the store, and stored outputs that nothing refers to any more. Theia looks for references in every remaining event and store record, plans and recorded model replies included.&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia prune --older-than &amp;lt;age&amp;gt; [--keep &amp;lt;N&amp;gt;] [--dry-run] [--yes]\ntheia prune --keep &amp;lt;N&amp;gt; [--dry-run] [--yes]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"88\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-88\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-88\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-88.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Argument&lt;/th&gt;\n&lt;th&gt;Value&lt;/th&gt;\n&lt;th&gt;Default&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-stqyp3dy\"&gt;--older-than&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;number plus &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-88zmms31\"&gt;d&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q4yy3t4w\"&gt;h&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8idjdzkf\"&gt;m&lt;/code&gt;, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ux24v42c\"&gt;7d&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oj2th79f\"&gt;48h&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ksq2m0ex\"&gt;90m&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Select finished runs that started longer ago than this. See &lt;a href=\"en/reference/audit-prune.html#prune-older-than\"&gt;--older-than&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gk0vok7g\"&gt;--keep&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;whole number, 0 or more&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;Keep the newest N finished runs and select the rest. See &lt;a href=\"en/reference/audit-prune.html#prune-keep\"&gt;--keep&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-clwqubwy\"&gt;--dry-run&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;off&lt;/td&gt;\n&lt;td&gt;Show what would be removed and delete nothing. See &lt;a href=\"en/reference/audit-prune.html#prune-dry-run\"&gt;--dry-run&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t0vji2p0\"&gt;--yes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;off&lt;/td&gt;\n&lt;td&gt;Delete without asking. Needed without a terminal. Not shown in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-huc0weh2\"&gt;theia help&lt;/code&gt;. See &lt;a href=\"en/reference/audit-prune.html#prune-yes\"&gt;--yes&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Give &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1tpv0cjb\"&gt;--older-than&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-56xt4ecs\"&gt;--keep&lt;/code&gt;, or both. With both, a run is removed only if it matches both. Without either, theia prints its usage text and exits with code 1:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia prune (--older-than 7d | --keep N) [--dry-run] [--yes]\n  removes FINISHED runs: their kept workspaces, event scopes, and\n  blobs nothing left references. Unfinished/paused runs never prune.\n  --older-than  human age: 7d, 48h, 90m\n  --keep        keep the newest N finished runs\n  --dry-run     price the pass, delete nothing\n  --yes         skip the confirmation (required when not a TTY)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"168\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-168\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-168\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-168.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;A run counts as finished when its log has both &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tjes0gh9\"&gt;run.created&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ef0amfv\"&gt;run.finished&lt;/code&gt;: a run that ended normally, a run closed with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wa8fx48j\"&gt;theia run --abandon&lt;/code&gt;, and a fork that was driven to the end or was made without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5bohjif8\"&gt;--at&lt;/code&gt; from a finished run (then &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4410y7tp\"&gt;run.finished&lt;/code&gt; was copied). Unfinished runs, paused runs and forks made with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8hqsbgjr\"&gt;--at&lt;/code&gt; that were never continued are never removed.&lt;/p&gt;\n&lt;p&gt;Example output with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-urqz0wgd\"&gt;--dry-run&lt;/code&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;prune: 3 finished runs selected (0 unfinished kept):\n  run2akdqckj62223mjar2dw7f  0d old  no workspace\n  run2akdqckarw223cdvn75mka  0d old  0.0 MB\n  run2akdqck6vw2234dhcxwrue  0d old  0.0 MB\n  workspaces: 0.0 MB · event scopes: 3 · orphaned blobs swept after\n  untouched: unfinished runs, gateway recordings (request-keyed, shared), ai/* audit branches (your repo)\ndry-run: nothing deleted\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"175\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-175\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-175\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-175.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Example output after deletion:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;pruned: 3 runs, 0.0 MB of workspaces, 14 orphaned blobs (0.0 MB)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"179\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-179\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-179\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-179.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;When nothing matches:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;prune: nothing to remove (4 runs known, 0 unfinished — unfinished never prune)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"183\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-183\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-183\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-183.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;After deletion &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hxzx6y70\"&gt;theia show&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vat26l1v\"&gt;theia replay&lt;/code&gt; for these runs print &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ral2p3m\"&gt;no events&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Exit codes:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Code&lt;/th&gt;\n&lt;th&gt;When&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;0&lt;/td&gt;\n&lt;td&gt;Runs were removed, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ooittvj\"&gt;--dry-run&lt;/code&gt; finished, or nothing matched.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;Wrong or missing arguments, or you did not confirm.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"prune-older-than\"&gt;&lt;a href=\"en/reference/audit-prune.html#prune-older-than\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-431j7138\"&gt;--older-than&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The age of a run is counted from its start. The value is a number with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-01m1d8iz\"&gt;d&lt;/code&gt; (days), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3865qk5\"&gt;h&lt;/code&gt; (hours) or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gydx0zyp\"&gt;m&lt;/code&gt; (minutes). Decimals work, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tfhwo36e\"&gt;1.5d&lt;/code&gt;. The list shows the age in whole days, rounded: a run that is 90 minutes old shows as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c019bccm\"&gt;0d old&lt;/code&gt;. A wrong value stops the command: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wjon5u9i\"&gt;prune: --older-than needs 7d / 48h / 90m, got '7x'&lt;/code&gt;, exit code 1.&lt;/p&gt;\n&lt;h3 id=\"prune-keep\"&gt;&lt;a href=\"en/reference/audit-prune.html#prune-keep\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2h32y35w\"&gt;--keep&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Keeps the newest N finished runs and selects all older finished runs. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p4ctz611\"&gt;--keep 0&lt;/code&gt; selects every finished run. A wrong value stops the command: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cae91xcg\"&gt;prune: --keep needs a non-negative integer, got '-1'&lt;/code&gt;, exit code 1.&lt;/p&gt;\n&lt;h3 id=\"prune-dry-run\"&gt;&lt;a href=\"en/reference/audit-prune.html#prune-dry-run\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3en69q86\"&gt;--dry-run&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Prints the list, the size of the copies and what stays untouched, then &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7m0u8qeh\"&gt;dry-run: nothing deleted&lt;/code&gt;. Nothing is removed. Run it first.&lt;/p&gt;\n&lt;h3 id=\"prune-yes\"&gt;&lt;a href=\"en/reference/audit-prune.html#prune-yes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7lkd3ics\"&gt;--yes&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;On a terminal theia prints the list and asks &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x4fvlxbe\"&gt;delete N runs + X MB? [y/N]&lt;/code&gt; before it deletes anything. Only &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jlfieze5\"&gt;y&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3qko7fmo\"&gt;yes&lt;/code&gt; confirms, in any case. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zxxngtrq\"&gt;--yes&lt;/code&gt; skips the question. Without a terminal theia cannot ask. Without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n3ts5mx2\"&gt;--yes&lt;/code&gt; it prints the list and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wgkx3g8g\"&gt;prune: aborted (nothing deleted)&lt;/code&gt;, exit code 1:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;prune: 1 finished runs selected (0 unfinished kept):\n  run2akec4zct2222capt6cy53  0d old  0.0 MB\n  workspaces: 0.0 MB · event scopes: 1 · orphaned blobs swept after\n  untouched: unfinished runs, gateway recordings (request-keyed, shared), ai/* audit branches (your repo)\nprune: aborted (nothing deleted)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"244\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-244\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-244\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-244.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"prune-leftovers\"&gt;&lt;a href=\"en/reference/audit-prune.html#prune-leftovers\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;What prune leaves behind&lt;/span&gt;&lt;/a&gt;What prune leaves behind&lt;/h3&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Unfinished and paused runs. This includes the unfinished record that a refused &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z61qyohx\"&gt;theia run --from-plan&lt;/code&gt; leaves, and a fork made with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mujlvw4o\"&gt;--at&lt;/code&gt; that was never continued. To remove such a record, close the run with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w0rj6bu5\"&gt;theia run --abandon &amp;lt;runId&amp;gt;&lt;/code&gt; first, see &lt;a href=\"en/guides/plan-and-run.html#refused-run\"&gt;A refused plan run leaves a branch&lt;/a&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Saved model replies. They are shared between runs.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Git branches &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ymjv2aop\"&gt;ai/*&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-effrf2rf\"&gt;theia/run-*&lt;/code&gt; in your repository.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Git worktree entries of removed runs. The folder &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rffvf3w1\"&gt;.theia/runs/&amp;lt;run folder&amp;gt;/trunk&lt;/code&gt; is deleted with the run, so &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0z4o2sq3\"&gt;git worktree list&lt;/code&gt; marks these entries &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dzayfa0l\"&gt;prunable&lt;/code&gt;. Remove them with git:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs bash\"&gt;git worktree prune\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"268\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-268\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-268\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-268.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Records of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-holaqqta\"&gt;theia probe&lt;/code&gt;: their log has no &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jlbriguv\"&gt;run.created&lt;/code&gt; event, so &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5w7yff5\"&gt;prune&lt;/code&gt; does not treat them as runs.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"en/reference/audit-prune.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;See also&lt;/span&gt;&lt;/a&gt;See also&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/guides/results.html\"&gt;Run results&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/guides/first-task.html#cleanup\"&gt;Your first task: clean up&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/reference/run.html\"&gt;theia run&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/reference/audit-prune.html","hreflang":"en"},{"href":"ru/reference/audit-prune.html","hreflang":"ru"}],"style":["_assets/theia.css"],"canonical":"en/reference/audit-prune.html","vcsPath":"en/reference/audit-
