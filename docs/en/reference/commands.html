            {"data":{"leading":false,"html":"&lt;p&gt;A short summary of every &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-61yfr2id\"&gt;theia&lt;/code&gt; 0.2.201 command: what it does, whether it spends money on models, and where to read more. This page also covers global flags, exit codes and the general argument rules.&lt;/p&gt;\n&lt;h2 id=\"syntax\"&gt;&lt;a href=\"en/reference/commands.html#syntax\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How a call is built&lt;/span&gt;&lt;/a&gt;How a call is built&lt;/h2&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia [global flags] &amp;lt;command&amp;gt; [subcommand] [arguments]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kert4pfk\"&gt;theia help&lt;/code&gt; prints the help text and exits with code 0. There is no per-command help: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cp198i51\"&gt;theia help run&lt;/code&gt; prints the same general help.&lt;/li&gt;\n&lt;li&gt;An unknown command prints the same help and exits with code 1.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ze9ya8cd\"&gt;theia&lt;/code&gt; with no command, in a terminal, opens the first-run wizard or the &lt;a href=\"en/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;. Without a terminal, for example in a script, it prints the help.&lt;/li&gt;\n&lt;li&gt;Global flags may appear anywhere on the line, not only before the command. Theia strips them before it parses the command.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"commands\"&gt;&lt;a href=\"en/reference/commands.html#commands\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Commands&lt;/span&gt;&lt;/a&gt;Commands&lt;/h2&gt;\n&lt;p&gt;The \"Models\" column shows whether a command calls a model. Such calls cost money or use up your subscription limits.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Command&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;th&gt;Models&lt;/th&gt;\n&lt;th&gt;Details&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oueuegc5\"&gt;theia init&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Creates the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yh7qo1io\"&gt;.theia&lt;/code&gt; store for a project&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/init.html#init\"&gt;init&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6cmh9o3f\"&gt;theia setup&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Writes user settings: GitHub token, OpenAI key, update channel&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/setup-self-version.html#setup\"&gt;setup&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kriipzzl\"&gt;theia self update&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Updates Theia to the newest version of its channel&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/setup-self-version.html#self-update\"&gt;self update&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jtkfoj8v\"&gt;theia version&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Prints the version&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/setup-self-version.html#version\"&gt;version&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ub7a74zi\"&gt;theia doctor&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Checks engines, keys, embeddings and the store&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/doctor.html#doctor\"&gt;doctor&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uokvp39w\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Runs a task, continues (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a1eeq6tk\"&gt;--resume&lt;/code&gt;) or closes (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4o2fm6t2\"&gt;--abandon&lt;/code&gt;) a run&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run.html#run\"&gt;run&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xtot4br\"&gt;theia plan&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Makes a plan and manages it&lt;/td&gt;\n&lt;td&gt;only &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xd2ha771\"&gt;plan --task&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/plan.html#plan\"&gt;plan&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m9qjf5m9\"&gt;theia msg&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Sends guidance to a run&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-control.html#msg\"&gt;msg&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p3zaiwqd\"&gt;theia answer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Lists a run's questions and answers them&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-control.html#answer\"&gt;answer&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qdltl1ki\"&gt;theia probe&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Asks a question about a run without changing it&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-control.html#probe\"&gt;probe&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fu5vbgti\"&gt;theia show&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Shows a stored run&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-inspect.html#show\"&gt;show&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9uuv7r4z\"&gt;theia replay&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Re-reads a run's log and checks the audit chain&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-inspect.html#replay\"&gt;replay&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iyvubv0k\"&gt;theia diagnose&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Names the likely cause of a failure from a rule table&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-inspect.html#diagnose\"&gt;diagnose&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oddy6rj9\"&gt;theia compare&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Compares two runs&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-inspect.html#compare\"&gt;compare&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g9ihj3je\"&gt;theia fork&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Branches a run off at a chosen step&lt;/td&gt;\n&lt;td&gt;no, until the fork is continued&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-inspect.html#fork\"&gt;fork&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v143pvuw\"&gt;theia audit verify&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Checks the hash chains of the event log&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/audit-prune.html#audit-verify\"&gt;audit verify&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9sazrael\"&gt;theia prune&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Deletes the data of finished runs&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/audit-prune.html#prune\"&gt;prune&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ex8php7n\"&gt;theia index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Builds the code index and searches it&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ajm8dknl\"&gt;index build&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/index-cmd.html#index\"&gt;index&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-totipqu5\"&gt;theia mem&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Works with project memory&lt;/td&gt;\n&lt;td&gt;only &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2nvugru3\"&gt;mem maintain --llm&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/mem.html#mem\"&gt;mem&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9tzw5f8l\"&gt;theia ask&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Answers a question from memory, the index and runs&lt;/td&gt;\n&lt;td&gt;yes, when records were found&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/ask.html#ask\"&gt;ask&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ft6xu3j6\"&gt;theia hooks install&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Connects Theia to Claude Code, Codex or git&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/hooks.html#hooks\"&gt;hooks&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r3l6fpyg\"&gt;theia serve&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Starts an MCP server for other tools&lt;/td&gt;\n&lt;td&gt;depends on the tool called&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/serve.html#serve\"&gt;serve&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-isbluaav\"&gt;theia jail&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Runs a command in a sandbox, Linux only&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/jail.html#jail\"&gt;jail&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k1ha60gu\"&gt;theia eval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Runs platform benchmarks&lt;/td&gt;\n&lt;td&gt;depends on the subcommand&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/eval.html#eval\"&gt;eval&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Embeddings (number vectors that capture meaning) for search are computed locally by default and cost nothing. If the settings choose the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gj83yfod\"&gt;openai&lt;/code&gt; provider, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r8xmaz3i\"&gt;index reindex&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qk2dik1q\"&gt;mem reindex&lt;/code&gt; pay for OpenAI embeddings. See &lt;a href=\"en/guides/knowledge.html\"&gt;Code index, memory and questions&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"global-flags\"&gt;&lt;a href=\"en/reference/commands.html#global-flags\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Global flags&lt;/span&gt;&lt;/a&gt;Global flags&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Flag&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xwhtjhyi\"&gt;--x-release &amp;lt;version&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Runs the given Theia version instead of the installed one. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nre7xmsk\"&gt;--x-release=&amp;lt;version&amp;gt;&lt;/code&gt; works too. Theia looks for the version in its cache and downloads it when a GitHub token is set. If the version cannot be obtained, the command fails; it never falls back to the current version.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xpy67fgo\"&gt;--dev [path]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;For platform developers only. Runs Theia from a source tree: the given path, or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rghpergo\"&gt;dev.root&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zwascu4q\"&gt;~/.config/theia/config.yaml&lt;/code&gt; (written by &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yue856yq\"&gt;theia setup --dev-root &amp;lt;path&amp;gt;&lt;/code&gt;). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4f4vmqii\"&gt;--dev=&amp;lt;path&amp;gt;&lt;/code&gt; works too.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-al6yj1ru\"&gt;THEIA_X_RELEASE&lt;/code&gt; environment variable works like the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q0aakwny\"&gt;--x-release&lt;/code&gt; flag. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ln08dn5b\"&gt;theia --version&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qy0itktv\"&gt;theia -V&lt;/code&gt; do the same as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4j4p2292\"&gt;theia version&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e1wqwdvr\"&gt;--dev&lt;/code&gt; without a path and without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-srpemrlf\"&gt;dev.root&lt;/code&gt; in the settings stops the command with exit code 1. It does not print the help:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;--dev: no development root — pass a path (theia --dev &amp;lt;path&amp;gt; …) or set dev.root in ~/.config/theia/config.yaml (theia setup --dev-root &amp;lt;path&amp;gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"440\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-440\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-440\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-440.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gtemb45t\"&gt;--x-release&lt;/code&gt; does not see versions placed by the installer and downloads them again. One unpacked version takes about 900 MB.&lt;/li&gt;\n&lt;li&gt;A wrong &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hp2gz5ru\"&gt;THEIA_X_RELEASE&lt;/code&gt; value breaks every command, even &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bkk3ria7\"&gt;theia version&lt;/code&gt;. To fix it, remove the variable: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6ztet5h\"&gt;unset THEIA_X_RELEASE&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;See &lt;a href=\"en/install/update.html\"&gt;Update and pick a version&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"exit-codes\"&gt;&lt;a href=\"en/reference/commands.html#exit-codes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Exit codes&lt;/span&gt;&lt;/a&gt;Exit codes&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Code&lt;/th&gt;\n&lt;th&gt;Meaning&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vn16g3c5\"&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The command succeeded. For &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2skynvlj\"&gt;theia run&lt;/code&gt; it also means a pause: after the first Ctrl+C, when the budget ran out, or when a loop guard fired&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ishfbtrl\"&gt;1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;An error or refusal: wrong arguments, no store found, a run's task was discarded (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ixq6425y\"&gt;discarded&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-obwh2eop\"&gt;theia doctor&lt;/code&gt; found a problem&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t9znfzm2\"&gt;130&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fji1njyl\"&gt;theia run&lt;/code&gt;: hard stop with a second Ctrl+C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nw4f30xw\"&gt;143&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-po2hmkqy\"&gt;theia run&lt;/code&gt;: the process was killed with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fe5wiy6d\"&gt;SIGTERM&lt;/code&gt;, for example by &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3i7kuq3\"&gt;kill&lt;/code&gt;. Theia does not catch this signal. The run stays open and can be continued with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7x4djzka\"&gt;--resume&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;For some commands code 1 has its own meaning:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wdraavus\"&gt;theia replay&lt;/code&gt; — the audit chain of the run is broken.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u0ea97c1\"&gt;theia audit verify&lt;/code&gt; — at least one checked log is broken.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7eckxpur\"&gt;theia index status&lt;/code&gt; — the index is out of date.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Command pages describe these cases.&lt;/p&gt;\n&lt;h2 id=\"argument-rules\"&gt;&lt;a href=\"en/reference/commands.html#argument-rules\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General rules&lt;/span&gt;&lt;/a&gt;General rules&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;A flag that takes a value uses the next word: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7xn13imv\"&gt;--budget 5&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Every command skips unknown flags without a warning. A typo such as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0mugiyf\"&gt;--budjet 3&lt;/code&gt; keeps the default value. The run's budget is visible in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uo1k39bs\"&gt;run.created&lt;/code&gt; line at the start of the output. There are two exceptions: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z50ety4k\"&gt;theia msg&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jstzwljv\"&gt;theia probe&lt;/code&gt; put an unknown flag into the text of the note or question, so &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gusrz7p9\"&gt;theia msg &amp;lt;runId&amp;gt; --foo hello&lt;/code&gt; records the note &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iyq296u0\"&gt;--foo hello&lt;/code&gt;. In &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dv5d6722\"&gt;theia answer&lt;/code&gt;, every word without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tc2nvc1n\"&gt;--&lt;/code&gt; after &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l22e49bj\"&gt;--question &amp;lt;id&amp;gt;&lt;/code&gt; counts as an answer.&lt;/li&gt;\n&lt;li&gt;Theia validates only the values of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oq6tsrkk\"&gt;run --track&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ay8ys0ul\"&gt;run --interaction&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gu1hl1p6\"&gt;prune --older-than&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fsszanzr\"&gt;prune --keep&lt;/code&gt; and ids. Other values are taken as they are: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-axnnoefk\"&gt;--budget abc&lt;/code&gt; removes the money limit, see &lt;a href=\"en/reference/run.html#run-budget\"&gt;--budget&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Ids start with a prefix: run — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d3lh0rwg\"&gt;run&lt;/code&gt;, task — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-863kiyjy\"&gt;tsk&lt;/code&gt;, plan — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8f4wrx68\"&gt;pln&lt;/code&gt;, memory fact — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-az4d0swm\"&gt;fct&lt;/code&gt;. After the prefix come 22 characters. Commands accept the full id or those 22 characters without the prefix.&lt;/li&gt;\n&lt;li&gt;Only &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tnmkwtei\"&gt;show --task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7tb3qaqi\"&gt;msg --task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aw2nu4l8\"&gt;fork --at&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dola20la\"&gt;answer --question&lt;/code&gt; accept a short tail of an id.&lt;/li&gt;\n&lt;li&gt;There is no \"list runs\" command. A run id appears in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3k0grffj\"&gt;run run… task tsk…&lt;/code&gt; line at the start of a run, in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r0esy0l5\"&gt;resume with: …&lt;/code&gt; hint on pause, and on the home screen (last 5 runs). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8cv8d2xy\"&gt;theia prune --keep 0 --dry-run&lt;/code&gt; prints the full ids of every finished run and deletes nothing. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x27ql0ld\"&gt;theia audit verify&lt;/code&gt; prints ids without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tawnl5o5\"&gt;run&lt;/code&gt;, mixed with the logs of plans and probes. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qg5g3brb\"&gt;theia show&lt;/code&gt; of a fork names the parent in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jzrjh78y\"&gt;forked from&lt;/code&gt; line, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-973f9el8\"&gt;theia fork&lt;/code&gt; names the new run in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-41k8jcpo\"&gt;drive it:&lt;/code&gt; line. See &lt;a href=\"en/guides/control-run.html#run-id\"&gt;How to find the run id&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ff1ydjhr\"&gt;@path&lt;/code&gt; in the text of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ziqdgy03\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9819wpju\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mtwjtpfh\"&gt;msg&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f99x7cf4\"&gt;probe&lt;/code&gt; inserts the file's content into the request. See the glossary: &lt;a href=\"en/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8phcm697\"&gt;@path&lt;/code&gt; inclusion&lt;/a&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-856pfupc\"&gt;ask&lt;/code&gt; does not support it.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"en/reference/commands.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;See also&lt;/span&gt;&lt;/a&gt;See also&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/about/overview.html\"&gt;What Theia is&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/troubleshooting.html\"&gt;Troubleshooting&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html\"&gt;Glossary&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/reference/commands.html","hreflang":"en"},{"href":"ru/reference/commands.html","hreflang":"ru"}],"style":["_assets/theia.css"],"canonical":"en/reference/commands.html","vcsPath":"en/reference/commands.md"},"headings":[{"title":"How a call is built","href":"en/reference/commands.html#syntax","level":2},{"title":"Commands","href":"en/reference/commands.html#commands","level":2},{"title":"Global flags","href":"en/reference/commands.html#global-flags","level":2},{"title":"Exit codes","href":"en/reference/commands.html#exit-codes","level":2},{"title":"General rules","href":"en/reference/commands.html#argument-rules","level":2},{"title":"See also","href":"en/reference/commands.html#see-also","level":2}],"title":"All commands"},"router":{"pathname":"en/reference/commands","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
