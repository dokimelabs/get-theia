            {"data":{"leading":false,"html":"&lt;p&gt;A short summary of every &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qesiy8ad\"&gt;theia&lt;/code&gt; 0.2.201 command: what it does, whether it spends money on models, and where to read more. This page also covers global flags, exit codes and the general argument rules.&lt;/p&gt;\n&lt;h2 id=\"syntax\"&gt;&lt;a href=\"en/reference/commands.html#syntax\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How a call is built&lt;/span&gt;&lt;/a&gt;How a call is built&lt;/h2&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia [global flags] &amp;lt;command&amp;gt; [subcommand] [arguments]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"6\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-6\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-6\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-6.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6mbbxmbs\"&gt;theia help&lt;/code&gt; prints the help text and exits with code 0. There is no per-command help: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jde70uus\"&gt;theia help run&lt;/code&gt; prints the same general help.&lt;/li&gt;\n&lt;li&gt;An unknown command prints the same help and exits with code 1.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v5ynwg4y\"&gt;theia&lt;/code&gt; with no command, in a terminal, opens the first-run wizard or the &lt;a href=\"en/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;. Without a terminal, for example in a script, it prints the help.&lt;/li&gt;\n&lt;li&gt;Global flags may appear anywhere on the line, not only before the command. Theia strips them before it parses the command.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"commands\"&gt;&lt;a href=\"en/reference/commands.html#commands\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Commands&lt;/span&gt;&lt;/a&gt;Commands&lt;/h2&gt;\n&lt;p&gt;The \"Models\" column shows whether a command calls a model. Such calls cost money or use up your subscription limits.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Command&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;th&gt;Models&lt;/th&gt;\n&lt;th&gt;Details&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-foghxifq\"&gt;theia init&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Creates the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v3zq0fgg\"&gt;.theia&lt;/code&gt; store for a project&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/init.html#init\"&gt;init&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ph446eid\"&gt;theia setup&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Writes user settings: GitHub token, OpenAI key, update channel&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/setup-self-version.html#setup\"&gt;setup&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-563zwjbk\"&gt;theia self update&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Updates Theia to the newest version of its channel&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/setup-self-version.html#self-update\"&gt;self update&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tth4s94e\"&gt;theia version&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Prints the version&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/setup-self-version.html#version\"&gt;version&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6wqxycjs\"&gt;theia doctor&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Checks engines, keys, embeddings and the store&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/doctor.html#doctor\"&gt;doctor&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c1wozs2a\"&gt;theia run&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Runs a task, continues (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ba60ow1\"&gt;--resume&lt;/code&gt;) or closes (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dnnxklvr\"&gt;--abandon&lt;/code&gt;) a run&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run.html#run\"&gt;run&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z7qg74m4\"&gt;theia plan&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Makes a plan and manages it&lt;/td&gt;\n&lt;td&gt;only &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eperuerl\"&gt;plan --task&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/plan.html#plan\"&gt;plan&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zqg34cru\"&gt;theia msg&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Sends guidance to a run&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-control.html#msg\"&gt;msg&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q05783uj\"&gt;theia answer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Lists a run's questions and answers them&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-control.html#answer\"&gt;answer&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v8v4kdfs\"&gt;theia probe&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Asks a question about a run without changing it&lt;/td&gt;\n&lt;td&gt;yes&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-control.html#probe\"&gt;probe&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e4wb2kvy\"&gt;theia show&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Shows a stored run&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-inspect.html#show\"&gt;show&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2i1qk5vr\"&gt;theia replay&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Re-reads a run's log and checks the audit chain&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-inspect.html#replay\"&gt;replay&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tkl3v710\"&gt;theia diagnose&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Names the likely cause of a failure from a rule table&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-inspect.html#diagnose\"&gt;diagnose&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4wxveyq2\"&gt;theia compare&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Compares two runs&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-inspect.html#compare\"&gt;compare&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ij8s7wqi\"&gt;theia fork&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Branches a run off at a chosen step&lt;/td&gt;\n&lt;td&gt;no, until the fork is continued&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/run-inspect.html#fork\"&gt;fork&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3oq6yhbl\"&gt;theia audit verify&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Checks the hash chains of the event log&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/audit-prune.html#audit-verify\"&gt;audit verify&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7q6uz4mv\"&gt;theia prune&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Deletes the data of finished runs&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/audit-prune.html#prune\"&gt;prune&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n47lrujm\"&gt;theia index&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Builds the code index and searches it&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n06c08iz\"&gt;index build&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/index-cmd.html#index\"&gt;index&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-joa989kp\"&gt;theia mem&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Works with project memory&lt;/td&gt;\n&lt;td&gt;only &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qqj1vgeq\"&gt;mem maintain --llm&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/mem.html#mem\"&gt;mem&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-39gfilnj\"&gt;theia ask&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Answers a question from memory, the index and runs&lt;/td&gt;\n&lt;td&gt;yes, when records were found&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/ask.html#ask\"&gt;ask&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zeenp9h1\"&gt;theia hooks install&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Connects Theia to Claude Code, Codex or git&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/hooks.html#hooks\"&gt;hooks&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vnnc9lze\"&gt;theia serve&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Starts an MCP server for other tools&lt;/td&gt;\n&lt;td&gt;depends on the tool called&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/serve.html#serve\"&gt;serve&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sya8pdp9\"&gt;theia jail&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Runs a command in a sandbox, Linux only&lt;/td&gt;\n&lt;td&gt;no&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/jail.html#jail\"&gt;jail&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pko0a8sw\"&gt;theia eval&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Runs platform benchmarks&lt;/td&gt;\n&lt;td&gt;depends on the subcommand&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/reference/eval.html#eval\"&gt;eval&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;Embeddings (number vectors that capture meaning) for search are computed locally by default and cost nothing. If the settings choose the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p0bg6exd\"&gt;openai&lt;/code&gt; provider, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ohqgl8oj\"&gt;index reindex&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gcieq7ft\"&gt;mem reindex&lt;/code&gt; pay for OpenAI embeddings. See &lt;a href=\"en/guides/knowledge.html\"&gt;Code index, memory and questions&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"global-flags\"&gt;&lt;a href=\"en/reference/commands.html#global-flags\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Global flags&lt;/span&gt;&lt;/a&gt;Global flags&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Flag&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-irr4n50k\"&gt;--x-release &amp;lt;version&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Runs the given Theia version instead of the installed one. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7eisqjym\"&gt;--x-release=&amp;lt;version&amp;gt;&lt;/code&gt; works too. Theia looks for the version in its cache and downloads it when a GitHub token is set. If the version cannot be obtained, the command fails; it never falls back to the current version.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e3ux49pd\"&gt;--dev [path]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;For platform developers only. Runs Theia from a source tree: the given path, or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8g4dttrj\"&gt;dev.root&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-scbpyas7\"&gt;~/.config/theia/config.yaml&lt;/code&gt; (written by &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-00wcwlya\"&gt;theia setup --dev-root &amp;lt;path&amp;gt;&lt;/code&gt;). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rwn64mhu\"&gt;--dev=&amp;lt;path&amp;gt;&lt;/code&gt; works too.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-33nydxw9\"&gt;THEIA_X_RELEASE&lt;/code&gt; environment variable works like the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ungccva5\"&gt;--x-release&lt;/code&gt; flag. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-40rekeim\"&gt;theia --version&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ka5nyi4u\"&gt;theia -V&lt;/code&gt; do the same as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9udsdbiz\"&gt;theia version&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g2ztv1h2\"&gt;--dev&lt;/code&gt; without a path and without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fym96uo4\"&gt;dev.root&lt;/code&gt; in the settings stops the command with exit code 1. It does not print the help:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;--dev: no development root — pass a path (theia --dev &amp;lt;path&amp;gt; …) or set dev.root in ~/.config/theia/config.yaml (theia setup --dev-root &amp;lt;path&amp;gt;)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"440\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-440\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-440\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-440.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9kcf70tz\"&gt;--x-release&lt;/code&gt; does not see versions placed by the installer and downloads them again. One unpacked version takes about 900 MB.&lt;/li&gt;\n&lt;li&gt;A wrong &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-53xua8fs\"&gt;THEIA_X_RELEASE&lt;/code&gt; value breaks every command, even &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ume657z5\"&gt;theia version&lt;/code&gt;. To fix it, remove the variable: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jsam9q58\"&gt;unset THEIA_X_RELEASE&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;See &lt;a href=\"en/install/update.html\"&gt;Update and pick a version&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"exit-codes\"&gt;&lt;a href=\"en/reference/commands.html#exit-codes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Exit codes&lt;/span&gt;&lt;/a&gt;Exit codes&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Code&lt;/th&gt;\n&lt;th&gt;Meaning&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ri86ymcy\"&gt;0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The command succeeded. For &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ux5nxo7\"&gt;theia run&lt;/code&gt; it also means a pause: after the first Ctrl+C, when the budget ran out, or when a loop guard fired&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x1xhz0p9\"&gt;1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;An error or refusal: wrong arguments, no store found, a run's task was discarded (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-473s8bed\"&gt;discarded&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-shgolgm7\"&gt;theia doctor&lt;/code&gt; found a problem&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u2ww4lnf\"&gt;130&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5py0vnq2\"&gt;theia run&lt;/code&gt;: hard stop with a second Ctrl+C&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hki9gdyd\"&gt;143&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bbzerjei\"&gt;theia run&lt;/code&gt;: the process was killed with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ax98iduf\"&gt;SIGTERM&lt;/code&gt;, for example by &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b4vcfez4\"&gt;kill&lt;/code&gt;. Theia does not catch this signal. The run stays open and can be continued with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jf1u4nr1\"&gt;--resume&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;For some commands code 1 has its own meaning:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t2oxsfnp\"&gt;theia replay&lt;/code&gt; — the audit chain of the run is broken.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g12lkbe6\"&gt;theia audit verify&lt;/code&gt; — at least one checked log is broken.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wttws6y8\"&gt;theia index status&lt;/code&gt; — the index is out of date.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Command pages describe these cases.&lt;/p&gt;\n&lt;h2 id=\"argument-rules\"&gt;&lt;a href=\"en/reference/commands.html#argument-rules\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;General rules&lt;/span&gt;&lt;/a&gt;General rules&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;A flag that takes a value uses the next word: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tvs0csn5\"&gt;--budget 5&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Every command skips unknown flags without a warning. A typo such as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gdyu12oo\"&gt;--budjet 3&lt;/code&gt; keeps the default value. The run's budget is visible in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tsfsaxo4\"&gt;run.created&lt;/code&gt; line at the start of the output. There are two exceptions: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q8yq3s1x\"&gt;theia msg&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqvcz2b2\"&gt;theia probe&lt;/code&gt; put an unknown flag into the text of the note or question, so &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fun0xcw2\"&gt;theia msg &amp;lt;runId&amp;gt; --foo hello&lt;/code&gt; records the note &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f6l2rzxh\"&gt;--foo hello&lt;/code&gt;. In &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jrn2qsvx\"&gt;theia answer&lt;/code&gt;, every word without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1x8t77s0\"&gt;--&lt;/code&gt; after &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f7l0syah\"&gt;--question &amp;lt;id&amp;gt;&lt;/code&gt; counts as an answer.&lt;/li&gt;\n&lt;li&gt;Theia validates only the values of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-52kfx2z4\"&gt;run --track&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-krnruiy2\"&gt;run --interaction&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pzf6jlrn\"&gt;prune --older-than&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9w7yl0oe\"&gt;prune --keep&lt;/code&gt; and ids. Other values are taken as they are: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kidfzkwr\"&gt;--budget abc&lt;/code&gt; removes the money limit, see &lt;a href=\"en/reference/run.html#run-budget\"&gt;--budget&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;Ids start with a prefix: run — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9fh954qk\"&gt;run&lt;/code&gt;, task — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vhjk552v\"&gt;tsk&lt;/code&gt;, plan — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hi6t52ju\"&gt;pln&lt;/code&gt;, memory fact — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hjk8y3n0\"&gt;fct&lt;/code&gt;. After the prefix come 22 characters. Commands accept the full id or those 22 characters without the prefix.&lt;/li&gt;\n&lt;li&gt;Only &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o34t1q8u\"&gt;show --task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-54anzc9b\"&gt;msg --task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-irpkigt6\"&gt;fork --at&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-94lhhumk\"&gt;answer --question&lt;/code&gt; accept a short tail of an id.&lt;/li&gt;\n&lt;li&gt;There is no \"list runs\" command. A run id appears in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5w7750g\"&gt;run run… task tsk…&lt;/code&gt; line at the start of a run, in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nf6dfloa\"&gt;resume with: …&lt;/code&gt; hint on pause, and on the home screen (last 5 runs). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-guq8z8k9\"&gt;theia prune --keep 0 --dry-run&lt;/code&gt; prints the full ids of every finished run and deletes nothing. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-79i7tt88\"&gt;theia audit verify&lt;/code&gt; prints ids without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rf88kdvq\"&gt;run&lt;/code&gt;, mixed with the logs of plans and probes. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i1fcz1u4\"&gt;theia show&lt;/code&gt; of a fork names the parent in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mk9o3da2\"&gt;forked from&lt;/code&gt; line, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h36ppekm\"&gt;theia fork&lt;/code&gt; names the new run in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-39hvpjvm\"&gt;drive it:&lt;/code&gt; line. See &lt;a href=\"en/guides/control-run.html#run-id\"&gt;How to find the run id&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-22r6chc9\"&gt;@path&lt;/code&gt; in the text of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h1juir7j\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-winp3ieh\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c73o7d99\"&gt;msg&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jwllbk8h\"&gt;probe&lt;/code&gt; inserts the file's content into the request. See the glossary: &lt;a href=\"en/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6zpz4qs1\"&gt;@path&lt;/code&gt; inclusion&lt;/a&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nkfjsr1z\"&gt;ask&lt;/code&gt; does not support it.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"en/reference/commands.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;See also&lt;/span&gt;&lt;/a&gt;See also&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/about/overview.html\"&gt;What Theia is&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/troubleshooting.html\"&gt;Troubleshooting&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html\"&gt;Glossary&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/reference/commands.html","hreflang":"en"},{"href":"ru/reference/commands.html","hreflang":"ru"}],"style":["_assets/theia.css"],"canonical":"en/reference/commands.html","vcsPath":"en/reference/commands.md"},"headings":[{"title":"How a call is built","href":"en/reference/commands.html#syntax","level":2},{"title":"Commands","href":"en/reference/commands.html#commands","level":2},{"title":"Global flags","href":"en/reference/commands.html#global-flags","level":2},{"title":"Exit codes","href":"en/reference/commands.html#exit-codes","level":2},{"title":"General rules","href":"en/reference/commands.html#argument-rules","level":2},{"title":"See also","href":"en/reference/commands.html#see-also","level":2}],"title":"All commands"},"router":{"pathname":"en/reference/commands","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
        </script>
