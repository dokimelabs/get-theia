        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;p&gt;Theia shows a full-screen text interface (&lt;a href=\"en/glossary.html#tui\"&gt;TUI&lt;/a&gt;) in the terminal. This page walks through each screen, what its parts mean, and the glyphs and colours.&lt;/p&gt;\n&lt;p&gt;The keys are on the page &lt;a href=\"en/tui/navigation.html\"&gt;Navigation and hotkeys&lt;/a&gt;. How to leave a screen without stopping a task is on the page &lt;a href=\"en/tui/leave-running.html\"&gt;Leave without stopping a task&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-info\" note-type=\"info\"&gt;&lt;p class=\"yfm-note-title\"&gt;Note&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;The examples come from test runs with a stand-in model named &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dl1002lz\"&gt;fake&lt;/code&gt;. It answers at once and changes no files. That is why the examples show &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r2soi4tn\"&gt;fake&lt;/code&gt;, zero cost, and tasks that end as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bks50e20\"&gt;discarded&lt;/code&gt;. With a real engine you see its name (for example, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4lv36pw0\"&gt;codex&lt;/code&gt;) and real costs. Long rows are shortened.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h2 id=\"which-screen\"&gt;&lt;a href=\"en/tui/overview.html#which-screen\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Which screen opens&lt;/span&gt;&lt;/a&gt;Which screen opens&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Command&lt;/th&gt;\n&lt;th&gt;Screen&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jw0dm2ao\"&gt;theia&lt;/code&gt; with no command, in a set-up project&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/tui/overview.html#home-screen\"&gt;Home screen&lt;/a&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vt9wqrn5\"&gt;theia&lt;/code&gt; with no command, before the first setup&lt;/td&gt;\n&lt;td&gt;Setup questions, one per line. See &lt;a href=\"en/install/first-setup.html\"&gt;First setup&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i3rswgd7\"&gt;theia run --task \"…\"&lt;/code&gt; in a terminal&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/tui/overview.html#live-run-tree\"&gt;Live run tree&lt;/a&gt;. This is the default view of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ua5u29k0\"&gt;theia run&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4lo79ecp\"&gt;theia run --task \"…\" --tui&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The same live run tree.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s38bkzmo\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/tui/overview.html#stored-run-browser\"&gt;Stored run browser&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;A set-up project means two things: your user settings file exists, and the project has a Theia &lt;a href=\"en/glossary.html#store\"&gt;store&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;The TUI needs a terminal for its output and for your keys. Without one (for example, when output goes to a file), Theia prints a notice and switches to plain lines:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;view: --tui needs an interactive terminal (a TTY for output and keys) — degrading to --plain\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"79\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-79\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-79\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-79.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;With &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9g26ek0t\"&gt;--non-interactive&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dzk51qm3\"&gt;theia run&lt;/code&gt; never opens the TUI:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;view: --tui is interactive; --non-interactive degrades to --plain\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"83\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-83\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-83\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-83.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;If you pipe the task text into &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bxdw4x29\"&gt;theia run&lt;/code&gt;, the TUI still opens and reads your keys from the terminal.&lt;/p&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eyvz6jbh\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt; without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nros3or2\"&gt;--tui&lt;/code&gt; prints a short summary instead of the TUI. The default view of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pj4n7k2v\"&gt;theia run&lt;/code&gt; is set by the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-29wiqahs\"&gt;ui.defaultView&lt;/code&gt; key in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8990xyv\"&gt;policy.yaml&lt;/code&gt;; see &lt;a href=\"en/config/policy.html\"&gt;policy.yaml settings&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"home-screen\"&gt;&lt;a href=\"en/tui/overview.html#home-screen\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Home screen&lt;/span&gt;&lt;/a&gt;Home screen&lt;/h2&gt;\n&lt;p&gt;Run &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qc9p7ksv\"&gt;theia&lt;/code&gt; with no command in the project folder. The &lt;a href=\"en/glossary.html#home-screen\"&gt;home screen&lt;/a&gt; shows setup problems, the state of the code index, your recent runs, and a box for a new task.&lt;/p&gt;\n&lt;p&gt;Example:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia — ~/projects/app\n\nharnesses          : FAIL (neither codex nor claude is authenticated — one is required)\nembeddings         : local/all-MiniLM-L6-v2 (384d) — FAIL (not fetched and autoDownload is off — theia setup --fetch-em…\ntheia: 0 indexed · 1 missing\n\nrecent runs:\n  ✔ run2akdqcdg2s223jpw4ncc54  completed  $0.0000\n\ntask ▸ ▏\n\nEnter run · ? help · q quit\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"99\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-99\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-99\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-99.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Part&lt;/th&gt;\n&lt;th&gt;What it shows&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rfejgaty\"&gt;theia — ~/projects/app&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The current folder.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Problem lines&lt;/td&gt;\n&lt;td&gt;Only the problems that &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9al9bqju\"&gt;theia doctor&lt;/code&gt; finds: warnings and failures. With no problems, this part is empty. Theia checks the engines before it draws the screen, so the screen can take a few seconds to appear.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8zm9zpmh\"&gt;theia: 0 indexed · 1 missing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The state of the &lt;a href=\"en/glossary.html#intent-index\"&gt;code index&lt;/a&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yj0igeqf\"&gt;· N live&lt;/code&gt; is added when some runs have no end record. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tknqntqy\"&gt;· N question waiting&lt;/code&gt; (or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u78k18p7\"&gt;questions&lt;/code&gt;) is added when runs wait for answers.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uhqrrwod\"&gt;recent runs:&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Up to five recent runs, newest first: glyph, run id, outcome, cost. With no runs: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jyawgsw5\"&gt;recent runs: none yet&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n57z4rkj\"&gt;task ▸ ▏&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The box for a new task. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ldqwirp\"&gt;▏&lt;/code&gt; is the text cursor.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0fwzeepz\"&gt;Enter run · ? help · q quit&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Key hints. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5kz4eq6m\"&gt;?&lt;/code&gt; adds the full &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iw22sbpq\"&gt;theia help&lt;/code&gt; text under the screen.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The glyph in front of a recent run:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Glyph&lt;/th&gt;\n&lt;th&gt;Outcome&lt;/th&gt;\n&lt;th&gt;Meaning&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-im8rxz08\"&gt;✔&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2qek1xwb\"&gt;completed&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The run has ended. This does not mean its work was merged: check the tasks with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xls4gszz\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8qc0f8jw\"&gt;◆&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j5izdcvi\"&gt;paused&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The run is &lt;a href=\"en/glossary.html#paused\"&gt;paused&lt;/a&gt; and can be resumed.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-atk2f8d3\"&gt;⣽&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1j4iqmlf\"&gt;in flight&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The run has no end record. It is running now, or its process was killed.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dvszeopc\"&gt;·&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xvjod5a5\"&gt;probe&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ou12utlv\"&gt;ask&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A one-off question, not a task run.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v3uctv2j\"&gt;✖&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;anything else, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p8ih694u\"&gt;abandoned&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The run ended in another way.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;A fork shows &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-akkg46p2\"&gt;forked·&lt;/code&gt; before its outcome, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o2c8f2ov\"&gt;forked·completed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The home screen has no colours and no minimum size. In a small window its lower lines are cut off, including the task box. The keys are in &lt;a href=\"en/tui/navigation.html#home-keys\"&gt;Home screen keys&lt;/a&gt;.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Enter in the task box fails in 0.2.201&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In release 0.2.201, typing a task and pressing Enter does not start a run. The home screen closes, and Theia prints:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;run run2akdqcdzy6223oud53ns4c task tsk2akdqce2gw225ovuhksitw (fast_path)\nkernel: no vendored prompts — the composition root must call setVendorPrompts from the resolved vendor dir (reinstall, or set THEIA_VENDOR_DIR); prompts do not exist in code (THE-065)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"251\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-251\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-251\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-251.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Theia exits with code 1. Setting &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-086rqth8\"&gt;THEIA_VENDOR_DIR&lt;/code&gt;, as the message suggests, does not help. The failed attempt leaves an unfinished run and a branch &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-08q3abqz\"&gt;theia/run-…&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Start tasks with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q9xmuf9c\"&gt;theia run --task \"…\"&lt;/code&gt; instead. To remove what the failed attempt left, follow &lt;a href=\"en/tui/overview.html#home-box-cleanup\"&gt;Clean up after the task box&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;h3 id=\"home-box-cleanup\"&gt;&lt;a href=\"en/tui/overview.html#home-box-cleanup\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Clean up after the task box&lt;/span&gt;&lt;/a&gt;Clean up after the task box&lt;/h3&gt;\n&lt;p&gt;Run these commands in the project folder. You need the run id from the error output, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-45x9h89m\"&gt;run2akdqcdzy6223oud53ns4c&lt;/code&gt;.&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;Close the run as &lt;a href=\"en/glossary.html#abandoned\"&gt;abandoned&lt;/a&gt;:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;theia run --abandon &amp;lt;runId&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"271\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-271\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-271\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-271.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Example output:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;abandoned run2akdqcdzy6223oud53ns4c — workspaces kept; reclaim with 'theia prune'\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"275\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-275\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-275\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-275.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Remove the hidden working copy of the run branch:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;git worktree remove .theia/runs/&amp;lt;runBody&amp;gt;/trunk\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"281\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-281\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-281\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-281.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8q6n677q\"&gt;&amp;lt;runBody&amp;gt;&lt;/code&gt; is the run id without the leading &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k97e8nt8\"&gt;run&lt;/code&gt;, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gf2yrtko\"&gt;2akdqcdzy6223oud53ns4c&lt;/code&gt;.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;Delete the branch:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;git branch -d theia/run-&amp;lt;suffix&amp;gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"290\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-290\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-290\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-290.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-af2qzvcs\"&gt;&amp;lt;suffix&amp;gt;&lt;/code&gt; is the last six characters of the run id, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hno20ytd\"&gt;53ns4c&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Example output:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;Deleted branch theia/run-53ns4c (was 236fdee).\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"297\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-297\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-297\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-297.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;After that, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-685e9n9k\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt; reports &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dw69rbc7\"&gt;halted: abandoned&lt;/code&gt;, and the home screen no longer counts the run as live. More about closing runs: &lt;a href=\"en/guides/control-run.html\"&gt;Control a run&lt;/a&gt;. More about run branches: &lt;a href=\"en/guides/results.html\"&gt;Run results&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"live-run-tree\"&gt;&lt;a href=\"en/tui/overview.html#live-run-tree\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Live run tree&lt;/span&gt;&lt;/a&gt;Live run tree&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fm3oo0ng\"&gt;theia run&lt;/code&gt; in a terminal opens the &lt;a href=\"en/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;. It shows the &lt;a href=\"en/glossary.html#run\"&gt;run&lt;/a&gt;, its &lt;a href=\"en/glossary.html#task\"&gt;tasks&lt;/a&gt;, and the steps of each task. The screen updates while the run works.&lt;/p&gt;\n&lt;p&gt;Example: a run while its &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6bn3ry8y\"&gt;--verify&lt;/code&gt; command works:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;⣾ running · run run2akdqjdzis222hp2m2mi4t · fast_path · $0.0000/$10.00 · 1 call · 7 events                  7s\ntasks: 1 running · 0 done · anomalies 0 · idx ⚠1                                            [@ event 7/7 · live]\n────────────────────────────────────────────────────────────────────────────────────────────────────────────────\n ⣾ ▼ tsk…oj5gsyqs [fast_path]                                                          verify  r1  $0.0000  7.7s\n · ├╴Add a usage section to README.md\n ✔ ├╴workspace @ d7cb7cb (copy)\n ✔ ├╴▶ r1 implement  implementer → ready                                                      1 evidence  0.1s\n ⣾ ╰╴r2 verify  …                                                                                         7.5s\n\n ↑↓ move • ←→ fold • ⏎ zoom • ⇥ pane • f follow:round • e err • m steer • p prompt • w wrap • v view • +/- verbosity=1 • ? • q stop\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"312\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-312\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-312\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-312.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;From top to bottom the screen has: the header (two lines), the tree, the detail pane (after Enter), live activity lines (while a model call works), and the bottom line.&lt;/p&gt;\n&lt;h3 id=\"header\"&gt;&lt;a href=\"en/tui/overview.html#header\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Header&lt;/span&gt;&lt;/a&gt;Header&lt;/h3&gt;\n&lt;p&gt;The first line holds the status, the &lt;a href=\"en/glossary.html#run-id\"&gt;run id&lt;/a&gt;, the &lt;a href=\"en/glossary.html#track\"&gt;track&lt;/a&gt;, money and counters. The time since the start is on the right.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Part&lt;/th&gt;\n&lt;th&gt;Meaning&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-687pq518\"&gt;⣾ running&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The run status: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fpfdmojl\"&gt;running&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-syqm41w0\"&gt;stopping&lt;/code&gt; (you asked to stop, the current step is finishing); &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wez824t5\"&gt;paused&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pkip9uen\"&gt;completed&lt;/code&gt;; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-omrl0b5s\"&gt;stopped (&amp;lt;reason&amp;gt;)&lt;/code&gt;, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rwdqi6zf\"&gt;stopped (abandoned)&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a7eoh5zi\"&gt;run run2akdqjdzis222hp2m2mi4t&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The full run id. Use it with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ao4pnd4r\"&gt;theia show&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q7uzt9jd\"&gt;theia run --resume&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5cja03xt\"&gt;fast_path&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The track of the run.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dmawhj3f\"&gt;$0.0000/$10.00&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Money spent and the &lt;a href=\"en/glossary.html#budget\"&gt;budget&lt;/a&gt;. Without a budget it reads &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-15b0n1ca\"&gt;$0.0000 spent&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cog88vw3\"&gt;1 call · 7 events&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;&lt;a href=\"en/glossary.html#gateway-call\"&gt;Model calls&lt;/a&gt; so far, and records in the &lt;a href=\"en/glossary.html#event-log\"&gt;event log&lt;/a&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The second line holds task counts, warnings, and the position in the log.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Part&lt;/th&gt;\n&lt;th&gt;Meaning&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5q783sgp\"&gt;1 running · 0 done&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Tasks that are working, and tasks whose work was merged.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yefjcsp6\"&gt;N failed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uc3er6f1\"&gt;N frozen&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nx5y3h9y\"&gt;N pending&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Shown only when not zero: discarded tasks; stuck tasks that wait for the &lt;a href=\"en/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ea5s6k0c\"&gt;lead&lt;/code&gt;&lt;/a&gt;; tasks that wait for other tasks.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8vt9o1fs\"&gt;anomalies 0&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Warnings that Theia raised about the run.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7otbb7zx\"&gt;ctx ⚠N&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Warnings about a very large prompt.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hzrvyo9c\"&gt;idx ⚠1&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Code index entries that were &lt;a href=\"en/glossary.html#stale\"&gt;stale&lt;/a&gt; when the run started.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ytktjfzk\"&gt;[@ event 7/7 · live]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;You see the newest state of a working run. In the browser and on the \"run ended\" screen it reads &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-73s3fe3b\"&gt;· head&lt;/code&gt;, or has no word after you step back in history.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h3 id=\"tree\"&gt;&lt;a href=\"en/tui/overview.html#tree\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Tree&lt;/span&gt;&lt;/a&gt;Tree&lt;/h3&gt;\n&lt;p&gt;Each row is one item: the state glyph first, then the tree lines, the fold mark, the label, and facts on the right. What the glyphs mean is in &lt;a href=\"en/tui/overview.html#glyphs\"&gt;Glyphs and colours&lt;/a&gt;.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Row&lt;/th&gt;\n&lt;th&gt;Example&lt;/th&gt;\n&lt;th&gt;Meaning&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Task&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f9j903vp\"&gt;⣾ ▼ tsk…oj5gsyqs [fast_path]&lt;/code&gt; … &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d4yujx9i\"&gt;verify  r1  $0.0000  7.7s&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Short task id and track. On the right: the current &lt;a href=\"en/glossary.html#phase\"&gt;phase&lt;/a&gt;, rounds so far, cost, time. If the task waits for another task: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tfh1u6bn\"&gt;blocked on tsk…&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Task text&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qrjxoyll\"&gt;· ├╴Add a usage section to README.md&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;What the task asks for.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Note&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o6zjhz0i\"&gt;✔ ├╴workspace @ d7cb7cb (copy)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The task works in a copy of the repository made from this commit. Other notes: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bk6nssjk\"&gt;context injected (N entries)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1wpyn444\"&gt;pre-task gates: N run, M failed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f2jaoj1g\"&gt;note &amp;lt;name&amp;gt;&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Round&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2rwcbd6o\"&gt;✔ ├╴▶ r1 implement  implementer → ready&lt;/code&gt; … &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wf39oyi7\"&gt;1 evidence&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;One finished &lt;a href=\"en/glossary.html#round\"&gt;round&lt;/a&gt;: the phase, the &lt;a href=\"en/glossary.html#role\"&gt;role&lt;/a&gt; and its &lt;a href=\"en/glossary.html#verdict\"&gt;verdict&lt;/a&gt;. On the right: the number of evidence items.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Running round&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6nt5woms\"&gt;⣾ ╰╴r2 verify  …&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;The step that works now.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Model call&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqf5fv33\"&gt;✔ │ ├╴· gateway fake ok $0.0000&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;One model call inside a round: &lt;a href=\"en/glossary.html#transport\"&gt;transport&lt;/a&gt;, result, cost.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Evidence&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-py5jo6zn\"&gt;· │ ╰╴test_run 74d01a0c… — exit 0: sleep 60&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Proof for a verdict, for example the result of a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ks1patgr\"&gt;--verify&lt;/code&gt; command.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tool&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5uyccy6v\"&gt;$ &amp;lt;command&amp;gt;&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lqdtgi1q\"&gt;✎ &amp;lt;file&amp;gt;&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pmutrp9k\"&gt;⚙ &amp;lt;tool&amp;gt; &amp;lt;arguments&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A command, a file change or another tool inside a model call. These rows appear only with a real engine; they were not captured for this guide.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Steering&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dz0cbptr\"&gt;» steer [msg] please keep it small&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A note you sent with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ic7gb7zp\"&gt;m&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Anomaly&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aschzrua\"&gt;‼ anomaly &amp;lt;kind&amp;gt;&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;A warning. The same warning repeated in a row folds into one line with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c37mvsif\"&gt;×N&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Other&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c5kkh04v\"&gt;gateway calls (unattributed) ×N&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xyziv37x\"&gt;changeset (N merges)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vic3chzc\"&gt;forked from …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jhsecg8r\"&gt;(no tasks yet)&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Model calls not tied to a task; the result of a run over several roots; the origin of a fork; a run with no tasks yet.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0u2unkjg\"&gt;▼&lt;/code&gt; means the row is open, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iennmvdh\"&gt;▶&lt;/code&gt; means it is closed. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4buxjl33\"&gt;├╴&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qn1hvu55\"&gt;╰╴&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nk12sjdw\"&gt;│&lt;/code&gt; draw the tree.&lt;/li&gt;\n&lt;li&gt;Finished tasks and all rounds start closed. A row that contains a failure opens by itself.&lt;/li&gt;\n&lt;li&gt;Times on the right are dim for finished steps and bright yellow while a step works. Steps shorter than 0.05 s show no time.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h3 id=\"detail-pane\"&gt;&lt;a href=\"en/tui/overview.html#detail-pane\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Detail pane&lt;/span&gt;&lt;/a&gt;Detail pane&lt;/h3&gt;\n&lt;p&gt;Press Enter to open the details of the row under the cursor. The pane opens under the tree. The separator lines name the panes, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ovpvtwq1\"&gt;· focus&lt;/code&gt; marks the pane that gets the arrow keys.&lt;/p&gt;\n&lt;p&gt;Example: the details of a task in a working run:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;──┤ tree · focus ├───────────────────────────────────────────────────────\n ⣽ ▼ tsk…evcxi653 [fast_path]                         verify  r1  $0.0000  39s\n · ├╴demo task for the TUI guide\n ✔ ├╴workspace @ 6035395 (copy)\n ✔ ├╴▶ r1 implement  implementer → ready                     1 evidence  0.1s\n ⣽ ╰╴r2 verify  …                                                         39s\n\n──┤ detail ├─────────────────────────────────────────────────────────────\ntask 2akdqb2bjw223mevcxi653\n  desc: demo task for the TUI guide\n  track: fast_path\n  root: null\n  deps: []\n  baseSha: 603539549a3938bfb27686d6e5b05c0d2a5adf7f\n  phase: verify\n  costUsd: 0\n  phases:\n    ready → implement\n    ready → verify\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"611\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-611\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-611\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-611.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Example: the details of a round in the browser:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;──┤ detail ├─────────────────────────────────────────────────────────────\nverdict verifier → verify_pass\n  evidence:\n    test_run 74d01a0c051c963d9a9b8ab9dbeab1723f0ad8534ea9fa6a942f358d7fa011b4  exit 0: sleep 60\n  fork from here:\n    theia fork run2akdqb2b32223mekgj63py --at evt2akdqbbmgc223mfzdst45f\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"615\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-615\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-615\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-615.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Row&lt;/th&gt;\n&lt;th&gt;The details show&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Task&lt;/td&gt;\n&lt;td&gt;The id, text, track, dependencies, base commit, phase, cost, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u7ip7jem\"&gt;phases:&lt;/code&gt;, the history of phase changes.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Round&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jo50w623\"&gt;verdict &amp;lt;role&amp;gt; → &amp;lt;result&amp;gt;&lt;/code&gt;, the note, the evidence list, and questions (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t1apnmge\"&gt;Q:&lt;/code&gt;) if there were any. In the browser also &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sct4usqr\"&gt;fork from here:&lt;/code&gt; with a ready &lt;a href=\"en/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ndnfnn7\"&gt;theia fork&lt;/code&gt;&lt;/a&gt; command.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Model call&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3o3s1wb3\"&gt;gateway call&lt;/code&gt; and the stored fields of the call: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wo5el5g8\"&gt;kind&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ab5192ao\"&gt;latencyMs&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xutz2dse\"&gt;model&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3zxuk5bv\"&gt;role&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5skntt3a\"&gt;blobRef&lt;/code&gt; and others.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Evidence&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xv6l2gye\"&gt;evidence &amp;lt;kind&amp;gt;&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jln4pzyb\"&gt;ref:&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z0uhin1x\"&gt;note:&lt;/code&gt;. For a commit reference also &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mgjan907\"&gt;inspect: git show &amp;lt;sha&amp;gt;&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Tool&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0wnx0skm\"&gt;tool &amp;lt;name&amp;gt;&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-75v4gmba\"&gt;(FAILED)&lt;/code&gt; when it failed, and its fields.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Steering&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5gfsr5ww\"&gt;steering [msg]&lt;/code&gt; and the text. For answers to questions: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9xqzzx5t\"&gt;Q: … → \"…\"&lt;/code&gt;.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Anomaly&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ylncx1hn\"&gt;anomaly &amp;lt;kind&amp;gt;&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ni2bl53\"&gt;repeated ×N&lt;/code&gt; and the fields.&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;In a small window the pane is only three lines high. To scroll it, see &lt;a href=\"en/tui/navigation.html#detail-keys\"&gt;Detail pane keys&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"live-activity\"&gt;&lt;a href=\"en/tui/overview.html#live-activity\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Live activity lines&lt;/span&gt;&lt;/a&gt;Live activity lines&lt;/h3&gt;\n&lt;p&gt;While a model call works, dim lines appear above the bottom line. They show who works, the last tool, the time, and the number of tools. When a call waits to retry after an error, the middle part names the wait and the reason. Format, taken from the source code (the stand-in model answers at once, so these lines were not captured):&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt;⋯ &amp;lt;role&amp;gt; tsk…&amp;lt;id&amp;gt; (&amp;lt;model&amp;gt;)  &amp;lt;last tool or \"call in flight…\"&amp;gt; · &amp;lt;time&amp;gt; [&amp;lt;N&amp;gt; tools]\n⋯ &amp;lt;role&amp;gt; tsk…&amp;lt;id&amp;gt; (&amp;lt;model&amp;gt;)  ↻ retry &amp;lt;N&amp;gt;/&amp;lt;M&amp;gt; in &amp;lt;seconds&amp;gt;s — &amp;lt;reason&amp;gt; · &amp;lt;time&amp;gt; [&amp;lt;N&amp;gt; tools]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"695\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-695\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-695\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-695.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y8tlnukj\"&gt;+&lt;/code&gt; shows more of these lines and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3b707tvm\"&gt;-&lt;/code&gt; fewer: 2, 6 or 10, but never more than a third of the screen.&lt;/p&gt;\n&lt;h3 id=\"bottom-line\"&gt;&lt;a href=\"en/tui/overview.html#bottom-line\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Bottom line&lt;/span&gt;&lt;/a&gt;Bottom line&lt;/h3&gt;\n&lt;p&gt;The bottom line shows key hints. It lists only the keys that work now. On a narrow screen &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ib7uvlsj\"&gt;w wrap • v view&lt;/code&gt; go first, then &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l42o83is\"&gt;+/- verbosity&lt;/code&gt;.&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs text\"&gt; ↑↓ move • ←→ fold • ⏎ zoom • ⇥ pane • f follow:round • e err • m steer • p prompt • w wrap • v view • +/- verbosity=1 • ? • q stop\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"705\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-705\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-705\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-705.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-arnpiqul\"&gt;f follow:round&lt;/code&gt;: the cursor follows new activity at the level of rounds. Without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2a7zcdwl\"&gt;:round&lt;/code&gt;, the cursor stays where you put it.&lt;/li&gt;\n&l
