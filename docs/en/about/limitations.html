            {"data":{"leading":false,"html":"&lt;p&gt;Some features of this version do not work, or work differently from what you might expect. This page lists them and the ways around them. Error messages and step-by-step fixes are in &lt;a href=\"en/troubleshooting.html\"&gt;Troubleshooting&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"platforms\"&gt;&lt;a href=\"en/about/limitations.html#platforms\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Systems&lt;/span&gt;&lt;/a&gt;Systems&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;No Windows build.&lt;/strong&gt; The installer refuses. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0m4j1jn5\"&gt;install.ps1&lt;/code&gt; script expects an archive that the release does not have. WSL was not tested.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Intel Macs are not supported.&lt;/strong&gt; Builds exist only for macOS on Apple silicon and for Linux (x86_64 and aarch64).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ivqgoaaa\"&gt;theia jail&lt;/code&gt; sandbox does not work on macOS.&lt;/strong&gt; So the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aidj1f30\"&gt;jailed-full&lt;/code&gt; sandbox tier is not available on macOS. Resource limits (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9fjwuhjy\"&gt;run.resources&lt;/code&gt;) work only on Linux with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ec4ab6h6\"&gt;systemd-run&lt;/code&gt;. See &lt;a href=\"en/config/sandbox.html\"&gt;Sandbox&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"install\"&gt;&lt;a href=\"en/about/limitations.html#install\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Install and update&lt;/span&gt;&lt;/a&gt;Install and update&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-48krvc95\"&gt;--dev&lt;/code&gt; flag does not work&lt;/strong&gt; in an installed version: it prints the help and exits with code 1.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-57ka1grl\"&gt;--x-release&lt;/code&gt; downloads a version again&lt;/strong&gt;, even when the installer already placed it. One unpacked version takes about 900 MB. After &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ps1t9mgc\"&gt;theia self update&lt;/code&gt; the cache keeps one more full copy.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A wrong &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6aqodrzc\"&gt;THEIA_X_RELEASE&lt;/code&gt; value breaks every command&lt;/strong&gt;, even &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-58grfx0g\"&gt;theia version&lt;/code&gt;. Remove the variable: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zu4cct1y\"&gt;unset THEIA_X_RELEASE&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k9bbx3i5\"&gt;theia self update&lt;/code&gt; compares versions as strings&lt;/strong&gt; (seen in the code). After an update, check the version with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8te5el84\"&gt;theia version&lt;/code&gt;. How to go back to the previous version is in &lt;a href=\"en/install/update.html#rollback\"&gt;Update and pick a version&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d2uj8qe0\"&gt;theia setup&lt;/code&gt; deletes keys it does not know from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nb96in9v\"&gt;config.yaml&lt;/code&gt;.&lt;/strong&gt; Do not keep your own entries in that file.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;On macOS the settings folder can \"move\".&lt;/strong&gt; If &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r2hlvs06\"&gt;~/Library/Application Support/theia&lt;/code&gt; ever appears, Theia stops reading &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qce52eml\"&gt;~/.config/theia&lt;/code&gt;, and the GitHub token with it. See &lt;a href=\"en/install/first-setup.html\"&gt;First setup&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Running the installer again does not replace a saved GitHub token.&lt;/strong&gt; Set a new token with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gqvxgslm\"&gt;theia setup --pat&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The first-run wizard creates &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-raf68sy0\"&gt;.theia&lt;/code&gt; in the current folder&lt;/strong&gt;, even in a repository subfolder or in a folder without git. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xreng5p5\"&gt;theia init&lt;/code&gt; puts the store at the repository root, so run it from the root.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Running &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ipyaa0wb\"&gt;theia init --harness …&lt;/code&gt; again does not change the engine&lt;/strong&gt;, although it prints the new name. Change the engine in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z7gdsc3x\"&gt;policy.yaml&lt;/code&gt; — see &lt;a href=\"en/config/models.html\"&gt;Models for tasks&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"runs\"&gt;&lt;a href=\"en/about/limitations.html#runs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Runs&lt;/span&gt;&lt;/a&gt;Runs&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Guidance and answers do not reach a new run.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h66o0tw6\"&gt;theia msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-towmpry9\"&gt;theia answer&lt;/code&gt;, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nmah3tev\"&gt;--interaction bus&lt;/code&gt; flag and the MCP tools &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ekfwlu42\"&gt;run_stop&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3k09a4ni\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uk8fz3ka\"&gt;run_answer&lt;/code&gt; work only with a run continued through &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rgob6dup\"&gt;theia run --resume&lt;/code&gt;. The working order is in &lt;a href=\"en/guides/control-run.html\"&gt;Control a run&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A run starts from the upstream branch, not from your local &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5hu6zhx\"&gt;HEAD&lt;/code&gt;.&lt;/strong&gt; Commits you have not pushed yet do not get into the run. To include them, pass &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6x6142ir\"&gt;--base HEAD&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Ctrl+C in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kl46y1b4\"&gt;--plain&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8rjy6dkn\"&gt;--cli&lt;/code&gt; modes kills the check command.&lt;/strong&gt; Theia records a false &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ejtzuzhn\"&gt;verify_fail&lt;/code&gt; with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-420tasv3\"&gt;exit null&lt;/code&gt;. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jle9aa9g\"&gt;q&lt;/code&gt; key in the TUI does not do this.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-punfs8jl\"&gt;theia run --resume&lt;/code&gt; continues even a closed run&lt;/strong&gt; — one closed with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-om8eqxj6\"&gt;--abandon&lt;/code&gt;. Before resuming, check &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8cz7dj28\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt;: if it says &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uqrgg4pv\"&gt;halted: abandoned&lt;/code&gt;, start a new run instead.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A refused &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9wq561fo\"&gt;theia run --from-plan&lt;/code&gt; leaves traces.&lt;/strong&gt; When the plan is not approved, a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p29hwfyx\"&gt;theia/run-…&lt;/code&gt; branch, a folder in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fxbaqefu\"&gt;.theia/runs/&lt;/code&gt; and an unfinished run are created anyway. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4rdla8wc\"&gt;theia prune&lt;/code&gt; does not remove them.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1a5rqsde\"&gt;theia run&lt;/code&gt; silently skips unknown flags.&lt;/strong&gt; A non-numeric &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ayhs4e3v\"&gt;--budget&lt;/code&gt; value removes the budget limit.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hlvnek00\"&gt;--max-rounds 0&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sn0ngqhg\"&gt;--max-rescopes 0&lt;/code&gt; on the command line remove the limit&lt;/strong&gt;, while &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yvf1j46r\"&gt;maxRescopes: 0&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nhjma0v8\"&gt;policy.yaml&lt;/code&gt; forbids rescoping instead (seen in the code).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3l3rz1yu\"&gt;halted: budget&lt;/code&gt; is not about money.&lt;/strong&gt; It is an internal cap of 1000 verdicts. When the money runs out, the run pauses: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a89zwx05\"&gt;halted: paused&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Exit code 0 also means a pause.&lt;/strong&gt; This includes the case when no role can work: no route to a model, or a blocked secret in the task text.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0a1eamf\"&gt;theia show --task&lt;/code&gt; works only for merged tasks.&lt;/strong&gt; For a discarded task it says the branch was not found.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e7lkyau0\"&gt;theia audit verify&lt;/code&gt; with a scope that does not exist answers &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-74riokxe\"&gt;intact&lt;/code&gt;.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gfd18l0l\"&gt;theia prune&lt;/code&gt; does not delete &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ltfrvbrc\"&gt;theia/run-*&lt;/code&gt; branches, git worktree records or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cdzs2d1r\"&gt;probe&lt;/code&gt; scopes.&lt;/strong&gt; Delete the branches yourself; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cifg4k7w\"&gt;git worktree prune&lt;/code&gt; clears the worktree records.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A run fork (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a57fhm9i\"&gt;fork&lt;/code&gt;) has its own rules.&lt;/strong&gt; Its default budget is $5, whatever the settings say. When you continue a fork, merges go into the branch currently checked out in your working copy. A fork of a finished run made without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7x1ypcfq\"&gt;--at&lt;/code&gt; cannot be continued.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d2cryrto\"&gt;THEIA_LOG_FILE&lt;/code&gt; can stay empty&lt;/strong&gt; when a run lasts less than a second.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The paths &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lbgdsu0j\"&gt;@/…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fw7zs1gd\"&gt;@./…&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q6s1rc7v\"&gt;@../…&lt;/code&gt; in a task text are not inserted&lt;/strong&gt; and give no error. Write the path from the current folder without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fjhexxsa\"&gt;./&lt;/code&gt;, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-75xlt3ze\"&gt;@src/app.ts&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tui\"&gt;&lt;a href=\"en/about/limitations.html#tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TUI screen&lt;/span&gt;&lt;/a&gt;TUI screen&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;There is no key to leave the screen and keep the run going.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q5mwsojq\"&gt;q&lt;/code&gt; pauses the run. Closing the terminal window kills Theia and the check command with no pause. How to keep a task running is in &lt;a href=\"en/tui/leave-running.html\"&gt;Leave without stopping a task&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zkvqe5a5\"&gt;nohup theia run … &amp;amp;&lt;/code&gt; does not survive closing the terminal window.&lt;/strong&gt; Run inside tmux, or in the background with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-29hrzmvw\"&gt;&amp;lt; /dev/null &amp;amp;&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6sajxpa\"&gt;disown&lt;/code&gt;. See &lt;a href=\"en/tui/leave-running.html#background\"&gt;Leave without stopping a task&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A run stopped hard looks alive&lt;/strong&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y0j2yety\"&gt;running&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-631bzsup\"&gt;in flight&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tw0x1nj2\"&gt;· N live&lt;/code&gt;. Continue it with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sywek2nm\"&gt;--resume&lt;/code&gt; or close it with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n6s0d8cp\"&gt;--abandon&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Ctrl+C does nothing while you type a steering note.&lt;/strong&gt; Press Esc or Tab first, then &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ar0lcco4\"&gt;q&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The task box on the home screen does not work.&lt;/strong&gt; Enter fails with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eaqiiju7\"&gt;kernel: no vendored prompts&lt;/code&gt; and leaves an open run and a branch behind. Start tasks with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0bi5net2\"&gt;theia run --task&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sohzrobk\"&gt;theia run --resume &amp;lt;runId&amp;gt; --tui&lt;/code&gt; draws an incomplete tree&lt;/strong&gt;: it holds only the events after the resume.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Seeking on the finished-run screen only changes the event counter.&lt;/strong&gt; Real seeking works in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gfsrzx8a\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nuwt42aa\"&gt;v&lt;/code&gt; key does not open the output of check rows&lt;/strong&gt; — only the texts of model calls.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;After &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gie6z2ra\"&gt;kill -TERM&lt;/code&gt; the terminal stays in the alternate screen&lt;/strong&gt; with the cursor hidden.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Temporary &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jeqx8wmv\"&gt;theia-blob-*.txt&lt;/code&gt; files are never deleted.&lt;/strong&gt; They hold model request texts and sit in the system temp folder.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;In a small window lines get cut&lt;/strong&gt;, and the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-61edcfpg\"&gt;terminal too small&lt;/code&gt; message is garbled. The minimum window size is 20×5 characters.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"knowledge\"&gt;&lt;a href=\"en/about/limitations.html#knowledge\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Code index, memory and questions&lt;/span&gt;&lt;/a&gt;Code index, memory and questions&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;The index and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-elc31xm6\"&gt;theia ask&lt;/code&gt; work only in a git repository.&lt;/strong&gt; In a folder without git they fail with a git error.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o4d5w7w1\"&gt;theia index build&lt;/code&gt; does not refresh search.&lt;/strong&gt; After a build, run &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vm43g4nn\"&gt;theia index reindex&lt;/code&gt;, or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ex04dna8\"&gt;index search&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5mfynhsm\"&gt;ask&lt;/code&gt; will not see the new cards.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gt49rj3s\"&gt;theia index&lt;/code&gt; with no subcommand runs a full build&lt;/strong&gt; and can spend money.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Search fails when a vector index is published but the local embedding model is not available.&lt;/strong&gt; This affects &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ikku1o8e\"&gt;index search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dd05fk9y\"&gt;mem search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i2v09546\"&gt;mem asof&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gl27vi2o\"&gt;ask&lt;/code&gt;. There is no word-only fallback in this case.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qej7vtd3\"&gt;theia mem add&lt;/code&gt; does not mask secrets.&lt;/strong&gt; Do not put keys or tokens into facts.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-89kgcsdf\"&gt;theia mem supersede&lt;/code&gt; does not check the new id.&lt;/strong&gt; Even with a typo, the old fact disappears from search, and the replacement cannot be undone.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;There is no command to delete a fact.&lt;/strong&gt; A fact can only be replaced; the old one stays in history. E-mail addresses are not masked in memory.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The date &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cf3b3hc7\"&gt;2026-09&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f7zqttfu\"&gt;theia mem chunk --date&lt;/code&gt; is taken as the whole year.&lt;/strong&gt; Write the month in words: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jcfscor1\"&gt;September 2026&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A failed &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b4ipdtxp\"&gt;reindex&lt;/code&gt; leaves an unfinished search folder behind&lt;/strong&gt;, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zk86l8yy\"&gt;theia mem maintain&lt;/code&gt; does not delete it.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Cards copied from the shared cache are not counted in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iply9zlh\"&gt;written&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ij4h5eg7\"&gt;current&lt;/code&gt;&lt;/strong&gt; in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-58kc2434\"&gt;theia index build&lt;/code&gt; report. Only the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jzh2ia1y\"&gt;rate:&lt;/code&gt; line shows them.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3o5vq44m\"&gt;--root root&lt;/code&gt; in a single-root project creates separate memory.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9u2zc4oa\"&gt;mem search&lt;/code&gt;, the hooks and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r1q993ft\"&gt;ask&lt;/code&gt; do not see it.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8sw5yi7f\"&gt;theia ask&lt;/code&gt; almost always calls a model.&lt;/strong&gt; If the store has at least one fact or run, the answer goes through a model.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Setting &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zrs16lg4\"&gt;memory.sentenceGraph&lt;/code&gt; to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kfv7wgp6\"&gt;h0&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wwb2fvq9\"&gt;h1&lt;/code&gt; turns off vector search.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l1l3dbme\"&gt;eval swebl&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-krcbeck7\"&gt;eval memory&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rwfiyf0h\"&gt;eval demo create&lt;/code&gt; are tools for platform developers.&lt;/strong&gt; They download data, call models and expect paths from the development setup.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"config\"&gt;&lt;a href=\"en/about/limitations.html#config\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Settings and keys&lt;/span&gt;&lt;/a&gt;Settings and keys&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Settings are merged only one level deep.&lt;/strong&gt; The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5z9ccmc4\"&gt;gateway.routing&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8tvi0eei\"&gt;gateway.models&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rt4aj0gf\"&gt;gateway.embeddings&lt;/code&gt; sections from project settings replace the same sections from user settings as a whole.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A settings error names the section, not the key&lt;/strong&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ifog7nel\"&gt;spec.run: unrecognized_keys&lt;/code&gt;. A typo in a role name inside &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q012mbgx\"&gt;routing&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ewq9tf4f\"&gt;models&lt;/code&gt; is silently ignored.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fproy5kc\"&gt;theia doctor&lt;/code&gt; does not show routes or models.&lt;/strong&gt; It looks only at &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8aeug3mb\"&gt;.theia&lt;/code&gt; in the current folder and says &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m9e2z3wf\"&gt;docker ready&lt;/code&gt; even when Docker is not running. A &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gqa3qgl5\"&gt;lexical index : FAIL&lt;/code&gt; line does not change the exit code (seen in the code).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ebfujl51\"&gt;dataClasses&lt;/code&gt; field of transports has no effect.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Secret detectors know only five kinds of data&lt;/strong&gt;: private keys, API keys, card numbers, seed phrases and e-mail addresses. API keys are recognized only by the start &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zaau0msg\"&gt;sk-&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wd1bntwe\"&gt;AKIA&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nh4ywohf\"&gt;ghp_&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8fn3qkhd\"&gt;gho_&lt;/code&gt;. Other tokens, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t92x6fre\"&gt;github_pat_…&lt;/code&gt;, go unnoticed.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A task text with a blocked secret is still saved in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5jnb6ulb\"&gt;.theia/store.db&lt;/code&gt; as it is&lt;/strong&gt;, although it never goes to a model.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i62sryc1\"&gt;gateway.harnessConfig&lt;/code&gt; works only for Codex.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The code does not read the rules and skills shipped with Theia.&lt;/strong&gt; The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pc6l6ez1\"&gt;run.rulesSoT&lt;/code&gt; setting hides &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j9ybbg40\"&gt;AGENTS.md&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e40vgoi5\"&gt;CLAUDE.md&lt;/code&gt; from the engine but does not insert them into requests.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The budget counts Claude calls at list price&lt;/strong&gt;, even when you work on a subscription (seen in the code).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"integrations\"&gt;&lt;a href=\"en/about/limitations.html#integrations\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Integrations&lt;/span&gt;&lt;/a&gt;Integrations&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Hooks, the status line and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g8p0y7jj\"&gt;.mcp.json&lt;/code&gt; point at the file of one specific version&lt;/strong&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l4ersmv8\"&gt;…/releases/0.2.201/theia&lt;/code&gt;), not at &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lavfg6ak\"&gt;~/.local/bin/theia&lt;/code&gt;. After an update, Claude Code and Codex keep running the old version. Running &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0a9wme7k\"&gt;theia hooks install claude&lt;/code&gt; again adds a second set of hooks and does not fix the path. Replace the path with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-twvz63pn\"&gt;~/.local/bin/theia&lt;/code&gt;, or remove the old entries and install the hooks again — see &lt;a href=\"en/integrations/claude-code.html#after-update\"&gt;Claude Code&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;There is no &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q4dkv2ma\"&gt;hooks uninstall&lt;/code&gt; command.&lt;/strong&gt; Integrations are removed by hand. The steps are on the &lt;a href=\"en/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;, &lt;a href=\"en/integrations/codex.html\"&gt;Codex&lt;/a&gt; and &lt;a href=\"en/integrations/git.html\"&gt;Git&lt;/a&gt; pages.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The Claude Code &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iazrnmyi\"&gt;Stop&lt;/code&gt; hook fires after every response.&lt;/strong&gt; Each time it saves up to 16 KB of the conversation into memory and does not remove repeats. Project memory grows. To stop this, delete the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cb3h66ck\"&gt;Stop&lt;/code&gt; entry from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gxpbyg5y\"&gt;.claude/settings.json&lt;/code&gt;; installing the hooks again brings it back.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mf30h3ot\"&gt;/theia&lt;/code&gt; skill cannot control a new run.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-119y9h9e\"&gt;run_msg&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qm89i0st\"&gt;run_stop&lt;/code&gt; have no effect on a run started with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ckm11rw\"&gt;run_start&lt;/code&gt;, although they reply that everything was delivered. Questions from such a run never reach Claude.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A run killed from outside still shows as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kuno26hf\"&gt;live&lt;/code&gt;&lt;/strong&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qp1tsrcs\"&gt;run_list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tdazvz2x\"&gt;run_status&lt;/code&gt; and the status line.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Codex gets a reduced MCP server&lt;/strong&gt;: 5 tools, no run control and no &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w9jzdujn\"&gt;/theia&lt;/code&gt; skill. The server and hooks start working only after two trust confirmations in Codex.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-28lm9ezw\"&gt;theia hooks install git&lt;/code&gt; silently does nothing when git has &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gg1q4xm4\"&gt;core.hooksPath&lt;/code&gt; set.&lt;/strong&gt; In a git worktree the command fails with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-etjtx5hb\"&gt;ENOTDIR&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;An invalid &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vpi965ht\"&gt;.mcp.json&lt;/code&gt; stops &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mbexe3ok\"&gt;theia hooks install claude&lt;/code&gt; halfway&lt;/strong&gt; with code 1.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m38v0eel\"&gt;theia serve --metrics&lt;/code&gt; listens on all network interfaces.&lt;/strong&gt; A second server on the same port crashes. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dct9ho1y\"&gt;/metrics&lt;/code&gt; shows only the server's own counters; run metrics leave only through OTLP.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-se0lpviu\"&gt;ops/observability&lt;/code&gt; stack is not part of the release.&lt;/strong&gt; It exists only in the source repository. The Grafana panel for the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zxi4tzda\"&gt;theia_pii_total&lt;/code&gt; metric is always empty.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fa0kuf6d\"&gt;run_start&lt;/code&gt; with a wrong plan id leaves an empty &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1c8bf68m\"&gt;theia/run-*&lt;/code&gt; branch.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;There is no pull request creation, no branch push, no Slack, webhooks or Jira.&lt;/strong&gt; Azure DevOps exists only as a text file in the shipped set.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"en/about/limitations.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;See also&lt;/span&gt;&lt;/a&gt;See also&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/troubleshooting.html\"&gt;Troubleshooting&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/about/platforms.html\"&gt;Systems and run modes&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/guides/control-run.html\"&gt;Control a run&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n
