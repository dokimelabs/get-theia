            {"data":{"leading":false,"html":"&lt;p&gt;Some features of this version do not work, or work differently from what you might expect. This page lists them and the ways around them. Error messages and step-by-step fixes are in &lt;a href=\"en/troubleshooting.html\"&gt;Troubleshooting&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"platforms\"&gt;&lt;a href=\"en/about/limitations.html#platforms\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Systems&lt;/span&gt;&lt;/a&gt;Systems&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;No Windows build.&lt;/strong&gt; The installer refuses. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tsbsivoc\"&gt;install.ps1&lt;/code&gt; script expects an archive that the release does not have. WSL was not tested.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Intel Macs are not supported.&lt;/strong&gt; Builds exist only for macOS on Apple silicon and for Linux (x86_64 and aarch64).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bdgf1chc\"&gt;theia jail&lt;/code&gt; sandbox does not work on macOS.&lt;/strong&gt; So the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hol2ba6q\"&gt;jailed-full&lt;/code&gt; &lt;a href=\"en/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt; is not available on macOS. Resource limits (&lt;a href=\"en/glossary.html#run-resources\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pcahubn0\"&gt;run.resources&lt;/code&gt;&lt;/a&gt;) work only on Linux with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-skrokzi6\"&gt;systemd-run&lt;/code&gt;. See &lt;a href=\"en/config/sandbox.html\"&gt;Sandbox&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"install\"&gt;&lt;a href=\"en/about/limitations.html#install\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Install and update&lt;/span&gt;&lt;/a&gt;Install and update&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;a href=\"en/glossary.html#dev\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0fertm60\"&gt;--dev&lt;/code&gt;&lt;/a&gt; flag does not work in an installed version.&lt;/strong&gt; Without a path it prints &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-phmo0u9p\"&gt;--dev: no development root — pass a path (theia --dev &amp;lt;path&amp;gt; …) or set dev.root in …&lt;/code&gt; and exits with code 1; it does not print the help. The flag is for platform developers — see &lt;a href=\"en/install/update.html#for-developers\"&gt;For platform developers&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"en/glossary.html#x-release\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r7gqszf2\"&gt;--x-release&lt;/code&gt;&lt;/a&gt; downloads a version again&lt;/strong&gt;, even when the installer already placed it. One unpacked version takes about 900 MB. After &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d77ov6bl\"&gt;theia self update&lt;/code&gt; the cache keeps one more full copy.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A wrong &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vv3mncce\"&gt;THEIA_X_RELEASE&lt;/code&gt; value breaks every command&lt;/strong&gt;, even &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u2877fe8\"&gt;theia version&lt;/code&gt;. Remove the variable: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-euqrq2fu\"&gt;unset THEIA_X_RELEASE&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"en/reference/setup-self-version.html#self-update\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5c7whql3\"&gt;theia self update&lt;/code&gt;&lt;/a&gt; compares versions as strings&lt;/strong&gt; (seen in the code). After an update, check the version with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xku6iqe7\"&gt;theia version&lt;/code&gt;. How to go back to the previous version is in &lt;a href=\"en/install/update.html#rollback\"&gt;Update and pick a version&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"en/reference/setup-self-version.html#setup\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xa289sme\"&gt;theia setup&lt;/code&gt;&lt;/a&gt; deletes keys it does not know from &lt;a href=\"en/glossary.html#user-config\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sfpqckx3\"&gt;config.yaml&lt;/code&gt;&lt;/a&gt;.&lt;/strong&gt; Do not keep your own entries in that file.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;On macOS the settings folder can \"move\".&lt;/strong&gt; If &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fh457h7w\"&gt;~/Library/Application Support/theia&lt;/code&gt; ever appears, Theia stops reading &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a67dh5u5\"&gt;~/.config/theia&lt;/code&gt;, and the GitHub token with it. See &lt;a href=\"en/install/first-setup.html\"&gt;First setup&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Running the installer again does not replace a saved GitHub token.&lt;/strong&gt; Set a new token with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x5jn000c\"&gt;theia setup --pat&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;a href=\"en/glossary.html#setup-wizard\"&gt;first-run wizard&lt;/a&gt; creates &lt;a href=\"en/glossary.html#theia-dir\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xjvo1vma\"&gt;.theia&lt;/code&gt;&lt;/a&gt; in the current folder&lt;/strong&gt;, even in a repository subfolder or in a folder without git. &lt;a href=\"en/reference/init.html#init\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q99924bt\"&gt;theia init&lt;/code&gt;&lt;/a&gt; puts the store at the repository root, so run it from the root.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Running &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nlcpii3u\"&gt;theia init --harness …&lt;/code&gt; again does not change the engine&lt;/strong&gt;, although it prints the new name. Change the &lt;a href=\"en/glossary.html#harness\"&gt;engine&lt;/a&gt; in &lt;a href=\"en/glossary.html#policy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kwie2o4u\"&gt;policy.yaml&lt;/code&gt;&lt;/a&gt; — see &lt;a href=\"en/config/models.html\"&gt;Models for tasks&lt;/a&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"runs\"&gt;&lt;a href=\"en/about/limitations.html#runs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Runs&lt;/span&gt;&lt;/a&gt;Runs&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"en/glossary.html#steering\"&gt;Steering&lt;/a&gt; and answers do not reach a new &lt;a href=\"en/glossary.html#run\"&gt;run&lt;/a&gt;.&lt;/strong&gt; &lt;a href=\"en/reference/run-control.html#msg\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gydk2b3t\"&gt;theia msg&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/reference/run-control.html#answer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4m2r4a13\"&gt;theia answer&lt;/code&gt;&lt;/a&gt;, the &lt;a href=\"en/glossary.html#control-bus\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6z9ld6jo\"&gt;--interaction bus&lt;/code&gt;&lt;/a&gt; flag and the MCP tools &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cw3hn451\"&gt;run_stop&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xvwpw9v4\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aiwkfjqt\"&gt;run_answer&lt;/code&gt; work only with a run continued through &lt;a href=\"en/reference/run.html#run-resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mcy2fwpr\"&gt;theia run --resume&lt;/code&gt;&lt;/a&gt;. The working order is in &lt;a href=\"en/guides/control-run.html\"&gt;Control a run&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A run starts from the upstream branch, not from your local &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4q3itsp0\"&gt;HEAD&lt;/code&gt;.&lt;/strong&gt; Commits you have not pushed yet do not get into the run. To include them, pass &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cglxbo9q\"&gt;--base HEAD&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Ctrl+C in &lt;a href=\"en/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b1to1uq0\"&gt;--plain&lt;/code&gt;&lt;/a&gt; and &lt;a href=\"en/glossary.html#board\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u1m9cu3a\"&gt;--cli&lt;/code&gt;&lt;/a&gt; modes kills the check command.&lt;/strong&gt; Theia records a false &lt;a href=\"en/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bqv7h1fg\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt; with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-baj70b6b\"&gt;exit null&lt;/code&gt;. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-74v9wsnt\"&gt;q&lt;/code&gt; key in the TUI does not do this.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-os07fngl\"&gt;theia run --resume&lt;/code&gt; continues even a closed run&lt;/strong&gt; — one closed with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-neaofrc6\"&gt;--abandon&lt;/code&gt;. Before resuming, check &lt;a href=\"en/reference/run-inspect.html#show\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v908lzib\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt;&lt;/a&gt;: if it says &lt;a href=\"en/glossary.html#abandoned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mayaa111\"&gt;halted: abandoned&lt;/code&gt;&lt;/a&gt;, start a new run instead.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A refused &lt;a href=\"en/reference/run.html#run-from-plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9xglbd1a\"&gt;theia run --from-plan&lt;/code&gt;&lt;/a&gt; leaves traces.&lt;/strong&gt; When the plan is not approved, or the word after the flag is not a plan id (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kebh14w9\"&gt;terryid: malformed id '…'&lt;/code&gt;), a &lt;a href=\"en/glossary.html#run-branch\"&gt;run branch&lt;/a&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ugbhqdo5\"&gt;theia/run-…&lt;/code&gt;, a folder in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0vc82lk5\"&gt;.theia/runs/&lt;/code&gt; and an unfinished run are created anyway. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eag54oir\"&gt;theia prune&lt;/code&gt; does not remove them.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k7d5708t\"&gt;theia run&lt;/code&gt; silently skips unknown flags.&lt;/strong&gt; A non-numeric &lt;a href=\"en/glossary.html#budget\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7w7dsm0a\"&gt;--budget&lt;/code&gt;&lt;/a&gt; value gives no error either: Theia prints &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dh1izcbq\"&gt;budget=$NaN&lt;/code&gt; and, at the end, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2d862kyv\"&gt;budget remaining: NaN&lt;/code&gt;. No limit applies, but Theia does not call it &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jvjf9y2z\"&gt;unmetered&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7xagjoq5\"&gt;--max-rounds 0&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-59zommiz\"&gt;--max-rescopes 0&lt;/code&gt; on the command line remove the limit&lt;/strong&gt;, while &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hfzzuat4\"&gt;maxRescopes: 0&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ge4rncki\"&gt;policy.yaml&lt;/code&gt; forbids rescoping instead (seen in the code).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"en/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m9lt1psx\"&gt;halted: budget&lt;/code&gt;&lt;/a&gt; is not about money.&lt;/strong&gt; It is an internal cap of 1000 verdicts. When the money runs out, the run pauses: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iykufgqx\"&gt;halted: paused&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Exit code 0 also means a pause.&lt;/strong&gt; This includes the case when no role can work: no route to a model, or a blocked secret in the task text.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j8f9g57v\"&gt;theia show --task&lt;/code&gt; works only for &lt;a href=\"en/glossary.html#merged\"&gt;merged&lt;/a&gt; tasks.&lt;/strong&gt; For a discarded task it says the branch was not found.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"en/reference/audit-prune.html#audit-verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wgx4846q\"&gt;theia audit verify&lt;/code&gt;&lt;/a&gt; with a &lt;a href=\"en/glossary.html#scope\"&gt;scope&lt;/a&gt; that does not exist answers &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9zt5z636\"&gt;intact&lt;/code&gt;.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"en/reference/audit-prune.html#prune\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wn9idhlo\"&gt;theia prune&lt;/code&gt;&lt;/a&gt; does not delete &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c2k5syy9\"&gt;theia/run-*&lt;/code&gt; branches, git worktree records or &lt;a href=\"en/glossary.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6xmwlz2b\"&gt;probe&lt;/code&gt;&lt;/a&gt; scopes.&lt;/strong&gt; Delete the branches yourself; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x5syxhk3\"&gt;git worktree prune&lt;/code&gt; clears the worktree records (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7660z3j\"&gt;git worktree list&lt;/code&gt; marks them &lt;a href=\"en/glossary.html#prunable\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jlm5tdzg\"&gt;prunable&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A run fork (&lt;a href=\"en/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ptrqzxrf\"&gt;fork&lt;/code&gt;&lt;/a&gt;) has its own rules.&lt;/strong&gt; Its default budget is $5, whatever the settings say. When you continue a fork, merges go into the branch currently checked out in your working copy. A fork of a finished run made without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jv3qtr8d\"&gt;--at&lt;/code&gt; cannot be continued.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"en/glossary.html#theia-log-file\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-slp2xblk\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/a&gt; can stay empty&lt;/strong&gt; when a run lasts less than a second.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;a href=\"en/glossary.html#file-inclusion\"&gt;paths&lt;/a&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mbnop5qa\"&gt;@/…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zw397vk0\"&gt;@./…&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dsyd0jwg\"&gt;@../…&lt;/code&gt; in a task text are not inserted&lt;/strong&gt; and give no error. Write the path from the current folder without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s5qw37q2\"&gt;./&lt;/code&gt;, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q7bfhiqx\"&gt;@src/app.ts&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"tui\"&gt;&lt;a href=\"en/about/limitations.html#tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TUI screen&lt;/span&gt;&lt;/a&gt;TUI screen&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;There is no key to leave the screen and keep the run going.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kyw1tpqm\"&gt;q&lt;/code&gt; pauses the run. Closing the terminal window kills Theia and the check command with no pause. How to keep a task running is in &lt;a href=\"en/tui/leave-running.html\"&gt;Leave without stopping a task&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hvuezlz6\"&gt;nohup theia run … &amp;amp;&lt;/code&gt; does not survive closing the terminal window.&lt;/strong&gt; Run inside tmux, or in the background with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jkatz0fn\"&gt;&amp;lt; /dev/null &amp;amp;&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iqf0i3p9\"&gt;disown&lt;/code&gt;. See &lt;a href=\"en/tui/leave-running.html#background\"&gt;Leave without stopping a task&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A run &lt;a href=\"en/glossary.html#hard-stop\"&gt;stopped hard&lt;/a&gt; looks alive&lt;/strong&gt;: &lt;a href=\"en/glossary.html#running\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jqmafmmt\"&gt;running&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mefcw6l9\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l3m89ax9\"&gt;· N live&lt;/code&gt;&lt;/a&gt;. Continue it with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2285wln2\"&gt;--resume&lt;/code&gt; or close it with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d5hj2a1h\"&gt;--abandon&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Ctrl+C does nothing while you type a steering note.&lt;/strong&gt; Press Esc or Tab first, then &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-16r4kcse\"&gt;q&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The task box on the home screen does not work.&lt;/strong&gt; Enter fails with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gxsxlpf3\"&gt;kernel: no vendored prompts&lt;/code&gt; and leaves an open run and a branch behind. Start tasks with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bubt053c\"&gt;theia run --task&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f6gxuife\"&gt;theia run --resume &amp;lt;runId&amp;gt; --tui&lt;/code&gt; draws an incomplete tree&lt;/strong&gt;: it holds only the events after the resume.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Seeking on the finished-run screen only changes the event counter.&lt;/strong&gt; Real seeking works in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jk0zu6om\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zduj1hjh\"&gt;v&lt;/code&gt; key does not open the output of check rows&lt;/strong&gt; — only the texts of model calls.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;After &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xw8w65ju\"&gt;kill -TERM&lt;/code&gt; the terminal stays in the alternate screen&lt;/strong&gt; with the cursor hidden.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Temporary &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ymfec3op\"&gt;theia-blob-*.txt&lt;/code&gt; files are never deleted.&lt;/strong&gt; They hold model request texts and sit in the system temp folder.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;In a small window lines get cut&lt;/strong&gt;, and the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w7ngvf6f\"&gt;terminal too small&lt;/code&gt; message is garbled. The minimum window size is 20×5 characters.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"knowledge\"&gt;&lt;a href=\"en/about/limitations.html#knowledge\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Code index, memory and questions&lt;/span&gt;&lt;/a&gt;Code index, memory and questions&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;a href=\"en/glossary.html#intent-index\"&gt;index&lt;/a&gt; and &lt;a href=\"en/reference/ask.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-46tio3ni\"&gt;theia ask&lt;/code&gt;&lt;/a&gt; work only in a git repository.&lt;/strong&gt; In a folder without git they fail with a git error.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"en/reference/index-cmd.html#index-build\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nwmn2jb0\"&gt;theia index build&lt;/code&gt;&lt;/a&gt; does not refresh search.&lt;/strong&gt; After a build, run &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lkm81fwf\"&gt;theia index reindex&lt;/code&gt;, or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-peduhkq7\"&gt;index search&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qmddxnnx\"&gt;ask&lt;/code&gt; will not see the new cards.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vrdzc17u\"&gt;theia index&lt;/code&gt; with no subcommand runs a full build&lt;/strong&gt; and can spend money.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Search fails when a vector index is published but the local embedding model is not available.&lt;/strong&gt; This affects &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f8r7dbiz\"&gt;index search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b8c2kw1r\"&gt;mem search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qbzem3mp\"&gt;mem asof&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lxngxz2a\"&gt;ask&lt;/code&gt;. There is no word-only fallback in this case.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"en/reference/mem.html#mem-add\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d9jjxr32\"&gt;theia mem add&lt;/code&gt;&lt;/a&gt; does not mask secrets.&lt;/strong&gt; Do not put keys or tokens into facts.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sasm7ltb\"&gt;theia mem supersede&lt;/code&gt; does not check the new id.&lt;/strong&gt; Even with a typo, the old fact disappears from search, and the replacement cannot be undone.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;There is no command to delete a fact.&lt;/strong&gt; A fact can only be replaced; the old one stays in history. E-mail addresses are not masked in memory.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The date &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qj2xpcez\"&gt;2026-09&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ju9brox\"&gt;theia mem chunk --date&lt;/code&gt; is taken as the whole year.&lt;/strong&gt; Write the month in words: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ahcpysan\"&gt;September 2026&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A failed &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ugmj9p9e\"&gt;reindex&lt;/code&gt; leaves an unfinished search folder behind&lt;/strong&gt;, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rjw0jbp5\"&gt;theia mem maintain&lt;/code&gt; does not delete it.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Cards copied from the shared cache are not counted in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zrqcoyrz\"&gt;written&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3j6zjv8u\"&gt;current&lt;/code&gt;&lt;/strong&gt; in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fbsa2ifb\"&gt;theia index build&lt;/code&gt; report. Only the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bi995qul\"&gt;rate:&lt;/code&gt; line shows them.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pqhte3tp\"&gt;--root root&lt;/code&gt; in a single-root project creates separate memory.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c7aq9shp\"&gt;mem search&lt;/code&gt;, the hooks and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3j0y9t8e\"&gt;ask&lt;/code&gt; do not see it.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-928k2zr5\"&gt;theia ask&lt;/code&gt; almost always calls a model.&lt;/strong&gt; If the store has at least one fact or run, the answer goes through a model.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Setting &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t45o1ek2\"&gt;memory.sentenceGraph&lt;/code&gt; to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-26mru8xw\"&gt;h0&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dn3a61uv\"&gt;h1&lt;/code&gt; turns off vector search.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cit7t2h0\"&gt;eval swebl&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-liazckwh\"&gt;eval memory&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xx6zhpsu\"&gt;eval demo create&lt;/code&gt; are tools for platform developers.&lt;/strong&gt; They download data, call models and expect paths from the development setup.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"config\"&gt;&lt;a href=\"en/about/limitations.html#config\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Settings and keys&lt;/span&gt;&lt;/a&gt;Settings and keys&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Settings are merged only one level deep.&lt;/strong&gt; The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v85cxzaw\"&gt;gateway.routing&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ass3h24\"&gt;gateway.models&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-saqcicbn\"&gt;gateway.embeddings&lt;/code&gt; sections from project settings replace the same sections from user settings as a whole.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A settings error names the section, not the key&lt;/strong&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hk3qhodt\"&gt;spec.run: unrecognized_keys&lt;/code&gt;. A typo in a role name inside &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2gv6fcr5\"&gt;routing&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5dvgg6ko\"&gt;models&lt;/code&gt; is silently ignored.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;An invalid &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dmvl745j\"&gt;policy.yaml&lt;/code&gt; breaks every command except &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8hlhsnho\"&gt;theia doctor&lt;/code&gt;.&lt;/strong&gt; It prints all its lines and hides the error in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ksbsm3jj\"&gt;embeddings : FAIL (policy unreadable: …)&lt;/code&gt; line. See &lt;a href=\"en/troubleshooting.html#invalid-manifest\"&gt;Troubleshooting&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"en/reference/doctor.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-edohgr6s\"&gt;theia doctor&lt;/code&gt;&lt;/a&gt; does not show routes or models.&lt;/strong&gt; It looks only at &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p1vvkfn4\"&gt;.theia&lt;/code&gt; in the current folder and says &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s6s3cscw\"&gt;docker ready&lt;/code&gt; even when Docker is not running. A &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vkysnnqo\"&gt;lexical index : FAIL&lt;/code&gt; line does not change the exit code (seen in the code).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jytj8yxv\"&gt;dataClasses&lt;/code&gt; field of transports has no effect.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Secret detectors know only five kinds of data&lt;/strong&gt;: private keys, API keys, card numbers, seed phrases and e-mail addresses. API keys are recognized only by the start &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oo8npulh\"&gt;sk-&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7jykr0kh\"&gt;AKIA&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-65qfnj2p\"&gt;ghp_&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mfegpayz\"&gt;gho_&lt;/code&gt;. Other tokens, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z66ooinz\"&gt;github_pat_…&lt;/code&gt;, go unnoticed.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A task text with a blocked secret is still saved in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jtbb95c6\"&gt;.theia/store.db&lt;/code&gt; as it is&lt;/strong&gt;, although it never goes to a model.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-inq9vj6c\"&gt;gateway.harnessConfig&lt;/code&gt; works only for Codex.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The code does not read the rules and skills shipped with Theia.&lt;/strong&gt; The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pn68krx9\"&gt;run.rulesSoT&lt;/code&gt; setting hides &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jskuy29g\"&gt;AGENTS.md&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zs4p1tog\"&gt;CLAUDE.md&lt;/code&gt; from the engine but does not insert them into requests.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The budget counts Claude calls at list price&lt;/strong&gt;, even when you work on a subscription (seen in the code).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"integrations\"&gt;&lt;a href=\"en/about/limitations.html#integrations\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Integrations&lt;/span&gt;&lt;/a&gt;Integrations&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Hooks, the status line and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7cxpx5es\"&gt;.mcp.json&lt;/code&gt; point at the file of one specific version&lt;/strong&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r1k9w5fx\"&gt;…/releases/0.2.201/theia&lt;/code&gt;), not at &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fdsz8d4x\"&gt;~/.local/bin/theia&lt;/code&gt;. After an update, Claude Code and Codex keep running the old version. Running &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-owrv286q\"&gt;theia hooks install claude&lt;/code&gt; again adds a second set of hooks and does not fix the path. Replace the path with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dfp1c1cm\"&gt;~/.local/bin/theia&lt;/code&gt;, or remove the old entries and install the hooks again — see &lt;a href=\"en/integrations/claude-code.html#after-update\"&gt;Claude Code&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;There is no &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x2hyl946\"&gt;hooks uninstall&lt;/code&gt; command.&lt;/strong&gt; Integrations are removed by hand. The steps are on the &lt;a href=\"en/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;, &lt;a href=\"en/integrations/codex.html\"&gt;Codex&lt;/a&gt; and &lt;a href=\"en/integrations/git.html\"&gt;Git&lt;/a&gt; pages.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The Claude Code &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bysjvn12\"&gt;Stop&lt;/code&gt; hook fires after every response.&lt;/strong&gt; Each time it saves up to 16 KB of the conversation into memory and does not remove repeats. Project memory grows. To stop this, delete the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vbp8guvu\"&gt;Stop&lt;/code&gt; entry from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1853841q\"&gt;.claude/settings.json&lt;/code&gt;; installing the hooks again brings it back.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9toki3zv\"&gt;/theia&lt;/code&gt; skill cannot control a new run.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xkjmoy3t\"&gt;run_msg&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zsvenciu\"&gt;run_stop&lt;/code&gt; have no effect on a run started with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0kkxi0b6\"&gt;run_start&lt;/code&gt;, although they reply that everything was delivered. Questions from such a run never reach Claude.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A run killed from outside still shows as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p4xipv1q\"&gt;live&lt;/code&gt;&lt;/strong&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qr6cl5im\"&gt;run_list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-10eq11sl\"&gt;run_status&lt;/code&gt; and the status line.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Codex gets a reduced MCP server&lt;/strong&gt;: 5 tools, no run control and no &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u074u9rr\"&gt;/theia&lt;/code&gt; skill. The server and hooks start working only after two trust confirmations in Codex.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"en/reference/hooks.html#hooks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yclxm78y\"&gt;theia hooks install git&lt;/code&gt;&lt;/a&gt; silently does nothing when git has &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zmdz9x4v\"&gt;core.hooksPath&lt;/code&gt; set.&lt;/strong&gt; In a linked git worktree the command fails with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mfz1r775\"&gt;ENOTDIR&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;An invalid &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6qoulvdx\"&gt;.mcp.json&lt;/code&gt; stops &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j3tm1x2w\"&gt;theia hooks install claude&lt;/code&gt; halfway&lt;/strong&gt; with code 1.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;a href=\"en/reference/serve.html#serve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8hvd0l8u\"&gt;theia serve --metrics&lt;/code&gt;&lt;/a&gt; listens on all network interfaces.&lt;/strong&gt; A second server on the same port crashes. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-padycgdt\"&gt;/metrics&lt;/code&gt; shows only the server's own counters; run metrics leave only through OTLP.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hrt0m0mr\"&gt;ops/observability&lt;/code&gt; stack is not part of the release.&lt;/strong&gt; It exists only in the source repository. The Grafana panel for the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ss1i1sj\"&gt;theia_pii_total&lt;/code&gt; metric is always empty.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eoao8i9i\"&gt;run_start&lt;/code&gt; with a wrong plan id leaves an empty &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j82w8ami\"&gt;theia/run-*&lt;/code&gt; branch.&lt;/strong&gt;&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;There is no pull request creation, no branch push, no Slack, webhooks or Jira.&lt;/strong&gt; Azure DevOps exists only as a text file in the shipped set.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"en/about/limitations.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;See also&lt;/span&gt;&lt;/a&gt;See also&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/troubleshooting.html\"&gt;Troubleshooting&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/about/platforms.html\"&gt;Systems and run modes&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/guides/control-run.html\"&gt;Control a run&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/about/limitations.html","hreflang":"en"},{"href":"ru/about/limitations.html","hreflang":"ru"}],"style":["_assets/theia.css","_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"canonical":"en/about/limitations.html","vcsPath":"en/about/limitations.md"},"headings":[{"title":"Systems","href":"en/about/limitations.html#platforms","level":2},{"title":"Install and update","href":"en/about/limitations.html#install","level":2},{"title":"Runs","href":"en/about/limitations.html#runs","level":2},{"title":"TUI screen","href":"en/about/limitations.html#tui","level":2},{"title":"Code index, memory and questions","href":"en/about/limitations.html#knowledge","level":2},{"title":"Settings and keys","href":"en/about/limitations.html#config","level":2},{"title":"Integrations","href":"en/about/limitations.html#integrations","level":2},{"title":"See also","href":"en/about/limitations.html#see-also","level":2}],"title":"Known limitations of 0.2.201"},"router":{"pathname":"en/about/limitations","depth":3,"base":"../../"},"lang":"en","langs":["ru","en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"
