            {"data":{"leading":false,"html":"&lt;p&gt;Theia does coding tasks with a team of AI agents. You describe the task in plain words. Theia writes the code in a copy of your repository, checks and reviews it, and puts the result on a separate git branch.&lt;/p&gt;\n&lt;p&gt;The full name of the platform is Aletheia. The command is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4h5ekaqn\"&gt;theia&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"what-it-does\"&gt;&lt;a href=\"en/about/overview.html#what-it-does\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;What Theia does&lt;/span&gt;&lt;/a&gt;What Theia does&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Runs a coding task: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmvisck9\"&gt;theia run&lt;/code&gt;. The work happens in a copy of the repository; your current branch does not change.&lt;/li&gt;\n&lt;li&gt;Makes a plan before the work: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uduudq14\"&gt;theia plan&lt;/code&gt;. You can read the plan, ask for changes and approve it.&lt;/li&gt;\n&lt;li&gt;Builds a code index — a short card for every file: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tf674gpz\"&gt;theia index&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Keeps project memory — facts and decisions: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nypw6spo\"&gt;theia mem&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Answers questions from memory, the index and past runs: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gbvr4w1t\"&gt;theia ask&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Connects to Claude Code and Codex through hooks and an MCP server.&lt;/li&gt;\n&lt;li&gt;Records every step in an event log. The log is protected by a hash chain, so tampering shows.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Theia has no model of its own. Models work through CLIs installed on your machine: Claude Code (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s3k9cy4f\"&gt;claude&lt;/code&gt;) or Codex (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-epzd9sh5\"&gt;codex&lt;/code&gt;). Theia calls them engines (&lt;a href=\"en/glossary.html#harness\"&gt;harness&lt;/a&gt;). A settings file decides which engine and model work in each role. See &lt;a href=\"en/config/models.html\"&gt;Models for tasks&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"how-a-run-works\"&gt;&lt;a href=\"en/about/overview.html#how-a-run-works\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;How a run works&lt;/span&gt;&lt;/a&gt;How a run works&lt;/h2&gt;\n&lt;p&gt;A &lt;a href=\"en/glossary.html#run\"&gt;run&lt;/a&gt; is one execution of a task. It goes like this:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Theia creates a &lt;a href=\"en/glossary.html#run-branch\"&gt;run branch&lt;/a&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-08lii54b\"&gt;theia/run-…&lt;/code&gt;. The branch starts from the base: the upstream of your current branch (for example, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fvqxyloy\"&gt;origin/main&lt;/code&gt;). Without an upstream it uses &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-79nnq2cq\"&gt;origin/HEAD&lt;/code&gt;, then your local &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lswxwgi1\"&gt;HEAD&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Theia makes a separate copy of the repository for each task.&lt;/li&gt;\n&lt;li&gt;The &lt;a href=\"en/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u7aj83w1\"&gt;implementer&lt;/code&gt;&lt;/a&gt; changes files in the copy. Theia makes the commits, not the model.&lt;/li&gt;\n&lt;li&gt;Check (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-97tbfjzf\"&gt;verify&lt;/code&gt;). If you passed commands with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xrkkps4w\"&gt;--verify&lt;/code&gt;, Theia runs them and the exit code decides. Without commands, a model checks the work. A failure sends the task back to the implementer. After two implementer attempts, a fresh implementer (&lt;a href=\"en/glossary.html#fresh-implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zg77x37e\"&gt;fresh_implementer&lt;/code&gt;&lt;/a&gt;) with a clean context makes the third. The third failure in a row is &lt;a href=\"en/glossary.html#stop-and-fix\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8lkenub\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;: the task goes to the lead.&lt;/li&gt;\n&lt;li&gt;The &lt;a href=\"en/glossary.html#reviewer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7n605w3\"&gt;reviewer&lt;/code&gt;&lt;/a&gt; looks at the change: approves it, asks for rework or discards it.&lt;/li&gt;\n&lt;li&gt;Merge (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hmnbxcv7\"&gt;merge&lt;/code&gt;). Theia merges the task's work into the run branch with plain git.&lt;/li&gt;\n&lt;li&gt;When a step fails, the &lt;a href=\"en/glossary.html#arbiter\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dgcxy8wk\"&gt;arbiter&lt;/code&gt;&lt;/a&gt; decides: try again, or hand the task to the &lt;a href=\"en/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k7l3va6a\"&gt;lead&lt;/code&gt;&lt;/a&gt;. The lead can restart the task with a new direction, accept the work, check it again, discard the task or ask you a question.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;Each step of a task is a &lt;a href=\"en/glossary.html#phase\"&gt;phase&lt;/a&gt;. A role answers it with a &lt;a href=\"en/glossary.html#verdict\"&gt;verdict&lt;/a&gt; — a short word such as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uocdnpr4\"&gt;verify_pass&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fy2ys4q6\"&gt;approve&lt;/code&gt;. A simplified map:&lt;/p&gt;\n&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20T%5B%22Task%22%5D%20--%3E%7Cfast_path%7C%20I%5B%22implement%22%5D%0A%20%20T%20--%3E%7Cfull_spec%7C%20P%5B%22plan%22%5D%0A%20%20P%20--%3E%7Cready%7C%20I%0A%20%20I%20--%3E%7Cready%7C%20V%5B%22verify%22%5D%0A%20%20V%20--%3E%7Cverify_pass%7C%20R%5B%22review%22%5D%0A%20%20V%20--%3E%7Cverify_fail%7C%20I%0A%20%20V%20--%3E%7Cstop_and_fix%7C%20E%0A%20%20R%20--%3E%7Capprove%7C%20M%5B%22merge%22%5D%0A%20%20M%20--%3E%7Cmerged%7C%20OK%5B%22merged%22%5D%0A%20%20R%20--%3E%7Crework%2C%20discard%7C%20A%5B%22arbitrate%22%5D%0A%20%20M%20--%3E%7Cmerge_fail%7C%20A%0A%20%20A%20--%3E%7Carb_continue%7C%20I%0A%20%20A%20--%3E%7Carb_escalate%7C%20E%5B%22escalated%22%5D%0A%20%20E%20--%3E%7Clead_rescope%7C%20I%0A%20%20E%20--%3E%7Clead_accept%7C%20M%0A%20%20E%20--%3E%7Clead_reverify%7C%20V%0A%20%20E%20--%3E%7Clead_discard%7C%20X%5B%22discarded%22%5D%0A\"&gt;&lt;/div&gt;&lt;p&gt;The &lt;a href=\"en/glossary.html#track\"&gt;track&lt;/a&gt; decides where a task starts:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yv3xatzc\"&gt;fast_path&lt;/code&gt; — the default. The task goes straight to the implementer.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pj647su5\"&gt;full_spec&lt;/code&gt; — the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m8wzw7f0\"&gt;planner&lt;/code&gt; works first, then the implementer.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"roles\"&gt;&lt;a href=\"en/about/overview.html#roles\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Roles&lt;/span&gt;&lt;/a&gt;Roles&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Role&lt;/th&gt;\n&lt;th&gt;Who does the work&lt;/th&gt;\n&lt;th&gt;What it does&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4rmhh5me\"&gt;lead&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;a model&lt;/td&gt;\n&lt;td&gt;Decides what happens to a stuck task&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7dic0exg\"&gt;planner&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;a model&lt;/td&gt;\n&lt;td&gt;Splits work into tasks: the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5i5d2v6i\"&gt;full_spec&lt;/code&gt; track and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r75jmdft\"&gt;theia plan&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bfchtjn8\"&gt;implementer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;a model&lt;/td&gt;\n&lt;td&gt;Changes code in the repository copy&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kuocosbc\"&gt;fresh_implementer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;a model&lt;/td&gt;\n&lt;td&gt;The same implementer with a clean context. Takes the task after two &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ad200kjn\"&gt;implementer&lt;/code&gt; attempts. In the output it is preceded by the mark &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wqb9exov\"&gt;!! anomaly fresh_perspective … dispatches=2&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8v93du87\"&gt;verifier&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;your &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1gdg4n84\"&gt;--verify&lt;/code&gt; commands, or a model&lt;/td&gt;\n&lt;td&gt;Checks the result&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oadktliz\"&gt;reviewer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;a model&lt;/td&gt;\n&lt;td&gt;Approves, asks for rework or discards&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hu1g228k\"&gt;arbiter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;a model&lt;/td&gt;\n&lt;td&gt;Decides: continue or hand over to the lead&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lr2zieut\"&gt;merger&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Theia itself (git)&lt;/td&gt;\n&lt;td&gt;Merges the task's work into the run branch&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7twg88i7\"&gt;indexer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;a model&lt;/td&gt;\n&lt;td&gt;Writes the cards of the code index&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"where-results-go\"&gt;&lt;a href=\"en/about/overview.html#where-results-go\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Where the result goes&lt;/span&gt;&lt;/a&gt;Where the result goes&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;The run's work is on the branch &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cv620o93\"&gt;theia/run-&amp;lt;6 characters&amp;gt;&lt;/code&gt;. Your current branch does not change.&lt;/li&gt;\n&lt;li&gt;Take the result into your branch with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lormv2mk\"&gt;git merge&lt;/code&gt;. How to do it, and why &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-igppolk7\"&gt;git switch&lt;/code&gt; to the run branch fails, is in &lt;a href=\"en/guides/first-task.html\"&gt;Your first task&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;At the end Theia prints a summary. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5vvec5j4\"&gt;halted: completed&lt;/code&gt; only means the work stopped. Tasks may still have been discarded. Check each task's outcome: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yzc1o3o4\"&gt;merged&lt;/code&gt; means the work landed, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ubuw06mz\"&gt;discarded&lt;/code&gt; means it did not. If the run had &lt;a href=\"en/glossary.html#anomaly\"&gt;anomalies&lt;/a&gt;, marks such as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tjs3ct6v\"&gt;stop_and_fix&lt;/code&gt;, the line gets a tail &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dd7egnj1\"&gt;· !! 2 anomalies&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"knowledge\"&gt;&lt;a href=\"en/about/overview.html#knowledge\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Code index, memory and questions&lt;/span&gt;&lt;/a&gt;Code index, memory and questions&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;The &lt;a href=\"en/glossary.html#intent-index\"&gt;code index&lt;/a&gt; is a card per file: what it is for, what it relates to, which decisions it holds. A model writes the cards. Theia gives them to agents in every request as the &lt;a href=\"en/glossary.html#blueprint\"&gt;blueprint&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#memory\"&gt;Memory&lt;/a&gt; holds short &lt;a href=\"en/glossary.html#fact\"&gt;facts&lt;/a&gt; about the project: decisions, constraints, agreements. Facts are never overwritten: a new fact replaces an old one, and the old one stays in history.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yg34yroz\"&gt;theia ask&lt;/code&gt; answers a question from memory, the index and recent runs, and names its sources.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;See &lt;a href=\"en/guides/knowledge.html\"&gt;Code index, memory and questions&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"cost\"&gt;&lt;a href=\"en/about/overview.html#cost\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Money and budget&lt;/span&gt;&lt;/a&gt;Money and budget&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Every model request is a &lt;a href=\"en/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;. Theia records the price of each call and adds them up.&lt;/li&gt;\n&lt;li&gt;A run has a &lt;a href=\"en/glossary.html#budget\"&gt;budget&lt;/a&gt; in US dollars. The default is 10. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e48fgndz\"&gt;--budget&lt;/code&gt; flag changes it; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hwcrgifx\"&gt;0&lt;/code&gt; removes the limit.&lt;/li&gt;\n&lt;li&gt;When the budget runs out, the run pauses. You can continue it with a new budget.&lt;/li&gt;\n&lt;li&gt;Commands that do not call a model cost nothing: for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-66o6q28w\"&gt;theia show&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w8la7hsl\"&gt;theia replay&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ccbvly1b\"&gt;theia index status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bcyqrtf1\"&gt;theia mem add&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"where-data-lives\"&gt;&lt;a href=\"en/about/overview.html#where-data-lives\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Where data lives&lt;/span&gt;&lt;/a&gt;Where data lives&lt;/h2&gt;\n&lt;p&gt;The &lt;a href=\"en/glossary.html#store\"&gt;store&lt;/a&gt; is the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xeuat76o\"&gt;.theia&lt;/code&gt; folder. In a git repository it sits at the root of the working copy.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;What&lt;/th&gt;\n&lt;th&gt;Where&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Event log, plans, memory, index&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d35421p6\"&gt;.theia/store.db&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Project settings&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7meblm2v\"&gt;.theia/config/&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Task copies and the run branch&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f1a4t31z\"&gt;.theia/runs/&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Check command output and other files&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-et5b5pmi\"&gt;.theia/objects/&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Theia adds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hm9uu2eo\"&gt;.theia/&lt;/code&gt; to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kis5eik7\"&gt;.gitignore&lt;/code&gt; when a run starts. Where the store goes outside a git repository is described in &lt;a href=\"en/config/workspaces.html\"&gt;Store and project roots&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"see-also\"&gt;&lt;a href=\"en/about/overview.html#see-also\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;See also&lt;/span&gt;&lt;/a&gt;See also&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/about/platforms.html\"&gt;Systems and run modes&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/install/install.html\"&gt;Install&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/guides/first-task.html\"&gt;Your first task&lt;/a&gt;&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html\"&gt;Glossary&lt;/a&gt;&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/about/overview.html","hreflang":"en"},{"href":"ru/a
