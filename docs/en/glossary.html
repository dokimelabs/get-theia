de class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3bmpp19\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-syj6hour\"&gt;in flight&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"failed\"&gt;&lt;a href=\"en/glossary.html#failed\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zbmh0tpn\"&gt;failed&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;In the TUI, a task with the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sjf90enp\"&gt;discarded&lt;/code&gt; outcome: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3xrfgbfd\"&gt;tasks: … 1 failed&lt;/code&gt;. A task has no separate &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qahizoim\"&gt;failed&lt;/code&gt; outcome. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wrlfpkzi\"&gt;(FAILED)&lt;/code&gt; in row details means an agent action failed.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-firtmejh\"&gt;tasks: 0 running · 0 done · 1 failed · anomalies 0&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yo6ie1v6\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"en/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gxop65o8\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"frozen\"&gt;&lt;a href=\"en/glossary.html#frozen\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vofdojz6\"&gt;frozen&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;In the TUI, a task in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tkyic7km\"&gt;escalated&lt;/code&gt; phase that waits for the lead: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nat5fgxc\"&gt;tasks: … 1 frozen&lt;/code&gt;, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pbfumq1y\"&gt;◆&lt;/code&gt; sign.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8gbvolro\"&gt;tasks: 0 running · 0 done · 1 frozen · anomalies 6&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wp15ryuq\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"pending\"&gt;&lt;a href=\"en/glossary.html#pending\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7yqzc1ej\"&gt;pending&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;In the TUI, a waiting task: its dependencies are not ready yet (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hq0c065h\"&gt;blocked on tsk…&lt;/code&gt;), or the run has stopped while the task is unfinished. The sign is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qct5wmqe\"&gt;◌&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#blocked-on\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7c7zeq3d\"&gt;blocked on&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blocked-on\"&gt;&lt;a href=\"en/glossary.html#blocked-on\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k0d6kwe0\"&gt;blocked on&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The task waits for other tasks: work starts when they end with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2nglgwvk\"&gt;merged&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5vqau152\"&gt;planned&lt;/code&gt;. The TUI shows it to the right of the task: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ykpddqxy\"&gt;blocked on tsk…x&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#pending\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ofgv8dxo\"&gt;pending&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8t8plo32\"&gt;plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"idx\"&gt;&lt;a href=\"en/glossary.html#idx\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o7cxc81a\"&gt;idx ⚠N&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A hint in the TUI header: when the screen opened, N index entries were stale or missing. You can work, but agents see an incomplete blueprint.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u4h9o22t\"&gt;tasks: 0 running · 0 done · 1 failed · anomalies 0 · idx ⚠1&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-udgb2exp\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ctx\"&gt;&lt;a href=\"en/glossary.html#ctx\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uf9fjn0o\"&gt;ctx ⚠N&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A hint in the TUI header: N times the context added to requests was larger than the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lbprwsnp\"&gt;run.contextAlertChars&lt;/code&gt; threshold.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4lrne7na\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"seek\"&gt;&lt;a href=\"en/glossary.html#seek\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l6r5ysfr\"&gt;[@ event k/N]&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The log position in the TUI header: you are looking at event k of N. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l8fl0ol9\"&gt;· live&lt;/code&gt; means the screen follows a running run; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3yx8jc76\"&gt;· head&lt;/code&gt; means the latest event. In &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5wgfvqet\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt; the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9n952v00\"&gt;[&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mmbbo0zy\"&gt;]&lt;/code&gt; keys move one event, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ktxphofl\"&gt;{&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-77s3qg8e\"&gt;}&lt;/code&gt; ten events, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3vx3gz6n\"&gt;Home&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r79o7gpr\"&gt;End&lt;/code&gt; to the start and the end, and the tree is rebuilt for that moment. After a live run ends these keys only move the counter; to rewind, open &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ky6rjl3\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6e71njhi\"&gt;[@ event 22/22 · head]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ohgd726\"&gt;[@ event 21/22]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#run-ended\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sn9tebl7\"&gt;run ended&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#head\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mds1q5eo\"&gt;head&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mzr4qsca\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/tui/navigation.html\"&gt;Navigation and hotkeys&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"follow\"&gt;&lt;a href=\"en/glossary.html#follow\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z3lv7djj\"&gt;follow&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Follow mode: the cursor moves to new activity by itself. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nwixg1f8\"&gt;f&lt;/code&gt; key turns it on and off; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7782sk1k\"&gt;F&lt;/code&gt; picks the level: task, round or tool.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1er9b0zv\"&gt;f follow:round&lt;/code&gt; in the key bar.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#verbosity\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0dnoeru6\"&gt;verbosity&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#keybar\"&gt;keybar&lt;/a&gt;, &lt;a href=\"en/tui/navigation.html\"&gt;Navigation and hotkeys&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verbosity\"&gt;&lt;a href=\"en/glossary.html#verbosity\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hutpxfqa\"&gt;verbosity&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;How much detail the tree shows: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8xn57gx4\"&gt;0&lt;/code&gt; — only tasks and rounds (anomalies and steering always show), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ka36ydir\"&gt;1&lt;/code&gt; — the normal view, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fmkbo0j5\"&gt;2&lt;/code&gt; — also call and tool lines. The keys are &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xagiu4ic\"&gt;+&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rdjfuc0z\"&gt;-&lt;/code&gt;. Theia remembers the choice together with the follow level in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jksvcw3x\"&gt;tui-state.json&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hkxhm2pb\"&gt;+/- verbosity=1&lt;/code&gt; in the key bar.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#follow\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7l40d8hf\"&gt;follow&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#keybar\"&gt;keybar&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"keybar\"&gt;&lt;a href=\"en/glossary.html#keybar\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;keybar&lt;/span&gt;&lt;/a&gt;keybar&lt;/h3&gt;\n&lt;p&gt;The key hint line at the bottom of the TUI. It shows only the keys that work now: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9qsuscby\"&gt;move&lt;/code&gt; — cursor, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-drthrlil\"&gt;fold&lt;/code&gt; — collapse or expand, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-25k3sxo1\"&gt;zoom&lt;/code&gt; — details (Enter), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bo0ddz27\"&gt;pane&lt;/code&gt; — switch pane (Tab), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4pv36w2q\"&gt;follow&lt;/code&gt; — follow mode, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qd0gyejl\"&gt;err&lt;/code&gt; — next error, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2gp3k5zq\"&gt;seek&lt;/code&gt; — rewind, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hpgbcnjf\"&gt;wrap&lt;/code&gt; — wrap the row, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6h1dhnks\"&gt;view&lt;/code&gt; — full text in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2bwhhtrj\"&gt;$EDITOR&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lqwa3ze5\"&gt;less&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pdb99hxt\"&gt;verbosity&lt;/code&gt; — detail level, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ck925unf\"&gt;steer&lt;/code&gt; — steering (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6okt0f7h\"&gt;m&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kto3e1hv\"&gt;prompt&lt;/code&gt; — the prompt of a running call (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sbujfile\"&gt;p&lt;/code&gt;), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jk4g067b\"&gt;stop&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bfed62jq\"&gt;quit&lt;/code&gt; — the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cxcrx98c\"&gt;q&lt;/code&gt; key. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-svhdkfyj\"&gt;?&lt;/code&gt; opens the full help.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zfbq7avb\"&gt;↑↓ move • ←→ fold • ⏎ zoom • ⇥ pane • f follow • e err • [ ] seek • w wrap • v view • +/- verbosity=1 • ? • q quit&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#follow\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-722adimw\"&gt;follow&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#verbosity\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-35cvvfom\"&gt;verbosity&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r06rupyl\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xhbuphpw\"&gt;detail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"en/tui/navigation.html\"&gt;Navigation and hotkeys&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"detail\"&gt;&lt;a href=\"en/glossary.html#detail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s8419d2s\"&gt;detail&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The detail pane under the tree, opened with Enter. It shows everything about the row under the cursor: the verdict with its comment and evidence, questions, call data, the task's phase history. For a verdict in a stored run it offers a ready fork command &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vi4xyeuv\"&gt;theia fork &amp;lt;run&amp;gt; --at &amp;lt;evt&amp;gt;&lt;/code&gt;. The Tab key moves control between the tree and the pane.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6idce3o8\"&gt;┤ detail ├&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oz7f3f1m\"&gt;┤ tree · focus ├&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-re8p38mv\"&gt;phases:&lt;/code&gt; in task details.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;, &lt;a href=\"en/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-knqubw6p\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#keybar\"&gt;keybar&lt;/a&gt;, &lt;a href=\"en/tui/overview.html\"&gt;Screens and elements&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blob\"&gt;&lt;a href=\"en/glossary.html#blob\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-egkqs80e\"&gt;blob&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The stored full text of one exchange with a model: the prompt and the reply of a call. Theia keeps it apart from the event log and leaves a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ncnwoq48\"&gt;blobRef&lt;/code&gt; reference in the call record. In the TUI the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tr5sd03x\"&gt;v&lt;/code&gt; key opens the text of the selected call and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gi1ebnzc\"&gt;p&lt;/code&gt; the prompt of the call in flight; both write the text to a temporary file &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-znvuynfw\"&gt;theia-blob-&amp;lt;id&amp;gt;.txt&lt;/code&gt; and never delete it. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2r5hnles\"&gt;theia prune&lt;/code&gt; removes texts that nothing references any more (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7p84lj7h\"&gt;orphaned blobs&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zin0skri\"&gt;blobRef: 62a278c5…&lt;/code&gt; in the detail pane, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-doxfv0ww\"&gt;no stored body for this row&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3699isml\"&gt;blob absent (recorded elsewhere)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aantutpi\"&gt;no prompt blob for this call (blob store absent or content blocked)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n1omdb1z\"&gt;14 orphaned blobs (0.0 MB)&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sjvp3wog\"&gt;theia prune&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"en/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-suqia2qi\"&gt;detail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ehv8wl4a\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/tui/navigation.html#open-full-text\"&gt;Navigation and hotkeys&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"in-flight\"&gt;&lt;a href=\"en/glossary.html#in-flight\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-82neked9\"&gt;in flight&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Work is still going on:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;on the home screen, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2lj5ksy5\"&gt;⣽ run…  in flight&lt;/code&gt; — the run has no end or pause record; a killed run looks the same;&lt;/li&gt;\n&lt;li&gt;in the TUI, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1wlrpm9p\"&gt;⋯ implementer tsk…x  call in flight… · 12s [0 tools]&lt;/code&gt; — a model call is running right now. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7qcgwcxy\"&gt;p&lt;/code&gt; key opens its prompt, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4783ohi2\"&gt;no call in flight&lt;/code&gt; means there are no calls now.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rty9yv4b\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eyycqs9g\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-ended\"&gt;&lt;a href=\"en/glossary.html#run-ended\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-anvaho6c\"&gt;run ended&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The run is over, and the TUI stays open so you can look at the tree. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r5if15gw\"&gt;q&lt;/code&gt; key closes the screen, and then the summary prints to the normal terminal.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kclv3dat\"&gt;■ run ended — 1 discarded · browse the tree; q quits&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#tui\"&gt;TUI&lt;/a&gt;, &lt;a href=\"en/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ulkbywx\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#summary\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6t6vb59r\"&gt;summary&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-doctor\"&gt;&lt;a href=\"en/glossary.html#group-doctor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;theia doctor&lt;/span&gt;&lt;/a&gt;theia doctor&lt;/h2&gt;\n&lt;h3 id=\"doctor\"&gt;&lt;a href=\"en/glossary.html#doctor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yof7ub7s\"&gt;doctor&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eyyzyrlb\"&gt;theia doctor&lt;/code&gt; checks whether the machine is ready: harness logins, the sandbox, search, embeddings, personal settings, the store, rules, Codex hooks and vendor deliverables. No model is called. Each line reads &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l4bxemo8\"&gt;name : state&lt;/code&gt;. The exit code is 1 when a counted &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r5xpq4bk\"&gt;FAIL&lt;/code&gt; is present. The home screen shows only the problem lines.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#unavailable\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dg0qpohf\"&gt;unavailable&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1igk4dop\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#not-initialized\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e27bdh4a\"&gt;not initialized&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/reference/doctor.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7xynv33u\"&gt;theia doctor&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"unavailable\"&gt;&lt;a href=\"en/glossary.html#unavailable\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-33yyxkeq\"&gt;unavailable&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A capability is not available on this machine; the reason is in brackets. By itself it is not an error. For example, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xvr64gpg\"&gt;codex subscription : unavailable&lt;/code&gt; while Claude Code works is fine.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3iviuvj8\"&gt;doctor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2mele39u\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k8icl4cp\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fail\"&gt;&lt;a href=\"en/glossary.html#fail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oh0v22wp\"&gt;FAIL&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A real problem. In &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mlgvdd51\"&gt;theia doctor&lt;/code&gt; the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6dbs8q2g\"&gt;harnesses&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h1if6fn8\"&gt;embeddings&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ck4rwlez\"&gt;vendor deliverables&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yqgt7lxg\"&gt;shell (git-bash)&lt;/code&gt; (Windows only) lines with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3zdyxlw1\"&gt;FAIL&lt;/code&gt; give exit code 1, while &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cbogvxbf\"&gt;FAIL&lt;/code&gt; in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h55qrbcm\"&gt;lexical index&lt;/code&gt; line does not change the exit code. In &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bry8edrn\"&gt;theia index build&lt;/code&gt;, a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pitl6xdc\"&gt;FAIL &amp;lt;file&amp;gt;: &amp;lt;reason&amp;gt;&lt;/code&gt; line and the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r8cqube9\"&gt;N FAILED&lt;/code&gt; counter mean that a file's card could not be made.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m8qzcdjo\"&gt;harnesses          : FAIL (neither codex nor claude is authenticated — one is required)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fbkwjevw\"&gt;index: 1/1 built · 1 FAILED · $0.0000 · 166.7/s&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qdaggmyk\"&gt;doctor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#unavailable\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ahdsr6vu\"&gt;unavailable&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#failed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l3cb13f0\"&gt;failed&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"not-initialized\"&gt;&lt;a href=\"en/glossary.html#not-initialized\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zku099xf\"&gt;not initialized&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;In &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cosojvwu\"&gt;theia doctor&lt;/code&gt; it means there is no &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-esyplyuy\"&gt;.theia&lt;/code&gt; with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yg8c1clb\"&gt;store.db&lt;/code&gt; in the current folder. Doctor looks only at the current folder. From a project subfolder, or for a store in the user folder, it says &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dwzyiuq6\"&gt;not initialized (theia init)&lt;/code&gt;, although other commands find the store. Run &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wtxt6914\"&gt;theia doctor&lt;/code&gt; from the project root.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xtniz3f0\"&gt;.theia store       : not initialized (theia init)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#theia-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5c4la9ls\"&gt;.theia store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"en/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xcuoyppt\"&gt;doctor&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"harnesses\"&gt;&lt;a href=\"en/glossary.html#harnesses\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ns2zos3\"&gt;harnesses&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7r1emnsa\"&gt;theia doctor&lt;/code&gt; line that appears only when you are signed in to neither Codex nor Claude Code. Signing in to one of them is enough.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-97r37t10\"&gt;harnesses          : FAIL (neither codex nor claude is authenticated — one is required)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"en/glossary.html#codex-subscription\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j3myj0fm\"&gt;codex subscription&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#claude-code\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rxym8re4\"&gt;claude code&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/keys.html\"&gt;Keys and access&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"codex-subscription\"&gt;&lt;a href=\"en/glossary.html#codex-subscription\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pbrvraz1\"&gt;codex subscription&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-00pvc8jk\"&gt;theia doctor&lt;/code&gt; line: whether you are signed in to the Codex CLI with a subscription (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83rpecia\"&gt;codex login&lt;/code&gt;). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4kkjks04\"&gt;unavailable&lt;/code&gt; means there is no login or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pwig079w\"&gt;codex&lt;/code&gt; is not installed.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3q8pbrfu\"&gt;codex subscription : unavailable (harness-codex: not authenticated (codex login status: exit 1))&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"en/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1aqyv9mt\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/keys.html\"&gt;Keys and access&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"claude-code\"&gt;&lt;a href=\"en/glossary.html#claude-code\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ofn6nqj\"&gt;claude code&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-86ldb53b\"&gt;theia doctor&lt;/code&gt; line: whether you are signed in to Claude Code with a subscription. Theia does not use an Anthropic API key for Claude Code, so a key-based login does not count here.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xpudmfy2\"&gt;claude code        : ok&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ncitpg0p\"&gt;claude code        : unavailable (harness-claude: not logged in …)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"en/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7570n8an\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/keys.html\"&gt;Keys and access&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lexical-index\"&gt;&lt;a href=\"en/glossary.html#lexical-index\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ac0zdje6\"&gt;lexical index&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xod1uzv6\"&gt;theia doctor&lt;/code&gt; line: whether the built-in word search library (tantivy) loads. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-36efk735\"&gt;FAIL&lt;/code&gt; here means a broken installation, but it does not change the exit code.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qvhn9h8l\"&gt;lexical index      : ok (tantivy binding loads)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"en/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7mchjmt6\"&gt;doctor&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-store\"&gt;&lt;a href=\"en/glossary.html#theia-store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0iqri7wy\"&gt;.theia store&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5vui32lx\"&gt;theia doctor&lt;/code&gt; line: whether there is a store in the current folder. Values: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v9d1yqxt\"&gt;ok&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7zxc8cav\"&gt;not initialized (theia init)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#not-initialized\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3awklfqw\"&gt;not initialized&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#store\"&gt;store&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ai-rules\"&gt;&lt;a href=\"en/glossary.html#ai-rules\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c8oc8r0s\"&gt;ai rules&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Which AI rules files were found in the project and how they reach the model: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y5mlpz1p\"&gt;(native·codex)&lt;/code&gt; — the harness reads the file itself, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cnxwnvh7\"&gt;(injected)&lt;/code&gt; — Theia adds it through a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9qbbnf01\"&gt;Context&lt;/code&gt; manifest. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8fq0seng\"&gt;none detected&lt;/code&gt; means there are no such files.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8lo3pepa\"&gt;ai rules           : none detected&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1okh58eo\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hupwqkh1\"&gt;ai rules: none detected&lt;/code&gt; after &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-agb1woyr\"&gt;theia init&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kpor4glf\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-rulessot\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-898mntem\"&gt;run.rulesSoT&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/rules-prompts.html\"&gt;Rules and prompts&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"codex-hooks\"&gt;&lt;a href=\"en/glossary.html#codex-hooks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s4e9qfy0\"&gt;codex hooks&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z18sllo2\"&gt;theia doctor&lt;/code&gt; line about Codex hooks: whether the hooks feature is on in Codex itself, whether the project is trusted (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2v0jm2wo\"&gt;gate 1&lt;/code&gt;) and whether &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8idnlv7x\"&gt;.codex/hooks.json&lt;/code&gt; exists.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ke2w9w6\"&gt;codex hooks        : feature stable/true; project NOT trusted (gate 1); hooks.json absent (theia hooks install codex)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#gate-1\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9zze2vye\"&gt;gate 1&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"en/integrations/codex.html\"&gt;Codex&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-ids\"&gt;&lt;a href=\"en/glossary.html#group-ids\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Ids&lt;/span&gt;&lt;/a&gt;Ids&lt;/h2&gt;\n&lt;h3 id=\"run-id\"&gt;&lt;a href=\"en/glossary.html#run-id\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ndbx6rf4\"&gt;runId&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A run id: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bqcdagzy\"&gt;run&lt;/code&gt; plus 22 characters, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-31fyjveu\"&gt;run2akdqb2i4k223pwvesbyig&lt;/code&gt;. Other objects have their own prefixes: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0yfms7ol\"&gt;tsk&lt;/code&gt; — task, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a1a5yn8s\"&gt;pln&lt;/code&gt; — plan, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-668e4lf4\"&gt;fct&lt;/code&gt; — fact, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-glemfp34\"&gt;chk&lt;/code&gt; — memory chunk, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7kvgid84\"&gt;gen&lt;/code&gt; — search generation. Ids grow over time, so their order matches creation order. Commands accept the full id or the 22 characters without the prefix.&lt;/p&gt;\n&lt;p&gt;There is no command that lists runs. You can see the id at the start of a run (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lssy51bm\"&gt;run run… task tsk…&lt;/code&gt;), in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1fth9v0z\"&gt;resume with:&lt;/code&gt; hint, on the home screen and in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kwuth46k\"&gt;theia audit verify&lt;/code&gt; output.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#body\"&gt;body&lt;/a&gt;, &lt;a href=\"en/glossary.html#short-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ogisbnu4\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#terryid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-avza24jm\"&gt;terryid&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"body\"&gt;&lt;a href=\"en/glossary.html#body\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;body&lt;/span&gt;&lt;/a&gt;body&lt;/h3&gt;\n&lt;p&gt;An id without its prefix: 22 characters, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i3a2vayt\"&gt;2akdqb2i4k223pwvesbyig&lt;/code&gt;. Theia prints ids in this form in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zc6pflpg\"&gt;theia audit verify&lt;/code&gt;, in fork lineage lines and in the hint after the first Ctrl+C. Commands accept this form too.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oshjbzfe\"&gt;2akdqb2i4k223pwvesbyig: intact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nd2oeo83\"&gt;forked from 2akdqb2i4k223pwvesbyig at bjr37ync&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-shwv6fg8\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#short-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kc2w3l1c\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"short-id\"&gt;&lt;a href=\"en/glossary.html#short-id\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-77uqx2cf\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A short number is the last characters of an id, for the screen: 8 characters in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pghlobq3\"&gt;--plain&lt;/code&gt;, on the board and in the TUI (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kzbswdke\"&gt;xk6rzynf&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cjthj4lk\"&gt;tsk…xk6rzynf&lt;/code&gt;), and 6 characters in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2whcajxx\"&gt;live&lt;/code&gt; lines (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x2qzvsko\"&gt;tsk…6rzynf&lt;/code&gt;). Only &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0gxejbq\"&gt;show --task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ggqlyai\"&gt;msg --task&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ody3rlr4\"&gt;fork --at&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-drixhww0\"&gt;answer --question&lt;/code&gt; accept a short tail.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0a6xuz59\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#body\"&gt;body&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"terryid\"&gt;&lt;a href=\"en/glossary.html#terryid\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8nelgp8x\"&gt;terryid&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The name of Theia's id format. The word appears in errors when a string cannot be read as an id. There are two texts:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r50uqqtp\"&gt;terryid: neither a body nor a full id: '…'&lt;/code&gt; — the argument is shorter than a full id and is not the 22 characters after the prefix. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6p1dwb95\"&gt;show&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ets1cec3\"&gt;diagnose&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fhcyqoik\"&gt;msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-110m3x9u\"&gt;replay&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v2sl450j\"&gt;fork&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p9n9xr22\"&gt;mem asof&lt;/code&gt; answer this to a short tail like &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-trrcrp4f\"&gt;ovfyt3&lt;/code&gt; and to a date given instead of an id.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3elcik1\"&gt;terryid: malformed id '…'&lt;/code&gt; — the string has the length of an id but is not one. In 0.2.201 &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-96x9hvf6\"&gt;theia run --from-plan&lt;/code&gt; answers this when the word after the flag is not a plan id.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;A well-formed id that belongs to nothing gives a different error: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kz64l04r\"&gt;&amp;lt;command&amp;gt;: no events for &amp;lt;id&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k90gves1\"&gt;terryid: neither a body nor a full id: 'ovfyt3'&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1zbhnou4\"&gt;terryid: malformed id '--plain'&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9gitiw20\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#asof\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wia5rna5\"&gt;asof&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"digest\"&gt;&lt;a href=\"en/glossary.html#digest\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;digest&lt;/span&gt;&lt;/a&gt;digest&lt;/h3&gt;\n&lt;p&gt;A digest is the SHA-256 hash of some content. The same content gives the same digest; any change gives another one. Theia uses digests for a plan (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y19go32y\"&gt;digest fce3554ee5e2…&lt;/code&gt;), an included file (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dianbnpq\"&gt;sha256 bc70e26f40b8&lt;/code&gt;), check command output (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v2v4qkn8\"&gt;test_run 74d0…&lt;/code&gt;) and vendor deliverables.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ien2kfj\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w4ncqvrb\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#test-run\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ookki1af\"&gt;test_run&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-internal\"&gt;&lt;a href=\"en/glossary.html#group-internal\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Internal codes&lt;/span&gt;&lt;/a&gt;Internal codes&lt;/h2&gt;\n&lt;h3 id=\"the-codes\"&gt;&lt;a href=\"en/glossary.html#the-codes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k1g1b7ty\"&gt;THE-…&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Numbers of Theia's internal development rules in brackets at the end of error messages. The meaning is in the text before the brackets; the number itself can be ignored. The ones you meet most often:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b0923kii\"&gt;THE-005&lt;/code&gt; — the run's audit chain is broken: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rlffbr74\"&gt;resume&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vqgs24xu\"&gt;fork&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b9dlue7f\"&gt;probe&lt;/code&gt; refuse to work with such a run (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-00wm9h1n\"&gt;… chain BROKEN at &amp;lt;event&amp;gt; — refusing to … a tampered run (THE-005)&lt;/code&gt;), and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t19375qb\"&gt;theia audit verify&lt;/code&gt; prints &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qw2d4yhm\"&gt;BROKEN&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p91diou3\"&gt;THE-013&lt;/code&gt; — Claude Code is set up with an API key, while Theia accepts only a subscription login (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ms8yx1oq\"&gt;API-key fallback is refused — THE-013&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cw7llwly\"&gt;THE-014&lt;/code&gt; — a secret reached a model prompt: a file included with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cqzin2zc\"&gt;@path&lt;/code&gt; in a task or plan text (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4q0wk0js\"&gt;@key.pem: prohibited content (pem_private_key) — this file cannot enter a model prompt (THE-014)&lt;/code&gt;) or the prompt text itself (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qbg325qe\"&gt;gateway: prohibited content (api_key) — call blocked (THE-014)&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c6wpivry\"&gt;THE-024&lt;/code&gt; — the money budget of a run or of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kd9kxm86\"&gt;ask&lt;/code&gt; is used up (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cthfvyo3\"&gt;usd budget exhausted for this run (THE-024)&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l7sk4pxw\"&gt;THE-065&lt;/code&gt; — the shipped files with the role prompts are missing or damaged (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6agxjrt2\"&gt;no vendor deliverables found … (THE-065)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xouet7ut\"&gt;vendor prompts broken … (THE-065)&lt;/code&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#ticket-codes\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8nvqoo6m\"&gt;R5&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-srsv31t8\"&gt;T-W&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"en/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-txgs6xgt\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#budget-exhausted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ula3q329\"&gt;budget_exhausted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#vendor\"&gt;vendor deliverables&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ticket-codes\"&gt;&lt;a href=\"en/glossary.html#ticket-codes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;,&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zru0uq7a\"&gt;R5&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-avk1fkyw\"&gt;T-W&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Numbers of internal tickets and design document sections in help text and messages: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lk2fu06p\"&gt;(R5)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2gad7gl7\"&gt;(R11)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lctmu2wg\"&gt;— T-W&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ivt1g1v\"&gt;(F6)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3a0n8oq7\"&gt;docs/10 §4&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4j9i260v\"&gt;docs/13&lt;/code&gt;. They are references for platform developers, and you can ignore them. Treat the word &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6mj9w5f2\"&gt;receipt&lt;/code&gt; in help text the same way.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#the-codes\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3t3804fd\"&gt;THE-…&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"ambiguous\"&gt;&lt;a href=\"en/glossary.html#ambiguous\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Words with several meanings&lt;/span&gt;&lt;/a&gt;Words with several meanings&lt;/h2&gt;\n&lt;p&gt;One word in Theia's output can mean different things. The place where it stands tells which. Each such word has its own article:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#note\"&gt;note&lt;/a&gt; — the service note &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pceq6zzr\"&gt;task.note&lt;/code&gt;, your steering &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4xdvlk67\"&gt;user.note&lt;/code&gt;, a role's comment, a plan request, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-87x9w9ms\"&gt;noted — …&lt;/code&gt; reply.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ynavlqj2\"&gt;live&lt;/code&gt;&lt;/a&gt; — progress lines in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5jtcgjfd\"&gt;--plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qfgqo0dp\"&gt;· live&lt;/code&gt; in the TUI header, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zavkrafd\"&gt;(live; …)&lt;/code&gt; on resume, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zwhnmb7o\"&gt;N live&lt;/code&gt; in the status line.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#session\"&gt;session&lt;/a&gt; — a harness session, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e1peoocs\"&gt;--sessions&lt;/code&gt; mode, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d7rz7hlm\"&gt;SessionStart&lt;/code&gt; hook, conversation chunk labels.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wjgr4tt9\"&gt;verify&lt;/code&gt;&lt;/a&gt; — the phase, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ietlid13\"&gt;--verify&lt;/code&gt; flag, a plan item's check command, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4gswqup5\"&gt;lead_reverify&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xw6p9jrx\"&gt;draft&lt;/code&gt;&lt;/a&gt; — the phase of a new task and the status of an unapproved plan.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#done\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kexp6d8u\"&gt;done&lt;/code&gt;&lt;/a&gt; — the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uhwmdv3k\"&gt;N done&lt;/code&gt; counter in the TUI and the unreachable &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ynsvkod\"&gt;done&lt;/code&gt; phase.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#budget\"&gt;budget&lt;/a&gt; — the run's money, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zzlhhjdp\"&gt;halted: budget&lt;/code&gt; (verdicts, not money), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6vrr5sr\"&gt;round_budget&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-33b14t4v\"&gt;rescope_budget&lt;/code&gt;, separate limits for &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-idos9xtm\"&gt;fork&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eix3ycir\"&gt;probe&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8agn8tre\"&gt;ask&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ghwtdaon\"&gt;index build&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#workspace\"&gt;workspace&lt;/a&gt; — the task copy &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wyct9cnv\"&gt;ws-&amp;lt;task&amp;gt;&lt;/code&gt;, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0kja4zm7\"&gt;kind: Workspace&lt;/code&gt; manifest, the project folder, Codex's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6b2zvw8p\"&gt;workspace-write&lt;/code&gt; mode.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#root\"&gt;root&lt;/a&gt; — a project root, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-afxq708u\"&gt;root:&amp;lt;name&amp;gt;&lt;/code&gt; in memory, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n3zb2yf4\"&gt;worktree root&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6o2q2r96\"&gt;root cause&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#scope\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oguyep0k\"&gt;scope&lt;/code&gt;&lt;/a&gt; — a memory part, a settings level, a chain name in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pz9rraoi\"&gt;audit verify&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#head\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-asdukzvo\"&gt;head&lt;/code&gt;&lt;/a&gt; — the age of a search generation, the last event in the TUI, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8adrwz98\"&gt;HEAD&lt;/code&gt; commit.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wqx86t2z\"&gt;plan&lt;/code&gt;&lt;/a&gt; — a saved plan and the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2zo9y2l2\"&gt;plan&lt;/code&gt; phase of the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vk4dxar8\"&gt;full_spec&lt;/code&gt; track.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#ready\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6hw4ym2\"&gt;ready&lt;/code&gt;&lt;/a&gt; — one event for three moves: into &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7iaipjpd\"&gt;implement&lt;/code&gt; for a new task, into &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mwgztlkj\"&gt;implement&lt;/code&gt; after the planner, into &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bbww7q9j\"&gt;verify&lt;/code&gt; after the implementer. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zdsvcyth\"&gt;docker ready&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-myyhsm0i\"&gt;theia doctor&lt;/code&gt; (the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xu9v47yx\"&gt;docker&lt;/code&gt; command exists) and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8crkx4gw\"&gt;ready at …&lt;/code&gt; for embeddings (the model is downloaded) are unrelated uses of the same word.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qrfus2wq\"&gt;merge&lt;/code&gt;&lt;/a&gt; and &lt;a href=\"en/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xvj3wxkv\"&gt;merged&lt;/code&gt;&lt;/a&gt; — the merge phase and a task outcome; &lt;a href=\"en/glossary.html#discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gi6yso3p\"&gt;discard&lt;/code&gt;&lt;/a&gt; and &lt;a href=\"en/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vd1ei2es\"&gt;discarded&lt;/code&gt;&lt;/a&gt; — the reviewer's verdict and a task outcome.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kg4o4lbb\"&gt;FAIL&lt;/code&gt;&lt;/a&gt; and &lt;a href=\"en/glossary.html#failed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bdsituco\"&gt;failed&lt;/code&gt;&lt;/a&gt; — a problem in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jk871px2\"&gt;theia doctor&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t6mojv0e\"&gt;index build&lt;/code&gt;, the counter of discarded tasks in the TUI, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-92kdjxza\"&gt;(FAILED)&lt;/code&gt; on an agent action.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"misleading\"&gt;&lt;a href=\"en/glossary.html#misleading\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Misleading statuses&lt;/span&gt;&lt;/a&gt;Misleading statuses&lt;/h2&gt;\n&lt;p&gt;Words that look like a judgement but are not one. Check what stands next to them.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#completed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8bpifls2\"&gt;completed&lt;/code&gt;&lt;/a&gt; does not mean success: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wtxqdvq6\"&gt;halted: completed&lt;/code&gt; is printed even when every task was discarded, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n44unauc\"&gt;theia run&lt;/code&gt; then exits with code 1. Check each task's outcome: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fkkv8qyv\"&gt;merged&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cru7vfdb\"&gt;discarded&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#glyphs\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gny6eyak\"&gt;✔&lt;/code&gt;&lt;/a&gt; means \"not a bad event\", not \"a good outcome\". The rounds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x7zxdhdh\"&gt;lead → lead_discard&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xeziqdrk\"&gt;arbiter → arb_escalate&lt;/code&gt; are marked &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w94c0rot\"&gt;✔&lt;/code&gt; too, and a run with no merge at all shows as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-19okdkc3\"&gt;✔ completed&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b91xtqe7\"&gt;halted: budget&lt;/code&gt;&lt;/a&gt; is not money but the cap of 1000 verdicts. When the money runs out, the outcome is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ekoy7h56\"&gt;halted: paused&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;a href=\"en/glossary.html#running\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-724f29ct\"&gt;running&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-twwqulyl\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nx0p1ay8\"&gt;N live&lt;/code&gt;&lt;/a&gt; — a run killed without a pause looks like this too: it simply has no end record. Continue it (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8oif254c\"&gt;--resume&lt;/code&gt;) or close it (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cei6mqah\"&gt;--abandon&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uhn3lo36\"&gt;noted — this run appears live …&lt;/code&gt; from &lt;a href=\"en/glossary.html#steering\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3r3vt7tn\"&gt;theia msg&lt;/code&gt;&lt;/a&gt; does not mean the note will arrive: a new run does not read notes from other processes, only a run continued with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3gt77lam\"&gt;--resume&lt;/code&gt; does.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ubgiu7l\"&gt;resuming run … (finished; …)&lt;/code&gt; — &lt;a href=\"en/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-teojgq7i\"&gt;--resume&lt;/code&gt;&lt;/a&gt; continues even a closed run (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-08zehx6b\"&gt;halted: abandoned&lt;/code&gt;). The word in brackets is the state in the log, not a permission.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-49m43qfc\"&gt;&amp;lt;name&amp;gt;: intact&lt;/code&gt; from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0mpkm966\"&gt;theia audit verify&lt;/code&gt; for a scope that does not exist — the &lt;a href=\"en/glossary.html#audit-chain\"&gt;chain&lt;/a&gt; is intact because there is nothing to check.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4tmkn0xt\"&gt;superseded &amp;lt;old&amp;gt; -&amp;gt; &amp;lt;new&amp;gt;&lt;/code&gt; from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rccam9bj\"&gt;theia mem supersede&lt;/code&gt; — the &lt;a href=\"en/glossary.html#supersede\"&gt;replacement&lt;/a&gt; is recorded even when the new id does not exist.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zhccjtsa\"&gt;docker ready&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sl1mdjdz\"&gt;theia doctor&lt;/code&gt; — the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-afrskoih\"&gt;docker&lt;/code&gt; command exists, not that Docker is running. See &lt;a href=\"en/glossary.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6pv52sey\"&gt;jail&lt;/code&gt;&lt;/a&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-29ev3fy1\"&gt;(injected)&lt;/code&gt; in the &lt;a href=\"en/glossary.html#ai-rules\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-res1su1k\"&gt;ai rules&lt;/cod
