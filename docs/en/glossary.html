x=\"0\" id=\"inline-code-id-bzmynio6\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#lead-reverify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vctvcsjt\"&gt;lead_reverify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"review\"&gt;&lt;a href=\"en/glossary.html#review\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-456se2oa\"&gt;review&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The phase where the reviewer looks at the task's changes. Next: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4v4xdme9\"&gt;approve&lt;/code&gt; leads to merge; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xkwyvbgv\"&gt;rework&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ss0okuhc\"&gt;discard&lt;/code&gt; lead to the arbiter.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fr0fhch0\"&gt;task.phase … verify_pass → review&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#reviewer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5c4sd6em\"&gt;reviewer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#approve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xh9rq56i\"&gt;approve&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#rework\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yw5o01tf\"&gt;rework&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jvgvcbif\"&gt;discard&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"merge\"&gt;&lt;a href=\"en/glossary.html#merge\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-htxx5k37\"&gt;merge&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Merge (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0j22uf6a\"&gt;merge&lt;/code&gt;) is the phase where Theia merges the task's work into the run branch with plain git. No model works here. Merges run one at a time. After success the task copy is deleted, and the task branch &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z0xfmzk0\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt; stays in your repository. Do not confuse the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xi2dweg\"&gt;merge&lt;/code&gt; phase with the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g026jqo1\"&gt;merged&lt;/code&gt; outcome.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8jy96wud\"&gt;task.phase … approve → merge&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#merger\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6cbs0zfh\"&gt;merger&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-abbz21dz\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#merge-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tbjwh0pi\"&gt;merge_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"en/glossary.html#audit-branch\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-woem2ox6\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"arbitrate\"&gt;&lt;a href=\"en/glossary.html#arbitrate\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3puba6h\"&gt;arbitrate&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The phase where the arbiter settles a dispute: one more attempt (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-no75of1h\"&gt;arb_continue&lt;/code&gt; → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mmadempe\"&gt;implement&lt;/code&gt;) or hand the task to the lead (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7gs6c2no\"&gt;arb_escalate&lt;/code&gt; → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lgzq45ma\"&gt;escalated&lt;/code&gt;). A task comes here after &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hj85ufkh\"&gt;rework&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oo1cj0xp\"&gt;discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-453nb213\"&gt;merge_fail&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9eepulgl\"&gt;cant_do&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0uefphnp\"&gt;task.phase … merge_fail → arbitrate&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#arbiter\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bhscntlf\"&gt;arbiter&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#arb-continue\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hvhx1tml\"&gt;arb_continue&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#arb-escalate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g239vu1c\"&gt;arb_escalate&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"escalated\"&gt;&lt;a href=\"en/glossary.html#escalated\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n7g84swu\"&gt;escalated&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The task is stuck and waits for the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2jcu3bym\"&gt;lead&lt;/code&gt;. It gets here through &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7qarhysx\"&gt;arb_escalate&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vdb8ce2k\"&gt;stop_and_fix&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-huvkfgj0\"&gt;algedonic&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ffnpkxmn\"&gt;no_progress&lt;/code&gt; and an unanswered clarifying question. The TUI marks such a task with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9cn9jrcb\"&gt;◆&lt;/code&gt; and counts it as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-89gh0ol7\"&gt;frozen&lt;/code&gt;. If the run paused or was closed, the task stays &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-diqian1b\"&gt;escalated&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-25v7abqa\"&gt;task.phase … arb_escalate → escalated&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ykd38q3c\"&gt;◆ ▼ tsk…fd7pn6tz [fast_path]  escalated  r9&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-efl0eu2v\"&gt;tasks: … 1 frozen&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sayzj3kx\"&gt;lead&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#frozen\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g24kaoiz\"&gt;frozen&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#no-progress\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ktd70gka\"&gt;no_progress&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#stop-and-fix\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9jz1q454\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"planned\"&gt;&lt;a href=\"en/glossary.html#planned\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-57xw3xet\"&gt;planned&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The final phase of a plan item. The planner answered &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v37vjgs7\"&gt;planned&lt;/code&gt; and split the task into subtasks: the subtasks do the work, and the item itself is closed. If &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s2t3krp5\"&gt;planned&lt;/code&gt; comes without subtasks, Theia treats it as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l87a5yv0\"&gt;ready&lt;/code&gt; and logs the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fpsthubz\"&gt;planned_without_subtasks&lt;/code&gt; anomaly.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#planner\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9hp8mb5y\"&gt;planner&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bp00ors7\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#planned-without-subtasks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4hh2udty\"&gt;planned_without_subtasks&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"merged\"&gt;&lt;a href=\"en/glossary.html#merged\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yt9ih7t7\"&gt;merged&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A task outcome: the work landed on the run branch. In the line &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-df2r9pmg\"&gt;task.phase … merged → merged&lt;/code&gt; the word appears twice: first the event (the merge worked), then the new phase. In &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4g8lkh9i\"&gt;--in-place&lt;/code&gt; mode there is no merge, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o17hok3t\"&gt;merged&lt;/code&gt; only marks the work as accepted.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yzjaykrj\"&gt;verdict … merger → merged (1 evidence)&lt;/code&gt;, summary &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u4wy5kou\"&gt;tsk… → merged (4 rounds)&lt;/code&gt;, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-chjfspw9\"&gt;done&lt;/code&gt; count in the TUI.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lf4q7aau\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"en/glossary.html#in-place\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8iwqtcnw\"&gt;--in-place&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#done\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aoxl1rs2\"&gt;done&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"discarded\"&gt;&lt;a href=\"en/glossary.html#discarded\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-37239hgu\"&gt;discarded&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A task outcome: the work was dropped and did not land on the run branch. Only the lead discards, with the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rivqx3zn\"&gt;lead_discard&lt;/code&gt; event; the reviewer's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cr7e58xs\"&gt;discard&lt;/code&gt; just sends the task to the arbiter. The task copy stays for inspection. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0mia0u3z\"&gt;theia run&lt;/code&gt; with a discarded task exits with code 1. The TUI marks such a task with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9lufr3tg\"&gt;✖&lt;/code&gt; and counts it as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o9i9m5od\"&gt;failed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9enska1b\"&gt;task.phase … lead_discard → discarded&lt;/code&gt;, summary &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jtnb1a9x\"&gt;tsk… → discarded (6 rounds)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bdu3skao\"&gt;tasks: 0 running · 0 done · 1 failed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#lead-discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-09uskura\"&gt;lead_discard&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rtvidw3m\"&gt;discard&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#failed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qgaoajah\"&gt;failed&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#completed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dph2jlis\"&gt;completed&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"done\"&gt;&lt;a href=\"en/glossary.html#done\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2d34qg8d\"&gt;done&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The word has two meanings:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;In the TUI, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-og8o1mhl\"&gt;N done&lt;/code&gt; is the number of tasks with a good outcome: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-puliaep4\"&gt;merged&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hebt74gd\"&gt;planned&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;A final phase &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yg2chdli\"&gt;done&lt;/code&gt; exists in Theia's code, but in 0.2.201 no step leads to it.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rzq8okg0\"&gt;tasks: 0 running · 1 done · …&lt;/code&gt; in the TUI header.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-549zkyb9\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ttbsf2c\"&gt;planned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-events\"&gt;&lt;a href=\"en/glossary.html#group-events\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Verdicts and log events&lt;/span&gt;&lt;/a&gt;Verdicts and log events&lt;/h2&gt;\n&lt;h3 id=\"verdict\"&gt;&lt;a href=\"en/glossary.html#verdict\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;verdict&lt;/span&gt;&lt;/a&gt;verdict&lt;/h3&gt;\n&lt;p&gt;A verdict is a role's answer to its step: a short word plus evidence references. The model answers with a word from its list (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nh85sy18\"&gt;pass&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ok1fxd5\"&gt;approve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uj8lvo52\"&gt;continue&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gaj5ocsm\"&gt;rescope&lt;/code&gt;…), and Theia prints the event (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3yiwtkg\"&gt;verify_pass&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8f8j3gbn\"&gt;approve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aqc6xch9\"&gt;arb_continue&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j8818p0q\"&gt;lead_rescope&lt;/code&gt;). That is why &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uu0myw1z\"&gt;--plain&lt;/code&gt; shows &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zu4ly9wc\"&gt;verify_pass&lt;/code&gt;, not &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jxr4w4s2\"&gt;pass&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jbdznxnb\"&gt;verdict&lt;/code&gt; line shows what the role answered. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5motwu6p\"&gt;task.phase&lt;/code&gt; line right after it shows what Theia applied. They can differ: for example, Theia applies the third &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-foz402lx\"&gt;verify_fail&lt;/code&gt; in a row as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hpnjit66\"&gt;stop_and_fix&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8lk0q26f\"&gt;verdict &amp;lt;task&amp;gt; &amp;lt;role&amp;gt; → &amp;lt;event&amp;gt; (N evidence)  “&amp;lt;comment&amp;gt;”&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1c8g5vno\"&gt;r2 verify  verifier → verify_pass&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#evidence\"&gt;evidence&lt;/a&gt;, &lt;a href=\"en/glossary.html#task-phase\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p6iakoun\"&gt;task.phase&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#phase\"&gt;phase&lt;/a&gt;, &lt;a href=\"en/glossary.html#round\"&gt;round&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"start\"&gt;&lt;a href=\"en/glossary.html#start\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9sesj0n9\"&gt;start&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The start event of a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hiqsvv17\"&gt;full_spec&lt;/code&gt; task: the task moves from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-349jxs32\"&gt;draft&lt;/code&gt; to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2r6dgq3u\"&gt;plan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1jcw8ku8\"&gt;task.phase … start → plan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2y79xh7r\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#ready\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sf6se0pu\"&gt;ready&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ready\"&gt;&lt;a href=\"en/glossary.html#ready\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f97kqhwe\"&gt;ready&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;\"Done, next.\" One word for three moves: a new &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6aldq6aq\"&gt;fast_path&lt;/code&gt; task goes to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0cmzbqij\"&gt;implement&lt;/code&gt;; the planner finished and the task goes to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ggvum6q\"&gt;implement&lt;/code&gt;; the implementer finished and the task goes to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-97sroyc3\"&gt;verify&lt;/code&gt;. The phase after the arrow tells which move happened.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2nk75x0y\"&gt;task.phase … ready → implement&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g00w0o9p\"&gt;task.phase … ready → verify&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tphlu94d\"&gt;implementer → ready&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#fast-path\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xw6y20in\"&gt;fast_path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jelbhi4j\"&gt;implement&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nrxhp9ci\"&gt;verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"cant-do\"&gt;&lt;a href=\"en/glossary.html#cant-do\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8r9inkpu\"&gt;cant_do&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The implementer reports that it cannot do the task. The task goes to the arbiter. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jz8xrjxa\"&gt;theia diagnose&lt;/code&gt; calls this case &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-87n599x8\"&gt;capability-gap&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ozh3yej\"&gt;implementer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3l2zd5ee\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d3ijmlef\"&gt;root cause&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"algedonic\"&gt;&lt;a href=\"en/glossary.html#algedonic\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1tvrcxkj\"&gt;algedonic&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A serious-trouble signal from the implementer or the planner: the problem is bigger than this attempt. The task goes straight to the lead, skipping check and review.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nyypm4v4\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0irod382\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verify-pass\"&gt;&lt;a href=\"en/glossary.html#verify-pass\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zua5icvq\"&gt;verify_pass&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The check passed: every &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zoueozza\"&gt;--verify&lt;/code&gt; command exited with code 0, or the model verifier answered &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gab0iakg\"&gt;pass&lt;/code&gt;. The task goes to the reviewer.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-60w8kk3h\"&gt;verdict … verifier → verify_pass (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fzqbledl\"&gt;task.phase … verify_pass → review&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uama3izz\"&gt;verify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#verifier\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uz8gnzvt\"&gt;verifier&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2w6owzfx\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verify-fail\"&gt;&lt;a href=\"en/glossary.html#verify-fail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-olk8xjdf\"&gt;verify_fail&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The check failed: a command returned a non-zero code, and the commands after it are skipped. The task goes back to the implementer. After three failures in a row (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-argskaj8\"&gt;run.stopAndFixAfterFailures&lt;/code&gt;) Theia breaks the loop with the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3hurk77f\"&gt;stop_and_fix&lt;/code&gt; event.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-27nvin1h\"&gt;verifier → verify_fail (1 evidence)  “$ false → exit 1 (no output)”&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ksphwtig\"&gt;task.phase … verify_fail → implement&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iqupvdvq\"&gt;verify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#stop-and-fix\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gi5aykca\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#lead-reverify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jxilpnru\"&gt;lead_reverify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"approve\"&gt;&lt;a href=\"en/glossary.html#approve\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1p6m0wqh\"&gt;approve&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The reviewer accepted the changes. The task goes to merge.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nyw5jsfk\"&gt;verdict … reviewer → approve (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-71zm6gcn\"&gt;task.phase … approve → merge&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#reviewer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jnvxjxqb\"&gt;reviewer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qj3y454y\"&gt;merge&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"rework\"&gt;&lt;a href=\"en/glossary.html#rework\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fsvlstkz\"&gt;rework&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The reviewer asks for more work. The task goes to the arbiter, which usually returns it to the implementer. Later attempts get the reviewer's objection. If &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s618g2k2\"&gt;rework&lt;/code&gt; repeats while checks pass, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zl2kfkaj\"&gt;theia diagnose&lt;/code&gt; calls it &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-piaezmo8\"&gt;review-loop&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#reviewer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fcd91hmd\"&gt;reviewer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aplqd3dy\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y28e6neq\"&gt;root cause&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"discard\"&gt;&lt;a href=\"en/glossary.html#discard\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jqtfv158\"&gt;discard&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The reviewer rejects the changes. The task is not discarded by this: it goes to the arbiter. Only the lead can discard a task, with the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vn9q87ok\"&gt;lead_discard&lt;/code&gt; event.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vp5k60sc\"&gt;task.phase … discard → arbitrate&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#lead-discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yb5en75u\"&gt;lead_discard&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ia7urcm\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bpxy2e7j\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"merge-fail\"&gt;&lt;a href=\"en/glossary.html#merge-fail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hmtsctvd\"&gt;merge_fail&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The merge failed. The reason is in the verdict comment, for example &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-58nbylu0\"&gt;no commits on the task branch&lt;/code&gt; (the task copy has no commits), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jidsghba\"&gt;uncommitted work left in workspace&lt;/code&gt; (uncommitted edits remain) or a conflict. The task goes to the arbiter.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-69itr7s7\"&gt;verdict … merger → merge_fail (1 evidence)  “no commits on the task branch”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#merger\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pzrd91um\"&gt;merger&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#precheck\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jklkyh5g\"&gt;precheck&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tb7971tu\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"arb-continue\"&gt;&lt;a href=\"en/glossary.html#arb-continue\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n3mq8onu\"&gt;arb_continue&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The arbiter decided to try again. The task returns to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4mjlg13c\"&gt;implement&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#arbiter\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jrjd2xmc\"&gt;arbiter&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cmdxkypc\"&gt;implement&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"arb-escalate\"&gt;&lt;a href=\"en/glossary.html#arb-escalate\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kb1lfx71\"&gt;arb_escalate&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The arbiter hands the task to the lead. The task moves to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-up7fiz7o\"&gt;escalated&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vafa8qtk\"&gt;verdict … arbiter → arb_escalate (1 evidence)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#arbiter\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5mfkbtw0\"&gt;arbiter&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-la72nnre\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cjuu2o8v\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"rescope\"&gt;&lt;a href=\"en/glossary.html#rescope\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;rescope&lt;/span&gt;&lt;/a&gt;rescope&lt;/h3&gt;\n&lt;p&gt;A rescope is the lead restarting a stuck task with a new direction. The output shows it as the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i5tszb1l\"&gt;lead_rescope&lt;/code&gt; event. The task goes back to the implementer, its round counter resets, and the lead's text becomes steering for this task. The lead may also replace the check commands.&lt;/p&gt;\n&lt;p&gt;A task can be rescoped 2 times (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4mmpd2f7\"&gt;run.maxRescopes&lt;/code&gt;). On the third time Theia logs the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sl5l88ef\"&gt;rescope_budget&lt;/code&gt; anomaly and discards the task. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5gc7ye9p\"&gt;--max-rescopes&lt;/code&gt; flag changes the limit for one run. In the flag &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d3edzv78\"&gt;0&lt;/code&gt; means \"no limit\", while in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z35ehfga\"&gt;policy.yaml&lt;/code&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r5st5on5\"&gt;0&lt;/code&gt; means \"no rescopes\".&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#lead-rescope\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wco87jkp\"&gt;lead_rescope&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#rescope-budget\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eg53cuez\"&gt;rescope_budget&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"en/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lx0jjp4x\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lead-rescope\"&gt;&lt;a href=\"en/glossary.html#lead-rescope\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5yjxl50y\"&gt;lead_rescope&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The lead rescopes the task: it returns to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yvb8s3ns\"&gt;implement&lt;/code&gt; with a new direction. See &lt;a href=\"en/glossary.html#rescope\"&gt;rescope&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#rescope\"&gt;rescope&lt;/a&gt;, &lt;a href=\"en/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-msjcpap5\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lead-accept\"&gt;&lt;a href=\"en/glossary.html#lead-accept\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zvmnceaq\"&gt;lead_accept&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The lead accepts the work as done, and the task goes to merge. Theia allows this only after a passed check (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x7b8k5xq\"&gt;verify_pass&lt;/code&gt;). Without one, Theia logs the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-po4wd5kr\"&gt;accept_unverified&lt;/code&gt; anomaly and counts the step as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qnx9xg6c\"&gt;no_progress&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-55b9ppzi\"&gt;lead&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-txevqvit\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#accept-unverified\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v6ey3obr\"&gt;accept_unverified&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lead-reverify\"&gt;&lt;a href=\"en/glossary.html#lead-reverify\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w36sk2je\"&gt;lead_reverify&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The lead asks to check the work again without a new implementer step: the task returns to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xkom4vqd\"&gt;verify&lt;/code&gt;. The lead may also replace the check commands.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mw2iwbxf\"&gt;lead&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8iw8vwi6\"&gt;verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lead-discard\"&gt;&lt;a href=\"en/glossary.html#lead-discard\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7qm05m6\"&gt;lead_discard&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The lead discards the task. It is the only way to the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ooey16c8\"&gt;discarded&lt;/code&gt; outcome. Theia also ends up here when the lead has no rescopes left.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0u71kx7h\"&gt;verdict … lead → lead_discard (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n5wxrnn9\"&gt;task.phase … lead_discard → discarded&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-23k8l6tw\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#rescope-budget\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v47eq9na\"&gt;rescope_budget&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bd9hxo59\"&gt;discard&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"no-progress\"&gt;&lt;a href=\"en/glossary.html#no-progress\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nr8fckkt\"&gt;no_progress&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The step produced nothing. Theia creates this event itself, not the model: the model call failed, the model's reply broke the format twice, the role answered with a word that is not allowed, or the round limit ran out. The task moves to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cwwq3k1e\"&gt;escalated&lt;/code&gt;. After three &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cly2h9ha\"&gt;no_progress&lt;/code&gt; in a row (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-se2lr1l4\"&gt;run.stallPauseAfter&lt;/code&gt;) the run pauses with the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e7y0wzoc\"&gt;dispatch_stalled&lt;/code&gt; anomaly.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l3j2gzyj\"&gt;verdict … lead → no_progress (0 evidence)  “gateway fatal: gateway: transport 'nope' is not manifest-re…”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3m0pqz3\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#dispatch-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-swc42ebx\"&gt;dispatch_stalled&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#environment-failure\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z7yfx3yy\"&gt;environment_failure&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#illegal-verdict\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3lbtvo0a\"&gt;illegal_verdict&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"evidence\"&gt;&lt;a href=\"en/glossary.html#evidence\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;evidence&lt;/span&gt;&lt;/a&gt;evidence&lt;/h3&gt;\n&lt;p&gt;Evidence is the references a role attaches to a verdict: a command it ran, a check result, a commit. It is not a retelling but pointers: a kind and a reference. Kinds: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ph28uba\"&gt;command&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xqzr6ok6\"&gt;test_run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5v15mo8i\"&gt;diff&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ge88hs02\"&gt;file&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9jwmbkkd\"&gt;artifact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4wy0v1tw\"&gt;gateway_call&lt;/code&gt;. For a commit the TUI detail pane suggests &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kobjdt41\"&gt;git show &amp;lt;sha&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cuse1ypz\"&gt;(1 evidence)&lt;/code&gt; in a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ti1zuu77\"&gt;verdict&lt;/code&gt; line, TUI rows under a round such as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dwkyp34k\"&gt;command precheck:… — no commits on the task branch&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ietu44ge\"&gt;evidence[command] …&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z1q6q0bw\"&gt;theia diagnose&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#verdict\"&gt;verdict&lt;/a&gt;, &lt;a href=\"en/glossary.html#test-run\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f1ilrhyb\"&gt;test_run&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-idw8h6nh\"&gt;detail&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"test-run\"&gt;&lt;a href=\"en/glossary.html#test-run\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zz8d7b78\"&gt;test_run&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;An evidence kind: the result of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-glz43465\"&gt;--verify&lt;/code&gt; commands. The reference is a fingerprint of the full output; the output itself is in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4wz8fffn\"&gt;.theia/objects&lt;/code&gt;. In 0.2.201 the TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-67zbw73v\"&gt;v&lt;/code&gt; key on such a row says &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l9kjkrbx\"&gt;no stored body for this row&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rl7li5ea\"&gt;test_run 74d01a0c051c… — exit 0: true&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dfhexjhv\"&gt;evidence[test_run] 74d01a0c… (exit 0: true)&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-964bbdvs\"&gt;theia diagnose&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#evidence\"&gt;evidence&lt;/a&gt;, &lt;a href=\"en/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q4jb50vz\"&gt;verify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#theia-dir\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f9v1v5uj\"&gt;.theia&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-created\"&gt;&lt;a href=\"en/glossary.html#run-created\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0sfc4418\"&gt;run.created&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The first event of a run: budget and track, plus &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-19mzzipg\"&gt;plan=&amp;lt;id&amp;gt;&lt;/code&gt; for a run from a plan. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3l8apsef\"&gt;budget=$null&lt;/code&gt; means \"no limit\".&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-utu0fn6p\"&gt;xu3xnxmu run.created   budget=$10 track=fast_path&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"en/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"en/glossary.html#unmetered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-et8xsqug\"&gt;unmetered&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-finished\"&gt;&lt;a href=\"en/glossary.html#run-finished\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h79fckdr\"&gt;run.finished&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The last event of a run: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-91nx3j26\"&gt;halted=&amp;lt;outcome&amp;gt; rounds=&amp;lt;number of verdicts&amp;gt;&lt;/code&gt;. A run with this event counts as finished (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yb94ysnt\"&gt;finished&lt;/code&gt;). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nr384q1p\"&gt;theia run --abandon&lt;/code&gt; writes the same event with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zkw6ug9i\"&gt;halted=abandoned&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7azrwl5y\"&gt;x3qwug7h run.finished  halted=completed rounds=6&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wya2g3p9\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"en/glossary.html#abandoned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8li7zq95\"&gt;abandoned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-paused\"&gt;&lt;a href=\"en/glossary.html#run-paused\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l5rncjzb\"&gt;run.paused&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The pause event: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-49m1oinu\"&gt;rounds=N (resumable)&lt;/code&gt;. You can continue the run with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c872tlbw\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x8ffkz42\"&gt;e7s432s2 run.paused    rounds=8 (resumable)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#paused\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2f7s0q9t\"&gt;paused&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sdrfs2uq\"&gt;--resume&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-forked\"&gt;&lt;a href=\"en/glossary.html#run-forked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w97uu0ju\"&gt;run.forked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The event at the start of a fork: which run it came from (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7oi3zqq8\"&gt;from=&lt;/code&gt;), at which event (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xu4fzras\"&gt;at=&lt;/code&gt;), and the reason in quotes.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gtamikj1\"&gt;run.forked    from=&amp;lt;id&amp;gt; at=&amp;lt;id&amp;gt; “&amp;lt;reason&amp;gt;”&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ynwis8mw\"&gt;forked from &amp;lt;id&amp;gt; at &amp;lt;id&amp;gt;&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s4qttdru\"&gt;theia show&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gmd0wcyq\"&gt;fork&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"task-created\"&gt;&lt;a href=\"en/glossary.html#task-created\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-afd3gxwq\"&gt;task.created&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The task creation event: the short task number, the track in brackets and the task text.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qr4kqclb\"&gt;xeskq65r task.created  xk6rzynf [fast_path] add a greeting line to hello.js&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#task\"&gt;task&lt;/a&gt;, &lt;a href=\"en/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"en/glossary.html#short-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4d4f9600\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"task-phase\"&gt;&lt;a href=\"en/glossary.html#task-phase\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-37x86w8c\"&gt;task.phase&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The phase change event: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-snqw32u5\"&gt;&amp;lt;task&amp;gt; &amp;lt;event&amp;gt; → &amp;lt;new phase&amp;gt;&lt;/code&gt;. Left of the arrow is the event Theia applied; right of it is the phase the task moved to.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cvc36cgw\"&gt;wlqjldhd task.phase    xk6rzynf ready → implement&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#phase\"&gt;phase&lt;/a&gt;, &lt;a href=\"en/glossary.html#verdict\"&gt;verdict&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"task-note\"&gt;&lt;a href=\"en/glossary.html#task-note\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ajxxy05o\"&gt;task.note&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A service note in the log. The source is in brackets:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-esr18d12\"&gt;[workspace_base]&lt;/code&gt; — the commit the task copy was made from;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zjcims05\"&gt;[post_run_maintenance]&lt;/code&gt; — cleanup after the run;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-txi72kit\"&gt;[file_ref]&lt;/code&gt; — files included with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nk81s9be\"&gt;@&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wty3em76\"&gt;[session_prefix]&lt;/code&gt; — the fingerprint of the shared prompt part with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bff1t0uz\"&gt;--sessions&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xci52s06\"&gt;[context_alert]&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a1oc9nw8\"&gt;[context_refuse]&lt;/code&gt; — the added context is too large;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a4a0v0wm\"&gt;[index_auto_build]&lt;/code&gt; — an automatic index build before the run.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Two notes print in their own way: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-52bmqh23\"&gt;context       injected: …&lt;/code&gt; (added rules) and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oq8kg1lh\"&gt;pre-task      … N gate(s), M failed&lt;/code&gt; (checks before a task starts).&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vuza1zvu\"&gt;x5dhtxgs task.note     [workspace_base]&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-183siw18\"&gt;workspace @ 209a8f6 (copy)&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iu39vec6\"&gt;note post_run_maintenance&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#note\"&gt;note&lt;/a&gt;, &lt;a href=\"en/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fseout7h\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#pre-task\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8yh4j2jf\"&gt;pre-task&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#maintenance\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yiguwag5\"&gt;maintenance&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"user-note\"&gt;&lt;a href=\"en/glossary.html#user-note\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-411ckmk1\"&gt;user.note&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;An event with your steering note (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8zalc2z3\"&gt;[msg]&lt;/code&gt;) or your answers to clarifying questions (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j3rmgh41\"&gt;[clarify]&lt;/code&gt;). The TUI marks these rows with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jkgivonb\"&gt;»&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-384m1yq3\"&gt;user.note     [msg] &amp;lt;text&amp;gt;&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-01xxk99s\"&gt;» steer [msg] check the merge precheck first&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"en/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2tue9qwn\"&gt;clarify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"tool\"&gt;&lt;a href=\"en/glossary.html#tool\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sdh6p1nu\"&gt;tool&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A line about an agent action inside the harness: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r39q03vf\"&gt;$&lt;/code&gt; is a command, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iy05m88z\"&gt;✎&lt;/code&gt; a file edit, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-51dyti17\"&gt;⚙&lt;/code&gt; another tool. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bl9mbodr\"&gt;!&lt;/code&gt; after the sign means the action failed. While the call runs, the same lines appear marked &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-878wtx14\"&gt;live&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w6b61me4\"&gt;tool          $ &amp;lt;command&amp;gt;&lt;/code&gt;, tool rows under a model call in the TUI, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5c07gfw0\"&gt;live $ …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p8wi2402\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"en/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4gtll3cc\"&gt;detail&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-stop-request\"&gt;&lt;a href=\"en/glossary.html#run-stop-request\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h9ceszjc\"&gt;run.stop_request&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A graceful stop request from another process. The MCP tool &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s40l0ps6\"&gt;run_stop&lt;/code&gt; writes it. In 0.2.201 only a resumed run acts on it — see &lt;a href=\"en/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3rpvbbsz\"&gt;run.stop_request&lt;/code&gt; line in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ohgbc2dh\"&gt;--plain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"en/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bp9bqwrf\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#mcp\"&gt;MCP&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-question\"&gt;&lt;a href=\"en/glossary.html#run-question\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w217phjl\"&gt;run.question&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A clarifying question put on the control bus in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ukxkqwac\"&gt;--interaction bus&lt;/code&gt; mode. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2herq6jt\"&gt;theia answer &amp;lt;runId&amp;gt;&lt;/code&gt; shows it. In 0.2.201 such questions come only from a resumed run.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-in60x9jg\"&gt;question &amp;lt;id&amp;gt;  (task …xxxxxxxx)&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-apilouq9\"&gt;theia answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m8b1p5u7\"&gt;N questions waiting&lt;/code&gt; in the status line.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-izswlmgv\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-answer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vpahuoos\"&gt;run.answer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-answer\"&gt;&lt;a href=\"en/glossary.html#run-answer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ohwgnnvo\"&gt;run.answer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;An answer to a question from the control bus. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1364b9jr\"&gt;theia answer &amp;lt;runId&amp;gt; --question &amp;lt;id&amp;gt; \"…\"&lt;/code&gt; and the MCP tool &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3iyab31j\"&gt;run_answer&lt;/code&gt; write it.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ypk6weq2\"&gt;answered &amp;lt;id&amp;gt; (…)&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0m7070w\"&gt;theia answer&lt;/code&gt; output.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#run-question\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j6hs3xxo\"&gt;run.question&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"en/reference/run-control.html#answer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-93l9b6sj\"&gt;theia answer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-changeset\"&gt;&lt;a href=\"en/glossary.html#run-changeset\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t3exua27\"&gt;run.changeset&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;An event of a run in a project with several roots: related merges in different repositories landed together. The TUI shows it as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lozfehfa\"&gt;changeset (N merges)&lt;/code&gt;. If the set landed only partly, Theia logs the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sbu5nd47\"&gt;changeset_partial&lt;/code&gt; anomaly.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"en/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z93w0uq4\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#changeset-partial\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b3t8pqdl\"&gt;changeset_partial&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-probed\"&gt;&lt;a href=\"en/glossary.html#run-probed\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;,&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9foai73k\"&gt;run.probed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rqb20dx3\"&gt;run.asked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Question records. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zepgdgjn\"&gt;theia probe&lt;/code&gt; stores its question and answer as a separate record with a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w36vy37d\"&gt;run.probed&lt;/code&gt; event; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h2itjn00\"&gt;theia ask&lt;/code&gt; does the same with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jky0ut4y\"&gt;run.asked&lt;/code&gt;. The run itself does not change. Such records have no &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zjod5g54\"&gt;run.finished&lt;/code&gt; event, so &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xja3fp2d\"&gt;theia show&lt;/code&gt; prints &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-us8n3ose\"&gt;halted: (still open)&lt;/code&gt; for them, and the home screen labels them &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ibfvv7f5\"&gt;probe&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tro1so09\"&gt;ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-saum028k\"&gt;theia show &amp;lt;id&amp;gt; --plain&lt;/code&gt; on a question record, home screen &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vup05eis\"&gt;· run…  probe&lt;/code&gt;, the scope list of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zzw5t5on\"&gt;theia audit verify&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iwheei8m\"&gt;probe&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rtukz8y2\"&gt;ask&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#still-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-75d4hhev\"&gt;(still open)&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"other-events\"&gt;&lt;a href=\"en/glossary.html#other-events\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;and other event names&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4aqzs91e\"&gt;plan.op&lt;/code&gt;and other event names&lt;/h3&gt;\n&lt;p&gt;Some log events have no line of their own in the output: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-miz54x3r\"&gt;plan.op&lt;/code&gt; is a plan action (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6mwnj43e\"&gt;created&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eys9qj5d\"&gt;approved&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fopah3ug\"&gt;changes_requested&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-da6pg78z\"&gt;context_added&lt;/code&gt;); &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jnbvvbmw\"&gt;clock.read&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inlin
