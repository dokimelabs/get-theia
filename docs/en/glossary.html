ode-id-hxv65q1b\"&gt;theia compare&lt;/code&gt; compares the cost of two runs.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-quqv8eax\"&gt;cost A (post-baseline): $0.0000&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uyiq5cnn\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/reference/run-inspect.html#compare\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3adm4msy\"&gt;theia compare&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"root-cause\"&gt;&lt;a href=\"en/glossary.html#root-cause\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dsswx92f\"&gt;root cause&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The likely cause of a failure that &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-55b1by2h\"&gt;theia diagnose&lt;/code&gt; names from a rule table, without a model. Values:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cmm6r07a\"&gt;verification-loop&lt;/code&gt; — the check failed again and again (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2kshit14\"&gt;stop_and_fix&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rxxbwf9f\"&gt;review-loop&lt;/code&gt; — the reviewer repeated an objection while checks passed;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9t5bpwt0\"&gt;rejected-by-review&lt;/code&gt; — the task was discarded with no anomalies: the work was done but judged wrong;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8kexro2f\"&gt;capability-gap&lt;/code&gt; — the implementer answered &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iewwlhr1\"&gt;cant_do&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mt8413eg\"&gt;budget-exhaustion&lt;/code&gt; — the money ran out;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9cjvtpit\"&gt;confused-runner&lt;/code&gt; — a role broke the reply format again and again;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-efjaxcau\"&gt;runaway-decomposition&lt;/code&gt; — the task was split beyond the limits;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hpx2j92t\"&gt;inconclusive&lt;/code&gt; — no rule matched.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x8a4fgkk\"&gt;theia diagnose&lt;/code&gt; saves the result as a memory fact. A repeat of the same set of signs is marked &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z2nzcwvq\"&gt;(fingerprint seen before — reused)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uy0nqz72\"&gt;root cause: rejected-by-review&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ua1narlm\"&gt;why: …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y2f2zrle\"&gt;fingerprint: 0b0ec207de4ff4b3…  memory: 2akdqbfsxs223o53kulbqg&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#anomaly\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q53lcs02\"&gt;anomaly&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#fact\"&gt;fact&lt;/a&gt;, &lt;a href=\"en/reference/run-inspect.html#diagnose\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7u2llygl\"&gt;theia diagnose&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-index\"&gt;&lt;a href=\"en/glossary.html#group-index\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Code index&lt;/span&gt;&lt;/a&gt;Code index&lt;/h2&gt;\n&lt;h3 id=\"intent-index\"&gt;&lt;a href=\"en/glossary.html#intent-index\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;intent index&lt;/span&gt;&lt;/a&gt;intent index&lt;/h3&gt;\n&lt;p&gt;The code index is a set of short cards about project files. A model (the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zlbgfge8\"&gt;indexer&lt;/code&gt; role) writes each file's card once, and the card is reused until the file changes. Only new and changed files cost money. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4fca2wbf\"&gt;theia index build&lt;/code&gt; builds the index, and the cards live in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bbq5iwlq\"&gt;store.db&lt;/code&gt;. Theia gives them to agents in every request as the blueprint.&lt;/p&gt;\n&lt;p&gt;New cards are not visible to search (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iqljmyzy\"&gt;theia index search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u04gujp5\"&gt;theia ask&lt;/code&gt;) until a new search generation is built with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k1qby661\"&gt;theia index reindex&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4oak3fak\"&gt;index: 0 written, 0 current, 1 failed, 2 model calls&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ksh2pokb\"&gt;rate: … zero-cost (0%) … $0.0000 locked&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-czx2yfza\"&gt;theia index status&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#index-entry\"&gt;index entry&lt;/a&gt;, &lt;a href=\"en/glossary.html#blueprint\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dcubrvss\"&gt;blueprint&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-195qthqf\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"en/guides/knowledge.html\"&gt;Code index, memory and questions&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"index-entry\"&gt;&lt;a href=\"en/glossary.html#index-entry\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;index entry&lt;/span&gt;&lt;/a&gt;index entry&lt;/h3&gt;\n&lt;p&gt;An index entry is one file's card. Its line looks like this: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pusjxyea\"&gt;path[layer/module/importance]: F:… | R:… | A:… | S:…&lt;/code&gt;.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mc1aib3r\"&gt;layer&lt;/code&gt; — the architectural layer: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sspsrzva\"&gt;app&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y3t0uep8\"&gt;domain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4fly4rka\"&gt;adapter&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lzqpeeik\"&gt;config&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3k4wtko6\"&gt;test&lt;/code&gt; and others;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a6lmmpyu\"&gt;module&lt;/code&gt; — the business area of the file;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bfth618f\"&gt;importance&lt;/code&gt; — from 9 (core) to 1 (peripheral);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-08agc5do\"&gt;F&lt;/code&gt; — what the file is for, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uta3ry6u\"&gt;R&lt;/code&gt; — related files, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v3evvu8o\"&gt;A&lt;/code&gt; — its public API, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-42djdsh2\"&gt;S&lt;/code&gt; — decisions, constraints and pitfalls.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ninsgv76\"&gt;hello.js[script/demo/1]: F:Prints hello to stdout. | R:- | A:- | S:No logic; smoke file.&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l2gtpj6l\"&gt;theia index render&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mmqmubsk\"&gt;F:&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8hgpb9ah\"&gt;S:&lt;/code&gt; lines in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v7y4rboc\"&gt;theia index search&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;, &lt;a href=\"en/glossary.html#blueprint\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9j0cih37\"&gt;blueprint&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#indexer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ho2739s\"&gt;indexer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blueprint\"&gt;&lt;a href=\"en/glossary.html#blueprint\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5h5eybe\"&gt;blueprint&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The blueprint is all index cards as one text: the most important first, with a legend at the top. Theia adds the blueprint to every agent request. You can see it with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vff2vtqr\"&gt;theia index render&lt;/code&gt;. The Claude Code and Codex hooks add its first 40 lines at session start (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gm7puubz\"&gt;Repo map (head):&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i0qdwj9k\"&gt;run.blueprintMinImportance&lt;/code&gt; setting leaves cards below a given importance out of requests. Theia reports this with a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yfymw1j3\"&gt;blueprint floor: …&lt;/code&gt; line.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ike4sobw\"&gt;Repo intent map — one line per code unit: path[layer/module/importance]: F:… | R:… | A:… | S:…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mkhwm31p\"&gt;blueprint floor: importance ≥N — injecting K of M entries (…)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;, &lt;a href=\"en/glossary.html#index-entry\"&gt;index entry&lt;/a&gt;, &lt;a href=\"en/glossary.html#theia-context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wqpkppvc\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"stale\"&gt;&lt;a href=\"en/glossary.html#stale\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yccpk5ee\"&gt;stale&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A stale index entry: the file changed after its card was written, or Theia's index builder version changed. Theia checks index freshness without a model, by file fingerprints.&lt;/p&gt;\n&lt;p&gt;Note: the number in the warning &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tp8zpqti\"&gt;index: N stale — plan quality degrades; …&lt;/code&gt; at the start of a run and in the TUI hint &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kw6lmlz9\"&gt;idx ⚠N&lt;/code&gt; adds stale and missing (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qhnmzet6\"&gt;missing&lt;/code&gt;) entries together. That is why you can see &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0wp00yoj\"&gt;index: 1 stale&lt;/code&gt; while &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-agbc9aey\"&gt;theia index status&lt;/code&gt; lists the file only under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-raeyjaco\"&gt;missing&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Statuses in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-656ftxn3\"&gt;theia index status&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6r03693r\"&gt;current&lt;/code&gt; — the card is up to date, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4rovm081\"&gt;stale&lt;/code&gt; — outdated, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-187686ag\"&gt;missing&lt;/code&gt; — no card, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wa8gtyi2\"&gt;orphaned&lt;/code&gt; — the file is gone. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-64mdfzd1\"&gt;index is fresh&lt;/code&gt; means there are no stale, missing or orphaned entries.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-utqoygir\"&gt;index: 1 stale — plan quality degrades; run 'theia index build' to refresh&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4jzwa5y3\"&gt;index: 1 stale — the map may lag this run's tree&lt;/code&gt; (in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zmmius5z\"&gt;theia show&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#missing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-trokpxka\"&gt;missing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#orphaned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xzzwq56l\"&gt;orphaned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#current\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-prtb4mz8\"&gt;current&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#dirty-marks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tiha6bi4\"&gt;dirty-marks&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#idx\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zv2fb5jy\"&gt;idx ⚠N&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#indexpolicy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-koqvs2u9\"&gt;indexPolicy&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"missing\"&gt;&lt;a href=\"en/glossary.html#missing\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s0623e5g\"&gt;missing&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A file tracked by git that has no index card yet. It counts toward &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ixtybbw\"&gt;index: N stale&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r4y6u6sm\"&gt;theia index build&lt;/code&gt; creates the card.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z6rhpjap\"&gt;missing (1):&lt;/code&gt; and the file list in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p3aw38bd\"&gt;theia index status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-23zzy3ce\"&gt;theia: 0 indexed · 1 missing&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4dk8u91n\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"orphaned\"&gt;&lt;a href=\"en/glossary.html#orphaned\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v4hmetl4\"&gt;orphaned&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A card for a file that is no longer tracked: it was deleted, renamed or removed from git. A full &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fyeuz49r\"&gt;theia index build&lt;/code&gt; deletes such cards.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1d3oax0y\"&gt;orphaned (1):&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-naarql9c\"&gt;theia index status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tm7tmacz\"&gt;pruned N orphaned entries (files left the tree)&lt;/code&gt; after &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uvzmd0i1\"&gt;theia index build&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-57qsnyte\"&gt;stale&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"current\"&gt;&lt;a href=\"en/glossary.html#current\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y6260uht\"&gt;current&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;An up-to-date card: the file has not changed since the card was written. Such a file costs nothing during an index build.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tbas60oo\"&gt;entries: 4 (3 current)&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d4m0xhab\"&gt;theia index status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dzkmo8i3\"&gt;index: 0 written, 1 current, 0 failed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g30tu121\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dirty-marks\"&gt;&lt;a href=\"en/glossary.html#dirty-marks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qvqdhxqs\"&gt;dirty-marks&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Marks left by the post-commit git hook: which files changed since the last index build. The hook from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8l4qurjw\"&gt;theia hooks install git&lt;/code&gt; writes them. They are only a hint: the fingerprint comparison is the truth about freshness. The marks live in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xqkxh263\"&gt;.theia/index/dirty-paths&lt;/code&gt; and are cleared after a clean full build.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ywd0w5jn\"&gt;dirty-marks: 2 paths since last build (post-commit hook)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-99yq8dzq\"&gt;theia: … · 2 marked dirty&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xgxljxt3\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"en/integrations/git.html\"&gt;Git&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"search-generation\"&gt;&lt;a href=\"en/glossary.html#search-generation\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;search generation&lt;/span&gt;&lt;/a&gt;search generation&lt;/h3&gt;\n&lt;p&gt;A search generation is a published snapshot of search files: a word index and, when embeddings work, a vector index. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k9arhj6f\"&gt;theia index reindex&lt;/code&gt; builds it from index cards, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qrc7w2hg\"&gt;theia mem reindex&lt;/code&gt; from memory. Search reads the latest published generation, so new cards are not visible until a new one is built. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5a88gzqw\"&gt;lexical-only&lt;/code&gt; is a generation without vectors. Cleanup deletes old generations (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-77rgmu7k\"&gt;orphan generations GCed&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yh7bhabw\"&gt;generation 2akdqci45k223ouugqzblp: 0 entries, published=true (embeddings: local/all-MiniLM-L6-v2/384)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jo0bksex\"&gt;head 6m old&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#embeddings\"&gt;embeddings&lt;/a&gt;, &lt;a href=\"en/glossary.html#head\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tp1v769c\"&gt;head&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"en/glossary.html#maintenance\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gik2x16h\"&gt;maintenance&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"head\"&gt;&lt;a href=\"en/glossary.html#head\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9q6l1st4\"&gt;head&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The word &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i0hzguhs\"&gt;head&lt;/code&gt; means different things:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z2p9rvqu\"&gt;head 6m old&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hbg3wutt\"&gt;theia index status&lt;/code&gt; — the age of the published search generation;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rsu3t1wf\"&gt;[@ event 22/22 · head]&lt;/code&gt; in the TUI — you are looking at the latest log event;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dnl9jokn\"&gt;HEAD&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3reho4lx\"&gt;base HEAD (no origin remote)&lt;/code&gt; — the current git commit.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"en/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f3jpj5jd\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#base\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4r3ccqp0\"&gt;base&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"indexpolicy\"&gt;&lt;a href=\"en/glossary.html#indexpolicy\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7kz4wznf\"&gt;indexPolicy&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gbzhr0y0\"&gt;maintenance.indexPolicy&lt;/code&gt; setting in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0fy65ypm\"&gt;policy.yaml&lt;/code&gt;: how to keep the index fresh.&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5f4avijh\"&gt;alert&lt;/code&gt; (the default) — only warn at the start of a run or plan;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eu8oz47e\"&gt;auto&lt;/code&gt; — before a run or plan, in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f5ocnqnw\"&gt;theia serve&lt;/code&gt; and at agent session start, rebuild stale cards within &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v940dnu5\"&gt;indexBuildBudgetUsd&lt;/code&gt; (1 dollar). These are model calls;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-13gj0n0m\"&gt;manual&lt;/code&gt; — stay quiet and skip cleanup after a run.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xa6g95i8\"&gt;index: N stale — plan quality degrades; building (budget $1)…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zk6khwpp\"&gt;(index: stale — background build started; indexPolicy=auto)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jfbjqk22\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#maintenance\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bg6mxklw\"&gt;maintenance&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/policy.html\"&gt;policy.yaml settings&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"maintenance\"&gt;&lt;a href=\"en/glossary.html#maintenance\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qz3yz7np\"&gt;maintenance&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Cleanup after a run: memory summaries are refreshed and old search generations are deleted. No model is called. Cleanup is skipped with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ihyty5wj\"&gt;indexPolicy: manual&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-edsxcwlo\"&gt;theia mem maintain&lt;/code&gt; does the same by hand.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2cejkfe2\"&gt;maintenance: 0 summaries refreshed, 0 orphan generations GCed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5yaqnvp\"&gt;task.note [post_run_maintenance]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ilapjwpo\"&gt;maintain: 0 summaries refreshed (0 empty), 0 orphan generations GCed (0 artifacts removed)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"en/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"en/glossary.html#indexpolicy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3hecppip\"&gt;indexPolicy&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-memory\"&gt;&lt;a href=\"en/glossary.html#group-memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Memory and search&lt;/span&gt;&lt;/a&gt;Memory and search&lt;/h2&gt;\n&lt;h3 id=\"memory\"&gt;&lt;a href=\"en/glossary.html#memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;memory&lt;/span&gt;&lt;/a&gt;memory&lt;/h3&gt;\n&lt;p&gt;Memory is facts and notes about the project in the store: decisions, constraints, agreements. There are two kinds of records: facts (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-svk67vf3\"&gt;fct…&lt;/code&gt;) and text chunks (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nl1zrzpu\"&gt;chk…&lt;/code&gt;). Nothing is overwritten: a new fact replaces an old one, and the old one stays in history. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t05s0l51\"&gt;theia mem search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lp82yhiw\"&gt;theia ask&lt;/code&gt; and the Claude Code and Codex hooks read memory. Theia writes answers to clarifying questions to memory by itself.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b359nx5a\"&gt;added fct2akdqbd5ag223ebx7s4jf2&lt;/code&gt; after &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jo6tnl9n\"&gt;theia mem add&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x7a57jj9\"&gt;- [decision] …&lt;/code&gt; in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l4fp51ax\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt; block.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#fact\"&gt;fact&lt;/a&gt;, &lt;a href=\"en/glossary.html#chunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-foqrbgey\"&gt;chunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#supersede\"&gt;supersede&lt;/a&gt;, &lt;a href=\"en/glossary.html#scope\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j99eg4mb\"&gt;scope&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"en/guides/knowledge.html\"&gt;Code index, memory and questions&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fact\"&gt;&lt;a href=\"en/glossary.html#fact\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;fact&lt;/span&gt;&lt;/a&gt;fact&lt;/h3&gt;\n&lt;p&gt;A fact is one short statement in memory. A fact has a kind: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-etfonda3\"&gt;decision&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-alx0sjhx\"&gt;constraint&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0nx2e4pf\"&gt;commitment&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-13nlf6mv\"&gt;observation&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z52x788n\"&gt;entity&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5jkbh8ht\"&gt;preference&lt;/code&gt;. Its id starts with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-005lsuox\"&gt;fct&lt;/code&gt;. Add a fact with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kjcdnti9\"&gt;theia mem add &amp;lt;kind&amp;gt; &amp;lt;text&amp;gt;&lt;/code&gt;. In 0.2.201 secrets in a fact's text are not hidden, so do not put keys or passwords in facts.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xi0n6184\"&gt;2.0164 [lexical-scan+recency] fct2akdqbd5ag223ebx7s4jf2 we use tabs for indentation&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xowb1icm\"&gt;- [decision] …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-umnoyeol\"&gt;[sources] fct:…&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tufypyx2\"&gt;theia ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"en/glossary.html#supersede\"&gt;supersede&lt;/a&gt;, &lt;a href=\"en/glossary.html#chunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qg0q4tmd\"&gt;chunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/reference/mem.html#mem-add\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eblronm8\"&gt;theia mem add&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"chunk\"&gt;&lt;a href=\"en/glossary.html#chunk\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2j6eu4lt\"&gt;chunk&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A piece of text saved in memory word for word, for example a transcript tail from a hook. Its id starts with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bi0z0w5e\"&gt;chk&lt;/code&gt;. Keys, card numbers and similar secrets in it are replaced with placeholders. Add a chunk by hand with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q05mloti\"&gt;theia mem chunk \"…\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g21r9rvl\"&gt;chunk chk…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bestlmim\"&gt;- [chunk] …&lt;/code&gt; in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j6frytdb\"&gt;&amp;lt;theia-memory&amp;gt;&lt;/code&gt; block, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nsw58cz6\"&gt;chk:…&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6h3tqzwr\"&gt;theia ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"en/glossary.html#checkpoint\"&gt;checkpoint&lt;/a&gt;, &lt;a href=\"en/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ptdbboil\"&gt;masked&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"supersede\"&gt;&lt;a href=\"en/glossary.html#supersede\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;supersede&lt;/span&gt;&lt;/a&gt;supersede&lt;/h3&gt;\n&lt;p&gt;Superseding a fact: a new fact replaces an old one. The old fact disappears from normal search but stays in history and shows in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z5pcld7t\"&gt;theia mem asof&lt;/code&gt; at a moment before the replacement. It happens automatically when a new fact nearly repeats an old one, or by hand: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uvb1jngi\"&gt;theia mem supersede &amp;lt;old&amp;gt; &amp;lt;new&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pr7p1vwt\"&gt;added fct… (superseded fct…)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9fqd17jo\"&gt;superseded &amp;lt;old&amp;gt; -&amp;gt; &amp;lt;new&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#fact\"&gt;fact&lt;/a&gt;, &lt;a href=\"en/glossary.html#asof\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2mpi0nb8\"&gt;asof&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"checkpoint\"&gt;&lt;a href=\"en/glossary.html#checkpoint\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;checkpoint&lt;/span&gt;&lt;/a&gt;checkpoint&lt;/h3&gt;\n&lt;p&gt;A checkpoint is the tail of an agent transcript (up to 16 KB) that a hook saves as a memory chunk before context compaction or at the end of a session. Labels: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pfh4ctam\"&gt;compact-checkpoint&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qgi8bqrw\"&gt;session-final&lt;/code&gt;. The Claude Code &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-45uvgucg\"&gt;Stop&lt;/code&gt; hook fires after every reply, so such chunks pile up quickly.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5zf0zz4\"&gt;theia mem checkpoint&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bzcx32wy\"&gt;theia mem checkpoint --final&lt;/code&gt; in hook settings.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"en/glossary.html#chunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yynb102d\"&gt;chunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#fail-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-id2s5hfj\"&gt;fail-open&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"scope\"&gt;&lt;a href=\"en/glossary.html#scope\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eivoj4ru\"&gt;scope&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The word &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-so0nrlcb\"&gt;scope&lt;/code&gt; means different things:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A part of memory: shared by the project (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ytbfoipl\"&gt;default&lt;/code&gt;) or one root (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eycldzit\"&gt;root:&amp;lt;name&amp;gt;&lt;/code&gt;, shown as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e2agurr0\"&gt;{root:web}&lt;/code&gt;). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w92rd1mj\"&gt;theia diagnose&lt;/code&gt; writes its results to the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zulrev8k\"&gt;diagnostics&lt;/code&gt; part.&lt;/li&gt;\n&lt;li&gt;A settings level: built-in values, user settings, project settings, root settings. The level closest to the task wins.&lt;/li&gt;\n&lt;li&gt;A chain name in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ov50l1ie\"&gt;theia audit verify&lt;/code&gt;: a run, question or plan id, plus &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o2edtih8\"&gt;index&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-caiwieoy\"&gt;plan&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"en/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"en/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"en/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"asof\"&gt;&lt;a href=\"en/glossary.html#asof\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0gl6nam4\"&gt;asof&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8w77xh5f\"&gt;theia mem asof &amp;lt;id&amp;gt; &amp;lt;query&amp;gt;&lt;/code&gt; searches memory as it was at the moment of the record with that id. It needs a Theia id (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-olbf0a0i\"&gt;fct…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-727rx7xc\"&gt;run…&lt;/code&gt; and others), not a date.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qj85b1ly\"&gt;terryid: neither a body nor a full id: '2099-01-01'&lt;/code&gt; when you pass a date.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#supersede\"&gt;supersede&lt;/a&gt;, &lt;a href=\"en/glossary.html#terryid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jbnl9ju5\"&gt;terryid&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lane\"&gt;&lt;a href=\"en/glossary.html#lane\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;lane&lt;/span&gt;&lt;/a&gt;lane&lt;/h3&gt;\n&lt;p&gt;A search method. Theia shows in square brackets which methods found a result:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x7j1b3xs\"&gt;bm25&lt;/code&gt; — word search in the search generation;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a4v4yvok\"&gt;vector&lt;/code&gt; — meaning search with embeddings;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1b8veaey\"&gt;lexical-scan&lt;/code&gt; — word search right in memory records;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7nmlsb1d\"&gt;entry-scan&lt;/code&gt; — the same over index cards when there is no generation yet;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-giivw3fs\"&gt;symbol&lt;/code&gt; — files that declare a name from the query;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kpcu7yei\"&gt;recency&lt;/code&gt; — the newest memory records, always added;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ijg98uj6\"&gt;time&lt;/code&gt; — records with a date from the query.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The number before the brackets grows with the number of methods that found the record. Because of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n0wze1zw\"&gt;recency&lt;/code&gt;, memory search almost always finds something.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-78rm6pe2\"&gt;2.0164 [lexical-scan+recency] fct… …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zc1l2emx\"&gt;1.0164 [entry-scan] src/calc.ts [domain/billing/8]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z3bzad4s\"&gt;theia: vector lane off — &amp;lt;reason&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#embeddings\"&gt;embeddings&lt;/a&gt;, &lt;a href=\"en/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"en/glossary.html#memory\"&gt;memory&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"embeddings\"&gt;&lt;a href=\"en/glossary.html#embeddings\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;embeddings&lt;/span&gt;&lt;/a&gt;embeddings&lt;/h3&gt;\n&lt;p&gt;Embeddings (numeric meaning vectors) power meaning-based search. By default a local model &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zsc4zvfk\"&gt;all-MiniLM-L6-v2&lt;/code&gt; of about 23 MB computes them: it is free and works offline, but it downloads on first use. The other option is the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vhq866u0\"&gt;openai&lt;/code&gt; provider: it needs an OpenAI key (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w5d2pd6k\"&gt;OPENAI_API_KEY&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rs5ukcdf\"&gt;theia setup --openai-key&lt;/code&gt;) and costs money. Runs do not need embeddings.&lt;/p&gt;\n&lt;p&gt;Vectors from one model are not searched with another. After a model change Theia prints &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4sspl2ug\"&gt;vector lane off&lt;/code&gt; and searches by words only until you rebuild search.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u5xzsl2j\"&gt;embeddings         : local/all-MiniLM-L6-v2 (384d) — not fetched (~23 MB; …)&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hz0sh974\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-so2u3g8h\"&gt;theia: vector lane off — …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#autodownload\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5ezeok7\"&gt;autoDownload&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"en/glossary.html#search-generation\"&gt;search generation&lt;/a&gt;, &lt;a href=\"en/config/keys.html\"&gt;Keys and access&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"autodownload\"&gt;&lt;a href=\"en/glossary.html#autodownload\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9j39iedn\"&gt;autoDownload&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-maktm5zl\"&gt;gateway.embeddings.autoDownload&lt;/code&gt; setting: whether Theia may download the local embedding model by itself. The default is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uaomahvo\"&gt;true&lt;/code&gt;. With &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmz2k0pr\"&gt;false&lt;/code&gt; and no model, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bxmt7pby\"&gt;theia doctor&lt;/code&gt; reports &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l7mg9n9k\"&gt;FAIL&lt;/code&gt;; download the model with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a3fb4t1f\"&gt;theia setup --fetch-embeddings&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ykbe2xis\"&gt;embeddings : local/all-MiniLM-L6-v2 (384d) — FAIL (not fetched and autoDownload is off — theia setup --fetch-embeddings)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#embeddings\"&gt;embeddings&lt;/a&gt;, &lt;a href=\"en/glossary.html#fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5w6c2cu3\"&gt;FAIL&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"ask\"&gt;&lt;a href=\"en/glossary.html#ask\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f61rpw8m\"&gt;ask&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qizxch2m\"&gt;theia ask \"question\"&lt;/code&gt; answers a question about the project from memory, the code index and the three latest runs. It is one model call (role &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xboi1xkm\"&gt;none&lt;/code&gt;, default limit 1 dollar), followed by a list of sources. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rzf3w3je\"&gt;ask&lt;/code&gt; answers without a model call, for free, only when nothing at all was found. File inclusion with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gbba5zau\"&gt;@&lt;/code&gt; does not work here.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-znn4ljvk\"&gt;[sources] fct:2akdqbd5ag223ebx7s4jf2  run:2akdqb2i4k223pwvesbyig&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-egffpncd\"&gt;[ask run2akdqbfumk223ofyzfk5ix — $0.0000]&lt;/code&gt;, home screen &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k0byqvqj\"&gt;· run…  ask&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"en/glossary.html#lane\"&gt;lane&lt;/a&gt;, &lt;a href=\"en/glossary.html#none\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cebaq707\"&gt;none&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4vjbktel\"&gt;probe&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/reference/ask.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5wlbm86b\"&gt;theia ask&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-context\"&gt;&lt;a href=\"en/glossary.html#theia-context\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-194grfkf\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The text block that the session-start hook (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qh6jm65c\"&gt;theia mem context&lt;/code&gt;) adds to Claude Code or Codex: the head of the blueprint and the latest memory facts. An index freshness line follows the block.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vde4qz44\"&gt;Recent project memory:&lt;/code&gt; inside the block, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i2p5q10c\"&gt;(index freshness: theia: 0 indexed · 1 missing)&lt;/code&gt; after it.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"en/glossary.html#blueprint\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9xbujcu2\"&gt;blueprint&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#theia-memory\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-he118cwj\"&gt;&amp;lt;theia-memory&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-memory\"&gt;&lt;a href=\"en/glossary.html#theia-memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ghbr8mq\"&gt;&amp;lt;theia-memory&amp;gt;&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The block that the prompt-submit hook (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sq7co9e1\"&gt;theia mem recall&lt;/code&gt;) adds to your message in Claude Code or Codex: memory records similar to the request. If nothing is found or the message is shorter than 8 characters, there is no block.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"en/glossary.html#memory\"&gt;memory&lt;/a&gt;, &lt;a href=\"en/glossary.html#theia-context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-abmapvfo\"&gt;&amp;lt;theia-context&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fail-open\"&gt;&lt;a href=\"en/glossary.html#fail-open\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y5zplvr0\"&gt;fail-open&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;An error in a hook does not break the agent session: Theia writes it to standard error and ends the hook with code 0. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-or40ddzi\"&gt;theia mem context&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2fh4bwv0\"&gt;theia mem recall&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s43ihpn2\"&gt;theia mem checkpoint&lt;/code&gt; work this way.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ecuyg34q\"&gt;theia mem recall (fail-open): &amp;lt;message&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"en/glossary.html#checkpoint\"&gt;checkpoint&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-settings\"&gt;&lt;a href=\"en/glossary.html#group-settings\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Settings and models&lt;/span&gt;&lt;/a&gt;Settings and models&lt;/h2&gt;\n&lt;h3 id=\"policy\"&gt;&lt;a href=\"en/glossary.html#policy\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;,&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jkfe45c5\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b3omyhjo\"&gt;policy.yaml&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The policy is the main project settings file: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qposf63u\"&gt;.theia/config/policy.yaml&lt;/code&gt;, a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g2scbws6\"&gt;kind: Policy&lt;/code&gt; manifest. Sections: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r1jk9nz2\"&gt;run&lt;/code&gt; (runs and limits), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yrq5xsok\"&gt;gateway&lt;/code&gt; (routing, models, embeddings), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5pn2tdlb\"&gt;ui&lt;/code&gt; (default view), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s28e3smg\"&gt;maintenance&lt;/code&gt; (index freshness), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-428c53bf\"&gt;memory&lt;/code&gt; (memory search). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-he5x7hm3\"&gt;theia init&lt;/code&gt; writes the file only if it does not exist, and running &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mqidsn4z\"&gt;theia init&lt;/code&gt; again does not change it.&lt;/p&gt;\n&lt;p&gt;Validation is strict: a typo in a key stops every command with a message like &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ozy6d5z8\"&gt;config: policy.yaml: invalid manifest (spec.run: unrecognized_keys)&lt;/code&gt;. The message names the section but not the key. Settings from different files merge one level deep: a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rydwfieh\"&gt;gateway.routing&lt;/code&gt; map from a closer file replaces the whole map.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"en/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-69a262s1\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/policy.html\"&gt;policy.yaml settings&lt;/a&gt;, &lt;a href=\"en/config/overview.html\"&gt;Settings files&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"manifest\"&gt;&lt;a href=\"en/glossary.html#manifest\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;manifest&lt;/span&gt;&lt;/a&gt;manifest&lt;/h3&gt;\n&lt;p&gt;A manifest is a Theia YAML settings file with the fields &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-awoe49lu\"&gt;apiVersion: theia.dev/v1alpha1&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gaq5b2oo\"&gt;kind&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xi0kr1me\"&gt;metadata&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1gi0uynt\"&gt;spec&lt;/code&gt;. Kinds: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l70aeenh\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2fhv083n\"&gt;TransportRegistry&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ue1jweh\"&gt;Workspace&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ha13x4ku\"&gt;Context&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rqsqwtix\"&gt;Pricing&lt;/code&gt;. Manifests live in the project's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ec5g1kgz\"&gt;.theia/config/&lt;/code&gt;. The user settings folder (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o0our0ux\"&gt;config/&lt;/code&gt;) accepts only &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xt20us98\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e8zaact3\"&gt;Pricing&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-57327fhr\"&gt;TransportRegistry&lt;/code&gt;. Theia reads &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p7dg4fp5\"&gt;.yaml&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zhb9kgvl\"&gt;.yml&lt;/code&gt; files in alphabetical order.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#policy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oc1qpzer\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-forue77i\"&gt;policy.yaml&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-djiy5p5i\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m2g8sbtr\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yk7lwmow\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#pricing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dkvheql1\"&gt;kind: Pricing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/overview.html\"&gt;Settings files&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"transport-registry\"&gt;&lt;a href=\"en/glossary.html#transport-registry\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3bduyxs\"&gt;TransportRegistry&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The list of transports allowed for use: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5qdgunzt\"&gt;.theia/config/registry.yaml&lt;/code&gt;. A route to a transport that is not in the list fails. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3y154eco\"&gt;fake&lt;/code&gt; transport is always allowed. Each row has the fields &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2dt9v3k6\"&gt;name&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qvtn8h9w\"&gt;provider&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qj0xsxxl\"&gt;dataClasses&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xindz9xn\"&gt;owner&lt;/code&gt;; in 0.2.201 only &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2w70cxrq\"&gt;name&lt;/code&gt; affects anything. The default list does not include the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bo0hodro\"&gt;codex-full&lt;/code&gt; transport.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zbmoxc6s\"&gt;gateway fatal: gateway: transport 'nope' is not manifest-registered (docs/11 §6)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"en/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h3ivw4q0\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"en/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway\"&gt;&lt;a href=\"en/glossary.html#gateway\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;gateway&lt;/span&gt;&lt;/a&gt;gateway&lt;/h3&gt;\n&lt;p&gt;The gateway is the single door that every model request goes through. It checks the text for secrets, picks the transport by routing, watches the budget, retries a request after a temporary error, fixes the price and logs the call.&lt;/p&gt;\n&lt;p&gt;Where you see it: the line &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lau0ipgk\"&gt;gateway       &amp;lt;role&amp;gt;@&amp;lt;transport&amp;gt; → ok $0.0000&lt;/code&gt;, the summary &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5475t1xi\"&gt;N gateway calls&lt;/code&gt;, the error &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9zuu7biv\"&gt;gateway: no route for role '…' (set gateway.routing)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#gateway-call\"&gt;gateway call&lt;/a&gt;, &lt;a href=\"en/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-84li62ov\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"en/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"en/glossary.html#budget\"&gt;budget&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-routing\"&gt;&lt;a href=\"en/glossary.html#gateway-routing\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-95jpcwn4\"&gt;gateway.routing&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Routing: which transport each role uses. It is a map in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x2c9vci5\"&gt;policy.yaml&lt;/code&gt;; the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0qtm579k\"&gt;\"*\"&lt;/code&gt; line applies to every role without its own line. Without a line, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4edk3b7x\"&gt;fresh_implementer&lt;/code&gt; uses the same transport as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h40awxo1\"&gt;implementer&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mt09fyni\"&gt;theia init --harness claude&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xclvekpz\"&gt;--harness codex&lt;/code&gt; writes a ready map. Theia silently ignores a typo in a role name.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3u3946wl\"&gt;initialized …/.theia (harness: codex — switch any time: gateway.routing in .theia/config/policy.yaml)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kms4tndc\"&gt;gateway: no route for role 'reviewer' (set gateway.routing)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"en/glossary.html#gateway-models\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1cbkxlwq\"&gt;gateway.models&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#role\"&gt;role&lt;/a&gt;, &lt;a href=\"en/config/models.html\"&gt;Models for tasks&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-models\"&gt;&lt;a href=\"en/glossary.html#gateway-models\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uccd63uc\"&gt;gateway.models&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The model for a role: a \"role → model id\" map in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ls9g4z7\"&gt;policy.yaml&lt;/code&gt;. Theia passes the model to the harness (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fmcycm56\"&gt;--model&lt;/code&gt; for Claude Code, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ud2lb2lh\"&gt;-m&lt;/code&gt; for Codex) and does not check the name: a wrong name fails inside the harness. Without a line for the role, the transport's default model works.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pfnf1i6j\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"en/config/models.html\"&gt;Models for tasks&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"transport\"&gt;&lt;a href=\"en/glossary.html#transport\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;transport&lt;/span&gt;&lt;/a&gt;transport&lt;/h3&gt;\n&lt;p&gt;A transport is a named way to call a model: which harness, with which permissions and which default model. Built-in transports: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jxc955je\"&gt;codex&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hn88zhga\"&gt;codex-terra&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m4wzylvq\"&gt;codex-write&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4on69g21\"&gt;codex-jailed&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5vaysbql\"&gt;codex-full&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-atscezo5\"&gt;claude&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqkjj57d\"&gt;claude-write&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-81j617sk\"&gt;claude-index&lt;/code&gt; and the test transport &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rkkcds9g\"&gt;fake&lt;/code&gt;. For example, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ip4xmzrp\"&gt;claude-write&lt;/code&gt; can edit files, while &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g04vzq9x\"&gt;claude&lt;/code&gt; works without file-editing tools. In &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-42rm46ml\"&gt;--plain&lt;/code&gt; the transport follows &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-03082vn0\"&gt;@&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2itydt4j\"&gt;reviewer@claude&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7dxwvzge\"&gt;@blocked&lt;/code&gt; means the secret check stopped the call.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"en/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-om6l9m7j\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f2wsz603\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#blocked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0vf5vpko\"&gt;@blocked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/models.html\"&gt;Models for tasks&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"harness\"&gt;&lt;a href=\"en/glossary.html#harness\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;harness&lt;/span&gt;&lt;/a&gt;harness&lt;/h3&gt;\n&lt;p&gt;A harness is an external CLI agent that the model works through: Claude Code (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lux6uwwy\"&gt;claude&lt;/code&gt;) or Codex (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-joeoimp7\"&gt;codex&lt;/code&gt;). The harness uses the subscription you signed in to in the CLI itself; Theia does not use an Anthropic API key for Claude Code. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jvgdxa30\"&gt;theia init --harness claude&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-duwmxzoy\"&gt;--harness codex&lt;/code&gt; picks the harness family, and routing sets the details. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xbkd1hx4\"&gt;fake&lt;/code&gt; is a test harness with no model, for developers; replies like &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6g1jieur\"&gt;fake-green …&lt;/code&gt; come only from it.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xyv7c4w5\"&gt;codex subscription : …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y6ansnd0\"&gt;claude code        : …&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rb3dd6xm\"&gt;harnesses          : FAIL (…)&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c1926ao0\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#tr
