 id=\"inline-code-id-q7hygaow\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"en/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qi02fral\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;W:&lt;/strong&gt; &lt;a href=\"en/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vsx6xyd0\"&gt;Workspace&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"en/glossary.html#workspace\"&gt;workspace&lt;/a&gt; · &lt;a href=\"en/glossary.html#workspace-home\"&gt;workspace home&lt;/a&gt; · &lt;a href=\"en/glossary.html#task-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-abjiwu74\"&gt;[workspace_base]&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"en/glossary.html#workspaces-yaml\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pj7zvkut\"&gt;workspaces.yaml&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"en/glossary.html#trunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nujcm5ic\"&gt;worktree&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"en/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zy8l03rh\"&gt;worktree root&lt;/code&gt;&lt;/a&gt; · &lt;a href=\"en/glossary.html#workspace\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9bt6a29w\"&gt;ws-&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/a&gt;&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;X:&lt;/strong&gt; &lt;a href=\"en/glossary.html#x-release\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sifyh2t9\"&gt;--x-release&lt;/code&gt;&lt;/a&gt;&lt;/p&gt;\n&lt;/div&gt;&lt;/details&gt;&lt;h2 id=\"group-runs\"&gt;&lt;a href=\"en/glossary.html#group-runs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Runs and tasks&lt;/span&gt;&lt;/a&gt;Runs and tasks&lt;/h2&gt;\n&lt;h3 id=\"run\"&gt;&lt;a href=\"en/glossary.html#run\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run&lt;/span&gt;&lt;/a&gt;run&lt;/h3&gt;\n&lt;p&gt;A run is one execution of a task or a plan with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lj8ym7wx\"&gt;theia run&lt;/code&gt;. A run has a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c7qqdz9h\"&gt;run…&lt;/code&gt; id, a budget, an event log and its own git branch. At the end Theia prints a summary: each task's outcome, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cy19qdfq\"&gt;halted:&lt;/code&gt; line and the log check.&lt;/p&gt;\n&lt;p&gt;Where you see it: the line &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gas60ejy\"&gt;run run… task tsk… (fast_path)&lt;/code&gt; at the start of a run, the summary &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xvifrpna\"&gt;halted: completed · 4 gateway calls · $0.0000&lt;/code&gt;, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3tskc2vt\"&gt;recent runs:&lt;/code&gt; list on the home screen.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#run-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iswn51ik\"&gt;runId&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#task\"&gt;task&lt;/a&gt;, &lt;a href=\"en/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gbowmnc7\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"en/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"en/guides/first-task.html\"&gt;Your first task&lt;/a&gt;, &lt;a href=\"en/reference/run.html#run\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qsv88hx9\"&gt;theia run&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"task\"&gt;&lt;a href=\"en/glossary.html#task\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;task&lt;/span&gt;&lt;/a&gt;task&lt;/h3&gt;\n&lt;p&gt;A task is one unit of work inside a run. Its id starts with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h8gc2lux\"&gt;tsk&lt;/code&gt;. A run with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2m2jvgbq\"&gt;--task&lt;/code&gt; creates one task; a run from a plan creates one task per plan item. On the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h8xkg670\"&gt;full_spec&lt;/code&gt; track the planner may split a task into subtasks. Each task has its own phase, rounds, repository copy and outcome: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-40d0b3ik\"&gt;merged&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u9pplrsg\"&gt;discarded&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hnhmgece\"&gt;task.created  xk6rzynf [fast_path] …&lt;/code&gt;, the summary &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hmpxr9ng\"&gt;tsk… → discarded (6 rounds) …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zcgued9y\"&gt;tsk…xk6rzynf&lt;/code&gt; rows on the board and in the TUI.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#brief\"&gt;brief&lt;/a&gt;, &lt;a href=\"en/glossary.html#phase\"&gt;phase&lt;/a&gt;, &lt;a href=\"en/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"en/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"en/glossary.html#short-id\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z4jox9sy\"&gt;tsk…xk6rzynf&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"brief\"&gt;&lt;a href=\"en/glossary.html#brief\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;brief&lt;/span&gt;&lt;/a&gt;brief&lt;/h3&gt;\n&lt;p&gt;The brief is the task text you pass with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gnxt8llh\"&gt;--task&lt;/code&gt; or on standard input: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q659lqc7\"&gt;echo \"…\" | theia run&lt;/code&gt;. You can include a file in it with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x1e8sx9y\"&gt;@&lt;/code&gt;. Theia stores the text as is, even if the model call is blocked later. Do not put keys or passwords in it.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3krookx1\"&gt;theia run --task \"…\"&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s30nvi4e\"&gt;theia plan --task \"…\"&lt;/code&gt;, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fxg2rden\"&gt;task.created&lt;/code&gt; line in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-waqzaekg\"&gt;--plain&lt;/code&gt;, the task text row in the TUI tree.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ej10hix\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#task\"&gt;task&lt;/a&gt;, &lt;a href=\"en/glossary.html#data-class\"&gt;data class&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"file-inclusion\"&gt;&lt;a href=\"en/glossary.html#file-inclusion\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vjf73ocu\"&gt;@path&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Including a file with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-91bcnzuq\"&gt;@&lt;/code&gt;. Theia replaces &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mdbrtgzf\"&gt;@path&lt;/code&gt; in a brief with the file name and appends the file content to the text as a block with the header &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5gj8oaqe\"&gt;--- file: &amp;lt;path&amp;gt; (sha256 …, N chars) ---&lt;/code&gt;. It works in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ymj9cw2x\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5vibrhhr\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7d3zaxnk\"&gt;msg&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ejih4opw\"&gt;probe&lt;/code&gt;, but not in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r2ppvsl1\"&gt;ask&lt;/code&gt;. The path is relative to the current folder. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-43tpvw0d\"&gt;@@&lt;/code&gt; gives a literal &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5x2pn50f\"&gt;@&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Paths that start with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zrr7i8kk\"&gt;/&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d3i5pvhu\"&gt;./&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7yekdhn\"&gt;../&lt;/code&gt; are not included: the word stays in the text and there is no error. A file with a secret, such as a private key, is refused: the command stops with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hu7ao9x3\"&gt;prohibited content&lt;/code&gt;. Email addresses in the file become &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-es78fvm5\"&gt;[EMAIL]&lt;/code&gt;, and the block header shows &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9g9380zb\"&gt;masked email×1&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: the header &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hwl3vk9y\"&gt;--- file: README.md (sha256 bc70e26f40b8, 7 chars) ---&lt;/code&gt;, the error &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9s2uxtx5\"&gt;run: @file: no such file 'nope.md' (…)&lt;/code&gt;, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vynzxjxb\"&gt;task.note [file_ref]&lt;/code&gt; event.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#brief\"&gt;brief&lt;/a&gt;, &lt;a href=\"en/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"en/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ewz7q1j\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/reference/commands.html#argument-rules\"&gt;Argument rules&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"track\"&gt;&lt;a href=\"en/glossary.html#track\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;track&lt;/span&gt;&lt;/a&gt;track&lt;/h3&gt;\n&lt;p&gt;The track decides where a task starts. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6swysipa\"&gt;fast_path&lt;/code&gt; (the short track) hands the task straight to the implementer. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iz5h3fkg\"&gt;full_spec&lt;/code&gt; (the full-spec track) runs the planner first. Set it with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qhtx1tgm\"&gt;--track&lt;/code&gt;; the default is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-icpzjfij\"&gt;fast_path&lt;/code&gt;. Plan approval exists only in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3rz4wql\"&gt;theia plan&lt;/code&gt; → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vffn34r7\"&gt;theia run --from-plan&lt;/code&gt; flow: a run with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tb48zsdo\"&gt;--track full_spec&lt;/code&gt; does not wait for approval.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xkmaul83\"&gt;run.created … track=fast_path&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mczoszhn\"&gt;task.created … [full_spec] …&lt;/code&gt;, the TUI task row &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ae1f9fy\"&gt;tsk…x [fast_path]&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#fast-path\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t857ms5a\"&gt;fast_path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ea9xuf6a\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ll6999ol\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#track-override\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6wtkvbj7\"&gt;track override&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fast-path\"&gt;&lt;a href=\"en/glossary.html#fast-path\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hf2i655b\"&gt;fast_path&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The short track: the task goes straight to the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2w1ske0r\"&gt;implement&lt;/code&gt; phase, with no planner. It is the default track. It suits small changes.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eqb86egi\"&gt;--track fast_path&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dfqkpzgt\"&gt;task.phase … ready → implement&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s67fw6ol\"&gt;[fast_path]&lt;/code&gt; in task lines.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"en/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tmistiu1\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-26n0ysne\"&gt;implement&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"full-spec\"&gt;&lt;a href=\"en/glossary.html#full-spec\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-puih8onx\"&gt;full_spec&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The full-spec track: the task starts in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4u0yi03w\"&gt;plan&lt;/code&gt; phase. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t2f11rx5\"&gt;planner&lt;/code&gt; thinks the work through and may split it into subtasks; then the implementer works. The first line of such a task is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-09d9ogn5\"&gt;task.phase … start → plan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qzfg94mx\"&gt;--track full_spec&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q6qw8rd9\"&gt;[full_spec]&lt;/code&gt; in task lines, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-neg6k63b\"&gt;r1 plan  planner → ready&lt;/code&gt; in the TUI.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"en/glossary.html#planner\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mz9868rc\"&gt;planner&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1jiv68xn\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g2v2wuvk\"&gt;planned&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"round\"&gt;&lt;a href=\"en/glossary.html#round\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;round&lt;/span&gt;&lt;/a&gt;round&lt;/h3&gt;\n&lt;p&gt;A round is one step of a task: one role worked and gave a verdict. The TUI numbers rounds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4iuei4ps\"&gt;r1&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mk92oild\"&gt;r2&lt;/code&gt;…; the run summary shows &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ebzet2eq\"&gt;(6 rounds)&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cf2e0gq0\"&gt;rounds=N&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-769awxyq\"&gt;run.finished&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7kyxvs4a\"&gt;run.paused&lt;/code&gt; lines is the total number of verdicts over all tasks of the run.&lt;/p&gt;\n&lt;p&gt;The limit is 10 rounds per task: the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0gfa0ga3\"&gt;run.maxRoundsPerTask&lt;/code&gt; setting or the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hpk2let2\"&gt;--max-rounds&lt;/code&gt; flag, where &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-okv3zrtp\"&gt;0&lt;/code&gt; removes the limit. When the limit is used up, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bn0hzhsr\"&gt;round_budget&lt;/code&gt; anomaly appears and the task goes to the lead. A rescope resets the limit counter, but round numbers in the output keep growing.&lt;/p&gt;\n&lt;p&gt;Where you see it: TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1eczt0vo\"&gt;r4 merge  merger → merge_fail&lt;/code&gt;, board &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zif7u5rz\"&gt;r6&lt;/code&gt;, summary &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ks5ljue\"&gt;tsk… → discarded (6 rounds)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-14u6p02r\"&gt;run.finished  halted=completed rounds=6&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#verdict\"&gt;verdict&lt;/a&gt;, &lt;a href=\"en/glossary.html#round-budget\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x887ci4w\"&gt;round_budget&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#rescope\"&gt;rescope&lt;/a&gt;, &lt;a href=\"en/glossary.html#phase\"&gt;phase&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"event-log\"&gt;&lt;a href=\"en/glossary.html#event-log\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;event log&lt;/span&gt;&lt;/a&gt;event log&lt;/h3&gt;\n&lt;p&gt;The event log is the list of everything that happened in a run: tasks created, phase changes, verdicts, model calls, anomalies, steering notes. It lives in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rgho4vuk\"&gt;.theia/store.db&lt;/code&gt;. Each event stores a fingerprint of the previous one, so tampering shows. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2b69tsox\"&gt;--plain&lt;/code&gt; prints the log one line per event, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fq80eswa\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt; shows it after the run.&lt;/p&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ej7rm9yn\"&gt;live&lt;/code&gt; lines are not stored in the log. To save the full output with details to a file, set the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hoxzj41z\"&gt;THEIA_LOG_FILE&lt;/code&gt; variable.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ih2fv9ss\"&gt;--plain&lt;/code&gt; lines such as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yymh2tst\"&gt;x5dhtxgs task.note     [workspace_base]&lt;/code&gt;, the commands &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hkxv5qql\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x51bs5f3\"&gt;theia replay&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jcph0s0j\"&gt;theia audit verify&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"en/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1691fxve\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qg0i184h\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#theia-log-file\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j7ncnecq\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yhafzafs\"&gt;replay&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"note\"&gt;&lt;a href=\"en/glossary.html#note\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;note&lt;/span&gt;&lt;/a&gt;note&lt;/h3&gt;\n&lt;p&gt;The word &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ikvpbepk\"&gt;note&lt;/code&gt; means different things in Theia:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ehbrgfwo\"&gt;task.note&lt;/code&gt; — a service note in the log; the brackets name its source, such as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6mgtxooo\"&gt;[workspace_base]&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6po9534w\"&gt;[post_run_maintenance]&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-skxpdu6i\"&gt;user.note&lt;/code&gt; — your steering or your answers to questions: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-psw5uspv\"&gt;user.note [msg] …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y8ku7gtn\"&gt;user.note [clarify] …&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;Text in quotes “…” after a verdict — the role's short comment.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ea65lriw\"&gt;note:&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qi9lifd9\"&gt;theia plan show&lt;/code&gt; — your request for plan changes.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kkkx6r5e\"&gt;noted — …&lt;/code&gt; — the reply of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c6swayra\"&gt;theia msg&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2nnfkzd5\"&gt;note &amp;lt;source&amp;gt;&lt;/code&gt; — a service note row in the TUI tree.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#task-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ux1x3tsj\"&gt;task.note&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#user-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ax0z030y\"&gt;user.note&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"en/glossary.html#verdict\"&gt;verdict&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"live\"&gt;&lt;a href=\"en/glossary.html#live\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8h640aqu\"&gt;live&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The word &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ondubhl\"&gt;live&lt;/code&gt; means different things in Theia:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t8jwi0fo\"&gt;live&lt;/code&gt; lines in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-odmfwuw1\"&gt;--plain&lt;/code&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f3dtac4h\"&gt;live ⏱ implementer tsk…6rzynf call started&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1rpf2uqi\"&gt;live ↻ … retry …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ejm0s142\"&gt;live $ …&lt;/code&gt;. They are progress hints. They are not written to the log, so &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ebg622qz\"&gt;theia show --plain&lt;/code&gt; does not show them.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-17v0x6uo\"&gt;[@ event 21/21 · live]&lt;/code&gt; in the TUI header — the screen follows a running run.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d3fhc99y\"&gt;(live; …)&lt;/code&gt; in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9z8wxr10\"&gt;resuming run …&lt;/code&gt; line — the log has neither an end nor a pause: the run was interrupted without a pause.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-whq60qn8\"&gt;N live&lt;/code&gt; in the status line and on the home screen — the number of runs with no end or pause record. Killed runs count too.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"en/glossary.html#seek\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1db60ceh\"&gt;[@ event k/N]&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#resume\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h8rbwama\"&gt;--resume&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#statusline\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vlb3cmpc\"&gt;statusLine&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vjffdte5\"&gt;in flight&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"sigma\"&gt;&lt;a href=\"en/glossary.html#sigma\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1zyk7444\"&gt;sigma&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Σ (sigma) is the run's shared notes that Theia passes to roles in every request: your steering, answers to clarifying questions, the lead's direction after a rescope. Theia rebuilds them from the event log. Every model call starts fresh; from earlier rounds a role gets these notes, the reviewer's objections and the check result.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gzpc9gfe\"&gt;sigma: {}&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aeyic2gs\"&gt;theia replay&lt;/code&gt; output, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-65fypk9i\"&gt;sigma         keys: …&lt;/code&gt; line in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8s0ezx9u\"&gt;--plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ub35miv1\"&gt;sessions: sigma-shared&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"en/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-owx54gab\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mpwupzci\"&gt;replay&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#session\"&gt;session&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"session\"&gt;&lt;a href=\"en/glossary.html#session\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;session&lt;/span&gt;&lt;/a&gt;session&lt;/h3&gt;\n&lt;p&gt;The word &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ap0e1xm3\"&gt;session&lt;/code&gt; means different things in Theia:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A harness session — a chat inside Claude Code or Codex. Theia keeps only its number (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d3e3zgfx\"&gt;sessionId&lt;/code&gt;) in the call details.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-89yhd8hf\"&gt;--sessions&lt;/code&gt; and the line &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-04ha11o5\"&gt;sessions: sigma-shared&lt;/code&gt; — an experimental mode: the shared part of a prompt goes first, and Theia records its fingerprint (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3z07vpw\"&gt;task.note [session_prefix]&lt;/code&gt;). It does not continue a chat. It is off by default (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-58vt5xcb\"&gt;run.sessionContinuity: off&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7e4q37ky\"&gt;SessionStart&lt;/code&gt; — the Claude Code and Codex hook event where Theia adds context (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-adz5pyg4\"&gt;theia mem context&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kt0amsgt\"&gt;compact-checkpoint&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rhefuso0\"&gt;session-final&lt;/code&gt; — labels of transcript pieces that hooks save.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#harness\"&gt;harness&lt;/a&gt;, &lt;a href=\"en/glossary.html#sigma\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-13syunwr\"&gt;sigma&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"en/glossary.html#checkpoint\"&gt;checkpoint&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"non-interactive\"&gt;&lt;a href=\"en/glossary.html#non-interactive\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xn9tziq0\"&gt;--non-interactive&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h57q43ec\"&gt;--non-interactive&lt;/code&gt; flag: the run asks nothing. The TUI screen does not open; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0nstwk9n\"&gt;--plain&lt;/code&gt; is used instead. If a role asks a clarifying question, the task freezes in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ylslbku0\"&gt;escalated&lt;/code&gt; phase instead of waiting for an answer. Use it in scripts, CI and background runs.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ptwo4jh7\"&gt;view: --tui is interactive; --non-interactive degrades to --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r1egcltm\"&gt;theia run … --non-interactive&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-usu65l5l\"&gt;theia plan --non-interactive&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x4ufuof0\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fk9pv15r\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#tui\"&gt;TUI&lt;/a&gt;, &lt;a href=\"en/tui/leave-running.html\"&gt;Leave without stopping a task&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-log-file\"&gt;&lt;a href=\"en/glossary.html#theia-log-file\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmr4oyj1\"&gt;THEIA_LOG_FILE&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;An environment variable with a file path. The run appends every &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5fysswf7\"&gt;--plain&lt;/code&gt; line with the full event data (the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pdc82o2a\"&gt;⤷ {…}&lt;/code&gt; line) and the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wzjxdhlc\"&gt;live&lt;/code&gt; lines to that file. It also works while the TUI is open, so you can watch the file from another terminal with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n4wwhmm4\"&gt;tail -f&lt;/code&gt;. In 0.2.201 very short runs, under a second, may leave the file empty.&lt;/p&gt;\n&lt;p&gt;Where you see it: the line &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3ragq3b\"&gt;# theia run run… — &amp;lt;time&amp;gt;&lt;/code&gt; at the top of the file, the error &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4rgav568\"&gt;THEIA_LOG_FILE: … — logging disabled&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"en/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rp9i792k\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/environment.html\"&gt;Environment variables&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-roles\"&gt;&lt;a href=\"en/glossary.html#group-roles\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Roles&lt;/span&gt;&lt;/a&gt;Roles&lt;/h2&gt;\n&lt;h3 id=\"role\"&gt;&lt;a href=\"en/glossary.html#role\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;role&lt;/span&gt;&lt;/a&gt;role&lt;/h3&gt;\n&lt;p&gt;A role is a kind of agent work in a run: plan, write code, check, review, merge, settle a dispute. A role is not a model. Routing (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zdodldw7\"&gt;gateway.routing&lt;/code&gt;) decides which harness and model work in each role. The output shows the roles &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0g8wzvxp\"&gt;lead&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6poouhv4\"&gt;planner&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2hbutmn2\"&gt;implementer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tdr7xsp4\"&gt;fresh_implementer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3qbkih1j\"&gt;verifier&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-66rxm8wb\"&gt;reviewer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r3aellmj\"&gt;merger&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lbjyga5h\"&gt;arbiter&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pwv6l103\"&gt;indexer&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q2b2v9tl\"&gt;none&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Two more roles exist in settings but do not show in run output: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-13gwhys8\"&gt;extractor&lt;/code&gt; writes memory summaries in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2n2o3uyr\"&gt;theia mem maintain --llm&lt;/code&gt;, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5bvcsw9\"&gt;diagnostician&lt;/code&gt; is unused in 0.2.201 — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n6mj1h79\"&gt;theia diagnose&lt;/code&gt; works without a model.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9dcezlin\"&gt;verdict … reviewer → approve&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pvm71l8r\"&gt;gateway implementer@&amp;lt;transport&amp;gt; → ok&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zmicvy32\"&gt;live ⏱ lead tsk… call started&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nvqa2r69\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#transport\"&gt;transport&lt;/a&gt;, &lt;a href=\"en/about/overview.html#roles\"&gt;Roles&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"lead\"&gt;&lt;a href=\"en/glossary.html#lead\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r3yrigc4\"&gt;lead&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zo9xz919\"&gt;lead&lt;/code&gt; is the role that decides what happens to a stuck task in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cgwvgvdi\"&gt;escalated&lt;/code&gt; phase. Its options: rescope the task with a new direction (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nfag9iel\"&gt;lead_rescope&lt;/code&gt;), accept the work (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0hq6wssv\"&gt;lead_accept&lt;/code&gt;), check it again (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3rvbcrnm\"&gt;lead_reverify&lt;/code&gt;), discard the task (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-copd13mc\"&gt;lead_discard&lt;/code&gt;) or ask you a question (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ap2e2m44\"&gt;clarify&lt;/code&gt;). The lead handles one task at a time.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mq9otwia\"&gt;verdict … lead → lead_discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-36af20wc\"&gt;gateway lead@&amp;lt;transport&amp;gt;&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0reizuni\"&gt;r6 escalated  lead → lead_discard&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mr8685nx\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#rescope\"&gt;rescope&lt;/a&gt;, &lt;a href=\"en/glossary.html#lead-accept\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gxeejssp\"&gt;lead_accept&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#lead-discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8m41ofye\"&gt;lead_discard&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h2nowrrc\"&gt;clarify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"planner\"&gt;&lt;a href=\"en/glossary.html#planner\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vgeqlh29\"&gt;planner&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uglmfil7\"&gt;planner&lt;/code&gt; is the role that thinks the work through. It works in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5sc2ys22\"&gt;plan&lt;/code&gt; phase of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r0sxm35e\"&gt;full_spec&lt;/code&gt; tasks and in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vol0tw8v\"&gt;theia plan&lt;/code&gt;. It answers &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4kk8qvy9\"&gt;planned&lt;/code&gt; with subtasks, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2rdgme8l\"&gt;ready&lt;/code&gt; (coding can start) or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ky74ri2k\"&gt;clarify&lt;/code&gt; (it needs your answer).&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6qfi3l0o\"&gt;verdict … planner → ready&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pukt9g5r\"&gt;r1 plan  planner → ready&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d6sul2l5\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e9koth4r\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#planned\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-idb77alq\"&gt;planned&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i9hlr03g\"&gt;clarify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"implementer\"&gt;&lt;a href=\"en/glossary.html#implementer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ztqh1h78\"&gt;implementer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xf2p3029\"&gt;implementer&lt;/code&gt; is the role that writes code. It works in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rssluvp8\"&gt;implement&lt;/code&gt; phase, in a separate copy of the repository. It answers &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ztbttdft\"&gt;ready&lt;/code&gt; (done), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6powi4xw\"&gt;cant_do&lt;/code&gt; (cannot do it) or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cmsfaa92\"&gt;algedonic&lt;/code&gt; (a serious problem). Theia itself makes the commits, not the model.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5fzr8pym\"&gt;verdict … implementer → ready (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tlji8v3h\"&gt;live ⏱ implementer tsk… call started&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zn087pre\"&gt;implement&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"en/glossary.html#fresh-implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xubktvsd\"&gt;fresh_implementer&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fresh-implementer\"&gt;&lt;a href=\"en/glossary.html#fresh-implementer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pgkjpzjq\"&gt;fresh_implementer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The fresh implementer is a second implementer that starts the task again. After two attempts in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xli6aulr\"&gt;implement&lt;/code&gt; phase (the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1yydzfra\"&gt;run.freshPerspectiveAfter&lt;/code&gt; setting) Theia hands the task to it and logs the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vt9ego0l\"&gt;fresh_perspective&lt;/code&gt; anomaly. It does not see the notes of earlier attempts, but it sees your steering and the reviewer's objections. Without its own line in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i03b7vud\"&gt;gateway.routing&lt;/code&gt; it uses the same transport as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gk243e83\"&gt;implementer&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zcdla5ib\"&gt;!! anomaly    fresh_perspective taskId=… dispatches=2&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n7o7ylhx\"&gt;gateway fresh_implementer@&amp;lt;transport&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vsohrblq\"&gt;implementer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#fresh-perspective\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sm0i3z40\"&gt;fresh_perspective&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3oqp2ll5\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verifier\"&gt;&lt;a href=\"en/glossary.html#verifier\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-412rmghr\"&gt;verifier&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s5guz61n\"&gt;verifier&lt;/code&gt; is the role of the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8uuzo5qc\"&gt;verify&lt;/code&gt; phase. If you passed &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u33f7uzp\"&gt;--verify&lt;/code&gt; commands, the commands do the check: Theia runs them, the exit code decides, and no model is called. Without commands a model checks the work. The verifier answers &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7wpkj877\"&gt;pass&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5otyypcj\"&gt;fail&lt;/code&gt;; the output shows the events &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rvcmsl53\"&gt;verify_pass&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ydvc91vs\"&gt;verify_fail&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k6t95exd\"&gt;verdict … verifier → verify_pass (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8pr82ur\"&gt;verifier → verify_fail (1 evidence)  “$ false → exit 1 (no output)”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2rzl00oi\"&gt;verify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rtxxnp00\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z8cgm1qx\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#stop-and-fix\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uzq79nvb\"&gt;stop_and_fix&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"reviewer\"&gt;&lt;a href=\"en/glossary.html#reviewer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5qms9305\"&gt;reviewer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jfuxpb97\"&gt;reviewer&lt;/code&gt; is the role of the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m6uncpj0\"&gt;review&lt;/code&gt; phase. It looks at the task's changes and answers &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i91y5h1x\"&gt;approve&lt;/code&gt; (accept, go to merge), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zp8uuusy\"&gt;rework&lt;/code&gt; (needs more work) or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-whc6ry4r\"&gt;discard&lt;/code&gt; (reject). After &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qr3a3u9c\"&gt;rework&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8v6wganu\"&gt;discard&lt;/code&gt; the task goes to the arbiter; it is not discarded right away.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ijdzjjrx\"&gt;verdict … reviewer → approve (1 evidence)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#review\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ta7enb7u\"&gt;review&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#approve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hz6q1neg\"&gt;approve&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#rework\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zsqx29el\"&gt;rework&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#discard\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e8l2u7ao\"&gt;discard&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"arbiter\"&gt;&lt;a href=\"en/glossary.html#arbiter\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h1mwjolo\"&gt;arbiter&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uzl114cb\"&gt;arbiter&lt;/code&gt; is the role of the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qs06qgdw\"&gt;arbitrate&lt;/code&gt; phase. It decides what to do after &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9v2uggp2\"&gt;rework&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2zr9aor9\"&gt;discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gq7oaurk\"&gt;merge_fail&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hcazs8ka\"&gt;cant_do&lt;/code&gt;: one more attempt (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i6k5wdd0\"&gt;arb_continue&lt;/code&gt;, back to the implementer) or hand the task to the lead (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0oh9kxs4\"&gt;arb_escalate&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x5vkt66u\"&gt;verdict … arbiter → arb_escalate (1 evidence)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y6hpgszm\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#arb-continue\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wt2z7lao\"&gt;arb_continue&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#arb-escalate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eucirfck\"&gt;arb_escalate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#lead\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u908i0l2\"&gt;lead&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"merger\"&gt;&lt;a href=\"en/glossary.html#merger\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xdwypnn\"&gt;merger&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6snistb8\"&gt;merger&lt;/code&gt; is the step of the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o9101k30\"&gt;merge&lt;/code&gt; phase. It is not a model: Theia itself merges the task branch into the run branch with plain git (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ochff4c1\"&gt;git merge --no-ff&lt;/code&gt;). The answer is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-11okvxa1\"&gt;merged&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wpthi51a\"&gt;merge_fail&lt;/code&gt;. Merges run one at a time.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8zu2isa9\"&gt;verdict … merger → merged (1 evidence)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z7plhfy6\"&gt;merger → merge_fail (1 evidence)  “no commits on the task branch”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-82jom8zq\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-obxr1zzo\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#merge-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y264lvop\"&gt;merge_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"en/glossary.html#precheck\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9jwab0zx\"&gt;precheck&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"indexer\"&gt;&lt;a href=\"en/glossary.html#indexer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pbgmiicm\"&gt;indexer&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7zgzd87r\"&gt;indexer&lt;/code&gt; is the role that writes code index entries: a short card for each file. It works in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f3triafg\"&gt;theia index build&lt;/code&gt; and in automatic index builds. Its calls are not part of a run.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c3ibeed7\"&gt;theia index build&lt;/code&gt;, the line &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i1n7jvca\"&gt;indexer: claude-index&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wd02jy86\"&gt;policy.yaml&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#intent-index\"&gt;intent index&lt;/a&gt;, &lt;a href=\"en/glossary.html#index-entry\"&gt;index entry&lt;/a&gt;, &lt;a href=\"en/reference/index-cmd.html#index-build\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iz0f5ieq\"&gt;theia index build&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"none\"&gt;&lt;a href=\"en/glossary.html#none\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d5avvyc0\"&gt;none&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kng46bvm\"&gt;none&lt;/code&gt; is the role of a one-off question with no task. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9qgbrxx6\"&gt;theia probe&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9gbzsh2q\"&gt;theia ask&lt;/code&gt; use it. Its route comes from the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-auobbisi\"&gt;\"*\"&lt;/code&gt; line in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qs5egofq\"&gt;gateway.routing&lt;/code&gt; unless there is a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x8wgrpm7\"&gt;none&lt;/code&gt; line.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x1c98jf9\"&gt;gateway none@&amp;lt;transport&amp;gt; → ok&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-28mqvaio\"&gt;theia show &amp;lt;id&amp;gt; --plain&lt;/code&gt; for a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iokcdtm9\"&gt;probe&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jhok9q9f\"&gt;ask&lt;/code&gt; record.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5s7z6zoa\"&gt;probe&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3vtp4ofa\"&gt;ask&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7n05dv9e\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-phases\"&gt;&lt;a href=\"en/glossary.html#group-phases\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Task phases&lt;/span&gt;&lt;/a&gt;Task phases&lt;/h2&gt;\n&lt;h3 id=\"phase\"&gt;&lt;a href=\"en/glossary.html#phase\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;phase&lt;/span&gt;&lt;/a&gt;phase&lt;/h3&gt;\n&lt;p&gt;A phase is the step a task is at now. Working phases: &lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-socm71qn\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qfvy934i\"&gt;implement&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-clpgfl02\"&gt;verify&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pbk7pvxn\"&gt;review&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k1k071uy\"&gt;merge&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8e1upuo6\"&gt;arbitrate&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83bijgcr\"&gt;escalated&lt;/code&gt;. Final phases: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ew9u64gh\"&gt;merged&lt;/code&gt; (the work landed), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s2xvu8sv\"&gt;discarded&lt;/code&gt; (dropped), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sy93kgm1\"&gt;planned&lt;/code&gt; (a plan item with subtasks). A phase change shows as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w32fdpzb\"&gt;task.phase &amp;lt;task&amp;gt; &amp;lt;event&amp;gt; → &amp;lt;phase&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uzux2oir\"&gt;task.phase    xk6rzynf ready → implement&lt;/code&gt;, the phase column on the board, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qgdd0eq2\"&gt;discarded  r6&lt;/code&gt; in the TUI task row.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#implement\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sajbk0wc\"&gt;implement&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lazrb9mb\"&gt;verify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#review\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hc67lm3k\"&gt;review&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ghnlhdyx\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#arbitrate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ljk8fp7\"&gt;arbitrate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#escalated\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tihbrf4w\"&gt;escalated&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d9fzmiac\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#discarded\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vrzpowq1\"&gt;discarded&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#task-phase\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7l6bezm3\"&gt;task.phase&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/about/overview.html#how-a-run-works\"&gt;How a run works&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"draft\"&gt;&lt;a href=\"en/glossary.html#draft\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-us1a9bfi\"&gt;draft&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The word has two meanings:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The phase of a new task. The task leaves it at once for &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2m648yte\"&gt;plan&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u00zq9nj\"&gt;implement&lt;/code&gt;, so you rarely see it.&lt;/li&gt;\n&lt;li&gt;A plan status: the plan was created or changed and is not approved yet. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a7fbse4b\"&gt;theia run --from-plan&lt;/code&gt; refuses such a plan.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qaiu6v0n\"&gt;pln… [draft] 2 tasks — …&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7enyy52b\"&gt;theia plan list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ttgamj4\"&gt;context added — NEW digest …, status draft (re-approval required)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r2jdp6a1\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#approved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y6lk8s7c\"&gt;approved&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#phase\"&gt;phase&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"implement\"&gt;&lt;a href=\"en/glossary.html#implement\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7g32o98q\"&gt;implement&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The phase where the implementer writes code in the task's repository copy. From here the task goes to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-md5dkul6\"&gt;verify&lt;/code&gt; (event &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4z8sb9gy\"&gt;ready&lt;/code&gt;), to the arbiter (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yyon3wro\"&gt;cant_do&lt;/code&gt;) or to the lead (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gy74gyn2\"&gt;algedonic&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1emzq7ei\"&gt;no_progress&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-izjdc756\"&gt;task.phase … ready → implement&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ecb5hir0\"&gt;r1 implement  implementer → ready&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#implementer\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-651kqpld\"&gt;implementer&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"en/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ztuqkkk7\"&gt;verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verify\"&gt;&lt;a href=\"en/glossary.html#verify\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1p4vbznq\"&gt;verify&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The word has several meanings:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The check phase after the implementer.&lt;/li&gt;\n&lt;li&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6jqbcheo\"&gt;--verify \"&amp;lt;command&amp;gt;\"&lt;/code&gt; flag; you can pass it several times. Theia runs the commands in order in the task copy with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ya2984a\"&gt;bash -lc&lt;/code&gt;, and the exit code decides. The commands run directly on your machine, not in a sandbox, with a 5-minute limit each. Without commands a model checks the work.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-abbctvsy\"&gt;✓ &amp;lt;command&amp;gt;&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6rukp48b\"&gt;theia plan show&lt;/code&gt; — a plan item's own check command.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gdhfoc9j\"&gt;lead_reverify&lt;/code&gt; — the lead asks for another check.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vcm6912h\"&gt;--plain&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7qlxrvli\"&gt;--cli&lt;/code&gt;, the first Ctrl+C in the terminal also kills a running check command. Theia records it as a failure: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ydx7q9kp\"&gt;verify_fail&lt;/code&gt; with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eo5v5xvf\"&gt;exit null&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2083orla\"&gt;task.phase … ready → verify&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e497c0eo\"&gt;verdict … verifier → verify_fail (1 evidence)  “$ false → exit 1 (no output)”&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#verifier\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-39fwys5t\"&gt;verifier&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#verify-pass\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-usgeskxv\"&gt;verify_pass&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#verify-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3wrjxen0\"&gt;verify_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#stop-and-fix\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabinde
