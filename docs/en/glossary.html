ansport\"&gt;transport&lt;/a&gt;, &lt;a href=\"en/glossary.html#gateway-routing\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jeslgy1u\"&gt;gateway.routing&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#harnesses\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-095lcttv\"&gt;harnesses&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/models.html\"&gt;Models for tasks&lt;/a&gt;, &lt;a href=\"en/config/keys.html\"&gt;Keys and access&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"context\"&gt;&lt;a href=\"en/glossary.html#context\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cqinlc16\"&gt;kind: Context&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A manifest with rules and reference texts that Theia adds to agent requests as text. An entry's source is a string, a file or a path pattern; it applies always, or for chosen roles, tracks or paths. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8h9f38t8\"&gt;theia init&lt;/code&gt; creates &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-npuius2o\"&gt;context-rules.yaml&lt;/code&gt; by itself when it finds rules files such as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mho8bwor\"&gt;.cursorrules&lt;/code&gt;. Write file paths relative to the project: an absolute path does not work.&lt;/p&gt;\n&lt;p&gt;If the added text is larger than &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7jc0m9od\"&gt;run.contextAlertChars&lt;/code&gt; (200,000 characters), Theia warns but loads everything. The hard limit &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kxx9oivi\"&gt;run.contextRefuseChars&lt;/code&gt; is not set by default.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9yx70zo0\"&gt;context       injected: …&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-obybaz4j\"&gt;--plain&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k3fk51us\"&gt;context injected (N entries)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4vvkhh0f\"&gt;context alert: task … injects N chars (&amp;gt; contextAlertChars=200000) — loading everything&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#ai-rules\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4wewkwmo\"&gt;ai rules&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#ctx\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-44r5v0cy\"&gt;ctx ⚠N&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"en/config/rules-prompts.html\"&gt;Rules and prompts&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"pre-task\"&gt;&lt;a href=\"en/glossary.html#pre-task\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-trg4r0ro\"&gt;pre-task&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Commands from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-54y74o0e\"&gt;run.preTask&lt;/code&gt; that Theia runs before the implementer's first step. If a required command (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2a03n9ql\"&gt;mustPass&lt;/code&gt;) fails, the task freezes before any model call and waits for the lead.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mmimx3q4\"&gt;pre-task      &amp;lt;task&amp;gt; N gate(s), M failed&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ygi7xr5c\"&gt;pre-task gates: N run, M failed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#illegal-verdict\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z8gu3bin\"&gt;illegal_verdict&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#policy\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zqdgbfs7\"&gt;Policy&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s3jg5e0s\"&gt;policy.yaml&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/policy.html\"&gt;policy.yaml settings&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-rulessot\"&gt;&lt;a href=\"en/glossary.html#run-rulessot\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pm13gxv0\"&gt;run.rulesSoT&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The \"rules only through Theia\" mode. In task copies, rules files (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1gyxq3le\"&gt;AGENTS.md&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b6h9i85v\"&gt;CLAUDE.md&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9a7jj2jr\"&gt;.cursorrules&lt;/code&gt; and others) are replaced with a stub, and Codex does not read its project files. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-auuurzju\"&gt;AGENTS.md&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7a8sksi5\"&gt;CLAUDE.md&lt;/code&gt; themselves do not reach requests then: add them with a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5upzm2o\"&gt;Context&lt;/code&gt; manifest. The mode is off by default.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#context\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-57jw2jup\"&gt;kind: Context&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#ai-rules\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-up6wdleg\"&gt;ai rules&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/rules-prompts.html\"&gt;Rules and prompts&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-security\"&gt;&lt;a href=\"en/glossary.html#group-security\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Security and sandbox&lt;/span&gt;&lt;/a&gt;Security and sandbox&lt;/h2&gt;\n&lt;h3 id=\"data-class\"&gt;&lt;a href=\"en/glossary.html#data-class\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;data class&lt;/span&gt;&lt;/a&gt;data class&lt;/h3&gt;\n&lt;p&gt;A data class says how risky it is to send text to a model. The gateway checks every request with simple patterns:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8r2xwxxj\"&gt;prohibited&lt;/code&gt; — must not be sent: private keys, API keys (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xuz8mrdx\"&gt;sk-…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2yq8zb4t\"&gt;AKIA…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x9fp4t59\"&gt;ghp_…&lt;/code&gt;), card numbers, seed phrases. The call stops.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xaexkn80\"&gt;restricted&lt;/code&gt; — may be sent only masked: email addresses become &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-otbax4i7\"&gt;[EMAIL]&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yn2bswts\"&gt;permitted&lt;/code&gt; — the text goes as is.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The patterns do not catch passwords, phone numbers, names or keys of other shapes. A brief with a secret is still stored in the store. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a731l7t4\"&gt;dataClasses&lt;/code&gt; field in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-40zvh09i\"&gt;registry.yaml&lt;/code&gt; has no effect in 0.2.201.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rodqyb26\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#blocked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qmsmz6xs\"&gt;@blocked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#gateway-maskoverrides\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-54pyooet\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kkeagup8\"&gt;@path&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/keys.html\"&gt;Keys and access&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"masked\"&gt;&lt;a href=\"en/glossary.html#masked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0z46v9yq\"&gt;masked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A masked fragment: the gateway replaced risky text with a placeholder before sending — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2a4qk2r7\"&gt;[EMAIL]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kyrgym6v\"&gt;[API KEY]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ukpr7vyj\"&gt;[CARD NUMBER]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yr0g6q7f\"&gt;[PRIVATE KEY]&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8ylanbz\"&gt;[SEED PHRASE]&lt;/code&gt;. The number of replacements shows in the call data (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dhbh9idz\"&gt;masked={\"email\":1}&lt;/code&gt;) and in the header of an included file (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sto21j0n\"&gt;masked email×1&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"en/glossary.html#blocked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5zdtdlfo\"&gt;@blocked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#file-inclusion\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e8hltlsr\"&gt;@path&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"blocked\"&gt;&lt;a href=\"en/glossary.html#blocked\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hu6qqpno\"&gt;@blocked&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The secret check stopped the call: the text contains &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8hwql57t\"&gt;prohibited&lt;/code&gt; data. In &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h1av4ku6\"&gt;--plain&lt;/code&gt; the transport is replaced by &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k6m99yzw\"&gt;blocked&lt;/code&gt;, and the verdict comment names the pattern that fired. If every role is blocked this way, the run pauses.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a9wsnqar\"&gt;gateway       implementer@blocked → fatal&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w4ogdm8g\"&gt;gateway fatal: gateway: prohibited content (api_key) — call blocked (THE-014)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"en/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8dkvquwq\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#gateway-maskoverrides\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-54dg3ma4\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gateway-maskoverrides\"&gt;&lt;a href=\"en/glossary.html#gateway-maskoverrides\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j17bi0i0\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Exceptions for secret patterns in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s0haswg1\"&gt;policy.yaml&lt;/code&gt;. For a pattern you can set &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aik25meb\"&gt;off&lt;/code&gt; (do not check), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-we0xwbbp\"&gt;restricted&lt;/code&gt; (mask but do not stop) or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p6qlfhup\"&gt;prohibited&lt;/code&gt; (stop). Pattern names: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ac0yto9c\"&gt;pem_private_key&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7e0l7e3w\"&gt;api_key&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z5rxiyna\"&gt;card_number&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1wr31se4\"&gt;seed_phrase&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-puplaol0\"&gt;email&lt;/code&gt;. Use it when a pattern is wrong on your data, for example when it takes long numbers for card numbers.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#data-class\"&gt;data class&lt;/a&gt;, &lt;a href=\"en/glossary.html#masked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a2wwha1r\"&gt;masked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/policy.html\"&gt;policy.yaml settings&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"sandbox-tier\"&gt;&lt;a href=\"en/glossary.html#sandbox-tier\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;sandbox tier&lt;/span&gt;&lt;/a&gt;sandbox tier&lt;/h3&gt;\n&lt;p&gt;The sandbox tier says how much freedom agents have on your machine. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t9i05mo0\"&gt;run.sandboxTier&lt;/code&gt; setting:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w89wwafy\"&gt;standard&lt;/code&gt; (the default) — the agent writes only in the task copy, and Theia does the git work;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vuyyxg5n\"&gt;jailed-full&lt;/code&gt; — full access inside the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jbrmj8qj\"&gt;theia jail&lt;/code&gt; sandbox; in 0.2.201 it works on Linux only;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8kznj05v\"&gt;trusted-full&lt;/code&gt; — full access to the whole machine with no sandbox. It needs a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8p33ydio\"&gt;codex-full&lt;/code&gt; transport row in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i6eiglag\"&gt;registry.yaml&lt;/code&gt;, and Theia prints a loud warning.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;In &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ntci84xq\"&gt;jailed-full&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1qr1r53u\"&gt;trusted-full&lt;/code&gt; the implementers always work through Codex.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wnix5qhe\"&gt;!! sandboxTier trusted-full: implementer agents run with FULL HOST ACCESS, unjailed (manifest-recorded opt-in)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nujxfl0r\"&gt;jailed-full tier unavailable&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-489rgc7s\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mgjv44ez\"&gt;jail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#posture\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0wryezv5\"&gt;posture&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#transport-registry\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6te0mi9f\"&gt;TransportRegistry&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/sandbox.html\"&gt;Sandbox&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"posture\"&gt;&lt;a href=\"en/glossary.html#posture\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c4msppwn\"&gt;posture&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Posture is Theia's working word for a chosen set of settings. Most often it means the sandbox tier: how much agents may change the system. The word appears in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4tcrnfm5\"&gt;theia help&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h2garufs\"&gt;seeded posture&lt;/code&gt; for &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0pjptfk1\"&gt;theia eval demo create&lt;/code&gt;) and in platform benchmark options. There is no setting with this name.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt;, &lt;a href=\"en/config/sandbox.html\"&gt;Sandbox&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"jail\"&gt;&lt;a href=\"en/glossary.html#jail\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8o7p81mb\"&gt;jail&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A sandbox for a command: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-osp4l7bk\"&gt;theia jail -- &amp;lt;command&amp;gt;&lt;/code&gt; runs the command with the system read-only, writable only in allowed folders. On Linux it works through &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3paq5wfs\"&gt;bwrap&lt;/code&gt;; there is also a container option (Docker or Podman). There is no built-in sandbox for macOS in 0.2.201.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8w41u12a\"&gt;jail: unavailable — no sandbox backend on darwin yet (…); use standard or trusted-full&lt;/code&gt;, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bxyv6ov5\"&gt;jail (none        )&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6cl9lciu\"&gt;jail (container   )&lt;/code&gt; lines in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sa1kfvxi\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#sandbox-tier\"&gt;sandbox tier&lt;/a&gt;, &lt;a href=\"en/config/sandbox.html\"&gt;Sandbox&lt;/a&gt;, &lt;a href=\"en/reference/jail.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-npgkdxdp\"&gt;theia jail&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-resources\"&gt;&lt;a href=\"en/glossary.html#run-resources\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-823m4820\"&gt;run.resources&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Memory, CPU and process-count limits for a run's commands and agents: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kk3bm7lt\"&gt;memoryMax&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8th7nz3\"&gt;cpuQuota&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dfi3tyax\"&gt;tasksMax&lt;/code&gt;. They work only on Linux through systemd. On another system a run with these limits refuses to start.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ju4amcd\"&gt;resources        : unavailable (run.resources needs linux cgroups (systemd-run); platform is darwin) — …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#jail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1idysoyn\"&gt;jail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/sandbox.html\"&gt;Sandbox&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-install\"&gt;&lt;a href=\"en/glossary.html#group-install\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Install and update&lt;/span&gt;&lt;/a&gt;Install and update&lt;/h2&gt;\n&lt;h3 id=\"pat\"&gt;&lt;a href=\"en/glossary.html#pat\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;PAT&lt;/span&gt;&lt;/a&gt;PAT&lt;/h3&gt;\n&lt;p&gt;A GitHub PAT (personal access token) is the key to Theia's private release repository. It is needed for &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kjrqhhfm\"&gt;theia self update&lt;/code&gt;, for downloading versions with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tc6lwrb1\"&gt;--x-release&lt;/code&gt; and for the daily update check. Everyday work does not need it. It is stored in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dt5sjfjg\"&gt;config.yaml&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zjtlm3d5\"&gt;github.pat&lt;/code&gt;). The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p1tw9l0t\"&gt;THEIA_GH_TOKEN&lt;/code&gt; variable wins over the file, and Theia does not read &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zzgdxwsc\"&gt;GH_TOKEN&lt;/code&gt;. Theia never prints the token value.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vnnl01md\"&gt;github pat         : present&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ykamj02n\"&gt;absent (release download/self update unavailable)&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hcv4enx4\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-50vwxx45\"&gt;self update: no GitHub PAT — theia setup --pat &amp;lt;token&amp;gt; (or THEIA_GH_TOKEN)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"en/glossary.html#update-notice\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-owrx0wc8\"&gt;is available&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"en/config/keys.html\"&gt;Keys and access&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"channel\"&gt;&lt;a href=\"en/glossary.html#channel\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;channel&lt;/span&gt;&lt;/a&gt;channel&lt;/h3&gt;\n&lt;p&gt;The release channel decides which versions &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1fgpqv08\"&gt;theia self update&lt;/code&gt; follows. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r7my255j\"&gt;release&lt;/code&gt; (the default) means regular releases. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6r8djbjt\"&gt;prerelease&lt;/code&gt; adds test builds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cp1wf5x0\"&gt;-pre.N&lt;/code&gt;, for platform developers. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s0ptt0p7\"&gt;theia setup --channel&lt;/code&gt; sets it, and it is stored in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h6443g10\"&gt;config.yaml&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hskuwma7\"&gt;update.channel&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qf917x8n\"&gt;prerelease channel (update.channel) — resolving against -pre builds too&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p42legeq\"&gt;already up to date (v0.2.201)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"en/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"en/install/update.html\"&gt;Update and pick a version&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"vendor\"&gt;&lt;a href=\"en/glossary.html#vendor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;vendor deliverables&lt;/span&gt;&lt;/a&gt;vendor deliverables&lt;/h3&gt;\n&lt;p&gt;Vendor deliverables are the set of files shipped with Theia: role prompts (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-llz1hynj\"&gt;prompts/kernel.yaml&lt;/code&gt;), rules and skills. In 0.2.201 only the prompts are used; nothing reads the shipped rules and skills. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e72a3j6w\"&gt;theia doctor&lt;/code&gt; checks the files by fingerprint, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dyi2n7yf\"&gt;theia self update&lt;/code&gt; updates them. Without these files &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pcxs0atb\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xpm60r2p\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6cwywlny\"&gt;ask&lt;/code&gt; and other model commands do not work.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gr7e2b95\"&gt;vendor deliverables: ok — 9ff60d108678 verified (21 files); matches this release&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-302n1ae1\"&gt;theia: no vendor deliverables found (…)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#doctor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3tnsx1t0\"&gt;doctor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/install/update.html\"&gt;Update and pick a version&lt;/a&gt;, &lt;a href=\"en/config/rules-prompts.html\"&gt;Rules and prompts&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"user-config\"&gt;&lt;a href=\"en/glossary.html#user-config\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;user config&lt;/span&gt;&lt;/a&gt;user config&lt;/h3&gt;\n&lt;p&gt;The personal settings file &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-odtg9bp8\"&gt;config.yaml&lt;/code&gt; in the user settings folder: the GitHub token (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xxgzbcqo\"&gt;github.pat&lt;/code&gt;), the OpenAI key (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-86fc90yg\"&gt;openai.apiKey&lt;/code&gt;), the release channel (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zqu7g8eb\"&gt;update.channel&lt;/code&gt;) and a developer path (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g3thoic0\"&gt;dev.root&lt;/code&gt;). Mode 0600: only the owner can read the file. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ne20jhf\"&gt;theia setup&lt;/code&gt; and the first-run wizard write it; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9i40hin8\"&gt;theia setup&lt;/code&gt; drops keys it does not know. The folder is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2g1lsd0s\"&gt;~/.config/theia&lt;/code&gt; on Linux. On macOS it is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n0x3udnv\"&gt;~/Library/Application Support/theia&lt;/code&gt;; if that folder does not exist but &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hjjswyrg\"&gt;~/.config/theia&lt;/code&gt; does, Theia uses &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lcs1ehu1\"&gt;~/.config/theia&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u0ianp7s\"&gt;user config        : present&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lol267gq\"&gt;absent (&amp;lt;path&amp;gt; — theia setup)&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7g77j65r\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2i3pnlkz\"&gt;wrote github.pat to &amp;lt;path&amp;gt; (mode 0600)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"en/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"en/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"en/config/overview.html\"&gt;Settings files&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"setup-wizard\"&gt;&lt;a href=\"en/glossary.html#setup-wizard\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;setup wizard&lt;/span&gt;&lt;/a&gt;setup wizard&lt;/h3&gt;\n&lt;p&gt;The first-run setup wizard. It opens instead of the home screen when you run &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-opfdlxhd\"&gt;theia&lt;/code&gt; with no command in a terminal and there are no personal settings or no store yet. It asks for the GitHub token and the OpenAI key (you can skip them), offers to create a store in the current folder, choose a harness and add other roots. Unlike &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0jk4xsgp\"&gt;theia init&lt;/code&gt;, the wizard always creates &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-otytcy7q\"&gt;.theia&lt;/code&gt; in the current folder, even in a repository subfolder.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ogcy5k5\"&gt;theia setup — Enter accepts the default, empty answers skip.&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ous7ojs\"&gt;initialize a theia workspace in …? [Y/n]&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-igabx1p8\"&gt;done — try: theia doctor, then theia run --task \"…\"&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;, &lt;a href=\"en/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"en/glossary.html#user-config\"&gt;user config&lt;/a&gt;, &lt;a href=\"en/install/first-setup.html\"&gt;First setup&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"update-notice\"&gt;&lt;a href=\"en/glossary.html#update-notice\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tsec1ykb\"&gt;is available&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A dim line about a new version: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-54ow9cxu\"&gt;theia v&amp;lt;new&amp;gt; is available (running v&amp;lt;yours&amp;gt;) — theia self update&lt;/code&gt;. Theia checks for updates at most once a day, only with a GitHub token, and for at most 1.5 seconds. The check stays silent on any error. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jl21hypp\"&gt;theia version&lt;/code&gt; does not run the check.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"en/glossary.html#channel\"&gt;channel&lt;/a&gt;, &lt;a href=\"en/install/update.html\"&gt;Update and pick a version&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"x-release\"&gt;&lt;a href=\"en/glossary.html#x-release\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6f11lqet\"&gt;--x-release&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The global flag &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ty2s58ae\"&gt;--x-release &amp;lt;version&amp;gt;&lt;/code&gt; (or the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e77ayo0x\"&gt;THEIA_X_RELEASE&lt;/code&gt; variable) runs the command with another Theia version from the cache, downloading it if needed. If the version cannot be obtained, the command fails instead of running the current version. A wrong &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-876ikyvj\"&gt;THEIA_X_RELEASE&lt;/code&gt; value breaks every command, even &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8j6qwfza\"&gt;theia version&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#pat\"&gt;PAT&lt;/a&gt;, &lt;a href=\"en/install/update.html\"&gt;Update and pick a version&lt;/a&gt;, &lt;a href=\"en/reference/commands.html#global-flags\"&gt;Global flags&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dev\"&gt;&lt;a href=\"en/glossary.html#dev\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1psf4lpp\"&gt;--dev&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A flag for platform developers: run Theia from a source tree, at the path after the flag or at &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8bgz5l8h\"&gt;dev.root&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8hsz7noy\"&gt;~/.config/theia/config.yaml&lt;/code&gt;. An installed version has no source tree, so the flag stops the command with code 1 and prints &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5s931ltd\"&gt;--dev: no development root — pass a path (theia --dev &amp;lt;path&amp;gt; …) or set dev.root in ~/.config/theia/config.yaml (theia setup --dev-root &amp;lt;path&amp;gt;)&lt;/code&gt;. It does not print the help. With a foreign path the answer differs: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6g6z1qo1\"&gt;--dev: &amp;lt;path&amp;gt; does not look like a theia dev tree (missing apps/theia/src/main.ts)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#x-release\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h0rnsrx3\"&gt;--x-release&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/install/update.html#for-developers\"&gt;For platform developers&lt;/a&gt;, &lt;a href=\"en/reference/commands.html#global-flags\"&gt;Global flags&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-integrations\"&gt;&lt;a href=\"en/glossary.html#group-integrations\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Integrations&lt;/span&gt;&lt;/a&gt;Integrations&lt;/h2&gt;\n&lt;h3 id=\"hooks\"&gt;&lt;a href=\"en/glossary.html#hooks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;hooks&lt;/span&gt;&lt;/a&gt;hooks&lt;/h3&gt;\n&lt;p&gt;Hooks are short commands that Claude Code, Codex or git run by themselves on events. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bqzmwh3l\"&gt;theia hooks install&lt;/code&gt; sets them up:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z4etzpnv\"&gt;claude&lt;/code&gt; — hooks for session start (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6mp9tkzr\"&gt;theia mem context&lt;/code&gt;), message submit (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s3d9rci5\"&gt;theia mem recall&lt;/code&gt;), context compaction and stop (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yj4kxqw4\"&gt;theia mem checkpoint&lt;/code&gt;), a status line, the MCP server in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pbhbfxn7\"&gt;.mcp.json&lt;/code&gt; and the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rlq69hm6\"&gt;/theia&lt;/code&gt; skill;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-612pi67m\"&gt;codex&lt;/code&gt; — the same memory hooks in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n60gj7tu\"&gt;.codex/hooks.json&lt;/code&gt; and the MCP server;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gjx9vjmq\"&gt;git&lt;/code&gt; — a post-commit hook that leaves marks for the index.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;There is no uninstall command; remove hooks by hand. Hooks call Theia by the full path of the installed version, so after an update they keep running the old version.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3e5q4c64\"&gt;installed post-commit dirty-marks hook → …/.git/hooks/post-commit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yehd1lkd\"&gt;statusline wired: theia index status --brief&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-olajb4u9\"&gt;mcp server registered: theia serve → …/.mcp.json (control tools included)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"en/glossary.html#skill\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sys9zjud\"&gt;/theia&lt;/code&gt; skill&lt;/a&gt;, &lt;a href=\"en/glossary.html#statusline\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9qqgpjh0\"&gt;statusLine&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#dirty-marks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dmta7tsl\"&gt;dirty-marks&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#fail-open\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fi533yyn\"&gt;fail-open&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;, &lt;a href=\"en/integrations/codex.html\"&gt;Codex&lt;/a&gt;, &lt;a href=\"en/reference/hooks.html#hooks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pl9g6joh\"&gt;theia hooks&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"mcp\"&gt;&lt;a href=\"en/glossary.html#mcp\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;MCP&lt;/span&gt;&lt;/a&gt;MCP&lt;/h3&gt;\n&lt;p&gt;MCP (Model Context Protocol) is a standard way to give an agent tools. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cu233qsi\"&gt;theia serve&lt;/code&gt; starts Theia's MCP server over standard input and output. Tools:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;code map: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bddqr4rf\"&gt;codebase_blueprint&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x5kn977b\"&gt;codebase_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gg0uc8gc\"&gt;codebase_symbol&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;memory: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ey163eu\"&gt;memory_search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83s561li\"&gt;memory_add&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-89b1s7e6\"&gt;memory_tree&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;run inspection: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ujitdgmd\"&gt;run_audit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uslsxb3u\"&gt;run_diagnose&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;control: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ecfrncl\"&gt;run_list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i12xv81o\"&gt;run_status&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vaar0xvm\"&gt;run_events&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uv9thekr\"&gt;run_wait&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nhz2if67\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-31uh1q2h\"&gt;run_answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ojnna2c\"&gt;run_stop&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8h3jsq1k\"&gt;run_start&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ymsktpul\"&gt;run_probe&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xed2yjmc\"&gt;plan_list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lw11l1s3\"&gt;plan_show&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ockxam3x\"&gt;plan_create&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-47r8v05e\"&gt;plan_approve&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Codex gets a smaller set without the control tools. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1mj93wej\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4a58bp0a\"&gt;run_answer&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pkdk2d7n\"&gt;run_stop&lt;/code&gt; tools have no effect on freshly started runs, including runs from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yrosi1g9\"&gt;run_start&lt;/code&gt;: see &lt;a href=\"en/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jz1k07t0\"&gt;theia serve: MCP server on stdio (root …)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4u2ewrik\"&gt;mcp server registered: theia serve → …/.mcp.json (control tools included)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"en/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"en/glossary.html#skill\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8nrctlrm\"&gt;/theia&lt;/code&gt; skill&lt;/a&gt;, &lt;a href=\"en/glossary.html#metrics\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5k9ods0k\"&gt;/metrics&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/integrations/mcp-server.html\"&gt;MCP server&lt;/a&gt;, &lt;a href=\"en/reference/serve.html#serve\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3mdlkvja\"&gt;theia serve&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"skill\"&gt;&lt;a href=\"en/glossary.html#skill\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;skill&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k2icng2n\"&gt;/theia&lt;/code&gt;skill&lt;/h3&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rwm3xpha\"&gt;/theia&lt;/code&gt; skill is an instruction for Claude Code on how to work through Theia: plan, human approval, start, watch, answer questions. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ux39k7k\"&gt;theia hooks install claude&lt;/code&gt; puts it into &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-licirez9\"&gt;.claude/skills/theia/SKILL.md&lt;/code&gt;. The skill itself runs nothing; it relies on Theia's MCP tools. It is not installed for Codex. In 0.2.201 the skill's steps with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-95tswdjv\"&gt;run_msg&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zr4i23pj\"&gt;run_stop&lt;/code&gt; have no effect on runs from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4tf90rfk\"&gt;run_start&lt;/code&gt;. Do not confuse this skill with the skills in vendor deliverables.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ryehphmy\"&gt;/theia skill installed → …/.claude/skills/theia/SKILL.md&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"en/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"en/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"en/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"statusline\"&gt;&lt;a href=\"en/glossary.html#statusline\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oon27jw1\"&gt;statusLine&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The status line at the bottom of Claude Code. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3r49lhx1\"&gt;theia hooks install claude&lt;/code&gt; wires the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p5jq2kc3\"&gt;theia index status --brief&lt;/code&gt; command into it if you do not have a status line yet. It shows index freshness and the number of open runs and waiting questions.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4uy9furs\"&gt;theia: 0 indexed · 1 missing · 1 live&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-umeegt5h\"&gt;statusline: existing statusLine preserved (not overwritten)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#stale\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w4hfouqm\"&gt;stale&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qsgeoamv\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"en/integrations/claude-code.html\"&gt;Claude Code&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gate-1\"&gt;&lt;a href=\"en/glossary.html#gate-1\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-48xytd1t\"&gt;gate 1&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Codex's first condition: the project must be trusted (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c4auqw1s\"&gt;project trust&lt;/code&gt;). Until it is, Codex sees neither the hooks nor the MCP server from the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ofsa6qlj\"&gt;.codex/&lt;/code&gt; folder. The condition is met when you run &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0oa73eym\"&gt;codex&lt;/code&gt; once in this folder and accept the trust prompt, or run &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-898s06o4\"&gt;theia hooks install codex --trust&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tpjbk2i6\"&gt;project NOT trusted (gate 1)&lt;/code&gt; in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ojky7nmi\"&gt;codex hooks&lt;/code&gt; line of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yhj47kc9\"&gt;theia doctor&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vezglvom\"&gt;gate 1 (project trust): NOT SATISFIED — …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#gate-2\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ky6jrafo\"&gt;gate 2&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#codex-hooks\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qqu8swa8\"&gt;codex hooks&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/integrations/codex.html\"&gt;Codex&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"gate-2\"&gt;&lt;a href=\"en/glossary.html#gate-2\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3tl9yjqm\"&gt;gate 2&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Codex's second condition: new and changed hooks must be reviewed and trusted (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-adfu93ri\"&gt;hook trust&lt;/code&gt;). Until then Codex skips them. Approve them with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-62iii4px\"&gt;/hooks&lt;/code&gt; in an interactive Codex session in this folder.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3yc5rat4\"&gt;gate 2 (hook trust): new/changed hooks are review-gated per hash and SKIPPED until trusted —&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cj8l2o1m\"&gt;theia hooks install codex&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#gate-1\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0qorgl5n\"&gt;gate 1&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#hooks\"&gt;hooks&lt;/a&gt;, &lt;a href=\"en/integrations/codex.html\"&gt;Codex&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"metrics\"&gt;&lt;a href=\"en/glossary.html#metrics\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uk5n18gl\"&gt;/metrics&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A Prometheus metrics page: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qzwjxru2\"&gt;theia serve --metrics &amp;lt;port&amp;gt;&lt;/code&gt;. It shows counters of the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-afnjjega\"&gt;theia serve&lt;/code&gt; process only. The port listens on all network interfaces.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y2gfyaij\"&gt;theia serve: /metrics on :&amp;lt;port&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"en/integrations/observability.html\"&gt;Metrics and tracing&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-tui\"&gt;&lt;a href=\"en/glossary.html#group-tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TUI screen&lt;/span&gt;&lt;/a&gt;TUI screen&lt;/h2&gt;\n&lt;h3 id=\"tui\"&gt;&lt;a href=\"en/glossary.html#tui\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;TUI&lt;/span&gt;&lt;/a&gt;TUI&lt;/h3&gt;\n&lt;p&gt;The TUI (text user interface) is the full-screen mode of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g6nh8kml\"&gt;theia run&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uxf1dv82\"&gt;theia show --tui&lt;/code&gt;. It is the default view in a terminal. The screen shows the run tree, step details, live activity and key hints. Without a terminal, or with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-712wnkpn\"&gt;--non-interactive&lt;/code&gt;, Theia switches to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6u4w5kda\"&gt;--plain&lt;/code&gt; and says why. There is no key to detach and leave the run working.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rewlxvll\"&gt;view: --tui needs an interactive terminal (a TTY for output and keys) — degrading to --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lavk8sto\"&gt;view: --tui is interactive; --non-interactive degrades to --plain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;, &lt;a href=\"en/glossary.html#home-screen\"&gt;home screen&lt;/a&gt;, &lt;a href=\"en/glossary.html#board\"&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mhtti9ec\"&gt;--cli&lt;/code&gt;)&lt;/a&gt;, &lt;a href=\"en/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j6yfow8q\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/tui/overview.html\"&gt;Screens and elements&lt;/a&gt;, &lt;a href=\"en/tui/leave-running.html\"&gt;Leave without stopping a task&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"home-screen\"&gt;&lt;a href=\"en/glossary.html#home-screen\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;home screen&lt;/span&gt;&lt;/a&gt;home screen&lt;/h3&gt;\n&lt;p&gt;The home screen is what &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f566e19a\"&gt;theia&lt;/code&gt; with no command opens in a terminal when personal settings and a store already exist. It shows only the problem lines of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hp1539ql\"&gt;theia doctor&lt;/code&gt;, the index freshness line, up to five latest runs with outcome and cost, and the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q2kf2eut\"&gt;task ▸&lt;/code&gt; task box.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In 0.2.201 starting a task from the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yqn3qlr0\"&gt;task ▸&lt;/code&gt; box does not work: the run fails with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lch52n5g\"&gt;kernel: no vendored prompts …&lt;/code&gt; and stays open (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l7ipumyf\"&gt;⣽ … in flight&lt;/code&gt;). Start tasks with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ltwcovbd\"&gt;theia run --task \"…\"&lt;/code&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8e1i58ht\"&gt;recent runs:&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kfxg60z9\"&gt;✖ run2akdqctmhw222mff47z2qh  abandoned  $0.0000&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ur85co26\"&gt;task ▸ ▏&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ft7o2xfh\"&gt;Enter run · ? help · q quit&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"en/glossary.html#in-flight\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gjnu9r6x\"&gt;in flight&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"en/tui/overview.html\"&gt;Screens and elements&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"run-tree\"&gt;&lt;a href=\"en/glossary.html#run-tree\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;run tree&lt;/span&gt;&lt;/a&gt;run tree&lt;/h3&gt;\n&lt;p&gt;The run tree is the main part of the TUI. Tasks are rows like &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wy9usp73\"&gt;tsk…x [fast_path]&lt;/code&gt;, with phase, rounds, cost and time on the right. Inside a task: its text, the copy &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-59oymj6p\"&gt;workspace @ &amp;lt;sha&amp;gt; (copy)&lt;/code&gt;, rounds like &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rq9ut9oa\"&gt;r1 implement  implementer → ready&lt;/code&gt;, and under a round the model calls (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w5ufnqlw\"&gt;· gateway …&lt;/code&gt;), tools and evidence. The top level also holds anomalies &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pdgec9wq\"&gt;‼&lt;/code&gt;, your steering &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jfcwfy83\"&gt;»&lt;/code&gt; and service notes. Successful tasks collapse; problem tasks expand by themselves.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#glyphs\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/a&gt;, &lt;a href=\"en/glossary.html#round\"&gt;round&lt;/a&gt;, &lt;a href=\"en/glossary.html#detail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3f15gvx8\"&gt;detail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#keybar\"&gt;keybar&lt;/a&gt;, &lt;a href=\"en/tui/overview.html\"&gt;Screens and elements&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"board\"&gt;&lt;a href=\"en/glossary.html#board\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;board ()&lt;/span&gt;&lt;/a&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jqmqknxb\"&gt;--cli&lt;/code&gt;)&lt;/h3&gt;\n&lt;p&gt;The board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0lupnm8f\"&gt;--cli&lt;/code&gt;) is a compact run view that redraws in place. The first line: run, money, calls and events. Then one line per task: track, phase, rounds and the last verdict. At the bottom, the state: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jbqls67m\"&gt;running&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-im7o2rfb\"&gt;halted: …&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n4d5f9xu\"&gt;stopping — finishing in-flight verdicts…&lt;/code&gt;. The board needs a terminal; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dkaelgub\"&gt;theia show &amp;lt;runId&amp;gt; --cli&lt;/code&gt; prints the last frame.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z9iabp53\"&gt;run …wvesbyig  $0.0000/$10.00 · 4 calls · 22 events&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uhswjhul\"&gt;tsk…xk6rzynf  fast_path  discarded   r6  lead→lead_discard “…”&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t2fc6bki\"&gt;— halted: completed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r5t89hq6\"&gt;--plain&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#tui\"&gt;TUI&lt;/a&gt;, &lt;a href=\"en/glossary.html#summary\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yazrtlzx\"&gt;summary&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"plain\"&gt;&lt;a href=\"en/glossary.html#plain\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u9kj19vn\"&gt;--plain&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The plain view: one line per log event, no redrawing. Use it in scripts, CI and files. The lines show Theia's event names, not the model's words: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a4p1kjz4\"&gt;verify_pass&lt;/code&gt;, not &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mxb0f4f2\"&gt;pass&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e8r77xst\"&gt;arb_escalate&lt;/code&gt;, not &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e0m7jj29\"&gt;escalate&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-00j5s7d0\"&gt;live&lt;/code&gt; lines are only hints and are not written to the log.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4qjw5ih6\"&gt;theia run … --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-stknfpf1\"&gt;theia show &amp;lt;runId&amp;gt; --plain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y7c2wgyr\"&gt;view: --cli needs a TTY — degrading to --plain&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"en/glossary.html#verdict\"&gt;verdict&lt;/a&gt;, &lt;a href=\"en/glossary.html#live\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-71o87mj4\"&gt;live&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#board\"&gt;board (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-frcqgec9\"&gt;--cli&lt;/code&gt;)&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"summary\"&gt;&lt;a href=\"en/glossary.html#summary\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8kx8gt1\"&gt;summary&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The run summary: each task's outcome, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1vzfdowy\"&gt;halted:&lt;/code&gt; line with the number of calls and the cost, and the log check. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gk9qev4y\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt; with no flags and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vapvvxlv\"&gt;theia run&lt;/code&gt; at the end print it.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j3nx0han\"&gt;tsk2akdqb2ilc225pxk6rzynf → discarded (6 rounds) …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ib0rvqyp\"&gt;halted: completed · 4 gateway calls · $0.0000&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u2mgv52u\"&gt;audit chain: intact&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#halted\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ksvmlyw5\"&gt;halted&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"en/glossary.html#plain\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7fin4m4c\"&gt;--plain&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"glyphs\"&gt;&lt;a href=\"en/glossary.html#glyphs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;✔ ✖ ◆ ◌ ‼ »&lt;/span&gt;&lt;/a&gt;✔ ✖ ◆ ◌ ‼ »&lt;/h3&gt;\n&lt;p&gt;TUI signs:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pjubdggh\"&gt;✔&lt;/code&gt; — good: a task outcome &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2dgw1o4t\"&gt;merged&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5vddoeex\"&gt;planned&lt;/code&gt;, a round whose verdict is not on the bad list, a run that is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dzyo4lu0\"&gt;completed&lt;/code&gt;;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ndfvjjo3\"&gt;✖&lt;/code&gt; — bad: a discarded task; a round with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rej6g5jl\"&gt;discard&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vrkjak55\"&gt;merge_fail&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vrmn0z1j\"&gt;verify_fail&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pt53w9us\"&gt;cant_do&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t74f6cej\"&gt;algedonic&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jb2z7l4i\"&gt;no_progress&lt;/code&gt;; a stopped run (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-etrlgio5\"&gt;stopped (…)&lt;/code&gt;);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k9h1s2sa\"&gt;◆&lt;/code&gt; — stuck: an &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dj3oqbn5\"&gt;escalated&lt;/code&gt; task or an unanswered question; on the home screen, a paused run;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kr0stkns\"&gt;⣷ ⣯ ⣟ …&lt;/code&gt; (or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tdrnli7y\"&gt;●&lt;/code&gt; with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tehbiy2p\"&gt;--no-spinner&lt;/code&gt;) — work in progress, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t9csa6zr\"&gt;◌&lt;/code&gt; — waiting;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ho7yvora\"&gt;‼&lt;/code&gt; — an anomaly, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fifg83g6\"&gt;»&lt;/code&gt; — your steering, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r3rpvj0x\"&gt;·&lt;/code&gt; — task text or evidence, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mdkzkyw7\"&gt;▼&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o695gsbg\"&gt;▶&lt;/code&gt; — expanded and collapsed, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8kcbx3km\"&gt;‖&lt;/code&gt; — paused or stopping, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hu9o0685\"&gt;❯&lt;/code&gt; — the cursor when colors are off.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The green check means \"not a bad event\", not \"a good outcome\". Rounds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b0qbitli\"&gt;lead → lead_discard&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mo86tehi\"&gt;arbiter → arb_escalate&lt;/code&gt; are marked &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-377v7ocg\"&gt;✔&lt;/code&gt; too, and a run where every task was discarded shows &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c8lf7f3p\"&gt;✔ completed&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#run-tree\"&gt;run tree&lt;/a&gt;, &lt;a href=\"en/glossary.html#completed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7g088sbm\"&gt;completed&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#frozen\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i5h5zduj\"&gt;frozen&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#failed\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bopxyjvm\"&gt;failed&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/tui/overview.html\"&gt;Screens and elements&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"running\"&gt;&lt;a href=\"en/glossary.html#running\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xhsoslqu\"&gt;running&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The run or the task is working now. The TUI header says &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zjti77g6\"&gt;running&lt;/code&gt;, the task counter &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qxxg3wi1\"&gt;N running&lt;/code&gt;, the board &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tjyqca48\"&gt;— running&lt;/code&gt;. A run killed without a pause also looks &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v77ydqt2\"&gt;running&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-px5od72s\"&gt;theia show --tui&lt;/code&gt; until it is resumed or closed.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aijxkv6y\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#still-open\"&gt;&lt;co
