l#trunk\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6tirww6o\"&gt;trunk&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"en/reference/audit-prune.html#prune\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a6skxc2i\"&gt;theia prune&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/guides/results.html\"&gt;Run results&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"audit-branch\"&gt;&lt;a href=\"en/glossary.html#audit-branch\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-df3i6rix\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The task branch &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-94r0m1xe\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt; with the task's commits. It appears in your repository only after the task merged, and it stays there: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-appwvsc7\"&gt;theia prune&lt;/code&gt; does not delete it. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bwmjlr2j\"&gt;theia show &amp;lt;runId&amp;gt; --task &amp;lt;id&amp;gt; [--diff]&lt;/code&gt; reads it. A discarded task has no such branch, and the command says &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tn0pnfzw\"&gt;audit branch ai/… not found … (in-place run, or the branch was pruned)&lt;/code&gt;; the reason in that message is wrong.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vffpiste\"&gt;untouched: … ai/* audit branches (your repo)&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0q2i42ua\"&gt;theia prune&lt;/code&gt;, the evidence note &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yj7gva77\"&gt;merge --no-ff ai/&amp;lt;task&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#merge\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lwc1tc3s\"&gt;merge&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;, &lt;a href=\"en/reference/run-inspect.html#show\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iywv7qux\"&gt;theia show&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"precheck\"&gt;&lt;a href=\"en/glossary.html#precheck\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3fz3tlcr\"&gt;precheck&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The check before a merge: the task copy must have commits after the base and no uncommitted edits. If the check fails, there is no merge, and the evidence reads &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qe59vv8n\"&gt;precheck:&amp;lt;task&amp;gt;&lt;/code&gt; with the reason.&lt;/p&gt;\n&lt;p&gt;Where you see it: TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jc6v9wbi\"&gt;command precheck:2akdqcea5s223wgiwm7ieg — no commits on the task branch&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kke2kq3g\"&gt;evidence[command] precheck:… (no commits on the task branch)&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s8w0dpej\"&gt;theia diagnose&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#merge-fail\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e78lqopv\"&gt;merge_fail&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#merger\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x84cgcah\"&gt;merger&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"in-place\"&gt;&lt;a href=\"en/glossary.html#in-place\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-voci5sig\"&gt;--in-place&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A mode with no copy and no git: agents edit files right in your folder, there is no run branch, and merge only marks the work as accepted (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b1qln08j\"&gt;merged&lt;/code&gt;). Theia turns this mode on by itself when the folder is not a git repository. It is not available in a project with several roots.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o1q1uu65\"&gt;mode: in-place (no git repo or --in-place) — no worktree isolation&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#workspace\"&gt;workspace&lt;/a&gt;, &lt;a href=\"en/glossary.html#merged\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wslg4bu0\"&gt;merged&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-branch\"&gt;run branch&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-store\"&gt;&lt;a href=\"en/glossary.html#group-store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Store and project&lt;/span&gt;&lt;/a&gt;Store and project&lt;/h2&gt;\n&lt;h3 id=\"store\"&gt;&lt;a href=\"en/glossary.html#store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;store&lt;/span&gt;&lt;/a&gt;store&lt;/h3&gt;\n&lt;p&gt;The store is Theia's data folder for a project: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8pc847y3\"&gt;.theia&lt;/code&gt; with a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pz33iydf\"&gt;store.db&lt;/code&gt; file inside. It holds the event log, plans, memory, the code index, project settings and task copies. Where it lives:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;in a git repository — at the root of the working copy, even if you ran &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9m675s7e\"&gt;theia init&lt;/code&gt; in a subfolder;&lt;/li&gt;\n&lt;li&gt;outside git — in the user data folder, and the project folder stays clean;&lt;/li&gt;\n&lt;li&gt;with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vbda4tq4\"&gt;theia init --here&lt;/code&gt; — exactly in the current folder.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Other commands find the store by walking up from the current folder.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6a878543\"&gt;store: …/.theia (worktree root)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wvx1zl5e\"&gt;theia: no .theia/ found from &amp;lt;cwd&amp;gt; upward (and no user-registry workspace) — run 'theia init' in the workspace home first&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#theia-dir\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vxp9zd1h\"&gt;.theia&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6p5rxum2\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-14kw9rm1\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#user-home-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mnlcn6ki\"&gt;user-home store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#detached\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w9u4t3i6\"&gt;detached&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/workspaces.html\"&gt;Store and project roots&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"theia-dir\"&gt;&lt;a href=\"en/glossary.html#theia-dir\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7idfp7wk\"&gt;.theia&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The store folder in a project. Inside:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hcapoqsb\"&gt;store.db&lt;/code&gt; — the database;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-it0eyrxg\"&gt;config/&lt;/code&gt; — project settings: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k3kjy9fr\"&gt;policy.yaml&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6w2mp4c\"&gt;registry.yaml&lt;/code&gt; and other manifests;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sqedpphm\"&gt;prompts/&lt;/code&gt; — your additions to role prompts;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4gqeyoz3\"&gt;objects/&lt;/code&gt; — full command output, model requests and replies;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kl1t9k68\"&gt;index/&lt;/code&gt; — search files;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wo9rv9xn\"&gt;runs/&lt;/code&gt; — task copies and run branches;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7k5egzn8\"&gt;control/&lt;/code&gt; — logs of commands started through MCP.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Theia adds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cxest5d0\"&gt;.theia/&lt;/code&gt; to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oy5dtpdq\"&gt;.gitignore&lt;/code&gt;. The folder holds task texts and model replies, so treat it as private data. When it grows past 5 GB (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fs516qbo\"&gt;maintenance.storeAlertGb&lt;/code&gt;), a line &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yea09nh0\"&gt;storage: .theia at … — reclaim with 'theia prune'&lt;/code&gt; appears after a run and in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tpgbx3k0\"&gt;theia doctor&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"en/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nlvb6fus\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#theia-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0blvtfc\"&gt;.theia store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/reference/audit-prune.html#prune\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-invftoyj\"&gt;theia prune&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"store-db\"&gt;&lt;a href=\"en/glossary.html#store-db\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q6s2msf9\"&gt;store.db&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The SQLite database file in the store. It holds the event logs of all runs, plans, memory facts, code index entries and saved model replies. This file is what makes a real store different from a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ddujeoak\"&gt;.theia&lt;/code&gt; folder with only settings.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"en/glossary.html#overlay\"&gt;overlay&lt;/a&gt;, &lt;a href=\"en/glossary.html#event-log\"&gt;event log&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace\"&gt;&lt;a href=\"en/glossary.html#workspace\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;workspace&lt;/span&gt;&lt;/a&gt;workspace&lt;/h3&gt;\n&lt;p&gt;In Theia this word means different things:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;The repository copy for a task: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yudrkx2d\"&gt;.theia/runs/&amp;lt;runId&amp;gt;/ws-&amp;lt;task&amp;gt;&lt;/code&gt; on the branch &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i7e3u594\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;. The copy also gets untracked files such as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dbd5bzlg\"&gt;node_modules&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vhb8e77o\"&gt;.env&lt;/code&gt;, but they are never committed. After a successful merge the copy is deleted; for discarded and stuck tasks it stays. In the TUI: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yk9n9tpz\"&gt;workspace @ 209a8f6 (copy)&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qyak0sp4\"&gt;kind: Workspace&lt;/code&gt; — the manifest of a project with several roots.&lt;/li&gt;\n&lt;li&gt;The project folder that owns the store (workspace home).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y3yihime\"&gt;workspace-write&lt;/code&gt; — the Codex access mode of the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i6aejvqp\"&gt;codex-write&lt;/code&gt; transport: writes only inside the working folder.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vpe7q27b\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#workspace-home\"&gt;workspace home&lt;/a&gt;, &lt;a href=\"en/glossary.html#in-place\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jyzt5svw\"&gt;--in-place&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#audit-branch\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sdpu04xe\"&gt;ai/&amp;lt;task&amp;gt;&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace-home\"&gt;&lt;a href=\"en/glossary.html#workspace-home\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;workspace home&lt;/span&gt;&lt;/a&gt;workspace home&lt;/h3&gt;\n&lt;p&gt;The project folder that owns the store: it contains &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nnekb5df\"&gt;.theia&lt;/code&gt; with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6gv3fy2p\"&gt;store.db&lt;/code&gt;. Root paths in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4v4a3umk\"&gt;Workspace&lt;/code&gt; manifest are relative to it.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6znf3dmi\"&gt;… — run 'theia init' in the workspace home first&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"en/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yvg3auii\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#root\"&gt;root&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"worktree-root\"&gt;&lt;a href=\"en/glossary.html#worktree-root\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5gvw8wt\"&gt;worktree root&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The top folder of a git working copy. By default &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dlpunj3z\"&gt;theia init&lt;/code&gt; puts the store there, even when you run it from a subfolder: one store per working copy.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sxmgebh9\"&gt;store: …/.theia (worktree root)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bf0ozue0\"&gt;(worktree root — one store per checkout; pass --here to pin it to this subfolder instead)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"en/glossary.html#detached\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gqmlnuoc\"&gt;detached&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"user-home-store\"&gt;&lt;a href=\"en/glossary.html#user-home-store\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0or0t0gt\"&gt;user-home store&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A store for a folder outside git. It lives in the user data folder (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d8y2797f\"&gt;stores/&amp;lt;name&amp;gt;-&amp;lt;hash&amp;gt;&lt;/code&gt;), and the project folder stays clean. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jthgadp0\"&gt;workspaces.yaml&lt;/code&gt; records which store belongs to which folder. The first-run setup wizard does not do this: it always creates &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4pen7tdp\"&gt;.theia&lt;/code&gt; in the current folder.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-evoekhdc\"&gt;store: …/stores/my-notes-dfef89b4 (user-home store — this folder is not a git worktree and stays clean; …)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#workspaces-yaml\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2oslk478\"&gt;workspaces.yaml&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"en/glossary.html#setup-wizard\"&gt;setup wizard&lt;/a&gt;, &lt;a href=\"en/config/workspaces.html\"&gt;Store and project roots&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"detached\"&gt;&lt;a href=\"en/glossary.html#detached\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3j95aei4\"&gt;detached&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6qlog4pv\"&gt;theia init --here&lt;/code&gt; puts the store exactly in the current folder, not at the working copy root and not in the user folder. Theia calls such a store &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d8q4iwzi\"&gt;detached&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p6t7v4g5\"&gt;store: …/.theia (detached — --here pins the store to this folder)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#store\"&gt;store&lt;/a&gt;, &lt;a href=\"en/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-te62svz4\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspaces-yaml\"&gt;&lt;a href=\"en/glossary.html#workspaces-yaml\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mmaj0yfl\"&gt;workspaces.yaml&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A file in the user settings folder: which store belongs to which folder outside git. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0y229xgo\"&gt;theia init&lt;/code&gt; writes it. If a row points to a missing store, Theia skips the row and says so.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w8k4oaoi\"&gt;theia: registry maps &amp;lt;folder&amp;gt; to &amp;lt;store&amp;gt; but no store.db is there — ignoring the row (…)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#user-home-store\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gkf0479v\"&gt;user-home store&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#user-config\"&gt;user config&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"root\"&gt;&lt;a href=\"en/glossary.html#root\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;root&lt;/span&gt;&lt;/a&gt;root&lt;/h3&gt;\n&lt;p&gt;In Theia this word means different things:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;A repository in a project with several roots. It has a short name, and the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2rb6gu61\"&gt;--root &amp;lt;name&amp;gt;&lt;/code&gt; flag narrows &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ztxgughk\"&gt;index&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bkcqjnal\"&gt;mem&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5299bfhb\"&gt;run&lt;/code&gt; to one root. A regular project has one root named &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b0wall94\"&gt;root&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f56tbius\"&gt;root:&amp;lt;name&amp;gt;&lt;/code&gt; — a memory part written with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-79tul62h\"&gt;--root&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xsgcqzp8\"&gt;theia mem search&lt;/code&gt; shows it as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4n5ripxk\"&gt;{root:web}&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ppu4ei2l\"&gt;worktree root&lt;/code&gt; — the top folder of a git working copy, the default place of the store.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4vm0frj2\"&gt;root cause&lt;/code&gt; — the likely cause of a failure in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4oky5uk4\"&gt;theia diagnose&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ubpeqrb7\"&gt;root: null&lt;/code&gt; in the TUI task details — the task has no separate root.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a3ncoziq\"&gt;theia: unknown root 'nope' (declared: root)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#workspace-manifest\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xrrnzy82\"&gt;kind: Workspace&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#scope\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u1vlvzl4\"&gt;scope&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#worktree-root\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tto301gw\"&gt;worktree root&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#root-cause\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iltc6x2j\"&gt;root cause&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"workspace-manifest\"&gt;&lt;a href=\"en/glossary.html#workspace-manifest\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqp4cp9s\"&gt;kind: Workspace&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The manifest of a project with several roots: several repositories share one store. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s2swcg96\"&gt;spec.roots&lt;/code&gt; lists the roots (a name and a path from the store folder), and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-97o6lf35\"&gt;spec.primary&lt;/code&gt; names the default root. Run tasks carry a root label, and related merges in different roots land together (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pditrfag\"&gt;run.changeset&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lc5mpnub\"&gt;.theia/config/workspace.yaml&lt;/code&gt; from the first-run wizard, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i47rhmhg\"&gt;multi-root workspace: proj, lib (primary: proj)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-changeset\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rx8q5les\"&gt;run.changeset&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#manifest\"&gt;manifest&lt;/a&gt;, &lt;a href=\"en/config/workspaces.html\"&gt;Store and project roots&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"overlay\"&gt;&lt;a href=\"en/glossary.html#overlay\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;overlay&lt;/span&gt;&lt;/a&gt;overlay&lt;/h3&gt;\n&lt;p&gt;A &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d0p3btz0\"&gt;.theia&lt;/code&gt; folder without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ymoq02kp\"&gt;store.db&lt;/code&gt; inside one of the project roots. It holds only that root's own settings and prompts. When looking for the store, Theia skips such a folder and keeps walking up.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kfyx193u\"&gt;theia: …/.theia has no store.db — per-root overlay, continuing upward&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#root\"&gt;root&lt;/a&gt;, &lt;a href=\"en/glossary.html#store-db\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6u7vz238\"&gt;store.db&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/config/workspaces.html\"&gt;Store and project roots&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-plans\"&gt;&lt;a href=\"en/glossary.html#group-plans\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Plans&lt;/span&gt;&lt;/a&gt;Plans&lt;/h2&gt;\n&lt;h3 id=\"plan\"&gt;&lt;a href=\"en/glossary.html#plan\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o3o5wor4\"&gt;plan&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The word has two meanings.&lt;/p&gt;\n&lt;p&gt;A plan is a saved task list from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l5exe44h\"&gt;theia plan&lt;/code&gt;: each task has a key, a track, dependencies and check commands. A plan has a content fingerprint (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sc84a7m9\"&gt;digest&lt;/code&gt;) and a status: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tsk3wcxl\"&gt;draft&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-91j2wnab\"&gt;approved&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xyyoiltt\"&gt;changes_requested&lt;/code&gt;. Only an approved plan can run: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eprixwoo\"&gt;theia run --from-plan &amp;lt;planId&amp;gt;&lt;/code&gt;. Any edit (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1s6bq2qu\"&gt;theia plan add-context&lt;/code&gt;) produces a new fingerprint and returns the plan to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n15skb44\"&gt;draft&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vbltxyi9\"&gt;plan&lt;/code&gt; phase is the step of a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t9ijosdm\"&gt;full_spec&lt;/code&gt; task where the planner works.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r8386q2m\"&gt;pln2akdqddd5c2223ubqzsvlt [draft] 2 tasks — …&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eeztq0xw\"&gt;theia plan list&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-48k9jt64\"&gt;approved pln… @ fce3554ee5e2…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qcskfj4v\"&gt;run run… plan pln… @ fce3554ee5e2… → 2 tasks&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-edswu8gr\"&gt;task.phase … start → plan&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#approved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3mw9hl7r\"&gt;approved&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q3v2s2ft\"&gt;draft&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#changes-requested\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-79jymxqr\"&gt;changes_requested&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#digest\"&gt;digest&lt;/a&gt;, &lt;a href=\"en/glossary.html#full-spec\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ziajeqmg\"&gt;full_spec&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/guides/plan-and-run.html\"&gt;Plan before you run&lt;/a&gt;, &lt;a href=\"en/reference/plan.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l91wkgqo\"&gt;theia plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"approved\"&gt;&lt;a href=\"en/glossary.html#approved\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gwb3zwne\"&gt;approved&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The status of an approved plan. Only such a plan runs with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v4o9cyuw\"&gt;theia run --from-plan&lt;/code&gt;. Theia refuses a plan in any other status.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9j2vvbt5\"&gt;run: plan pln… is 'draft', not approved — approve it first (theia plan approve)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4pj0yd44\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-80s1dyp0\"&gt;draft&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"changes-requested\"&gt;&lt;a href=\"en/glossary.html#changes-requested\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-826zes92\"&gt;changes_requested&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A plan status after &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xuu3zuij\"&gt;theia plan request-changes &amp;lt;planId&amp;gt; \"…\"&lt;/code&gt;: you asked for changes. The plan's fingerprint stays the same, and your request shows in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-04slkcuc\"&gt;theia plan show&lt;/code&gt; as a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e20arfq8\"&gt;note:&lt;/code&gt; line.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xa08o7pu\"&gt;changes requested on pln…&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3whthc4d\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#approved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nykpx9bt\"&gt;approved&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"open-questions\"&gt;&lt;a href=\"en/glossary.html#open-questions\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vvxgtr5k\"&gt;OPEN QUESTIONS&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The planner has questions, and they cannot be answered in the terminal, for example because of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vt02tcsz\"&gt;--non-interactive&lt;/code&gt;. Theia saves a draft plan with a single &lt;a href=\"en/glossary.html#unresolved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-piuvnu8n\"&gt;unresolved&lt;/code&gt;&lt;/a&gt; item and prints the questions. Add your answer with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i2d4fapm\"&gt;theia plan add-context &amp;lt;planId&amp;gt; \"…\"&lt;/code&gt;, then create the plan again or approve it.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n0eber79\"&gt;OPEN QUESTIONS — plan saved as draft pln…:&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dbqa4s1j\"&gt;answer with: theia plan add-context pln… \"…\" — then re-run theia plan or approve&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5bv20q9w\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#clarify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tqlsnz1j\"&gt;clarify&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#unresolved\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l2vpiso1\"&gt;unresolved&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"unresolved\"&gt;&lt;a href=\"en/glossary.html#unresolved\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lbqnszhi\"&gt;unresolved&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The key of the placeholder task in a plan draft that was saved with open questions (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-znpjfmze\"&gt;OPEN QUESTIONS&lt;/code&gt;). Its description starts with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6usqtn4j\"&gt;Resolve open questions, then re-plan: …&lt;/code&gt;. It is not a task to run but a reminder: answer the questions with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x9n69811\"&gt;theia plan add-context &amp;lt;planId&amp;gt; \"…\"&lt;/code&gt; and create the plan again. Such a draft is not meant for approval.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dvtpk33m\"&gt;unresolved&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2yndm3db\"&gt;theia plan show &amp;lt;planId&amp;gt;&lt;/code&gt; after &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3mjlpg4b\"&gt;OPEN QUESTIONS — plan saved as draft pln…&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#open-questions\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8mgn1t0f\"&gt;OPEN QUESTIONS&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hix93vz6\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#draft\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zm8x1mru\"&gt;draft&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/guides/plan-and-run.html\"&gt;Plan before you run&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"verify-pre-flight\"&gt;&lt;a href=\"en/glossary.html#verify-pre-flight\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yqupasxd\"&gt;verify pre-flight&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A trial run of a plan's check commands on the base commit, before approval. It is off by default: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wfs0ykbx\"&gt;run.planVerifyPreflight: disable&lt;/code&gt;. A command that fails at the base is fine when the task is meant to fix it. But if the command itself is broken, for example a tool is missing, fix it before you approve.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8bc9dypr\"&gt;verify pre-flight: off (opt in with policy run.planVerifyPreflight: always)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w1mnca7t\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-55z7g2pi\"&gt;verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"cost-estimate\"&gt;&lt;a href=\"en/glossary.html#cost-estimate\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ubkx7hye\"&gt;cost estimate&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A plan's cost estimate from past runs in this store: number of tasks × average task price. Without run history there is no estimate. In &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-80qstnt1\"&gt;theia run --from-plan&lt;/code&gt; the same estimate is called the &lt;a href=\"en/glossary.html#plan-floor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-brf7h5fi\"&gt;plan floor&lt;/code&gt;&lt;/a&gt;: when the default budget is below it, the start is refused before the first model call.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5qrnagkc\"&gt;cost estimate: ~$… (N tasks × $… avg/task from recorded runs)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ytfy3ptz\"&gt;cost estimate: no run history — no estimate&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b83esfgq\"&gt;plan&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#plan-floor\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6lphkymu\"&gt;plan floor&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-maxusdperrun\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vvl35t9o\"&gt;run.maxUsdPerRun&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"plan-floor\"&gt;&lt;a href=\"en/glossary.html#plan-floor\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g7ob4gn8\"&gt;plan floor&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The lowest cost estimate of a plan run: the average task price across this store's earlier paid runs × the number of plan tasks. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zy25neyj\"&gt;theia run --from-plan&lt;/code&gt; compares the budget with it before the first model call. When the budget is the default (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-frg695eo\"&gt;run.maxUsdPerRun&lt;/code&gt;) and lies below the floor, the start is refused with code 1: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-791gimf9\"&gt;run: plan floor ~$… exceeds budget $… — pass --budget N explicitly, raise run.maxUsdPerRun, or --budget 0 (unmetered)&lt;/code&gt;. When the budget comes from the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p0nqwqb2\"&gt;--budget&lt;/code&gt; flag, Theia only warns (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7xqx8bil\"&gt;run: WARNING — plan floor …&lt;/code&gt;) and goes on: expect a budget pause. Without a history of paid runs there is no estimate and no check.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hlq6xfol\"&gt;run: plan floor ~$12.50 (5 tasks × $2.50 avg/task from this store's recorded runs) exceeds budget $10 — …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-387y5cl1\"&gt;run: WARNING — plan floor … proceeding on your explicit --budget&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#cost-estimate\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-su2spujl\"&gt;cost estimate&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#budget\"&gt;budget&lt;/a&gt;, &lt;a href=\"en/glossary.html#unmetered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-crly4ik1\"&gt;unmetered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/reference/run.html#run-from-plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pm5fre27\"&gt;theia run --from-plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"track-override\"&gt;&lt;a href=\"en/glossary.html#track-override\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jpdz0avm\"&gt;track override&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wy5k754n\"&gt;theia run --from-plan &amp;lt;planId&amp;gt; --track &amp;lt;track&amp;gt;&lt;/code&gt; puts every plan task on one track, for this run only. The plan and its fingerprint do not change.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-em8ft9qi\"&gt;track override: all 2 tasks forced to full_spec for this run (plan content unchanged)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#track\"&gt;track&lt;/a&gt;, &lt;a href=\"en/glossary.html#plan\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lvyllopk\"&gt;plan&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-steering\"&gt;&lt;a href=\"en/glossary.html#group-steering\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Steering and questions&lt;/span&gt;&lt;/a&gt;Steering and questions&lt;/h2&gt;\n&lt;h3 id=\"steering\"&gt;&lt;a href=\"en/glossary.html#steering\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;steering&lt;/span&gt;&lt;/a&gt;steering&lt;/h3&gt;\n&lt;p&gt;Steering is your message to a run while it works: what to take into account, what to change. Theia records it as a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l53pt4im\"&gt;user.note [msg]&lt;/code&gt; event and adds it to the shared notes (Σ) that the next steps receive. Ways to steer:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3bheh0vf\"&gt;m&lt;/code&gt; key in the TUI: the note reaches the run in the same process at once. The input line names the addressee: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w5s48nzl\"&gt;steer → tsk…x ▸&lt;/code&gt; (the task under the cursor) or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pk7nctie\"&gt;steer → run ▸&lt;/code&gt; (the whole run);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wsbrv0la\"&gt;theia msg &amp;lt;runId&amp;gt; \"…\"&lt;/code&gt;; with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y2gcoghz\"&gt;--task &amp;lt;id&amp;gt;&lt;/code&gt;, for one task only;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fdy20e0y\"&gt;theia fork &amp;lt;runId&amp;gt; --with \"…\"&lt;/code&gt; — steering for a fork.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Theia reroutes a note for a finished or unknown task to the whole run and says so.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pj241piz\"&gt;theia msg&lt;/code&gt; from another terminal reaches a paused run (when it resumes) and a resumed run. A freshly started run does not read the note, although &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b8y8n9zu\"&gt;theia msg&lt;/code&gt; replies &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2s1zfp1p\"&gt;noted — this run appears live …&lt;/code&gt;. See &lt;a href=\"en/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vkynoeso\"&gt;noted for task …fd7pn6tz — folds into its guidance only&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c9ruvqh5\"&gt;noted — folds into guidance on: theia run --resume run…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-emc0x4cd\"&gt;task …xk6rzynf is terminal — rerouted to run-level guidance (…)&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n0ghp1j0\"&gt;» steer [msg] …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"en/glossary.html#user-note\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qh2t1997\"&gt;user.note&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#sigma\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t0ms4ss1\"&gt;sigma&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/guides/control-run.html\"&gt;Control a run&lt;/a&gt;, &lt;a href=\"en/reference/run-control.html#msg\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7r5opgjg\"&gt;theia msg&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"control-bus\"&gt;&lt;a href=\"en/glossary.html#control-bus\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;control bus&lt;/span&gt;&lt;/a&gt;control bus&lt;/h3&gt;\n&lt;p&gt;The control bus is a way to control a run from another process without a separate server. A command or tool appends an event to the run's log, and the run reads new events between steps. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6gp0avzr\"&gt;theia msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dk5gfvf5\"&gt;theia answer&lt;/code&gt;, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-643k06hg\"&gt;--interaction bus&lt;/code&gt; question mode and the MCP tools &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mdrakcqd\"&gt;run_msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2scvtrla\"&gt;run_answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4oryuarz\"&gt;run_stop&lt;/code&gt; work this way.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;p&gt;In 0.2.201 only a resumed run reads the bus — one started with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qpb8hm1u\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. A run started with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v48yjuaq\"&gt;theia run --task …&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jjemixti\"&gt;--from-plan&lt;/code&gt;, and every run started by the MCP tool &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-luhy0a44\"&gt;run_start&lt;/code&gt;, does not read it. The events land in the log, but the run carries on as if they were not there: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jepzv37g\"&gt;theia msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-75checvr\"&gt;theia answer&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ry9mzl9e\"&gt;--interaction bus&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p0qlouqy\"&gt;run_stop&lt;/code&gt; have no effect on it. The replies &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7d7cibkk\"&gt;noted — this run appears live: …&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oj5hyp3z\"&gt;honored at the next dispatch boundary&lt;/code&gt; are misleading in this case.&lt;/p&gt;\n&lt;p&gt;What works: the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6qx2tn8z\"&gt;m&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cif5yolu\"&gt;q&lt;/code&gt; keys in the TUI of the same process, Ctrl+C in the run's terminal, and bus commands after &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u4mwyx4v\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt;. The steps are in &lt;a href=\"en/guides/control-run.html\"&gt;Control a run&lt;/a&gt;.&lt;/p&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3hwtrkzq\"&gt;noted — this run appears live: it folds cross-process notes at its next dispatch boundary …&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lb3jrcgs\"&gt;N questions waiting&lt;/code&gt; in the status line.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#steering\"&gt;steering&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-stop-request\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vmv3ea4e\"&gt;run.stop_request&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-question\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m38xf3yc\"&gt;run.question&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#dispatch-boundary\"&gt;dispatch boundary&lt;/a&gt;, &lt;a href=\"en/glossary.html#mcp\"&gt;MCP&lt;/a&gt;, &lt;a href=\"en/guides/control-run.html\"&gt;Control a run&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"dispatch-boundary\"&gt;&lt;a href=\"en/glossary.html#dispatch-boundary\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;dispatch boundary&lt;/span&gt;&lt;/a&gt;dispatch boundary&lt;/h3&gt;\n&lt;p&gt;The moment between a run's steps. At this moment the run checks for a stop request and new steering. A step already in progress, including a check command, finishes first. Steering does not get into a model call that is already running.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2bbww52w\"&gt;honored at the next dispatch boundary (in-flight work lands first)&lt;/code&gt; (the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e2buwcby\"&gt;run_stop&lt;/code&gt; reply), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-emz0b9dz\"&gt;… at its next dispatch boundary&lt;/code&gt; (the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6zjpxxr5\"&gt;theia msg&lt;/code&gt; reply).&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#control-bus\"&gt;control bus&lt;/a&gt;, &lt;a href=\"en/glossary.html#stopping\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8977i4fq\"&gt;stopping&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#steering\"&gt;steering&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"clarify\"&gt;&lt;a href=\"en/glossary.html#clarify\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w9m7jyy9\"&gt;clarify&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A clarifying question (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wsbuypak\"&gt;clarify&lt;/code&gt;) means a role cannot go on without your answer. Only the planner and the lead can ask, and each question comes with a reason. Where the question appears:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;in the TUI — a form in the detail pane: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-71zxboyq\"&gt;clarify — task …x (1/2)&lt;/code&gt; and the input line &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ytj9k9ce\"&gt;answer ▸&lt;/code&gt;. Enter goes to the next question, an empty answer skips, Esc declines the rest;&lt;/li&gt;\n&lt;li&gt;in a plain terminal — the line &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wjmzn7i1\"&gt;the planner needs answers before proceeding:&lt;/code&gt; (the lead's questions too) and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xqc7mszp\"&gt;? …&lt;/code&gt; questions;&lt;/li&gt;\n&lt;li&gt;in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7qwxchwy\"&gt;--interaction bus&lt;/code&gt; mode — a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v90dv5r5\"&gt;run.question&lt;/code&gt; event, answered with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ym94b3c5\"&gt;theia answer&lt;/code&gt;.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Theia saves answers as memory facts &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kh9kfdvx\"&gt;Q: … A: …&lt;/code&gt; so it does not ask again. Without an answer the task freezes in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-or0klaqv\"&gt;escalated&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-srhdzacg\"&gt;clarify_unanswered&lt;/code&gt;). A second unanswered question in a row pauses the run (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-czfi2yn6\"&gt;clarify_stalled&lt;/code&gt;). With &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-21m4j0m5\"&gt;--non-interactive&lt;/code&gt; the question stays unanswered at once.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#clarify-unanswered\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pblzb2cy\"&gt;clarify_unanswered&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#clarify-stalled\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a2g8swl5\"&gt;clarify_stalled&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-question\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x2uxbxzl\"&gt;run.question&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#non-interactive\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9yu9idra\"&gt;--non-interactive&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#fact\"&gt;fact&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"probe\"&gt;&lt;a href=\"en/glossary.html#probe\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t4tys9wa\"&gt;probe&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A probe is a one-off question to a model about a run's state: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5zzgn0c5\"&gt;theia probe &amp;lt;runId&amp;gt; \"…\"&lt;/code&gt;. The run does not change: Theia writes only a separate &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-106enqmj\"&gt;run.probed&lt;/code&gt; record. The question is one model call with a default limit of 1 dollar (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l08eyavh\"&gt;--budget&lt;/code&gt;). Asking the same question again is answered for free from the recording. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-liac7ewq\"&gt;theia prune&lt;/code&gt; does not delete such records.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mwa5m32l\"&gt;[probe run2akdqbfu2w223occvaxl3w of run2akdqb2i4k223pwvesbyig @ …bjr37ync — $0.0000; parent untouched]&lt;/code&gt;, home screen &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nitvyiiy\"&gt;· run…  probe&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#none\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oeesj27e\"&gt;none&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#ask\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vrflrtlb\"&gt;ask&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r88ud3j4\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/reference/run-control.html#probe\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w7jy3v6v\"&gt;theia probe&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"group-inspect\"&gt;&lt;a href=\"en/glossary.html#group-inspect\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Inspecting runs&lt;/span&gt;&lt;/a&gt;Inspecting runs&lt;/h2&gt;\n&lt;h3 id=\"audit-chain\"&gt;&lt;a href=\"en/glossary.html#audit-chain\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;audit chain&lt;/span&gt;&lt;/a&gt;audit chain&lt;/h3&gt;\n&lt;p&gt;The audit chain protects the log from tampering. Each event stores a fingerprint of the previous one, and Theia checks that the chain is unbroken. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ikk2rwqw\"&gt;intact&lt;/code&gt; means the log is whole; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ptja3gon\"&gt;BROKEN&lt;/code&gt; means it was changed after writing. A run with a broken chain cannot be resumed or forked.&lt;/p&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2iftfaa1\"&gt;theia audit verify&lt;/code&gt; checks the chains of all records: runs, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqti8xlq\"&gt;probe&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7nmyrg93\"&gt;ask&lt;/code&gt; questions, plans and the index. In 0.2.201 it also prints &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xkl9djce\"&gt;intact&lt;/code&gt; for a name that does not exist.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-grxdbbas\"&gt;audit chain: intact&lt;/code&gt; in the summary, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bniekj0i\"&gt;2akdqb2i4k223pwvesbyig: intact&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y1e2k1yb\"&gt;index: intact&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-apprlhbx\"&gt;theia audit verify&lt;/code&gt;, TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7vjrdjrj\"&gt;‼ audit chain BROKEN at …&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#event-log\"&gt;event log&lt;/a&gt;, &lt;a href=\"en/glossary.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-88g6e1ey\"&gt;replay&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/reference/audit-prune.html#audit-verify\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fgmlq4qi\"&gt;theia audit verify&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"replay\"&gt;&lt;a href=\"en/glossary.html#replay\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aumvmg6a\"&gt;replay&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Replay (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vj629b4i\"&gt;replay&lt;/code&gt;): &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-042ds2fx\"&gt;theia replay &amp;lt;runId&amp;gt;&lt;/code&gt; reads the run's log again and recalculates the outcome. No task runs, no model is called, nothing changes. The command prints the number of events and the chain state, the final task phases, the number of verdicts and calls, and the shared notes &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-msqrksag\"&gt;sigma: {…}&lt;/code&gt;. If the chain is broken, the exit code is 1.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9jwqh7gr\"&gt;events: 22; chain: intact&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ebycacvh\"&gt;verdicts: 6; gateway calls: 4&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r19lfive\"&gt;sigma: {}&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#audit-chain\"&gt;audit chain&lt;/a&gt;, &lt;a href=\"en/glossary.html#sigma\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fujn5df9\"&gt;sigma&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mzv7j572\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/reference/run-inspect.html#replay\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ewdqldq\"&gt;theia replay&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"fork\"&gt;&lt;a href=\"en/glossary.html#fork\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b4rqziez\"&gt;fork&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A fork is a new run that copies the original run's log up to a chosen event and then goes another way. The command: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zqdl8qzb\"&gt;theia fork &amp;lt;runId&amp;gt; --at &amp;lt;event&amp;gt; --with \"…\"&lt;/code&gt;. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7f36ijt0\"&gt;--at&lt;/code&gt; is a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8xiirb1a\"&gt;verdict&lt;/code&gt; or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-94qe6ebx\"&gt;task.phase&lt;/code&gt; event; the short number from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bz653567\"&gt;show --plain&lt;/code&gt; works. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fz8qiz02\"&gt;--with&lt;/code&gt; is steering for the new path. Start the fork with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-stpmfmw9\"&gt;theia run --resume &amp;lt;new id&amp;gt;&lt;/code&gt;. A fork's default budget is 5 dollars.&lt;/p&gt;\n&lt;div class=\"yfm-note yfm-accent-warning\" note-type=\"warning\"&gt;&lt;p class=\"yfm-note-title\"&gt;Warning&lt;/p&gt;\n&lt;div class=\"yfm-note-content\"&gt;&lt;ul&gt;\n&lt;li&gt;A fork of a finished run made without &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7a65xn5x\"&gt;--at&lt;/code&gt; cannot continue: all its tasks are already finished.&lt;/li&gt;\n&lt;li&gt;A resumed fork merges its work into your current branch, not into a run branch.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/div&gt;&lt;/div&gt;&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qpcavf18\"&gt;forked run… @ bjr37ync → run…&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s5aoti6z\"&gt;drive it: theia run --resume run…   (gateway: hybrid — prefix replays free)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jdlcvzvs\"&gt;forked from … at …&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v20wrsp9\"&gt;fork → … at … (&amp;lt;reason&amp;gt;)&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ywdfb06\"&gt;theia show&lt;/code&gt;, home screen &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wtdjurlz\"&gt;forked·&amp;lt;outcome&amp;gt;&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#hybrid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vltl1366\"&gt;hybrid&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#run-forked\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3kqn72gb\"&gt;run.forked&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#post-baseline\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hh1nectx\"&gt;post-baseline&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/guides/results.html\"&gt;Run results&lt;/a&gt;, &lt;a href=\"en/reference/run-inspect.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1bq6g5m9\"&gt;theia fork&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"hybrid\"&gt;&lt;a href=\"en/glossary.html#hybrid\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6m2lgtij\"&gt;hybrid&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;A gateway mode for forks, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gxa8vrdk\"&gt;probe&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-emcxmrh6\"&gt;ask&lt;/code&gt;. If an answer to the same request is already saved, Theia reuses it for free; new requests go to the model and are saved. The words &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4dnhg158\"&gt;prefix replays free&lt;/code&gt; on a fork only mean that the copied part is not run again. Saved answers of the original run exist only if it ran with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9p8pxzs2\"&gt;--record&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ipxshm54\"&gt;(gateway: hybrid — prefix replays free)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d8vusu4h\"&gt;fork resume: gateway in hybrid mode (recorded prefix replays free)&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#recording\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-84bjvchu\"&gt;--record&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3uyb7jav\"&gt;fork&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"recording\"&gt;&lt;a href=\"en/glossary.html#recording\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xuyr495\"&gt;--record&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lgublh31\"&gt;theia run --record&lt;/code&gt; flag saves every model reply in the store, so it can be reused later without a call. It is mainly for experiments with forks. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w1bgxizf\"&gt;theia prune&lt;/code&gt; does not delete saved replies.&lt;/p&gt;\n&lt;p&gt;Where you see it: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ezrae64d\"&gt;untouched: unfinished runs, gateway recordings (request-keyed, shared), …&lt;/code&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j8wimyc5\"&gt;theia prune&lt;/code&gt;.&lt;/p&gt;\n&lt;p&gt;See also: &lt;a href=\"en/glossary.html#hybrid\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k97zm3c4\"&gt;hybrid&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#fork\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7mnkpgjl\"&gt;fork&lt;/code&gt;&lt;/a&gt;, &lt;a href=\"en/glossary.html#replay-miss\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aiqflafv\"&gt;replay_miss&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h3 id=\"post-baseline\"&gt;&lt;a href=\"en/glossary.html#post-baseline\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;&lt;/span&gt;&lt;/a&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-beu0d28b\"&gt;post-baseline&lt;/code&gt;&lt;/h3&gt;\n&lt;p&gt;Spending after a run's starting point. For a fork it is spending after the split: the copied part does not count. This is how &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-c
