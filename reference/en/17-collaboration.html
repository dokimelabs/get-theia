        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"1-the-model\"&gt;&lt;a href=\"en/17-collaboration.html#1-the-model\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The model&lt;/span&gt;&lt;/a&gt;1. The model&lt;/h2&gt;\n&lt;p&gt;Nobody pushes to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m1nhs6kz\"&gt;dokimelabs/theia-dev&lt;/code&gt; but the pipeline and the operator.\nThe org's base permission is &lt;strong&gt;read&lt;/strong&gt; (verified live); developers are org\nmembers or repository collaborators with read — enough to see, fork, and\nopen PRs, never to write. The flow:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Developer forks, clones THEIR fork, commits, pushes the branch to the\nfork, opens a PR against &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uwm5e039\"&gt;main&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;CI runs on the PR as usual.&lt;/li&gt;\n&lt;li&gt;The operator reviews and types &lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-64j21eb2\"&gt;/merge&lt;/code&gt;&lt;/strong&gt; as a PR comment.&lt;/li&gt;\n&lt;li&gt;The fork-merge bot (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uf4y0w16\"&gt;.github/workflows/fork-merge.yml&lt;/code&gt;) enforces, in\norder: the commenter holds admin/maintain (the operator's act); the PR\nauthor is an org member or collaborator (membership is the license to\ncontribute — read-only suffices); every PR commit passes the\n&lt;strong&gt;email-privacy gate&lt;/strong&gt; (§4); and the merge lands EXACTLY the head\nsha visible when &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5wf7oa8k\"&gt;/merge&lt;/code&gt; was typed (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-znj1dokl\"&gt;--match-head-commit&lt;/code&gt; — a push\nracing the approval fails loudly instead of smuggling commits).&lt;/li&gt;\n&lt;li&gt;The landed commit is a &lt;strong&gt;squash authored by the contributor&lt;/strong&gt; (their\nname/email; GitHub attributes squash commits to the PR author) with the\nbot as committer — attribution stays honest, write access stays zero.\nThe bot composes the squash message itself (PR title + body) and\napplies the &lt;strong&gt;attribution law&lt;/strong&gt; (§5) to its trailers.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"2-artifact-repositories-no-history,-no-collaboration\"&gt;&lt;a href=\"en/17-collaboration.html#2-artifact-repositories-no-history,-no-collaboration\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Artifact repositories — no history, no collaboration&lt;/span&gt;&lt;/a&gt;2. Artifact repositories — no history, no collaboration&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i98d5u62\"&gt;get-theia&lt;/code&gt; (public) and the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6cdkadn0\"&gt;theia-releases&lt;/code&gt; README are &lt;strong&gt;generated\nartifacts&lt;/strong&gt;: their source lives in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-64u6iesk\"&gt;distribution/{get-theia,theia-releases}/&lt;/code&gt;\nhere (beside the vendored deliverables tree, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hanzgs74\"&gt;distribution/vendor/&lt;/code&gt; —\ndocs/16 §9), and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jw5fl8qr\"&gt;publish-artifact-repos.yml&lt;/code&gt; (plus &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uvoutnv3\"&gt;scripts/publish-artifact-repo.mts&lt;/code&gt;)\nforce-pushes each as a SINGLE orphan commit on every change (via the\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fgqp1u8a\"&gt;PUBLISH_TOKEN&lt;/code&gt; secret — it must reach both artifact repos; the\nfine-grained RELEASES_PAT deliberately cannot, ledger §4) — the repos\ncarry one commit at all times (verified live: commit count 1 in both).\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eb46bp9g\"&gt;get-theia&lt;/code&gt; has issues/wiki/projects disabled and auto-closes PRs (a\npublic repo cannot disable them) with the pointer to theia-dev. Release\ntags in theia-releases are untouched by the branch replace — tags pin\ntheir own objects (all releases verified intact post-publish).&lt;/p&gt;\n&lt;h2 id=\"3-release-immutability-on-this-plan\"&gt;&lt;a href=\"en/17-collaboration.html#3-release-immutability-on-this-plan\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Release immutability on this plan&lt;/span&gt;&lt;/a&gt;3. Release immutability on this plan&lt;/h2&gt;\n&lt;p&gt;Published releases are immutable-but-deletable &lt;strong&gt;by construction&lt;/strong&gt; today:\nonly the pipeline holds write (org base read; the classic operator token\nlives solely in CI secrets), the publish/promote workflows never edit a\npublished release (the vendor manifest attach is the single sanctioned\naddition), retention DELETES releases but never rewrites them, and every\ncustomer download is sha256-verified against &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-29t5lp06\"&gt;checksums.txt&lt;/code&gt; — a mutated\nartifact fails closed at install. Mechanical enforcement (a tag ruleset\nblocking &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rdesy30s\"&gt;update&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t7dx9j06\"&gt;non_fast_forward&lt;/code&gt; on &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bdiqoiwe\"&gt;refs/tags/v*&lt;/code&gt; while allowing\ndeletion, and the immutable-releases repo setting) is refused on the\ncurrent plan (403, \"Upgrade to GitHub Pro or make this repository\npublic\") — the exact calls are in the roadmap row and apply the day the\nplan supports them.&lt;/p&gt;\n&lt;h2 id=\"4-email-privacy-noreply-addresses-only\"&gt;&lt;a href=\"en/17-collaboration.html#4-email-privacy-noreply-addresses-only\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Email privacy — noreply addresses only&lt;/span&gt;&lt;/a&gt;4. Email privacy — noreply addresses only&lt;/h2&gt;\n&lt;p&gt;The policy: no commit in any dokimelabs repository carries a personal\nemail — author and committer are &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7qfi4euo\"&gt;&amp;lt;id&amp;gt;+&amp;lt;login&amp;gt;@users.noreply.github.com&lt;/code&gt;\n(or GitHub's own &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x4c5dtx5\"&gt;noreply@github.com&lt;/code&gt; web-flow identity). What GitHub can\nand cannot enforce on this plan, probed live:&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Server-side rejection of non-noreply pushes is not available.&lt;/strong&gt;\nGitHub's \"block command line pushes that expose my email\" toggle is a\nper-USER setting (each member enables it for their own account; the org\ncannot mandate it). Org-level rulesets answer 403 on the free plan\n(\"Upgrade to GitHub Team\" — verified), and the rule that would carry the\npolicy (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nt1xvcky\"&gt;commit_author_email_pattern&lt;/code&gt;, a metadata restriction) requires\nGitHub Enterprise even above Team. The upgrade-day call, ready to run:\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o83p5w60\"&gt;POST /orgs/dokimelabs/rulesets&lt;/code&gt; with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5y9cmk0i\"&gt;target: branch&lt;/code&gt;, all repos/refs,\nand a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hx4x0c4t\"&gt;commit_author_email_pattern&lt;/code&gt; rule\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1z9810uw\"&gt;operator: ends_with, pattern: \"@users.noreply.github.com\"&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Enforcement therefore lives at the ingress points&lt;/strong&gt;, which this\nrepository controls completely: the operator's pushes use the repo-local\npinned noreply identity (uniform across all history — re-verified after\nthe message rewrite); the ONLY other write path is the fork-merge bot,\nwhose email gate refuses &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p52eij1d\"&gt;/merge&lt;/code&gt; while any PR commit carries a\nnon-noreply author or committer email, with the fix named in the\nrefusal (enable \"keep my email addresses private\", rewrite the branch,\nforce-push the fork).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Detection backs prevention&lt;/strong&gt;: ci.yml's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-86u62tqy\"&gt;email-policy&lt;/code&gt; job fails the\nbuild if a non-noreply email ever lands on &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nlhkrabn\"&gt;main&lt;/code&gt; — the drift alarm for\nmisconfigured operator clones.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"5-attribution-models-assist,-they-do-not-co-author\"&gt;&lt;a href=\"en/17-collaboration.html#5-attribution-models-assist,-they-do-not-co-author\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Attribution — models assist, they do not co-author&lt;/span&gt;&lt;/a&gt;5. Attribution — models assist, they do not co-author&lt;/h2&gt;\n&lt;p&gt;Squash messages composed by the fork-merge bot rewrite any\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0dtsxqfc\"&gt;Co-Authored-By:&lt;/code&gt; trailer naming a model assistant (Claude, Codex,\nCopilot, Gemini, Cursor, Devin, Aider, …) into the &lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s26kaf7v\"&gt;Assisted-By:&lt;/code&gt;&lt;/strong&gt;\nform, one line per distinct assistant — aligned with the emerging\ndisclosure conventions that reserve authorship for accountable persons\nwhile keeping the assistance disclosed. Human co-author trailers pass\nthrough untouched; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-84js0wx2\"&gt;Claude-Session:&lt;/code&gt; links are dropped (they point at\nprivate sessions and are meaningless to readers of a public history).\nThe repo's own history follows the same law: the message rewrite that\nnormalized it removed model co-author trailers wholesale, and new\noperator commits carry none.&lt;/p&gt;\n&lt;h2 id=\"6-issue-ops-comment-verbs-on-issues\"&gt;&lt;a href=\"en/17-collaboration.html#6-issue-ops-comment-verbs-on-issues\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Issue-ops — comment verbs on issues&lt;/span&gt;&lt;/a&gt;6. Issue-ops — comment verbs on issues&lt;/h2&gt;\n&lt;p&gt;The /merge model extended to issues: members hold read on code (the §1\npolicy) plus the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xnqg8nmq\"&gt;triage&lt;/code&gt; repository role (issue management, zero code\nwrite), and the audited verbs below ride &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vbswy580\"&gt;.github/workflows/issue-ops.yml&lt;/code&gt;\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6zdbu2f7\"&gt;issue_comment&lt;/code&gt;-triggered, /merge-gated: org membership checked, refusals\nname the missing right, acks are 👍 reactions). The comment trail is the\nsystem of record for commitments and hours.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Verb&lt;/th&gt;\n&lt;th&gt;Who&lt;/th&gt;\n&lt;th&gt;Effect&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t6t4tn8w\"&gt;/assign [@user]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;any org member&lt;/td&gt;\n&lt;td&gt;self-claim (the commitment moment) or assign any member&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g9r3pzx2\"&gt;/unassign [@user]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;any org member&lt;/td&gt;\n&lt;td&gt;remove assignment&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zf4my4pa\"&gt;/label &amp;lt;l&amp;gt; [&amp;lt;l&amp;gt;…]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;any org member&lt;/td&gt;\n&lt;td&gt;labels from the seeded taxonomy ONLY — unknown names are refused (the vocabulary cannot drift by typo); clears &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y83ca4kb\"&gt;needs-triage&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gvy04yjw\"&gt;/estimate &amp;lt;N&amp;gt;h&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;any org member&lt;/td&gt;\n&lt;td&gt;sets the board's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hb6viuuo\"&gt;Estimate (h)&lt;/code&gt; and snaps the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d08zbt95\"&gt;size/*&lt;/code&gt; label UP into the enclosing bucket (3h→S, 5h→M, 9h→L; XL demands a split)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hzgg2ph1\"&gt;/spent &amp;lt;N&amp;gt;h&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;assignee or maintainer&lt;/td&gt;\n&lt;td&gt;ACCUMULATES into &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v0atq75z\"&gt;Spent (h)&lt;/code&gt;; the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1xfw8oo8\"&gt;⏱&lt;/code&gt; reply line is the audit and recovery source&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ayr2qqrz\"&gt;/due YYYY-MM-DD&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;any org member&lt;/td&gt;\n&lt;td&gt;sets the board's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qxex0prm\"&gt;Due&lt;/code&gt; (required on every &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rbyxc2jk\"&gt;commitment&lt;/code&gt;-labeled issue)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-urvdjdxx\"&gt;/close&lt;/code&gt; · &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-478ko8lb\"&gt;/reopen&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;assignee or maintainer&lt;/td&gt;\n&lt;td&gt;state moves&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4i4iypr9\"&gt;/commands&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;anyone&lt;/td&gt;\n&lt;td&gt;replies with this table&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Mechanics: issue mutations ride the workflow's own &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6vt4n1cw\"&gt;github.token&lt;/code&gt;\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i8ho4hsx\"&gt;issues: write&lt;/code&gt;, declared per job); board-field writes ride the\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l8kvmz48\"&gt;PROJECT_TOKEN&lt;/code&gt; secret (fine-grained: org projects read+write plus\ntheia-dev issues read, nothing else — gate-verified before install, the\n§16-token discipline applied to people-facing automation). With the\nsecret absent the verbs still work and the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ugh4olp\"&gt;⏱&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pxtom0mf\"&gt;📅&lt;/code&gt; reply lines carry the\ndata — the field lags, honestly. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3sw2mc3t\"&gt;/help&lt;/code&gt; is deliberately unclaimed: the\nProw dialect (the most widely known comment-ops vocabulary) uses it to\napply the help-wanted label, so claiming it for documentation would\nmislead exactly the contributors most familiar with the pattern.&lt;/p&gt;\n&lt;p&gt;One field is a deliberate mirror: the board's single-select &lt;strong&gt;Area&lt;/strong&gt;\nduplicates the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7k3ugpfk\"&gt;area/*&lt;/code&gt; label ONLY because table views cannot group by\nthe multi-value Labels field (and views have no API to script around\nit). The label stays the source of truth; the mirror is machine-owned —\nsynced on every &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k1pk2hiu\"&gt;labeled&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ftmkt8aa\"&gt;unlabeled&lt;/code&gt; event and re-swept weekly by the\ndigest job — so it can never drift by hand.&lt;/p&gt;\n&lt;p&gt;A weekly digest workflow posts velocity (Σ Estimate of non-retro issues\nclosed in the window), hours logged (the window's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-enzo4k0o\"&gt;⏱&lt;/code&gt; lines), the open\ncommitment register with overdue flags, and the per-area costbook to the\npinned digest issue — velocity and engineering-hours as standing numbers,\nnot a report someone remembers to write.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/17-collaboration.html","hreflang":"en"}],"style":["_assets/theia.css"],"canonical":"en/17-collaboration.html","vcsPath":"en/17-collaboration.md"},"headings":[{"title":"1. The model","href":"en/17-collaboration.html#1-the-model","level":2},{"title":"2. Artifact repositories — no history, no collaboration","href":"en/17-collaboration.html#2-artifact-repositories-no-history,-no-collaboration","level":2},{"title":"3. Release immutability on this plan","href":"en/17-collaboration.html#3-release-immutability-on-this-plan","level":2},{"title":"4. Email privacy — noreply addresses only","href":"en/17-collaboration.html#4-email-privacy-noreply-addresses-only","level":2},{"title":"5. Attribution — models assist, they do not co-author","href":"en/17-collaboration.html#5-attribution-models-assist,-they-do-not-co-author","level":2},{"title":"6. Issue-ops — comment verbs on issues","href":"en/17-collaboration.html#6-issue-ops-comment-verbs-on-issues","level":2}],"title":"Collaboration — forks, the merge gate, artifact repositories"},"router":{"pathname":"en/17-collaboration","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
