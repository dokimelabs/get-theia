        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"1-the-failure-this-closes\"&gt;&lt;a href=\"en/05-codebase-model.html#1-the-failure-this-closes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The failure this closes&lt;/span&gt;&lt;/a&gt;1. The failure this closes&lt;/h2&gt;\n&lt;p&gt;An agent exploring a repository at runtime rebuilds a different mental model\nevery run, spends 4–130× the tokens of a precomputed map, and still ships a\ncharacteristic defect family: it modifies 2 of 4 query paths that read a\nfield, forgets the dependent view, guesses an interface contract, invents a\ncolumn (AOCI's 39 defects across 19 tasks vs 0 with an index; every cluster\nreproduced across stacks). Lexical search compounds it — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1rh6wn3z\"&gt;grep Search&lt;/code&gt; cannot\ntell the class from the free function from the comment (InfCode's motivating\nambiguity), and the miss rate grows with the languages in play. The\n&lt;strong&gt;codebase model&lt;/strong&gt; is Aletheia's precomputed, incrementally fresh,\nhash-verified answer: three tiers, one per failure mode.&lt;/p&gt;\n&lt;h2 id=\"2-the-three-tiers\"&gt;&lt;a href=\"en/05-codebase-model.html#2-the-three-tiers\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. The three tiers&lt;/span&gt;&lt;/a&gt;2. The three tiers&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Tier&lt;/th&gt;\n&lt;th&gt;Content&lt;/th&gt;\n&lt;th&gt;Producer&lt;/th&gt;\n&lt;th&gt;Determinism&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Intent index&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;one entry per code unit (file / DB table / config): symbolic tag + semantic elements&lt;/td&gt;\n&lt;td&gt;LLM via gateway&lt;/td&gt;\n&lt;td&gt;stable across runs (same inputs ⇒ same entry, replayable)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;AST facts&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;symbols, definitions, references, inheritance/call/containment edges, signatures&lt;/td&gt;\n&lt;td&gt;tree-sitter, per language&lt;/td&gt;\n&lt;td&gt;fully deterministic, no LLM&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Embedding lane&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;vectors over intent entries + code chunks&lt;/td&gt;\n&lt;td&gt;embedding transport&lt;/td&gt;\n&lt;td&gt;deterministic per (model, dims, text)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Intent entry shape&lt;/strong&gt; (AOCI, adopted with its ablation as the budget law):\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y9fan7u1\"&gt;path[TAG]: F:role | R:related-paths | A:api | S:synopsis&lt;/code&gt;, where the tag\npacks architectural layer, business module, importance (the 9/8/7/5/3/1\nscale), tech markers, and size; importance scales the token budget (core\nfiles 80–150 tokens, peripheral 20–40). The &lt;strong&gt;S element gets the budget&lt;/strong&gt; —\ndesign decisions, invariants, fallback logic, encryption/transaction notes —\nbecause removing it cost −20.1pp overall and −33pp on cross-file \"how\"\nquestions, the largest single-component effect AOCI measured; R (explicit\nrelations) is what dependency enumeration rides on (−20pp on \"what\" without\nit). Entries are &lt;strong&gt;mutually independent&lt;/strong&gt; — R holds path references, never\nembedded content — which is what makes maintenance O(1) per changed file.\nDatabase tables get their own entries (domain/type/scale/features + field\nnotes): schema-blindness was one of the four measured defect clusters.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Entry acceptance is guidance-plus-nets.&lt;/strong&gt; The indexer prompt carries the\nlength guidance (word budgets by importance, \"aim under 1200 chars for S\")\nand the schema enforces hard caps at ~5× that guidance — the first\ncustomer index dropped 25 of 987 CORRECT replies at a strict seam (a\n727-line aggregate root died 262 chars over a cap inside regular answer\nvariance; each hole later cost ~$5 of a session hand-reading the\nunindexed file against $0.10 at build). Three acceptance mechanisms, all\nobservable and none silent: (1) unknown reply keys are &lt;strong&gt;stripped&lt;/strong&gt;, never\na rejection — the seven known fields still validate strictly, so nothing\nunvalidated passes; (2) off-scale importance snaps DOWN to the nearest\nlegal value; (3) every reply crosses the &lt;strong&gt;JSON healer&lt;/strong&gt;\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-77ypygi8\"&gt;@theia/json-repair&lt;/code&gt; — context-aware tolerant parsing for fences,\nunescaped inner quotes, truncation) before the schema, with healed writes\ncounted on the build report, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9yfftwd5\"&gt;index.build&lt;/code&gt; audit event, and a\ntelemetry counter. The nets stay real: a runaway blob still refuses.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;The index is complete by contract.&lt;/strong&gt; An indexer call whose file trips a\nprohibited-content detector is &lt;strong&gt;masked, not blocked&lt;/strong&gt; — the gateway\nreplaces the span with its placeholder and proceeds, counts visible on the\naudit event (the one named exception to THE-014, marked CONCEPT-CHANGE:\na blocked intent call leaves a permanent map hole while the secret stays\non this machine either way). Granular per-class control arrives with the\nPII redesign (&lt;a href=\"en/13-roadmap.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-niklf89j\"&gt;13-roadmap.md&lt;/code&gt;&lt;/a&gt;).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;AST facts&lt;/strong&gt; close the intent tier's measured weakness — verbatim identifier\nenumeration is lossy under semantic compression — with deterministic query\ntools exposed to agents and MCP hosts: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g7j7vrve\"&gt;find_symbol&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rd0u1ycq\"&gt;list_references&lt;/code&gt;,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8pj2szht\"&gt;inheritance_chain&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tra3yfub\"&gt;call_graph(fn)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ir8jp3sa\"&gt;signature(fn)&lt;/code&gt; (InfCode's toolset,\ngeneralized across tree-sitter grammars — shipped languages: TypeScript/TSX/JavaScript, Python, Go, Java, Kotlin, C, C++, C#, Objective-C, Swift,\nBash-family shell, and SQL). &lt;strong&gt;SQL is the hybrid arm&lt;/strong&gt;: real T-SQL defeats\nits grammar exactly at the definition headers (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yq49npvq\"&gt;CREATE OR ALTER PROCEDURE [dbo].[X] @p …&lt;/code&gt; errors out; an SSMS schema dump parsed 0 of 418 tables),\nso tables/views/procedures/functions and their referenced tables come from\na deterministic comment- and string-stripped header scan beside the tree\nwalk — schema scripts, migrations, and stored procedures land in the\nintent index and the symbol lane like any code file (schema blindness is\none of the four measured defect clusters). A richer external T-SQL parser\n(sqruff / sqlparser-rs class) is deferred, optional\n(&lt;a href=\"en/13-roadmap.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5qoh6iyf\"&gt;13-roadmap.md&lt;/code&gt;&lt;/a&gt;). InfCode's ablations carry the\nreceipt: −8.5pp resolution without AST search, −6.2pp without intent\nretrieval, and +17 average agent turns without both — the tools pay in\ntokens even before accuracy.&lt;/p&gt;\n&lt;h2 id=\"3-freshness-the-incremental-contract-a5\"&gt;&lt;a href=\"en/05-codebase-model.html#3-freshness-the-incremental-contract-a5\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Freshness — the incremental contract (A5)&lt;/span&gt;&lt;/a&gt;3. Freshness — the incremental contract (A5)&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Each entry records &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-88t78hp2\"&gt;(content_hash, builder_version, prompt_hash)&lt;/code&gt;;\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2r2z175h\"&gt;theia index&lt;/code&gt; diffs hashes and regenerates exactly the changed entries —\nnever a whole-repo rebuild on the hot path.&lt;/li&gt;\n&lt;li&gt;Entry batches publish as a generation behind the head\n(&lt;a href=\"en/03-storage.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nlumd1nw\"&gt;03-storage.md §4&lt;/code&gt;&lt;/a&gt;); a crashed build is invisible.&lt;/li&gt;\n&lt;li&gt;A level-triggered reconciler sweeps drift (renames, deleted files, builder\nupgrades) and repairs by diff — the \"index–code divergence erodes\neverything\" failure AOCI's platform section names is closed structurally. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i6lv3l00\"&gt;theia serve&lt;/code&gt;\nruns this loop: a periodic zero-model freshness check, budget-capped\nrebuild under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pfgxvt6g\"&gt;indexPolicy: auto&lt;/code&gt;, and a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tfmsoahp\"&gt;staleness&lt;/code&gt; field on search\nreplies so host models KNOW when the map lags.&lt;/li&gt;\n&lt;li&gt;Git integration: post-commit/worktree hooks mark dirty paths\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kazm3lju\"&gt;theia hooks install git&lt;/code&gt;; the marks are a hint the differ reports —\nthe hash-diff stays the truth); the CI mode fails when the committed index head lags the tree\n(freshness as a measurable property — A19).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"4-retrieval-over-the-model\"&gt;&lt;a href=\"en/05-codebase-model.html#4-retrieval-over-the-model\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Retrieval over the model&lt;/span&gt;&lt;/a&gt;4. Retrieval over the model&lt;/h2&gt;\n&lt;p&gt;Queries union the tiers, never trust one: intent-entry recall (lexical +\nvector) locates the subsystem; AST facts resolve the symbols precisely;\nchunk-level embeddings serve \"how is X implemented\" verbatim needs. The union&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;rerank doctrine, budgets, and consensus rules follow the memory engine's\nmeasured laws (&lt;a href=\"en/07-memory.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t19utgk8\"&gt;07-memory.md §5&lt;/code&gt;&lt;/a&gt;) — the codebase model is a\ncorpus like any other to the retrieval layer, with one addition: &lt;strong&gt;structure\nis routing, never evidence&lt;/strong&gt; — a summary hit fans out to its members, and\nonly leaf content enters answers (the SKWH descent law).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;Two presentation laws govern what leaves the retrieval surfaces: &lt;strong&gt;hits\ncarry the full entry&lt;/strong&gt; (F, R, A, S plus the layer/module/importance\ncoordinates, on the MCP tool and the CLI verb alike — R is the measured\ndependency-enumeration carrier, and a score-plus-role line sends the\nreader straight back to grep), and &lt;strong&gt;the map travels with its decode\nkey&lt;/strong&gt; — every surface that hands blueprint lines to a model prepends\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bzgmadtw\"&gt;BLUEPRINT_LEGEND&lt;/code&gt; (an AOCI index is \"encoding rules followed by entries\";\nencoded lines without the rules ask the reader to guess the vocabulary).&lt;/p&gt;\n&lt;h2 id=\"5-consumers\"&gt;&lt;a href=\"en/05-codebase-model.html#5-consumers\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Consumers&lt;/span&gt;&lt;/a&gt;5. Consumers&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Kernel roles&lt;/strong&gt; receive the COMPLETE blueprint (legend + every entry,\nown root first in multi-root runs) in the stable span of every dispatch\nprompt — provider prefix caching pays for it after round one\n(&lt;a href=\"en/04-model-gateway.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-adl7h50m\"&gt;04-model-gateway.md §7&lt;/code&gt;&lt;/a&gt;), and the injected-\ncontext alert stays the loud guard on pathological sizes. &lt;strong&gt;Plan mode\ngets the same dose&lt;/strong&gt; (run/plan parity, 2026-09-07): the planner's\nblueprint block and its &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ku0nfl2p\"&gt;kind: Context&lt;/code&gt; entries load whole into the\ncontent-hashed spec — the old 3,900/4,000-char cuts fed the planner ~1%\nof the map the roles execute against, and a truncated spec lied about\nwhat the approval digest attested. Where a complete multi-root map\nexceeds the model window (a 13-root production workspace rendered 3.8M\nchars ≈ 950K tokens — physically undispatchable), the operator sets\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m3p6chll\"&gt;run.blueprintMinImportance&lt;/code&gt;: entries below the floor leave the\ninjected map with a loud count line — the AOCI importance backbone,\nevery root still represented — while the belt tools reach every entry\non demand. AST tools ride the MCP belt on demand. A task-scoped\nprojection (touched entries + R-closure + the importance backbone) is\nthe queued intelligent successor (&lt;a href=\"en/13-roadmap.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-31m0g067\"&gt;13-roadmap.md&lt;/code&gt;&lt;/a&gt;) —\nit must beat the complete map on a receipt, not on intuition, because\nAOCI's defect clusters all trace to partial views.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Claude Code / Codex sessions&lt;/strong&gt; get the map through MCP tools and hooks\n(&lt;a href=\"en/10-integrations.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2jg3zpxb\"&gt;10-integrations.md&lt;/code&gt;&lt;/a&gt;) — the AOCI \"global context\nlayer beneath an agent pipeline\" hybrid, which their paper names as the\nnatural next step and never built.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The memory engine&lt;/strong&gt; links facts to code units by entry id, so \"why does\nthis module exist\" answers survive refactors (rename ⇒ entry id stable,\ncontent hash changes).&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/05-codebase-model.html","hreflang":"en"}],"style":["_assets/theia.css","_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"canonical":"en/05-codebase-model.html","vcsPath":"en/05-codebase-model.md"},"headings":[{"title":"1. The failure this closes","href":"en/05-codebase-model.html#1-the-failure-this-closes","level":2},{"title":"2. The three tiers","href":"en/05-codebase-model.html#2-the-three-tiers","level":2},{"title":"3. Freshness — the incremental contract (A5)","href":"en/05-codebase-model.html#3-freshness-the-incremental-contract-a5","level":2},{"title":"4. Retrieval over the model","href":"en/05-codebase-model.html#4-retrieval-over-the-model","level":2},{"title":"5. Consumers","href":"en/05-codebase-model.html#5-consumers","level":2}],"title":"Codebase model — intent index, AST facts, embeddings"},"router":{"pathname":"en/05-codebase-model","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
