        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"1-the-failure-this-closes\"&gt;&lt;a href=\"en/03-storage.html#1-the-failure-this-closes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The failure this closes&lt;/span&gt;&lt;/a&gt;1. The failure this closes&lt;/h2&gt;\n&lt;p&gt;Agent platforms scatter truth across a vector DB, a document store, a cache,\nand prompt-side summaries — then drift: the fresh fact is not yet embedded,\nthe deleted fact still ranks, the \"current\" summary describes last week, and\nnobody can say what the system believed when it made a decision. Temporal\ncorrectness has named bug classes even in mature databases — the\n&lt;strong&gt;aggregation gap&lt;/strong&gt; (empty snapshots silently vanish from aggregates: \"no SP\nworker on duty between 00 and 03\" never appears) and the &lt;strong&gt;bag-difference\nbug&lt;/strong&gt; — that every ad-hoc timeline implementation re-commits (bag-, Table 1:\nsix published systems, none free of both). Aletheia's storage plane fixes the\ntopology (one SoT, everything else derived) and adopts the temporal\ncorrectness contract wholesale.&lt;/p&gt;\n&lt;h2 id=\"2-topology\"&gt;&lt;a href=\"en/03-storage.html#2-topology\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Topology&lt;/span&gt;&lt;/a&gt;2. Topology&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Tier&lt;/th&gt;\n&lt;th&gt;Technology&lt;/th&gt;\n&lt;th&gt;Role&lt;/th&gt;\n&lt;th&gt;Mutability&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Source of truth&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;SQLite (WAL)&lt;/td&gt;\n&lt;td&gt;event logs, canonical rows (facts, runs, entries), generation catalog, heads&lt;/td&gt;\n&lt;td&gt;append + interval-close only&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Derived indexes&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;FAISS (HNSW cosine), BM25 (lexical), SQLite projections&lt;/td&gt;\n&lt;td&gt;retrieval acceleration&lt;/td&gt;\n&lt;td&gt;generation-swapped, rebuildable&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Blobs&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;content-addressed files under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-etqrs1vn\"&gt;.theia/objects/&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;artifacts, chunks, index shards&lt;/td&gt;\n&lt;td&gt;immutable&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;All three sit behind &lt;strong&gt;storage interfaces&lt;/strong&gt; in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cm521ogx\"&gt;packages/schema&lt;/code&gt; — the seam\nexists because the recurring change is \"another backend\" (D2): the planned\nPostgres deployment (multi-user; local stores become cooperative in-progress\nstate) swaps &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0kdp15ed\"&gt;store-sqlite&lt;/code&gt; without touching engines (A15). The interface is\ncapability-shaped (event log, row store, vector index, lexical index, blob\nstore); the sqlite backend's behavioral tests double as the conformance\nsuite a second backend must pass — the artifact-that-runs discipline\napplied to the seam itself.&lt;/p&gt;\n&lt;h2 id=\"3-hash-addressing-change-detection-you-can-trust\"&gt;&lt;a href=\"en/03-storage.html#3-hash-addressing-change-detection-you-can-trust\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Hash addressing — change detection you can trust&lt;/span&gt;&lt;/a&gt;3. Hash addressing — change detection you can trust&lt;/h2&gt;\n&lt;p&gt;Every derived artifact records the digests of its inputs; every blob is named\nby its own digest (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wwh5iusm\"&gt;objects/sha256/&amp;lt;2&amp;gt;/&amp;lt;62&amp;gt;&lt;/code&gt;).&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;An &lt;strong&gt;intent-index entry&lt;/strong&gt;'s key inputs are the file's content hash + the\nbuilder version + the prompt hash — if none changed, the entry is provably\ncurrent with zero model calls (AOCI's O(1) incremental maintenance made\nmechanical, A5).&lt;/li&gt;\n&lt;li&gt;An &lt;strong&gt;index generation&lt;/strong&gt; records the set-hash of its member row digests —\nthe reconciler's diff is a hash compare, not a scan.&lt;/li&gt;\n&lt;li&gt;The &lt;strong&gt;event log&lt;/strong&gt; is hash-chained (each event carries &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-an6680ey\"&gt;prev_digest&lt;/code&gt;) —\ntamper-evidence for the audit chain (&lt;a href=\"en/09-observability.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4bw3f26c\"&gt;09-observability.md §4&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;Embedding rows record &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ka10slz\"&gt;(provider, model, dims)&lt;/code&gt; — a dimension or provider\nchange is a new generation, never an in-place re-embed (A21).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"4-generations-and-heads-the-a1-contract,-storage-view\"&gt;&lt;a href=\"en/03-storage.html#4-generations-and-heads-the-a1-contract,-storage-view\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Generations and heads (the A1 contract, storage view)&lt;/span&gt;&lt;/a&gt;4. Generations and heads (the A1 contract, storage view)&lt;/h2&gt;\n&lt;p&gt;The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7m2nfelr\"&gt;generations&lt;/code&gt; catalog is one table: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-73ep5yvv\"&gt;(gen_id terryid, concern, builder_version, input_digest, status, created_at)&lt;/code&gt;; per-concern &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-999n793m\"&gt;heads&lt;/code&gt; hold the served\npointer. Index shards, tree summaries, graph edges, and Σ snapshots all carry\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tkv39n86\"&gt;build_gen&lt;/code&gt; and nullable &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v0n3w01u\"&gt;delete_gen&lt;/code&gt;; a reader at head H sees\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y3xtb6tr\"&gt;build_gen ≤ H AND (delete_gen IS NULL OR delete_gen &amp;gt; H)&lt;/code&gt; — the tombstone\nlifecycle that made the Fidant edge build atomic (verified there: head\nmonotonic, zero double-live), generalized to every derived surface. Publish is\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l72ocnsv\"&gt;UPDATE heads SET gen=? WHERE concern=? AND gen=?&lt;/code&gt; — one OCC compare-and-set;\nGC collects orphans level-triggered. FAISS shards are immutable files named by\ngeneration: the vector index for gen N is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uqi3yet5\"&gt;objects/…/faiss-&amp;lt;concern&amp;gt;-&amp;lt;gen&amp;gt;&lt;/code&gt;;\n\"updating\" the index means building a new shard set and flipping the head —\nMV-PBT's append-only partition discipline at file granularity, which also\nmakes index corruption impossible by construction (a crash leaves an\nunreferenced file).&lt;/p&gt;\n&lt;h2 id=\"5-temporal-semantics-snapshot-reducibility-as-the-spec\"&gt;&lt;a href=\"en/03-storage.html#5-temporal-semantics-snapshot-reducibility-as-the-spec\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Temporal semantics — snapshot reducibility as the spec&lt;/span&gt;&lt;/a&gt;5. Temporal semantics — snapshot reducibility as the spec&lt;/h2&gt;\n&lt;p&gt;Interval-stamped rows (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9p8a33uk\"&gt;[valid_from, valid_to)&lt;/code&gt; in HLC space) + the\ngeneration head give Aletheia a bitemporal store: &lt;em&gt;event time&lt;/em&gt; (what was true\nof the world) and &lt;em&gt;system time&lt;/em&gt; (what Aletheia believed — the HLC of the\nrecording event), kept separate exactly as MemForest separates source-time\nfrom event-time and bag- separates the axes.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;The contract (bag-, adopted as law):&lt;/strong&gt;&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Snapshot reducibility.&lt;/strong&gt; For any supported temporal query Q and time t:\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3prw1mx1\"&gt;snap_t(Q(temporal relations)) = Q(snap_t(relations))&lt;/code&gt;. This single\nequation is the spec; the golden test suite instantiates it per operator.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;No aggregation gaps.&lt;/strong&gt; Aggregates over periods with empty input yield\nrows (count = 0 with their interval) — the AG bug class is tested for by\nconstruction, with bag-'s worked example as the fixture.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Unique encoding.&lt;/strong&gt; Query results coalesce adjacent intervals with equal\nannotations (K-coalescing), so two equivalent stores render byte-identical\nanswers — a determinism requirement, not aesthetics (A22).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Implementation shape.&lt;/strong&gt; Rows carry &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1bnw51kv\"&gt;[valid_from, valid_to)&lt;/code&gt; interval\ncolumns; as-of reads admit by the cut (index generations carry interval\nsidecars so vector/lexical lanes filter before load, and the load step\nre-checks the DB — the truth for post-build supersessions). bag-'s SQL\nrewriting templates (change-point extraction + window functions) are the\nadopted implementation path for richer temporal operators (interval\naggregation, coalesced projections) as they land.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;strong&gt;What this buys, concretely:&lt;/strong&gt; \"which constraints did the run see when it\napproved the plan?\" is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1uw3sufm\"&gt;memory AS OF run.plan_approved_hlc&lt;/code&gt;; \"when did we\nbelieve X?\" is an interval query; a post-incident replay reads the store the\nrun actually read. MemForest's admitted gap — no MVCC, ingest blocks queries\nbehind a process lock — is closed by reading through (head, HLC) pairs:\nwriters append, readers see the last published cut, and nobody blocks anybody.&lt;/p&gt;\n&lt;h2 id=\"6-write-path-law\"&gt;&lt;a href=\"en/03-storage.html#6-write-path-law\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Write-path law&lt;/span&gt;&lt;/a&gt;6. Write-path law&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Repos are the only SQL homes; engines own transactions via &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qyejtb6a\"&gt;withTx&lt;/code&gt;\n(closure-scoped — a tx cannot leak).&lt;/li&gt;\n&lt;li&gt;Every retriable write derives its idempotency key from business identity\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jxn892ic\"&gt;digest(kind, subject, gen)&lt;/code&gt;), checked in the same tx — replays converge\n(cloud-billing Operation pattern).&lt;/li&gt;\n&lt;li&gt;Rows with ≥3 lifecycle states get an FSM transition table + guard walked\nby a test (P6); status writes route through the guard.&lt;/li&gt;\n&lt;li&gt;Blobs upload before the tx that references them — a failure leaves GC-able\ngarbage, never a row without bytes.&lt;/li&gt;\n&lt;li&gt;Deletes are interval-closes or tombstones; physical deletion is GC's job,\nafter the audit retention window (&lt;a href=\"en/11-governance.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cebbvglx\"&gt;11-governance.md&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/03-storage.html","hreflang":"en"}],"style":["_assets/theia.css"],"canonical":"en/03-storage.html","vcsPath":"en/03-storage.md"},"headings":[{"title":"1. The failure this closes","href":"en/03-storage.html#1-the-failure-this-closes","level":2},{"title":"2. Topology","href":"en/03-storage.html#2-topology","level":2},{"title":"3. Hash addressing — change detection you can trust","href":"en/03-storage.html#3-hash-addressing-change-detection-you-can-trust","level":2},{"title":"4. Generations and heads (the A1 contract, storage view)","href":"en/03-storage.html#4-generations-and-heads-the-a1-contract,-storage-view","level":2},{"title":"5. Temporal semantics — snapshot reducibility as the spec","href":"en/03-storage.html#5-temporal-semantics-snapshot-reducibility-as-the-spec","level":2},{"title":"6. Write-path law","href":"en/03-storage.html#6-write-path-law","level":2}],"title":"Storage — SQLite SoT, derived indexes, hash addressing, temporal semantics"},"router":{"pathname":"en/03-storage","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
