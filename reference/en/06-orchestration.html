            {"data":{"leading":false,"html":"&lt;h2 id=\"1-the-failure-this-closes\"&gt;&lt;a href=\"en/06-orchestration.html#1-the-failure-this-closes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The failure this closes&lt;/span&gt;&lt;/a&gt;1. The failure this closes&lt;/h2&gt;\n&lt;p&gt;Flat agent loops fail three ways at once: the transcript outgrows the window\nand poisons decisions (0.90 → 0.74 accuracy over horizon, 0.53 under noise —\nSKILL.state), early goals drift out of scope and the agent loops on a blocked\nstation forever (ReCAP's ReAct traces; a 250k-token run repeating one\nhypothesis line 7,743 times — ledger §4.2), and free-form multi-agent systems\nadd their own anomaly classes — infinite delegation chains, premature stops,\nzombie children, emergent message storms (ReDel's taxonomy, confirmed by the\nAgentOps survey). The kernel answers with &lt;em&gt;owned coordination over bounded\nstate&lt;/em&gt;: one coordinator, an event-sourced phase FSM, stateless role pools,\ntyped verdicts, and a planning state that never grows with the transcript.&lt;/p&gt;\n&lt;h2 id=\"2-the-kernel-shape-a8\"&gt;&lt;a href=\"en/06-orchestration.html#2-the-kernel-shape-a8\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. The kernel shape (A8)&lt;/span&gt;&lt;/a&gt;2. The kernel shape (A8)&lt;/h2&gt;\n&lt;div class=\"mermaid\" data-content=\"flowchart%20LR%0A%20%20%20%20classDef%20core%20fill%3A%23dbeafe%2Cstroke%3A%231d4ed8%2Ccolor%3A%23111%0A%20%20%20%20classDef%20pool%20fill%3A%23dcfce7%2Cstroke%3A%2315803d%2Ccolor%3A%23111%0A%20%20%20%20classDef%20store%20fill%3A%23fef9c3%2Cstroke%3A%23a16207%2Ccolor%3A%23111%0A%0A%20%20%20%20LOG%5B(%22run%20event%20log%3Cbr%2F%3E(hash-chained%2C%20terryid-ordered)%22)%5D%3A%3A%3Astore%0A%20%20%20%20SIG%5B(%22%CE%A3%20%2B%20plan%20DAG%3Cbr%2F%3E(derived%2C%20replayable)%22)%5D%3A%3A%3Astore%0A%20%20%20%20C%5B%22coordinator%3Cbr%2F%3Eowns%20ALL%20run%20state%20%E2%80%94%20no%20locks%3B%3Cbr%2F%3Eadvances%20FSM%20on%20each%20verdict%3B%3Cbr%2F%3Edispatches%20the%20ready%20frontier%22%5D%3A%3A%3Acore%0A%20%20%20%20P1%5B%22role%20pool%3A%20planner%22%5D%3A%3A%3Apool%0A%20%20%20%20P2%5B%22role%20pool%3A%20implementer%22%5D%3A%3A%3Apool%0A%20%20%20%20P3%5B%22role%20pool%3A%20reviewer%22%5D%3A%3A%3Apool%0A%20%20%20%20P4%5B%22role%20pool%3A%20verifier%22%5D%3A%3A%3Apool%0A%20%20%20%20P5%5B%22role%20pool%3A%20arbiter%22%5D%3A%3A%3Apool%0A%0A%20%20%20%20C%20--%20%22Job%20(fresh%20context%3A%3Cbr%2F%3Espec%20%2B%20%CE%A3-projection%20%2B%20task)%22%20--%3E%20P1%20%26%20P2%20%26%20P3%20%26%20P4%20%26%20P5%0A%20%20%20%20P1%20%26%20P2%20%26%20P3%20%26%20P4%20%26%20P5%20--%20%22typed%20verdict%20%2B%20%E2%88%86%CE%A3%20patch%20%2B%20evidence%22%20--%3E%20C%0A%20%20%20%20C%20--%20append%20--%3E%20LOG%0A%20%20%20%20LOG%20--%20replay%2Ffold%20--%3E%20SIG%0A\"&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;The contract, numbered:&lt;/strong&gt;&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;A single &lt;strong&gt;coordinator&lt;/strong&gt; per run owns all ticket/task state — there are no\nlocks because there is no sharing (overseer's scheduler law). Pools are\nstateless: they run a harness job to a recognized verdict and reply on one\nchannel; agents never touch run state directly.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Persisted state is the event log&lt;/strong&gt;; the phase of every task is a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uc334z43\"&gt;phase&lt;/code&gt;\nevent. Restart = replay. The in-memory dispatch map\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-npf4z5bs\"&gt;dispatchable | scheduled&lt;/code&gt;) is coordinator-only and rebuilt on boot.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Phases are an FSM as data&lt;/strong&gt; (P6): transition table + guard in\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s04rcxm5\"&gt;packages/kernel&lt;/code&gt;, walked by a test (every state reachable, no dangling\ntransitions). Ambiguity is a state (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-13yvwlfi\"&gt;uncertain&lt;/code&gt; outcomes get a\nreconciliation step, not a blind retry); invariant breach freezes the task\ninto an inspectable &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a1v1ummm\"&gt;escalated&lt;/code&gt; state with a repair path — never\nbest-effort continuation.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Verdicts are a closed vocabulary per role&lt;/strong&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-di5q2300\"&gt;packages/schema&lt;/code&gt;):\ne.g. implementer → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kofxwwut\"&gt;ready | cant_do | algedonic&lt;/code&gt;; reviewer →\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wx34alj8\"&gt;approve | rework | discard&lt;/code&gt;; verifier → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4vn9f2hi\"&gt;pass | fail(evidence)&lt;/code&gt;; arbiter\n→ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cb2ze2w7\"&gt;continue | escalate&lt;/code&gt;. The &lt;strong&gt;algedonic&lt;/strong&gt; verdict (overseer, from VSM) is\nthe systemic-trouble bypass: it skips review/merge and wakes the lead role\nfor a root-cause re-scope rather than another iteration.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Guards bound every loop&lt;/strong&gt;: round budgets per task, a no-progress guard\n(re-issuing the identical task halts the loop), a rescope budget\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3mp14jgr\"&gt;run.maxRescopes&lt;/code&gt; — a lead rescope resets the round budget only that\nmany times, then the guard forces discard), the &lt;strong&gt;dispatch-stall guard&lt;/strong&gt;\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l8izau1a\"&gt;run.stallPauseAfter&lt;/code&gt; consecutive &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rcx6y4sj\"&gt;no_progress&lt;/code&gt; outcomes — gateway\nfailures, off-contract replies — pause the run resumable with one\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lqvipoer\"&gt;dispatch_stalled&lt;/code&gt; anomaly, because the escalated↔no_progress cycle has\nno round-budget exit), wall/cost caps as policy values, and a cut-off\nsummarizer so a token-capped worker still reports (each guard exists\nbecause its absence was measured — ledger §1/§4).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;A &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v5m7041f\"&gt;planned&lt;/code&gt; verdict with no subtasks cannot silently kill a task.&lt;/strong&gt;\nThe planner's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ivn9eqan\"&gt;planned&lt;/code&gt; means \"I am decomposing\" and carries the\nsubtasks; a bare &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3oiwd7lz\"&gt;planned&lt;/code&gt; would end the task with a plan and no code —\nthe no-op the vendored planner law warns against. The coordinator\ncoerces a subtask-less &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qf82280q\"&gt;planned&lt;/code&gt; to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g08j2bjy\"&gt;ready&lt;/code&gt; (the plan is already in Σ;\nthe implementer acts on it) and raises a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-myasphr6\"&gt;planned_without_subtasks&lt;/code&gt;\nanomaly, so a mis-following planner is visible, never silent (P10 —\nmeasured live on an approved &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wse6gmnp\"&gt;--from-plan&lt;/code&gt; run whose full_spec tasks\nre-planned and self-terminated).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Off-contract replies are a repair case, never a verdict.&lt;/strong&gt; A reply that\nparses to no legal verdict gets ONE bounded repair naming the exact zod\npaths (or the legal verdict words) on the same harness session; a second\nmiss freezes the task naming both problems — a finished piece of work\nmust not read as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-skq8mfjq\"&gt;no_progress&lt;/code&gt; because its JSON wore prose (the $1.83/miss\nlive receipt, ledger §4).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"3-execution-state-s-a6\"&gt;&lt;a href=\"en/06-orchestration.html#3-execution-state-s-a6\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Execution state Σ (A6)&lt;/span&gt;&lt;/a&gt;3. Execution state Σ (A6)&lt;/h2&gt;\n&lt;p&gt;Σ is the run's typed working state — the DuMate tuple hardened by the\nSKILL.state runtime contract:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;Σ = ⟨ task context (goal, track, DoD — immutable),\n      plan DAG (nodes: subtasks with depth + status; edges: deps),\n      evidence base (artifact refs, verdicts, hashes — append-only),\n      guidance (persistent rubric + ephemeral rubric) ⟩\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"56\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-56\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-56\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-56.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Prompts carry (spec, Σ-projection, latest observation)&lt;/strong&gt; — never\ntranscripts. The projection is ReCAP's path discipline: the root→current\nplan path, the sibling summary, and the task-scoped evidence — O(depth),\nnot O(history). Intermediate reasoning is discarded after its ∆Σ patch is\nvalidated (bounded prompts: 16× token reduction at horizon 100, accuracy\nup, in SKILL.state's measurements).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;All mutation is validated patches.&lt;/strong&gt; A role returns ∆Σ; the kernel owns\nthe schema, validates, applies &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zbzegpeq\"&gt;Σ ⊕ ∆Σ&lt;/code&gt;, and rolls back invalid patches\nwith a retry — a malformed model output cannot corrupt state. The merge\noperator ⊕ (key-wise LWW by HLC, null = delete) is proved deterministic,\nidempotent, and convergent for concurrent key-disjoint patches in\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6x9kcy9j\"&gt;../proofs/state_merge.v&lt;/code&gt; (A7) — the exact gap\nSKILL.state names for multi-agent use.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Σ is derived state.&lt;/strong&gt; The event log remains the SoT; Σ is a fold over it\n(P7), which closes SKILL.state's own limitation list: late-relevance\nobservations and \"history is the deliverable\" tasks (audits, postmortems)\nread the log, not Σ.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Plan mutation is one operator.&lt;/strong&gt; Replanning is Π(plan, evidence,\nguidance) — it may expand, prune, or rewire &lt;em&gt;pending&lt;/em&gt; nodes; executed\nnodes are monotone and evidence is never recomputed (DuMate's law). Only\nthe &lt;strong&gt;ready frontier&lt;/strong&gt; (pending nodes with satisfied deps) is\ndispatchable; plan-ahead + head-execution + refine-on-return is the ReCAP\ncycle expressed on the DAG.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Rubrics steer and stop.&lt;/strong&gt; The persistent rubric (from goal + track) is\nthe quality scaffold every role sees; the ephemeral rubric is regenerated\nfrom the evidence base each cycle and doubles as the stopping predicate —\n\"no outstanding gap\" ends the loop (DuMate), bounded by the round budget.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Clarify — the needs_user arm.&lt;/strong&gt; A planning-authority role that\ncannot proceed without the human replies &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y4p2nxqx\"&gt;clarify&lt;/code&gt; with typed questions —\nnever a guess. The coordinator consults the injected interaction seam\nBEFORE the FSM: answered Q&amp;amp;A lands as a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yd7k3wrl\"&gt;user.note&lt;/code&gt; event, folds into Σ\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zg0qe2yq\"&gt;clarifications.&amp;lt;taskId&amp;gt;&lt;/code&gt;, accumulated), and becomes a memory fact so it\nis never asked twice; unanswered (non-interactive, no TTY, declined), the\ntask freezes to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l1cbco01\"&gt;escalated&lt;/code&gt; with the questions on the verdict event and a\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fedkcnkj\"&gt;clarify_unanswered&lt;/code&gt; anomaly — visible and resumable. The lead's next\ndispatch is TOLD nobody answered; a second consecutive unanswered\nclarify on the same task pauses the run resumable (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-frpw5oi2\"&gt;clarify_stalled&lt;/code&gt;) —\nthe clarify↔escalate spin has no round-budget exit, and an operator\ndecision is the only honest move left (the ~13-round live receipt,\nledger §1).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"4-roles\"&gt;&lt;a href=\"en/06-orchestration.html#4-roles\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Roles&lt;/span&gt;&lt;/a&gt;4. Roles&lt;/h2&gt;\n&lt;p&gt;Roles are intents, never harnesses (claudexor INV-010); the gateway routes\neach to a harness by policy. The standing set (per-role prompts user-editable\nin &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v5sqwxrl\"&gt;.theia/prompts/&lt;/code&gt; — &lt;a href=\"en/10-integrations.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lweshga4\"&gt;10-integrations.md §4&lt;/code&gt;&lt;/a&gt;):&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Role&lt;/th&gt;\n&lt;th&gt;Produces&lt;/th&gt;\n&lt;th&gt;Discipline&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;lead&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;task ops (new/update/replace/cancel), goal verdict, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-goru06kj\"&gt;accept&lt;/code&gt; (standing work certified verified-complete → the merge path, dependents unblock; refused without a verify_pass — the 34521 receipt: verified-done work discarded for want of the verb strands every dependent), verify rewrite on a rescope (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z08cj7y0\"&gt;\"verify\": […]&lt;/code&gt; replaces the task's commands — the broken-check lever, recorded on the audited verdict)&lt;/td&gt;\n&lt;td&gt;single planning authority; consumes escalations + algedonic wakes in batched context; rules OUT a broken check (aborted runs, missing frameworks in the verifier evidence) before rescoping the work&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;planner&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;plan.md / plan-DAG nodes&lt;/td&gt;\n&lt;td&gt;researches via the codebase model, not raw exploration&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;implementer&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;diffs + tests in an isolated worktree&lt;/td&gt;\n&lt;td&gt;fresh session per task (ralphex's context-degradation law); squash-rebase onto trunk&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;fresh-perspective implementer&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;independent attempt — no inherited worker notes, but &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gbew8ggh\"&gt;guidance.*&lt;/code&gt; directives (user steering, lead rescope direction) AND the task's rejecting-verdict feedback (last 3 notes, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3wztm4ln\"&gt;foldFeedback&lt;/code&gt; — live ≡ rehydrated by one shared fold) survive the strip&lt;/td&gt;\n&lt;td&gt;diversification against anchored-wrong-plan regressions (the ledger paper's own fix, adopted as a role); fresh of its own history, never deaf to the lead&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;reviewer&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;approve/rework/discard + cited evidence&lt;/td&gt;\n&lt;td&gt;level-k adversary (gr2): hunts the producer's known failure modes (the anomaly taxonomy as checklist), never judges plausibility (A12)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;verifier&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;pass/fail from EXECUTED tests&lt;/td&gt;\n&lt;td&gt;generates tests when none exist; its result is ground truth and overrides any \"done\" claim (ledger step-5 law; claudexor INV-043: tool success is evidence, not prose)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;merger&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;serial trunk integration&lt;/td&gt;\n&lt;td&gt;pool size 1; baseline-tests → merge → re-test; only the coordinator writes trunk&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;arbiter&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;continue/escalate on any disagreement&lt;/td&gt;\n&lt;td&gt;breaks review/merge ties&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;diagnostician&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;root-cause report&lt;/td&gt;\n&lt;td&gt;on repeated failure: KRCA narrowing over the trace tree + skeleton causal prior + per-modality evidence agents; results memorized with graph-fingerprint reuse (A13, A14)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"5-delegation-and-strategy\"&gt;&lt;a href=\"en/06-orchestration.html#5-delegation-and-strategy\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Delegation and strategy&lt;/span&gt;&lt;/a&gt;5. Delegation and strategy&lt;/h2&gt;\n&lt;p&gt;Delegation is a &lt;strong&gt;policy-bounded tool&lt;/strong&gt;, not model discretion (A8): a role\nmay request sub-runs (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-99qhgtbv\"&gt;delegate&lt;/code&gt; = spawn, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jwatszrh\"&gt;wait&lt;/code&gt; = deferred collect —\nReDel's two schemes), but depth, fan-out, and budget are policy values, and\nthe coordinator owns the children's lifecycle (no zombies — every child is a\ntracked task; the subreaper analogue at process level lives in the runner).\nStrategy (single / best-of / council / delegation depth) is chosen per task\nclass on the measured cost-accuracy frontier (A9): the scaffold pays most\nwhere the unaided model is weakest (+23.4pp on a 27B model, +8 on a frontier\none, negative on strong-model small tasks — ledger), so the default is\nsingle-shot for trivial tasks, manager-scaffold for oversized ones, and\ncouncil only where a golden benchmark shows it pays. Workflow &lt;em&gt;synthesis&lt;/em&gt;\n(composing new role graphs from a task spec, validating on example pairs,\nIPR-refining prompts) is the layer above, gated experimental (A10).&lt;/p&gt;\n&lt;h2 id=\"6-uncertainty-gating-a11\"&gt;&lt;a href=\"en/06-orchestration.html#6-uncertainty-gating-a11\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Uncertainty gating (A11)&lt;/span&gt;&lt;/a&gt;6. Uncertainty gating (A11)&lt;/h2&gt;\n&lt;p&gt;Each verdict carries the gateway's uncertainty when available; per-stage\nthresholds are calibrated from run history (the quantile-of-correct method,\nuac) and stored as policy values. Above-threshold outputs trigger targeted\nverification (an extra verifier probe, a retrieval-augmented recheck) —\nnever blanket double-checks (D7). Sub-threshold flows proceed; the\ncalibration loop is an eval-subsystem job, so thresholds carry receipts like\nany other knob.&lt;/p&gt;\n&lt;h2 id=\"7-plan-mode-the-approval-gate-as-an-artifact\"&gt;&lt;a href=\"en/06-orchestration.html#7-plan-mode-the-approval-gate-as-an-artifact\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. Plan mode — the approval gate as an artifact&lt;/span&gt;&lt;/a&gt;7. Plan mode — the approval gate as an artifact&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-avcxk8tn\"&gt;theia plan&lt;/code&gt; (or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p35hgas7\"&gt;run --plan&lt;/code&gt;) runs context collection and the planner role\nONLY: the blueprint projection, memory recall, and AST facts render with\nprovenance; the decomposition lands as the plan DAG with per-task\ntrack/verify and an honest cost line; the whole spec persists as a\n&lt;strong&gt;content-hashed plan artifact&lt;/strong&gt;. Plan context is UNCAPPED (run/plan\nparity, 2026-09-07): the planner sees the same complete blueprint and\nwhole context entries a run dispatch injects — the size guards are the\nsame loud thresholds (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-24nzgas4\"&gt;contextAlertChars&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r6qbxpnw\"&gt;contextRefuseChars&lt;/code&gt;) plus the\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yz5m6q7j\"&gt;run.blueprintMinImportance&lt;/code&gt; floor, never a silent schema cut — so the\ndigest attests what the planner actually read. A task's verify is one command or an\nORDERED LIST (focused suite first, full suite as the regression guard) —\nbecause a check is never a task: a task whose only work is running tests\nproduces no diff for the implementer and nothing for the reviewer, and the\nprompt contract forbids authoring one (the run &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8fbdkf4k\"&gt;2ak7ylmqu6&lt;/code&gt; receipt,\nledger §4). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2jsxk04o\"&gt;theia run --from-plan &amp;lt;id&amp;gt;&lt;/code&gt; refuses any\nstatus but &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ckb8zj8\"&gt;approved&lt;/code&gt; and stamps every created task with the plan digest it\nsatisfies; any edit (including &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pm499leh\"&gt;add-context&lt;/code&gt;) produces a NEW digest back in\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j2rt5yfx\"&gt;draft&lt;/code&gt; — approval cannot silently survive a change (the INV-081 shape;\nthis is what makes the full-spec track's spec-approved gate a mechanism,\n&lt;a href=\"en/11-governance.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ntfn2065\"&gt;11-governance.md §3&lt;/code&gt;&lt;/a&gt;). Approve / request-changes /\nadd-context are verbs on the artifact.&lt;/p&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m7h95tbp\"&gt;theia run --from-plan&lt;/code&gt; also holds the budget against the plan's\n&lt;strong&gt;history-derived cost floor&lt;/strong&gt; (tasks × the store's recorded avg $/task —\nnever fabricated; a cold store has no floor): a default budget below the\nfloor refuses before the first call, an explicit &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6z9avin3\"&gt;--budget&lt;/code&gt; proceeds with\na loud warning — an under-budgeted run dies mid-implementation with the\nround's work stranded (the spqr-010 fullspec-v2 receipt, notes/31).&lt;/p&gt;\n&lt;p&gt;Authored verify commands are &lt;strong&gt;pre-flighted at base&lt;/strong&gt; when the plan is\ncreated under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ie6crb3a\"&gt;run.planVerifyPreflight: always&lt;/code&gt; (opt-in for now, default\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wzan69j9\"&gt;disable&lt;/code&gt; — the pre-flight executes plan-authored commands before any\napproval exists, so it runs only on the operator's standing consent, the\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uzuzfc15\"&gt;indexPolicy&lt;/code&gt; bar; disabled with verifies present prints one hint line, and\nthe demo posture opts in): each distinct command runs once at its root, and the observations\n(exit code, labeled stdout/stderr tails) land on the plan's event scope —\noutside the hashed spec, so an observation never moves the approval digest —\nand render under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y8wvqld4\"&gt;plan show&lt;/code&gt;. Pre-flight is an observation, never a gate: a\nred test at base may be the task's very point (red→green), but \"aborted:\nmissing framework\" at base means the CHECK is broken, and the approver sees\nit before a run spends rounds on it. Mid-run, the same failure class is the\nlead's to fix: a rescope may carry a verify rewrite (§4), recorded on the\nverdict and folded from the log by live dispatch and resume alike.&lt;/p&gt;\n&lt;h2 id=\"8-run-lifecycle-pause,-resume,-steer,-ask\"&gt;&lt;a href=\"en/06-orchestration.html#8-run-lifecycle-pause,-resume,-steer,-ask\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;8. Run lifecycle — pause, resume, steer, ask&lt;/span&gt;&lt;/a&gt;8. Run lifecycle — pause, resume, steer, ask&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Restart is replay.&lt;/strong&gt; All coordinator state derives from the event log\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-htma4whn\"&gt;fromEvents&lt;/code&gt;); &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j6xsd9s0\"&gt;theia run --resume &amp;lt;runId&amp;gt;&lt;/code&gt; rehydrates and continues —\nstop-midway-then-resume is provably equal to never-stopped. A first\nSIGINT is a graceful stop (in-flight verdicts land, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7uxxxpp8\"&gt;run.paused&lt;/code&gt;); a\nsecond is a hard stop (harness process GROUPS killed — children a plain\nkill would miss). A hard kill at ANY point still leaves a resumable run\n&lt;em&gt;by construction&lt;/em&gt;: every event commits in its own WAL transaction, so\nthe log is always a chain-intact prefix, and resume depends only on the\nlog, never on the pause marker. The cost of a hard kill is in-flight\nattempts only — the attempt is the atom: a killed attempt's partial\nworkspace edits are reset on the next dispatch, a stale merge state is\naborted on merger entry, and the remaining budget re-derives from the\nrecorded gateway events.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Steering is an audited event.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-febitvwj\"&gt;theia msg &amp;lt;runId&amp;gt; [\"--task &amp;lt;id&amp;gt;\"] \"…\"&lt;/code&gt;\nappends a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wjct8k2z\"&gt;user.note&lt;/code&gt; that folds into Σ guidance — run-level, or\nprojected only into one task's jobs; the routing decision is recorded ON\nthe note, and a note to a terminal task reroutes to run-level guidance\nnaming the original addressee. Delivery is at dispatch boundaries (the\nattempt is the atom — there is no mid-turn injection surface). In the\nlive TUI the fold is immediate; cross-process on a live run it lands at\nthe next rehydration, and the CLI says so.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Asides never touch the run.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-38stuqt6\"&gt;theia probe &amp;lt;runId&amp;gt; \"q\"&lt;/code&gt; is a\nfork-lite: rehydrated Σ + one read-only cited call in the probe's own\nscope with a lineage event — the parent's log is byte-identical by\nconstruction. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2sn2vyjp\"&gt;theia ask \"…\"&lt;/code&gt; is the run-less sibling: one cited answer\nover the retrieval union (memory + intent index + run history), and an\nempty union abstains at $0 — the model is never called, so an\nunsupported question cannot hallucinate.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"9-forking-counterfactuals-on-live-history\"&gt;&lt;a href=\"en/06-orchestration.html#9-forking-counterfactuals-on-live-history\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;9. Forking — counterfactuals on live history&lt;/span&gt;&lt;/a&gt;9. Forking — counterfactuals on live history&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s0g9focf\"&gt;theia fork &amp;lt;runId&amp;gt; [--at &amp;lt;eventId&amp;gt;] --with \"…\"&lt;/code&gt; creates a new run whose\nlog is the parent's prefix up to a &lt;strong&gt;verdict boundary&lt;/strong&gt; (fork points are\nwhere workspace state re-materializes from recorded commit shas;\nmid-attempt moments are deliberately not forkable) plus a lineage event and\nthe injected divergence. The &lt;strong&gt;hybrid gateway mode&lt;/strong&gt; makes forks near-free:\nreplay on recording hit, live-and-record on miss — the shared prefix\nre-serves the parent's recorded replies, only the divergent suffix bills.\nStrict &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iqwel1cv\"&gt;replay&lt;/code&gt; stays the untouched determinism gate (THE-043).\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ilqtqnhi\"&gt;theia compare &amp;lt;runA&amp;gt; &amp;lt;runB&amp;gt;&lt;/code&gt; reports the divergence point, cost delta\npost-baseline, outcome delta, and artifact diff — the paired-ablation\nprotocol applied WITHIN a run: controlled A/B of a live decision with the\nprefix held byte-identical. Fork lineage renders as a tree in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jqyaxhyg\"&gt;show&lt;/code&gt;;\nsibling outcomes feed experiential memory (the AMER resume-at-divergence\narm made literal).&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/06-orchestration.html","hreflang":"en"}],"style":["_assets/theia.css","_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js","_bundle/mermaid-extension.js"],"canonical":"en/06-orchestration.html","vcsPath":"en/06-orchestration.md"},"headings":[{"title":"1. The failure this closes","href":"en/06-orchestration.html#1-the-failure-this-closes","level":2},{"title":"2. The kernel shape (A8)","href":"en/06-orchestration.html#2-the-kernel-shape-a8","level":2},{"title":"3. Execution state Σ (A6)","href":"en/06-orchestration.html#3-execution-state-s-a6","level":2},{"title":"4. Roles","href":"en/06-orchestration.html#4-roles","level":2},{"title":"5. Delegation and strategy","href":"en/06-orchestration.html#5-delegation-and-strategy","level":2},{"title":"6. Uncertainty gating (A11)","href":"en/06-orchestration.html#6-uncertainty-gating-a11","level":2},{"title":"7. Plan mode — the approval gate as an artifact","href":"en/06-orchestration.html#7-plan-mode-the-approval-gate-as-an-artifact","level":2},{"title":"8. Run lifecycle — pause, resume, steer, ask","href":"en/06-orchestration.html#8-run-lifecycle-pause,-resume,-steer,-ask","level":2},{"title":"9. Forking — counterfactuals on live history","href":"en/06-orchestration.html#9-forking-counterfactuals-on-live-history","level":2}],"title":"Orchestration — kernel, roles, planning state, delegation"},"router":{"pathname":"en/06-orchestration","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
