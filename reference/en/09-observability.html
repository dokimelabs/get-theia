        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"1-the-failure-this-closes\"&gt;&lt;a href=\"en/09-observability.html#1-the-failure-this-closes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The failure this closes&lt;/span&gt;&lt;/a&gt;1. The failure this closes&lt;/h2&gt;\n&lt;p&gt;Agent systems are harder to observe than microservices for a structural\nreason the AgentOps survey states plainly: in a service trace the payloads\nare stable API calls, but in an agent trace the &lt;em&gt;inputs and outputs of every\nspan are model-generated&lt;/em&gt; — the uncertainty IS the signal — so tracing that\ndrops payloads drops the diagnosis, while tracing that keeps them leaks\nprompts and PII into monitoring. Meanwhile the audit requirement (competitor\n§9.0: every judgment fixed with agent_run_id, logs unwritable by the agent,\ntamper-evident, 3-year retention) is usually met with process promises.\nAletheia builds both — diagnosis-grade telemetry and mechanical\ntamper-evidence — into the seams, so features get them by construction (P2).&lt;/p&gt;\n&lt;h2 id=\"2-traces\"&gt;&lt;a href=\"en/09-observability.html#2-traces\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Traces&lt;/span&gt;&lt;/a&gt;2. Traces&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;OTel with Jaeger export&lt;/strong&gt; (OTLP, loaded only when\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jv1urupw\"&gt;OTEL_EXPORTER_OTLP_ENDPOINT&lt;/code&gt; is set). Spans mirror the design objects —\nkernel rounds, per-job &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2vd006hi\"&gt;kernel.job&lt;/code&gt; spans (role, taskId, phase, attempt),\nand gateway calls — carrying structured attributes\n(role, mode, usage, cost) and &lt;strong&gt;payload references&lt;/strong&gt; — digests into the\nevent log — never payload bodies. The full I/O is one command away for an\noperator with store access (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9uiszmw4\"&gt;show --tui&lt;/code&gt;, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dndf3ddl\"&gt;v&lt;/code&gt; viewer), and absent\nfrom the telemetry backend entirely. Finer nesting (per tool call)\nextends the same facade as the trace consumers appear.&lt;/li&gt;\n&lt;li&gt;The AgentOps checkpoint insight is native here: because every span's inputs\nare events, \"roll back to before step k and re-run\" is replay with a\ntruncated log — no separate checkpoint machinery.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The live display channel&lt;/strong&gt; (the Dagger-bar live-visibility item,\nnotes/12 §5): adapters stream tool completions AS they happen —\nincremental JSONL feeders on the codex/claude stdout — through the\ngateway's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ocyqe4gi\"&gt;onLiveTrace&lt;/code&gt; to the operator's live views: the TUI renders a\ndim in-flight activity line per dispatch (latest tool + running count,\nclosed by the audited call), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3cmnar6z\"&gt;--plain&lt;/code&gt; prints a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k8bo94yr\"&gt;live&lt;/code&gt; feed line per\ntool. Deliberately a DISPLAY channel, not an event path: the canonical\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nptr3m46\"&gt;tool.result&lt;/code&gt; events land at audit unchanged, so the log and replay\nequality are byte-identical with or without a viewer — and a call that\ndies mid-stream showed the operator its tools without ever recording\nevents a replay could not reproduce (the rejected incremental-log\nvariant's failure mode). Content-free by contract: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vt2gj6tw\"&gt;argsShort&lt;/code&gt; only,\nbodies stay on the T-S blob path. The channel also carries call-start\npings and RETRY pings (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x0b7pp5x\"&gt;onRetry&lt;/code&gt;: attempt, wait, classified reason) — a\n429/500/session-limit backoff renders as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bdh80jv8\"&gt;↻ retry 2/4 in 4s — …&lt;/code&gt; instead\nof a bare ticking clock (the spqr stuck-session report).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"3-metrics\"&gt;&lt;a href=\"en/09-observability.html#3-metrics\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Metrics&lt;/span&gt;&lt;/a&gt;3. Metrics&lt;/h2&gt;\n&lt;p&gt;Prometheus &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eyp1zz1g\"&gt;/metrics&lt;/code&gt; on the daemon; per-seam families mirroring the design\nobject (payment-platform's transitions metric, generalized): one counter per\nFSM transition, per verdict kind, per gateway result kind, per gate outcome,\nper reconciler diff; histograms for phase latency, gateway latency, block\nsizes; gauges for head lag (freshness — a first-class KPI, A19), queue\ndepths, and budget consumption. Cost metrics carry the locked-USD figures\n(&lt;a href=\"en/04-model-gateway.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-es41zx00\"&gt;04-model-gateway.md §2&lt;/code&gt;&lt;/a&gt;); cost readouts (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q14ydwpp\"&gt;theia show&lt;/code&gt;,\nthe home screen's run rows, eval reports) recompute nothing — they read\nwhat execution locked.&lt;/p&gt;\n&lt;h2 id=\"4-the-audit-chain\"&gt;&lt;a href=\"en/09-observability.html#4-the-audit-chain\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. The audit chain&lt;/span&gt;&lt;/a&gt;4. The audit chain&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Every event carries &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mlrqzzzs\"&gt;prev_digest&lt;/code&gt; — the log is a hash chain; any\nafter-the-fact edit breaks verification (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mpg210vy\"&gt;theia audit verify&lt;/code&gt;). This is\nthe mechanical form of the competitor's WORM/tamper-evident requirement,\nwith periodic chain-head anchoring (a signed head digest to external\nstorage) as the optional hardening step.&lt;/li&gt;\n&lt;li&gt;Gateway events record model id, prompt digest, params digest, usage, and\nresult kind for every call — the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k72hostq\"&gt;agent_run_id + prompt_version + input hashes&lt;/code&gt; contract, complete by construction because no call bypasses the\nseam. Beside the digests, every audited call writes its &lt;strong&gt;exchange\nblob&lt;/strong&gt; — the full system/prompt/reply text, class-gated (prohibited\nnever lands, restricted lands masked with visible counts) into the\nLOCAL content-addressed store, ref-only on the event (THE-055 holds\neverywhere but &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zi3xm2lm\"&gt;.theia/objects&lt;/code&gt;) — so \"which prompt\" (the digest) and\n\"show me the prompt\" (TUI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8gl6vz3f\"&gt;v&lt;/code&gt; on the gateway row) are both one step.\nThe harness session id rides the same event: the pointer into the\nharness's own transcript store for hook-connected sessions\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4d71r2md\"&gt;notes/12&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Retention is a policy value; GC respects it before physical deletion\n(&lt;a href=\"en/03-storage.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jxiijpi5\"&gt;03-storage.md §6&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"5-pii-discipline\"&gt;&lt;a href=\"en/09-observability.html#5-pii-discipline\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. PII discipline&lt;/span&gt;&lt;/a&gt;5. PII discipline&lt;/h2&gt;\n&lt;p&gt;The denylist is enforced at the boundary helpers in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l286xfg7\"&gt;packages/otel&lt;/code&gt; (keys:\nprompt/content/email/token/secret classes), not at call sites — a caller\ncannot accidentally forward content into metrics or error tracking. Error\nmessages are sanitized against a closed allowlist of known runtime phrasings\nbefore they ride exceptions (model output never enters a log line — the\nFidant #3644 lesson: meta-key filtering does not see message strings).\nRedaction and masking counts are themselves metrics, so silence is\ndistinguishable from absence.&lt;/p&gt;\n&lt;h2 id=\"6-anomaly-detection-and-self-diagnosis-hooks\"&gt;&lt;a href=\"en/09-observability.html#6-anomaly-detection-and-self-diagnosis-hooks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Anomaly detection &amp;amp; self-diagnosis hooks&lt;/span&gt;&lt;/a&gt;6. Anomaly detection &amp;amp; self-diagnosis hooks&lt;/h2&gt;\n&lt;p&gt;The AgentOps taxonomy (intra: reasoning/planning/action/memory/environment;\ninter: task-spec/security/communication/trust/emergent/termination) is the\nclosed label set for anomaly events the kernel and gateway emit (loop\ndetected, budget breach, verdict flapping, delegation depth, stale head,\nrefusal). These labels are the skeleton prior the diagnostician starts from\n(&lt;a href=\"en/06-orchestration.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3v3c491o\"&gt;06-orchestration.md §4&lt;/code&gt;&lt;/a&gt;) — detection feeds RCA\nfeeds resolution feeds experiential memory, the full AgentOps loop inside one\nplatform.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/09-observability.html","hreflang":"en"}],"style":["_assets/theia.css"],"canonical":"en/09-observability.html","vcsPath":"en/09-observability.md"},"headings":[{"title":"1. The failure this closes","href":"en/09-observability.html#1-the-failure-this-closes","level":2},{"title":"2. Traces","href":"en/09-observability.html#2-traces","level":2},{"title":"3. Metrics","href":"en/09-observability.html#3-metrics","level":2},{"title":"4. The audit chain","href":"en/09-observability.html#4-the-audit-chain","level":2},{"title":"5. PII discipline","href":"en/09-observability.html#5-pii-discipline","level":2},{"title":"6. Anomaly detection &amp; self-diagnosis hooks","href":"en/09-observability.html#6-anomaly-detection-and-self-diagnosis-hooks","level":2}],"title":"Observability — traces, metrics, cost, the audit chain"},"router":{"pathname":"en/09-observability","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
