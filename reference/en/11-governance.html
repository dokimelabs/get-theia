        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"1-the-failure-this-closes\"&gt;&lt;a href=\"en/11-governance.html#1-the-failure-this-closes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The failure this closes&lt;/span&gt;&lt;/a&gt;1. The failure this closes&lt;/h2&gt;\n&lt;p&gt;Governance-as-prose fails in both directions: rules nobody can check rot\n(the interpreter law, P2), and rules applied uniformly bureaucratize the\nsmall fix until engineers route around the whole system (the competitor's own\nanti-pattern list: \"Full Spec на каждый хотфикс\"). The plus8soft guidebooks\ndefine the right &lt;em&gt;shape&lt;/em&gt; — differentiated tracks, named gates, human merge\nauthority, data classes, auditable runs — as checklists humans must remember.\nAletheia keeps the shape and gives every rule an interpreter: a policy value\nthe kernel consumes, a gate the FSM enforces, a mask the gateway applies.&lt;/p&gt;\n&lt;h2 id=\"2-tracks\"&gt;&lt;a href=\"en/11-governance.html#2-tracks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Tracks&lt;/span&gt;&lt;/a&gt;2. Tracks&lt;/h2&gt;\n&lt;p&gt;Two delivery tracks, chosen at task creation (by the lead role or the human;\ndisputes → the stricter track). The planner assigns a track per task in\nplan mode, the value is part of the content-hashed plan artifact, and its\nonly kernel effect is the FSM birth event: full_spec enters at &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-id27tv3m\"&gt;plan&lt;/code&gt;\n(spec-first), fast_path enters at &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-888q30es\"&gt;implement&lt;/code&gt;. An EXPLICIT\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-swwb01em\"&gt;theia run --from-plan … --track &amp;lt;t&amp;gt;&lt;/code&gt; overrides every task's track for\nthat invocation only — loud at start, audited on &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cis0g8qn\"&gt;run.created&lt;/code&gt;\n(trackOverride), the approved artifact untouched:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Track&lt;/th&gt;\n&lt;th&gt;When&lt;/th&gt;\n&lt;th&gt;Pipeline&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;full-spec&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;features, contract/schema/auth changes, integrations, anything change-managed&lt;/td&gt;\n&lt;td&gt;brief → spec (plan DAG + acceptance criteria) → &lt;strong&gt;spec-approved gate&lt;/strong&gt; → implement → verify → review → human merge&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;fast-path&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;small fixes with a repro and a check on the touched path, no API/schema/authz change&lt;/td&gt;\n&lt;td&gt;DoR-lite → implement → verify → review → human merge&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Track eligibility is checked mechanically where possible (diff touches\nschema/auth paths ⇒ full-spec forced — a path-set policy value), and the\nspec is a &lt;em&gt;content-hashed contract&lt;/em&gt;: implement runs pin the spec digest they\nsatisfy, so a drifted spec fails the gate instead of silently diverging\n(claudexor INV-081).&lt;/p&gt;\n&lt;h2 id=\"3-gates-fsm-states,-not-checklist-rows\"&gt;&lt;a href=\"en/11-governance.html#3-gates-fsm-states,-not-checklist-rows\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Gates — FSM states, not checklist rows&lt;/span&gt;&lt;/a&gt;3. Gates — FSM states, not checklist rows&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Gate&lt;/th&gt;\n&lt;th&gt;Enforcement&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;DoR&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;task cannot leave &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y6e96on3\"&gt;draft&lt;/code&gt; without goal + track + acceptance criteria fields (schema-validated)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;spec-approved&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;full-spec tasks cannot enter &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gm4h2f4w\"&gt;implement&lt;/code&gt; without an approval event citing the spec digest; shipped as content-hashed plan artifacts — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yf13exe8\"&gt;theia run --from-plan&lt;/code&gt; refuses any status but &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d6ncs5jl\"&gt;approved&lt;/code&gt;, every created task records the plan digest, and any edit (add-context) produces a new digest back in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h25vwi4m\"&gt;draft&lt;/code&gt; (INV-081)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;verify&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;the verifier's executed result is ground truth; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qjpfwhup\"&gt;fail&lt;/code&gt; overrides any claim and returns the task (A2)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;stop-and-fix&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;N consecutive verifier failures (policy value, default 3) freezes the task to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-agehwsfz\"&gt;escalated&lt;/code&gt; — a human or the lead re-scopes; the frozen state carries the full evidence trail&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;human merge&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;protected-branch merge and any production action are absent from kernel capabilities entirely (&lt;a href=\"en/10-integrations.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qfjcr00q\"&gt;10-integrations.md §5&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;docs-DoD&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;task completion requires its artifact set (report, changelog entries) — presence-checked&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;pre-task&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lxr0opnd\"&gt;preTask&lt;/code&gt; policy commands run before a task's first implement dispatch; exits + output digests recorded as evidence; a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5l11ulzf\"&gt;mustPass&lt;/code&gt; failure freezes the task for the lead &lt;strong&gt;without spending a model call&lt;/strong&gt; — \"before starting work, do X\" as an interpreter, not prose&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Every gate outcome is an event (auditable) and a metric (§ observability).\nASSUMPTION records are first-class rows with owners; an open assumption on a\nmerge-bound task blocks the gate — the competitor's rule, mechanized.&lt;/p&gt;\n&lt;h2 id=\"4-data-classes-and-masking-the-gateway-gate\"&gt;&lt;a href=\"en/11-governance.html#4-data-classes-and-masking-the-gateway-gate\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Data classes and masking (the gateway gate)&lt;/span&gt;&lt;/a&gt;4. Data classes and masking (the gateway gate)&lt;/h2&gt;\n&lt;p&gt;Three classes, assigned per source in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8eupe06q\"&gt;.theia/config/&lt;/code&gt; manifests and carried\non every fact, chunk, and artifact as a column:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Class&lt;/th&gt;\n&lt;th&gt;Examples&lt;/th&gt;\n&lt;th&gt;Gateway behavior&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;prohibited&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;secrets, keys, payment data, personal data without basis&lt;/td&gt;\n&lt;td&gt;call blocked (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vd2cxtzc\"&gt;fatal(policy)&lt;/code&gt;); write path drops or quarantines; never leaves the process&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;restricted&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;internal code, non-public contracts, masked personal data&lt;/td&gt;\n&lt;td&gt;masked before the bytes leave (deterministic placeholders, reversible only via the local store); allowed to whitelisted transports&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;permitted&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;public / de-identified content&lt;/td&gt;\n&lt;td&gt;allowed + audited&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Masking happens at the ONE seam all calls cross (&lt;a href=\"en/04-model-gateway.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8eg09lck\"&gt;04-model-gateway.md §5&lt;/code&gt;&lt;/a&gt;)\n— the property the competitor's playbook asks the engineer to remember.\nDetectors are shared between the write-path PII gate and the prompt gate\n(Luhn-checked cards, key/mnemonic patterns, document numbers), with the\nverbatim-substrate nuance kept: a chunk keeps the dialogue and loses only the\nsecret. Confidentiality filters at retrieval are &lt;strong&gt;default-deny&lt;/strong&gt; — a caller\nfilter can narrow but never widen visibility.&lt;/p&gt;\n&lt;h2 id=\"5-policy-values\"&gt;&lt;a href=\"en/11-governance.html#5-policy-values\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Policy values&lt;/span&gt;&lt;/a&gt;5. Policy values&lt;/h2&gt;\n&lt;p&gt;All governance knobs are typed &lt;strong&gt;policy values&lt;/strong&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ipmfbvtm\"&gt;packages/schema&lt;/code&gt;'s\npolicy module),\ndeclared in manifests, validated at load, and consumed by a named component —\nan unconsumed policy fails CI (staged-field rule, A3). The catalog covers:\nbudgets (cost/time/rounds per task class), delegation depth/fan-out,\ntrack-forcing path sets, tool grants per role (the MCP least-privilege\nmatrix as data), data-class assignments, retention windows, masking modes,\nuncertainty thresholds (calibrated, receipt-carrying — A11), pre-task\ncommand gates, context-injection scopes (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s8qi31om\"&gt;kind: Context&lt;/code&gt;), pricing\noverlays with per-transport &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-br9m4i6d\"&gt;costBasis&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tm4r94a8\"&gt;kind: Pricing&lt;/code&gt;), and the\nfreshness-automation posture (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bvvfsul0\"&gt;indexPolicy auto|alert|manual&lt;/code&gt; +\nbuild budget + serve cadence — alert-first, auto-spend by standing\nconsent only). The\ncompetitor's Policy Engine bullet list maps 1:1 onto this catalog; the\ndifference is that ours has an interpreter per row\n(&lt;a href=\"en/12-invariants.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p5gdkj83\"&gt;12-invariants.md&lt;/code&gt;&lt;/a&gt; pins the mapping).&lt;/p&gt;\n&lt;h2 id=\"6-vendor-and-model-registry\"&gt;&lt;a href=\"en/11-governance.html#6-vendor-and-model-registry\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Vendor &amp;amp; model registry&lt;/span&gt;&lt;/a&gt;6. Vendor &amp;amp; model registry&lt;/h2&gt;\n&lt;p&gt;External transports (LLM providers, embedding APIs, MCP servers) register in\na manifest with: provider, service, data classes permitted, region, owner,\nlast-review date, exit plan — the DORA-shaped ICT registry as config the\ngateway &lt;em&gt;enforces&lt;/em&gt; (an unregistered transport cannot be routed to), not a\nspreadsheet someone maintains.&lt;/p&gt;\n&lt;h2 id=\"7-incident-path\"&gt;&lt;a href=\"en/11-governance.html#7-incident-path\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. Incident path&lt;/span&gt;&lt;/a&gt;7. Incident path&lt;/h2&gt;\n&lt;p&gt;The incident sequence is built from shipped mechanisms, operator-driven:\nanomaly events surface loudly (typed, counted, rendered &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3kdr9bqa\"&gt;‼&lt;/code&gt; in every view);\nthe guards contain the blast (freeze to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c4qolfgr\"&gt;escalated&lt;/code&gt;, budget pause,\nstop-and-fix) so failures are bounded and cheap; a stop is graceful and the\nlog IS the snapshot; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0nidmi7d\"&gt;theia diagnose&lt;/code&gt; runs the RCA over the audit trail and\nmemorizes the fingerprint; resume continues from the chain-intact prefix.\nEvery step is an event; the postmortem cites the trace. A severity policy\nthat auto-triggers the full sequence rides the daemon channel when it lands\n(&lt;a href=\"en/13-roadmap.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mxd2n8w3\"&gt;13-roadmap.md&lt;/code&gt;&lt;/a&gt; queued rows).&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/11-governance.html","hreflang":"en"}],"style":["_assets/theia.css"],"canonical":"en/11-governance.html","vcsPath":"en/11-governance.md"},"headings":[{"title":"1. The failure this closes","href":"en/11-governance.html#1-the-failure-this-closes","level":2},{"title":"2. Tracks","href":"en/11-governance.html#2-tracks","level":2},{"title":"3. Gates — FSM states, not checklist rows","href":"en/11-governance.html#3-gates-fsm-states,-not-checklist-rows","level":2},{"title":"4. Data classes and masking (the gateway gate)","href":"en/11-governance.html#4-data-classes-and-masking-the-gateway-gate","level":2},{"title":"5. Policy values","href":"en/11-governance.html#5-policy-values","level":2},{"title":"6. Vendor &amp; model registry","href":"en/11-governance.html#6-vendor-and-model-registry","level":2},{"title":"7. Incident path","href":"en/11-governance.html#7-incident-path","level":2}],"title":"Governance — tracks, gates, policy values, data classes"},"router":{"pathname":"en/11-governance","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
