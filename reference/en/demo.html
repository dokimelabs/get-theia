            {"data":{"leading":false,"html":"&lt;blockquote&gt;\n&lt;p&gt;A ~20-minute guided demo from first install to a completed, audited,\nreplayable agent run — the artifact we show CTOs, CEOs, analysts, and\nengineers, and the bar we measure feature-completeness against. Every\ncommand below is executable as printed; every number is a receipt from a\nreal execution against the reproducible demo workspace (regenerate it any\ntime — §3), not a projection. The TUI frames are captured text, not\nmockups. Deep references as we pass them: configuration\n(&lt;a href=\"en/15-configuration.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mu46j6v5\"&gt;15-configuration.md&lt;/code&gt;&lt;/a&gt;), the TUI\n(&lt;a href=\"en/14-tui.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u1sd4jcz\"&gt;14-tui.md&lt;/code&gt;&lt;/a&gt;), distribution\n(&lt;a href=\"en/16-release.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v2tkjo7f\"&gt;16-release.md&lt;/code&gt;&lt;/a&gt;), receipts\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bp3csmtl\"&gt;ledger.md&lt;/code&gt;).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"1-install-2-min\"&gt;&lt;a href=\"en/demo.html#1-install-2-min\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Install (2 min)&lt;/span&gt;&lt;/a&gt;1. Install (2 min)&lt;/h2&gt;\n&lt;p&gt;One line, any Linux/macOS box, x86_64 or aarch64:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ curl -fsSL https://dokimelabs.github.io/get-theia/install.sh | sh\nGitHub PAT for dokimelabs/theia-releases (input hidden): ▌\nresolving latest release of dokimelabs/theia-releases…\nlatest: v0.1.0 → theia-v0.1.0-linux-x86_64.tar.gz\ndownloading theia-v0.1.0-linux-x86_64.tar.gz…\nsha256 verified\ninstalled theia v0.1.0 → ~/.local/share/theia/releases/0.1.0\nsymlinked ~/.local/bin/theia\nwrote ~/.config/theia/config.yaml (mode 0600)\n\ndone — try: theia version &amp;amp;&amp;amp; theia doctor\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"11\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-11\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-11\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-11.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Talking points: the installer detects os/arch and &lt;strong&gt;refuses&lt;/strong&gt; unsupported\nplatforms by name (Windows is a planned first-class target, and it says\nso); the PAT is the access gate — releases live in a private repository,\nso distribution is licensing; the checksum verification is mandatory, not\nbest-effort; the config lands with 0600 permissions and the token is never\nechoed anywhere again.&lt;/p&gt;\n&lt;p&gt;Version discipline for the engineers in the room:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ theia version                       # the embedded release version\n$ theia --x-release 0.0.9 version    # run EXACTLY that version (cached or\n                                     # downloaded; missing+undownloadable = a\n                                     # loud error, never a silent fallback)\n$ THEIA_X_RELEASE=0.0.9 theia …      # the same, for scripts and CI\n$ theia --dev ~/work/theia-dev …     # a developer runs the source tree\n$ theia self update                  # explicit; nothing updates itself\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"18\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-18\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-18\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-18.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;h2 id=\"2-out-of-the-box,-and-where-everything-is-configured-3-min\"&gt;&lt;a href=\"en/demo.html#2-out-of-the-box,-and-where-everything-is-configured-3-min\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Out of the box, and where everything is configured (3 min)&lt;/span&gt;&lt;/a&gt;2. Out of the box, and where everything is configured (3 min)&lt;/h2&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ mkdir pilot &amp;amp;&amp;amp; cd pilot &amp;amp;&amp;amp; theia doctor\ncodex subscription : ok\njail (bwrap)       : ok\nembeddings         : local/all-MiniLM-L6-v2 (384d) — ready at ~/.cache/theia/models/Xenova/all-MiniLM-L6-v2\nuser config        : present\ngithub pat         : present\n.theia store       : not initialized (theia init)\nai rules           : none detected\ncodex hooks        : feature stable/true; project NOT trusted (gate 1); hooks.json absent (theia hooks install codex)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"22\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-22\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-22\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-22.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Doctor &lt;strong&gt;probes&lt;/strong&gt; — it runs real checks against real surfaces, so an\nunauthenticated harness is a visible failure at minute zero, never a\nmid-run surprise.&lt;/p&gt;\n&lt;p&gt;The out-of-the-box experience is deliberate: a bare &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qtw03ss1\"&gt;theia init&lt;/code&gt; runs the\n&lt;strong&gt;config of record&lt;/strong&gt; — every default was measured into place and carries a\nledger receipt; there is nothing to tune before the first run. When you do\nconfigure, everything lives in three visible places, all plain files under\nversion control:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;What&lt;/th&gt;\n&lt;th&gt;Where&lt;/th&gt;\n&lt;th&gt;Shown in this demo&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Governance knobs (budgets, sandbox tier, routing, gates)&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-olwr7mts\"&gt;.theia/config/*.yaml&lt;/code&gt; — k8s-shaped manifests, strict validation&lt;/td&gt;\n&lt;td&gt;§4&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Role prompts&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3unnacmx\"&gt;.theia/prompts/ROLE.md&lt;/code&gt; — appended to baked prompts, digest-recorded per job&lt;/td&gt;\n&lt;td&gt;§4&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;The user's own AI rules&lt;/td&gt;\n&lt;td&gt;detected at init; non-native files auto-wired into an audited Context manifest&lt;/td&gt;\n&lt;td&gt;§3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;An unknown field or a knob with no consumer &lt;strong&gt;fails loudly at load&lt;/strong&gt; — a\nsetting that does nothing cannot exist. And if the team already has\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rh9kbwk4\"&gt;AGENTS.md&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7m412a08\"&gt;CLAUDE.md&lt;/code&gt;, or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kqc17u91\"&gt;.cursor/rules&lt;/code&gt;, init wires them in\nautomatically: native files stay with the harness's own read, everything\nelse is injected as budgeted, digest-audited prompt content — \"what rules\ndid this run see\" is an event, not a guess.&lt;/p&gt;\n&lt;h2 id=\"3-the-demo-workspace,-from-one-command-3-min\"&gt;&lt;a href=\"en/demo.html#3-the-demo-workspace,-from-one-command-3-min\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. The demo workspace, from one command (3 min)&lt;/span&gt;&lt;/a&gt;3. The demo workspace, from one command (3 min)&lt;/h2&gt;\n&lt;p&gt;The demo environment is itself a product mechanism — a reproducible\nworkspace we can spin up to verify changes, run evaluations, or hold this\nexact walkthrough:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ theia eval demo create --dir ~/demo-cs\n…\ndemo workspace ready:\n  repo    ~/demo-cs @ 523efd6225 (suite green)\n  store   ~/demo-cs/.theia/store.db\n  index: 71 written, 0 failed, 71 model calls\n  rate: 3.7 files/s, $0.1500 locked (264.9s)\n  brief   GetInfo() omits async trigger behaviours (PermitIfAsync and friends)…\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"88\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-88\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-88\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-88.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;What just happened: a &lt;strong&gt;real&lt;/strong&gt; C# codebase (the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mvrlbuf5\"&gt;stateless&lt;/code&gt; state-machine\nlibrary at a pinned commit — a genuine SWE-bench-Live instance, not a toy),\nits full test suite verified green at base, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8zii3mfs\"&gt;.theia/&lt;/code&gt; initialized, demo\npolicy and memory seeded, and the &lt;strong&gt;intent index&lt;/strong&gt; built:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ theia index build        # again — the hash gate\nindex: 0 written, 71 current, 0 failed, 0 model calls\nrate: 71 reused (100%), 0 model calls, $0.0000 locked (10ms)\n\n$ theia index search \"GetInfo async trigger behaviours\"\n2.0164 [bm25+symbol] src/Stateless/StateMachine.cs — Provides the core\n       finite-state-machine runtime for configuring states, firing triggers,\n       executing transitions, and exposing machine metadata.\n1.0164 [bm25] src/Stateless/InternalTriggerBehaviour.cs — Provides guarded\n       internal transition-action dispatch for synchronous and asynchronous\n       state-machine triggers.\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"92\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-92\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-92\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-92.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Talking points: the index is the repository's &lt;em&gt;intent layer&lt;/em&gt; — one entry\nper file carrying the design decisions no grep can see — built once\n(~$0.15 for ~70 files), then &lt;strong&gt;hash-gated forever&lt;/strong&gt;: the second build costs\nzero model calls; editing one file re-indexes one file. Search unions\nlexical, vector, and AST-symbol lanes, consensus-first. The same map serves\nthe agents (§4), your Claude Code/Codex sessions (via MCP + hooks), and\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qejhnvxv\"&gt;theia ask&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"4-the-run-live-following-on-the-flight-deck-7-min\"&gt;&lt;a href=\"en/demo.html#4-the-run-live-following-on-the-flight-deck-7-min\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. The run — live following on the flight deck (7 min)&lt;/span&gt;&lt;/a&gt;4. The run — live following on the flight deck (7 min)&lt;/h2&gt;\n&lt;p&gt;The task derives from the instance's real issue text (it is in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b3s0ix5a\"&gt;DEMO.md&lt;/code&gt;\nin the workspace). Full-spec track first — plan, approve, execute:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ theia plan --task \"@TASKS/issue.md\"     # the REAL upstream issue text\n  [blueprint] src/Stateless/StateConfiguration.cs[engine/state-machine/9]: …\n  [memory:fact:lexical-scan+recency] dotnet test is the verification gate …\n  trace-metadata [fast_path]  ✓ rg -n \"GetInfo|StateMachineInfo|…\" src tests .\n      Inspect StateMachine.GetInfo(), StateRepresentation trigger-behaviour…\n  add-regression-test [fast_path]  ⇐ trace-metadata  ✓ dotnet test\n      Add a regression test configuring PermitIfAsync from state A to B…\n  fix-info-aggregation [fast_path]  ⇐ add-regression-test  ✓ dotnet test\n      Update the metadata aggregation path so GetInfo() includes async…\n  validate-suite [fast_path]  ⇐ fix-info-aggregation  ✓ dotnet test\n      Run the complete xUnit suite and review the resulting diff…\nverify pre-flight: `rg -n \"GetInfo|…\" src tests .` exit 2 at base — expected\n  for red→green; if this is infrastructure, fix the command before approving\nverify pre-flight: `dotnet test` exit 1 at base — expected for red→green; if\n  this is infrastructure (missing tool/framework), fix the command before approving\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"102\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-102\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-102\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-102.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;(The pre-flight lines fire because the demo posture sets\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yigx5jkf\"&gt;run.planVerifyPreflight: always&lt;/code&gt; — the knob is opt-in platform-wide,\n&lt;a href=\"en/15-configuration.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vevvq5hu\"&gt;15-configuration.md §3&lt;/code&gt;&lt;/a&gt;.)&lt;/p&gt;\n&lt;p&gt;Worth thirty seconds of the room's attention: the planner read the map and\nthe seeded memory (both cited with provenance in its context block),\ndecomposed the issue into a dependency-ordered DAG — investigation first,\nregression tests, the fix, the full-suite check last — and &lt;strong&gt;authored the\nper-task verification commands itself&lt;/strong&gt;.&lt;/p&gt;\n&lt;p&gt;And then the platform checked the planner's homework. Every authored verify\ncommand just ran once at base — an observation, never a gate — and both\nflagged. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6m18cfj0\"&gt;plan show&lt;/code&gt; carries the labeled evidence:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ theia plan show pln2ak7y6nmlc…\n…\nverify pre-flight at base:\n  ✖ exit 2 [root] rg -n \"GetInfo|StateMachineInfo|PermitIfAsync|…\" src tests .\n      stderr: rg: tests: No such file or directory (os error 2)\n  ✖ exit 1 [root] dotnet test\n      stdout: … Passed:   422, Skipped: 0, Total: 423 … - Stateless.Tests.dll (net9.0)\n      stderr: … Test Run Aborted.\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"112\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-112\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-112\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-112.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Read the second one closely — this is the demo's sharpest moment. The suite\nPASSES on net8.0/net9.0 (stdout) while the run as a whole ABORTS (stderr):\nthis repo multi-targets net8/net9/&lt;strong&gt;net48&lt;/strong&gt;, and the net48 test host demands\nMono. A CI pipeline wired with that command would flake forever; here the\nbroken check is visible &lt;strong&gt;before approval&lt;/strong&gt;, with both streams labeled,\ninstead of rounds into a run. So teach the workspace — once:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ theia mem add constraint \"This repo multi-targets net8.0/net9.0/net48: \\\n    plain 'dotnet test' aborts (net48 host needs Mono) — every verify \\\n    command must pin '-f net8.0'. Tests live under test/ (singular)…\"\nadded fct2ak7y6w5v…\n\n$ theia mem add decision \"DAG plans gate each task's merge on its verify \\\n    going green, so a behavior change and its regression tests belong in \\\n    ONE task: test red, fix, merge green together. Never author a task \\\n    whose only work is running tests - attach the full-suite command as a \\\n    second verify entry on the fixing task (verify accepts a list).\"\nadded fct2ak7ypipb…\n\n$ theia plan --task \"@TASKS/issue.md\"     # re-plan; memory now knows\n  [memory:fact:lexical-scan+recency] Never author a plan task whose only work…\n  [memory:fact:lexical-scan+recency] DAG plans gate each task's merge on its…\n  [memory:fact:recency] This repo multi-targets net8.0/net9.0/net48: plain …\n  include-async-trigger-info [fast_path]  ✓ dotnet test test/Stateless.Tests/… -f net8.0  &amp;amp;&amp;amp;  dotnet test -f net8.0\n      Add regression coverage for GetInfo() with PermitIfAsync-configured\n      transitions, then update the metadata construction path in\n      StateMachine/StateMachineInfo so asynchronous trigger behaviours are\n      included alongside synchronous behaviours without executing async\n      guards. Verify the generated graph contains the A-to-B transition and\n      existing metadata behavior remains unchanged.\nverify pre-flight: `dotnet test test/Stateless.Tests/… -f net8.0` passes at base\nverify pre-flight: `dotnet test -f net8.0` passes at base\ncost estimate: ~$0.09 (1 tasks × $0.094 avg/task from recorded runs)\n\n$ theia plan approve pln2ak7yprsmw…\napproved pln2ak7yprsmw @ …\n$ theia run --from-plan pln2ak7yprsmw… --record --tui\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"116\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-116\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-116\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-116.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Two teachings, and every future plan in this workspace authors runnable\nchecks and a convergent shape: ONE task carrying the whole red→green arc\nwith an ordered LIST of verify commands — the focused suite, then the full\nsuite as the regression guard — both cited right in the planner's context\nblock. (Had a broken command slipped through anyway, the run is still not\ndoomed: the lead can rewrite a task's verify commands on a rescope, audited\non the verdict event — the same failure class has an in-run lever, and its\nrescope note reaches the next implementer as binding direction. The\nledger's §4 carries the full sagas of these guards earning their keep on\nthis very workspace.)&lt;/p&gt;\n&lt;p&gt;The plan is a &lt;strong&gt;content-hashed artifact&lt;/strong&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-12hu2aeq\"&gt;run --from-plan&lt;/code&gt; refuses\nanything but &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ybeoei50\"&gt;approved&lt;/code&gt;, any edit is a new digest back in draft, and every\ntask records the digest it satisfies — the SPEC_APPROVED gate as a\nmechanism, not a checklist row.&lt;/p&gt;\n&lt;p&gt;On an interactive terminal the run opens the &lt;strong&gt;run tree&lt;/strong&gt; — live:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;⢿ running · run run2ak7ypvyog222vtzpgsqut · fast_path · $0.0446/$5.00 · 1 call · 25 events     3m57s\ntasks: 1 running · 0 done · anomalies 0                                       [@ event 25/25 · live]\n────────────────────────────────────────────────────────────────────────────────────────────────────\n ⢿ ▼ tsk…t2ouhe25 [fast_path]                                             review  r2  $0.0446  3m57s\n ✔ ├╴r1 implement  implementer → ready                                             7 evidence  3m15s\n ✔ ├╴r2 verify  verifier → verify_pass                                               2 evidence  15s\n ⢿ ╰╴r3 review  …                                                                                28s\n ↑↓ move • ←→ fold • ⏎ zoom • ⇥ pane • f follow:round • e err • m steer • ? • q stop\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"126\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-126\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-126\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-126.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;em&gt;Reading the frame:&lt;/em&gt; the header carries the full run id, track, the cost\nticker against budget, and a worded task tally; each task is a collapsible\nnode with per-round children; the braille spinner marks what is in flight\nNOW; durations tick on the right. Dagger's law: &lt;strong&gt;success condenses,\nfailure flags itself&lt;/strong&gt; — merged work collapses to one &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kmc3kici\"&gt;✔&lt;/code&gt; row; anything\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ftp15npb\"&gt;✖&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l0ekcn7p\"&gt;◆&lt;/code&gt; auto-expands and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8c2qsxv2\"&gt;e&lt;/code&gt; jumps to it.&lt;/p&gt;\n&lt;p&gt;Three live verbs to show:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Steer&lt;/strong&gt; — press &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3eiyn5fb\"&gt;m&lt;/code&gt;, type \"prefer the smallest fix; do not refactor\",\nEnter. The note lands in the hash-chained log AND the live\ncoordinator's guidance — the next dispatch carries it. Steering is\naudited and replayable, and with the cursor on a task node it targets\nthat task alone.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Verbosity&lt;/strong&gt; — press &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u4zzkdzi\"&gt;+&lt;/code&gt; twice:&lt;/li&gt;\n&lt;/ol&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;✔ completed · run run2ak7ypvyog222vtzpgsqut · fast_path · $0.2472/$5.00 · 6 calls · 81 events\ntasks: 0 running · 1 done · anomalies 0 · idx ⚠3                              [@ event 81/81 · head]\n────────────────────────────────────────────────────────────────────────────────────────────────────\n ✔ ▼ tsk…t2ouhe25 [fast_path]                                             merged  r9  $0.2472  9m22s\n · ├╴[include-async-trigger-info] Add regression coverage for GetInfo() with PermitIfAsync-configur…\n ✔ ├╴workspace @ 523efd6 (copy)\n ✔ ├╴▶ r1 implement  implementer → ready                                           7 evidence  3m15s\n ✔ ├╴▶ r2 verify  verifier → verify_pass                                             2 evidence  15s\n ✔ ├╴▶ r3 review  reviewer → rework                                                  3 evidence  50s\n ✔ ├╴▶ r4 arbitrate  arbiter → arb_escalate                                          5 evidence  40s\n ✔ ├╴▶ r5 escalated  lead → lead_rescope                                             5 evidence  56s\n ✔ ├╴▼ r6 implement  implementer → ready                                           6 evidence  2m20s\n ✔ │ ├╴▼ · gateway codex-write ok $0.0274\n         kind: ok\n         masked: {}\n         model: null\n         priceSource: embedded\n ✔ │ │ ├╴$ sed -n '1,240p' src/Stateless/StateMachine.cs &amp;amp;&amp;amp; sed -n '1,240p' src/Stateless/Reflectio…\n           argsShort: sed -n '1,240p' src/Stateless/StateMachine.cs &amp;amp;&amp;amp; sed -n '1,240p' src/Stateles…\n           blobRef: 1b4b5340cfe4ff7c75b54e44442aeb47d5d5898f37e9b332269340570e82a7e7\n           callKey: 1b83885f3e50e4835cdc93997b966db54be73630100e6aea28d0e6222f18f147\n           durationMs: null\n ✔ │ │ ├╴$ rg -n \\\"PermitIfAsync|TransitioningTriggerBehaviourAsync|GetInfo_should|FixedTransitions…\n           argsShort: rg -n \\\"PermitIfAsync|TransitioningTriggerBehaviourAsync|GetInfo_should|Fixed…\n           blobRef: b05686893b47e9d311e5e65611bd1aa9155aa2ed53e925c0c56a8f9d63823786\n           callKey: 1b83885f3e50e4835cdc93997b966db54be73630100e6aea28d0e6222f18f147\n           durationMs: null\n ✖ │ │ ├╴$ sed -n '100,175p' test/Stateless.Tests/ReflectionFixture.cs rg -n \\\"class TransitioningT…\n           argsShort: sed -n '100,175p' test/Stateless.Tests/ReflectionFixture.cs rg -n \\\"class Tra…\n ↑↓ move • ←→ fold • ⏎ zoom • ⇥ pane • f follow • e err • [ ] seek • +/- verbosity=2 • ? • q quit\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"145\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-145\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-145\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-145.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;The tree reveals what lives under a round — the gateway call with its\nLOCKED cost and price source, and every command the agent ran, each with\na content-addressed blob ref; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rzq68au4\"&gt;v&lt;/code&gt; opens any full command/output in\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jf7szibl\"&gt;$EDITOR&lt;/code&gt; from the local blob store. (This frame browses the finished\nrun — the identical fold renders live, rows appearing as the agent makes\nthem.) Read the round list above it: the reviewer BOUNCED the first pass\n(r3 rework — the graph regression was not actually asserted), the\narbiter escalated, the lead rescoped with concrete direction, and r6's\nimplementer acted on it to approval — the review loop earning its keep\ninside a nine-round merge. Press &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bvqrnxk7\"&gt;-&lt;/code&gt; back to the executive altitude —\nverbosity 0 condenses to task headers (anomalies and steering always\nstay visible: honesty is not a tier).\n3. &lt;strong&gt;Stop/resume&lt;/strong&gt; (mention, don't perform): &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ny4lvyir\"&gt;q&lt;/code&gt; once = graceful pause,\nin-flight verdicts land, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lolp3v11\"&gt;theia run --resume&lt;/code&gt; continues from the log; a\nhard kill costs only in-flight attempts — the log is always a\nchain-intact prefix.&lt;/p&gt;\n&lt;p&gt;While it runs, the trust story: the implementer works in an &lt;strong&gt;isolated\nworkspace copy&lt;/strong&gt;; agents never run git — the platform commits, and only\nthe merger writes trunk (push capability does not exist anywhere in the\nkernel); the &lt;strong&gt;verifier executes the actual test suite in the task's own\nworkspace&lt;/strong&gt; and its exit code overrides any model claim — the \"agents\ngrading their own homework\" question has a mechanical answer.&lt;/p&gt;\n&lt;p&gt;Completion:&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;run run2ak7ypvyog222vtzpgsqut plan pln2ak7yprsmw223tk2wxg3k3 @ 8817582fe4c6… → 1 tasks\ntsk2ak7ypvyzg222vt2ouhe25 → merged (9 rounds) [include-async-trigger-info] Add regression coverage f\nor Ge…\nhalted: completed · 6 gateway calls · $0.2472\naudit chain: intact\nbudget remaining: 4.752821239999999\nmaintenance: 0 summaries refreshed, 0 orphan generations GCed\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button y ;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"160\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-160\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-160\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-160.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Scrub time with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ue30muvm\"&gt;[&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g5nr2eh0\"&gt;]&lt;/code&gt; — the tree re-folds from the event prefix:\n\"what did the run look like the moment the verifier passed\" is two\nkeystrokes. Every verdict node carries a copyable &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5u735iwe\"&gt;theia fork --at&lt;/code&gt;\ncommand — fork the run at that decision with different steering, and\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5i6qlcfh\"&gt;theia compare&lt;/code&gt; reports divergence, cost delta, and outcome delta, with\nthe shared prefix replayed from recordings for free.&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;$ theia replay &amp;lt;runId&amp;gt;           # byte-identical re-fold; the determinism gate\n$ theia audit verify             # every hash chain, end to end\n$ theia probe &amp;lt;runId&amp;gt; \"why did the implementer touch only one file?\"\n$ theia ask \"what is the verification gate in this workspace?\"\nThe verification gate is `dotnet test`; the xUnit suite must remain green.\n[fct:2ak7xr76o6…]\n\n[sources] fct:2ak7xr76o6…  chk:2ak7xr76oc…  src/Stateless/… · run:2ak7xtth3s…\n[ask run2ak7xuaad2… — $0.0010]\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"164\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-164\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-164\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-164.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tekaph0m\"&gt;ask&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-htpoimwg\"&gt;probe&lt;/code&gt; answer with citations and &lt;strong&gt;abstain at $0&lt;/strong&gt; when the\nrecords do not support an answer — an unsupported question cannot\nhallucinate. If anything ever goes wrong instead, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7dglr508\"&gt;theia diagnose &amp;lt;runId&amp;gt;&lt;/code&gt;\nruns root-cause analysis over the audit trail alone and remembers the\nfailure fingerprint — the platform has diagnosed its own integration gaps\nthis way (three shipped fixes carry those receipts in the ledger).&lt;/p&gt;\n&lt;h2 id=\"6-the-close-2-min\"&gt;&lt;a href=\"en/demo.html#6-the-close-2-min\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. The close (2 min)&lt;/span&gt;&lt;/a&gt;6. The close (2 min)&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Every claim is an artifact.&lt;/strong&gt; 608 tests, 2 machine-checked\nproofs, a hash-chained audit log per run, replay equality as an\ninvariant, and a methods ledger where every default carries its receipt\n— including the honest negatives.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Governance is mechanical.&lt;/strong&gt; The playbook rows a regulated buyer asks\nfor — spec approval, stop-and-fix, human merge authority, data-class\nmasking before any byte leaves the process, tamper-evident logs,\nagent_run_id-grade attribution — each exists here as a mechanism this\ndemo just poked (&lt;a href=\"en/00-vision.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-risr6os4\"&gt;00-vision.md §4&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The cost story is honest.&lt;/strong&gt; Every model call locks its USD at\nexecution; budgets pause resumable, never explode; the index amortizes\nto zero on unchanged code; and the evaluation harness measures the\nplatform against raw single-model baselines on live benchmarks — the\ndeltas are published per difficulty bucket, not as one aggregate\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zkum9i6y\"&gt;notes/06-eval-plan.md&lt;/code&gt;).&lt;/li&gt;\n&lt;li&gt;Deferred work is named and scoped in &lt;a href=\"en/13-roadmap.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dqscx3qk\"&gt;13-roadmap.md&lt;/code&gt;&lt;/a&gt;\n— queue rows, not gaps.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/demo.html","hreflang":"en"}],"style":["_assets/theia.css","_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"canonical":"en/demo.html","vcsPath":"en/demo.md"},"headings":[{"title":"1. Install (2 min)","href":"en/demo.html#1-install-2-min","level":2},{"title":"2. Out of the box, and where everything is configured (3 min)","href":"en/demo.html#2-out-of-the-box,-and-where-everything-is-configured-3-min","level":2},{"title":"3. The demo workspace, from one command (3 min)","href":"en/demo.html#3-the-demo-workspace,-from-one-command-3-min","level":2},{"title":"4. The run — live following on the flight deck (7 min)","href":"en/demo.html#4-the-run-live-following-on-the-flight-deck-7-min","level":2},{"title":"5. After the run — audit, time travel, counterfactuals (3 min)","href":"en/demo.html#5-after-the-run-audit,-time-travel,-counterfactuals-3-min","level":2},{"title":"6. The close (2 min)","href":"en/demo.html#6-the-close-2-min","level":2}],"title":"Aletheia — the guided walkthrough"},"router":{"pathname":"en/demo","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":
