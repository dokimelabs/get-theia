            {"data":{"leading":false,"html":"&lt;blockquote&gt;\n&lt;p&gt;Phasing follows one rule: each phase ships a vertically usable slice with\nits interpreters and receipts, never a horizontal layer cake. Deferral is\nclean (permanence discipline): a deferred item has concrete scope here, and\nthe shipped phases are self-consistent without it.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"phase-0-spine-foundations-everything-else-stands-on\"&gt;&lt;a href=\"en/13-roadmap.html#phase-0-spine-foundations-everything-else-stands-on\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Phase 0 — spine (foundations everything else stands on)&lt;/span&gt;&lt;/a&gt;Phase 0 — spine (foundations everything else stands on)&lt;/h2&gt;\n&lt;p&gt;Scope: monorepo scaffold (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8pyzbtmi\"&gt;schema&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-md7a0669\"&gt;terryid&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gh0vltte\"&gt;event-log&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d0annwz6\"&gt;store-sqlite&lt;/code&gt;,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-50h37ntj\"&gt;config&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1ebmunro\"&gt;otel&lt;/code&gt;); terryid + HLC with property tests mirroring the proofs;\nevent log with hash chain + replay; generations/heads + &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2n0a4b9t\"&gt;withTx&lt;/code&gt; + conformance\nsuites for the storage interfaces; YAML manifest loading; CI running\ntsc/tests/proofs/lints.\n&lt;strong&gt;Exit:&lt;/strong&gt; THE-001…005 verified; replay-equality green on synthetic logs;\nproofs compile in CI.&lt;/p&gt;\n&lt;h2 id=\"phase-1-gateway-fake-harness\"&gt;&lt;a href=\"en/13-roadmap.html#phase-1-gateway-fake-harness\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Phase 1 — gateway + fake harness&lt;/span&gt;&lt;/a&gt;Phase 1 — gateway + fake harness&lt;/h2&gt;\n&lt;p&gt;Scope: gateway engine with the seam vocabulary; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ik6zu60l\"&gt;harness-codex&lt;/code&gt; (subscription\nOAuth, exec/resume, stream parse, fault classify); &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t7avzqcd\"&gt;harness-fake&lt;/code&gt;\n(record/replay + synthesized verdicts); &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6bzvqtyt\"&gt;embeddings-openai&lt;/code&gt; with\n(provider,model,dims) stamping; cost table + locked USD; data-class masking\nhooks (detectors shared with Phase 3's write gate); gateway OTel spans +\nmetrics.\n&lt;strong&gt;Exit:&lt;/strong&gt; THE-010…016; golden wire fixtures per codex operation; a recorded\nsession replays byte-identically.&lt;/p&gt;\n&lt;h2 id=\"phase-2-codebase-model\"&gt;&lt;a href=\"en/13-roadmap.html#phase-2-codebase-model\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Phase 2 — codebase model&lt;/span&gt;&lt;/a&gt;Phase 2 — codebase model&lt;/h2&gt;\n&lt;p&gt;Scope: tree-sitter AST facts + query tools; AOCI-shaped intent index with\nimportance-budgeted entries, hash-keyed incremental builds, generation\npublishing, reconciler; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uzrtt0q1\"&gt;theia index&lt;/code&gt;; MCP exposure of the query tools;\ncodebase-QA benchmark harness (Where/What/How + oracle/raw arms).\n&lt;strong&gt;Exit:&lt;/strong&gt; THE-030; incremental-build call-count test; first ledger rows with\ncodebase-QA receipts on two pinned repos.&lt;/p&gt;\n&lt;h2 id=\"phase-3-memory\"&gt;&lt;a href=\"en/13-roadmap.html#phase-3-memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Phase 3 — memory&lt;/span&gt;&lt;/a&gt;Phase 3 — memory&lt;/h2&gt;\n&lt;p&gt;Scope: canonical facts (dual timestamps), two substrates, scoped trees with\ndirty-path refresh; retrieval lanes under the ported laws (union, RRF,\nconsensus-first, force-loads, sufficiency gate, concentration); temporal\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v5szly7e\"&gt;asOf&lt;/code&gt; reads; lifecycle ops; harness hooks (SessionStart…PreCompact) +\nmemory MCP tools; memory-bench (ability axes).\n&lt;strong&gt;Exit:&lt;/strong&gt; THE-031…034; freshness (build-rate) and axis scores on\nLongMemEval-style + BEAM-style sets recorded in the ledger; PreCompact Σ\ncheckpoint demonstrably bounds loss.&lt;/p&gt;\n&lt;h2 id=\"phase-4-kernel\"&gt;&lt;a href=\"en/13-roadmap.html#phase-4-kernel\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Phase 4 — kernel&lt;/span&gt;&lt;/a&gt;Phase 4 — kernel&lt;/h2&gt;\n&lt;p&gt;Scope: coordinator + phase FSM + pools + verdicts; Σ + plan DAG + Π; guards;\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zjas6pg4\"&gt;harness-claude&lt;/code&gt;; worktree/git discipline; roles (lead/planner/implementer/\nreviewer/verifier/merger/arbiter); tracks + gates (governance as policy\nvalues); kernel-sim suite on the fake harness; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1i1ufx79\"&gt;theia run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n5kbic87\"&gt;theia replay&lt;/code&gt;.\n&lt;strong&gt;Exit:&lt;/strong&gt; THE-020…027, THE-054; sim stories for every guard and gate;\ntask-bench baseline (single-shot vs scaffold) with paired stats on a pinned\nset; first cost-accuracy frontier plot.&lt;/p&gt;\n&lt;h2 id=\"phase-5-evaluation-and-governance-hardening\"&gt;&lt;a href=\"en/13-roadmap.html#phase-5-evaluation-and-governance-hardening\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Phase 5 — evaluation &amp;amp; governance hardening&lt;/span&gt;&lt;/a&gt;Phase 5 — evaluation &amp;amp; governance hardening&lt;/h2&gt;\n&lt;p&gt;Scope: the ledger as a doc + coverage check; two-tier acceptance harness;\nuncertainty calibration loop; diagnostician role (KRCA narrowing + skeleton\nprior + fingerprint reuse); anomaly events + incident path; vendor registry\nenforcement; audit anchoring.\n&lt;strong&gt;Exit:&lt;/strong&gt; THE-040…044; a full pilot-shaped report (the competitor's KPI\ntriple + our determinism/freshness/cost metrics) produced end-to-end by\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-inpphw06\"&gt;theia eval&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"status-2026-08-31,-two-implementation-trains-feature-complete\"&gt;&lt;a href=\"en/13-roadmap.html#status-2026-08-31,-two-implementation-trains-feature-complete\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Status — 2026-08-31, two implementation trains (feature-complete)&lt;/span&gt;&lt;/a&gt;Status — 2026-08-31, two implementation trains (feature-complete)&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Phase&lt;/th&gt;\n&lt;th&gt;State&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;0 — spine&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;LANDED&lt;/strong&gt;: terryid+HLC (proof-mirrored), event log (hash chain, replay fold), OCC generations, blobs, YAML config; 23 tests&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;1 — gateway&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;LANDED&lt;/strong&gt;: seam vocabulary, masking, cost lock, record/replay, retry; codex (subscription, resume), fake, OpenAI embeddings, local ONNX embeddings (the default; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vmhmww7b\"&gt;gateway.embeddings&lt;/code&gt; policy + read-seam identity law); live smoke receipts (ledger §1)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;2 — codebase model&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;LANDED&lt;/strong&gt;: tree-sitter registry + 13-language AST facts + query tools; incremental intent index (live receipts); retrieval union over the shared indexes (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0fzluot0\"&gt;index reindex&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cd37jg2g\"&gt;search&lt;/code&gt;); MCP exposure via &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4hmdpenb\"&gt;theia serve&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;3 — memory&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;LANDED&lt;/strong&gt;: dual-timestamp facts, version chains, near-dup gate, redacted chunks, generation indexes (tantivy+faiss), lane retrieval w/ consensus, as-of reads, scoped trees (dirty-path refresh), lifecycle maintain + GC, Claude Code hooks (context/recall/PreCompact checkpoints); live receipts. This train: local embeddings default, the Snowball lexical analyzer (receipt-promoted), the memory bench — retrieval and QA halves (notes/10 — the improve-loop instrument behind 18 §7), the bag- parity test, the sentence tier (built, opt-in until its receipt). Parked: asOf vector lane (ledger §3)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;4 — kernel&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;LANDED&lt;/strong&gt;: FSM-as-data, proved Σ, plan DAG+Π, coordinator+guards, gateway role runner + prompt overrides, command verifier, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dg1gcqtt\"&gt;theia run&lt;/code&gt; live end-to-end; worktree isolation + real merger, policy-bounded delegation, fresh-perspective dispatch&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;5 — eval/governance&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;LANDED&lt;/strong&gt;: ledger + replay equality + audit CLI; otel facade (Prometheus /metrics, OTLP→Jaeger tracing), anomaly taxonomy (AgentOps classes, drift-tested), diagnostician (rule table + fingerprint reuse), calibration (armed; awaiting logprob-bearing transport), index-bench. Deferred by the roadmap table: jail, workflow synthesis; parked with fallback: asOf vector lane&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Since that table, three further trains landed (every mechanism with its\nledger §1 receipt; decision history in git + the ledger): the review train\n(run views incl. the TUI default, copy workspaces + sandbox tiers with both\nfull-access cells probed live, plan artifacts, clarify/interactivity,\nresume/steer/fork/compare, stdin briefs, index status, structured commits,\nmulti-root workspaces with the changeset envelope, the asOf vector lane,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2htc5d12\"&gt;theia jail&lt;/code&gt;), the autonomy wave (verifier workspace scoping, the agent-side\nMCP belt + rules-SoT ladder, context alerts, the CLI-first Claude harness\nwith cross-family review receipts, task-targeted steering + probe/ask, the\nhome screen + &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ftmga84d\"&gt;@file&lt;/code&gt; briefs, dagger-grade TUI polish, freshness\nautomation, codex hooks install, closest-scope-first per-root overlays),\nand the eval train (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nxpyczdi\"&gt;theia eval swebl&lt;/code&gt; — the SWE-bench-Live three-posture\nharness; the C# smoke ladder itself is parked mid-flight with full pickup\nstate in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7y4h7nw4\"&gt;notes/06-eval-plan.md&lt;/code&gt; §7). Demo\nwalkthrough: &lt;a href=\"en/demo.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-phf1uhn7\"&gt;demo.md&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;h2 id=\"queued-decided,-not-started-re-enters-by-the-chiefs-call\"&gt;&lt;a href=\"en/13-roadmap.html#queued-decided,-not-started-re-enters-by-the-chiefs-call\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Queued (decided, not started — re-enters by the chief's call)&lt;/span&gt;&lt;/a&gt;Queued (decided, not started — re-enters by the chief's call)&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Item&lt;/th&gt;\n&lt;th&gt;State&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;EVAL-SMOKE&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;EXECUTED 2026-09-13 (receipt &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aaojl864\"&gt;docs/eval/receipts/swebl-cs-smoke-r2.md&lt;/code&gt;): full 3×3 matrix — median RESOLVED by S0.5 ($0.05) and S1 ($2.36) over S0's miss (the ladder's designed shape), easy closed unresolved-by-instance-ambiguity at N=5 with every mechanical axis fixed+verified, hard excluded-with-reason (gold stable 97/106 on this box). NEXT: N=3 on the resolved pair before any claimed delta, a wider cs draw (n≈10) for signal, then the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5uscoip9\"&gt;theia-ts20&lt;/code&gt; stage per notes/06&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Document ingestion &amp;amp; understanding&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xvv1f4ef\"&gt;kind: DocSource&lt;/code&gt; — prose ingestion (local globs first — the .md-invisible gap — then MCP list/fetch sources), content-addressed cache, heading-aware chunks, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5fr5qmrw\"&gt;docs:&amp;lt;source&amp;gt;&lt;/code&gt; generation lanes unioned into retrieval; PLUS document understanding: PDF/Excel/Word/image parsing + indexing, and the orchestrator's task analysis consuming such artifacts when a tracker MCP hands over an issue with attachments (attachment ingestion feeds plan/context collection, not only retrieval). Approach fixed: heuristic-first structure parsing per the Oracle visual-element paper (vector-line/alignment tables, form tiers, caption association, fragment merge, watermark filtering; NO VLM in the hot path — fits low-end boxes); charts via the OneChart model (franken_ocr as the runner reference); a claude-skill-style PDF extraction workflow REPLACES the default pdf parsing tool. Excluded with reason: Baidu Unlimited-OCR cannot run on low-end machines (the hardware bound goes in the ledger row when this lands). &lt;strong&gt;Full design now in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dutwp2jf\"&gt;19-documents.md&lt;/code&gt;&lt;/strong&gt; (element trees, fragment edges, KEY-summary descent, media sidecars; M12–M17)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Lead &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hb46oc97\"&gt;accept&lt;/code&gt; verdict&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;SHIPPED 2026-09-07 (ledger §1): &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tm3oidog\"&gt;escalated --lead_accept--&amp;gt; merge&lt;/code&gt;, unverified-accept refused, vendored prompt law — earned by the 34521 r2 full-scale receipt (verified-done work discarded, dependents stranded)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Fork-owned run branches&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;a fork of a run-branch run resumes in-checkout today (the parent-branch aliasing hazard is refused, not silently taken — cmd-run says so); fork mode should cut its own branch from the parent branch tip&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Mid-run agent-callable RCA&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1hmsxapq\"&gt;run_diagnose&lt;/code&gt; from inside a live run (today: post-hoc over stored logs)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Daemon live-message delivery&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;cross-process &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4d1x4hrt\"&gt;msg&lt;/code&gt; reaching a live run immediately (today: next-rehydration with the honest hint)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Fact-edge graph&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;hop pre-computation at memory ingest (pseudo-query ANN links, density cap, tombstoned generations; source receipt 0.617→0.842 multi-hop) — earns its slot behind a multi-hop workload; docs/07 §3&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Memory depth&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;targeted deletion by provenance ref (GDPR-shaped); decay/merge consolidation; the retrieval stages carrying laws 7–9 (force-loads, sufficiency gate, block concentration) — each re-earns its receipt on our benchmarks. The scene/topic family is superseded by the &lt;strong&gt;world-view group layer&lt;/strong&gt;, designed with the adaptive-retrieval + context-governance set in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-21zgrmfd\"&gt;18-memory-structure.md&lt;/code&gt; (M1–M11, phased receipts §7)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i0rsuc4p\"&gt;ask&lt;/code&gt; blueprint-slice lane&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;architecture-shaped questions under-retrieve on the k=6 union (the repomix-eval receipt, notes/07) — force-load top-importance blueprint entries for how-shaped asks&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Task-scoped blueprint projection&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;the intelligent successor to the complete-blueprint posture (docs/05 §5): touched entries + their R-closure + the importance-9 backbone, receipt-gated against the complete map on the eval ladder — a projection that loses to the full map is the AOCI partial-view defect class re-invented. Since 2026-09-07 the plan artifact carries the SAME map the run injects (caps removed; the approval digest therefore couples to the map's content — accepted until this redesign, where a map-generation digest may become the record) and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c9zvul0i\"&gt;run.blueprintMinImportance&lt;/code&gt; is the interim dose control at window-exceeding scale (notes/20). Analysis + design + evaluation = its own session (notes/18)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;PII granular control&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;redesign of the data-class machinery for per-class, per-path control (which detector classes block vs mask vs pass, per calling surface); supersedes the interim indexer mask-not-block exception on THE-014 (docs/05 §2). Until it lands, the detector set stays small and high-precision, and the indexer masks (notes/18)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Vacuous-check warning at plan time&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;SHIPPED 2026-09-12: the pre-flight names every task whose EVERY check passes at base (green→green attests nothing; the demo-cs run &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4jb3azja\"&gt;2ak7y7cquk…&lt;/code&gt; merged a fix on exactly such a check) — a red first entry (red→green) stays silent; (root HEAD, command)-keyed pre-flight reuse still queued if plan-time latency ever warrants a cache&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Vendor semantic loader&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;selection-as-retrieval over the vendored rules/skills set (~200 docs): BM25+embedding index as a treeHash-keyed generation, Summary-line routing, per-role budget policy values, force-load pins, digest-audited selection — full design in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8dqpxath\"&gt;notes/08-vendor-context-semantic-loader.md&lt;/code&gt;; unified with the workspace/user rules &amp;amp; skills layer in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n57ioa5b\"&gt;20-rules-skills.md&lt;/code&gt; (one selection engine, funnel stages as measured escalation); NEXT SESSION's work&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Vetted profiles&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7cyk8emg\"&gt;kind: Profile&lt;/code&gt; — a curated bundle of MCP servers (auto-install specs, env-var NAMES only), belt tool grants, context entries, and key-wise policy overlays; one new outermost layer under the T-Z precedence, pinned by source+hash, offered at init/setup with a vendored generic default; company tier = per-org profile repos via fine-grained PATs (privacy-preserving distillation of learned memory into profile rules is deliberately later). Full design in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r4fry7bv\"&gt;notes/13-vendored-profiles.md&lt;/code&gt;; step 1's receipt is a null (resolved config byte-identical with and without the layer)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Real-task Azure eval&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;two completed C# tasks from a production Azure DevOps project (one easy-medium, one product-understanding-bound), reconstructed at &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-derstv1j\"&gt;lastMergeCommit^1&lt;/code&gt; of their linked PRs, run under the swebl posture ladder with the environment skill + C#/MSSQL rules injected; graded by the reference PR's own tests + a review-shaped judge; the case-2 axis: with vs without the ticket-comments/wiki evidence set. Protocol in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4k5ctw9e\"&gt;notes/14-azure-eval-protocol.md&lt;/code&gt;; blocked on a read-only PAT&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Observability follow-ups&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;per-task diff view over kept audit branches; role-lane TUI grouping (the overseer agents-tab fold); live assistant text behind the spinner; harness session import by recorded &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uw42qhyl\"&gt;sessionId&lt;/code&gt;; exchange-blob retention policy — queue + shapes in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wm5iijih\"&gt;notes/12-observability-completeness.md&lt;/code&gt; §4&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Release pipeline first live pass&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;cut &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b10j7taw\"&gt;v0.2.N-pre.1&lt;/code&gt; via cut-release.mts, watch release.yml build+publish+verify on hosted runners, promote via promote.yml (typed confirmation), confirm retention prune applies (the local --apply was permission-blocked this session; the dry-run receipt stands)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Second-reviewer promote gate&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tz4x3oay\"&gt;environment: release-approval&lt;/code&gt; with required reviewers on the approve job — the API refuses the protection rule on the current plan (422, billing); re-add when the plan supports it&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Mechanical release immutability&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;tag ruleset on theia-releases (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h5c35k0l\"&gt;{\"target\":\"tag\",\"rules\":[{\"type\":\"update\"},{\"type\":\"non_fast_forward\"}]}&lt;/code&gt; on &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eujviva1\"&gt;refs/tags/v*&lt;/code&gt;, deletion allowed) + the immutable-releases setting — both 403 on the current plan; docs/17 §3 carries the by-construction posture until then&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"deferred-owned,-scoped,-not-started\"&gt;&lt;a href=\"en/13-roadmap.html#deferred-owned,-scoped,-not-started\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Deferred (owned, scoped, not started)&lt;/span&gt;&lt;/a&gt;Deferred (owned, scoped, not started)&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Item&lt;/th&gt;\n&lt;th&gt;Scope sketch&lt;/th&gt;\n&lt;th&gt;Blocked on&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Session continuity as Σ projection&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;re-cut &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f64l6pq9\"&gt;run.sessionContinuity&lt;/code&gt; to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v88dw8fv\"&gt;off | sigma-shared&lt;/code&gt; (notes/15): shared cross-round state = the Σ-projected stable prefix only; prompt stable-ordering for provider prefix-cache (land first, pure win); per-harness checkpoint-fork probes; the continuity receipt then gates the default. Follow-on: Self-GC controllable-accumulation increment (read sgc-/sskill- first, notes/15 §7) to ground review-loops without uncurated resume&lt;/td&gt;\n&lt;td&gt;this session's eval receipt + the paper analysis&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Jail residuals&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;the bwrap &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fs8skn0i\"&gt;theia jail&lt;/code&gt; + jailed-full tier are shipped (10-integrations §6); deferred residuals: full child-subreaper sweep, per-harness RW registry beyond codex, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d1drar8a\"&gt;--unshare-net&lt;/code&gt; policy&lt;/td&gt;\n&lt;td&gt;demand&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;FUSE mount&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;read views over &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9alze9k3\"&gt;.theia/&lt;/code&gt; (rendered cards, run timelines)&lt;/td&gt;\n&lt;td&gt;Phase 3 layouts frozen&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Postgres backend&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-72422twl\"&gt;store-postgres&lt;/code&gt; passing the conformance suites; local stores become cooperative in-progress state; multi-writer node ids in terryid&lt;/td&gt;\n&lt;td&gt;a real multi-user deployment demand&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Workflow synthesis&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;coop/nexus-style role-graph synthesis + IPR loop, gated experimental&lt;/td&gt;\n&lt;td&gt;Phase 4 + eval receipts to judge it&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Additional harnesses&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;opencode/gemini adapters (translational only)&lt;/td&gt;\n&lt;td&gt;demand + fixtures&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;External T-SQL parser (Rust/Go)&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;upgrade the SQL facts hybrid's scan arm with a real T-SQL AST (sqruff / sqlparser-rs class, prebuilt binary, doctor-probed, honest degrade to the shipped hybrid — the jail's probe pattern)&lt;/td&gt;\n&lt;td&gt;demand: a corpus where the hybrid measurably under-extracts&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Windows as a first-class target&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;RUNTIME LANDED (notes/23): git-bash spawn substrate, portable copies/kills/reaper, AppContainer jail backend, launcher windows keys, build-sea windows cell — receipts on the eval VM; remaining: hosted CI windows cell (gated on the local build receipt), install.ps1, PATH polish&lt;/td&gt;\n&lt;td&gt;eval receipts → release-cell follow-up&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Container tool provider&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;docker-wrapped external agents/tools as graph nodes (coop shape), riding the jail's spawn-wrapper seam&lt;/td&gt;\n&lt;td&gt;demand&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"standing-risks,-named\"&gt;&lt;a href=\"en/13-roadmap.html#standing-risks,-named\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Standing risks, named&lt;/span&gt;&lt;/a&gt;Standing risks, named&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Codex/Claude surface drift&lt;/strong&gt; — harness CLIs and hook surfaces change\nunder us. Mitigation: adapters are thin + fixture-tested; doctor probes\ndetect breakage at startup, not mid-run (THE-013).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Index/summary cost at scale&lt;/strong&gt; — intent entries and tree summaries are\nmodel-priced. Mitigation: importance budgets, hash-gated regeneration,\nbuild-rate as a first-class benchmark (landed: build-rate observability +\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ztlydch2\"&gt;theia eval index-bench&lt;/code&gt; — receipt in ledger §1).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Determinism leaks&lt;/strong&gt; — any un-evented nondeterminism breaks THE-043.\nMitigation: replay CI from Phase 0 so leaks surface the week they enter.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Doc rot&lt;/strong&gt; — this set is prose. Mitigation: the invariant catalog carries\nthe checkable core; receipts live in the ledger; prose defers to both.&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/13-roadmap.html","hreflang":"en"}],"style":["_assets/theia.css","_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"canonical":"en/13-roadmap.html","vcsPath":"en/13-roadmap.md"},"headings":[{"title":"Phase 0 — spine (foundations everything else stands on)","href":"en/13-roadmap.html#phase-0-spine-foundations-everything-else-stands-on","level":2},{"title":"Phase 1 — gateway + fake harness","href":"en/13-roadmap.html#phase-1-gateway-fake-harness","level":2},{"title":"Phase 2 — codebase model","href":"en/13-roadmap.html#phase-2-codebase-model","level":2},
