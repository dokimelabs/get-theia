        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"1-the-failure-this-closes\"&gt;&lt;a href=\"en/16-release.html#1-the-failure-this-closes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The failure this closes&lt;/span&gt;&lt;/a&gt;1. The failure this closes&lt;/h2&gt;\n&lt;p&gt;Tool distribution fails users four ways: installers that guess wrong (an\namd64 binary on an arm Mac, a curl|sh that overwrites config), version\ndrift that cannot be pinned, releases that ship unverified (the artifact\nbuilt fine — nobody ran it the way a customer would), and updates that\ncannot be escaped when they break. The pipeline below closes all four:\nartifacts are verified AS A CUSTOMER before promotion (THE-060), versions\nare automatic and causally ordered, the installer doubles as the recovery\nlever (THE-063), and the vendor's prompt/rule deliverables update by hash\nout of band of binary releases (THE-065).&lt;/p&gt;\n&lt;h2 id=\"2-the-three-repositories\"&gt;&lt;a href=\"en/16-release.html#2-the-three-repositories\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. The three repositories&lt;/span&gt;&lt;/a&gt;2. The three repositories&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Repo&lt;/th&gt;\n&lt;th&gt;Visibility&lt;/th&gt;\n&lt;th&gt;Role&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yap58rf9\"&gt;dokimelabs/get-theia&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;public (GitHub Pages)&lt;/td&gt;\n&lt;td&gt;the first-stage installer: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8pxlq4a8\"&gt;curl -fsSL https://dokimelabs.github.io/get-theia/install.sh | sh&lt;/code&gt; — detects os/arch, prompts for the PAT (or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0z5aj852\"&gt;$THEIA_PAT&lt;/code&gt;), resolves the latest RELEASE (or the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eqhpp4kl\"&gt;$THEIA_VERSION&lt;/code&gt; pin), sha256-verifies, run-verifies BEFORE the symlink flips, seeds vendor deliverables, offers first-run setup. Also the documentation site: the landing/download page plus the Diplodoc-built user guide (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pne8bljs\"&gt;docs/&lt;/code&gt;) and platform reference (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gsewf6f9\"&gt;reference/&lt;/code&gt;), built in CI by &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7569ibny\"&gt;publish-artifact-repos.yml&lt;/code&gt; from &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8kjuwvw4\"&gt;docs/sources/&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rr679zhn\"&gt;install.sh&lt;/code&gt; stays at the published root (THE-063)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-enyp94zt\"&gt;dokimelabs/theia-releases&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;private&lt;/td&gt;\n&lt;td&gt;release artifacts only; downloads require an end-user/company PAT — distribution IS the access gate&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y2x5hzgx\"&gt;dokimelabs/theia-dev&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;private&lt;/td&gt;\n&lt;td&gt;the source + ALL workflows; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wvgekxch\"&gt;RELEASES_PAT&lt;/code&gt; is the publish credential — a fine-grained token owned by &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r8jd1tf4\"&gt;dokimelabs&lt;/code&gt;, scoped to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-osnxjvwm\"&gt;theia-releases&lt;/code&gt; only (Contents: read+write), verified to 404 on &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-69kizu1b\"&gt;theia-dev&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The org's base permission is &lt;strong&gt;read&lt;/strong&gt;; the artifact repos carry no history\nand no collaboration, and the fork-based contribution flow with the\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hig5x4xp\"&gt;/merge&lt;/code&gt; gate is &lt;a href=\"en/17-collaboration.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zzyih6ce\"&gt;17-collaboration.md&lt;/code&gt;&lt;/a&gt;.&lt;/p&gt;\n&lt;p&gt;Windows runtime support is landed (notes/23; the launcher accepts\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-umsz9sr2\"&gt;windows-x86_64/aarch64&lt;/code&gt; keys and build-sea carries the cell) — the hosted\nrelease cell + install.ps1 follow the local build receipt. Intel macOS\n(darwin/x86_64) is out of the release set — refused BY NAME by launcher\nand installer.&lt;/p&gt;\n&lt;h2 id=\"3-the-pipeline-pre-release-verify-approve-release\"&gt;&lt;a href=\"en/16-release.html#3-the-pipeline-pre-release-verify-approve-release\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. The pipeline — pre-release → verify → approve → release&lt;/span&gt;&lt;/a&gt;3. The pipeline — pre-release → verify → approve → release&lt;/h2&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;operator: cut-release.mts ──tag v0.2.N-pre.M──▶ release.yml\n  build-matrix (3 cells + vendor) ─▶ publish PRE-RELEASE ─▶ verify (3 targets,\n  customer-shaped: public installer + THEIA_VERSION pin + harness-fake smoke)\n        │ green\noperator: promote.yml (manual dispatch + typed version confirmation)\n  provenance check (verified run at the SAME commit; no double-promote)\n  ─▶ rebuild at that commit, bare version baked ─▶ publish RELEASE\n  ─▶ post-verify (same customer path ×3) ─▶ on failure: automatic retraction\n  ─▶ prune retention (dry-run printed, then applied)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"68\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-68\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-68\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-68.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Only &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6cy4o2dz\"&gt;v*-pre.N&lt;/code&gt; tags build.&lt;/strong&gt; A plain &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-48mqhm4r\"&gt;v*&lt;/code&gt; tag fails the guard loudly:\ncustomer releases exist only by promotion (THE-060/061).\n1a. &lt;strong&gt;No Actions artifacts, by construction.&lt;/strong&gt; The pipeline stages\neverything on a DRAFT release: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l0zb8avl\"&gt;prepare&lt;/code&gt; creates it, build cells\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h2cslzav\"&gt;gh release upload&lt;/code&gt; straight into it, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s7ebnwx7\"&gt;publish&lt;/code&gt; merges the\nper-platform checksums into one &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sip6uoj9\"&gt;checksums.txt&lt;/code&gt; and flips\ndraft→published atomically — release-asset storage carries bytes the\nrelease needs anyway, so the free-org Actions quota has no surface\nleft. The quota blocked publishing TWICE before this design\n(v0.2.199: 3.2GB of stale 90-day-retention transport artifacts;\nv0.2.201 first attempt: a stale over-quota billing snapshot refusing\nuploads hours after every artifact was deleted — usage recalculates\nevery 6-12h, and deletion does not un-block within the lag). A failed\nrun leaves the draft — invisible to customers, reused by a re-run of\nthe same tag; promote's approve sweeps a stale draft and its rollback\nretracts draft or published alike.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Verification is the customer's path, not the builder's&lt;/strong&gt;: the runner\ncurls the PUBLIC installer, pins &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vafyxdm2\"&gt;THEIA_VERSION&lt;/code&gt; to the pre-release, and\nruns &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pv3hjdzo\"&gt;scripts/verify-install.sh&lt;/code&gt; — version match, doctor, init, mem\nadd/search (the native-runtime receipt), and a full kernel run routed to\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aewmu7j3\"&gt;harness-fake&lt;/code&gt;'s green rulebook (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wqrjnfsb\"&gt;THEIA_FAKE_RULEBOOK=green&lt;/code&gt;): real FSM,\nreal verify-command execution, real event log — only the model\nsynthesized (THE-041). Exit 0 + \"audit chain: intact\" required.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Promotion is a manual act&lt;/strong&gt; — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eme2zthq\"&gt;workflow_dispatch&lt;/code&gt; with the pre-tag AND\na typed repeat of the release version (the fat-finger gate). On a plan\nwith private-repo environment protection, add\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8vh8j1gl\"&gt;environment: release-approval&lt;/code&gt; to the approve job for a second\nreviewer. The rebuild differs from the verified bytes ONLY in the baked\nversion (pre-releases bake &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pp53hpkg\"&gt;-pre.N&lt;/code&gt; so &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oom1c7uu\"&gt;theia version&lt;/code&gt; is honest for\ndevelopers; releases bake the bare version so launcher arithmetic stays\nexact) — and post-verify re-runs the whole customer smoke on the\nreleased bytes, retracting the release automatically on failure.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"4-versions-automatic-patch,-operator-owned-tagging\"&gt;&lt;a href=\"en/16-release.html#4-versions-automatic-patch,-operator-owned-tagging\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Versions — automatic patch, operator-owned tagging&lt;/span&gt;&lt;/a&gt;4. Versions — automatic patch, operator-owned tagging&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v6waq30m\"&gt;VERSION&lt;/code&gt; holds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c0ex3piz\"&gt;MAJOR.MINOR&lt;/code&gt; (a deliberate operator edit). The patch is\nthe commit count since VERSION last changed (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vpf2br30\"&gt;scripts/version.mts&lt;/code&gt;), so\nevery commit owns a unique, growing, causally ordered version — the Chrome\nshape — with zero bookkeeping. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-awummwe3\"&gt;scripts/cut-release.mts&lt;/code&gt; turns HEAD into\nthe next &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mk0mcwkm\"&gt;v&amp;lt;ver&amp;gt;-pre.N&lt;/code&gt; tag and pushes (refusing a dirty tree); WHEN to cut\nand WHEN to promote stay human decisions. Ordering (releases above their\nprereleases, numeric fields) is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xbxye3sg\"&gt;compareVersions&lt;/code&gt; in the launcher —\ntested, and used by staleness so a pinned newer build is never nagged\n\"update available\" toward an older latest. The considered alternative —\nrelease-please's conventional-commit automation (see ~/work/meridian) —\nwas rejected for coupling version arithmetic to commit-message discipline;\nthe git-count scheme needs none.&lt;/p&gt;\n&lt;h2 id=\"5-channels,-the-launcher,-self-management\"&gt;&lt;a href=\"en/16-release.html#5-channels,-the-launcher,-self-management\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Channels, the launcher, self-management&lt;/span&gt;&lt;/a&gt;5. Channels, the launcher, self-management&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jmiyi723\"&gt;~/.config/theia/config.yaml&lt;/code&gt; (0600):&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;github:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;pat:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;ghp_…&lt;/span&gt; }        &lt;span class=\"hljs-comment\"&gt;# release download, staleness, self update&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;openai:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;apiKey:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;sk-…&lt;/span&gt; }      &lt;span class=\"hljs-comment\"&gt;# openai embedding posture only (OPENAI_API_KEY env wins); local models: ~/.cache/theia/models&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;dev:&lt;/span&gt;    { &lt;span class=\"hljs-attr\"&gt;root:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;~/work/theia-dev&lt;/span&gt; }\n&lt;span class=\"hljs-attr\"&gt;update:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;channel:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;release&lt;/span&gt; }  &lt;span class=\"hljs-comment\"&gt;# 'prerelease' = developer opt-in (THE-062)&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"98\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-98\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-98\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-98.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;End users resolve &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bb3ipj6r\"&gt;releases/latest&lt;/code&gt;, which by GitHub API contract never\nreturns a pre-release; the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jq7fsptd\"&gt;prerelease&lt;/code&gt; channel (set only by\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7hl4n85v\"&gt;theia setup --channel prerelease&lt;/code&gt;, never the installer) resolves the\nnewest version INCLUDING &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3nn9rb8w\"&gt;-pre.N&lt;/code&gt; builds. Explicitly selecting a\npre-release always requires the exact suffix (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gvhruyr8\"&gt;--x-release 0.2.17-pre.1&lt;/code&gt;) —\nartifact names carry it, so a typo'd bare version cannot match (THE-061).\nThe launcher resolution order (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6jbqfo91\"&gt;--dev&lt;/code&gt; &amp;gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v0yk72ag\"&gt;--x-release&lt;/code&gt; &amp;gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ajhfnabo\"&gt;THEIA_X_RELEASE&lt;/code&gt;&lt;/p&gt;\n&lt;blockquote&gt;\n&lt;p&gt;self), the cache under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wecvsaqf\"&gt;~/.cache/theia/releases/&amp;lt;v&amp;gt;&lt;/code&gt;, checksum\nverification, and the loud no-silent-fallback error (THE-017) are\nunchanged. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8tdl8f2x\"&gt;theia self update&lt;/code&gt; updates the binary per channel AND runs the\nvendor phase (§9) on both arms.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h3 id=\"5a-first-run-setup\"&gt;&lt;a href=\"en/16-release.html#5a-first-run-setup\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5a. First-run setup&lt;/span&gt;&lt;/a&gt;5a. First-run setup&lt;/h3&gt;\n&lt;p&gt;Bare &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fxfdgkt2\"&gt;theia&lt;/code&gt; on a terminal with an unconfigured environment (no user\nconfig and/or no workspace upward) offers the guided setup instead of\nhelp: global config (PAT + OpenAI key, hidden input) → project init at cwd\n(optional multi-root; the home project is the primary root) → harness\nchoice seeded by the doctor probes → credential guidance naming each\nfamily's login command. Configured environments keep the home screen;\nnon-TTY keeps help. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mbctmmu4\"&gt;theia setup --interactive&lt;/code&gt; is the global half alone —\nthe installer offers it after a fresh install when the config lacks keys.&lt;/p&gt;\n&lt;h2 id=\"6-issuing-end-user-tokens\"&gt;&lt;a href=\"en/16-release.html#6-issuing-end-user-tokens\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Issuing end-user tokens&lt;/span&gt;&lt;/a&gt;6. Issuing end-user tokens&lt;/h2&gt;\n&lt;p&gt;Distribution IS the access gate, so \"licensing a customer\" = minting a\ntoken that can download releases and nothing else. GitHub has &lt;strong&gt;no API for\ncreating PATs&lt;/strong&gt;, so &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o3762a00\"&gt;scripts/mint-release-token.mts &amp;lt;customer&amp;gt;&lt;/code&gt; replicates\nthe device-auth SHAPE around the web mint: it opens the fine-grained token\npage pre-filled via GitHub's template-URL parameters (name, description,\ntarget_name, expires_in — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-84plh1oa\"&gt;MINT_EXPIRES_DAYS&lt;/code&gt; overrides the 90-day\ndefault — and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2t7gu75u\"&gt;contents=read&lt;/code&gt;; repository SELECTION has no URL parameter\nand is the one manual click, called out in the printout), and verifies the pasted\ntoken before delivery — installer-shaped reads must pass, and ANY\nvisibility into &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aigfh548\"&gt;theia-dev&lt;/code&gt; refuses the token as over-broad (the\noperator's own broad token fails this gate; receipt in the commit log).\nIt prints the sha256 fingerprint (the audit handle; the value is never\nstored) and the customer install snippet.&lt;/p&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xils9swk\"&gt;--device&lt;/code&gt; runs the REAL RFC 8628 device grant (the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2sp2xn6o\"&gt;gh auth login&lt;/code&gt;\nmechanism) for the collaborator alternative: the customer's GitHub account\nis invited read-only to theia-releases, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-56vtjk50\"&gt;THEIA_OAUTH_CLIENT_ID&lt;/code&gt; names a\nonce-registered OAuth app, the script prints the code + opens the\nverification page + polls to authorization — an operator-assisted session\nmint. The resulting token passes the SAME verification gates, so a\ncustomer who can see theia-dev is refused identically. One token per\ncustomer; revocation = delete that token. The many-customers upgrade (a\nGitHub App vending short-lived installation tokens) stays roadmap-shaped.&lt;/p&gt;\n&lt;h2 id=\"7-retention-prune-by-policy,-pin-by-contract\"&gt;&lt;a href=\"en/16-release.html#7-retention-prune-by-policy,-pin-by-contract\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. Retention — prune by policy, pin by contract&lt;/span&gt;&lt;/a&gt;7. Retention — prune by policy, pin by contract&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0fi6wl9h\"&gt;scripts/prune-releases.mts&lt;/code&gt; keeps: the 2 newest releases, the single\nnewest pre-release, every version pinned in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tvfd677m\"&gt;release-pins.yaml&lt;/code&gt; (version +\ncommit + reason + customer — the support contract), and drafts; everything\nelse is deleted from theia-releases, release AND tag. Dry-run by default,\ndestructive only under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-70cj8t4r\"&gt;--apply&lt;/code&gt;; the promote workflow prints the dry-run\nbefore applying (THE-064). When a release is pruned, its &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ast1gmzf\"&gt;theia-dev&lt;/code&gt; tag\nis deleted by the operator in the same pass — an old tag re-pushed later\nexecutes the release workflow of ITS OWN tree, which may predate the\npromotion guard (ledger §4). Ordering is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p8bkhanl\"&gt;compareVersions&lt;/code&gt;; a mis-flagged\ntag with a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7k0cd13u\"&gt;-pre.&lt;/code&gt; suffix counts as a prerelease either way.&lt;/p&gt;\n&lt;h2 id=\"8-artifacts-and-the-verification-scenario\"&gt;&lt;a href=\"en/16-release.html#8-artifacts-and-the-verification-scenario\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;8. Artifacts &amp;amp; the verification scenario&lt;/span&gt;&lt;/a&gt;8. Artifacts &amp;amp; the verification scenario&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7p0qgsi2\"&gt;theia-v&amp;lt;ver&amp;gt;-&amp;lt;os&amp;gt;-&amp;lt;arch&amp;gt;.tar.gz&lt;/code&gt; (SEA executable + &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mhoy2nnf\"&gt;lib/&lt;/code&gt; native runtime\n— sqlite, faiss, tantivy, tree-sitter grammars, and onnxruntime for local\nembeddings, installed with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6nx7emep\"&gt;ONNXRUNTIME_NODE_INSTALL=skip&lt;/code&gt; so the 1 GB\nCUDA providers never enter a customer artifact — + &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-88z1ehe7\"&gt;lib/vendor/&lt;/code&gt; deliverables), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5f7ddjt2\"&gt;checksums.txt&lt;/code&gt; (per-platform files\nconcatenated at publish — the merge-multiple pothole, ledger §4),\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-us515kfw\"&gt;vendor-manifest.json&lt;/code&gt;, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x9em3fqw\"&gt;theia-vendor-&amp;lt;treeHash&amp;gt;.tar.gz&lt;/code&gt;. The\nfunctional gate is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vdn9m9cc\"&gt;scripts/verify-install.sh&lt;/code&gt; (§3 item 2) — runnable\nlocally against any installed binary: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-teg0jaoq\"&gt;EXPECT_VERSION=… THEIA_BIN=… sh scripts/verify-install.sh&lt;/code&gt;.&lt;/p&gt;\n&lt;h2 id=\"9-vendor-deliverables-prompts/rules/skills-by-hash\"&gt;&lt;a href=\"en/16-release.html#9-vendor-deliverables-prompts/rules/skills-by-hash\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;9. Vendor deliverables — prompts/rules/skills by hash&lt;/span&gt;&lt;/a&gt;9. Vendor deliverables — prompts/rules/skills by hash&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vpic5w2c\"&gt;distribution/vendor/&lt;/code&gt; in theia-dev is the tree WE ship (docs and\nREADME there):\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wf3p5l02\"&gt;prompts/kernel.yaml&lt;/code&gt; is the ONLY role-prompt source — no compiled copy\nexists in code; a dev tree reads this same file lazily, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xv1boz90\"&gt;rules/&lt;/code&gt; +\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yw7sfloh\"&gt;skills/&lt;/code&gt; carry the architectural rules and technology playbooks (the\ngrowing ~200-document set the semantic-loader milestone selects over;\ndocs/13). Runtime resolution: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tbewaplk\"&gt;THEIA_VENDOR_DIR&lt;/code&gt; &amp;gt;\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-key5n1yt\"&gt;~/.local/share/theia/vendor/current&lt;/code&gt; (auto-updated) &amp;gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j6qc0oly\"&gt;lib/vendor&lt;/code&gt; beside\nthe executable (embedded) &amp;gt; the repo's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-odyd2l3r\"&gt;distribution/vendor&lt;/code&gt; dev tree. A broken or (in an embedded\nbuild) unresolvable tree FAILS the kernel verbs loudly naming the repair;\nversion/setup/self/doctor/init stay runnable — they are the way out\n(THE-065).&lt;/p&gt;\n&lt;p&gt;Packaging: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l64srss8\"&gt;scripts/build-vendor.mts&lt;/code&gt; names the artifact by the vendor\ntree's GIT TREE HASH (identical content = identical identity across\ncommits; a dirty tree refuses to package) with a per-file sha256 manifest.\nEvery release carries the manifest + tarball; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bgonil0y\"&gt;vendor.yml&lt;/code&gt; additionally\nships vendor-only updates to BOTH channels' newest published versions on\nany distribution/vendor/ change — the same release version can carry newer vendor\ncontent. Auto-update (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-euqers8n\"&gt;theia self update&lt;/code&gt;, both arms) consults the release OF THE\nVERSION THE MACHINE RUNS — never blindly the newest: fetch that release's\nSMALL manifest, compare treeHash — equal means done with no artifact\ndownload (the checksums-only fast path) — else download the tarball,\nverify every file's sha256, install under the hash, flip &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9xr2fnp2\"&gt;current&lt;/code&gt;\natomically. Every release carries its own manifest INSIDE the artifact\ntoo, so a pruned release still verifies and reports correspondence fully\noffline; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k6idopqv\"&gt;theia doctor&lt;/code&gt; prints exactly that: the resolved set verified\nagainst its manifest, and whether it matches this release's embedded\nhashes or is a newer auto-updated set. The installer seeds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wz33tpmp\"&gt;current&lt;/code&gt; from\nthe embedded copy when absent.&lt;/p&gt;\n&lt;p&gt;Prompt-consumption today: role prompts load from the resolved vendor tree\nat every invocation (user &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qo6fotp8\"&gt;.theia/prompts&lt;/code&gt; overrides still append after —\nclosest scope last); rules/skills reach agent context via explicit\nContext-manifest references. The semantic selection layer over the full\nvendored set is designed in notes/08 and scheduled in docs/13.&lt;/p&gt;\n&lt;h2 id=\"10-ci\"&gt;&lt;a href=\"en/16-release.html#10-ci\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;10. CI&lt;/span&gt;&lt;/a&gt;10. CI&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-05guns7v\"&gt;ci.yml&lt;/code&gt; is path-scoped (dorny/paths-filter): TypeScript and Coq jobs run\nonly when their inputs moved. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0crn0f1n\"&gt;build-matrix.yml&lt;/code&gt; is the reusable build\n(3 SEA cells + the vendor artifact; version injected — release builds\nnever re-derive it on a detached checkout). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b9vac368\"&gt;release.yml&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g1pagwro\"&gt;promote.yml&lt;/code&gt;,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lrzwc2ob\"&gt;vendor.yml&lt;/code&gt; per §3/§9. The SEA build script speaks zx (A20) and\nauto-fetches an official Node base when the running Node lacks the SEA\nfuse (the Fedora-shim pothole, ledger §4).&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/16-release.html","hreflang":"en"}],"style":["_assets/theia.css"],"canonical":"en/16-release.html","vcsPath":"en/16-release.md"},"headings":[{"title":"1. The failure this closes","href":"en/16-release.html#1-the-failure-this-closes","level":2},{"title":"2. The three repositories","href":"en/16-release.html#2-the-three-repositories","level":2},{"title":"3. The pipeline — pre-release → verify → approve → release","href":"en/16-release.html#3-the-pipeline-pre-release-verify-approve-release","level":2},{"title":"4. Versions — automatic patch, operator-owned tagging","href":"en/16-release.html#4-versions-automatic-patch,-operator-owned-tagging","level":2},{"title":"5. Channels, the launcher, self-management","href":"en/16-release.html#5-channels,-the-launcher,-self-management","level":2,"items":[{"title":"5a. First-run setup","href":"en/16-release.html#5a-first-run-setup","level":3}]},{"title":"6. Issuing end-user tokens","href":"en/16-release.html#6-issuing-end-user-tokens","level":2},{"title":"7. Retention — prune by policy, pin by contract","href":"en/16-release.html#7-retention-prune-by-policy,-pin-by-contract","level":2},{"title":"8. Artifacts &amp; the verification scenario","href":"en/16-release.html#8-artifacts-and-the-verification-scenario","level":2},{"title":"9. Vendor deliverables — prompts/rules/skills by hash","href":"en/16-release.html#9-vendor-deliverables-prompts/rules/skills-by-hash","level":2},{"title":"10. CI","href":"en/16-release.html#10-ci","level":2}],"title":"Release &amp; distribution — pipeline, channels, installer, vendor deliverables"},"router":{"pathname":"en/16-release","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
