            {"data":{"leading":false,"html":"&lt;blockquote&gt;\n&lt;p&gt;The base shape. Subsystem contracts live in their own docs; this one holds\nthe layer map, the five seams and their vocabularies, the derived-state\nplane, and the monorepo layout. Decisions cited A1–A24\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-btl0bcp2\"&gt;notes/01-crossanalysis.md&lt;/code&gt;); principles\nP1–P12 and decision rules D1–D8 per the shared-structure doctrine, adopted\nwholesale (A1–A3).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"1-the-layer-map\"&gt;&lt;a href=\"en/01-architecture.html#1-the-layer-map\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The layer map&lt;/span&gt;&lt;/a&gt;1. The layer map&lt;/h2&gt;\n&lt;p&gt;Five layers, five seams. Only the seams are rigid (P1, P3); interiors are\nfree. Every box below is a package or a set of packages\n(&lt;a href=\"en/01-architecture.html#5-monorepo-layout\"&gt;§5&lt;/a&gt;).&lt;/p&gt;\n&lt;div class=\"mermaid\" data-content=\"flowchart%20TB%0A%20%20%20%20classDef%20transport%20fill%3A%23dbeafe%2Cstroke%3A%231d4ed8%2Ccolor%3A%23111%0A%20%20%20%20classDef%20usecase%20fill%3A%23dcfce7%2Cstroke%3A%2315803d%2Ccolor%3A%23111%0A%20%20%20%20classDef%20domain%20fill%3A%23fef9c3%2Cstroke%3A%23a16207%2Ccolor%3A%23111%0A%20%20%20%20classDef%20adapter%20fill%3A%23fce7f3%2Cstroke%3A%23be185d%2Ccolor%3A%23111%0A%20%20%20%20classDef%20external%20fill%3A%23e5e7eb%2Cstroke%3A%23374151%2Ccolor%3A%23111%0A%0A%20%20%20%20subgraph%20T%5B%22SURFACES%20%E2%80%94%20thin%2C%20honest%20views%22%5D%0A%20%20%20%20%20%20%20%20CLI%5B%22theia%20CLI%20(busybox%20dispatch)%22%5D%3A%3A%3Atransport%0A%20%20%20%20%20%20%20%20MCP%5B%22MCP%20server%20(tools%20for%20host%20models)%22%5D%3A%3A%3Atransport%0A%20%20%20%20%20%20%20%20API%5B%22control%20API%20%2B%20%2Fmetrics%20(daemon)%22%5D%3A%3A%3Atransport%0A%20%20%20%20%20%20%20%20HOOKS%5B%22harness%20hooks%20(SessionStart%E2%80%A6PreCompact)%22%5D%3A%3A%3Atransport%0A%20%20%20%20end%0A%0A%20%20%20%20subgraph%20U%5B%22ENGINES%20%E2%80%94%20orchestration%2C%20own%20authz%20%2B%20tx%20boundaries%22%5D%0A%20%20%20%20%20%20%20%20KERN%5B%22run%20kernel%20(coordinator%20%2B%20FSM%20%2B%20pools)%22%5D%3A%3A%3Ausecase%0A%20%20%20%20%20%20%20%20CBM%5B%22codebase-model%20builder%22%5D%3A%3A%3Ausecase%0A%20%20%20%20%20%20%20%20MEM%5B%22memory%20engine%20(ingest%20%2B%20retrieve)%22%5D%3A%3A%3Ausecase%0A%20%20%20%20%20%20%20%20EVAL%5B%22eval%20runner%22%5D%3A%3A%3Ausecase%0A%20%20%20%20end%0A%0A%20%20%20%20subgraph%20D%5B%22DOMAIN%20%E2%80%94%20pure%20decisions%2C%20framework-free%22%5D%0A%20%20%20%20%20%20%20%20DOM%5B%22plan%20algebra%2C%20%CE%A3-merge%2C%20verdict%20tables%2C%3Cbr%2F%3Einterval%20algebra%2C%20scoring%2C%20policy%20checks%22%5D%3A%3A%3Adomain%0A%20%20%20%20end%0A%0A%20%20%20%20subgraph%20A%5B%22ADAPTERS%20%E2%80%94%20all%20I%2FO%2C%20one%20concern%20each%22%5D%0A%20%20%20%20%20%20%20%20GW%5B%22model%20gateway%20(harness%20%2B%20API%20%2B%20embeddings)%22%5D%3A%3A%3Aadapter%0A%20%20%20%20%20%20%20%20STORE%5B%22stores%20(sqlite%20repos%2C%20faiss%2C%20bm25%2C%20blobs)%22%5D%3A%3A%3Aadapter%0A%20%20%20%20%20%20%20%20TS%5B%22tree-sitter%20parsers%22%5D%3A%3A%3Aadapter%0A%20%20%20%20%20%20%20%20TOOLS%5B%22tool%20providers%20(local%2C%20mcp%3B%20docker%20future)%22%5D%3A%3A%3Aadapter%0A%20%20%20%20end%0A%0A%20%20%20%20subgraph%20X%5B%22EXTERNAL%22%5D%0A%20%20%20%20%20%20%20%20HARN%5B(%22Claude%20Code%20%2F%20Codex%20CLIs%20%26%20SDKs%22)%5D%3A%3A%3Aexternal%0A%20%20%20%20%20%20%20%20OAI%5B(%22OpenAI%20embeddings%20%2F%20APIs%22)%5D%3A%3A%3Aexternal%0A%20%20%20%20%20%20%20%20FS%5B(%22git%20worktrees%20%2F%20filesystem%22)%5D%3A%3A%3Aexternal%0A%20%20%20%20end%0A%0A%20%20%20%20T%20--%20%22SEAM%201%3A%20wire%20%E2%87%84%20engine%22%20--%3E%20U%0A%20%20%20%20U%20--%20%22SEAM%202%3A%20plain%20calls%22%20--%3E%20D%0A%20%20%20%20U%20--%20%22SEAM%203%3A%20store%20contract%22%20--%3E%20STORE%0A%20%20%20%20U%20--%20%22SEAM%204%3A%20gateway%20contract%22%20--%3E%20GW%0A%20%20%20%20U%20--%20%22SEAM%205%3A%20tool%20contract%22%20--%3E%20TOOLS%0A%20%20%20%20U%20--%3E%20TS%0A%20%20%20%20GW%20--%3E%20HARN%0A%20%20%20%20GW%20--%3E%20OAI%0A%20%20%20%20STORE%20--%3E%20FS%0A%20%20%20%20TOOLS%20--%3E%20FS%0A\"&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Layer rules&lt;/strong&gt; (each with its interpreter, P2 — enforcement table in\n&lt;a href=\"en/12-invariants.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gokp2mpk\"&gt;12-invariants.md&lt;/code&gt;&lt;/a&gt;):&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Layer&lt;/th&gt;\n&lt;th&gt;May import&lt;/th&gt;\n&lt;th&gt;Must not&lt;/th&gt;\n&lt;th&gt;Owns&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Surfaces&lt;/td&gt;\n&lt;td&gt;engines, schema&lt;/td&gt;\n&lt;td&gt;stores, gateway, harness SDKs&lt;/td&gt;\n&lt;td&gt;parsing, session extraction, wire mapping; &lt;strong&gt;no business logic&lt;/strong&gt; (claudexor INV-002: a surface never invents state the engine does not own)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Engines&lt;/td&gt;\n&lt;td&gt;domain, adapters, config&lt;/td&gt;\n&lt;td&gt;other engines' internals, surface types&lt;/td&gt;\n&lt;td&gt;orchestration order, transaction boundary, authz decision&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Domain&lt;/td&gt;\n&lt;td&gt;domain, schema&lt;/td&gt;\n&lt;td&gt;any I/O, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dusqk2uu\"&gt;Date.now()&lt;/code&gt; (clock injected), env&lt;/td&gt;\n&lt;td&gt;decisions, invariants, FSM transition tables, merge/interval algebra&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Adapters&lt;/td&gt;\n&lt;td&gt;SDKs/drivers, config&lt;/td&gt;\n&lt;td&gt;engines, domain &lt;em&gt;decisions&lt;/em&gt;&lt;/td&gt;\n&lt;td&gt;I/O, driver-level retries, wire⇄row mapping&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"2-the-five-seams-and-their-vocabularies-p3\"&gt;&lt;a href=\"en/01-architecture.html#2-the-five-seams-and-their-vocabularies-p3\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. The five seams and their vocabularies (P3)&lt;/span&gt;&lt;/a&gt;2. The five seams and their vocabularies (P3)&lt;/h2&gt;\n&lt;p&gt;Each seam has ONE result vocabulary, defined in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5bbtb48m\"&gt;packages/schema&lt;/code&gt;, used by\nevery implementation on that seam. Off-seam code returns plain values and\nthrows (P8, D3).&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Wire ⇄ engine.&lt;/strong&gt; Zod-strict schema per operation; wire-as-DTO inside a\nslice (D1). User-visible failure = typed &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sm2vempl\"&gt;{alias, params}&lt;/code&gt;; unexpected =\nthrow, mapped once per surface.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Engine ⇄ domain.&lt;/strong&gt; No ceremony: direct calls, exhaustive switches over\nclosed unions.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Store contract&lt;/strong&gt; (&lt;a href=\"en/03-storage.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rzxsrjyv\"&gt;03-storage.md&lt;/code&gt;&lt;/a&gt;). Repos are the only\nSQL homes; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9f4fd7qx\"&gt;withTx(closure)&lt;/code&gt; owns transactions at the engine level; every\nmulti-writer row carries OCC (generation head or version token);\nidempotency keys are deterministic business-key digests.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Gateway contract&lt;/strong&gt; (&lt;a href=\"en/04-model-gateway.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-29f1xf5y\"&gt;04-model-gateway.md&lt;/code&gt;&lt;/a&gt;). One\ntagged result across every provider and harness:\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sof8ubli\"&gt;ok | retryable | fatal | needs_user | truncated | refused&lt;/code&gt;, plus\nnormalized usage and uncertainty. Adapters classify; the &lt;strong&gt;caller owns\ntime&lt;/strong&gt; (retry/backoff/fallback). Thrown inside an adapter = transient.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Tool contract&lt;/strong&gt; (&lt;a href=\"en/10-integrations.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cvsz21vi\"&gt;10-integrations.md&lt;/code&gt;&lt;/a&gt;). Typed\ntool defs with validators; results are evidence objects (exit codes,\nartifact hashes), never prose (A12); registry-dispatched (P10).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"3-the-derived-state-plane-a1,-p7\"&gt;&lt;a href=\"en/01-architecture.html#3-the-derived-state-plane-a1,-p7\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. The derived-state plane (A1, P7)&lt;/span&gt;&lt;/a&gt;3. The derived-state plane (A1, P7)&lt;/h2&gt;\n&lt;p&gt;Everything derived — the intent index, AST facts, embeddings, BM25/FAISS\nindexes, memory tree summaries, causal graphs, Σ projections, rendered\nreports — obeys one contract:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;Builders write generation N+1 &lt;strong&gt;aside&lt;/strong&gt;; SoT rows and the served\ngeneration are never mutated in place.&lt;/li&gt;\n&lt;li&gt;Publish = one OCC head compare-and-set. Zero rows updated ⇒ a concurrent\nbuild won; the loser abandons. A crashed build leaves garbage (GC'd),\nnever corruption.&lt;/li&gt;\n&lt;li&gt;Readers resolve through the head and accept only monotonically newer\ngenerations; rollback is a pointer flip.&lt;/li&gt;\n&lt;li&gt;Latency path: change-triggered incremental builds (content-hash diff).\nConvergence path: level-triggered reconcilers recompute desired state and\nwrite on diff. Both always ship together (D4).&lt;/li&gt;\n&lt;li&gt;Every generation is stamped with the builder version and its input hashes\n— trustworthy reset, rollback, and cache invalidation fall out.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;This single plane is what MemForest, MV-PBT, the Fidant edge build, and\nplutonium/callisto each built a private copy of; Aletheia builds it once and\nthreads every subsystem through it.&lt;/p&gt;\n&lt;h2 id=\"4-event-sourcing-the-run/audit-spine\"&gt;&lt;a href=\"en/01-architecture.html#4-event-sourcing-the-run/audit-spine\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Event sourcing — the run/audit spine&lt;/span&gt;&lt;/a&gt;4. Event sourcing — the run/audit spine&lt;/h2&gt;\n&lt;p&gt;Each concern keeps an &lt;strong&gt;event log&lt;/strong&gt; as its SoT (redel's replayable JSONL,\noverseer's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-klhqv2af\"&gt;tasks.events.jsonl&lt;/code&gt;, hardened):&lt;/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Events are terryid-stamped (HLC — &lt;a href=\"en/02-identity.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-15uyjeuu\"&gt;02-identity.md&lt;/code&gt;&lt;/a&gt;), so\none global &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6t559k3y\"&gt;ORDER BY id&lt;/code&gt; is causally consistent and \"state at t\" is a query\n(a-posteriori snapshots, hlc-snap).&lt;/li&gt;\n&lt;li&gt;Every nondeterministic input — model replies, tool outputs, clock reads,\nrandom draws — is an event; &lt;strong&gt;replay = re-reading the log&lt;/strong&gt; with the\ngateway in replay mode (A22).&lt;/li&gt;\n&lt;li&gt;Logs are hash-chained (each event carries the previous event's digest) —\ntamper-evident by construction, satisfying the competitor's WORM/audit\nrequirement without special storage (&lt;a href=\"en/09-observability.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p53cwq5b\"&gt;09-observability.md §4&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;Mutable views (ticket tables, Σ, dashboards) are derived state over the log\n(§3), rebuilt by replay.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"5-monorepo-layout\"&gt;&lt;a href=\"en/01-architecture.html#5-monorepo-layout\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Monorepo layout&lt;/span&gt;&lt;/a&gt;5. Monorepo layout&lt;/h2&gt;\n&lt;p&gt;TypeScript, pnpm workspace, strict TS, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ccpn0jr3\"&gt;zx&lt;/code&gt; for all shell/subprocess work\n(A20). Deployment units live under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mfhz8nsg\"&gt;apps/&lt;/code&gt; and stay thin; libraries under\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3aumi2ac\"&gt;packages/&lt;/code&gt;. Shape (vocabulary, not mandate — P9; packages are born on first\nreal consumer, never speculatively):&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;theia/\n  apps/\n    theia/                busybox CLI + TUI + daemon verbs (serve = MCP server,\n                          /metrics, the reconciler loop); the one binary\n  packages/\n    schema/               ALL shared contracts: zod schemas, closed unions,\n                          verdicts, event shapes, policy value types (INV-020:\n                          schema changes first; staged-field rule enforced)\n    terryid/              id + HLC (zero-dep leaf; mirrors proofs/)\n    event-log/            append, hash-chain, replay, snapshot queries\n    store-sqlite/         repos, migrations, withTx, generation/head helpers\n    index-faiss/          vector index adapter (generation-addressed)\n    index-bm25/           lexical index adapter (tantivy-backed; optional pre-analyzed terms)\n    text-analysis/        the lexical analyzer (Unicode segmentation + multi-language Snowball)\n    gateway/              model gateway engine + seam vocabulary + mask gate\n    harness-codex/        adapter: codex CLI (subscription, exec/resume)\n    harness-claude/       adapter: Claude Code CLI (print-mode stream, resume)\n    harness-fake/         adapter: recorded/synthesized — the simulator seam\n    embeddings-local/     ONNX embedder (closed model registry, self-fetching model store) — the default\n    embeddings-openai/    text-embedding-3-small adapter (dims recorded)\n    treesitter/           language grammars, AST facts (deterministic)\n    codebase-model/       intent index builders + retrieval over the map\n    kernel/               coordinator, phase FSM, pools, Σ, plan DAG, prompts\n    memory/               canonical facts, scoped trees, retrieval lanes\n    eval/                 index-bench, calibration, swebl, demo environment\n    mcp-server/           `theia serve` tool handlers over the same engines\n    otel/                 tracing/metrics facade (PII denylist at boundary)\n    config/               YAML loader: apiVersion/kind manifests, validation\n  proofs/                 Coq: hlc.v, state_merge.v (+ CI check)\n  docs/                   this set\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"194\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-194\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-194\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-194.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Vocabulary notes (P9 — packages are born on a real consumer, never\nspeculatively): policy value types live in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4gl99a5i\"&gt;schema&lt;/code&gt; (a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-by4ee6hk\"&gt;policy&lt;/code&gt; package\ngraduates when a second consumer class appears); tool execution lives in\nthe kernel's runner + the MCP belt (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xleeqsec\"&gt;tools-*&lt;/code&gt; packages graduate with the\ncontainer provider); the daemon surface is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ln4n83n\"&gt;theia serve&lt;/code&gt; inside the one\nbinary (a separate app graduates with the daemon channel). Dependency law:\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6xszy3df\"&gt;schema&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hgcnkchb\"&gt;terryid&lt;/code&gt; import nothing workspace-local; adapters never\nimport engines; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-70pypgix\"&gt;harness-*&lt;/code&gt; are translational only (claudexor INV-013 — no\norchestration, budgets, or review policy inside an adapter); surfaces\nimport engines only. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5ow76gfa\"&gt;apps/*&lt;/code&gt; are composition roots that wire dependencies\nvisibly (D8 — no DI container).&lt;/p&gt;\n&lt;h2 id=\"6-configuration\"&gt;&lt;a href=\"en/01-architecture.html#6-configuration\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Configuration&lt;/span&gt;&lt;/a&gt;6. Configuration&lt;/h2&gt;\n&lt;p&gt;YAML manifests, k8s-shaped (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oxbdrijv\"&gt;apiVersion: theia.dev/v1alpha1&lt;/code&gt;, closed &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ayobvfz\"&gt;kind&lt;/code&gt;\nset), living in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o3i9vx3o\"&gt;.theia/config/&lt;/code&gt; under the user's VCS\n(&lt;a href=\"en/10-integrations.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pn1r9y6r\"&gt;10-integrations.md §4&lt;/code&gt;&lt;/a&gt;). Placement follows the\nconfig-placement decision tree: secrets/deploy identity → env (validated at\nboot, fail-fast); tunable knobs → typed config values with env override and\nloud fallback; structural enums → code constants; per-project policy → YAML\nmanifests. Every knob names a consumer or fails CI (staged-field rule, A3);\nprompt-side enum lists interpolate from the code enums (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x8sjz3vj\"&gt;.join('|')&lt;/code&gt;), never\nduplicate.&lt;/p&gt;\n&lt;h2 id=\"7-what-deliberately-stays-fat\"&gt;&lt;a href=\"en/01-architecture.html#7-what-deliberately-stays-fat\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. What deliberately stays fat&lt;/span&gt;&lt;/a&gt;7. What deliberately stays fat&lt;/h2&gt;\n&lt;p&gt;The kernel's coordinator and the memory engine's retrieval core may be large\ncohesive files (D6): their leaves are thin, their invariants are documented\ninline, and the weekly change (add a role / lane / probe) touches a registry\nline, not the core. The review question is never \"how long?\" but \"does the\nweekly change touch this file?\".&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/01-architecture.html","hreflang":"en"}],"style":["_assets/theia.css"],"script":["_bundle/mermaid-extension.js"],"canonical":"en/01-architecture.html","vcsPath":"en/01-architecture.md"},"headings":[{"title":"1. The layer map","href":"en/01-architecture.html#1-the-layer-map","level":2},{"title":"2. The five seams and their vocabularies (P3)","href":"en/01-architecture.html#2-the-five-seams-and-their-vocabularies-p3","level":2},{"title":"3. The derived-state plane (A1, P7)","href":"en/01-architecture.html#3-the-derived-state-plane-a1,-p7","level":2},{"title":"4. Event sourcing — the run/audit spine","href":"en/01-architecture.html#4-event-sourcing-the-run/audit-spine","level":2},{"title":"5. Monorepo layout","href":"en/01-architecture.html#5-monorepo-layout","level":2},{"title":"6. Configuration","href":"en/01-architecture.html#6-configuration","level":2},{"title":"7. What deliberately stays fat","href":"en/01-architecture.html#7-what-deliberately-stays-fat","level":2}],"title":"Architecture — layers, seams, deployment units"},"router":{"pathname":"en/01-architecture","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
