        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"1-the-failure-this-closes\"&gt;&lt;a href=\"en/08-evaluation.html#1-the-failure-this-closes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The failure this closes&lt;/span&gt;&lt;/a&gt;1. The failure this closes&lt;/h2&gt;\n&lt;p&gt;Agentic systems ship claims that cannot survive contact: aggregate gains that\nconfound token budgets with mechanisms (the multi-agent literature's standing\ncritique — ledger §1), evaluators that lie (the LiveCodeBench harness's\nstateless stdin mock silently failed models by coding style — found only by\nreading transcripts), judges that flake inside contractual gates, and runs\nthat cannot be reproduced because the model, the clock, and the router all\nmoved. Aletheia's evaluation subsystem is built on the opposite bets:\nmechanical gates, replayable runs, pinned backends, receipts per mechanism,\nand honest negatives published with the same confidence as wins (R4).&lt;/p&gt;\n&lt;h2 id=\"2-determinism-and-replay-a22\"&gt;&lt;a href=\"en/08-evaluation.html#2-determinism-and-replay-a22\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Determinism and replay (A22)&lt;/span&gt;&lt;/a&gt;2. Determinism and replay (A22)&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;Every nondeterministic input is an event (&lt;a href=\"en/01-architecture.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y4urk17c\"&gt;01-architecture.md §4&lt;/code&gt;&lt;/a&gt;):\nmodel replies (by blob digest), tool outputs, clock reads, random draws.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Replay equality is a tested property&lt;/strong&gt;: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6oszdhya\"&gt;theia replay &amp;lt;run&amp;gt;&lt;/code&gt; re-executes\nwith the gateway in replay mode (live calls refused) and must reproduce\nthe event stream byte-for-byte; divergence is a defect with a named owner\n(a nondeterminism leak). This is ReDel's replayable-log idea promoted from\ndebugging aid to invariant. The &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nlqi6gud\"&gt;hybrid&lt;/code&gt; gateway mode (forks: replay\non recording hit, live-and-record on miss) deliberately does NOT weaken\nthis: strict &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w6ikpxva\"&gt;replay&lt;/code&gt; remains the determinism gate and still throws on\nany miss; hybrid exists only so a fork's shared prefix re-serves free.&lt;/li&gt;\n&lt;li&gt;Ordering is deterministic under concurrency: terryid tie-breaks\n(&lt;a href=\"en/02-identity.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yqaojb4g\"&gt;02-identity.md §3&lt;/code&gt;&lt;/a&gt;); temporal query results have a\nunique coalesced encoding (&lt;a href=\"en/03-storage.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u7ev20nm\"&gt;03-storage.md §5&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"3-simulation\"&gt;&lt;a href=\"en/08-evaluation.html#3-simulation\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Simulation&lt;/span&gt;&lt;/a&gt;3. Simulation&lt;/h2&gt;\n&lt;p&gt;The &lt;strong&gt;fake harness&lt;/strong&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yf1jws4j\"&gt;harness-fake&lt;/code&gt;) swaps real model calls for (a) recorded\ngolden wire fixtures — byte-asserted per operation, psp-style — or (b)\nsynthesized weighted verdicts, overseer's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xvkrgczk\"&gt;--sim&lt;/code&gt;: stress the kernel's state\nmachine through thousands of runs at zero token cost, including the\nwind-down and stop paths (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j5r8599j\"&gt;--sim=N&lt;/code&gt; caps tickets so termination is\nexercised). The simulator is a first-class deployment mode, not a test\ndouble: benchmark and production run the SAME engine code with only the\ngateway backend swapped — the parity law that made the Fidant benchmark\nadapter trustworthy (their W28), adopted as an invariant.&lt;/p&gt;\n&lt;h2 id=\"4-the-ledger-discipline\"&gt;&lt;a href=\"en/08-evaluation.html#4-the-ledger-discipline\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. The ledger discipline&lt;/span&gt;&lt;/a&gt;4. The ledger discipline&lt;/h2&gt;\n&lt;p&gt;Every mechanism — a retrieval lane, a role, a threshold, a scaffold depth —\ngets one row in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rai4hywp\"&gt;docs/ledger.md&lt;/code&gt; (created with the first measured mechanism)\nunder a verdict heading: &lt;strong&gt;KEPT-ON / KEPT-OPT-IN / OFF-CONFIRMED-NEGATIVE /\nABANDONED-REMOVED / PARKED&lt;/strong&gt;, each with its receipt (benchmark delta +\nprovenance). The Fidant precedent is the reason: an engine with dozens of\ngates is unauditable from code alone — a gate reading &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wxz6whhc\"&gt;off&lt;/code&gt; looks identical\nwhether unfinished or measured-harmful. Corollaries:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;A mechanism without a receipt does not default on.&lt;/li&gt;\n&lt;li&gt;A measured negative is deleted (the code) and recorded (the row) — the\ncorpse marker prevents re-exploration (P11).&lt;/li&gt;\n&lt;li&gt;The config of record IS the coded default; a bare deployment runs the\nmeasured stack with zero env.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"5-benchmarks\"&gt;&lt;a href=\"en/08-evaluation.html#5-benchmarks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Benchmarks&lt;/span&gt;&lt;/a&gt;5. Benchmarks&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Suite&lt;/th&gt;\n&lt;th&gt;Status&lt;/th&gt;\n&lt;th&gt;Measures&lt;/th&gt;\n&lt;th&gt;Source shape&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;kernel-sim&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;shipped (the kernel test suite)&lt;/td&gt;\n&lt;td&gt;FSM correctness, guard coverage, replay equality, crash-resume&lt;/td&gt;\n&lt;td&gt;synthesized verdicts, property-style&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;index-bench&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;shipped (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5hohd72d\"&gt;theia eval index-bench&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;cold/incremental build rate, hash-gate call counts, locked cost&lt;/td&gt;\n&lt;td&gt;synthesized corpus, scripted gateway&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;task-bench&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;shipped (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-444yas2i\"&gt;theia eval swebl&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;end-to-end resolution, cost, defects on pinned real instances&lt;/td&gt;\n&lt;td&gt;SWE-bench-Live, the three-posture ladder, pinned backends ×N passes, paired per-instance stats (sign-flip permutation, McNemar on discordants) — protocol + receipts in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kag0g0cs\"&gt;notes/06-eval-plan.md&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;codebase QA&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;planned&lt;/td&gt;\n&lt;td&gt;Where/What/How accuracy of the codebase model vs oracle &amp;amp; raw-context arms&lt;/td&gt;\n&lt;td&gt;AOCI's three-category design, ground truth by server-side grep; the repomix-eval probe (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8e9wsc5n\"&gt;notes/07&lt;/code&gt;) is its manual precursor&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;memory-bench&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;shipped (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-taz36l77\"&gt;theia eval memory fetch/draw/retrieval/qa/report&lt;/code&gt;; notes/10 §4)&lt;/td&gt;\n&lt;td&gt;retrieval per axis (single, multi-hop, temporal, knowledge-update, open-domain, verbatim, as-of): recall/coverage@k at turn and session grain, nDCG, MRR, leak (forbidden evidence); the QA half: end-to-end accuracy per axis incl. abstention (codex answerer over the retrieved block, LongMemEval's per-type judges, evidence-in-context reported beside accuracy), on a stratified subset of the same draw; paired per-question deltas between lane×analyzer×tier arms&lt;/td&gt;\n&lt;td&gt;LoCoMo + LongMemEval (oracle, S) + a deterministic synthetic suite (planted verbatim facts, as-of cuts) through the PRODUCTION write path and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rbhw1d3r\"&gt;retrieve&lt;/code&gt;; committed seeded draws under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q92id7j5\"&gt;docs/eval/&lt;/code&gt;; small set ≤ 5 min cold on the 5 GB box, cached reruns free — axes diagnose; one aggregate hides&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;freshness/cost&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;shipped as receipts (build-rate lines, locked USD, staleness metrics)&lt;/td&gt;\n&lt;td&gt;index lag, build rate, $/solved unit&lt;/td&gt;\n&lt;td&gt;MemForest's input-normalized build rate; cost-vs-accuracy frontier plots ride the swebl report&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Protocol laws, learned the hard way by the corpus: pinned backends (gateway\nrouting noise dominated their gateway-served arms), refusals scored as\nfailures (never silently substitute a model), cap-matching made explicit when\narms differ, evaluator code itself under test (golden positive + golden\nnegative per checker), and per-problem agreement tables beside aggregates.&lt;/p&gt;\n&lt;h2 id=\"6-two-tier-acceptance\"&gt;&lt;a href=\"en/08-evaluation.html#6-two-tier-acceptance\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Two-tier acceptance&lt;/span&gt;&lt;/a&gt;6. Two-tier acceptance&lt;/h2&gt;\n&lt;p&gt;&lt;strong&gt;Contractual gates are mechanical&lt;/strong&gt; — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-imei56x3\"&gt;answer_contains&lt;/code&gt;, exit codes, SQL\ncounts, replay equality — because a gate must not flake on a judge\n(eval-acceptance-golden). &lt;strong&gt;Quality reporting is judge-scored&lt;/strong&gt; — the 0–1\ncomposite over correctness / must-contain / must-not-contain / hallucination,\nrolled into ability axes — with a human-double-marked calibration sample\npinning judge agreement. Golden sets follow the LongMemEval authoring method:\nanswers decompose into evidence statements distributed across positions, and\nthe case mix includes unanswerables and non-standalone follow-ups (MT-RAG's\nfinding: a set without them certifies a system that fails its first week).&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/08-evaluation.html","hreflang":"en"}],"style":["_assets/theia.css","_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"canonical":"en/08-evaluation.html","vcsPath":"en/08-evaluation.md"},"headings":[{"title":"1. The failure this closes","href":"en/08-evaluation.html#1-the-failure-this-closes","level":2},{"title":"2. Determinism and replay (A22)","href":"en/08-evaluation.html#2-determinism-and-replay-a22","level":2},{"title":"3. Simulation","href":"en/08-evaluation.html#3-simulation","level":2},{"title":"4. The ledger discipline","href":"en/08-evaluation.html#4-the-ledger-discipline","level":2},{"title":"5. Benchmarks","href":"en/08-evaluation.html#5-benchmarks","level":2},{"title":"6. Two-tier acceptance","href":"en/08-evaluation.html#6-two-tier-acceptance","level":2}],"title":"Evaluation — determinism, simulation, benchmarks, the ledger"},"router":{"pathname":"en/08-evaluation","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
