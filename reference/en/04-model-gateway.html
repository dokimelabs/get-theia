            {"data":{"leading":false,"html":"&lt;h2 id=\"1-the-failure-this-closes\"&gt;&lt;a href=\"en/04-model-gateway.html#1-the-failure-this-closes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The failure this closes&lt;/span&gt;&lt;/a&gt;1. The failure this closes&lt;/h2&gt;\n&lt;p&gt;When every engine calls providers directly, the cross-cutting obligations —\ncost metering, data-class masking, retry policy, uncertainty capture,\nrecord/replay, audit hashing — become per-caller disciplines, and per-caller\ndisciplines rot (P2). The reference systems each solved a slice: overseer's\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-upsnliyc\"&gt;Harness&lt;/code&gt; interface normalizes four CLI agents behind one seam; claudexor's\nconstitution separates &lt;em&gt;routing&lt;/em&gt; (who executes) from &lt;em&gt;strategy&lt;/em&gt; (how many\nrun) and forbids adapters from orchestrating; psp put 69 providers behind one\ntagged result and kept the engine provider-agnostic. The &lt;strong&gt;gateway&lt;/strong&gt; is that\nseam built once: a separate deployable service (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ao1tigc9\"&gt;theia gateway&lt;/code&gt;, also\nembeddable in-process) that owns every completion, embedding, and harness\ninvocation in the system.&lt;/p&gt;\n&lt;h2 id=\"2-the-seam-vocabulary\"&gt;&lt;a href=\"en/04-model-gateway.html#2-the-seam-vocabulary\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. The seam vocabulary&lt;/span&gt;&lt;/a&gt;2. The seam vocabulary&lt;/h2&gt;\n&lt;p&gt;One tagged result across ALL providers and harnesses (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3okba5hz\"&gt;packages/schema&lt;/code&gt;):&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs ts\"&gt;&lt;span class=\"hljs-keyword\"&gt;type&lt;/span&gt; &lt;span class=\"hljs-title class_\"&gt;CallResult&lt;/span&gt;&amp;lt;T&amp;gt; =\n  | { &lt;span class=\"hljs-attr\"&gt;kind&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'ok'&lt;/span&gt;;        &lt;span class=\"hljs-attr\"&gt;value&lt;/span&gt;: T; &lt;span class=\"hljs-attr\"&gt;usage&lt;/span&gt;: &lt;span class=\"hljs-title class_\"&gt;Usage&lt;/span&gt;; &lt;span class=\"hljs-attr\"&gt;uncertainty&lt;/span&gt;?: &lt;span class=\"hljs-title class_\"&gt;Uncertainty&lt;/span&gt; }\n  | { &lt;span class=\"hljs-attr\"&gt;kind&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'retryable'&lt;/span&gt;; &lt;span class=\"hljs-attr\"&gt;reason&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;string&lt;/span&gt;; &lt;span class=\"hljs-attr\"&gt;retryAfterMs&lt;/span&gt;?: &lt;span class=\"hljs-built_in\"&gt;number&lt;/span&gt; }\n  | { &lt;span class=\"hljs-attr\"&gt;kind&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'fatal'&lt;/span&gt;;     &lt;span class=\"hljs-attr\"&gt;reason&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;string&lt;/span&gt; }          &lt;span class=\"hljs-comment\"&gt;// bad request, auth, schema&lt;/span&gt;\n  | { &lt;span class=\"hljs-attr\"&gt;kind&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'needs_user'&lt;/span&gt;;&lt;span class=\"hljs-attr\"&gt;reason&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;string&lt;/span&gt; }          &lt;span class=\"hljs-comment\"&gt;// interactive gate required&lt;/span&gt;\n  | { &lt;span class=\"hljs-attr\"&gt;kind&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'truncated'&lt;/span&gt;; &lt;span class=\"hljs-attr\"&gt;partial&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;string&lt;/span&gt;; &lt;span class=\"hljs-attr\"&gt;usage&lt;/span&gt;: &lt;span class=\"hljs-title class_\"&gt;Usage&lt;/span&gt; }\n  | { &lt;span class=\"hljs-attr\"&gt;kind&lt;/span&gt;: &lt;span class=\"hljs-string\"&gt;'refused'&lt;/span&gt;;   &lt;span class=\"hljs-attr\"&gt;reason&lt;/span&gt;: &lt;span class=\"hljs-built_in\"&gt;string&lt;/span&gt; }          &lt;span class=\"hljs-comment\"&gt;// provider safety refusal&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"12\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-12\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-12\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-12.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Adapters classify; callers own time&lt;/strong&gt; (P8): zero retry loops inside an\nadapter; the kernel's retry/backoff/fallback chains consume &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s81xiidl\"&gt;retryable&lt;/code&gt;.\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wur4pl9o\"&gt;refused&lt;/code&gt; is its own kind because it is neither retryable nor a caller bug\nand must be scored honestly (the ledger paper scored Fable refusals as\nfailures rather than silently substituting a model — we keep that law).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Usage&lt;/strong&gt; is normalized &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l50aj3c1\"&gt;(input, cacheRead, cacheWrite, output)&lt;/code&gt; tokens plus\na &lt;strong&gt;locked USD cost&lt;/strong&gt; synthesized from an embedded price table at call time\n(overseer's pattern: never read cost from the stream — subscriptions carry\nnone — and never recompute historical cost after a price change; the same\nno-reprojection law as the wallet-ledger rule).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Uncertainty&lt;/strong&gt; is token-logprob-derived (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0csst3ct\"&gt;u = −log Avg(softmax(logprobs))&lt;/code&gt;,\nuac) where the transport exposes logprobs; absent otherwise — never faked.\nConsumers calibrate thresholds per stage from run history (A11).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Structured output&lt;/strong&gt; is validated at this seam: JSON replies parse through\none schema-validating helper (strict schemas, length caps, enum sync);\nfailures classify as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-prrbrcfb\"&gt;fatal(schema)&lt;/code&gt; with a sanitized summary — model text\nnever rides an exception message into logs.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"3-transports\"&gt;&lt;a href=\"en/04-model-gateway.html#3-transports\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Transports&lt;/span&gt;&lt;/a&gt;3. Transports&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Transport&lt;/th&gt;\n&lt;th&gt;Mechanism&lt;/th&gt;\n&lt;th&gt;Sessions&lt;/th&gt;\n&lt;th&gt;Notes&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bz6d1eja\"&gt;harness-codex&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Codex CLI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fju3u70z\"&gt;exec --json&lt;/code&gt; / OAuth ChatGPT subscription over the Responses API (axio-transport-codex shape)&lt;/td&gt;\n&lt;td&gt;✓ resume&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;selectable first-class family&lt;/strong&gt; (with claude: `theia init --harness codex&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-trcfspla\"&gt;harness-claude&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;Claude Code CLI &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-64gjyx5i\"&gt;claude -p --output-format stream-json --verbose&lt;/code&gt; as a subprocess (&lt;strong&gt;CLI-first, not SDK&lt;/strong&gt; — subscription-quota path with exact codex-exec parity: jail-able, stream-parsed, overseer's claude driver the reference); a PTY wrapper is the NAMED future fallback if print-mode gaps appear; the SDK is not used&lt;/td&gt;\n&lt;td&gt;✓ resume (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kqcjfxiw\"&gt;--resume &amp;lt;id&amp;gt;&lt;/code&gt; preserves the session — probed 2.1.252)&lt;/td&gt;\n&lt;td&gt;subscription auth NEVER falls back to an API key (THE-013 — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f4565lkf\"&gt;ANTHROPIC_API_KEY&lt;/code&gt; is stripped from the child env, and the doctor demands a logged-in claude.ai session); session lineage chained by content hash (meridian &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-294s6bgu\"&gt;lineage.ts&lt;/code&gt; shape — pure, testable); tool whitelist via probed &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gk9m6wyn\"&gt;--allowedTools&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zwzxj6l6\"&gt;--disallowedTools&lt;/code&gt; (the probed tool-governance ladder, &lt;a href=\"en/10-integrations.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gbsa6jsl\"&gt;10-integrations.md §3&lt;/code&gt;&lt;/a&gt;); three registered postures: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6mxqsflq\"&gt;claude&lt;/code&gt; (judging: Bash/Read/Grep/Glob), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nvmsqn87\"&gt;claude-write&lt;/code&gt; (probed headless &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0i8rim9\"&gt;acceptEdits&lt;/code&gt;), and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iylqpnzu\"&gt;claude-index&lt;/code&gt; (budget-light indexing: sonnet default, NO tools, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6jd2o9t6\"&gt;MAX_THINKING_TOKENS=0&lt;/code&gt; — the 34938 quota receipt: 2,049 files at the opus judging posture locked $123 and ate a Max subscription; init seeds &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-54ed91t5\"&gt;indexer: claude-index&lt;/code&gt; for the claude family)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tbngg2vi\"&gt;harness-fake&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;recorded golden wire fixtures / synthesized weighted verdicts&lt;/td&gt;\n&lt;td&gt;✓&lt;/td&gt;\n&lt;td&gt;the simulator &amp;amp; replay seam (A22); byte-asserted fixtures per operation (psp)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pvin33md\"&gt;embeddings-local&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;ONNX model on this machine (onnxruntime + a pure-JS tokenizer; mean/CLS pooling, unit vectors)&lt;/td&gt;\n&lt;td&gt;n/a&lt;/td&gt;\n&lt;td&gt;&lt;strong&gt;the default embedder&lt;/strong&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-biu6fbud\"&gt;gateway.embeddings.provider: local&lt;/code&gt;): zero USD, offline once fetched; the closed registry ships &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-psmf2gbj\"&gt;all-MiniLM-L6-v2&lt;/code&gt; (384d, default) and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aagjnckh\"&gt;bge-small-en-v1.5&lt;/code&gt; (384d); a model fetches itself into &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z4uj0kju\"&gt;~/.cache/theia/models&lt;/code&gt; on first use with one notice line, or via &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3fqxui9x\"&gt;theia setup --fetch-embeddings [model]&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9641gk1h\"&gt;autoDownload: false&lt;/code&gt; makes a missing model a loud error&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wt3h6h7q\"&gt;api-openai&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;direct API (embeddings; optional completions)&lt;/td&gt;\n&lt;td&gt;n/a&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6fa2desz\"&gt;text-embedding-3-small&lt;/code&gt; default; selected by &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v62f6dti\"&gt;gateway.embeddings.provider: openai&lt;/code&gt;; needs the user's key — without it the vector lane is off with the reason printed, never a silent switch of provider&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;The harness interface is overseer's, ported: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w0k0qm7b\"&gt;args/sessionArgs&lt;/code&gt;,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-whk7cm4v\"&gt;parseStreamLine&lt;/code&gt; (normalize native streams into typed events),\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f3exm1mh\"&gt;parseSessionId&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ighc3px5\"&gt;classifyFault&lt;/code&gt; (transient vs fatal), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x4mqwmz1\"&gt;jailRwPaths&lt;/code&gt;,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yxgzsn76\"&gt;defaultModel(role)&lt;/code&gt;. Adapters are &lt;strong&gt;translational only&lt;/strong&gt; — no budgets, no\nwinner selection, no review policy (claudexor INV-013); a harness is not a\nrole, and no role is hardcoded to a harness (INV-010): the gateway routes by\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-adz64fm2\"&gt;(intent, policy, availability)&lt;/code&gt;, and availability is &lt;em&gt;doctor-verified&lt;/em&gt;\n(a probe call), never assumed from config (INV-011/012 — an unavailable\nharness is visible with a reason, never silently substituted).&lt;/p&gt;\n&lt;h2 id=\"4-embeddings\"&gt;&lt;a href=\"en/04-model-gateway.html#4-embeddings\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Embeddings&lt;/span&gt;&lt;/a&gt;4. Embeddings&lt;/h2&gt;\n&lt;p&gt;One &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1v390jzq\"&gt;EmbeddingTransport&lt;/code&gt; interface: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b5uw0llz\"&gt;(texts, purpose) → vectors&lt;/code&gt;, with the\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xngxz5ly\"&gt;(provider, model, dims)&lt;/code&gt; triple recorded on every stored vector and on every\nindex generation (&lt;a href=\"en/03-storage.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5hu2oqpg\"&gt;03-storage.md §3&lt;/code&gt;&lt;/a&gt;). Changing dimensions\nor provider is therefore a new generation build behind the head — a seamless\nswap by construction, not a migration script. Batching, rate limits, and\nbacklog degradation (missing embedding ⇒ row drops out of vector search only;\nlexical still serves) are gateway concerns, invisible to engines.&lt;/p&gt;\n&lt;p&gt;The provider is workspace policy (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mbi0609g\"&gt;gateway.embeddings&lt;/code&gt;, &lt;a href=\"en/15-configuration.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y12s6q4b\"&gt;15 §3&lt;/code&gt;&lt;/a&gt;)\nbecause it is generation identity, and the CLI resolves it in ONE place\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tu9htth8\"&gt;apps/theia/src/embeddings.ts&lt;/code&gt;) for every verb that builds or queries a\nvector generation. Two laws hold there: (1) availability is honest — the\nopenai posture without a key resolves to no embedder with the reason, the\nlocal posture fetches its model or refuses loudly, and read verbs degrade to\nthe lexical lanes saying so; (2) &lt;strong&gt;identity at the read seam&lt;/strong&gt; — a vector\nindex is queried only by the triple that built it (the generation's recorded\nbuilder version); a mismatch drops the vector lane with a notice naming the\nreindex verb, because a foreign embedder returns confidently wrong\nneighbours, which is worse than lexical-only.&lt;/p&gt;\n&lt;h2 id=\"5-what-lives-at-the-seam-by-construction\"&gt;&lt;a href=\"en/04-model-gateway.html#5-what-lives-at-the-seam-by-construction\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. What lives at the seam by construction&lt;/span&gt;&lt;/a&gt;5. What lives at the seam by construction&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Data-class masking&lt;/strong&gt; (&lt;a href=\"en/11-governance.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0t3xirm\"&gt;11-governance.md §4&lt;/code&gt;&lt;/a&gt;):\nevery outbound prompt passes the class gate — Prohibited content blocks\nthe call (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nim0pgh8\"&gt;fatal(policy)&lt;/code&gt;), Restricted content is masked before the bytes\nleave the process. One choke point; callers cannot forget.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Audit hashing:&lt;/strong&gt; every call emits a gateway event (model id, prompt\ndigest, params, usage, result kind, latencies) into the hash-chained log —\nthe competitor's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y5iuldza\"&gt;agent_run_id + prompt_version + input hashes&lt;/code&gt; made\nmechanical.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Record/replay:&lt;/strong&gt; in record mode, full request/response pairs land in the\nblob store keyed by digest; in replay mode the gateway serves them back\nand &lt;em&gt;refuses&lt;/em&gt; live calls — replay equality is testable\n(&lt;a href=\"en/08-evaluation.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-45z932mq\"&gt;08-evaluation.md §2&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Metering:&lt;/strong&gt; per-run budgets enforced here (cost cap = policy value);\nexceeding one yields &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ozw8h5u3\"&gt;fatal(budget)&lt;/code&gt; — loud, attributable, resumable.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Tracing:&lt;/strong&gt; one OTel span per call, usage and cost as attributes, prompt\npayloads by blob reference only (&lt;a href=\"en/09-observability.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n2lmx3wv\"&gt;09-observability.md&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Pricing without code&lt;/strong&gt;: a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pzexnocw\"&gt;kind: Pricing&lt;/code&gt; manifest overlays the\nembedded price table (per-model USD/MTok rates) and sets per-transport\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q2eumt3g\"&gt;costBasis&lt;/code&gt; — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hx6bkjjl\"&gt;list&lt;/code&gt; keeps adapter-locked figures winning; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lzybhojm\"&gt;actual&lt;/code&gt;\ndeclares the manifest rates the true marginal cost, overriding even an\nadapter figure (a subscription seat may declare its models at 0). Every\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kdz4kale\"&gt;gateway.call&lt;/code&gt; records &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zd83i2nz\"&gt;priceSource&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w2kte3ti\"&gt;adapter | manifest | embedded&lt;/code&gt;),\nso receipts stay attributable across rate changes; the cost-lock law is\nuntouched — locked once at call time, never recomputed (THE-015).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"6-routing-and-strategy-are-orthogonal-claudexor-inv-140\"&gt;&lt;a href=\"en/04-model-gateway.html#6-routing-and-strategy-are-orthogonal-claudexor-inv-140\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Routing and strategy are orthogonal (claudexor INV-140)&lt;/span&gt;&lt;/a&gt;6. Routing and strategy are orthogonal (claudexor INV-140)&lt;/h2&gt;\n&lt;p&gt;Routing picks WHO executes (harness + credential profile + model) — set by\npolicy or explicit choice: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4h2e1a0i\"&gt;gateway.routing[role]&lt;/code&gt; names the transport and\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ctswctas\"&gt;gateway.models[role]&lt;/code&gt; the model (resolved in the router, part of the replay\nkey — an explicit request model wins). Strategy picks HOW MANY units run and how results\ncombine (single / best-of / council / delegation depth) — set by the kernel\nper task class on the cost-accuracy frontier (A9: the manager scaffold buys\nmost where the unaided model is weakest; strong-model small tasks route\nsingle). No control mixes the axes.&lt;/p&gt;\n&lt;h2 id=\"7-session-continuity-the-s-shared-stable-prefix\"&gt;&lt;a href=\"en/04-model-gateway.html#7-session-continuity-the-s-shared-stable-prefix\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. Session continuity — the Σ-shared stable prefix&lt;/span&gt;&lt;/a&gt;7. Session continuity — the Σ-shared stable prefix&lt;/h2&gt;\n&lt;blockquote&gt;\n&lt;p&gt;Re-cut per the chief's 2026-09-03 decision\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mvedd688\"&gt;notes/15-session-continuity-sigma.md&lt;/code&gt;):\nthe accumulating &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3wee03r7\"&gt;resume&lt;/code&gt; mode (and its optimistic state-hash registry)\nis REMOVED — it carried round-to-round state PAST the Σ projection, the\nplatform's quality instrument (ledger §4 corpse marker). What follows is\nthe shipped replacement.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;p&gt;Cold dispatch conflates two costs, and continuity may only touch the\nfirst: &lt;strong&gt;re-send cost&lt;/strong&gt; (the stable context re-transmitted every round —\neliminated by provider prompt caching WHEN the prompt is ordered\nstable-prefix-first) and &lt;strong&gt;re-exploration cost&lt;/strong&gt; (the model re-running\nlast round's greps — whose correct home is a curated store that\nre-projects, never an accumulating transcript). The mechanism:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Every dispatch prompt is two spans&lt;/strong&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0rk9u4tc\"&gt;assembleJobPromptParts&lt;/code&gt;): the\nSTABLE span first — task frame, tier note, repo map/context, the\ndurable Σ core, byte-identical across rounds — then the VOLATILE delta\n— attempt, Σ projection, folded feedback, rescope budget. This\nordering is unconditional (a pure win): the previous assembly put the\nattempt counter in byte 15 and the map last, so no two rounds ever\nshared a cacheable prefix. Delta-last also lands the course\ncorrections where recency-weighted attention is strongest.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The base advances only on a legitimate Σ event&lt;/strong&gt; — a rescope\nrewrites the frame, a re-index or diff-triggered context entry changes\nthe map. Each advance changes the audited prefix digest; between\nadvances every round of a task shares one prefix.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6vigfkdl\"&gt;run.sessionContinuity: off | sigma-shared&lt;/code&gt;&lt;/strong&gt; (default off until the\nreceipt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l8387w7g\"&gt;--sessions&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zpd64lbf\"&gt;--no-sessions&lt;/code&gt; override). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3s7hl684\"&gt;sigma-shared&lt;/code&gt; arms\nthe audit: every dispatch emits &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-crz8pnjw\"&gt;task.note {source: session_prefix, taskId, role, digest, stableChars, deltaChars}&lt;/code&gt; — byte-stability of\nthe shared prefix across rounds is then a query over the run's own\nnotes, and \"Σ is provably the sole quality input\" is checkable from\nthe exchange blobs. Dispatch BYTES are identical under both modes.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The round-to-round carry is fold-governed, deterministic&lt;/strong&gt;\n(notes/15 §9): a re-raised review objection folds into its standing\nfeedback entry under the platform's one paraphrase bar (token-set\nJaccard ≥ 0.92 — the memory write gate's), newest wording wins, and\nthe count renders as \"raised N rounds running\" — the review-loop\ngrounding a cold round structurally loses, carried THROUGH Σ, bounded\nat 3 distinct objections. A Self-GC-shaped planner over delta objects\nis the designed, receipt-gated escalation — never a third mode.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Base-session forking&lt;/strong&gt; (manufacture a harness session ending exactly\nat the stable prefix; fork it per round) is the designed second path\nfor prefix reuse beyond the provider cache TTL — per-harness probes\nbefore any fork verb exists (T-O law); until then the honest posture\nis cold + prompt ordering, never silent accumulation.&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/04-model-gateway.html","hreflang":"en"}],"style":["_assets/theia.css","_bundle/latex-extension.css"],"script":["_bundle/latex-extension.js"],"canonical":"en/04-model-gateway.html","vcsPath":"en/04-model-gateway.md"},"headings":[{"title":"1. The failure this closes","href":"en/04-model-gateway.html#1-the-failure-this-closes","level":2},{"title":"2. The seam vocabulary","href":"en/04-model-gateway.html#2-the-seam-vocabulary","level":2},{"title":"3. Transports","href":"en/04-model-gateway.html#3-transports","level":2},{"title":"4. Embeddings","href":"en/04-model-gateway.html#4-embeddings","level":2},{"title":"5. What lives at the seam by construction","href":"en/04-model-gateway.html#5-what-lives-at-the-seam-by-construction","level":2},{"title":"6. Routing and strategy are orthogonal (claudexor INV-140)","href":"en/04-model-gateway.html#6-routing-and-strategy-are-orthogonal-claudexor-inv-140","level":2},{"title":"7. Session continuity — the Σ-shared stable prefix","href":"en/04-model-gateway.html#7-session-continuity-the-s-shared-stable-prefix","level":2}],"title":"Model gateway — the one seam all model traffic crosses"},"router":{"pathname":"en/04-model-gateway","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
