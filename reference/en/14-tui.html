        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"1-the-failure-this-closes\"&gt;&lt;a href=\"en/14-tui.html#1-the-failure-this-closes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The failure this closes&lt;/span&gt;&lt;/a&gt;1. The failure this closes&lt;/h2&gt;\n&lt;p&gt;A live agent run rendered as a scrolling transcript fails its operator three\nways at once: &lt;strong&gt;context-overload blindness&lt;/strong&gt; (a verifier's output floods\nscrollback and the one failing step is buried), &lt;strong&gt;spectator paralysis&lt;/strong&gt; (you\nwatch a loop happen with no way to steer short of killing the run), and\n&lt;strong&gt;zero drill-down&lt;/strong&gt; (per-task cost, verdict evidence, and anomaly payloads\nexist in the log but have no live surface). Aletheia's answer is the &lt;strong&gt;run\ntree&lt;/strong&gt;: one live, navigable, collapsible tree of the run with a zoomable\ndetail viewport — the operational grammar of dagger's TUI, rendered entirely\nfrom the event log. The TUI is a &lt;em&gt;fold with a cursor&lt;/em&gt;: seek, replay parity,\nand byte-pinned golden-frame tests come free because the view is a pure\nfunction of the log (THE-001 applied to a screen).&lt;/p&gt;\n&lt;h2 id=\"2-views-and-where-they-appear\"&gt;&lt;a href=\"en/14-tui.html#2-views-and-where-they-appear\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Views and where they appear&lt;/span&gt;&lt;/a&gt;2. Views and where they appear&lt;/h2&gt;\n&lt;p&gt;Every run surface renders from the same fold; the views differ only in how\nmuch terminal they claim:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;View&lt;/th&gt;\n&lt;th&gt;What it is&lt;/th&gt;\n&lt;th&gt;For&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e5ksln1s\"&gt;--tui&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;the run tree: live follow or stored-run browse with time-travel seek&lt;/td&gt;\n&lt;td&gt;the operator — &lt;strong&gt;the built-in default on an interactive terminal&lt;/strong&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u0imnenn\"&gt;--cli&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;redrawing task×phase board + cost ticker, no alternate screen&lt;/td&gt;\n&lt;td&gt;glanceable progress in a scrollback-friendly form&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xbf43k25\"&gt;--plain&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;one line per event as it lands (phase/verdict/evidence-ref/cost; anomalies loud &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4195cn31\"&gt;!!&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;scripting, CI, logs&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;summary&lt;/td&gt;\n&lt;td&gt;one-shot fold printed after the fact&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2g6go4xf\"&gt;theia show &amp;lt;runId&amp;gt;&lt;/code&gt; with no flag (a glance tool must not grab the terminal)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;Precedence: flag &amp;gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vv077409\"&gt;ui.defaultView&lt;/code&gt; policy value &amp;gt; built-in (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-goqalx2s\"&gt;tui&lt;/code&gt;).\nDegradation is honest and loud (THE-052): no stdout TTY, no usable stdin, or\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oqrep4fd\"&gt;--non-interactive&lt;/code&gt; each degrade &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i1d42anv\"&gt;tui&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aayq4odr\"&gt;cli&lt;/code&gt; to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3gbx3o79\"&gt;plain&lt;/code&gt; with a notice — a\nTUI in a pipe is garbage and is never silently attempted. A piped brief\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8a42rgs\"&gt;echo task | theia run&lt;/code&gt;) still opens the TUI when stdout is a terminal: the\nbrief is read from the pipe, then key input reopens &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rmxiq6zh\"&gt;/dev/tty&lt;/code&gt;; no\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-flxraqpb\"&gt;/dev/tty&lt;/code&gt; (CI) degrades loudly. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bxltyttj\"&gt;theia replay&lt;/code&gt; never renders — it is the\ndeterminism gate, not a viewer.&lt;/p&gt;\n&lt;h2 id=\"3-layout-three-zones-one-viewport\"&gt;&lt;a href=\"en/14-tui.html#3-layout-three-zones-one-viewport\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Layout — three zones + one viewport&lt;/span&gt;&lt;/a&gt;3. Layout — three zones + one viewport&lt;/h2&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt; ⣽ run run2ak7… · fast_path · $0.0312/$5.00 · 14 calls · 96 events · 2m11s running\n tasks: 1 running · 1 done · 0 pending · anomalies 0            [@ event 96/96 · live]\n─────────────────────────────────────────────────────────────────────────────\n ▼ ✔ tsktm7… [fast_path] add --stats flag                merged  r4  $0.0212\n   ├╴ ✔ r1 implement   implementer → ready       2 commits, 2 evidence  4.1s\n   ├╴ ✔ r2 verify      verifier → verify_pass    test_run pnpm test     1.2s\n   ├╴ ✔ r3 review      reviewer → approve                               3.4s\n   ╰╴ ✔ r4 merge       merger → merged           sha 1a2b3c4            0.6s\n ▼ ⣽ tskaa1… [full_spec] migrate the api         implement  r2  $0.0100\n   ├╴ ✔ r1 plan        planner → clarify         2 questions answered   8.0s\n   ╰╴ ⣽ r2 implement   implementer               codex call live…        41s\n ▶ ◌ tskbb2… [fast_path] update the consumers    blocked on tskaa1…\n─────────────────────────────────────────────────────────────────────────────\n verdict tskaa1… r1 · planner → clarify\n   Q: which auth scheme does the new api keep?          → \"oauth, drop keys\"\n   Q: is the v1 endpoint retired in this change?        → \"yes\"\n   evidence: —      note: \"ambiguous brief: two auth paths in the codebase\"\n─────────────────────────────────────────────────────────────────────────────\n ↑↓ move • ←→ fold • ⏎ zoom • ⇥ pane • f follow • e err • m steer • p prompt\n w wrap • v view • +/- verbosity=1 • ? • q stop\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"79\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-79\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-79\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-79.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;em&gt;The figure, walked:&lt;/em&gt; the &lt;strong&gt;header&lt;/strong&gt; (2 lines) carries the run glyph (⣽\nlive / ✔ completed / ✖ failed / ‖ paused), the FULL run id, track, the cost\nticker against budget, call/event counts, elapsed, a worded task tally, the\nanomaly count, warning hints (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0b8zotd2\"&gt;ctx ⚠N&lt;/code&gt; context alerts, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z8fi1a9h\"&gt;idx ⚠N&lt;/code&gt; stale-index\nentries), and the seek position (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uzvcq8tn\"&gt;live&lt;/code&gt; when following the head). The\n&lt;strong&gt;tree&lt;/strong&gt; is the core: per-row STATE column, box-drawing rails (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ytw5hmr\"&gt;├╴ ╰╴ │&lt;/code&gt;),\nidentity + right-aligned facts (phase, rounds, per-task cost, dim duration —\nbright while running). The &lt;strong&gt;detail viewport&lt;/strong&gt; (bottom split, per-node zoom)\nshows the selected node's full story — here a clarify verdict with its Q&amp;amp;A.\nThe &lt;strong&gt;keybar&lt;/strong&gt; is one plain line (bold key + dim label, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k9jse1km\"&gt;•&lt;/code&gt; separators, no\nreverse video; wrapped here for page width); it always tells the truth —\nkeys that do not apply in the current mode are omitted (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8xfm6sxm\"&gt;m&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hnla0y2i\"&gt;p&lt;/code&gt; only on a\nlive run, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wuuu5d07\"&gt;[ ]&lt;/code&gt; seek only in browse), and extras drop by fitting tier on\nnarrow terminals. Bindings without a bar slot (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dlkwtppf\"&gt;L&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j98mq9ta\"&gt;H&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rth7ivof\"&gt;F&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cwm2k0p1\"&gt;g&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zygk83zm\"&gt;G&lt;/code&gt;, the\nseek steps) all live in the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-09yx3p5u\"&gt;?&lt;/code&gt; help overlay.&lt;/p&gt;\n&lt;h3 id=\"the-node-hierarchy-all-of-it-a-pure-fold-over-the-log\"&gt;&lt;a href=\"en/14-tui.html#the-node-hierarchy-all-of-it-a-pure-fold-over-the-log\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The node hierarchy (all of it a pure fold over the log)&lt;/span&gt;&lt;/a&gt;The node hierarchy (all of it a pure fold over the log)&lt;/h3&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;run\n├── task*                    task.created / task.phase / task.verdict\n│   ├── round*               one node per verdict (phase, role → outcome)\n│   │   ├── gateway call*    gateway.call (task-attributed)\n│   │   └── tool call*       tool.result leaves (✎ edit · $ command · ⚙ mcp)\n│   ├── evidence drawer      verdict evidence[] as expandable leaves\n│   ├── note*                workspace base, injected context, pre-task gates\n│   └── (blocked-on line)    unmet deps, rendered inline\n├── anomaly*                 always top-level too — never buried\n├── steering note*           user.note (msg / clarify answers)\n└── changeset / fork lineage run.changeset, run.forked (+ children)\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"86\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-86\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-86\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-86.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;&lt;strong&gt;Glyph vocabulary&lt;/strong&gt; (one meaning each; NO_COLOR keeps plain-text\nequivalents for every glyph): &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lrqlowy2\"&gt;✔&lt;/code&gt; done-good (merged/pass/approve) · &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yvsp40x7\"&gt;✖&lt;/code&gt;\nfailed/discard · &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7d77bgh7\"&gt;◆&lt;/code&gt; frozen (escalated, clarify-unanswered) · braille\nspinner &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-plnlwm92\"&gt;⣷⣯⣟⡿⢿⣻⣽⣾&lt;/code&gt; in flight · &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xla4xca0\"&gt;◌&lt;/code&gt; pending/blocked · &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-herkdzrg\"&gt;‼&lt;/code&gt; anomaly · &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-utw47zmr\"&gt;»&lt;/code&gt;\nsteering · &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-noto04yr\"&gt;▼&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wi6e74d4\"&gt;▶&lt;/code&gt; fold state · cursor = full-row background band (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kepw4tco\"&gt;❯&lt;/code&gt;\nunder NO_COLOR). Dagger's law is kept: &lt;strong&gt;success condenses, failure flags\nitself&lt;/strong&gt; — done-good tasks auto-collapse to one row; a task entering\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4zkgy3rp\"&gt;escalated&lt;/code&gt; or producing &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fn30nck6\"&gt;✖&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k41gi41x\"&gt;‼&lt;/code&gt; auto-expands and the follow cursor jumps\nto it.&lt;/p&gt;\n&lt;h2 id=\"4-interaction\"&gt;&lt;a href=\"en/14-tui.html#4-interaction\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Interaction&lt;/span&gt;&lt;/a&gt;4. Interaction&lt;/h2&gt;\n&lt;p&gt;Navigation (both modes):&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Key&lt;/th&gt;\n&lt;th&gt;Action&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2a3zm04z\"&gt;↑&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zos5vom5\"&gt;↓&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r4sz9bbx\"&gt;k&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mbiugl9z\"&gt;j&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;move the cursor over &lt;em&gt;visible&lt;/em&gt; nodes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8ghykks0\"&gt;→&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qp6ceib4\"&gt;←&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ow1cak8\"&gt;l&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8jb4pt2e\"&gt;h&lt;/code&gt;)&lt;/td&gt;\n&lt;td&gt;expand / collapse; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lygidjkc\"&gt;←&lt;/code&gt; on a leaf jumps to its parent&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jm0pn5xg\"&gt;L&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-26cgjfby\"&gt;H&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;expand / collapse every fold at once (a 9-round task must not cost 9 keystrokes to open)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-986ipnxb\"&gt;Enter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;zoom: open/close the detail viewport for the cursor node&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jp3sgza4\"&gt;Tab&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;cycle focus tree ⇄ detail; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-voccwnoz\"&gt;PgUp&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xg071201\"&gt;PgDn&lt;/code&gt; page the FOCUSED pane&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nilp1cag\"&gt;g&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hoy0vtkx\"&gt;G&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;first / last node&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pfdwqd57\"&gt;e&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;hop to the next &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dzb2fjqu\"&gt;✖&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k0b6d9mk\"&gt;◆&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ddh4ixn5\"&gt;‼&lt;/code&gt; — the diagnostic path&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9e86wu4z\"&gt;f&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;follow mode: cursor tracks the newest activity; any manual move turns it off (live starts on)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-39hw5nsu\"&gt;F&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;follow &lt;strong&gt;depth&lt;/strong&gt;: cycle task / round / tool — pick your altitude&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-shfq18u6\"&gt;+&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f8f26e9y\"&gt;-&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;verbosity 0–2: 0 condenses to task/round headers (anomalies and steering always render — honesty is not a tier), 1 = the standard tree, 2 reveals dim inline detail lines with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nzluro3g\"&gt;[0.07s]&lt;/code&gt; durations; the live activity pane scales with it (2/6/10 rows). Composes with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rvns2v2s\"&gt;F&lt;/code&gt;: F says where the cursor follows, verbosity says what renders. The fold posture (verbosity + follow depth) PERSISTS across runs (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-klb1sdrn\"&gt;~/.config/theia/tui-state.json&lt;/code&gt;, fail-open)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r9nb0oh2\"&gt;w&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;wrap the cursored row's full label across hang-indented lines&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pbrrxyin\"&gt;v&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;open the node's full command/output body in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-he1p4e93\"&gt;$EDITOR&lt;/code&gt; (from local content-addressed blobs; bodies never ride events or telemetry — THE-055)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-glnhjtmm\"&gt;?&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;help overlay (every binding + the glyph legend)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7vtsbjfg\"&gt;q&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;leave: browse = quit; live = graceful stop (below); ended hold = quit&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Text boxes&lt;/strong&gt; (steer, clarify answers, the home task box) share one line\neditor: cursor keys, Home/End, Ctrl-A/E, word hops (Ctrl-←/→), Ctrl-W/U/K\nkills, Delete — and bracketed paste delivers a paste as ONE insertion, so\na pasted newline inserts instead of submitting and a pasted &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-upgdl9j6\"&gt;q&lt;/code&gt; cannot\nquit. The caret renders in-text (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-apqy721b\"&gt;▏&lt;/code&gt;) and BLINKS while the box owns the\nkeys (static under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-thyp5pp5\"&gt;--no-spinner&lt;/code&gt; — monitors must not see frame churn).\n&lt;strong&gt;Tab hops message ⇄ tree mid-draft&lt;/strong&gt;: navigate and inspect the run\nwithout losing the composed text (the dimmed draft names the way back,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hxwnpu6u\"&gt;m&lt;/code&gt; re-focuses it; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2kw8qgo6\"&gt;q&lt;/code&gt;/Ctrl-C still stop — stopping outranks a draft).\nWith the detail viewport open, both separators NAME their pane and mark\nthe focused one (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sgawzfc5\"&gt;──┤ tree · focus ├──&lt;/code&gt;).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;In-flight activity.&lt;/strong&gt; From the moment a dispatch's model call starts, a\ndim activity line shows who is in flight (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dv05cr65\"&gt;⋯ implementer tsk…x (model) call in flight… · 4m32s [0 tools]&lt;/code&gt;), enriched per tool completion — a\nlong tool-less call is never a bare spinner. Under it, a rolling tail of\nthe dispatch's recent tools (the live commands LOG, 8 kept, newest first;\nthe row cap follows verbosity). A backing-off call names its wait: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o09iqzh1\"&gt;↻ retry 2/4 in 4s — &amp;lt;classified reason&amp;gt;&lt;/code&gt; — a 429/500/session-limit loop\nnever reads as a stuck session. Anomaly rows fold consecutively-identical\nrepeats into one &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-el4odvyc\"&gt;×N&lt;/code&gt; row (the header count keeps the truth), and event\nbursts refold at repaint cadence — keys, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9zng0qa9\"&gt;q&lt;/code&gt; and Ctrl-C included, stay\nresponsive under spam. &lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jgaf5zth\"&gt;p&lt;/code&gt; opens the in-flight\ncall's PROMPT&lt;/strong&gt; (a pre-call exchange blob, class-gated like the audit\nblob): the operator reads what a long-running block is running WITH, not\nonly after it lands. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gwr4knxo\"&gt;THEIA_LOG_FILE=&amp;lt;path&amp;gt;&lt;/code&gt; appends every event's\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zc95hwhn\"&gt;--plain&lt;/code&gt; line PLUS its full JSON payload (max verbosity — nothing the\none-line render truncated is lost; payloads carry digests, never bodies)\nand the live feed lines — tail it from a second terminal for parallel\nanalysis.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Exit is clean.&lt;/strong&gt; Every run/TUI exit path — finished, hard stop, ended\nhold — sweeps children: registered harness process groups first, then a\n/proc descendant reap (TERM, short grace, KILL) for strays the registries\nnever saw. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s4hrfzb7\"&gt;theia run --abandon &amp;lt;runId&amp;gt;&lt;/code&gt; is the operator's kill for a\npaused/killed run that will not be resumed: it appends the terminal\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-16i2rn52\"&gt;run.finished {halted: abandoned}&lt;/code&gt;, after which &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-73grmbfd\"&gt;theia prune&lt;/code&gt; reclaims it.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Ended hold.&lt;/strong&gt; A finished run — discards included — keeps the screen with\nan &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e0y1yp83\"&gt;■ run ended — …&lt;/code&gt; banner: browse, seek (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-knraiw5n\"&gt;[ ]&lt;/code&gt;), and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s7kf4mou\"&gt;v&lt;/code&gt; stay live for\ninspection; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lb1ikgab\"&gt;q&lt;/code&gt; leaves (the hold is skipped when the operator had already\npressed &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-alr61cpv\"&gt;q&lt;/code&gt;). The summary tail still prints to normal scrollback after.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Live-run verbs&lt;/strong&gt; (each an existing kernel mechanism, only the surface is\nthe TUI):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Steer — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qhii95dz\"&gt;m&lt;/code&gt;.&lt;/strong&gt; A one-line footer input; the note lands as an audited\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e34klhjt\"&gt;user.note&lt;/code&gt; in the hash-chained log AND folds into the live coordinator's\nΣ guidance immediately. With the cursor on a task node, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iltyl1w7\"&gt;m&lt;/code&gt; targets THAT\ntask by default (the input label names the addressee: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nihwekiu\"&gt;steer → tsk…&lt;/code&gt; /\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-47w4o8wm\"&gt;steer → run&lt;/code&gt;); a note to an already-terminal task reroutes to run-level\nguidance carrying the original addressee — a message is never silently\ndropped.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Answer — clarify forms.&lt;/strong&gt; When a role returns &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xqu3fepz\"&gt;clarify&lt;/code&gt;, the detail\nviewport becomes the question form (one question at a time, the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v7o4qgtc\"&gt;why&lt;/code&gt;\nshown dim). Answers fold into Σ and become memory facts (never asked\ntwice); &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jrvqiy98\"&gt;Esc&lt;/code&gt; declines the remainder and the task freezes &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-841hkery\"&gt;◆ escalated&lt;/code&gt;\nexactly as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6kgorm0q\"&gt;--non-interactive&lt;/code&gt; would.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Stop — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xmbgr0v9\"&gt;q&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ul2avj3h\"&gt;Ctrl+C&lt;/code&gt;.&lt;/strong&gt; First press: graceful — header flips to\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-de2yyezk\"&gt;‖ stopping&lt;/code&gt;, in-flight verdicts land, the run pauses resumable, the\nresume hint prints after screen teardown. Second press: hard stop —\nharness &lt;strong&gt;process groups&lt;/strong&gt; killed, exit 130. One two-stage law, every\nsurface.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;p&gt;&lt;strong&gt;Browse-mode seek&lt;/strong&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vph308b0\"&gt;theia show &amp;lt;runId&amp;gt; --tui&lt;/code&gt;): &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mm7ps87l\"&gt;[&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7emmtvy3\"&gt;]&lt;/code&gt; step the event\ncursor ±1, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-48wn7s9r\"&gt;{&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wi9fysfc\"&gt;}&lt;/code&gt; ±10, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sis4bczm\"&gt;Home&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uu7n0rsx\"&gt;End&lt;/code&gt; (or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-08zmybvt\"&gt;0&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xxl72cim\"&gt;$&lt;/code&gt;) genesis/head — the tree re-folds from\nthe event prefix, so \"what did the run look like the moment the reviewer\nbounced it\" is two keystrokes. The header shows &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0sob3ukb\"&gt;@ event k/N&lt;/code&gt;; a verdict\nnode's detail carries the copyable &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tespi4xl\"&gt;theia fork &amp;lt;run&amp;gt; --at &amp;lt;evt&amp;gt;&lt;/code&gt; command —\nfork points are verdict boundaries, and the TUI hands you the command rather\nthan spawning runs.&lt;/p&gt;\n&lt;h2 id=\"5-the-home-screen\"&gt;&lt;a href=\"en/14-tui.html#5-the-home-screen\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. The home screen&lt;/span&gt;&lt;/a&gt;5. The home screen&lt;/h2&gt;\n&lt;p&gt;Bare &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x95sd9gb\"&gt;theia&lt;/code&gt; on a two-way terminal opens the launcher: the doctor summary\n(same truth the verb prints), the index-freshness line (zero model calls),\nthe last five runs with lineage-honest rows (probe/ask scopes render as\nterminal &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-44lku4r0\"&gt;·&lt;/code&gt; rows; forks wear &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-61etkgwd\"&gt;forked·&amp;lt;outcome&amp;gt;&lt;/code&gt;) and their LOCKED costs\nread from gateway events (never recomputed — THE-015), and a task input box\n— &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ot96ca9\"&gt;Enter&lt;/code&gt; hands the terminal to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aio9rptx\"&gt;run --tui&lt;/code&gt; with the typed brief. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f98u957q\"&gt;?&lt;/code&gt;\ntoggles help; non-TTY prints the help text unchanged. Briefs everywhere\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ti4344tt\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jca6tfgz\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tv7eyvcb\"&gt;msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yxzk5ywv\"&gt;probe&lt;/code&gt;, the home box) accept &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nk6wc1x7\"&gt;@path&lt;/code&gt; inclusions\nthrough the audited context path: read + digest + data-class gate, inlined\nas digest-headed blocks so the persisted brief pins the exact bytes (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ufr601zg\"&gt;@@&lt;/code&gt;\nescapes a literal &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1q6is5xc\"&gt;@&lt;/code&gt;; missing files refuse loudly).&lt;/p&gt;\n&lt;h2 id=\"6-honest-states-the-052-applied-to-a-screen\"&gt;&lt;a href=\"en/14-tui.html#6-honest-states-the-052-applied-to-a-screen\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Honest states (THE-052 applied to a screen)&lt;/span&gt;&lt;/a&gt;6. Honest states (THE-052 applied to a screen)&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;Terminals below 20×5 get a one-line guard frame; anything larger renders\nwith hard horizontal clipping — every line truncates at the real column\ncount, progress stays legible in tiny panes, no reflow corruption.&lt;/li&gt;\n&lt;li&gt;A run with only &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u8qfmwoj\"&gt;run.created&lt;/code&gt; renders the header + \"no tasks yet\"; a\nbroken hash chain shows &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s4xx9f41\"&gt;‼ audit chain BROKEN at &amp;lt;id&amp;gt;&lt;/code&gt; in the header while\nthe fold still renders the prefix — inspection is how tampering is\ndiagnosed.&lt;/li&gt;\n&lt;li&gt;Unknown event types render as dim rows — never dropped, never a crash (the\nregistry can grow ahead of the viewer).&lt;/li&gt;\n&lt;li&gt;Alternate screen + raw mode are restored on &lt;em&gt;every&lt;/em&gt; exit path (finally +\nprocess exit hook + uncaught) — a crashed TUI never leaves the operator's\nterminal raw.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"7-mechanics-why-this-is-testable\"&gt;&lt;a href=\"en/14-tui.html#7-mechanics-why-this-is-testable\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. Mechanics — why this is testable&lt;/span&gt;&lt;/a&gt;7. Mechanics — why this is testable&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Pure core, thin shell.&lt;/strong&gt; Tree fold (events → model), keymap\n((state, key) → state + effect), and frame render ((model, state,\ncols×rows) → styled lines) are pure functions; the screen driver\n(alternate buffer, raw input decode incl. CSI sequences, resize, repaint)\nis the only I/O. Golden-frame tests pin rendered frames byte-for-byte at\nfixed sizes; keymap tests walk the reducer; seek tests assert\nprefix-fold ≡ &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ohidv8id\"&gt;fromEvents&lt;/code&gt; equality.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Diff repaint.&lt;/strong&gt; Only changed lines repaint (a shrinking frame clears\nits orphaned rows), coalesced ≥80ms; the spinner ticks on its own 120ms\ntimer in live mode only.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Durations are event-derived.&lt;/strong&gt; Per-row durations compute from event-id\nHLC wall time — rounds span verdict boundaries, tasks span\ncreated→last — so stored frames are deterministic; only live rows read\nthe injected clock. Sub-0.1s spans are suppressed.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;No new dependencies.&lt;/strong&gt; Node + ANSI, hand-rolled driver — the TUI stays\non the tested-artifact path and off the native-deps pothole list.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Live wiring&lt;/strong&gt; is one more &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bq0mileb\"&gt;onEvent&lt;/code&gt; sink on the tee store, plus a\ncoordinator note hook for steering and an interaction impl for clarify —\nno kernel restructuring; steering folded live is replay-equal to the\nsame log rehydrated (test-pinned).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"8-out-of-scope-named,-not-silent\"&gt;&lt;a href=\"en/14-tui.html#8-out-of-scope-named,-not-silent\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;8. Out of scope (named, not silent)&lt;/span&gt;&lt;/a&gt;8. Out of scope (named, not silent)&lt;/h2&gt;\n&lt;p&gt;In-TUI file-diff rendering (evidence is digest-referenced; commit evidence\nshows a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lh09ltx1\"&gt;git show &amp;lt;sha&amp;gt;&lt;/code&gt; hint — a workspace-read seam the browse mode does\nnot grow); contextual rollback (that is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-77tidorm\"&gt;fork&lt;/code&gt;, and the TUI hands you the\ncommand); cross-process live attach of &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d5uy8vvr\"&gt;msg&lt;/code&gt; to a running TUI (arrives with\na daemon channel; today cross-process notes fold on the next rehydration,\nand the CLI prints that hint honestly).&lt;/p&gt;\n&lt;h2 id=\"static-rendering\"&gt;&lt;a href=\"en/14-tui.html#static-rendering\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Static rendering&lt;/span&gt;&lt;/a&gt;Static rendering&lt;/h2&gt;\n&lt;p&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n913gxgi\"&gt;--no-spinner&lt;/code&gt; (or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ezig4uzg\"&gt;THEIA_NO_SPINNER=1&lt;/code&gt;) replaces the braille spinner and\nrunning-glyph animation with static &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rjgzo75q\"&gt;●&lt;/code&gt; glyphs — for screen readers, tmux\nframe captures, and line-diff monitors that must not see a change per\nanimation tick.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/14-tui.html","hreflang":"en"}],"style":["_assets/theia.css"],"canonical":"en/14-tui.html","vcsPath":"en/14-tui.md"},"headings":[{"title":"1. The failure this closes","href":"en/14-tui.html#1-the-failure-this-closes","level":2},{"title":"2. Views and where they appear","href":"en/14-tui.html#2-views-and-where-they-appear","level":2},{"title":"3. Layout — three zones + one viewport","href":"en/14-tui.html#3-layout-three-zones-one-viewport","level":2,"items":[{"title":"The node hierarchy (all of it a pure fold over the log)","href":"en/14-tui.html#the-node-hierarchy-all-of-it-a-pure-fold-over-the-log","level":3}]},{"title":"4. Interaction","href":"en/14-tui.html#4-interaction","level":2},{"title":"5. The home screen","href":"en/14-tui.html#5-the-home-screen","level":2},{"title":"6. Honest states (THE-052 applied to a screen)","href":"en/14-tui.html#6-honest-states-the-052-applied-to-a-screen","level":2},{"title":"7. Mechanics — why this is testable","href":"en/14-tui.html#7-mechanics-why-this-is-testable","level":2},{"title":"8. Out of scope (named, not silent)","href":"en/14-tui.html#8-out-of-scope-named,-not-silent","level":2},{"title":"Static rendering","href":"en/14-tui.html#static-rendering","level":2}],"title":"TUI &amp; CLI surfaces — the run tree, the views, the home screen"},"router":{"pathname":"en/14-tui","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/inde
