        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"1-the-failure-this-closes\"&gt;&lt;a href=\"en/10-integrations.html#1-the-failure-this-closes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The failure this closes&lt;/span&gt;&lt;/a&gt;1. The failure this closes&lt;/h2&gt;\n&lt;p&gt;A memory/orchestration platform that lives beside the engineer's actual tools\nis dead weight: the agent re-greps what the index knows, the session that\ncompacts loses the afternoon's execution state, and \"the platform\" becomes a\nsecond place to look. Aletheia therefore integrates in both directions —\n&lt;em&gt;under&lt;/em&gt; Claude Code and Codex as their memory, map, and audit layer, and\n&lt;em&gt;over&lt;/em&gt; them as the orchestrator that drives them as harnesses — with the\nend-user's own tools and MCP servers first-class inside Aletheia's runs.&lt;/p&gt;\n&lt;h2 id=\"2-under-the-harnesses-hooks-and-session-continuity\"&gt;&lt;a href=\"en/10-integrations.html#2-under-the-harnesses-hooks-and-session-continuity\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Under the harnesses — hooks and session continuity&lt;/span&gt;&lt;/a&gt;2. Under the harnesses — hooks and session continuity&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;Lifecycle hooks&lt;/strong&gt; (agentmemory's proven surface): &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2qln0yei\"&gt;SessionStart&lt;/code&gt; injects\nthe project brief + relevant memory + codebase-model pointers;\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k1lr1yur\"&gt;UserPromptSubmit&lt;/code&gt; recalls against the prompt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9bkda3z3\"&gt;PostToolUse&lt;/code&gt; captures\nobservations (SHA-256 deduped, privacy-filtered); &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fn13ixdw\"&gt;PreCompact&lt;/code&gt; runs the\nFocusMemory play — extract Σ before the harness's lossy compaction, with\nperiodic checkpoints so the loss bound is the checkpoint interval, not the\nwindow; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aydxynjc\"&gt;Stop&lt;/code&gt; distills the session into factual/experiential memory.\nClaude Code gets the full set via &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v680s8sy\"&gt;.claude/settings.json&lt;/code&gt;; Codex gets it\nvia project &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bx7kxxxq\"&gt;.codex/hooks.json&lt;/code&gt; + &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bwt166rt\"&gt;[mcp_servers.theia]&lt;/code&gt; in project\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uijt5g24\"&gt;.codex/config.toml&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ncm2s4jb\"&gt;theia hooks install codex&lt;/code&gt; — probed at codex-cli\n0.151.0: the Claude-shaped hook schema, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nkxd9qb4\"&gt;transcript_path&lt;/code&gt; on every\nevent). Two gates stand between install and dispatch, and the installer\nprints both loudly instead of letting silence be discovered: project\ntrust must be PERSISTED in the codex home config (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-68ittsgy\"&gt;--trust&lt;/code&gt; appends it\nas an explicit opt-in; a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xwfug4r7\"&gt;-c&lt;/code&gt; override does not satisfy the gate), and\nnon-managed hooks are review-gated per hash (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hxs6hi3w\"&gt;/hooks&lt;/code&gt; interactively, or\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3qwib2ck\"&gt;--dangerously-bypass-hook-trust&lt;/code&gt; for vetted automation). The\nagentmemory-era plugin-hooks path is retired (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qqnoijxq\"&gt;plugin_hooks&lt;/code&gt; = removed\nat this CLI). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-utgh84dh\"&gt;SessionStart&lt;/code&gt; also reports index\nfreshness and, under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xuf6io07\"&gt;indexPolicy: auto&lt;/code&gt;, kicks a detached budget-capped\nbuild; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lv3k29jt\"&gt;theia hooks install git&lt;/code&gt; adds the post-commit dirty-marks hint\n(zero model calls).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Session resume&lt;/strong&gt; rides each harness's native mechanism (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bqe12a3u\"&gt;--resume&lt;/code&gt;,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6xph76oo\"&gt;codex exec resume&lt;/code&gt;) through the gateway's session support; lineage is\nverified by content hashing before resuming (meridian's pure &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i2d213dn\"&gt;lineage&lt;/code&gt;\nmodule — resuming the wrong conversation is a silent corruption class).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;MCP server&lt;/strong&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-86p7a309\"&gt;theia serve&lt;/code&gt;): the codebase-model query tools\n(find_symbol, call_graph, intent search), memory tools (recall, remember,\nas-of queries), run-audit readers, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ef4x0bw3\"&gt;run_diagnose&lt;/code&gt; — the diagnostician\nexposed to host models (post-hoc RCA over a stored run's log, sharing the\nCLI verb's fingerprint memory) — so any MCP-speaking host model\nreads the same truth the kernel does. Tool descriptions carry contracts\nonly; behavioral guidance for the calling model lives in server\ninstructions (the MCP discipline: never smuggle policy into tool\ndescriptions).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"3-over-the-harnesses-tools-inside-aletheia-runs\"&gt;&lt;a href=\"en/10-integrations.html#3-over-the-harnesses-tools-inside-aletheia-runs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Over the harnesses — tools inside Aletheia runs&lt;/span&gt;&lt;/a&gt;3. Over the harnesses — tools inside Aletheia runs&lt;/h2&gt;\n&lt;p&gt;Inside a kernel run the WORK tools are the harness's own (edit, shell,\napply_patch), governed by capability, not instruction: the sandbox tier\nbounds the filesystem/network, probed per-role &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j3lgg7ah\"&gt;gateway.harnessConfig&lt;/code&gt;\nknobs toggle harness features, and git/merge/deploy are absent from every\nagent's reach (the platform commits — THE-054). Platform-side execution —\nverify commands, pre-task gates, declared commits — produces evidence\nobjects: exit codes, artifact digests, byte counts, never prose summaries\n(A12), and runs in the task's own workspace. The user's OWN MCP servers\ncompose at the host-session layer (their Claude/Codex config, beside our\nhooks) and can be declared into kernel runs through the same probed\nharness-config seam; a first-class per-run user-MCP manifest graduates\nwith a consumer (&lt;a href=\"en/13-roadmap.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yymmskb4\"&gt;13-roadmap.md&lt;/code&gt;&lt;/a&gt; container-provider\nrow).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;The agent-side MCP belt.&lt;/strong&gt; Kernel-driven codex invocations carry\ntheia's OWN MCP server as per-invocation config (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b80jsqut\"&gt;-c mcp_servers.theia…&lt;/code&gt;,\nnever a global config write): &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-actpd99n\"&gt;theia serve&lt;/code&gt; on stdio against the same\nstore (explicit &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o8vng0w1\"&gt;--home&lt;/code&gt; — never cwd discovery from inside a workspace\ncopy), the least-privilege read-mostly tool set (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-799hgoxq\"&gt;run.mcpBelt.tools&lt;/code&gt;\npolicy value; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zrgeh9ov\"&gt;memory_add&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9xpccelv\"&gt;run_*&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-whiidxkd\"&gt;run_check&lt;/code&gt; opt-in — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ekii1v1x\"&gt;run_check&lt;/code&gt; executes ONE of the task's own verify commands host-side in the task workspace, a closed list at spawn: the sandbox-blocked hypothesis loop without widening the sandbox, the verifier keeping the verdict), and belt writes stamped\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pvt5hw6g\"&gt;run:&amp;lt;id&amp;gt;/task:&amp;lt;id&amp;gt;&lt;/code&gt;. Read tools advertise &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cdt8rg5l\"&gt;readOnlyHint&lt;/code&gt; and the server\nsets &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wcit7xm7\"&gt;default_tools_approval_mode=auto&lt;/code&gt; — the probed combination that\nauto-approves reads under exec's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4qh7x1dz\"&gt;approval_policy=never&lt;/code&gt; while write\ntools stay approval-gated. The belt is excluded from the replay key (its\nresults fold into recorded completions); a user session's own theia MCP\ncomposes independently on the same WAL store. This is the AOCI hybrid:\nthe map injected underneath, on-demand queries on top.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Plane comparison — who owns which tool (Q7).&lt;/strong&gt; The harness edits; theia\nknows, remembers, audits, verifies. They compose, never compete:&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Plane&lt;/th&gt;\n&lt;th&gt;theia (MCP belt / platform)&lt;/th&gt;\n&lt;th&gt;Claude Code built-ins&lt;/th&gt;\n&lt;th&gt;codex built-ins&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Repo map &amp;amp; symbols&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xk7micds\"&gt;codebase_blueprint/search/symbol&lt;/code&gt; (precomputed, deterministic)&lt;/td&gt;\n&lt;td&gt;Glob/Grep/Read (exploratory)&lt;/td&gt;\n&lt;td&gt;shell grep/cat (exploratory)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Project memory&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-54d0vcjb\"&gt;memory_search/add/tree&lt;/code&gt; (persistent, temporal)&lt;/td&gt;\n&lt;td&gt;session context only&lt;/td&gt;\n&lt;td&gt;session context + own memories dir&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Editing &amp;amp; execution&lt;/td&gt;\n&lt;td&gt;— (platform commits; verify commands)&lt;/td&gt;\n&lt;td&gt;Edit/Write/Bash&lt;/td&gt;\n&lt;td&gt;apply_patch/shell&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Audit &amp;amp; RCA&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ek48nikp\"&gt;run_audit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d2xbl7yx\"&gt;run_diagnose&lt;/code&gt; (hash-chained log)&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;td&gt;—&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Web&lt;/td&gt;\n&lt;td&gt;policy-gated (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yc53nxqi\"&gt;web_search&lt;/code&gt; harness knob)&lt;/td&gt;\n&lt;td&gt;WebSearch/WebFetch&lt;/td&gt;\n&lt;td&gt;web_search tool&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Git / merge / deploy&lt;/td&gt;\n&lt;td&gt;platform-only, capability-absent for agents (THE-054)&lt;/td&gt;\n&lt;td&gt;user-mediated&lt;/td&gt;\n&lt;td&gt;sandbox-blocked&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Harness tool governance (the P10 ladder, probed).&lt;/strong&gt; (1) capability\nabsence first: sandbox tier + jail govern fs/network; (2) config\nwhitelist per role (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2l3htud2\"&gt;gateway.harnessConfig.&amp;lt;role&amp;gt;&lt;/code&gt; policy value) — every\nkey PROBED on the pinned CLI before trust: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hd3in93p\"&gt;web_search=\"disabled\"&lt;/code&gt;\nverifiably removes the tool; the plausible &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oznw16x0\"&gt;tools.web_search=false&lt;/code&gt; is\naccepted-but-ineffective at codex-cli 0.151.0, and unknown &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fchkbgpe\"&gt;-c&lt;/code&gt; keys pass\nsilently, so acceptance is never evidence (ledger §4); (3) prompts last,\nnever as enforcement.&lt;/p&gt;\n&lt;h2 id=\"4-the-on-disk-contract\"&gt;&lt;a href=\"en/10-integrations.html#4-the-on-disk-contract\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4.  — the on-disk contract&lt;/span&gt;&lt;/a&gt;4. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y8gr60kh\"&gt;.theia/&lt;/code&gt; — the on-disk contract&lt;/h2&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;.theia/\n  config/            YAML manifests (apiVersion/kind) — user-versioned\n  prompts/           per-role prompt extensions — user-versioned\n    LEAD.md REVIEWER.md …      appended to baked-in role prompts\n    PROMPTS.md                 or one file, \"### ROLE\" sections\n  objects/           content-addressed blobs (sha256/…)\n  store.db           SQLite SoT (events, facts, entries, generations, heads)\n  index/             generation-named FAISS/BM25 shards\n  runs/&amp;lt;run-id&amp;gt;/     per-run worktree refs, artifacts, REPORT.md\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"148\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-148\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-148\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-148.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ol&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Prompts are the user's&lt;/strong&gt; (overseer's override mechanism, adopted\nverbatim): baked defaults + appended per-role overrides, tracked by the\n&lt;em&gt;user's&lt;/em&gt; repository VCS; every agent run's assembled prompt is recorded by\ndigest, so \"what did the model actually see\" is answerable forever.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Config is declarative YAML&lt;/strong&gt;, closed kinds, validated on load\n(&lt;a href=\"en/01-architecture.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5z6z3gic\"&gt;01-architecture.md §6&lt;/code&gt;&lt;/a&gt;). Unknown kinds and\nunconsumed knobs fail loudly (P10, staged-field rule).\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2f1s76pq\"&gt;kind: Context&lt;/code&gt; carries user rules and reference material injected\ninto agent prompts &lt;strong&gt;as content&lt;/strong&gt; — each entry names a source (inline /\npath / glob), a scope (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4igkp07d\"&gt;always&lt;/code&gt;, or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8lpcigfw\"&gt;roles[]&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-m8ru0jsx\"&gt;tracks[]&lt;/code&gt; /\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7dpmbecs\"&gt;pathTriggers[]&lt;/code&gt; — globs matched against the task diff where committed\nwork exists, desc-paths otherwise), and a char budget; what a run\ninjected is recorded as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-58q2rx3y\"&gt;{entry, digest}&lt;/code&gt; on its audit trail. \"Read docs\nat X\" becomes the docs arriving, not an instruction the model may skip.\n&lt;strong&gt;Rules files compose in three modes (Q8):&lt;/strong&gt; &lt;em&gt;native passthrough&lt;/em&gt; —\nworkspace copies preserve the repo, so codex reads AGENTS.md exactly as\nanywhere (unbudgeted, unaudited, harness-specific); &lt;em&gt;audited injection&lt;/em&gt;\n— a Context manifest globs any rules file (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-beoryqcs\"&gt;.ai/*&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8v9abs4c\"&gt;.cursor/rules&lt;/code&gt;,\nAGENTS.md) into scoped, budgeted, digest-recorded blocks — the layer\nnative reads cannot be; &lt;em&gt;rules-SoT&lt;/em&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ze2dut0j\"&gt;run.rulesSoT&lt;/code&gt; policy value) makes\nthe manifests the ONLY path: layer 1 disables the native read\nper-invocation (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u0ojvl7o\"&gt;project_doc_max_bytes=0&lt;/code&gt;, sentinel-probed), layer 2\nmasks in-repo rules files at workspace copy (tracked → sentinel +\nskip-worktree so the commit sweep can never land the masking; untracked\n→ removed), layer 3 (jail bind-masking over global files) arrives with\nthe jailed tiers. Default guidance: point manifests at NON-native files\nand house policy; leave AGENTS.md to the native read — or enable\nrulesSoT when audit outweighs the duplicate tokens.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Everything content-dependent is hash-addressed&lt;/strong&gt; — change detection,\ncache validity, and audit all reduce to digest comparison (A24).&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;FUSE-ready by layout&lt;/strong&gt;: stable paths, enumerable directories,\none-fact-per-file where a human would grep; the future FUSE mount\n(&lt;a href=\"en/13-roadmap.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mn42zixc\"&gt;13-roadmap.md&lt;/code&gt;&lt;/a&gt;) adds virtual read views (rendered\nmemory cards, run timelines) without changing the physical layout.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Multi-root workspaces&lt;/strong&gt;: a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bft16f0a\"&gt;kind: Workspace&lt;/code&gt; manifest declares\nnamed repo roots sharing this ONE &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sv9ed58k\"&gt;.theia/&lt;/code&gt; store —&lt;/p&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;theia.dev/v1alpha1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Workspace&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;shop&lt;/span&gt; }\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;roots:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;api&lt;/span&gt;, &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;../shop-api&lt;/span&gt; }\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;web&lt;/span&gt;, &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;../shop-web&lt;/span&gt; }\n  &lt;span class=\"hljs-attr\"&gt;primary:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;api&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"174\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-174\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-174\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-174.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Discovery walks UP from cwd to the nearest &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tfhiqpw0\"&gt;.theia/&lt;/code&gt; &lt;strong&gt;with a store&lt;/strong&gt; —\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-frpcwwpx\"&gt;store.db&lt;/code&gt; is the home marker; intent entries key\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2wxd46zz\"&gt;rootName/relpath&lt;/code&gt;; memory recall unions the workspace scope with every\nroot scope; no manifest = one implicit root, byte-identical to before.&lt;/p&gt;\n&lt;/li&gt;\n&lt;li&gt;\n&lt;p&gt;&lt;strong&gt;Per-root overlays (closest-scope-first)&lt;/strong&gt;: a declared root may\ncarry its own &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ydm15yxi\"&gt;.theia/{prompts,config}&lt;/code&gt; INSIDE the root repo — that\nrepo's team versions its overrides beside the code. A store-less\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bz0e5vaz\"&gt;.theia/&lt;/code&gt; is exactly this overlay (the home-marker rule keeps discovery\nfrom mistaking it for a workspace); a root with a FULL &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p98oh7sq\"&gt;.theia&lt;/code&gt; is its\nown workspace when invoked from inside — closest scope first at the\ninvocation level too. The precedence law, per scope kind (root &amp;gt;\nworkspace &amp;gt; baked, pinned by test): &lt;strong&gt;prompts&lt;/strong&gt; append outermost-first\nso the closest scope has the last word; &lt;strong&gt;policy&lt;/strong&gt; merges key-wise, and\noverlays accept ONLY the keys with per-root consumers —\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b2vse1qu\"&gt;gateway.harnessConfig&lt;/code&gt; (knob-wise per role) and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rdeeu5k1\"&gt;run.preTask&lt;/code&gt; (a\nroot's list REPLACES the workspace list whole-array) — anything else\nfails loudly naming the workspace home (no accepted-but-dead knobs,\nTHE-051); &lt;strong&gt;context entries&lt;/strong&gt; union, root entries shadowing name\ncollisions, sources resolving against the root's path, provenance on\nthe audit event. Recorded prompt digests keep saying what each role\nactually saw, now per root.&lt;/p&gt;\n&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"5-git-discipline\"&gt;&lt;a href=\"en/10-integrations.html#5-git-discipline\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Git discipline&lt;/span&gt;&lt;/a&gt;5. Git discipline&lt;/h2&gt;\n&lt;p&gt;Each implementer task runs in an isolated workspace on an &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ftifvaes\"&gt;ai/*&lt;/code&gt; branch\n(ralphex/overseer + the competitor's least-privilege matrix). Workspaces are\n&lt;strong&gt;copies&lt;/strong&gt; of the root tree by default: copies carry the untracked\ndependencies — node_modules, .env, build caches — so verify commands run\nwithout reinstall; the pre-existing untracked set is snapshotted into the\nworkspace's git excludes so a dependency can never enter task history, and\nthe recorded base sha (run event + workspace config) anchors what counts as\nthe task's own work. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7679blgh\"&gt;workspaceMode: clone&lt;/code&gt; remains the escape hatch.\nAgents edit files; the platform commits — in the order an implementer\n&lt;em&gt;declares&lt;/em&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-37wshw8n\"&gt;commits: [{message, paths}]&lt;/code&gt;) with a sweep commit for the\nremainder — and trunk is written only by the merger's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kpsf319f\"&gt;--no-ff&lt;/code&gt; step.\n&lt;strong&gt;The merge target is a per-run branch&lt;/strong&gt; (single-root git runs): &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ysrfac4w\"&gt;theia run&lt;/code&gt; creates a git worktree at &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4ys3dtwz\"&gt;.theia/runs/&amp;lt;id&amp;gt;/trunk&lt;/code&gt; on\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hv39ra7d\"&gt;theia/run-&amp;lt;suffix&amp;gt;&lt;/code&gt; (override &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-50ai1cdp\"&gt;--branch&lt;/code&gt;), cut from the current branch's\nupstream — else &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nr4yrqev\"&gt;origin/HEAD&lt;/code&gt;, else local HEAD, said honestly (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yr5qjvst\"&gt;--base&lt;/code&gt;\noverrides) — so a run never bases on a stale or dirty checkout and never\nwrites the operator's branch; the finished branch is the deliverable (merge\nit or open a PR). A branch-name conflict fails loudly naming the fix; task\nworkspaces still copy the home repo (deps arrive) but branch from the run\nbranch TIP, so dependents see producer merges; resume re-attaches a pruned\ntrunk to the recorded branch. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ctx5luj2\"&gt;--no-run-branch&lt;/code&gt; keeps in-checkout\nintegration (the swebl S1 driver's posture — its patch collection diffs the\nworkspace tree); multi-root runs and forks keep their existing semantics.\nSandbox posture is the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v31ktr57\"&gt;sandboxTier&lt;/code&gt; policy value: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wlz13tms\"&gt;standard&lt;/code&gt;\n(workspace-write), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a3o4onrp\"&gt;jailed-full&lt;/code&gt; (danger-full-access INSIDE &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f59l6une\"&gt;theia jail&lt;/code&gt; —\nprobed at run start, refuses when the jail is unavailable), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-trxfgv0l\"&gt;trusted-full&lt;/code&gt;\n(full access unjailed — a loud, manifest-recorded opt-in). Protected\nbranches and any production surface\nare human-gate territory — the kernel is &lt;em&gt;incapable&lt;/em&gt; of merging them, not\nmerely instructed (the capability is absent from its tool grants, P10).&lt;/p&gt;\n&lt;p&gt;Cross-root work is ONE run: tasks carry a root label; a task may\ndeclare &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u96arj8e\"&gt;roots: [primary, …]&lt;/code&gt; for a layout-preserving multi-root workspace\n(one copy per root under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ikamhxv\"&gt;ws-&amp;lt;task&amp;gt;/&amp;lt;rootName&amp;gt;/&lt;/code&gt;, commits in the primary,\nverify commands see sibling roots at relative paths); a producer's landed\nmerge re-indexes its root before consumers dispatch, so the new contract\npropagates by mechanism; sibling merges hold at a barrier and land\ntogether, recorded as ONE &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xxhtxzd8\"&gt;run.changeset&lt;/code&gt; (shas + plan digest) — and a\nbreak reverts or freezes per policy with the half-landed set named,\nbecause git has no cross-repo atomicity and the run never pretends at 2PC.&lt;/p&gt;\n&lt;h2 id=\"6-sandboxing-shipped;-platform-dispatched\"&gt;&lt;a href=\"en/10-integrations.html#6-sandboxing-shipped;-platform-dispatched\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Sandboxing —  (shipped; platform-dispatched)&lt;/span&gt;&lt;/a&gt;6. Sandboxing — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-96qqdyry\"&gt;theia jail&lt;/code&gt; (shipped; platform-dispatched)&lt;/h2&gt;\n&lt;p&gt;The jail is a &lt;strong&gt;platform-dispatched seam&lt;/strong&gt; with one contract (notes/23):\nthe workload runs with full capability inside a boundary the platform\nowns — the workspace and named state dirs writable, the rest of the\nuser's data not, the network shared. Backends: &lt;strong&gt;bwrap&lt;/strong&gt; on linux (below,\nunchanged), an &lt;strong&gt;AppContainer&lt;/strong&gt; launcher on win32 (low-box token,\nper-path &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ejyt2cx6\"&gt;icacls&lt;/code&gt; grants, internetClient + privateNetworkClientServer\ncapabilities, inherited stdio — embedded PowerShell/C# core in\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h21w93ja\"&gt;appcontainer.ts&lt;/code&gt;; loopback stays denied by OS design, which is fine\nbecause the MCP belt rides stdio), and none yet on darwin — the probe\nrefuses naming the queued container backend (docs/13). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u9r933ns\"&gt;probeJail&lt;/code&gt; and\nthe doctor line select per platform; the tier vocabulary is unchanged\n(tiers are intent, backends are implementation).&lt;/p&gt;\n&lt;p&gt;On linux the backend is bubblewrap: a\nuser+mount-namespace sandbox with a read-only host root, fresh &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z1ly75sa\"&gt;/dev&lt;/code&gt; +\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s5tf00wn\"&gt;/proc&lt;/code&gt;, and an explicit RW allowlist composed at call time —\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-heomszzb\"&gt;theia jail [--rw=PATH]... -- &amp;lt;cmd&amp;gt;&lt;/code&gt; is the standalone primitive, and the\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j1790pf4\"&gt;jailed-full&lt;/code&gt; tier wraps every codex spawn in it (RW = the task workspace +\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pz6wne2o\"&gt;~/.codex&lt;/code&gt; + tmp) through an opaque spawn-wrapper seam the adapter never\nsees (translational adapters, THE-011). Availability is &lt;strong&gt;probed, never\nassumed&lt;/strong&gt; (THE-013): &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lc03jjmj\"&gt;theia doctor&lt;/code&gt; runs a live no-op inside a fresh\nsandbox, and the tier gate re-probes at run start — no bwrap or no user\nnamespaces means a loud refusal, never a silent degrade. The network stays\nshared by design (the jailed workload is a harness that must reach its\nprovider); &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eu25pei6\"&gt;--die-with-parent&lt;/code&gt; rides every invocation as the containment\nstand-in. Missing RW grants refuse at compose time — a silently skipped\ngrant would resurface as an opaque EROFS deep inside the workload, the\nexact failure class the ledger §4 sandbox saga records. Deliberately still\ndeferred: the prctl TRUE subreaper (adopting double-fork escapes reparented\nto init — needs a native call Node lacks; the jail's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6j0c2zat\"&gt;--die-with-parent&lt;/code&gt;\nremains their only cover), a per-harness RW path registry beyond codex, and\nan &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oihmqqei\"&gt;--unshare-net&lt;/code&gt; policy value. The registry-groups + /proc-descendant\nreap now runs on EVERY run/TUI exit path (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ajh01ksa\"&gt;reaper.ts&lt;/code&gt; — the sweep half of\nthe old deferral, landed).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Resource containment (the layer the jail cannot be).&lt;/strong&gt; bubblewrap is a\nmount/user-namespace tool with zero cgroup capability — isolation and\nresource control are different primitives that COMPOSE as prefixes. The\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kc90n3zn\"&gt;run.resources&lt;/code&gt; policy (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-puw3721i\"&gt;{memoryMax, cpuQuota, tasksMax}&lt;/code&gt;, docs/15 §3)\nruns every kernel-driven harness spawn, host verify command, and pre-task\ngate inside a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tkulwvms\"&gt;systemd-run --user --scope&lt;/code&gt; under &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y67z615t\"&gt;theia-run.slice&lt;/code&gt;, the\nscope wrapping OUTSIDE the jail so the whole sandboxed tree is capped;\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-te8fu7i3\"&gt;MemorySwapMax=0&lt;/code&gt; rides every memory cap by law (a hog that merely spills\ninto swap thrashes the machine — the measured failure the caps exist to\nclose). Unset limits are the identity wrap (byte-identical spawns);\nconfigured-but-unprobeable refuses the run loudly (THE-013). win32's\nanalogue (Job Objects on the AppContainer launcher) is named deferred.&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;The container backend (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r44ienvp\"&gt;run.jail.backend: container&lt;/code&gt;).&lt;/strong&gt; podman-or-docker\n(probed in that order) as the jail primitive: the host is simply absent\nfrom the container fs (RW grants become bind mounts, the cwd always\nmounted), the network stays shared per the jail contract, and the\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6s7je70t\"&gt;run.resources&lt;/code&gt; caps map onto the engine's native flags — one primitive\ncarrying both halves, and the first backend available on every platform\nwith an engine (linux, darwin — which has no native backend — win32 via\nDocker Desktop). The image (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cml0lytn\"&gt;run.jail.image&lt;/code&gt;) is an explicit operator\nchoice, never defaulted; the probe demands it locally (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kkhtss6k\"&gt;--pull=never&lt;/code&gt;),\nrefusing by naming the pull. Harness-inside-container (a codex-bearing\nimage) is the named next train; today the arm carries command workloads\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ggqysc06\"&gt;theia jail --backend container&lt;/code&gt;, jailed verify).&lt;/p&gt;\n&lt;h2 id=\"7-claude-code-as-the-control-surface-the-store-as-the-control-bus\"&gt;&lt;a href=\"en/10-integrations.html#7-claude-code-as-the-control-surface-the-store-as-the-control-bus\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. Claude Code as the control surface — the store as the control bus&lt;/span&gt;&lt;/a&gt;7. Claude Code as the control surface — the store as the control bus&lt;/h2&gt;\n&lt;p&gt;The slide-12/14 contract made mechanism: a host model session (Claude\nCode first; any MCP host) PLANS, STARTS, WATCHES, STEERS, QUESTIONS and\nANSWERS any number of theia runs — with no daemon. Three pieces:&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;The bus is the run's own log.&lt;/strong&gt; Control appended by ANY process on\nthe WAL store — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j0lfrnbz\"&gt;theia msg&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y1gb2v6u\"&gt;theia answer&lt;/code&gt;, the MCP control tools —\nrides the same hash-chained scope as the run's events (appends are\nchain-safe cross-process), and the LIVE run folds it at its dispatch\nboundaries (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qhko828d\"&gt;ControlPoll&lt;/code&gt;, consumed at the top of every coordinator\nround): a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8a8dmjst\"&gt;user.note&lt;/code&gt; folds into Σ guidance with the exact live-msg\nsemantics, a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-omwgubdc\"&gt;run.stop_request&lt;/code&gt; lands as the graceful resumable pause.\nReplay needs nothing special — the bus IS the log.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Questions route into the session&lt;/strong&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-910hg5an\"&gt;run.interaction: bus&lt;/code&gt;, or\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u6wqesxh\"&gt;--interaction bus&lt;/code&gt;; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4agwp5v4\"&gt;run_start&lt;/code&gt; spawns runs with it). A clarify\nbecomes a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g40irp7j\"&gt;run.question&lt;/code&gt; event and the run WAITS (bounded,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gdualv1r\"&gt;run.interactionWaitSeconds&lt;/code&gt;) for a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xs8blb6m\"&gt;run.answer&lt;/code&gt; appended by the host\nsession's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9qcqo8t9\"&gt;run_answer&lt;/code&gt; tool or the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zb7k83cz\"&gt;theia answer&lt;/code&gt; CLI; timeout is the\nexisting honest freeze (escalated, resumable), and a LATE answer\nfolds into guidance so it never rots on the log. The TTY forms (TUI\nquestion-by-question, readline) are untouched — the bus arm is for\nruns a session hosts.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;The control tools are a store reader + a supervisor of CLI verbs&lt;/strong&gt;\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l50i86u3\"&gt;serve-control.ts&lt;/code&gt;; registered on the user-facing &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sqtz64lm\"&gt;theia serve&lt;/code&gt; —\nnever on the belt, whose &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-etpfknwm\"&gt;--tools&lt;/code&gt; filter excludes them): reads\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yuprinoh\"&gt;run_list/run_status/run_events/run_wait&lt;/code&gt; — long-poll, cursor by\nlastEventId) come straight off the log; actions either append control\nevents (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4026vohk\"&gt;run_msg/run_answer/run_stop&lt;/code&gt;) or spawn the EXISTING audited\nverb as its own process (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kvecu9mn\"&gt;run_start&lt;/code&gt; → a detached &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ll7rw4kb\"&gt;theia run --interaction bus&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n678woo2\"&gt;plan_create&lt;/code&gt; → &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-guqd4wib\"&gt;theia plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p9guvd0s\"&gt;run_probe&lt;/code&gt; →\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nr4e1gya\"&gt;theia probe&lt;/code&gt;), so every action carries exactly the audit trail a\nterminal operator's would. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tcfos4sd\"&gt;theia hooks install claude&lt;/code&gt; registers the\nserver in the project's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ch9pxppb\"&gt;.mcp.json&lt;/code&gt; and drops the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kqfeank0\"&gt;/theia&lt;/code&gt; skill —\nthe operating flow with its HUMAN GATES (a plan is approved only\nafter the user saw it; the skill says so, the tool description says\nso, and the MCP instructions say so three times deliberately).&lt;/li&gt;\n&lt;/ol&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/10-integrations.html","hreflang":"en"}],"style":["_assets/theia.css"],"canonical":"en/10-integrations.html","vcsPath":"en/10-integrations.md"},"headings":[{"title":"1. The failure this closes","href":"en/10-integrations.html#1-the-failure-this-closes","level":2},{"title":"2. Under the harnesses — hooks and session continuity","href":"en/10-integrations.html#2-under-the-harnesses-hooks-and-session-continuity","level":2},{"title":"3. Over the harnesses — tools inside Aletheia runs","href":"en/10-integrations.html#3-over-the-harnesses-tools-inside-aletheia-runs","level":2},{"title":"4. .theia/ — the on-disk contract","href":"en/10-integrations.html#4-the-on-disk-contract","level":2},{"title":"5. Git discipline","href":"en/10-integrations.html#5-git-discipline","level":2},{"title":"6. Sandboxing — theia jail (shipped; platform-dispatched)","href":"en/10-integrations.html#6-sandboxing-shipped;-platform-dispatched","level":2},{"title":"7. Claude Code as the control surface — the store as the control bus","href":"en/10-integrations.html#7-claude-code-as-the-control-surface-the-store-as-the-control-bus","level":2}],"title":"Integrations — harness sessions, MCP, tools, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex='0' id=\"inline-code-id-t0y2pl0a\"&gt;.theia/&lt;/code&gt;, sandboxing"},"router":{"pathname":"en/10-integrations","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
