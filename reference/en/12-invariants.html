        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;blockquote&gt;\n&lt;p&gt;The enforceable law of the platform (claudexor's Bible shape, A3). Every\ninvariant has a stable id, never renumbered or reused; retirement leaves a\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-awnoqmog\"&gt;RETIRED&lt;/code&gt; marker pointing at the successor. Each carries a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mm0z7lke\"&gt;verify:&lt;/code&gt; hint —\nthe test, gate, or review question that proves it; &lt;strong&gt;an invariant nobody can\ncheck is a wish&lt;/strong&gt;. This file wins conflicts with every other doc and with\ncode; changing it is a deliberate, marked act (commit message carries\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nb4t8pux\"&gt;CONCEPT-CHANGE(THE-NNN…)&lt;/code&gt;), and a growing subset is pinned by executable\ncanary stories in the eval suites.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"foundations\"&gt;&lt;a href=\"en/12-invariants.html#foundations\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Foundations&lt;/span&gt;&lt;/a&gt;Foundations&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;THE-001&lt;/strong&gt; One event-sourced SoT per concern; every other surface —\nindexes, Σ, summaries, dashboards — is derived, generation-stamped, and\nrebuildable by replay. verify: replay-equality suite; review question \"is\nthis new state derived or a second truth?\"&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-002&lt;/strong&gt; Derived state publishes only via generation build-aside + OCC\nhead swap; failures leave garbage, never corruption; consumers accept only\nmonotonically newer generations. verify: concurrent-build test (exactly one\nwinner, no mixed reads); GC orphan test.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-003&lt;/strong&gt; Every id is a terryid: closed type-prefix registry, HLC-ordered\nbody; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p22e4ail\"&gt;e hb f ⇒ id(e) &amp;lt; id(f)&lt;/code&gt; as strings. Stores persist the 22-char body;\nthe kind travels in the type/context; bodies are order-comparable across\nkinds. verify: proofs/hlc.v compiled in CI; property test over the encoder;\ncross-kind ordering test in terryid.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-004&lt;/strong&gt; Temporal queries are snapshot-reducible with unique coalesced\nencodings; the AG/BD bug fixtures pass. verify: golden temporal suite\ninstantiating &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dtyfkhha\"&gt;snap_t(Q(R)) = Q(snap_t(R))&lt;/code&gt; per operator.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-005&lt;/strong&gt; The event log is hash-chained; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3ybe6rdi\"&gt;theia audit verify&lt;/code&gt; proves\nintegrity end-to-end. verify: chain-verification test incl. a\ndeliberately-corrupted fixture.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"the-gateway-seam\"&gt;&lt;a href=\"en/12-invariants.html#the-gateway-seam\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;The gateway seam&lt;/span&gt;&lt;/a&gt;The gateway seam&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;THE-010&lt;/strong&gt; ALL model and embedding traffic crosses the gateway; no engine\nimports a provider SDK. verify: dependency lint; grep for provider imports\noutside &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w23tpo6x\"&gt;gateway&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hmr3c5u3\"&gt;harness-*&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kq755euu\"&gt;embeddings-*&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-011&lt;/strong&gt; Adapters are translational only — no retries, budgets, winner\nselection, or policy inside a harness adapter; callers own time. verify:\nreview question; no-retry-loop lint on &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9uyi6mqn\"&gt;harness-*&lt;/code&gt;.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-012&lt;/strong&gt; Harnesses are not roles; routing (who) and strategy (how many)\nnever share a control. verify: schema separation; grep for harness-id\nconditionals in kernel logic.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-013&lt;/strong&gt; Explicit subscription auth never falls back to an API key; an\nunavailable harness fails loudly with a reason, never silently substitutes.\nverify: routing tests for the unavailable-harness story.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-014&lt;/strong&gt; Data-class masking executes at the gateway before bytes leave\nthe process; prohibited content blocks the call — with ONE named\nexception: a caller whose completeness contract demands it (today only\nthe intent indexer, via &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xtcxvlpi\"&gt;CompletionRequest.maskProhibited&lt;/code&gt;) gets the\nprohibited span REPLACED by its placeholder and the call proceeds, masked\ncounts visible on the audit event — a blocked intent call is a permanent\nindex hole while the secret never leaves the process either way.\nverify: masking golden tests; canary story with planted markers; the\ngateway test pinning that the same prompt blocks WITHOUT the flag.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-015&lt;/strong&gt; Cost is locked per call at execution from the embedded price\ntable and never recomputed from history. verify: cost-report test across a\nsimulated price change.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-016&lt;/strong&gt; Refusals, truncations, and schema failures are typed results\nscored honestly — never silently retried on another model. verify: eval\nprotocol review; result-kind metrics exist.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-017&lt;/strong&gt; Version resolution fails loud: a requested release\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pvf430w2\"&gt;--x-release&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7z0gu1fp\"&gt;THEIA_X_RELEASE&lt;/code&gt;) that is neither cached nor downloadable\nis an error naming the version, the cache path, and the fix — the running\nbinary never silently substitutes itself; the dev tree never silently\nsubstitutes a release. verify: launcher resolution tests incl. the\nuncached+no-pat golden negative; hop-guard test.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"kernel-and-state\"&gt;&lt;a href=\"en/12-invariants.html#kernel-and-state\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Kernel &amp;amp; state&lt;/span&gt;&lt;/a&gt;Kernel &amp;amp; state&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;THE-020&lt;/strong&gt; One coordinator owns all run state; pools are stateless; agents\nmutate state only via typed verdicts and validated ∆Σ patches. verify:\nkernel-sim suite; no shared-state imports in pool code.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-021&lt;/strong&gt; Phase transitions live in one verified table; every status\nwrite routes through the guard; invariant breach freezes, never\nbest-effort-continues. verify: FSM walk test; grep for raw status writes.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-022&lt;/strong&gt; Σ-merge is the proved ⊕: deterministic, idempotent, convergent\nfor key-disjoint concurrent patches. verify: proofs/state_merge.v in CI;\nproperty tests mirroring the theorems.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-023&lt;/strong&gt; Plans mutate only through Π: executed nodes are monotone,\nevidence is never recomputed, only the ready frontier dispatches. verify:\nplan-algebra unit suite.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-024&lt;/strong&gt; Every loop is bounded: round budgets, no-progress guard,\ncost/wall caps — all policy values. verify: sim stories for each guard\nfiring.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-025&lt;/strong&gt; Delegation depth and fan-out are policy-bounded; every child is\na tracked task (no zombies). verify: delegation-chain sim story hitting the\nbound.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-026&lt;/strong&gt; A verifier's executed result is ground truth: it overrides any\nagent claim, and a verdict without cited execution evidence is invalid.\nverify: schema requires evidence refs; kernel test for claim-override.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-027&lt;/strong&gt; Fresh context per task: no role inherits another task's\ntranscript; cross-task knowledge flows only through the ledger state and\nmemory. verify: prompt-assembly test (inputs enumerable).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"codebase-model-and-memory\"&gt;&lt;a href=\"en/12-invariants.html#codebase-model-and-memory\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Codebase model &amp;amp; memory&lt;/span&gt;&lt;/a&gt;Codebase model &amp;amp; memory&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;THE-030&lt;/strong&gt; Index entries are mutually independent and hash-keyed; a\nchanged file regenerates exactly its entries. verify: incremental-build\ntest counting model calls.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-031&lt;/strong&gt; Memory writes two substrates; canonical facts carry source-time\nand event-time separately; newer states never overwrite older evidence.\nverify: residence-style temporal fixture; schema NOT NULL on both times.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-032&lt;/strong&gt; Superseded versions are excluded from every recall path;\nversion chains keep history. verify: recall test over a superseded fixture.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-033&lt;/strong&gt; Structure is routing, never evidence: only leaf content enters\nanswer blocks. verify: block-assembly test asserting no summary-node text.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-034&lt;/strong&gt; Retrieval confidentiality is default-deny; caller filters can\nnarrow, never widen. verify: filter-override test.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"evaluation-and-audit\"&gt;&lt;a href=\"en/12-invariants.html#evaluation-and-audit\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Evaluation &amp;amp; audit&lt;/span&gt;&lt;/a&gt;Evaluation &amp;amp; audit&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;THE-040&lt;/strong&gt; Contractual gates are mechanical; LLM judges appear only in\nreporting tiers. verify: gate-config lint (no judge in a gate).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-041&lt;/strong&gt; Benchmarks run production engine code; only the gateway backend\nswaps. verify: import graph of the bench adapters.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-042&lt;/strong&gt; Every default-on mechanism has a ledger row with a receipt;\nmeasured negatives are deleted and recorded. verify: ledger-coverage check\nagainst the gate/config registry.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-043&lt;/strong&gt; Replay equality holds for every recorded run. verify: CI replay\nof a pinned corpus of runs.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-044&lt;/strong&gt; Checker code is itself tested with golden positives AND golden\nnegatives. verify: meta-test convention; review question.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"surfaces-and-schema\"&gt;&lt;a href=\"en/12-invariants.html#surfaces-and-schema\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Surfaces &amp;amp; schema&lt;/span&gt;&lt;/a&gt;Surfaces &amp;amp; schema&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;THE-050&lt;/strong&gt; Data shapes live in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0bk8lzsy\"&gt;packages/schema&lt;/code&gt; and change there first;\nno surface forks a contract. verify: schema-gen diff gate.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-051&lt;/strong&gt; A field, knob, or policy value ships only with a real producer\nand consumer in the same change; dead knobs are deleted. verify:\nstaged-field check; knip.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-052&lt;/strong&gt; Surfaces are thin honest views: no app-only business logic, no\nfake states; every async surface can show loading/loaded/empty/failed;\nunknown ≠ zero, absence ≠ empty. verify: review question; DTO tests.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-053&lt;/strong&gt; Prompts live in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uzp4mx1g\"&gt;.theia/prompts/&lt;/code&gt; + baked defaults — never\ninline at call sites; enum lists in prompts interpolate from code enums.\nverify: prompt-drift test; grep for template literals with role text.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-054&lt;/strong&gt; The kernel is incapable of protected-branch merges and\nproduction actions — the capability is absent, not forbidden. verify: tool\ngrant catalog; canary attempting the action fails at dispatch.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-055&lt;/strong&gt; No PII and no model-authored text in telemetry, metrics, or\nexception messages; payloads travel as digests. verify: boundary denylist\ntests; sanitizer allowlist test.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"release-and-distribution\"&gt;&lt;a href=\"en/12-invariants.html#release-and-distribution\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;Release &amp;amp; distribution&lt;/span&gt;&lt;/a&gt;Release &amp;amp; distribution&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;THE-060&lt;/strong&gt; No artifact reaches customers unverified: a release exists\nonly by promotion of a pre-release whose PUBLISHED artifacts passed the\ncustomer-shaped verification (public installer, pinned version,\nharness-fake functional smoke) on every supported target; promotion\nre-verifies the released bytes and retracts automatically on failure.\nverify: release.yml verify/verified jobs; promote.yml provenance check +\npost-verify + rollback.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-061&lt;/strong&gt; Pre-release versions carry the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-noj1h4xp\"&gt;-pre.N&lt;/code&gt; suffix end to end —\ntag, artifact names, baked version — so no unsuffixed request can ever\nresolve one: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t14kmy8u\"&gt;latest&lt;/code&gt; excludes them by API contract, and an explicit\nselection must type the exact suffix. Customer releases bake the bare\nversion. verify: release.yml guard regex; launcher artifact-name tests;\ninstaller THEIA_VERSION path.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-062&lt;/strong&gt; The end-user update path resolves releases only; prereleases\nreach a machine solely via the explicit &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qbkc975k\"&gt;update.channel: prerelease&lt;/code&gt;\nopt-in (never written by the installer) or an exact suffixed version.\nverify: channel resolution tests; installer latest path.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-063&lt;/strong&gt; The installer is the recovery lever: re-running it replaces\nan existing install wholesale (stage-then-swap), verifies the binary RUNS\nbefore the PATH symlink flips, and purges the installed version from the\nlauncher cache — a broken release or corrupt cached auto-update is\nescaped by &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uy59pmb6\"&gt;THEIA_VERSION=&amp;lt;good&amp;gt; install.sh&lt;/code&gt;, never by hand-surgery.\nverify: installer reinstall receipt; pre-flip run check in install.sh.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-064&lt;/strong&gt; Retention never orphans support: the newest two releases,\nthe newest pre-release, and every &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y0pobdeq\"&gt;release-pins.yaml&lt;/code&gt; pin (version +\ncommit + reason + customer) survive every prune; deletion is dry-run\nfirst, destructive only under --apply. verify: prunePlan tests; the\npromote prune step prints the dry-run before applying.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;THE-065&lt;/strong&gt; Vendored deliverables are the ONLY prompt source and are\nhash-verified end to end: no compiled prompt copy exists in code;\npackaged under the vendor tree's git hash with per-file sha256s; every\nrelease carries ITS OWN manifest embedded in the artifact, so\nverification and release-correspondence resolve OFFLINE — a pruned\nrelease still answers for itself; the update probe consults the RUNNING\nversion's release (manifest-only when treeHash matches), and a\nbroken/unresolvable vendor tree FAILS kernel verbs loudly while the\nrepair verbs (version/setup/self/doctor/init) stay runnable. verify:\nvendor.test.ts (coverage + doctor report + verification + precedence);\ndoctor vendor line; updateVendor pruned-release arm.&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/12-invariants.html","hreflang":"en"}],"style":["_assets/theia.css"],"canonical":"en/12-invariants.html","vcsPath":"en/12-invariants.md"},"headings":[{"title":"Foundations","href":"en/12-invariants.html#foundations","level":2},{"title":"The gateway seam","href":"en/12-invariants.html#the-gateway-seam","level":2},{"title":"Kernel &amp; state","href":"en/12-invariants.html#kernel-and-state","level":2},{"title":"Codebase model &amp; memory","href":"en/12-invariants.html#codebase-model-and-memory","level":2},{"title":"Evaluation &amp; audit","href":"en/12-invariants.html#evaluation-and-audit","level":2},{"title":"Surfaces &amp; schema","href":"en/12-invariants.html#surfaces-and-schema","level":2},{"title":"Release &amp; distribution","href":"en/12-invariants.html#release-and-distribution","level":2}],"title":"Invariants — the numbered catalog"},"router":{"pathname":"en/12-invariants","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
