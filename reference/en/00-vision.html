        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;blockquote&gt;\n&lt;p&gt;The full name is &lt;strong&gt;Aletheia&lt;/strong&gt;; the shortened form &lt;strong&gt;theia&lt;/strong&gt; names the\nCLI, the per-project &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e4njo1ws\"&gt;.theia/&lt;/code&gt; home, the user config, and the repos.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"1-the-compounding-failure\"&gt;&lt;a href=\"en/00-vision.html#1-the-compounding-failure\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The compounding failure&lt;/span&gt;&lt;/a&gt;1. The compounding failure&lt;/h2&gt;\n&lt;p&gt;Agentic coding today compounds four losses that no single tool fixes: agents\nre-explore the repository on every run and still miss the global picture\n(runtime exploration costs 4–130× the tokens of a precomputed map and produced\n39 defects across 19 industrial tasks where an indexed approach produced zero —\nAOCI), their working context grows until it poisons itself (append-only\nruntimes decay from 0.90 to 0.74 accuracy as horizons stretch, and drop to\n0.53 under realistic telemetry noise — SKILL.state), what they learned\nyesterday is gone tomorrow (no memory survives the session, so every\narchitectural rationale is re-derived at full price), and nothing they claim\nis checkable (a \"done\" without an executed artifact, a number without a\nreceipt, a log an agent can silently rewrite). Teams answer with process —\nchecklists, human gates, playbooks — which is necessary and insufficient: a\nconvention whose only guardian is a document rots (nine production codebases,\nshared-structure analysis).&lt;/p&gt;\n&lt;p&gt;&lt;strong&gt;Aletheia's thesis:&lt;/strong&gt; these are one platform problem. A stable, incrementally\nmaintained &lt;em&gt;model of the codebase&lt;/em&gt;; a bounded, replayable &lt;em&gt;execution state&lt;/em&gt;;\na temporal &lt;em&gt;memory&lt;/em&gt; that makes yesterday queryable; and an &lt;em&gt;evaluation spine&lt;/em&gt;\nthat turns every claim into an artifact — built as one local-first system\naround the harnesses engineers already run (Claude Code, Codex), not as a\nreplacement for them.&lt;/p&gt;\n&lt;h2 id=\"2-the-product-surface\"&gt;&lt;a href=\"en/00-vision.html#2-the-product-surface\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. The product surface&lt;/span&gt;&lt;/a&gt;2. The product surface&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-x4y8hctx\"&gt;theia&lt;/code&gt;&lt;/strong&gt; — one busybox-style binary/CLI. Subcommands are deployment\nunits: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rr9kwwnb\"&gt;theia index&lt;/code&gt; (codebase model), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ar2i2fl2\"&gt;theia run&lt;/code&gt; (orchestrated\nexecution), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q2t3x5kw\"&gt;theia mem&lt;/code&gt; (memory ops), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uktgqd4e\"&gt;theia eval&lt;/code&gt; (benchmarks &amp;amp; receipts),\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ny1g85xo\"&gt;theia serve&lt;/code&gt; (MCP server + metrics + the freshness reconciler),\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7bc7dvy0\"&gt;theia replay&lt;/code&gt; (deterministic re-execution), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xznjqjq4\"&gt;theia jail&lt;/code&gt; (the\nbwrap-backed sandbox primitive —\n&lt;a href=\"en/10-integrations.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tvz5ecpe\"&gt;10-integrations.md §6&lt;/code&gt;&lt;/a&gt;), plus the run-surface\nverbs (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-09ivcmcp\"&gt;plan&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xl6p5c4v\"&gt;show&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f83voqxb\"&gt;fork&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n5h4jmca\"&gt;compare&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uaremdc6\"&gt;probe&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mg4z29yp\"&gt;ask&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xkr1lg2m\"&gt;msg&lt;/code&gt;,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p6tzp1bj\"&gt;diagnose&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gkxedlay\"&gt;audit&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zpaje82w\"&gt;prune&lt;/code&gt;) and the distribution verbs\n(&lt;a href=\"en/16-release.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-p937vzc9\"&gt;16-release.md&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sjfnj8aw\"&gt;.theia/&lt;/code&gt;&lt;/strong&gt; — per-project state: user-versioned prompts and YAML config,\nhash-addressed indexes, event logs, memory stores. Greppable by design,\nFUSE-mountable later (&lt;a href=\"en/10-integrations.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-83h591th\"&gt;10-integrations.md §4&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Integrations&lt;/strong&gt; — Aletheia is the memory, map, and audit layer &lt;em&gt;under&lt;/em&gt;\nClaude Code and Codex (session hooks, MCP tools, session resume), and the\norchestrator &lt;em&gt;over&lt;/em&gt; them (the gateway drives both as harnesses).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;h2 id=\"3-who-it-serves\"&gt;&lt;a href=\"en/00-vision.html#3-who-it-serves\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Who it serves&lt;/span&gt;&lt;/a&gt;3. Who it serves&lt;/h2&gt;\n&lt;p&gt;The plus8soft guidebooks (refs, docs 2–3) define the buyer's shape precisely:\na regulated engineering organization that wants agent leverage with human\ngates, data-class discipline, tamper-evident audit, and KPI-provable pilots.\nTheir L1 is a playbook; their L2 — portal, workflow, policy engine, skills\ncatalog, central audit — is a slide. Aletheia is that L2 built as a real\nsystem, keeping their process shape (tracks, gates, roles, data classes,\nKPIs — mechanized in &lt;a href=\"en/11-governance.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qg3n125g\"&gt;11-governance.md&lt;/code&gt;&lt;/a&gt;) and adding what\na playbook cannot state: determinism, freshness, cost-per-solved-unit, and\naudit completeness as measured properties (A19).&lt;/p&gt;\n&lt;h2 id=\"4-what-outperform-in-every-possible-metric-means,-concretely\"&gt;&lt;a href=\"en/00-vision.html#4-what-outperform-in-every-possible-metric-means,-concretely\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. What \"outperform in every possible metric\" means, concretely&lt;/span&gt;&lt;/a&gt;4. What \"outperform in every possible metric\" means, concretely&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Metric class&lt;/th&gt;\n&lt;th&gt;Their instrument&lt;/th&gt;\n&lt;th&gt;Aletheia's instrument&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;Lead time / rework / defects&lt;/td&gt;\n&lt;td&gt;weekly report, hand-filled&lt;/td&gt;\n&lt;td&gt;eval subsystem: ability-axis scoring on standing benchmarks, receipts per mechanism (&lt;a href=\"en/08-evaluation.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ony2kir2\"&gt;08-evaluation.md&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Audit&lt;/td&gt;\n&lt;td&gt;agent_run_id in Jira + WORM policy&lt;/td&gt;\n&lt;td&gt;HLC-ordered, hash-chained event log; OTel traces; replay equality (&lt;a href=\"en/09-observability.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5f4lgrql\"&gt;09-observability.md&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Safety&lt;/td&gt;\n&lt;td&gt;MCP least-privilege matrix in prose&lt;/td&gt;\n&lt;td&gt;policy values consumed by the kernel; data-class gate at the one seam all calls cross (&lt;a href=\"en/04-model-gateway.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-onr4vv4r\"&gt;04-model-gateway.md&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Quality gates&lt;/td&gt;\n&lt;td&gt;CI contract + Stop &amp;amp; Fix convention&lt;/td&gt;\n&lt;td&gt;phase FSM with verified transitions; verifier verdicts from executed artifacts (A2, A12)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Cost&lt;/td&gt;\n&lt;td&gt;cost cap \"по политике\"&lt;/td&gt;\n&lt;td&gt;per-run locked USD from a price table, budgets as policy, cost-vs-accuracy on the eval frontier (A9)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;Knowledge&lt;/td&gt;\n&lt;td&gt;Confluence spec pages&lt;/td&gt;\n&lt;td&gt;codebase intent index + temporal memory, both incrementally fresh and snapshot-queryable&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"5-non-goals-v1\"&gt;&lt;a href=\"en/00-vision.html#5-non-goals-v1\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Non-goals (v1)&lt;/span&gt;&lt;/a&gt;5. Non-goals (v1)&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Not a model host.&lt;/strong&gt; Aletheia drives subscription harnesses and APIs; it\ndoes not serve weights.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Not a cloud SaaS.&lt;/strong&gt; Local-first, single-operator; the storage interfaces\nare sized for a later Postgres-backed multi-user deployment in which local\nstores become cooperative in-progress state (A15), but v1 ships local.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Not an IDE.&lt;/strong&gt; Surfaces are CLI, daemon APIs, MCP, and the harnesses'\nown UIs.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Container execution is a seam, not a v1 feature.&lt;/strong&gt; The bwrap jail\nships (host read-only, granted-RW, probed by doctor); docker-wrapped\nexternal tools ride its spawn-wrapper seam later, and the jail\nresiduals (full subreaper sweep, per-harness RW registry) stay named\ndeferred work (&lt;a href=\"en/13-roadmap.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uhka03lg\"&gt;13-roadmap.md&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"6-naming\"&gt;&lt;a href=\"en/00-vision.html#6-naming\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Naming&lt;/span&gt;&lt;/a&gt;6. Naming&lt;/h2&gt;\n&lt;p&gt;One name per mechanism, fixed here and used verbatim everywhere: the\n&lt;strong&gt;event log&lt;/strong&gt; (per-concern SoT), &lt;strong&gt;generations&lt;/strong&gt; (immutable derived-state\nbuilds), the &lt;strong&gt;head&lt;/strong&gt; (served generation pointer), &lt;strong&gt;Σ&lt;/strong&gt; (a run's typed\nexecution state), the &lt;strong&gt;plan DAG&lt;/strong&gt;, the &lt;strong&gt;ready frontier&lt;/strong&gt;, &lt;strong&gt;verdicts&lt;/strong&gt;\n(typed role outcomes), the &lt;strong&gt;gateway&lt;/strong&gt; (model seam), &lt;strong&gt;harness&lt;/strong&gt; (external\nagent CLI/SDK), &lt;strong&gt;terryid&lt;/strong&gt; (typed HLC id), the &lt;strong&gt;intent index&lt;/strong&gt; and &lt;strong&gt;AST\nfacts&lt;/strong&gt; (codebase model tiers), &lt;strong&gt;canonical facts&lt;/strong&gt; and &lt;strong&gt;scoped trees&lt;/strong&gt;\n(memory), the &lt;strong&gt;ledger&lt;/strong&gt; (methods-tried record), &lt;strong&gt;receipts&lt;/strong&gt; (benchmark\nevidence), &lt;strong&gt;policy values&lt;/strong&gt; (typed governance knobs).&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/00-vision.html","hreflang":"en"}],"style":["_assets/theia.css"],"canonical":"en/00-vision.html","vcsPath":"en/00-vision.md"},"headings":[{"title":"1. The compounding failure","href":"en/00-vision.html#1-the-compounding-failure","level":2},{"title":"2. The product surface","href":"en/00-vision.html#2-the-product-surface","level":2},{"title":"3. Who it serves","href":"en/00-vision.html#3-who-it-serves","level":2},{"title":"4. What \"outperform in every possible metric\" means, concretely","href":"en/00-vision.html#4-what-outperform-in-every-possible-metric-means,-concretely","level":2},{"title":"5. Non-goals (v1)","href":"en/00-vision.html#5-non-goals-v1","level":2},{"title":"6. Naming","href":"en/00-vision.html#6-naming","level":2}],"title":"Vision — what Aletheia is, and the failures it exists to close"},"router":{"pathname":"en/00-vision","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
