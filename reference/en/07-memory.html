        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;blockquote&gt;\n&lt;p&gt;This doc is the &lt;strong&gt;shipped, code-verified&lt;/strong&gt; memory subsystem. Its\ndesigned evolution — the world-view layer, adaptive retrieval, context\ngovernance, documents, and rules/skills — is the reviewed design set:\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dnmbp3q2\"&gt;18-memory-structure.md&lt;/code&gt;,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-63vykk0c\"&gt;19-documents.md&lt;/code&gt;,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o3eda02y\"&gt;20-rules-skills.md&lt;/code&gt;\n(analysis: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-s9xkzy3z\"&gt;notes/09&lt;/code&gt;).&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"1-the-failure-this-closes\"&gt;&lt;a href=\"en/07-memory.html#1-the-failure-this-closes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The failure this closes&lt;/span&gt;&lt;/a&gt;1. The failure this closes&lt;/h2&gt;\n&lt;p&gt;Agent memory systems compound four losses: extraction-only memory discards\nthe verbatim wording temporal and quote questions need (summarization-based\nmemory: 14% exact-match vs 91% verbatim on constraint recall — a 77-point\nfidelity gap), serialized LLM-in-the-loop write paths delay when evidence\nbecomes queryable (MemForest measured 6–9.5× build-rate gaps against systems\nwith extraction on the write path), latest-state summaries overwrite the\nintermediate states that \"where did Bob live &lt;em&gt;before&lt;/em&gt; Miami\" needs, and flat\nvector pools retrieve the wrong time because similarity is blind to position.\nAletheia's memory subsystem is the synthesis of MemForest's write path, the\nFidant engine's receipt-carrying retrieval doctrine, and the storage plane's\ntemporal semantics — with the deltas each source lacks alone.&lt;/p&gt;\n&lt;h2 id=\"2-the-write-path-memforest,-adopted\"&gt;&lt;a href=\"en/07-memory.html#2-the-write-path-memforest,-adopted\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. The write path (MemForest, adopted)&lt;/span&gt;&lt;/a&gt;2. The write path (MemForest, adopted)&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Parallel extraction.&lt;/strong&gt; Sessions split into small chunks extracted\nconcurrently — no serialized autoregressive pass; the critical path scales\nwith incoming content, not accumulated state.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Canonical facts are the stable write unit&lt;/strong&gt;: retrieval-ready text,\nprovenance refs, entity mentions, topical signals, confidence — and TWO\ntimestamps, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ddqdvy2\"&gt;source_hlc&lt;/code&gt; (when recorded) and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pdvevs8c\"&gt;event_time&lt;/code&gt; (what the fact\nasserts), never conflated (&lt;a href=\"en/03-storage.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gs05shx3\"&gt;03-storage.md §5&lt;/code&gt;&lt;/a&gt;).\nCanonicalization merges only semantic equivalents (normalized exact match\n→ embedding candidates → bounded LLM check); a &lt;em&gt;changed value&lt;/em&gt; is a new\ntemporally-anchored fact, never an overwrite — old states remain leaves.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Two substrates, always.&lt;/strong&gt; Typed canonical facts AND verbatim chunks\n(with PII span redaction at write — the chunk keeps the dialogue, loses\nonly the secret). The Fidant receipt is decisive: chunks alone carried\n0.659 composite where extraction was unavailable; extraction alone scored\n0.275 vs the full stack's 0.789.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Scoped trees.&lt;/strong&gt; Facts route (no extra LLM calls) into two tree\nfamilies — session trees (source order) and entity trees (subject state\nevolution); leaves are time-ordered, group nodes summarize intervals,\nroots serve coarse recall and positional browse. Insertion marks dirty\nancestor paths; summaries refresh lazily on &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g99suhhe\"&gt;mem maintain&lt;/code&gt; and the\npost-run sweep — a new leaf recomputes exactly its touched path (the\ncall-counted receipt: 1 leaf ⇒ 2 summaries). The multi-entity\norganizing layer formerly sketched as a scene/topic family is now the\nworld-view group layer of\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pjkuwwhu\"&gt;18-memory-structure.md §2&lt;/code&gt;, queued behind\na corpus that needs it.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Trees are derived state.&lt;/strong&gt; Persistent state (facts, assignments,\nstructure, refs) is SoT; summaries, embeddings, and index rows are\ngeneration-published behind heads (A1) — closing MemForest's own gap: our\nreaders get MVCC-style consistent cuts and never block behind ingest.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"3-retrieval-architecture-lanes-over-generations\"&gt;&lt;a href=\"en/07-memory.html#3-retrieval-architecture-lanes-over-generations\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. Retrieval architecture — lanes over generations&lt;/span&gt;&lt;/a&gt;3. Retrieval architecture — lanes over generations&lt;/h2&gt;\n&lt;p&gt;Retrieval is a &lt;strong&gt;union of lanes over generation-published indexes&lt;/strong&gt;: the\nlexical lane (tantivy BM25 over terms from ONE analyzer —\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6kmsh3iq\"&gt;@theia/text-analysis&lt;/code&gt;, per-token script + per-document language Snowball\nstemming shared by index build, query and the scan lanes; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wuit7san\"&gt;memory.analyzer&lt;/code&gt;\nselects it, its version rides the generation's builder version and a reader\nwith another analyzer reads plain with a notice — the bench receipt:\nlexical R@10 74.4 → 77.7, notes/10 §4), the vector lane (FAISS HNSW cosine,\npresent when the generation carries embeddings — the local ONNX embedder by\ndefault, &lt;a href=\"en/04-model-gateway.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k4312jpi\"&gt;04 §4&lt;/code&gt;&lt;/a&gt;), the opt-in sentence lane\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bjzl3q0a\"&gt;memory.sentenceGraph&lt;/code&gt;: sentences under the chunks, kNN edges, parent\nchunks admitted by aggregated sentence similarity — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iv1ogaye\"&gt;18 §2.3&lt;/code&gt;;\nmeasured net-negative on conversational chunks, off pending the\ndocument-element revival — ledger §4), the event-time lane\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-djeosrij\"&gt;memory.timeLane&lt;/code&gt;, default on: explicit absolute dates in the ask,\nregex-only, union rows whose ASSERTED &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qg0kgj21\"&gt;[event_from, event_to)&lt;/code&gt; falls in\nthe range — §6, receipt 1 W / 0 L / 214 T), and the recency lane (a rank\nsignal, never a filter), fused by rank (RRF, K=60) and ordered\nconsensus-first — a candidate found by more lanes outranks any single-lane\nscore. Read-side near-dup collapse unions lane signals into the newest row\n(duplication is evidence, not noise). Indexes cover ALL rows — superseded\nincluded — with a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4896b1zv\"&gt;[valid_from, valid_to)&lt;/code&gt; interval sidecar per ref, which\nis what makes as-of reads first-class lanes (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y4qp5dt2\"&gt;bm25@gen&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ggmad989\"&gt;vector@gen&lt;/code&gt;:\nover-fetch, sidecar-filter by the cut, DB re-check at load); rows written\nafter a generation reach reads through the scan lanes until the next\nreindex — a stated boundary, not a surprise. A degraded store degrades\nhonestly: no vector generation ⇒ lexical-only; no generation at all ⇒\nentry scan.&lt;/p&gt;\n&lt;p&gt;The &lt;strong&gt;fact-edge graph&lt;/strong&gt; — hop pre-computation at ingest (per-fact\npseudo-queries ANN-linked, density-capped, tombstoned generations; the\nsource receipt: multi-hop 0.617 → 0.842 on the origin engine) — is adopted\ndesign queued behind a multi-hop workload that earns it\n(&lt;a href=\"en/13-roadmap.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pqtv0e90\"&gt;13-roadmap.md&lt;/code&gt;&lt;/a&gt;); nothing in the shipped laws depends\non it.&lt;/p&gt;\n&lt;h2 id=\"4-three-memory-tiers-for-the-platform-itself-krca/amer\"&gt;&lt;a href=\"en/07-memory.html#4-three-memory-tiers-for-the-platform-itself-krca/amer\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Three memory tiers for the platform itself (KRCA/AMER)&lt;/span&gt;&lt;/a&gt;4. Three memory tiers for the platform itself (KRCA/AMER)&lt;/h2&gt;\n&lt;p&gt;Beyond user/project memory, the platform writes its own scopes:\n&lt;strong&gt;working&lt;/strong&gt; state lives in Σ and dies with the run; the &lt;strong&gt;diagnostics&lt;/strong&gt;\nscope memorizes every root-cause analysis under a canonical failure\nfingerprint, so a repeated failure shape is recognized (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rbokvkz7\"&gt;reused&lt;/code&gt;) instead\nof re-derived — the AMER skip path, shipped for both the CLI verb and the\nMCP &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pk9uqnxb\"&gt;run_diagnose&lt;/code&gt; (host models and the kernel recognize each other's\nfingerprints); session hooks distill harness sessions into checkpoint\nchunks and recalled context. The full factual/experiential split with\nresume-at-divergence reuse (A14) deepens as diagnosis volume accrues; the\nfingerprint store is its foundation.&lt;/p&gt;\n&lt;h2 id=\"5-retrieval-doctrine-the-laws-with-receipts\"&gt;&lt;a href=\"en/07-memory.html#5-retrieval-doctrine-the-laws-with-receipts\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Retrieval doctrine — the laws with receipts&lt;/span&gt;&lt;/a&gt;5. Retrieval doctrine — the laws with receipts&lt;/h2&gt;\n&lt;p&gt;Ported from the origin engine's ledger as laws. Laws 1–6 govern the\nshipped lanes today; laws 7–9 bind the lanes that adopt them (force-loads,\nsufficiency, block concentration arrive with the retrieval stages that\nneed them — each must re-earn its receipt on our benchmarks first):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Union, never replacement&lt;/strong&gt; — lanes union and rerank; a candidate\nfound by more lanes outranks a one-lane hit (consensus-first; the\nadditive blend measured worse at the source and stays off).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Widen the first stage, not the LLM pool&lt;/strong&gt; — recall breadth before the\nreranker (their depth finding); rerank fires only above the prune budget.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;RRF fuses incomparable scales&lt;/strong&gt; (rank-based, K=60); lexical and vector\nscores never mix arithmetically.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Duplication is a ranking signal&lt;/strong&gt; — near-dup collapse unions lane\nsignals into the newest row instead of dropping (loss-free at the store).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Recency ranks, never filters&lt;/strong&gt; — an old-but-relevant fact must surface.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Structure is routing, never evidence&lt;/strong&gt; — tree descent lands on leaves;\nsummaries guide, only members answer (SGMem's h=1 law: one hop of untyped\nsimilarity is signal, two is drift).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Force-loads for cue-disconnected evidence&lt;/strong&gt; — constraints on\ndecision-support asks, identifier-bearing rows, document-majority loads;\nforced rows are exempt from ranking budgets.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Sufficiency-gate the block&lt;/strong&gt; — one cheap probe; if thin, ONE bounded\nretry with round-1 rows pinned; abstention (\"records do not cover this\")\nbeats assembling near-misses.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Concentrate the block&lt;/strong&gt; — admission-ordered budgets per origin class;\ndilution is the measured hallucination axis, and concentration reversed it\nwhere three scaffolds failed.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"6-temporal-queries\"&gt;&lt;a href=\"en/07-memory.html#6-temporal-queries\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;6. Temporal queries&lt;/span&gt;&lt;/a&gt;6. Temporal queries&lt;/h2&gt;\n&lt;p&gt;Every retrieval accepts an &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sk34xj7d\"&gt;asOf&lt;/code&gt; cut (HLC + head): the lanes read the\nsnapshot the cut defines, so \"what did we believe when the plan was\napproved\" and \"what changed since the incident\" are first-class queries with\nsnapshot-reducibility guarantees (&lt;a href=\"en/03-storage.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bjlfx83h\"&gt;03-storage.md §5&lt;/code&gt;&lt;/a&gt;).\nTree browse answers &lt;em&gt;positional&lt;/em&gt; temporal asks (the interval before a\ntransition) that flat similarity structurally cannot (MemForest's residence\nexample is the canonical fixture).&lt;/p&gt;\n&lt;h2 id=\"7-lifecycle\"&gt;&lt;a href=\"en/07-memory.html#7-lifecycle\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;7. Lifecycle&lt;/span&gt;&lt;/a&gt;7. Lifecycle&lt;/h2&gt;\n&lt;p&gt;Lifecycle ops edit persistent state first and regenerate only\nintersecting derived artifacts — never a stream replay (MemForest).\nShipped: supersession with version chains (superseded versions are\nexcluded from every recall path while history stays queryable at its cut\n— agentmemory's law), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-azxwbs37\"&gt;mem maintain&lt;/code&gt; (tree-summary refresh + orphan\ngeneration GC, including index artifacts), and the post-run maintenance\nsweep. Targeted deletion by provenance ref (GDPR-shaped), merge, and decay\nfollow the same persistent-state-first law when they land\n(&lt;a href=\"en/13-roadmap.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9fhs4eg9\"&gt;13-roadmap.md&lt;/code&gt;&lt;/a&gt;). Maintenance runs on the serve reconciler loop and the post-run sweep;\nevery gate and threshold in this subsystem is a policy value with a\nledger row (&lt;a href=\"en/08-evaluation.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7tk47hzd\"&gt;08-evaluation.md §4&lt;/code&gt;&lt;/a&gt;).&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/07-memory.html","hreflang":"en"}],"style":["_assets/theia.css"],"canonical":"en/07-memory.html","vcsPath":"en/07-memory.md"},"headings":[{"title":"1. The failure this closes","href":"en/07-memory.html#1-the-failure-this-closes","level":2},{"title":"2. The write path (MemForest, adopted)","href":"en/07-memory.html#2-the-write-path-memforest,-adopted","level":2},{"title":"3. Retrieval architecture — lanes over generations","href":"en/07-memory.html#3-retrieval-architecture-lanes-over-generations","level":2},{"title":"4. Three memory tiers for the platform itself (KRCA/AMER)","href":"en/07-memory.html#4-three-memory-tiers-for-the-platform-itself-krca/amer","level":2},{"title":"5. Retrieval doctrine — the laws with receipts","href":"en/07-memory.html#5-retrieval-doctrine-the-laws-with-receipts","level":2},{"title":"6. Temporal queries","href":"en/07-memory.html#6-temporal-queries","level":2},{"title":"7. Lifecycle","href":"en/07-memory.html#7-lifecycle","level":2}],"title":"Memory — canonical facts, scoped trees, temporal retrieval"},"router":{"pathname":"en/07-memory","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
