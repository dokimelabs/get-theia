        <script type="application/json" id="diplodoc-state">
            {"data":{"leading":false,"html":"&lt;h2 id=\"1-the-failure-this-closes\"&gt;&lt;a href=\"en/02-identity.html#1-the-failure-this-closes\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. The failure this closes&lt;/span&gt;&lt;/a&gt;1. The failure this closes&lt;/h2&gt;\n&lt;p&gt;Distributed and multi-process systems that stamp records with wall time alone\ncannot order causally related events (NTP skew reorders them, POSIX time even\nruns backwards across leap-second smearing), systems that use Lamport clocks\nlose the wall-time meaning applications need, and systems that use random\nUUIDs get neither — plus indexes that fragment on insert. Aletheia adds a\nfourth requirement none of those satisfy: an ID must &lt;em&gt;say what it names&lt;/em&gt;\n(a run vs a fact vs an event) so a wrong-kind reference is unconstructible\n(P10). &lt;strong&gt;terryid&lt;/strong&gt; answers all four at once.&lt;/p&gt;\n&lt;h2 id=\"2-the-format\"&gt;&lt;a href=\"en/02-identity.html#2-the-format\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. The format&lt;/span&gt;&lt;/a&gt;2. The format&lt;/h2&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs\"&gt;  &amp;lt;ppp&amp;gt;            &amp;lt;22 chars base32, lowercase&amp;gt;\n  type prefix  +   body = base32( l ‖ c ‖ node ‖ random )\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"9\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-9\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-9\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-9.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;strong&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t6f5qg3a\"&gt;ppp&lt;/code&gt;&lt;/strong&gt; — a 3-character type prefix from a &lt;strong&gt;closed registry&lt;/strong&gt; in\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zga6k91j\"&gt;packages/schema&lt;/code&gt; (e.g. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rgors4bg\"&gt;run&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hl2kfhhw\"&gt;evt&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5rwfeuvh\"&gt;fct&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ubvtc94a\"&gt;chk&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l74p65e5\"&gt;gen&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jxv7hign\"&gt;pln&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rlldqlje\"&gt;vrd&lt;/code&gt;,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jd8bigfa\"&gt;art&lt;/code&gt;). The registry is the interpreter: constructing or parsing an ID\nchecks the prefix against the union, so a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-714kpb4m\"&gt;fct&lt;/code&gt;-typed field cannot hold a\nrun id (zp0 terryid's prefix discipline + typed wrapper, sharpened by the\nclosed union).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;body&lt;/strong&gt; — 110 bits, base32 (RFC 4648 lowercase, no padding):\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3sybiiat\"&gt;l&lt;/code&gt; : 48 bits — the HLC logical-physical component, milliseconds;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iw54pxxj\"&gt;c&lt;/code&gt; : 16 bits — the HLC causality counter;&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jj6l2wxu\"&gt;node&lt;/code&gt;: 10 bits — process/replica id (single-user local: derived from\npid+boot; multi-writer later: assigned);&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q8jt0nhp\"&gt;random&lt;/code&gt;: 36 bits — collision guard within one (l, c, node).&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/li&gt;\n&lt;/ul&gt;\n&lt;p&gt;The (l, c) pair is a &lt;strong&gt;Hybrid Logical Clock&lt;/strong&gt; (hlc-snap): on every local/send\nevent &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o2aytna8\"&gt;l := max(l, pt)&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v4t1h3o1\"&gt;c&lt;/code&gt; increments only when &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sp3bugq8\"&gt;l&lt;/code&gt; did not advance; on\nreceive &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bsm0bgup\"&gt;l := max(l, l_msg, pt)&lt;/code&gt; with the three-way &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jh6acd83\"&gt;c&lt;/code&gt; rule. Two theorems\ncarry the design (both machine-checked in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2ayqmnty\"&gt;../proofs/&lt;/code&gt;):&lt;/p&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Causality:&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-aa8nr8i9\"&gt;e hb f ⇒ (l.e, c.e) &amp;lt;lex (l.f, c.f)&lt;/code&gt; — and because the\nencoding is big-endian fixed-width, plain &lt;em&gt;string comparison of the body&lt;/em&gt;\npreserves that order (the pwc property: one &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-15w1p18b\"&gt;&amp;lt;&lt;/code&gt; gives one-way causality).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Boundedness:&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-a26j7sfx\"&gt;l ≥ pt&lt;/code&gt; always, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-06acuoxs\"&gt;|l − pt|&lt;/code&gt; bounded by the clock skew\nwindow, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o2e4eywz\"&gt;c&lt;/code&gt; bounded — so 48+16 bits cannot overflow in practice and\nthe timestamp stays human-meaningful.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h2 id=\"3-the-contract\"&gt;&lt;a href=\"en/02-identity.html#3-the-contract\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. The contract&lt;/span&gt;&lt;/a&gt;3. The contract&lt;/h2&gt;\n&lt;ol&gt;\n&lt;li&gt;&lt;strong&gt;Sortable = causal + temporal.&lt;/strong&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ao5fpt6\"&gt;ORDER BY id&lt;/code&gt; on any event table is a\ncausally consistent, roughly wall-clock order. Concurrent events order\narbitrarily but &lt;em&gt;deterministically&lt;/em&gt; (node ‖ random tiebreak) — replay\nstability (A22).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Snapshots for free.&lt;/strong&gt; \"State as of t\" = fold events with\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2dqqumr6\"&gt;hlc(id) ≤ (t, ∞)&lt;/code&gt;; no coordination, no uncertainty wait (hlc-snap's\na-posteriori snapshot read). This is the join point with generation heads:\na generation's cut is an HLC value, and &lt;a href=\"en/03-storage.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0rhshtvz\"&gt;03-storage.md §5&lt;/code&gt;&lt;/a&gt;\nbuilds snapshot-reduced temporal queries on it.&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;Typed at rest and in flight.&lt;/strong&gt; IDs serialize as plain strings (YAML/JSON\n/SQL-friendly); the typed wrapper validates on parse and marshals\nlosslessly (zp0 typedterryid: TextMarshaler/Valuer pair, consistency\nround-trip tested). A simple untyped generator ships beside it for tooling\n(v1/v2 layering).&lt;/li&gt;\n&lt;li&gt;&lt;strong&gt;No semantic leakage.&lt;/strong&gt; The ID carries kind + order + origin, never\ncontent — content addressing is a separate mechanism (hashes,\n&lt;a href=\"en/03-storage.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4v5s4ur5\"&gt;03-storage.md §3&lt;/code&gt;&lt;/a&gt;); conflating them would make renames\nre-identify records.&lt;/li&gt;\n&lt;/ol&gt;\n&lt;h3 id=\"35-storage-form-bare-bodies,-kind-in-the-type\"&gt;&lt;a href=\"en/02-identity.html#35-storage-form-bare-bodies,-kind-in-the-type\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3.5 Storage form — bare bodies, kind in the type&lt;/span&gt;&lt;/a&gt;3.5 Storage form — bare bodies, kind in the type&lt;/h3&gt;\n&lt;p&gt;DB columns persist the &lt;strong&gt;22-char body only&lt;/strong&gt;, never the kind prefix: the\nkind is carried by the column/table semantics (\"mem_facts.id is a fct\"), so\nstoring it per row would be redundant — and worse, it breaks ordering, since\nfull ids compare by prefix letter first while bodies compare by HLC. The\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f5mv12l5\"&gt;TerryId&lt;/code&gt; helper keeps &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wa4p95ku\"&gt;kind&lt;/code&gt; and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zhqmeax7\"&gt;body&lt;/code&gt; as &lt;strong&gt;separate fields&lt;/strong&gt; — sorting\nand cuts key on &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-64tofafl\"&gt;body&lt;/code&gt; alone (valid across kinds: event cuts vs generation\nids vs fact intervals reduce to one string compare) — and recombines them\nonly in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-29mdgq5x\"&gt;toString()&lt;/code&gt; for display and wire output. Surfaces accept either\nform on input (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yzu2w1hk\"&gt;coerce&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3lctvemu\"&gt;bodyOf&lt;/code&gt;) and always print the full form.&lt;/p&gt;\n&lt;h2 id=\"4-clock-discipline\"&gt;&lt;a href=\"en/02-identity.html#4-clock-discipline\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Clock discipline&lt;/span&gt;&lt;/a&gt;4. Clock discipline&lt;/h2&gt;\n&lt;p&gt;The domain layer never reads &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v0yy5mm3\"&gt;Date.now()&lt;/code&gt;; a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1asmymel\"&gt;Clock&lt;/code&gt; capability is injected\n(architecture layer rule), and the HLC state is process-singleton behind it.\nReplay mode substitutes the recorded clock events, making time itself an\nevent-log input (A22). Regression tests pin: monotonicity across a simulated\nNTP step backwards, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-66wy8inm\"&gt;c&lt;/code&gt; reset on &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q1c5gdgh\"&gt;pt&lt;/code&gt; catch-up, and cross-process merge via\nthe receive rule.&lt;/p&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/02-identity.html","hreflang":"en"}],"style":["_assets/theia.css"],"canonical":"en/02-identity.html","vcsPath":"en/02-identity.md"},"headings":[{"title":"1. The failure this closes","href":"en/02-identity.html#1-the-failure-this-closes","level":2},{"title":"2. The format","href":"en/02-identity.html#2-the-format","level":2},{"title":"3. The contract","href":"en/02-identity.html#3-the-contract","level":2,"items":[{"title":"3.5 Storage form — bare bodies, kind in the type","href":"en/02-identity.html#35-storage-form-bare-bodies,-kind-in-the-type","level":3}]},{"title":"4. Clock discipline","href":"en/02-identity.html#4-clock-discipline","level":2}],"title":"Identity — terryid: typed, causally ordered IDs"},"router":{"pathname":"en/02-identity","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
        </script>
