            {"data":{"leading":false,"html":"&lt;blockquote&gt;\n&lt;p&gt;The one card an operator needs to configure Aletheia: every manifest kind\nwith a worked example, the full policy-value catalog with defaults and\nconsumers, the prompt-override mechanism, and the per-user config. Design\nrationale lives in &lt;a href=\"en/10-integrations.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y04ue568\"&gt;10-integrations.md §4&lt;/code&gt;&lt;/a&gt;\n(layout, rules composition, overlays) and\n&lt;a href=\"en/11-governance.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-es0768m7\"&gt;11-governance.md §5&lt;/code&gt;&lt;/a&gt; (why every knob names a\nconsumer); this doc is the reference. A knob listed here without a\nconsumer would fail CI (THE-051) — the catalog cannot drift from the code\nbecause the code is where it is parsed.&lt;/p&gt;\n&lt;/blockquote&gt;\n&lt;h2 id=\"1-where-configuration-lives,-and-which-scope-wins\"&gt;&lt;a href=\"en/15-configuration.html#1-where-configuration-lives,-and-which-scope-wins\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;1. Where configuration lives, and which scope wins&lt;/span&gt;&lt;/a&gt;1. Where configuration lives, and which scope wins&lt;/h2&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Scope&lt;/th&gt;\n&lt;th&gt;Location&lt;/th&gt;\n&lt;th&gt;Versioned by&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;user&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;the platform user config dir (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9iblcpo2\"&gt;@theia/user-dirs&lt;/code&gt;, env-paths semantics): linux &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zv3o094o\"&gt;~/.config/theia/&lt;/code&gt;, Windows &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4upkwi5x\"&gt;%APPDATA%\\dokimelabs\\theia\\&lt;/code&gt;, macOS &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ygikxgeh\"&gt;~/Library/Application Support/theia/&lt;/code&gt; — XDG_* overrides win everywhere, and an existing legacy &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g6nv0ua3\"&gt;~/.config/theia&lt;/code&gt; keeps winning on win32/darwin. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9ie3myzj\"&gt;config.yaml&lt;/code&gt; — the GitHub PAT for release download/tracking, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u4ncfwrh\"&gt;openai.apiKey&lt;/code&gt; for the openai embedding posture only (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nnzq129a\"&gt;OPENAI_API_KEY&lt;/code&gt; env wins; the default local embedder needs no key — its models live in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-obqfg7kb\"&gt;~/.cache/theia/models&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f9ohkbnb\"&gt;THEIA_MODELS_DIR&lt;/code&gt; overrides), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tvz5svef\"&gt;dev.root&lt;/code&gt; for &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ovi2l5or\"&gt;--dev&lt;/code&gt;, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0eupshrp\"&gt;update.channel&lt;/code&gt; (release | prerelease — the developer opt-in, never installer-written; &lt;a href=\"en/16-release.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jkdf1nz7\"&gt;16-release.md §5&lt;/code&gt;&lt;/a&gt;). &lt;strong&gt;Plus &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-430t81cs\"&gt;~/.config/theia/config/*.yaml&lt;/code&gt; manifests&lt;/strong&gt; (the shared-store train): Policy / Pricing / TransportRegistry apply to EVERY workspace as the outermost scope — Workspace and Context kinds refuse loudly there (a user-scope Workspace would re-root every project; Context sources have no root to resolve against)&lt;/td&gt;\n&lt;td&gt;the user's dotfiles&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;workspace&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5pk27uda\"&gt;.theia/config/*.yaml&lt;/code&gt; manifests + &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0e3p22j8\"&gt;.theia/prompts/&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;the project repo&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;root overlay&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r52u09rw\"&gt;&amp;lt;root&amp;gt;/.theia/{config,prompts}&lt;/code&gt; inside a declared multi-root member&lt;/td&gt;\n&lt;td&gt;that root's own repo&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;baked&lt;/strong&gt;&lt;/td&gt;\n&lt;td&gt;code defaults (the config of record — a bare &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-xwdip3mm\"&gt;theia init&lt;/code&gt; runs the measured stack)&lt;/td&gt;\n&lt;td&gt;theia-dev&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;p&gt;&lt;strong&gt;Store placement&lt;/strong&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-czb1ykx4\"&gt;theia init&lt;/code&gt;) is a first-class choice, never an\naccident of cwd: inside a git working tree (linked worktrees included)\nthe store defaults to the &lt;strong&gt;worktree root&lt;/strong&gt; — one store per checkout,\nhowever deep the invoking shell, so sibling terminals share one index\ninstead of minting nested stores that re-index the same content; outside\nany repo the default is a &lt;strong&gt;user-home store&lt;/strong&gt;\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lkfjz1pd\"&gt;~/.local/share/theia/stores/&amp;lt;slug&amp;gt;-&amp;lt;hash&amp;gt;&lt;/code&gt;, registered to the folder in\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6fa999t9\"&gt;~/.config/theia/workspaces.yaml&lt;/code&gt;) — the folder stays clean; and\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o2x0tlxy\"&gt;theia init --here&lt;/code&gt; is the detached escape hatch that pins the store to\nthe invoking folder verbatim. Init prints the placement and the\nalternative every time.&lt;/p&gt;\n&lt;p&gt;Discovery walks UP from cwd checking, per directory, a local &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9t8cvr6x\"&gt;.theia/&lt;/code&gt;\n&lt;strong&gt;with a store&lt;/strong&gt; first (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-67knk0xk\"&gt;store.db&lt;/code&gt; is the home marker — an overlay-only\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q1d0qbqx\"&gt;.theia/&lt;/code&gt; can never be mistaken for a workspace home), then a\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3iou3fwm\"&gt;workspaces.yaml&lt;/code&gt; registry mapping for that directory (a row whose store\nlost its &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mdbilwh2\"&gt;store.db&lt;/code&gt; is skipped with a notice). Precedence is &lt;strong&gt;closest\nscope first&lt;/strong&gt;, per scope kind: &lt;strong&gt;prompts&lt;/strong&gt; append outermost-first so the\nclosest scope has the last word; &lt;strong&gt;policy&lt;/strong&gt; merges key-wise across ALL\nfour scopes — defaults &amp;lt; user-home manifests &amp;lt; workspace &amp;lt; root overlay\n(root overlays accept only the keys with per-root consumers —\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0un9hvhn\"&gt;gateway.harnessConfig&lt;/code&gt; knob-wise per role, and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sq4rvyh5\"&gt;run.preTask&lt;/code&gt;, which a\nroot REPLACES whole-array; anything else fails loudly naming the\nworkspace home); &lt;strong&gt;context entries&lt;/strong&gt; union, root entries shadowing name\ncollisions, sources resolving against the root's path.\nRecorded prompt digests always say what each role actually saw, per root.&lt;/p&gt;\n&lt;h2 id=\"2-manifest-kinds\"&gt;&lt;a href=\"en/15-configuration.html#2-manifest-kinds\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;2. Manifest kinds&lt;/span&gt;&lt;/a&gt;2. Manifest kinds&lt;/h2&gt;\n&lt;p&gt;All manifests are k8s-shaped YAML (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-j431niw1\"&gt;apiVersion: theia.dev/v1alpha1&lt;/code&gt;, closed\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1wknagpj\"&gt;kind&lt;/code&gt; set, strict fields — an unknown kind or field refuses loudly, never\nhalf-applies).&lt;/p&gt;\n&lt;h3 id=\"kind-policy-the-governance-knobs\"&gt;&lt;a href=\"en/15-configuration.html#kind-policy-the-governance-knobs\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;kind: Policy — the governance knobs&lt;/span&gt;&lt;/a&gt;kind: Policy — the governance knobs&lt;/h3&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;theia.dev/v1alpha1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Policy&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;default&lt;/span&gt; }\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;run:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;maxUsdPerRun:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;5&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;sandboxTier:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;standard&lt;/span&gt;          &lt;span class=\"hljs-comment\"&gt;# standard | jailed-full | trusted-full&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;preTask:&lt;/span&gt;\n      &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;run:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\"pnpm lint\"&lt;/span&gt;, &lt;span class=\"hljs-attr\"&gt;mustPass:&lt;/span&gt; &lt;span class=\"hljs-literal\"&gt;true&lt;/span&gt; }\n  &lt;span class=\"hljs-attr\"&gt;gateway:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;routing:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;reviewer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;claude&lt;/span&gt; }  &lt;span class=\"hljs-comment\"&gt;# role → transport&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;models:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;reviewer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;claude-opus-5&lt;/span&gt; }\n  &lt;span class=\"hljs-attr\"&gt;ui:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;defaultView:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;tui&lt;/span&gt; }\n  &lt;span class=\"hljs-attr\"&gt;maintenance:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;indexPolicy:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;alert&lt;/span&gt; }\n  &lt;span class=\"hljs-attr\"&gt;memory:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;analyzer:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;snowball&lt;/span&gt;, &lt;span class=\"hljs-attr\"&gt;sentenceGraph:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;off&lt;/span&gt; }   &lt;span class=\"hljs-comment\"&gt;# plain = tantivy's default tokenizer; h0|h1 = the sentence lane&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"84\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-84\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-84\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-84.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;h3 id=\"kind-workspace-multi-root-declaration\"&gt;&lt;a href=\"en/15-configuration.html#kind-workspace-multi-root-declaration\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;kind: Workspace — multi-root declaration&lt;/span&gt;&lt;/a&gt;kind: Workspace — multi-root declaration&lt;/h3&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;theia.dev/v1alpha1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Workspace&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;shop&lt;/span&gt; }\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;roots:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;api&lt;/span&gt;, &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;../shop-api&lt;/span&gt; }\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;web&lt;/span&gt;, &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;../shop-web&lt;/span&gt; }\n  &lt;span class=\"hljs-attr\"&gt;primary:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;api&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"88\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-88\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-88\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-88.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;One &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-umggyimy\"&gt;.theia/&lt;/code&gt; store serves every root (root-qualified index entries, union\nrecall); a cross-repo task is ONE run. Absent manifest = one implicit root,\nbyte-identical behavior.&lt;/p&gt;\n&lt;h3 id=\"kind-context-rules-and-reference-material-as-injected-content\"&gt;&lt;a href=\"en/15-configuration.html#kind-context-rules-and-reference-material-as-injected-content\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;kind: Context — rules and reference material as injected content&lt;/span&gt;&lt;/a&gt;kind: Context — rules and reference material as injected content&lt;/h3&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;theia.dev/v1alpha1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Context&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;team-rules&lt;/span&gt; }\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;entries:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;house-style&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;source:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;path:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;docs/CONVENTIONS.md&lt;/span&gt; }     &lt;span class=\"hljs-comment\"&gt;# or inline: / glob:&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;inject:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;roles:&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;implementer&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;reviewer&lt;/span&gt;] } &lt;span class=\"hljs-comment\"&gt;# or 'always' / tracks / pathTriggers&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;cursor-rules&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;source:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;glob:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;\".cursor/rules/*\"&lt;/span&gt; }\n      &lt;span class=\"hljs-attr\"&gt;inject:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;always&lt;/span&gt;\n      &lt;span class=\"hljs-attr\"&gt;budgetChars:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;4000&lt;/span&gt;            &lt;span class=\"hljs-comment\"&gt;# optional; absent ⇒ FULL content loads&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"95\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-95\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-95\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-95.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Entries arrive in prompts as digest-headed content blocks; what a run\ninjected is &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ljhb03ep\"&gt;{entry, digest}&lt;/code&gt; on its audit trail. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uy2fsc28\"&gt;pathTriggers&lt;/code&gt; globs match\nthe task's diff where committed work exists, description paths otherwise.\nAn explicit &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-akdqfbem\"&gt;budgetChars&lt;/code&gt; is the ONLY trim; totals above\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-phtzuldk\"&gt;run.contextAlertChars&lt;/code&gt; alert loudly while everything still loads\n(visibility over paternalism — see the catalog). Rules-file composition\nmodes (native passthrough vs audited injection vs &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k6ggrs5f\"&gt;rulesSoT&lt;/code&gt;) are the\n&lt;a href=\"en/10-integrations.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0ve1j3p9\"&gt;10-integrations.md §4&lt;/code&gt;&lt;/a&gt; contract; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-614d2am8\"&gt;theia init&lt;/code&gt;\nseeds this manifest from the rules files it detects\n(&lt;a href=\"en/15-configuration.html#5-seeding-and-hooks\"&gt;§5&lt;/a&gt;).&lt;/p&gt;\n&lt;h3 id=\"kind-pricing-rates-without-code\"&gt;&lt;a href=\"en/15-configuration.html#kind-pricing-rates-without-code\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;kind: Pricing — rates without code&lt;/span&gt;&lt;/a&gt;kind: Pricing — rates without code&lt;/h3&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;theia.dev/v1alpha1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;Pricing&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;rates&lt;/span&gt; }\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;models:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;codex-terra:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;inPerMTok:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;2&lt;/span&gt;, &lt;span class=\"hljs-attr\"&gt;outPerMTok:&lt;/span&gt; &lt;span class=\"hljs-number\"&gt;12&lt;/span&gt; }\n  &lt;span class=\"hljs-attr\"&gt;transports:&lt;/span&gt;\n    &lt;span class=\"hljs-attr\"&gt;codex:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;costBasis:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;actual&lt;/span&gt; }   &lt;span class=\"hljs-comment\"&gt;# 'actual' overrides adapter figures —&lt;/span&gt;\n                                   &lt;span class=\"hljs-comment\"&gt;# a subscription seat may declare 0&lt;/span&gt;\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"102\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-102\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-102\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-102.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;Every gateway call records its &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qd7xm4wi\"&gt;priceSource&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-exhauhnm\"&gt;adapter | manifest | embedded&lt;/code&gt;); locked costs never recompute (THE-015).&lt;/p&gt;\n&lt;h3 id=\"kind-transportregistry-the-vendor-registry-the-gateway-enforces\"&gt;&lt;a href=\"en/15-configuration.html#kind-transportregistry-the-vendor-registry-the-gateway-enforces\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;kind: TransportRegistry — the vendor registry the gateway enforces&lt;/span&gt;&lt;/a&gt;kind: TransportRegistry — the vendor registry the gateway enforces&lt;/h3&gt;\n\n    &lt;div class=\"yfm-code-floating-container\"&gt;\n        &lt;pre&gt;&lt;code class=\"hljs yaml\"&gt;&lt;span class=\"hljs-attr\"&gt;apiVersion:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;theia.dev/v1alpha1&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;kind:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;TransportRegistry&lt;/span&gt;\n&lt;span class=\"hljs-attr\"&gt;metadata:&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;vendors&lt;/span&gt; }\n&lt;span class=\"hljs-attr\"&gt;spec:&lt;/span&gt;\n  &lt;span class=\"hljs-attr\"&gt;transports:&lt;/span&gt;\n    &lt;span class=\"hljs-bullet\"&gt;-&lt;/span&gt; { &lt;span class=\"hljs-attr\"&gt;name:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;codex-full&lt;/span&gt;, &lt;span class=\"hljs-attr\"&gt;provider:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;openai&lt;/span&gt;, &lt;span class=\"hljs-attr\"&gt;dataClasses:&lt;/span&gt; [&lt;span class=\"hljs-string\"&gt;restricted&lt;/span&gt;, &lt;span class=\"hljs-string\"&gt;permitted&lt;/span&gt;],\n        &lt;span class=\"hljs-attr\"&gt;owner:&lt;/span&gt; &lt;span class=\"hljs-string\"&gt;platform-team&lt;/span&gt; }\n&lt;/code&gt;&lt;/pre&gt;\n\n        &lt;div class=\"yfm-code-floating\"&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button yfm-code-button yfm-wrapping-button\" tabindex=\"-1\" type=\"button\" data-tabindex=\"0\"&gt;\n            &lt;span class=\"g-button__icon\"&gt;\n            &lt;span class=\"g-button__icon-inner\"&gt;&lt;svg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" class=\"g-icon\" fill=\"currentColor\" stroke=\"none\" aria-hidden=\"true\"&gt;\n                &lt;svg class=\"yfm-code-icon yfm-wrapping-icon\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 16 16\"&gt;\n                    &lt;path fill=\"currentColor\" fill-rule=\"evenodd\" d=\"M2.47 11.28a.75.75 0 0 1 0-1.06l3-3a.75.75 0 0 1 1.06 1.06L4.81 10H9a3.25 3.25 0 0 0 0-6.5H8A.75.75 0 0 1 8 2h1a4.75 4.75 0 1 1 0 9.5H4.81l1.72 1.72a.75.75 0 1 1-1.06 1.06z\" clip-rule=\"evenodd\"&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n            &lt;/svg&gt;&lt;/span&gt;\n            &lt;/span&gt;\n        &lt;/button&gt;\n            &lt;button role=\"button\" class=\"g-button g-button_view_flat g-button_size_m g-button_pin_round-round g-md-viewer-code-button  yfm-code-button yfm-clipboard-button\"&gt;\n                &lt;span class=\"g-button__icon g-clipboard-button__icon\"&gt;\n                &lt;span class=\"g-button__icon-inner\"&gt;\n                &lt;svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" class=\"yfm-code-icon yfm-clipboard-icon\" data-animation=\"109\"&gt;\n                    &lt;path fill=\"currentColor\" d=\"M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z\"&gt;&lt;/path&gt;\n                    &lt;path stroke=\"currentColor\" fill=\"transparent\" stroke-width=\"1.5\" d=\"M9.5 13l3 3l5 -5\" visibility=\"hidden\"&gt;\n                        &lt;animate id=\"visibileAnimation-109\" attributeName=\"visibility\" from=\"hidden\" to=\"visible\" dur=\"0.2s\" fill=\"freeze\" begin&gt;&lt;/animate&gt;\n                        &lt;animate id=\"hideAnimation-109\" attributeName=\"visibility\" from=\"visible\" to=\"hidden\" dur=\"1s\" begin=\"visibileAnimation-109.end+1\" fill=\"freeze\"&gt;&lt;/animate&gt;\n                    &lt;/path&gt;\n                &lt;/svg&gt;\n                &lt;/span&gt;\n                &lt;/span&gt;\n            &lt;/button&gt;\n        &lt;/div&gt;\n    &lt;/div&gt;\n&lt;p&gt;An unregistered transport cannot be routed to; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7ki1wgia\"&gt;trusted-full&lt;/code&gt; sandbox\nrouting additionally demands the registry row — the loud, double-keyed\nopt-in.&lt;/p&gt;\n&lt;h2 id=\"3-the-policy-value-catalog\"&gt;&lt;a href=\"en/15-configuration.html#3-the-policy-value-catalog\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;3. The policy-value catalog&lt;/span&gt;&lt;/a&gt;3. The policy-value catalog&lt;/h2&gt;\n&lt;p&gt;Defaults are the config of record; every row names its consumer.&lt;/p&gt;\n&lt;table&gt;\n&lt;thead&gt;\n&lt;tr&gt;\n&lt;th&gt;Value&lt;/th&gt;\n&lt;th&gt;Default&lt;/th&gt;\n&lt;th&gt;Consumer / meaning&lt;/th&gt;\n&lt;/tr&gt;\n&lt;/thead&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ty1j43qq\"&gt;run.maxRoundsPerTask&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;10&lt;/td&gt;\n&lt;td&gt;kernel round budget per task&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-oe3ee86o\"&gt;run.stopAndFixAfterFailures&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;consecutive verifier failures → freeze to &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-72fcd03o\"&gt;escalated&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-am5i63tv\"&gt;run.maxUsdPerRun&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;10&lt;/td&gt;\n&lt;td&gt;gateway budget metering AND the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lbq0zlm2\"&gt;--budget&lt;/code&gt; default (explicit flag wins; 0 = unmetered); exhaustion pauses resumable (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gt9svlac\"&gt;--resume --budget N&lt;/code&gt;); the ONE verdict repair may overdraft a bounded grace (notes/31)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wvaa8zph\"&gt;run.maxDelegationDepth&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-z4z5bzlf\"&gt;maxDelegationFanout&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;1 / 4&lt;/td&gt;\n&lt;td&gt;delegation bounds (THE-025)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ioti11z\"&gt;run.freshPerspectiveAfter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;implement dispatches before the fresh-perspective flip&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4k6eks21\"&gt;run.maxRescopes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;2&lt;/td&gt;\n&lt;td&gt;lead rescopes that reset the round budget; past it, forced discard&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e4soelxr\"&gt;run.stallPauseAfter&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;3&lt;/td&gt;\n&lt;td&gt;consecutive &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hjb0fwk3\"&gt;no_progress&lt;/code&gt; outcomes on one task (gateway failures, off-contract replies, coerced illegal verdicts) pause the run resumable with one &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lg7p9mtq\"&gt;dispatch_stalled&lt;/code&gt; anomaly — the escalated↔no_progress cycle has no round-budget exit (the 47-lead-call live receipt); 0 disables&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iv9fdfdt\"&gt;run.poolSizes&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;{} (merger/lead pinned 1)&lt;/td&gt;\n&lt;td&gt;role pool sizes&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3uogpse8\"&gt;run.workspaceMode&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;copy&lt;/td&gt;\n&lt;td&gt;task workspace mechanism (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dasu8abf\"&gt;copy&lt;/code&gt; carries untracked deps; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4uww5nor\"&gt;clone&lt;/code&gt; the escape hatch)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-e97msoai\"&gt;run.sandboxTier&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;standard&lt;/td&gt;\n&lt;td&gt;harness sandbox posture; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8juqalry\"&gt;jailed-full&lt;/code&gt; needs the probed jail, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qxeds1rk\"&gt;trusted-full&lt;/code&gt; needs the registry row&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qz4tkxad\"&gt;run.resources&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;{} (uncapped)&lt;/td&gt;\n&lt;td&gt;the spawn-cap seam (&lt;a href=\"en/10-integrations.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rpsg93qm\"&gt;10 §6&lt;/code&gt;&lt;/a&gt;): &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-c9yuo82b\"&gt;{memoryMax, cpuQuota, tasksMax}&lt;/code&gt; — every kernel harness spawn, host verify, and pre-task gate runs in a &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8bce3bmy\"&gt;systemd-run --user --scope&lt;/code&gt; (slice &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4wico5ee\"&gt;theia-run.slice&lt;/code&gt;) carrying the caps, so one hot tree cannot starve the machine. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-1o871tlw\"&gt;MemorySwapMax=0&lt;/code&gt; rides every memory cap by law (without it the hog spills into swap and the box thrashes — the live 512M-under-128M receipt). Configured-but-unprobeable refuses the run loudly; the container jail backend enforces the same values natively (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yolqw7kx\"&gt;--memory&lt;/code&gt;+&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3jsikqav\"&gt;--memory-swap&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-neae1za7\"&gt;--cpus&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tfdyf8aq\"&gt;--pids-limit&lt;/code&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ge1e2uj4\"&gt;run.jail.backend&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ju8ucox\"&gt;.image&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;auto / unset&lt;/td&gt;\n&lt;td&gt;which sandbox primitive the jailed tier and &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wtqwxmtp\"&gt;theia jail&lt;/code&gt; use: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7qpedojs\"&gt;auto&lt;/code&gt; = the platform native (bwrap / AppContainer; darwin has none — refuses), &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6meo9xgv\"&gt;container&lt;/code&gt; = podman-or-docker (probed in that order) — isolation + native resource caps in one primitive, the backend that completes the platform matrix. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zwezcbdl\"&gt;image&lt;/code&gt; is required with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zsqat6kd\"&gt;container&lt;/code&gt; and is an explicit operator choice (a workload without its toolchain in the image fails honestly at the first command); the probe runs &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5qitwuwn\"&gt;--pull=never&lt;/code&gt;, refusing a non-local image by naming the pull command&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yxqzq353\"&gt;run.changesetPartialFailure&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;revert&lt;/td&gt;\n&lt;td&gt;multi-root changeset breakage: &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6ucjvbdz\"&gt;revert&lt;/code&gt; unwinds landed merges, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ib4uqg2m\"&gt;freeze&lt;/code&gt; escalates naming the half-landed set&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-snwgus69\"&gt;run.planVerifyPreflight&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;disable&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tebchlj1\"&gt;always&lt;/code&gt; pre-flights each distinct authored verify (root, command) once at base on plan create (&lt;a href=\"en/06-orchestration.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-yo3erd3y\"&gt;06-orchestration.md §7&lt;/code&gt;&lt;/a&gt;); opt-in for now — the pre-flight executes plan-authored commands before any approval exists, the same standing-consent bar as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gg9pswmq\"&gt;indexPolicy&lt;/code&gt;. Disabled with verifies present prints one hint line; the demo posture opts in&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fyaa1ey9\"&gt;run.preTask[]&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;[]&lt;/td&gt;\n&lt;td&gt;commands before a task's first implement dispatch; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4b5f7j8l\"&gt;mustPass&lt;/code&gt; failure freezes without a model call&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lnojvihy\"&gt;run.blueprintMinImportance&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;unset&lt;/td&gt;\n&lt;td&gt;cmd-run's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f9hrsia6\"&gt;blueprintSlice&lt;/code&gt; + plan/probe context collection: the injected blueprint's importance floor. Unset = the COMPLETE map (docs/05 §5 — the default posture); set, entries below the floor leave the injected map with a LOUD count line (never a silent trim), and the belt &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-u5e4z3q4\"&gt;codebase_search&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pckwctt6\"&gt;codebase_symbol&lt;/code&gt; tools still reach every entry. The operator's dose control where a complete multi-root map exceeds the model window (a 13-root production workspace rendered 3.8M chars ≈ 950K tokens); superseded by the task-scoped projection when it lands (&lt;a href=\"en/13-roadmap.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-raonjkdg\"&gt;13-roadmap.md&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kt1ovrxi\"&gt;run.contextAlertChars&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;200 000&lt;/td&gt;\n&lt;td&gt;injected-context chars per job above which ONE loud alert fires (everything still loads; plan mode applies the same threshold to its collected context — run/plan parity)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g80m3ng5\"&gt;run.contextRefuseChars&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;unset&lt;/td&gt;\n&lt;td&gt;optional hard line — freeze before dispatch, zero model calls, resumable&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9smzl9kx\"&gt;run.mcpBelt.enabled&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-tshu2qkz\"&gt;.tools&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;true / read-mostly set&lt;/td&gt;\n&lt;td&gt;theia's own MCP tools inside kernel-driven harness calls; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-75j7z1f5\"&gt;memory_add&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w8ceb7u8\"&gt;run_*&lt;/code&gt; opt-in&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pe96gxe2\"&gt;run.rulesSoT.enabled&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f2jp3okv\"&gt;.maskFiles&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;false / AGENTS.md, CLAUDE.md, .cursorrules, .cursor/rules, .ai&lt;/td&gt;\n&lt;td&gt;make Context manifests the ONLY rules path: native project-doc read disabled per-invocation + in-repo rules files masked at workspace copy&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-88u0dnn2\"&gt;gateway.routing&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;{}&lt;/td&gt;\n&lt;td&gt;role → transport&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8s0hufvd\"&gt;gateway.models&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;{}&lt;/td&gt;\n&lt;td&gt;role → model id (resolved in the router; part of the replay key)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ge87ua6w\"&gt;gateway.maxRetries&lt;/code&gt; / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-w9epln3q\"&gt;retryBaseMs&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;3 / 500&lt;/td&gt;\n&lt;td&gt;caller-owned retry over &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-nx6uh0wx\"&gt;retryable&lt;/code&gt; results&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8hx326cc\"&gt;gateway.harnessConfig&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;{}&lt;/td&gt;\n&lt;td&gt;role → probed per-invocation harness knobs (replay-key-bearing; unprobed keys are never trusted — acceptance is not evidence)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-sd1irepp\"&gt;gateway.maskOverrides&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;{}&lt;/td&gt;\n&lt;td&gt;the class gate (docs/04 §5): per-detector re-classification — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5cdkro1w\"&gt;card_number: off | restricted | prohibited&lt;/code&gt; (closed detector names). Exists because high-recall detectors are wrong on some corpora by construction: a finance schema's 13–19-digit account IDs pass Luhn ~10% of the time and blocked &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vsu0g2mx\"&gt;theia plan&lt;/code&gt; on seeded &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6m21cvpr\"&gt;dbo.*&lt;/code&gt; data (the 34938 report). A versioned governance act in the manifest — the diff shows it, counts stay on every audit event&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zfz7ddjq\"&gt;gateway.embeddings.provider&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;local&lt;/td&gt;\n&lt;td&gt;the CLI's embedder resolver (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-pgkbujfy\"&gt;embeddings.ts&lt;/code&gt;): which &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o6bfqu0u\"&gt;EmbeddingTransport&lt;/code&gt; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ibtflh3o\"&gt;mem reindex/search&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g5cffulg\"&gt;index reindex/search&lt;/code&gt;, the serve belt, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2y7gmhl7\"&gt;ask&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9zw73din\"&gt;probe&lt;/code&gt; and the memory bench construct — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eyuoi0tb\"&gt;local&lt;/code&gt; (ONNX on this machine, zero USD) or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-hsc62ch6\"&gt;openai&lt;/code&gt; (needs the key). Generation identity: vectors built by one triple are never queried by another (&lt;a href=\"en/04-model-gateway.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7xf4n3i0\"&gt;04 §4&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jqok6kne\"&gt;gateway.embeddings.model&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;unset&lt;/td&gt;\n&lt;td&gt;the same resolver: a local registry id (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-jxe49zsn\"&gt;all-MiniLM-L6-v2&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zq27h015\"&gt;bge-small-en-v1.5&lt;/code&gt;) or an OpenAI model name; unset = the provider's default&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-y7li5ten\"&gt;memory.analyzer&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;snowball&lt;/td&gt;\n&lt;td&gt;the CLI's lexical resolver (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vliy522c\"&gt;lexical.ts&lt;/code&gt;): the analyzer &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zqeik35c\"&gt;mem reindex&lt;/code&gt; builds the BM25 lane with and every memory reader queries through — &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-75qvsg96\"&gt;snowball&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dmofdfoi\"&gt;@theia/text-analysis&lt;/code&gt;: per-token script + per-document language Snowball stemming, one function for index, query and scan lanes) or &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-imm1f4w5\"&gt;plain&lt;/code&gt; (tantivy's default tokenizer). Generation identity like the embedder: an analyzed generation is read only through its analyzer version, else plain with a notice (&lt;a href=\"en/07-memory.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4fko90ju\"&gt;07 §3&lt;/code&gt;&lt;/a&gt;)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zc0bendf\"&gt;memory.sentenceGraph&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;off&lt;/td&gt;\n&lt;td&gt;the CLI's lexical resolver (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3724rw59\"&gt;lexical.ts&lt;/code&gt;): whether &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mjfbce6e\"&gt;mem reindex&lt;/code&gt; builds the sentence tier into the generation (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-v7cuq5m1\"&gt;h0&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-i8zkxor6\"&gt;h1&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qlla43og\"&gt;18 §2.3&lt;/code&gt;) and how many hops the sentence lane expands at read (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lesktijg\"&gt;h0&lt;/code&gt; none, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t6dx5v7h\"&gt;h1&lt;/code&gt; one — h=2 drifts). Generation identity like the analyzer: the tier rides the builder version (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d71xlw0c\"&gt;+sent@1&lt;/code&gt;); a reader asking for the lane on a generation without it gets no lane and a notice naming &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5uog3nzy\"&gt;mem reindex&lt;/code&gt;. Off until the h=0 vs h=1 receipt (ledger §2)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-o3ajir1t\"&gt;memory.timeLane&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;the event-time lane (&lt;a href=\"en/07-memory.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-iv0fj9al\"&gt;07 §3/§6&lt;/code&gt;&lt;/a&gt;): when an ask names EXPLICIT absolute dates (regex only — an inferred range prunes on hallucinated windows), rows whose asserted &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-q26lhgbh\"&gt;[event_from, event_to)&lt;/code&gt; falls in the range join the retrieval union. On by its receipt (1 W / 0 L / 214 T paired, leak 0 — harmless where it cannot fire, decisive where it can)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3d5ibomm\"&gt;gateway.embeddings.autoDownload&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;the local provider: a missing model fetches itself on first use (one notice line); &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wjzy00u4\"&gt;false&lt;/code&gt; = offline posture — a missing model is a loud error naming &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3hc8ztsv\"&gt;theia setup --fetch-embeddings&lt;/code&gt;&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uh8swkit\"&gt;run.interaction&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;terminal&lt;/td&gt;\n&lt;td&gt;cmd-run's interaction wiring (docs/10 §7): &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-kyg025dw\"&gt;terminal&lt;/code&gt; = TTY forms (TUI/readline; non-interactive freezes visibly — unchanged); &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ymrgz4r7\"&gt;bus&lt;/code&gt; = clarifies become &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-eejfyvlv\"&gt;run.question&lt;/code&gt; events and the run waits for a cross-process &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-b42ed2lu\"&gt;run.answer&lt;/code&gt; (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-vhzrds9k\"&gt;run_answer&lt;/code&gt; MCP tool / &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-464pylz2\"&gt;theia answer&lt;/code&gt;) — the arm &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-d4ls577d\"&gt;run_start&lt;/code&gt; spawns runs with. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fca1pufa\"&gt;--interaction&lt;/code&gt; overrides&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dy89dz7w\"&gt;run.interactionWaitSeconds&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;600&lt;/td&gt;\n&lt;td&gt;the bus arm's bounded wait before the honest escalated freeze; a late answer still folds into guidance&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-itcqm799\"&gt;run.sessionContinuity&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;off&lt;/td&gt;\n&lt;td&gt;cmd-run's runner wiring (&lt;a href=\"en/04-model-gateway.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-au6zai6v\"&gt;04 §7&lt;/code&gt;&lt;/a&gt;, notes/15): &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-fxun5qra\"&gt;off&lt;/code&gt; = cold dispatches; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zhb1mium\"&gt;sigma-shared&lt;/code&gt; = cold dispatches whose ONLY cross-round shared state is the Σ-projected stable prompt prefix (stable-first ordering is unconditional; the mode arms the per-dispatch &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-l2pvuz86\"&gt;session_prefix&lt;/code&gt; digest audit). The accumulating &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wrxafh3c\"&gt;resume&lt;/code&gt; mode was removed (ledger §4). &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-db79hmnd\"&gt;--sessions&lt;/code&gt;/&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-06yuq80e\"&gt;--no-sessions&lt;/code&gt; override per invocation. Off until its live receipt (ledger law)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rmey83pj\"&gt;ui.defaultView&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;tui&lt;/td&gt;\n&lt;td&gt;run/show view when no flag is given&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3528tkdn\"&gt;maintenance.indexPolicy&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;alert&lt;/td&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k4k5drfg\"&gt;auto&lt;/code&gt; builds stale entries within budget at run/plan start, post-merge, and on the serve loop; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-uqoh49ez\"&gt;alert&lt;/code&gt; prints freshness lines only; &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-dwesiafu\"&gt;manual&lt;/code&gt; silences even maintenance — the freshness LINES render under every policy&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mvdqs4vd\"&gt;maintenance.indexBuildBudgetUsd&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;1&lt;/td&gt;\n&lt;td&gt;cap per auto-build wave; the stale remainder stays alerted&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-h3pvyjaa\"&gt;maintenance.serveRefreshSeconds&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;300&lt;/td&gt;\n&lt;td&gt;serve reconciler cadence (the check is a zero-model hash-diff)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-3rjvw4gf\"&gt;maintenance.storeAlertGb&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;5&lt;/td&gt;\n&lt;td&gt;store-size signal: when &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5pva6m9w\"&gt;.theia&lt;/code&gt; (store + runs + objects + index) exceeds this, the run tail and doctor print a loud &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-mrik0vgv\"&gt;theia prune&lt;/code&gt; hint (kept run workspaces are full repo copies — the gauge is what makes the growth visible)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-0zr5koa7\"&gt;maintenance.indexCache&lt;/code&gt;&lt;/td&gt;\n&lt;td&gt;true&lt;/td&gt;\n&lt;td&gt;the CLI's indexer construction (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-lvvubk3b\"&gt;index-cache.ts&lt;/code&gt;): intent entries shared ACROSS workspaces via a user-level content-addressed cache (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-862u6ywx\"&gt;~/.cache/theia/index-cache&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-k5o5yybo\"&gt;THEIA_INDEX_CACHE_DIR&lt;/code&gt; overrides) — a fresh &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-7s0mesfx\"&gt;.theia&lt;/code&gt; on already-indexed content builds at zero model cost (the 5-hour-quota receipt). Key pins builder+prompt version + path + content hash, so upgrades and edits self-invalidate; reads re-validate through the entry schema; every arm fails open. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ovv447y4\"&gt;false&lt;/code&gt; = hermetic posture for measured eval arms. Sharing is WORKSPACE-SHAPE-scoped by construction: multi-root entries are root-qualified (paths and R-refs carry &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4n49etun\"&gt;rootName/&lt;/code&gt;), so they reuse only in same-shaped workspaces — a single-root checkout of the same repo builds its own cache line (correct: its entries genuinely differ)&lt;/td&gt;\n&lt;/tr&gt;\n&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;h2 id=\"4-prompts\"&gt;&lt;a href=\"en/15-configuration.html#4-prompts\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;4. Prompts&lt;/span&gt;&lt;/a&gt;4. Prompts&lt;/h2&gt;\n&lt;p&gt;Role prompts are baked defaults plus user overrides: drop &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ww2vp3jw\"&gt;LEAD.md&lt;/code&gt;,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t4d00wz6\"&gt;REVIEWER.md&lt;/code&gt;, … in &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-zroflt48\"&gt;.theia/prompts/&lt;/code&gt; (or one &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-rycezv7i\"&gt;PROMPTS.md&lt;/code&gt; with &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gqmwjw9m\"&gt;### ROLE&lt;/code&gt;\nsections) and the content APPENDS to the baked prompt; per-root overlays\nappend after workspace overrides (closest scope last — the last word).\nVerdict vocabularies are enum-interpolated into the baked prompts, so a\nprompt cannot drift from the parser (drift-tested). Every assembled prompt\nis digest-recorded per job — \"what did the model actually see\" is always\nanswerable, per role, per root.&lt;/p&gt;\n&lt;h2 id=\"5-seeding-and-hooks\"&gt;&lt;a href=\"en/15-configuration.html#5-seeding-and-hooks\" class=\"yfm-anchor yfm-clipboard-anchor\" aria-hidden=\"true\"&gt;&lt;span class=\"visually-hidden\" data-no-index=\"true\"&gt;5. Seeding and hooks&lt;/span&gt;&lt;/a&gt;5. Seeding and hooks&lt;/h2&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-39vug17w\"&gt;theia init [--harness codex|claude] [--embeddings local|openai]&lt;/code&gt; creates &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-qglbeii3\"&gt;.theia/&lt;/code&gt; with the default\nmanifests — routing seeded for the chosen harness family (unset: probed,\ncodex when both answer; both families are always vendor-registered so\nswitching later is one routing edit) — appends\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-ec8zdlvj\"&gt;.gitignore&lt;/code&gt;, and &lt;strong&gt;detects existing AI-rules files&lt;/strong&gt; (AGENTS.md,\nCLAUDE.md, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-6rh4vmfb\"&gt;.cursor/rules&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n70q5spv\"&gt;.cursorrules&lt;/code&gt;, &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-frfzmm2j\"&gt;.ai/&lt;/code&gt;,\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-cju6kq3r\"&gt;.github/copilot-instructions.md&lt;/code&gt;; per root in multi-root workspaces):\nnon-native files are seeded into a generated &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-r0qlgn4b\"&gt;kind: Context&lt;/code&gt; manifest\n(&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-46xb45i6\"&gt;context-rules.yaml&lt;/code&gt;) so they reach every harness and role — rule dirs\nas zero-match-tolerant globs, single files as &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-2mxo4qd1\"&gt;path:&lt;/code&gt; entries; native\nfiles (AGENTS.md for codex, CLAUDE.md for Claude Code) are left to the\nharness's own read with the &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-n8elxipr\"&gt;rulesSoT&lt;/code&gt; alternative named — printed,\nnever silent. Re-running init is merge-safe: seeded names are remembered\nin a sidecar, user edits survive verbatim, and an entry the user deleted\nstays deleted. &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-9k01mknb\"&gt;theia doctor&lt;/code&gt; and both hook installers print the same\ncomposition summary (native · injected · undetected).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-756mhyi8\"&gt;theia hooks install claude&lt;/code&gt; — memory + freshness hooks into\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8mkzuj05\"&gt;.claude/settings.json&lt;/code&gt; (SessionStart context, prompt recall, PreCompact/\nStop checkpoints, statusline when absent); merge-idempotent, user entries\npreserved.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-gtqnx790\"&gt;theia hooks install codex&lt;/code&gt; — project &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5bo4982w\"&gt;.codex/hooks.json&lt;/code&gt; +\n&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-wik0kr7v\"&gt;[mcp_servers.theia]&lt;/code&gt; in project &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-g6jm27gh\"&gt;.codex/config.toml&lt;/code&gt;; the two codex\ntrust gates print loudly on every install (&lt;a href=\"en/10-integrations.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-f9rrlzd3\"&gt;10-integrations.md §2&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-emt558zc\"&gt;theia hooks install git&lt;/code&gt; — the post-commit dirty-marks hint (zero model\ncalls) feeding freshness.&lt;/li&gt;\n&lt;li&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-4dvut16q\"&gt;theia setup --pat … --openai-key … --dev-root … --channel …&lt;/code&gt; — writes the user config (&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-t6af6juu\"&gt;--interactive&lt;/code&gt; runs the guided global setup); &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-8q3hb62j\"&gt;theia setup --fetch-embeddings [model]&lt;/code&gt; installs a local embedding model into the user cache ahead of first use (the doctor's &lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-bx7e3zyo\"&gt;embeddings&lt;/code&gt; line reports ready / not fetched / corrupt)\n(&lt;a href=\"en/16-release.html\"&gt;&lt;code class=\"yfm-clipboard-inline-code\" role=\"button\" tabindex=\"0\" id=\"inline-code-id-5tcogvoe\"&gt;16-release.md&lt;/code&gt;&lt;/a&gt;).&lt;/li&gt;\n&lt;/ul&gt;\n","meta":{"metadata":[{"name":"generator","content":"Diplodoc Platform v5.57.4"}],"alternate":[{"href":"en/15-configuration.html","hreflang":"en"}],"style":["_assets/theia.css"],"canonical":"en/15-configuration.html","vcsPath":"en/15-configuration.md"},"headings":[{"title":"1. Where configuration lives, and which scope wins","href":"en/15-configuration.html#1-where-configuration-lives,-and-which-scope-wins","level":2},{"title":"2. Manifest kinds","href":"en/15-configuration.html#2-manifest-kinds","level":2,"items":[{"title":"kind: Policy — the governance knobs","href":"en/15-configuration.html#kind-policy-the-governance-knobs","level":3},{"title":"kind: Workspace — multi-root declaration","href":"en/15-configuration.html#kind-workspace-multi-root-declaration","level":3},{"title":"kind: Context — rules and reference material as injected content","href":"en/15-configuration.html#kind-context-rules-and-reference-material-as-injected-content","level":3},{"title":"kind: Pricing — rates without code","href":"en/15-configuration.html#kind-pricing-rates-without-code","level":3},{"title":"kind: TransportRegistry — the vendor registry the gateway enforces","href":"en/15-configuration.html#kind-transportregistry-the-vendor-registry-the-gateway-enforces","level":3}]},{"title":"3. The policy-value catalog","href":"en/15-configuration.html#3-the-policy-value-catalog","level":2},{"title":"4. Prompts","href":"en/15-configuration.html#4-prompts","level":2},{"title":"5. Seeding and hooks","href":"en/15-configuration.html#5-seeding-and-hooks","level":2}],"title":"Configuration reference — manifests, policy values, prompts"},"router":{"pathname":"en/15-configuration","depth":2,"base":"../"},"lang":"en","langs":["en"],"viewerInterface":{"toc-header":false,"toc":true,"search":true,"feedback":true,"gallery":true},"search":{"provider":"local","enabled":true,"api":"_search/api.js","link":"_search/en/index.html","tags":[]}}
